answer: |-
  The asymmetry you describe is stark: the scientific output (data, code, text) is treated as a public good subject to communal verification, while the ethical authorization (IRB approvals, risk-benefit analyses, deliberations) is treated as a private administrative record subject to confidentiality. To make this intelligible, we must reconstruct the implicit theory of research governance that underpins it.

  My committed position is this: The implicit theory is **"Epistemic-Regulatory Dualism."** This theory posits that scientific validity is an *epistemic* matter requiring public scrutiny, while ethical validity is a *regulatory* matter requiring only compliance verification. Under this view, ethical reasoning is not part of the knowledge-producing machinery of science but is rather a liability-management hurdle external to the epistemic core.

  I argue that while this dualism explains the current practice, it is **philosophically indefensible**. Ethical reasoning in human subjects research is methodological, not merely regulatory. Consequently, if we replaced this implicit theory with one that treats ethical reasoning as a public part of the scientific record, the practice of secrecy could not survive.

  ### 1. Reconstructing the Implicit Theory: Epistemic-Regulatory Dualism

  The current regime rests on a specific division of epistemic labor. It assumes two distinct spheres of evaluation:
  1.  **The Epistemic Sphere:** Concerned with truth, replicability, and generalizability. Here, transparency is the engine of quality control. The "public" is the scientific community, and the goal is cumulative knowledge.
  2.  **The Regulatory Sphere:** Concerned with rights, safety, and local compliance. Here, transparency is viewed as a risk (to privacy, to committee independence, to institutional liability). The "public" is effectively the state or the institution, and the goal is protection and permission.

  **What the practice strictly presupposes:**
  For this asymmetry to hold logically, the practice *strictly presupposes* that the **validity of the scientific findings is independent of the validity of the ethical justification.** It assumes that one can evaluate the truth of a claim (e.g., "Drug X reduces symptoms") without evaluating the moral cost of obtaining that data (e.g., "Was the placebo control justified given existing treatments?"). It presupposes that ethical review is a *licensing* function (a binary yes/no gate) rather than a *constitutive* function of the research design itself.

  **What the practice merely fits well with:**
  Several practical concerns align with this theory but are not strictly necessary for it:
  *   **Subject Privacy:** It fits well with the need to protect participant identity. However, reasoning *about* risk does not necessarily contain Personally Identifiable Information (PII).
  *   **Committee Protection:** It fits well with a desire to shield IRB members from harassment or politicization.
  *   **Bureaucratic Efficiency:** It fits well with treating ethics as a checklist rather than a deliberative process.
  These are pragmatic reinforcements, not theoretical necessities. One could have public ethical reasoning with redacted names, just as one has public data with redacted identifiers.

  ### 2. The Survival Test: Changing the Theory

  Suppose we replace Epistemic-Regulatory Dualism with a theory of **"Methodological Ethical Integration."** This theory holds that ethical constraints are parameters of the experimental design, just like sample size or statistical power. Ethical reasoning is therefore a form of expertise that benefits from post-hoc scrutiny, and the "relevant public" includes not just those who use the data, but those who are subject to the risks of data collection (society at large).

  **Would the practice survive?**
  No. The practice of keeping IRB deliberations and risk-benefit analyses private would collapse under this new theory.
  *   **Replicability of Judgment:** Just as code is opened to check for statistical errors, ethical reasoning would need to be opened to check for "moral errors" (e.g., underestimated risks, coerced consent models).
  *   **Cumulative Ethical Knowledge:** If ethics is expertise, hiding it prevents the field from learning. We cannot improve risk-benefit analysis standards if previous analyses are sealed.
  *   **Trust:** If the public is asked to bear the risk of research (as subjects or as a society exposed to externalities), the "social contract" of research requires visibility into how those risks were weighed.

  Under Methodological Ethical Integration, the "approval document" becomes akin to the "methods section." Hiding it would be as unacceptable as hiding the code. The practice would have to shift toward **Registered Ethics Reports**, where the justification for the study design is published alongside the pre-analysis plan.

  ### 3. Philosophical Defensibility

  Is the current practice defensible on the basis of Epistemic-Regulatory Dualism? **No.**

  The dualism fails because it relies on a false separation between *facts* and *values* in the context of research methodology. In human subjects research, the ethical constraints *shape* the data.
  *   **Selection Bias:** Ethical exclusions (e.g., excluding pregnant women) determine the generalizability of the data.
  *   **Measurement:** Ethical limits on intrusion determine the granularity of the data.
  *   **Validity:** If the consent process was flawed, the data may be ethically tainted, rendering the "knowledge" produced illegitimate regardless of its statistical significance.

  By sealing the ethical reasoning, the current system treats the moral cost of knowledge as an **externality**. It allows the scientific community to consume the "product" (the paper) without accounting for the "production costs" (the risk/harm to subjects). This creates a moral hazard where researchers are incentivized to minimize ethical friction in the private IRB process to maximize publication output in the public journal sphere.

  Furthermore, the assumption that ethical judgment is not a form of expertise benefiting from scrutiny is empirically false. Bioethics is a cumulative discipline. Secrecy prevents the identification of systemic biases in IRB decisions (e.g., disparate protection for different demographic groups).

  ### Conclusion

  The asymmetry between open science and closed ethics presupposes **Epistemic-Regulatory Dualism**: the belief that science produces public knowledge while ethics manages private liability. This theory strictly presupposes that ethical validity does not impact scientific validity.

  This position is philosophically untenable. Ethical reasoning is a methodological component of human subjects research. To hide the reasoning is to hide a critical variable of the study's design and validity. Therefore, the practice is **not defensible**.

  We should move toward a model where the **ethical architecture of a study is as citable, scrutinizable, and permanent as the dataset itself.** This does not mean exposing subject identities, but it does mean exposing the trade-offs authorized in their name. Transparency in science is incoherent if it applies only to the data and not to the moral license used to harvest it.
