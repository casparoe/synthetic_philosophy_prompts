      *   *Stronger Hypothesis:* The implicit theory is **"Epistemic Transparency for Verification, Administrative Opacity for Protection."** It treats science as a public good requiring scrutiny, but ethics as a regulatory hurdle involving private interests (subjects) and discretionary judgment not amenable to crowd-sourcing.
      *   *Even Stronger/More Precise Hypothesis:* The implicit theory relies on a **Division of Moral Labor**. It assumes ethical approval is a *licensing* function (gatekeeping), not a *knowledge-generating* function. Therefore, the output (approval) matters, not the reasoning. Science generates knowledge (data/papers), so the reasoning must be open.
      *   *My Committed Position:* The implicit theory is that **ethical review is a fiduciary and regulatory act, not an epistemic one.** It presupposes that ethical validity is determined by *process compliance* and *local context*, whereas scientific validity is determined by *universal scrutiny*.
