  6.  **Addressing the "Insulation" Point:**
      *   If a theory absorbs all counterexamples, is it unfalsifiable? Goodman's system is reflective equilibrium. It's designed to match intuition. If it matches *all* intuitions by redefining terms, it risks triviality.
      *   However, for induction, some insulation is expected (Hume's problem). The question is whether it offers *normative* guidance or just *description*.

  7.  **Final Review against User Constraints:**
