          *   Critique: This makes induction parochial. It severs the link between induction and truth/world-structure.
          *   Formal angle: Invariance under translation. If logic of confirmation depends on linguistic basis, it's not logic.

      *   *Objection 2: Circularity/Bootstrapping.*
          *   We judge past inductions "successful" based on whether their predictions came true.
          *   To judge if predictions came true, we need to observe the world.
          *   Observation relies on recognition of properties (green vs. grue).
          *   If *grue* were entrenched, we'd judge *grue*-inductions successful.
