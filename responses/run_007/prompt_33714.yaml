  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Formal Argument:* I need to cite Kevin Kelly or formal learning theory. The key is *efficiency* and *convergence*. If you project *grue*, you are committed to a change in the rule at time *t*. If you project *green*, you aren't. In learning theory, the hypothesis that requires fewer "mind changes" (retractions) in the face of data is epistemically superior. *Grue* forces a mind change at *t* if the object remains green. Wait, if it's grue, it turns blue. So if I project grue, I predict blue at *t*. If I project green, I predict green.
      *   *Correction:* The formal argument isn't just about *t*. It's about the *complexity* of the hypothesis. *Grue* contains a hidden time parameter. Formal learning theory (Kelly's "Ockham Efficiency Theorem") suggests we should prefer hypotheses that don't posit unobserved effects (like a color change) without necessity. Entrenchment doesn't capture *why* green is simpler.
