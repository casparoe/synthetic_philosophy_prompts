          *   If projectibility *just is* entrenchment, new science is impossible/irrational.
          *   Goodman has a reply (overhypotheses), but it's weak.
          *   Formal angle: Bayesian updating on new hypothesis spaces vs. fixed entrenched vocabulary.

      *   *Objection 4: Smuggling in Truth (The "Success" Criterion).*
          *   Why did *green* get entrenched? Because it worked.
          *   Why did it work? Because it carves nature at the joints.
