          *   Entrenchment doesn't guarantee convergence to truth if the world changes or if the entrenched vocabulary is "gerrymandered" relative to the causal structure.
          *   Specifically: *Grue* is not projectible because it requires a time-indexed switch. Formal learning theory shows that time-indexed predicates increase "mind-change" complexity without explanatory gain.

