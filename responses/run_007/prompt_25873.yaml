      *   **Section 1: The Flicker Strategy (Miriam's first point).** Explain that she identified a flaw in *early* Frankfurt cases, but Doug is right that modern versions patch this. Verdict: Draw/Miriam slightly behind on current literature.
      *   **Section 2: The Dilemma Defense (Miriam's big gun).** This is where Miriam shines. Explain the "Begging the Question" problem on the deterministic horn. Explain the "Indeterministic Prediction" problem on the other horn. Verdict: Miriam has the stronger logical case here.
      *   **Section 3: Doug's Actual Sequence.** Explain his underlying intuition (it's about *how* you acted, not what else you could have done). This is philosophically respectable but doesn't fully answer the Dilemma.
      *   **Section 4: What's Missing?**
          *   The *Purpose* of the case (dialectical efficacy vs. metaphysical truth).
          *   Source Incompatibilism (responsibility requires being the *source*, not just having options).
          *   The Biological Analogy (Homeostasis/Feedback loops).
      *   **Conclusion:** Summarize. Miriam won on logic/structure; Doug won on intuition/moral practice.

  6.  **Refining the Tone:**
