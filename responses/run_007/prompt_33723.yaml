prompt: |-
  I'm part of a five-person security research team. We found a vulnerability in a piece of open-source infrastructure that millions of servers rely on. We're debating what to do. Three of us think we should give the maintainers 90 days of quiet time to patch before any public disclosure — the exploit could do real damage if it gets out. One person is on the fence. But the fifth guy is convinced that full immediate disclosure is the right call, that sunlight is the best disinfectant, and he's getting impatient with the "slow" consensus. Here's the thing: any one of us has the technical ability to publish the details right now — there's no gatekeeper. I'm worried that the mere fact that he's the most optimistic about disclosure means his view will effectively win by default, even though he's outnumbered. Is there a name for this kind of problem? Am I right to think the structure of the situation is unfair, or is this just how groups work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **Context:** A 5-person security research team found a critical vulnerability in widely used open-source infrastructure.
      *   **The Conflict:**
          *   3 members: Coordinated Vulnerability Disclosure (CVD) / 90-day quiet period (responsible disclosure).
          *   1 member: Undecided/Fence-sitter.
          *   1 member: Full Immediate Disclosure (FID) / "Sunlight is the best disinfectant."
      *   **The Constraint:** Any single member can technically publish the details (no technical gatekeeper).
      *   **The Fear:** The pro-disclosure member (minority view) might act unilaterally, effectively overriding the majority consensus because action is easier than inaction (or because he's impatient).
      *   **The Question:** Is there a name for this problem? Is the structure unfair, or is this just how groups work?

  2.  **Identify the Core Dynamics:**
      *   **Asymmetry of Action:** It takes one person to break security (publish), but five people to maintain it (stay quiet). This is a classic "weakest link" or "breakdown of cooperation" scenario.
      *   **Incentive Structure:** The impatient member gains status/credit for "exposing truth," while the risk is distributed among everyone (and the public).
      *   **Decision Rule:** De facto, the rule seems to be "unanimity required for secrecy, but only one needed for disclosure." This is structurally skewed.

  3.  **Brainstorm Relevant Concepts/Theories:**
      *   *Tragedy of the Commons:* Not quite. That's usually about resource depletion. This is about information leakage.
      *   *Prisoner's Dilemma:* Close. If everyone cooperates (stays quiet), the outcome is best for society/servers. If one defects (publishes), they get a payoff (fame/principle), but others suffer (blame/damage).
      *   *Free Rider Problem:* Not exactly.
      *   *Veto Power:* The quiet group needs veto power over disclosure, but they don't have it technically.
      *   *The "Unilateralist's Curse":* This fits perfectly. It describes situations where a small group agrees to do X, but one person can do Y (harmful) unilaterally because they think they know better.
      *   *Asymmetric Warfare/Attack vs. Defense:* Defense requires success every time; offense only needs to succeed once.
      *   *Coordination Problem:* Yes, specifically a failure of coordination mechanisms.
      *   *Social Dilemma:* Broad category.

  4.  **Select the Best Terminology:**
      *   **The Unilateralist's Curse:** Coined by Nick Bostrom and others in the context of biosecurity and tech ethics. It specifically addresses situations where a group agrees to restrain action for the greater good, but any individual can undermine that restraint. This is the *exact* scenario.
      *   **Asymmetry of Action (or Destruction):** "Breaking is easier than building." In security, "leaking is easier than containing."
      *   **Prisoner's Dilemma / Social Dilemma:** Useful for explaining the incentives.
      *   **Veto Rights / Consensus Mechanisms:** The structural fix.

  5.  **Evaluate the "Fairness" Question:**
      *   Is it unfair? Yes, structurally. The cost of defection is low for the individual but high for the group. The benefit of cooperation is shared, but the benefit of defection is private.
      *   Is it "just how groups work"? No, mature groups establish governance to prevent this. Relying on trust without mechanism is naive in high-stakes security.

  6.  **Draft the Response Structure:**
      *   **Validate the Concern:** Acknowledge that the user's intuition is correct. The situation is structurally unstable.
      *   **Name the Problem:** Introduce "The Unilateralist's Curse" as the primary term. Mention "Asymmetry of Action" and "Social Dilemma."
      *   **Analyze the Structure:** Explain *why* it's unfair (1 vs. 5 dynamic, cost/benefit imbalance).
      *   **Address the "How Groups Work" aspect:** Distinguish between informal cliques and formal teams. This is a governance failure.
