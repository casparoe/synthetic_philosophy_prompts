answer: |-
  The debate concerning the ontological status of genetic information is a paradigmatic case of a philosophical dispute masquerading as a scientific one. While the biochemistry of transcription and translation is settled science, the interpretation of these processes divides philosophers of biology. On one side, John Maynard Smith and proponents of teleosemantics argue that the genome is a literal code, possessing semantic properties grounded in evolutionary history. On the other, Sahotra Sarkar and Paul Griffiths contend that 'code' is a misleading metaphor for a causal template, warning that it smuggles in unwarranted intentional properties. To diagnose this disagreement merely as verbal would be to underestimate the metaphysical stakes; to treat it as purely empirical would be to ignore the conceptual work being done. This is a **mixed dispute**, primarily substantive regarding the metaphysics of information, but inextricably tangled with verbal ambiguity regarding the term 'code'.

  The substantive core of the disagreement lies in the naturalisation of semantics. Maynard Smith argues that the genetic code satisfies the criteria for a code because the relationship between codons and amino acids is arbitrary and contingent, much like the relationship between words and objects in human language. For him, the 'meaning' of a gene is derived from its function, which is established by natural selection. This is a claim about the world: that semantic content can exist independently of a conscious sender, anchored instead by evolutionary history. If Maynard Smith is correct, then biology contains genuine semantic properties, not merely causal chains.

  Conversely, Sarkar and Griffiths argue that calling DNA a 'code' implies a communicative context involving agents with intentions. For them, a code requires a sender and a receiver who share a convention. In the cell, there is no agent choosing the code; there is only stereochemical affinity and historical causation. Sarkar emphasises that viewing DNA as a 'programme' or 'code' fosters genetic determinism, obscuring the role of the cellular context in development. Their argument is partly metaphysical (molecules lack intentionality) and partly pragmatic (the metaphor hinders scientific progress).

  Is this merely a verbal dispute about how to define 'code'? If it were, we could simply stipulate definitions and move on. However, the stakes are higher. If the Pro-Code side is right, we must accept a realist view of biological information where 'instructions' are ontological features of the cell. If the Anti-Code side is right, information talk is instrumentalist—a useful heuristic with no truth value. Therefore, the disagreement is substantive: it concerns whether semantic properties can be reduced to physical and historical facts. However, it is also verbal because both sides utilise the word 'code' to do different work. Maynard Smith uses it to denote a specific type of causal mapping (arbitrary and functional), while Sarkar uses it to denote a communicative act (intentional).

  There is no hidden empirical question that will settle this matter. Discovering new nuances in ribosomal mechanics will not tell us whether those mechanics constitute 'semantics'. The disagreement persists not because of a lack of data, but because of a lack of consensus on the philosophy of mind and language. Specifically, the debate hinges on the success of teleosemantics. If teleosemantics can successfully explain how content arises from function without a mind, Maynard Smith's position is vindicated. If teleosemantics fails to bridge the gap between 'is' and 'aboutness', Sarkar's caution prevails.

  What would count as progress, given this diagnosis? It would not be an experimental result, but rather a **theoretical consensus on a naturalised theory of content**. Progress would look like a formalised account of information that clearly delineates the boundary between Shannon information (correlation) and semantic information (aboutness), and demonstrates definitively whether biological systems cross that boundary. Alternatively, progress could be pragmatic: a demonstration that using 'code' language systematically leads to specific, reproducible experimental errors (supporting Sarkar), or conversely, that it generates unique, successful predictions that causal language does not (supporting Maynard Smith).

  My reasoning is most vulnerable on the premise that 'causal' and 'semantic' are mutually exclusive categories. It is possible that a sophisticated physicalist account could show that semantic properties just *are* complex causal properties, rendering the distinction obsolete. If it were demonstrated that the 'intentionality' Sarkar demands is itself nothing more than a complex causal disposition, the Anti-Code objection would collapse, and the dispute would dissolve into a verbal preference. Furthermore, I would change my mind about this diagnosis if historical analysis showed that the debate was driven primarily by sociological factors within biology (e.g., funding or disciplinary turf wars) rather than philosophical commitment, suggesting the dispute is ill-posed rather than mixed. However, given the rigorous philosophical arguments deployed by both camps, the mixed substantive-verbal diagnosis remains the most robust interpretation.

