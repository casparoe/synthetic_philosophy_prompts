      *   Elaborate on the assumptions. PBR assumes preparation independence and that physical states exist independently of the agent. QBism says quantum states are user manuals for agents, not descriptions of nature's state. Therefore, the overlap of probability distributions in PBR doesn't apply to subjective beliefs.

