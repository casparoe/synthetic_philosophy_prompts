prompt: |-
  I'm a systems programmer — embedded C, RTOS, logging and telemetry, not academic CS. I've been trying to get my head around epiphenomenalism, specifically the thing people call the paradox of phenomenal judgment, and I keep reaching for the only vocabulary I've got. Here's the position as I understand it: phenomenal consciousness (the redness of red, what-it's-likeness) is caused by brain processes but has no causal effects of its own — it's pure output, nothing downstream reads it. But we also make phenomenal judgments: we say and believe things like that I'm seeing red, or that there's something it's like to be me. Those judgments are themselves physical events with physical causes. The paradox is that if the red-experience doesn't cause the judgment that I'm seeing red, then it's a wild coincidence that our judgments track our experiences at all — and worse, we couldn't know about our experiences.

  Restate this whole setup in my vocabulary: a process, its control flow, stdout or a debug log that nothing reads, a telemetry path that emits the self-report, the instruction pointer, shared upstream state, and so on. Be systematic: map the components one by one — qualia, the neural causes, the judgments, the knowledge of experience. Then give me the residue report: which parts translate cleanly, which you had to fudge to fit, and which have no expression in this vocabulary at all. I want to know specifically whether the stuff that doesn't survive is a limitation of the software vocabulary or a sign that the epiphenomenalist story is less coherent then it sounds. Don't give me an analogy — I want the translation as literal as you can make it, and I want you to flag every place you had to smuggle in an assumption to make the mapping work.

  Hard limit: 1,000 words.
