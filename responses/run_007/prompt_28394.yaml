answer: |-
  **System Architecture Definition**
  We define the mind as a bare-metal embedded system running a single control loop. Memory is partitioned into **State RAM** (physical brain states) and **Telemetry Buffer** (phenomenal consciousness). The CPU executes instructions based on State RAM. The Telemetry Buffer is memory-mapped but hardware-enforced as **write-only** from the perspective of the control flow. It generates no interrupts, sets no flags, and is never polled by the main loop.

  **Component Mapping**

  1.  **Neural Causes (Physical State):** The values in State RAM and the instruction pointer position. These determine all control flow branches and register modifications.
  2.  **Qualia (Phenomenal Experience):** A value written to the Telemetry Buffer. Example: `TELEMETRY_BUF = 0x01` (RED). This write occurs concurrently with State RAM updates via a side-channel bus.
  3.  **Judgments (Verbal Report):** A function `uart_send()` that transmits bytes over a physical serial line. This function is called by the main control loop.
  4.  **Knowledge of Experience:** The semantic content of the UART transmission matching the value in the Telemetry Buffer.

  **The Paradox: Control Flow Analysis**
  Under epiphenomenalism, the causal chain for the Judgment is:
  `Sensor Input -> State RAM Update -> Control Flow Branch -> uart_send("I see RED")`

  The causal chain for the Qualia is:
  `Sensor Input -> Telemetry Buffer Write (0x01)`

  **Constraint:** There is no data path from `Telemetry Buffer` to `State RAM` or `uart_send()`. The buffer is write-only.

  **The Fault:** The system transmits "I see RED" because `State RAM` indicates red-wavelength detection. It does *not* transmit this because it read `0x01` from the Telemetry Buffer. Yet, the system asserts it is reporting the Telemetry Buffer's content.

  In systems terms, the code claims to be logging a register it cannot read. If you decouple the telemetry output from the control logic that generates the report, the correlation between the Telemetry Buffer content and the UART output becomes a magic number coincidence. Every time `TELEMETRY_BUF` holds `0x01`, the UART *happens* to send "RED", despite no `READ` instruction ever accessing that address.

  **Residue Report**

  **1. Clean Translations**
  *   **Causal Closure of the Physical:** Maps perfectly to deterministic control flow. All outputs (GPIO, UART) are functions of State RAM and instructions.
  *   **Epiphenomenal Constraint:** Maps cleanly to a write-only memory region or a debug trace port that the CPU cannot read back.
  *   **Judgment as Physical Event:** Maps to UART interrupts or DMA transfers. These are physical signals with physical causes.

  **2. Smuggled Assumptions (Fudged Mappings)**
  *   **Qualia as Data:** I assumed qualia can be represented as a bit pattern (`0x01`). This assumes consciousness is informational. *Flag:* This smuggles in representationalism. If qualia are not data structures, the write-only buffer model fails immediately.
  *   **Causation as Data Flow:** I assumed causal influence requires a read/access operation. *Flag:* This assumes no non-local or non-computational causation exists.
  *   **Judgment Content:** I assumed the UART string "I see RED" constitutes a "judgment." *Flag:* This equates syntax (bytes sent) with semantics (meaning/belief).

  **3. No Expression in Vocabulary (The Missing Residue)**
  *   **The "Light" of Consciousness:** The Telemetry Buffer is just electrons in a cell. It does not *glow*. The vocabulary captures the structure of the report, but not the existence of the thing reported. The system models the *claim* of experience, not the experience itself.
  *   **Subjectivity:** There is no "viewer" of the Telemetry Buffer. In the philosophical model, the qualia *is* the viewing. In the systems model, the buffer is just storage. The vocabulary lacks a primitive for "being the data" versus "holding the data."

  **Coherence Analysis**
  Does the residue indicate a vocabulary limitation or a philosophical bug?

  If this were purely a vocabulary limit, we would expect to find a systems concept that *could* hold the missing residue but wasn't used. There isn't one. Embedded systems are defined by causal closure; if a register affects nothing, it is functionally non-existent.

  The paradox survives translation because the epiphenomenalist story violates the **Principle of Least Astonishment** in system design. A system that reports on a state it cannot access is buggy. In C, if you print a variable you didn't read, you are lying or guessing.

  Therefore, the failure is not just linguistic. The epiphenomenal story requires a system where output tracks a state without reading it. In software, this is impossible without pre-established harmony (hardcoded correlation). If the mapping holds, the epiphenomenalist position implies the brain is hardwired to lie about its own architecture, claiming read-access to write-only memory.

  The vocabulary exposes the coherence gap: Epiphenomenalism requires a causal link (knowledge) where the architecture explicitly forbids one. The systems model doesn't just fail to describe it; it compiles it as a logic error.
