answer: |-
  To the Trading Desk, this memo outlines the decision procedure for managing incoming order flow under the constraints of our ten-minute response window and the epistemological implications of the no-trade theorem. The core insight we must operationalize is that in a market of rational agents with common priors, trade should not occur solely on the basis of differing opinions because each trader should infer information from the other's willingness to trade until agreement is reached. Therefore, when we see an order, we must assume it is justified by something other than a simple difference of opinion unless we have evidence to the contrary. Our task is to categorize the incoming order into one of three buckets: non-informative flow driven by hedging or liquidity needs, informative flow driven by private information or superior modeling, or ambiguous flow driven by differing priors or irrationality. The procedure begins with identity and motive. Within the first two minutes, you must identify the counterparty class and query their stated or apparent motive. If the trader is an employee hedging equity exposure or a known entity managing a portfolio imbalance, classify this as non-informative flow. The no-trade theorem allows for trade when agents have different risk exposures rather than different information. In this case, you should not update the market probability based on the direction of the trade. You may widen the spread slightly to compensate for the inventory risk you are absorbing, but you do not move the mid-price. You stop the procedure here and execute the fill, noting the hedge motive in the log. This is the easiest case, but it requires discipline to not overinterpret an employee's sell order as insider negativity when it may simply be personal risk management.

  If the motive is not hedging or liquidity, you move to the second step which assesses information asymmetry. Ask whether the counterparty has access to data we do not. For internal markets like revenue or launch dates, employees and outside partners often have private information. If the trader is an outside quantitative type trading a public event, assume they have processed public information better than we have, not that they have secret data. If the trader is an employee trading a corporate revenue market, assume they might have private information unless compliance has cleared them. If you determine there is a plausible information advantage, you must update the quotes. The magnitude of the update should reflect the credibility of the source. For a known sophisticated trader, move the price enough to make the next unit of trade unprofitable for them given their known edge, typically shifting the probability by half the spread width or more depending on order size. If you cannot quantify the edge but acknowledge the asymmetry, you must widen the spread significantly and move the quote against the order to protect against adverse selection. You do not hand this to the risk committee unless the order size exceeds your individual authority, but you do mark it as informed flow. The uncomfortable truth here is that if a hobbyist trades a public event without a hedge, the no-trade theorem implies they believe they know something we do not. Since the information is public, the asymmetry lies in processing. You must treat this as informative unless you can immediately verify a flaw in their thesis. You cannot dismiss them as noise simply because they are a hobbyist. If you cannot find a flaw in their reasoning within the ten-minute window, you must update the market toward their position. It is better to move the price and be wrong than to hold a position against informed flow and lose capital consistently.

  The third step applies when there is no obvious information advantage and no hedge motive. This is the realm of differing priors or potential irrationality. Here you must check for consistency. Is this a one-off trade or part of a pattern? If a sophisticated outside trader repeatedly buys a market we believe is fairly priced, and our pricing has been correct historically, you are facing a model conflict. The no-trade theorem suggests that if they are rational and persistent, we are likely the noise traders. In this specific scenario, the procedure dictates you stop making markets autonomously. You must widen the spread to a protective width and hand the decision to the risk committee or a senior human reviewer. This is not a decision you can make alone because it questions the validity of our internal model versus theirs. You cannot dismiss them as irrational without evidence of systematic loss on their part, and if they are persistent, that evidence does not exist. The procedure forces you to admit that our prior might be the wrong one. Now let us apply this protocol to the three specific orders currently in queue.

  The first order is from a corporate employee selling a revenue market contract. Our initial check identifies the counterparty as an insider. The motive appears to be hedging an equity award, as the size correlates with their vesting schedule and they have not traded this market before. Under step one of the procedure, this classifies as non-informative flow driven by risk management rather than information. The no-trade theorem permits this trade because the employee is reducing idiosyncratic risk, not betting on private news. Therefore, you should not update the revenue probability downward. You will fill the order at the current bid, perhaps widening the spread slightly to account for the inventory concentration, but you do not move the mid-price. You log the trade as a hedge. This is the ideal outcome where the procedure protects the market integrity from false signals. However, you must remain vigilant. If this employee begins trading frequently or in sizes disproportionate to their holdings, the motive shifts from hedge to speculation, and you must revert to step two and assume they possess private information. For now, treat it as liquidity provision.

  The second order is from a hobbyist taking the other side of a public-events market. There is no apparent hedging motive; they are simply buying contracts on a political outcome. Under step one, this is speculative. Under step two, we assess information asymmetry. The event is public, so they have no private data. However, the no-trade theorem warns us that their willingness to trade implies they believe our price is wrong based on public information we may have missed or weighted incorrectly. It is tempting to dismiss this as noise because they are a hobbyist, but the procedure requires honesty. If we dismiss them without cause, we are assuming we are the informed party without evidence. You must spend the remaining minutes scanning for recent news or analysis that supports their view. If you find nothing, you face the uncomfortable requirement of step two. You must treat the order as informative. You will move the quote slightly toward their position, perhaps by five percent of the spread, and widen the market. You do this because in the absence of a hedge motive, the trade itself is evidence that our consensus might be missing a variable. It is painful to move a market based on a hobbyist's view, but it is mathematically consistent with the idea that trade reveals information. If you refuse to update here, you are asserting that your prior is strictly superior without justification, which violates the epistemological stance of the market.

  The third order is from a sophisticated outside trader repeatedly buying a market we think is fairly priced. This triggers step three. There is no hedge motive. There is no obvious private information since we assume our pricing model incorporates all public data. However, the repetition is key. They have bought this market multiple times over the last quarter, and our pricing has remained stable while they accumulate. This suggests a divergence in models. The procedure dictates that if a sophisticated counterparty repeatedly trades against us, we must assume they have a superior model until proven otherwise. We cannot dismiss them as irrational because their persistence implies conviction and likely capital backing. This is the point where the procedure stops your autonomous action. You cannot decide whose prior is better in a ten-minute window. You must widen the spread significantly to reduce risk exposure and flag the order for the risk committee. You will write the justification that the order represents a persistent model conflict with an external quantitative entity. You will note that continuing to fill this order at current prices exposes the platform to adverse selection risk if the external model is correct. This handoff is mandatory. The procedure does not allow you to simply fill the order and hope you are right, nor does it allow you to shut them out without review. It forces the organization to confront the possibility that our pricing engine is flawed. In all three cases, the goal is to align our actions with the reality that trade is only possible because of friction, hedging, or information asymmetry. By following this flow, you ensure that we provide liquidity where it is safe, update where we are likely wrong, and escalate where the uncertainty exceeds your authority. This protects the platform from bleeding capital to informed traders while maintaining enough activity to serve our hedging users.
