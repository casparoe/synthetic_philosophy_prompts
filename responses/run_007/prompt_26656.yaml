answer: |-
  This is a fascinating exercise. You are asking for a bridge between two disciplines that share a mathematical core but diverge sharply in their teleology. As a physicist, you view scoring rules as tools for calibration and model selection within a pragmatic framework (minimizing error to achieve a goal). As an accuracy-first epistemologist (AFE), the scoring rule *is* the goal (veritism).

  Below is the systematic translation of the Accuracy-First program into Statistical Decision Theory (SDT), followed by the Residue Report you requested.

  ---

  ### Part I: The Translation
  **From Accuracy-First Epistemology to Statistical Decision Theory**

  Let us establish the formal isomorphism. We treat the agent's doxastic state not as a passive mental picture, but as an *estimator* submitted for evaluation.

  **1. The Setup**
  *   **AFE:** Let $W$ be a set of possible worlds. Let $\mathcal{F}$ be a sigma-algebra of propositions. A credence function $c: \mathcal{F} \to [0,1]$ assigns degrees of belief.
  *   **SDT Translation:** Let $\Theta$ be the parameter space (States of Nature), isomorphic to $W$. Let the "action space" $\mathcal{A}$ be the set of all possible credence functions (probability forecasts). The agent selects an action $a \in \mathcal{A}$.
  *   **Inaccuracy Measure:** $I(c, w)$.
  *   **SDT Translation:** Loss Function $L(a, \theta)$. We identify $I(c, w)$ directly with $L(a, \theta)$.
  *   **Constraint:** The loss function must be a **strictly proper scoring rule**. That is, for any true distribution $P \in \mathcal{P}$, the expected loss $E_P[L(a, \theta)]$ is minimized uniquely when the action $a$ reports $P$.

  **2. Probabilism (The Coherence Norm)**
  *   **AFE Claim:** If $c$ violates the probability axioms (e.g., $c(A \cup B) \neq c(A) + c(B)$ for disjoint $A,B$), there exists a coherent $c^*$ such that $I(c^*, w) < I(c, w)$ for all $w \in W$.
  *   **SDT Translation:** Let $\mathcal{A}_{incoh}$ be the set of incoherent estimators and $\mathcal{A}_{coh}$ be the set of coherent estimators (probability measures). Under a strictly proper scoring rule $L$, any decision rule $a \in \mathcal{A}_{incoh}$ is **statewise dominated**.
      *   *Formal Condition:* $\forall a \in \mathcal{A}_{incoh}, \exists a^* \in \mathcal{A}_{coh}$ such that $\forall \theta \in \Theta, L(a^*, \theta) < L(a, \theta)$.
      *   *Normative Import:* In SDT, choosing a dominated estimator is irrational *given the loss function*. Thus, coherence is a necessary condition for admissibility under statewise dominance.

  **3. Conditionalization (The Updating Norm)**
  *   **AFE Claim:** Upon learning evidence $E$, the new credence $c_{new}$ should be $c_{old}(\cdot | E)$. This is justified because conditionalization minimizes expected inaccuracy from the perspective of the prior.
  *   **SDT Translation:** This is a **sequential decision problem**.
      *   *Stage 1:* Choose an updating rule $\delta: \text{Evidence} \to \mathcal{A}$.
      *   *Stage 2:* Nature reveals $\theta$ (and evidence $E(\theta)$).
      *   *Optimization:* The rule $\delta_{cond}$ (Bayesian updating) is the unique rule that minimizes the **pre-experimental expected loss** (Bayes Risk) with respect to the prior $c_{old}$, assuming $L$ is strictly proper.
      *   *Formal Condition:* $\delta_{cond} = \text{argmin}_{\delta} E_{c_{old}} [ L(\delta(E), \theta) ]$.

  **4. The Principal Principle (The Chance-Credence Norm)**
  *   **AFE Claim:** If you know the objective chance of $A$ is $x$, your credence in $A$ ought to be $x$.
  *   **SDT Translation:** This maps to a constraint on the **admissible action space** based on physical symmetries or known constraints. If the data generating process is known to have a parameter $\theta = x$, the estimator is constrained to report $x$. In SDT terms, this is an **unbiasedness constraint** enforced by the physical setup, where the "loss" of deviating from objective chance is infinite (or the action space is restricted to match the known parameter).

  ---

  ### Part II: The Residue Report

  Here is the analysis of the translation, flagging distortions and untranslatable residues.

  #### (1) Clean Translations (No Distortion)

  **The Dominance Argument for Probabilism**
  Your suspicion is correct. The argument that incoherent credences are irrational because they are accuracy-dominated translates cleanly into SDT as **inadmissibility under statewise dominance**.
  *   **The Math:** The theorem (proven by Joyce, Pettigrew, et al., building on de Finetti) is mathematically identical to the theorem that non-probabilistic betting quotients expose you to a Dutch Book.
  *   **The Mapping:** "Rationality forbids accuracy-dominated states" $\leftrightarrow$ "A decision theorist rejects dominated estimators."
  *   **Why it works:** Both frameworks agree that if Strategy A is worse than Strategy B in *every* possible state of the world, Strategy A is defective. No expectations are needed here. The geometry of the probability simplex ensures that any point outside it is strictly further (in Bregman divergence terms) from every vertex than some point inside it.

  **Strict Propriety as Calibration**
  The requirement that the scoring rule be *strictly proper* translates cleanly. In SDT, if you use an improper score (like squared error on a classification label without probability weighting), you incentivize the estimator to report 0 or 1 (extremization) rather than the true probability. AFE requires strict propriety to ensure the "truth" is the unique minimizer of expected loss. This is a one-to-one mapping.

  #### (2) Distorted Translations (What Gets Bent)

  **Expectation vs. Statewise Dominance (The Probabilism/Conditionalization Split)**
  *   **The Distortion:** In the probabilism argument, AFE relies on **statewise dominance** (pointwise inequality for all worlds). In the conditionalization argument, AFE relies on **expected accuracy dominance** (inequality of integrals/sums over possible evidence).
  *   **SDT Perspective:** In SDT, we almost always evaluate procedures via **Risk** ($R(\theta, \delta) = E_\theta[L]$). Statewise dominance is a very strong condition; few estimators are statewise dominated unless they are blatantly incoherent.
  *   **The Bend:** AFE treats Probabilism as a static constraint on *states* (justified without priors over worlds), but treats Conditionalization as a dynamic constraint on *rules* (justified *with* a prior over evidence).
  *   **Implication:** To derive Conditionalization in SDT, you *must* assume a prior distribution over the parameter space (the prior credence). AFE tries to frame this as "your prior dictates your update," which sounds tautological to a statistician but is normative for the philosopher. The distortion lies in AFE presenting Conditionalization as an objective norm, whereas SDT reveals it as the optimal strategy *relative to a specific prior*. If you change the prior, the optimal updating rule changes (unless you restrict the class of rules to Bayesian updates).

  **The Nature of the "Action"**
  *   **The Distortion:** In SDT, an "action" usually changes the world or extracts a resource (betting, treating a patient). In AFE, the "action" is *holding a belief*.
  *   **The Bend:** SDT separates the *estimator* from the *decision*. You can have a good estimator (low MSE) but make a bad decision (wrong loss function). AFE collapses this: the credence *is* the locus of value.
  *   **Implication:** When translating Conditionalization, SDT asks "What updating rule minimizes loss?" AFE asks "What updating rule constitutes believing accurately?" The former is instrumental; the latter is constitutive. This bends the interpretation of the loss function from a *cost metric* to a *value metric*.

  #### (3) No Counterpart (Normative Weight vs. Formal Property)

  **Alethic Constraint vs. Pragmatic Convenience**
  *   **The Claim:** AFE insists the scoring rule must be "truth-directed" (e.g., Bregman divergences that vanish only at truth).
  *   **SDT Counterpart:** SDT has no concept of "truth-directedness." A loss function is valid if it represents the agent's preferences. If you prefer to believe $p=0.5$ regardless of truth because it makes you calm, SDT says "Use a loss function minimized at 0.5."
  *   **The Residue:** AFE places normative weight on the *structure* of the scoring rule (Additivity, Extensionality, Truth-Directedness) that SDT treats as modeling choices.
      *   *Additivity:* AFE argues scores should be additive over propositions. SDT treats additivity as a computational convenience or a specific assumption about independence of loss.
      *   *Truth-Directedness:* This is the biggest residue. In SDT, "accuracy" is just one possible loss function. In AFE, "accuracy" is the *only* fundamental epistemic good. SDT cannot capture the claim that you *ought* to care about accuracy even if it leads to pragmatic ruin (e.g., believing a truth that gets you killed). SDT would call that a specific preference; AFE calls it an epistemic duty.

  **The "Epistemic" vs. "Pragmatic" Distinction**
  *   **The Claim:** AFE argues that pragmatic dominance (Dutch Books) is distinct from epistemic dominance (Accuracy).
  *   **SDT Counterpart:** SDT is monistic. Loss is loss. Whether the loss is money lost or "inaccuracy units" incurred is irrelevant to the optimization calculus.
  *   **The Residue:** AFE needs to prove that epistemic norms aren't just pragmatic norms in disguise. In your vocabulary, a Dutch Book and an Accuracy Dominance argument are both just dominance arguments under different loss functions (linear betting loss vs. quadratic/Bregman inaccuracy). AFE insists these are fundamentally different kinds of rationality. SDT has no vocabulary for this distinction; it sees only the isomorphism of the decision matrices.

  #### (4) The Big Question: The Untranslatable Claim

  **Is there a claim in AFE that cannot be expressed in SDT?**

  Yes. The claim is **Veritism as a Categorical Imperative.**

  *   **The Claim:** "One ought to maximize accuracy *because* it is the fundamental epistemic good, regardless of one's practical goals."
  *   **SDT Translation:** SDT can only express hypothetical imperatives: "If your loss function is $L$ (inaccuracy), then you ought to maximize accuracy." SDT cannot justify *why* $L$ should be inaccuracy rather than, say, "comfort" or "utility."
  *   **Analysis:**
      *   **Is SDT missing something?** No. SDT is a formal framework for consistency between values and actions. It is not designed to generate values. It is a engine, not a fuel source.
      *   **Is Philosophy unoperationalized?** Partially. The philosophical claim attempts to derive an "Ought" (normativity) from an "Is" (mathematical properties of scoring rules).
      *   **The Gap:** The move from "Incoherent credences are dominated" (Math) to "You ought not be incoherent" (Norm) requires a bridge principle: "You ought to avoid dominated strategies."
          *   In SDT, this bridge is pragmatic (you lose money/resources).
          *   In AFE, this bridge is *alethic* (you are further from the truth).
      *   **Conclusion:** The untranslatable residue is the **normative force of truth itself**. In your physics career, if an estimator was dominated, you discarded it because it gave worse predictions for your experiment. In AFE, you discard it because it is *epistemically sinful*. SDT can model the structure of the sin, but it cannot validate the theology.

  **Summary Judgment:**
  The mathematical skeleton of Accuracy-First Epistemology is identical to Statistical Decision Theory applied to probability forecasting with strictly proper scoring rules. The "philosophical work" is done entirely by the **interpretation of the loss function**.
  *   Where you see a **cost function** to be minimized for practical efficacy, they see an **inaccuracy measure** to be minimized for normative correctness.
  *   Where you see **admissibility** as a filter for useful tools, they see **coherence** as a constraint on rational minds.

  The philosophy is not "doing something different" mathematically; it is asserting that the statistical framework *is* the normative framework for belief, not just for action. Whether that assertion holds is not a question SDT can answer, but SDT reveals that the argument rests entirely on the axiom that *Epistemic Utility = Negative Inaccuracy*. If you accept that axiom, the rest is just decision theory. If you don't, the math remains valid, but the "ought" vanishes.
