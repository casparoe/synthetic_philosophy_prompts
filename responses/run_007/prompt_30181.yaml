      *   *Is the infinity model standard?* No, it's a caricature often used by critics. Proponents usually use weighted calculus.
      *   *Make sure to mention "S-risk".* This is where NU is most active today (Effective Altruism context).

  7.  **Final Polish:** (Reviewing against the user's specific worry about "degrees of suffering".)
