  I'm a journalist who covers science and ideas, and I'm working on a piece about whether "post-truth" talk is actually tracking a real change in how people use the word "true." While reading around, I came across a book that summarizes deflationism about truth, and I wrote the summary down because I wanted to lean on it. But I'm not sure weather I can trust it, and I'd rather not embarrass myself in print. Here's the summary as I recorded it:

  "Deflationists deny that truth is a substantial property, the kind of thing a correspondence theorist thinks sentences have when they match up with reality. For a deflationist, saying that 'grass is green' is true is just a roundabout way of saying that grass is green; the word 'true' adds no content to the claim. The entire function of the truth predicate is given by the T-schema: for any sentence S, 'S' is true if and only if S. Since the predicate does no independent work, deflationists think it could in principle be eliminated from the language without any loss, and that there is no property of truth at all — just a convenient bit of grammar. That is what separates deflationism from correspondence theories, which have to reject the biconditional, because if it held trivially there would be nothing left for a correspondence relation to explain."

  I've always assumed deflationism just was the view that "true" is redundant, so the first half sounds right to me, but the stuff about correspondence theories having to reject the biconditional set off a small alarm. Go through the summary and tell me which parts a careful deflationist would accept, which parts are a popularizer's overstatement or a conflation of distinct views, and whether the corrected version still supports the line I'm tempted to take in my piece — that deflationism shows truth talk is basically disposable. Also, since I need to be careful about what I assert in print: tell me how confident you are in each of your main claims, and flag the single point you're least sure about. American English please.
