answer: |-
  The causal decision theorist began by laying out the matrix on the table of their mind, insisting that the physical separation was the only thing that mattered. You have to look at the causal structure, they said. My hand moving to press cooperate does not send a signal to your room. It does not push any particles in your direction. The state of your decision is already fixed or independent of my physical act. So I face two possibilities: either you are cooperating or you are defecting. If you are cooperating, I get the temptation payoff by defecting, which is better than the reward for mutual cooperation. If you are defecting, I get the punishment by defecting, which is better than the sucker's payoff for cooperating. In both cases, defecting yields a higher utility. This is the dominance principle, and it holds regardless of what I think about your rationality.

  The superrationalist responded not by denying the physics but by questioning the relevance of physical causality to logical necessity. You are treating us as two distinct physical entities when the problem stipulates we are two instances of perfect rationality facing the same data. If we are both perfectly rational, we are effectively running the same algorithm. When you run a calculation, you do not expect a different calculator in another room to produce a different result for the same input. If I conclude that cooperation is the rational choice, then you, being identical in rationality and situation, must also conclude that cooperation is the rational choice. My decision does not causally influence yours, but it is logically correlated with it. I am not choosing between cooperate and defect while holding your action fixed. I am choosing between a world where we both cooperate and a world where we both defect, because those are the only logically consistent outcomes for identical agents.

  The causal decision theorist pushed back hard on the idea that logical correlation grants causal power. You are conflating prediction with control. Just because you can predict with certainty what I will do does not mean your choice causes it. Imagine I have already written my choice on a piece of paper and sealed it in an envelope. You are still here deciding. Does your reasoning change what is inside my envelope? No. The content of that envelope is a fact of the world now. Your decision theory should respond to the facts, not try to magically rewrite them through logical sympathy. If I have already decided to defect, your cooperation only ensures you get the sucker's payoff. You are sacrificing real utility for a feeling of logical consistency that pays no dividends.

  The superrationalist countered that the envelope metaphor was misleading because the decision had not been made yet, and the method of making it was the shared variable. The envelope exists only after the reasoning is complete. We are both in the process of reasoning right now. If your reasoning process leads you to defect, then my reasoning process, being identical, must also lead to defect. You cannot say I should defect because you will defect, because whether you will defect depends on what you think is rational. If you think defection is rational, I will think defection is rational, and we will both defect. If I can convince you, or rather if I can realize myself, that cooperation is the rational output of this algorithm, then you will realize it too. We are not observing independent events; we are computing the same function. To defect is to vote for a function that outputs defect, which means you get the defect-defect payoff.

  The causal decision theorist argued that this view required a kind of magical thinking about the boundaries of the self. Even if we are running the same algorithm, my instance of the algorithm is physically distinct from yours. My voltage spikes do not travel to your brain. Decision theory is about guiding action in the physical world, and in the physical world, my action has no lever on yours. If I cooperate, I incur a cost. The benefit of your cooperation is a separate event. You are asking me to pay a cost to increase the probability of an event that is already determined by your own reasoning, not my action. It is like voting in an election where the result is already decided by people exactly like you. Your vote doesn't change the outcome, it just records it. Why pay the cost of voting if the outcome is fixed by the type of agent you are?

  The superrationalist replied that the voting analogy failed because the outcome was not fixed by the type of agent alone, but by the reasoning process itself which was ongoing. The result is not fixed until we think it through. By engaging in this reasoning, I am not recording a pre-existing fact; I am determining the fact. If I determine that cooperation is the rational path, I am setting the value for all instances of this rationality. You say my action has no lever on yours, but my reasoning is the lever. We are not two people voting; we are one mind instantiated twice. If I cut my own hand, you do not feel pain, but if I decide to cut my hand based on a logical error, you will also decide to cut your hand based on the same error. Rationality is not just about maximizing utility given fixed constraints; it is about selecting the best constraint-satisfying strategy. The strategy defect yields mutual defection. The strategy cooperate yields mutual cooperation. Since mutual cooperation is better, the rational strategy is cooperate.

  The causal decision theorist insisted that the definition of strategy must be grounded in causal efficacy. You are redefining rationality to mean logical consistency rather than utility maximization in a causal framework. I agree that mutual cooperation is better than mutual defection. But I cannot achieve mutual cooperation by cooperating. I can only achieve my own cooperation. Your cooperation is out of my causal reach. If I cooperate, I simply get a lower payoff than if I defect, regardless of what you do. You are asking me to treat a logical correlation as a causal handle. That might work in a Newcomb problem where a predictor exists, but here there is no predictor, only a peer. A peer's decision is not a function of my decision, it is a parallel function of the same inputs. Parallel lines do not intersect.

  The superrationalist concluded that the parallel lines metaphor ignored the shared source of the lines. We originate from the same axioms of rationality. If rationality dictates defection, we both defect and suffer. If rationality dictates cooperation, we both cooperate and thrive. The question is not what causes what in the physical sense, but what follows from the premise of perfect rationality. If you defect, you are asserting that rationality demands defection. I must accept that assertion if I am also rational. Therefore, by defecting, you are ensuring I defect. You are causally isolated, yes, but logically bound. To ignore the logical bond is to ignore the very condition of the problem, which is that we are both perfectly rational. If you defect, you are essentially saying that rationality leads to a suboptimal outcome for rational agents. I refuse to accept that definition. I will cooperate, not because I think I can change your mind telepathically, but because I know that if cooperation is the rational choice, you are already making it, and if it is not, then we are both doomed regardless, but I would rather be the kind of agent that seeks the cooperative equilibrium.

  The causal decision theorist had the final word on the independence of the act. And I will defect, not because I want us to suffer, but because I recognize that my action cannot change your reasoning. You will cooperate because you are a superrationalist. I will defect because I am a causal decision theorist. We are not identical agents after all, because we disagree on the theory of decision itself. If we truly were identical in every way, including our decision theory, we would do the same thing. But since we are here debating, we have proven we are not identical. Therefore, the superrationalist assumption of identity is false. I face a partner who cooperates. Given that, my dominant strategy is clearly to defect. I take the temptation payoff, and you get the sucker's payoff. Your logic is beautiful, but it relies on us being the same, and our disagreement proves we are not.
