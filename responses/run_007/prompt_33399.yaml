prompt: |-
  I run the science-and-policy unit at a state public health agency. Maybe six or eight times a year we have to make a high-stakes call under real uncertainty — the studies or models point in different directions, and forcing a single "best estimate" probability has burned us before: we come out overconfident, and then one bad winter or one weird trial result makes the guidance look silly. A friend in philosophy mentioned there's a whole formal literature on imprecise probabilities — the idea that instead of one probability for each outcome you carry around a set of probabilities, and you only act when the decision is robust across that whole set. I don't know the technical details and I don't want to learn the formalism; I want the usable version. I've heard the literature has notions like a set of priors, maximality, E-admissibility, and something called dilation — if those help, use them, but only in plain words. You're an expert on decision theory and formal epistemology. Please think carefully, and start by brainstorming what a procedure like this has to get right and where it will break, before you write the final version.

  Then give me a decision procedure my team can actually run in about two days, with our level of statistical training (masters-level epidemiology, no decision-theory background). The director signs off and wants a one-page justification for each step, and won't read anything with Greek letters in it. Ground the procedure in the imprecise-probability / ambiguity literature, but translate it into questions we can ask in order, with what counts as a sufficient answer to each, where the procedure stops with a no, and where it has to hand the decision to a human because it's a values call rather than a technical one. Be honest about which steps are judgment calls dressed up as procedure. Then run the procedure on three decisions of the kind we actually face: (1) whether to issue a fish consumption advisory for a lake where the two best toxicology studies conflict; (2) whether to recommend a new diabetes screening threshold where the models disagree badly about overdiagnosis; and (3) whether to keep schools open during a disease outbreak when the transmission models span a huge range. At least one of those should come out with an answer my team won't like, and I want you to say plainly what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Head of science-and-policy unit at a state public health agency.
      *   **Problem:** High-stakes decisions under uncertainty. Single-point probabilities lead to overconfidence and embarrassment when reality diverges.
      *   **Goal:** A usable decision procedure based on *imprecise probabilities* (sets of probabilities, robustness) without the heavy formalism.
      *   **Constraints:**
          *   Team has Masters-level epi/stats, no decision theory background.
          *   Procedure must take ~2 days to run.
          *   Director needs a one-page justification per step (no Greek letters).
          *   Must ground in literature (sets of priors, maximality, E-admissibility, dilation) but translate to plain English.
          *   Must identify where it stops (technical vs. values).
          *   Must be honest about judgment calls.
          *   Must test on three specific scenarios (Fish advisory, Diabetes threshold, School closure).
          *   At least one outcome must be unpopular/uncomfortable, acknowledging limitations.
      *   **Process:** First, brainstorm requirements and failure points. Second, write the final procedure and application.

  2.  **Brainstorming & Critical Analysis (Mental Draft):**
      *   *What does imprecise probability (IP) actually offer here?* It acknowledges that $P(Event)$ isn't 0.3, it's $[0.2, 0.5]$. It prevents false precision.
      *   *Key Concepts to Translate:*
          *   *Set of Priors:* Instead of one "best guess" model, we acknowledge a range of plausible models/assumptions.
          *   *Maximality/E-admissibility:* An option is good if no other option is clearly better across *all* plausible probabilities. If Option A beats Option B in some models and loses in others, they are "incomparable."
          *   *Dilation:* When new evidence makes uncertainty *worse* (the interval widens). This is crucial for knowing when *not* to act or when to wait.
          *   *Robustness:* Does the decision hold across the whole set?
      *   *What could go wrong?*
          *   *Paralysis:* If the set is too wide, nothing is robust. The procedure needs a "break glass" mechanism for when uncertainty is too high but action is mandatory.
          *   *Bureaucratic Cover:* Using "uncertainty" as an excuse to do nothing when action is needed (or vice versa).
          *   *Values Masking:* IP handles uncertainty, not utility (costs/benefits). The trade-off between false positives and false negatives is a value judgment, not a statistical one. The procedure must flag this.
          *   *Time:* Two days is tight. The procedure must be structured workshops/checklists, not new modeling.
      *   *Structure:* Needs to be a flowchart or step-wise checklist.
      *   *Tone:* Professional, pragmatic, authoritative but humble about limitations.

  3.  **Developing the Procedure (The "Usable Version"):**
      *   *Step 1: Define the Plausible Set.* (Corresponds to *Set of Priors*). Don't pick one model. Pick the envelope of reasonable models.
      *   *Step 2: Check for Dilation.* (Corresponds to *Dilation*). Does looking closer make it fuzzier? If yes, pause.
      *   *Step 3: Robustness Check.* (Corresponds to *Maximality/E-admissibility*). Does Option A beat Option B in *every* plausible scenario?
      *   *Step 4: The Values Gap.* If robustness fails, we need to weigh costs. This is where the Director/Policy makers come in.
      *   *Step 5: The "Break Glass" Clause.* If uncertainty is too high but we *must* act, use the Precautionary Principle (but label it as a value choice).

  4.  **Drafting the Scenarios:**
      *   *Scenario 1 (Fish):* Conflicting tox studies.
          *   *IP approach:* Range of risk estimates. If the "safe" limit is below the lower bound of risk, act. If it's inside the range, uncertainty is too high for a technical call.
          *   *Outcome:* Likely "Defer to Value Judgment" (How much risk is acceptable?).
      *   *Scenario 2 (Diabetes):* Models disagree on overdiagnosis.
          *   *IP approach:* One model says screen more (catch disease), one says screen less (avoid harm).
          *   *Outcome:* Incomparable. Needs policy directive on harm weighting.
      *   *Scenario 3 (Schools):* Transmission models span huge range.
          *   *IP approach:* Worst-case vs. Best-case.
          *   *Outcome:* This is the one that might be unpopular. If the worst case is catastrophic but low probability, and the best case is mild, IP says "Uncertainty is too high to recommend closure based *only* on science." It forces the political call. Or, if the lower bound of transmission is still above the threshold, close them. Let's make the unpopular one: The procedure says "Do not close" because the *robust* evidence doesn't support it, even if the worst-case model is scary. This highlights the "don't panic based on outliers" benefit of IP. *Correction:* Actually, the prompt asks for an outcome the team won't like. Usually, teams want to act. If the procedure says "We can't scientifically justify action," that's frustrating. Or, if it says "Uncertainty is too high, so we must assume worst case (Precautionary)," that burns resources. Let's go with: The procedure reveals the science is too weak to mandate closure, pushing the hot potato to the Governor/Director. The team hates this because they want cover.

  5.  **Refining the Output:**
      *   *Section 1: Brainstorming.* Be explicit about the "Why" and "Where it breaks."
      *   *Section 2: The Procedure.* Step-by-step, plain English, "Stop" conditions.
      *   *Section 3: The Application.* Run the three cases.
      *   *Section 4: Limitations.* Honest assessment.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use Greek letters? No.
      *   *Check:* Is it doable in 2 days? Yes, if it's a workshop format.
      *   *Check:* Did I explain E-admissibility/Maximality? I need to translate them. "E-admissibility" -> "Is this option ever the best choice?" "Maximality" -> "Is this option never worse than the alternative?" Let's stick to "Robust Dominance."
      *   *Check:* Did I address Dilation? Yes, as "The Fog Check."
      *   *Check:* Is the Director's justification clear? I need to provide templates for that.
      *   *Check:* Is one outcome unpopular? I will make the School Decision the unpopular one (Science says "Insufficient evidence to close," forcing a political risk call).

  7.  **Final Polish:** Ensure the tone is empathetic to the burden of public health decision-making. Emphasize that IP protects credibility by admitting uncertainty rather than hiding it.

  *(Self-Correction on the "Unpopular" Outcome)*: If I say "Don't close schools," that might be unpopular with parents. If I say "Close schools," that's unpopular with the economy. The prompt says "an answer my team won't like." The team usually wants scientific cover. If the procedure says "The science is too ambiguous to give you cover," the team is exposed. That's the real pain point. I will frame the School scenario such that the *robust* conclusion is "Uncertainty is too high to recommend closure on health grounds alone," which denies them the weaponized science they might want to justify a political decision.

  Let's refine the "Unpopular" aspect. Actually, a common frustration in public health is when a rigorous method tells you *not* to act because the evidence isn't robust, even if your gut says "better safe than sorry." I will make the Diabetes scenario the one where the procedure blocks a recommendation because the harm/benefit ratio flips depending on the model, and the team wants to recommend screening but can't scientifically justify the trade-off without a value directive.

  Wait, let's look at the School scenario again. If models span a huge range, IP says the probability set is wide. If the decision to close requires a high probability of overload, and the *lower bound* of the probability set doesn't meet that, IP says "Do not close." This is often unpopular with risk-averse health officials. I'll use that.

  Okay, ready to write.

  *Structure:*
  1.  **Brainstorming Analysis:** What makes this work? Where does it fail?
  2.  **The Protocol:** "The Robustness & Ambiguity Protocol (RAP)."
  3.  **The Director's Cheat Sheet:** One-page justifications.
  4.  **Case Studies:** Fish, Diabetes, Schools.
  5.  **Honest Limitations.**

  *Key Terminology Translation:*
  *   Set of Priors -> "The Plausible Range."
  *   Maximality/E-admissibility -> "Robust Dominance."
  *   Dilation -> "The Fog Effect."
  *   Values -> "The Trade-off Call."

  Let's get to work.cw
answer: |-
  ### Part 1: Brainstorming the Procedure

  Before writing the protocol, I need to be clear about what this is trying to achieve and where it is vulnerable. You are asking for a "firewall" against overconfidence. The core insight of imprecise probability (IP) is that when evidence is conflicting, representing your belief as a single number (e.g., "30% chance of outbreak") is a lie. It is better to say, "The chance is somewhere between 10% and 60%."

  **What the procedure must get right:**
  1.  **Honesty about Ignorance:** It must distinguish between *risk* (known odds) and *ambiguity* (unknown odds).
  2.  **Separation of Science and Values:** It must stop the moment the decision requires weighing costs (e.g., economic harm vs. health harm). Statistics cannot do that.
  3.  **Actionability:** It cannot result in permanent paralysis. It needs a "break glass" mechanism for when a decision is legally or ethically mandatory despite uncertainty.
  4.  **Credibility Protection:** It must document *why* a decision was made so that if the outcome is bad, the agency looks prudent, not incompetent.

  **Where it will break:**
  1.  **The "Wide Interval" Problem:** If the set of probabilities is too wide (e.g., 5% to 95% chance of harm), no action is "robust." The procedure might tell you "Science cannot decide." Your team will hate this because they want scientific cover for a political choice.
  2.  **Dilation (The Fog Effect):** Sometimes, getting *more* data makes the interval *wider* (because you realize your models are more flawed than you thought). The procedure needs to recognize when "waiting for more data" is actually making things worse.
  3.  **Bureaucratic Weaponization:** A savvy Director could use the "uncertainty" finding to delay action they don't want to take. The documentation must be public enough to prevent this.
  4.  **False Precision in the Bounds:** Your team might try to calculate the "upper and lower bounds" too precisely. The bounds themselves are estimates. The procedure must treat the bounds as rough fences, not steel walls.

  ***

  ### Part 2: The Robustness & Ambiguity Protocol (RAP)

  **Time required:** 2 Days (Workshop format)
  **Participants:** Science Unit Leads, Policy Liaison, Legal/Comms (for Step 4)
  **Output:** A Decision Memo with four specific checkboxes.

  #### Step 1: Define the "Plausible Range" (The Set of Priors)
  *Goal: Stop picking the "best" model. Start mapping the "reasonable" models.*
  *   **The Question:** "What is the range of outcomes produced by all models/studies that pass basic quality control, without discarding outliers just because they are inconvenient?"
  *   **The Action:** Plot the results of the top 3-5 credible models/studies. Do not average them. Draw a box around the lowest and highest plausible estimates.
  *   **Sufficient Answer:** "Model A says 5% risk, Model B says 25% risk. Both are methodologically sound. Our Plausible Range is 5%–25%."
  *   **Stop Condition:** If the range is narrow (e.g., 18%–22%), skip to Step 4. If the range is wide (e.g., 5%–80%), proceed to Step 2.
  *   **Director's Justification:** "We considered all credible scientific inputs. We did not cherry-pick the most convenient estimate. The range reflects genuine disagreement in the field."

  #### Step 2: The "Fog Check" (Dilation)
  *Goal: Determine if acting now reduces uncertainty or increases it.*
  *   **The Question:** "If we wait 48 hours for more data, will the Plausible Range get narrower, or will we just discover more reasons why the models are uncertain?"
  *   **The Action:** Consult the lead modelers. Ask: "Is the disagreement due to lack of data (fixable) or structural disagreement (unfixable)?"
  *   **Sufficient Answer:** "Structural. The models disagree on the mechanism, not just the inputs. More data won't fix this quickly."
  *   **Stop Condition:** If the Fog is thickening (Dilation), do not wait. Proceed to Step 3. If the Fog is lifting, wait 48 hours and restart.
  *   **Director's Justification:** "Waiting for more information would not reduce uncertainty because the disagreement is fundamental to the science, not just data gaps."

  #### Step 3: Robust Dominance Check (Maximality/E-admissibility)
  *Goal: See if one choice wins across the entire Plausible Range.*
  *   **The Question:** "Does Option A (e.g., Close Schools) produce a better outcome than Option B (Keep Open) at *both* the lower and upper bounds of our Plausible Range?"
  *   **The Action:** Run the decision metric (e.g., lives saved, hospitalizations) using the Low Bound and the High Bound.
  *   **Sufficient Answer:** "At 5% risk, closing schools causes more harm (education loss) than good. At 80% risk, closing schools saves lives. There is no Robust Dominance."
  *   **Stop Condition:** **CRITICAL.** If one option wins at both bounds, take that option. If the winner flips depending on where you are in the range, **STOP.** You have reached the limit of science. Hand off to Step 4.
  *   **Director's Justification:** "The scientific evidence does not support one course of action over the other across all reasonable scenarios. The choice depends on how we value competing risks."

  #### Step 4: The Trade-off Call (Values)
  *Goal: Explicitly state the value judgment required.*
  *   **The Question:** "Since science cannot decide, what is our risk tolerance?"
  *   **The Action:** The Science Unit writes the options. The Director/Policy Makers choose the "Risk Posture."
      *   *Posture A (Precautionary):* Act as if the Upper Bound is true.
      *   *Posture B (Proportionate):* Act as if the Middle is true.
      *   *Posture C (Liberty/Economic):* Act as if the Lower Bound is true.
  *   **Sufficient Answer:** "Given the uncertainty, we are adopting Posture A."
  *   **Stop Condition:** Decision made. Document the Posture chosen.
  *   **Director's Justification:** "Due to scientific ambiguity, this decision rests on policy judgment. We have chosen to prioritize [Health/Economy] given the uncertainty."

  ***

  ### Part 3: Running the Protocol on Three Real Decisions

  Here is how your team applies this in the next 48 hours.

  #### Case 1: Fish Consumption Advisory (Conflicting Toxicology)
  *   **Context:** Study A says mercury levels cause neurological harm at current exposure. Study B says the same levels are safe due to selenium buffering.
  *   **Step 1 (Plausible Range):** Risk of harm is estimated between 1 in 10,000 (Study B) and 1 in 100 (Study A). Range is wide.
  *   **Step 2 (Fog Check):** Structural disagreement on biological mechanism. Waiting won't help.
  *   **Step 3 (Robust Dominance):**
      *   *Option: Issue Advisory.* Cost: Economic loss to local fishermen. Benefit: Prevent harm.
      *   *At Low Bound (1 in 10,000):* Economic loss outweighs health benefit. (Don't Issue)
      *   *At High Bound (1 in 100):* Health benefit outweighs economic loss. (Issue)
      *   *Result:* **No Robust Dominance.** Science cannot decide.
  *   **Step 4 (Trade-off):** Director must choose.
  *   **Outcome:** The protocol forces the Director to sign off on a "Precautionary Posture."
  *   **Team Reaction:** Neutral. This is standard public health practice, but now it's documented that the science wasn't definitive.

  #### Case 2: Diabetes Screening Threshold (Overdiagnosis Disagreement)
  *   **Context:** Lowering the threshold catches more early diabetes (good) but labels healthy people as sick (bad). Model A says overdiagnosis is 10%. Model B says overdiagnosis is 60%.
  *   **Step 1 (Plausible Range):** Overdiagnosis rate: 10% – 60%.
  *   **Step 2 (Fog Check):** Unfixable structural disagreement.
  *   **Step 3 (Robust Dominance):**
      *   *Option: Lower Threshold.*
      *   *At 10% Overdiagnosis:* Net benefit is positive. (Lower it)
      *   *At 60% Overdiagnosis:* Net harm is massive (psychological distress, unnecessary meds). (Keep old threshold)
      *   *Result:* **No Robust Dominance.**
  *   **Step 4 (Trade-off):** Requires a value call on "Is it worse to miss a case or to falsely label someone?"
  *   **Outcome:** **PROCEDURE STOPS.** The Science Unit issues a memo: *"We cannot recommend a threshold change based on current evidence. The decision requires a policy directive on acceptable overdiagnosis rates."*
  *   **Team Reaction:** **Frustration.** Your team likely *wants* to recommend lowering the threshold because "early detection sounds good." This procedure denies them the scientific cover to do so. It forces them to admit the science is too ambiguous to support their intuition.

  #### Case 3: School Closures (Huge Transmission Range)
  *   **Context:** Flu-like outbreak. Model A (Contact Tracing based) says R0 is 1.2 (manageable). Model B (Wastewater based) implies R0 is 2.5 (explosive).
  *   **Step 1 (Plausible Range):** R0 is 1.2 – 2.5.
  *   **Step 2 (Fog Check):** Data is sparse. Waiting 48 hours might narrow it, but the outbreak moves fast. Proceed.
  *   **Step 3 (Robust Dominance):**
      *   *Threshold for Closure:* Agency policy says close if R0 > 2.0.
      *   *At Low Bound (1.2):* Do not close.
      *   *At High Bound (2.5):* Close.
      *   *Result:* **No Robust Dominance.**
      *   *Wait, check the "Break Glass":* Does the *Lower Bound* exceed the threshold? No. Does the *Upper Bound* exceed catastrophic failure? Yes.
      *   *Strict IP Interpretation:* Since the Lower Bound (1.2) does not justify closure, there is no *scientific consensus* to close.
  *   **Step 4 (Trade-off):** Director must choose Precautionary (assume 2.5) or Proportionate (assume 1.2).
  *   **Outcome:** If the Director chooses "Proportionate" (Keep Open), and the outbreak explodes, the agency looks negligent. If the Director chooses "Precautionary" (Close), and it was mild, they look alarmist.
  *   **The Unpopular Result:** The protocol dictates that **the Science Unit cannot recommend closure.** Why? Because the *robust* evidence (evidence that holds across all models) does not meet the closure threshold. The recommendation must be: *"Evidence is insufficient to mandate closure on health grounds alone."*
  *   **Team Reaction:** **Hostile.** Your epidemiologists will argue, "But the worst case is death!" The protocol replies, "That is a value judgment, not a scientific finding." This strips the team of the ability to use "Science says..." to force a closure. It puts the political risk squarely on the Director.

  ***

  ### Part 4: Honest Limitations (For the Director)

  **1. This does not reduce risk; it reduces hypocrisy.**
  This procedure will not tell you the "right" answer when the science is split. It will only tell you when the science is *silent*. In Case 3, it denies you the weapon of "The Science Forces Us to Close." You will have to own the political risk.

  **2. It creates "Decision Paralysis" risk.**
  If you use this for every minor decision, nothing will ever get done. Use it only for the 6-8 high-stakes calls per year where credibility is on the line.

  **3. It exposes the Value Judgment.**
  Public health agencies often hide value judgments inside statistical assumptions (e.g., assuming a high cost of death to justify a lockdown). This procedure drags those assumptions into the light. Some stakeholders will be angry that you are admitting "This is a political choice."

  **4. The "Break Glass" is subjective.**
  Step 4 requires the Director to pick a "Posture." If they pick the wrong one, the documentation proves they knew the uncertainty and gambled anyway. This protects the *scientists*, but it exposes the *leadership*.

  ### Final Recommendation

  Adopt the **Robustness & Ambiguity Protocol (RAP)** for your high-stakes decisions. It aligns with the formal literature on imprecise probabilities (specifically *E-admissibility* and *Maximality*) without requiring your team to learn the math.

  It will frustrate your team in Case 2 and Case 3 because it removes their ability to claim scientific certainty where none exists. That frustration is the feature, not the bug. It prevents the agency from looking silly when the "best estimate" turns out wrong. It trades short-term decisiveness for long-term credibility.
