  *(Self-Correction on Compatibilism)*: I need to be careful. A strict compatibilist would say Billy is free because he acts on desires. But the Tralfamadorians say the *desires* are fixed points in a 4D landscape. So, Tralfamadorianism is actually *hard determinism*. However, the *novel* invites a compatibilist *response* from the reader. We judge Billy. We judge the war. We act as if choices matter. I should frame it as: Tralfamadorians = Incompatibilists; Vonnegut/Human Reader = Implicit Compatibilists (or Libertarians regarding moral duty).

