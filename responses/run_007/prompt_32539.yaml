  Hart argues law is a social fact—a system of rules validated by a "rule of recognition," regardless of moral content. For Hart, separating law from morality is essential to preserve critical morality. If we define law as necessarily moral, we risk losing the vocabulary to condemn valid but wicked statutes. He wants you to say, "This is law, but it is too evil to obey."

  Fuller counters that law is not just a fact of power but a purposive enterprise: the subjection of human conduct to rules. His eight principles (generality, publicity, non-retroactivity, etc.) are not external moral judgments but internal conditions of existence. For Fuller, a regime that systematically violates these principles does not produce "bad law"; it fails to produce law *at all*. It becomes mere managerial coercion.

  Why is this substantive rather than verbal? Because it dictates the source of legal obligation. For Hart, obligation stems from systemic validity. For Fuller, obligation stems from reciprocity. When the state fails the internal morality, it breaks the bond that creates a duty to obey. This changes how judges decide cases. In the grudge-informer scenarios, Hart advises punishing informers via new retroactive statutes, admitting the moral cost to maintain conceptual clarity. Fuller suggests denying the Nazi statutes were ever law, thus avoiding retroactivity.

