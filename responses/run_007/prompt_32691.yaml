  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is taking a philosophy of war course.
      *   **Topic:** Moral Equality of Combatants (MEC).
      *   **Source Material:** A summary chapter in a companion book.
      *   **Task:** Evaluate the fairness/accuracy of the summary provided by the user.
      *   **Specific Concern:** The user is suspicious of the conclusion ("revisionist critique has largely won the day... MEC survives mostly as a legal convention, not a defensible moral position").
      *   **Instruction:** Go sentence by sentence if possible.

  2.  **Deconstruct the Provided Summary (Sentence by Sentence Analysis):**

      *   *Sentence 1:* "The doctrine of the moral equality of combatants, most famously defended by Michael Walzer, holds that soldiers on both sides of a war have the same moral permission to kill one another, regardless of whether their side's cause is just."
          *   **Assessment:** Accurate. This is the standard definition of MEC as presented in *Just and Unjust Wars*. Walzer argues for the symmetry of combatant status.

      *   *Sentence 2:* "Walzer's argument is basically that individual soldiers are not responsible for the justice of the war their state fights—they're conscripted or pressured into it, and in the fog of war they can't reasonably be expected to figure out whether their government is in the right."
          *   **Assessment:** Mostly accurate, but slightly reductive. Walzer does emphasize the "coercion" aspect (conscription/social pressure) and the epistemic limitation ("fog of war"/information asymmetry). However, he also emphasizes the *functional* role of soldiers as instruments of the state and the need for a clear distinction between *jus ad bellum* (justice of war) and *jus in bello* (justice in war). The summary captures the core intuition but misses the structural argument about separating the two realms.

      *   *Sentence 3:* "So the only thing you can hold them to is how they fight, not whether they fight."
          *   **Assessment:** Accurate. This is the separation thesis. *Jus in bello* applies equally; *jus ad bellum* applies to leaders/states.

      *   *Sentence 4:* "Jeff McMahan and other revisionists attack this by arguing that you can't divorce the morality of killing from the cause it serves."
          *   **Assessment:** Accurate. This is the core of Revisionist Just War Theory (RJWT). McMahan argues that the right to kill depends on liability, and liability depends on moral responsibility for an unjust threat.

      *   *Sentence 5:* "If a soldier is fighting for an unjust invader, every bullet he fires contributes to an unjust war, so the killing is disproportionate and therefore impermissible—even if he's aiming at enemy combatants in accordance with the laws of war."
          *   **Assessment:** Mostly accurate, though "disproportionate" might be slightly imprecise terminology (usually it's about "liability" or "self-defense rights"), but the gist is correct. Unjust combatants lack the right to kill just combatants because just combatants are not liable to be killed.

      *   *Sentence 6:* "The chapter then says Walzer's response is that war is a tragic situation where ordinary moral principles don't apply, and that McMahan's view would make it impossible to have any rules of war at all because everyone would just claim their side is the just one."
          *   **Assessment:** This is a mix. Walzer does talk about the "legalist paradigm" and the reality of war. He does argue that collapsing *ad bellum* and *in bello* creates practical problems (the "epistemic problem" and the "efficacy problem"). However, saying Walzer argues "ordinary moral principles don't apply" is a bit strong; he argues that the *rules of war* are a distinct moral sphere shaped by necessity. The second part (everyone claims their side is just) is a standard pragmatic objection to Revisionism (the "action-guiding" critique).

      *   *Sentence 7 (The User's Main Suspicion):* "It concludes that the revisionist critique has largely won the day among philosophers and the moral equality of combatants survives mostly as a legal convention, not a defensible moral position."
          *   **Assessment:** This is the contentious part.
          *   *Philosophical Consensus:* It is true that Revisionism (McMahan et al.) dominates *analytic moral philosophy* journals. The arguments are generally considered more rigorous within that specific framework.
          *   *Defensibility:* To say MEC is *not a defensible moral position* is too strong. There are robust defenses of MEC (or modified versions of it) by people like David Rodin, Henry Shue, and even later Walzer. There are "pragmatic" defenses, "epistemic" defenses, and "collectivist" defenses.
          *   *Legal Convention:* It is accurate that MEC survives strongly in International Humanitarian Law (IHL).
          *   *Verdict:* The sentence is *directionally* correct regarding the trend in academic philosophy since ~2006 (*Killing in War*), but overstated in declaring MEC morally indefensible. It ignores the "Pragmatic Turn" or recent pushback against Revisionism.

  3.  **Synthesize the Evaluation:**

      *   **Overall:** The summary is a decent "CliffsNotes" version but lacks nuance, particularly regarding Walzer's deeper arguments and the current state of the debate.
      *   **The "Win":** Revisionism did shock the field and became the dominant *theoretical* framework in moral philosophy, but MEC has not surrendered. There is a vibrant "Orthodox" or "Traditionalist" counter-attack.
      *   **Key Missing Nuance:** The distinction between *moral philosophy* (ideal theory) and *political/legal theory* (non-ideal theory). Revisionism wins on ideal theory; Orthodoxy holds ground on non-ideal/practical application.

