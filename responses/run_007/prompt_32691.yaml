answer: |-
  Your intuition is spot-on. That last sentence is particularly contentious, and while the summary gets the basic definitions right, it smooths over some significant nuances in Walzer's actual arguments and exaggerates the "defeat" of the traditional view.

  Here is a sentence-by-sentence breakdown of the fairness of that summary, followed by a deeper dive into why that conclusion is problematic.

  ### Sentence-by-Sentence Analysis

  **1. "The doctrine of the moral equality of combatants, most famously defended by Michael Walzer, holds that soldiers on both sides of a war have the same moral permission to kill one another, regardless of whether their side's cause is just."**
  *   **Verdict:** **Fair.**
  *   **Nuance:** This is the standard definition of the Moral Equality of Combatants (MEC). Walzer is indeed the most famous proponent, specifically in his 1977 classic *Just and Unjust Wars*. This sentence accurately captures the "symmetry thesis."

  **2. "Walzer's argument is basically that individual soldiers are not responsible for the justice of the war their state fights—they're conscripted or pressured into it, and in the fog of war they can't reasonably be expected to figure out whether their government is in the right."**
  *   **Verdict:** **Mostly Fair, but slightly reductive.**
  *   **Nuance:** This captures Walzer's *epistemic* and *coercion* arguments (soldiers don't know the truth, and they are forced to fight). However, it misses Walzer's *structural* argument. Walzer argues that we must separate *jus ad bellum* (justice of going to war) from *jus in bello* (justice in fighting) to prevent war from becoming total. If soldiers are morally responsible for the cause, they become responsible for *all* the deaths in the war, which makes restraint impossible. The summary focuses on the soldier's blamelessness, whereas Walzer also focuses on the *function* of the rules.

  **3. "So the only thing you can hold them to is how they fight, not whether they fight."**
  *   **Verdict:** **Fair.**
  *   **Nuance:** This accurately describes the "separation thesis." In the Traditional View, a soldier can fight unjustly (violate *ad bellum*) but still fight permissibly (follow *in bello*), provided they follow the rules of engagement.

  **4. "Jeff McMahan and other revisionists attack this by arguing that you can't divorce the morality of killing from the cause it serves."**
  *   **Verdict:** **Fair.**
  *   **Nuance:** This is the core of "Revisionist Just War Theory" (RJWT), launched prominently by McMahan's 2006 book *Killing in War*. Revisionists argue that war is just a large-scale instance of interpersonal morality. If you can't kill an innocent person in a bar fight, you can't kill an innocent (just) soldier in a war.

  **5. "If a soldier is fighting for an unjust invader, every bullet he fires contributes to an unjust war, so the killing is disproportionate and therefore impermissible—even if he's aiming at enemy combatants in accordance with the laws of war."**
  *   **Verdict:** **Mostly Fair, with a terminology quibble.**
  *   **Nuance:** The logic is correct, but "disproportionate" is usually a specific technical term regarding collateral damage. Revisionists usually argue that unjust combatants lack **liability**. Just combatants are not "liable" to be killed because they are not doing anything wrong; therefore, killing them is a rights violation (more like murder than war). But for the purpose of a summary, this sentence conveys the right idea.

  **6. "The chapter then says Walzer's response is that war is a tragic situation where ordinary moral principles don't apply, and that McMahan's view would make it impossible to have any rules of war at all because everyone would just claim their side is the just one."**
  *   **Verdict:** **Partially Fair, but caricatures Walzer.**
  *   **Nuance:**
      *   *First half:* Walzer doesn't exactly say ordinary morality *doesn't apply*; he says the rules of war are a specific moral adaptation to extreme circumstances (necessity).
      *   *Second half:* This is the "Pragmatic Objection." Walzer and others (like Henry Shue) argue that Revisionism is "action-guiding" only in theory. In reality, if you tell soldiers "only fight if your side is just," they will all believe their side is just, and the restraint MEC provides will vanish. The summary captures this, but frames it as Walzer's *only* response, ignoring his later theoretical refinements.

  **7. "It concludes that the revisionist critique has largely won the day among philosophers and the moral equality of combatants survives mostly as a legal convention, not a defensible moral position."**
  *   **Verdict:** **Unfair / Overstated.** (This is your suspicion confirmed).
  *   **Nuance:** This is where the summary fails.
      *   *"Won the day among philosophers":* It is true that in *analytic moral philosophy* journals, Revisionism has been the dominant framework since 2006. If you walk into a seminar on ethical theory, most people will be working within a Revisionist framework.
      *   *"Not a defensible moral position":* **This is false.** There is a robust, ongoing defense of MEC (or modified versions of it) by serious philosophers. Scholars like **Henry Shue, David Rodin, Seth Lazar, and Cécile Fabre** have published significant work defending the Traditional View or finding middle ground.
      *   *The "Pragmatic Turn":* In the last 10 years, there has been a pushback against Revisionism. Many philosophers argue that while Revisionism might be true in "ideal theory" (how the world should be), MEC is required in "non-ideal theory" (how the world actually is). To say MEC is *morally indefensible* ignores the moral value of reducing violence through clear, symmetrical rules.

  ### Why the Conclusion Feels "Off"

  You are right to be suspicious of that last sentence for three main reasons:

  **1. It conflates "Popularity" with "Truth"**
  Revisionism was a shock to the system. It felt more intellectually rigorous because it applied standard self-defense ethics to war. That made it very popular in philosophy departments. However, popularity in one sub-field doesn't mean the opposing view is *indefensible*. It just means the debate shifted ground.

  **2. It ignores the "Epistemic Problem"**
  The strongest defense of MEC today isn't just "law is law." It's that soldiers *cannot know* who is truly just. Even Revisionists admit that if a soldier reasonably (but wrongly) believes their cause is just, they might still be permitted to fight. Once you grant that "reasonable belief" matters, you start sliding back toward MEC. The summary ignores this middle ground.

  **3. It dismisses the Moral Value of Convention**
  The summary treats Law and Morality as separate buckets (MEC is legal, not moral). But many philosophers argue that **conventions have moral value.** If adhering to MEC saves lives by making surrender possible and limiting escalation, then adhering to MEC is a *moral duty*, even if abstract theory says otherwise. By saying MEC is "not a defensible moral position," the summary ignores consequentialist defenses of MEC.

  ### How to Frame This in Your Course

  If you bring this up in class, here is a strong way to articulate your critique:

  > "The summary accurately captures the *definitions* of the Traditional vs. Revisionist views. However, the conclusion that MEC is no longer a 'defensible moral position' seems too strong. While Revisionism dominates ideal theory, there are significant 'non-ideal' defenses of MEC (like those by Seth Lazar or Henry Shue) that argue MEC is morally required for practical efficacy and epistemic humility. It seems more accurate to say the debate has shifted from 'Is MEC true?' to 'Under what conditions does MEC apply?'"

  ### Recommended Names for Your Research
  If you want to dig deeper to prove your suspicion right, look up these names:
  *   **Seth Lazar:** He writes extensively on the "epistemic" defense of MEC (soldiers can't know who is just).
  *   **Henry Shue:** He defends the separation of *ad bellum* and *in bello* on practical moral grounds.
  *   **Adil Ahmad Qureshi:** A contemporary philosopher who defends a version of the traditional view against Revisionism.
  *   **The "Pragmatic Turn":** Search for this term in Just War literature. It describes the recent pushback against pure Revisionism.

  **Summary:** Your reading of the text is better than the text's reading of the field. The summary is a good intro to the *concepts*, but a biased intro to the *state of the debate*.
