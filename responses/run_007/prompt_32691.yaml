  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to paint Walzer as purely pragmatic. He has moral arguments for MEC (the "dangerous people" argument, the "rights forfeiture" nuance).
      *   *Correction:* Ensure I clarify that McMahan doesn't necessarily say *all* killing by unjust combatants is murder, but that they lack the *combatant's privilege*.
      *   *Correction:* On the "won the day" claim: Be precise. In *moral philosophy* departments? Yes, mostly. In *law/policy*? No. In *all philosophy*? Debatable. Seth Lazar and others are bridging the gap.
