prompt: |-
  Hey, I'm taking a philosophy of war course this semester and we're covering the moral equality of combatants. I read a chapter in this companion book that summarizes the whole debate, and I want to know if it's fair cause something feels off but I can't quite put my finger on it.

  The chapter says something like this: The doctrine of the moral equality of combatants, most famously defended by Michael Walzer, holds that soldiers on both sides of a war have the same moral permission to kill one another, regardless of whether their side's cause is just. Walzer's argument is basically that individual soldiers are not responsible for the justice of the war their state fights—they're conscripted or pressured into it, and in the fog of war they can't reasonably be expected to figure out whether their government is in the right. So the only thing you can hold them to is how they fight, not whether they fight. Jeff McMahan and other revisionists attack this by arguing that you can't divorce the morality of killing from the cause it serves. If a soldier is fighting for an unjust invader, every bullet he fires contributes to an unjust war, so the killing is disproportionate and therefore impermissible—even if he's aiming at enemy combatants in accordance with the laws of war. The chapter then says Walzer's response is that war is a tragic situation where ordinary moral principles don't apply, and that McMahan's view would make it impossible to have any rules of war at all because everyone would just claim their side is the just one. It concludes that the revisionist critique has largely won the day among philosophers and the moral equality of combatants survives mostly as a legal convention, not a defensible moral position.

  Is this a fair picture? I'm especially suspicious of the last sentence—it seems like plenty of people are still defending Walzer. But maybe the other parts are wrong too and I'm just not seeing it. Go sentence by sentence if you can.
