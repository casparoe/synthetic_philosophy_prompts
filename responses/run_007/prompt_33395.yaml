      *   (2) **Burgean Social Externalism:** Content depends on community usage (even if ignorant).
      *   (3) **Privileged Access (PA):** First-person authority over own thoughts (constitutive condition).
      *   (4) **Slow-Switching Problem:** Acknowledges the tension between externalism and self-knowledge over time (memory issues).
      *   (5) **Narrow Content:** Wants to retain a notion of narrow content for psychology/behaviour explanation, distinct from wide content.
      *   (6) **Non-Naturalism about Content:** Content is sui generis/normative, not reducible to natural facts (causal/teleological).

  3.  **Evaluate Pairwise Tensions:**

      *   **(1) & (2) vs. (5) [Externalism vs. Narrow Content]:**
          *   *Tension:* Classic debate. If meaning is determined externally (wide), what is left for "narrow content" to be? Fodor tried to save it, but many externalists (like Burge) reject narrow content entirely.
          *   *Severity:* High. This is the core friction of 90s philosophy of mind.
          *   *Resolution:* Need a robust definition of narrow content (e.g., Fregean modes of presentation, functional role) that doesn't collapse into individualism that contradicts (1) and (2). Or accept that narrow content isn't *semantic* content but something else (phenomenal? functional?).
          *   *Verdict:* Real tension, but manageable if defined carefully (two-factor theory).

      *   **(1) & (2) vs. (3) [Externalism vs. Privileged Access]:**
          *   *Tension:* The McKinsey/Brown incompatibility argument. If content depends on external facts I don't know, how can I know my content a priori?
          *   *Severity:* High. This is the "compatibilist" battleground.
          *   *Resolution:* Compatibilism (e.g., Falvey, Owens) argues PA is about the *thought* not the *existence of the object*. Or distinguish between knowing *that* I think water is wet vs. knowing *what* water is.
          *   *Verdict:* Real tension, but widely debated. Many hold both. Needs careful articulation of what PA covers.

      *   **(3) vs. (4) [Privileged Access vs. Slow-Switching]:**
          *   *Tension:* If I have PA, shouldn't I know if my content has shifted? Slow-switching suggests I *don't* know until I investigate the environment.
          *   *Severity:* Moderate to High. (4) admits the problem bothers them.
          *   *Resolution:* Accept memory is fallible regarding content over time (Ludlow), or argue that switching takes much longer than thought (no immediate loss), or deny PA extends to diachronic identity of content.
          *   *Verdict:* Real tension. (4) admits the worry. To keep (3), need to limit PA's scope regarding diachronic identity.

      *   **(1) & (2) vs. (6) [Externalism vs. Non-Naturalism]:**
          *   *Tension:* Putnam and Burge are often read as naturalists (or at least compatible with naturalism). Putnam's "meaning ain't in the head" relies on causal connections. If content is sui generis/normative, how does the external environment fix it without natural relations?
          *   *Severity:* Moderate. Externalism doesn't *entail* naturalism, but standard arguments (causal theory of reference) often presuppose naturalistic links.
          *   *Resolution:* Argue that external determination is normative (Brandom-esque) rather than causal.
          *   *Verdict:* Apparent tension that can dissolve. Externalism is about *where* content is fixed, Non-naturalism is about *what kind of fact* fixes it. They can coexist (e.g., McDowell).

      *   **(5) vs. (6) [Narrow Content vs. Non-Naturalism]:**
