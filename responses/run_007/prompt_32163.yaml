answer: |-
  Here is a 40-minute session plan designed to move your group from "legal conflict" to "logical paradox" without getting bogged down in formal logic notation.

  ### 1. The Prerequisites: Making the Paradox Bite
  Before you introduce the example, you must establish three conditions in the first 5 minutes. If any of these are missing, the lawyers will treat it as a standard statutory conflict rather than a paradox.

  1.  **Closure (No External Arbiter):** Explicitly state that in this *Nomic* instance, there is no Supreme Court, no Rule of Recognition outside the text, and no "intent of the drafters" to appeal to. The text is the only reality.
  2.  **Omnicompetence:** The initial rule of change must explicitly allow itself to be changed. (e.g., "Any rule, including this one, may be amended by...")
  3.  **Ontological Equality:** Establish that all rules currently on the books have the same legal force. There are no "constitutional" vs. "statutory" tiers unless a rule explicitly creates them *within* the game.

  **When to set this:** Minutes 0–5.
  **Why:** If you don't establish **Closure**, the lawyers will solve it by saying "a judge would interpret the intent." If you don't establish **Omnicompetence**, they will say "the rule lacked jurisdiction to amend itself."

  ---

  ### 2. The One Example: "The Unanimity Trap"
  Do not use a complex web of rules. Use a single, two-step sequence that creates a temporal contradiction.

  **The Setup:**
  *   **Rule 1:** "Rules may be amended by a 50% majority vote."
  *   **Move 1:** The group votes (50% in favor) to amend Rule 1.
  *   **New Rule 1:** "Rules may now only be amended by a 100% unanimous vote."
  *   **Move 2:** The group votes (50% in favor) to amend Rule 1 back to "50% majority."

  **The Paradox:**
  Is **Move 2** valid?
  *   **If Yes:** You violated the current Rule 1 (which demands 100%).
  *   **If No:** Then **New Rule 1** is still in effect. But if **New Rule 1** is in effect, it must have been validly enacted in **Move 1**. If **Move 1** was valid, it was valid under the *Old* Rule 1 (50%). But if the *Old* Rule 1 allowed **Move 1**, does the *Old* Rule 1 still exist to validate the transition, or was it destroyed by the transition?

  **Features this example absolutely needs:**
  1.  **Self-Reference:** The rule being amended is the rule granting the power to amend.
  2.  **Restriction:** The amendment must restrict the power that created it (50% → 100%).
  3.  **No "Grandfathering":** Do not allow a clause that says "this change takes effect tomorrow." It must be immediate.

  **When to introduce:** Minutes 5–15. Walk through the moves slowly. Ask for a show of hands on the validity of Move 2. Expect a split room.

  ---

  ### 3. Anticipating Misconceptions & Timing
  Here is where you intercept the "practical lawyer" responses to force the philosophical problem.

  **Misconception A: "Why not just add a meta-rule?"**
  *   *The Argument:* "We just need a Rule 0 that says Rule 1 is superior and can't be touched."
  *   *When to head it off:* **Minute 20.** (During the discussion of Move 2).
  *   *The Counter:* Ask: "Who amends Rule 0?" If Rule 0 can be amended, we are back to the start. If Rule 0 *cannot* be amended, you have posited an unchangeable sovereign. But in a self-amending system (like *Nomic* or a modern constitution), the claim is that *everything* is changeable. If you posit an unchangeable rule, you have abandoned the premise of the game/system to save the logic.

  **Misconception B: "Isn't this just the Liar Paradox with a gavel?"**
  *   *The Argument:* "This is semantics. 'This sentence is false' doesn't break the world, so why does this break the law?"
  *   *When to head it off:* **Minute 25.** (When they start treating it as a logic puzzle).
  *   *The Counter:* Remind them that legal validity has **consequences**. If Move 2 is invalid, anyone acting under it is liable for breach of contract or ultra vires. If it is valid, the text of the law is a lie (it says 100% is needed, but 50% worked). Unlike the Liar Paradox, you cannot just say "it's neither true nor false." The game must continue, and someone must be in charge.

  **Misconception C: "A court would just rule on it."**
  *   *The Argument:* "In practice, a judge decides which rule stands."
  *   *When to head it off:* **Minute 5.** (In the Prerequisites/Setup).
  *   *The Counter:* Reiterate **Closure**. In this session, *they* are the court. If they cannot find a rule that validates their own decision, the decision has no authority. This forces them to realize that the "Rule of Recognition" is not a magic wand; it is itself a rule subject to the same paradox if it is amendable.

  ---

  ### 4. The Assessment Question
  Do not ask "Did you understand?" Ask a question that forces them to apply the distinction between **validity** (logical consistency) and **efficacy** (power to enforce).

  **The Question (Minute 35):**
  > "Imagine the group ignores the paradox and enforces Move 2 (the 50% vote) anyway. The game continues. Years later, a new player challenges a rule passed under Move 2, claiming it was void from the start.
  >
  > **By what specific rule does the group justify punishing the challenger for questioning a rule that was logically invalid when born?**"

  **What to listen for:**
  *   **If they nod along:** They will say "Because we moved on," or "Because it works." (This is Efficacy).
  *   **If they got it:** They will realize there is *no rule* that justifies this. They will see that to maintain the system, they must admit that **legal validity can survive logical invalidity**, or that the system rests on a factual power grab, not a normative rule.
  *   **The Goal:** You want them to admit that the "Rule of Recognition" is not a logical foundation, but a social fact that can persist even after its own logical coherence has collapsed.

  ### 5. Session Timeline Summary
  *   **00–05:** **Setup.** Define *Nomic*. Establish Closure, Omnicompetence, Equality. (Block Misconception C).
  *   **05–15:** **The Trap.** Walk through the 50% → 100% → 50% sequence. Vote on validity.
  *   **15–25:** **The Hierarchy Dodge.** Let them propose meta-rules. Show why that fails if the meta-rule is also amendable. (Block Misconception A).
  *   **25–35:** **Consequences.** Discuss why this isn't just semantics. (Block Misconception B).
  *   **35–40:** **Assessment.** Ask the "Punish the Challenger" question. Wrap up on the distinction between logical validity and social efficacy.
