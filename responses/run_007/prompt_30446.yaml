answer: |-
  # Decision Tree: Practical Factors in Epistemology

  **Instructions:** Answer the following questions based on your intuitions about the described cases. Do not worry about philosophical labels; simply follow the branch that matches your judgment.

  ### **Node 1: The Bank Case (Truth vs. Appropriateness)**
  *Case:* Hannah has the same evidence that the bank is open on Saturday in two scenarios. In **Low Stakes**, nothing turns on it. In **High Stakes**, she will be ruined if she is wrong.
  *Question:* In the **High Stakes** scenario, is the sentence "Hannah knows the bank is open" **FALSE**, or is it **TRUE but inappropriate to say**?

  *   **Branch A: TRUE but inappropriate to say.** (Go to Node 2)
  *   **Branch B: FALSE.** (Go to Node 3)

  ---

  ### **Node 2: The Low-Stakes Baseline (Invariantist Split)**
  *Case:* Return to the **Low Stakes** Bank Case from Node 1.
  *Question:* Is the sentence "Hannah knows the bank is open" **TRUE** or **FALSE**?

  *   **Branch A: TRUE.**
      *   **Position:** **Anti-Skeptical Classical Invariantism**
      *   *Awkward Commitment:* You must maintain that the strong intuition that Hannah loses knowledge in High Stakes is a systematic pragmatic illusion, despite the practical disaster awaiting her.
  *   **Branch B: FALSE.**
      *   **Position:** **Skeptical Classical Invariantism**
      *   *Awkward Commitment:* You must maintain that Hannah lacks knowledge even in Low Stakes, implying that ordinary claims to know are almost always false regardless of practical pressure.

  ---

  ### **Node 3: The Dissociation Case (Subject vs. Context)**
  *Case:* **Scenario X:** A Low-Stakes Speaker says of a High-Stakes Subject, "She knows." **Scenario Y:** A High-Stakes Speaker says of a Low-Stakes Subject, "She knows." Evidence is fixed.
  *Question:* Does the truth of "She knows" track the **SUBJECT'S practical situation**, or does it track the **SPEAKER/ASSESSOR'S context**?

  *   **Branch A: The SUBJECT'S practical situation.** (Go to Node 4)
  *   **Branch B: The SPEAKER/ASSESSOR'S context.** (Go to Node 5)

  ---

  ### **Node 4: The Salience-Only Case (Subject-Side Split)**
  *Case:* A Subject has Low Stakes (nothing turns on being wrong), but a far-fetched error possibility is made **Salient** to them in conversation.
  *Question:* Does the salience of the error possibility alone make it **FALSE** that the Subject knows?

  *   **Branch A: NO (Only Stakes matter).**
      *   **Position:** **Subject-Sensitive Invariantism (Pragmatic Encroachment)**
      *   *Awkward Commitment:* You must accept that two subjects with identical evidence and cognitive states differ in knowledge solely because one has more to lose.
  *   **Branch B: YES (Salience matters).**
      *   **Position:** **[EMPTY CELL] Subject-Salient Invariantism**
      *   *Status:* **Unexplored/Redundant.** This view is rarely occupied because if truth depends on the subject's salience, it tends to collapse into Contextualism (since salience is often ascriber-driven) or SSI (since salience usually tracks stakes).

  ---

  ### **Node 5: The Retraction Case (Speaker vs. Assessor)**
  *Case:* A Speaker says "She knows" in a Low-Stakes context. Later, an Assessor in a High-Stakes context evaluates that past claim.
  *Question:* Is the past claim **FALSE** relative to the Assessor's current context, or was it **TRUE** relative to the Speaker's original context?

  *   **Branch A: FALSE relative to the Assessor's current context.**
      *   **Position:** **Epistemic Relativism**
      *   *Awkward Commitment:* You must deny that there is a single fact of the matter about whether the knowledge ascription is true, independent of who is assessing it.
  *   **Branch B: TRUE relative to the Speaker's original context.** (Go to Node 6)

  ---

  ### **Node 6: The Salience-Only Case (Context-Side Split)**
  *Case:* A Speaker is in a Low-Stakes situation, but a far-fetched error possibility is made **Salient** in the conversation (without changing stakes).
  *Question:* Does this salience alone make the Speaker's claim "She knows" **FALSE**?

  *   **Branch A: YES.**
      *   **Position:** **Epistemic Contextualism (Salience-Based)**
      *   *Awkward Commitment:* You must accept that a knowledge claim can be true when uttered but false when reported later, requiring speakers to retract true claims when contexts shift.
  *   **Branch B: NO (Only Stakes matter).**
      *   **Position:** **[EMPTY CELL] Ascriber-Stakes Contextualism**
      *   *Status:* **Unattractive.** This view is empty because there is little intuitive support for the idea that a *speaker's* practical stakes (rather than salience or standards) directly alter the truth conditions of a report about a *subject*.

  ---

  ### **Note on Indistinguishable Positions**
  This tree distinguishes **Subject-Sensitive Invariantism** from **Epistemic Contextualism** using the Dissociation Case (Node 3). However, it cannot fully separate **Salience-Based Contextualism** from **Relativism** using only truth-value judgments on static cases; both predict truth-value shifts. To separate them, one must appeal to data about *retraction* (whether a speaker must admit they spoke falsely) or *disagreement* (whether two assessors can genuinely contradict each other), which Node 5 attempts to capture.

  Summary: This taxonomy first divides views by whether practical factors affect truth or merely assertibility, then locates the source of variation in the subject, speaker, or assessor, and finally distinguishes whether stakes or salience drive the effect.
