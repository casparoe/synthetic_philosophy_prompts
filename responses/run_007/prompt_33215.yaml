answer: |-
  Here is the specification for an adequate theory of multipolar traps (Moloch dynamics). It is designed to filter out "competition I dislike" and isolate structural lock-ins where value is destroyed despite universal preference for cessation.

  ### I. Necessary Conditions (Non-Negotiable)
  *If a situation does not meet these criteria, it is not a Moloch trap.*

  1.  **The Nash Condition (Stability):** The current state must be a Nash Equilibrium (or Evolutionarily Stable Strategy). No single actor can unilaterally deviate to a better position without incurring a net loss.
      *   *Consideration:* If an actor can stop the behavior and benefit, it is not a trap; it is a choice. This rules out "habit" or "culture" as sufficient explanations.
  2.  **The Pareto Condition (Value Destruction):** There must exist a reachable alternative state that is Pareto-superior for *all* participating actors (or at least the vast majority of competitors).
      *   *Consideration:* This distinguishes traps from zero-sum conflict. In zero-sum, my gain is your loss. In a Moloch trap, we are all burning money to stand still. If there are clear winners who benefit from the race continuing, it is not a universal trap.
  3.  **The Enforcement Gap (Coordination Failure):** The theory must identify a specific barrier preventing binding agreements. (e.g., lack of a sovereign, detection lag, verification costs, or incentive to defect).
      *   *Consideration:* Without this, the Coase Theorem suggests actors should bargain their way out. The theory must explain why bargaining fails.
  4.  **Intervention Specificity:** The theory must predict which interventions change the payoff structure vs. which merely shift the burden.
      *   *Consideration:* A valid theory must distinguish between *dissolving* the trap (changing incentives) and *suppressing* the symptoms (which often creates a black market or shifts the race elsewhere).

  ### II. Required Distinctions (Conceptual Hygiene)
  *The theory must not collapse these categories.*

  5.  **Trap vs. Conflict of Interest:**
      *   *Trap:* We both want to stop, but can't.
      *   *Conflict:* I want to stop, you want to continue because you are winning.
      *   *Consideration:* Lazy Moloch-talk conflates "I am losing" with "We are all losing."
  6.  **Bad Equilibrium vs. Chaotic Disequilibrium:**
      *   *Trap:* A stable, predictable sink (e.g., mutually assured destruction).
      *   *Chaos:* Unpredictable volatility with no stable strategy.
      *   *Consideration:* Moloch implies a systemic gravity pulling toward the bad state, not just randomness.
  7.  **Revealed Preference vs. Stated Preference:**
      *   *Requirement:* The theory must account for why actors claim to hate the race while participating. It must distinguish between *preference falsification* (social signaling) and *constraint* (structural coercion).
      *   *Consideration:* If actors say they hate grade inflation but secretly love the advantage it gives their kids, that is not a trap; that is hypocrisy.
  8.  **Positional vs. Absolute Goods:**
      *   *Requirement:* Must distinguish competition for rank (zero-sum by definition) vs. competition for resources (potentially positive-sum).
      *   *Consideration:* Races for status are inherently Moloch-prone; races for innovation are not necessarily so.

  ### III. Cases the Theory Must Handle
  *The theory must correctly classify these scenarios.*

  9.  **The Arms Race (Classic):** Two nations spending GDP on weapons that cancel out. (Must classify as **Trap**).
  10. **The Commons Depletion:** Fishermen overfishing until collapse. (Must classify as **Trap**).
  11. **The Positional Race:** Credential inflation where degrees become mandatory but teach no skills. (Must classify as **Trap**).
  12. **The Safety-Cutting Race:** AI labs skipping alignment to deploy first. (Must classify as **Trap** *only if* safety is a public good all labs value more than first-mover advantage).
  13. **The Innovation Race (The Misleading Case):** Companies racing to cure cancer.
      *   *Classification:* **Not a Trap.**
      *   *Consideration:* This is positive-sum competition. Even if losers go bankrupt, society gains the cure. The "race" metaphor misleads here because value is created, not destroyed. A rigorous theory must not label all speed/competition as Moloch.

  ### IV. Theoretical Consistency (No Contradictions)
  *The theory cannot violate these established results.*

  14. **Consistency with Nash Equilibrium:** Cannot claim actors are "irrational" for staying in the trap if the payoff matrix dictates defection is the dominant strategy.
  15. **Consistency with Transaction Cost Economics:** Cannot propose coordination solutions that ignore the cost of organizing/enforcing the agreement.
  16. **Consistency with Evolutionary Dynamics:** If the actors are firms or genes, the theory must acknowledge that entities that *don't* play the race may be selected out of existence (survival of the fit, not the good).

  ### V. Incompatibilities & Tensions
  *Subsets of requirements that may be jointly unsatisfiable.*

  17. **The Value Ontology Problem (Non-Negotiable Tension):**
      *   *Conflict:* To satisfy the **Pareto Condition**, you need an objective metric of "value" or "utility" to prove everyone is worse off. However, **Revealed Preference** (standard economics) says utility is defined by what people choose.
      *   *Result:* You cannot simultaneously hold strict Revealed Preference theory *and* claim people are trapped in a state they choose.
      *   *Resolution:* The theory must adopt a **Multi-Level Selection** or **Principal-Agent** framework (e.g., "The CEO is trapped," not "The Corporation is trapped," or "Humanity is trapped," not "The Individual is trapped"). You must specify *which agent's* utility is being optimized.
  18. **Global vs. Local Badness:**
      *   *Conflict:* A state might be Pareto-inferior for the competitors but Pareto-superior for society (e.g., price wars hurt firms but help consumers).
      *   *Result:* The theory must specify the *boundary of the system*. A "Moloch trap for CEOs" might be "Healthy Competition for Voters."

  ### VI. The Killer Requirement
  *The single criterion that kills 90% of lazy usage.*

  **The Counterfactual Consensus Test:**
  > *Can you identify a specific, enforceable agreement that **every single competitor** would sign right now if they could bind everyone else, which would make every single one of them objectively better off by their own internal metrics?*

  *   **Why it kills lazy versions:**
      *   If the answer is "No, because I want to beat my rival," it's **Zero-Sum Conflict**, not Moloch.
      *   If the answer is "No, because I actually like working 80 hours," it's **Preference**, not a Trap.
      *   If the answer is "Yes, but we can't enforce it," **only then** is it a Moloch trap.

  Most "Moloch" complaints fail this because the complainer wants *others* to stop competing so *they* can win, or because the "bad outcome" is only bad from an outsider's moral framework, not the participants' utility functions.
