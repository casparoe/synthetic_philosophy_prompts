answer: |-
  # Decision Tree: The Standing to Blame

  ```text
  START: Is a correct moral judgment sufficient for standing to blame?
  │
  ├── YES ──────────────────────────────────────────────────────────────────────┐
  │   (Facts about the blamer cannot defeat standing derived from truth)        │
  │   ▼                                                                         │
  │   LEAF 1: MORAL JUDGMENT UNIVERSALISM                                       │
  │   Awkward Commitment: A morally monstrous agent (e.g., a genocidaire)       │
  │   retains the standing to correctly blame a minor thief for stealing.       │
  │                                                                             │
  └── NO ───────────────────────────────────────────────────────────────────────┘
      (Standing is defeasible based on facts about the blamer)
      │
      ▼
      NODE A: What is the primary source of the defeating factor?
      │
      ├── PATH 1: THE BLAMER'S MORAL RECORD ────────────────────────────────────┐
      │   (Standing is lost due to the blamer's own conduct/implication)        │
      │   ▼                                                                     │
      │   NODE B: Which features of the moral record defeat standing?           │
      │   │                                                                     │
      │   ├── Both Hypocrisy AND Complicity defeat standing                     │
      │   │   ▼                                                                 │
      │   │   LEAF 2: COMBINED MORAL RECORD VIEW                                │
      │   │   Awkward Commitment: A reformed hypocrite who remains structurally │
      │   │   complicit in the wrong is silenced, even if their criticism is    │
      │   │   morally urgent.                                                   │
      │   │                                                                     │
      │   ├── Only Hypocrisy defeats standing (Complicity does not)             │
      │   │   ▼                                                                 │
      │   │   LEAF 3: HYPOCRISY ACCOUNT                                         │
      │   │   Awkward Commitment: A co-conspirator in a fraud who has never     │
      │   │   lied before retains standing to blame their partner for lying.    │
      │   │                                                                     │
      │   └── Only Complicity defeats standing (Hypocrisy does not)             │
      │       ▼                                                                 │
      │       LEAF 4: COMPLICITY ACCOUNT                                        │
      │       Awkward Commitment: A serial offender uninvolved in this specific │
      │       wrong retains standing to blame a pristine agent for committing   │
      │       it.                                                               │
      │                                                                         │
      └── PATH 2: THE BLAMER'S RELATIONSHIPS ───────────────────────────────────┐
          (Standing is lost due to relational position, regardless of record)   │
          ▼                                                                     │
          NODE C: Which relationship is constitutive of standing?               │
          │                                                                     │
          ├── Relationship to the VICTIM                                        │
          │   ▼                                                                 │
          │   LEAF 5: VICTIM-CENTERED VIEW                                      │
          │   Awkward Commitment: Bystanders lack standing to blame perpetrators│
          │   of public or structural wrongs where no single victim is          │
          │   identifiable or empowered.                                        │
          │                                                                     │
          ├── Relationship to the WRONGDOER                                     │
          │   ▼                                                                 │
          │   LEAF 6: WRONGDOER-RELATIVE VIEW (Unnamed)                         │
          │   Awkward Commitment: Strangers lack standing to blame wrongdoers   │
          │   unless they share a specific personal history or authority over   │
          │   them.                                                             │
          │                                                                     │
          └── Relationship to the MORAL COMMUNITY                               │
              ▼                                                                 │
              LEAF 7: COMMUNAL VIEW                                             │
              Awkward Commitment: Moral outsiders or those who renounce the     │
              community (e.g., hermits, exiles) lack standing to blame members  │
              even for egregious violations.                                    │
  ```

  ***

  ### I. Indistinguishable Pairs (Theoretical Underdetermination)

  This decision tree maps the **conditions** for standing, but it cannot distinguish between competing **foundations** for those conditions. The following pairs of views will land on the same leaf despite offering incompatible explanations:

  1.  **Fairness vs. Warrant Accounts (Leaf 3):** The tree identifies the *Hypocrisy Account*, but it cannot separate the view that hypocrisy defeats standing because it is *unfair* to blame (the fairness account) from the view that hypocrisy undermines the *warrant* to express blame (the warrant account).
  2.  **Authority vs. Participation Accounts (Leaf 7):** The tree identifies the *Communal View*, but it cannot separate the view that standing requires *authority* over the wrongdoer (granted by the community) from the view that standing requires active *participation* in shared normative practices.
  3.  **Rights vs. Prerogative Accounts (Leaf 5):** The tree identifies the *Victim-Centered View*, but it cannot distinguish whether the victim has an exclusive *right* to blame (excluding others) or merely a special *prerogative* (allowing others but privileging the victim).

  ### II. Unoccupied Logical Space & Diagnostic Notes

  While the tree maps logically possible combinations, several leaves are sparsely populated or theoretically unstable in the contemporary literature:

  1.  **Leaf 4 (Complicity Only):**
      *   **Status:** *Largely Unexplored.*
      *   **Diagnosis:** Most philosophers who focus on complicity (e.g., regarding structural injustice) also accept that hypocrisy defeats standing. Defending a view where hypocrisy *never* defeats standing, but complicity *does*, is difficult because hypocrisy is often viewed as a species of moral inconsistency that undermines the blamer's voice more directly than structural entanglement.
  2.  **Leaf 6 (Wrongdoer-Relative):**
      *   **Status:** *Unoccupied.*
      *   **Diagnosis:** *Unattractive/Incoherent.* A view where standing depends *solely* on the relation to the wrongdoer (e.g., "only friends may blame friends") struggles to explain why we have standing to blame strangers for public wrongs. It risks collapsing into a form of private authority that contradicts the public nature of moral norms.
  3.  **Hybrid Views (Excluded by Node A):**
      *   **Status:** *Occupied (but excluded by tree structure).*
      *   **Diagnosis:** Many prominent accounts (e.g., Bell 2013, Fritz 2017) are hybrid: they argue that standing can be defeated by *either* moral record *or* relational factors. This tree forces a choice at Node A for the sake of clarity, but the "true" logical space includes a branch for **"Both Record and Relationship can independently defeat standing."** This is likely the most defensible position, but it complicates the binary branching structure.
