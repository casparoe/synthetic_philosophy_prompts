  I am presenting a paper next month to a philosophy of mathematics colloquium. My thesis is that Skolem's paradox is not a mere technical curiosity but reveals a genuine philosophical difficulty: the concept of uncountability is model-relative, and this relativity cannot be eliminated by moving to second-order logic, because second-order quantifiers themselves admit of non-standard interpretations under Henkin semantics, while full second-order semantics simply presupposes the set-theoretic content that was supposed to be secured. The conclusion is that our set-theoretic language fails to determine a unique intended interpretation, and this should unsettle even the working mathematician's confidence that she knows what she is talking about when she talks about uncountable sets. The audience will be roughly two-thirds philosophers of mathematics — mostly structuralists sympathetic to model-theoretic arguments but wary of where they lead, plus a few Quineans — and one-third set theorists from the mathematics department who regard the whole discussion as a confusion between what is true in a model and what is true outright. Draft my Q&A prep sheet: the six or seven objections I am most likely to face, ordered by how damaging they are to my argument, phrased as members of this specific audience would actually phrase them, each with a two-minute reply and an honest note on where the reply is weakest. Include the question I am hoping nobody asks.
