      Your scepticism is well-founded. The Ulysses analogy, when transposed from individual psychology to constitutional theory, conceals a profound metaphysical ambiguity regarding collective agency. To reconstruct the implicit theories, we must distinguish between the institutional mechanics and the philosophical justification for their legitimacy.

      Strictly speaking, constitutional precommitment presupposes that 'the People' possesses a diachronic identity robust enough to sustain obligations across generations. This is the **Corporate Continuity Theory**. It treats the polity not as a shifting aggregate of individuals, but as a single corporate person existing through time. On this view, the founding generation and the present citizenry are not distinct agents; they are temporal phases of the same entity. This licences the Ulysses framing: the entity binds itself to protect its long-term rational interests against transient passions. However, this presupposes a realist metaphysics of collective identity that many liberal individualists reject. It risks reifying 'the People' into a mystic entity distinct from actual citizens.

      Alternatively, the practice may presuppose a **Tacit Consent Theory**. Here, the past does not bind the future directly. Rather, the present generation binds itself by consenting to the existing constitutional order. Precommitment devices are not chains forged by the dead, but rules the living choose to uphold. This preserves popular sovereignty but shifts the burden to explaining how consent is transmitted. It presupposes that remaining within the polity constitutes valid consent to its entrenched rules—a notion famously critiqued by Hume. If this theory holds, the Ulysses analogy is misleading; it is not a past self binding a future self, but a present self binding itself to a historical framework.

      A third possibility is that the practice presupposes no coherent theory of agency but rather manages a **Democratic Paradox**. This view, associated with thinkers like Colón-Ríos or Loughlin, suggests that constitutionalism inherently involves a contradiction: the people must be both constituent power (unbound, sovereign) and constituted power (bound, institutionalised). Precommitment devices do not solve the tension between past authority and present sovereignty; they institutionalise it. On this account, the Ulysses story is a legitimating myth, not a philosophical description. It obscures the political reality that entrenchment often represents one faction successfully restricting the agency of future rivals, rather than a unified 'self' exercising prudence.

      The tension you identify between popular sovereignty and entrenchment is not merely a stretched metaphor; it is a structural fault line. If authority derives solely from the present people, no past provision can be strictly unamendable. If eternity clauses are legitimate, sovereignty must be alienable or divisible. The standard story often slides between these positions without acknowledgement.

      Consequently, the Ulysses framing is arguably a category error that distorts more than it illuminates. In the individual case, the binding mechanism (the rope) is external to the will but authorised by the prior will. In the constitutional case, the binding mechanism (the law) is created by the prior will but enforced by state coercion against the present will. The disanalogy lies in the plurality of agents. An individual has a unified psychology; a polity has competing interests. When a constitution entrenches a right, it is rarely 'the people' binding 'the people'; it is often a specific majority binding future majorities, or a judicial elite binding the legislature.

      Ultimately, the institutional design is philosophically underdetermined. Supermajority requirements and eternity clauses are compatible with Corporate Continuity, Tacit Consent, or the acceptance of Democratic Paradox. The practice does not dictate the theory. However, if one insists on the Ulysses analogy, one must accept the realist baggage of a trans-temporal collective agent. If one rejects that metaphysics, one must admit that constitutional precommitment is not self-binding, but rather a form of inter-generational power struggle legitimised by the fiction of collective unity. The standard story hangs together only if one ignores the ontological status of 'the People'.

