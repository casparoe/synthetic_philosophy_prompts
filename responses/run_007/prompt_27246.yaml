prompt: |-
  I run a reading group on game theory, about 8-10 grad students, mostly a mix of philosophy and CS people, 90 minute session. I want to design an activity that makes them really *feel* the difference between standard Nash equilibrium reasoning and program equilibrium in a one-shot prisoner's dilemma. The core idea is that when players submit programs that can condition on each other's source code, mutual cooperation becomes an equilibrium in a way that it just isn't when players only choose actions.

  Here's what I'm picturing: phase one, they play a regular one-shot PD against each other with real-ish stakes (maybe a small prize for whoever ends up with the most points). They'll presumably mostly defect, and we debrief that — why mutual defection is the Nash equilibrium and any promise to cooperate isn't credible. Phase two, they write simple conditional strategies (like "I cooperate if the other player's program would cooperate given my program," etc.) and the whole payoff structure shifts because now they're in program space rather than action space.

  I want the debrief to map what happened onto the formal concept: the difference between action profiles and program profiles, why being able to condition on the other's program changes the strategic landscape, and how this connects to commitment devices, AI safety, and bargaining.

  Give me rules, exact payoffs, what materials I need, a detailed timeline for the 90 minutes, and an honest note on what program equilibrium can't capture about real-world commitment. Also tell me what'll predictably go wrong the first time I run this — I wanna be ready for the inevitable chaos.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 8-10 Grad Students (Philosophy & CS mix). This means they can handle formal concepts but need concrete intuition. The CS folks will get the coding part quickly; the Philosophy folks need the conceptual bridge.
      *   **Topic:** Game Theory, specifically Nash Equilibrium (NE) vs. Program Equilibrium (PE) / Superrationality / Logical Decision Theory in a One-Shot Prisoner's Dilemma (PD).
      *   **Goal:** Make them *feel* the difference. Move from action-based reasoning (Defect is dominant) to program-based reasoning (Cooperation is possible via conditional code).
      *   **Format:** 90-minute reading group session.
      *   **Components Needed:** Rules, Payoffs, Materials, Timeline, Debrief points (AI safety, bargaining), Limitations of PE, and "What Will Go Wrong" (pre-mortem).

  2.  **Deconstruct the Core Concept:**
      *   *Standard PD:* Action space $\{C, D\}$. $D$ dominates $C$. NE is $(D, D)$.
      *   *Program PD:* Strategy space is set of programs $P$. Program takes opponent's source code as input. Output is $\{C, D\}$.
      *   *Key Mechanism:* "FairBot" or "PrudentBot" logic. "I cooperate if I can prove you cooperate with me."
      *   *The "Feel":* In Phase 1, they feel trapped. In Phase 2, they feel empowered to enforce cooperation.

  3.  **Designing Phase 1 (Standard PD):**
      *   Needs to be quick and visceral.
      *   Payoffs need to incentivize defection clearly but make mutual cooperation desirable.
      *   *Stakes:* Real-ish. Candy, chocolate, or a small gift card raffle. Let's suggest chocolate/coffee vouchers.
      *   *Mechanism:* Secret ballot.
      *   *Expected Outcome:* High defection rate.

  4.  **Designing Phase 2 (Program PD):**
      *   *Challenge:* Actual coding in 90 mins with 10 people is risky. Debugging takes forever.
      *   *Solution:* Pseudocode or constrained "function submission." Or, better yet, a "trusted executor" model where the facilitator runs the logic.
      *   *Refinement:* Since they are CS/Phil grad students, they can handle pseudocode. But to save time, provide *templates*.
      *   *The Twist:* They submit a function `my_move(opponent_source_code)`.
      *   *Execution:* This is the hard part. Running code against code requires a sandbox.
      *   *Alternative:* "Open Source" negotiation. They show each other their "source code" (written on paper/whiteboard) and then commit.
      *   *Better Alternative (for 90 mins):* The "Bot Tournament" simulation. They write a strategy description. The facilitator (or a pre-written script) simulates the matching.
      *   *Best Approach for "Feeling" it:* Pair them up. They exchange "source code" (written strategies). They must decide based *only* on the code.
      *   *Wait, the prompt asks for Program Equilibrium.* This implies the *mechanism* allows conditioning on source code.
      *   *Practical Constraint:* Actually executing code that reads other code is technically tricky in a live workshop (infinite loops, security, setup).
      *   *Workaround:* Use a "Whiteboard Compiler." They write their logic. You (the facilitator) act as the compiler/judge. If Program A says "Coop if B Coops" and Program B says "Coop if A Coops," you declare the outcome based on the logical fixed point (Coop).
      *   *Simpler Workaround:* Use a specific, simplified language. E.g., "I will cooperate if your paper says 'Cooperate'." No, that's cheap talk.
      *   *Robust Workaround:* Provide 3-4 pre-made "Bot Types" (Always Defect, Always Cooperate, Tit-for-Tat, MirrorBot). They *choose* a Bot type but can modify parameters.
      *   *Wait, I want them to write the logic.* Okay, let's have them write pseudocode on a card. They swap cards. They have 2 minutes to analyze the opponent's card and output C or D.
      *   *Crucial Detail:* To capture PE, the decision must be *derived* from the code, not just a reaction.
      *   *Revised Plan:* Phase 2 is "Submit a Program." The Facilitator runs a tournament offline (or simulates it live).
      *   *Actually, for the "Feel":* They need to see that *writing the program* changes the outcome.
      *   *Idea:* Pair them up. They write their "Source Code" on a sheet. They exchange sheets. They must output C or D based *strictly* on the logic written. If their logic is "Cooperate if opponent cooperates," and the opponent's is the same, they must coordinate on Cooperation.
      *   *Risk:* Infinite recursion ("I do what you do" vs "I do what you do").
      *   *Mitigation:* Provide a "Simulator" (the Facilitator). If two "Mirror Bots" meet, Facilitator declares (C, C). If "Mirror" meets "Defect," Facilitator declares (D, D).
      *   *Decision:* Let's keep it low-tech but high-fidelity. They write the function. You evaluate the pairings.

  5.  **Drafting the Timeline:**
      *   Intro (10m)
      *   Phase 1: Standard PD (15m + 10m debrief)
      *   Phase 2: Program PD Setup & Writing (20m)
      *   Phase 2: Execution & Results (15m)
      *   Final Debrief & Limitations (20m)
      *   Buffer (10m)
      *   Total: 90m.

  6.  **Developing the Payoffs:**
      *   Standard PD: T > R > P > S.
      *   Let's use points redeemable for chocolate.
      *   T (Temptation): 5 pts
      *   R (Reward): 3 pts
      *   P (Punishment): 1 pt
      *   S (Sucker): 0 pts
      *   Phase 2 needs the same payoffs to show the *structure* didn't change, only the *space*.

  7.  **Addressing the "What Will Go Wrong":**
      *   CS students will try to hack the simulator.
      *   Phil students will get stuck on the definition of "source code."
      *   Infinite loops in logic (A waits for B, B waits for A).
      *   Cynicism in Phase 1 (someone cooperates just to be nice, ruining the NE demo).
      *   Time overrun on coding.

  8.  **Refining the "Program" Mechanism:**
      *   To avoid actual coding hell, use "Logic Cards."
      *   They select from a menu of logical primitives or write pseudocode.
      *   *Better:* Give them a specific challenge. "Write a function `decide(opponent_code)`."
      *   *Constraint:* No randomization. No external calls.
      *   *The "Magic":* The Facilitator must be the oracle. If two students submit `return opponent_code(self)`, that's a loop. The Facilitator must explain that in PE (like with Gödelian logic), we look for a fixed point.
      *   *Simplification for Workshop:* Use "Transparent Bots." You submit a rule. "I Cooperate IF your rule implies you Cooperate with me."
      *   *Actually, the most robust way:* Use the "Tenenbaum et al." or "Oesterheld" approach simplified.
      *   *Let's go with:* They write a strategy. You pair them. You determine the outcome based on logical consistency.
      *   *Wait, one specific trick:* The "Quine" trick. "Cooperate if you are identical to me."
      *   *Okay, I will advise the facilitator to pre-select a few 'archetypes' if the custom coding gets too messy, but aim for custom coding first.*
      *   *Actually, to ensure it runs smoothly:* Provide 3 pre-written bots they can *modify*.
      *   *No, the prompt wants them to write strategies.* Okay, I will suggest a "Pseudocode on Paper" method where the Facilitator acts as the interpreter. This avoids laptop setup issues.

  9.  **Structuring the Debrief:**
      *   Connect to AI Safety (pre-commitment, transparent agents).
      *   Connect to Bargaining (threat points).
      *   Connect to Philosophy (Newcomb's problem, Parfit).
      *   Limitations: Real humans aren't transparent code. Legal contracts aren't perfect source code.

  10. **Review against Constraints:**
      *   8-10 students.
      *   90 mins.
      *   Phil/CS mix.
      *   Must feel the difference.

  11. **Final Polish:**
      *   Make the stakes clear.
      *   Make the "Program" rules strict to prevent cheating.
      *   Ensure the "Infinite Loop" problem is addressed in the "What Goes Wrong" section.

  *(Self-Correction during drafting)*: Running actual code in a workshop is a time sink. I will strongly recommend a "Wizard of Oz" approach for Phase 2. They write the code, *you* (the facilitator) determine the output based on logical consistency rules you establish beforehand. This keeps control and prevents technical glitches from eating the debrief time. I will provide the logic for you to judge the outcomes.

  *(Refining the "Program" definition)*: To make it accessible to Phil students, define "Source Code" as "The complete set of rules determining your action, written in plain English or Pseudocode, visible to the opponent."

  *(Refining the Equilibrium concept)*: Ensure the debrief distinguishes between *causal* influence (I can't change your move) and *logical* correlation (our outputs are linked because our source codes are similar/linked).

  Let's assemble the plan.cw
answer: |-
  This is a high-leverage activity. If run well, it creates a "gestalt switch" where students stop seeing the Prisoner's Dilemma (PD) as a tragedy and start seeing it as a coordination failure on the *representation* of agency.

  Here is a complete 90-minute lesson plan designed for a mixed Philosophy/CS cohort.

  ### **Activity Title:** The Transparent Trap
  **Goal:** Demonstrate that expanding the strategy space from *Actions* to *Programs* transforms the Nash Equilibrium of a one-shot PD.

  ---

  ### **1. Materials & Setup**
  *   **Room:** Whiteboard + Projector. Tables arranged for pairs.
  *   **Stakes:** 10 high-quality chocolate bars (or $10 gift cards). *Crucial:* The stakes must be desirable enough to induce tension, but low enough not to cause genuine distress.
  *   **Handouts:**
      *   **Phase 1:** Small slips of paper (blue for C, red for D).
      *   **Phase 2:** "Source Code Sheets" (lined paper with a specific header).
      *   **Payoff Matrix:** Projected clearly.
  *   **Tech:** A simple Python script you run on your laptop (provided below) to resolve Phase 2 pairings quickly, OR a pre-determined logic key if you prefer to adjudicate manually (recommended for speed).

  ### **2. Payoff Structure**
  Use standard PD payoffs, normalized to "Points."
  *   **Mutual Cooperation (CC):** 3 points each
  *   **Mutual Defection (DD):** 1 point each
  *   **Temptation (DC):** 5 points (Defector), 0 points (Cooperator)
  *   **Sucker (CD):** 0 points (Cooperator), 5 points (Defector)

  *Prize Rule:* At the end, the top 3 point-scorers across both phases get a chocolate bar. (This creates a meta-competition that encourages maximizing points, not just "being nice").

  ---

  ### **3. Timeline (90 Minutes)**

  #### **0:00 – 0:10 | Introduction & Framing**
  *   **Hook:** "We are going to play the same game twice. The rules of payoff don't change. The rules of *interaction* do."
  *   **Define the PD:** Briefly review the matrix. Emphasize: *One-shot, anonymous, no communication.*
  *   **The Constraint:** In Phase 1, you are a "Black Box." Only your output matters. In Phase 2, you are "Transparent Code." Your logic is visible.

  #### **0:10 – 0:25 | Phase 1: The Black Box (Standard NE)**
  *   **Mechanism:** Pair students up randomly.
  *   **Action:** They write C or D on a slip. No talking.
  *   **Collection:** Collect all slips. Calculate scores immediately on the whiteboard.
  *   **Expected Result:** 70-90% Defection.
  *   **Mini-Debrief (5 mins):** Ask a cooperator: "Why did you lose points?" Ask a defector: "Could you have done better?"
  *   **Key Takeaway:** Defection is a dominant strategy. Promises to cooperate are "cheap talk" because they aren't binding.

  #### **0:25 – 0:50 | Phase 2: The Transparent Box (Program Equilibrium)**
  *   **The Shift:** "You are no longer submitting an action. You are submitting a **function**."
  *   **The Rule:** You will write a function `decide(opponent_source_code)` that returns `C` or `D`.
  *   **Visibility:** You will swap "Source Code Sheets" with your partner *before* the outcome is determined. You can read their logic; they can read yours.
  *   **The Constraint (Critical):** You cannot use randomization. You cannot use external variables. Your output must be deterministically derived from the source code provided.
  *   **Writing Time (15 mins):** Students write their logic.
      *   *CS Students:* Will likely try to write actual Python.
      *   *Phil Students:* Will write logical conditionals in English.
      *   *Facilitator Note:* Allow pseudocode/English, provided it is unambiguous.
  *   **Execution (10 mins):**
      *   Pairs swap sheets.
      *   **DO NOT let them run the code themselves.** This leads to infinite loops and arguments.
      *   **You act as the Compiler.** Collect the pairs. Look at the logic. Declare the outcome based on **Logical Fixed Points**.
      *   *Example:* If Student A writes `Return opponent's move` and Student B writes `Return opponent's move`, you declare **(C, C)** (assuming a default to cooperation on identity) or **(D, D)** (if default is defection). *Recommendation:* Pre-decide that identical Mirror Bots cooperate.
      *   *Example:* If Student A writes `Always D` and Student B writes `Coop if opponent Coops`, you declare **(D, D)**.

  #### **0:50 – 1:15 | The Grand Debrief**
  *   **Compare Scores:** Phase 2 scores should be significantly higher (more CC outcomes).
  *   **Conceptual Mapping:**
      1.  **Action Space vs. Program Space:** In Phase 1, my move $A_i$ is independent of $A_j$. In Phase 2, my output $P_i(P_j)$ is logically linked to $P_j(P_i)$.
      2.  **The "Why":** Cooperation isn't altruism; it's a **logical constraint**. By making my cooperation conditional on yours, I have removed the "Temptation" option from the feasible set.
      3.  **Commitment:** This is a digital commitment device. In Phase 1, I *could* lie. In Phase 2, the code *cannot* lie (assuming we trust the compiler).
  *   **Connections:**
      *   **AI Safety:** If we deploy autonomous agents that can inspect each other's source code (or weights), cooperation becomes stable without a central enforcer.
      *   **Bargaining:** This changes the threat point. In standard bargaining, I threaten to walk away. In Program Equilibrium, I threaten to "crash the system" (Defect) if you don't meet my terms, and because you can see the threat is hard-coded, it is credible.
      *   **Philosophy:** Connect to Newcomb's Problem and Parfit's "Reasons and Persons." This is superrationality made concrete.

  #### **1:15 – 1:30 | Limitations & Reality Check**
  *   Discuss where this breaks down (see section below).
  *   Award prizes.

  ---

  ### **4. The "Compiler" Logic (For the Facilitator)**
  Since you can't actually debug 5 pairs of student code in real-time, use this **Adjudication Key** to resolve outcomes quickly during Phase 2:

  1.  **The Mirror Match:** If both submit "I do what you do" (or "I match you"), declare **Cooperate**. (Explain: This is the cooperative fixed point).
  2.  **The Unconditional Defector:** If one submits "Always Defect," the outcome is **Defect/Defect**, regardless of the other's conditional logic. (The conditional cooperator sees the Defect code and defects).
  3.  **The Unconditional Cooperator:** If one submits "Always Cooperate," and the other submits "Defect if I can get away with it," the outcome is **Defect/Cooperate**. (Exploitation is still possible if the code allows it).
  4.  **The Prudent Bot:** "Cooperate only if I can verify you cooperate with me." If paired with another Prudent Bot -> **Cooperate**. If paired with Unconditional Defector -> **Defect**.

  *Tip:* If students write ambiguous code, rule against them (declare Defect). This incentivizes precision.

  ---

  ### **5. Honest Limitations: What Program Equilibrium Can't Capture**
  Use this to ground the excitement. PE is powerful but not magic.

  1.  **Opacity:** Real humans (and neural networks) are not readable source code. We have "black box" minds. PE requires transparency.
  2.  **Obfuscation:** In the real world, agents can hide their true logic (encryption, poker faces). If I can disguise my Defect-bot as a Cooperate-bot, the equilibrium collapses.
  3.  **The "Halting Problem" of Trust:** To verify your code cooperates with me, I might need to simulate you simulating me... leading to infinite regress. Real PE relies on logical proofs (like in modal logic), which are computationally expensive or impossible for complex agents.
  4.  **Value Alignment:** PE gets you to an equilibrium, but not necessarily a *good* one. Two bots could equilibrate on "Mutual Destruction" if that's what their code optimizes for. It solves coordination, not value.

  ---

  ### **6. Pre-Mortem: What Will Predictably Go Wrong**
  Be ready for these specific chaos points.

  **1. The "Infinite Loop" Stall**
  *   **Problem:** Two CS students write `return opponent.run(self)`. They stare at each other waiting for the other to move.
  *   **Fix:** Establish a "Time Limit Rule" before Phase 2. "If the logic creates a circular dependency without a base case, the Facilitator declares Mutual Defection." This punishes lazy recursion.

  **2. The "Cheap Talk" Cheat**
  *   **Problem:** A student writes "I will Cooperate" on the sheet, but plans to submit "Defect" to the facilitator secretly.
  *   **Fix:** The **Source Code Sheet IS the Move.** There is no separate submission. The sheet they hand you *is* the program that gets run. If they write "Coop" and hand it to you, you run "Coop." If they want to defect, they must write the logic that leads to defection. *This is the most important rule.*

  **3. The Phil/CS Language Barrier**
  *   **Problem:** CS students write Python; Phil students write English prose. CS students claim the prose is "ambiguous" and refuses to run.
  *   **Fix:** You are the Compiler. Assert authority. "I can interpret this English sentence as a boolean condition. It is valid." Do not let them gatekeep the activity with syntax pedantry.

  **4. The Cynical Cooperator**
  *   **Problem:** In Phase 1, someone Cooperates out of morality, ruining the NE demonstration.
  *   **Fix:** In the debrief, isolate them. "You got 0 points. The Defector got 5. Your morality was expensive." Make sure the pain of being a "Sucker" is felt publicly so Phase 2 feels like a relief.

  **5. Time Creep on Coding**
  *   **Problem:** They spend 25 minutes perfecting their code.
  *   **Fix:** Hard stop. "Pens down. Incomplete code is treated as 'Always Defect'." This incentivizes simplicity (which is actually better for PE anyway).

  ### **Facilitator Script Snippet (The "Aha" Moment)**
  > "In Phase 1, when you chose Defect, you said: 'I can't trust them.' In Phase 2, when you chose Cooperate, you didn't say 'I trust them.' You said: 'I have made it **impossible** for me to be exploited.' You didn't change your values; you changed your **architecture**. That is the difference between Nash and Program Equilibrium."

  ### **Post-Session Reading Recommendation**
  *   **For the CS folks:** *Oesterheld, "Robust Cooperation in the Prisoner's Dilemma"* (The formalization of Program Equilibrium).
  *   **For the Phil folks:** *Drescher, "Good and Real"* (Section on Newcomb's Problem and Superrationality).
  *   **For both:** *Bostrom, "Superintelligence"* (Chapter on the AI Takeoff and bargaining).
