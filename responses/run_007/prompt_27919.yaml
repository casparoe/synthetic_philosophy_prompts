answer: |-
  In theory, lines are drawn in ink and light:
  To strike the blow is murder, pure and plain;
  To step aside and yield to coming night
  Is but to loose the rope, not bear the strain.
  Here nature kills, and man remains absolved,
  A witness to the breath that slips away.
  The problem sits, neatly here resolved,
  Where action ends, omission takes its sway.

  Yet in the room, the silence is a hum,
  I do not press, yet stop no other hand.
  The breath expires because I let it come,
  I chose the end, though I gave no command.
  If cause is chain, and I removed the link,
  I bear the weight of how I let her sink.
