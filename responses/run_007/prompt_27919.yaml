      *   **Structure:**
          *   **Octave (Lines 1-8):** Abstract view. Clean, principled, bright line, action vs. omission, moral agents vs. natural causes.
          *   **Volta (Line 9):** Shift to concrete case (parent watching ventilator turned off, hand not reaching but not stopping). Erosion of the distinction begins.
          *   **Sestet (Lines 9-14):** Explore the erosion without resolving. "Letting die" as something one *does*. Deliberate omission, foreseen outcome. Causal structure makes no metaphysical distinction.
          *   **Couplet (Lines 13-14):** Leave the reader inside the blur. Weight, not thesis.
      *   **Tone:** Accurate to philosophical literature (doctrine of doing vs. allowing, causation, intention) but accessible as poetry. Emotional weight (grief, guilt, ambiguity).
      *   **Context:** The user lost their daughter last autumn after a two-year illness. This requires extreme sensitivity, empathy, and respect. The poem must not be coldly academic; it must honor the lived experience.

