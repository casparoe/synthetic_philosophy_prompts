answer: |-
  You have correctly identified that the debate feels frozen, and your working theory is close to the mark. However, the disagreement is deeper than just "what counts as an explanation." It is a clash of **Bayesian priors**, **ontological commitments about the brain**, and **risk tolerance regarding normative implications**.

  Here is a diagnosis of the structure of the disagreement, followed by an honest assessment of what would actually constitute progress.

  ### 1. The Diagnosis: Three Layers of Disagreement

  The stalemate exists because the two sides are arguing on three different levels simultaneously, often conflating them.

  #### A. The Epistemological Layer (Your Hypothesis)
  You suggested the fight is about what counts as an explanation. More precisely, it is about **Inference to the Best Explanation (IBE)** in the absence of direct data.
  *   **The Adaptationist Prior:** Assumes natural selection is the dominant force shaping complex biological traits. Therefore, the *prior probability* that a complex psychological trait is an adaptation is high. A plausible functional story significantly boosts the posterior probability.
  *   **The Critic's Prior:** Assumes evolution is messy, constrained by physics, development, and history (phylogeny). Therefore, the *prior probability* that a trait is a byproduct (spandrel) or drift is significant. A plausible functional story does little to boost the posterior probability without independent evidence of design.

  **The Impasse:** When a critic says, "That's a just-so story," they mean, "Your likelihood ratio is low because your prior is too high." When an adaptationist says, "You demand impossible standards," they mean, "You are setting the prior for selection to near-zero, which is biologically unrealistic." They are doing the same math with different variables.

  #### B. The Ontological Layer (The Nature of the Mind)
  This is the substantive scientific disagreement that fuels the epistemological one.
  *   **Adaptationists (The Engineer's View):** View the brain as a collection of **domain-specific modules** (like a Swiss Army Knife). Each tool was forged for a specific problem in the Pleistocene. If you find a tool, you can infer the problem.
  *   **Critics (The Tinkerer's View):** View the brain as a **domain-general kludge** (like a tangled ball of yarn). Complex behaviors emerge from simple, general learning rules interacting with culture. If you find a pattern, it might be an emergent property, not a designed module.

  **The Impasse:** If the brain is modular, EP methods work. If the brain is general-purpose, EP methods are category errors. Neither side has definitively proven the architecture of the mind yet, so they talk past each other. The adaptationist points to visual illusions (evidence of modularity); the critic points to neuroplasticity (evidence of generality).

  #### C. The Normative Layer (Politics and Risk)
  You asked if politics is leaking in. The answer is yes, but it functions as a **risk assessment** rather than just ideology.
  *   **The Critic's Fear:** If we accept adaptationist stories for social traits (gender differences, hierarchy, violence), we risk the **Naturalistic Fallacy**—treating "what is" as "what ought to be." The cost of a False Positive (accepting a fake adaptation) is high because it can legitimize harmful status quos.
  *   **The Adaptationist's Fear:** If we reject adaptationist stories due to ideological discomfort, we commit the **Moralistic Fallacy**—treating "what ought to be" as "what is." The cost of a False Negative (rejecting a real adaptation) is high because it blinds us to human nature and prevents effective policy.

  **The Impasse:** The debate is frozen because both sides view the *other side's* error as catastrophic. Critics think adaptationists are dangerous; adaptationists think critics are obscurantists.

  ---

  ### 2. Why the Debate is Frozen

  The debate is stuck because **narrative plausibility has diminishing returns.**
  For the last 30 years, both sides have gotten better at telling stories. Adaptationists have refined their models of the Pleistocene; critics have refined their models of developmental constraints. But a better story is still just a story.

  As long as the evidence remains **circumstantial** (cross-cultural universals, logical fitness benefits), the Bayesian priors will dictate the conclusion. An adaptationist looks at a universal trait and sees selection; a critic looks at the same trait and sees shared developmental constraints.

  ### 3. What Would Count as Progress?

  Progress will not come from better arguments or philosophical distinctions. It will come from shifting the **locus of evidence** from *function* to *mechanism*.

  Here are four specific paths that would break the deadlock:

  #### A. The Mechanistic Turn (Neuroscience & Genetics)
  *   **The Shift:** Stop asking "What is this for?" and start asking "How is this built?"
  *   **Why it works:** If EP claims jealousy is a specific module, there should be specific neural circuitry or genetic markers associated with it that are distinct from general distress or anger.
  *   **Progress Condition:** If researchers identify a specific neural circuit that triggers jealousy *independent* of general emotional processing, the adaptationist wins. If jealousy is shown to be a composite of general threat detection + attachment systems, the critic wins.
  *   **Current Status:** We are moving this way (e.g., behavioral genetics), but it is slow.

  #### B. The Comparative Method (Phylogeny)
  *   **The Shift:** Stop focusing solely on humans and the Pleistocene. Look at the primate order.
  *   **Why it works:** If a trait (e.g., coalitional aggression) is found in chimps, bonobos, and humans, it likely predates the Pleistocene. If it is unique to humans, it might be cultural or a recent byproduct.
  *   **Progress Condition:** Mapping psychological traits onto a phylogenetic tree allows us to date the trait more accurately than guessing about the Stone Age.
  *   **Current Status:** Promising, but difficult to measure "psychology" in other animals without anthropomorphizing.

  #### C. From Origin to Maintenance (Evolutionary Maintenance)
  *   **The Shift:** Stop asking "How did this evolve?" (Origin) and ask "Why hasn't selection removed this?" (Maintenance).
  *   **Why it works:** It is easier to test current fitness costs/benefits than ancestral ones. Even if depression is a byproduct, why does it persist? Is it a costly signal? A negotiation tactic? Or does it have low heritability?
  *   **Progress Condition:** This sidesteps the "Just-So" history problem. You can measure current reproductive success correlates now.
  *   **Current Status:** This is where the most fruitful work is happening (e.g., life-history theory).

  #### D. Formal Modeling over Narrative
  *   **The Shift:** Require mathematical evolutionary game theory models, not verbal stories.
  *   **Why it works:** A verbal story can explain anything. A mathematical model shows the *conditions* under which a trait evolves. If the parameters required for the trait to evolve are unrealistic (e.g., group size too small, mutation rate too high), the hypothesis is falsified.
  *   **Progress Condition:** When an adaptationist claim is rejected because the math doesn't hold, that is progress.
  *   **Current Status:** Increasing, but many EP papers still rely on verbal logic.

  ### Summary Diagnosis

  You are right that the core is epistemological, but specifically, it is a disagreement about **Bayesian priors regarding the power of selection vs. constraint.**

  **The Honest Answer:**
  The debate will not end with one side "winning." The human mind is likely a mosaic: some parts are specialized adaptations (vision, language acquisition), and some are byproducts or general-purpose learning mechanisms (perhaps much of our political ideology).

  Progress will occur when the field abandons the **Pan-Adaptationism** vs. **Blank Slate** dichotomy. The "new method" required is **integration**: using neuroscience to find the mechanism, phylogeny to date the trait, and modeling to test the evolutionary stability. Until EP moves from "telling stories about the Pleistocene" to "testing mechanisms in the present," the freeze will continue.

  **Recommendation:** If you want to read work that bypasses this stalemate, look for **Evolutionary Cognitive Neuroscience** or **Life History Theory**. These fields tend to be less concerned with labeling traits "adaptations" and more concerned with mapping the trade-offs and mechanisms that exist *now*.
