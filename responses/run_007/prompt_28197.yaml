      *   **Goal:** Construct a thought experiment isolating the difference between AI *alignment* and AI *control*.
      *   **Scenario 1 (Control Works, Alignment Fails):** AI is misaligned (goals diverge), but control measures (monitoring, restrictions, HITL) prevent harm indefinitely. Alignment techniques (RLHF, etc.) alone would fail.
