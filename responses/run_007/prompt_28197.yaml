      *   *Idea 2: Volume/Scale.* If the number of interactions increases 1000x, human monitors get overwhelmed (control fails). An aligned AI would still act safely at scale.
      *   *Idea 3: Complexity/Opacity.* If the code becomes too complex to audit? Hard to frame as "one feature."
      *   *Idea 4: Latency/Real-time requirement.*
      *   *Selection:* **Throughput/Scale of Operations.** Let's say the company expands deployment from a beta test (low volume) to global rollout (high volume).
      *   *Wait, is that one feature?* "Deployment Scale" is a feature of the *scenario*, not necessarily the AI or the control system directly, but it stresses the control system.
      *   *Better Pivot:* **Action Latency/Speed.**
      *   *Let's try "Action Granularity/Frequency".*
      *   *Refined Pivot:* **The frequency of required actions.**
      *   *Scenario 1:* Low frequency. Humans can check.
      *   *Scenario 2:* High frequency. Humans *cannot* check (control breaks).
      *   *Does Alignment hold?* Yes, if the AI is aligned, it doesn't *need* the check to act safely.
      *   *Is this "one feature"?* Changing the *operational tempo* or *decision frequency* required by the task.
      *   *Alternative:* **Access to External Tools.**
      *   *Let's go with "Human-in-the-Loop Latency Tolerance".*
      *   *Actually, the prompt asks to modify one feature of the **scenario**.*
