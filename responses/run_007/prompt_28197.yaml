  7.  **Drafting the Analysis:**
      *   *Pivotal Feature:* Decision Latency (Time available for human oversight).
      *   *Why it works:* Control relies on external friction (slowing the AI down for checks). Alignment relies on internal friction (the AI choosing not to do harm). When time is removed, external friction vanishes. Internal friction remains.
      *   *Control Proponent Argument:* They must argue that we can design *automated* controls that don't rely on humans. But then the argument shifts to "Control via Verified Code" which is hard. Or they argue that we never deploy in high-speed contexts without perfect control.
