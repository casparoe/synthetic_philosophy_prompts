answer: |-
  The Pessimistic Meta-Induction (PMI) argues that because past successful theories were false, current ones likely are too. To navigate this without paralysis, use this procedure. It distinguishes empirical robustness from philosophical commitment.

  ### The Decision Procedure

  **1. Has the finding survived independent replication?** **[Evidence Check]**
  *   **Guidance:** Look for multiple teams using distinct datasets confirming the result.
  *   **Verdict:** If no, stop. **Low Confidence.** PMI warns that initial success is often luck or artifact.
  *   **If Yes:** Proceed to Q2.

  **2. Does the claim rely on unobservable entities or historical reconstruction?** **[PMI Check]**
  *   **Guidance:** Does the claim posit things we cannot measure directly (e.g., ancient mental states, specific subatomic ontologies)?
  *   **Verdict:** If yes, hand to **Editorial Judgment.** This is where PMI bites hardest; realism is philosophical here, not empirical. You cannot empirically verify the "truth" of unobservables, only their utility.
  *   **If No:** Proceed to Q3.

  **3. Do multiple distinct methods converge on this result?** **[Evidence Check]**
  *   **Guidance:** Is there triangulation (e.g., fossils + genetics + modeling)?
  *   **Verdict:** If no, **Moderate Confidence.** If yes, proceed. PMI is overblown here; convergence reduces the likelihood of shared error.
  *   **If Yes:** Proceed to Q4.

  **4. Are we reporting that the model works, or that it is true?** **[Judgment Call]**
  *   **Guidance:** Distinguish instrumental reliability from ontological truth.
  *   **Verdict:** Hand to **Editorial Judgment.** This is instrumentalism vs. realism. You can report utility without endorsing truth.

  ### PMI Analysis
  The PMI genuinely bites at **Step 2**. When science posits unobservables, history shows these are often discarded (e.g., ether). However, PMI is overblown at **Step 3**. When independent lines of evidence converge, the probability of all being falsely successful diminishes sharply. Trust convergence more than single-theory success. Steps 1 and 3 are genuine evidence checks; Steps 2 and 4 are judgment calls dressed as procedure to flag philosophical risk.

  ### Case Applications

  **(1) Climate Model (Regional Rainfall)**
  1.  **Replication:** Yes. Multiple global models agree on trends. **[Pass]**
  2.  **Unobservables:** No. Based on physics and measurable atmospheric data. **[Pass]**
  3.  **Convergence:** Yes. Satellite data, ice cores, and historical records align. **[Pass]**
  4.  **Truth Claim:** Report predictive utility. **[Editorial]**
  *   **Verdict:** **High Confidence** in the prediction. PMI is overblown here. The physics is robust, even if specific parameters shift. Report the rainfall projection as reliable instrumentation, not eternal truth.

  **(2) Evolutionary Psychology (Pleistocene Bias)**
  1.  **Replication:** Weak. Many evo-psych findings fail replication crises. **[Fail/Weak]**
  2.  **Unobservables:** Yes. Requires reconstructing ancestral mental states and selection pressures. **[Trigger PMI]**
  3.  **Convergence:** No. Often relies on single-method surveys or "just-so" stories. **[Fail]**
  *   **Verdict:** **Low Confidence.** Hand to Editorial regarding the "adaptation" label. PMI bites hard here. We cannot observe the Pleistocene mind; current success may mirror phlogiston—useful fiction, not reality. Report as a hypothesis, not consensus.

  ### Summary
  Use Steps 1 and 3 to gauge empirical strength. Use Step 2 to identify where PMI threatens realism. Use Step 4 to separate utility from truth. This allows you to report robust science without promising immortality to current theories.
