  2.  **Deconstruct the Summary & Evaluate Against Literature:**

      *   *Point 1: SCA Definition.* "Object is disposed to M in C just in case, if it were in C, it would M."
          *   *Verdict:* Accurate representation of the Ryle/Carnap era SCA. Philosophers accept this as the starting point.

      *   *Point 2 & 3: Finks.* "Fink removes disposition when trigger arrives... live wire... conditional false even though disposed."
