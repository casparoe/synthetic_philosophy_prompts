  **Credence:** 61%

  I model moral permissibility here as a **conjunctive probability**: for the trade to be permissible, three independent conditions must generally hold. If any one fails decisively, the act becomes impermissible. My credence is the product of the probabilities that each condition is satisfied.

  ### Decomposition

  | Term | Probability ($P$) | One-line Justification |
  | :--- | :--- | :--- |
  | **1. Commensurability** (Shared Scale) | 0.90 | Democratic negotiation presupposes that distinct moral goods can be roughly weighed against one another for collective decision-making. |
  | **2. Complicity** (Deontological Constraint) | 0.75 | Most non-absolutist ethical frameworks permit minor moral costs to prevent major harms, but absolutist constraints remain a significant risk. |
  | **3. Integrity** (Systemic Norms) | 0.90 | Open vote-trading is a standard legislative tool; corruption arises from secrecy or bribery, not from explicit policy negotiation. |

  ### Combination Logic
  $$P(\text{Permissible}) = P(\text{Commensurability}) \times P(\text{Complicity}) \times P(\text{Integrity})$$
  $$0.61 \approx 0.90 \times 0.75 \times 0.90$$

  ### Sensitivity Analysis: "How much rides on each term?"
  To determine how much of my uncertainty rides on each factor, I calculate how much the final credence would increase if that specific objection were fully resolved (set to 1.0).

  *   **Commensurability:** Resolving this raises the credence to 68% (+7 points). **~20% of the uncertainty rides here.**
  *   **Integrity:** Resolving this raises the credence to 68% (+7 points). **~20% of the uncertainty rides here.**
  *   **Complicity:** Resolving this raises the credence to 81% (+20 points). **~60% of the uncertainty rides here.**

  ### Most Sensitive Term
  **Complicity (Deontological Constraint).**
  My credence is most sensitive to whether Priya and Sam view voting for a "mildly wrong" policy as an intrinsic moral violation that cannot be offset by consequences. If either legislator holds a "clean hands" deontological view, the probability of permissibility collapses toward zero regardless of the gains.

  ### Evidence or Argument to Move It
  Theoretical work on **"political dirty hands"** (e.g., Walzer, Machiavelli) that successfully legitimizes complicity in minor wrongs as a necessary cost of public office would move this term most. Conversely, empirical evidence showing that voters systematically punish legislators who compromise on core values (suggesting the "mild wrong" is actually electorally catastrophic) would lower it.
