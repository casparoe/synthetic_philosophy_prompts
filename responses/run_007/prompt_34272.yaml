      *   *Key Insight 2:* The "Observer" aspect in the Deer case suggests an *Epistemic* condition. The good must be *known* to justify the pain.

      *   *Refined Principles:*
          1.  **Agency/Consent:** Suffering imposed without choice is suspect.
          2.  **Participatory Good:** The sufferer must benefit, not just third parties.
          3.  **Epistemic Access:** The reason must be knowable/observable.
