          *   *Free Will vs. Leukemia:* Free will harm is okay because the *perpetrator* has rights. Leukemia is not okay because it's "natural evil" (no perpetrator to blame, falls on God).
          *   *Scale:* This acts as a multiplier. Even if individual cases were borderline, the sum tips the scale.

