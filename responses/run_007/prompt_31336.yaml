prompt: |-
  Someone with bipolar disorder, while stable, signs a psychiatric advance directive — sometimes called a Ulysses contract — saying that if they're ever manic and refusing treatment, they can be hospitalized and medicated against their will. Clinicians and courts mostly honor it. But the same legal system won't let a person sign a contract binding their future self in a lot of other ways: you can't sell yourself into servitude, can't make an irrevocable promise to give away your future earnings, can't even contract away your right to change your mind about a marriage. So the practice seems to be that a past self can override a future self's refusal of treatment, but not a future self's other choices. What theory of rationality and personal identity does that practice presuppose? Does it secretly depend on Parfit's hitchhiker idea — that it can be rational to make yourself unable to back out, or even to make your later self irrational — or does it instead presuppose that the manic self's refusal isn't really an expression of the person's will, or that the manic self isn't really them in the relevant sense? Reconstruct the implicit theory, say where the practice is underdetermined, and tell me what would have to change if you took seriously Parfit's line that personal identity is just psychological continuity in degrees rather than a deep further fact.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Scenario:** A person with bipolar disorder signs a Ulysses contract (psychiatric advance directive) while stable, authorizing involuntary treatment during future mania.
      *   **Legal Context:** Courts/clinicians honor this, *but* generally reject other binding future contracts (servitude, irrevocable earnings, marriage vows).
      *   **The Tension:** Why is overriding a future self's refusal okay here but not elsewhere?
      *   **Questions to Answer:**
          1.  What theory of rationality and personal identity does this practice presuppose?
          2.  Does it rely on Parfit's "hitchhiker" idea (precommitment/rational irrationality)?
          3.  Or does it rely on the idea that the manic self isn't expressing the "true will" or isn't "really them"?
          4.  Reconstruct the implicit theory.
          5.  Identify where the practice is underdetermined.
          6.  Analyze what would change if we took Parfit's reductionist view of personal identity seriously (psychological continuity in degrees).

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Ulysses Contracts:* Named after Odysseus tying himself to the mast. It's about precommitment.
      *   *Legal/Contract Law:* Generally, you can't enslave yourself (13th Amendment, public policy). You can't contract away bodily autonomy permanently. But medical consent is specific.
      *   *Personal Identity:*
          *   *Lockean:* Psychological continuity.
          *   *Parfit:* Reductionist view (Relation R). Identity isn't what matters; survival/continuity is.
          *   *Competency/Capacity:* The law distinguishes between *capable* and *incapable* agents.
      *   *Rationality:*
          *   *Standard:* Maximize utility based on current preferences.
          *   *Precommitment:* Sometimes rational to restrict future choices to avoid weakness of will or cognitive distortion.
      *   *The "True Self" View:* Mania is a disease state that distorts the "real" person. The stable self is the "authentic" one.

  3.  **Addressing Question 1 & 3: The Implicit Theory (Competency vs. Identity):**

      *   The legal system doesn't usually talk about "personal identity" in the metaphysical sense. It talks about *capacity*.
      *   *Implicit Theory:* The "Stable Self" is the competent agent. The "Manic Self" is an incapacitated agent.
      *   *Rationality:* It presupposes that preferences formed during incapacity (mania) are defective. Preferences formed during capacity (stability) are authoritative.
      *   *Identity:* It leans towards a "True Self" model. The mania is an alien intrusion, not the "real" person. Therefore, honoring the advance directive isn't overriding the *person*, it's protecting the *person* from the *disease*.
      *   *Contrast with Servitude:* Selling yourself into servitude is seen as a competent choice that destroys future competency. The law says "You can't choose to stop being an agent." In the bipolar case, the law says "You *are* no longer an agent (temporarily), so we follow your prior agent instructions."

  4.  **Addressing Question 2: Parfit's Hitchhiker:**

      *   Parfit's Hitchhiker (from *Reasons and Persons*): You promise to pay a driver later, but once you reach town, you have no incentive to pay. If you are known to be irrational (or bound), the driver picks you up. It can be rational to make yourself irrational/unable to back out.
      *   *Does the legal practice depend on this?* Not exactly. The Hitchhiker argument justifies *why* the agent signs the contract (to get better outcomes). But the *legal enforcement* relies more on the *status* of the future self (incapacitated) rather than the strategic rationality of precommitment.
      *   *Nuance:* If the manic self were considered *competent but just different*, the Hitchhiker logic would be the only justification (binding future choice for past benefit). But since the manic self is considered *incompetent*, the justification is paternalistic/protectionist, not just strategic precommitment.

  5.  **Addressing Question 4: Underdetermination:**

      *   Where is the line blurry?
      *   *Degree of Mania:* Not all mania renders one legally incompetent. When does the "true self" vanish?
      *   *Recovery:* If the person recovers and regrets the treatment, was the directive valid?
      *   *Content of Directive:* Can they authorize *any* treatment (e.g., ECT, experimental drugs) or only standard care?
      *   *Identity Continuity:* If the mania brings about genuine creative insights or preferences that persist, are those ignored unfairly?

  6.  **Addressing Question 5: Parfit's Reductionist Challenge:**

      *   *Parfit's View:* Personal identity is just psychological connectedness (memories, character, intentions). It comes in degrees. There is no "further fact" of identity.
      *   *Implication:* The "Stable Self" and "Manic Self" are not the *same* person in a deep sense, nor are they *different* people. They are related by varying degrees of Relation R.
      *   *Impact on Ulysses Contracts:*
          *   If identity is degrees, the authority of the past self over the future self weakens. Why should Past Self (connectedness 0.8) dictate to Future Self (connectedness 0.8 but different preferences)?
          *   It shifts the focus from "Authentic Will" to "Best Interests" or "Weighted Preferences."
          *   It might require a more nuanced approach: Instead of "Follow the directive absolutely," it becomes "Weigh the stable preferences against the current experienced welfare of the current psychological stage."
          *   It challenges the binary (Competent/Incompetent). It suggests a spectrum of authority.
          *   It might make Ulysses contracts *harder* to justify metaphysically, but perhaps *easier* to justify pragmatically (as caring for a closely related future being).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the paradox. It looks like inconsistent treatment of future-binding contracts.
      *   *Section 1: The Implicit Theory (The Competency/True Self Model).* Explain that the law isn't using metaphysical identity, it's using legal capacity. The manic self is "corrupted." This avoids the servitude comparison (servitude assumes a competent choice to lose freedom; mania assumes loss of competence).
      *   *Section 2: Parfit's Hitchhiker vs. Incapacity.* Distinguish between strategic precommitment (Hitchhiker) and protective guardianship. The law uses the latter. If it used the former, it would look more like a contract between two people.
      *   *Section 3: Underdetermination.* Point out the fuzzy boundaries. When is mania "bad enough"? What if the manic state is happy?
      *   *Section 4: The Parfitian Shift.* If identity is psychological continuity in degrees...
          *   The "Past Self" doesn't own the "Future Self."
          *   Authority is proportional to connectedness.
          *   We might move from "Substituted Judgment" (what would I have wanted?) to a hybrid model considering current welfare.
          *   It destabilizes the binary of "Valid/Invalid" directives.
      *   *Conclusion:* Summarize. The current system relies on a "True Self" fiction. Parfit reveals this fiction, forcing a more utilitarian or care-based ethics rather than a rights-based autonomy ethics.

  8.  **Refining the Parfit Connection:**
      *   Need to be careful. Parfit's Hitchhiker is about *rationality* (making a threat/promise credible). The prompt asks if the practice *secretly depends* on this.
      *   *Correction:* The practice *looks* like a Hitchhiker case (binding future self for own good). But the *justification* given by courts is usually incapacity.
      *   *Parfit on Identity:* In *Reasons and Persons*, Parfit discusses advance directives. He suggests that if psychological connectedness is weak, the past self's authority diminishes. This is the key point for the last section.

  9.  **Final Polish:** Check tone (philosophical, analytical), ensure all parts of the prompt are addressed. (Self-Correction: Make sure to explicitly contrast the servitude/marriage contracts with the psychiatric directive to explain the legal distinction).

      *   *Servitude:* Violates public policy because it ends agency.
      *   *Psychiatric Directive:* Preserves agency (by restoring the "stable" agent).
      *   *Marriage:* Requires ongoing consent because the nature of the relationship is mutual voluntary association.

      *   *Wait, one nuance:* The prompt asks about "rationality and personal identity."
      *   *Rationality:* Time-slice vs. Extended. The law prefers the Extended Rational Agent (Stable) over the Time-Slice Irrational Agent (Manic).
      *   *Identity:* The law assumes a persistent "Legal Person" whose "Will" can be clouded but not replaced.

      *   *Parfit's Reductionism:* If there is no deep further fact, the "Legal Person" is a fiction. This undermines the basis for the directive's absolute authority.

      *   *Okay, ready to write.*
answer: |-
  The legal and clinical practice surrounding psychiatric advance directives (Ulysses contracts) rests on a specific, often unarticulated, philosophical architecture. It navigates a tension between respecting autonomy and preventing harm, but it does so by drawing a distinction that standard contract law does not.

  Here is a reconstruction of the implicit theory, an analysis of its reliance on precommitment versus incapacity, and an exploration of how Parfit's reductionist view of personal identity would destabilize it.

  ### 1. The Implicit Theory: The "True Self" and Competency
  The legal system's differential treatment of Ulysses contracts versus contracts of servitude or irrevocable marriage vows presupposes a **theory of competency rather than a theory of metaphysical identity.**

  **The Distinction:**
  *   **Servitude/Marriage:** The law assumes the agent signing these contracts is *competent* at the time of signing and will remain *competent* in the future. To bind a future competent self to servitude is to destroy the very agency required to make contracts. It turns a person into a thing. Therefore, the law prohibits it to preserve the possibility of future autonomy.
  *   **Psychiatric Directive:** The law assumes the agent is *competent* at the time of signing (stability) but will become *incompetent* at the time of enforcement (mania).

  **The Theory of Rationality:**
  The practice presupposes a **hierarchical model of preferences.** It distinguishes between:
  1.  **Critical Interests (Stable Self):** Preferences formed during periods of rationality, reflection, and "normal" cognitive function. These are viewed as authoritative.
  2.  **Experiential Interests (Manic Self):** Preferences formed during periods of cognitive distortion, impulsivity, or psychosis. These are viewed as defective or pathological.

  Rationality, in this framework, is not defined by the satisfaction of current desires (which the manic self has), but by the adherence to a life plan constructed during lucidity. The Ulysses contract is not seen as overriding a *valid* refusal, but as bypassing an *invalid* one.

  **The Theory of Personal Identity:**
  Legally, this relies on a **"True Self" doctrine.** It presupposes that the person with bipolar disorder is ontologically identical to their stable self, and that the manic self is a corrupted version of that same entity. The mania is an external intrusion (a disease) rather than an expression of the person. Therefore, honoring the directive is not "one person overriding another"; it is "the person protecting themselves from a temporary corruption."

  ### 2. Parfit's Hitchhiker vs. The Incapacity Defense
  Does this depend on Parfit's "Hitchhiker" argument? **No, not primarily.**

  In Parfit's *Hitchhiker* case (from *Reasons and Persons*), it is rational to make a promise you know you will want to break later, because making the promise (and being known to keep it) secures a benefit you couldn't otherwise get. It is a strategy of **precommitment** between two rational time-slices.

  If the Ulysses contract were based on the Hitchhiker logic, it would imply that the manic self is *rational* but has different preferences, and the stable self is binding them for the greater good of the whole life.
  *   **Why the law rejects this:** If the manic self were considered rational, the contract would look like servitude. You cannot bind a rational future self to medical treatment any more than you can bind them to labor.
  *   **The Actual Justification:** The legal system relies on the **Incapacity Defense.** It claims the manic self *cannot* refuse validly because they lack the capacity to understand the consequences.

  However, there is a **secret dependency:** The system *does* rely on a Parfitian insight regarding **rationality over time.** It assumes that the "person" is an extended entity over time, and that the "good" of that entity is best served by the planning self, not the experiencing self. But it masks this by using the language of capacity rather than the language of strategic precommitment.

  ### 3. Where the Practice is Underdetermined
  The current framework creates several philosophical and legal blind spots:

  *   **The Threshold of Identity:** At what point does mania become "not you"? If a manic episode produces genuine creative insight or a temporary shift in values that the person later integrates, the "True Self" model fails. The law treats mania as a binary switch (competent/incompetent), whereas psychological reality is a spectrum.
  *   **The Content of the Directive:** If the stable self authorizes *any* treatment, can they authorize lobotomy or experimental drugs? The "True Self" theory suggests yes (it's their will), but human rights law suggests no (the future self still has bodily rights). The practice is underdetermined on how much suffering the future self can be forced to endure for the sake of the past self's plan.
  *   **Post-Recovery Regret:** If the person recovers and says, "I am glad I was treated, but I hated every second of it," the directive is vindicated. If they say, "That treatment changed my personality and I am not the same person," the directive is implicated in identity destruction. The law rarely adjudicates this nuance.

  ### 4. The Parfitian Challenge: Reductionism and Degrees
  If we take Derek Parfit's reductionist view seriously—that personal identity is not a "deep further fact" but consists in **psychological continuity and connectedness (Relation R) which comes in degrees**—the justification for Ulysses contracts shifts dramatically.

  **A. The Erosion of Authority**
  For Parfit, the "Stable Self" and the "Manic Self" are not strictly *identical*. They are related by varying degrees of psychological connectedness (memories, character, intentions).
  *   **Current View:** Past Self = Future Self. Therefore Past Self has absolute authority.
  *   **Parfitian View:** Past Self is *connected* to Future Self. Authority should be proportional to the degree of connectedness.
  *   **Implication:** If the manic episode radically alters character and memory (low connectedness), the Stable Self's authority diminishes. We would no longer be "honoring the patient's will," but rather a past relative making decisions for a future relative. This weakens the moral force of the directive.

  **B. From Rights to Welfare**
  Under the "True Self" model, enforcing the directive is a matter of **autonomy** (respecting the person's rights). Under Parfit's reductionism, since the "person" is a fiction, the conflict becomes a utilitarian calculation between two distinct psychological stages.
  *   We would have to weigh the **Stable Self's preference** (to be treated) against the **Manic Self's current welfare** (freedom from coercion, even if delusional).
  *   This might lead to a system where directives are not absolute commands, but **strong advisory weights.** Clinicians might be required to assess the *current* well-being of the manic self, not just blindly follow the past self's orders.

  **C. The End of the "Binding" Contract**
  Parfit argues that what matters is not identity, but survival. If the treatment preserves the psychological continuity required for the Stable Self to "survive" into the future, it is justified. But if the treatment (e.g., heavy sedation) severs psychological connections, it harms the "survival" of the person just as much as the mania does.
  *   **Change in Practice:** We would move from **Substituted Judgment** ("Do what the past self wanted") to **Best Interests** ("Do what maximizes the welfare of the current psychological stage while preserving future continuity").
  *   This might actually make Ulysses contracts *harder* to enforce in extreme cases, because the "past self" loses its metaphysical privilege over the "future self."

  ### Summary
  The current legal practice presupposes a **Lockean "True Self" theory** combined with a **binary model of competency.** It assumes the stable self is the authentic agent and the manic self is a compromised vessel. It avoids the "servitude" prohibition by claiming the future self lacks the capacity to consent or refuse.

  If we adopt **Parfit's Reductionism**, the "True Self" vanishes. We are left with a chain of psychological stages. The authority of the past stage over the future stage is no longer absolute but proportional to their psychological connectedness. This would transform psychiatric advance directives from binding legal commands into ethical guidelines, requiring a balance between the past self's plans and the present self's experiential welfare, fundamentally shifting the practice from **autonomy-based** to **care-based.**
