          *   Mechanism: The "General Intellect" is privatized. AI doesn't eliminate labor; it displaces it and creates new low-value tasks (ghost work).
          *   Key Concept: Real Subsumption 2.0 (data extraction).
      *   **Section 2: Mechanisms of Machinery (Updated for AI):**
          *   Organic Composition of Capital: Massive increase in constant capital (GPUs, models) vs. variable capital.
          *   TRPF: Pressure on profitability despite productivity.
          *   Algorithmic Management: The machine doesn't just replace; it disciplines. Digital Taylorism.
      *   **Section 3: Class Composition and Labor:**
          *   The "Collective Worker": Now includes data labelers, users, and AI-maintainers.
          *   Polarization: High-skilled elites vs. precarious gig/service workers.
          *   Intensity: Always-on culture, cognitive load.
      *   **Section 4: Where Marx Needs Revision (Cognitive/Judgment Automation):**
          *   Value of Training Data: Is past labor crystallized in weights?
          *   User Labor: Are we working when we prompt? (Digital Labor debate).
          *   The Black Box: Surplus value extraction becomes opaque.
      *   **Section 5: Political Consequences & Obstacles:**
          *   Obstacles: IP laws, platform monopolies, state security.
          *   Union Strategy: Bargaining over data, algorithmic transparency, reduction of work time.
      *   **Conclusion:** Summarize the dialectic. Crisis is not automatic; it's political.

