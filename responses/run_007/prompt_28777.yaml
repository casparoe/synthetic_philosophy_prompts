prompt: |-
  So I'm a novelist, right, and I'm working on this book where I want the characters to feel psychologically real — not like they're walking DSM entries or whatever, but like their motivations actually track something true about human beings. I've been dipping into evo psych and honestly I can't tell what's solid and what's just a clever story someone told after the fact.

  Here's what I want: rank these five evo-psych claims from most to least likely to be genuine science rather than just-so stories. Give each one a tier if you want — like "I'd bet on this," "plausible but unproven," "probably narrative," that kind of thing — and a sentance on why it lands there.

  The five:
  1. Jealousy is sexually dimorphic — men are more distressed by sexual infidelity, women by emotional infidelity — because of different reproductive challenges in the ancestral environment.
  2. Clinical depression is (or was) an adaptive bargaining signal: it communicates to others that you can't be pushed further, forcing renegotiation of social contracts.
  3. The human preference for savanna-like landscapes (open terrain with scattered trees and water) is an evolved residue of Pleistocene habitat selection.
  4. Rape is an evolved conditional reproductive strategy employed by males who lack access to consensual mating opportunities.
  5. Gossip evolved as a mechanism for social policing — sharing reputational information helped maintain cooperation in large groups where direct observation wasn't possible.

  I basically want to know which of these I can use as scaffolding for character motivation without feeling like I'm building my whole novel on a house of cards.
