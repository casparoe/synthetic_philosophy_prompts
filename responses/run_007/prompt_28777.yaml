answer: |-
  Here is the ranking from most to least scientifically robust, tailored for your use as narrative scaffolding.

  **1. Gossip evolved as a mechanism for social policing.**
  *   **Tier:** I'd bet on this.
  *   **Why:** There is robust cross-disciplinary consensus that language and reputation tracking co-evolved to maintain cooperation in groups too large for direct monitoring.

  **2. The human preference for savanna-like landscapes is an evolved residue of Pleistocene habitat selection.**
  *   **Tier:** I'd bet on this.
  *   **Why:** Cross-cultural studies consistently show a preference for environments offering "prospect and refuge," aligning closely with ancestral survival needs.

  **3. Jealousy is sexually dimorphic — men are more distressed by sexual infidelity, women by emotional infidelity.**
  *   **Tier:** Plausible but unproven.
  *   **Why:** While initial studies supported this, later research shows the effect size is smaller than claimed and heavily modulated by cultural norms and relationship beliefs.

  **4. Clinical depression is (or was) an adaptive bargaining signal.**
  *   **Tier:** Probably narrative.
  *   **Why:** Though theoretically intriguing, clinical data suggests depression is too heterogeneous and debilitating to be classified primarily as a calculated social strategy.

  **5. Rape is an evolved conditional reproductive strategy.**
  *   **Tier:** Scientifically contested.
  *   **Why:** This hypothesis is widely rejected by mainstream evolutionary biologists and psychologists, who view the behavior as a byproduct of other traits rather than a specific adaptation.
