          4.  **Moral Trade-offs:** How to handle conflicts between inner/outer circle?
          5.  **Pathologies of Expansion:** When does expansion become superficial or harmful? (This covers the "contraction" worry and the "decorative" worry).

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the role, validate the colleagues' frustration.
