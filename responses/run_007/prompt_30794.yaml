      *   **Load-Bearing (Upstream Impact):** If we get this wrong, does the rest of the research collapse or go off the rails?
      *   **Philosophical Tractability:** Can philosophers actually make progress on this in 3-5 years, or does it need a sociologist/historian? (The prompt asks for *philosophical* tools primarily).
      *   **Neglectedness:** Is this already saturated? (e.g., Singer's argument is well-known; basic history is well-trodden).
      *   **Strategic Value:** Does answering this unlock funding or interdisciplinary collaboration later?

  5.  **Selecting the Top Five (Iterative Process):**

      *   *Candidate 1: Metaethical Grounding.* (Is it progress or just change?)
          *   *Pros:* Fundamental. If it's not progress, why fund it?
          *   *Cons:* Very abstract, might be intractable in 5 years.
          *   *Decision:* Keep, but refine to focus on *functional* progress rather than hard realism. It's too load-bearing to ignore.

      *   *Candidate 2: The Metaphor/Structure.* (Is "expansion" misleading?)
          *   *Pros:* Highly neglected. Could reframe the whole initiative. Addresses the "depth vs. breadth" issue.
          *   *Cons:* Risk of being purely semantic.
          *   *Decision:* Keep. It's the most "senior philosopher" move—interrogating the conceptual framework itself.

      *   *Candidate 3: Mechanisms (Reason vs. Empathy).*
          *   *Pros:* Practical. Helps design interventions.
          *   *Cons:* Heavily empirical (psychology/neuroscience). Philosophers might just be speculating.
          *   *Decision:* Deprioritize in favor of *Normative Mechanics* (how obligations generate). Let empirical folks handle the causal psychology.

      *   *Candidate 4: The Endpoint/Scope.* (Where does it stop?)
