  2. Sincerity functions as a causal precondition rather than a circular inference because the artist's genuine inner compulsion removes artificial barriers, making the technical transmission of feeling possible in the first place.
  3. He argues that non-universal feelings yield inferior art because they restrict the potential audience to a specific class or group, thereby failing to achieve the maximum possible spiritual union between human beings.
  4. The religious consciousness of the age supplies the necessary ethical standard to evaluate content, ensuring that the definition of art does not validate powerful transmissions of harmful or divisive emotions.
  5. This hierarchy of feelings means that even highly infectious works are deemed counterfeit if they promote values contrary to the era's religious consciousness, such as class pride instead of universal brotherhood.
