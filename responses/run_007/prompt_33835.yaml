  2.  **Deconstruct the Debate:**
      *   **Pro-Penetration (e.g., Siegel, Churchland, Vetter):** Claim that high-level cognitive states (beliefs, desires) can alter early perceptual processing, changing the phenomenology itself (what it's *like* to see).
      *   **Anti-Penetration/Skeptics (e.g., Firestone & Scholl, Pylyshyn, Fodor):** Claim that effects are due to attention, judgment, response bias, or post-perceptual reasoning. Perception is modular and encapsulated.
      *   **The Impasse:** As the user notes, empirical data is contested *in interpretation*, not necessarily in raw numbers (though replication issues exist). The core issue is defining the boundary between "perception" and "cognition".

  3.  **Evaluate the Nature of the Disagreement:**
      *   *Is it purely empirical?* No, because no specific neural signature or behavioural task definitively separates "perceptual change" from "post-perceptual judgment" without theoretical assumptions.
      *   *Is it purely terminological?* Partly. If "perception" is defined functionally (input to decision), vs. phenomenally (what it feels like), vs. neurally (V1 vs. IT cortex), the answer changes.
      *   *Is it about burden of proof?* Yes. Skeptics demand ruling out *all* alternative explanations (attention, bias), which is notoriously difficult (the "Duhem-Quine" problem in this context). Proponents argue that inference to the best explanation favours penetration given the totality of evidence.
      *   *Is it ill-posed?* There's a strong case that "perception" isn't a natural kind with a sharp boundary. It's a continuum of processing.

