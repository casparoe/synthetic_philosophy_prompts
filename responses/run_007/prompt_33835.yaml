  Your frustration is entirely warranted, and it stems from a feature of the debate rather than a bug in your understanding. The impasse over cognitive penetration is not merely a stalemate in data collection; it is a **conceptually underdetermined** disagreement. While it presents itself as an empirical dispute about experimental results, the core friction arises because neither side possesses a theory-neutral criterion for distinguishing "perception" from "cognition".

  To understand why better experiments are unlikely to resolve this, consider what would be required to settle the matter. For an experiment to definitively prove cognitive penetration, it would need to isolate a change in perceptual experience that cannot be attributed to attention, judgement, or response bias. However, identifying such a change requires a prior definition of what counts as "perceptual". If you define perception functionally—as an input system that is modular and encapsulated, as Jerry Fodor did—then by definition, cognition cannot penetrate it. Any evidence suggesting otherwise is immediately reinterpreted by the sceptic as a post-perceptual judgement or an attentional shift, because the architecture of the mind is assumed to forbid penetration. Conversely, if you define perception phenomenologically—as simply "what it is like" to see—then any cognitive influence on experience counts as penetration.

  Consequently, the disagreement is substantive in its implications but terminological in its deadlock. The sceptics, such as Firestone and Scholl, operate with a rigorous burden of proof that demands the elimination of all alternative explanations. This is arguably an impossible standard to meet in practice due to the Duhem-Quine problem: one can always adjust auxiliary hypotheses (e.g., about attention or memory) to protect the core theory (that perception is encapsulated). The proponents, meanwhile, argue via inference to the best explanation, suggesting that the totality of data is most parsimoniously explained by allowing some cognitive influence on early processing.

  What experiment would move this? Ideally, we would need a "perceptual marker"—a neural or behavioural signature that is uniquely perceptual and immune to cognitive influence. Some have suggested looking at early visual cortex activity (e.g., V1) via fMRI, arguing that if cognitive states alter V1 activity, perception is penetrated. Yet, even this is contested. Skeptics argue that feedback loops to V1 do not necessarily constitute "perception" in the relevant sense, or that such activity reflects attention rather than belief-driven penetration. Without an agreed-upon boundary for where perception ends and cognition begins, neural data remains open to competing interpretations.

  Why, then, do people keep arguing? Because the stakes extend far beyond the laboratory. The debate is a proxy war for deeper philosophical commitments. If perception is cognitively penetrated, it challenges the idea that perception provides an objective foundation for knowledge (epistemology). It also impacts how we model the mind in artificial intelligence and psychiatry. If the boundary is porous, the modular model of the mind collapses. Thus, participants continue to argue not because they expect a definitive empirical knockout, but because defending their definition of perception is essential to defending their broader theory of mind.

  The disagreement persists because it is not truly about the data; it is about the conceptual framework used to organise that data. Until there is a consensus on how to individuate mental processes—a problem that may be ill-posed given the continuous nature of neural processing—the debate will remain stuck.

  \answer{conceptually underdetermined}
  The debate remains unresolved because the lack of a theory-neutral definition for perception prevents empirical data from decisively favouring either side.
