answer: |-
  ### Comparative Ranking of Slur Theories

  For the purposes of this seminar exercise, the five approaches are ranked by their ability to accommodate the full dataset without ad hoc modifications. The ranking prioritizes logical consistency across embedding environments while penalizing inability to account for sociolinguistic variation (reclamation).

  #### **Tier 1 (Top): Expressivist & Presuppositional**
  These two approaches constitute the live options in contemporary literature. They share the highest explanatory power but fail in complementary ways.
  *   **Expressivist Accounts:** (e.g., Croom, Hay)
      *   **Best Handled Diagnostic:** **Reclamation/In-Group Use.** Because the derogation is modeled as an expressed attitude rather than a fixed semantic rule, the theory can accommodate shifts in speaker intention (contempt vs. solidarity) without positing ambiguity in the word itself.
      *   **Most Straining Diagnostic:** **Embedding Projectibility.** While expressives generally project, explaining why they project with the *rigidity* of slurs (surviving even in antecedents of conditionals where speaker attitude is hypothetical) requires complex machinery regarding conventional implicature or commitment.
  *   **Presuppositional Accounts:** (e.g., Schlenker, Macià)
      *   **Best Handled Diagnostic:** **Embedding under Negation/Conditionals.** This is the native habitat of presupposition theory. The derogatory content projects out of logical operators exactly as presuppositions do, offering the cleanest logical formalization of the data.
      *   **Most Straining Diagnostic:** **Reclamation/In-Group Use.** It is difficult to explain how a speaker can trigger a presupposition of contempt while intending solidarity. Canceling a presupposition usually results in infelicity, yet reclaimed uses are often felicitous.

  #### **Tier 2 (Middle): Prohibitionist & Deflationary Pragmatic**
  These approaches solve specific problems elegantly but create significant blind spots elsewhere.
  *   **Prohibitionist (Use-Conditional) Accounts:** (e.g., Anderson & Lepore)
      *   **Best Handled Diagnostic:** **Offense Persistence.** If the offense is simply the violation of a norm against uttering the phonological string, it follows immediately that negation or questioning does not mitigate the violation.
      *   **Most Straining Diagnostic:** **Reclamation/In-Group Use.** This view struggles to explain why the norm is suspended for in-group speakers. If the word is prohibited *simpliciter*, in-group use should be just as violating unless the theory introduces complex, speaker-relative norms that weaken the "prohibition" label.
  *   **Deflationary Pragmatic Accounts:** (e.g., Bianchi, some contextualists)
      *   **Best Handled Diagnostic:** **Reclamation/In-Group Use.** If the slur is truth-conditionally neutral and the offense is entirely conversational, reclamation is trivial: the common ground simply changes.
      *   **Most Straining Diagnostic:** **Conventionality/Stability of Offense.** This view struggles to explain why the offensive effect is so automatic and resistant to context. If the offense is purely pragmatic, it should be easier to neutralize in non-hostile contexts than it empirically is.

  #### **Tier 3 (Bottom): Truth-Conditional Content**
  *   **Truth-Conditional Accounts:** (e.g., early Hom)
      *   **Best Handled Diagnostic:** **Use vs. Mention.** This view handles the distinction naturally: mentioning the word does not assert the truth-conditional content, so no offense is generated.
      *   **Most Straining Diagnostic:** **Embedding under Negation.** This is the fatal flaw. If the derogation is part of the truth conditions, "He is not a S" should negate the derogation. Since the offense survives, the theory requires untenable contortions to separate the truth-conditional content from the evaluative content.

  ***

  ### The Weight-Bearing Diagnostic: Embedding under Negation and Conditionals

  For the purpose of this ranking, **Embedding under Negation and Conditionals** must carry the most weight.

  **Why this diagnostic?**
  This is the logical gatekeeper. It tests whether a theory treats derogation as part of the *proposition* (what is asserted) or as a distinct layer of meaning (presupposition, expression, or norm). The data shows that derogation behaves like a projection phenomenon, not an assertive one. Any theory that locates the derogation strictly within the truth-conditional assertion (Tier 3) is logically incompatible with the data. Therefore, this single diagnostic creates the primary fault line between Tier 3 and Tiers 1–2.

  **Does this skew the ranking?**
  Yes, and your students should be made aware of this.
  *   **Who benefits?** The **Presuppositional** approach earns its Tier 1 status almost exclusively on the strength of this diagnostic. It was designed to solve projection problems. If you weight Embedding at 60%, Presuppositionalism looks like the clear winner.
  *   **Who suffers?** The **Deflationary Pragmatic** approach is demoted to Tier 2 largely because it treats the stability of the embedding data as a pragmatic accident rather than a semantic rule.

  **Trust or Discount?**
  You should **trust** this weighting for the *structure* of the seminar, but **discount** it for the *final verdict* on the best theory.
  *   **Trust it** because it forces students to abandon the naive view that slurs are simply "negative adjectives." It establishes the semantic/pragmatic divide, which is the necessary foundation for the seminar.
  *   **Discount it** because Embedding is a "negative" test (it eliminates theories) rather than a "positive" test (it identifies the correct mechanism). It tells us what slur meaning is *not* (truth-conditional), but it does not decisively tell us what it *is*.

  **Pedagogical Recommendation:**
  Use the Embedding diagnostic to clear the board (eliminating Truth-Conditionalism). Then, shift the weight entirely to **Reclamation/In-Group Use** for the second half of the seminar. This reveals the true fault line between the remaining Tier 1 contenders: **Expressivism** wins on Reclamation, while **Presuppositionalism** wins on Embedding. The seminar's central philosophical tension should be framed as a trade-off: *Do we prioritize logical projection (Presuppositional) or attitudinal flexibility (Expressivist)?* This prevents the ranking from appearing dogmatic and highlights that the "best" theory depends on which data point one takes as the anchor.
