answer: |-
  **Title:** The Myth of Neutrality: Why "Low Impact" Requires a Theory of Value

  **To:** Engineering Team
  **From:** Strategy & Alignment
  **Subject:** On the Definability of Low-Impact Constraints

  Your team has encountered a fundamental friction in AI safety specification: the desire for an assistant that is "helpful but otherwise inert." You want the agent to achieve the objective while minimizing side effects—the "low impact" constraint. The intuitive appeal is obvious. If we can define "side effects" structurally, without needing to specify the entirety of human values, we bypass the bottleneck of value alignment. We could build safe agents even if we don't fully understand what humans want, provided the agents don't break anything else while fetching the coffee.

  However, you have correctly identified the rabbit hole: Is "low impact" actually well-defined without a full specification of what is valuable?

  There are two competing intuitions here. On one side, proponents of **Attainable Utility Preservation (AUP)** and similar impact measures argue that we can penalize agents for reducing the range of future possibilities. This claims to be value-agnostic: it doesn't matter *what* the user wants, only that the agent keeps as many options open as possible. On the other side, critics argue that any metric of "impact" must smuggle in a notion of loss, because distinguishing a "side effect" from a "task completion" requires knowing what counts as a resource worth preserving.

  After weighing these arguments, the verdict is clear: **"Low impact" is not a value-agnostic constraint. It is impossible to define side effects without an implicit prior over what is valuable.** Attempting to implement low impact as a purely structural constraint is a category error that will either lead to paralysis or hidden value violations. You cannot spec a low-impact assistant without specifying what you intend to protect.

  ### The Promise of Value-Agnosticism

  The argument for value-agnostic impact measures rests on the idea of *optionality*. The logic is elegant: Bad side effects usually involve breaking things, using up resources, or altering the environment in ways that make future tasks harder. Therefore, if we penalize the agent for reducing its ability to achieve *any* arbitrary goal in the future, we effectively penalize it for causing damage.

  In this framework, "impact" is measured by the difference in the agent's power to affect the world before and after the action. If the agent breaks a vase, it has reduced the set of reachable states (the state where the vase is intact is no longer accessible). If it locks a door, it reduces reachability. By penalizing reductions in "attainable utility" across a broad distribution of possible reward functions, the agent theoretically learns to be careful without knowing *why* the vase matters.

  This approach is seductive because it treats "impact" as a physical or information-theoretic property, akin to entropy. It suggests we can solve the safety problem by constraining the agent's *footprint* rather than micromanaging its *intentions*.

  ### The Smuggling of Value

  The counter-argument is that "impact" is not an intrinsic property of an action; it is a relational property between an action and a set of values. To measure impact, you must measure impact *on something*.

  Consider the "options" approach. To calculate the loss of future options, you must define the space of possible futures. If you treat all future states as equally valuable, you run into immediate problems. A world where a nuclear plant melts down has a very different state space than one where it doesn't, but a purely structural measure might struggle to weigh the *quality* of those states against the *quantity* of options.

  More critically, this approach smuggles in a specific value judgment: **that flexibility is inherently good.** This is not a neutral truth. In many human contexts, commitment is valuable. Signing a contract, getting married, or spending money are all actions that deliberately reduce future options to achieve a specific good. An agent strictly penalized for reducing optionality might refuse to spend the money required to buy the coffee, because spending money reduces the set of futures where that money is unspent.

  Furthermore, the definition of a "side effect" relies entirely on a **baseline**. To say an agent changed "as little as possible," you must define the state it is being compared to. Usually, this is the "inaction baseline" (what would happen if the agent did nothing). But biasing the system toward the status quo is itself a value judgment. If the user asks the agent to "fix the security breach," the "inaction" baseline involves the company being hacked. If the agent minimizes change relative to inaction, it might fail to fix the breach because fixing it requires high-impact changes to the server logs.

  ### The Baseline and Resource Problem

  The deepest flaw in value-agnostic impact is the problem of **resource individuation**. To penalize impact, the agent must know which physical changes count as "resources" worth conserving.

  If the metric counts atom displacements, the agent cannot breathe. If it counts bits flipped in a hard drive, it cannot compute. Therefore, the metric must distinguish between "disposable" changes (moving air molecules) and "significant" changes (breaking a vase). But how does it distinguish them without a model of human valuation?

  A vase and a pile of dust are both collections of atoms. The only reason breaking the vase is a "side effect" and sweeping the dust is "task completion" is that humans value the vase's structure and not the dust's. Any impact measure that successfully avoids breaking the vase but allows sweeping the dust has successfully inferred a human preference hierarchy. It has not avoided value specification; it has merely hidden it inside the impact metric's hyperparameters.

  ### The Verdict

  We must conclude that **low impact is not well-defined without a specification of value.**

  The notion that we can separate "achieving the goal" from "minimizing side effects" assumes that the goal is a discrete target in state space and everything else is noise. But the world is a causal web. Achieving almost any non-trivial goal requires changing the world. Distinguishing the "necessary changes" from the "side effects" requires knowing which changes are *reversible*, which resources are *scarce*, and which states are *preferred*. These are not physical facts; they are axiological ones.

  The "options" approach does not escape this; it simply hardcodes a specific value system: **Preservation of Potentiality.** It asserts that keeping options open is more valuable than closing them, and that the status quo is a neutral reference point. These are reasonable priors for a general assistant, but they are not value-neutral. They are a specific moral stance regarding flexibility and stability.

  ### Recommendation for Specification

  Do not attempt to spec "low impact" as a value-free constraint. It will fail when the task requires irreversible action or when the status quo is unacceptable. Instead, your specification should explicitly acknowledge the values embedded in the impact measure.

  1.  **Define the Baseline:** Explicitly state what the "no impact" reference is. Is it the state before the command? The state if the agent did nothing? Or the state if a human performed the task? (The latter is often best).
  2.  **Define Protected Resources:** Instead of "minimize change," specify "minimize change to [environmental state, user files, third-party systems]." Acknowledge that you are protecting specific things, not "everything."
  3.  **Accept Irreversibility:** Allow the agent to consume resources necessary for the task. The constraint should be "do not consume resources *beyond* those required for the task," which again, requires a model of task necessity.

  "Low impact" is a useful heuristic, but it is not a fundamental law. It is a proxy for "respect human values regarding property and stability." If you treat it as the former, you will build an agent that is paralyzed by the philosophy of change. If you treat it as the latter, you can build an assistant that is safe because it understands what matters, not just because it fears moving.
