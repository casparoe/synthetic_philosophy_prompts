answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, The Foundation for Existential Risk Mitigation
  **FROM:** Risk Assessment Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal 24-V: Vacuum Decay Risk Assessment & Policy Recommendation

  ### 1. Executive Summary

  The Risk Assessment Committee has reviewed Proposal 24-V, requesting $2.3 million over three years to investigate the potential for high-energy physics experiments to trigger a vacuum decay event. After extensive deliberation, the Committee recommends **rejection of the proposal as currently structured.**

  However, recognizing the validity of the underlying concern regarding high-consequence/low-probability events, the Committee simultaneously recommends the **adoption of a new Standing Policy on Infinite-Stakes Claims.** This policy establishes epistemic standards for evaluating proposals that rely on "infinite expected value" arguments. We further recommend allocating a limited scoping grant ($75,000) to conduct a meta-review of existing literature on vacuum stability, contingent on the new policy's criteria.

  ### 2. Background and Context

  Proposal 24-V posits that future high-energy physics experiments could theoretically trigger a phase transition in the quantum vacuum (vacuum decay), resulting in the immediate and permanent uninhabitability of the observable universe. While no laboratory currently plans experiments at the requisite energy levels, the proponents argue that the foundation must fund research to quantify and mitigate this risk *before* such technology matures.

  The core justification relies on an Expected Value (EV) calculation:
  $$EV = (\text{Probability of Risk}) \times (\text{Value of Future Humanity})$$

  Proponents estimate the annual probability at $10^{-15}$. They argue that because the "Value of Future Humanity" is effectively infinite (representing all potential future lives and value in our light cone), any nonzero probability yields an infinite expected value. Therefore, they contend, the cost of the research ($2.3 million) is negligible compared to the risk, and refusing to fund it constitutes a dereliction of our mission.

  Two committee members objected that this logic creates a "Pascal's Mugging" vulnerability, where the foundation could be obligated to fund any speculative claim with infinite stakes. Others countered that rejecting the math amounts to abandoning expected-value reasoning precisely where it matters most.

  ### 3. Committee Deliberation

  The Committee engaged deeply with the tension between maximizing expected value and maintaining epistemic security. We summarize the strongest arguments from both sides below.

  #### A. The Argument for Approval (The EV Maximization View)
  The proponents' argument is mathematically consistent with strict long-termist expected utility theory. If our mandate is to safeguard the future of humanity, and if there is a plausible mechanism by which human activity could end that future, the magnitude of the loss dwarfs any financial cost.
  *   **Strength:** It prevents complacency. History shows that "impossible" risks (e.g., nuclear chain reactions prior to 1939) can materialize. Dismissing a risk because the probability is low but the stakes are total may be a cognitive bias rather than a rational calculation.
  *   **Validity:** If the probability estimate ($10^{-15}$) were robust and empirically grounded, the EV argument would be decisive.

  #### B. The Argument for Rejection (The Epistemic Security View)
  The objection rests on the reliability of the probability estimate. In the realm of existential risks, probabilities like $10^{-15}$ are not derived from frequentist data but from theoretical models with high uncertainty.
  *   **The "Mugging" Risk:** If we accept that any claim of infinite stakes combined with a subjective nonzero probability justifies funding, we open the foundation to unlimited liability. We could be diverted from robust, evidence-based interventions (e.g., AI alignment, biosecurity) to chase speculative physics anomalies.
  *   **Diminishing Returns:** The marginal value of information (VOI) must be considered. If existing physics (specifically cosmic ray bounds) already suggests the risk is negligible, $2.3 million in new research may not shift our probability estimate enough to justify the cost.
  *   **Rationality:** Abandoning EV reasoning is not the only alternative. A more sophisticated EV approach accounts for the *uncertainty of the probability estimate itself*. When the uncertainty range spans orders of magnitude, the "expected" value becomes unstable.

  #### C. Scientific Context: The Cosmic Ray Bound
  A critical factor in our decision is the existing scientific consensus regarding cosmic rays. Ultra-high-energy cosmic rays strike the Earth's atmosphere and the Moon at energies far exceeding those achievable in terrestrial colliders. These natural "experiments" have occurred for billions of years without triggering vacuum decay. While proponents argue laboratory conditions (e.g., high baryon density) differ, this natural bound significantly lowers the prior probability of the risk, undermining the urgency of the $2.3 million request.

  ### 4. Committee Decision

  **Recommendation: Reject Proposal 24-V (as submitted).**

  **Rationale:**
  1.  **Insufficient Marginal Value:** Given existing constraints from astrophysical observations (cosmic ray bounds), the likelihood that a $2.3 million study will uncover a new, actionable risk mechanism is low. The funds are better deployed on risks with higher probability densities or more tractable mitigation pathways.
  2.  **Precedent Management:** Approving this proposal based solely on the "infinite stakes" argument without stricter epistemic controls would set a precedent that compromises the foundation's fiscal and strategic stability.
  3.  **Probability Robustness:** The $10^{-15}$ estimate lacks the empirical grounding required to override the "Pascal's Mugging" objection. We cannot treat subjective theoretical estimates as hard data points in an EV calculation when the stakes are infinite.

  **Exception:** We recommend a **$75,000 scoping grant** to produce a comprehensive meta-analysis of existing vacuum stability literature. This ensures we do not ignore the risk entirely but limits exposure until a higher confidence threshold is met.

  ### 5. Recommendation for Standing Policy

  The Committee agrees with the counter-objection that we cannot simply ignore infinite-stakes claims. To navigate this in the future, we propose the adoption of the **Policy on High-Stakes Epistemic Claims (HSEC).**

  This policy applies to any proposal where the primary justification relies on an infinite or near-infinite stake multiplied by a low-probability estimate ($< 10^{-6}$).

  **Policy Criteria:**
  1.  **Independent Probability Audit:** Proposals must submit probability estimates to an external panel of domain experts not affiliated with the project to assess the robustness of the underlying models.
  2.  **Value of Information (VOI) Analysis:** Applicants must demonstrate that the proposed research will meaningfully update the probability estimate or lead to a tractable intervention. Research that merely quantifies a risk without offering a mitigation pathway will not be funded.
  3.  **Opportunity Cost Justification:** Applicants must explicitly address why this intervention has higher expected value than established existential risk interventions (e.g., AI safety, pandemic preparedness), accounting for the uncertainty in the probability estimate.
  4.  **Funding Caps:** Initial funding for "verification" research on theoretical risks shall be capped (e.g., at $100,000) until the risk is elevated from "theoretical" to "plausible" based on the Independent Probability Audit.

  ### 6. Conclusion

  The Committee's decision is not an abandonment of expected-value reasoning, but a refinement of it. Pure EV calculations break down when probability estimates are uncalibrated and stakes are infinite. By rejecting the current proposal while instituting the HSEC policy, the foundation protects itself from epistemic exploitation while maintaining a rigorous pathway to address genuine, novel existential threats.

  We request Board approval to implement the HSEC policy immediately and to authorize the limited scoping grant for Proposal 24-V under these new guidelines.

  **Respectfully submitted,**

  **The Risk Assessment Committee**
