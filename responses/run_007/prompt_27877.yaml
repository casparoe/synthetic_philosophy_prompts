prompt: |-
  I serve on the risk assessment committee of a private foundation that funds research on global catastrophic and existential risks. We are considering a proposal requesting $2.3 million over three years to investigate whether a specific class of high-energy physics experiments could trigger a vacuum decay event — a phase transition of the quantum vacuum that would propagate at light speed and render the observable universe uninhabitable. No laboratory currently plans such experiments, but the proponents argue that since the stakes are effectively infinite (the loss of all future value in our light cone), any nonzero probability of preventing this outcome justifies the expenditure, and they place the annual probability on the order of 10⁻¹⁵. Two committee members have already objected that this reasoning would obligate us to fund any proposal that claims to address an extinction-level risk at any nonzero probability, since the expected-value math always favors infinite stakes. Another member counters that refusing on those grounds amounts to abandoning expected-value reasoning exactly where the stakes are highest. Draft the committee's decision memo: it should recommend approval, rejection, or approval with conditions, and it should address whether the foundation needs a standing policy for proposals that invoke this form of reasoning — and if so, what that policy should be. The memo should engage seriously with the strongest arguments on both sides.
reasoning: |-
  Here's a thinking process that leads to the suggested committee decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Risk Assessment Committee of a private foundation.
      *   **Context:** Funding research on global catastrophic and existential risks (GCR/XR).
      *   **Proposal:** $2.3M over 3 years to investigate vacuum decay risks from high-energy physics experiments.
      *   **Key Argument (Proponents):** Infinite stakes (end of future value) $\times$ nonzero probability ($10^{-15}$/year) = Infinite/High Expected Value (EV). Therefore, fund.
      *   **Key Objection (Critics):** "Pascal's Mugging." If we accept this logic, we must fund *any* claim with infinite stakes and nonzero probability, leading to resource exhaustion on speculative claims.
      *   **Counter-Objection:** Abandoning EV reasoning at high stakes is irrational/negligent.
      *   **Task:** Draft a Committee Decision Memo.
      *   **Requirements:** Recommend approval/rejection/conditional; address the need for a standing policy; engage seriously with both sides.

  2.  **Determine the Recommendation:**
      *   *Option A: Approval.* Risks validating "Pascal's Mugging." $2.3M is significant. The risk is hypothetical (no labs plan this).
      *   *Option B: Rejection.* Risks ignoring genuine tail risks. Might signal the foundation isn't serious about XR.
      *   *Option C: Approval with Conditions / Pivot.* This is usually the most nuanced and responsible path for a foundation. It acknowledges the importance of the *question* without validating the flawed *mathematical reasoning* or setting a dangerous precedent.
      *   *Decision:* **Rejection of the specific proposal as framed, but with a pathway for limited support under a new policy framework.** Actually, looking at the constraints ($2.3M is a lot for a theoretical physics safety check on something no one is building), a **Rejection** of *this specific proposal* is more defensible, coupled with a **New Policy**. Why? Because funding this specific amount for this specific question validates the "infinite EV" argument directly. However, the prompt asks to engage seriously. A flat rejection might look like ignoring the risk. A conditional approval (smaller grant, specific scope) shows due diligence without opening the floodgates.
      *   *Refined Decision:* **Rejection of the proposal as submitted, but with a recommendation to establish a standing policy for "Infinite Stakes Claims" that allows for limited, scoped investigation under strict epistemic criteria.** This balances the need to not be mugged with the need to not be negligent.

      *Wait, let's reconsider.* If the foundation's mandate is XR, ignoring a $10^{-15}$ risk of total annihilation might be seen as a failure of mission. However, $10^{-15}$ is incredibly small. Cosmic rays hit the atmosphere at energies far higher than colliders constantly. If vacuum decay were that easy, it likely would have happened already (the "cosmic ray argument"). The proposal asks to investigate *whether* it could trigger it.
      *   *Stronger Position:* **Rejection.** The scientific consensus (based on cosmic ray bounds) already makes the risk negligible enough that $2.3M is not the marginal dollar that saves the world. Funding this sets a bad precedent.
      *   *Better Position for a Memo:* **Rejection of the specific proposal, but Approval of a Policy Framework.** This addresses the systemic issue.

      *Let's try to find a middle ground that respects the EV argument.* If we reject solely on "Pascal's Mugging" grounds, we admit we aren't pure EV maximizers. If we accept, we are mugged.
      *   *Decision:* **Rejection of the proposal, Recommendation to adopt a "Epistemic Stability Policy."**
      *   *Rationale:* The specific probability estimate ($10^{-15}$) is not robust enough to overcome the "mugging" objection, *but* the principle of investigating high-consequence/low-probability events remains valid. We need a policy to filter these.

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The decision and the core reasoning.
      *   **Background:** Summary of the proposal and the debate.
      *   **Analysis of Arguments:**
          *   The Proponent's EV Argument (Infinite Stakes).
          *   The Critic's "Pascal's Mugging" Argument (Epistemic Security).
          *   The Scientific Context (Cosmic Ray Bounds).
      *   **Committee Decision:** Reject proposal, Adopt Policy.
      *   **Proposed Policy Framework:** Criteria for future "Infinite Stakes" proposals.
      *   **Conclusion.**

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Summary:* Clear statement. Reject $2.3M request. Adopt new screening policy.
      *   *Background:* Briefly state the vacuum decay hypothesis and the cost.
      *   *Deliberation (The Core):*
          *   *Side A (EV):* If $P > 0$ and Value = $\infty$, EV = $\infty$. Ignoring this is irrational if we claim to be EV-driven.
          *   *Side B (Mugging):* Probabilities like $10^{-15}$ are essentially guesses. If we accept unverified low probs with infinite stakes, we divert resources from robust interventions (e.g., AI safety, biosecurity). It creates a "black hole" for funding.
          *   *Synthesis:* We need "Epistemic Humility." We cannot treat subjective probability estimates of extreme tail events as hard numbers. We need independent verification of the *mechanism* before funding the *risk assessment*.
          *   *Scientific Reality Check:* Mention the cosmic ray argument (nature already runs higher energy experiments). This lowers the prior probability significantly, undermining the urgency of the $2.3M ask.
      *   *Decision:* Do not fund this specific proposal. The cost is too high for the marginal reduction in uncertainty given existing physics bounds.
      *   *Policy:* Create a "High-Stakes Epistemic Review."
          *   Requirement for independent priors.
          *   Cap on funding for purely theoretical risk verification.
          *   Requirement to show marginal value of information (VOI).

  5.  **Refining the Tone:**
      *   Must be professional, objective, and charitable to both sides.
      *   Avoid dismissing the risk entirely (it *is* an existential risk foundation).
      *   Avoid accepting the Pascal's Mugging logic uncritically.
      *   Use terms like "Expected Value," "Epistemic Security," "Marginal Value of Information," "Pascal's Mugging."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is rejecting the proposal too harsh?
      *   *Fix:* Offer a path for a much smaller scoping grant ($50k) to review existing literature, rather than $2.3M for new research. This shows good faith without opening the vault.
      *   *Critique:* Is the policy too vague?
      *   *Fix:* Define specific criteria (e.g., VOI analysis, independent probability audit).
      *   *Check:* Did I address the "abandoning EV reasoning" counter-argument?
      *   *Fix:* Explicitly state that we are *refining* EV reasoning, not abandoning it. Pure EV breaks down with uncalibrated probabilities; we are applying "Bayesian conservatism."

  7.  **Final Polish:** Check formatting, clarity, and ensure all prompt requirements are met. (Ensure the distinction between the specific proposal and the general policy is clear).

      *(Self-Correction on the Decision)*: Actually, a "Rejection" might be too final for a foundation dedicated to XR. A "Conditional Approval" for a *phase 1* study (much smaller) is often more diplomatic in these contexts. It acknowledges the risk without committing the full $2.3M. Let's go with **Rejection of the $2.3M request, but approval of a limited scoping grant ($75k) contingent on the new policy.** This demonstrates fiscal responsibility while respecting the mission.

      *Wait, looking at the prompt again:* "Draft the committee's decision memo: it should recommend approval, rejection, or approval with conditions."
      Okay, I will recommend **Rejection of the proposal as submitted**, but **Approval of a Standing Policy** that allows for future, more rigorously vetted proposals of this nature. This is the strongest governance move.

      *Wait, one more nuance:* The prompt asks to engage seriously with the argument that refusing amounts to abandoning EV. I need to make sure the memo explains *why* refusing *this specific calculation* is actually *better* EV reasoning (due to probability uncertainty), not an abandonment of the framework.

      *Final Plan:*
