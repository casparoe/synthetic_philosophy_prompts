  *   **Why it fits the data:** It includes Christianity, Buddhism (karma/rebirth), Confucianism (ancestors/Heaven), Scientology, and Cargo Cults. It excludes Football and Model Railways because they deal only with empirical objects (balls, trains) and social constructs without supernatural claims.
