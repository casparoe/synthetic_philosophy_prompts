  *   **Prediction for Solitary Person:** **Religion.** They believe in spirits and an afterlife. The lack of community is irrelevant to the *content* of the belief.

  ### Rule 2: The "Sacred Community" Rule (Functional/Durkheimian)
  **The Rule:** A system is a religion if it is a unified system of beliefs and practices relative to *sacred* things (inviolable, set apart) that unite adherents into a single moral community.
  *   **Why it fits the data:** It includes all the "Religion" examples because they all have a community bound by inviolable norms. It excludes Football and Model Railways because, while they have rituals and community, their objects (teams, layouts) are not treated as *sacred* in a moral/cosmic sense (quitting a fan club is not a sin; missing a meet-up is not sacrilege).
  *   **Prediction for Political Group:** **Religion.** They have a community, inviolable texts/dates, and the movement gives "meaning to life." The lack of supernaturalism is irrelevant to the *function* of the group.
  *   **Prediction for Solitary Person:** **Not Religion.** There is no community, no shared practices, and no moral binding of a group. This is "spirituality" or "superstition," not religion.

