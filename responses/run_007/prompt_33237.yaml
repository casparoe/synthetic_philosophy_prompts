  ### The Decisive Test Case

  To determine whether she prioritizes **Ontology (Rule 1)** or **Community (Rule 2)**, you need a case that has one but not the other, without the confounding variables of the previous examples.

  **The Case:**
  > **A secular recovery group (like a strictly atheistic AA variant).**
  > Members meet weekly, follow 12 steps adapted to remove all references to God/Higher Power, treat the steps as inviolable for their survival, share a profound sense of ultimate meaning and redemption, and have a strong community. They explicitly deny any supernatural forces.

  **Why this settles it:**
  *   **If she says "Religion":** She is using **Rule 2 (Sacred Community)**. She cares about the social function and the "sacred" status of the norms, regardless of supernatural content.
  *   **If she says "Not Religion":** She is using **Rule 1 (Ontology)** (or the Hybrid). She believes that without a claim about the nature of reality beyond the empirical (spirits, gods, karma), it cannot be religion, no matter how much it *feels* like one.

  Given her insistence on "Ancestor rites and Heaven" for Confucianism, my money is on her saying **"Not Religion,"** confirming that for her, **supernatural ontology is the necessary condition.**
