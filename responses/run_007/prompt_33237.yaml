  ### My Best Guess at Her Verdicts

  I suspect your friend will classify **both** new cases as **"Not Religion."**

  Here is why: She is studying religion as a **natural phenomenon**. In contemporary cognitive and social science (e.g., Pascal Boyer, Scott Atran, Harvey Whitehouse), religion is typically defined as a *social* transmission of *counter-intuitive* concepts.
  1.  **Political Group:** She excluded Football despite its "real collective emotion" and rituals. This signals that secular ritual + community is insufficient for her. She will likely view the Political Group as a "secular ideology" or "civil religion," but not religion *proper*, because it lacks the ontological claim (Rule 1).
  2.  **Solitary Person:** While this fits Rule 1, most sociologists and phenomenologists reject "invisible religion." If there is no transmission, no institution, and no group, it is a psychological state, not a social phenomenon. Since her PhD is on religion as a *phenomenon* (implying observation of social facts), she likely requires a minimum threshold of social structure.

  **Conclusion:** She is likely running a **Hybrid Rule**: *Religion requires both counter-intuitive ontology AND a minimum threshold of social transmission.*

