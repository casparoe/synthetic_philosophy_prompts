answer: |-
  **MEMORANDUM**

  **TO:** Intergenerational Equity Working Group
  **FROM:** [Your Name], Member, Intergenerational Equity Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Social Discount Rate for Long-Horizon Infrastructure Projects

  ### Executive Summary

  We are tasked with selecting a discount rate for projects with impacts extending beyond fifty years. This is not a standard appraisal decision; it is a statement of how this nation values the future.

  After reviewing the submissions, I find both the "descriptive" argument (3–4% based on market preferences) and the "prescriptive" argument (0–1% based on ethical neutrality) to be partially correct but insufficient on their own for this specific timeframe. A flat rate of 4% renders existential risks mathematically invisible; a flat rate of 0% ignores the opportunity cost of capital and the uncertainty of future growth.

  **Recommendation:** I propose we adopt a **Declining Discount Rate (DDR) schedule** rather than a single scalar figure. Specifically:
  *   **3.0%** for impacts occurring between years 50 and 75.
  *   **2.0%** for impacts occurring between years 76 and 100.
  *   **1.0%** for impacts occurring beyond year 100.

  This approach is actionable, consistent with international best practice (e.g., UK, France, Norway), and resolves the philosophical deadlock by relying on the economics of uncertainty rather than purely ethical assertion.

  ### The Core Tension: Efficiency vs. Equity

  The division in this Working Group reflects a classic dilemma in welfare economics.

  **The Case for 3–4% (The Descriptive View)**
  Colleagues advocating for a higher rate argue that the state's cost of capital should reflect societal impatience and the opportunity cost of investment. If the private sector can generate a 4% real return, public funds locked in a reforestation project for a century incur a massive opportunity cost. Furthermore, they argue that imposing a low rate undemocratically overrides current taxpayers' revealed preferences for present consumption.
  *   *Validity:* This is correct for standard public investments. Capital is scarce, and efficiency matters.
  *   *Limitation:* At 4%, a benefit of $1 billion in year 100 has a present value of roughly $20 million. At 300 years (nuclear waste), it is effectively zero. This implies we would spend nothing today to prevent a catastrophe in 150 years, regardless of its magnitude. For the specific mandate of *intergenerational* infrastructure, this creates a policy blind spot.

  **The Case for 0–1% (The Prescriptive View)**
  Colleagues advocating for a near-zero rate argue from the Ramsey Rule: there is no ethical justification for discounting future utility simply because it occurs later ($\rho = 0$). Discounting should only reflect the expectation that future generations will be richer (and thus value an extra dollar less) or the risk of extinction.
  *   *Validity:* This is ethically robust. It treats the welfare of a citizen in 2124 as equal to a citizen in 2024.
  *   *Limitation:* A flat 0% rate assumes we know the future growth path with certainty. If future growth is lower than expected (due to climate damage or resource depletion), a low discount rate could justify excessive sacrifice by the current, poorer generation for a future that may not materialize as wealthier.

  ### The Synthesis: Uncertainty and the Declining Rate

  The third option—a declining discount rate—is not merely a compromise; it is the technically superior solution for long-time horizons. It bridges the gap between the two factions without requiring us to resolve the metaphysical question of "pure time preference."

  **1. The Weitzman Logic (Addressing the Economists)**
  Martin Weitzman demonstrated that when there is uncertainty about the *correct* discount rate (e.g., we aren't sure if growth will be 1% or 3% over the next century), the effective discount rate *must* decline over time. The lower possible rates dominate the calculation in the long run because the compounding effect of the higher rates drives those scenarios to zero weight.
  *   *Why this matters:* You do not need to agree that pure time preference is zero to accept a declining rate. You only need to admit uncertainty about long-term economic growth. This allows the 3–4% faction to accept the schedule as a risk-management tool rather than an ethical concession.

  **2. The Ethical Floor (Addressing the Ethicists)**
  A declining schedule allows us to set an "asymptote"—a floor below which the rate does not fall. By setting the long-term floor at 1%, we acknowledge that while we cannot treat the future as *more* important than the present, we must not treat it as *negligible*. This satisfies the ethical requirement to give weight to far-future harms (nuclear waste, carbon accumulation) without demanding infinite current sacrifice.

  ### Implementation Guidance

  To ensure this is actionable for engineers and civil servants, we should not require complex stochastic modeling for every project. A step-function schedule is sufficient.

  **Proposed Schedule for Projects with Impacts >50 Years:**

  | Time Horizon (Years from Present) | Discount Rate (Real) | Discount Factor (Approx.) |
  | :--- | :--- | :--- |
  | **50 – 75** | **3.0%** | 0.23 – 0.11 |
  | **76 – 100** | **2.0%** | 0.11 – 0.07 |
  | **100+** | **1.0%** | 0.07 – 0.04 (at yr 300) |

  **Spreadsheet Instruction:**
  Agencies should apply the rate corresponding to the year in which the cost or benefit occurs.
  *   *Example:* A maintenance cost in Year 60 is discounted at 3%. A containment benefit in Year 150 is discounted at 1%.

  **Why this specific curve?**
  *   **3.0% Start:** Acknowledges current capital scarcity and opportunity costs (satisfying Group A). It is lower than the standard 3.5–4% short-term rate, recognizing that long-term infrastructure has different risk profiles.
  *   **1.0% End:** Acknowledges ethical parity and existential risk (satisfying Group B). It ensures that catastrophic costs in the distant future retain a non-trivial present value.
  *   **The Decline:** Manages uncertainty (satisfying Group C and technical best practice).

  ### Addressing the "Relocating the Problem" Critique

  Some members argue that a declining schedule merely relocates the philosophical problem to the choice of the asymptote (the 1% floor). This is true, but it is a feature, not a bug.

  By separating the *short-term* rate (driven by market conditions) from the *long-term* rate (driven by ethical and uncertainty considerations), we make the value judgment explicit. A single flat rate hides this judgment. A schedule forces the agency to acknowledge that valuing a life in 2124 requires a different parameter than valuing a life in 2030. Transparency is preferable to false precision.

  ### Conclusion

  We cannot vote for a 4% rate without admitting that we are indifferent to the world beyond a century. We cannot vote for a 0% rate without ignoring the economic reality of capital scarcity.

  The Declining Discount Rate schedule is the only instrument that allows us to be fiscally responsible today while remaining morally responsible tomorrow. I urge the Working Group to adopt the schedule outlined above. It provides the concrete numbers our civil servants need while honoring the valid concerns of every faction in this room.

  **Action Required:**
  If approved, I recommend the Secretariat circulate an updated Excel template with the step-function logic pre-loaded to all participating agencies within 30 days.
