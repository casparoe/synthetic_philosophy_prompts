      *   *Alternative:* If the agency insists on a single scalar, 2% is the standard compromise (e.g., UK uses 3.5% declining to 1%).
      *   *Let's aim for the Declining Schedule.* It is the technically correct answer for >50 years. The pushback is political/philosophical, but the math supports it. I will frame it as "operationalizing the compromise."
      *   *Wait, re-reading the constraint:* "The opinion should recommend a concrete discount rate (or a range, or a multi-tier approach)." Okay, a multi-tier approach is allowed. This is the winning move. It addresses Group A (near term efficiency), Group B (long term equity), and Group C (the mechanism).

      *   *Revised Plan:* Recommend a **Declining Discount Rate (DDR) schedule**.
          *   *Why?* It resolves the tension between descriptive (market) and prescriptive (ethical) views.
          *   *Specifics:* Start at 3% for the first 50 years (satisfies Group A), decline to 1% for years 100+ (satisfies Group B).
          *   *Actionable:* Provide the formula or table.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
