      *   *Wait, let's consider the "Single Rate" option again.* If I must pick a single number for the >50 year bucket... 2% is the standard compromise (e.g. UK Green Book uses 3.5% generally, but for very long term, it declines). If I pick 2%, Group A complains it's too low (opportunity cost), Group B complains it's too high (ethical).
      *   *Decision:* The DDR is the only intellectually honest answer for an expert. I will advocate for that, but I will also provide a "single rate equivalent" if they force a scalar (e.g., 2.5%). No, better to stand firm on the DDR as it's best practice. I will frame it as "A Single Schedule."

