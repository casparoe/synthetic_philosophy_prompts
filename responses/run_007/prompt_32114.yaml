      *(Refining the d/e/f triad)*: The user suspects (d) and (e) make (f) harder. Why? If consciousness is widespread (d), but requires a threshold (e), then exclusion (f) becomes a tool to prune the widespread consciousness. The tension is: Does Exclusion *eliminate* the consciousness of the parts, or just *mask* it? IIT says eliminate (ontologically). If the user thinks the parts *still have* experience but we just don't count them, that contradicts Exclusion. I need to probe this.

