prompt: |-
  ok so my friend and i have been going back and forth about this and i'm trying to figure out what i actually think. i've been reading about evolutionary debunking arguments in metaethics — the sharon street / richard joyce kind of thing — where the idea is basically: our moral intuitions (like "hurting innocent people is wrong") got shaped by natural selection because having those intuitions helped our ancestors survive and cooperate. but natural selection only cares about fitness, not about tracking moral truth. so if i think torturing is wrong because my ancestors who had that thought left more descendants, that's not exactly a good reason to think torturing is *objectively* wrong, in the way that "i believe 2+2=4 because my ancestors who believed that survived better" would be a weird reason to trust math. it's like a termometer that was built to tell you whatever temperature keeps the factory running, not the actual temperature.

  so my question is: what's your actual credence that evolutionary debunking arguments succeed in undercutting moral realism — the view that there are objective, mind-independent moral facts? i want a number, and i want the reasoning decomposed into sub-questions.

  like, it seems to me the main sub-questions are something like:

  (a) how much of our core moral psychology is actually explained by evolutionary pressures rather than by cultural learning or rational reflection? (if evolution only explains a little bit, the debunking doesn't bite that hard)

  (b) even if evolution shaped our moral intuitions, could evolution have been tracking moral truth anyway — like maybe being cooperative really is objectively good, and it's also adaptive, so the evolutionary process reliably got us to the right answer even if it wasn't "aiming" at truth?

  (c) if the evolutionary process is genuinely off-track (fitness and moral truth are different things and evolution only aimed at fitness), does that actually give us a defeater for our moral beliefs, or can moral realists offer a "third-factor" explanation where some independent factor caused both the moral truth and the fitness benefit?

  (d) and even if the debunking works against some moral intuitions, does it work against all of them — like, could you debunk "don't kill your in-group" but not "pain is intrinsically bad"?

  i want your rough probabilties for each of those (or whatever sub-questions you think are the right ones), and how they combine to your overall credence. then tell me which sub-question the final number is most sensitive to — like if you could magically get definitive evidence on exactly one of them, which one would shift your overall credence the most, and what would that evidence look like?
