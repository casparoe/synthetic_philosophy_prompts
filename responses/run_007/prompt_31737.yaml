answer: |-
  You have identified the central pathology in the literature: theorists often begin defending a solution before agreeing on what counts as the problem. The "drain" you describe is the result of conflating *phenomenological data* (what it is like) with *mechanistic hypotheses* (how the brain does it) and *metaphysical commitments* (what consciousness is).

  To break the circle, we need a specification sheet. Below is a proposed list of desiderata for a theory of the temporal structure of conscious experience, categorized by their domain. I have flagged which are non-negotiable (grounded in logic or empirical necessity) and which are parochial (grounded in specific theoretical traditions).

  ### I. The Desiderata List

  #### A. Phenomenological Adequacy (The Data)
  1.  **The Illusion Accommodation Requirement:** The theory must explain why veridical perception is not the default. It must account for specific temporal illusions (Color Phi, Cutaneous Rabbit, Flash-Lag) without dismissing them as mere "errors" in judgment.
      *   *Justification:* If a theory of temporal experience cannot explain why time *appears* to behave differently than physics dictates in controlled settings, it is a theory of physics, not experience.
      *   *Status:* **Non-Negotiable.**

  2.  **The Specious Present Requirement:** The theory must account for the experience of duration, not just temporal ordering. It must explain how a "specious present" (a short duration experienced as a unitary "now") is constituted from discrete or extended neural processes.
      *   *Justification:* Experience is not a pointillist series of snapshots; it has temporal thickness (we hear melodies, not just tones). A theory that only explains time-stamping fails to explain temporal *gestalt*.
      *   *Status:* **Non-Negotiable.**

  3.  **The Synchrony Requirement:** The theory must explain how signals with vastly different transmission latencies (e.g., visual vs. auditory vs. proprioceptive) are experienced as simultaneous when their sources are simultaneous in the world.
      *   *Justification:* This is the "temporal binding problem." If the theory cannot explain multi-sensory integration without invoking magic, it fails.
      *   *Status:* **Non-Negotiable.**

  #### B. Mechanistic/Physical Plausibility (The Hardware)
  4.  **The Latency Constraint:** The theory must respect the fact that neural processing is not instantaneous. It cannot posit that conscious experience occurs at the time of the stimulus onset.
      *   *Justification:* Biological realism. Phototransduction and cortical transmission take time (tens to hundreds of milliseconds).
      *   *Status:* **Non-Negotiable.**

  5.  **The Distributed Processing Constraint:** The theory must accommodate the fact that different features of a single event (motion, color, location) are processed in different cortical areas at different speeds.
      *   *Justification:* Neurophysiological fact. A theory requiring a single "integration center" where everything arrives simultaneously is anatomically false.
      *   *Status:* **Non-Negotiable.**

  #### C. Conceptual/Meta-Theoretical Clarity (The Logic)
  6.  **The Content/Report Distinction:** The theory must distinguish between the *content* of the experience (what is experienced) and the *report* of the experience (the judgment/verbalization).
      *   *Justification:* In experiments like Libet's or Color Phi, the report is the only data we have. If the theory conflates the report with the experience, it cannot account for memory distortion or post-hoc rationalization.
      *   *Status:* **Non-Negotiable.**

  7.  **The Time-of-Experience vs. Time-Represented Distinction:** The theory must explicitly distinguish between *when* an experience occurs (the timestamp of the neural state constituting consciousness) and *what time* the experience represents (the content, e.g., "the light flashed *now*").
      *   *Justification:* This is the category error underlying most paradoxes. One can have an experience *at* t=200ms that represents an event *at* t=0ms. Confusing these generates the "backwards masking" paradoxes.
      *   *Status:* **Non-Negotiable.**

  8.  **The Orwellian/Stalinesque Operationalization:** The theory must either provide a principled, empirical criterion for distinguishing between pre-conscious editing (Stalinesque) and post-conscious memory revision (Orwellian), or explain why the distinction is theoretically void.
      *   *Justification:* Dennett's challenge. If a theory uses these terms without defining how to distinguish them empirically, it is engaging in metaphor, not science.
      *   *Status:* **Parochial Commitment.** (See analysis below).

  9.  **The "Moment of Entry" Specification:** The theory must specify whether there is a determinate time at which a content "becomes conscious."
      *   *Justification:* Many theories assume this is a meaningful question.
      *   *Status:* **Parochial Commitment.** (Likely a Cartesian hangup).

  10. **The Paradox Explanation Requirement:** The theory must explain *why* the paradoxes arise intuitively. It is not enough to solve the puzzle; the theory must explain why the puzzle seemed puzzling in the first place (i.e., account for the user's intuition of a unified, immediate present).
      *   *Justification:* If a theory solves the data but leaves the phenomenology of "flow" unexplained, it has changed the subject.
      *   *Status:* **Non-Negotiable.**

  ---

  ### II. Non-Negotiables vs. Parochial Commitments

  You asked to flag which requirements are genuine constraints and which are theoretical baggage.

  **The Non-Negotiables:**
  *   **Latency & Distributed Processing (4 & 5):** You cannot build a theory of brain-based consciousness that violates known neurophysiology.
  *   **Content/Report & Time-of/Time-Represented (6 & 7):** These are logical distinctions. Failing to make them renders the theory incoherent (like confusing a map with the territory).
  *   **Illusion Accommodation (1):** A theory of perception that claims perception is always veridical is falsified by the existence of illusions.

  **The Parochial Commitments:**
  *   **The "Moment of Entry" (9):** This is the biggest trap. Demanding a specific timestamp for "when consciousness happens" presupposes that consciousness is an event with a sharp boundary. **Multiple Drafts** theory argues this is a category error. If you demand this, you have already ruled out Dennett-style accounts *by fiat*, not by evidence. This is a Cartesian Theater commitment.
  *   **The Orwellian/Stalinesque Distinction (8):** Dennett's core argument is that this distinction is only valid if there is a "finish line" where experience becomes real. If there is no finish line, there is no "before" or "after" consciousness to locate the edit. Demanding a theory *pick a side* here is demanding it accept a premise (the finish line) that may be false. A truly adequate theory might dissolve the distinction rather than satisfy it.

  ---

  ### III. The "Bell's Theorem" of Temporal Experience

  You asked if any subset of these requirements is jointly unsatisfiable. I suspect there is a **Trilemma of Temporal Experience** analogous to Bell's inequalities. Consider these three intuitive premises:

  1.  **Phenomenal Directness:** We experience external events roughly when they happen (we don't feel like we are living in the past).
  2.  **Neural Realism:** Conscious experience supervenes on neural processes that take significant time (latencies, integration windows).
  3.  **Temporal Unity:** At any given moment, experience is a unified, coherent state (not a fragmented jumble of processing stages).

  **The Conflict:**
  *   If you hold **1 & 2**, you violate **3**. (If I experience the world "now" but my brain is slow, my experience must be constructed from fragmented past data, implying disunity or "smearing" until integration is complete).
  *   If you hold **1 & 3**, you violate **2**. (To have unified, immediate experience, you must ignore neural latency, implying dualism or magic).
  *   If you hold **2 & 3**, you violate **1**. (If processing is slow and unified, we must experience the past, not the present. But we don't *feel* like we experience the past).

  **Implication:**
  Any theory must sacrifice one of these intuitions.
  *   **Sensory-Delay accounts** sacrifice **1** (We live ~80ms in the past).
  *   **Postdictive accounts** sacrifice **1** and modify **3** (Unity is achieved by rewriting the past).
  *   **Multiple Drafts** sacrifices **3** (There is no single unified state at a time) and redefines **1** (Directness is a user-illusion).

  If you demand a theory that satisfies all three, you are asking for the impossible. This suggests the "drain" you noticed is not just sociological; it is structural. The literature circles because theorists are trying to maximize all three variables in a system where they are inversely related.

  ---

  ### IV. Scoring the Major Families

  Here is how the main theoretical camps score against the desiderata, keeping the Trilemma in mind.

  | Desideratum | Sensory-Delay ("Stalinesque") | Postdictive ("Orwellian") | Multiple Drafts (Dennett) |
  | :--- | :--- | :--- | :--- |
  | **1. Illusion Accommodation** | **Pass.** Explains illusions as waiting for data. | **Pass.** Explains illusions as narrative revision. | **Pass.** Explains illusions as competition between drafts. |
  | **2. Specious Present** | **Weak.** Treats it as a buffer window. | **Weak.** Treats it as a memory construct. | **Strong.** Treats it as a narrative density. |
  | **3. Synchrony** | **Pass.** Posits a waiting mechanism for slower signals. | **Pass.** Posits post-hoc alignment. | **Pass.** Posits parallel processing streams. |
  | **4. Latency Constraint** | **Pass.** Explicitly relies on it. | **Pass.** Explicitly relies on it. | **Pass.** Explicitly relies on it. |
  | **5. Distributed Processing** | **Weak.** Often implies a central integrator. | **Weak.** Often implies a central editor. | **Strong.** Built on distributed parallelism. |
  | **6. Content/Report Distinction** | **Pass.** | **Pass.** | **Strong.** (Report *is* a form of content). |
  | **7. Time-of vs. Time-Represented** | **Pass.** | **Pass.** | **Strong.** (Dissolves "Time-of"). |
  | **8. Orwellian/Stalinesque** | **Commits.** Picks Stalinesque. | **Commits.** Picks Orwellian. | **Dissolves.** Rejects the dichotomy. |
  | **9. Moment of Entry** | **Commits.** Yes (after delay). | **Commits.** Yes (after revision). | **Rejects.** (Parochial hangup). |
  | **10. Paradox Explanation** | **Weak.** Says "brain is slow." | **Weak.** Says "memory is tricky." | **Strong.** Says "Cartesian Theater is the bug." |

  **Calibration:**
  *   **Sensory-Delay** is the most intuitive but struggles with the *Flash-Lag* effect (where the brain doesn't just wait, it extrapolates). It also risks making consciousness epiphenomenal (waiting for the show to start before turning on the lights).
  *   **Postdictive** handles the data well but risks making consciousness a "falsification" of history. It struggles with the *phenomenology* of immediacy (why doesn't it *feel* like a revision?).
  *   **Multiple Drafts** scores highest on conceptual coherence and neuro-plausibility but often feels unsatisfying to those seeking an ontological account of *when* experience happens. It wins by changing the rules of the game (rejecting Desideratum 9).

  ### V. Recommendation for Your Research

  If you want to avoid the drain, adopt the **Time-of vs. Time-Represented (Desideratum 7)** distinction as your primary filter.

  When evaluating a new paper, ask: *Does this author claim to have found the time at which the experience occurs, or the time the experience represents?*
  *   If they claim the former without addressing the Distributed Processing Constraint (5), they are likely positing a Cartesian Theater.
  *   If they claim the latter, check if they explain why we confuse the two (Paradox Explanation 10).

  Finally, treat the **Orwellian/Stalinesque** distinction (8) not as a binary choice a theory must make, but as a diagnostic tool. If a theory cannot explain why we *think* there is a difference, it has failed the Paradox Explanation Requirement, regardless of whether it picks a side.

  The "Bell's Theorem" insight here is that you should not look for a theory that preserves the *feeling* of immediate, unified presence (Premises 1 & 3 of the Trilemma) while respecting neural latency (Premise 2). You must look for a theory that explains why we have that feeling *despite* it being false. That shifts the burden from "saving the phenomena" to "explaining the illusion of the phenomena," which is where the most robust work (like Dennett's or predictive processing accounts) is currently happening.
