answer: |-
  **HANDOUT: Frankfurt-Style Cases Without Science Fiction**

  **The Scenario**
  Marcus is presenting the quarterly budget to his board. He knows a significant error was his fault, and he faces a choice: confess (risking his bonus) or lie (saving his bonus). His colleague, Sarah, sits beside him; she desperately wants him to lie to protect the department's reputation. Sarah knows Marcus intimately and is aware of an involuntary physiological marker: whenever Marcus is about to speak the truth about a mistake, his pupils dilate noticeably just before he opens his mouth. Sarah has decided that if she sees this dilation, she will immediately interrupt him and falsely take the blame herself, making it impossible for Marcus to confess. Marcus, motivated entirely by his own desire to keep his bonus, decides to lie. He speaks smoothly, his pupils remain normal, and Sarah never intervenes.

  **The Frankfurt Analysis**
  **[Settled Intuition]:** Most observers agree that Marcus is morally responsible for the lie. He acted on his own reasons, without coercion, and the actual sequence of events was untouched by Sarah.
  **[Contested Inference]:** Proponents of the Frankfurt argument claim this intuition refutes the Principle of Alternative Possibilities (PAP), which states that an agent is responsible only if they could have done otherwise. In this case, Marcus *could not* have confessed: had he tried, the pupil dilation would have triggered Sarah's intervention, ensuring the lie (or a functional equivalent) occurred anyway. Since Marcus is responsible despite lacking the ability to confess, the argument concludes that alternative possibilities are not necessary for responsibility. The work is done by the **counterfactual intervener** (Sarah) who removes the alternative without affecting the actual cause of the action.

  **The PAP Defender's Reply: The "Flicker of Freedom"**
  **[Contested Objection]:** A defender of PAP will argue that Marcus *did* have an alternative possibility, however slight. He could have initiated the sequence leading to confession. Specifically, he could have manifested the pupil dilation. Even if Sarah would have thwarted the *outcome* (the confession), the *onset* of the dilation is a distinct event under Marcus's control. This "flicker" of an alternative possibility (the decision to try to confess, signaled by the dilation) is robust enough to ground responsibility.
  **[Feature Doing the Work]:** This reply relies on the **gap between the sign and the action**. If the pupil dilation is truly involuntary and causally prior to the voluntary decision, the flicker is blocked. However, if the dilation is part of the voluntary act of confessing, the alternative possibility remains. The debate turns on whether "could have done otherwise" requires the ability to succeed in doing otherwise, or merely the ability to *try*.

  **Status of the Debate**
  **[Settled]:** It is widely accepted that Frankfurt-style cases successfully shift the burden of proof onto PAP defenders; pure determinism is no longer assumed to automatically negate responsibility by these theorists.
  **[Contested]:** It is *not* consensus that PAP is false. Many philosophers argue that "flickers" of freedom are sufficient to save PAP, or that the very presence of the counterfactual intervener changes the nature of the agent's control in ways that undermine responsibility. This handout presents the *structure* of the argument, not a settled metaphysical conclusion.
