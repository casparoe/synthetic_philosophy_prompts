answer: |-
  Your suspicion is well-founded. The book's summary is a classic example of pop-philosophy oversimplification: it gets the logic right but the history and the philosophical conclusion wrong.

  Here is the breakdown of what is accurate, what is misleading, and what is actually going on in the philosophy of science.

  ### 1. What the book got right
  The logical setup is correct. In classical logic, the statement **"All ravens are black"** is indeed logically equivalent to **"All non-black things are non-ravens."** This is the law of contraposition.
  *   If you find a raven, it must be black.
  *   If you find something that isn't black, it cannot be a raven.

  Therefore, logically, any observation of a non-black thing that turns out not to be a raven (like a white shoe, a red apple, or a blue car) is consistent with the hypothesis. In Hempel's specific framework of confirmation (developed in the 1940s), this *does* technically count as confirming evidence.

  ### 2. What the book got wrong
  The claim that **"philosophers gave up on trying to formalize how evidence works"** is false.

  Confirmation theory is not a dead field; it is one of the most active areas in epistemology and philosophy of science today. However, it shifted away from the specific system Hempel was using (Logical Empiricism) toward **Bayesian Confirmation Theory**.

  Furthermore, the book implies Hempel presented this as a *reductio ad absurdum* (a proof that the system is broken). He didn't. Hempel actually **accepted the conclusion.** He argued that the paradox is only psychological. He believed that observing a white shoe *does* confirm that all ravens are black, but our intuition tricks us into thinking it doesn't because we know there are so many non-black things in the world that checking them all feels pointless.

  ### 3. So, what is the actual solution?
  Philosophers and statisticians have spent the last 70 years refining this. There are three main ways the paradox is handled today. None of them involve "giving up."

  #### A. The Bayesian Solution (The most popular)
  Bayesianism treats confirmation as a change in probability. Does seeing a white shoe increase the probability that "All ravens are black"?
  *   **Yes, but negligibly.**
  *   Imagine there are 100 ravens in the world and 1,000,000 non-black objects.
  *   Finding a black raven eliminates 1 potential falsifier out of 100. That's a significant boost to your confidence.
  *   Finding a white shoe eliminates 1 potential falsifier out of 1,000,000. That is a mathematical increase in confidence, but it is so infinitesimally small that it feels like zero.
  *   **Verdict:** The logic holds, but the *weight* of the evidence is what matters. The book ignored the difference between *some* confirmation and *significant* confirmation.

  #### B. The Background Knowledge Solution
  This argument suggests that confirmation doesn't happen in a vacuum.
  *   If you pick up an object at random, don't know what it is, and discover it is a non-black shoe, that *does* tell you something about the universe's distribution of ravens.
  *   However, if you *already know* it is a shoe before you check its color, you have learned nothing about ravens. You already knew shoes aren't ravens.
  *   **Verdict:** The paradox arises because we implicitly assume we already know the object is a shoe. If we treat the observation as "Here is an unknown object; it is non-black; it is not a raven," it feels more relevant.

  #### C. The "Natural Kinds" Solution (W.V.O. Quine)
  The philosopher W.V.O. Quine argued that not all predicates are created equal.
  *   "Raven" and "Black" are **natural kinds**; they carve nature at its joints. We are biologically and scientifically wired to project these properties.
  *   "Non-raven" and "Non-black" are **artificial classes**. They are just leftovers.
  *   **Verdict:** Logic allows contraposition, but *induction* (learning from experience) only works on natural kinds. Therefore, you cannot confirm a hypothesis about natural kinds using evidence about artificial classes.

  ### 4. Why did the book say philosophers "gave up"?
  The author is likely conflating the decline of **Logical Empiricism** with the decline of **Confirmation Theory**.

  Hempel was a Logical Empiricist. This movement tried to create a purely logical, context-free system for science (like a math equation for evidence). That specific project *did* largely fail, partly because of paradoxes like this one and Goodman's "Grue" paradox.

  However, philosophers didn't stop studying evidence. They just realized that evidence isn't purely logical; it involves probability, background knowledge, and context. They moved from "Logical Confirmation" to "Probabilistic Confirmation."

  ### The Verdict
  The book's summary is **unfair and historically inaccurate.**

  *   **Is the paradox real?** Yes, it highlights a tension between formal logic and human intuition.
  *   **Did it break confirmation theory?** No. It forced confirmation theory to evolve from simple logic to probability theory (Bayesianism).
  *   **Can you do ornithology by looking at shoes?** Practically, no. Logically/Probabilistically, you are gathering a vanishingly small amount of data about the universe that is consistent with the hypothesis, but it is an inefficient use of time.

  You should feel unsettled by the paradox itself (it is genuinely deep), but you shouldn't feel unsettled by the state of philosophy. The field didn't collapse; it just grew up and realized the problem was harder than Hempel initially thought.
