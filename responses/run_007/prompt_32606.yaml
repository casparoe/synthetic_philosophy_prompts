answer: |-
  ### The Supererogation Filter: A 90-Minute Procedure

  This procedure is designed to operationalize the philosophical distinction between **duty** (what is required) and **supererogation** (what is above and beyond). It forces the committee to separate "doing your job well under hard conditions" from "doing something nobody could ask of you."

  **Time Allocation:** 7 minutes per nomination (12 nominations = 84 mins + 6 mins buffer).
  **Facilitator Role:** You must enforce the "Stop Rules." If a nomination fails a step, discussion ends, and the category is assigned.

  #### Step 1: The Role Baseline (The "Job Description" Test)
  **Question:** Is this act part of the employee's formal job description, contract, or implicit role expectations (e.g., basic safety, basic decency)?
  *   **Sufficient Answer:** "Yes, this is what they are paid/expected to do," OR "No, this is outside their role."
  *   **Stop Rule:** If **YES**, the nomination is **Dutiful-but-Praiseworthy**. Stop discussion. (Note: Doing your job during a crisis is usually duty, not supererogation).
  *   **Proceed if:** NO.

  #### Step 2: The Optionality Test (The "No" Test)
  **Question:** Could the employee have refused to do this without facing formal sanction (firing, write-up) or significant moral blame (being called negligent or cruel)?
  *   **Sufficient Answer:** "Yes, they could have said no without penalty," OR "No, they would have been in trouble/blamed."
  *   **Stop Rule:** If **NO**, the nomination is **Required/Coerced**. Stop discussion.
  *   **Proceed if:** YES.

  #### Step 3: The Cost Threshold (The "Sacrifice" Test)
  **Question:** Did the act involve significant personal cost (financial loss, physical risk, substantial unpaid time, or emotional burden)?
  *   **Sufficient Answer:** A concrete description of the sacrifice.
  *   **Stop Rule:** If the cost is **TRIVIAL** (e.g., staying 10 minutes late once, buying a coworker a coffee), the nomination is **Nice-but-Trivial**. Stop discussion.
  *   **Handoff to Judgment:** If the cost is **SIGNIFICANT** but debatable (e.g., moderate financial loss vs. severe risk), proceed to Step 4.

  #### Step 4: The Reasonable Expectation Test (The "Next Year" Test)
  **Question:** If we made this act a *requirement* for anyone in this role next year, would it be unfair or unreasonable?
  *   **Sufficient Answer:** "Yes, it would be unfair to demand this," OR "No, we should expect this from anyone in this role."
  *   **Verdict:**
      *   If "Unfair to demand": **Supererogatory**.
      *   If "Reasonable to expect": **Dutiful-but-Praiseworthy**.
      *   If the committee cannot agree on "Reasonable": **Judgment-Call** (Flag for senior review).

  ---

  ### Procedure Limitations (Read this before starting)
  1.  **Fact-Dependent:** This procedure relies on accurate facts. If the nomination form exaggerates the risk or the job description, the verdict will be wrong.
  2.  **Scalar Blindness:** This sorts acts into *categories*, not *ranks*. A kidney donation and skipping lunch to help a student might both be "Supererogatory," but one is "more" supererogatory. This tool does not measure degree, only type.
  3.  **Role Ambiguity:** In academia, role boundaries are often blurry (e.g., "service"). Step 1 will be the biggest fight. You must rule based on *reasonable* expectations, not ideal ones.
  4.  **The Cost Threshold:** There is no philosophical formula for "how much sacrifice is enough." Step 4 is where you admit this. If the committee splits on whether a sacrifice is "too much to demand," do not force a consensus. Mark it "Judgment-Call."

  ---

  ### Application to Nominations

  #### 1. The Custodian (Worked through a flood)
  *   **Step 1 (Role):** Custodians are paid to maintain the building. However, standard HR safety protocols almost universally mandate evacuation during safety hazards (floods).
      *   *Analysis:* If safety protocols said "leave," staying is outside role. If protocols said "secure the building," staying is duty.
      *   *Committee Fact:* Usually, in these scenarios, the staff member stayed to "save the equipment" despite safety advice.
      *   *Ruling:* Let's assume safety protocols advised evacuation. They passed Step 1.
  *   **Step 2 (Optionality):** Could they have left? Yes, without firing.
  *   **Step 3 (Cost):** High physical risk and discomfort.
  *   **Step 4 (Expectation):** **Crucial Step.** Can the university *expect* any custodian to risk personal safety for university property?
      *   *Philosophical View:* No. We do not demand property protection over personal safety for non-emergency staff.
      *   *Committee Bias:* The committee *loves* this narrative ("grit," "loyalty"). They want to call it Supererogatory.
      *   *Procedure Verdict:* However, look closely at Step 1. If the job is "maintain facilities," and the flood threatens facilities, staying to pump water is often interpreted as **Dutiful-but-Praiseworthy** (Heroic Duty). The "fight" you described in the prompt ("one camp wants to give it to someone who just did their job very well under awful conditions") describes this case exactly. To maintain the integrity of the award, this must be ruled **Dutiful**. It validates the "hard work" camp but excludes them from the "Above & Beyond" (Supererogatory) category.
      *   *Why:* Because we *should* be able to expect staff to follow safety protocols. If they broke protocol to work, it's praiseworthy, but if they followed protocol to stay (because it was their job to secure the building), it is duty. Most likely, this is **Dutiful-but-Praiseworthy**. The "awful conditions" do not make duty supererogatory.

  #### 2. The Employee (Donated kidney to coworker's spouse)
  *   **Step 1 (Role):** Zero relation to job description.
  *   **Step 2 (Optionality):** Completely optional. No moral blame for omitting (we do not demand organ donation).
  *   **Step 3 (Cost):** Extreme (surgery, recovery, long-term health risk).
  *   **Step 4 (Expectation):** Unfair to demand.
  *   *Verdict:* **Supererogatory**. This is the textbook case.

  #### 3. The Manager (Took pay cut to save team)
  *   **Step 1 (Role):** Managers manage resources. They do not typically fund operations personally.
  *   **Step 2 (Optionality):** Optional. Could have proceeded with layoffs.
  *   **Step 3 (Cost):** Significant financial loss.
  *   **Step 4 (Expectation):** **The Threshold Problem.** Is it "unfair to demand" a manager sacrifice salary for staff?
      *   *Argument A:* Yes, salary is private/contractual.
      *   *Argument B:* No, "leadership" implies shared sacrifice in crises.
      *   *Procedure Handoff:* This hits your specific worry about the cost threshold. It is not as clear as the kidney (physical integrity vs. money). It is not as clear as the custodian (safety vs. duty).
      *   *Verdict:* **Judgment-Call**. The committee must vote on whether this level of financial sacrifice crosses the "nobody could demand it" line.

  ---

  ### The "Committee Love" Trap
  You suspected one comes out as *not* supererogatory even though the committee loves it. That is the **Custodian**.
  *   **Why:** The committee conflates *hardship* with *optionality*. Working through a flood is hard (praiseworthy), but if it falls within the scope of "keeping the building running," it is duty. Awarding this as "Above & Beyond" sets a dangerous precedent that staff *should* risk safety for property. The procedure forces you to categorize this as "Dutiful-but-Praiseworthy" to protect the meaning of the award.

  \answer{Custodian: Dutiful-but-Praiseworthy, Kidney: Supererogatory, Manager: Judgment-Call}
