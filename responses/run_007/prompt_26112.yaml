answer: |-
  No, there is no single, universally settled name that captures this exact genus across logic, computer science, and mathematics without being either too broad or too narrow. The maneuver is standardly classified under **meta-theoretic reasoning**, but the specific technique of embedding a system into a richer domain to prove limitations is most precisely described as a **semantic proof of syntactic limitation**, often implemented via **the invariant method** (in discrete math/CS) or **model-theoretic arguments** (in logic).

  The reason no single term dominates is that the "shape" you identify is a fundamental strategy that manifests differently across fields, leading to distinct technical vocabularies for the same underlying logical move.

  **Meta-theoretic Reasoning** is the correct umbrella term. It distinguishes reasoning *about* a system (using a meta-language) from reasoning *within* a system (using the object language). However, as you noted, this is too broad: it includes consistency proofs, completeness proofs, and definitions of truth, not just limitation proofs via external embedding.

  **The Invariant Method** is the standard name in computer science and recreational mathematics (including the MU-puzzle). It refers specifically to finding a property (the invariant) preserved by all transformation rules that the target string lacks. This carves closest to the MU-puzzle and your programming language example. Its boundary falls short of the logical/philosophical scope you want because it implies a discrete, state-transition context and doesn't naturally cover continuous domains like p-adic analysis.

  **Model-Theoretic Argument** (or **Semantic Argument**) is the standard name in mathematical logic for proving unprovability or independence. You construct a model (like the integers mod 3 for the MU-puzzle, or p-adic fields for Diophantine equations) where the axioms hold but the target statement fails. This covers the Diophantine and logical cases well. However, it can imply the full machinery of model theory (compactness, Löwenheim-Skolem), which is heavier than the simple invariant mapping in the MU-puzzle.

  **Gödel Numbering** is indeed a species of this genus, but it is too specific. It refers to the particular encoding of syntax into arithmetic used to prove incompleteness. Your phenomenon is the general strategy of which Gödel numbering is one famous instance.

  **Conservation Results** and **Relative Interpretation** are adjacent but distinct. Conservation results show that a stronger theory doesn't prove *more* about a certain class of sentences than a weaker one (the opposite direction of your concern). Relative interpretation shows how one theory can be translated into another, often to prove consistency, not necessarily unreachability.

  If you need a precise definition to distinguish this from ordinary meta-reasoning and full arithmetization, you should define it as **External Semantic Analysis**. This distinguishes it from:
  1.  **Internal Syntactic Reasoning:** Deriving strings using only the system's rules.
  2.  **General Meta-reasoning:** Which includes defining the system itself.
  3.  **Full Arithmetization:** Which requires encoding the system's syntax as numbers within a specific arithmetic theory.

  **External Semantic Analysis** captures the act of mapping the object system into a richer semantic domain (numbers, fields, types) to exploit structural properties (divisibility, topology, order) unavailable in the object system, thereby establishing negative results (unreachability, inexpressibility) that the object system cannot formulate. While not a canonical proper noun like "The Gödel Maneuver," this descriptive term accurately bounds the phenomenon you are tracking without inheriting the baggage of specific subfields.
