answer: |-
  You should reject premise (3).

  The error lies in conflating logical necessity with causal determinism. Premise (3) assumes that because a proposition is true now, the event it describes is causally necessitated by the present state of the world, but truth is a semantic relation of correspondence, not a causal force. A fact can make a proposition true without exerting any causal pressure on the event; the direction of dependence runs from the event to the truth, not from the truth to the event. To maintain this position while keeping classical logic, you must adopt an Ockhamist metaphysics of time, which distinguishes between "hard facts" (fixed by the past) and "soft facts" (facts about the past that depend on the future, such as "it was true yesterday that a sea battle would occur"). The cost of this option is accepting that some present truths are metaphysically dependent on future contingent events, meaning the future helps determine which present propositions are true, rather than present truths determining the future. This preserves bivalence and avoids fatalism, but it requires you to abandon the intuition that all existing facts are causally settled independent of what happens next.
