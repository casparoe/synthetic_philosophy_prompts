answer: |-
  The click is the loudest thing I've ever heard. That's the irony. It's a tiny solenoid, scavenged from an old DVD drive, wired to a Geiger counter and a firing pin that rests against a blank cartridge. Technically, it shouldn't even be able to hurt me. But the *idea* of it is the point. The idea is the load.

  I'm sitting on the concrete floor of the garage. It smells of damp cardboard and motor oil. My hands are shaking, not from fear anymore, but from the adrenaline hangover.

  Click.

  I'm still here.

  That's one hundred and four.

  Statistically, I should be a stain on the drywall. Or at least, the version of me that started this three months ago should be. In the branches I can't see, the ones that split off every time the isotope decays, I'm dead. One hundred and four corpses in one hundred and four garages, cooling in the dark. But in this branch, the one where my consciousness is anchored, the gun didn't fire. The atom didn't decay. The universe bent around my inability to experience non-existence.

  I stand up. My knees pop. I feel incredibly, violently ordinary.

  People think Quantum Immortality would feel like a superpower. They think you'd feel invincible. Like a god walking among ants. But it doesn't feel like power. It feels like lag. It feels like you're buffering while the rest of the world streams in high definition.

  I walk into the house. The kitchen light is on. Sarah is at the table, staring at a cold cup of tea. She doesn't look up when I come in. She knows the sound of the click. She knows the silence that follows.

  "You did it again," she says. Her voice is flat.

  "Yeah."

  "David, please." She finally looks at me. Her eyes are red-rimmed. "You smell like ozone. You look... pale."

  "I'm fine."

  "You're not fine. You're playing Russian Roulette with a physics textbook and calling it research."

  "It's not research," I say, sitting opposite her. I want to touch her hand, but my fingers feel numb. "It's verification."

  "Verification of what? That you're crazy?"

  "That I'm stuck."

  She pulls her hand away when I reach for it. That hurts more than the gun ever could. To her, I'm just a man getting lucky over and over again. She sees a probability defied. She doesn't see the graveyard of my other selves. She doesn't understand that I'm not the one getting lucky; I'm the one who *can't* lose.

  "I talked to Mark today," she says. "He thinks you need help. Inpatient help."

  "Mark doesn't understand the Many-Worlds Interpretation."

  "Mark understands that his friend is sitting in a garage waiting to die, and won't stop." She stands up, pacing. "Do you know what it's like for me? Every time you go out there... I hear the click. And I have to wonder: is this the time? Is this the time I have to call your mother? Is this the time I have to plan a funeral?"

  "But you don't have to," I say softly. "I'm right here."

  "For how long? A day? A week? You're reckless now, David. I saw you crossing the street yesterday. You didn't look. You just walked."

  "I knew the car would miss."

  "That's it!" She slams her hand on the table. "That's exactly the problem! You think you're immune. You think the universe won't let you die."

  "I don't think it. I know it."

  "Then prove it to someone else!" she yells. "Step in front of a bus. Jump off a roof. If you're so sure, do it where people can see. Do it where you can save someone else, where you can show the world!"

  I look at her, and I feel a profound, crushing sadness. She thinks I'm hiding. She thinks I'm hoarding this immortality like a dragon with gold. She doesn't get that it's a prison.

  "If I jump off a roof," I say, "I won't die. But I might break every bone in my body. I might lie in a hospital bed for fifty years, unable to move, unable to speak, trapped in a body that refuses to shut down while my mind screams in the dark. Do you want that for me, Sarah? Do you want me to be the man who can't leave?"

  She stares at me, horrified. The anger drains out of her, replaced by a kind of sick realization. She sees the logic. It's not bravery. It's a trap.

  "I can't live with this," she whispers.

  "I know."

  "I love you. But I can't watch you wait for a death that isn't coming."

  She walks out of the kitchen. I hear the bedroom door close. It doesn't slam. It clicks. A soft, final latch.

  I sit at the table for a long time. The house is quiet. I think about the other Davids. The ones who died on attempt number four. The ones who died on number twelve. In their worlds, Sarah is grieving. She's crying over a coffin. She's moving on. In those worlds, I was a tragic figure, a man who lost a gamble.

  In this world, I'm a ghost haunting my own life.

  I go back to the garage. The device sits on the workbench, a mess of wires and tape. It looks pathetic now. Just junk.

  I pick it up. It's light.

  I think about running it again. Just to see. Just to feel that lurch in my stomach, that split-second where reality holds its breath. But the thrill is gone. The first ten times were terrifying. The next fifty were intoxicating. Now? It's just noise.

  The horror of Quantum Immortality isn't that you can't die. It's that everyone else does.

  I think about Sarah. She will age. Her hair will gray. Her skin will wrinkle. She will get sick, and her body will fail, because she isn't anchored to a quantum survival loop. She is linear. I am... recursive.

  If I stay with her, I will watch her die. And then I will still be here. And then I will have to find someone else, and watch them die. And on, and on. The device didn't make me immortal. It just woke me up to the fact that I might already be. The garage experiment was just a way to force the universe to show its hand.

  Now I know the hand. And it's empty.

  I take the battery out of the Geiger counter. I put the solenoid in the drawer with the spare screws. I don't smash it. There's no point. Breaking the machine doesn't break the law.

  I walk back into the house. I stand outside the bedroom door. I can hear her breathing on the other side. Steady. Fragile. Temporary.

  I want to knock. I want to tell her I'm done. But I can't promise her I'm safe. I can only promise her I'm still here.

  I turn away and walk to the living room. I sit on the couch. I pick up the remote. I turn on the TV. Some sitcom is playing. People laughing. A canned audience.

  I watch the screen. I wait for the commercial break. I wait for the next minute to pass.

  I am one hundred and four. Tomorrow, I will be one hundred and five. And I will be here, watching the world burn itself out, second by second, unable to look away, unable to close my eyes for the last time.

  The click is gone. But the silence is louder.
