prompt: |-
  I've been reading Tolstoy's *What is Art?* for a reading group and I'm trying to get a handle on how his theory actually cashes out. The book is full of verdicts — he's constantly saying this is real art, that is counterfeit — and I've been compiling them to see if there's a consistent principle underneath. Honestly, some of them seems to pull in different directions and I'd love a second pair of eyes.

  Here's what I've got so far for things Tolstoy unambiguously praised as true art:
  - The peasant songs and folk tales he encountered on his estate — he says they transmit genuine feeling and are understandable to everyone, regardless of education.
  - *Uncle Tom's Cabin* and the novels of Dickens and Hugo — he says they express the Christian spirit of human brotherhood and are accessible to any peasant.
  - The story of Joseph from Genesis — he calls it universally intelligible, sincere, and morally serious.
  - Some of Schiller's plays — he praises them as morally earnest and infectious across class lines.

  And here's what he condemned as counterfeit:
  - His own novels, including *War and Peace* and *Anna Karenina* — he says they were made for the amusement of the idle rich, meet none of his criteria, and he regrets having written them.
  - Beethoven's Ninth Symphony and the late string quartets — he says they're incoherent, fail to transmit a definite feeling, and only a tiny coterie pretends to understand them.
  - Wagner's operas — same complaint, plus he thinks they're grandiose, insincere, and a kind of hypnotic manipulation rather than genuine art.
  - Baudelaire, Verlaine, Mallarmé, and the Symbolist poets generally — obscure, elitist, no genuine feeling to transmit, written for a decadent few.
  - Much of Renaissance painting — technically skilled but emotionally empty, made to flatter wealthy patrons and display virtuosity.

  The new case I want to test him on: a song like 'We Shall Overcome.' It's simple enough that anyone can sing it — you don't need training or a programme note. It's been used in labour movements and the civil rights movement, so it's drenched in moral feeling and the spirit of brotherhood. It's not the work of a single named artist; it evolved out of gospel and folk traditions, and no one knows exactly who wrote which bits. And it genuinely moves people — you can see it on film, crowds singing it and weeping. By the standards of infectiousness and universal accessibility, it seems to pass with flying colours.

  But here's the rub. It's a political song, and Tolstoy was deeply suspicious of political movements — he thought they replaced the kingdom of God with earthly programmes and stirred up partisan feeling rather than the universal religious emotion he thought art should transmit. And the fact that it has no individual author might trouble him, since he talks at length about the artist's sincerity as the source of infectiousness, and you can't exactly locate the sincerity of a tradition or a crowd.

  What would Tolstoy's verdict have been? Which of his earlier judgments is the closest analogue? And if I've mischaracterised his principle — if there's a better formulation of what unifies his praise and blame across these cases — what is it, and which further case would settle the matter?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is reading Tolstoy's *What is Art?* for a reading group.
      *   **Task:** They want to understand how Tolstoy's theory "cashes out" in practice. They have compiled a list of praised and condemned works and want to test a new case: the song "We Shall Overcome."
      *   **The Conflict:** The song fits Tolstoy's criteria of accessibility, infectiousness, and moral feeling (brotherhood). However, it's political (Tolstoy hated politics/partisanship) and anonymous/folk-based (Tolstoy emphasizes the individual artist's sincerity).
      *   **Questions:**
          1.  What would Tolstoy's verdict be on "We Shall Overcome"?
          2.  Which earlier judgment is the closest analogue?
          3.  Is the user's characterization of Tolstoy's principle accurate? If not, what's the better formulation?
          4.  What further case would settle the matter?

  2.  **Deconstruct Tolstoy's Theory in *What is Art?*:**
      *   **Core Definition:** Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them.
      *   **Criteria for "Good" Art:**
          1.  **Infectiousness:** The primary metric. Does it transmit feeling?
          2.  **Sincerity:** The most important condition of infectiousness. The artist must feel what they transmit.
          3.  **Accessibility/Universality:** It must be understandable by all, not just a cultured elite.
          4.  **Religious Consciousness:** The content must align with the "religious perception of the age." For Tolstoy, this meant Christian universal brotherhood, non-violence, and love.
      *   **Criteria for "Bad/Counterfeit" Art:**
          1.  **Exclusivity:** Only understood by the rich/educated.
          2.  **Insincerity:** Made for money, fame, or imitation.
          3.  **Lack of Clear Feeling:** Vague, obscure, or focused on beauty/form rather than emotion.
          4.  **Wrong Religious Consciousness:** Promotes patriotism, lust, exclusivity, or violence.

  3.  **Evaluate "We Shall Overcome" against Tolstoy's Criteria:**
      *   *Infectiousness:* High. Moves crowds, unites people.
      *   *Accessibility:* High. Simple melody, simple lyrics, no training needed.
      *   *Sincerity:* This is tricky. It comes from a collective tradition. Tolstoy values the *individual* artist's sincerity (the "artist" must feel it to transmit it). However, he praises folk songs. Folk songs are anonymous. How does he reconcile this? He sees folk songs as the expression of the *people's* sincere feeling, distilled over time. So, anonymity isn't necessarily a dealbreaker if the feeling is genuine.
      *   *Religious Consciousness/Moral Content:* This is the biggest hurdle. The song is tied to the Civil Rights Movement and labor unions. Tolstoy was an anarchist/pacifist Christian. He hated the State, the Church, and *political parties*. He believed in the Kingdom of God within, not legislative change.
          *   *Argument for Condemnation:* It's a protest song. It implies conflict (overcoming *someone* or *something*). It's tied to specific political goals (voting rights, labor laws), not just abstract Christian love. Tolstoy often condemned patriotism and nationalism; does "solidarity" count as a form of tribalism?
          *   *Argument for Praise:* It promotes brotherhood, equality, and non-violent resistance (mostly). It aligns with the "Christian spirit of human brotherhood" he praised in *Uncle Tom's Cabin*.
      *   *Resolution:* Tolstoy distinguished between *sectarian* feeling and *universal religious* feeling. If "We Shall Overcome" is seen as fighting a specific political enemy, he might reject it. If it's seen as an expression of universal human dignity and love against oppression (akin to early Christianity), he might accept it. Given his praise for *Uncle Tom's Cabin* (which is inherently political in its context), he likely prioritizes the *moral* content over the *political* mechanism. *Uncle Tom's Cabin* advocated for abolition (a political goal), but Tolstoy saw it as Christian brotherhood. Therefore, "We Shall Overcome" likely passes, *provided* it is viewed as religious/moral rather than partisan.

  4.  **Address the Specific Questions:**

      *   **Verdict:** Likely **True Art**, but with caveats. The "Christian brotherhood" aspect outweighs the "political movement" aspect, similar to *Uncle Tom's Cabin*.
      *   **Closest Analogue:** *Uncle Tom's Cabin* (moral cause, accessible, emotional) and Peasant Songs (anonymous, folk origin, infectious).
      *   **Refining the Principle:** The user's summary is good, but misses the nuance of "Religious Consciousness of the Age." It's not just "moral feeling"; it's specifically *Christian universalist* feeling. Also, the "Sincerity" criterion applies to the *source* of the feeling, which can be collective in folk art.
      *   **Settling Case:** Need something that splits the difference between political and religious, or anonymous and authored. Maybe *The Internationale*? (Too socialist/revolutionary for Tolstoy?) Or a specific religious hymn vs. a national anthem. A National Anthem would be the perfect foil (accessible, infectious, but promotes patriotism which Tolstoy hated).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's excellent summary. It shows they've read the text closely.
      *   *The Verdict:* Start with the bottom line. Tolstoy would likely praise it, but his reasoning would be specific.
      *   *Addressing the "Political" Objection:* This is the crux. Explain Tolstoy's distinction between "party politics" and "religious perception." *Uncle Tom's Cabin* is the key evidence here. Abolition was political, but Tolstoy saw it as religious.
      *   *Addressing the "Anonymous" Objection:* Tolstoy loved folk art. He believed professionalization corrupted art. Anonymity often signaled *more* sincerity to him (art of the people vs. art of the academy).
      *   *Refining the Principle:* The user asked if they mischaracterized the principle. The unifying thread isn't just "accessibility + morality." It's **Infectiousness driven by Sincerity in service of the Current Religious Consciousness.**
      *   *The "Settling Case":* Propose a National Anthem (e.g., *God Save the King* or *La Marseillaise*). It fits accessibility and infectiousness, but fails the "Universal Brotherhood" test (it's exclusive/patriotic). This clarifies the "Religious Consciousness" constraint.
      *   *Tone:* Intellectual, collaborative, respectful of the text.

  6.  **Refining the Argument on Politics:**
      *   Tolstoy's pacifism is strict. He rejected violent revolution. "We Shall Overcome" is associated with non-violent resistance. This aligns well with Tolstoy's influence on Gandhi.
      *   However, Tolstoy might worry about the "us vs. them" dynamic. But *Uncle Tom's Cabin* has an "us vs. them" dynamic (slaves vs. slaveholders). Tolstoy accepted that because the "us" was humanity and the "them" was a sin against God.
      *   Conclusion: The song passes because the *feeling* is love/solidarity, not hatred.

  7.  **Refining the Argument on Anonymity:**
      *   Tolstoy explicitly contrasts "upper-class art" (individual, eccentric) with "folk art" (collective, sincere).
      *   Quote check (mental): In *What is Art?*, he praises folk songs extensively. He argues that true art often emerges from the people, not the academy. So anonymity is a plus, not a minus.

  8.  **Final Polish:** Ensure the distinction between "Counterfeit Art" (bad faith, exclusive) and "Bad Art" (well-meaning but unskilled/uninfectious) is clear, though "We Shall Overcome" fits "Good Art." Make sure to highlight the "Religious Consciousness" as the filter for *which* feelings count.

  9.  **Structure:**
      1.  Validate the user's compilation (it's accurate).
      2.  The Verdict on "We Shall Overcome."
      3.  Tackling the Political Objection (Uncle Tom analogue).
      4.  Tackling the Anonymity Objection (Folk Song analogue).
      5.  Refining the Unifying Principle (The Three Conditions).
      6.  The Settling Case (National Anthems).

  10. (Self-Correction during drafting): I need to be careful not to make Tolstoy sound *too* modern. He wouldn't use the term "Civil Rights." He would frame it as "Christian brotherhood vs. pagan violence." I need to maintain his specific vocabulary. Also, ensure I mention that for Tolstoy, "Religious" doesn't mean "Church ritual," it means "understanding of the meaning of life."

  11. Final check against the prompt: Did I answer all parts? Verdict? Analogue? Principle formulation? Settling case? Yes.

  12. Write the response. (Proceeds to generate output based on these thoughts.)
answer: |-
  This is an exceptionally sharp reading of *What is Art?* You have correctly identified the tension between Tolstoy's formal criteria (infectiousness, accessibility) and his moral/religious criteria (Christian brotherhood, sincerity). Many readers miss the fact that for Tolstoy, infectiousness alone is not enough; a pickpocket's manual could be "infectious" and "clear," but it would fail the religious test.

  Here is how Tolstoy's system would likely process "We Shall Overcome," followed by a refinement of the principle you are looking for, and a test case to settle it.

  ### 1. The Verdict on "We Shall Overcome"

  Tolstoy would almost certainly classify "We Shall Overcome" as **True Art**, despite your reservations about politics and anonymity.

  **On Anonymity:**
  Your worry that Tolstoy requires an *individual* artist's sincerity is understandable, but it contradicts his praise for peasant songs and folk tales. Tolstoy draws a sharp distinction between "professional art" (which he thinks is usually counterfeit because it is made for money or fame) and "folk art" (which emerges from the life of the people).
  For Tolstoy, the anonymity of a folk song is actually a *mark of sincerity*. It suggests the song was not composed to flatter a patron or entertain the idle rich, but grew organically out of a shared human experience. The "sincerity" here is not located in a single biographical author, but in the collective soul of the people singing it. If the crowd is weeping and united, the feeling is genuine.

  **On Politics:**
  This is the harder hurdle, but *Uncle Tom's Cabin* is the precedent that clears it. Tolstoy knew *Uncle Tom's Cabin* was a political instrument aimed at abolition. However, he did not classify it as "political art" in the negative sense; he classified it as **religious art**.
  Tolstoy distinguishes between *sectarian/party* feeling (which divides people into factions for earthly gain) and *religious* feeling (which unites people in the "Kingdom of God"). He viewed slavery as a sin against God's law of brotherhood. Therefore, art that fought slavery was promoting the "religious consciousness of the age."
  Tolstoy would likely view the Civil Rights Movement through the same lens: not as a political programme, but as a struggle for Christian brotherhood against a system of violence and exclusion. Since "We Shall Overcome" is associated with non-violent resistance (which Tolstoy championed and which influenced Gandhi), it aligns with his specific brand of Christian anarchism.

  **The Verdict:** It passes all three tests:
  1.  **Infectiousness:** It moves people to unity and tears.
  2.  **Accessibility:** No training required; intelligible to a peasant.
  3.  **Religious Consciousness:** It promotes universal brotherhood and non-violent resistance to evil.

  ### 2. The Closest Analogues

  You have already identified them in your list, but here is how they function as precedents:

  *   **Primary Analogue:** ***Uncle Tom's Cabin***. This settles the "political" worry. It proves that art with a specific social justice aim counts as "religious" if the aim is universal brotherhood.
  *   **Secondary Analogue:** **Peasant Songs**. This settles the "anonymity" worry. It proves that art does not need a named genius to be sincere; it needs to emerge from the lived experience of the laboring class.

  ### 3. Refining the Unifying Principle

  You asked if there is a better formulation of the principle unifying his praise and blame. Your summary is accurate, but it misses the specific *hierarchy* Tolstoy imposes.

  A more precise formulation of Tolstoy's principle is:
  **Art is the transmission of feeling from the soul of the artist to the soul of the receiver, which is judged "Good" only if the feeling transmitted aligns with the highest Religious Consciousness of the time.**

  There are three filters, applied in this order:
  1.  **Is it Art?** (Does it transmit feeling via external signs?)
  2.  **Is it *Good* Art?** (Is it accessible to all, and is the artist sincere?)
  3.  **Is it *Christian* Art?** (Does the feeling promote the unity of man under God, or does it promote exclusivity, lust, or patriotism?)

  Many works fail at step 3 even if they pass 1 and 2. This is where your list of condemned works clarifies things. Beethoven's Ninth might be sincere and infectious (to some), but Tolstoy argues it is *obscure* (fails accessibility) and ultimately serves the ego of the composer and the elite (fails religious consciousness).

  The unifying thread isn't just "morality"; it is **Universalism vs. Exclusivity**.
  *   **Praised:** Folk songs, *Uncle Tom's*, Genesis. (Universal access, universal brotherhood).
  *   **Condemned:** Wagner, Symbolists, his own novels. (Elite access, exclusive pleasure, or egoistic virtuosity).

  ### 4. The Settling Case

  If you want to test this principle to see if it holds, you need a case that is **Infectious** and **Accessible**, but fails the **Religious/Universal** test.

  **The Test Case: A National Anthem (e.g., *La Marseillaise* or *God Save the King*)**

  *   **Infectiousness:** High. They stir deep emotion, pride, and tears.
  *   **Accessibility:** High. Everyone knows the tune and words; no training needed.
  *   **Sincerity:** High. People genuinely feel them.
  *   **Religious Consciousness:** **Fail.**

  Tolstoy was a fierce pacifist and anti-nationalist. He believed patriotism was a primitive superstition that prevented the brotherhood of man. In *What is Art?*, he explicitly condemns art that stirs patriotic feeling because it divides humanity into "us" and "them."

  **Why this settles the matter:**
  If Tolstoy condemns a National Anthem, it proves that **Infectiousness + Accessibility is not enough.** The *content* of the feeling is the ultimate veto.
  *   If he praised "We Shall Overcome" (Universal Brotherhood) but condemned "La Marseillaise" (National Exclusivity), you have confirmed that his "Religious Consciousness" criterion is the final arbiter.
  *   If he praised both, then his theory collapses into simple populism (whatever moves the crowd is good).
  *   If he condemned both, then his theory is ascetic nihilism (no emotion is permissible).

  Given his writings on patriotism (specifically in *The Kingdom of God Is Within You*), he would condemn the Anthem. This confirms that your reading of "We Shall Overcome" as *religious* rather than *political* is the correct interpretive key. To Tolstoy, the song isn't about changing laws; it's about realizing the Kingdom of God on earth.

  ### Summary for your Reading Group
  1.  **Verdict:** "We Shall Overcome" is True Art.
  2.  **Reasoning:** Anonymity aligns it with Folk Art; its moral aim aligns it with *Uncle Tom's Cabin* (Christian brotherhood over political partisanship).
  3.  **Refined Principle:** Good Art = Sincere Transmission + Universal Accessibility + **Religious Universalism**.
  4.  **Control Case:** Compare it to a **National Anthem**. The Anthem shares the form (infectious, accessible) but fails the content (exclusive, patriotic), revealing the true weight of Tolstoy's moral criterion.
