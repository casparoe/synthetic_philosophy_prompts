prompt: |-
  People in ML twitter keep saying that LLMs have "knowledge-that" without "knowledge-how" — like, GPT-4 can tell you everything about how to ride a bike but couldn't actually ride one, and this supposedly shows there's something fundamentally missing from its understanding, that it's just a stochastic parrot with declarative knowledge and no procedural grasp. They're leaning on Ryle's distinction between knowing-that and knowing-how to argue that scaling up text prediction can't get us to general intelligence.

  But I'm not sure the analogy between what the LLM is doing and "knowledge-that" even holds up — like, is what the LLM has actually knowledge-that at all, in Ryle's sense, or is the whole thing a category error in the other direction? And even if the analogy holds, does the conclusion (LLMs can't be generally intelligent) follow?

  Can you audit this: what maps onto what between the LLM case and the knowing-how/knowing-that distinction as Ryle drew it, where the analogy breaks, what it smuggles in, and whether the argument survives the disanalogies? I'm especially intersted in whether the Rylean framework was even designed to do the kind of work people are making it do here.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Deconstruct the User's Query:**
      *   **Core Claim:** ML Twitter argues LLMs have "knowledge-that" (declarative) but not "knowledge-how" (procedural), using Gilbert Ryle's distinction.
      *   **Implication:** This proves LLMs are "stochastic parrots" lacking true understanding, and scaling won't lead to AGI.
      *   **User's Skepticism:** Is this analogy even valid? Is it a category error? Does the conclusion follow? Was Ryle's framework meant for this?
      *   **Task:** Audit the analogy. Map LLM capabilities to Ryle's concepts. Identify breaks/disanalogies. Examine hidden assumptions. Evaluate the argument's survival.

  2.  **Analyze Ryle's Original Framework:**
      *   *Source:* Gilbert Ryle, *The Concept of Mind* (1949).
      *   *Goal:* Attack Cartesian Dualism (the "Ghost in the Machine").
      *   *Definition of Knowing-That:* Propositional knowledge. Knowing facts, truths, statements (e.g., "Paris is the capital of France").
      *   *Definition of Knowing-How:* Dispositional knowledge. Skills, abilities, practices (e.g., riding a bike, speaking a language, making a joke).
      *   *Crucial Nuance:* Ryle argued *against* the intellectualist legend (the idea that knowing-how is just applying knowing-that). He believed knowing-how is often *prior* to or *independent* of knowing-that. Intelligent action is not the result of internal theoretical contemplation followed by action; it *is* the action itself done correctly.
      *   *Context:* Ryle was talking about *human* minds and behavior, specifically combating the idea of a separate mental substance.

  3.  **Analyze the LLM Case:**
      *   *Mechanism:* Next-token prediction based on statistical patterns in training data.
      *   *Output:* Text (propositions, instructions, code, etc.).
      *   *Embodiment:* None (usually). No physical interaction with the world.
      *   *Training:* Passive consumption of data (mostly), though RLHF adds some feedback loops.

  4.  **Map the Analogy (LLM vs. Ryle):**
      *   *Claim:* LLMs have Knowledge-That (can recite facts).
      *   *Claim:* LLMs lack Knowledge-How (can't ride a bike).
      *   *Mapping:*
          *   LLM Text Output $\rightarrow$ Propositional Knowledge (Knowing-That).
          *   Physical Action/Embodied Skill $\rightarrow$ Procedural Knowledge (Knowing-How).

  5.  **Identify the Breaks/Disanalogies (The "Audit"):**
      *   *Break 1: The Nature of LLM "Knowing-That".* Does an LLM *know* facts? Or does it simulate the *textual pattern* of facts? Ryle's knowing-that implies a believer who holds a proposition as true. An LLM has no belief state. It's closer to "simulated knowing-that."
      *   *Break 2: The Nature of LLM "Knowing-How".* LLMs *do* have skills. They can write code, translate, summarize, reason (to an extent). These are procedural tasks. If "knowing-how" is the ability to perform a task successfully, LLMs clearly have *some* knowing-how (linguistic/cognitive tasks). The Twitter argument restricts "how" to *physical* embodiment. Ryle did not restrict it to physicality (e.g., knowing how to argue, knowing how to calculate).
      *   *Break 3: The Intellectualist Legend.* The Twitter argument accidentally validates the "Intellectualist Legend" Ryle hated. They say: "To really know how, you need an internal model (that) that guides the how." Ryle said: "No, intelligent practice is not shadowed by internal theory." If LLMs generate intelligent text without a "mind," Ryle might say they are exhibiting intelligent behavior, regardless of the internal mechanism.
      *   *Break 4: Embodiment.* Ryle's examples (bike riding) are embodied. LLMs are disembodied. The lack of "bike riding" is a hardware limitation, not necessarily a cognitive architecture limitation.

  6.  **Examine Hidden Assumptions (What is smuggled in?):**
      *   *Dualism:* By saying LLMs lack "real" understanding because they lack physical action, critics smuggle in a form of dualism (mind vs. body) or biological essentialism that Ryle was trying to dismantle.
      *   *Definition of Intelligence:* They assume intelligence requires physical agency. Ryle defined intelligence by the *quality of the performance*, not the substrate.
      *   *Simulation vs. Reality:* They assume simulating the text of knowledge is fundamentally different from possessing it. Ryle was a behaviorist (logical behaviorism); he cared about public acts, not private mental states.

  7.  **Evaluate the Conclusion (Does scaling fail?):**
      *   If "knowing-how" includes cognitive tasks (coding, reasoning), LLMs are gaining knowing-how.
      *   If the barrier is embodiment, that's a robotics problem, not an LLM architecture problem.
      *   If the barrier is "grounding" (symbols linked to reality), that's a valid critique, but Ryle's framework doesn't necessarily support it the way critics think. Ryle cared about *use*, not causal grounding.

  8.  **Synthesize the Audit:**
      *   *Introduction:* Acknowledge the popularity of the argument but state the thesis: It's a misapplication of Ryle that ironically resurrects the dualism Ryle fought.
      *   *Section 1: Ryle's Actual Project.* Explain *The Concept of Mind*. Anti-dualism. Anti-Intellectualist Legend.
      *   *Section 2: The Mapping.* Where the analogy fits (text = propositions) and where it fails (skills = physical only).
      *   *Section 3: The Category Errors.*
          *   Error A: Reducing Knowing-How to Physicality.
          *   Error B: Attributing Knowing-That to LLMs (do they believe?).
          *   Error C: Resurrecting the Ghost (requiring internal state for valid action).
      *   *Section 4: The "Stochastic Parrot" vs. Ryle.* Ryle would judge by performance. If it quacks like understanding, is it understanding?
      *   *Section 5: Conclusion on AGI.* The argument doesn't prove scaling fails. It proves disembodiment limits physical agency.

  9.  **Refine the Tone:**
      *   Philosophical but accessible.
      *   Critical of the ML Twitter take, but fair to the underlying intuition (grounding is real).
      *   Precise on Rylean terminology.

  10. **Self-Correction/Nuance Check:**
      *   *Wait, did Ryle believe machines could think?* He died in 1976. But his behaviorism suggests if a machine acts intelligently, it is intelligent.
      *   *Is "Knowing-That" even accurate for LLMs?* They don't have truth conditions. They have probability distributions. This is a strong point to emphasize.
      *   *What about "Grounding"?* The Chinese Room argument is more relevant here (Searle), but the user asked about Ryle. I should mention Searle as a better fit for the "understanding" critique, while showing why Ryle is the wrong tool.

  11. **Final Polish:** Structure with clear headings. Ensure the "Audit" format is clear. (Proceed to draft response).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Ryle is different." I need to explain *why* using Ryle this way undermines the critics' own argument. The key irony is that critics use Ryle (a behaviorist/anti-dualist) to argue for a hidden internal state (understanding) that distinguishes humans from machines. That is exactly the "Ghost in the Machine" Ryle attacked.

  *(Final Plan)*:
  1. Intro: The irony of the situation.
  2. Ryle 101: What he actually said.
  3. The Mapping Audit: Where it holds, where it breaks.
  4. The Smuggled Premises: Dualism & Intellectualism.
  5. The Verdict: Does the argument survive? (No).
  6. Better Frameworks: Searle/Grounding.
  7. Conclusion.cw
answer: |-
  This is a sharp observation. The deployment of Gilbert Ryle's *knowing-that* vs. *knowing-how* distinction by ML skeptics is philosophically fashionable but historically and conceptually fraught. It is often an instance of "philosophical name-dropping" where the citation serves as a rhetorical shield rather than a rigorous analytical tool.

  Here is an audit of the analogy, mapping the LLM case against Ryle's actual framework, identifying the category errors, and evaluating whether the anti-AGI conclusion survives.

  ---

  ### 1. Ryle's Actual Project: The Anti-Dualist Weapon
  To audit the analogy, we must first establish what Ryle was doing in *The Concept of Mind* (1949).

  *   **The Target:** Cartesian Dualism (the "Ghost in the Machine"). Ryle wanted to dismantle the idea that mental states are private, internal events that cause public behavior.
  *   **The Intellectualist Legend:** Ryle specifically attacked the idea that *knowing-how* is merely the application of *knowing-that*. The legend claims: *To ride a bike, I first contemplate the theory of balance (that), then I apply it (how).* Ryle argued this is false. Knowing-how is often primary; intelligent action does not require prior internal theoretical contemplation.
  *   **The Criterion:** For Ryle, intelligence is not defined by internal causal mechanisms (neurons vs. silicon) but by the **quality of the performance**. If you act intelligently (e.g., make a witty joke, check a calculation, ride a bike), you possess the relevant mental disposition.

  **The Irony:** ML skeptics are using Ryle—a logical behaviorist who argued *against* the need for hidden internal states to validate intelligence—to argue that LLMs lack intelligence because they lack a specific hidden internal state (true understanding/grounding). They are using an anti-dualist to smuggle in dualism.

  ---

  ### 2. The Mapping Audit: Where the Analogy Holds and Breaks

  The ML Twitter argument maps as follows:
  *   **LLM Text Output** $\rightarrow$ **Knowing-That** (Propositional knowledge).
  *   **Physical Action (Bike Riding)** $\rightarrow$ **Knowing-How** (Procedural knowledge).
  *   **Conclusion:** LLMs are limited to the former; AGI requires the latter.

  Here is where the mapping disintegrates:

  #### A. The Category Error of "Knowing-That"
  **The Claim:** LLMs possess "knowledge-that."
  **The Audit:** In Ryle's framework, *knowing-that* implies holding a proposition to be true. It is a state of a believer.
  *   **Disanalogy:** LLMs do not hold propositions as true. They model the *statistical likelihood of token sequences* that resemble propositions. They simulate the *textual trace* of knowledge-that without the *commitment* of knowledge-that.
  *   **Result:** LLMs don't even have Rylean "knowledge-that." They have **simulated knowledge-that**. If the premise that they possess declarative knowledge is false, the distinction collapses.

  #### B. The Reduction of "Knowing-How" to Physicality
  **The Claim:** LLMs lack "knowledge-how" because they can't ride bikes.
  **The Audit:** Ryle never restricted *knowing-how* to physical motor skills.
  *   **Disanalogy:** For Ryle, knowing how to speak a language, knowing how to argue, knowing how to calculate, and knowing how to write poetry are all instances of *knowing-how*. These are dispositional skills.
  *   **Result:** LLMs *do* demonstrate knowing-how in the Rylean sense. They know how to summarize, how to translate, how to debug code, and how to reason through a prompt. By restricting "how" to *embodied physical interaction*, the critics are importing a **phenomenological or embodied cognition** argument (like Hubert Dreyfus) while wearing Ryle's clothes. Ryle would likely classify coding or reasoning as valid "intelligent capacities."

  #### C. The "Intellectualist Legend" Trap
  **The Claim:** Because LLMs predict text (theory) without acting (practice), they lack understanding.
  **The Audit:** This inadvertently validates the "Intellectualist Legend" Ryle fought against.
  *   **Disanalogy:** The critics argue: *Real intelligence requires the internal capacity to act on the knowledge.* This implies that the text generation is just the "theory" shadowing the "action."
  *   **Result:** Ryle argued that intelligent action *is* the understanding. If an LLM successfully performs a complex cognitive task (like solving a math problem via chain-of-thought), a strict Rylean behaviorist would say it *is* exercising knowing-how. To say "it did it but didn't *really* know how" is to posit a "Ghost in the Machine"—a magical inner light that the LLM lacks.

  ---

  ### 3. What Is Smuggled In? (Hidden Premises)

  The argument relies on three premises that Ryle's framework does not support:

  1.  **Biological/Embodied Essentialism:** The argument assumes *knowing-how* requires a body interacting with physics. Ryle's framework is functionalist/behaviorist; the substrate (meat vs. silicon) and the medium (muscles vs. text) are secondary to the disposition to perform.
  2.  **Grounding as a Mental State:** The argument assumes "understanding" is a causal link between symbol and referent (grounding). Ryle was less concerned with causal grounding and more concerned with **use**. For Ryle, if you use the word "bike" correctly in all relevant linguistic contexts, you know what it means. The LLM's lack of physical grounding is a problem for *semantics*, but Ryle's *knowing-how* is about *competence*, not reference.
  3.  **The "Real" vs. "Simulated" Dichotomy:** The argument assumes there is a metaphysical difference between "simulating understanding" and "understanding." Ryle famously rejected this. He argued that if a machine behaves intelligently, asking if it *really* has a mind is a category mistake. The ML skeptics are asking the exact question Ryle told us to stop asking.

  ---

  ### 4. Does the Argument Survive the Disanalogies?

  **Verdict: No.** The argument does not survive if it claims to be Rylean.

  If you strip away the name-dropping, the critics are actually making a **Searlean** argument (The Chinese Room) or a **Dreyfusian** argument (Embodied Cognition), not a Rylean one.

  *   **If they mean Searle:** They are arguing about *semantics vs. syntax*. LLMs manipulate syntax (tokens) without semantics (meaning). This is a stronger argument than the Rylean one, but it relies on intuition pumps about "inner experience" that Ryle explicitly rejected.
  *   **If they mean Dreyfus:** They are arguing that intelligence is rooted in bodily coping with the world. This is a valid critique of disembodied AI, but it has nothing to do with Ryle's *knowing-that/knowing-how* distinction.

  **The Scaling Question:**
  Does this prove scaling won't lead to AGI?
  *   **Rylean View:** If scaling produces a system that can perform *all* intelligent human dispositions (including coding, reasoning, planning, and perhaps controlling a robot body via API), then it *is* intelligent. The "missing something" is a myth.
  *   **Embodied View:** If AGI requires physical grounding, then text-only scaling will hit a ceiling. But that is a limitation of the *input modality*, not the *predictive architecture*. You can attach an LLM to a robot body. If it then rides the bike, did it gain "knowledge-how"? The Rylean says yes. The skeptic says no, it's still just prediction.

  ### 5. Why This Framework Is Being Used (and Why It's Wrong)

  Why do ML Twitter users lean on Ryle?
  1.  **Intuitive Appeal:** The bike analogy is visceral. Everyone understands the difference between reading a manual and doing the thing.
  2.  **Philosophical Cover:** It sounds more rigorous than saying "it feels like it doesn't understand."
  3.  **Confusion of Behaviorism:** They mistake Ryle's behaviorism (intelligence is behavior) for a requirement that the behavior must be *physical*.

  **The Fatal Flaw:**
  Ryle's distinction was designed to dissolve the mind-body problem, not to create a new boundary between "text processors" and "thinkers." By using Ryle to argue that LLMs lack a crucial internal ingredient (true procedural grasp), critics are resurrecting the **Ghost in the Machine**. They are claiming that human "knowing-how" involves a special *je ne sais quoi* that statistical prediction cannot capture. Ryle would call that nonsense.

  ### Summary Audit

  | Feature | Ryle's Framework | ML Twitter Argument | Audit Result |
  | :--- | :--- | :--- | :--- |
  | **Knowing-That** | Propositional belief/truth. | Textual output about facts. | **Mismatch:** LLMs have no belief state. |
  | **Knowing-How** | Dispositional skill (mental or physical). | Physical embodiment only. | **Mismatch:** LLMs have cognitive skills (coding/reasoning). |
  | **Criterion for Mind** | Intelligent performance/behavior. | Internal grounding/understanding. | **Contradiction:** Critics demand internal states Ryle rejected. |
  | **Goal** | Dissolve Dualism. | Prove LLMs are fundamentally different. | **Opposition:** Argument relies on the dualism Ryle fought. |

  **Conclusion:**
  The Rylean argument against LLMs is a **category error in the second order**. It applies a framework designed to eliminate the distinction between "inner mind" and "outer behavior" to argue that the distinction between "inner understanding" and "outer text" is what matters.

  If you want to argue LLMs aren't AGI, use **Searle** (syntax vs. semantics) or **Dreyfus** (contextual embodiment). But using Ryle to say "LLMs know-that but not know-how" is philosophically incoherent. It grants LLMs a type of knowledge they don't have (belief-based propositions) and denies them a type of knowledge they do have (dispositional linguistic skills), all while violating the central tenet of the philosopher being cited.

  Scaling might fail for other reasons (lack of grounding, energy constraints, data exhaustion), but Ryle's distinction provides no logical barrier to it. In fact, a consistent Rylean would likely argue that if GPT-5 can do everything a human intellectual can do, the question "but does it *really* know?" is a category mistake.
