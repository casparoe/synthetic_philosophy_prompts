          *   Later majorities as inferior (epistemically/morally) to founders.
          *   Founding moment as having special normative authority (constituent power vs. constituted power).
      *   **Tasks:**
          1.  Reconstruct the implicit theory of collective agency and intertemporal rationality.
          2.  Distinguish strict presuppositions from mere compatibility.
          3.  Identify points of philosophical underdetermination (where rival theories yield the same design).
          4.  Explain what would change in the practice if a rival theory were substituted.

  2.  **Initial Brainstorming & Theoretical Mapping:**

