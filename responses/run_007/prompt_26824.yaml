          *   *Theory C: Epistemic/Conservative.* Founders had unique virtue/calmness.
          *   *Theory D: Coordination/Schelling Point.* The constitution is a focal point. Changing it is costly not because it's "binding" but because re-coordinating is hard.
          *   *Observation:* All four justify supermajorities, but for totally different reasons.

      *   **Part 4: Substituting the Rival (What changes in practice?):**
