answer: |-
  This is a keen observation of a very specific epistemic failure mode. Because you mentioned "rationalist-adjacent blogs," there is a very high probability you are looking for **The Fallacy of Gray**, though there are a few other terms that capture different facets of the dynamic.

  Here is a breakdown of the existing names that fit, why they fit, and how to distinguish this from the concepts you ruled out.

  ### 1. The Cognitive Bias: "The Fallacy of Gray"
  Since you specifically noted the rationalist community, this is the most likely candidate. Coined/popularized by Scott Alexander (Slate Star Codex), **The Fallacy of Gray** describes the error of moving from "nothing is 100% certain" or "categories are fuzzy" to "therefore, no distinctions are meaningful."

  *   **The Logic:** "Heritability isn't a fixed, individual essence (Black/White truth). Therefore, the heritability estimate tells us nothing useful (Gray void)."
  *   **Why it fits:** It captures Person B's specific error. They are correct that the concept isn't "Black and White" (immutable, individual), but they incorrectly conclude that it is therefore "Gray" (meaningless noise) rather than "Colored" (a precise, constrained, useful statistic).
  *   **Limitation:** This names the *cognitive error* Person B makes, but not necessarily the two-person conversational collapse where Person A also retreats into nihilism.

  ### 2. The Logical Structure: "The Continuum Fallacy"
  In formal logic, this is often called the **Continuum Fallacy** (or the Fallacy of the Beard). It occurs when someone argues that because there is no clear bright line between two states (e.g., between "genetic" and "environmental" influence), the distinction itself is invalid.

  *   **The Logic:** "Genes and environment interact continuously; therefore, assigning a percentage to genes is arbitrary and meaningless."
  *   **Why it fits:** It explains why the technical correction (variance is partitioned, not isolated) is used to nullify the statistic entirely.
  *   **Limitation:** Like the Fallacy of Gray, this describes the argument, not the social dynamic of the conversation stalling.

  ### 3. The Conversational Dynamic: "The Precision Trap" or "Pedantic Nullification"
  There isn't a single canonical academic term for the *two-person conversational collapse* you described, but in argumentation theory and epistemic hygiene discussions, it is often described as **Epistemic Nullification** or **The Precision Trap**.

  I would propose calling this specific dynamic **"The Nullification Equilibrium."**

  *   **How it works:**
      1.  **Claim:** Person A makes a strong, slightly overstated claim.
      2.  **Correction:** Person B makes a valid technical correction (The Motte).
      3.  **Nullification:** Person B infers that the technical complexity renders the data useless (The Fallacy of Gray).
      4.  **Retreat:** Person A, lacking the technical vocabulary to defend the "nuanced middle," accepts the nullification to avoid further status loss.
      5.  **Equilibrium:** Both parties agree the statistic is useless, which is less true than where they started.

  ### Distinguishing from Similar Concepts

  **vs. Overcorrection / Pendulum Swing**
  *   **Overcorrection** implies a shift in bias (e.g., from "too strict" to "too lenient").
  *   **This Dynamic** is an *epistemic collapse*. It's not that they swing to the opposite view (e.g., "IQ is 100% environmental"); it's that they agree the *evidence itself* is void. The map is burned, not just redrawn.

  **vs. Motte-and-Bailey**
  *   **Motte-and-Bailey** is a defensive tactic used by the person making the controversial claim (Person A) to shield themselves from critique.
  *   **This Dynamic** is an offensive tactic used by the critic (Person B) that backfires. Person B uses the "Motte" (the technical definition) not to defend a reasonable position, but as a battering ram to destroy the utility of the concept entirely. Some have called this **"Burning the Motte."**

  **vs. The Nirvana Fallacy**
  *   **The Nirvana Fallacy** is comparing a realistic solution to a perfect one.
  *   **This Dynamic** is a subset of the Nirvana Fallacy applied to *data*. "If this heritability estimate doesn't allow us to predict individual outcomes perfectly (Nirvana), it provides no information about population causality (Realistic)."

  ### Why This Is Sticky in Heritability Debates
  You noted this is especially common with heritability. This is likely due to **Motivated Stopping.**
  *   **Person A** often wants the statistic to imply *immutability* (political/ideological utility).
  *   **Person B** often wants the statistic to imply *meaninglessness* (political/ideological utility).
  *   When Person B scores the technical point, they have a strong incentive to push the conclusion all the way to "meaningless" rather than stopping at "constrained."
  *   Person A, realizing their ideological use of the stat has been undercut, often lacks the motivation to defend the "boring middle" (that the stat is real but limited), so they concede the point entirely.

  ### Summary Recommendation
  If you are writing about this or discussing it in that specific community:
  1.  Refer to the cognitive error as **The Fallacy of Gray**.
  2.  Refer to the logical flaw as **The Continuum Fallacy**.
  3.  Refer to the conversational outcome as **The Nullification Equilibrium** or **Collusive Nihilism**.

  If you need a single pithy name for the pattern to use in conversation, **"The Precision Trap"** is likely the most intuitive. It captures the idea that demanding perfect precision (the technical correction) becomes a trap that destroys useful knowledge.

  **Example usage:**
  > "We're falling into the **Precision Trap** here. You're right that heritability isn't an individual essence, but you're using that technicality to nullify the population data entirely. We're ending up in a **Nullification Equilibrium** where we pretend we know less than we actually do."
