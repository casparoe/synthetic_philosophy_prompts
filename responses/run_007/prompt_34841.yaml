prompt: |-
  Hey, I'm a PhD student in formal epistemology and I keep running into the logical omniscience problem from the modeling side. Before I read one more paper on awareness semantics or impossible worlds, I want to get the spec straight: what does a theory of an agent's beliefs (or knowledge) actually have to deliver if it's meant to model a non-ideal reasoner rather than a logically perfect one? I'd like the desiderata list.

  Give me the requirements, each with the case or consideration behind it. The sort of thing I have in mind includes, but isn't limited to: an agent who believes the axioms of Peano arithmetic but hasn't derived some theorem from them; the explicit/implicit belief distinction; the difference between failing to believe q and believing not-q; whether a theory should be able to distinguish logically equivalent contents; whether consistency is a hard requirement or just an ideal; and how belief changes when the agent actually performs an inference rather than just sitting there. For each requirement say whether it's non-negociable or just a preference of one camp (the tractability people, the pure semanticists, the dynamic-logic people, etc.).

  Then flag any subsets of these that can't be jointly satisfied. My suspicion is that you can't keep a standard possible-worlds semantics, closure under your background logic, and non-omniscience all at once, so something has to give — I want to know exactly what and which trade-offs are forced. That's the part I most want.

  Then briefly score the usual approaches against the list: plain possible-worlds epistemic logic, awareness semantics, impossible-worlds models, and syntactic or resource-bounded accounts. Keep that part short; the desiderata are the point. And if any of the requirements I floated is really a prejudice of a particular camp rather than a genuine desideratum, say so.

  Write it in American English. No citations needed — I want the conceptual lay of the land.
