      *Trade-off section:* The classic result is that if you have a standard possible worlds semantics (where belief is a relation to sets of worlds) and you validate standard modal axioms (K, N), you get omniscience. To avoid it, you either change the semantics (impossible worlds) or the logic (drop N or K) or the ontology (syntactic).

