answer: |-
  This is a fantastic framing. You are essentially asking to refactor a 300-year-old economic bug report into a system design document. Your intuition is correct: the St. Petersburg Paradox (SPP) is largely a failure to distinguish between *mathematical objects* (infinite series) and *computational objects* (samplers with bounded resources).

  Here is the St. Petersburg Paradox restated in the vocabulary of randomized algorithms, followed by the residue report on what gets lost in translation.

  ---

  ### Part 1: The Algorithmic Restatement

  #### 1. The Game as a Probabilistic Procedure
  In CS terms, the St. Petersburg game is a **Las Vegas algorithm**. It always produces a correct result (a payout) and halts with probability 1, but its resource consumption (or in this case, output magnitude) is a random variable.

  ```python
  def st_petersburg_game():
      n = 1
      while flip_coin() != HEADS:  # Prob(HEADS) = 0.5
          n += 1
      return 2**n
  ```

  *   **Halting:** The loop terminates w.p. 1. The expected number of iterations (runtime) is finite ($E[\text{flips}] = 2$).
  *   **Output Distribution:** The return value $X$ follows a heavy-tailed distribution where $P(X = 2^n) = 2^{-n}$.
  *   **The Divergence:** The population mean $\mu = E[X]$ is undefined (diverges to $\infty$).

  #### 2. The Estimator Failure (The "Paradox")
  In Monte Carlo methods, we estimate the expected value $\mu$ using the sample mean $\hat{\mu}_N = \frac{1}{N} \sum_{i=1}^N X_i$.
  The **Law of Large Numbers (LLN)** guarantees $\hat{\mu}_N \to \mu$ only if $E[|X|] < \infty$.
  Since $E[X] = \infty$ here:
  1.  **Non-Convergence:** As $N \to \infty$, $\hat{\mu}_N$ does not settle. It continues to jump whenever a "rare event" (a long run of tails) occurs.
  2.  **Dominance by Max:** The sample mean is asymptotically dominated by the single maximum value observed in the sample ($\max(X_1, \dots, X_N)$).
  3.  **Engineering Reality:** For any feasible $N$ (e.g., $10^9$ trials), the sample mean will likely be small (e.g., \$20–\$50), because the probability of seeing a payout large enough to shift the mean significantly is lower than the inverse of the number of trials.

  **The Paradox in CS:** You are trying to optimize a system based on a metric (population mean) that is **unestimable** within the lifetime of the universe.

  #### 3. Translating the Resolutions

  | Economic Resolution | Algorithmic Translation |
  | :--- | :--- |
  | **Diminishing Marginal Utility** (Bernoulli) | **Bounded Objective Function.** You are not optimizing raw output `X`. You are optimizing `U(X)`, where `U` is a concave function (e.g., `log(X)`). This transforms the heavy-tailed distribution into a light-tailed one with finite mean. You changed the metric from *throughput* to *utility-weighted throughput*. |
  | **Finite Bankroll** (Casino Cap) | **Integer Overflow / Resource Truncation.** No system has infinite memory or capital. If the max payout is capped at $M$ (e.g., $2^{64}$), the distribution is truncated. The tail is cut off. The mean becomes finite ($\approx \log_2 M$). The "infinite expectation" was a bug caused by assuming unbounded integer types. |
  | **Time Averaging / Kelly Criterion** | **Ergodicity / Geometric Growth.** If you play repeatedly and reinvest, you care about the **geometric mean** (long-term growth rate), not the arithmetic mean. The arithmetic mean is an *ensemble average* (parallel universes); the geometric mean is the *time average* (single agent over time). For SPP, the geometric mean is finite. |
  | **Risk Aversion** | **SLA / Tail Bounds.** Engineers rarely optimize for mean latency; they optimize for p99 or p99.9 latency. The SPP distribution has such massive variance that the mean is a useless statistic for decision-making. You should optimize for a quantile (e.g., "What payout can I guarantee with 95% confidence?"). |

  ---

  ### Part 2: The Residue Report

  Here is what survives the translation, what requires fudging, and what evaporates.

  #### 1. Clean Translations (The "Engineering Truths")
  *   **Infinity as a Type Error:** The core of the paradox is treating an unbounded random variable as if it behaves like a bounded one. In CS, this is akin to assuming a stream fits in RAM. The "Finite Bankroll" resolution is not a "resolution" in CS; it is a **system constraint**. The paradox disappears the moment you declare `MAX_PAYOUT`.
  *   **Metric Selection:** The debate about "Utility" translates cleanly to "Objective Function Selection." If your objective function yields infinite loss/gain, it is a bad objective function for a bounded agent. Switching to `log(wealth)` is standard practice in systems where stability matters more than peak throughput (e.g., TCP congestion control, portfolio optimization).
  *   **Sample Complexity:** The fact that you need more samples than there are atoms in the universe to converge the estimator is a rigorous computational bound. It validates the intuition that "infinite EV" is operationally meaningless.

  #### 2. The Fudge Factors (Where the Mapping Stretches)
  *   **"Rationality":** In economics, rationality is often defined normatively as "Maximize Expected Utility." In CS, rationality is instrumental: "Achieve Goal G within Constraints C."
      *   *The Stretch:* Economics asks, "Is it *irrational* to pay \$20?" CS asks, "Does paying \$20 meet the SLA?" The CS framework doesn't judge the agent's internal state, only the input/output efficiency.
  *   **Single-Shot vs. Repeated:** The SPP is often presented as a one-off game. In CS, we almost always think in terms of loops and distributed systems.
      *   *The Stretch:* Applying ergodicity (time-averaging) to a single-shot game requires assuming the agent *could* have played repeatedly or is part of a larger ensemble of agents. This is a valid modeling assumption in CS (Monte Carlo tree search), but it changes the problem definition slightly.

  #### 3. The Evaporated Questions (What CS Ignores)
  *   **The Normative "Ought":** This is the biggest loss. Economics is deeply concerned with *normative* claims (what *should* a rational agent do?). CS is *descriptive* and *instrumental*.
      *   In CS, the question "Should I maximize EV?" is replaced by "If I maximize EV, will the system crash?"
      *   The philosophical tension of "The math says Infinite, but I feel \$20" vanishes. In CS, if the math says Infinite but the simulation says \$20, **the math is the bug.** We trust the simulator (reality) over the closed-form solution (theory) when they diverge on bounded hardware.
  *   **Subjective Value:** CS handles "Utility" only as a scalar transformation. It cannot model *why* an agent prefers stability over volatility beyond hard-coded constraints. The psychological component of "peace of mind" has no direct analog unless explicitly modeled as a constraint.

  ---

  ### Part 3: The Verdict on Computational Boundedness

  You asked: *Is the normative question ("should you maximize expected value even when the expectation is infinite?") something that has a meaningful analog in CS, or does it just evaporate once you insist on computational boundedness?*

  **It evaporates.**

  In a computationally bounded framework, **Expected Value is not a primitive; it is an emergent property of a distribution.** When that property diverges, it signals that the metric is ill-suited for the system's constraints.

  1.  **Maximizing EV is a Strategy, Not a Law:** In Reinforcement Learning (RL), we maximize expected reward. But if the reward distribution has infinite variance, standard RL algorithms (like Q-learning) fail to converge. Engineers fix this by **reward clipping** (capping the max reward) or **normalization**. This is exactly the "Finite Bankroll" or "Utility" resolution.
  2.  **The "Should" becomes "Can":** The question shifts from "Should I pay \$1,000,000?" to "Can I sustain a loss of \$1,000,000 if the tail event doesn't hit within my time horizon?" If the answer is no, the EV is irrelevant.
  3.  **Infinity is a Singularity:** In physics, when an equation yields infinity, it means the theory has broken down (e.g., a black hole singularity). In CS, when an expectation yields infinity, it means the **abstraction has leaked**. You are modeling a finite machine with infinite mathematics.

  ### Summary: Is your framework missing something?

  Your framework is **not** missing anything important regarding the *mechanics* of the paradox. In fact, the CS perspective dissolves the paradox more effectively than the economic one because it forces you to declare your bounds (time, memory, capital).

  The only thing the CS framework "misses" is the **philosophical discomfort** that arises when human intuition clashes with formal axioms. Economists spent centuries worried that humans were "irrational" for ignoring the infinite EV. A software engineer looks at the same situation and says: "The spec requires infinite memory. We can't build that. Let's cap the return at `UINT64_MAX` and move on."

  **Final Diagnosis:** The St. Petersburg Paradox is a **category error**. It treats a computational process (sampling) as a mathematical object (infinite sum).
  *   **Mathematician:** "The sum diverges."
  *   **Economist:** "Why won't humans pay infinite money?"
  *   **Engineer:** "The estimator doesn't converge, so stop using the mean. Use the median, cap the overflow, and check your p99."

  You aren't missing the deep insight; you're just working in a paradigm where infinity is handled as an exception, not a number.
