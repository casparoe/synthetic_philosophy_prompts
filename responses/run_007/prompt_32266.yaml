  # JOINT STATEMENT ON KANT'S "ON A SUPPOSED RIGHT TO LIE FROM PHILANTHROPY"
  **Prepared for:** Workshop on Deontological Ethics
  **Participants:** [Name], Kantian Absolutist; [Name], Moderate Deontologist
  **Date:** October 26, 2023

  ## PREAMBLE
  This document outlines the current state of our disagreement regarding Immanuel Kant's 1797 essay, *"On a Supposed Right to Lie from Philanthropy."* Our goal is not to synthesize our views into a compromise, but to precisely locate the fault lines within a shared deontological framework. We explicitly reject the characterization of this debate as Deontology vs. Consequentialism. Both signatories affirm that moral action is determined by duty, principle, and respect for persons, rather than the maximization of aggregate welfare. The dispute concerns the *structure* of deontological duties, not their replacement by consequentialist calculation.

  ---

  ## I. AGREED CLAIMS
  *The following propositions are affirmed by both parties. These claims establish the boundary conditions of our debate.*

  1.  **The Rejection of Consequentialist Justification:** Neither party argues that lying is permissible *because* it produces better net outcomes. The Moderate does not argue that saving a life creates more "utility" than telling the truth; rather, the Moderate argues that a competing *duty* overrides the duty of veracity.
  2.  **The Presumptive Wrongness of Lying:** Both parties agree that lying is a serious moral wrong, not a trivial infraction. It is not merely "undesirable"; it constitutes a violation of a perfect duty in normal circumstances. The debate is strictly about the existence of *exceptions*, not the gravity of the rule.
  3.  **The Definition of Lying:** We adopt Kant's definition for the purposes of this debate: An intentional untruthful declaration made to another person who has a right to the truth. We agree that deceptive implicatures or silence are distinct categories and are not the primary focus of this specific text.
  4.  **The Function of the "Murderer-at-the-Door" Case:** We agree that this case is not intended as a standard moral scenario, but as a *limit case* designed to test the resilience of the principle of veracity against extreme conflicting pressures.
  5.  **Juridical vs. Ethical Distinction:** We agree that Kant's essay conflates juridical accountability (liability for consequences in a court of law) with ethical duty (moral culpability before the moral law). Both parties agree that ethical culpability cannot be reduced solely to juridical liability, though they disagree on how the two relate.
  6.  **The Source of the Duty:** Both parties agree that the duty of veracity is grounded in respect for rational agency and the conditions necessary for communication and trust, not in social convenience or habit.

  ---

  ## II. DISAGREEMENTS TABLE
  *The following table isolates the specific points of divergence. Each description is phrased to be acceptable to the holder of that view.*

  | Issue | The Kantian Absolutist View | The Moderate Deontologist View |
  | :--- | :--- | :--- |
  | **1. The Hierarchy of Duties** | The duty of veracity is a **perfect duty** that admits no exception for inclination or competing goods. To allow an exception is to destroy the authority of the moral law itself. Duties cannot truly conflict; if they appear to, one is misinterpreting the scope of the duty. | Duties can be **plural and competing**. The duty of veracity is weighty but not absolute. It can be overridden by a stricter duty (e.g., the duty to protect innocent life from wrongful aggression) without negating the general authority of the moral law. |
  | **2. Moral Responsibility for Consequences** | If I lie, I become causally and morally responsible for *all* consequences that flow from that lie, including the victim's death. By stepping outside the law of truth, I lose my shield against contingent outcomes. | Moral responsibility tracks **agency and intent**. The murderer is the sole moral agent of the killing. The liar's intent is to protect, not to kill. Holding the liar responsible for the murderer's free choice conflates causation with moral culpability. |
  | **3. The Right to Truth** | The right to truth is a formal condition of human communication. Even a murderer retains the formal right to be addressed as a rational agent, which requires truthfulness. To deny this is to treat the murderer as a mere object to be manipulated. | Rights are **relational and conditional**. By initiating lethal aggression, the murderer forfeits their claim-right to truth from the defender. The duty to tell the truth is owed to those participating in the moral community in good faith. |
  | **4. Systemic Integrity** | A single exception destroys the reliability of declaration *in principle*. If truth-telling depends on the agent's assessment of consequences, the institution of promising and assertion collapses universally. | The integrity of communication relies on **reasonable expectations**. A context-specific exception (e.g., "unless asked by a known aggressor") can be universalized without destroying general trust, provided the criteria for the exception are strict. |

  ---

  ## III. VERBAL DISPUTES & CONCEPTUAL CLARIFICATION
  *We acknowledge two areas where terminological confusion has historically obscured our normative disagreement.*

  **A. The Meaning of "Right" (Recht)**
  *   **The Confusion:** Kant's title refers to a "Supposed *Right* to Lie." In 1797 German, *Recht* implies both moral entitlement and juridical claim.
  *   **The Clarification:** The Kantian focuses on the *ethical duty* (I must not lie). The Moderate focuses on the *claim-right* (The murderer has no standing to demand truth).
  *   **The Residual Normative Dispute:** Even if we clarify terms, the Kantian insists the *duty* remains even if the other's *right* is forfeited. The Moderate insists that if the right is forfeited, the duty dissolves. This is not merely verbal; it is a disagreement about the correlativity of rights and duties.

  **B. The Scope of "Declaration"**
  *   **The Confusion:** Kant argues that a declaration creates a contract with society.
  *   **The Clarification:** The Kantian views any assertion to another human as a social contract. The Moderate views it as a cooperative venture that presupposes non-malicious intent.
  *   **The Residual Normative Dispute:** Whether the "contract" of speech is voided by the listener's malicious intent.

  ---

  ## IV. CRUXES
  *These are the sub-questions upon which our disagreement turns. If we could agree on the answer to a Crux, at least one of us would have to revise our position.*

  ### Crux 1: The Universalizability of the "Protection Maxim"
  *   **The Question:** Can the maxim *"I will lie when necessary to protect an innocent life from lethal aggression"* be willed as a universal law without contradiction?
  *   **Agreed Test:** We will analyze this using the Formula of Universal Law (FUL). We agree to look for a contradiction in conception (does the practice become impossible?) vs. a contradiction in will (could we rationally will it?).
  *   **Kantian Prediction:** This leads to a **Contradiction in Conception**. If everyone lied when they *thought* it was necessary to protect life, no one could ever trust declarations in high-stakes situations, rendering the lie self-defeating.
  *   **Moderate Prediction:** This leads to **No Contradiction**. A universal law containing a specific exception for lethal aggression does not undermine trust in normal conditions. Trust relies on the presumption of good faith; the exception only activates when good faith is already absent (i.e., the murderer's intent).

  ### Crux 2: The Forfeiture Condition
  *   **The Question:** Does the initiation of wrongful force automatically suspend the normative relations (including the duty of veracity) between aggressor and defender?
  *   **Agreed Test:** We will examine parallel deontological cases, specifically self-defense. Both agree killing in self-defense is permissible. We ask: *Why* is it permissible?
  *   **Kantian Prediction:** Killing in self-defense is permissible because it is a **hindering of a hindrance to freedom** (juridical), but this does not extend to speech. The duty of truth is internal to rational agency and cannot be forfeited without ceasing to be an agent.
  *   **Moderate Prediction:** Killing in self-defense is permissible because the aggressor **forfeits their right to life**. By the same logic, they forfeit their right to truth. To hold otherwise creates an arbitrary distinction between the right to bodily integrity and the right to informational integrity.

  ### Crux 3: The Locus of Accountability
  *   **The Question:** If I lie to the murderer, and the murderer leaves to find the victim elsewhere and kills them, am I morally culpable for that death?
  *   **Agreed Test:** We will distinguish between *causal responsibility* and *moral imputation*. We agree that the murderer is morally culpable. The question is whether the liar shares that culpability.
  *   **Kantian Prediction:** I am **partially imputable**. By lying, I intervened in the chain of events unlawfully. I cannot know the future. If my lie inadvertently puts the victim in greater danger, I have violated the moral law and bear responsibility for the outcome of my unlawful act.
  *   **Moderate Prediction:** I am **not imputable**. Moral imputation requires control over the will of the agent. I do not control the murderer's will. My duty was to refuse participation in the murder (by not facilitating it with truth). The outcome is solely on the murderer.

  ---

  ## V. NEXT STEPS FOR COLLABORATION
  To move this debate forward, we propose the following work:

  1.  **Textual Analysis:** Jointly annotate paragraphs 3 and 4 of Kant's essay to separate his juridical arguments (liability) from his ethical arguments (duty).
  2.  **Case Expansion:** Apply our respective frameworks to a case where the "murderer" is not a stranger, but a state authority asking about a dissident. Does the "forfeiture" argument hold?
  3.  **Drafting a Joint Paper:** We will write a paper titled *"Two Deontological Responses to the Murderer at the Door,"* utilizing the structure of this document to ensure neither view is caricatured.

  **Signed,**

  _________________________ (Kantian Absolutist)

  _________________________ (Moderate Deontologist)
