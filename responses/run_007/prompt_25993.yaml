      *   **Volta (Quatrain 3 - The Silence):**
          *   Why don't I speak? Because speech makes it universal.
          *   Lines 9-12: I cannot tell you why. To explain is to lose the faith. Silence is the only way to keep the absolute relation.
          *   *Drafting ideas:* Do not ask why I bind your hands so tight, / For speech would trade the singular for all. / To justify is to step back into light, / Where I must fall or universally fall.
          *   *Refining for Kierkegaardian nuance:* Need to emphasize that speaking translates the singular into the universal.
          *   *Revision:* I dare not speak the word that clears my name, / For speech translates the singular to general. / To explain is to extinguish the holy flame, / And make my duty merely criminal.

      *   **Couplet (The Paradox):**
          *   Murderer or Knight of Faith. No middle term. Absolute relation.
          *   Lines 13-14: I am not better than men, just related to God. Either I kill or I save through faith.
          *   *Drafting ideas:* No merit makes me rise above the law, / But God alone defines what I must do. / Either I am a monster without flaw, / Or faith makes murder holy, sharp and true.
