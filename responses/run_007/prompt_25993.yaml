          *   *Drafting ideas:* My hand should shield you from the wolf's dark tooth, / By nature's law I owe you life and breath. / Yet Heaven speaks a strange and silent truth, / And orders love to walk the path of death.

      *   **Quatrain 2 (The Tension/Conflict):**
          *   Deepening the conflict. The universal vs. the specific command.
          *   Lines 5-8: The ethical demands I save you. The command demands I sacrifice. The tension is unbearable.
