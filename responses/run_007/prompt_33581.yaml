          *   *Critique:* This feels forced.
      *   *Let's go with the "Audit/Inspection" Example.* It naturally fits both statistical likelihood (Lottery) and fallibility of a collection (Preface).
      *   *Scenario:* **The Quality Control Inspector.**
          *   Inspector checks 1,000 widgets.
          *   Evidence for each widget: Test results say 99.9% chance it's good.
          *   Belief 1 (per widget): "Widget $n$ is good."
          *   Belief 2 (global): "At least one widget is defective" (based on base rates of the factory).
          *   This maps perfectly.
          *   Lottery structure: High prob of individual success (ticket loses = widget good). Aggregation leads to "All good," which contradicts "At least one bad."
          *   Preface structure: Asserting each claim ("Widget $n$ is good") in the report, but writing in the preface ("This report likely contains an error").

  3.  **Structure the 75 Minutes:**
      *   **0-10 min:** Intro & The Setup (The Inspector).
      *   **10-30 min:** The Lottery Side (Individual beliefs + Aggregation).
      *   **30-50 min:** The Preface Side (The Report + The Disclaimer).
      *   **50-65 min:** Synthesis/Connection (Closure, Probability, Rationality).
      *   **65-75 min:** Check for Understanding & Wrap-up.

  4.  **Addressing Misconceptions:**
      *   *Prob vs. Certainty:* Need to emphasize that belief isn't just "probability > 0.99."
      *   *Closure:* Students love to drop closure. Need to show why that's costly.
      *   *Identity:* "They are the same." Need to show the subtle difference (statistical vs. fallibility evidence) but structural identity.
      *   *Subtler one:* The "Pragmatic" solution (just don't assert). Epistemology is about *belief*, not assertion.

  5.  **Check for Understanding:**
      *   Need a scenario where they have to apply the structure to a *new* case or modify the current one to break the paradox.
      *   Idea: "The Omniscient Inspector." If the inspector had *different* evidence, would the paradox vanish?
      *   Better: "The Single Ticket." If there was only 1 widget, does the paradox hold? (Tests the aggregation requirement).

  6.  **What to Cut:**
      *   Kyburg's specific probabilistic logic thresholds.
      *   Deep dive into Bayesian vs. Frequentist interpretations.
      *   Specific solutions (Contextualism, Relativism) unless time permits. Stick to the *problem* structure.

  7.  **Drafting the Plan (Iterative refinement):**
