      *   *Crucial Distinction:* If I make the evidence purely statistical for the Book, it collapses into the Lottery Paradox. If I want to show they are *connected but distinct*, I need to acknowledge the evidence difference while showing the *logical structure* is the same.
      *   *Better approach:* Use the **"Audit Report"** (Widget) example. It allows me to *say* "This is like a Lottery" and "This is like a Preface" without being constrained by the specific mechanics of tickets or books.
