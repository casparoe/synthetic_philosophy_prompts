      *   *Check:* The "Two Inspectors" thought experiment.

  8.  **Refining the "One Example" Constraint:**
      *   The prompt asks for "maybe a lottery with a twist."
      *   Let's try to keep it closer to a Lottery to satisfy that intuition, but frame it as a Preface.
      *   *Revised Example:* **The Lottery Historian.**
