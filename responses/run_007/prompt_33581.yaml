      *   *Why this works:* It *is* a lottery (so Lottery paradox is native). It *is* a book (so Preface paradox is native).
      *   *Connection:* The evidence for the claims (statistical odds) is the same type of evidence that generates the preface doubt (statistical fallibility).
      *   *Wait, is the evidence the same?* In Preface, usually evidence for claims is specific, evidence for error is general. In Lottery, evidence for all is general.
      *   *Correction:* To make them structurally identical (which highlights the connection), the evidence should be uniform.
      *   *Let's stick to the Widget/Audit example.* It's cleaner for showing the structural isomorphism. Or, I can modify the Lottery Historian to ensure the evidence for the claims is purely statistical (like the lottery) to show the strong connection.
      *   *Decision:* Let's use the **"Lottery Book"**. The author writes a book predicting the losers of a massive lottery.
      *   Chapter 1: Ticket 1 loses.
      *   Chapter 2: Ticket 2 loses.
      *   Preface: "I know one ticket wins, so I'm wrong somewhere."
      *   This satisfies "Lottery with a twist" perfectly.

  9.  **Finalizing the Plan Details:**
      *   *Time:* 75 mins is tight. Need strict timekeeping.
      *   *Misconceptions:*
          *   "It's just about probability." (Address in first 15 mins).
          *   "Just drop Closure." (Address in solution section).
          *   "They are identical." (Address in synthesis).
      *   *Check:* "The Trusted Friend" scenario.

  10. **Review against constraints:**
      *   75 mins? Yes.
      *   Connection highlighted? Yes, via the "Lottery Book."
