      *   **Task:** Lead a 75-minute discussion section on the Lottery Paradox and the Preface Paradox.
      *   **Constraint 1 (Crucial):** Must show the *connection* between them, not treat them as separate puzzles.
      *   **Constraint 2 (Crucial):** Use *one running example* (e.g., a lottery with a twist) to cover both, avoiding case-switching.
