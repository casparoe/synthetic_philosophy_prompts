answer: |-
  You have spotted a genuine tension in your friend's argument, and honestly, a tension that has plagued Science and Technology Studies (STS) for forty years. Your intuition is correct: your friend is trying to hold two contradictory theoretical positions at once.

  To figure out what Winner actually argued, we need to separate your friend's interpretation from Winner's text, and then address the "stable property vs. context" paradox you identified.

  Here is the breakdown of what Winner's thesis actually is, why your friend is contradicting herself, and how to resolve the "intentions vs. context" dilemma.

  ### 1. Winner's Two Distinct Arguments
  Winner's essay is famous because he actually makes **two** different arguments about how artifacts have politics. Your friend is conflating them.

  **Argument A: Politics *in* the Design (The Moses Example)**
  This is the claim that specific features of a technology can be deliberately chosen to enforce a specific social order.
  *   **The Claim:** Robert Moses allegedly designed low overpasses to prevent buses (used by poor/Black people) from reaching Jones Beach.
  *   **The Mechanism:** Intentionality. A human actor embeds a political goal into the physical dimensions of the object.
  *   **The Status:** This is the "hard" claim. It suggests politics are "baked in" by the designer.

  **Argument B: Politics *of* the Technology (The Nuclear vs. Solar Example)**
  This is the claim that certain technologies, by their very nature, *require* specific political structures to function, regardless of the designer's intent.
  *   **The Claim:** Nuclear power plants require tight secrecy, hierarchical command, and centralized authority to operate safely. Solar panels on roofs are compatible with decentralized, democratic, local control.
  *   **The Mechanism:** Inherent materiality. The physics and logistics of the technology dictate the social organization.
  *   **The Status:** This is the "soft" claim. It suggests the technology *affords* or *demands* certain politics, even if no one intended it.

  ### 2. Addressing Your Friend's Contradiction
  Your friend said:
  1.  *"Once a technology has a politics built into it, that politics just plays itself out no matter who uses it."* (Technological Determinism)
  2.  *"The same artifact can have different politics in different contexts."* (Social Constructivism)

  **These are mutually exclusive.**
  *   If the politics are **in the object** (Claim 1), then moving the object to a new context shouldn't change its politics. A "racist bridge" should be racist in Canada, in 1920, and in 2024.
  *   If the politics depend on **context** (Claim 2), then the object doesn't *have* politics; the *society* has politics, and the object just participates in them.

  **Where Winner Stands:**
  Winner is closer to Claim 1, but with a caveat. He argues that material constraints are **durable**. A low bridge remains 9 feet high regardless of the year. However, for that height to be "political," there must be a social context where buses exist and where racial segregation is a relevant social dynamic.

  So, the politics aren't *magically* inside the concrete. The politics exist in the **relationship** between the material constraint (9 feet) and the social system (segregated transit).

  Your friend is trying to have it both ways: she wants the object to have agency (it *is* racist) but also wants to acknowledge that meaning changes (context matters). Winner would say: **The material constraint is stable; the political consequence depends on the social system.**

  ### 3. Intentions vs. Context: What is the Thesis?
  To answer your core question: *Is "artifacts have politics" a claim about intentions being baked into the object, or a claim about context?*

  **It is a claim about Material Constraints on Power.**

  Winner's thesis is not that objects have souls or opinions. His thesis is that **technical systems are forms of social order.** When we build a technology, we are building a set of rules for how humans can interact.

  *   **Regarding Intentions:** Winner uses the Moses story to show that intentions *can* be embedded. However, historians have largely debunked the Moses story (the bridges were built before the buses were a factor, and the heights were standard for the era). Winner actually acknowledges this ambiguity in later writings. He uses it as a *parable*, not just a historical fact.
  *   **Regarding Context:** Winner admits that for the politics to "work," the context must align. A low bridge only excludes people if there is a public transit system to exclude. If everyone has a car, the bridge height is politically neutral.

  **So, the synthesis is this:**
  Artifacts have politics because they **structure human behavior.**
  *   Sometimes this is done on purpose (Moses).
  *   Sometimes this is done by necessity (Nuclear plants need hierarchy).
  *   But the "politics" only activate when the artifact interacts with a society where that behavior matters.

  ### 4. How to Settle the Debate
  You can tell your friend that she is mixing up **Technological Determinism** (technology drives society) with **Social Construction of Technology** (society drives technology).

  *   **If she believes the bridge is racist "full stop" (regardless of context):** She is arguing for hard determinism. This is vulnerable to the critique: "What if you build that bridge in a society with no buses and no racial hierarchy? Is it still racist?" If she says "Yes," she is attributing magical moral agency to concrete.
  *   **If she believes the politics change based on context:** She is admitting that the artifact *itself* isn't doing the political work; the *social arrangement* is.

  **Winner's Actual Position (The Middle Ground):**
  Winner argues that we should stop treating technology as "neutral tools." We need to recognize that **choosing a technology is a political act.**
  *   Choosing to build a highway system instead of a rail system is a political choice (even if we call it "engineering").
  *   Choosing nuclear power over solar is a political choice (centralized authority vs. local autonomy).

  The thesis isn't "Objects have politics like people do." The thesis is **"Technological arrangements constitute a form of power and authority that we often ignore because we think machines are neutral."**

  ### Summary for your friend
  1.  **The Moses story is illustrative, not absolute.** It shows how design *can* encode intent, but the politics rely on the surrounding transit system.
  2.  **Stability vs. Context:** The *physical constraint* is stable (the bridge height). The *political effect* requires context (segregation + buses). Winner argues the constraint is what makes the politics durable, but he doesn't deny context is required for the politics to matter.
  3.  **The Thesis:** Technology is not a neutral means to an end; it is a framework that shapes social relationships. We are responsible for the politics of the things we build, even if we claim we are "just engineers."

  You are right to be skeptical of the "both ways" argument. Winner's point is that materiality matters—it constrains what society *can* do—but he isn't claiming objects operate independently of the society they are placed in.
