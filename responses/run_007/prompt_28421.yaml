answer: |-
  This is a classic formulation of the **Problem of Overdetermination** (or the "Inefficacy Objection") in collective harm. It's a favorite of ethics professors because it pits our intuitive causal reasoning against our intuitive moral reasoning.

  To get your reading group out of this loop, you need to make a surgical strike. Here is the diagnosis, the recommended move, and the cost.

  ### The Move: Reject Premise (1)

  You should reject **(1): "An act is wrong only if it makes a difference to whether the harm happens."**

  This premise is known as the **Difference Principle** or **Causal Individualism**. It is the weak link. If you hold onto (1), you are forced into the absurd conclusion that the firing squad is innocent. Since we know the firing squad is guilty, (1) must be false.

  **The Cost of Rejecting (1):**
  You lose the clean, mathematical simplicity of "No harm, no foul." You have to adopt a moral theory where **participation, complicity, or intention** can generate wrongness even without causal necessity. This makes moral accounting messier. You can no longer just measure grams of CO2 or milliliters of blood; you have to measure relationships to harmful outcomes.

  ### Solving Your Dilemma: The Burger vs. The Bullet

  Your main worry is: *"If I reject (1), I worry that story will catch my burger too."* You want to condemn the firing squad but keep the burger distinct (perhaps less wrong, or wrong for different reasons).

  You can do this by distinguishing between **two types of collective action**. Rejecting (1) doesn't mean *all* inefficacious acts are equally wrong. It just means inefficacy doesn't grant *immunity*.

  Here is the framework to distinguish them:

  #### 1. Joint Intentional Action (The Firing Squad)
  In the firing squad case, the individuals are engaged in a **shared intentional project**.
  *   **The Mechanism:** They have agreed to kill the prisoner. Their individual actions are coordinated parts of a single plan.
  *   **Why it's wrong without difference-making:** They are guilty of **complicity in a joint enterprise**. Even if my bullet doesn't kill him (because yours did), I intended his death as part of our shared goal. My moral failure is binding my will to a murderous plan.
  *   **Verdict:** Deeply wrong.

  #### 2. Aggregate Market Action (The Burger/Flight)
  In the climate/meat case, individuals are not coordinating. There is no shared intent to harm.
  *   **The Mechanism:** This is an **unorganized aggregate**. You want lunch; the farmer wants money; the climate suffers as a side effect.
  *   **Why it's different:** You are not complicit in a *murder plot*; you are participating in a *harmful system*.
  *   **The Role of Inefficacy:** Here is where you keep "something right about the inefficacy objection." While inefficacy doesn't make the act *permissible* (rejecting 1), it does mitigate the **severity** of the blame.
      *   The firing squad member is a **co-author** of the death.
      *   The burger buyer is a **minor participant** in a causal chain.
  *   **Verdict:** Potentially wrong (due to complicity in a harmful system), but distinct from the firing squad.

  ### Salvaging Premise (2): The Expected Utility Twist

  There is a second way to distinguish the burger from the firing squad that might satisfy your group's empirical itch. You can argue that **(2) is actually false for the burger, but true for the firing squad.**

  *   **Firing Squad (Deterministic Overdetermination):** If there are 10 shooters and 5 bullets are enough to kill, the 6th shooter literally makes no difference. The outcome is fixed regardless of their trigger pull.
  *   **Burger/Voting (Probabilistic Thresholds):** Markets and elections work on thresholds.
      *   **Voting:** Elections are often decided by small margins. Your vote has a tiny *probability* of being the decider.
      *   **Burgers:** Supply chains adjust to demand. If you buy a burger, you slightly increase the probability that the store will order more patties, which eventually triggers the ordering of another cow.
      *   **The Math:** You don't cause 1/1000th of a cow's death. You cause a 1/1000 *chance* of causing a whole cow's death. The **Expected Utility** is the same (0.001 cows), but the *structure* is different.

  If you use this **Expected Utility** argument, you can say:
  1.  **Firing Squad:** Wrong because of **Complicity/Intent** (Causal impact is zero).
  2.  **Burger:** Wrong because of **Expected Harm** (Causal impact is probabilistic, not zero).

  This allows you to say the inefficacy objection *fails* for the burger (because there is expected impact) but *succeeds* for the firing squad (because there is no impact), yet both are wrong for different reasons.

  ### Summary for Your Group

  Here is the exit strategy to propose:

  1.  **Reject (1).** Causal necessity is not a requirement for moral wrongness. (Otherwise, the firing squad goes free).
  2.  **Modify (2).** For the firing squad, the individual act makes no difference (overdetermination). For the burger/flight, the individual act makes a *probabilistic* difference (expected utility).
  3.  **Distinguish the Wrongness.**
      *   **Firing Squad:** Wrong due to **Complicity in Intentional Harm**. (Inefficacy is irrelevant).
      *   **Burger:** Wrong due to **Expected Contribution to Harm**. (Inefficacy reduces the magnitude of harm, but not to zero).

  **What this costs you:**
  It costs you the comfort of thinking your individual actions are morally neutral just because they are small. You have to accept that you can be morally responsible for harms you didn't strictly "cause" in a linear sense. But it saves you from equating a Tuesday lunch with an execution: one is binding your will to murder; the other is failing to minimize your probabilistic contribution to a systemic harm. They are both pro tanto wrong, but they are not on a par.
