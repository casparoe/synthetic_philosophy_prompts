answer: |-
  To grasp Schopenhauer, visualize his metaphysics as a hierarchy. At the bottom is the phenomenal world (individual objects). Above that are the Platonic Ideas (eternal forms). At the source is the Will (the thing-in-itself, blind striving).

  Standard arts copy the Ideas. They show the Will objectified at specific grades. Architecture shows gravity; tragedy shows human nature. They are twice removed from reality: World → Idea → Art. They are bound by form and individuation.

  Music bypasses the Ideas. It is a direct copy of the Will itself. It doesn't show the shadow; it sounds like the substance. This proximity makes it the highest art. It isn't vague; it is universal. While tragedy shows a specific hero suffering, music expresses suffering *in itself*, stripped of accidental details. It captures the dynamic motion of striving—tension, release, desire, satisfaction—without needing a specific object to desire. For Schopenhauer, individual content is the illusion (Maya); essence is the truth. Therefore, non-representational art is not empty; it is uncluttered by the false specifics of the phenomenal world. It reveals the engine behind the scenery. Determinate content limits meaning to specific instances; abstraction expands it to essence.

  The tension is this: If music is the Will, and the Will is chaotic, painful striving, why is music orderly? If it were truly the Will, listening would be overwhelming suffering, not art. Schopenhauer resolves this by defining music as an *analogy*. It mirrors the Will's structure without being the Will itself. The bass notes mirror lower grades of objectification (nature); the melody mirrors the highest (human intellect). Music allows us to contemplate the Will's movements safely, providing temporary release from suffering rather than inducing it. It is the Will becoming audible to itself, but filtered through harmony. Thus, music is not empty abstraction; it is the fullness of reality without the pain of individual existence.
