answer: |-
  ### Essay Question

  **Prompt:**
  Hart and Fuller are often presented as offering rival answers to the question, "Can an immoral rule be a valid law?" However, some scholars suggest their debate is less about the extension of the concept "law" and more about the *purpose* of legal theory. 

  Write an essay evaluating this claim. In your answer, you must:
  1.  Explain how Fuller's "internal morality of law" functions simultaneously as a definition of legality and a moral standard.
  2.  Demonstrate how Hart's positivism retains the resources to condemn Nazi statutes without collapsing into natural law.
  3.  Use the "Grudge Informer" cases to determine whether the disagreement is substantive (about what we should do) or conceptual (about how we use the word "law").

  ***

  ### Model Answer

  The Hart-Fuller debate is frequently caricatured as a binary clash over whether evil laws are "really" laws. However, a closer examination of the architecture of their exchange suggests the disagreement is deeper: it concerns the function of legal philosophy itself. While Hart seeks to describe the social phenomenon of law to clarify moral reasoning, Fuller seeks to prescribe the conditions necessary for law to function as a specific kind of moral enterprise. Consequently, they are partially talking past each other, though the stakes remain substantively high.

  Fuller's argument rests on the "internal morality of law," comprised of eight desiderata (e.g., generality, publicity, non-retroactivity). This concept performs double duty in his architecture. First, it is definitional: a system that fails these procedural requirements so egregiously (like the Nazi regime) is not merely bad law, but fails to count as a legal system at all. Second, it is moral: by adhering to these procedural norms, the law respects human agency and fosters a relationship of reciprocity between ruler and ruled. For Fuller, you cannot separate the procedure from the morality because the procedure *is* a morality of aspiration. Thus, when Fuller argues Nazi directives were not law, he is not making a semantic point alone; he is arguing that the regime failed to create the conditions for fidelity to law.

  Hart, conversely, insists on the "separation thesis": there is no necessary connection between law and morality. For Hart, law is a system of primary and secondary rules grounded in a social rule of recognition. To call a rule "law" is to identify its source, not endorse its content. However, students often miss that Hart's positivism does not require moral silence. Hart explicitly argues that recognizing a rule as legally valid leaves open the question of whether it is too wicked to be obeyed. He possesses the resources to condemn Nazi law through what he calls "critical morality." By separating legal validity from moral obligation, Hart arguably makes it *easier* to condemn evil laws; one does not need to engage in semantic gymnastics to deny their legality. One can simply say, "This is law, but it is too wicked to obey."

  The "Grudge Informer" cases—where post-war courts had to decide whether to punish informers who used Nazi statutes to harm enemies—serve as the stress test for these architectures. For Fuller, the courts should have invalidated the Nazi statutes on the grounds that they lacked the internal morality of law, thereby avoiding the problem of retroactivity. For Hart, this was a choice between two evils: punishing the informer retroactively or letting them go free. Hart prefers the "honest" solution: admit the statute was valid law, but pass a retroactive statute to punish the informer, acknowledging the moral sacrifice being made for the sake of justice.

  Here lies the crux of whether they are talking past each other. If the debate is purely conceptual, Fuller is defining "law" narrowly to exclude evil regimes, while Hart defines it broadly to include them. On this reading, they agree on the facts (the Nazis did terrible things) but disagree on the label. However, the disagreement is also substantive. Fuller believes that calling Nazi directives "law" risks contaminating the idea of law and undermining the moral obligation of fidelity. Hart believes that calling them "law" preserves the clarity needed to see that legal validity does not entail moral obedience.

  In the secondary literature, it is largely settled that Hart successfully defends the coherence of positivism against the charge that it encourages obedience to evil. It is also settled that Fuller's theory is a form of "procedural natural law." What remains genuinely contested, however, is whether Fuller's internal morality actually generates substantive moral outcomes, or if a regime could satisfy the eight desiderata while remaining thoroughly unjust (the "benign dictator" objection). Furthermore, contemporary scholars debate whether the "compatibility thesis" is true: that Hart and Fuller ultimately agree on the rule of law's value but disagree on the best vocabulary to describe it.

  Ultimately, the debate turns on both concept and substance. They are talking past each other regarding the definition of "law," but they are genuinely clashing over how legal theory should guide judicial reasoning in the aftermath of tyranny. Hart prioritizes clarity of moral choice; Fuller prioritizes the integrity of the legal form.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  #### 1. The "Recitation Trap" (Automatic Penalty)
  *   **Common Mistake:** The essay merely summarizes Hart's view, then summarizes Fuller's view, then states "they disagree."
  *   **Penalty:** If the essay fails to analyze *why* they disagree (conceptual vs. substantive) or treats the Grudge Informer case as a simple "win" for one side, the maximum grade is a **C+ (65%)**, regardless of writing quality. The prompt requires architectural analysis, not summary.

  #### 2. Criteria for a B Answer (70% – 79%)
  To achieve a B, the student must accurately reconstruct the arguments without falling into the Recitation Trap.
  *   **Fuller's Double Duty:** Correctly identifies that Fuller's 8 desiderata are both conditions for the *existence* of law and a *moral* standard (reciprocity/agency).
  *   **Hart's Resources:** Correctly explains that Hart distinguishes "law as it is" from "law as it ought to be" and that he allows for moral condemnation via "critical morality."
  *   **Grudge Informer:** Explains how each theorist would resolve the case (Fuller: void ab initio; Hart: retroactive punishment).
  *   **Deficit:** A B answer may identify that they use different concepts but fails to deeply evaluate *why* that matters for the function of legal theory, or treats the "talking past each other" thesis as a settled fact rather than an interpretation.

  #### 3. Criteria for an A Answer (80% – 100%)
  To achieve an A, the student must synthesize the positions to evaluate the nature of the debate itself.
  *   **Architecture of the Debate:** Explicitly evaluates whether the disagreement is verbal (definition of "law") or functional (what legal theory is *for*). The essay should argue that the conceptual difference drives the substantive divergence in the Grudge Informer cases.
  *   **Nuance on Hart:** Does not portray Hart as morally neutral. Explains *why* Hart thinks separating law and morality aids moral criticism (prevents the "shield" of legality).
  *   **Literature Distinction (Crucial):** Clearly distinguishes between settled interpretations and contested scholarly debates.
      *   *Settled:* Hart's separation thesis; Fuller's procedural natural law.
      *   *Contested:* Whether Fuller's requirements guarantee substantive justice; the "compatibility thesis" (that they ultimately agree).
  *   **Critical Engagement:** The conclusion offers a reasoned judgment on which approach offers better guidance for post-conflict justice, rather than just restating the prompt.

  #### 4. Specific Differentiators
  | Feature | B Level Performance | A Level Performance |
  | :--- | :--- | :--- |
  | **Fuller's Morality** | Describes the 8 desiderata as moral rules. | Explains them as *constitutive* of the practice of law itself (the "double duty"). |
  | **Hart's Condemnation** | States Hart thinks Nazi law was valid but bad. | Explains Hart's strategic reason for this: to prevent the confusion of legal validity with moral obligation. |
  | **Grudge Informer** | Uses the case to show who is "right." | Uses the case to reveal the *consequences* of their theoretical commitments. |
  | **Scholarly Context** | Treats all claims as absolute facts. | Identifies which claims are standard interpretations vs. ongoing philosophical disputes. |
