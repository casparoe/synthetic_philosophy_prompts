      *   *Is "abolitionism" practical?* No, the user can't tell NASA they aren't studying life. I need to suggest a *strategic* use of the word, not necessarily an honest ontological commitment.
      *   *Key distinction:* Distinguish between "Life as a Historical Phenomenon" (Earth life) and "Life as a General Phenomenon" (Possible life). Synthetic biology straddles this.

