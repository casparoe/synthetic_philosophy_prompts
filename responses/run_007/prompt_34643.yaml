answer: |-
  This is a precise dissection of the tension between the *phenomenology* of party politics (what it actually does) and its *legitimating narrative* (what it says it does). Simone Weil's *On the Abolition of All Political Parties* (1940) is unique because it does not argue that parties are inefficient or corruptible; she argues they are *structurally* incompatible with the pursuit of truth and the general will.

  To answer your questions, we must look at the party not as a failed deliberative body, but as a successful machine for something else entirely.

  ### 1. The Theory of Collective Judgment Presupposed by Parties

  The practice you describe—whipping votes, enforcing discipline, prioritizing victory over accuracy—presupposes a **Voluntarist Theory of Truth**.

  In classical deliberative democracy (the "official story"), truth or the "common good" is something to be *discovered* through the collision of arguments. The presupposition is epistemic: that through debate, error is shed, and a clearer picture of reality emerges.

  Party practice, however, operates on a **Will-to-Power epistemology**. It presupposes that:
  1.  **Truth is enacted, not discovered.** A policy does not become "right" because it aligns with reality, but because it successfully commands the machinery of the state.
  2.  **The Collective Will is a singular entity.** Just as an individual cannot walk if their left leg fights their right leg, the Party cannot act if its members dissent. Therefore, internal dissent is not a contribution to judgment; it is a mechanical failure.
  3.  **Time is horizontal, not vertical.** In a truth-seeking model, we look "up" to objective standards (justice, facts). In the party model, we look "across" at the opponent. The validity of a proposition is determined by its source (Friend vs. Enemy), a Carl Schmitt-style distinction.

  Consequently, the party presupposes that **individual judgment is a source of noise, not signal.** If the goal is the aggregation of power, individual conscience is a friction point. The theory of collective judgment here is not "the wisdom of crowds" but "the unity of the phalanx." It assumes that a unified error is politically superior to a fragmented truth.

  ### 2. Truth Subordinate to Interest, or Judgment Suppressed for Power?

  It is both, but they function differently.

  **Truth is subordinate to interest:**
  The party operates on a pragmatic realism. It presupposes that in a pluralistic society, there is no single "Truth" accessible to all, only competing interests. Therefore, the only "truth" that matters is the one that can sustain the coalition. If a fact undermines the coalition (e.g., an economic statistic that hurts the narrative), it must be suppressed. This is not necessarily seen as lying, but as *managing reality* to maintain stability.

  **Individual judgment is suppressed for collective power:**
  This is the deeper presupposition. It assumes that **agency resides in the institution, not the person.** When a representative is whipped, they are being reminded that they are a limb of the Party-Body. To exercise private judgment is to claim agency that belongs to the collective.
  *   **Is this coherent?** Yes, if you accept the premise that politics is war. In war, dissent is treason. If the "Official Story" is that politics is war by other means, the practice is perfectly coherent.
  *   **The Incoherence:** The incoherence arises only when the system claims to be a *truth-seeking* deliberative democracy. The practice contradicts the narrative. This suggests the system relies on a form of **institutional bad faith**: it requires citizens to believe in the "Official Story" (that their vote matters, that debate happens) while elites operate on the "Practice" (that power is consolidated and defended).

  So, the practice is underdetermined by theories of *democracy*, but it is overdetermined by theories of *oligarchy* and *realism*. It is coherent as a mechanism for stability and power retention; it is incoherent as a mechanism for discovering the common good.

  ### 3. Weil's Alternative: The Politics of Attention

  Weil's proposal is not merely "independent politicians." It is a metaphysical shift in how political engagement is conceived. She replaces the **Will** (the driving force of parties) with **Attention** (the capacity to perceive truth).

  In Weil's view, the party creates a "collective ego." Just as an individual ego distorts perception to protect itself ("I am right"), the party ego distorts perception to protect the organization ("We are right").

  **How disagreement changes in Weil's model:**

  1.  **From Identity to Inquiry:**
      *   *Party Politics:* Disagreement is an attack on identity. If you oppose my bill, you oppose *me* and *my tribe*. I must defeat you to survive.
      *   *Weil's Politics:* Disagreement is data. Associations form around specific problems (e.g., "housing," "infrastructure"). If you disagree with my solution, you are not my enemy; you are someone who sees a different aspect of the problem. The goal is not to defeat the other, but to align both views with the reality of the problem.

  2.  **Dissolution of the Collective:**
      *   *Party Politics:* The organization must persist to fight the next battle. Therefore, disagreements cannot be fully resolved, only managed, because permanent conflict ensures permanent cohesion.
      *   *Weil's Politics:* The association dissolves once the issue is settled. This removes the incentive to prolong disagreement. There is no "next election" for this specific group to win. This forces participants to seek a genuine resolution rather than a tactical compromise.

  3.  **The Role of Conscience:**
      *   *Party Politics:* Conscience is externalized. "I voted this way because the Party demanded it." Moral responsibility is diffused.
      *   *Weil's Politics:* Conscience is radicalized. Since there is no Party to hide behind, the individual bears full responsibility for their judgment. Weil presupposes that human beings are capable of this, provided the social pressure of the "collective ego" is removed.

  4.  **Handling "Truth":**
      *   Weil presupposes that truth is **impersonal**. It does not belong to a group. In party politics, truth is property ("Our truth vs. Their truth"). In Weil's politics, truth is a destination. Disagreement is handled through a process of *decreation*—stripping away the egoistic desire to win until only the facts and the requirements of justice remain.

  ### Summary of the Presuppositions

  | Feature | Party Politics (Current Practice) | Weil's Alternative |
  | :--- | :--- | :--- |
  | **Primary Goal** | Victory / Survival of the Group | Justice / Resolution of the Problem |
  | **Theory of Truth** | **Voluntarist:** Truth is what the Will enacts. | **Realist:** Truth is what Attention perceives. |
  | **View of Dissent** | Pathology (Disloyalty/Weakness) | Resource (Additional data/Perspective) |
  | **Unit of Agency** | The Collective (The Party) | The Individual (in temporary association) |
  | **Disagreement** | War (Zero-sum) | Inquiry (Collaborative) |
  | **Coherence** | Coherent as Power; Incoherent as Deliberation | Coherent as Ethics; "Incoherent" as Power |

  ### Conclusion

  The practice of political parties presupposes that **stability requires the suspension of truth.** It assumes that if individuals actually followed their private judgment, the result would be chaos (a Hobbesian fear), and therefore the "fiction" of party unity is a necessary noble lie. It treats truth as subordinate to interest because it views politics as the management of conflict, not the resolution of it.

  Weil's alternative demands a terrifying amount of civic virtue. It requires that people care more about *what is right* than *who is right*. It changes disagreement from a battle of wills into a shared labor of attention. The reason parties resist this is not just inertia; it is because a politics built on Weil's model makes the accumulation of permanent power impossible. If associations dissolve when the truth is found, no one can build a career on perpetual conflict.

  Weil's argument ultimately suggests that the "Official Story" of parties (that they facilitate representation) is a lie, and the "Practice" (that they facilitate power) is the truth. Her alternative asks if we can bear to live in a politics where power is secondary to truth.
