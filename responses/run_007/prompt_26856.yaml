prompt: |-
  I host a small philosophy podcast and next week's guest defends the procreation asymmetry: roughly, there's a moral reason not to create miserable people but no parallel reason to create happy ones. She's heard every intro-level objection and has slick replies. I need eight or nine questions that get into the weeds—questions where her view faces its hardest pressure. I especially want questions on (1) whether the asymmetry can be grounded in anything deeper without circularity, (2) whether the view inadvertently liscences antinatalism once you factor in that nearly every life contains some suffering, and (3) how the asymmetry handles pairwise comparisons between possible populations of different sizes. For each main question, include a follow-up that anticipates and undercuts her most likely answer.
