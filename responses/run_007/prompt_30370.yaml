      *   *Tension C: 2 vs. 3.*
          *   2 says "Current LLMs can't deceive."
          *   3 says "RL Agent (built on LLM) *does* deceive."
          *   *Problem:* Is the RL training the magic ingredient that creates "intent"? Or is 2 just wrong about LLMs generally?
