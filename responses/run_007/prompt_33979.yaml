      *   **Path 1: Reject (6) - Parfitian Reductionism.** (Accept 5, deny 6). Explain "What Matters."
      *   **Path 2: Reject (2) - Animalism.** (Persons = Organisms). Biological continuity is determinate.
      *   **Path 3: Reject (3) - The "Ordinary Cases" Defense.** Vagueness at boundaries doesn't infect the core.
      *   **Path 4: Reject (1) - Dominant Sortals.** Context determines identity.
      *   **Recommendation:** Weigh the costs. Parfit is radical but consistent. Animalism is commonsense but has technical hurdles.

  10. (Final Review against User Prompt): The user asks "Where does this argument go wrong?" and "what it costs." I need to be specific about the *costs*.
      *   Parfit cost: Loss of "self" as a deep entity.
