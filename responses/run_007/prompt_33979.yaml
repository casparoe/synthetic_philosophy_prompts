          *   *Relevance:* This is the user's specific worry. If psychology matters, does fission break it?

      *   **Step (3): Indeterminacy implies Conventionality.**
          *   *Critique:* This is the "Epistemicist" or "Ontic Vagueness" debate. Maybe identity is determinate but unknowable? Or maybe "identity" isn't what matters.
          *   *Cost:* Epistemicism is counterintuitive (sharp boundaries we can't know).
