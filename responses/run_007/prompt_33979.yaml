      *   **Focus on (2) (Psychological Continuity):** Explain why persons might differ from ships, but acknowledge the fission problem remains for psychology too (Branch Line Case).
      *   **Focus on (3) (Vagueness vs. Convention):** Discuss ontic vagueness vs. semantic indecision.
