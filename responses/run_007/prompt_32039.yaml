  So I was listening to this podcast and the host went on a rant about self-deception and I'm trying to figure out how much of it holds up. He basically said:

  "Self-deception isn't a real thing, it's a contradiction in terms. Deception means one person intentionally hides the truth from another person. But in self-deception, you're both people, so you'd have to know the truth and not know it at the exact same time — that's just logically impossible. What people call 'self-deception' is really just motivated reasoning: you want something to be true so you avoid looking at the evidence too hard, or you tell yourself a story, but deep down you know the truth. You don't actually believe the false thing. Philosophers who defend self-deception as a real phenomenon have to split the mind into a conscious part and an unconscious part, like a little homunculus that keeps secrets from the rest of you — basically Freudian stuff that nobody in philosophy of mind takes seriously anymore."

