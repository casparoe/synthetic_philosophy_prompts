          *   **Format:** Continuous prose, like a letter. No headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Analogy (Swiss Army Knife = Mind):**
      *   *Blades/Tools:* Specialized cognitive modules (face recognition, cheat detection, etc.).
      *   *Handles/Body:* The brain structure holding them together? Or perhaps the individual organism?
      *   *Factory/Designer:* Natural selection (though the prompt notes the disanalogy of foresight).
