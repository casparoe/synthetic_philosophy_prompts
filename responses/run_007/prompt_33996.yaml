answer: |-
  Hi everyone,

  After several weeks of back-and-forth and two intensive weekend sessions, we are sending over the joint statement regarding Kavka's Toxin Puzzle that we promised. We went into this collaboration expecting to entrench our positions, but we found that mapping the disagreement required us to agree on far more than we initially realized about the setup and the stakes. We both agree that the standard formulation involves a billionaire who offers one million dollars at midnight contingent solely on the agent forming the intention to drink a non-lethal but painful toxin the following afternoon. We agree that the money is deposited and irrevocable before the drinking time arrives, meaning that at the moment of decision, drinking yields only pain and no financial benefit. We also agree that the predictor is reliable enough that the agent knows their own psychology well enough to know whether they will drink, and we agree that a rational agent is generally defined as one who maximizes expected utility. Where we diverge is not on the math of the payoffs, but on the metaphysics of intention and the scope of rationality.

  The core disagreement can be stated precisely without either of us feeling strawmanned. One of us maintains that forming an intention to X necessarily entails believing that one will X, or at least being settled on X-ing in a way that is incompatible with knowing one will not X. On this view, because the agent knows at midnight that drinking will be irrational tomorrow afternoon once the money is secure, the agent cannot believe they will drink, and therefore cannot form the intention. The million dollars is thus unobtainable for a purely rational agent without external modification, and any solution involving a pill or a side bet is admitted to be a change in the payoff structure that dissolves the original puzzle rather than solving it. The other of us maintains that intention is a distinct practical stance that can be adopted independently of predictive belief, or that rational agency includes the capacity to bind one's future self through commitment devices that are internal to the agent's planning capacity. On this view, the agent can secure the money either by forming a genuine intention that persists despite the change in incentives, or by employing a commitment device that makes drinking the rational choice tomorrow, and this does not count as changing the game but rather as exercising the full range of rational agency.

  We identified three specific cruxes where settling the sub-question would move at least one of us toward the other's position, and we have recorded concrete variants and predictions for each. The first crux concerns the belief condition on intention. We ask whether the statement I intend to drink but I know I will not is a coherent description of a mental state or merely a confused report of predicted akrasia. To test this, we considered a variant where the agent has a psychological quirk such that forming the intention itself causally ensures the action, independent of later reasoning. The skeptic predicts that even in this case, the agent cannot intend because the belief condition is conceptual, not empirical, so knowing the quirk exists does not allow the intention if the agent still judges the act irrational. The optimist predicts that in this variant, the agent can intend because the intention is self-fulfilling, and rationality permits forming intentions that cause good outcomes even if the act itself is locally costly. If the skeptic were to concede that intention does not require belief in success but only a commitment to try, they would move toward the optimist's camp, while if the optimist conceded that intention without belief is psychologically impossible for a transparent mind, they would move toward the skeptic.

  The second crux concerns the status of commitment devices and whether using one counts as solving the puzzle or changing the game. We focused on whether a device that imposes a penalty greater than the toxin's pain for failing to drink alters the payoff matrix sufficiently to invalidate the puzzle. The skeptic argues that such a device changes the payoffs so that drinking becomes the locally rational act tomorrow, which means the agent no longer faces the toxin problem but a standard prudential choice, so the original puzzle remains unsolved. The optimist argues that rational agents are expected to manage their future incentives, and that a commitment device is simply a tool for making intentions stable, so using one counts as solving the puzzle because it shows how a rational agent obtains the money. We agreed to test this with a variant where the commitment device is purely internal, such as a deeply held personal norm that causes psychic pain if violated, rather than an external contract. The skeptic predicts this still changes the game by adding a new cost to not drinking, while the optimist predicts this is the natural way humans form intentions and should count as a valid solution. If the skeptic accepts that internal norms are part of the baseline agency rather than external modifications, they would concede the optimist's point.

  The third crux concerns what the word rational is constraining in the puzzle, specifically whether it applies to the formation of intentions, the performance of acts, or both. We asked whether rationality is a constraint on which intentions you may form at midnight, on which acts you may perform tomorrow, or on the plan as a whole. The skeptic holds that rationality constrains both, so an intention to perform an irrational act is itself irrational, making the plan incoherent. The optimist holds that rationality is primarily a constraint on plans, so a plan that secures the million dollars is rational even if the final act is locally suboptimal, meaning the intention is rational because the plan is rational. We tested this with a Newcomb-like variant where the predictor rewards agents who adopt a disposition to cooperate rather than defect. The skeptic predicts that rationality still requires defecting at the moment of choice, rendering the disposition irrational to adopt. The optimist predicts that rationality requires adopting the cooperating disposition because it maximizes utility, even if it requires acting against local interest later. If the skeptic were to accept that rationality can evaluate plans over time rather than just acts at a time, they would move significantly toward the optimist's view.

  Finally, we concluded that a significant portion of our disagreement was verbal, centering on the word intention itself. We found that the skeptic was using intention to mean a prediction of action grounded in current reasons, while the optimist was using it to mean a commitment to action grounded in prior planning. When the skeptic says you cannot intend to drink, they mean you cannot predict you will drink given the future incentives. When the optimist says you can intend to drink, they mean you can commit to drinking as part of a utility-maximizing plan. Once we pinned this down, we saw that the skeptic is right that you cannot predict you will drink without changing the incentives, but the optimist is right that you can commit to drinking if you view agency as extended over time. The sneaky work was being done by the phrase form the intention, which ambiguously refers to both a cognitive state of belief and a volitional state of commitment. We agree that if the puzzle is about whether a rational agent can predict they will do something irrational, the answer is no. If the puzzle is about whether a rational agent can bind themselves to do something locally costly for a global gain, the answer is yes. We hope this distinction helps the reading group move past the usual ten-comment thread, and we are happy to discuss the variants we drafted in person.

  Best,

  The Collaborators
