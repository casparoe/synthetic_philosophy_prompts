answer: |-
  ### 1. The Decision Tree

  Begin with the claim: "A sea battle will occur tomorrow." Assume current physics does not causally determine the outcome; the future is genuinely branching.

  **Question 1:** Is this claim *already* true or false right now, independent of our knowledge?
  *   **No:** Future contingents lack a truth-value today. Proceed to Question 2.
  *   **Yes:** Future contingents obey bivalence. Proceed to Question 3.

  **Question 2:** If it lacks a definite truth-value, what is its semantic status?
  *   **It is neither true nor false:** Reality is genuinely incomplete; the proposition waits for the event to acquire a value. This preserves openness by rejecting bivalence. (**Leaf: Aristotle**)
  *   **It is simply false:** Assertions of "will" imply necessity. Since the battle isn't necessary, the assertion is false. We can only truly say "It might happen." (**Leaf: Peirceanism**)
  *   **It is indeterminate:** The claim is true on some branching histories and false on others. It lacks a "super-truth" unless true on all branches. (**Leaf: Supervaluationism**)

  **Question 3:** If the claim is true now, does its truth guarantee the event *must* happen (necessity)?
  *   **Yes:** Truth entails necessity. If it is true now, nothing could prevent it. The future is fixed because truth is fixed. (**Leaf: Logical Fatalism**)
  *   **No:** Truth does not entail necessity. The event can be true now but still contingent. Proceed to Question 4.

  **Question 4:** Among the many possible branching futures, is there one privileged branch that is "the actual future"?
  *   **Yes:** One path is metaphysically special (the Thin Red Line), making the statement true simpliciter despite branching. (**Leaf: Thin Red Line**)
  *   **No:** Truth is relative to a possible history; there is no single actual future yet, only a context of assessment. (**Leaf: Ockhamism**)

  *(Note: A path where the claim is false now but necessary is logically possible but undefended, as it implies impossible events are necessary.)*

  ### 2. Mapping Section

  1.  **Logical Fatalism:** Truth implies necessity. *Cost:* Eliminates free will and contingency entirely; the future is as fixed as the past.
  2.  **Aristotle (Traditional):** Bivalence fails for contingents. *Cost:* Requires non-classical logic where the Law of Excluded Middle fails for future statements.
  3.  **Peirceanism:** "Will" claims are false if contingent. *Cost:* Makes most ordinary future talk strictly false, conflicting with linguistic intuition.
  4.  **Supervaluationism:** Truth is truth-on-all-branches. *Cost:* Validates "Battle or no battle" while validating neither disjunct individually.
  5.  **Thin Red Line:** One actual future among possibilities. *Cost:* Hard to explain what makes that line "actual" without collapsing into fatalism.
  6.  **Ockhamism:** Truth is history-relative. *Cost:* Truth becomes relative to a context of assessment, not absolute simpliciter.

  **Dead Ends:** The position "False now + Necessary" is incoherent (implies impossible events are necessary). "True now + No Truthmaker" is often flagged as unmotivated metaphysics.

  ### 3. Separability Audit

  The tree struggles to cleanly separate **Ockhamism** and **Thin Red Line**. Both accept bivalence and deny necessity. The split relies on whether students feel one future is "privileged." Many Ockhamists accept a TRL as pragmatic, making this a semantic rather than metaphysical divide. Similarly, **Aristotle** and **Supervaluationism** both reject simple bivalence. Distinguishing them requires understanding whether "indeterminate" is a third value (Aristotle) or a lack of super-truth (Supervaluation). Students may conflate these as simply "no truth value." Finally, **Peirceanism** and **Fatalism** both link truth to necessity, but diverge on whether contingents are true. If a student believes "True implies Necessary" but also "Contingents are True," they are forced into Fatalism, but might not realize that commitment until reaching Leaf D.

  ### 4. "What Would Change My Mind" Note

  I am least confident in the **Necessity of Truth** branch (Question 3). Some students might accept truth now but deny necessity without realizing the metaphysical burden (Ockhamism). If an argument shows that "truth now" *just is* a kind of necessity (temporal necessity), the tree collapses Fatalism and Ockhamism. I would restructure to prioritize the nature of truthmakers over modal intuitions. If truth requires existing facts, and future facts don't exist, Ockhamism fails. This ontological question might be more fundamental than the modal one.
