      *   **Analyze Premise (6) (MinxEnt Status):** This is the easiest place to cut the knot. MinxEnt is designed for *linear* constraints. JBP is a *ratio* constraint. Applying MinxEnt here assumes we are minimizing information gain *across the whole space* including the partition $R/B$. But if the evidence is *only* about the ratio within $R$, why penalize changes in $R$ vs $B$?
