      *   **KK Principle:** $Kp \rightarrow KKp$ (If you know $p$, you know that you know $p$).
      *   **The Anti-Luminosity Argument (Williamson):** A sorites-style argument. If a state were luminous, small changes in the state wouldn't change your knowledge of it. But mental states change gradually. If you know you're in the state at step $n$, and step $n+1$ is indistinguishable, you should know you're in it at $n+1$. Repeat until the state vanishes, but you still claim to know it's there. Contradiction. Therefore, no non-trivial mental state is luminous.

  3.  **Translate to Cognitive Science/SDT Vocabulary:**
