      *   *Luminosity* $\rightarrow$ Perfect Meta-Detection. If Signal $S$ is present, Response $R$ ("I detect $S$") is guaranteed with probability 1.
      *   *KK Principle* $\rightarrow$ Recursive Calibration. If the system flags "Signal Detected," it must also flag "Confidence: High" regarding that flag.
