      *   *Hypotheses:* $H_{short}$ (small total $N$) vs. $H_{long}$ (large total $N$).
      *   *Likelihood:* $P(n | H_{short}) > P(n | H_{long})$ because if $N$ is huge, being among the first few billion is unlikely (Copernican principle applied to observers).
      *   *Conclusion:* Posterior probability of $H_{short}$ increases.
      *   *Key Assumption:* Self-Sampling Assumption (SSA): "One should reason as if one were a random sample from the set of all observers in one's reference class."

