  The rain beat steadily against the high windows of the faculty lounge, providing a rhythmic backdrop to the disagreement that had settled between Elias and Mara over their cooling coffee. Elias leaned back in his chair, gesturing with a slow, deliberate hand as he articulated the position he had held for decades. He argued that the moral equality of combatants was not merely a legal convention but a necessary ethical firewall. He maintained that once a soldier puts on a uniform, they enter a distinct moral sphere where the justice of the war itself is separate from the justice of their actions within it. For Elias, a soldier fighting for an unjust cause is not a murderer if they adhere to the rules of engagement, target only combatants, and avoid unnecessary suffering. He insisted that soldiers are instruments of the state, often lacking the agency or information to judge the grand strategy of their leaders, and thus their moral liability is limited to their conduct in the field. To judge them otherwise, he suggested, was to demand a level of individual political scrutiny that is impossible in the fog of war and dangerous for the structure of international order.

  Mara stirred her coffee, listening intently before setting the spoon down with a sharp clink. She countered that this separation was a philosophical fiction that collapsed under the weight of individual responsibility. She argued that the right to kill in war is not derived from wearing a uniform but from the justification of the cause itself. If a war is unjust, then the acts of violence committed in its service lack the necessary moral foundation to excuse what would otherwise be murder. Mara posited that a soldier fighting for an aggressor nation wrongs the defensive soldiers they kill, because those defensive soldiers are not liable to be attacked in the first place. She emphasized that killing requires a sufficient reason, and contributing to an unjust aim cannot provide that reason, regardless of whether the killer follows the rules of proportionality and discrimination in the moment. For Mara, the traditional view effectively licenses killing in the service of unjust ends by providing a moral shield to those who should bear the burden of their violence.

  Elias nodded slowly, acknowledging the force of her moral intuition but pivoting to the practical consequences of her view. He pressed her on what he saw as the most dangerous implication of revisionism: the erosion of restraint. He asked her directly how the laws of war could function if soldiers on the unjust side were told they were already moral transgressors. If an aggressor soldier believes that every shot they fire is inherently wrongful, regardless of their conduct, Elias argued they have no incentive to follow the rules of jus in bello. Why should they distinguish between a combatant and a civilian if both acts are equally tainted by the unjustness of the cause? He suggested that the traditional doctrine, by granting moral equality, gives unjust combatants a reason to restrain themselves. It offers them a path to honor and moral cleanliness even within a dirty war. To remove that incentive, he warned, would be to unleash a more brutal form of warfare where the only remaining logic is total victory, because the moral cost of restraint has been removed.

  Mara met his gaze without flinching, having anticipated this objection. She conceded that the practical risk was real but argued that we cannot base moral truth on useful fictions. She explained that acknowledging the asymmetry of combatants does not necessarily mean abandoning the incentives for restraint. She proposed a distinction between objective wrongness and subjective blame. A soldier might be objectively wronging an enemy combatant by fighting for an unjust cause, yet they might be subjectively excused due to coercion, ignorance, or patriotic duty. Mara argued that we can tell soldiers that while their cause may be unjust, they still have a duty to minimize harm. She suggested that the restraint comes not from the hope of moral equality, but from the independent moral requirement to do less wrong rather than more. Even if one is engaged in a wrongful project, she reasoned, one is still morally obligated to limit the damage. To tell them otherwise, she claimed, is to treat soldiers as incapable of nuanced moral reasoning, whereas the truth might actually empower them to resist the worst excesses of their commanders by recognizing their own agency.

  Elias leaned forward, resting his elbows on the table, and challenged her confidence in that nuanced reasoning under fire. He returned to the charge that his view licenses killing, admitting that it does provide a form of immunity, but he framed it as a tragic necessity rather than a license. He argued that in the chaos of war, the alternative to moral equality is not a more ethical army but a more cynical one. He pointed out that if soldiers believe they are murderers, they may become desperate or nihilistic, discarding rules they see as hypocritical. However, he acknowledged her point about the moral cost. He admitted that the traditional view does feel like it lets individuals off the hook too easily, potentially allowing them to participate in atrocities provided they do not directly target civilians. He suggested that the solution lies not in abandoning the equality of combatants but in strengthening the accountability of leaders who initiate unjust wars. He proposed that the moral burden should rest heavily on the political architects, leaving the soldiers with the protective convention of equality to ensure that some rules remain intact when the world falls apart.

  Mara sighed, looking out at the rain-streaked window before turning back to him. She agreed that leaders must bear the primary burden but insisted that shifting all responsibility upward absolves the trigger-pullers of their humanity. She argued that treating soldiers as mere instruments denies their capacity for moral judgment, which is precisely what makes them human. She worried that if society accepts the traditional view, it becomes too easy to launch unjust wars because the populace believes their soldiers will remain morally clean regardless of the cause. She reiterated that while she understands the fear of eroding restraint, the greater danger lies in normalizing the idea that one can kill legitimately for any reason as long as the method is clean. She suggested a middle ground where the legal framework might retain the equality of combatants for pragmatic reasons, while the moral philosophy clearly states that fighting for an unjust cause is a wrongful act. This way, the law maintains order, but the moral conscience of the soldier is not dulled by the promise of symmetry.

  Elias considered this, tapping his fingers on the table. He noted that such a dichotomy between legal permission and moral wrongness could create a dangerous cognitive dissonance for soldiers in the field. He worried that if soldiers are taught they are legally protected but morally guilty, it could lead to psychological fragmentation or a disregard for the law they perceive as unjust. He maintained that the moral law and the legal convention must align closely enough to be actionable. However, he conceded that her revisionist view forces a necessary discomfort upon the traditionalist position. It reminds us that the rules of war are not a game with symmetrical players but a tragic arena where justice is often unevenly distributed. He admitted that while he fears the practical fallout of abandoning moral equality, he cannot fully dismiss the moral intuition that killing for an unjust cause is fundamentally different than killing in self-defense.

  Mara nodded, acknowledging the weight of his pragmatic concerns. She reiterated that her goal was not to punish soldiers but to accurately describe the moral landscape. She argued that by hiding the asymmetry, we deceive ourselves about the true cost of unjust wars. She suggested that if soldiers understood that their liability depends on the justice of their cause, they might be more cautious about supporting aggressive conflicts in the first place. She addressed his worry about brutality one last time, stating that a restraint based on truth is more durable than a restraint based on convention. If soldiers follow the rules because they understand that minimizing harm is always required, even in a wrongful war, then the restraint is rooted in genuine morality rather than a reciprocal bargain. She concluded that while the traditional view offers a comforting symmetry, it is a symmetry that masks the fundamental injustice of aggression, and that masking it ultimately serves the interests of those who start wars rather than those who fight them.

  Elias sat back, the tension between them unresolved but mutually understood. He recognized that her view demanded more of the individual soldier, while his view demanded more of the state to ensure justice before sending men and women to kill. He acknowledged that while he stood by the traditional doctrine as a safeguard against total war, he could not deny that her revisionist critique exposed a moral hollow at its center. They sat in silence for a moment, the rain continuing to fall, both aware that the debate was not merely academic but touched upon the life and death of countless individuals who would never hear these arguments yet would live or die by their consequences. The conversation ended not with a resolution, but with a shared recognition of the terrible weight of the question, leaving the ethics of war as a standing problem that neither comfort nor truth could fully solve on its own.
