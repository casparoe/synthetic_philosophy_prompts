answer: |-
  This is a classic philosophical puzzle, and your intuition is hitting on distinctions that philosophers of social ontology (like Ian Hacking, Sally Haslanger, and John Searle) have spent decades trying to formalize.

  Your current principle breaks because of the phrase **"rather than."** It assumes a binary: either a category is fixed by nature *or* it is fixed by us. But most of your examples are hybrids: they have mind-independent properties *and* human-drawn boundaries. Your principle forces you to call anything with a mind-independent core "not constructed," which makes "Planet" and "ADHD" slide into the "Natural" bucket, contradicting your gut.

  To save your verdicts, you need to stop asking "Is this constructed?" as a yes/no question and start asking two separate questions. I propose a **Two-Axis Framework**.

  ### The Repaired Framework

  **Axis 1: Ontological Dependence (Does the thing need us to exist?)**
  *   **High Dependence:** If humans vanished, the entity would cease to exist or lose its defining function. (e.g., Money, Marriage, Prime Ministers).
  *   **Low Dependence:** If humans vanished, the entity would still be there doing its thing. (e.g., Gold atoms, Gametes, Rocks, Neurological pathways).

  **Axis 2: Categorical Salience (Why do we group these things together?)**
  *   **Discovery (Natural Joints):** We group them because they cluster together in nature due to causal mechanisms, even if the boundaries are fuzzy. We are trying to match our map to the territory. (e.g., Species, Sex, Gold).
  *   **Stipulation/Imposition (Human Interests):** We group them because it serves a human purpose, legal need, or social value, often drawing lines through continuous natural variation. (e.g., Planets, Race, Weeds, ADHD thresholds).

  **The "Looping Effect" (The "Real Consequences" Modifier)**
  *   **Interactive Kinds:** Classifying the thing changes the thing itself (e.g., labeling a person "ADHD" changes their behavior/self-concept; labeling a group "Race" subjects them to policing which alters their life outcomes).
  *   **Indifferent Kinds:** Classifying the thing does not change the thing (e.g., calling a rock a "Planet" doesn't change its orbit; calling an atom "Gold" doesn't change its atomic number).

  ---

  ### Testing Your Verdicts

  Here is how this framework sorts your list while preserving your intuitions.

  | Category | Ontological Dependence | Categorical Salience | Looping Effect | Your Verdict | Framework Result |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Money** | **High** (Value vanishes without us) | **Stipulation** (We agree it's value) | **Interactive** (Inflation/Crashes) | Constructed | **Constructed** |
  | **Race** | **Low** (People exist without us) | **Imposition** (Drawn over clinal variation) | **Interactive** (Structural racism alters outcomes) | Constructed | **Constructed** |
  | **Sex** | **Low** (Gametes exist without us) | **Discovery** (Clusters based on function) | **Indifferent** (Label doesn't change gametes) | Not Constructed | **Natural Kind** |
  | **Gender** | **Low** (People exist) | **Stipulation** (Roles/Identities) | **Interactive** (Identity shapes behavior) | Constructed | **Constructed** |
  | **Species** | **Low** (Lineages exist) | **Discovery** (Reproductive isolation) | **Indifferent** (Wolves don't care if we name them) | Not Constructed | **Natural Kind** |
  | **Gold** | **Low** (Atoms exist) | **Discovery** (Atomic number) | **Indifferent** | Not Constructed | **Natural Kind** |
  | **Planets** | **Low** (Rocks exist) | **Stipulation** (IAU vote/Orbit clearing) | **Indifferent** (Rock doesn't care) | Constructed | **Constructed Category** |
  | **ADHD** | **Low** (Neurology exists) | **Mixed** (Real traits + Social threshold) | **Interactive** (Diagnosis changes treatment/self) | Constructed-ish | **Interactive Kind** |
  | **Weeds** | **Low** (Plants exist) | **Imposition** (Defined by human desire) | **Indifferent** | Constructed | **Constructed Category** |
  | **Disability**| **Low** (Impairment exists) | **Imposition** (Defined by environment) | **Interactive** (Accommodation changes function) | Constructed | **Constructed Category** |

  ### Where Your Principle Broke (and how this fixes it)

  **1. The Planet Problem**
  *   **Your Principle:** Said "Merely Conventional" because the rock is real.
  *   **The Fix:** Under Axis 2, "Planet" is **Stipulation**. We voted on the definition to serve a taxonomic interest. Nature didn't give us a "Planet" joint; we drew a line around "orbit clearing" for convenience. This validates your gut that it is constructed, even though the object is real.
  *   **Why Species is different:** Species boundaries are fuzzy, but the *mechanism* (reproductive isolation) is a causal force in nature, not a rule voted on by a committee. We *discover* species; we *stipulate* planets.

  **2. The Sex vs. Race Distinction**
  *   **Your Principle:** Struggled to separate them because both have "fuzzy lines."
  *   **The Fix:** Axis 2 distinguishes **Discovery** vs. **Imposition**.
      *   **Sex:** We group male/female because there is a biological *function* (gamete size) that clusters reliably. The binary is a hypothesis about nature.
      *   **Race:** We group Black/White because of *social history*, not biological clustering. Genetic variation is clinal (gradual); the "line" is imposed over the gradient.
      *   **Result:** Sex is a Natural Kind (with fuzzy edges); Race is a Social Kind (with real consequences).

  **3. The "Real Consequences" of Race vs. Money**
  *   You noted Race feels "more real" in its consequences than Money.
  *   **The Fix:** This is the **Looping Effect**.
      *   **Money:** Its power is institutional. If we stop believing, the power vanishes instantly.
      *   **Race:** Its power is *sedimented*. Even if we stopped believing in race tomorrow, the historical accumulation of wealth, housing segregation, and environmental stressors would persist for generations. The classification has physically altered the world (via policy) in a way that outlasts the belief.
      *   **ADHD:** Also has a looping effect. Diagnosing a child changes how teachers treat them, which changes how the brain develops. A "Jumbo Shrimp" label does not change the shrimp.

  ### The New Case: ADHD vs. "Jumbo Shrimp"

  You asked how far the label stretches. Here is the distinction using the framework:

  **Case A: "Jumbo Shrimp" (Menu Category)**
  *   **Ontological Dependence:** Low (Shrimp exist without menus).
  *   **Categorical Salience:** **Arbitrary Stipulation.** There is no biological "jumbo" joint. It is purely for pricing and customer expectation.
  *   **Looping Effect:** **None.** Calling a shrimp "jumbo" does not change its growth or biology.
  *   **Verdict:** **Purely Conventional Category.** It is constructed, but trivially so. It doesn't "carve" anything real.

  **Case B: ADHD (Psychiatric Diagnosis)**
  *   **Ontological Dependence:** Low (Attentional variance exists without DSM).
  *   **Categorical Salience:** **Mixed.** There is a real neurological mechanism (dopamine regulation, executive function), *but* the threshold for "disorder" is determined by social tolerance for distraction (e.g., a classroom setting vs. a hunter-gatherer setting).
  *   **Looping Effect:** **High.** Being diagnosed changes access to medication, self-perception, and legal accommodations, which alters the trajectory of the condition.
  *   **Verdict:** **Interactive Social Kind.** It is constructed *and* real.

  **The Difference:** "Jumbo Shrimp" is a **file folder** we put things in for convenience. ADHD is a **lever** that, when pulled, changes the thing being categorized.

  ### The Repaired Principle

  To replace your original principle, use this:

  > **A category is socially constructed if its boundaries are determined by human interests, stipulations, or practices (Categorical Salience) rather than solely by mind-independent causal clustering.**
  >
  > *   **Strong Construction:** The entity *also* depends on human agreement for its existence (Money, Borders).
  > *   **Weak Construction:** The entity exists independently, but the *grouping* serves human interests over natural joints (Race, Planets, Weeds).
  > *   **Interactive Construction:** The act of categorizing causally alters the entities themselves (ADHD, Gender, Race).

  **What you have to give up:**
  You have to give up the idea that "Constructed" means "Not Real." As your Race and ADHD examples show, constructed things can be causally potent. You also have to accept that "Natural Kinds" (Sex, Species) can have fuzzy boundaries without becoming constructed. Fuzziness is a property of nature; drawing a hard line through that fuzziness for social utility is the construction.

  This saves your verdict on Sex (Natural clustering, fuzzy edges) vs. Planets (Real objects, stipulated definition) vs. Race (Social imposition, real consequences).
