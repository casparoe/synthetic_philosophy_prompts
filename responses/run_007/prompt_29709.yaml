answer: |-
  Your frustration after the seminar is well-placed, because it is all too easy to get lost in the mechanics of the aggregation theorem without first clarifying what you are actually asking the theory to do. If you do not write down the desiderata, you will find yourself accepting conclusions simply because the math forces them, rather than because they match your normative intuitions. So let us lay out the demands clearly, not as a checklist, but as a connected argument about what a theory of social choice under risk owes us.

  The first demand is the Pareto principle, and I would argue this is the only truly non-negotiable requirement in the bunch. If every individual in society prefers lottery A to lottery B, then the social ranking must reflect that preference. The case for this is straightforward: if you override a unanimous preference, you are asserting that the society knows better than the individuals themselves what is good for them, which undermines the very idea of welfare-based social choice. Imagine a situation where two people are choosing between a safe policy and a risky one, and both strictly prefer the safe policy based on their own risk aversion. If the social chooser selects the risky policy anyway, it is hard to see how this counts as respecting individual welfare. However, we must be careful about which version of Pareto we mean. There is a distinction between ex ante Pareto, which respects preferences over lotteries before the risk is resolved, and ex post Pareto, which respects preferences over final outcomes. Most theorists agree that some form of Pareto is essential, but the tension arises when we try to combine ex ante Pareto with other demands.

  The second demand is that the theory must take the cardinal structure of vNM utilities seriously. Since we are dealing with choice under risk, individual preferences are not merely ordinal rankings of outcomes; they contain information about intensity and risk attitude. A theory that ignores this and treats utilities as ordinal would be discarding the very data that distinguishes decision-making under risk from decision-making under certainty. For example, if one person is risk-neutral and another is highly risk-averse, a social theory that only looks at ordinal rankings cannot distinguish between a situation where the risk-averse person is terrified of a loss and one where they are indifferent. This demand is also non-negotiable if we are to stay within the vNM framework, because without cardinality, we cannot aggregate preferences over lotteries in a meaningful way. The utility functions are unique only up to positive affine transformations, meaning we can shift and scale them, but we cannot ignore the curvature that represents risk attitudes.

  The third demand concerns the source of interpersonal weights. You mentioned the worry about smuggling them in, and this is crucial. Harsanyi's theorem tells us that the social welfare function must be a linear combination of individual utilities, but it leaves the weights arbitrary. An adequate account needs to explain where these weights come from rather than treating them as free parameters. If the weights are just fixed constants, the theory is incomplete; if they are derived from a veil of ignorance, the theory relies on a specific moral assumption about impartiality. The demand here is transparency: the theory should not hide the moral judgment involved in weighting one person's utility against another's. This is often where camp tastes diverge. A strict welfarist might say the weights are equal by default, while a prioritarian might say weights should vary based on absolute levels of welfare. This is not a logical requirement but a normative one, and it is where much of the political philosophy enters the formal model.

  The fourth demand is where the real friction begins, involving the distinction between ex ante and ex post fairness. You need to decide whether the social ranking should respect the fairness of the procedure before the risk is resolved or the fairness of the outcome after the risk is resolved. Consider a case where a single indivisible good, like a life-saving drug, must be allocated between two people who are equally sick. An ex ante fair approach might suggest flipping a coin to give each person a fifty percent chance of survival. An ex post fair approach might look at the outcome and see that one person lives and the other dies, which feels unequal, but there is no way to equalize the outcome without killing the survivor. However, imagine a variation where society can choose between a lottery that gives each person a fifty percent chance of a high welfare state and a sure thing that gives both people a medium welfare state. If the individuals are risk-neutral, they might be indifferent, but an ex post egalitarian might prefer the sure medium state to avoid the inequality of the lottery outcome. Respecting ex ante preferences pushes you toward utilitarianism, while respecting ex post fairness pushes you toward egalitarianism or prioritarianism. This is largely a matter of normative taste, but you cannot have both fully.

  The fifth demand is whether the social ranking itself must satisfy the vNM axioms, specifically Independence. This is the most critical technical requirement because it is the one that does the heavy lifting in Harsanyi's theorem. If you demand that society acts like a rational vNM agent, meaning its preferences over lotteries satisfy Independence and Continuity, you are effectively forcing the social welfare function to be linear. The case for this is consistency: if society prefers state A to state B, it should not change its mind just because both are embedded in a larger lottery with some probability of a catastrophic state C. However, this is exactly where the impossibility result you recalled comes into play. You cannot simultaneously satisfy ex ante respect for individual risk attitudes, ex post fairness, and the requirement that the social ranking satisfies the vNM Independence axiom.

  Here is the impossibility laid out cleanly. If you require the social ordering to satisfy Independence, and you require ex ante Pareto (respecting individual preferences over lotteries), then Harsanyi's theorem proves you must be a utilitarian. You must maximize the sum of weighted utilities. This leaves no room for ex post fairness concerns that would override the sum. For instance, if the utilitarian sum is higher in a lottery that creates extreme inequality, and everyone ex ante agrees to the lottery, the social chooser must pick the lottery. If you want to avoid this conclusion—if you want to say that society should sometimes reject a lottery even if everyone ex ante prefers it, because the outcome is too unfair—then you must violate the Social Independence axiom. You have to admit that society cares about the distribution of outcomes in a way that individual vNM agents do not. This means society is not a vNM rational agent. This is the single requirement that knocks out the most candidate theories. If you hold firm on Social Independence, you are a utilitarian. If you drop it, you open the door to prioritarianism, egalitarianism, and other non-utilitarian views.

  So to answer your question about what is non-negotiable versus what is camp taste: Pareto and Cardinality are the non-negotiable foundations if you want to respect individual welfare and risk. The source of weights is a normative gap you must fill explicitly. But the dealbreaker is the Social vNM axioms. The part of your list that cannot be jointly satisfied is the triad of ex ante Pareto, ex post equity, and Social Independence. You have to choose which one to sacrifice. Most non-utilitarians sacrifice Social Independence. They argue that while individuals should satisfy vNM axioms for their own choices, the social chooser has a different role and can legitimately care about the correlation of outcomes across people in a way that violates Independence.

  This leaves room for a non-utilitarian view, but it comes at a cost. If you drop Social Independence, you lose the clean representation theorem. You can no longer say society is maximizing expected utility. You have to adopt a more complex functional form, like a prioritarian function that transforms utilities before summing them, or an egalitarian function that penalizes inequality. But you can still keep Pareto, provided you interpret it carefully, perhaps as ex post Pareto rather than ex ante. The Harsanyi theorem still leaves room for non-utilitarianism precisely because the requirement that society obey the Independence axiom is not a logical truth but a modeling choice. If you are willing to say that social preferences over risk are fundamentally different from individual preferences over risk, you can escape the utilitarian conclusion while still respecting the cardinal information in individual utilities.

  In the end, the demand that does the most work is the requirement that the social ranking satisfy the vNM axioms. It is the linchpin. If you accept it, you get utilitarianism. If you reject it, you get almost everything else. So before you read another paper on the aggregation theorem, ask yourself whether you believe society should be modeled as a single rational agent facing risk. If you do, you must accept the utilitarian result. If you do not, then the theorem does not apply to you, and you are free to build a theory that prioritizes ex post fairness over ex ante consistency. That is the choice the math is forcing you to make, and it is better to make it consciously than to let it hide inside the axioms.
