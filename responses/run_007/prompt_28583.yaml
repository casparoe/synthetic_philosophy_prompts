answer: |-
  You have put your finger on the central pivot point of modern philosophy of perception. The move you are describing is widely recognized, and while there isn't a single Latin name for the inference itself (like *modus ponens*), it is standardly referred to in the literature by the name of the commitment it secures: **The Common Kind Assumption (CKA)**.

  When philosophers analyze the *structure* of this move—specifically the idea that veridical and hallucinatory cases must share a maximal overlapping mental component—it is often called **The Highest Common Factor (HCF) Model** or **HCF Conception** of experience.

  Here is the anatomy of the move, the specific terminology used to track it, and the distinction between the versions you suspected.

  ### 1. The Primary Labels

  **The Common Kind Assumption (CKA)**
  This is the most common contemporary term (championed by disjunctivists like M.G.F. Martin and Bill Brewer to describe their opponents). The CKA states that there is a fundamental kind of mental event or state that is present in both the veridical case and the hallucinatory case.
  *   **The Move:** The argument *for* the CKA is typically **The Argument from Hallucination** (or The Argument from Illusion).
  *   **The Specific Step:** The inference from "subjectively indistinguishable" to "same metaphysical kind" is often described by critics as **The Epistemic-Metaphysical Slide**.

  **The Highest Common Factor (HCF) Model**
  Coined/popularized by John McDowell and M.G.F. Martin, this label describes the *result* of the move. It suggests that the veridical experience is analyzed as:
  $$ \text{Veridical Experience} = \text{Common Mental Factor} + \text{External Object} $$
  $$ \text{Hallucination} = \text{Common Mental Factor} + \text{No External Object} $$
  The "move" you are identifying is the reasoning that forces experience into this HCF structure based on indistinguishability.

  ### 2. Anatomy of the Move

  You are correct that the move relies on conflating an epistemic property (indistinguishability) with a metaphysical property (identity of kind). In the literature, this specific step is often broken down into two premises, one of which does the heavy lifting:

  1.  **The Indistinguishability Claim:** A perfect hallucination is subjectively indistinguishable from a veridical perception. (Epistemic)
  2.  **The Phenomenal Principle (The Bridge):** If it sensibly appears to a subject that something is the case, there is *something* of which the subject is aware that actually is the case. (Metaphysical)
  3.  **Conclusion:** Therefore, in both cases, the subject is aware of the same kind of immediate object/state (e.g., sense-data or a representational content).

  M.G.F. Martin explicitly names **The Phenomenal Principle** as the engine that drives the Common Kind Assumption. Without this principle, indistinguishability remains merely epistemic. With it, indistinguishability forces a common ontological constituent.

  ### 3. The Two Versions You Suspected

  You asked if there are different versions (direct inference vs. inference to the best explanation). The literature distinguishes these clearly, though they both end up at the CKA.

  #### Version A: The Classical / Phenomenal Principle Route
  *   **Proponents:** A.J. Ayer, H.H. Price, early Bertrand Russell.
  *   **The Logic:** This treats the move as a **direct conceptual inference**. It relies on the idea that "appearance" cannot be bare; if it appears to me that there is a dagger, there must be a "dagger-like" entity in my mind. Since the hallucination *must* contain this entity (as there is no real dagger), and the veridical case *feels the same*, the veridical case must *also* contain this entity.
  *   **Label:** This is often called the **Sense-Data Argument**. The move is treated as analytic or a priori.
  *   **Weakness:** It relies heavily on the Phenomenal Principle, which many find question-begging.

  #### Version B: The Causal / Scientific Route (Inference to the Best Explanation)
  *   **Proponents:** Hilary Putnam (Brain in a Vat), contemporary Representationalists (e.g., Alex Byrne, Michael Tye), many cognitive scientists.
  *   **The Logic:** This treats the move as an **Inference to the Best Explanation (IBE)**.
      *   *Premise:* We can induce hallucinations by stimulating the brain in the same way that normal perception stimulates it.
      *   *Premise:* The proximate cause of experience is the brain state.
      *   *Inference:* Since the proximate cause (brain state) can be identical in both cases, the mental effect (experience) must be of the same fundamental kind. The external object is causally distal and therefore not constitutive of the mental state itself.
  *   **Label:** This is often called the **Causal Argument** for Representationalism or the **Common Factor View**.
  *   **Difference:** Unlike Version A, this doesn't claim indistinguishability *logically entails* identity. It claims identity is the best scientific explanation for the indistinguishability.

  ### 4. Why Disjunctivists Hate This Move

  To confirm you have the right target: Disjunctivism (McDowell, Martin, Brewer) is defined entirely by the rejection of this move. They argue:
  *   **Epistemic vs. Metaphysical:** Indistinguishability is a fact about the *subject's knowledge*, not the *nature of the experience*.
  *   **The Disjunction:** They propose a disjunctive analysis:
      *   Case 1: I see a dagger (a relational state involving the world).
      *   Case 2: It merely seems as if I see a dagger (a different, defective kind of state).
  *   **Rejection of HCF:** They deny there is a "Highest Common Factor." The only thing the two cases have in common is that they are indistinguishable *to the subject*, not that they share a mental constituent.

  ### Summary of Terminology for Your Search

  If you are searching for papers or want to use the precise jargon:

  1.  **The Common Kind Assumption (CKA):** The claim that veridical and hallucinatory experiences share a fundamental mental nature.
  2.  **The Highest Common Factor (HCF) Model:** The structural view of the mind that results from accepting the CKA.
  3.  **The Argument from Hallucination:** The broader argument that utilizes the move you described.
  4.  **The Phenomenal Principle:** The specific premise (identified by M.G.F. Martin) that bridges the gap between "appears" and "is aware of."
  5.  **Epistemic/Metaphysical Equivocation:** The name critics give to the flaw in the move.

  **Recommendation:** The most precise discussion of the "anatomy" of this move is found in **M.G.F. Martin's "The Transparency of Experience" (1997)** and **"Perceptual Consciousness as Contact with the World" (unpublished but widely circulated MS)**. He explicitly dissects the inference from indistinguishability to the Common Kind Assumption and labels the resulting framework the **Highest Common Factor conception**.
