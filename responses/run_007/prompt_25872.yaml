answer: |-
  The Problem of Old Evidence (POE), famously articulated by Clark Glymour in 1980, is widely regarded as one of the most significant challenges to Bayesian Confirmation Theory (BCT). The problem arises from the observation that scientific theories are often confirmed by evidence that was already known prior to the theory's formulation. The classic example is Einstein's General Theory of Relativity (GR), which was strongly confirmed by the anomalous perihelion of Mercury—a fact known to astronomers for decades before 1915.

  Standard Bayesianism appears unable to account for this. In the Bayesian framework, confirmation is measured by the increase in the probability of a theory $T$ given evidence $E$, denoted as $P(T|E) > P(T)$. However, if $E$ is "old evidence," the agent already knows $E$ is true, meaning their prior probability $P(E) = 1$. By the axioms of probability, if $P(E) = 1$, then $P(T|E) = P(T)$. The math suggests that old evidence provides zero confirmation.

  I argue that the POE is not a genuine difficulty for Bayesian confirmation theory but rather exposes a mistake in how Bayesians typically formalize the relation between evidence and theory. The problem dissolves once we distinguish between *learning that a piece of evidence obtains* and *learning that a theory entails or explains that evidence*. The standard Bayesian machinery, properly understood, already possesses the resources to handle this; it merely requires that we identify the correct proposition upon which to conditionalize.

  ### The Formalization Error

  The root of the POE lies in a category error regarding the "input" of the Bayesian update. Standard presentations of the problem assume that the only relevant proposition for confirmation is the empirical fact $E$ itself (e.g., "Mercury's perihelion advances by 43 arcseconds per century"). Consequently, the update is modeled as conditionalizing on $E$. Since $E$ is already known, $P(E)=1$, and no updating occurs.

  This formalization mistakes the *content* of the evidence for the *news* provided by the scientific discovery. In cases of old evidence, the empirical fact $E$ is indeed static. However, the scientific community does not already possess the knowledge that the new theory $T$ successfully captures $E$. The "news" is not the existence of the phenomenon, but the structural relationship between the theory and the phenomenon.

  Therefore, the proposition that drives confirmation is not $E$, but rather a proposition describing the theoretical link, which we can denote as $L$: "Theory $T$ entails (or adequately explains) Evidence $E$." Before the theory is fully developed or the derivation is completed, a rational agent is not certain that $T$ will yield $E$. Thus, prior to the derivation, $P(L) < 1$. The confirmation event is the learning of $L$, not the learning of $E$.

  ### The Solution: Updating on Entailment

  Once we shift the focus from $E$ to $L$, the standard Bayesian machinery functions perfectly without modification. We apply Bayes' Theorem to the proposition $L$:

  $$P(T|L) = \frac{P(L|T)P(T)}{P(L)}$$

  Here, $P(T|L)$ is the posterior probability of the theory given the discovery that it entails the evidence. $P(T)$ is the prior probability of the theory. $P(L|T)$ is the likelihood that the theory entails the evidence given the theory is true. If $T$ is true, and $T$ is a deterministic theory regarding $E$, then it is a necessary feature of $T$ that it entails $E$. Thus, $P(L|T) = 1$.

  The equation simplifies to:

  $$P(T|L) = \frac{P(T)}{P(L)}$$

  Confirmation occurs if $P(T|L) > P(T)$, which holds true whenever $P(L) < 1$. This condition is easily met in historical contexts. Before Einstein completed the field equations of GR, it was not certain that his theoretical framework would successfully derive the specific value of Mercury's perihelion. There were many ways a new theory of gravity could fail to match the precise astronomical data. Therefore, the prior probability that "GR entails the Mercury anomaly" ($P(L)$) was significantly less than 1. When Einstein completed the derivation, $P(L)$ became 1. Because the denominator $P(L)$ was less than 1, the posterior probability $P(T|L)$ rises above the prior $P(T)$.

  This approach utilizes standard conditionalization. It does not require altering the axioms of probability or introducing complex "counterfactual" priors where we pretend we didn't know $E$ (a common but controversial solution to POE). It simply requires acknowledging that the algebra of propositions over which we distribute probability must include statements about theory-evidence relations, not just empirical states of the world.

  ### Historical Case: Einstein and the Perihelion of Mercury

  The case of General Relativity and the perihelion of Mercury serves as the definitive test for this argument. By 1915, the anomalous precession of Mercury's orbit (approximately 43 arcseconds per century unaccounted for by Newtonian physics) was a well-established fact ($E$). Astronomers assigned $P(E) = 1$.

  When Einstein proposed GR ($T$), the crucial moment of confirmation was not the observation of Mercury (which had already happened), but the calculation Einstein performed in November 1915. He discovered that the field equations of GR yielded the exact value of the anomaly without any ad hoc adjustments.

  Under the mistaken formalization, we ask: "What is $P(GR | \text{Mercury Anomaly})$?" Since the anomaly was known, Bayesianism supposedly says this adds no weight to GR.

  Under the corrected formalization, we ask: "What is $P(GR | \text{GR entails Mercury Anomaly})$?"
  Prior to November 1915, the scientific community was uncertain whether Einstein's abstract geometric approach would align with the specific numerical constraints of the solar system. Many competing theories of gravity existed, and most failed to recover the Newtonian limit or match the Mercury data. Thus, the proposition $L$ ("GR entails the Mercury Anomaly") had a low prior probability.

  When Einstein announced the successful derivation, scientists conditionalized on $L$. Because $L$ was highly unlikely to be true if GR were a false or inadequate theory (i.e., $P(L|\neg T)$ was low), the likelihood ratio favored $T$. The "old" evidence confirmed the "new" theory because the *entailment* was new information. The surprise was not that Mercury behaves as it does, but that Einstein's theory was the key that unlocked that behavior.

  ### Why Standard Machinery Suffices

  Critics might argue that logical entailment is a necessary truth, and therefore $P(T \models E)$ should always be 1, resurrecting the problem. This objection relies on the assumption of "logical omniscience"—the idea that Bayesian agents automatically know all logical consequences of their beliefs. However, standard Bayesianism does not require logical omniscience; it requires coherence among an agent's *actual* degrees of belief.

  Standard Bayesian machinery is designed to handle uncertainty about any proposition to which an agent assigns a probability less than 1. In the context of scientific discovery, the relation "$T \models E$" is treated as an empirical hypothesis about the theory's adequacy until the derivation is verified. Mathematicians and scientists make mistakes; derivations are complex. It is perfectly coherent within standard probability theory to assign $P(T \models E) = 0.5$ before checking the math and $P(T \models E) = 1$ after checking it.

  The "mistake" in the standard POE critique is assuming that the sample space of the Bayesian agent must be restricted to empirical world-states ($E$ occurs vs. $E$ does not occur). A proper formalization expands the sample space to include epistemic states regarding the theory's structure. Once we admit propositions about theoretical adequacy into the algebra, the standard rule of conditionalization handles the update naturally. We do not need to lower $P(E)$ artificially; we simply recognize that $E$ was never the updating factor to begin with.

  ### Conclusion

  The Problem of Old Evidence is a philosophical phantom created by a restrictive formalization of scientific inference. It assumes that confirmation must flow from the novelty of the *fact*, whereas history shows confirmation often flows from the novelty of the *explanation*. By distinguishing between learning that evidence obtains and learning that a theory entails that evidence, we see that the prior probability of the entailment relation is rarely 1. Consequently, the standard Bayesian update on the entailment relation yields a positive increase in the probability of the theory. The Einstein-Mercury case demonstrates that when we formalize the input correctly, Bayesian Confirmation Theory accounts for the confirmation of new theories by old evidence without requiring ad hoc adjustments or abandoning its core axioms. The machinery was sufficient all along; we simply needed to point it at the right target.
