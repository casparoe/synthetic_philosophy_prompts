  The slogan "vote on values, bet on beliefs" conflates structural design with epistemic capability. Here are five distinct readings:

  1.  **Claim:** The system structurally assigns utility definitions to voters and probability estimates to markets.
      **Verdict:** Definitional.
  2.  **Claim:** Voters are psychologically capable of isolating value judgments from factual beliefs completely.
      **Verdict:** False as stated.
  3.  **Claim:** Prediction markets will converge on accurate causal probabilities independent of voter knowledge.
      **Verdict:** Defensible but needs argument.
  4.  **Claim:** Market accuracy renders voter ignorance about policy consequences irrelevant to final welfare outcomes.
      **Verdict:** False as stated.
  5.  **Claim:** Voters ought to disregard factual evidence when determining their value preferences.
      **Verdict:** Normatively questionable.

  Your interlocutor relies on **Claim 4**. They argue that because markets handle facts, voter factual ignorance is neutralized. This reasoning is flawed. While markets may predict outcomes accurately (Claim 3), voters must still select which outcomes to maximize. If voters are ignorant about which metrics correlate with their values (e.g., choosing GDP over happiness due to false beliefs about their correlation), the system will efficiently optimize the wrong target. Markets solve the *prediction* problem, not the *specification* problem.

  Therefore, voter ignorance about facts remains a decisive objection because factual beliefs inevitably shape how values are operationalized into measurable metrics. The slogan holds only if voters know exactly which measurable outcomes constitute their values, which presupposes the very factual knowledge the interlocutor claims is unnecessary. Consequently, the move fails because value voting inherently requires factual assumptions about what constitutes a "good" metric, leaving the system vulnerable to voter ignorance regarding the means-ends chain.
