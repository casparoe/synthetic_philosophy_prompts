answer: |-
  ### Executive Summary: Correcting the "No-Trade" Misconception

  Before implementing the procedure, your team needs a quick correction on the theory driving their over-escalation.

  **The No-Trade Theorem (Aumann/Milgrom-Stokey)** assumes agents have **common priors** (they start with the same baseline probability) and are **risk-neutral**. It states that if two such agents share all public info, they cannot agree to a speculative trade just because one has private info, because the *fact of the trade* would reveal the info and align their prices.

  **Why this fails in surveillance:**
  1.  **Priors are not common:** A quant fund and a retail trader start with different models.
  2.  **Risk transfer exists:** Hedgers trade to reduce risk, not just for alpha. Market Makers (MMs) trade to manage inventory, not just for direction.
  3.  **Liquidity costs:** Traders pay spreads to enter/exit positions for reasons unrelated to information (cash flow needs, portfolio rebalancing).

  **The Reality:** In a prediction market, *disagreement is the product.* You are not looking for trades based on *different information*; you are looking for trades based on *non-public information (NPI)* that cannot be justified by risk management or public analysis.

  ---

  ### The 15-Minute Triage Protocol

  **Analyst Requirement:** Access to trade logs, user KYC/access tier, news feed timestamp, and historical user behavior.
  **Goal:** Filter 30 daily flags down to ~3 true escalations.

  #### Step 1: The News Correlation Check (Time & Event)
  *Question:* Is there a verifiable public news event related to the market outcome, and did the trade occur within the **Insider Window**?
  *   **Definition:** Insider Window = 24 hours before event for M&A/Earnings; 1 hour for macro data (Fed/NFP).
  *   **Sufficient Answer (NO):** No relevant news event within the window.
      *   **Action:** **DON'T ESCALATE.** (Close ticket).
  *   **Sufficient Answer (YES):** Trade occurred inside the Insider Window before a material event.
      *   **Action:** Proceed to Step 2.

  #### Step 2: The Participant Profile Check (Who)
  *Question:* Is the trader an **Approved Market Maker** or a **Known Hedger**?
  *   **Data:** Check user tag against MM agreement or known corporate hedger list.
  *   **Sufficient Answer (YES):** Trader is an MM or Known Hedger.
      *   **Action:** Proceed to Step 3 (MMs get more leeway, but not unlimited).
  *   **Sufficient Answer (NO):** Trader is Retail/Proprietary Speculator.
      *   **Action:** Proceed to Step 3 (Higher scrutiny).

  #### Step 3: The Size & Deviation Check (Anomaly)
  *Question:* Is the trade size **>3x** the user's 30-day average notional volume OR does it exceed **5%** of the market's daily volume?
  *   **Sufficient Answer (NO):** Size is consistent with history or market depth.
      *   **Action:** **DON'T ESCALATE.** (Likely standard positioning).
  *   **Sufficient Answer (YES):** Size is a significant outlier.
      *   **Action:** Proceed to Step 4.

  #### Step 4: The Information Plausibility Check (The "Why")
  *Question:* Can the trade thesis be constructed from **publicly available data** released *before* the Insider Window?
  *   **Test:** Ask the trader (via standard query) or review their public commentary. Are they citing technicals, public polls, economic models, or inventory needs? Or is the rationale vague ("just a feeling," "trust me")?
  *   **Sufficient Answer (PUBLIC):** Rationale cites specific public data points (e.g., "NFP model based on ADP data released 2 days ago").
      *   **Action:** **DON'T ESCALATE.** (Disagreement on public info is legal).
  *   **Sufficient Answer (VAGUE/NPI):** Rationale is missing, vague, or implies access to non-public channels (e.g., "sources say," "inside the company").
      *   **Action:** **ESCALATE TO COMPLIANCE.**

  #### Step 5: The Human Judgment Handoff (Gray Areas)
  *Trigger:* If Step 1 is YES, Step 3 is YES, but Step 2 is YES (MM) AND Step 4 is AMBIGUOUS.
  *   **Scenario:** An MM places a huge bet right before news, claiming "model adjustment."
  *   **Decision:** This requires a **Senior Surveillance Officer**.
  *   **Reason:** This is a judgment call on **Risk Tolerance vs. Privilege**. Is the MM using privileged access to adjust their model, or is their model genuinely sensitive to public data flows others ignore?
  *   **Action:** **HANDOFF TO SENIOR.** (Do not close, do not file SAR/Regulatory report yet).

  ---

  ### Procedure Run-Through: Case Studies

  #### Case 1: The M&A Pre-Announcement Bet
  *   **Scenario:** Large one-sided bet in M&A market, placed 20 minutes before deal announcement.
  *   **Step 1 (News Correlation):** **YES.** Trade is 20 mins before material news. (Inside 24hr Insider Window). -> *Go to Step 2.*
  *   **Step 2 (Participant):** **Assume NO.** (Unless proven otherwise, treat as speculator). -> *Go to Step 3.*
  *   **Step 3 (Size):** **YES.** Described as "Large one-sided." -> *Go to Step 4.*
  *   **Step 4 (Info Plausibility):** **FAIL.** It is functionally impossible to derive a specific M&A deal conclusion from public data in a 20-minute window without NPI.
  *   **Verdict:** **ESCALATE TO COMPLIANCE.**
  *   **Reasoning:** This fails the "No-Trade" logic in the real world. While rational agents *can* disagree on public info, the timing probability suggests NPI. This is a regulatory risk (insider trading), not a market efficiency issue.

  #### Case 2: The Market Maker Model Disagreement
  *   **Scenario:** Two established MMs trade against each other every month around Nonfarm Payrolls (NFP), claiming the other's model is wrong.
  *   **Step 1 (News Correlation):** **YES.** Trade is around NFP release. (Inside 1hr Insider Window). -> *Go to Step 2.*
  *   **Step 2 (Participant):** **YES.** Both are "Established Market Makers." -> *Go to Step 3.*
  *   **Step 3 (Size):** **LIKELY YES.** MMs often trade large size to manage books. -> *Go to Step 4.*
  *   **Step 4 (Info Plausibility):** **PASS.** They cite "model disagreement." In macro markets, models *are* priors. One MM may weight ADP data higher; the other may weight revisions higher. This is public info interpretation.
  *   **Step 5 (Judgment Handoff):** **NO HANDOFF.**
  *   **Verdict:** **DON'T ESCALATE.**
  *   **Reasoning:** This is the exact function of a prediction market. The "No-Trade Theorem" does not apply because MMs have **different priors** (models) and **different inventory risks**. One is likely long, one is short, and they are providing liquidity to the market ahead of volatility. Escalating this punishes liquidity provision.

  ### Implementation Notes for the Team

  1.  **The "Common Priors" Trap:** Remind your team that if two traders had *truly* common priors and *truly* rational updating rules, they wouldn't trade. The fact that they *are* trading proves they have different priors or different risk needs. That is legal.
  2.  **The Burden of Proof:** In Step 4, we are not asking the trader to prove they aren't insiders. We are asking if a *plausible public narrative exists*. If a plausible public narrative exists (e.g., "I read the Fed minutes differently"), you cannot escalate based on suspicion alone.
  3.  **MM Privilege:** Market Makers are paid to take the other side of trades. If you escalate every time an MM trades against a news flow, you will break your market's liquidity. Their "private info" is often just faster processing of public data, which is legal (unless they have a direct news feed embargo violation).

  **Metric for Success:** Your escalation rate should drop from 30/day to ~3-5/day. The "Don't Escalate" decisions should be logged for audit, but not sent to Legal/Compliance.
