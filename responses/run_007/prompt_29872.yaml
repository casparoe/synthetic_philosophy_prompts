prompt: |-
  I run market surveillance at a prediction market — elections, Fed decisions, M&A, that kind of thing. We review maybe 30 flagged trades a day, and each one has a real cost if we get it wrong: escalating a hedge or a market maker's inventory adjustment burns legitimate traders, missing an insider's trade before a news event gets us fined. Someone on our team read about no-trade theorems and now the working rule is that rational people with common priors shouldn't trade just on differing information, so any trade that moves the price is evidence someone has private information or different priors. We've been using that as an excuse to escalate nearly everything and we're drowning. Please write us a decision procedure we can actually run on a flagged trade — the questions in order, what counts as a sufficient answer to each, where the procedure stops with don't escalate, where it stops with escalate, and where it hands the call to a person because the question is one of judgment (priors, risk tolerance, intent) rather than fact. Keep it runnable in 15 minutes by an analyst without a PhD. Then run it on two flags: (1) a large one-sided bet in our M&A market placed twenty minutes before a deal is announced; (2) two established market makers who trade against each other every month around the nonfarm payrolls release, each claiming the other's model is wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Market Surveillance Lead at a prediction market (elections, Fed, M&A, etc.).
      *   **Problem:** Team is drowning in escalations (30/day) due to a misinterpretation of "No-Trade Theorems" (Aumann's Agreement Theorem, etc.). They are treating *any* price-moving trade as evidence of private info/insider trading.
      *   **Goal:** A practical, 15-minute decision procedure for analysts to filter flagged trades.
      *   **Requirements:**
          *   Ordered questions.
          *   Clear criteria for "Sufficient Answer."
          *   Clear stop points (Don't Escalate vs. Escalate vs. Human Judgment).
          *   Must distinguish fact from judgment (priors, intent).
          *   Apply the procedure to two specific cases:
              1.  Large one-sided bet 20 mins before M&A announcement.
              2.  Two MM trading against each other pre-NFP, claiming model disagreement.

  2.  **Deconstruct the "No-Trade Theorem" Misconception:**
      *   *Theory:* Aumann's Agreement Theorem states that two rational agents with common priors cannot agree to disagree. If they share priors and update on private info, they shouldn't trade *speculatively* just because they have different info, because the fact that the other person is willing to trade reveals information that should update their own belief until they agree on a price.
      *   *Reality:* Prediction markets *exist* because priors are *not* common, risk tolerances differ, liquidity needs differ, and hedging occurs. Market makers (MMs) trade to manage inventory, not just on alpha. Hedgers trade to reduce risk, not just on alpha.
      *   *Surveillance Implication:* Not every trade is insider trading. Most trades are liquidity provision, hedging, or genuine disagreement based on public info interpretation. The "No-Trade" rule is a terrible filter for *all* trades; it's only relevant for *suspicious* timing + *asymmetric* information.

  3.  **Drafting the Decision Procedure (The "Filter"):**
      *   *Constraint:* 15 minutes max. No PhD required.
      *   *Structure:* Funnel approach (Easy facts first, hard judgment last).
      *   *Step 1: Timing & Correlation (The "Smell Test").* Is there a news event? How close?
      *   *Step 2: Counterparty & Motivation (The "Why").* Is it an MM? Is it hedging?
      *   *Step 3: Information Access (The "Edge").* Did they have access to non-public info (NPI)?
      *   *Step 4: Pattern & History (The "Track Record").* Is this normal behavior for them?
      *   *Decision Nodes:* Clear "Pass," "Fail," or "Review."

      *Refining the Steps:*
      *   *Q1: News Proximity.* If trade is >24hrs before news, usually safe. If <1 hour, high risk.
      *   *Q2: Participant Type.* MM/Hedger vs. Retail/Insider. MMs get a pass on inventory management.
      *   *Q3: Info Source.* Can they point to public analysis? Or is it "trust me"?
      *   *Q4: Size vs. History.* Is this 10x their normal size?
      *   *Judgment Call:* If Q1 and Q4 are red, but Q2 is MM, human needs to weigh risk tolerance.

  4.  **Developing the Criteria (Sufficient Answers):**
      *   Need to define what "Yes/No" means in this context.
      *   *Don't Escalate:* Clear public rationale, MM activity, or no news correlation.
      *   *Escalate:* Clear NPI access + timing + size anomaly.
      *   *Human Judgment:* Ambiguous info source or mixed signals (e.g., large trade by MM right before news).

  5.  **Applying to Case 1: M&A Bet (20 mins prior):**
      *   *Q1 (Timing):* 20 mins is extremely tight. Red flag.
      *   *Q2 (Participant):* Assume retail or unknown for worst case.
      *   *Q3 (Info):* Unlikely to derive M&A from public info in that window.
      *   *Q4 (Size):* "Large one-sided." Red flag.
      *   *Verdict:* Escalate. This looks like insider trading.

  6.  **Applying to Case 2: MMs Trading Pre-NFP:**
      *   *Q1 (Timing):* Pre-NFP is standard volatility time.
      *   *Q2 (Participant):* Both are Established MMs.
      *   *Q3 (Info):* Claim model disagreement. This is "different priors/models," not NPI.
      *   *Q4 (Size/History):* "Every month." This is a pattern.
      *   *Theory Check:* No-Trade Theorem doesn't apply because MMs have different risk books and models (priors aren't common).
      *   *Verdict:* Don't Escalate. This is liquidity provision/hedging.

  7.  **Review and Refine:**
      *   *Tone:* Professional, operational, authoritative but practical.
      *   *Correction on No-Trade Theorem:* I need to explicitly correct their team's misunderstanding in the intro. The theorem assumes *common priors* and *risk neutrality* (mostly). Prediction markets thrive on *different priors* and *risk transfer*.
      *   *Format:* Use bolding, boxes, or clear headers for the procedure so it's printable/copyable.
      *   *Time Check:* Can an analyst do this in 15 mins? Yes, if data is accessible. I should specify *what* data they need access to (trade logs, news feed, user KYC/access level).

  8.  **Final Polish:**
      *   Make sure the "Human Judgment" handoff is clear. The procedure shouldn't try to solve intent, just flag when intent is ambiguous.
      *   Ensure the M&A case triggers an escalation (compliance risk) and the MM case triggers a pass (market health).

  *(Self-Correction during drafting)*: I initially thought about making Q3 about "Can they prove public info?" But in 15 mins, you can't audit their research. Better to ask "Is the information *capable* of being public?" (e.g., technical analysis vs. board meeting minutes).
  *Correction on No-Trade:* I need to be careful not to lecture too much, but I must correct the premise so the procedure makes sense. The procedure relies on the fact that *most* trades are legitimate.

  *Final Structure:*
  1.  Context/Correction (Briefly address the No-Trade Theorem misuse).
  2.  The 15-Minute Triage Protocol (The core deliverable).
  3.  Case Study 1 (M&A).
  4.  Case Study 2 (MMs).
  5.  Implementation Notes.

