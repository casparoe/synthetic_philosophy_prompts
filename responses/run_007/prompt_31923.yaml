answer: |-
  - "The core job"
  The core job of a theory of public reason is to solve the legitimacy deficit inherent in coercive governance amidst deep pluralism. When the state forces citizens to comply with laws they fundamentally reject, it risks tyranny. The phenomenon is the collision between state coercion and comprehensive disagreement (religious, moral, philosophical). A solution isn't merely describing current practice; it must provide a normative standard distinguishing legitimate coercion from mere power. A theory succeeds if it identifies a class of reasons ("public reasons") that all reasonable citizens can accept without abandoning their deepest convictions. It fails if it merely restates the problem (e.g., "be reasonable") without defining the boundary conditions of justification. The theory must explain why some reasons count and others don't, grounding the duty of civility in something deeper than politeness. Ultimately, it must reconcile the authority of the state with the autonomy of the citizen.

  - "The hard cases"
  1. **The Civil Rights Movement:** Martin Luther King Jr. justified civil rights laws using explicitly theological language (e.g., "God's children"). An adequate theory must explain why this was legitimate despite violating strict secularism. It tests whether the theory allows religious rhetoric in high-stakes moral corrections or if it mistakenly delegitimizes historic justice movements.
  2. **The Voting Booth:** Does a devout citizen need secular reasons when voting, or only when advocating? This tests the scope of the constraint (official vs. private conduct). If voting is coercive, does the restriction apply there?
  3. **Abortion/Euthanasia:** Where secular and religious reasons overlap but diverge on ultimate grounding. Can a secular "right to life" suffice if the voter's motive is religious? This tests the sincerity vs. accessibility distinction and whether motives matter.
  4. **The "No Secular Equivalent" Case:** Some religious claims (e.g., sacramental wine exceptions) have no secular analog. A theory must decide if these are exempt or impermissible. This tests the flexibility of the "translation" requirement.
  5. **Emergency Legislation:** When rapid action is needed without consensus. Tests whether public reason is a strict veto or a presumptive guideline. If consensus is impossible, does the theory permit coercion based on majority will alone?

  - "Non-negotiables"
  1. **Liberal Legitimacy:** The theory must preserve the core liberal insight that power requires justification to the governed. It cannot collapse into "might makes right."
  2. **Non-Alienation:** It cannot require religious citizens to cease being religious to participate. A theory that demands secular conversion is illiberal.
  3. **Action-Guidance:** It must be usable by real agents. If the criteria for "public reason" are too obscure, the theory is useless.
  4. **Motive/Reason Distinction:** It must distinguish between *why* I believe (motivation) and *why* I argue (justification). Collapsing these leads to policing thoughts rather than speech.
  5. **Reciprocity:** The standard must apply equally to secular and religious comprehensive doctrines. Secularism cannot be treated as a neutral default if it functions as a competing dogma. Any theory violating these collapses into either authoritarianism or anarchy.

  - "Camp-specific demands"
  1. **Restrictivists (Rawls/Audi):** Demand stability and mutual respect. They insist reasons must be shareable *now*, not just in principle. Negotiable: The strictness of the "translation" proviso.
  2. **Permissivists (Eberle/Vallier):** Demand integrity and epistemic humility. They insist religious reasons are prima facie valid unless defeated. Negotiable: The requirement for eventual secular backup.
  3. **Deliberativists (Stout):** Demand democratic engagement over abstract justification. They prioritize the process of dialogue. Negotiable: The requirement for consensus.
  4. **Stability vs. Truth:** Some camps prioritize social stability (peace); others prioritize moral truth (justice). This is negotiable depending on whether you view liberalism as a modus vivendi or a moral ideal. These demands reveal whether a theorist values order over conscience or vice versa.

  - "Tensions"
  1. **Inclusivity vs. Constraint:** To include all religious citizens, you must allow sectarian reasons. To constrain coercion, you must exclude them. You cannot maximize both.
  2. **Integrity vs. Stability:** Protecting religious integrity allows sectarian justification, risking social fragmentation. Enforcing stability protects peace but damages integrity (the "split consciousness" problem).
  3. **Epistemic Humility vs. Moral Urgency:** If I believe God commands X, waiting for secular consensus feels like complicity in evil. Public reason demands patience; conscience demands action.
  4. **Neutrality vs. Secularism:** Claiming secular reasons are "neutral" often masks a secular comprehensive doctrine. True neutrality might require allowing religious reasons, but that undermines the "public" nature of public reason. This suggests a possible impossibility theorem for perfect public reason.

  - "Quick scorecard"
  | Theorist | Strengths | Weaknesses | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Rawls** | Solves stability; clear reciprocity norm. | "Proviso" is vague; burdens religious integrity. | Strong on order, weak on inclusion. |
  | **Audi** | Clear secular rationale principle. | Fails Civil Rights test; too rigid on translation. | Strong on constraint, weak on history. |
  | **Eberle** | Protects conscience; epistemic humility. | Weak on constraining sectarian coercion. | Strong on integrity, weak on stability. |
  | **Greenawalt** | Nuanced scope (officials vs. citizens). | Complex; hard to apply consistently. | Strong on realism, weak on clarity. |

  **Rawls** sets the standard but struggles with the "proviso" (when religious reasons are allowed). **Audi** is cleaner but historically brittle (King would fail his test). **Eberle** fixes the integrity problem but risks allowing coercive sectarian laws. **Greenawalt** offers a pragmatic middle ground, distinguishing between officials (strict) and citizens (loose), but this creates a dual-standard complexity. Rawls wins on stability; Eberle on conscience; Greenawalt on practicality. None fully resolve the Inclusivity vs. Constraint tension.
