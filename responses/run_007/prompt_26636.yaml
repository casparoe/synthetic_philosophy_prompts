      *   **SIA (Self-Indication Assumption):** "Reason as if you are a random sample from the set of all *possible* observers, weighted by the probability of their existence." (Dennis Dieks, Ken Olum). Tends to favor larger worlds, rejects the Doomsday Argument, accepts the Presumptuous Philosopher (to an extent).
