answer: |-
  ### Session Architecture: The Normative Structure of Precommitment
  **Duration:** 90 Minutes
  **Goal:** Move students from understanding the *mechanism* of precommitment (Elster's descriptive account) to grappling with the *legitimacy* of self-binding in a democracy.

  ---

  ### I. Conceptual Dependency Order
  Do not introduce the Ulysses analogy until the following three conceptual tiles are laid. If you start with the myth, students will treat it as literature rather than political theory.

  1.  **Temporal Fragmentation of the Polity:** Establish that "The People" is not a static entity but a sequence of temporal slices (People-t1, People-t2).
      *   *Pedagogical Move:* Ask students to describe a policy decision made in a crisis vs. calm. Do not accept "they changed their minds." Push for "they became a different decision-making agent."
  2.  **First-Order vs. Second-Order Volitions:** You cannot have precommitment without a hierarchy of desires.
      *   *Pedagogical Move:* Distinguish between "what the polity wants to do" (impulse/spending) and "what the polity wants to want" (fiscal discipline/stability).
  3.  **The Time-Inconsistency Problem:** Establish that rational choice at t1 leads to suboptimal outcomes at t2 without binding.
      *   *Pedagogical Move:* Use a game-theory light touch. If t2 knows t1 won't bind, t2 defects. If t1 binds, t2 complies. The payoff is higher for the *extended* self.

  **Only after these three are established do you introduce Ulysses.** At this stage, Ulysses is merely the illustrative model for the structure you have already built, not the source of the theory itself.

  ---

  ### II. The Core Example: Selection and Criteria
  **Do not let the Ulysses myth carry the normative weight.** It is too individualistic and too coercive (the crew ties him).

  **Primary Example:** Use Ulysses only for the *mechanism* (wax in ears, mast binding).
  **Supplementary Example (The Workhorse):** Use a **"Collective Budget Lockbox."**
  *   **Scenario:** A legislature agrees at t1 (start of term) that no spending bills can pass at t2 (pre-election) without a 2/3 majority, specifically to prevent populist giveaways they know they will be tempted by.
  *   **What it must have:**
      *   **Foreseeability:** The temptation must be known at t1.
      *   **Identity:** The legislature at t2 must be the *same* agent as t1 (same voters, same institution).
      *   **Cost:** Breaking the bond must be difficult but not impossible (otherwise it's not a bond; if impossible, it's suicide).
  *   **What it must lack:**
      *   **External Enforcer:** No courts or armies enforcing this. It must be self-enforced procedural rules. If you introduce a Supreme Court strike-down, you shift the debate to judicial review, which muddies the precommitment logic.

  **Why this combination:** Ulysses provides the vivid imagery of binding; the Budget Lockbox provides the democratic context where the "self" is collective and the "binding" is procedural.

  ---

  ### III. Sequence and Misconception Management
  Here is the minute-by-minute intervention plan to head off specific errors.

  **00–15 min: The Problem of Time (Dependencies 1 & 3)**
  *   *Activity:* Elicit examples of policy reversals.
  *   *Misconception Alert:* **Conflating Preference Change with Weakness.**
      *   *Intervention:* If a student says "people just learned new information," stop them. Precommitment only applies when the change is due to *passion/impulse*, not new data. Make them distinguish between "I changed my mind because I know more" vs. "I changed my mind because I'm hungry/scared/excited."

  **15–30 min: The Structure of Will (Dependency 2)**
  *   *Activity:* Map 1st vs. 2nd order preferences onto the Budget Lockbox.
  *   *Misconception Alert:* **Precommitment as Promising.**
      *   *Intervention:* Students will say "It's just a promise to the voters." Correct this immediately. A promise creates an obligation to *another*. Precommitment creates an obstacle for *oneself*. If the voters (the other) can release the bond instantly, it isn't precommitment. Emphasize the *removal of the option*.

  **30–50 min: The Ulysses Mechanism & The Collective Pivot**
  *   *Activity:* Apply the Ulysses logic to the Budget Lockbox.
  *   *Misconception Alert:* **The "Dead Hand" Problem (Ancestral Binding).**
      *   *Intervention:* Students will argue "Why should t2 be bound by t1?" This is the crux. Do not solve it yet. Flag it. Make them feel the tension. If t1 and t2 are the same "People," binding is autonomy. If they are different generations, binding is tyranny. Force them to define the limits of "The People's" temporal identity.

  **50–70 min: Normative Justification & Limits**
  *   *Activity:* Debate the legitimacy of the Lockbox.
  *   *Misconception Alert:* **Justifying Any Entrenchment.**
      *   *Intervention:* Students will argue this justifies entrenching *anything* (e.g., slavery clauses). You must introduce the **Substantive Limit**. Precommitment is only normatively valid if it protects the *conditions* of democracy (procedure), not specific *outcomes* (substance). If you bind the polity to a specific outcome, you destroy the agency you claimed to protect.

  **70–80 min: Open Discussion**
  *   Allow the tension from the 50-minute mark to breathe. Let them argue whether the "Self" persists over time.

  ---

  ### IV. Scope Control: What to Leave Untreated
  To keep the normative structure clear, you must explicitly bracket the following. Tell the students you are doing this.

  1.  **Judicial Review:** Do not discuss *who* interprets the precommitment. That introduces the counter-majoritarian difficulty, which is a separate seminar. Keep the enforcement internal/procedural.
  2.  **Specific Constitutional Clauses:** Do not get bogged down in the Commerce Clause or the Second Amendment. Keep it at the level of "Entrenchment Rules."
  3.  **The Exit Mechanism:** Do not solve the problem of how to amend the constitution. Acknowledge that if amendment is too easy, precommitment fails; if too hard, democracy dies. Leave it as an unresolved tension.

  ---

  ### V. Final Assessment Question (Last 10 Minutes)
  Do not ask a descriptive question (e.g., "What is the Ulysses analogy?"). You need to test if they grasp the *normative puzzle* of democratic self-binding.

  **Pose this exact scenario:**
  > "Imagine a democracy votes at t1 to constitutionally ban a specific religious practice at t2, arguing they are precommitting to protect social stability against future panic. At t2, the majority wants to restore the practice.
  >
  > **Question:** Using the logic of precommitment we discussed, is the t1 ban an act of **autonomy** (the People binding themselves) or **tyranny** (the Past ruling the Present)? What specific feature of the 'binding' determines which label applies?"

  **What to listen for:**
  *   **Failure:** If they focus on whether the religion is good/bad (substantive outcome).
  *   **Success:** If they focus on whether the ban protects the *process* of democracy or restricts the *scope* of future choice. They should identify that precommitment is only legitimate when it secures the conditions for future agency, not when it forecloses future agency on substantive grounds. If they cannot distinguish between binding the *rules of the game* vs. binding the *score of the game*, they have missed the normative point.
