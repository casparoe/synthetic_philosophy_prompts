answer: |-
  Consider the weakly electric fish *Gnathonemus petersii*, which navigates and hunts in murky African rivers using active electrolocation. The fish generates an electric field and detects distortions caused by objects; let $R$ be a specific spatiotemporal firing pattern in the electrosensory lateral line lobe (ELL) triggered by the capacitive impedance signature of a chironomid larva, its primary ancestral prey. Historically, in the fish's environment of evolutionary adaptedness, only chironomid larvae possessed this specific impedance profile, and firing $R$ coordinated a successful strike that conferred reproductive fitness. However, in the current environment, human pollution has introduced small, insulated copper wires onto the riverbed which, due to their conductivity and shape, reliably produce the same impedance distortion as the larvae. Consequently, $R$ is now triggered with equal reliability by both larvae and wire debris, though only striking larvae provides nutrition; striking wires yields no food and wastes energy.

  In this case, $R$ is the internal neural burst pattern in the ELL. Under teleosemantics, the content of $R$ is determined by its proper function, which is fixed by the selection history of the mechanism producing $R$. Since the mechanism was selected specifically because it enabled the detection and consumption of chironomid larvae (the condition that explained the survival of ancestors), the teleosemantic content is determinate: <chironomid larva>. The copper wires are irrelevant to the content because they played no role in the selection process that established the norm for $R$. Conversely, under a simple covariance theory, content is fixed by what $R$ reliably indicates in the *current* environment. Because $R$ now nomologically covaries with both larvae and wires with high probability, the informational content is the disjunction: <chironomid larva ∨ copper wire>. The divergence arises because teleosemantics looks backward to the history of reinforcement, while covariance theory looks outward to the current statistical structure.

  The feature doing the work is the presence of a novel, reliable trigger (the wire) that was absent during the selection period. If you remove the wires from the current environment, the covariance narrows to match the selection history, and the divergence collapses; both theories assign <chironomid larva>. If you remove the selection history constraint (treating the fish as a Swampman or ahistorical system), teleosemantics loses its grip, and the case turns into a standard indeterminacy problem where the informational view dominates. The strongest move for a defender of the informational theory is to appeal to "normal conditions" or "channel conditions" (à la Dretske), arguing that wires constitute noise or interference rather than genuine information-carrying conditions, thereby restoring the determinate content <chironomid larva>. However, this move succeeds only if "normal conditions" are defined historically (i.e., conditions under which the system was designed), which effectively concedes the argument to teleosemantics by smuggling selection history back into the informational account. If "normal conditions" are defined statistically based on the current environment, the wires count as normal if they are frequent enough, and the disjunctive content remains. Thus, the case isolates selection history as the necessary component for determinate content in the face of novel environmental mismatches.
