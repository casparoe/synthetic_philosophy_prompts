  I'm a PhD student in philosophy of mind, writing a paper on teleosemantics, and I need a case that isolates the selection-history component of the view. I'd like you to act as a philosopher who works on naturalized semantics — teleosemantics and indicator/informational theories — and think carefully. Start by brainstorming a couple candidate mechanisms in your head, then pick the one you think is strongest and build it out; don't include the brainstormed alternatives in the final answer.

  Construct a thought experiment to this spec. There's a single representational state type R in a real kind of organism. A teleosemantic theory says content is what R has the proper function to indicate, where proper function is spelled out in terms of selection history. A simple covariance/informational theory says content is what R actually carries information about in the organism's current environment. I want a case where these two come apart: the teleosemantic content is something determinate (say, a particular kind of conspecific or prey), while the informational content is a broader disjunction, because in the current environment R is also reliably triggered by a second kind of thing that was rare or absent in the environment where R was selected. Constraints: realistic biology — a real kind of organism and a plausible signal or internal state; no swampman, no science fiction, no perfect correlations; and please dont use a frog's fly-detector or anything to close to the standard frog-and-BB case. The scenario should be one paragraph.

  After the scenario, walk through it. Say exactly what R is, what it was selected to indicate, and what it covaries with now. Then show why teleosemantics assigns the determinate content and why the informational theory assigns the disjunctive content — don't just stipulate the verdicts, derive them from the two theories. Tell me which feature of the case is doing the work, and what happens if you remove it: does the divergence collapse, or does it turn into the standard frog case? Finish with the strongest move a defender of the informational theory could make to resist your verdict (e.g., by idealizing to normal conditions, or by denying that R is a representation at all) and say whether that move succeeds.

  And commit: don't give me three candidate organisms and let me pick. Give me one case, make the choices, and defend them.
