prompt: |-
  Write an essay on the following controversy in the theory of convention and the evolution of norms. David Lewis analyzes a convention as a behavioral regularity that solves a recurrent coordination problem: members of a population conform to it, expect one another to conform, and prefer to conform conditional on others conforming, with this entire structure being common knowledge; the regularity must also have had at least one viable alternative that would likewise have solved the coordination problem had everyone conformed to it instead. Critics argue that the common-knowledge condition over-intellectualizes convention, since many real conventions and social norms arise and persist among agents who never form the full hierarchy of higher-order expectations, and some emerge through trial-and-error, imitation, or cultural transmission rather than through a shared public state that generates common knowledge. Defenders reply that weakening or dropping the condition sacrifices the account's ability to explain the distinctive stability and normative force of conventions, and that public signals, precedent, and repeated interaction can approximate or realize common knowledge in ordinary cases. Weigh the main arguments and intermediate positions. In doing so, address at least the following: (a) whether the explanatory work is really done by common knowledge, by lower-order mutual expectations, or by high-probability common belief; (b) whether the emergence of conventions through non-deliberative processes is an objection to Lewis's analysis or only to a stronger claim about explicit agreement; and (c) what, if anything, is lost if the condition is weakened or replaced. Defend a specific verdict about how much of the Lewisian account survives and which condition, if any, should be revised. Do not end on a non-committal note.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Topic:** The controversy in the theory of convention and the evolution of norms, specifically focusing on David Lewis's account vs. critics regarding the "common knowledge" condition.
      *   **Core Definition (Lewis):** Convention = behavioral regularity + recurrent coordination problem + conformity + expectation of conformity + preference to conform conditional on others + *common knowledge* + alternative regularity possible.
      *   **The Conflict:** Critics say "common knowledge" is too intellectualized (agents don't form infinite hierarchies of expectations; norms evolve via trial-and-error/imitation). Defenders say weakening it loses explanatory power (stability/normative force) and argue public signals approximate common knowledge.
      *   **Required Elements:**
          *   Weigh main arguments and intermediate positions.
          *   Address (a): Explanatory work (common knowledge vs. lower-order expectations vs. high-probability common belief).
          *   Address (b): Emergence via non-deliberative processes (objection to analysis or just explicit agreement claim?).
          *   Address (c): What is lost if weakened/replaced.
          *   **Verdict:** Defend a specific verdict on how much of Lewis survives and what should be revised.
          *   **Constraint:** Do not end on a non-committal note.

  2.  **Deconstruct the Arguments:**

      *   **Lewis's Position:** Conventions solve coordination problems (e.g., driving side, meeting places). The key is *arbitrariness* (could have been otherwise) and *interdependence* (I do it because you do it). Common Knowledge (CK) ensures that everyone knows everyone knows... ad infinitum, preventing doubt from unraveling the equilibrium.
      *   **Critics (e.g., Skyrms, Young, Millikan):** CK is psychologically unrealistic. Humans have bounded rationality. Norms evolve via evolutionary game theory, reinforcement learning, or cultural transmission without anyone "knowing" anything in the propositional sense.
      *   **Defenders (e.g., Gilbert, some interpretations of Lewis):** Without CK (or something close), you don't get the *normative* "ought." Mere regularity isn't a convention; it's just habit. CK provides the mutual assurance needed for stability.
      *   **Intermediate Positions:** "Common Belief" (probabilistic), "Mutual Manifestness," or "Reasonable Belief."

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The ubiquity of conventions (driving, language, money).
          *   Introduce Lewis's *Convention* (1969) as the standard game-theoretic account.
          *   State the central tension: The Common Knowledge (CK) requirement.
          *   Thesis Statement: While critics correctly identify the psychological implausibility of strict CK, abandoning it entirely dissolves the distinction between mere habit and social norm. A revised account retaining *common belief* (probabilistic) rather than strict epistemic CK preserves Lewis's explanatory power regarding stability and arbitrariness while accommodating evolutionary emergence.

      *   **Body Paragraph 1: Lewis's Framework and the Role of CK.**
          *   Define the coordination problem.
          *   Explain why CK matters for Lewis: It creates the "reason to believe" others will conform. It distinguishes convention from coincidence.
          *   Address Prompt (a): Does CK do the work? Yes, for *rational justification*, but maybe not for *causal emergence*.

      *   **Body Paragraph 2: The Evolutionary Critique.**
          *   Critics (Skyrms, Young): Norms evolve via replication, not reasoning.
          *   Address Prompt (b): Is this an objection to Lewis? Lewis didn't require explicit agreement (pact), but he did require rational agents. The critique targets the *rationality* assumption, not just the "agreement" myth. Conventions can exist without agents understanding *why*.
          *   Example: Traffic norms in ants or simple heuristics in humans.

      *   **Body Paragraph 3: The Defender's Rebuttal (Normative Force).**
          *   Address Prompt (c): What is lost? If we drop CK, we lose the "normative force." A mere behavioral regularity (everyone drinks coffee in the morning) isn't a convention. A convention implies an expectation of *expectations*.
          *   Without higher-order expectations, deviation isn't "wrong" or "surprising" in the social sense, just inefficient.
          *   Defenders argue public signals (salience) create functional CK.

      *   **Body Paragraph 4: Intermediate Positions (Common Belief).**
          *   Synthesize: Strict CK (infinite hierarchy) is impossible. But "Mutual Belief" (I believe you believe...) up to a few levels is plausible.
          *   Or "Common Belief*" (probabilistic).
          *   This addresses Prompt (a): High-probability common belief does the heavy lifting for stability without requiring logical omniscience.

      *   **Conclusion/Verdict:**
          *   Reiterate Thesis.
          *   Specific Verdict: Lewis's core structure (coordination + arbitrariness + interdependence) survives. The CK condition must be revised to "Common Belief based on Salience."
          *   Final punch: We must distinguish the *logic* of convention from the *psychology* of the agent. Lewis got the logic right, critics got the psychology right. The synthesis is a bounded-rationality model of Lewisian conventions.
          *   *Check Constraint:* Ensure the ending is decisive.

  4.  **Refining and Polishing:**
      *   *Tone:* Academic, analytical, philosophical.
      *   *Clarity:* Ensure terms like "common knowledge," "coordination problem," and "normative force" are used precisely.
      *   *Check against requirements:*
          *   (a) Explanatory work? Covered (stability vs. emergence).
          *   (b) Non-deliberative processes? Covered (evolutionary vs. rational reconstruction).
          *   (c) What is lost? Covered (normativity/distinction from habit).
          *   Verdict? Clear in conclusion.
          *   No non-committal ending? Ensure the final sentence is strong.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe argue that Lewis is completely wrong about CK.
      *   *Correction:* No, the prompt asks to weigh arguments. Lewis's account is too useful to discard. The "Common Belief" modification is the standard philosophical compromise (e.g., Monderer and Samet). I should argue for that.
      *   *Check:* Did I address "explicit agreement"? Lewis explicitly argued *against* the idea that conventions require promises. I need to make sure I don't attribute the "explicit agreement" view to Lewis. The prompt asks if the emergence objection targets Lewis or a *stronger claim* about agreement. I need to clarify that Lewis never claimed explicit agreement, so the evolutionary critique targets his *rationality* assumptions, not a strawman of "pacts."

  6.  **Final Review:** Check flow and transitions. Ensure the distinction between "norm" and "convention" is handled carefully (Lewis focuses on convention, critics often broaden to norms). Stick to the prompt's focus on the *theory of convention*.

      *(Self-Correction on Verdict)*: Make sure I explicitly state *which* condition is revised. It's the Common Knowledge condition. It becomes Common Belief.

      *(Final Polish)*: Ensure the ending isn't "On the one hand, on the other hand." It must be "Therefore, X is the case."

  7.  **Final Output Generation** (Proceed to write the essay based on these thoughts).
answer: |-
  David Lewis's *Convention* (1969) remains the cornerstone of philosophical and game-theoretic analyses of social norms. By defining a convention as a behavioral regularity that solves a recurrent coordination problem, sustained by mutual expectations and common knowledge, Lewis provided a rigorous framework for understanding how arbitrary social orders stabilize. However, the requirement that the structure of expectations be *common knowledge* has sparked enduring controversy. Critics argue this condition over-intellectualizes human interaction, ignoring the evolutionary and psychological realities of norm emergence. Defenders contend that without it, the account cannot distinguish conventions from mere habits or explain their normative grip. This essay argues that while the critics are correct regarding the psychological implausibility of strict common knowledge, the defenders are right that some higher-order epistemic condition is necessary to capture the distinctive stability of conventions. Consequently, the Lewisian account survives largely intact, provided the common knowledge condition is revised to a condition of *high-probability common belief* grounded in salience.

  To evaluate the controversy, one must first understand the explanatory work Lewis assigns to common knowledge. In a coordination problem, such as choosing which side of the road to drive on, an agent's preference for conformity is conditional on the conformity of others. I prefer to drive on the right only if I believe you will. Lewis argues that for this equilibrium to be rational and stable, it is not enough for me to know you will conform; I must know that you know I will conform, and that you know that I know that you know, ad infinitum. This infinite hierarchy constitutes common knowledge. Addressing prompt (a), does this hierarchy do the explanatory work? For Lewis, yes. It ensures that no agent has a reason to doubt the stability of the equilibrium. If the chain of expectations breaks at any level, the rational justification for conformity unravels. However, critics like Brian Skyrms and H. Peyton Young argue that in the real world, conventions emerge through evolutionary dynamics, trial-and-error, or cultural transmission, not through agents reasoning through infinite epistemic hierarchies. In these models, agents follow simple heuristics or imitate successful behaviors without representing the mental states of others.

  This leads to the issue raised in prompt (b): whether the emergence of conventions through non-deliberative processes objects to Lewis's analysis or merely to a caricature of it. It is a common misconception that Lewis required explicit agreement or a "pact." Lewis explicitly rejected the idea that conventions require promises; he sought to explain how agreement *without* bargaining is possible. Therefore, the evolutionary critique is not merely attacking a strawman of explicit agreement. It attacks the assumption of hyper-rationality. If ants can form conventions (e.g., trail selection) without cognitive representation, and humans often follow norms via unthinking habit, then Lewis's requirement for rational agents possessing common knowledge seems descriptively false. However, this objection conflates the *causal history* of a convention with its *current status*. Lewis was offering a rational reconstruction of why a convention *persists* and why it is *reasonable* to follow it, not necessarily a psychological account of how it originated. A convention can evolve blindly but be sustained by the structure Lewis describes once established. Thus, the evolutionary critique weakens Lewis's claims about origin but does not necessarily invalidate his analysis of the steady-state logic of coordination.

  Nevertheless, if we abandon the epistemic condition entirely, we face the problem outlined in prompt (c): what is lost? If we define convention merely as a behavioral regularity where agents prefer to conform conditional on others conforming, we lose the ability to distinguish conventions from coincidental regularities or forced behaviors. Consider a population where everyone drinks coffee in the morning because they are all addicted, not because they expect others to do so. This lacks the interdependence of expectations. More critically, we lose the "normative force" of conventions. Conventions carry a specific type of social pressure: if you violate a convention (e.g., wearing a tuxedo to a beach wedding), you are not just inefficient; you are frustrating the expectations of others who relied on your conformity. Margaret Gilbert and other defenders argue that this mutual reliance requires a "joint commitment" or at least common knowledge. Without higher-order expectations (I expect that you expect me to conform), deviation is merely a surprise, not a violation of a shared understanding. Strict behavioral regularity plus first-order expectation is insufficient to generate the stability characteristic of social norms, as it leaves agents vulnerable to doubts about whether others view the regularity as arbitrary or binding.

  The solution lies in an intermediate position that modifies the epistemic condition without discarding it. Strict common knowledge requires logical omniscience and infinite cognitive capacity, which is indeed psychologically unrealistic. However, replacing it with "common belief" (where agents believe the proposition with high probability, rather than knowing it with certainty) preserves the logical structure while accommodating bounded rationality. As shown by Monderer and Samet, if there is "common p-belief" (where p is close to 1), the strategic implications are nearly identical to common knowledge for practical purposes. This revision addresses the critics' concern about intellectualization: agents need not verify an infinite chain, but merely act on a public signal (salience) that makes the regularity manifest enough to generate high-probability mutual belief. For example, a traffic light serves as a public signal that creates a common belief that drivers will stop, without requiring them to contemplate infinite hierarchies.

  Therefore, a specific verdict can be rendered on the Lewisian account. The core of Lewis's theory—the definition of convention as an arbitrary, self-perpetuating solution to a coordination problem—is robust and survives the critique. The error lies not in the structural requirement of interdependence, but in the strict epistemic modality of "knowledge." The condition should be revised from *Common Knowledge* to *Common Belief based on Salience*. This revision acknowledges that conventions can emerge through non-deliberative evolutionary processes (satisfying the critics) while maintaining that for a regularity to function as a stable convention in a rational population, agents must operate *as if* they share a mutual understanding (satisfying the defenders).

  To weaken the condition further, to mere first-order expectation or behavioral regularity, would be to collapse the distinction between a social norm and a natural law or a shared physiological reflex. We need the higher-order element to explain why we feel entitled to expect conformity and why we sanction deviation. However, we must not demand the impossible standard of logical certainty. Lewis's account survives not as a psychological description of human cognition, but as a normative model of social rationality. By substituting strict common knowledge with high-probability common belief, we retain the explanatory power regarding stability and arbitrariness without succumbing to the charge of over-intellectualization. The Lewisian framework is not broken; it merely requires a more realistic epistemology to function as a complete theory of social norms.
