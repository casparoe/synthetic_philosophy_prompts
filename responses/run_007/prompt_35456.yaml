prompt: |-
  So I'm a software engineer, no philosophy background, but I've been reading around about consciousness because of all the AI stuff. And I've ended up at a position that I think makes sense but I want to know how exposed it is: I think non-human animals don't have any conscious experience. They're biological automata — really complex ones, sure, but there's nothing it's like to be them. They behave exactly as you'd expect sophisticated reinforcement learning agents to behave, and I don't see why we need to posit an inner life to explain any of it.

  I'm not saying this to be edgy and I'm not drawing any cruel conclusions from it — pain behavior matters regardless of whether there's a felt experience behind it, same way I'd care about a robot screaming even if I knew it wasn't feeling anything. But metaphysically, I think the default should be that they're not conscious and the burden is on the other side.

  What I want to know is: what would actually count against this? Not "dogs are smart" or "my cat knows when I'm sad" — I mean what evidence or arguments should genuinely move me. Are there things already known that should change my mind? And be honest: is this view even falsifiable, or have I set it up so nothing could ever count against it? If its unfalsifiable, is that a problem for a view like this or is it just par for the course when you're talking about consciousness?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Software engineer, no philosophy background, interested in consciousness due to AI.
      *   **Current Position:** Illusionism/Behaviorism regarding non-human animals. Believes animals are "biological automata" (philosophical zombies). No "what it's like" to be them.
      *   **Rationale:** Behavior can be explained by complex RL agents; no need to posit inner life (parsimony).
      *   **Ethical Stance:** Treats pain behavior as morally relevant regardless of qualia (similar to caring about a screaming robot).
      *   **Core Question:** What would count against this view? What evidence/arguments should move me? Is it falsifiable? Is unfalsifiability a problem here?
      *   **Tone:** Honest, rigorous, not condescending, acknowledging the engineering mindset (parsimony, mechanism).

  2.  **Deconstruct the Philosophical Position:**
      *   The user is essentially advocating for **Animal Cartesianism** (animals are automata) mixed with **Illusionism** or **Eliminativism** about phenomenology, grounded in **Methodological Behaviorism**.
      *   This is a historically significant view (Descartes held it), but it's largely out of favor in contemporary philosophy of mind and neuroscience.
      *   The "Burden of Proof" claim is crucial. The user says the default is *no* consciousness. Most philosophers/scientists argue the default is *yes* (inference to the best explanation).

  3.  **Address the "What Counts Against This?" Question:**
      *   *Argument from Evolutionary Continuity:* If humans are conscious and share neural architecture with mammals, why draw the line at humans?
      *   *Neural Correlates of Consciousness (NCC):* Specific brain structures (thalamocortical system, etc.) are linked to experience in humans. Animals have homologous structures.
      *   *Self-Report (Proxy):* Animals can be trained to report uncertainty (metacognition). This suggests more than simple stimulus-response.
      *   *Pain Analgesia:* Animals self-administer painkillers. This suggests a negative *state* they want to escape, not just avoidance behavior.
      *   *The "Hard Problem" Flip:* The user thinks positing consciousness is unparsimonious. The counter-argument is that denying it creates more problems (solipsism, explaining why *we* think we're conscious).

  4.  **Address Falsifiability:**
      *   This is the trickiest part. The "Other Minds Problem" applies to *everyone*, not just animals.
      *   If the user says "Nothing counts against this," it's unfalsifiable.
      *   If the user admits "If an animal could talk and describe qualia, I'd change my mind," then it is falsifiable in principle, just not in practice.
      *   Is unfalsifiability a problem? Yes, it moves the view from science to metaphysics/faith. But consciousness *is* a metaphysical minefield. Need to be nuanced here.

  5.  **Address the Ethical Stance:**
      *   The user says they treat pain behavior as morally relevant anyway. This is good (reduces harm), but it's worth noting that *suffering* is usually the ground for moral status, not behavior. If there's no suffering, the moral urgency changes (though the user seems to grasp this).

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the position. It's not crazy; it's a version of Cartesian Mechanism + Illusionism. Acknowledge the engineering intuition (parsimony).
      *   *Section 1: The Falsifiability Check.* Be direct. If *no* evidence counts, it's dogma. If *some* evidence counts (e.g., verbal report), it's a scientific hypothesis. The "Other Minds" problem applies to humans too.
      *   *Section 2: Arguments That Should Move You.*
          *   **Evolutionary Continuity:** We didn't pop into existence with consciousness. It likely emerged gradually.
          *   **Neural Homology:** Same hardware (thalamocortical loops, neurotransmitters). If hardware X produces experience in humans, why not in dogs?
          *   **Metacognition:** Animals know what they don't know. This implies an internal model, not just RL.
          *   **The Parsimony Flip:** Denying consciousness requires a more complex explanation for *human* consciousness. Why are we different?
      *   *Section 3: The "Default" Assumption.* Challenge the idea that "no consciousness" is the null hypothesis. In medicine/science, we assume other humans are conscious. Why treat animals differently?
      *   *Section 4: The AI Analogy.* The user compares animals to RL agents. But we don't know if *advanced* RL agents might develop something like consciousness. The distinction might be less sharp than thought.
      *   *Conclusion:* Summarize. The view is defensible but costly. It requires accepting a magical discontinuity between humans and animals or accepting that human consciousness is also an illusion.

  7.  **Refining the Tone:**
