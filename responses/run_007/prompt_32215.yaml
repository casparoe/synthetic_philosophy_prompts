answer: |-
  # Seminar Reading: The Metaphysics of Forgetting
  **Text:** Jorge Luis Borges, "Funes the Memorious" (*Funes el memorioso*, 1942)
  **Topic:** Natural Kinds, Particularity, and the Ontology of Abstraction

  ## 1. Introduction: The Thought Experiment of Total Recall

  In the standard literature on natural kinds (NK), the debate is often framed as a conflict between *discovery* and *imposition*. Realists (e.g., Kripke, Putnam, Boyd, Ellis) argue that kinds like *gold*, *tiger*, or *water* reflect mind-independent structures, causal powers, or homeostatic property clusters. Anti-realists or conventionalists argue that kinds are pragmatic tools, cognitive shortcuts necessitated by our finite processing power to navigate a chaotic world.

  Borges's "Funes the Memorious" is frequently cited as a literary illustration of the latter: Funes cannot generalize, therefore generalization is a human limitation. But this reading is too shallow. Borges is not merely illustrating the utility of abstraction; he is dramatizing a metaphysical crisis. Funes does not just lack the *concept* of "dog"; he perceives a reality where the "dog" does not exist.

  This reading argues that Borges intervenes in the NK debate by challenging the metaphor of "carving nature at its joints." He suggests that "joints" are not found in the flesh of the world but are produced by the *act of cutting*—which is to say, by the act of ignoring. Funes's paralysis is not just an epistemic failure; it is an ontological revelation. He shows us that if we take particularity seriously enough, the "structure" realists defend dissolves into a flux of unique events.

  ## 2. Funes's Ontology: Radical Particularism

  Funes's post-accident perception is defined by an inability to tolerate the identity of indiscernibles. For the realist, the dog seen at 3:14 and the dog seen at 3:15 are tokens of the same type (*Canis familiaris*), bound by a shared essence or causal history. For Funes, they are distinct entities.

  > "He told me that in 1886 he had discovered a new system of enumeration... instead of seven thousand thirteen [he would say]... Maximo Perez; instead of seven thousand fourteen... The Railroad... He told me that this labor had absorbed all his nights."

  This is not merely a naming convention; it is a metaphysical stance. Funes lives in a world of **radical particulars**.
  *   **The Problem of Persistence:** For the NK realist, a natural kind persists through time and minor qualitative changes. A tiger is still a tiger if it loses a stripe or ages. Funes perceives time as a series of discrete, unconnected snapshots. The "dog" is not an enduring substance but a sequence of dog-stages that share no ontological bond other than our decision to link them.
  *   **The Rejection of Similarity:** Funes is bothered by the word "dog" because it implies that two distinct perceptions share a common property. For Funes, the profile view and the frontal view share *nothing* but a label.

  **Philosophical Intervention:** Standard NK realism assumes that similarity is objective. Borges suggests similarity is an *omission*. We see two things as similar only because we fail to notice the infinite differences between them. Funes notices the differences; therefore, he cannot see the similarity. This puts pressure on the realist claim that kinds are "out there." If the "out there" contains infinite detail, the "kind" is necessarily a reduction.

  ## 3. The Curse of Fidelity: Why Paralysis?

  If Funes perceives reality with higher fidelity than we do, why is he paralyzed? Why is his condition a "curse" rather than a superpower?

  > "To think is to forget a difference, to generalize, to abstract. In the overly replete world of Funes there were nothing but details."

  This is the crux of Borges's intervention. In the NK literature, the limitation of the human mind is often treated as an obstacle to truth. We need microscopes and particle accelerators to overcome our biological limits to see the *real* kinds. Borges inverts this: **Our biological limits are the condition of possibility for truth.**

  *   **Thinking as Falsification:** If thinking requires abstraction, and abstraction requires ignoring differences, then *thought is inherently a form of falsification*. To think about a "leaf" is to lie about the specific uniqueness of every leaf.
  *   **The Realist's Dilemma:** A defender of natural kinds must explain why a mind that perceives the world *more accurately* (Funes) is incapable of reasoning, while a mind that perceives it *less accurately* (us) can do science.
      *   *Realist Response:* Funes is overwhelmed by noise. Kinds are the signal.
      *   *Borges's Counter:* What if the "noise" is the reality, and the "signal" is the artifact? If the universe is fundamentally particular (as quantum mechanics sometimes suggests, or process metaphysics), then Funes is the only one seeing the universe as it is. We are the ones living in a simplified simulation.

  Funes is paralyzed because action requires prediction, and prediction requires assuming the future will resemble the past (Hume's problem of induction). Natural kinds are the engine of induction. If every moment is unique, no lesson can be learned from the past. Funes cannot think because he cannot treat the present as an instance of a past category.

  ## 4. Where Borges Presses the Realist Picture

  Borges dramatizes two specific problems that standard NK realism often glosses over:

  ### A. The Temporal Problem (The Heraclitean Flux)
  NK realists often treat kinds as timeless or enduring. *Water* is $H_2O$ regardless of when it exists. But Funes highlights the **temporal granularity** of objects.
  *   **The Pressure:** A "dog" is a spacetime worm. We treat it as a static noun. Funes treats it as a verb—a series of "dogging" events. If reality is fundamentally processual (as Whitehead or contemporary process metaphysicians argue), then "Natural Kinds" are static snapshots imposed on a dynamic flow. Borges forces the realist to admit that kinds are *stabilizations* of flux, not necessarily the fundamental furniture of the world.
  *   **The Intervention:** The story suggests that "identity" is a narrative construct, not a metaphysical given. The realist must account for *change* without relying on a static essence that Funes's perception renders invisible.

  ### B. The Problem of Relevance (The "So What?" Factor)
  Funes's numbering system (Maximo Perez for 7013) is logically consistent but pragmatically useless.
  *   **The Pressure:** Realists often appeal to the "success of science" as proof of NKs. Science works. But Borges asks: *Works for whom?* It works for finite beings who need to ignore 99% of available data to function.
  *   **The Intervention:** This pushes toward a **Pragmatic Realism** (like Richard Boyd's Homeostatic Property Clusters, but radicalized). Kinds are real *relative to a cognitive agent with specific goals*. They are not "mind-independent" in the strong sense. They are "mind-dependent" but "world-constrained." Funes shows that if you remove the "mind" (the filtering mechanism), the "kinds" vanish, leaving only a blooming, buzzing confusion.

  ## 5. Where the Pressure is Merely Apparent

  However, a sophisticated realist need not capitulate to Borges's particularism. There are limits to Funes's challenge.

  ### A. The Impossibility of Private Language
  Funes's system is private. He cannot communicate his "Maximo Perez" to others effectively because they cannot access his specific perceptual index.
  *   **The Defense:** Natural kinds are essentially *public* and *intersubjective*. They allow for coordination. If kinds were merely cognitive shortcuts, we would expect them to vary wildly between individuals. Instead, different cultures and scientists converge on similar kinds (e.g., folk biology converges on genus-level distinctions). This convergence suggests the "joints" are resistant to our whims, unlike Funes's arbitrary numbering.
  *   **Borges's Limit:** Funes is solipsistic. Science is collaborative. The fact that Funes cannot do science doesn't prove kinds aren't real; it proves that science requires a shared abstraction layer.

  ### B. Causal Powers vs. Perceptual Qualities
  Funes is obsessed with *perceptual* detail (the shape of the clouds, the veins of a leaf). Natural kind realism, however, is often about *hidden* structure (atomic number, DNA).
  *   **The Defense:** Funes sees the surface of the world in high definition, but he might still miss the deep structure. A "dog" is not just a visual pattern; it is a reproductive lineage. Even if Funes sees every visual difference, the causal history remains the same.
  *   **Borges's Limit:** Funes's condition is perceptual, not necessarily metaphysical. He might remember every visual detail, but does he deny that the dog at 3:14 causally produced the dog at 3:15? The story focuses on perception, but NK realism is often about causation. Borges conflates the two, which is a weakness in his metaphysical argument.

  ## 6. Conclusion: The Metaphysics of Attention

  Borges's story makes a unique intervention: it reframes the debate from **Ontology** (what exists) to **Attention** (what we select).

  Standard NK debates assume the world comes pre-segmented, and we argue about whether our segments match the world's. Borges suggests the world is a continuum (or a chaos of particulars), and "segments" are created by the *act of looking away*.

  *   **For the Seminar:** Use Funes to challenge the "Carving" metaphor. Carving implies the joint is already there. Borges suggests **Sculpting**: the form emerges only by removing the excess stone. The "Natural Kind" is the statue; the "Particulars" are the stone. You cannot have the statue without destroying the stone's original integrity.
  *   **The Verdict:** Funes does not disprove Natural Kind Realism, but he forces it to retreat from a "God's Eye View" to a "Human Eye View." He shows that if there *are* mind-independent kinds, they are inaccessible to a mind that does not filter. Therefore, the "Reality" of kinds is inextricably tied to the "Frailty" of the knower.

  **Discussion Question:** If thinking is "forgetting differences," as Borges claims, is scientific progress a movement toward *better* forgetting, rather than *better* seeing? Does the history of science show us grouping things together that look different (e.g., electricity and magnetism), suggesting that truth lies in *unification* (abstraction) rather than *differentiation* (particularity)? Funes suggests the latter is the truth of perception, but the former is the truth of explanation. Which metaphysics do we privilege?
