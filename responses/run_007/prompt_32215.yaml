      *   *Natural Kind Realism (e.g., Kripke, Putnam, Boyd, Ellis):* Kinds reflect mind-independent structures/causal powers/homeostatic property clusters. Science discovers them.
      *   *Nominalism/Constructivism:* Kinds are human tools for coping, language, or prediction.
      *   *The Twist:* Funes isn't just a nominalist; he's a *radical particularist*. He doesn't just deny kinds; he is overwhelmed by the sheer volume of particulars.
      *   *The "Curse":* Why can't he think? Thinking requires abstraction (Plato's *Theaetetus* echo in the story). If reality is *only* particulars, cognition is impossible.
      *   *The Intervention:* Borges suggests that "forgetting" (ignoring differences) is a constitutive part of *perceiving* structure, not just a limitation. Realism often assumes structure is "there" waiting to be seen. Borges suggests structure emerges through the *act* of ignoring.

  3.  **Structuring the Seminar Reading:**
      *   **Title:** Needs to be catchy and philosophical.
      *   **Introduction:** Set the stage (Funes vs. Natural Kinds). State the thesis (Borges challenges the ontology of forgetting).
      *   **Section 1: The Ontology of the Particular (Funes's World).** Describe his metaphysics. Radical nominalism?
      *   **Section 2: The Realist Counter-Attack (The Paralysis).** Why is he stuck? If kinds were real, shouldn't he see them *more* clearly? No, because seeing them requires *not* seeing the noise.
      *   **Section 3: Carving Joints vs. Blurring Edges.** The standard metaphor is "carving." Borges suggests "blurring" is the active ingredient.
      *   **Section 4: Where Borges Presses Realism.** The problem of time and change. A "dog" is a process. Funes sees the process; we see the snapshot. Is the "kind" a falsification?
      *   **Section 5: Where the Pressure is Apparent.** Science works. Funes can't do science. Does utility prove reality? (Pragmatic realism).
      *   **Conclusion:** Funes as a limit case. The metaphysics of attention.

  4.  **Drafting the Content - Key Philosophical Moves:**
      *   *Move 1: Forgetting as Constitutive.* Standard view: Forgetting is a loss of data. Borges: Forgetting is the gain of meaning. To call something a "dog" is to actively suppress the difference between the dog-now and the dog-then.
      *   *Move 2: The Temporal Dimension.* Natural kinds are often treated as timeless or enduring. Funes exposes the Heraclitean flux beneath the kind. A "dog" is a spacetime worm. Funes sees the slices; we see the worm. But Borges implies the worm is a fiction we impose on the slices.
      *   *Move 3: The Cost of Fidelity.* High fidelity = low usability. This challenges the idea that truth is simply correspondence. If perfect correspondence makes thought impossible, is "truth" a functional property?
      *   *Move 4: Intervention.* Most NK debates assume the mind *discovers* joints. Borges suggests the mind *creates* joints by smoothing over the roughness of reality. This leans towards a Kantian or Pragmatist view, but with a metaphysical sting: maybe the "roughness" is the reality, and the "joints" are the artifacts.

