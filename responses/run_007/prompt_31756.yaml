      *   **Key Defense 3: Exchangeability and Learning:** De Finetti's insight. Coherence + Exchangeability implies learning from experience.
      *   **Key Defense 4: Pragmatic/Decision-Theoretic Arguments:** Even if priors are subjective, bad priors lead to bad bets/decisions in the long run.
      *   **Pedagogical Advice:** How to present this in a lecture. Contrast with Objective Bayesianism and Frequentism. Use it as a teaching moment about the norms of scientific reasoning.

