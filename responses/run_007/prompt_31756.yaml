      *   I need to outline the standard defenses/responses given by Subjective Bayesians.

  3.  **Brainstorm Responses/Defenses:**
      *   *Convergence/Theorem:* The "Washing Out of Priors." As evidence accumulates, likelihoods dominate priors. (Bernstein-von Mises theorem, Savage's convergence).
      *   *Pragmatic Constraints:* Dutch Book arguments show incoherence is irrational, but maybe there are other pragmatic reasons to choose certain priors (e.g., simplicity, predictive success).
      *   *Reflection Principle:* Van Fraassen's constraint on how beliefs should change over time.
      *   *Exchangeability:* De Finetti's representation theorem. If you treat events as exchangeable, you act *as if* there is an objective chance.
      *   *Admission of Limitations:* Some Subjective Bayesians admit this is a feature, not a bug (it captures the underdetermination of theory by data).
