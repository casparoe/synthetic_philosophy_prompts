answer: |-
  ## The 15-Minute "Gricean Gut-Check" Procedure

  This procedure is based on the philosophical distinction between **what is said** (literal truth) and **what is implicated** (what a reasonable person infers). In ethics, lying is asserting what you believe to be false. Misleading is implying what you believe to be false while keeping your literal statement technically true. Both can be harmful, but they require different fixes.

  **Timebox:** 15 Minutes max. If you go over, you're overthinking or the copy is too complex.
  **Inputs:** The proposed copy, the actual functionality/term, and the context (screen/location).

  ### Phase 1: The Literal Layer (2 Minutes)
  *Goal: Filter out outright falsehoods.*

  1.  **Identify the core claim.** Strip away adjectives and marketing fluff. What is the factual assertion?
  2.  **Verify against the code/product.** Is the core claim factually false *right now*?
      *   *Example:* "Unlimited storage" when there is a 5GB cap.
  3.  **Decision:**
      *   **If False:** Verdict = **LIE**. Stop. **Recommendation: FLAG.** Do not ship. This is legal and ethical liability.
      *   **If True (or subjective opinion):** Move to Phase 2.

  ### Phase 2: The "Bus Test" Inference (5 Minutes)
  *Goal: Identify the pragmatic implication.*
  *Philosophy Note: This uses the "Reasonable Person" standard. Imagine a tired user reading this on a bus with bad signal.*

  4.  **What is the most obvious inference?** If a user reads this quickly, what will they believe is true after reading it? Write this down.
      *   *Example:* "Protect my data" $\rightarrow$ Inference: "My data is not shared."
  5.  **Is that inference false?** Compare the user's likely belief against reality.
      *   **If Inference is True:** Verdict = **CLEAN**. Stop. **Recommendation: DON'T-CARE.** Ship it.
      *   **If Inference is False:** Move to Phase 3. (You have identified a "Misleading" statement).

  ### Phase 3: Materiality & Harm (3 Minutes)
  *Goal: Determine if the deception matters.*
  *Philosophy Note: Not all falsehoods are immoral. "White lies" about trivialities are often ethically permissible. We care about material harm.*

  6.  **What is the cost of the false inference?** If the user acts on the false belief from Step 5, what do they lose?
      *   **Money?** (Unexpected charges, lost credits)
      *   **Privacy?** (Data shared they thought was private)
      *   **Functionality?** (Loss of access they expected to keep)
      *   **Time/Annoyance?** (Confusion, support tickets)
  7.  **Decision:**
      *   **If Money/Privacy/Functionality is lost:** Move to Phase 4.
      *   **If only Time/Annoyance (and minimal):** Verdict = **MISLEADING (LOW RISK)**. **Recommendation: DON'T-CARE (with monitoring).** Log a ticket to fix later, but don't block release. *This is your "let it through" valve.*

  ### Phase 4: Intent & Alternatives (5 Minutes)
  *Goal: Check for good faith.*
  *Philosophy Note: Deception requires intent. If you couldn't say it clearly without breaking the product, it's not malicious.*

  8.  **Is there a clearer way to say this?** Can you write a version that preserves the literal truth *and* corrects the false inference without ruining the UX (e.g., making a button unreadable)?
      *   **If No (Technical/Space constraint):** Verdict = **MISLEADING (CONSTRAINED)**. **Recommendation: HAND-OFF.** Escalate to Product Lead. This is a values call, not an engineering one.
      *   **If Yes (We just didn't want to):** Verdict = **MISLEADING (HIGH RISK)**. **Recommendation: REWRITE.** Do not ship the current version.

  ---

  ### Limitations & Hand-Offs
  *   **Where this misfires:** This procedure assumes you know the "Reasonable User." If your user base is vulnerable (e.g., financial distress, elderly), the "Bus Test" is too lenient.
  *   **The Values Hand-Off:** Phase 4, Step 8 is where engineering ends and product ethics begin. If clarity hurts conversion metrics, an engineer cannot decide if that trade-off is ethical. That belongs to the Product VP or Ethics Board.
  *   **Systemic Pressure:** If you flag everything as "HIGH RISK" and get overruled every time, the procedure isn't the problem; the company culture is.

  ---

  ## Case Studies

  Here is the procedure run on your three examples.

  ### Case 1: The Push Notification
  **Copy:** "Your free trial ends in 2 days — subscribe to keep budgeting."
  **Reality:** User keeps read-only access (viewing), but cannot edit/create budgets.

  *   **Phase 1 (Literal):** Is it false? "Budgeting" is an active verb meaning *to plan or allocate funds*. If you cannot edit numbers, you are not actively budgeting; you are *reviewing* or *archiving*.
      *   *Result:* Technically True. (Move to Phase 2).
  *   **Phase 2 (Inference):** What does the user infer? "If I don't pay, I lose access to my budgets/app."
      *   *Is inference false?* Yes, they keep access to the *data*, just not the *tools*.
      *   *Result:* Misleading. (Move to Phase 3).
  *   **Phase 3 (Materiality):** What is the cost? They lose the ability to *update* the budget. They do not lose their historical data or money.
      *   *Assessment:* This is a functionality loss, but it is the core definition of the paywall (free = view, paid = edit). The inference matches the business model's primary value prop.
      *   *Result:* Low Risk. (Stop).
  *   **Verdict:** **CLEAN** (with caveat).
  *   **Recommendation:** **DON'T-CARE.**
  *   **Reasoning:** While the inference is slightly off (they keep *access*), the core value of "budgeting" (active management) is accurately gated. Clarifying this ("subscribe to keep *editing*") adds friction for little ethical gain. This is the one you let through, but monitor support tickets for "I lost my data" complaints.

  ### Case 2: The Settings Screen
  **Copy:** "We never sell your data."
  **Reality:** Company shares data with a broker under a "partnership agreement" and receives payment.

  *   **Phase 1 (Literal):** Is it false? In legal and common parlance, exchanging data for payment (even via "partnership") constitutes a sale (see CCPA/CPRA definitions).
      *   *Result:* **FALSE.**
  *   **Phase 2 (Inference):** (Stop, Phase 1 failed).
  *   **Verdict:** **LIE.**
  *   **Recommendation:** **FLAG.**
  *   **Reasoning:** This fails the very first step. It is factually incorrect under most regulatory frameworks and common understanding. "Partnership" is a euphemism for "sale." This exposes the company to legal risk and violates user trust fundamentally. Do not ship.
      *   *Rewrite:* "We don't sell your data to third parties for advertising" (if true) or "See how we share data."

  ### Case 3: The Referral Prompt
  **Copy:** "Invite friends and you'll both get $10."
  **Reality:** Inviter gets $10 credit. Friend gets $10 *discount* off a paid month (requires credit card).

  *   **Phase 1 (Literal):** Is it false? "$10" is ambiguous. It could mean credit, cash, or discount. It is not *literally* false, but it is imprecise.
      *   *Result:* Technically True. (Move to Phase 2).
  *   **Phase 2 (Inference):** What does the user infer? "We both get $10 of value in our accounts."
      *   *Is inference false?* Yes. The friend must pay money to unlock the value. The inviter gets credit (which might also require a subscription to use, depending on terms).
      *   *Result:* Misleading. (Move to Phase 3).
  *   **Phase 3 (Materiality):** What is the cost? The friend is induced to sign up for a paid plan thinking they are getting free credit. This is a financial commitment based on a false premise.
      *   *Result:* High Risk (Money). (Move to Phase 4).
  *   **Phase 4 (Intent & Alternatives):** Is there a clearer way? Yes. "You get $10 credit, they get $10 off their first month."
      *   *Result:* Clear alternative exists.
  *   **Verdict:** **MISLEADING (HIGH RISK).**
  *   **Recommendation:** **REWRITE.**
  *   **Reasoning:** This creates a financial obligation for the friend based on an ambiguous promise. This is a classic "dark pattern." The ambiguity is likely intentional to boost conversion. Fix the copy to reflect the asymmetry.

  ---

  ### Summary for Your Release Meeting

  | Case | Verdict | Action | Why? |
  | :--- | :--- | :--- | :--- |
  | **1. Trial Notification** | **Clean** | **Ship** | "Budgeting" implies active management. Read-only is archiving. Harm is minimal. |
  | **2. Data Settings** | **Lie** | **Block** | Factually false. Payment for data = Sale. Legal/Ethical hard stop. |
  | **3. Referral** | **Misleading** | **Rewrite** | Financial commitment induced by ambiguity. Clear alternative exists. |

  **How to use this:**
  When you are in the review meeting, don't say "This feels gross." Say: *"I ran the Gricean Check. Case 2 fails Phase 1 (Literal Truth). Case 3 fails Phase 3 (Material Harm). Case 1 passes Phase 3. Here is the documented reasoning."* This moves the conversation from your "feelings" to a structured risk assessment.
