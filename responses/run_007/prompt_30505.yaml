answer: |-
  1. **Dissociability:** The account must explain how sensory-discriminative content can remain intact while affective-motivational badness is selectively abolished, as demonstrated by **pain asymbolia**.

  2. **Motivational Grip:** The account must explain why badness typically generates an immediate, non-optional reason to act, barring exceptional cases like **masochism or religious endurance**.

  3. **Damage Independence:** The account must explain why pain retains its badness even when it ceases to track actual tissue damage, as evidenced by **maladaptive chronic pain**.

  4. **Phenomenal Immediacy:** The account must explain why the badness is experienced as a property of the sensation itself rather than an external judgment, per **first-person introspection**.

  5. **Normative Authority:** The account must explain why pain's badness justifies intervention by others, even when the subject cannot act, as in **infant or non-verbal animal pain**.

  ***

  **Tension Flag:** **Desiderata 1 and 4 are likely in tension.** If badness can be surgically dissociated from the sensory content (1), it is difficult to maintain that the badness is phenomenally intrinsic to that very sensation (4); satisfying one often requires weakening the other (the Separatist vs. Non-Separatist debate).

  **Naive View Refutation:** **Desideratum 1 (Dissociability)** does the most work here. The naive view claims badness is constitutive of the sensation's qualitative character; asymbolia demonstrates that the character can persist without the badness, forcing any adequate theory to posit a structure more complex than simple sensory identity.
