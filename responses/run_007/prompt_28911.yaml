prompt: |-
  I'm teaching a second-year undergrad course on metaphysics and next week I need to cover presentism vs. eternalism in two fifty-minute lectures. The students have done some basic ontology — they know what it means to ask "what exists" and they've read a bit of McTaggart on the A-series and B-series, but that's it. I don't want to just present the two views and list arguments for each; I want to build the whole thing so that by the end they feel the pull of both positions and understand why it's a live debate rather than a semantic dispute. Plan the two lectures for me. What has to come first and what depends on what? I need one central example or thought experiment that carries through both sessions — something better than "dinosaurs exist in the past" which just begs the question. What misconceptions should I expect? I'm guessing they'll conflate presentism with skepticism about the external world, or think eternalism means fatalism, or assume the debate is just about the words "exists" and "real." Where in the sequence do I head each of those off? And what's a good check for understanding at the end — something that would tell me whether they've grasped the difference between the views rather than just memorized definitions? Lead with the bottom line: the core structure of the teaching sequence, and then walk me through the reasoning.
