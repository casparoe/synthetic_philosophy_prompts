answer: |-
  ### The Bottom Line: Core Structure

  **Central Thought Experiment:** **"The Breakfast Event."** (Specifically: *You ate toast for breakfast this morning.*)
  This example is immediate (unlike dinosaurs), involves agency (unlike rocks), and forces a confrontation between *experience* (it feels gone) and *truth* (it is definitely true). It carries through both lectures: Lecture 1 uses it to tackle **Truth and Existence** (Past); Lecture 2 uses it to tackle **Freedom and Change** (Future/Identity).

  **Sequence Logic:**
  1.  **Lecture 1 (Ontology & Truth):** You must establish *what* the views claim before asking *what they cost*. Start with the phenomenological pull of Presentism (how time feels), then use the "Breakfast Event" to show why Presentism struggles with **Truthmaking**. This forces Eternalism onto the table not as a weird alternative, but as a solution to a logical problem.
  2.  **Lecture 2 (Freedom & Stakes):** Once existence is established, you can ask about the *consequences*. Use the "Breakfast Event" (specifically the *choice* to eat toast) to tackle **Fatalism**. End with why this metaphysical distinction changes how we value emotions like regret and hope.

  **Misconception Management:**
  *   **Semantic Dispute:** Crush this in Lecture 1 using Truthmaker Theory (it's not about the word "exists," it's about what grounds truth).
  *   **Skepticism:** Address in Lecture 1 when defining Presentism (presentism accepts the external world, just not *past* parts of it).
  *   **Fatalism:** Address in Lecture 2 (Eternalism $\neq$ Causal Determinism).

  **Check for Understanding:** A "Diagnostic Scenario" where students must predict how a Presentist vs. Eternalist would answer a specific question about relations to the past, revealing if they grasp the ontological commitment rather than the label.

  ---

  ### Lecture 1: The Pull of the Present vs. The Demand for Truth
  **Goal:** Move students from "Presentism feels right" to "Presentism has a truth problem."

  **0:00–0:10 | Hook & Phenomenology (The Pull of Presentism)**
  *   **Recap McTaggart:** Briefly remind them: A-Series (past/present/future) vs. B-Series (earlier/later).
  *   **The Phenomenological Argument:** Ask them to close their eyes and visualize "next week." It's abstract. Now visualize "right now." It's vivid.
  *   **Define Presentism:** Only present things exist. The past is *gone*; the future is *not yet*.
  *   **Define Eternalism:** Past, present, and future things all exist equally (the "Block Universe"). "Now" is just an indexical like "here."
  *   **Misconception Alert (Skepticism):** Explicitly state: "Presentism is not skepticism. Presentists believe the external world is real. They just believe the *past* part of it has ceased to be. The table exists; the table-as-it-was-yesterday does not."

  **0:10–0:30 | The Central Example: "The Breakfast Event"**
  *   **The Proposition:** Write on the board: *"I ate toast for breakfast this morning."*
  *   **The Consensus:** Everyone agrees this proposition is **True**.
  *   **The Challenge:** What *makes* it true? (Introduce **Truthmaker Theory**: For every truth, there must be something in reality that grounds it).
  *   **The Presentist Dilemma:**
      *   The toast is gone. The eating event is gone.
      *   If only present things exist, what is the *truthmaker*?
      *   Is it a present memory? (No, memories can be false).
      *   Is it a present trace? (No, traces don't guarantee the event happened).
      *   *The Pull:* Presentism matches experience, but threatens to make past truths ungrounded.

  **0:30–0:45 | The Eternalist Solution & The Semantic Objection**
  *   **The Eternalist Move:** The event *Breakfast-at-8am* exists. It is located at a earlier temporal coordinate than *Now*. It doesn't need to be "present" to exist, just as Paris doesn't need to be "here" to exist.
  *   **Truthmaking Solved:** The truthmaker is the event itself, existing in the block.
  *   **Misconception Alert (Semantic Dispute):** Students will say: "You're just defining 'exists' differently."
      *   **Counter:** If it were semantic, there would be no cost. But Presentists have to invent complex logic to handle past truths (tensed properties), while Eternalists accept strange ontology (future events exist). Real debates have trade-offs.
      *   **Analogy:** It's not like arguing whether a "hotdog is a sandwich." It's like arguing whether "invisible particles" exist to explain heat. One view saves intuition; the other saves explanation.

  **0:45–0:50 | Transition to Lecture 2**
  *   **Tease:** "Eternalism saves truth, but it seems to kill hope. If my breakfast event exists eternally, does my *tomorrow's* breakfast exist too? And if it exists, can I choose it?"

  ---

  ### Lecture 2: The Cost of the Block (Freedom & Change)
  **Goal:** Show that Eternalism solves truth but creates anxiety about freedom, while Presentism saves freedom but costs truth.

  **0:00–0:10 | Recap & The Future Extension**
  *   **Recap:** Presentism = Real Flow, Hard Truth. Eternalism = Real Truth, Static Block.
  *   **Extend the Example:** "The Breakfast Event" wasn't just an occurrence; it was a **Choice**. You *decided* to eat toast.
  *   **The Future Proposition:** *"I will drink coffee tomorrow morning."*
  *   **The Eternalist Implication:** If Eternalism is true, the future event *Coffee-Drinking-Tomorrow* already exists in the block.

  **0:10–0:25 | The Fatalism Worry**
  *   **The Argument:**
      1.  If Eternalism is true, the future event exists.
      2.  If it exists, it is fixed (it can't be erased from the block).
      3.  If it is fixed, I cannot do otherwise.
      4.  Therefore, I have no free will.
  *   **Class Discussion:** Let them feel the anxiety. This is where Eternalism loses the room.
  *   **Misconception Alert (Fatalism vs. Determinism):** This is the crucial philosophical distinction.
      *   **Causal Determinism:** Prior causes *force* the effect.
      *   **Eternalist Fatalism:** The event's *existence* fixes it.
      *   **The Rebuttal:** Eternalism is compatible with *causal* freedom. Your choice is the cause of the event. The event exists *because* you choose it, not vice versa. The block contains your deliberation process.
      *   **Analogy:** A movie exists on a DVD (Eternalism), but the character still makes choices within the plot. (Note: Acknowledge this analogy is imperfect but helpful for the causal point).

  **0:25–0:40 | The Problem of Change (The "Real" Cost)**
  *   **Return to the Toast:** Did the toast *change* from unbitten to bitten?
  *   **Eternalist View:** No. There is a *Whole-Toast-Time-Slice* and a *Bitten-Toast-Time-Slice*. Neither changes; they just have different properties. This is **Perdurantism**.
  *   **Presentist View:** Yes. The *same object* lost the property of wholeness and gained the property of bitten-ness. This is **Endurantism**.
  *   **Why it Matters:** If Eternalism is true, "change" is an illusion of perspective (like a mountain looking different from different angles). If Presentism is true, change is real destruction and creation.
  *   **Emotional Stake:** Grief.
      *   Presentist: My grandmother is *gone*. (Real loss).
      *   Eternalist: My grandmother is *there*, at coordinate $t-50$-years. I just can't see her. (Loss is perspectival).
      *   Ask: Which comforts you more? Which is more honest?

  **0:40–0:50 | Check for Understanding: "The Diagnostic"**
  *   **Activity:** Hand out a slip with this scenario:
      > *Scenario:* Alice says, "I am taller than I was at age 5."
      > *Question:* Explain why an **Eternalist** must analyze this statement differently than a **Presentist**. Do not use the words "exists" or "real." Focus on **relations** and **objects**.
  *   **Desired Answer:**
      *   *Presentist:* One object (Alice) has two different properties at different times (Change).
      *   *Eternalist:* Two different temporal parts stand in a relation (Taller-Than). No single object changes properties.
  *   **Why this works:** It forces them to articulate the metaphysical machinery (Endurance vs. Perdurance) rather than memorizing "Presentism = Now."

  ---

  ### Reasoning Behind the Plan

  **1. Why "The Breakfast Event" instead of Dinosaurs?**
  Dinosaurs are too distant. Students can treat them as "fictional" or "abstract" without feeling the ontological weight. Breakfast is undeniable, recent, and involves *agency*. By making the past event something they *did* (chose toast), you bridge the gap between Ontology (Lecture 1) and Free Will (Lecture 2). It makes the metaphysics personal.

  **2. Why Truthmaking before Freedom?**
  If you start with Freedom/Fatalism, students get stuck on determinism (a separate debate). You need to establish *why* anyone would be an Eternalist first. The Truthmaker argument is the strongest positive argument for Eternalism. If they don't buy Eternalism in Lecture 1, Lecture 2's discussion of its costs is irrelevant. You must make them feel the *necessity* of Eternalism (to save truth) before you show them the *cost* (static freedom).

  **3. Addressing Misconceptions in Sequence**
  *   **Skepticism (Lec 1):** If you don't clear this up early, they will think Presentism denies the reality of the past *world*. You need them to understand Presentists believe in a real world, just a shrinking one.
  *   **Semantics (Lec 1):** This is the most common undergrad deflection ("It's just words"). Hitting this hard with Truthmaker Theory validates the debate as substantive.
  *   **Fatalism (Lec 2):** This naturally arises when discussing the future block. Distinguishing *ontological* fixity from *causal* compulsion is the key learning outcome for the second hour.

  **4. The Check for Understanding**
  Asking for definitions ("What is Presentism?") allows rote memorization. Asking them to analyze a **relation** ("taller than") forces them to simulate the metaphysical worldview. If they say "The Presentist says Alice changes," they get it. If they say "The Presentist says the past doesn't exist," they've missed the nuance of *change* vs. *existence*. This diagnostic tells you if they grasp the *structure* of the debate.
