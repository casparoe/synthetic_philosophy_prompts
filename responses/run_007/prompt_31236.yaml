      *   Core Intuition: Individuals are distinct entities; society is not a super-person.
      *   Common Ambiguities:
          1.  Metaphysical (Are persons distinct?)
          2.  Normative/Structural (Can we aggregate across persons?)
          3.  Compensatory (Can A's loss be offset by B's gain?)
