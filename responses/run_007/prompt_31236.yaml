          5.  Distributional (Does the *pattern* of distribution matter, not just the sum?)

  3.  **Drafting the Theses (The "Menu"):**

      *   *Thesis 1: The Metaphysical Claim.* Persons are numerically distinct consciousnesses.
          *   *Plausibility:* High (almost tautological).
          *   *Utilitarian Acceptance:* Yes (Bentham/Mill don't deny distinct minds).
          *   *Dialectical Work:* None. Utilitarianism doesn't claim society is a literal super-organism.
      *   *Thesis 2: The Aggregation Constraint.* It is illegitimate to sum utilities across different persons as if they were moments in one life.
          *   *Plausibility:* Controversial (core of the debate).
          *   *Utilitarian Acceptance:* No (this is the definition of classical utilitarianism).
          *   *Dialectical Work:* High. If true, it kills maximizing utilitarianism. But *why* is it true? Needs justification.
      *   *Thesis 3: The Non-Compensation Claim.* One person's sacrifice cannot be morally canceled by another's benefit.
