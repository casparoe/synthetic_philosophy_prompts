          *   *Dialectical Work:* High. Directly attacks trade-offs in healthcare (e.g., sacrificing one for many).
      *   *Thesis 4: The Distributive Constraint.* The *distribution* of welfare matters independently of the *sum*.
          *   *Plausibility:* Strong (egalitarian intuition).
          *   *Utilitarian Acceptance:* No (unless prioritarian/weighted).
          *   *Dialectical Work:* Moderate. Suggests utilitarianism is incomplete, not necessarily wrong.
      *   *Thesis 5: The Inviolability/Rights Claim.* Persons have side-constraints that cannot be overridden by aggregate good.
          *   *Plausibility:* Strong (deontological intuition).
