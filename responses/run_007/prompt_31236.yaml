      *   Need to distinguish between "classical utilitarianism" and "rule utilitarianism" or "indirect utilitarianism" which might accommodate some concerns.
      *   *Crucial Distinction:* Is the objection that utilitarianism *ignores* separateness (false) or that it *fails to give it moral weight* (true)?

  6.  **Developing the Verdicts & Confidence Levels:**
      *   *Metaphysical:* High confidence. Utilitarians accept distinct minds.
