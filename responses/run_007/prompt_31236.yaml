      *   *Rights/Constraints:* High confidence this conflicts with utilitarianism.
      *   *Least Sure:* The precise boundary between "aggregation is illegitimate" and "aggregation needs weighting." (Prioritarianism vs. Egalitarianism vs. Utilitarianism). I need to be careful not to conflate Prioritarianism with Utilitarianism here, but acknowledge the gray area. Actually, the *least sure* point is usually whether the "separateness" objection can be formulated without simply asserting deontology. I will mark the *justification* for the Aggregation Constraint as the area of least certainty regarding its independent plausibility.

  7.  **Structuring the Response:**
