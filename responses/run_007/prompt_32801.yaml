answer: |-
  Your hunch is correct: the stalemate arises because the debate conflates a metaphysical question with a methodological one. You are witnessing a disagreement about explanatory strategy disguised as a dispute over ontological boundaries.

  **The Structure of the Disagreement**

  Is this verbal, substantive, or conflated? It is best diagnosed as **methodologically substantive but metaphysically verbal.**

  It is metaphysically verbal because both sides agree on the non-normative facts: the causal chains, the behavioral outputs, the reliability of the notebook. When the internalist says, "The notebook isn't memory," and the externalist says, "It is," they are not disagreeing about the physics of the notebook or the neuroscience of Otto. They are disagreeing about the extension of the predicate "is cognitive." If "cognition" is defined by intrinsic biological mechanisms, the internalist wins by stipulation. If "cognition" is defined by functional role regardless of substrate, the externalist wins by stipulation. Since neither definition is empirically mandated, the metaphysical clash is merely terminological.

  However, the disagreement is methodologically substantive because the choice of definition dictates scientific practice. This addresses your second hunch about explanatory standards. The internalist insists on a **mechanistic explanation**: to count as cognitive, a process must be constituted by specific internal causal powers (e.g., neural processing). The externalist insists on a **functional explanation**: to count as cognitive, a process must play a specific role in guiding behavior, regardless of constitution.

  This is not a trivial semantic dispute. If you adopt the externalist definition, your models of memory must include environmental variables. If you adopt the internalist definition, your models must treat the environment as input/output boundaries. Thus, the debate is substantive regarding *how we do science*, even if it is verbal regarding *what we call things*.

  **Natural Kind vs. Functional Role**

  Your intuition about "natural kinds" is pivotal. The internalist treats cognition as a natural kind akin to "digestion" or "photosynthesis"—processes defined by their biological constitution. You wouldn't say a pill digests food outside the stomach; similarly, they argue, a notebook doesn't remember outside the brain.

  The externalist treats cognition as a functional kind akin to "computation" or "valuation"—processes defined by what they *do*. A calculator computes whether it is made of silicon or gears; similarly, they argue, Otto remembers whether the storage is neural or paper.

  The stalemate persists because both sides are correct within their own explanatory frameworks. There is no empirical fact that can settle whether cognition *ought* to be carved at the joints of biology or function.

  **What Counts as Progress?**

  Given this diagnosis, an experiment cannot resolve the debate. You cannot run a scan to see if the notebook is "really" part of the mind, because "mind" is not a magnetic natural kind waiting to be discovered. Similarly, a formal result will not help; the logic of the Parity Principle is valid, but its soundness depends on the premise of functionalism, which the internalist rejects.

  Progress requires a **change of question**. The group should stop asking, "Where does the mind stop?" and start asking, "Where does the explanation break?"

  1.  **Pragmatic Criteria:** Progress looks like establishing criteria for when extension is *useful*. Does treating the notebook as cognitive yield better predictions about Otto's behavior than treating it as a tool? Does it suggest new interventions? If extending the boundary adds complexity without explanatory gain, the internalist framework is pragmatically superior for that case. If ignoring the notebook leads to predictive failure, the externalist framework wins.
  2.  **Gradient Coupling:** Instead of a binary "in/out" distinction, progress involves modeling the *degree of coupling*. How reliable is the access? How transparent is the tool? This shifts the debate from a metaphysical cliff-edge to a measurable continuum of integration.
  3.  **Dissolution:** The most significant progress would be recognizing that "cognition" is a placeholder for a cluster of capacities (memory, processing, retrieval) that may not share a single boundary. Memory might extend while processing does not. Disaggregating the "mind" into specific capacities often dissolves the parity principle's blunt force.

  **Will the Debate Run Forever?**

  If framed metaphysically ("Is it *really* mind?"), yes, it will run forever. It is a dispute over linguistic intuition and ontological commitment without a truth-maker.

  If framed pragmatically ("Which framework yields better science?"), it can resolve. We should expect the debate to fragment into specific domains: extended *memory* might be accepted while extended *consciousness* is rejected. The "Extended Mind" is not a single thesis but a research heuristic.

  To move your group forward, propose a moratorium on the word "mind." Ask each side to justify their boundary not by appeal to intuition, but by appeal to explanatory power. If the internalist cannot explain why excluding the notebook improves their model, or the externalist cannot show how including it generates new predictions, the debate is merely scholastic. The goal is not to find the mind's edge, but to find the explanation's limit.
