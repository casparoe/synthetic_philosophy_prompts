      *   Okay, so JC is basically saying: "I don't know $E$ is true. I just know my confidence in $E$ shifted from 0.5 to 0.8." In ML, we call this soft evidence. We implement this by clamping a node's marginal or adding a likelihood ratio.
      *   The "Rigidity" condition means the CPDs stay the same.
      *   The debate about reduction is: "Is this soft evidence just a hard observation of a meta-variable?" In ML, we usually just add a node. Does that node represent reality or just our uncertainty?
      *   Order dependence: If I update Node A then Node B vs Node B then Node A, do I get the same posterior? In standard belief propagation with hard evidence, yes. With soft evidence, it depends on how you combine them. If you treat them as independent likelihoods, order doesn't matter. But JC implies a specific sequential update rule that *does* care about order. Why? Because the second update uses the *posterior* of the first as its prior.

  5.  **Refining the Translation (Addressing the "Fudge" factors):**
      *   *Virtual Evidence vs. JC:* In BNs, "Virtual Evidence" (Pearl's method) usually involves adding a node $V$ with $P(V|E)$. This is mathematically equivalent to likelihood ratios. JC is slightly different; it specifies the *marginal* $P_{new}(E)$ directly.
      *   *Equivalence:* To make JC look like Virtual Evidence, you have to construct a likelihood function that *would have produced* that marginal. This is the "fudge." JC says "Here is the new marginal." Virtual Evidence says "Here is a likelihood function that *causes* a new marginal."
