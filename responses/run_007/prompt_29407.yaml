prompt: |-
  I've been trying to read some philosophy of probability on the side, and I keep running into Jeffrey conditionalization as the standard story about how to update when your evidence isn't certain. I'm an ML engineer — I work mostly with Bayesian networks and probabilistic programming (Stan, Pyro, that sort of thing), and I'm comfortable with likelihood weighting, virtual evidence, and the usual tricks for soft observations. From what I can tell, Jeffrey's idea is that instead of conditioning on an observation you're certain of, you shift your probabilities over some partition of possibilities and then reweight your old conditional probabilities by the new partition weights, keeping the conditionals themselves fixed. There's also a side debate about whether this is a genuinely new kind of update or whether it can always be rewritten as ordinary conditioning on some higher-order proposition about your own credences, plus a worry about what fixes the partition in the first place. I've also seen people claim that two Jeffrey updates in a row can give different results depending on the order you apply them, which ordinary conditioning doesn't do.

  Restate Jeffrey conditionalization and this debate in the vocabulary I actually use — posterior updates, soft evidence, virtual evidence nodes, likelihood ratios, generative models, maybe variational approximations — as faithfully as you can. Then give me the residue report: which parts map cleanly onto things I already do (my hunch is that a Jeffrey update is just what I call virtual evidence, and the reduction debate is really about whether a virtual evidence node is a modeling convenience or a claim about what you actually learned), which parts you had to fudge to fit, and which parts of the philosophers' debate have no counterpart in my toolkit at all. I want to know wether the philosophers are arguing about something my framework is blind to, or whether it's just a wordier description of a soft-evidence update I already know how to do.
