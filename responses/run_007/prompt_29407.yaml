      *   It's not *just* wordiness. ML frameworks treat soft evidence as a *given input* (a likelihood function or a clamped distribution). They don't model the *process* that generated that input.
      *   Philosophers care about the *normative* rule: "If your experience shifts your confidence in $E$ to $p$, how *should* you update?"
      *   ML cares about the *computational* result: "Given this likelihood ratio, what is the posterior?"
