      *   *The "Reduction" Debate:* Can JC be reduced to standard Conditioning (SC) on a proposition like "My probability for $E_i$ is now $p_i$"?
      *   *Order Dependence:* Sequential JC updates are order-dependent (non-commutative), unlike SC.

  3.  **Translate to ML Vocabulary:**
      *   *Partition $\{E_i\}$:* A discrete latent variable or an observed node with uncertain state.
      *   *$P_{old}(H | E_i)$:* The structural dependencies in the graphical model (CPDs).
      *   *$P_{new}(E_i)$:* The "soft evidence" or "virtual evidence" distribution applied to the node.
      *   *Rigidity:* The assumption that the likelihood function $P(Data | Parameters)$ or the CPD structure doesn't change, only the belief over the node's state changes.
      *   *Virtual Evidence:* In BNs, this is often implemented by adding a child node with a likelihood ratio table that forces the parent distribution to shift without hard-clamping.
      *   *Likelihood Weighting:* A sampling method, but conceptually related to reweighting based on evidence.
      *   *Variational Inference (VI):* Minimizing KL divergence subject to constraints. JC looks like an information projection (I-projection).

