          *   *Refinement:* I need to make sure the procedure doesn't just say "ask a philosopher." It needs to give *guidance* on how to decide, while flagging where the guidance runs out.

      *   *Philosophical Stance:* I need to pick a working theory for the procedure, otherwise, it's paralysed. The *Psychological Continuity View* is the standard for clinical ethics (what matters is the person's mind), but the *Biological View* is the legal default (death of the organism). A hybrid approach is best for regulation: Biological continuity is the baseline, Psychological continuity is the modifier.
      *   *Actually, for this specific prompt:* The prompt asks to distinguish between "therapeutic intervention" vs "life-ending procedure." This implies the stakes are legal/moral status. I should lean towards a *Continuity of Consciousness* model, as that's what patients care about, but acknowledge the Biological view.
      *   *Decision:* I will structure it around "Continuity Metrics."

  4.  **Addressing Specific Hard Cases:**
      *   *Superior Units:* If I become smarter, am I me? (Locke). Procedure needs to distinguish between *capacity* enhancement and *content* alteration.
      *   *70% Replacement:* Sorites paradox. Need a threshold or a reliance on the *rate* of change.
      *   *Single Session:* Discontinuity of function? Even if instant, if the state is copied, is it me?
      *   *Unconscious/Dementia:* Cannot rely on first-person reports. Must rely on third-person psychological continuity markers.
      *   *Remote Substrate:* This is the killer. If the signal moves to a cloud, is it the same person? (Teletransportation paradox).

  5.  **Developing the Worked Examples:**
      *   *Example 1 (Clear):* Cochlear nucleus. Small scale, functional restoration, same skull. Easy pass.
      *   *Example 2 (Uncomfortable):* "Mind Uploading" or "Total Synthetic Cortex." Let's go with a "Total Gradual Replacement" where the patient feels fine, but the procedure flags it as risky due to the *nature* of the substrate or the *potential* for branching. Or better: A "Remote Substrate" case where the patient walks out (virtually) but the procedure flags it as death because biological continuity is broken. Let's choose the *Remote Substrate* case. It triggers the "Teletransportation" intuition which often classifies this as death despite psychological continuity.

  6.  **Developing the Limitations Section:**
      *   What does this procedure assume? (Psychological continuity matters more than matter).
