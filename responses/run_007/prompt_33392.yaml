      *   **Role:** Philosopher specialising in personal identity and metaphysics of mind, consulting for a clinical ethics body.
      *   **Task:** Create a decision procedure for the "Neural Interventions Authority" (NIA) to classify neural replacement therapies as either (a) identity-preserving (standard consent) or (b) identity-terminating (stringent life-ending framework).
