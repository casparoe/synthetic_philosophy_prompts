answer: |-
  This is an excellent objection. In fact, you have independently reconstructed one of the most famous and serious critiques of the Extended Mind Thesis (EMT). Philosophers like Fred Adams and Ken Aizawa have made careers out of arguing exactly what you just argued: that EMT leads to "cognitive bloat" or absurd overlaps.

  You aren't missing how the Parity Principle works; you are correctly identifying its most counter-intuitive consequences. However, proponents of EMT (like Andy Clark and David Chalmers) don't view these consequences as a *reductio ad absurdum* (a proof that the theory is false because it leads to absurdity). They view them as **features, not bugs.**

  Here is how an EMT proponent would respond to your two specific scenarios, and why they don't think it breaks the theory.

  ### 1. The Sticky Note and the Roommate
  **Your Objection:** If the note is part of your mind, and your roommate reads it, they are literally reading your mind. That seems absurd.

  **The EMT Response:**
  This objection relies on a traditional, Cartesian definition of "mind" as a private, inner theater where only you have access. EMT explicitly rejects that definition.

  *   **Functional vs. Private:** EMT argues that "mind" is defined by *function*, not privacy. If the sticky note functions as memory for you, it is part of your cognitive system. When your roommate reads it, are they accessing your cognitive system? **Yes.** Are they accessing your "private qualia" or your "soul"? **No.**
  *   **The Loop Matters:** The note is only part of *your* mind when it is engaged in *your* cognitive loop. It is reliably available to *you*, you trust *it*, and you automatically endorse the information.
      *   When you look at the note, it is **Mind (You + Note)**.
      *   When your roommate looks at the note, it is **Mind (Roommate + Note)**.
  *   **Is it Mind-Reading?** In a trivial sense, yes. If I look at your notebook, I am accessing your extended memory. But we already accept this in normal language. If I look at the notes you took in class, I say, "I'm looking at your notes," not "I'm looking at your mind." EMT just asks us to take that literally. They argue there is no magical barrier at your skin that stops cognition from leaking out.

  ### 2. The Shared Google Doc (Overlapping Minds)
  **Your Objection:** If we both use the same doc, does it become part of both our minds? Can two minds overlap?

  **The EMT Response:**
  This is where the theory gets radical. Andy Clark and others actually say: **Yes, cognitive systems can overlap.**

  *   **Transactive Memory:** Psychologists have long acknowledged "transactive memory systems" (e.g., in a marriage, one partner remembers dates, the other remembers directions). EMT just takes this further. If you and your study partner rely on the Google Doc as a shared external hard drive for your joint project, then regarding *that project*, you form a **distributed cognitive system**.
  *   **Not Total Overlap:** This doesn't mean *you* are *your partner*. It doesn't mean you feel their pain or taste their food. It means the *vehicle* of cognition for a specific task is shared.
  *   **The "System" Boundary:** EMT suggests we should stop thinking of "The Mind" as a noun (a thing inside your head) and start thinking of it as a verb or a process (a activity of solving problems).
      *   Task: Remember Project Deadline.
      *   System Required: You + Partner + Google Doc.
      *   In this specific context, the boundary of the "cognitive agent" is the group, not the individual.

  ### 3. Is this a *Reductio ad Absurdum*?
  You asked if this proves the theory wrong. That depends on what you think a theory is supposed to do.

  **The Critic's View (Adams & Aizawa):**
  They argue you are right. They call this the **Coupling-Constitution Fallacy**. Just because two things are *coupled* (you and the notebook) doesn't mean they *constitute* a single system (the notebook is part of the mind). They argue that cognition requires specific intrinsic properties (like neural plasticity) that notebooks and Google Docs don't have. To them, your roommate example proves EMT is false because it blurs the distinction between *using* a tool and *being* the tool.

  **The Proponent's View (Clark & Chalmers):**
  They argue your intuition of "absurdity" is just a bias. We *feel* it's absurd because we are deeply attached to the idea that skin and skull are sacred boundaries.
  *   **Analogy:** When telescopes were invented, some astronomers argued, "If I look through this tube, am I seeing the sky with my eye? No, I'm using a tool." But eventually, we accepted that the "observational system" includes the telescope.
  *   **Explanatory Power:** Clark argues that EMT is useful. If we want to understand how you solve a math problem, and we ignore the paper you wrote the numbers on, we can't explain how you solved it. Therefore, for the purpose of explanation, the paper *must* be included in the system.

  ### The Verdict
  You aren't missing anything about the mechanics. You are hitting the exact friction point between **Internalism** (mind is in the head) and **Externalism** (mind spills out).

  *   If you believe "mind" implies **privacy and individuality**, then EMT is absurd, and your roommate example is a successful *reductio*.
  *   If you believe "mind" implies **functional problem solving**, then EMT holds up, and the "absurdity" is just us realizing that our boundaries are leakier than we thought.

  Most contemporary philosophers of mind land somewhere in the middle. They might accept that tools are *functionally* integrated but hesitate to say they are *ontologically* part of the mind (i.e., "The notebook is literally a belief").

  So, is it a *reductio*? Only if you think the "absurdity" of overlapping minds is impossible. If you think overlapping minds is just a weird fact about how humans use technology, then EMT survives.
