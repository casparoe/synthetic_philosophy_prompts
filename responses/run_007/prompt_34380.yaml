          *   *Decision:* Evan wins on decision-theoretic coherence. Mira's position makes credence less useful. If you bet 1:2 odds (acting like 1/3) but claim 1/2 credence, you're redefining credence.

      *   **Round 4: The Law of Total Probability (Monday Information).**
