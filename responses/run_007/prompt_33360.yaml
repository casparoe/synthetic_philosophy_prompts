answer: |-
  Your friend is advancing a sophisticated version of the "multiple selves" model, often associated with economists like Thomas Schelling or philosophers like Derek Parfit. It is a powerful heuristic, but your suspicion is well-founded: the analogy is doing metaphysical heavy lifting that it cannot support. By treating temporal stages as distinct agents, it dissolves the very phenomenon it tries to explain (agency) rather than explaining it.

  Here is the explicit layout of the analogy, the breakdown of where it fails, and an evaluation of whether your friend's deflationary conclusion survives.

  ### 1. The Explicit Mapping: Negotiation vs. Akrasia

  Your friend's argument relies on mapping a **Interpersonal Negotiation** onto an **Intrapersonal Choice**. Here is the correspondence:

  | Feature | Interpersonal Negotiation (Two People) | Akratic Choice (Two Selves) |
  | :--- | :--- | :--- |
  | **Parties** | Person A and Person B | Present Self ($t_1$) and Future Self ($t_2$) |
  | **Location** | Physical separation (different bodies) | Temporal separation (different moments) |
  | **Interest** | A wants profit now; B wants security later | $t_1$ wants pleasure now; $t_2$ wants health later |
  | **Power Dynamic** | A has leverage; B is absent/weak | $t_1$ controls the limbs; $t_2$ is helpless |
  | **Valuation** | A discounts B's utility | $t_1$ hyperbolically discounts $t_2$'s utility |
  | **Conflict** | Zero-sum resource allocation | Trade-off between gratification and cost |
  | **Resolution** | Contract or Coercion | Commitment Device (e.g., locking away cigarettes) |
  | **Failure** | Deal breaks down or is unfair | Akrasia (weakness of will) |

  In this model, "willpower" is treated as a mythical attempt by Person A to care about Person B's interests without a contract. Since Person A is rational and self-interested, they won't do it. Therefore, only a "contract" (commitment device) works.

  ### 2. Where the Mapping Breaks (Disanalogies)

  To evaluate the argument, we must distinguish between disanalogies that are merely metaphorical (harmless) and those that undermine the logic (critical).

  #### Harmless Disanalogies
  *   **Physical Continuity:** Obviously, the Present Self and Future Self share a body, whereas negotiating parties do not. This is a surface-level difference. Your friend would argue this is irrelevant; the *psychological* discontinuity is what matters.
  *   **Legal Standing:** The Future Self cannot sign a contract or sue the Present Self. This is true, but commitment devices (like Ulysses tying himself to the mast) act as functional substitutes for legal contracts.

  #### Critical Disanalogies (The Argument Killers)
  These are the points where the analogy fails to support the conclusion that willpower is impossible or illusory.

  **A. Phenomenological Unity (The "Who Feels the Pain?" Problem)**
  *   *Negotiation:* If Person A smokes Person B's cigarettes, Person B feels the loss, but Person A feels the satisfaction. They are distinct loci of experience.
  *   *Akrasia:* When the Future Self suffers the hangover or the lung cancer, it is experienced by the *same consciousness* that enjoyed the drink or the smoke. Memory connects them.
  *   *Why it matters:* In a negotiation, altruism is optional. In a single life, self-interest *includes* the future because the future pain is *my* pain. The friend's model assumes the Present Self cannot care about the Future Self's pain. But empirically, we often do feel anticipatory regret or anxiety *now* about future costs. That anxiety is the Future Self "voting" in the present.

  **B. Access to Motivation (The "Black Box" Problem)**
  *   *Negotiation:* Person A must guess Person B's preferences. Information is asymmetric.
  *   *Akrasia:* The Present Self has direct introspective access to the values of the Future Self. I *know* I will want to be healthy tomorrow. I don't have to guess; I remember wanting it yesterday and I project wanting it tomorrow.
  *   *Why it matters:* If I know Future Me's preferences, ignoring them isn't just a bargaining failure; it's an irrationality within a single system. It allows for the possibility of *alignment* through reasoning, not just coercion through commitment devices.

  **C. Normative Hierarchy (The "Which Self is Real?" Problem)**
  *   *Negotiation:* Person A and Person B have equal moral standing. Neither is "more correct" than the other.
  *   *Akrasia:* We do not treat Present Self and Future Self as equals. We treat the long-term perspective as *more authoritative*. When someone says, "I was weak," they mean they betrayed their own deeper values for a shallow impulse.
  *   *Why it matters:* Your friend's model treats the craving for a cigarette and the desire for health as equal preferences of different entities. But agency requires ranking preferences. If all preferences are equal, there is no "weakness," only change. Akrasia implies a failure to act on a *higher-order* preference. The negotiation model flattens this hierarchy.

  **D. Control of the Mechanism (The "Puppeteer" Problem)**
  *   *Negotiation:* Person A cannot directly move Person B's hands.
  *   *Akrasia:* The Present Self and Future Self operate the same motor functions. The "vote" the Future Self lacks is actually the ability to control the muscles *now*. But the Present Self *has* control of the muscles *now*.
  *   *Why it matters:* Willpower is the Present Self using its control over the muscles to satisfy the Future Self's interest. The friend argues this is impossible because the Present Self won't do it. But people *do* do it. To say they aren't exercising willpower but rather "submitting to a different self" is a semantic trick that ignores the phenomenology of effort.

  ### 3. Does the Deflationary Conclusion Survive?

  **Verdict: No.** The analogy was carrying the whole argument.

  Your friend's conclusion is that akrasia is *nothing over and above* steep intertemporal discounting between successive selves, and therefore willpower is a myth.

  Once the critical disanalogies are on the table, this conclusion collapses for two reasons:

  1.  **It Confuses Explanation with Dissolution:** Hyperbolic discounting explains the *pressure* toward akrasia, but not the *normative failure*. Akrasia is defined as acting against one's better judgment. If I judge that health is better than smoking, but I smoke, I have failed my own standard of rationality. Your friend redefines the situation so that "health" is just Future Self's preference and "smoking" is Present Self's preference. Since neither is objectively "better," no failure occurred. This solves the problem by defining it out of existence. It denies the unity of agency required to call it *my* failure.
  2.  **It Ignores Preference Plasticity:** In a negotiation between strangers, preferences are fixed. In a single mind, preferences are malleable. "Willpower" and "character" are essentially technologies for modifying the Present Self's discount rate. By cultivating habits, the Present Self learns to derive satisfaction from acting in the Future Self's interest. If selves were truly distinct, character building would be impossible (you can't train a stranger to be you). Since character *does* change behavior over time, the selves must be continuous enough to be trained.

  Your friend is right that commitment devices are *effective*, but wrong that they are the *only* remedy. They are a crutch for when willpower fails, not proof that willpower is impossible.

  ### 4. A Better Analogy: The Self as a Polity

  If the "Two Selves" analogy is like two nations trading, a better analogy for weakness of will is **The Self as a Political Union over Time.**

  *   **The Mapping:** Imagine a nation (The Self) that persists through decades. It has a Constitution (Core Values/Character), a Current Administration (Present Self), and Future Administrations (Future Selves).
  *   **The Conflict:** The Current Administration is tempted to deficit-spend (smoke/scroll) to boost immediate approval ratings, knowing it will burden Future Administrations with debt (health costs).
  *   **Why it's better:**
      1.  **Continuity:** It acknowledges that despite changing administrations, it is the *same nation*. The debt is owed by the country, not a stranger.
      2.  **Governance:** It allows for internal mechanisms of control. The Current Administration can be checked by the Constitution (willpower/character) or by binding laws (commitment devices).
      3.  **Normative Hierarchy:** It recognizes that some actions are "unconstitutional." Deficit spending might be legal, but it violates the long-term stability of the state. Weakness of will is the Administration violating the Constitution for short-term gain.
      4.  **Agency:** It preserves the idea of *self-governance*. A nation can reform its institutions (build character) so that future Administrations are less likely to deficit-spend, without needing external locks and keys.

  **Conclusion for your argument:**
  Tell your friend that the "Distinct Selves" model is a useful *economic* description of the pressure we feel, but a terrible *philosophical* description of the agent. It explains why the temptation is hard, but it cannot explain why we feel guilt, why we can build character, or why we recognize the future interest as *our own*. Akrasia is not a war between strangers; it is a civil war within a single state. You can sign treaties (commitment devices), but you can also reform the government (willpower). Denying the latter is giving up on the very idea of being a person.
