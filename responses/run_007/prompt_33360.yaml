      *   **Friend's Argument:** Akrasia isn't a failure of agency/self-governance. It's a conflict between distinct "temporal selves" (Present Self vs. Future Self). Present Self values immediate reward highly (hyperbolic discounting); Future Self bears the cost but has no vote. Remedy: Commitment devices, not willpower.
