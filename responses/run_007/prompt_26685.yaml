  ok so i'm trying to get my metaontology straight before i write a term paper and i want someone to poke holes in my position set. here's where i'm at:

  (1) a lot of ontological disputes — like whether there are tables or only particles arranged tablewise, or whether numbers exist — are merely verbal. the two sides are using "exists" differently and talking past each other.

  (2) i'm drawn to something like hirsch's quantifier variance: there are multiple equally legitimate meanings of the existential quantifier, and none is metaphysically privileged. which one we use is a matter of convention or practical convenience.

  (3) but i also think nihilism about composite objects is false and so is universalism. common sense is basically right: tables and chairs exist, but there's no object composed of my left ear and the moon.

  (4) when physicists argue about whether electrons "really exist" or are just useful fictions, i think that's a substantive dispute, not a merely verbal one.

  (5) i definitely don't want to say all philosophical disputes are verbal. the debate about whether consciousness is physical is genuinely substantive.

  (6) i think the test for whether a dispute is merely verbal is: if the parties clarify what they each mean by the key terms, the disagreement should disappear — there should be nothing left to fight about.

  i'm worried some of these pull against each other but i can't quite locate where. can you go through them and tell me which pairs are in tension, how severe each tension is, and which ones only look like they're in tension but aren't really? rank them by severity and for each genuine tension say what the cheapest fix would be. lead with the bottom line in your first sentence and then give the reasoning — no preamble, no restating the question.
