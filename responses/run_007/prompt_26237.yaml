prompt: |-
  Okay so I've gotten myself into a bit of a situation. A few months ago I was at a party and somehow ended up in one of those conversations where you're three drinks in and someone says "but could you have been born a different person?" and suddenly it's 2am and you're googling David Lewis on your phone. I got kind of obsessed. I've been reading about possible worlds and modal realism and all of it, and I mentioned this to a friend who runs a philosophy reading group for interested non-specialists — mostly people with humanities backgrounds but no formal philosophy training. And now, because I opened my mouth, I'm supposed to lead the session on counterpart theory vs. transworld identity next month.

  The group has already done one session on possible worlds talk in general — they get the basic idea that "necessarily P" means "P in all possible worlds" and "possibly P" means "P in some possible world." They've also read the first few sections of Lewis's "Counterpart Theory and Quantified Modal Logic" but most of them found it pretty opaque. They're smart but they're not going to read the primary texts closely; they rely on the discussion to make things click.

  Here's what I need from you, acting as an expert philosophy teacher who's taught this material before: a teaching plan for a 75-minute session. Don't explain the material to me — I think I understand it, or at least I understand it well enough to be dangerous. What I need is the architecture of the explanation. What has to go first, and why? What's the one example or case that should carry the whole thing — and what does it need to have and what must it not have? (I was thinking of using "I could have been a plumber" but maybe that's got problems I'm not seeing.) What misconceptions are they going to walk in with, and which ones will they form halfway through, and at exactly what point in the sequence should I head each one off? I'm especially worried about the sci-fi reading of possible worlds — people thinking we're talking about parallel universes you could hop between — and also about the intuition that counterpart theory is just a cheap verbal trick that changes the subject. And I need a check for understanding at the end: one question or exercise that would tell me whether they actually got the distinction or just nodded along.

  Oh, and please flag anything I should openly refuse to explain at this level — things where going deeper would just confuse everyone. I'd rather say "we're not going there tonight" than give a garbled half-answer. Please think through this carefully — I need the dependancy structure and the misconception map, not just a list of topics. And write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** A non-specialist who got obsessed with modal realism after a party conversation. Now leading a philosophy reading group (humanities background, no formal training).
      *   **Task:** Create a 75-minute teaching plan for a session on *Counterpart Theory vs. Transworld Identity*.
      *   **Constraints:**
          *   Do *not* explain the material to the user (they claim to understand it).
          *   Focus on the *architecture* of the explanation (sequence, dependencies).
          *   Identify the *central example/case* (evaluate "I could have been a plumber").
          *   Map *misconceptions* (entry, mid-session, exit) and when to address them.
          *   Address specific worries: Sci-fi parallel universes, "verbal trick" objection.
          *   Provide a *check for understanding* (end of session).
          *   Flag topics to *avoid/refuse* (too deep/confusing).
          *   Tone: Expert philosophy teacher, American English.

  2.  **Deconstruct the Material (Counterpart Theory vs. Transworld Identity):**
      *   *Core Problem:* How do we make sense of de re modal claims ("I could have been F")?
      *   *Option A (Transworld Identity):* I exist in multiple worlds. I am literally identical to myself in world W1 and world W2.
      *   *Option B (Counterpart Theory - Lewis):* I exist only here. My "counterpart" in W2 is similar enough to me to represent what I *could* have been.
      *   *Motivation for CT:* Avoids problems of accidental intrinsics (being 6ft here and 5ft there) and haecceitism (what makes *me* me across worlds?).
      *   *Objections to CT:* It changes the subject (I care about *me*, not some similar guy). It makes modal logic weird (contingent identity issues).

  3.  **Determine the Architecture (Sequence):**
      *   *Start:* Re-anchor the "Possible Worlds" concept from the previous session. Move from *de dicto* to *de re*.
      *   *Middle 1:* The Problem of Transworld Identity (The "Humphrey" Problem). Why is literal identity across worlds weird?
      *   *Middle 2:* Introduce Counterpart Theory as the solution.
      *   *Middle 3:* Address the "Verbal Trick" objection immediately.
      *   *End:* Check for understanding.

  4.  **Evaluate the Central Example ("I could have been a plumber"):**
      *   *Pros:* Relatable, clear modal claim.
      *   *Cons:* Too simple. Doesn't trigger the metaphysical tension. Being a plumber doesn't change intrinsic physical properties enough to make the "two places at once" problem vivid.
      *   *Better Example:* Needs to involve conflicting intrinsic properties. "I am 6ft tall" vs. "I could have been 5ft tall." Or "I have five fingers" vs. "I could have had six."
      *   *Decision:* Use "The Height Case" (or similar intrinsic property) as the engine, but keep "The Plumber" as the warm-up. Actually, Lewis's "Humphrey" example is famous for a reason, but it's about winning/losing. Let's stick with intrinsic properties for the metaphysical crunch. Let's go with *The Tall/Short Case*. It forces the question: How can *one object* have two heights?

  5.  **Map Misconceptions:**
      *   *Entry:* Sci-fi multiverse (travel between worlds). *Fix:* Emphasize causal isolation immediately.
      *   *Mid-Session:* "Counterparts are just clones." *Fix:* Emphasize the *relation* is context-dependent, not genetic.
      *   *Mid-Session:* "This is just semantics." *Fix:* Show the logical cost of Transworld Identity (Leibniz's Law violations).
      *   *Exit:* "So I don't matter in other worlds." *Fix:* Clarify that *truth conditions* for modal claims are preserved, just the ontology differs.

  6.  **Drafting the Plan - Section by Section:**

      *   **Introduction (10 mins):** Review Possible Worlds. Kill the Sci-Fi notion. Define *De Re* modality.
      *   **The Problem (20 mins):** Transworld Identity. Use the Intrinsic Property example. Show the contradiction (Leibniz's Law).
      *   **The Solution (20 mins):** Counterpart Theory. Define the C-relation. Show how it solves the contradiction.
      *   **The Pushback (15 mins):** The "So What?" objection. Humphrey doesn't care. Why does this matter?
      *   **Conclusion/Check (10 mins):** The exercise.

  7.  **Refining the "Check for Understanding":**
      *   Needs to distinguish between "I am there" vs. "My counterpart is there."
      *   Scenario: A world where I never existed. Do I have a counterpart? (Tricky).
      *   Better Scenario: Twin Earth style. Two exact duplicates in *one* world. How does CT handle that vs. TWI?
      *   Best Scenario: A specific modal claim translation. "I could have been taller." Translate this into CT language vs. TWI language. If they say "There is a world where I am taller," they failed. If they say "There is a world where a counterpart of me is taller," they passed.

  8.  **Identifying "Do Not Go There" Topics:**
      *   Formal quantified modal logic syntax (barcan formulas, etc.).
      *   The detailed semantics of the counterpart relation (similarity metrics).
      *   Haecceitism deep dive (keep it to "thisness").
      *   Essentialism debates (Kripke vs. Lewis) beyond what's needed for the core distinction.

  9.  **Review against Constraints:**
      *   American English? Yes.
      *   No explaining material to user? Yes, focus on pedagogy.
      *   Dependency structure? Yes.
      *   Misconception map? Yes.

  10. **Final Polish:** Ensure the tone is supportive but authoritative (like a senior colleague advising a junior instructor). Make sure the timing adds up to 75 mins. (10+20+20+15+10 = 75).

      *(Self-Correction during drafting)*: I initially thought about using the "Plumber" example. The prompt asks me to evaluate it. I should explicitly advise *against* relying solely on it because it's too extrinsic. I'll recommend swapping to an intrinsic property case for the heavy lifting.

      *(Self-Correction on Misconceptions)*: The "Verbal Trick" objection is the hardest. I need to make sure the plan addresses *why* Lewis thinks TWI is logically broken, not just that CT is an alternative. It's about saving Leibniz's Law.

      *(Self-Correction on Check)*: The translation exercise is good. Let's make it concrete. "Necessarily, I am human." How does CT handle this? (All counterparts are human). How does TWI handle this? (I am human in all worlds).

      *(Final check on tone)*: Keep it practical. "Here's how you run the room."

  11. **Final Output Generation** (incorporating all the above thoughts).
answer: |-
  Here is a teaching architecture designed for a 75-minute session. It prioritizes conceptual friction over historical exposition. Since your group is humanities-trained, they will respond better to the *consequences* of the theories than the formal logic.

  ### Session Architecture: The "Humphrey" Problem and the Cost of Identity

  **Total Time:** 75 Minutes
  **Goal:** Participants should be able to articulate *why* Lewis rejects transworld identity and what theoretical cost counterpart theory extracts in exchange.

  ---

  ### Phase 1: Setup and Sanitization (10 Minutes)
  **Objective:** Secure the ontology. Kill the Sci-Fi reading immediately.

  1.  **The Recap (5 mins):** Briefly restate the "Possible Worlds" consensus from the last session.
      *   *Necessarily P* = P is true in all worlds.
      *   *Possibly P* = P is true in at least one world.
  2.  **The Sanitization (5 mins):** You must explicitly block the "Parallel Universe" intuition.
      *   **Say this:** "In science fiction, you can step through a portal and meet yourself. In Lewis's metaphysics, worlds are causally isolated. You cannot go there. You are world-bound."
      *   **Why:** If they think travel is possible, they will think Transworld Identity is obvious. You need them to feel the tension of *how* we refer to other worlds if we can't visit them.

  ### Phase 2: The Problem of Transworld Identity (20 Minutes)
  **Objective:** Generate the metaphysical crisis that necessitates Counterpart Theory.

  1.  **The Shift to *De Re* (5 mins):** Move from "It is possible that a coin lands heads" to " *I* could have caught that coin." We are talking about *objects* having properties in other worlds.
  2.  **The Central Example (15 mins):** **Discard "The Plumber."**
      *   **Why:** Being a plumber is an extrinsic/career property. It doesn't create a logical contradiction for one object to be a plumber in W1 and a philosopher in W2.
      *   **Use This Instead:** **The Height Case.**
      *   **Scenario:** "I am 6 feet tall. But I could have been 5'10"."
      *   **The Trap:** Ask the group: "If Transworld Identity is true, and *I* am literally in World B, do I have two different heights?"
      *   **The Conflict:** If they say "Yes, relative to each world," press them on **Leibniz's Law** (The Indiscernibility of Identicals). If Object X in World A is *identical* to Object Y in World B, they must share all properties. Height is an intrinsic property. One object cannot be 6ft and 5'10" simultaneously without contradiction.
      *   **Dependency:** This must happen *before* you introduce Counterpart Theory. They need to feel the pain of Transworld Identity first.

  ### Phase 3: Counterpart Theory as the Solution (20 Minutes)
  **Objective:** Show how CT resolves the contradiction by changing the subject of the modal claim.

  1.  **The Mechanism (10 mins):**
      *   Explain that on Lewis's view, you are world-bound. You exist only here.
      *   In World B, there is a *counterpart*. This person is not you. They are merely *counterpart-related* to you (based on similarity of qualities and causal history).
      *   **Resolution:** "I could have been 5'10"" translates to "There exists a world where a *counterpart* of me is 5'10"."
      *   **Result:** No contradiction. You are 6ft here. Counterpart is 5'10" there. Two different objects, two different heights. Leibniz's Law is safe.
  2.  **The Contextuality of Counterparts (10 mins):**
      *   **Crucial Nuance:** The counterpart relation is vague and context-dependent.
      *   **Example:** In a conversation about genetics, your counterpart might be someone with your DNA. In a conversation about psychology, it might be someone with your memories.
      *   **Why:** This prevents the "Clone" misconception. It's not about exact duplication; it's about which similarities matter in the current conversational context.

  ### Phase 4: The "Verbal Trick" Objection (15 Minutes)
  **Objective:** Address the intuition that CT is a cheat. This is where the group will push back hardest.

  1.  **The Objection (5 mins):**
      *   Voice their thought: "When I say 'I could have been taller,' I care about *me*. I don't care about some similar guy in another universe. Lewis is changing the subject."
      *   This is the famous "Humphrey Objection" (Kripke). Humphrey doesn't care that a counterpart wins the election; he cares if *he* wins.
  2.  **The Defense (10 mins):**
      *   Don't try to prove Lewis is "right." Instead, frame it as a **Trade-Off**.
      *   **Option A (Transworld Identity):** Saves the intuition ("It's really me") but breaks the logic (violates Leibniz's Law, requires haecceities/"thisness" to track me across worlds).
      *   **Option B (Counterpart Theory):** Saves the logic (clean ontology, no contradictions) but costs the intuition (it's not literally *me*).
      *   **Teaching Point:** Make sure they understand that Lewis admits this cost. He thinks the logical clarity is worth the intuitive loss. This stops them from thinking he just "didn't get it."

  ### Phase 5: Check for Understanding (10 Minutes)
  **Objective:** Distinguish between nodding along and grasping the ontological commitment.

  **The Exercise: "The Translation Test"**
  Write the following sentence on the board:
  > *"Necessarily, I am a human being."*

  Ask them to translate this sentence into **Counterpart Theory language**.

  *   **Fail Answer:** "In all possible worlds, I am a human being." (This is Transworld Identity. It implies *you* are in those worlds.)
  *   **Pass Answer:** "In all possible worlds, every *counterpart* of me is a human being." (This acknowledges you are only here, but your representatives elsewhere are all human.)
  *   **Bonus Distinction:** Ask: "Does Counterpart Theory allow for a world where I don't exist?"
      *   *Answer:* Yes. A world where nothing is similar enough to you to count as a counterpart. (Under Transworld Identity, if you exist necessarily, you must be in every world. CT handles contingent existence more naturally).

  ---

  ### Misconception Map

  | Timing | Misconception | Why it forms | Intervention Point |
  | :--- | :--- | :--- | :--- |
  | **Entry** | **The Sci-Fi Multiverse:** "I can travel to these worlds." | Pop culture usage of "possible worlds." | **Phase 1:** Explicitly state causal isolation. |
  | **Mid-Session** | **The Clone Problem:** "Counterparts are just genetic duplicates." | Assuming similarity = identical DNA. | **Phase 3:** Emphasize *contextual* similarity (psychological vs. physical). |
  | **Mid-Session** | **The Logic Gap:** "Why can't I just have different properties in different worlds?" | Confusing *objects* with *stages* or *time-slices*. | **Phase 2:** Hammer Leibniz's Law during the Height Case. |
  | **Exit** | **The "So What?":** "This is just semantics." | Thinking CT and TWI yield the same truth values (they often do). | **Phase 4:** Frame it as an ontological trade-off, not a semantic one. |

  ---

  ### Topics to Refuse (The "Do Not Go There" List)

  You will be tempted to go deeper. Do not. If a participant asks about these, write them on a "Parking Lot" board and say, *"That requires a separate session on formal logic/metaphysics, and if we go there now, we lose the core distinction."*

  1.  **The Formal Syntax of Quantified Modal Logic:** Do not write out formulas like $\Box \forall x (Fx)$. Keep it in English. The logic is the *motivation*, not the lesson.
  2.  **Haecceitism:** You can mention "thisness" briefly in Phase 4, but do not define it technically. It's a rabbit hole of individuation that will stall the session.
  3.  **The Metric of Similarity:** Participants will ask, "How similar is similar enough?"
      *   **Refusal:** "Lewis leaves this vague on purpose because our modal talk is vague. Defining a precise metric would break the theory's flexibility."
  4.  **Kripke's Rigid Designators:** This is the main rival theory. Mention Kripke only as the source of the "Humphrey Objection." Do not try to teach Rigid Designation; it requires its own 75 minutes.

  ### Final Advice for the Instructor

  You mentioned you understand the material "well enough to be dangerous." The danger zone is **over-explaining the motivation.**

  You know *why* Lewis did this (to save extensionalism, to avoid modal essentialism). Your group does not care about saving extensionalism. They care about *themselves* across possibilities.

  Anchor everything in the **Height Case**. If they get stuck, return to: *"If it is literally you in the other world, how can you be two different heights? If it's not you, why do you care?"*

  If you keep that tension alive for 75 minutes, you will have succeeded.
