answer: |-
  This is primarily a verbal and normative dispute about the function of moral criticism rather than a factual one, and it resolves only when you separate the objective validity of a claim from the social standing required to enforce it.

  Logically, the side arguing against hypocrisy is correct: the truth of a statement is independent of the speaker, making the "you too" response a formal logical fallacy known as *tu quoque*. If stealing is wrong, it remains wrong even if the accuser is a thief, so regarding the factual status of the act, the hypocrite's credibility is irrelevant. However, the side arguing for standing is also correct in a social context because moral criticism often functions as enforcement rather than mere observation. When someone says "you don't get to judge," they rarely mean "your statement is false"; they mean "you lack the moral authority to punish or shame me," and in matters of enforcement, integrity is a prerequisite for legitimacy.

  The argument loops forever because both sides are talking past each other using the word "judge" to mean two different things. One side is debating *truth* (is the act wrong?), while the other is debating *status* (do you have the right to condemn?). Your hunch about bedrock intuitions is partially right—people viscerally value either consistency or truth—but the deadlock is sustained by this conceptual equivocation. To move forward, you must interrupt the pattern by asking a meta-question: "Are we trying to establish if the act was harmful, or are we debating whether you have the standing to shame me?" If the goal is correction, hypocrisy is irrelevant; if the goal is punishment or moral leadership, hypocrisy is fatal. Once the group agrees on which game they are playing, the disagreement usually dissolves.
