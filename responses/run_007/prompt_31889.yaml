          *   Dilemma: Distinctness relies on either (a) relational properties or (b) haecceities (primitive thisness).
          *   Horn (a): If relational properties distinguish them, then in a one-sphere universe, we could posit multiple coincident spheres (since they'd share all relations too). This leads to arbitrary counting (1 vs. 2 vs. 17).
          *   Horn (b): If haecceities distinguish them, counting is again arbitrary/unknowable qualitatively.
          *   Conclusion: Since we *can* count objects, Black's spheres must be *one* object (which contradicts the setup that they are apart).
