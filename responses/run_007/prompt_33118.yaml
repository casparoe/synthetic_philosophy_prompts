answer: |-
  The tension you identify lies at the heart of contemporary space law: the friction between the prohibition of sovereignty (Article II of the Outer Space Treaty, or OST) and the permission of exploitation (Section 10 of the Artemis Accords). To render the extraction and sale of lunar resources coherent without violating the ban on national appropriation, the Artemis Accords presuppose a specific, hybridised theory of property and justice. It is a framework that distinguishes sharply between *territorial sovereignty* and *resource ownership*, relying on a Grotian conception of the domain mixed with a neoliberal interpretation of Lockean acquisition.

  ### The Implicit Theory of Property: A Grotian-Lockean Hybrid

  The philosophical work in the Accords is done by separating the *locus* (the celestial body) from the *object* (the extracted resource).

  **1. The Domain as *Res Communis* (Grotian)**
  Regarding the Moon itself, the Accords adopt a Grotian view derived from *Mare Liberum* (The Free Sea). Hugo Grotius argued that the oceans could not be owned because they were inexhaustible and meant for the common use of mankind. Similarly, the Accords treat celestial bodies as *res communis*: a global commons where no state may assert sovereignty. This satisfies Article II of the OST. Under this view, the 'place' remains unowned; it is a jurisdiction-free zone where national law does not extend territorially.

  **2. Acquisition via Labour and Investment (Lockean/Neoliberal)**
  Regarding the resources, the Accords pivot to a Lockean labour-mixing theory, albeit modified. John Locke argued that mixing one's labour with unowned nature generates a property right. The Accords operationalise this by asserting that the act of extraction transforms a common resource into private property. However, this is not pure Lockeanism. Locke's theory includes the 'proviso' that there must be 'enough and as good' left for others. The Accords largely ignore this ecological or distributive proviso, favouring a neoliberal justification: property rights are necessary to incentivise the capital investment required for extraction.

  **3. Exclusion without Sovereignty (The 'Safety Zone')**
  You rightly note the problem of exclusionary control. If I sell lunar ice, I must prevent others from taking *my* ice. The Accords solve this through Section 11, which allows for 'Safety Zones'. Philosophically, this is the most contentious element. It creates a *sui generis* right: a limited, functional exclusion that 'walks and talks' like property without being labelled sovereignty. It presupposes a theory of justice based on **harm prevention** rather than **territorial right**. You do not own the ground; you merely possess a right to operate without 'harmful interference'. This shifts the justification from 'ownership of land' to 'security of operation'.

  In sum, the Accords presuppose a **utilitarian-liberal theory of property**. Justice is served not by equitable distribution, but by legal certainty that allows private actors to convert common resources into private goods through labour and technology, provided they do not claim the territory itself.

  ### Philosophical Underdetermination

  Is this practice philosophically underdetermined? Yes. The OST is sufficiently vague that it does not mandate the Artemis interpretation. The phrase 'national appropriation' prohibits states from claiming sovereignty, but it does not explicitly clarify the status of *private* property rights over resources once removed from the ground.

  Consequently, rival theories of property could license space activity differently. The current regime is not the only coherent interpretation; it is a political choice favouring market accessibility over distributive justice. A **Common Heritage of Mankind (CHM)** regime, as outlined in the 1979 Moon Agreement (which few spacefaring nations have ratified), offers a robust rival theory.

  Under a CHM framework, space resources are not merely *res communis* (free for the taking) but are held in trust for all humanity. Ownership is not triggered merely by extraction. Instead, the regime presupposes a **distributive theory of justice**, where the value of the commons belongs collectively, and individual exploitation is permitted only under an international regulatory framework that ensures benefit-sharing.

  ### Policy Implications of a Rival Theory

  If the Artemis Accords were rebuilt upon a Common Heritage of Mankind theory rather than the current Grotian-Lockean hybrid, several fundamental changes would be required:

  1.  **Abolition of Unilateral Safety Zones:** The current Accords allow states to define safety zones unilaterally, notifying the UN Secretary-General. A CHM regime would require these zones to be allocated by an international body (similar to the International Seabed Authority) to prevent *de facto* territorial control by the first arriver.
  2.  **Mandatory Benefit-Sharing:** The Accords currently contain no mechanism for sharing profits or technology with non-spacefaring nations. A CHM-based policy would mandate a royalty system or technology transfer regime, ensuring that the economic value extracted from the lunar commons is distributed globally, particularly to developing states.
  3.  **Regulatory Oversight:** Currently, the Accords rely on self-regulation and bilateral interoperability. A rival theory would necessitate a multilateral licensing authority. Private entities could not simply extract under national law (like the US Space Act of 2015); they would require a licence from an international regime that assesses environmental impact and economic equity.
  4.  **Rejection of 'First Come, First Served':** The implicit priority rule in the Accords favours those with the current technological capacity to arrive first. A CHM regime would likely impose equitable allocation criteria, potentially reserving prime resource sites for future use by other nations or limiting the volume any single entity could extract.

  ### Conclusion

  The Artemis Accords resolve the tension with the Outer Space Treaty by adopting a philosophical distinction between the *domain* (which remains a Grotian commons) and the *resource* (which becomes Lockean property upon extraction). This renders the practice coherent by redefining exclusionary control as 'harm prevention' rather than 'sovereignty'. However, this is philosophically underdetermined. It privileges a market-oriented, utilitarian view of justice over a distributive, egalitarian one. To shift to a Common Heritage regime would require dismantling the unilateral mechanisms of the Accords and replacing them with a multilateral structure focused on equity rather than merely on the security of investment.
