prompt: |-
  My department has a working group on population ethics that's been going in circles on the procreation asymmetry for two semesters. The two camps: one side thinks the asymmetry is a genuine moral datum that any adequate population axiology has to accomodate — roughly, that there's a strong reason not to bring a miserable person into existence but no corresponding reason to bring a happy person into existence, and that this isn't just some quirk of our psychology we can debunk away. The other side thinks the asymmetry collapses under pressure: it's either a scope confusion between person-affecting and impersonal reasons, or it entails antinatalism and should be rejected as a reductio, or it can't even be stated without smuggling in an equivocation on "good for." Both sides have read the same papers and are sick of talking past each other.

  I want you to draft the adversarial-collaboration document they should have produced by now. It should have:

  - A numbered list of claims both sides can sign — about the structure of the asymmetry, about what it does and doesn't commit one to, about what the key test cases are that any account has to handle.
  - A disagreements table: the precise points where they still differ, with each side's view stated in wording that side would actually endorse (not a caricature).
  - The cruxes: the sub-questions where settling them would actually move at least one side. For each crux, include a concrete case or thought experiment that both sides agree bears on it, and state what each side predicts about that case.
  - If any part of the disagreement is merely verbal, flag it and say why.

  Be as precise as you can about the formulations. The goal is a document both sides could put their names to without feeling misrepresented, even if neither has changed their mind. Don't adjudicate — just map the terrain.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial-collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** A university department working group on population ethics has been stuck on the Procreation Asymmetry for two semesters.
      *   **The Parties:**
          *   *Camp A (Asymmetrists):* Believe the asymmetry is a genuine moral datum (reason not to create miserable people, no corresponding reason to create happy people). Not just psychological.
          *   *Camp B (Symmetrists/Skeptics):* Believe the asymmetry collapses (scope confusion, entails antinatalism/reductio, equivocation on "good for").
      *   **The Task:** Draft an "adversarial-collaboration document" they *should* have produced.
      *   **Requirements:**
          1.  Numbered list of agreed claims (structure, commitments, test cases).
          2.  Disagreements table (precise points of difference, endorsed wording).
          3.  Cruxes (sub-questions that would move sides, concrete cases/thought experiments, predictions).
          4.  Verbal dispute flagging (if applicable).
      *   **Tone/Style:** Precise, neutral, map the terrain, no adjudication, high philosophical rigor suitable for a department working group.

  2.  **Deconstruct the Procreation Asymmetry:**
      *   *Core Intuition:* We have a duty not to create a child who would suffer greatly (Parfit's "Misery Case"). We do *not* have a duty to create a child who would be very happy (Parfit's "Happy Child Case").
      *   *Camp A (Asymmetrists):* Often lean towards Person-Affecting Views (PAV) or Non-Identity Problem solutions that privilege existence-affecting reasons differently. Might support Narveson, McMahan, or specific versions of Critical-Level Utilitarianism.
      *   *Camp B (Symmetrists):* Often lean towards Total Utilitarianism, Average Utilitarianism, or Wide Person-Affecting Views. They see the asymmetry as inconsistent with standard aggregative principles or leading to the Repugnant Conclusion/Antinatalism.
      *   *Key Literature:* Parfit (*Reasons and Persons*), Benatar (*Better Never to Have Been* - though Camp A might distance themselves from his antinatalism), McMahan (*The Ethics of Killing*), Arrhenius (Population Ethics impossibility theorems).

  3.  **Drafting Section 1: Agreed Claims (Common Ground):**
      *   Need to establish definitions so they aren't talking past each other.
      *   Define the Asymmetry clearly.
      *   Agree on what it *doesn't* mean (e.g., it doesn't mean existing miserable people don't matter).
      *   Agree on key test cases (Misery vs. Happy).
      *   Agree on the stakes (it affects population axiology).
      *   *Drafting thought:* Make sure Camp B can sign this without admitting the asymmetry is *true*, just that it's the *phenomenon* under discussion. Camp A needs to agree it's not just about existing people.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the *why* of the disagreement.
      *   *Point 1: Ontological Status.* Is it a fundamental intuition or a derivative error?
      *   *Point 2: The "Reason" Concept.* Is the reason to create happy people absent or just outweighed/deferred? Camp A says absent. Camp B says present (impersonal) but perhaps overridden by autonomy, or simply that Camp A is misdescribing it.
      *   *Point 3: Antinatalism Entailment.* Camp B says Asymmetry $\to$ Antinatalism (Benatar). Camp A says No, there's a relevant difference between harm and benefit.
      *   *Point 4: Person-Affecting Restriction.* Camp A relies on it. Camp B thinks it's the source of the confusion.

  5.  **Drafting Section 3: Cruxes (The "Move the Needle" Section):**
      *   This is the hardest part. What would actually change minds?
      *   *Crux 1: The "No Difference" Case.* If the person exists anyway, does the reason change? (Tests Person-Affecting vs. Impersonal).
      *   *Crux 2: The Scale Case.* If we create a million happy people vs. one. Does quantity create a duty? (Tests Scope).
      *   *Crux 3: The "Good For" Equivocation.* Is "good for" comparative or non-comparative?
      *   *Need concrete predictions:* Camp A predicts intuition holds. Camp B predicts intuition shifts or reveals inconsistency.

  6.  **Drafting Section 4: Verbal Disputes:**
      *   Is "Reason" being used differently? (Normative force vs. Pro tanto).
      *   Is "Existence" being treated as a benefit or a precondition?
      *   Flag the "Comparative vs. Non-Comparative Harm" distinction. This is usually the biggest verbal snag.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it neutral? Yes.
      *   *Check Precision:* Are the philosophical terms used correctly (pro tanto, impersonal, person-affecting)?
      *   *Check Constraints:* Did I include all four required sections? Yes.
      *   *Self-Correction on Camp B:* Make sure Camp B's view isn't just "Total Utilitarianism." They might be "Wide Person-Affecting" or "Impersonal Total." Keep it broad enough for the skeptic camp to sign.
      *   *Self-Correction on Camp A:* Ensure they aren't boxed into Benatar's strong antinatalism. Many asymmetrists reject antinatalism (e.g., McMahan).
      *   *Refining the Cruxes:* Ensure the thought experiments are standard enough to be recognized but specific enough to yield different predictions. The "Magic Button" case is usually good.

  8.  **Final Polish:** Organize with clear headings. Add a preamble setting the context. Ensure the "Sign-off" section exists to mimic a real document. (Proceed to generate output based on these thoughts).

  *(Self-Correction during drafting)*: I need to be careful with the "Antinatalism" claim. Camp A will vehemently deny the asymmetry *entails* antinatalism. Camp B claims it *does* (via Benatar). The disagreement table needs to reflect this specific clash: "Does accepting the asymmetry logically compel one to accept that coming into existence is always a harm?" Camp A: No. Camp B: Yes, or at least it makes it very hard to avoid.

  *(Refining the Verbal Dispute)*: The biggest verbal dispute is usually about "Harm." Is harm requiring a baseline of non-existence? Camp A says yes (comparative). Camp B says existence can be a benefit (non-comparative or wide comparative). I should flag the "Baseline Problem."

  9.  **Final Output Generation** (incorporating the above structure).
answer: |-
  **WORKING GROUP ON POPULATION ETHICS: ADVERSARIAL COLLABORATION MEMORANDUM**
  **Subject:** The Procreation Asymmetry (Parfit's Asymmetry)
  **Date:** October 26, 2023
  **Status:** Draft for Review and Sign-off

  ### Preamble
  This document maps the dialectical terrain regarding the Procreation Asymmetry. It is not intended to resolve the dispute but to isolate the precise points of contention and agreement between the **Asymmetrists** (those who hold the asymmetry is a robust moral datum) and the **Symmetrists** (those who hold the asymmetry is illusory, confused, or untenable). Both sides agree that current discourse has suffered from definitional drift and uncharitable reconstruction. The goal of this document is to enable productive disagreement.

  ---

  ### I. Agreed Claims (Common Ground)
  *Both sides endorse the following propositions. Signing this section indicates agreement that these are the rules of engagement, not necessarily agreement on the truth of the asymmetry itself.*

  1.  **Definition of the Asymmetry:** We agree to define the "Procreation Asymmetry" as the conjunction of two claims:
      *   (A) There is a strong moral reason (often decisive) *not* to bring into existence a person who would have a life not worth living (miserable).
      *   (B) There is no corresponding moral reason *to* bring into existence a person who would have a life worth living (happy), even if that life would be very good.
  2.  **Scope of Application:** Both sides agree this principle applies specifically to *possible* persons whose existence depends on the choice in question (the Non-Identity context), distinct from duties owed to *existing* persons.
  3.  **Not Antinatalism *Per Se*:** Both sides agree that accepting (A) does not logically entail global antinatalism (the view that one should never procreate) unless combined with further premises about the inevitability of suffering. Asymmetrists deny their view entails antinatalism; Symmetrists agree this is a distinct claim, though they may argue it is difficult to hold the Asymmetry without sliding toward it.
  4.  **Test Cases:** Both sides agree that any adequate population axiology must provide a verdict on the following two cases:
      *   *The Misery Case:* A couple can conceive a child who will suffer severe, unremitting pain and die young, or they can refrain.
      *   *The Happy Child Case:* A couple can conceive a child who will have a wonderfully happy life, or they can refrain (remaining childless).
  5.  **Normative Force:** Both sides agree that if there is a reason to create happy people, it is at least *pro tanto* (can be outweighed), not necessarily absolute. The dispute is over whether the reason exists at all, not merely over its weight relative to autonomy or resources.
  6.  **Impossibility Theorems:** Both sides acknowledge Arrhenius's impossibility theorems and agree that no population axiology is cost-free. The question is which costs (e.g., The Repugnant Conclusion vs. The Asymmetry) are less acceptable.

  ---

  ### II. Disagreements Table
  *This section isolates the substantive disagreements. Wording has been negotiated to ensure each side can endorse their column without feeling misrepresented.*

  | Point of Contention | Asymmetrist Position | Symmetrist Position |
  | :--- | :--- | :--- |
  | **1. Source of the Intuition** | The asymmetry reflects a fundamental structural feature of moral reasons regarding existence. It is a "fixed point" in reflective equilibrium that theory must accommodate. | The asymmetry is a cognitive artifact resulting from a scope confusion between *person-affecting* reasons (harm to specific subjects) and *impersonal* reasons (value of states of affairs). |
  | **2. Status of "Benefit"** | Coming into existence with a happy life is not a "benefit" conferred *upon* the person in a way that generates a reason for action, because there is no prior subject to be benefited. | Coming into existence with a happy life is a "benefit" in the relevant normative sense (the life is good *for* the person), generating a *pro tanto* reason to create it, even if that reason is often outweighed. |
  | **3. The Antinatalism Slide** | There is a morally relevant difference between avoiding harm (A) and conferring benefit (B). Recognizing this difference blocks the slide to antinatalism. | The logic used to support (A) (e.g., that non-existence is preferable to miserable existence) structurally mirrors the logic required to deny (B). Maintaining the distinction requires ad-hoc constraints or equivocation. |
  | **4. Person-Affecting Restriction** | A restricted Person-Affecting View (or a variant like the "Wide" Person-Affecting View with asymmetrical weighting) is necessary to capture our considered judgments. | The Person-Affecting Restriction is the source of the error. We must adopt an Impersonal View (e.g., Total or Critical-Level Utilitarianism) to avoid intransitivity and other paradoxes. |
  | **5. Explanation of Regret** | If one chooses not to create a happy child, one need not feel moral regret (only perhaps personal sadness). | If one chooses not to create a happy child (when costless), one *ought* to feel a specific form of moral regret regarding the lost value, implying a reason existed. |

  ---

  ### III. Cruxes and Diagnostic Cases
  *These are the sub-questions where settling the matter would likely shift at least one side's credence. For each crux, we specify a concrete case and the divergent predictions.*

  #### Crux 1: The "Scale" Intuition
  **Question:** Does the sheer quantity of happy lives create a moral reason where a single life does not?
  **Case:** *The Million Happy Children.* A magic button exists. Pressing it creates one million distinct, happy people (who would not otherwise exist) at no cost to anyone. Not pressing it leaves the world as is.
  *   **Asymmetrist Prediction:** Intuition remains split or weak. While creating them is *good*, there is still no *obligation* or strong reason akin to the duty to save existing people. The "no reason to create" claim holds even at scale.
  *   **Symmetrist Prediction:** Intuition shifts decisively. At sufficient scale, the absence of a reason becomes implausible. If we agree there is a reason to press the button for a million, the asymmetry is false; there *is* a reason to create happy people, it was just too weak to see in the single case.
  *   **Condition for Shift:** If Asymmetrists admit a strong reason exists at scale, they must abandon the strict "no corresponding reason" claim. If Symmetrists admit no reason exists even at scale, they must abandon Total/Impersonal views.

  #### Crux 2: The "Baseline" Equivocation
  **Question:** Is the judgment driven by a comparison with non-existence, or a comparison with an alternative existing state?
  **Case:** *The Substitution Case.* A couple is determined to have a child. They can conceive Child A (who will be miserable) or Child B (who will be happy). They cannot choose "no child."
  *   **Asymmetrist Prediction:** The reason to avoid Child A is stronger than the reason to create Child B, even though existence is guaranteed in both options. The asymmetry persists in selection.
  *   **Symmetrist Prediction:** This reveals the asymmetry is about *selection*, not *creation*. If existence is fixed, the "benefit" of B over A is clear. The original asymmetry intuition relies on the "no child" option being salient. If the intuition vanishes here, the asymmetry is a framing effect, not a moral datum.
  *   **Condition for Shift:** If Asymmetrists agree the moral structure changes fundamentally when "non-existence" is removed from the option set, Symmetrists will argue this proves the asymmetry is about the *option set*, not the *value of existence*.

  #### Crux 3: The "Good For" Analysis
  **Question:** Can "good for" be predicated of a person who owes their existence to the act?
  **Case:** *The Delayed Conception.* A woman can conceive now (Child A: Happy) or wait three months (Child B: Very Happy, different identity).
  *   **Asymmetrist Prediction:** She has no reason to wait to create Child B *for Child B's sake*, because Child B does not exist to be benefited. (Aligns with Non-Identity Problem).
  *   **Symmetrist Prediction:** She has a reason to wait. To deny this is to accept the Non-Identity Problem's counterintuitive result. If she has a reason to wait, then "creating a happier person" generates a reason, undermining the asymmetry.
  *   **Condition for Shift:** If Asymmetrists concede there is a *de dicto* reason (to have a happy child) that functions identically to a *de re* reason in practice, the practical gap narrows.

  ---

  ### IV. Flagged Verbal Disputes
  *The following areas are suspected to involve terminological confusion rather than substantive moral disagreement. Clarification here may dissolve some friction.*

  1.  **The Meaning of "Reason":**
      *   *Suspicion:* Asymmetrists may be using "Reason" to mean "Decisive Obligation," while Symmetrists use it to mean "Pro Tanto Consideration."
      *   *Resolution Path:* Both sides agree (Claim #5) to use the *pro tanto* definition. If Asymmetrists find themselves saying "there is a reason, but it counts for zero," they should rephrase to "there is no reason."
  2.  **Comparative vs. Non-Comparative Harm:**
      *   *Suspicion:* Asymmetrists often define "Harm" comparatively (worse off than one would otherwise be). Since a non-existent person cannot be "worse off," they claim creating a miserable person is not harming *them* in the comparative sense, yet still wrong. Symmetrists find this incoherent.
      *   *Resolution Path:* Asymmetrists should specify if they are adopting a **Non-Comparative Account of Harm** (e.g., "being in a bad state is harmful regardless of baseline"). If they adopt this, Symmetrists must explain why a Non-Comparative Account doesn't also generate reasons for benefit (i.e., "being in a good state is beneficial").
  3.  **"Existence as a Precondition":**
      *   *Suspicion:* Symmetrists argue Asymmetrists treat existence as a benefit in the "Misery Case" (otherwise why is it bad?) but not in the "Happy Case."
      *   *Resolution Path:* Asymmetrists must clarify if they view existence as a *neutral precondition* that allows goods/bads to accrue, or as a *good in itself*. If neutral, the asymmetry holds. If a good, the asymmetry collapses.

  ---

  ### V. Sign-off

  **We, the undersigned, acknowledge that this document accurately maps our current positions, disagreements, and the conditions under which we might change our minds.**

  **Asymmetrist Representatives:**
