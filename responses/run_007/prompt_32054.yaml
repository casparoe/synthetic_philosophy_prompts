answer: |-
  You have stumbled directly into one of the most famous and vexing problems in modern moral philosophy. Your friend is articulating what is known as the **Non-Identity Problem**, formulated most rigorously by the philosopher Derek Parfit in his 1984 book *Reasons and Persons*.

  To answer your question directly: Your friend is logically consistent within a specific ethical framework, but that framework is not the only one available, nor is it universally accepted as complete. Your unease is not mere sentiment; it is the intuitive recognition of ethical dimensions that your friend's argument excludes.

  For a novelist, this is fertile ground. The conflict isn't between "right" and "wrong," but between two different ways of counting moral value. Here is the structure of the fault line.

  ### 1. The Friend's Structure: The Person-Affecting View
  Your friend's argument relies on the **Comparative Account of Harm**.
  *   **Definition:** You harm Person X only if you make Person X worse off than they would otherwise have been.
  *   **Application:** If you conceive the child, they exist and have a life worth living. If you do not conceive, *this specific child* never exists. Therefore, the child is not worse off by being born; they are better off than the alternative (non-existence).
  *   **Conclusion:** You cannot claim you are harming *this* child.

  This logic is robust. It protects us from absurdities like blaming our parents for conceiving us during a war, provided our lives are still net-positive. It anchors morality in the welfare of specific, identifiable individuals.

  **The Limit:** This view struggles to account for harms that are diffuse or structural. It implies that as long as a life is "worth living," no injustice has been done to the individual, regardless of how preventable their suffering might have been.

  ### 2. The Source of Your Unease: Three Alternative Frameworks
  Your intuition that the friend's reasoning is "too convenient" stems from the fact that human morality is not solely concerned with comparative harm to specific individuals. Here are three coherent philosophical structures that validate your unease.

  #### A. The Impersonal View (Badness vs. Harm)
  Parfit himself was troubled by his own Non-Identity Problem. He suggested that we should distinguish between harming a person and making the world *worse*.
  *   **The Structure:** An act can be wrong even if it harms no specific individual.
  *   **Application:** By bringing a child into a degraded world, you are not harming the child (comparatively), but you are participating in a state of affairs that is objectively worse than one where a child enjoys a flourishing life.
  *   **The Novelistic Tension:** This shifts the guilt from "I hurt my child" to "I am accepting a diminished world." It transforms the decision from a private family matter into a political or ecological statement. The question becomes: *Do I have a duty to the quality of future lives, even if those lives are grateful to exist?*

  #### B. Threshold Rights (The Right to a Decent Start)
  Some philosophers argue that the Comparative Account is too low a bar. They propose a **Threshold View**.
  *   **The Structure:** Individuals have a right to a minimum threshold of opportunity, health, or stability. If you cannot guarantee this threshold, you do not have the right to create the person, regardless of whether their life would be net-positive.
  *   **Application:** Imagine a couple knowingly conceives a child with a painful, chronic genetic condition that shortens their life but leaves it "worth living." Many would argue the parents acted wrongly, not because the child is worse off than non-existence, but because the parents violated a duty to ensure a minimum standard of well-being.
  *   **The Novelistic Tension:** This frames procreation as a fiduciary responsibility. The parents are stewards. If the "house" (the world/economy/environment) is too damaged, the stewards should not bring guests in, even if the guests would say they are happy to be there.

  #### C. Virtue Ethics (The Character of the Parent)
  This moves away from the child entirely and focuses on the **moral character of the parents**.
  *   **The Structure:** Morality is about acting in accordance with virtue (wisdom, temperance, responsibility).
  *   **Application:** Is it *wise* or *responsible* to bring a dependent into a situation of known precarity? Even if the child isn't "harmed," the act might reflect poorly on the parents' judgment or their willingness to sacrifice their own desires for the sake of a broader good.
  *   **The Novelistic Tension:** This creates internal conflict. "I want this, but does wanting this make me selfish?" It allows for a narrative where the tragedy isn't the child's suffering, but the parents' moral compromise.

  ### 3. The Collective Action Problem
  There is a specific dimension to your climate context that the Non-Identity Problem often misses: **Cumulative Harm.**
  *   **The Structure:** One child does not cause climate collapse. But millions of children making the "rational" choice (my one child won't matter) causes the collapse that makes all their lives harder.
  *   **Application:** Your friend's logic works in isolation. If *everyone* uses your friend's logic, the conditions worsen for everyone. If *everyone* uses your logic (restraint), conditions stabilize.
  *   **The Novelistic Tension:** This is the tragedy of the commons. Your characters might feel that while their individual act is harmless (per the friend), it is a vote for a system they oppose. The unease is the friction between individual rationality and collective irrationality.

  ### 4. How to Use This in Your Book
  You asked for the structure of the problem rather than an answer. The structure is a clash between **Identity** and **Quality**.

  *   **Side A (Your Friend):** Existence is a gift. Identity is paramount. You cannot compare existence to non-existence. To deny birth is to deny the only chance at joy. (Focus: Gratitude, Resilience, The Individual).
  *   **Side B (Your Unease):** Quality is paramount. Conditions matter. We have duties to the future that transcend the gratitude of the present. (Focus: Responsibility, Stewardship, The Collective).

  In your novel, if one character argues from the Non-Identity Problem and the other argues from Threshold Rights or Virtue Ethics, they will talk past each other. They are playing different moral games.
  *   Character A says: "I am not hurting him."
  *   Character B says: "You are failing him."
  *   Character A says: "Failing him compared to what? He wouldn't exist."
  *   Character B says: "Compared to what he *should* have been guaranteed."

  ### Summary
  Your friend is right that you are not **harming** the child in the strict comparative sense. But he is wrong to imply that **harm** is the only metric for moral justification.

  Your unease is coherent because it recognizes:
  1.  **Impersonal Badness:** You are making the world worse, even if not the child.
  2.  **Threshold Duties:** You may have an obligation to ensure a minimum quality of life, not just a positive one.
  3.  **Collective Complicity:** Your individual choice supports a system of overpopulation/consumption that drives the disruption.

  You do not need to treat the unease as mere sentiment. It is the psychological weight of ethical frameworks that your friend's logic conveniently ignores. For a novelist, the "answer" is not to solve the equation, but to dramatize the cost of choosing one side of the equation over the other.
