      *   *Check:* Did I validate the friend too much? *Need to ensure the counter-arguments are robust.*
      *   *Check:* Is the distinction between "harm" and "wrong" clear? *Yes, this is crucial. An act can be wrong without harming a specific person (e.g., desecrating a grave of someone with no living relatives).*
      *   *Check:* Is the climate context addressed? *Yes, via the collective action problem.*

  8.  **Final Polish:** Ensure the language is evocative for a novelist. Use metaphors of architecture or structure as requested ("show me the structure of the problem"). (Self-correction: Make sure to explicitly mention that the "unease" is philosophically defensible, not just sentiment.)

