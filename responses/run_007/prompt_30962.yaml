  I'm designing a graduate seminar on logical uncertainty and need a handout that maps the conceptual territory. Please write a taxonomy of positions on how a reasoner ought to handle uncertainty about the logical consequences of their own beliefs. Build it from diagnostic questions, not from a list of names: first identify the questions on which views genuinely come apart, then locate actual positions in the space of possible answers, and flag any answer-combinations no one defends with a brief note on why. The diagnostic questions should include at least whether logical uncertainty is a distinct kind from empirical uncertainty, whether an ideal reasoner should be logically omniscient, whether probabilistic coherence is the right standard for logical beliefs, and whether resolving logical uncertainty requires a new decision theory or only a new epistemology. The taxonomy must separate the classical Bayesian idealization view, the view that treats logical facts as empirical unknowns about which one can have a prior, the logical induction program, and any view that rejects probabilistic representations of logical uncertainty altogether. Flag any pair of views your taxonomy cannot cleanly separate. Write the whole thing in continuous prose with no headings, bullet points, tables, or bold text.
