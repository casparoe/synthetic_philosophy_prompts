      *   Q3: Probabilistic Coherence. Should degrees of belief in logical statements obey probability axioms (especially additivity over mutually exclusive logical truths)?
      *   Q4: Decision Theory vs. Epistemology. Does the problem lie in how we believe or how we act on beliefs?

