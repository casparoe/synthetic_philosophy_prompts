prompt: |-
  I chair the grants committee at a small family foundation. We meet once a quarter and make three or four grants; the amounts aren't huge but they're life-changing for the groups that get them, and the board signs off on whatever we recommend. Nobody on the committee has a philosophy background. This stopped being an abstract question for me last year, though. My dad died and my sister and I had to divide up his things — his tools, the house, his mother's letters — and I kept building a spreadsheet were every item got a dollar value so we could trade fairly. It felt like lying about what we actually cared about, and the spreadsheet just hid the hard calls instead of making them. Now I notice we do the same thing in committee: we score each proposal 1-10 on impact, feasibility, and equity, average the numbers, and fund the top ones. That works fine when one proposal is just better on everything. It breaks exactly when it matters: a legal aid clinic vs a community garden vs a music program for kids. We pretend the rubric is deciding when really someone strong-arms the room.

  So write me a decision procedure — a checklist or flowchart in words, with the questions in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a person — that my committee can actually run in a two-hour meeting and use every quarter. Ground it in what philosophers actually know about incommensurable values and hard choices: when options are on a par rather than one being better, why forcing a common metric distorts the decision, and how you can make a justified choice between things that don't share a scale. I want it to catch both failure modes: the case where the options are actually comparable and we're just being lazy, and the case where we use the rubric to dodge a hard choice.

  Commit to a definite procedure and defend the choices you made in building it — don't give me a survey of theories and leave me to pick. And be honest about which steps are judgment calls wearing a flowchart costume, and what the procedure can't do for us.

  Then run it on three situations that actually come up for us, or close versions of them: (1) a tenant legal aid clinic vs an after-school music program, roughly equal cost, serving different values; (2) a proposal I personally love that turns out to be dominated by another proposal — worse on every dimension we actually care about, once we list them; (3) a proposal from a board member's daughter's organization that scores fine but not top, where the committee starts looking for reasons after the fact. Make sure one of these gives an answer we won't like.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Chair of a grants committee at a small family foundation.
      *   **Context:** Quarterly meetings, 3-4 grants, life-changing amounts for recipients (though small for the foundation), board rubber-stamps recommendations.
      *   **Problem:** Current rubric (scoring 1-10 on impact, feasibility, equity) fails when values are *incommensurable* (e.g., legal aid vs. music). It creates an illusion of objectivity while masking power dynamics ("someone strong-arms the room").
      *   **Personal Motivation:** User experienced this personally dividing estate items (spreadsheet vs. actual care). Wants to avoid that hypocrisy in professional life.
      *   **Philosophical Grounding:** Needs to be grounded in philosophical concepts of *incommensurability*, *parity* (Ruth Chang), and *hard choices*.
      *   **Deliverable:** A definite decision procedure (checklist/flowchart in words), not a survey of theories. Must include defense of choices, admission of limitations ("judgment calls wearing a flowchart costume"), and application to three specific scenarios.
      *   **Constraint:** Must fit in a two-hour meeting.
      *   **Requirement:** One scenario must yield an answer the committee "won't like."

  2.  **Philosophical Framework Selection:**
      *   *Utilitarianism/Cost-Benefit:* Reject. This is exactly what the user says fails (forcing a common metric).
      *   *Deontology:* Too rigid for grantmaking which is often consequentialist in nature.
      *   *Virtue Ethics:* Good for the *character* of the grantmakers, but doesn't give a procedure.
      *   *Ruth Chang's "Parity" and "Hard Choices":* This is the sweet spot. Chang argues that when options are "on a par," neither is better than the other, nor are they equal. They are comparable but not rankable by a single metric. The justification comes from *commitment* rather than *discovery* of pre-existing reasons.
      *   *Isaiah Berlin's "Value Pluralism":* Acknowledges that human values conflict and cannot be reduced to a single super-value.
      *   *Procedural Justice:* The process must be fair and transparent, even if the outcome is hard.

  3.  **Drafting the Procedure (The "Protocol for Hard Choices"):**
      *   *Goal:* Distinguish between "Easy Choices" (one dominates), "Lazy Choices" (rubric masking preference), and "Hard Choices" (parity).
      *   *Step 1: The Dominance Check.* Before scoring, ask if one is clearly better on all shared goals. If yes, pick it. (Catches failure mode 1: laziness).
      *   *Step 2: The Value Articulation.* Instead of scoring 1-10, name the specific good each does. (Moves away from false precision).
      *   *Step 3: The Parity Test.* Can we agree they are "on a par"? If yes, acknowledge the rubric is useless here.
      *   *Step 4: The Commitment Vote.* If on a par, the choice isn't found, it's *made*. We vote based on who we want to *be* as a foundation.
      *   *Step 5: The Veto/Recusal.* Handle conflicts of interest explicitly.

      *Refining for Time:* A 2-hour meeting can't handle deep existential debate for every grant. Need a triage system.
      *   *Phase 1: Triage (30 mins).* Eliminate non-starters.
      *   *Phase 2: Comparison (60 mins).* Apply the protocol to the top contenders.
      *   *Phase 3: Ratification (30 mins).* Final check.

      *Defending the Choices:* Why no scores? Because scores imply cardinal utility where there is only ordinal or non-comparable value. Why the "Commitment Vote"? Because in hard choices, reason runs out, and will must take over (Chang).

      *Honesty:* Admit that Step 4 is essentially a vote, but framed as identity-formation rather than preference aggregation.

  4.  **Developing the Three Scenarios:**
      *   *Scenario 1 (Legal Aid vs. Music):* Classic incommensurability. Justice vs. Joy/Development. Procedure should lead to a "Hard Choice" admission and a commitment vote.
      *   *Scenario 2 (Personal Love vs. Dominated):* Tests the "Dominance Check." The user's preference must yield to the objective betterness. This is the "discipline" function.
      *   *Scenario 3 (Board Member's Daughter):* Tests the "Conflict/Post-hoc Rationalization" failure mode. The procedure needs to flag this *before* scoring. This should be the one that gives an answer they "won't like" (i.e., recusal or rejection based on process integrity).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate the "spreadsheet as lie" feeling.
      *   **The Procedure:** "The Parity Protocol." Break it down into clear steps.
      *   **Philosophical Defense:** Explain *why* this works (Chang, Berlin, Anderson). Explain why we drop the 1-10 scale for the final decision.
      *   **Limitations:** Admit where the flowchart is just ritual.
      *   **Scenario Runs:** Walk through the three cases.
          *   *Case 1:* Result: Parity declared. Committee must choose based on strategic identity.
          *   *Case 2:* Result: Dominance found. User's favorite dies. (Hard truth).
          *   *Case 3:* Result: Conflict identified. Recusal required. The "answer they won't like" is that the process stalls or the grant is delayed to avoid coercion. *Correction:* Let's make the "won't like" answer that the grant is *rejected* because the conflict contaminates the deliberation, or that the committee admits they are being manipulated. Let's go with: The procedure forces a public admission that the scoring is being manipulated, leading to a deferral.

  6.  **Refining the "Won't Like" Answer:**
      *   In Scenario 3, if the procedure works, it exposes the social pressure. The "unpleasant answer" should be that the committee *cannot* decide fairly right now. They must recuse the connected member and perhaps table the grant because the remaining info is insufficient without that member's advocacy, or simply that the social cost is too high. Let's make it stronger: The procedure forces the committee to admit they are about to violate their own rules, and the only ethical move is to *reject* the application to preserve the integrity of the process. That's a hard pill to swallow for a family foundation.

  7.  **Review against Constraints:**
      *   *Two-hour meeting?* Yes, the steps are timed.
      *   *Philosophical grounding?* Yes (Chang's Parity, Value Pluralism).
      *   *Definite procedure?* Yes, no "it depends."
      *   *Honest about limitations?* Yes, included in the "Where This Breaks" section.
      *   *Three scenarios?* Yes.

  8.  **Final Polish:**
      *   Tone: Respectful, direct, philosophical but practical.
      *   Formatting: Use bolding, lists, and clear headers for readability.
      *   Check the "Spreadsheet" analogy: Ensure I reference back to the user's personal story to maintain connection.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "vote." A vote is what they do now. The difference must be *how* they vote. They currently vote based on "scores." The new way is voting based on "commitment to a value." I need to make that distinction clear. The question changes from "Which number is higher?" to "Which future do we want to create?"

      *(Refining Scenario 3)*: If I say "reject," it might seem too harsh for a family foundation. Maybe the "won't like" answer is that the *connected member* has to leave the room and the grant *still* doesn't pass because the remaining merits aren't enough without the social pressure. That highlights the "strong-arming" issue the user mentioned. Let's go with: The procedure forces the conflict into the open, and without the board member's pressure, the proposal fails on its merits. The "unlikeable" part is the awkward confrontation.

      *Wait, the prompt asks for "an answer we won't like."*
      If the grant is actually good, rejecting it feels bad. If the grant is mediocre, rejecting it feels good.
      Let's make it so the procedure dictates that *because* of the conflict, the grant is ineligible this cycle. That protects the process but hurts the recipient. That's a solid "won't like."

      *Wait, looking at Scenario 2:* "A proposal I personally love that turns out to be dominated." The answer they won't like there is that *my* proposal dies. That's personal.
      *Looking at Scenario 3:* "Board member's daughter." The answer they won't like is exposing the nepotism.
      I will ensure Scenario 3 results in a procedural block that feels bureaucratic but is necessary.

      *Let's finalize the "Won't Like" candidate:* Scenario 3 is the best fit for systemic rot. The procedure will dictate that if a conflict exists, the member *must* recuse, AND the remaining committee must be able to justify the grant *without* the recused member's input. If they can't, the grant dies. This often means the grant dies because the "advocacy" was the main selling point.

      *Wait, one more check on the Philosophy:* Ruth Chang is the key here. "Hard Choices are opportunities to exercise normative power." I need to make sure the procedure empowers them to *make* the reason, not just find it.

      *Structure:*
      1. Introduction (Validating the insight).
      2. The Protocol (The Steps).
      3. The Defense (Why this works philosophically).
      4. The Limitations (Where it's still a judgment call).
      5. The Three Scenarios (Running the protocol).

      *Let's write.*
answer: |-
  ## The Parity Protocol: A Decision Procedure for Incommensurable Choices

  You have identified the core failure of modern grantmaking rubrics: they treat value as a *measurement* problem when it is often a *meaning* problem. When you assign a "7" to a music program and an "8" to legal aid, you are pretending there is a common currency of "goodness" that allows them to be exchanged. Philosophers call this the fallacy of *commensurability*.

  In reality, you are facing **value pluralism** (Isaiah Berlin): distinct goods that cannot be reduced to a single super-value. When two options are distinct but neither is clearly better than the other, they are not "equal." They are **on a par** (Ruth Chang). In the "parity" zone, reason runs out. You cannot calculate the answer; you must *commit* to one, thereby creating a reason for it to be the right choice.

  Your current rubric hides this commitment behind math. The procedure below forces the commitment into the light. It is designed for a two-hour quarterly meeting.

  ### Part 1: The Procedure

  **Pre-Meeting:** Staff sends proposals 2 weeks early. Committee reads them. No scoring sheets allowed.

  **Phase 1: The Dominance Check (30 Minutes)**
  *Goal: Eliminate lazy comparisons and clear the field.*

  1.  **List the Goods:** For each proposal, write down the *specific* good it achieves in plain English (e.g., "Prevents eviction for 50 families" vs. "Teaches violin to 30 kids"). Do not use numbers.
  2.  **The Dominance Question:** Ask: "Is there any proposal that achieves *more* of a specific good than another proposal, without sacrificing anything else we care about?"
      *   *Yes:* The dominated proposal is eliminated. (Example: Proposal A helps 50 families; Proposal B helps 20 families in the exact same way with the same cost. B is out.)
      *   *No:* Proceed to Phase 2.
  3.  **Stop Rule:** If only one proposal remains, fund it. If none remain, proceed to Phase 2.

  **Phase 2: The Parity Test (60 Minutes)**
  *Goal: Identify when the rubric is lying to you.*

  1.  **Select the Finalists:** Pick the top 2-3 proposals that survived Phase 1.
  2.  **The Trade-Off Question:** Ask: "To choose Proposal A over Proposal B, what specific value are we willing to *lose*?"
      *   *If the answer is "Nothing, A is just better":* Go back to Phase 1. You missed a dominance relation.
      *   *If the answer is "We lose the music education":* You have confirmed **Parity**. The values are incommensurable.
  3.  **The Rubric Ban:** If Parity is declared, **hide the scores.** Do not average them. Do not look at the 1-10 scale. Acknowledge that the math is now noise.
  4.  **The Identity Vote:** The Chair asks: "Given that neither is objectively better, which choice makes us the kind of foundation we want to be *this quarter*?"
      *   Committee members state their choice not as "This is higher impact," but as "I want to prioritize X over Y right now."
      *   Vote by show of hands. Majority wins. Tie breaks to the Chair.

  **Phase 3: The Integrity Check (30 Minutes)**
  *Goal: Prevent post-hoc rationalization and conflict of interest.*

  1.  **The Motivation Scan:** Before finalizing, ask: "Is anyone advocating for this proposal for a reason we haven't listed?"
  2.  **The Conflict Declaration:** "Does anyone have a personal relationship with the applicant that isn't public knowledge?"
      *   *Yes:* That member must recuse themselves from the vote *and* leave the room during deliberation for that specific grant.
      *   *No:* Proceed.
  3.  **The "Spreadsheet" Test:** Ask: "If we had to explain this decision to the rejected applicant without using numbers, could we do it honestly?"
      *   *Yes:* Approve the grant.
      *   *No:* Table the decision. Do not fund.

  ---

  ### Part 2: Defense of the Design

  **1. Why ban the scores in Phase 2?**
  When values are on a par, averaging scores is a category error. It's like averaging the "temperature" of a song with the "weight" of a stone. The number implies precision that doesn't exist. By banning the scores once Parity is declared, we stop using math to dodge responsibility. We force the committee to own the trade-off.

  **2. Why the "Identity Vote" instead of a standard vote?**
  In a standard vote, people vote for what they think is "true" (i.e., which score is higher). In a Hard Choice, there is no truth to find. Ruth Chang argues that in parity situations, we exercise **normative power**. We *make* the choice right by committing to it. Framing the vote as "Who do we want to be?" aligns the decision with the foundation's agency rather than a fictional external metric.

  **3. Why the "Spreadsheet Test" at the end?**
  This targets the post-hoc rationalization you described ("looking for reasons after the fact"). If you cannot articulate the reason without hiding behind a rubric, you are likely covering for bias or social pressure. This step forces the narrative to match the decision.

  ---

  ### Part 3: Where This Is Still a Costume

  I owe you honesty. This procedure cannot remove judgment; it only relocates it.

  *   **Phase 1 is vulnerable to framing:** Determining "Dominance" depends on how you describe the "Good." If you describe the Legal Aid good as "Justice" and the Music good as "Fun," Legal Aid dominates. If you describe them as "Crisis Intervention" vs. "Youth Development," they are distinct. The committee still controls the language.
  *   **The Identity Vote is still a vote:** It can still be strong-armed by a loud voice. However, because the justification must be about *identity* ("We are a foundation that prioritizes crisis intervention") rather than *fact* ("This score is 8.5"), it is harder to bully someone into agreeing with a factual claim they know is false.
  *   **It requires courage:** This procedure gives you the tools to see the hard choice, but it doesn't make the choice easy. It removes the hiding spot.

  ---

  ### Part 4: Running the Scenarios

  Here is how the Protocol handles the three situations you described.

  #### Scenario 1: Legal Aid Clinic vs. After-School Music
  *Context: Roughly equal cost. One prevents homelessness, one teaches art.*

  1.  **Phase 1 (Dominance):** Committee lists goods. "Preventing eviction" vs. "Cognitive development through music." Neither dominates. Both serve different populations and different needs. No elimination.
  2.  **Phase 2 (Parity):** Chair asks: "To choose Legal Aid, what do we lose?" Answer: "We lose the long-term developmental benefit for the kids." Parity is declared. Scores are hidden.
  3.  **Identity Vote:** Member A says, "This quarter, I feel we need to be the firewall against immediate harm." Member B says, "I feel we should be the investors in long-term potential."
  4.  **Result:** The committee votes. Suppose Legal Aid wins 3-2.
  5.  **Phase 3 (Integrity):** Can we explain this? Yes. "We prioritized immediate crisis mitigation over long-term development this cycle."
  6.  **Outcome:** A justified choice is made. The music program is not "worse"; it was simply not the *commitment* of this quarter. The loss is acknowledged, not hidden by a 0.5 point score difference.

  #### Scenario 2: Your Personal Love vs. A Dominated Proposal
  *Context: You love a proposal (Proposal A). Proposal B is the same type of work, same cost, but serves more people/better tracked outcomes.*

  1.  **Phase 1 (Dominance):** Committee lists goods. Both provide "Tutoring." Proposal B serves 100 kids; Proposal A serves 50. Proposal B has better retention data.
  2.  **Dominance Question:** "Is there any proposal that achieves more of a specific good... without sacrificing anything else?"
  3.  **Result:** **Yes.** Proposal B dominates Proposal A on the very metrics your foundation claims to care about (impact/feasibility).
  4.  **Stop Rule:** Proposal A is eliminated immediately.
  5.  **Outcome:** **You won't like this.** Your personal attachment is overruled by the procedure before the voting even starts. The protocol protects the foundation from your bias (and the board from your advocacy). It forces you to admit that "love" is not a grantmaking criterion unless you are willing to codify "Chair's Passion" as a formal value (which you should not do).

  #### Scenario 3: The Board Member's Daughter
  *Context: Proposal from a board member's daughter. Scores are "fine" but not top. Committee is looking for reasons to fund it.*

  1.  **Phase 1 (Dominance):** The proposal is "fine." It does not dominate the others. It survives to Phase 2.
  2.  **Phase 2 (Parity):** The committee tries to declare Parity between this and a stronger proposal. But the "Trade-Off Question" reveals the rot. "To choose the Daughter's Org, what do we lose?" Answer: "We lose the higher impact of the other guy." This is *not* Parity. This is a downgrade.
  3.  **Phase 3 (Integrity Check):** The Chair asks: "Does anyone have a personal relationship...?"
      *   The Board Member must declare the relationship.
      *   **Protocol Rule:** They must recuse and leave the room.
  4.  **The "Won't Like" Outcome:** Once the Board Member leaves the room, the social pressure evaporates. The remaining committee members look at the proposal without the fear of offending the Board.
      *   *Likely Result:* Without the Board Member's advocacy, the proposal fails the "Identity Vote" against stronger competitors.
      *   *The Hard Truth:* The procedure dictates the grant is **rejected**.
      *   *Why you won't like it:* This creates immediate interpersonal friction. The Board Member may be angry. The daughter's organization loses funding they might have gotten under the old "strong-arm" system. The committee has to sit in the silence of having just blocked a colleague's family.
      *   *Why it's necessary:* Under the old rubric, you would have fudged the scores to fund it, lying to yourselves (and the other applicants) about why. This procedure forces the nepotism tax to be paid openly. If the foundation cannot survive that honesty, the rubric was the least of its problems.

  ### Final Word

  This procedure will not make your meetings easier. It will make them heavier. You will leave the room knowing exactly what you sacrificed, without a spreadsheet to blame. That is the cost of telling the truth about value. But it is the only way to ensure that when you write the check, the number matches the care.
