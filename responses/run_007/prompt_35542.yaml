prompt: |-
  I'm in a graduate seminar on Hume, and we've spent the last three sessions on Section X of the Enquiry. I've constructed an argument that worries me, because it seems to show that Hume's maxim for evaluating miracle testimony either collapses into a much broader skepticism about testimony than Hume himself would accept, or relies on a distinction that his own framework can't draw without begging the question. I can't tell whether the argument is sound, and if it isn't, I can't locate the mistake.

  Here's the argument:

  (1) Hume's maxim: "no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."

  (2) A miracle, for Hume, is a violation of a law of nature. And a law of nature is established by "a firm and unalterable experience" — that is, by uniform, exceptionless experience of the relevant regularity.

  (3) So the maxim instructs us to weigh the probability that the testimony is false against the probability of the event reported, where the latter probability is fixed by our uniform past experience.

  (4) But now consider how we come to know the laws of nature in the first place. We do not personally observe most of the uniformities that constitute natural law. We rely on testimony: the reports of scientists, the readings of instruments, the contents of textbooks, the consensus of experts. Each piece of this testimony is fallible; each has some probability of being false.

  (5) By the same maxim, when we receive testimony for a surprising scientific finding — say, that particles can be in superposition, or that time dilates at relativistic speeds — we must weigh the probability that the testimony is false against the probability of the event reported. But the event reported conflicts with our prior uniform experience (or at least with the experience of ordinary observers), so its probability is extremely low.

  (6) Therefore, by parity of reasoning, Hume's maxim seems to require us to reject testimony for surprising scientific discoveries in just the same way it requires us to reject testimony for miracles. But we do not, and should not, reject such testimony. Scientists rationally revise their understanding of natural law on the basis of testimony.

  (7) So either Hume's maxim is not the correct principle for evaluating testimony (it proves too much), or it is being applied to miracles in a way that does not generalize — and if it does not generalize, we need an account of what special feature of miracle reports justifies a stricter standard.

  I'm most suspicious of step (5). Perhaps there's a difference between "improbable relative to ordinary experience" and "violation of a law of nature," and that difference does the work. But here's why I can't make that stick: Hume defines a law of nature in terms of uniform experience. If new testimony can lead us to revise what we took to be a law of nature — as it does in the scientific cases — then whether some piece of testimony counts as a report of a miracle or as a report that prompts revision of a law depends on whether we are antecedently willing to revise the law. But that is exactly what is at issue when we evaluate the testimony. So the distinction between a miracle and a merely surprising natural event seems to presuppose the very judgment the maxim is supposed to guide. If that's right, the maxim either begs the question against the miracle reporter or must be applied so broadly that it rules out rational belief revision across the board.

  I'd like to keep Hume's basic insight — that testimony should be evaluated against background experience — but I want to know exactly which step to reject, and what I lose by rejecting it. Where does this argument go wrong?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on Hume, specifically *Enquiry Concerning Human Understanding*, Section X ("Of Miracles").
      *   **Problem:** The user has constructed an argument suggesting Hume's maxim regarding miracle testimony leads to excessive skepticism (rejecting scientific testimony) or begs the question.
      *   **The Argument:**
          1.  Hume's Maxim (Falsehood must be more miraculous than the event).
          2.  Definition of Miracle (Violation of Law of Nature).
          3.  Definition of Law (Firm/unalterable experience).
          4.  Premise: We know laws via testimony (scientists, textbooks), not just personal experience.
          5.  Application: Surprising scientific claims (quantum superposition, relativity) conflict with ordinary uniform experience.
          6.  Conclusion: Maxim requires rejecting scientific testimony just like miracle testimony.
          7.  Dilemma: Maxim is too broad OR relies on a question-begging distinction.
      *   **User's Suspicion:** Step (5) might be the weak point, specifically regarding the distinction between "improbable relative to ordinary experience" vs. "violation of a law." But they worry this distinction is circular because laws are defined by experience, which is revisable via testimony.
      *   **Goal:** Identify where the argument goes wrong, preserve Hume's basic insight, and explain the cost of rejecting the problematic step.

  2.  **Deconstruct the Argument & Identify Potential Flaws:**
      *   *Step (1) & (2):* Accurate representations of Hume.
      *   *Step (3):* Accurate representation of the weighing mechanism.
      *   *Step (4):* **Crucial Point.** This is the epistemological hinge. Hume is an empiricist. Does he allow *testimony* to establish laws of nature in the same way *direct experience* does?
      *   *Step (5):* **The Analogy.** Is a scientific discovery (relativity) analogous to a miracle (resurrection) in Hume's framework?
      *   *Step (6) & (7):* The conclusion follows if the premises hold.

  3.  **Evaluate Step (4) and (5) in Humean Terms:**
      *   *Hume on Testimony vs. Experience:* Hume privileges *direct* uniform experience over testimony. In Section X, Part II, Hume discusses the "wise man" who proportions belief to the evidence.
      *   *The Definition of Law:* Hume says a law is established by "firm and unalterable experience." Does this include *mediated* experience (testimony)? Hume tends to speak of *our* experience. However, in a modern context (and even in Hume's), we rely on others.
      *   *The Crucial Distinction:* Hume distinguishes between *contrary to experience* and *unconformable to experience*.
          *   Miracle: Contrary to *uniform* experience (e.g., dead men staying dead).
          *   Strange Event: Unconformable but not contrary (e.g., seeing a person in a climate they aren't usually found).
      *   *Scientific Revolutions:* When science overturns a "law" (e.g., Newton to Einstein), it's not usually because someone testified to a *violation* (a miracle), but because a new theory explains the data *better* and predicts new phenomena. It's not "A dead man rose"; it's "Time behaves differently at high speeds." The latter is counter-intuitive to *ordinary* experience but becomes part of a *new* uniform experience once verified.
      *   *The "Proof" vs. "Probability" Distinction:* Hume distinguishes between *proofs* (arguments from cause/effect based on uniform experience) and *probabilities* (based on less uniform experience). A law of nature represents a *proof*. Testimony for a miracle opposes a *proof*. Testimony for a new scientific theory often starts as probability and aims to become a proof.

  4.  **Pinpointing the Error:**
      *   The argument fails primarily at **Step (4)** and **Step (5)** due to a misunderstanding of how Hume treats the *source* of the "uniform experience."
      *   *Hume's Epistemology of Laws:* For Hume, a "law of nature" in the context of the miracle argument is not a theoretical construct subject to Kuhnian paradigm shifts. It is a psychological certainty derived from *induction*. "All men die" is a law. "Gravity acts thus" is a law.
      *   *The Testimony Issue:* Hume acknowledges we rely on testimony for matters of fact we haven't seen. But the *weight* of that testimony depends on the *uniformity* of the experience backing it.
      *   *The Scientific Case:* When scientists claim time dilation, they are not claiming a *violation* of a law established by uniform experience in the Humean sense. They are claiming a *refinement* of the law based on *new* uniform experiences (experiments).
      *   *The Miracle Case:* A miracle claims a *suspension* of the law in a specific instance, without establishing a new uniformity.
      *   *Key Distinction:* **Revisability of Laws vs. Violation of Laws.** Hume's argument assumes the laws are fixed *for the sake of the argument*. If the testimony establishes a *new* law (science), it's not a miracle. If the testimony claims an *exception* to an existing law without establishing a new regularity (miracle), it is a miracle.
      *   *Circularity Charge:* The user worries it's circular to define a miracle as a violation of law when the law is defined by experience which is revisable by testimony.
      *   *Hume's Reply:* The "uniform experience" against a miracle is not just "I haven't seen it." It is "The entire course of human observation supports X." A scientific discovery doesn't say "X was violated once." It says "Our understanding of X was incomplete; actually Y is the rule."
      *   *Where the Argument Breaks:* Step (5) equates "conflicts with ordinary experience" with "violates a law of nature." Hume would deny this equivalence. Relativity conflicts with *naive* induction, but it establishes a *new* uniform experience. A miracle claims an exception to *any* uniform experience.

  5.  **Drafting the Response:**
      *   **Validate:** Acknowledge this is a classic and sophisticated objection (often associated with thinkers like John Earman or similar contemporary Hume scholars). It shows good engagement.
      *   **Diagnose:** The error lies in **Step (4)** and the interpretation of **Step (2)** regarding the *source* of the "firm and unalterable experience."
      *   **Hume's Internalist/Externalist Mix:** Hume is arguably an internalist about justification here. The "experience" that constitutes the proof against a miracle must be *our* experience (or experience we can access/verify), not just blind trust in authority.
      *   **The "Proof" vs. "Probability" Distinction:** This is the technical Humean tool to solve this.
          *   Laws = Proofs (Uniform experience).
          *   Scientific Revision = Moving from one Proof to another via new Experiments (which are themselves uniform experiences).
          *   Miracles = Testimony opposing a Proof without providing a new uniform experience.
      *   **Addressing the Circularity:** It's not circular because the "law" isn't defined by *current consensus* but by *inductive track record*. A miracle claims an exception to the track record. Science claims the track record was misinterpreted or limited.
      *   **Refining Step (5):** Scientific testimony usually comes with *replicable evidence* (instruments, math, prediction). Miracle testimony usually comes as *historical narrative*. Hume treats these differently.
      *   **Conclusion:** Reject Step (5)'s equivalence. Distinguish between *theory revision* (science) and *exception claiming* (miracle).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Hume allow testimony to establish laws?* In Section X, Part II, Hume lists conditions for reliable testimony (number of witnesses, integrity, lack of interest, etc.). He admits testimony *can* establish facts.
      *   *But can it establish a Law?* Hume says laws are established by *experience*. Testimony reports experience. So yes, indirectly.
      *   *The Real Kicker:* The distinction is between **Extraordinary Facts** vs. **Miraculous Violations**.
      *   Hume admits we can believe testimony for extraordinary things (e.g., an 8-day darkness, a prince in a warm climate) *if* the testimony is strong enough.
      *   But a *miracle* is different because it opposes a *proof*.
      *   *The User's "Scientific Discovery" point:* When Einstein proposed relativity, was it a miracle? No. Why? Because it wasn't a claim that "Gravity stopped working for 5 seconds." It was a claim about the *structure* of gravity.
      *   *The "Begging the Question" worry:* The user thinks we have to decide if it's a miracle *before* weighing the testimony. Hume says: We weigh the testimony against the *existing* proof. If the testimony is strong enough to overturn the proof, it ceases to be a miracle and becomes a new natural phenomenon.
      *   *Wait, does Hume allow that?* Hume famously says "No testimony is sufficient..." implying it's *impossible* for testimony to establish a miracle.
      *   *Nuance:* Hume's maxim is a practical rule. If testimony *were* strong enough, the event would no longer be a "violation of a law" but a "new law." But Hume argues this never happens in religious contexts.
      *   *So, the User's argument actually highlights a tension in Hume:* If testimony *could* establish a miracle, it wouldn't be a miracle anymore (it would be a natural event we didn't understand).
      *   *Resolution:* The distinction is between **Anomaly** (science) and **Violation** (miracle). Science explains the anomaly as consistent with a deeper law. Miracles claim a suspension of law.
      *   *Step 5 is the target:* Scientific testimony doesn't claim a violation of the *actual* laws of nature; it claims a correction of our *formulation* of them. Miracle testimony claims a violation of the *actual* causal order.

  7.  **Finalizing the Advice:**
      *   Tell the user their argument is a known objection (the "Scientific Miracle" objection).
      *   Identify Step (4) and (5) as the trouble spots.
      *   Explain Hume's distinction between "Proofs" and "Probabilities."
      *   Explain the difference between "Revising a Law" (Science) and "Violating a Law" (Miracle).
      *   Address the circularity charge: It's not circular if we view laws as inductive generalizations. Science improves the generalization; miracles claim exceptions to the generalization itself.
      *   What is lost? You lose the simplicity of Hume's definition. You have to admit that "Laws of Nature" are fallible human constructs, not metaphysical absolutes. Hume is okay with this (he's a skeptic), but it weakens the absolute force of the maxim.

  8.  **Structure of the Response:**
      *   **Validation:** This is a high-quality objection (Earman, Fogelin, etc.).
      *   **Diagnosis:** The error is in **Step (4)** and the inference in **Step (5)**.
      *   **Hume's Defense (The "Proof" Distinction):** Explain Proof vs. Probability.
      *   **Science vs. Miracle:** Explain Theory Change vs. Causal Violation.
      *   **The Circularity Charge:** Address why it's not necessarily viciously circular.
      *   **Cost of Rejection:** What happens if we concede the point? (Hume becomes a fallibilist, maxim becomes heuristic).

  9.  *(Self-Correction during drafting)*: Be careful not to defend Hume too dogmatically. The user is in a grad seminar; they need to see the philosophical tension. Acknowledge that many scholars think the user is *right* to worry, but there are resources within Hume to mitigate it. The "Step 4" issue is the strongest lever. Hume privileges *direct* experience in the definition of law, even if he allows testimony for matters of fact.

  10. **Final Polish:** Ensure tone is appropriate for a grad student (collegial, rigorous, referencing specific Humean concepts like "Proofs").
answer: |-
  This is an excellent argument. You have effectively reconstructed a version of the "Scientific Miracle" objection, which has been discussed by scholars like John Earman, Robert Fogelin, and Peter Lipton. Your worry is well-founded: if Hume's maxim is applied rigidly as an algorithm for belief revision, it threatens to freeze scientific progress just as it freezes religious belief.

  However, to save Hume (or at least to locate the precise point of tension), you need to look closer at **Step (4)** and the inference to **Step (5)**. The argument relies on an equivocation regarding what Hume means by "experience" in the definition of a law of nature, and it conflates *theory revision* with *causal violation*.

  Here is a breakdown of where the argument goes wrong, how a Humean might respond, and what you lose by accepting the Humean defense.

  ### 1. The Problem with Step (4): Direct vs. Mediated Experience
  Your Step (4) claims: *"We do not personally observe most of the uniformities that constitute natural law. We rely on testimony..."*

  While true sociologically, this is **Humeanly suspect**. In Section X, Hume distinguishes between the evidence for a law of nature and the evidence for a specific matter of fact.
  *   **Laws of Nature:** For Hume, these are established by *our own* uniform experience (or experience accessible to us). When Hume says "firm and unalterable experience," he is referring to the psychological force of induction derived from constant conjunctions *we* have observed (e.g., fire burns, men die).
  *   **Testimony:** Testimony is a separate principle of reasoning (based on the observed conformity between reports and reality).

  **The Humean Reply:** Hume would argue that the "proof" against a miracle comes from *your* experience of the regularity of nature, not from the testimony of scientists. You have never seen a dead man come to life. That is your "proof." The testimony of scientists regarding relativity does not rest on *your* uniform experience of time dilation; it rests on *their* experiments, which you accept on testimony.

  Therefore, the weighing mechanism is different:
  *   **Miracle:** Your direct uniform experience (Proof) vs. The Testimony (Probability).
  *   **Scientific Discovery:** Your lack of direct experience (Ignorance) vs. The Testimony of Experts (backed by *their* direct uniform experience/Proof).

  **Where the Argument Fails:** Step (4) assumes the "law" against which the miracle is weighed is itself established by testimony. Hume insists the law is established by *direct* induction. If you rely on testimony to establish the law, you have already lowered the status of that law from a "Proof" to a "Probability," which changes the calculus.

  ### 2. The Problem with Step (5): Violation vs. Revision
  Your Step (5) equates "surprising scientific finding" with "event reported [that] conflicts with our prior uniform experience."

  This is the crux of the matter. Hume distinguishes between **the extraordinary** and **the miraculous**.
  *   **The Extraordinary (Science):** A report that time dilates is contrary to *ordinary* experience, but it is not contrary to *uniform* experience *once the relevant conditions are specified*. Science does not claim "Gravity stopped working"; it claims "Gravity works differently at high masses/speeds." It establishes a *new* uniformity.
  *   **The Miraculous:** A report that a dead man rose is contrary to *all* experience, without establishing a new regularity. It claims a *suspension* of the causal order, not a *refinement* of it.

  **The Humean Reply:** When scientists accept relativity, they are not accepting a "violation of a law of nature" in the Humean sense. They are accepting that their *previous formulation* of the law was incomplete. The "law of nature" is not the Newtonian formula; the "law of nature" is the actual uniform behavior of the universe.
  *   If testimony leads us to revise a law, the event was **not a miracle**; it was a natural phenomenon we previously misunderstood.
  *   If the event is a **miracle**, by definition, it cannot be incorporated into a revised law (it is a singular violation).

  Therefore, Step (5) is false because scientific testimony aims to establish a *new proof* (a new uniformity), whereas miracle testimony aims to establish an *exception to a proof*.

  ### 3. Addressing the Circularity Charge
  You worry: *"Whether some piece of testimony counts as a report of a miracle or as a report that prompts revision of a law depends on whether we are antecedently willing to revise the law."*

  This is the strongest part of your critique. It suggests the maxim is circular: *We reject miracle testimony because it violates a law; we know it violates a law because we reject the testimony.*

  **The Solution:** It is not circular if we view "Laws of Nature" as **inductive generalizations** rather than metaphysical decrees.
  *   **Inductive Status:** The claim "All men die" has an inductive status of near-certainty (a Proof).
  *   **The Claim:** The miracle worker claims "This man did not die."
  *   **The Weighing:** We weigh the probability that the witnesses are lying/deceived against the probability that our induction is wrong.
  *   **The Outcome:** If the testimony is overwhelming (e.g., the man is alive, verified by thousands of independent observers, reproducible), Hume would concede we must accept the event. **But then, it ceases to be a miracle.** It becomes a natural fact (e.g., "Some men can be resuscitated").

  Hume's maxim is not "Believe no testimony for rare events." It is "Believe no testimony for *violations* of uniform experience." If the testimony is strong enough to overturn the uniform experience, the event was never a violation—it was just a new instance of a broader regularity.

  **So, the distinction is not question-begging;** it is outcome-dependent.
  1.  If testimony fails to overturn the prior uniformity → It remains a miracle (and is rejected).
  2.  If testimony succeeds in overturning the prior uniformity → It becomes a scientific discovery (and is accepted).

  The maxim guides the *process*, but the *category* (miracle vs. science) is determined by the result of the weighing.

  ### 4. What You Lose by Rejecting Step (4) and (5)
  If you accept the Humean defense above, you preserve the maxim, but you pay a price. You must concede three things that might be uncomfortable in a modern context:

  1.  **Epistemic Privilege of Direct Experience:** You must accept that *my* direct experience of gravity carries more weight in the "miracle calculus" than *my* trust in scientific testimony. This feels anti-realist regarding unobservable entities. Hume is okay with this; he is a skeptic about things he hasn't seen.
  2.  **The Fallibility of "Laws":** You must admit that what we call a "Law of Nature" is just a very strong habit of expectation. If a miracle *were* proven, it wouldn't break the universe; it would just break our habit. This weakens the rhetorical force of "Violation of a Law."
  3.  **The Maxim is Heuristic, Not Algorithmic:** You have to admit that the maxim doesn't tell us *in advance* what counts as a miracle. It only tells us how to weigh the evidence. This blunts Hume's claim that miracles are *in principle* unbelievable. He has to retreat to "miracles are *in practice* unbelievable given the quality of religious testimony."

  ### Recommendation for Your Seminar
  I suggest you modify your argument to target **Step (5)** specifically, but refine the "Circularity" objection.

  **Revised Argument Strategy:**
  Argue that Hume's distinction between "Revision of Law" (Science) and "Violation of Law" (Miracle) relies on a **metaphysical assumption** that Hume's own empiricism cannot support.
  *   Hume says we only know constant conjunctions.
  *   Therefore, we cannot know the difference between a "Violation" (Miracle) and a "Wider Conjunction" (Science) *until after* the fact.
  *   But the Maxim requires us to make this distinction *before* weighing the testimony (to set the prior probability of the event).
  *   Therefore, the Maxim requires knowledge (the modal status of the event) that is only available after the inquiry is complete.

  **This preserves your insight:** The maxim isn't necessarily *false*, but it is **practically unusable** without a prior commitment to naturalism that the maxim is supposed to justify.

  **Where to look:** Check Hume's distinction between "Proofs" and "Probabilities" in the *Enquiry* (Section VI and X). Also, look at John Earman's *Hume's Abject Failure* for a Bayesian critique that aligns with your worry, and Robert Fogelin's *A Defense of Hume on Miracles* for the counter-argument that you are misreading the "Proof" status of natural laws.

  **Verdict:** Your argument is sound *if* you interpret Hume as offering a timeless algorithm for belief. It fails *if* you interpret Hume as offering a description of psychological forces (where "Proofs" are feelings of certainty derived from direct repetition). The mistake is treating Hume's "firm and unalterable experience" as a public, scientific datum (Step 4) rather than a private, psychological certainty (Step 2).
