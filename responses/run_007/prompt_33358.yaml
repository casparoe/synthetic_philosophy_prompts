prompt: |-
  I am preparing a statement of my considered position on the extended mind debate for our department's work-in-progress group, and before I circulate the statement I would like an audit of whether the position actually hangs together. The view I find myself defending has six parts. First, I accept the parity principle in its standard sense: if a process located outside the skull does work that we would unhesitatingly call cognitive if it were done inside the skull, then it should count as part of the cognitive process. Second, I think the familiar notebook case succeeds — an agent whose memory impairment leads him to keep new information in a notebook he always carries can, under the right conditions, be said to believe what is in the notebook, and the notebook can be part of his standing cognitive system rather than a mere external aid. Third, I take the right conditions to be roughly these: the resource must be available whenever the relevant question or task arises, in the way a notebook carried at all times would be; what it stores must be retrievable with little effort; the agent must accept its deliverances without re-checking them on each occasion; and that default acceptance must trace back to the agent's own earlier endorsement. Fourth, I hold that phenomenal consciousness does not extend, and I regard the extended mind thesis as a claim about cognitive processes and states rather than about conscious experience. Fifth, I am moved by the familiar complaint that the parity principle alone draws no principled line between cognitive coupling and merely causal coupling; I think the view needs some substantive criterion of the cognitive if it is not to slide into the claim that every piece of scaffolding is part of the mind. Sixth, I nevertheless also believe that an external resource can be part of someone's cognitive system even when it is not available at every moment, provided it is reliably available and woven into the person's standing cognitive routines; the mathematician who regularly consults a proof assistant is my test case.

  I have tried and failed to satisfy myself that this set is jointly tenable. Please go through the commitments and tell me which pairs are genuinely in tension, which pairs only look as though they are, and how severe each real tension is. I would like the tensions ranked by severity rather than listed as equally bad, with an account of what each tension would require me to revise and what that revision would cost; if a pair that seems to conflict in fact dissolves on inspection, say why. Then tell me which single revision would leave the position most coherent overall. Finally, say how confident you are in this assessment, and single out the point on which you are least sure.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's position on the extended mind debate:

  1.  **Deconstruct the User's Position:**
      I need to clearly list the six commitments to analyze them effectively.
      *   **C1 (Parity Principle):** Accepts the standard Clark & Chalmers parity principle (functional isomorphism implies cognitive status).
      *   **C2 (Notebook Case):** Accepts the Otto/Inga case (notebook counts as belief/memory).
      *   **C3 (Glue/Trust Conditions):** Specifies conditions for extension: Availability, Accessibility, Endorsement, Trust (the "Glue and Trust" criteria from Clark 2008/2010).
      *   **C4 (Phenomenal Constraint):** Phenomenal consciousness does *not* extend. Extended mind is about cognitive states/processes, not qualia/experience.
      *   **C5 (Coupling-Constitution Fallacy Worry):** Acknowledges the criticism (Adams & Aizawa) that parity alone doesn't distinguish causal coupling from constitution. Needs a substantive criterion of the cognitive.
      *   **C6 (Intermittent Availability):** External resources can be part of the system even if not available *every* moment, provided they are reliably available and woven into routines (e.g., mathematician + proof assistant).

  2.  **Initial Scan for Tensions:**
      *   *C1 & C5:* C1 relies on parity (look at the function). C5 says parity isn't enough because it confuses coupling with constitution. This is a classic tension.
      *   *C3 & C6:* C3 says the resource must be available "whenever the relevant question or task arises" (implies constant/high availability). C6 says it can be part of the system "even when it is not available at every moment." This looks like a direct contradiction regarding availability.
      *   *C2 & C4:* C2 says the notebook holds *beliefs*. C4 says consciousness doesn't extend. Usually, beliefs are dispositional, so this might be okay. But if the notebook is part of the *mind*, does that imply extended consciousness? The user explicitly denies this. Is that consistent?
      *   *C1 & C3:* C1 is the principle, C3 is the specification. Usually consistent, but C3 adds constraints that might weaken C1.
      *   *C5 & C3:* C5 asks for a "substantive criterion of the cognitive." C3 provides criteria (Glue and Trust). Do these satisfy C5? Adams & Aizawa would say no (they are still just causal/functional relations). This is a theoretical tension.

  3.  **Detailed Analysis of Tensions (Pairwise):**

      *   **Tension 1: C3 (Strict Availability) vs. C6 (Intermittent Availability).**
          *   *Analysis:* C3 says "available whenever the relevant question or task arises, in the way a notebook carried at all times would be." C6 says "even when it is not available at every moment."
          *   *Severity:* High. This looks like a direct contradiction in the conditions for extension.
          *   *Resolution:* C3 needs to be relaxed to match C6, or C6 needs to be restricted. The mathematician case suggests "reliably available within the specific context of the routine" rather than "on person at all times."
          *   *Cost:* Revising C3 weakens the analogy to biological memory (which is always on person). Revising C6 loses the mathematician case.

      *   **Tension 2: C1 (Parity) vs. C5 (Coupling-Constitution).**
          *   *Analysis:* C1 says "if it does the work... it counts." C5 says "Parity alone draws no principled line... view needs some substantive criterion."
          *   *Severity:* Medium-High. C5 is a critique of C1. The user accepts C1 *but also* accepts the critique that C1 is insufficient.
          *   *Resolution:* The user treats C3 as the "substantive criterion" required by C5 to fix C1.
          *   *Cost:* If C3 fails to satisfy the critics (Adams & Aizawa), then C5 remains unsatisfied. The tension is whether "Glue and Trust" counts as a *non-derived* mark of the cognitive.

      *   **Tension 3: C4 (No Extended Phenomenology) vs. C2/C1 (Extended Cognition).**
          *   *Analysis:* Can you have extended cognitive states (belief) without extended consciousness?
          *   *Severity:* Low-Medium. This is the standard "Vehicle Externalism" vs. "Phenomenal Externalism" distinction. Most extended mind theorists (Clark) agree with this. Beliefs are dispositional.
          *   *Resolution:* Maintain the distinction between access/processing and phenomenal feel.
          *   *Cost:* None really, this is a standard, defensible position.

      *   **Tension 4: C3 (Endorsement/Trust) vs. C6 (Mathematician/Proof Assistant).**
          *   *Analysis:* C3 requires "default acceptance... trace back to the agent's own earlier endorsement." A proof assistant generates new proofs the agent doesn't fully understand or endorse *until* the output is generated. The agent trusts the *process*, not necessarily the specific token endorsement beforehand.
          *   *Severity:* Medium. The "endorsement" condition in C3 is tricky for complex tools where the output isn't pre-endorsed.
          *   *Resolution:* Broaden "endorsement" to "trust in the reliability of the mechanism."

      *   **Tension 5: C5 (Need for Intrinsic Mark) vs. C3 (Functional Criteria).**
          *   *Analysis:* C5 implies a worry that functional criteria (like C3) are just causal coupling. Adams & Aizawa demand a *non-derived* mark of the cognitive (e.g., intrinsic content). C3 offers functional relations (availability, trust).
          *   *Severity:* Medium-High. Does C3 actually solve the problem raised in C5? Or does it just paper over it?
          *   *Resolution:* The user must commit to the view that functional integration *is* the substantive criterion, rejecting the Adams & Aizawa demand for intrinsic non-derived content.

  4.  **Ranking the Tensions:**

      1.  **C3 vs. C6 (Availability):** This is the most glaring logical inconsistency. "Whenever... in the way a notebook carried at all times" vs "even when not available at every moment."
      2.  **C1 vs. C5 (Parity vs. Coupling):** This is a theoretical instability. Accepting Parity while admitting it's insufficient requires C3 to do heavy lifting. If C3 is just functional, C5's worry persists.
      3.  **C3 vs. C6 (Endorsement/Mathematician):** Specific application of the criteria to the new case.
      4.  **C4 vs. C1/C2:** Least severe, standard view.

  5.  **Determining the Best Single Revision:**
      *   *Option A: Drop C6.* Stick to the strict Otto case. *Cost:* Loses the ability to account for modern tech (cloud, specialized tools).
      *   *Option B: Revise C3.* Relax the availability condition to match C6. *Cost:* Weakens the parity with biological memory (I don't lose my brain when I leave the room). Makes the boundary fuzzier.
      *   *Option C: Drop C5.* Just trust Parity. *Cost:* Vulnerable to coupling-constitution fallacy.
      *   *Option D: Refine C5/C3 relationship.* Clarify that C3 *is* the answer to C5.

      *Decision:* The most coherent fix is to **Revise C3**. The strict wording of C3 ("whenever... in the way a notebook carried at all times") contradicts C6. C6 represents a more nuanced, mature view of extension (systematic integration vs. constant proximity). Revising C3 to emphasize *reliable integration* over *constant proximity* aligns it with C6 and preserves C1, C2, C5, and C4.

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the position (it's a Clarkian view).
      *   **Audit of Tensions:** Go through the pairs.
          *   *Critical:* C3 vs. C6 (Availability).
          *   *Theoretical:* C1 vs. C5 (Parity vs. Criterion).
          *   *Minor:* C3 vs. C6 (Endorsement).
          *   *Dissolved:* C4 vs. C1/C2.
      *   **Ranking:** Severity 1 (C3/C6 Availability), Severity 2 (C1/C5), Severity 3 (C3/C6 Endorsement).
      *   **Recommendation:** Revise C3. Explain why.
      *   **Confidence & Uncertainty:** High confidence on the logical contradiction. Least sure on the philosophical viability of the "substantive criterion" (C5) because that depends on external debates (Adams & Aizawa vs. Clark).

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I address "what that revision would cost"? Yes, need to emphasize the cost of loosening C3 (blurring the line between tool and mind).
      *   *Check:* Did I address "which pair dissolves"? Yes, C4 vs Cognition.
      *   *Check:* Is the tone appropriate? Academic, constructive, rigorous.
      *   *Nuance on C5:* The user says "Parity principle *alone* draws no principled line." This implies they think Parity + C3 *does*. I need to evaluate if that holds. It holds *if* one accepts functionalism. It fails if one accepts bio-chemical essentialism. I should note this dependency.
      *   *Nuance on C3 vs C6:* C3 says "available whenever the relevant question... arises." C6 says "not available at every moment." These aren't *strictly* contradictory if "every moment" means "every moment of the day" vs "every moment the task arises." However, C3 adds "in the way a notebook carried at all times would be." This implies constant portability. C6 explicitly contrasts with this ("even when it is not available at every moment"). I need to be precise here. The tension is between *constant portability* and *contextual reliability*.

  8.  **Final Polish:** Ensure the ranking is clear and the recommendation is actionable. (Proceed to generate output based on these thoughts).

      *Wait, one more check on C5:* The user says "I think the view needs some substantive criterion of the cognitive." This is an admission that Parity (C1) isn't enough. But C3 *is* that criterion. So C1+C3+C5 is actually a coherent package *unless* C3 fails to be "substantive" enough. The tension is really between C5's worry and the *sufficiency* of C3. But the logical contradiction between C3 and C6 is sharper. I will prioritize the logical contradiction.

      *Wait, check C4 again:* "Phenomenal consciousness does not extend." Some argue that if cognitive states extend, and some cognitive states are conscious, then consciousness extends. But the user specifies "standing cognitive system" (C2) and beliefs (C2). Beliefs are typically dispositional, not occurrent/phenomenal. So C4 is safe *provided* the user sticks to dispositional states for extension. I should mention this constraint.

