answer: |-
  First off, I am terribly sorry for your loss. Three years can feel like both a lifetime and the blink of an eye when it comes to grief.

  To answer your question directly: no, it is not a daft way to think about it in the least. In fact, what you are describing is a profound insight into both how our brains work and what we might mean by 'personhood'. Your friend meant well, I'm sure, but reducing it to "just memory" is a bit like saying a symphony is "just vibrations in the air". It's technically true, but it misses the music entirely.

  Here is why your intuition about a distributed self holds water, both psychologically and philosophically.

  **The High-Fidelity Simulation**
  Psychologically, what you are experiencing is often referred to as an 'internalised object'. When we are close to someone, especially a parent, our brains spend years building a predictive model of them. We learn their values, their cadence, their logic, and their quirks. Because your relationship was significant, your brain built a very high-fidelity simulation of him.

  The fact that this simulation can generate *new* thoughts—things he didn't explicitly say but *would* have said—is actually the most fascinating part. It suggests your brain isn't just playing back a recording; it is running his 'software' on your hardware. You have integrated his heuristics (his mental shortcuts for decision-making) into your own cognitive process. In a very real, functional sense, when you consult that voice, you are utilising his wisdom.

  **The Distributed Self**
  Philosophically, your idea that a self can persist in a distributed way is quite robust. There is a school of thought that suggests the 'self' isn't contained entirely within the skin of an individual. We are social creatures; our identities are co-authored by the people around us.

  When someone dies, their biological processes stop, but their causal influence does not. They have shaped the neural pathways of everyone who loved them. If you act with his kindness, or make a decision using his logic, his agency is effectively extending through time via you. Some philosophers and cognitive scientists argue that we are, in a sense, 'node-like'. We exist in the connections between us. So, the idea that a bit of him is distributed across the minds of those who knew him well isn't just poetic; it's a plausible description of social cognition.

  **What This Means for Grief**
  If we accept this, it changes the landscape of grief considerably. The old-fashioned view of grief was about 'letting go' or 'moving on', as if the goal is to sever the tie. But if a part of him genuinely resides in your decision-making processes, severing that tie would be a loss of a part of yourself.

  Modern grief theory talks about 'continuing bonds'. This suggests that the healthy path isn't to forget, but to find a new way to relate to the person who has died. The internal conversations you are having are a form of continuing bond. They allow you to navigate life with the benefit of his presence, even if his physical presence is gone. It transforms grief from a state of pure absence into a state of transformed presence.

  **What This Means for Personhood**
  It also challenges the idea that we are isolated islands. If you can run a simulation of your dad that is accurate enough to offer novel advice, then 'you' are partly constituted by him. We are all patchworks of the people who have raised us, loved us, and taught us. When we die, we don't vanish instantly; we fade out slowly as the memories and influences we left in others eventually fade or are passed on.

  **In Summary**
  You are not imagining things, and you are certainly not going mad. You are experiencing the depth of your connection with him. Your brain has preserved his voice because it was valuable to you, and by extension, it has preserved a part of his agency.

  It is perfectly alright to cherish these conversations. They are a testament to how well you knew him and how much he shaped the person you are today. If that feels like a little bit of him is still here, then in the only way that truly matters for the living, he is.

  Do take care of yourself, and don't let anyone convince you that keeping him close in this way is anything other than a beautiful adaptation to loss.
