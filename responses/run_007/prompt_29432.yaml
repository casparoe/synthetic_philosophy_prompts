answer: |-
  Your suspicion is correct: Spinoza's natural equality is a descriptive claim about the absence of inherent authority among independent powers, not a normative claim about universal human worth requiring equal political liberty.

  In Spinoza's metaphysics, natural right is coextensive with power (*potentia*), meaning an individual's entitlement is strictly limited by their capacity to exist and act against resistance. Consequently, the "equality" of the state of nature does not imply that all humans possess equal strength or reason, but rather that no one is naturally subject to another's jurisdiction unless subdued by superior force or dependency. When Spinoza identifies democracy as the most natural regime, he means it minimizes the alienation of this power by aggregating the rights of all those who are *sui juris* (their own master), rather than transferring them to a single monarch or a select few.

  This framework excludes universal suffrage because Spinoza empirically argues that women, servants, and children are naturally *alieni juris* (under another's control) due to perceived deficits in reason or economic dependence. Since they lack the independent power required to hold natural right in the political sense, including them would not preserve natural equality but rather violate the natural hierarchy of capacity that defines his metaphysics. Thus, democracy preserves the natural condition only for the subset of the population deemed capable of autonomous existence, making it a system of collective power rather than universal moral liberation.

  The phrase "most natural" therefore functions as a claim about political stability and affective alignment rather than moral justice, ensuring the sovereign's power mirrors the actual distribution of power within the multitude. By restricting the majority to independent males, Spinoza ensures the state rests on those he believes possess the rational and physical capacity to sustain it, avoiding the instability he associates with those governed primarily by passion. Ultimately, his democracy is natural because it aligns the civil order with the actual inequalities of power found in nature, rather than attempting to overturn them through universal enfranchisement.
