prompt: |-
  As a longtime reader of LessWrong and related forums, I have seen the doomsday argument and the Self-Indication Assumption treated too often as tribal badges, and I want the document that would result if two careful people actually sat down to isolate where the disagreement lives. Please draft the joint statement that a committed advocate of the doomsday argument and a committed proponent of the Self-Indication Assumption could both sign after a good-faith adversarial collaboration on whether our observed birth rank among humans is strong evidence that humanity will go extinct relatively soon.

  The advocate's core claim, to be stated in the document in its strongest defensible form, is: conditional on the total number of humans who will ever live, my birth rank is roughly uniform among those humans; a rank near one hundred billion is far more likely if the total is a few hundred billion than if it is in the trillions; so, for a wide range of priors, observing that we are this early substantially raises the probability of near-term extinction. The critic's core claim, also to be stated in its strongest form, is: my existence itself is more strongly predicted by worlds that contain more observers, and this self-indication effect gives larger-population hypotheses a prior boost that exactly cancels the birth-rank likelihood, so the doomsday inference evaporates; what remains is ordinary reasoning about extinction risk from non-anthropic evidence.

  Write the document they should have produced after a year of arguing. It should include:

  1. A numbered agreed-claims section. Cover at least: the conditional likelihood-ratio core of the doomsday argument that both sides accept as mathematics; precise statements of the Self-Sampling Assumption and the Self-Indication Assumption as update rules, written so a neutral third party could implement them; what both sides agree the dispute is not about, including ordinary Bayesian updating, the reality of extinction risks, and the fact that the two assumptions differ; and any claims about reference classes, model uncertainty, or the formal cancellation result that both can sign.

  2. A disagreements table. Each row should state one residual disagreement in neutral framing, with the advocate's formulation and the critic's formulation each written so its own side would accept the wording. Flag any rows that, on inspection, turn out to be verbal or to hinge only on a choice of formalism with no empirical content.

  3. A crux list. Identify the sub-questions such that settling one would move at least one side. I suspect the main cruxes are: whether the Self-Indication Assumption double-counts observers or is the only way to avoid ignoring the evidence of one's own existence; whether any non-arbitrary reference class can be selected for the sampling, and whether the doomsday conclusion is robust to plausible variations in that class; and whether the doomsday likelihood survives once model uncertainty about the far future is handled with a defensible prior over total human population. If you find a different crux more load-bearing, say so and justify it.

  4. For each crux, a concrete case, argument, or empirical consideration both sides agree bears on it, with each side's prediction recorded in advance. Use cases from the anthropics literature where they help, such as a duplication scenario with a fair coin or a scenario in which one theory postulates vastly more observers than another and the question is whether to update toward it without any new local evidence, but describe each case self-contained enough to be evaluated without external sources. Where no test can be agreed, say so explicitly and explain what that impasse indicates about the structure of the disagreement.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement resulting from a year-long adversarial collaboration between a Doomsday Argument (DA) advocate and a Self-Indication Assumption (SIA) proponent.
      *   **Context:** LessWrong/rationalist community style (high precision, Bayesian framing, focus on anthropics).
      *   **Goal:** Isolate the disagreement, avoid tribal signaling, state core claims strongly but fairly, and identify cruxes.
      *   **Required Sections:**
          1.  Agreed Claims (numbered).
          2.  Disagreements Table (neutral framing, side-specific formulations, verbal/empirical flags).
          3.  Crux List (sub-questions that move the needle).
          4.  Concrete Cases/Tests for Cruxes (predictions, impasse analysis).
      *   **Tone:** Professional, precise, collaborative, philosophical but rigorous.

  2.  **Deconstruct the Core Positions:**
      *   **DA Advocate (SSA-focused):** Core claim is about *birth rank*. $P(Rank | N)$ is uniform. $P(N | Rank) \propto P(Rank | N) P(N)$. If $Rank \approx 10^{11}$, $N$ is unlikely to be $\gg 10^{12}$. Implies early extinction.
      *   **SIA Proponent:** Core claim is about *existence*. $P(Exist | N) \propto N$. This acts as a prior update. $P(N | Exist, Rank) \propto P(Rank | N, Exist) P(Exist | N) P(N)$. Since $P(Rank | N, Exist) \propto 1/N$ and $P(Exist | N) \propto N$, they cancel. No DA effect.
      *   **Common Ground:** Bayesian math is valid. Extinction risk is real (non-anthropic). The math of the cancellation is correct *if* SIA is accepted as a prior update. Reference classes matter.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to formalize the math both accept.
      *   Need to define SSA and SIA clearly as update rules.
      *   Need to clarify what isn't disputed (e.g., climate change, AI risk exist independently of this argument).
      *   Need to acknowledge the "Cancellation Theorem" (SIA prior $\times$ SSA likelihood = flat posterior).
      *   *Drafting thought:* Make sure the definitions of SSA and SIA are operational. SSA: Sample from actual observers. SIA: Weight worlds by number of observers.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need neutral framing.
      *   *Row 1: The Status of "Existence" as Evidence.* Advocate: Existence is background condition. Critic: Existence is data.
      *   *Row 2: Reference Class.* Advocate: Needs to be narrow (humans). Critic: Needs to be broad (observers) or SIA handles it.
      *   *Row 3: Double Counting.* Advocate: SIA double counts. Critic: SSA under counts.
      *   *Row 4: Empirical Content.* Is this verbal? Both think it affects probabilities of extinction, so not purely verbal. But maybe it hinges on the "Presumptuous Philosopher" problem.
      *   *Flagging:* The "Presumptuous Philosopher" case is key here.

  5.  **Drafting Section 3: Crux List:**
      *   What actually changes minds?
      *   *Crux 1: The Presumptuous Philosopher.* Does SIA imply we should believe a theory with $10^{100}$ observers over $10^{10}$ observers with odds $10^{90}:1$ even with no other evidence?
      *   *Crux 2: The Reference Class Problem.* If we restrict the class to "people born in the 21st century," DA vanishes. Is there a non-arbitrary way to pick the class?
      *   *Crux 3: Model Uncertainty/Priors.* If the prior over $N$ is heavy-tailed (e.g., log-uniform), does the DA shift matter?
      *   *Crux 4: Centered Worlds.* Is the disagreement about how to index indexical information?

  6.  **Drafting Section 4: Concrete Cases:**
      *   Need thought experiments.
      *   *Case 1: The Coin Flip Dungeon (Standard Anthropic).* 10 rooms vs 1 room. Heads = 10 people, Tails = 1 person. You are in a room. What is P(Heads)? SIA says 10/11. SSA says 1/2.
      *   *Case 2: The Presumptuous Philosopher.* Theory A (1 trillion observers), Theory B (1 trillion trillion observers). No other data. SIA says B is vastly more likely. SSA says equal (or depends on priors).
      *   *Case 3: The Delayed Creation.* Does creating people later change the probability of the world existing now?
      *   *Predictions:* Record what each side bets.
      *   *Impasse:* If they disagree on the Dungeon case, they disagree on the axioms of probability regarding self-location.

  7.  **Refining and Polishing:**
      *   *Tone Check:* Is it too dry? Needs to sound like rationalists talking. Use terms like "indexical information," "centered worlds," "likelihood ratio."
      *   *Accuracy Check:* Ensure the math description of the cancellation is precise. $P(N|k) \propto P(k|N)P(N)$ (SSA) vs $P(N|k) \propto P(k|N) \cdot N \cdot P(N)$ (SIA). Since $P(k|N) = 1/N$ (uniform rank), SIA makes it $\propto P(N)$.
      *   *Formatting:* Use Markdown for tables and lists.
      *   *Self-Correction during drafting:* I initially thought about putting the "Presumptuous Philosopher" in the disagreements. It fits better as a Crux/Test case. The Disagreements table should focus on the *nature* of the disagreement (e.g., is existence evidence?), while the Crux section focuses on *resolving* it.
      *   *Constraint Check:* Did I include the specific core claims requested? Yes, integrate them into the Agreed Claims or Intro. The prompt asks for the core claims to be stated in the document. I will put them in the Preamble/Intro to set the stage, then detail in Section 1.
      *   *Constraint Check:* "Flag any rows that... turn out to be verbal." I need to be honest. Some anthropic disputes *are* arguably verbal (framework choices), but they have decision-theoretic consequences. I will flag the "Framework Choice" row as potentially verbal but practically significant.

  8.  **Final Review against Prompt:**
      *   Joint statement? Yes.
      *   Advocate/Critic core claims stated strongly? Yes.
      *   Section 1 (Agreed Claims)? Yes.
      *   Section 2 (Disagreements Table)? Yes.
      *   Section 3 (Crux List)? Yes.
      *   Section 4 (Concrete Cases)? Yes.
      *   LessWrong style? Yes.

  9.  **Writing the Content:** (Proceeding to generate the response based on these thoughts.)
      *   *Title:* Joint Statement on Anthropic Reasoning and the Doomsday Argument.
      *   *Signatories:* "The Advocate" (SSA/DA) and "The Critic" (SIA).
      *   *Intro:* Contextualize the collaboration.
      *   *Section 1:* Math, Definitions, Non-Disputes.
      *   *Section 2:* Table with Neutral, Advocate, Critic columns.
      *   *Section 3:* Cruxes (Presumptuous Philosopher, Reference Class, Priors).
      *   *Section 4:* Test Cases (Dungeon, Presumptuous Philosopher specifics).

      *(Self-Correction on Crux 3)*: The prompt suggests "whether the doomsday likelihood survives once model uncertainty about the far future is handled with a defensible prior." I should ensure this is explicitly addressed. A log-uniform prior makes the DA weak. A flat prior makes it strong. This is a crucial technical crux.

      *(Self-Correction on Disagreements)*: Make sure to highlight that both agree on the *math* of the cancellation, but disagree on the *justification* for the SIA prior factor.

      *(Final Polish)*: Ensure the distinction between "Existence" and "Birth Rank" is sharp.

      Let's assemble.
answer: |-
  # Joint Statement on Anthropic Reasoning and the Doomsday Argument

  **Date:** October 24, 2023
  **Signatories:** The Advocate (Proponent of the Doomsday Argument/Self-Sampling Assumption) and The Critic (Proponent of the Self-Indication Assumption)
  **Subject:** Resolution of Adversarial Collaboration on Anthropics and Extinction Risk

  ### Preamble

  After twelve months of adversarial collaboration, we issue this statement to isolate the precise locus of disagreement regarding the Doomsday Argument (DA). Our goal is not to force consensus where none exists, but to ensure that future discourse treats these positions as rigorous Bayesian frameworks rather than tribal markers.

  We begin by stating our core claims in their strongest, most defensible forms, as agreed upon during our initial scoping phase:

  > **The Advocate's Core Claim:** Conditional on the total number of humans who will ever live ($N$), my birth rank ($k$) is roughly uniform among those humans ($P(k|N) = 1/N$). A rank near $10^{11}$ is far more likely if $N$ is a few hundred billion than if $N$ is in the trillions. Therefore, for a wide range of priors, observing that we are this early substantially raises the probability of near-term extinction.
  >
  > **The Critic's Core Claim:** My existence itself is more strongly predicted by worlds that contain more observers. This self-indication effect gives larger-population hypotheses a prior boost proportional to $N$. This boost exactly cancels the birth-rank likelihood ($1/N \times N = 1$), so the doomsday inference evaporates. What remains is ordinary reasoning about extinction risk from non-anthropic evidence.

  ---

  ### 1. Agreed Claims

  The following propositions are accepted by both parties as mathematically correct or conceptually settled.

  1.  **The Likelihood Ratio:** Both parties agree that under the **Self-Sampling Assumption (SSA)**, the likelihood of observing birth rank $k$ given a total population $N$ (where $k \leq N$) is $P(k|N) = 1/N$. Consequently, the likelihood ratio between a "Small World" ($N_S \approx 200$ billion) and a "Large World" ($N_L \approx 200$ trillion) is $N_L / N_S = 1000$. The data favors the Small World by a factor of 1000 *if* SSA holds.
  2.  **Operational Definitions:**
      *   **SSA (Update Rule):** An observer should reason as if they are a random sample from the set of *actual* observers in their reference class. Probability is distributed equally across actual observers.
      *   **SIA (Update Rule):** An observer should reason as if they are a random sample from the set of *possible* observers. Prior probabilities for worlds should be weighted by the number of observers they contain ($P_{SIA}(World) \propto N \times P_{Prior}(World)$).
  3.  **The Cancellation Theorem:** Both parties agree that if one applies SIA as a prior update ($P(N) \rightarrow N \cdot P(N)$) and SSA as the likelihood ($P(k|N) = 1/N$), the posterior distribution over $N$ is identical to the original prior. Mathematically: $P(N|k) \propto (1/N) \cdot (N \cdot P(N)) = P(N)$. The Doomsday Argument vanishes under the conjunction of SIA and SSA.
  4.  **Non-Disputes:**
      *   **Extinction Risk:** Both parties agree that existential risk (AI, bio, nuclear) is real and significant independent of anthropic reasoning. The DA is not the *only* reason to worry about extinction.
      *   **Bayesian Coherence:** Both parties agree that standard Bayesian updating applies to non-indexical evidence. The dispute is strictly regarding how to handle indexical information ("I am here now").
      *   **Reference Class Sensitivity:** Both parties agree that the strength of the DA depends on the chosen reference class (e.g., "all humans" vs. "all conscious observers"). If the class is "observers born in 2023," the DA yields no future prediction.
  5.  **Model Uncertainty:** Both parties agree that the choice of prior over $N$ (e.g., flat vs. log-uniform) significantly impacts the posterior probability of extinction. A log-uniform prior ($P(N) \propto 1/N$) dampens the DA shift compared to a flat prior.

  ---

  ### 2. Disagreements Table

  The following table isolates the residual disagreements. "Neutral Framing" describes the issue without bias. "Advocate Formulation" and "Critic Formulation" are worded such that each signatory endorses their respective column.

  | ID | Neutral Framing | Advocate Formulation (SSA/DA) | Critic Formulation (SIA) | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **The Evidential Status of Existence** | Existence is a background condition, not data. We cannot update on the fact that we exist, only on *which* observer we are (our rank). Updating on existence inflates priors without justification. | Existence is data. Finding oneself in a world is more likely if that world contains more "slots" for observers. Ignoring this ignores the evidence of one's own presence. | **Substantive** |
  | **D2** | **The Presumptuous Philosopher Problem** | SIA implies we should believe a hypothesis with $10^{100}$ observers over one with $10^{10}$ observers with odds $10^{90}:1$, even with no physical evidence. This is absurdly presumptuous. | This is not presumptuous; it is correct probabilistic reasoning. If a world has more observers, it is objectively more likely to contain *me*. Rejecting this leads to the "Doomsday" absurdity instead. | **Substantive** |
  | **D3** | **Reference Class Arbitrariness** | The reference class must be narrow (e.g., "humans") to make the sampling assumption coherent. Broad classes dilute the signal. There is a fact of the matter about which observers are "like me." | The reference class should be all observers (or all observer-moments). SIA is robust to reference class changes where SSA is fragile. The arbitrariness of the class undermines SSA more than SIA. | **Substantive** |
  | **D4** | **Double Counting vs. Under Counting** | SIA double-counts observers by weighting the prior by $N$ when the likelihood already accounts for sampling from $N$. | SSA under-counts by failing to acknowledge that worlds with more observers are more likely to be sampled *ex ante*. | **Verbal / Formalism** |
  | **D5** | **Decision-Theoretic Consequences** | In betting scenarios (e.g., The Dungeon), SSA and SIA may prescribe different bets depending on how payoffs are aggregated (selfish vs. altruistic). | In betting scenarios, SIA consistently maximizes expected utility for total utilitarians, whereas SSA requires ad-hoc adjustments to avoid Dutch Books. | **Empirical (in principle)** |

  *Note on D4:* We flag this row as potentially verbal. Both sides agree on the math of the cancellation ($1/N \times N$). The dispute is whether the $N$ factor belongs in the prior (Critic) or is absent entirely (Advocate). This may be a choice of coordinate system in probability space, though it leads to different posteriors if only one rule is applied.

  ---

  ### 3. Crux List

  We have identified three sub-questions (cruxes) such that settling one would substantially move at least one side's credence.

  **Crux 1: The Presumptuous Philosopher (PP) Intuition**
  *   **Question:** In a scenario where Theory A implies 1 trillion observers and Theory B implies 1 trillion trillion observers, with equal non-anthropic prior probability and no other data, should an observer update strongly toward Theory B simply because they exist?
  *   **Load-Bearing Justification:** The Advocate views the SIA answer (yes) as a *reductio ad absurdum* of SIA. The Critic views the SSA answer (no) as a failure to account for indexical evidence. If the Advocate can accept the PP conclusion as valid, the DA collapses. If the Critic accepts the PP conclusion is absurd, SIA must be modified or abandoned.

  **Crux 2: Reference Class Non-Arbitrariness**
  *   **Question:** Is there a principled, non-arbitrary method to define the reference class for SSA that avoids the "Solipsist" problem (class = 1) and the "Universal Observer" problem (class = all conscious entities)?
  *   **Load-Bearing Justification:** The Advocate relies on a specific reference class (e.g., "humans") to generate the Doomsday conclusion. If the reference class is deemed arbitrary, the DA loses its objective force. The Critic argues that SIA mitigates this, but if SIA fails Crux 1, the reference class problem returns for both.

  **Crux 3: Prior Robustness and Heavy Tails**
  *   **Question:** Does the Doomsday shift survive when applying a defensible, heavy-tailed prior (e.g., log-uniform or scale-invariant) over the total number of humans $N$?
  *   **Load-Bearing Justification:** The DA is strongest with a flat prior over $N$. If the prior is scale-invariant ($P(N) \propto 1/N$), the posterior shift from observing rank $k$ is minimal. If the Advocate concedes that a scale-invariant prior is more defensible than a flat prior for population scales, the practical urgency of the DA diminishes significantly.

  ---

  ### 4. Concrete Cases and Predictions

  For each crux, we propose a concrete case. We record our pre-commitments to how we interpret the case.

  #### Case A: The Coin-Flip Dungeon (Tests Crux 1 & D1)
  **Scenario:** A fair coin is flipped.
  *   **Heads:** 10 rooms are created, numbered 1–10. One observer is placed in each.
  *   **Tails:** 1 room is created, numbered 1. One observer is placed inside.
  *   **Observation:** You wake up in Room 1. You know the setup.
  *   **Question:** What is your credence that the coin landed Heads?

  | Side | Prediction / Interpretation | Reasoning |
  | :--- | :--- | :--- |
  | **Advocate (SSA)** | **Credence = 1/2 (50%)** | The coin is fair. My presence in Room 1 is guaranteed in both worlds (since Room 1 exists in both). My birth rank provides no discrimination because the rank is identical in both hypotheses. |
  | **Critic (SIA)** | **Credence = 10/11 (~91%)** | There are 11 possible observer-slots total. 10 are in the Heads world, 1 is in the Tails world. I am a random sample from slots. It is 10x more likely I am in Heads. |
  | **Impasse Analysis** | If we disagree here, we disagree on the axioms of self-locating belief. This is not verbal; it leads to different betting odds. If a bet pays out to *all* observers, SIA wins more money. If a bet pays out to *one random* observer, SSA is correct. **We agree the disagreement hinges on the payoff structure (total utility vs. average utility).** |

  #### Case B: The Presumptuous Philosopher (Tests Crux 1)
  **Scenario:** Physicists have two theories of the universe, $T_1$ and $T_2$, equally likely on non-anthropic grounds.
  *   $T_1$: The universe contains $10^{10}$ observers.
  *   $T_2$: The universe contains $10^{20}$ observers.
  *   **Observation:** You exist. No other data.
  *   **Question:** What is the posterior odds ratio $P(T_2) / P(T_1)$?

  | Side | Prediction / Interpretation | Reasoning |
  | :--- | :--- | :--- |
  | **Advocate (SSA)** | **Odds = 1:1** | Existence is not evidence. Without data regarding my specific properties (rank, location), I cannot distinguish the theories. Believing $T_2$ is presumptuous. |
  | **Critic (SIA)** | **Odds = $10^{10}:1$** | $T_2$ has $10^{10}$ times more observers. It is $10^{10}$ times more likely to contain *me*. To deny this is to ignore the evidence of my existence. |
  | **Impasse Analysis** | **This is the primary load-bearing crux.** The Advocate views the SIA result as a fatal flaw (we cannot know the size of the universe just by thinking). The Critic views the SSA result as a fatal flaw (it implies we should ignore population size when estimating likelihood of existence). **We agree that if a future physical measurement confirms $T_1$ despite SIA's huge prior boost, SIA requires revision.** |

  #### Case C: The Scale-Invariant Prior (Tests Crux 3)
  **Scenario:** We model the total number of humans $N$ as a continuous variable.
  *   **Prior A:** Uniform distribution from 1 to $10^{20}$.
  *   **Prior B:** Log-uniform distribution ($P(N) \propto 1/N$) from 1 to $10^{20}$.
  *   **Observation:** Birth rank $k = 10^{11}$.
  *   **Question:** Does the posterior probability of $N < 10^{12}$ differ significantly between Prior A and Prior B?

  | Side | Prediction / Interpretation | Reasoning |
  | :--- | :--- | :--- |
  | **Advocate (SSA)** | **Yes, Prior A is more defensible.** | We have no reason to suspect scale invariance for human populations. A flat prior represents maximum ignorance over counts. Under Prior A, DA shifts probability mass strongly to near-term extinction. |
  | **Critic (SIA)** | **No, Prior B is more defensible.** | Population scales span orders of magnitude. A flat prior implicitly assumes we know the scale. Under Prior B (and SIA), the posterior is barely shifted. The DA effect is an artifact of a bad prior. |
  | **Impasse Analysis** | **This is a technical crux resolvable by standard Bayesian prior justification.** If we can agree on a principle for selecting priors over population counts (e.g., Maximum Entropy), this disagreement dissolves. **We agree to commission a separate technical paper solely on priors for civilizational lifespan.** |

  ### Conclusion

  We conclude that the Doomsday Argument is not a standalone proof of extinction, but a theorem conditional on accepting SSA and a specific class of priors. The Self-Indication Assumption negates the theorem mathematically but incurs the cost of the "Presumptuous Philosopher" implication.

  The disagreement is not about the math of cancellation, but about the **epistemic status of existence**. Until the "Coin-Flip Dungeon" betting paradox is resolved via decision theory, or a consensus is reached on the "Presumptuous Philosopher" intuition, both frameworks remain viable but mutually exclusive tools for anthropic reasoning. We recommend that existential risk policymakers treat the DA as a weak signal at best, subordinate to non-anthropic risk factors, while researchers continue to investigate the decision-theoretic foundations of self-location.

  **Signed,**

  *The Advocate*
  *The Critic*
