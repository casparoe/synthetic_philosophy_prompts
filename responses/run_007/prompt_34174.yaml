answer: |-
  This is a sharp and well-constructed objection. It effectively reconstructs the tension between **diachronic coherence** (Conditionalization) and **diachronic trust** (Reflection), a debate that has occupied formal epistemologists since Christensen (1991) and Elga (2007).

  You are right to be suspicious of **Step (3)**, but the fatal error actually occurs in **Step (7)**. The argument conflates *maximizing expected accuracy from a current perspective* with *deferring to a future perspective regardless of its etiology*.

  Here is the diagnosis of where the argument breaks, how the accuracy-first program repairs it, and what the actual cost is.

  ### The Fatal Flaw: Step (7)

  Step (7) claims: *If the privileged function is whatever function best responds to total evidence, then the fact about her future credence... is itself part of her total evidence at noon. Should that fact push her current credence toward 0.95? That sounds very much like the Reflection Principle.*

  This inference is invalid within the accuracy-first framework. Here is why:

  In the accuracy-first framework (specifically the Greaves-Wallace argument), the norm is to adopt the updating plan that maximizes **expected accuracy calculated from your current credences**.

  In the drug case, your current credences ($Cr_{now}$) include the proposition: *"At 1 p.m., my credence in $P$ will be caused by a reasoning-impairing drug, not by evidence."*

  When you calculate the expected accuracy of the plan *"Adopt whatever credence I have at 1 p.m."*, you must weight the accuracy of that future credence by your *current* probability that the future credence is accurate. Since your current evidence tells you the drug severs the link between evidence and credence, your current credence assigns low probability to the claim that $Cr_{drug}(P)$ is accurate.

  Therefore, the plan *"Defer to my future self"* has **lower** expected accuracy (by your current lights) than the plan *"Stick to Conditionalization on my actual evidence."*

  **The Correction:** The accuracy-first framework does not support the universal Reflection Principle. It supports a **Restricted Reflection Principle**: *Defer to your future self only to the extent that you currently believe your future self is responding rationally to evidence.*

  Step (7) assumes that "future credence" is always evidence for the *proposition*. In the drug case, "future credence" is evidence for the *state of the drug*, not the proposition $P$. The accuracy-first framework captures this distinction naturally through the calculation of expected accuracy. You do not maximize expected accuracy by deferring to a known liar (or a known drugged self).

  ### Fixing Step (3): Perspectivism, Not Privilege

  You suspected Step (3): *"Cr_now encodes the agent's total evidence and her best rational response to it. So it is the right baseline."*

  The worry here is that if $Cr_{now}$ is the baseline, doesn't that insulate irrational priors? (This feeds into your Horn 1).

  The repair is to clarify that $Cr_{now}$ is privileged not because it is *correct*, but because rationality is **perspectival**. You cannot maximize expected accuracy relative to a "God's eye view"; you can only maximize it relative to what you currently believe.

  However, this does not make the framework toothless (Horn 1) because of **Strict Propriety**.
  *   **Strict Propriety:** A scoring rule is strictly proper if and only if a credence function $C$ expects *itself* to be more accurate than any other function $C'$.
  *   **Immodesty:** As a consequence, every probabilistic credence function is "immodest"—it thinks it is the best one.

  Does this mean a coherent bigot (0.99 in a falsehood) is immune to criticism?
  *   **Ex Ante:** Yes, accuracy-first epistemology (in its Joycean form) is often **permissivist** about priors. It says coherence is the only synchronic norm. If you think this is "toothless," that is a substantive disagreement about rationality, not a collapse of the framework.
  *   **Ex Post:** However, the framework *does* criticize the bigot's *updating*. If the bigot receives evidence against their view and refuses to update, they violate Conditionalization. The Greaves-Wallace argument shows that *any* non-conditionalizing plan is accuracy-dominated *by the agent's own lights*.

  So, Horn 1 is a false dilemma. The framework *does* criticize irrational updating (even for bigots), and it *does not* criticize rational non-deference (in the drug case).

  ### Dissolving the Dilemma (Step 9)

  Let's re-evaluate the dilemma with these corrections.

  **Horn 1 (Toothlessness):**
  *   *Claim:* The framework can't criticize coherent but wrong priors.
  *   *Reply:* This is a feature (Permissivism), not a bug. But more importantly, the framework *does* criticize the *plan* to defer to the drugged self. It tells the agent at noon: "Do not adopt the plan 'Become my 1 p.m. self'." It successfully identifies the irrationality in the *transition*, which is the focus of the Conditionalization argument.

  **Horn 2 (Forced Reflection):**
  *   *Claim:* The framework forces the agent to defer to the drugged self.
  *   *Reply:* False. As shown in the analysis of Step (7), the expected accuracy calculation incorporates the reliability of the future process. Since the agent knows the drug impairs reasoning, the expected accuracy of the "Defer" plan is low. The framework correctly advises *against* Reflection in this case.

  ### The Cost of the Repair

  You asked what the damage is. The repair is not costly, but it does require accepting two specific commitments that are standard in the literature but worth making explicit:

  1.  **Conditionalization is for Evidential Learning:** The Greaves-Wallace theorem applies to updating rules triggered by *partitions of evidence*. The drug case is not an evidential update; it is a known, non-evidential shift. The framework must distinguish between *learning* (conditionalizing) and *shifting* (other changes). This is standard (see Briggs & Pettigrew 2020), but it limits the scope of the Conditionalization norm.
  2.  **Rationality is Perspectival:** You must accept that there is no "view from nowhere" to calculate expected accuracy. We judge rationality by whether the agent maximizes accuracy *given what they believe*. This means the framework cannot condemn a coherent prior as "irrational" simply because it is far from the truth (unless you add extra norms like the Principal Principle).

  ### Conclusion

  The argument goes wrong at **Step (7)**. It assumes that maximizing expected accuracy requires deferring to future credences unconditionally. In reality, it requires deferring to future credences *weighted by your current confidence in their reliability*.

  In the drug case, your current confidence in the reliability of your future self is low. Therefore, expected accuracy maximization dictates **not** deferring. This aligns with intuition, avoids the false Reflection Principle, and preserves the Conditionalization result for genuine evidential learning.

  The accuracy-first program survives, but it emerges as a **perspectival** theory of rationality that enforces **diachronic coherence** without enforcing **diachronic trust** in unreliable futures.
