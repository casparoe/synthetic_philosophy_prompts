      *   Point to scenes/details? Yes.
      *   What Le Guin gets right that papers don't? Yes (affective weight).

  8.  *(Final thought before generating)*: Ensure I mention that Omelas is often critiqued as a strawman of utilitarianism, which parallels critiques of s-risk prioritization (too abstract/neglectful of present suffering). This adds depth for a philosophy group.

