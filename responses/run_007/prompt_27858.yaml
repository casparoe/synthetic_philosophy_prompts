  Two principles fit her first six verdicts but diverge on this new case. The first is the **Strongest Individual Complaint Principle**, which holds that moral choice is determined by comparing the single strongest individual burden on each side; aggregation is permitted only to break ties between identical harms (explaining verdicts 1 and 4) but forbidden across differing magnitudes of severity (explaining verdicts 2, 3, 5, and 6). The second is the **Moderate Aggregation Principle**, which holds that lesser burdens can outweigh a greater individual burden if the aggregated total crosses a threshold of relevance determined by the severity disparity; this fits the earlier data if we assume the thresholds for headaches vs. paralysis and moderate vs. severe pain are higher than 10,000 and 4 respectively, but potentially lower than 200.

  She is almost certainly running the Strongest Individual Complaint Principle. The seminar's focus on Scanlon and the specific inclusion of the "Transmitter Room" case—a classic Scanlonian argument against aggregating trivial losses to outweigh extreme individual harm—signals a pedagogical aim to distinguish contractualism from utilitarianism. Furthermore, her verdict on Case 5 (rejecting 10,000 headaches to prevent one paralysis) establishes a very high barrier for cross-magnitude aggregation, making it inconsistent to suddenly allow 200 moderate pains to outweigh one severe pain. This suggests she treats severity differences as lexically prior to numbers, except when harms are identical.

  A further case that would settle which principle she holds is: **prevent one person from death versus prevent one thousand people from losing a leg.** The Strongest Individual Complaint Principle verdicts to save the one life (death is a greater individual burden than leg loss), while the Moderate Aggregation Principle verdicts to save the one thousand legs (the aggregated welfare loss of 1,000 legs outweighs one life). Neither prediction is obviously unreasonable: the first prioritizes the worst-off individual consistent with rights-based deontology, while the second prioritizes total welfare consistent with prioritarianism.
