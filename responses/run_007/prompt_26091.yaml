      *One final check on HOT:* If the patient says "I am conscious," HOT usually takes that as strong evidence of a HOT. To counter this, I must emphasize that the report is a *first-order* output triggered by sensory confidence, not a *second-order* reflection. This is the "Illusionist" interpretation of HOT reports. I will make this explicit in the reasoning.

