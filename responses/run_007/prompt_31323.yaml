answer: |-
  The stalemate persists not because of engineering limitations, but because the debate conceals a category clash between *psychological explanation* and *logical form*. Expressivism aims to explain the motivational function of moral judgment, while the Frege–Geach problem demands an account of logical validity. These are distinct explanatory projects forced into a single semantic framework.

  Blackburn's quasi-realism attempts to bridge this by "earning the right" to truth-apt discourse without ontological commitment. However, as Dreier's "creeping minimalism" objection highlights, if expressivism successfully mimics cognitivist semantics to solve embedding, the distinction between attitude and belief collapses. Schroeder's *Being For* tries to halt this collapse by defining a specific mental state type that behaves logically like belief but remains conative. Yet critics argue this is merely notational variance: if a state plays the belief-role in logic, calling it "conative" is empty. This fuels the charge of degenerative problem-shifting; each solution adds baroque attitudinal structures that mirror propositional content so closely they invite the *reductio* that expressivism has secretly become cognitivism. The "engineering" view fails because the tool required (a logic-sustaining non-cognitive state) may be metaphysically incoherent.

  This suggests the impasse is structural. Expressivists treat logic as something to be reconstructed from attitudes (logic-as-planning), while critics treat attitudes as something to be fitted into existing logic (logic-as-truth-conditions). As long as expressivists accept classical logic as the datum, they must inflate their attitudinal ontology until it mirrors propositional content. Gibbard's shift to norm-acceptance attempts to bypass truth, but logic demands proposition-like entities to validate *modus ponens*.

  Progress requires abandoning the assumption that both sides are answering the same question. A decisive shift would look like one of two things: first, a formal impossibility result proving that non-representational states cannot sustain classical validity without isomorphism to beliefs, forcing expressivists to adopt hybrid views or inferentialism. Second, a pragmatic turn where validity is decoupled from truth-conditions entirely (e.g., Yalcin-style semantics or epistemic modals), allowing expressivists to redefine logical consequence as coherence of plans rather than preservation of truth.

  Until then, the debate remains a draw because "success" is defined differently: cognitivists demand truth-conditional compositionality; expressivists demand action-guiding explanation. The Frege–Geach problem is less a refutation than a boundary marker showing where functional explanation meets formal constraint. The impasse is permanent unless one side concedes that semantics cannot simultaneously satisfy both metaphysical austerity and classical logical form.
