          4.  The Zombie argument implies the physical state is sufficient for the report. If the physical state necessitates the qualia (as she implies by saying the duplicate has *no* qualia but same behavior, implying *we* have qualia due to the physics/nature of our world), then the report tracks the qualia reliably.
