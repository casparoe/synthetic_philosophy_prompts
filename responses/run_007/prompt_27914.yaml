answer: |-
  This is a sophisticated observation that cuts to the heart of a decades-long debate in the philosophy of biology. You have identified a rhetorical and epistemic maneuver that is pervasive in biological discourse but rarely named with precision.

  As a philosopher of biology working on information, I will first lay out the conceptual distinctions that are doing the work in your argument, then evaluate the existing terminology, and finally propose a definition for the specific pattern you have isolated.

  ### 1. The Distinctions at Work

  To analyze this pattern, we must separate three layers of description that your friend is conflating.

  *   **Causal Specificity (The "Thin" Sense):** This is physical determination. One state of affairs reliably brings about another due to physical chemistry. A key determines a lock's movement; a DNA template determines an RNA sequence via base-pairing rules. There is no "meaning" here, only correlation and mechanism. In information theory, this is close to **Shannon Information** (reduction of uncertainty) or **Causal Information** (specificity of cause).
  *   **Semantic Content (The "Rich" Sense):** This involves representation, truth conditions, and normativity. A message can be *false*; a command can be *obeyed* or *disobeyed*. This requires a context of use, typically involving a sender, a receiver, and a function. In philosophy, this is **Semantic Information**.
  *   **The Normative Gap:** The crucial difference is that causal processes cannot be "mistaken" in themselves (a key doesn't "misread" a lock), whereas semantic processes can (a cell can "misread" a codon, resulting in a mutation or error correction). Your friend wants the **normativity** of the Rich sense (to explain error correction and function) without the **ontological commitment** of the Rich sense (which usually requires intentions or evolutionary history).

  ### 2. Established Concepts and Their Limits

  There is no single, canonical noun in the philosophical lexicon that captures *exactly* the rhetorical slide you described, but there are three nearby concepts that map the territory.

  **A. Reified Metaphor (Evelyn Fox Keller)**
  Historian and philosopher of science Evelyn Fox Keller, in *The Century of the Gene*, argues that the "language of genes" began as metaphor but underwent **reification**. Scientists began treating the metaphor as the mechanism itself.
  *   *Fit:* This captures how the vocabulary becomes literal.
  *   *Breakdown:* It describes the historical outcome, not the argumentative *move*. It doesn't capture the tactical retreat to the "thin" sense when challenged.

  **B. The Homunculus Fallacy (Daniel Dennett)**
  This occurs when one explains a capacity (like reading DNA) by positing a little man inside the system who does the reading. To avoid infinite regress, the homunculus must be "discharged" into simpler mechanical parts.
  *   *Fit:* This captures the "who reads the DNA?" problem your friend conceded.
  *   *Breakdown:* Your friend isn't positing a little man; he is claiming the *molecules themselves* possess the semantic properties. The fallacy is slightly different; it is an attribution of properties, not an agent.

  **C. Information Inflation (Peter Godfrey-Smith)**
  Godfrey-Smith warns against inflating the "thin" sense of information (causal correlation) into the "rich" sense (semantic content) without justification.
  *   *Fit:* This captures the expansion from thin to rich.
  *   *Breakdown:* It does not capture the *oscillation*. Inflation is a one-way street; your friend drives back and forth.

  ### 3. The Phenomenon: "Strategic Ontological Oscillation"

  Since no established term captures the *tactical sliding* between the two senses to borrow authority while avoiding commitment, I propose we call this **Strategic Ontological Oscillation**.

  In the specific context of biology and information, it may be more precisely defined as **The Semantic-Causal Slide**.

  #### Definition
  **Strategic Ontological Oscillation** is the argumentative practice of invoking a **Rich (Semantic)** conceptual framework to claim explanatory depth (e.g., "the cell *interprets* the code"), while retreating to a **Thin (Causal)** framework to defend ontological parsimony (e.g., "it's just physical binding") when challenged on the requirements of the Rich framework (e.g., intentionality, truth conditions).

  #### Drawing the Boundaries

  To satisfy your requirement, we must distinguish this from the two neighboring phenomena you excluded.

  **1. Boundary vs. Plain Equivocation**
  *   *Equivocation* occurs when a term is used in two *unrelated* senses (e.g., "bank" of a river vs. "bank" for money). The argument fails because the senses don't connect.
  *   *Oscillation* is distinct because the senses *are* related. Causal specificity is often a *precondition* for semantic content. The oscillation exploits this continuity. It is not a logical fallacy of disconnected terms, but a **category gradient exploitation**. It works *because* the thin sense grounds the rich sense in practice, making the slide feel natural rather than deceptive.

  **2. Boundary vs. Harmless, Self-Aware Metaphor**
  *   *Metaphor* is harmless when the speaker acknowledges the "as-if" status. (e.g., "The DNA acts *like* a code to help us visualize the specificity.").
  *   *Oscillation* is distinct because the speaker claims **literal truth** when it suits them. When your friend says DNA is "literally a code," he is not speaking metaphorically. When he retreats to "physical templating," he is not saying "it's just a metaphor," he is saying "it's just physics." The oscillation allows him to have the literal benefits of both without the costs of either.

  ### 4. Why This Matters (The Philosophical Stakes)

  You noted that "code talk really did guide the scientists." This is the heuristic power of the Rich sense. It suggests experiments (e.g., looking for "editing" enzymes). However, the **Strategic Ontological Oscillation** becomes problematic when it blocks further inquiry.

  If we accept the oscillation, we stop asking the hard question: **How does causal specificity become semantic content?**

  The legitimate philosophical project that attempts to bridge this gap without sliding is **Teleosemantics** (developed by Ruth Millikan, David Papineau, and others). Teleosemantics argues that DNA has semantic content *not* because of physics, but because of **evolutionary history**. A codon "means" an amino acid because there was a selection history that stabilized that mapping for a function.

  Your friend is engaging in **Strategic Ontological Oscillation** because he wants the explanatory power of Teleosemantics (meaning, function, error) without doing the hard work of establishing the evolutionary history required to legitimize it. He wants the "Rich" conclusion via the "Thin" premise.

  ### Summary Recommendation

  When you encounter this move, do not accuse your friend of equivocation (he will rightly say the concepts are linked). Do not accuse him of metaphor (he claims literal truth).

  Instead, identify the **Semantic-Causal Slide**. Ask him to commit to one ontology:
  1.  **If it is Thin (Causal):** Then stop using normative vocabulary like "error," "reading," or "information" except as shorthand for physical mismatch.
  2.  **If it is Rich (Semantic):** Then explain the mechanism of interpretation that exists without a mind, likely invoking Teleosemantics (evolutionary function).

  If he refuses to commit and continues to slide, he is engaging in **Strategic Ontological Oscillation**: borrowing the authority of meaning while hiding behind the safety of physics.
