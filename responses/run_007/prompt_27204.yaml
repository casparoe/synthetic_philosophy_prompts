answer: |-
  ### Practice Exam Question: Philosophy of Causation

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question:**
  Consider a scenario where a swimmer is drowning. A lifeguard on duty and an ordinary bystander both watch the swimmer drown, and neither acts to save them. According to the counterfactual definition of causation, if the lifeguard had acted, the swimmer would have lived; if the bystander had acted, the swimmer would have lived. Therefore, both omissions appear to be causes of the death. Yet, in law and ordinary discourse, we typically cite only the lifeguard's omission as the cause.

  Does this difference reflect a genuine **causal fact** about the world, or is it a **normative matter** regarding duty and responsibility? In your answer, argue whether causation by omission is a genuine causal relation or merely a disguised way of assigning blame. You must address the "selection problem" presented by the case above and reply to at least one objection to your view.

  ***

  ### Model Answer

  The problem of causation by omission challenges the standard counterfactual theory of causation. The counterfactual test states that event C causes event E if, had C not occurred, E would not have occurred. Applied to omissions, this means an absence (like failing to save someone) causes an outcome (death) if the presence of that action would have prevented the outcome. In the drowning case, the test implies both the lifeguard's and the bystander's inaction are causes, because if either had jumped in, the death would not have happened.

  However, this leads to the "selection problem." The counterfactual test overgenerates causes. If we accept both omissions as causal, we lose the ability to distinguish the specific conditions that produced the death from the infinite number of other things that didn't happen to prevent it (e.g., a shark didn't eat the swimmer, a helicopter didn't drop a rope). We intuitively single out the lifeguard, not the bystander. The philosophical question is whether this selection tracks metaphysics or morality.

  I argue that the difference is normative, not causal. Causation by omission is not a genuine causal relation in the physical sense but a pragmatic tool for assigning responsibility. Physically, the cause of the death is the water entering the lungs or the heart stopping. The lifeguard's inaction is not a "thing" that pushed the swimmer under; it is the absence of a preventer. We select the lifeguard's omission because of their specific duty, not because their inaction exerted more causal power than the bystander's. To treat the lifeguard's duty as a causal fact conflates what *did* happen with what *should* have happened. If causation is about the machinery of the world, omissions are not gears in that machine; they are gaps we notice only when someone was expected to fill them.

  A strong objection to this view is that omissions genuinely explain outcomes. If a doctor fails to administer medicine and a patient dies, saying "the lack of medicine caused the death" seems like a true description of reality, not just a moral judgment. We rely on these explanations in science and history (e.g., "the lack of rain caused the famine"). If we dismiss omission causation as merely normative, we undermine our ability to explain why events occur.

  However, this objection confuses causal explanation with causal production. We cite omissions because they are relevant to our interests, not because they are physical forces. In the famine example, rain is the physical cause of crops growing; the "lack of rain" is a shorthand for a complex meteorological absence that matters to humans. Similarly, in the drowning case, citing the lifeguard explains *who is accountable*, not necessarily the physical chain of events. We can retain the utility of omission explanations without committing to the metaphysical claim that "nothing" can push "something." Therefore, the distinction between the lifeguard and the bystander is not found in the water, but in the social contract. Causation by omission is a disguised way of assigning responsibility, filtering the infinite counterfactuals through a lens of normative expectation.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **Grade Boundaries:**
  *   **A (17–20):** Sophisticated analysis, clear stance, handles objection well.
  *   **B (13–16):** Competent understanding, identifies key issues, but argument or objection handling is weaker.
  *   **C (9–12):** Basic understanding, descriptive rather than analytical, misses key distinctions.
  *   **D (0–8):** Significant misunderstandings or incomplete.

  **Required Moves for an A Answer:**
  To achieve an A, the student must successfully execute the following five moves:
  1.  **Accurate Definition:** Correctly state the counterfactual test (If C hadn't happened, E wouldn't have) and apply it to show why *both* omissions qualify initially.
  2.  **Identify Overgeneration:** Explicitly note that the counterfactual test creates too many causes (the selection problem) in this specific case.
  3.  **Separate Questions:** Clearly distinguish the *causal question* (what physically produced the death) from the *responsibility question* (who is to blame).
  4.  **Defend a Stance:** Take a clear position on whether omission causation is genuine (metaphysical) or normative (pragmatic/moral).
  5.  **Objection & Reply:** Raise a substantive objection (e.g., that omissions are necessary for explanation) and provide a reasoned reply that defends their original stance.

  **Differentiation (A vs. B):**
  *   **A Answer:** The distinction between causal facts and normative duties is sharp. The student argues *why* duty is not a causal fact (e.g., absence of physical force). The reply to the objection does not just restate the premise but offers a nuance (e.g., distinguishing explanation from production).
  *   **B Answer:** The student identifies the selection problem and notes the lifeguard has a duty. However, they may waver on the conclusion (e.g., "it is both causal and normative" without explaining how) or the reply to the objection is weak (e.g., simply dismissing the objection without engagement).

  **Specific Penalties & Misunderstandings:**
  *   **Major Error (-5 marks):** Treating the lifeguard's duty as itself a **causal fact** without argument. (e.g., "The lifeguard caused the death *because* it was their job" treats the norm as a physical cause).
  *   **Major Error (-5 marks):** Claiming the case **refutes the but-for test entirely**. (The test works; it just needs supplementation or pragmatic filtering. It does not fail logically, it fails pragmatically).
  *   **Minor Error (-2 marks):** Reciting the acts/omissions distinction without applying it to the selection problem.
  *   **Minor Error (-2 marks):** Failing to mention the bystander in the analysis (ignores half the prompt).

  **Breakdown of Marks:**
  *   **Knowledge & Understanding (5 marks):** Accuracy of counterfactual definition and scenario application.
  *   **Analysis (10 marks):** Depth of the causal vs. normative distinction and handling of the selection problem.
  *   **Evaluation (5 marks):** Quality of the defended stance and the objection/reply section.
