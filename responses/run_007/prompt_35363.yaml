answer: |-
  # Q&A Prep Sheet: Defending Kalai–Smorodinsky (KS) vs. Nash (NBS)
  **Venue:** Top-20 Micro Theory Seminar  
  **Audience:** Hostile Game Theorists (Rubinstein/Alternating Offers), Skeptical Experimentalists, One Ally (Philosopher).  
  **Goal:** Survive the "Strategic Foundation" attack without conceding the normative project.

  ---

  ### 1. The "Implementation" Objection (Likelihood: 95% | Damage: High)
  **Who:** Senior Game Theorist (Rubinstein school)  
  **The Question:** "You've spent forty minutes telling us why KS is *fairer*, but you haven't told us how it arises. In this department, we treat solution concepts without strategic foundations as reduced forms of some underlying game. If agents are rational and forward-looking, why would they converge on KS? If you can't specify the extensive form game where KS is the unique subgame perfect equilibrium, aren't you just doing ethics, not economics?"

  **The 2-Minute Reply:**
  "I appreciate the push for micro-foundations, and I agree that for *predictive* questions, a strategic foundation is non-negotiable. But my claim is explicitly *normative*. I am asking how a social planner or a mediator *ought* to resolve a conflict when the disagreement point is institutional (like a status quo wage) rather than strategic (like a strike).

  Think of it this way: We use welfare theorems to judge equilibria, even though the theorems themselves aren't strategies. I am proposing KS as a benchmark for evaluation, not a prediction of play. If the room accepts that there is a class of bargaining problems where 'threats' are illegitimate and 'aspirations' matter, then the lack of a noncooperative foundation is a feature, not a bug. It means the solution isn't driven by who has the cheaper cost of delay, but by the structure of claims. I'm not trying to replace Rubinstein; I'm trying to define the objective function for a mechanism designer who wants to satisfy specific fairness axioms that NBS violates."

  **Candid Weakness:**
  This is the weakest part of your position in this specific room. To a hardline game theorist, "normative economics" without implementation is often code for "I haven't solved the model yet." If they press on *why* rational agents would accept a mediator using KS, you have no answer other than "because it's fair," which sounds like cheap talk in a theory seminar.

  ---

  ### 2. The "IIA is Consistency" Objection (Likelihood: 80% | Damage: Medium-High)
  **Who:** Axiomatic Purist / Game Theorist  
  **The Question:** "You're characterizing Independence of Irrelevant Alternatives (IIA) as a flaw that ignores context. But IIA isn't about ignoring relevant options; it's about contraction consistency. If you choose $x$ from set $S$, and $T$ is a subset of $S$ containing $x$, you should still choose $x$ from $T$. By swapping IIA for Monotonicity, you're allowing the solution to flip based on the presence of infeasible alternatives. Doesn't that make your solution path-dependent and manipulable by how the feasible set is framed?"

  **The 2-Minute Reply:**
  "That's the standard defense of IIA, but it assumes the 'irrelevant' alternatives don't carry information about the *relationship* between the players. In the Nash framework, the shape of the frontier away from the solution point is irrelevant. In KS, the slope of the frontier tells us about the relative sensitivity of the players' gains.

  My argument is that in baseline-driven bargaining, the 'utopia point' (the maximal feasible payoff) defines the limit of a reasonable claim. If I remove an alternative that lowered your maximum possible payoff, I have changed what you can reasonably claim, even if the final allocation hasn't changed yet. IIA treats the feasible set as a menu of choices; I am treating the feasible set as a definition of the bargaining power structure. Monotonicity ensures that if my potential improves without hurting yours, I shouldn't lose out. That's not path-dependence; it's responsiveness to changes in bargaining capacity."

  **Candid Weakness:**
  Technically, KS *does* violate contraction consistency. If they draw a specific geometric example on the board where KS flips choices upon removing a dominated option, you will look mathematically sloppy. You must concede the violation but argue it's normatively desirable in this specific context.

  ---

  ### 3. The "Disagreement Point Endogeneity" Objection (Likelihood: 70% | Damage: Medium)
  **Who:** Game Theorist / Labor Economist  
  **The Question:** "You build your whole case on the disagreement point being a 'baseline' rather than a 'threat.' But in almost any real application—wages, trade, litigation—the disagreement point is endogenous to investment decisions made prior to bargaining. If agents know you're using KS, won't they invest specifically to worsen the disagreement point or inflate their aspiration level? Doesn't your normative solution create perverse ex-ante incentives?"

  **The 2-Minute Reply:**
  "That is a crucial concern, and it's why I restrict my claim to a *specific class* of problems: those where the disagreement point is institutionally fixed, like a legal status quo or a constitutional default, rather than determined by costly outside options.

  However, you're right that if agents can manipulate the feasible set to shift the utopia point, KS creates incentives to 'puff' one's maximum potential. This is a known vulnerability of KS. But note that NBS creates incentives to lower the disagreement point (i.e., make threats more credible). So the choice isn't between 'incentive compatible' and 'incentive incompatible'; it's between incentivizing threat-creation (Nash) versus incentivizing aspiration-inflation (KS). For the class of problems I'm studying—where threats are normatively off-limits—the latter is the lesser evil."

  **Candid Weakness:**
  You are admitting your solution has bad incentives. In a theory seminar, "lesser evil" is a hard sell. If they argue that aspiration inflation is easier to game than threat credibility, you lose the policy relevance of the paper.

  ---

  ### 4. The "Empirical Irrelevance" Objection (Likelihood: 60% | Damage: Low-Medium)
  **Who:** Behavioral Experimentalist  
  **The Question:** "I run bargaining experiments. When we control for risk aversion and time preferences, people don't play KS. They don't play Nash either, exactly, but they're closer to Nash or a simple 50-50 split. If real humans don't intuitively track 'individual monotonicity' or 'utopia points,' what is the normative force of your axioms? Are you justifying a solution that no one would actually accept?"

  **The 2-Minute Reply:**
  "I'm not arguing that agents naturally play KS without intervention. I'm arguing for a *mediated* solution. Experimental data tells us about unmediated strategic interaction, which is exactly the domain of Nash/Rubinstein.

  But consider arbitration or constitutional design. In those settings, we don't ask the agents what they want; we ask what a neutral third party should impose. My claim is that if you ask a neutral arbiter to respect 'equal relative concessions'—which is the core intuition of KS—they will agree with the axioms even if unmediated players don't. The normative force comes from the arbiter's perspective, not the bargainers' psychological heuristics."

  **Candid Weakness:**
  Behavioral economists hate the "mediator" escape hatch. They will argue that if the solution isn't self-enforcing or intuitively focal, the mediator will face resistance or renegotiation. You are positing a benevolent dictator who can enforce KS.

  ---

  ### 5. The "Hope Nobody Asks" Question (Likelihood: 20% | Damage: Fatal)
  **Who:** The Sharp Game Theorist (who read the footnotes)  
  **The Question:** "You argue that aspiration levels carry independent normative weight. But the KS 'utopia point' is often *infeasible*. It lies outside the feasible set. On what normative basis do you treat an impossible outcome as a valid claim? If I claim I deserve \$100, but the most that exists is \$90, why does my 'aspiration' of \$100 entitle me to a larger share of the \$90 than Nash would give? Aren't you essentially rewarding agents for having unrealistic expectations?"

  **Why This Is Damaging:**
  This cuts the throat of the core normative claim. The entire KS solution relies on the line connecting the disagreement point to the *infeasible* utopia point. If the audience accepts that "claims" must be grounded in feasibility (a standard economic assumption), then the KS axiom of Individual Monotonicity looks like it rewards delusion. It shifts the debate from "Fairness vs. Efficiency" to "Reality vs. Fantasy." If you cannot justify why an infeasible maximum should dictate the division of feasible resources, the KS solution collapses into a mathematical artifact with no moral weight.

  **The 2-Minute Reply (Damage Control):**
  "That's a powerful objection. I distinguish between a 'claim to a specific payoff' and a 'claim to a proportion of potential.' The utopia point doesn't represent a demand for that specific infeasible number; it represents the *limit of the player's contribution* to the surplus.

  If my maximum potential contribution to the relationship is higher than yours, KS argues I should receive a higher proportion of the *realized* surplus, even if my max isn't fully realizable. It's a claim on relative bargaining capacity, not on the infeasible number itself. We do this in tax policy all the time: we tax based on *potential* earning capacity in some models, not just realized income. The utopia point measures capacity; the feasible frontier measures constraint. KS splits the constraint according to the capacity."

  **Candid Weakness:**
  This is a stretch. "Taxing potential" is controversial in public econ for exactly this reason. If they press on *why* capacity matters more than realized contribution (which Nash tracks better), you are back in the "ethics vs. economics" trap. You must rely on the Philosopher ally to nod vigorously here.
