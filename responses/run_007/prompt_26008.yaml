          1.  True state selected (secret).
          2.  Student 1 draws, sees private signal, announces guess.
          3.  Student 2 draws, sees private signal + Student 1's guess, announces guess.
          4.  ...
          5.  Stop after cascade is evident (e.g., 5 same guesses in a row).
          6.  **Intervention:** Reveal a public signal (e.g., "An expert report suggests the opposite").
          7.  Resume sequence.
          8.  Reveal true state.
      *   *Scoring:* Points for guessing the true state.

  6.  **Refining the Fragility Aspect (Phase 2):**
      *   To show fragility, the public signal must be *noisy* but *contrary* to the cascade.
      *   Example: Cascade says "Red". Public signal says "Blue".
      *   Math: If cascade is based on 5 people, the weight is high. But in BHW, once a cascade starts, private signals are ignored. However, a *public* signal adds to the public pool.
      *   Actually, the BHW model says cascades are fragile because the public pool is actually quite shallow in terms of *informational content* once the cascade locks. The cascade forms after just 2 differing signals (e.g., R, R -> Cascade R). Even if 10 people say R, the informational weight is only slightly more than the first 2.
      *   *Correction:* In BHW, once a cascade starts, actions contain *no* new information. So the public history weight stops growing. A single new public signal (equivalent to one private signal) can break it if it contradicts the marginal weight of the cascade initiation.
      *   *Game Implementation:* After the cascade locks (e.g., 5 students say Red), announce: "A reputable lab tested the urn and found a Blue ball." This is equivalent to one extra private signal. If the cascade was barely locked (e.g., net +2 for Red), this breaks it.
