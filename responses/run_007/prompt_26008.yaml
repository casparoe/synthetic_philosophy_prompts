answer: |-
  # Activity: The Fragile Cascade

  ## 1. Game Design & Rules

  **Objective:** Students sequentially guess the true state of the world ("Urn A" or "Urn B") based on private signals and public predecessors' guesses. Mid-game, a public signal is introduced to test cascade stability.

  **Materials:**
  *   **2 Opaque Bags (Urns):**
      *   **Urn A:** 6 Red tokens, 4 Blue tokens (60% Red).
      *   **Urn B:** 4 Red tokens, 6 Blue tokens (60% Blue).
  *   **Tokens:** 20 Red, 20 Blue (to refill bags if needed, though one draw per student suffices).
  *   **Private Slips:** 20 small pieces of paper per round for students to write guesses secretly before announcing (prevents hearing others too early).
  *   **Public Board:** Whiteboard to record the sequence of guesses (e.g., 1: R, 2: R, 3: R...).
  *   **Intervention Card:** A large card labeled "PUBLIC SIGNAL."

  **Setup:**
  1.  **True State:** Flip a coin privately. Heads = Urn A (Red-majority), Tails = Urn B (Blue-majority). Do not reveal this until the end.
  2.  **Seating:** Arrange students in a fixed sequence (1 to 20).
  3.  **Incentives:** Points toward participation grade.
      *   **1 Point:** For guessing the True Urn correctly.
      *   **0 Points:** For guessing incorrectly.
      *   *(Note: Points are awarded for accuracy, not conformity. This makes herding irrational unless a cascade has mathematically formed.)*

  **Procedure:**
  1.  **Private Draw:** Student *i* comes to the front, draws one token from the True Urn (without showing anyone), notes the color (Private Signal), and returns the token (or uses a fresh set to maintain probabilities).
  2.  **Decision:** Student *i* writes their guess (Urn A or Urn B) on a slip.
  3.  **Public Announcement:** Student *i* announces their guess aloud. Instructor records it on the Public Board.
  4.  **Repeat:** Continue sequentially.

  **The Intervention (Phase 2):**
  *   **Trigger:** Stop the sequence immediately once a **Cascade Lock** is detected (defined as 3 consecutive identical guesses that contradict the private signal of the third person, OR simply 4 identical guesses in a row).
  *   **Action:** Announce: *"A reputable external lab has published a report on this urn. They drew one ball and it was [Opposite Color]."*
  *   **Resume:** Continue the sequence with the remaining students.

  ## 2. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain rules, incentives, and urn compositions (60/40 split). Emphasize that points are for *accuracy*, not matching the crowd. |
  | **10-35** | **Phase 1: Formation** | Students 1–12 (or until Cascade Lock).<br>• Each draws, decides, announces.<br>• Instructor records history on board.<br>• *Instructor Note:* Watch for the cascade point (usually around student 3 or 4). |
  | **35-45** | **Intervention** | **The Shock.**<br>• Halt the game.<br>• Reveal the Public Signal (contrary to the cascade).<br>• Ask students to recalculate mentally.<br>• Resume with remaining students (13–20). |
  | **45-55** | **Resolution** | • Final guesses recorded.<br>• Reveal the True Urn (open the bag and dump contents).<br>• Tally scores. |
  | **55-90** | **Debrief** | Structured discussion (see Section 5). |

  ## 3. Scoring System (No Money)

  *   **Participation Base:** All students receive full participation credit for completing the module.
  *   **Performance Bonus:**
      *   **Correct Guess:** +1 "Cascade Point."
      *   **Incorrect Guess:** 0 Points.
      *   **Top Scorers:** The top 3 students with the most points receive a small privilege (e.g., choice of seminar topic, exemption from one reading summary, or public recognition).
  *   **Rationale:** This creates enough competition to ensure students care about accuracy, making their decision to herd purely rational (informational) rather than social pressure.

  ## 4. Contingency Plan: What If It Goes "Right"?

  **The Risk:** Randomness may produce a cascade that matches the True Urn (e.g., True Urn is Red, Cascade is Red). This undermines Objective 1 (wrong cascades) and makes Objective 2 (fragility) look like noise disruption rather than correction.

  **Mitigation Strategy:**
  1.  **Run Two Rounds (if time allows):** If Round 1 produces a "Correct Cascade," quickly reset and run Round 2 with a new True State. With 20 students, the probability of *two* correct cascades in a row is low enough that one will likely fail.
  2.  **The "Counterfactual" Pivot (If only one round is possible):**
      *   If the cascade is **Correct**: Acknowledge luck. Then, during debrief, ask: *"What if the True Urn was actually the opposite? Would our public history have changed?"* (Answer: No, because early actions would have been the same).
      *   Show mathematically that the *informational weight* of the cascade is identical regardless of whether it is right or wrong.
      *   Use the Intervention to show that even a Correct Cascade is fragile. If the public signal breaks a Correct Cascade, emphasize that **rationality led them away from the truth** because the public signal outweighed the shallow information locked in the cascade.
  3.  **The "Fixed Seed" (Last Resort):** If you absolutely must demonstrate a wrong cascade and randomness fails, pre-determine the first two students' signals privately before class. Tell them, *"For the sake of this simulation, assume your draw was Blue,"* even if they drew Red. Use this sparingly and admit the manipulation afterward to preserve trust.

  ## 5. Debrief Guide (35 Minutes)

  **Part 1: The Rationality of Error (10 mins)**
  *   **Question:** "For those who joined the cascade despite drawing a conflicting private signal: Why did you do it?"
  *   **Key Concept:** **Bayesian Updating.**
      *   Explain that by Student 3 or 4, the public history (e.g., Red, Red) implies the first two students likely saw Red.
      *   Math: If I see Blue, but history says Red, Red, the probability calculation favors Red.
      *   **Takeaway:** It was individually rational to ignore private information. The error is systemic, not individual.

  **Part 2: The Math of Fragility (15 mins)**
  *   **Question:** "Why did the single Public Signal change the behavior of the subsequent students?"
  *   **Key Concept:** **Informational Saturation.**
      *   Draw the "Weight of Evidence" on the board.
      *   **Pre-Cascade:** Each guess adds information.
      *   **Post-Cascade:** Guesses add **zero** new information (because students are ignoring private signals).
      *   **The Math:** A cascade locks when the net public weight reaches +2 (e.g., two more Reds than Blues). Once locked, the weight stays at +2 forever, regardless of whether 5 or 50 people join.
      *   **The Intervention:** The Public Signal adds -1 weight. The net weight drops from +2 to +1.
      *   **Result:** The next student's private signal now becomes the tie-breaker. The cascade is broken.
      *   **Takeaway:** Cascades are not robust because they are built on a shallow foundation of early information. Later conformity adds no structural strength.

  **Part 3: Real-World Implications (10 mins)**
  *   **Discussion:** Where do we see this? (Stock markets, technology adoption, political polling).
  *   **Policy:** Why does this justify regulatory disclosure laws? (Because private markets won't generate enough public information to break wrong cascades).
  *   **Closing:** "Cascades are rational, fragile, and potentially wrong. Your job as analysts is to identify when the public weight is saturated and look for the small signals that can break the lock."
