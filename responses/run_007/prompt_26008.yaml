      *   *Risk:* If cascade doesn't lock by student 12.
      *   *Mitigation:* Have a backup "Public Signal" ready to force a break if needed, or just extend Phase 1.
      *   *Better:* Run two independent rounds. Round 1 demonstrates Wrong Cascade. Round 2 demonstrates Fragility. Or combine them.
      *   *Combined Approach:* One continuous game is more dramatic. But if the cascade is *correct*, the fragility point is less sharp (breaking a correct cascade looks like noise).
