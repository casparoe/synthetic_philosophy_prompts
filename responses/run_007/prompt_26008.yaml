      *   *Phase 1:* Standard cascade setup.
      *   *Phase 2:* Intervention. The instructor reveals a "public study" or "expert opinion" (noisy signal) after a cascade has formed.
      *   *Phase 3:* Continue the sequence to see if the cascade breaks.

  4.  **Addressing the "Wrong Cascade" Contingency:**
      *   *Problem:* Randomness might lead to a correct cascade.
      *   *Solution:* Rigging vs. Multiple Rounds. Rigging undermines trust. Multiple rounds are better.
