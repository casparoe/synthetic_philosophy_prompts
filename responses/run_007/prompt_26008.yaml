          2.  Cascades are fragile (shattered by public signals).
      *   **Constraints:** 90-minute activity, two phases (formation + disclosure), point system (no real money), specific debrief topics, contingency planning (what if the cascade doesn't form "wrong"?).
      *   **Format:** Start directly with game design (no preamble).

  2.  **Deconstruct the BHW Model for Gameplay:**
      *   *Core Mechanic:* Private signals + Public actions.
      *   *Setup:* Two states of the world (e.g., Urn A vs. Urn B, or Red vs. Blue).
      *   *Signals:* Private draws that are informative but noisy (e.g., >50% accuracy).
      *   *Decision:* Students announce a guess publicly in sequence.
      *   *Cascade Condition:* When public history outweighs private signal.
      *   *Fragility:* Introducing a public signal that resets the weight of public history.

  3.  **Designing the Game Mechanics:**
      *   *Materials:* Two containers (urns/bags), colored balls (or cards), private slips, score sheet.
      *   *States:* "Majority Red" vs. "Majority Blue".
      *   *Signals:* Draw a ball. If Urn is Red-majority, 60% chance Red ball, 40% Blue. (Needs to be biased enough to cascade, noisy enough to be wrong).
