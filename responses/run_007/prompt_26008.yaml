      *   *Backup:* If no wrong cascade occurs naturally, use a "Counterfactual Simulation" during debrief (show the math of what *would* have happened if the first two draws were reversed). Or, subtly adjust the signal accuracy in one round (e.g., make signals 55/45 instead of 70/30 to increase noise).
      *   *Best Approach for this prompt:* Plan for multiple rounds (Round 1 & 2). If Round 1 is "correct", emphasize Round 2. If both are correct, use the "What If" analysis in debrief. I need to specify this in the "What will go wrong" section.

  5.  **Drafting the Game Design:**
      *   *Title:* The Color Cascade Experiment.
