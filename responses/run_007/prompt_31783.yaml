      *Wait, one more thing:* The user asked to "flag any pairs of positions the quiz cant really seperate." I need to be honest. Soft vs. Hard is the big one. Competence vs. Soft is another (is being drunk a competence issue or a regret issue?). I will highlight this in the analysis.

