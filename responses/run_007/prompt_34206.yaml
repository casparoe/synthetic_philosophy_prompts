answer: |-
  You have put your finger on the central nerve of the "Species Problem" in philosophy of biology. What you are observing is not just a quirk of individual researchers; it is a structural feature of a field that lacks a unified ontology.

  To answer your primary question: There is no single, canonical Latin-named fallacy (like *ad hominem* or *post hoc*) that specifically captures this maneuver in the philosophy of biology literature. However, it is widely discussed under descriptions like **"motivated selection of species concepts"** or **"operational inconsistency."**

  Because you asked for a precise term to capture the distinctive features you described—specifically the strategic exploitation of legitimate pluralism to guarantee a preferred ontological conclusion—I propose we coin the term **"Conceptual Arbitrage."**

  Below, I will break down why existing terms don't quite fit, define Conceptual Arbitrage, and explain what this implies for the reality of species.

  ### 1. Why the Standard Terms Don't Fit

  You correctly intuited that this phenomenon is adjacent to several logical and rhetorical vices, but distinct from them. Here is the philosophical breakdown:

  *   **Equivocation:** In formal logic, equivocation is using the *same word* with *different meanings* within a single argument to mislead. In your case, the experts are usually explicit about which definition they are using (e.g., "Under the BSC..."). They aren't hiding the switch; they are legitimizing it by appealing to established literature. The deception isn't in the definition, but in the *justification for selecting that definition*.
  *   **Cherry-Picking:** This typically refers to selecting *data points* that support a hypothesis while ignoring those that don't. What your experts are doing is selecting *frameworks*. They aren't hiding genetic data; they are arguing that the genetic data is less relevant than the interbreeding data (or vice versa). It is a higher-order selection: picking the lens, not just the picture.
  *   **Ad Hoc Reasoning:** An ad hoc hypothesis is invented *after the fact* to save a theory from falsification. The Biological or Phylogenetic Species Concepts are not invented on the fly; they are pre-existing, robust, and independently motivated frameworks. The researchers are not building a new wall to block a counter-argument; they are walking through an existing door that leads to the room they want to be in.
  *   **Moving the Goalposts:** This implies changing the criteria *during* the evaluation of a single claim. In taxonomy, the goalposts are often set *before* the evaluation begins, but the choice of which goalpost to use is determined by where the ball is already sitting.

  ### 2. The Coinage: Conceptual Arbitrage

  **Definition:** *Conceptual Arbitrage* is the strategic selection of among multiple, equally legitimate conceptual frameworks to determine the ontological status of an entity, where the choice of framework is driven by the desired outcome rather than by a principled distinction in the nature of the entity itself.

  **Why "Arbitrage"?**
  In finance, arbitrage is the practice of taking advantage of a price difference between two or more markets. You buy low in Market A and sell high in Market B to guarantee a profit without risk.
  In your lizard case:
  *   **The Markets:** The different species concepts (BSC, PSC, Morphological, etc.).
  *   **The Price:** The threshold for "specieshood" (some concepts make it "cheap" to be a species, others "expensive").
  *   **The Profit:** The desired taxonomic conclusion (splitting or lumping), which often carries downstream benefits (grant funding, conservation status, publication prestige).

  When Expert A uses the Phylogenetic Species Concept (PSC) because it makes speciation "cheap" (any genetic difference counts), and Expert B uses the Biological Species Concept (BSC) because it makes speciation "expensive" (requires reproductive isolation), they are exploiting the exchange rate between concepts to secure their preferred result.

  **Boundary Cases:**
  It is crucial to distinguish *Conceptual Arbitrage* from legitimate **Conceptual Pluralism**.
  *   **Legitimate Pluralism:** A researcher uses the BSC for birds (because they interbreed readily) and the PSC for bacteria (because they don't interbreed). The choice is driven by the *biology of the group*.
  *   **Conceptual Arbitrage:** A researcher uses the BSC for Lizard Population X (to lump it) and the PSC for Lizard Population Y (to split it), despite both populations having identical biological properties (e.g., both have some genetic divergence and some interbreeding). The choice is driven by the *preference of the researcher*.

  ### 3. What This Tells Us About the "Species Problem"

  Your observation points directly to the core metaphysical debate in the philosophy of biology: **Are species real natural kinds, or are they human conventions?**

  If Conceptual Arbitrage is possible, it suggests that "species" is not a unitary natural category like "electron" or "water molecule." If it were, there would be a fact of the matter that all concepts were trying to measure. The fact that researchers can toggle the reality of the species by toggling the definition suggests one of two things:

  1.  **Anti-Realism:** Species are not "out there" in nature; they are tools we impose on a continuous evolutionary gradient to make sense of it. In this view, Conceptual Arbitrage isn't a vice; it's just acknowledging that different tools are useful for different jobs (e.g., conservation law needs clear boundaries, evolutionary biology needs fluid ones).
  2.  **Confusion of Evidence and Definition:** This is the view of philosopher **Kevin de Queiroz**, who proposed the **General Lineage Concept (GLC)**.

  **The De Queiroz Solution:**
  De Queiroz argues that most taxonomic disputes arise because researchers confuse the *definition* of a species with the *criteria* used to identify them.
  *   **The Definition (The Concept):** A species is a segment of a population-level lineage evolving separately from others. (Almost everyone agrees on this).
  *   **The Criteria (The Evidence):** Reproductive isolation, genetic divergence, morphological distinctness. (These are just *evidence* of the separation, not the definition itself).

  When Expert A says "It's a species because of genetics," and Expert B says "It's not because they interbreed," they are arguing over *evidence*, but treating it as *definition*. Under the GLC, interbreeding and genetics are both contingent properties that usually correlate with lineage separation but don't define it.

  **Why Arbitrage Happens:**
  Conceptual Arbitrage thrives because the field has not fully adopted the separation of *concept* and *criteria*. As long as the Biological Species Concept *defines* a species by interbreeding, anyone who proves interbreeding wins the argument. As long as the Phylogenetic Concept *defines* a species by monophyly, anyone who proves genetic distinctness wins. The researchers are weaponizing the conflation of definition and evidence.

  ### 4. Advice for Your Reporting

  As a journalist, you are in a unique position to expose Conceptual Arbitrage without needing to solve the metaphysical debate yourself. Here is how you can test for it in your interviews:

  1.  **The "Switch" Test:** Ask the expert: "If the genetic data showed divergence but the mating data showed interbreeding, which would you prioritize? Why?" Then ask the same question about a different lizard group where they argued the opposite. If the priority flips based on the desired outcome, you have identified Conceptual Arbitrage.
  2.  **The "Property vs. Process" Question:** Ask: "Is reproductive isolation the *definition* of a species, or just *evidence* that they are on separate evolutionary trajectories?" If they say definition, press them on why that definition applies to these lizards but not to the bacteria Expert C studies.
  3.  **Follow the Incentives:** Conceptual Arbitrage is rarely malicious; it's often pragmatic. Splitting a species (via PSC) might help secure conservation funding for a rare population. Lumping a species (via BSC) might simplify management or protect a hunting resource. Acknowledging these stakes doesn't invalidate the science, but it contextualizes the concept choice.

  ### Summary

  You have identified a genuine methodological vice that lacks a standardized name. I recommend using **"Conceptual Arbitrage"** to describe it. It distinguishes the move from simple equivocation or cherry-picking by highlighting the exploitation of *framework differences* rather than *data differences*.

  This pattern does not necessarily mean species aren't real. Rather, it indicates that the *operational definitions* currently in use are imperfect proxies for the underlying evolutionary reality (separate lineages). The researchers aren't necessarily lying; they are navigating a field where the map (the concept) is often mistaken for the territory (the lineage). Your job is to show your readers where the mapmakers are choosing their maps based on where they want to go, rather than where they actually are.
