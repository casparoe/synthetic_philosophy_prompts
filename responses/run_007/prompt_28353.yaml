          1.  **Accept Omniscience:** (Theological/idealistic).
          2.  **Reject Knowability Principle:** (Realism). There are mind-independent truths we can't know.
          3.  **Restrict the Principle:** (Anti-realism/Neo-verificationism). Only "basic" or "Cartesian" propositions are knowable. $p \land \neg Kp$ is excluded.
      *   **Conclusion:** The paradox is more about the logic of knowledge than a catalog of specific unknowable facts.

