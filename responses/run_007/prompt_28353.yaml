  2.  **Deconstruct Fitch's Paradox (Briefly):**
      *   Premise 1: All truths are knowable ($\forall p (p \to \diamond Kp)$).
      *   Premise 2: Knowledge implies truth ($Kp \to p$).
      *   Premise 3: Knowledge distributes over conjunction ($K(p \land q) \to Kp \land Kq$).
      *   Premise 4: If something is known, it's possible that it's known ($Kp \to \diamond Kp$).
      *   The Proof: Assume there is an unknown truth $p \land \neg Kp$. If this is knowable, someone could know $p \land \neg Kp$. This implies they know $p$ and they know $\neg Kp$. But knowing $\neg Kp$ implies $\neg Kp$ is true (factivity), so they don't know $p$. Contradiction.
      *   Conclusion: If all truths are knowable, there are no unknown truths. (All truths are known). This is the "modal collapse."
      *   Corollary: Since obviously not all truths are known, not all truths are knowable.

