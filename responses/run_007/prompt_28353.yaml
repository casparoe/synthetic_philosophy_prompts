  ok so Fitch's paradox is supposed to show that not all truths are knowable, right? the proof seems solid. but whenever i try to actually point to a truth thats unknowable, i just end up with these weird self-referential sentences like "it's true that p and nobody knows it." which feels like a parlor trick, not a real example of something genuinely beyond our epistemic reach. is there an actual, non-gerrymandered example of a truth that Fitch's paradox shows we can't know? or does the paradox only work if you accept that those self-referential conjunctions count as legitimate propositions in the first place?
