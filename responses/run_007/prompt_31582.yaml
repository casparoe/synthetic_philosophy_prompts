      *   *Methodological Issues:* Translation problems, framing effects, pragmatic implicature (people mean different things by "knows" but track the same underlying concept).
      *   *The "Calibration" Counter:* If intuitions are culturally variable, what calibrates the *claim* that they are variable? Isn't that claim also intuition-dependent?
