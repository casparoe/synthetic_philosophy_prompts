          *   *Point:* Variation is about conversational implicature, not deep conceptual structure.
          *   *Why it counts:* Suggests the underlying "instrument" is the same, just the "readout" is noisy.
          *   *Defender's Reaction:* Often dismissed as "saving the phenomenon," but linguistically plausible.
      *   **Category 4: Universal Cognitive Structures (Moderate):**
          *   *Point:* Cognitive science shows deep universals (causation, agency) despite surface variation.
          *   *Why it counts:* Suggests the "artefact" is surface level, not deep structure.
          *   *Defender's Reaction:* Might concede surface variation but insist deep structure is inaccessible to armchair methods.
      *   **Category 5: The Self-Defeat/Insulation Argument (Philosophical/Methodological):**
          *   *Point:* If all intuitions are local, why trust the intuition that "local intuitions are unreliable"?
          *   *Why it counts:* Challenges the epistemic status of the view itself.
