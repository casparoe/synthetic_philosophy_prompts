  2.  **Deconstruct the View (The "Calibration Critique"):**
      *   Core Claim: Intuitions $\neq$ Universal Cognitive Access; Intuitions $\approx$ Local Cultural Artifacts.
      *   Implication: Traditional armchair philosophy relying on "what we would say" is methodologically flawed if "we" is just WEIRD academics.
      *   Strength: Aligns with naturalistic skepticism about uncalibrated instruments.
      *   Weakness: Risks global skepticism, might overstate variation, might misunderstand the role of intuitions.

  3.  **Brainstorm Counter-Evidence & Arguments (The "Stress Test"):**
