      *Re-evaluating the "Empty Space":*
      View: "The sensation is neutral. The content is purely descriptive (damage exists). But the pain is still bad."
      Why no defender? Because if the content is just "damage exists," why is that *bad*? You need an evaluation to bridge "damage" to "badness." If you don't have evaluation in content, and you don't have it in the sensation, where is the badness? This is the "Normative Gap."

