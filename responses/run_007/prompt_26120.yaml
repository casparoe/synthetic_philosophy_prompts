      *   **Target Audience:** Upper-division seminar students.
      *   **Central Puzzle Case:** Pain Asymbolia (sensory intact, affective/motivational deficit).
      *   **Required Format:**
          1.  Decision Tree (plain text, indentation/numbering).
          2.  "How to use this" (instructional guide, ~0.5 page).
          3.  "The asymbolia challenge" (analysis of the case's efficacy, ~0.5 page).
      *   **Required Content in Tree:**
          *   Start with a basic question (Intrinsic vs. Extrinsic/Relational).
          *   Leaves must include: Perceptualism, Imperativism, Evaluativism, Attitudinal View, Intrinsic Qualitative View (Simple View).
          *   Nodes must be non-jargon questions (phenomenological/functional).
          *   Flag positions the tree can't separate (specifically Imperativism vs. Evaluativism).
          *   Flag logical combinations without defenders (and explain why).
      *   **Constraints:** Plain text format, specific section lengths.

  2.  **Drafting the Decision Tree:**
      *   *Root Question:* Needs to distinguish between the sensation itself being bad vs. the badness coming from elsewhere.
      *   *Branch 1 (Intrinsic):* If the badness is *in* the feel. This leads to the "Simple View" or "Intrinsic Qualitative View." Asymbolia challenges this heavily.
      *   *Branch 2 (Extrinsic/Relational):* If the badness comes from what the pain *does* or *says*.
      *   *Sub-branching:* Need to get to Perceptualism, Imperativism, Evaluativism, and Attitudinalism.
      *   *Differentiation:*
          *   Attitudinalism: Badness is the *reaction* to the pain (desire for it to stop). Asymbolics lack the desire, so pain isn't bad for them.
          *   Representational views (Perceptualism, Imperativism, Evaluativism): Badness is in the *content*.
          *   Distinguishing Representational views:
              *   Perceptualism (Representationalism about quality): Pain represents damage *as happening*. Badness is like a secondary quality or just the representation of a bad state. (Often linked to Tye).
              *   Imperativism: Pain says "Stop this!" (Command). (Klein, Hall).
              *   Evaluativism: Pain says "This is bad!" (Evaluation). (Bain, Cutter).
      *   *Refining the Nodes:*
          *   Q1: Is the "ouchiness" part of the raw feel, or does it come from what the pain means/causes?
          *   Q2 (If Raw Feel): Do asymbolics feel the *same* raw feel? (If yes -> Intrinsic View in trouble. If no -> Intrinsic View safe). Let's make this a position leaf.
          *   Q2 (If Meaning/Cause): Is the badness about your *reaction* or the *pain's message*?
          *   Q3 (If Reaction): Attitudinal View.
          *   Q3 (If Message): What is the message?
          *   Q4 (Message): Is it "Damage is here" (Perceptualism) or "Do something/This is bad" (Imperativism/Evaluativism)?
      *   *Addressing the "Hard to Separate" constraint:* Imperativism and Evaluativism are very close. Imperativism says "Stop!", Evaluativism says "This is bad!" (which implies stop). Asymbolia affects the motivational push. Both can explain asymbolia by saying the *content* is present but the *uptake* is missing, OR that the content is missing. I need to flag this.
      *   *Addressing "Empty Logical Space":*
          *   Combination: "Badness is intrinsic to the quale" AND "Badness is a desire." (Contradictory).
          *   Combination: "Pain represents damage" but "The representation isn't what makes it bad." (Maybe Perceptualism without the normative punch?).
          *   Let's look for a combo like: "The sensation is neutral" + "The message is descriptive only (no command/evaluation)." This would be a pure Perceptualism that denies pain is *intrinsically* bad, but usually, Perceptualists argue the representation of damage *is* the badness. If one says "It represents damage, but that's not why it hurts," that's odd.
          *   Better empty space: "The sensation is intrinsically bad" BUT "Asymbolics feel the exact same sensation." This is logically possible but empirically implausible given the case description. Defenders usually say asymbolics *don't* feel the same sensation.
          *   Another empty space: "Badness is a command" BUT "Commands don't motivate." That defeats the purpose of Imperativism.

  3.  **Drafting "How to use this":**
      *   Focus on pedagogy.
      *   Start with the intuition pump (asymbolia).
      *   Walk through the root.
      *   Highlight where students get stuck (usually the distinction between content and attitude).
      *   Mention the "Empty Space" flags as discussion generators.

  4.  **Drafting "The asymbolia challenge":**
      *   Does it settle the debate?
      *   Pro: It separates sensory from affective. Kills Simple Intrinsic View (unless they deny asymbolics have pain).
      *   Con: Defenders can argue asymbolics have "quasi-pain" or the lesion removes the badness *part* of the sensation, so the sensation *is* different.
      *   Verdict: It constrains theories but doesn't kill them all.

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I include all 5 required views? (Perceptualism, Imperativism, Evaluativism, Attitudinal, Intrinsic Qualitative). Yes.
      *   *Check:* Are nodes jargon-free? Instead of "Is it conative?", ask "Is the badness in your wanting it to stop?"
      *   *Check:* Flagging the Imperativism/Evaluativism split. They are notoriously hard to distinguish via asymbolia alone because both locate badness in content that motivates. I need to make sure the tree acknowledges they might end up at the same leaf or require a specific fork. I will group them closely but flag the difficulty.
      *   *Check:* Empty logical space. I'll identify the view: "Sensation is neutral, Content is purely descriptive (no command/evaluation), yet Pain is Bad." This is a Perceptualism that denies the representation explains the badness.
      *   *Formatting:* Use clear indentation for the tree. Ensure section lengths are approximate to the request (half page each).

  6.  **Final Review against constraints:**
      *   Plain text tree? Yes.
      *   "How to use this" section? Yes.
      *   "The asymbolia challenge" section? Yes.
      *   Specific views included? Yes.
      *   Flags included? Yes.

      *(Self-Correction on Tree Structure)*: I need to make sure the path to Imperativism and Evaluativism is clear.
      Path:
