answer: |-
  DECISION TREE: WHAT MAKES PAIN BAD?

  1. Start here: When you feel a sharp pain, is the "badness" part of the raw feeling itself (like the redness of a red patch), or does the badness come from what the pain means or causes you to do?
     |
     +-- A. The badness is part of the raw feeling itself.
     |    |
     |    +-- [LEAF 1: INTRINSIC QUALITATIVE VIEW]
     |    |   (Defenders: Some classical phenomenal realists)
     |    |   [NOTE: Asymbolia Challenge] If asymbolics feel the same sensation but don't mind it, this view implies the sensation isn't actually bad. Defenders must claim asymbolics do *not* feel the same sensation (the "ouchiness" is lesioned away).
     |
     +-- B. The badness comes from what the pain means or causes.
          |
          +-- 2. Is the badness found in YOUR reaction to the pain, or in the PAIN'S message to you?
               |
               +-- A. It's in my reaction (e.g., I want it to stop).
               |    |
               |    +-- [LEAF 2: ATTITUDINAL VIEW]
               |    |   (Defenders: Heathwood, etc.)
               |    |   [NOTE] Pain is a sensation + a desire for it to cease. Asymbolics lack the desire, so for them, it isn't bad.
               |
               +-- B. It's in the pain's message (the content of the experience).
                    |
                    +-- 3. Does the pain just report *what is happening* to your body, or does it issue a *normative instruction*?
                         |
                         +-- A. It just reports damage (Descriptive).
                         |    |
                         |    +-- [LEAF 3: PERCEPTUALISM]
                         |    |   (Defenders: Tye, etc.)
                         |    |   [NOTE: Logical Gap] Hard to explain why "damage report" equals "badness" without smuggling in evaluation. Few defend pure descriptive perceptualism as a full account of badness.
                         |
                         +-- B. It issues a normative instruction (Command or Evaluation).
                              |
                              +-- 4. Is the instruction a direct ORDER ("Stop this!") or a JUDGMENT ("This is bad!")?
                                   |
                                   +-- A. It is an Order.
                                   |    |
                                   |    +-- [LEAF 4: IMPERATIVISM]
                                   |    |   (Defenders: Klein, Hall)
                                   |    |
                                   +-- B. It is a Judgment.
                                        |
                                        +-- [LEAF 5: EVALUATIVISM]
                                        |    (Defenders: Bain, Cutter)
                                        |
                                        [NOTE: INDISTINGUISHABLE VIA ASYMBOLIA]
                                        Asymbolia removes motivation. Both views say content is intact but motivation is severed.
                                        To split them, you need a case where a subject obeys the command but denies the badness (supports Imperativism), or judges it bad but feels no urge to stop (supports Evaluativism).

  ***

  HOW TO USE THIS

  Begin the seminar by detailing the asymbolia case: lesions to the insula/cingulate, preserved sensory discrimination, abolished suffering. Ask students to place their initial intuition on Node 1. Most will instinctively choose Branch B (Extrinsic), as asymbolia suggests the "feel" can exist without the "badness." However, press the Intrinsic defender (Branch A): Do asymbolics *really* feel the same thing? If the "ouch" is gone, maybe the sensation *is* different. This generates the first major friction point: the phenomenological description of the case.

  Move to Node 2. This is where students confuse Attitudinalism with Representationalism. Ask: "If I drug you so you don't care about the pain, is the pain still bad?" Attitudinalists say no; Representationalists say yes. Node 3 is the crux of the representationalist debate. Students often struggle to see how a "damage report" (Perceptualism) differs from a "badness judgment" (Evaluativism). Use the analogy of a check-engine light (descriptive) versus a "STOP NOW" siren (normative).

  Finally, arrive at Node 4. Warn students that Imperativism and Evaluativism often collapse here. The tree flags this indistinguishability explicitly. Use this to discuss the limits of thought experiments: if two theories predict the same outcome for all possible cases (including asymbolia), are they distinct theories or just verbal variants? Use the "Empty Logical Space" flags (Leaf 3 and the Node 4 split) to ask students to construct arguments for why those positions are unoccupied. Is it because they are false, or just difficult to articulate?

  ***

  THE ASYMBOLIA CHALLENGE

  Does pain asymbolia settle the debate? It is a powerful constraint, but not a knockout blow. It decisively refutes the "Simple View" (Leaf 1) *unless* the defender denies the premise that asymbolics feel pain. A committed Intrinsic Qualitative theorist can argue that the lesion removes the affective *part* of the sensation, meaning the asymbolic feels a degraded, non-painful sensation (e.g., "pressure" rather than "pain"). This move preserves the theory but risks making it unfalsifiable: if every counterexample is dismissed as "not real pain," the theory loses empirical grip.

  For the extrinsic views (Branch B), asymbolia is equally double-edged. It supports Attitudinalism perfectly (no desire, no badness). But it also supports Representationalism (Imperativism/Evaluativism) if one argues the *content* remains but the *uptake* is broken. The case separates sensation from motivation, but it doesn't tell us whether the motivation was part of the sensation's content or a separate conative state. Consequently, asymbolia functions best as a filter that forces theories to be precise about the sensory/affective boundary, rather than a tool that selects a single winner. Students should leave understanding that the "badness" of pain depends entirely on where they choose to draw the boundary of the mental state itself.
