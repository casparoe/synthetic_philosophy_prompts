      3. If Content: Descriptive (Damage) vs. Normative (Bad/Command)?
      4. If Normative: Command (Do X) vs. Evaluation (This is bad)?
      *Critique:* Evaluativism and Imperativism are often distinguished by whether the content is a command ("Stop!") or an evaluation ("This is bad!"). Asymbolia shows the motivation is gone. Imperativists say the command is present but not obeyed. Evaluativists say the evaluation is present but not cared about. This is the hard split. I will note this in the flags.

      *(Refining Empty Space)*: A view where "Pain represents damage, but the badness is intrinsic to the sensation" is a hybrid. Some hold this. A view where "Pain is a command, but the command is not to stop" is incoherent. Let's flag: "Sensation is neutral + Content is purely descriptive + Badness is real." This is the hard spot for Representationalists who don't want to be Evaluativists.

      *(Word Count Check)*: Keep the commentary sections tight to fit "about half a page" each (roughly 150-200 words per section).

      *(Final Polish)*: Ensure the tone is appropriate for an instructor (pedagogical, insightful).

      *Let's build the tree.*
      Root: Is the "badness" part of the raw feeling itself, or does it come from what the pain means or causes?
      Branch A (Raw Feeling): Intrinsic Qualitative View.
