answer: |-
  You have hit on exactly the right objection. In philosophy of emotion, this is known as the problem of **recalcitrant emotions**, and it is widely considered the Achilles' heel of strong cognitivism (the view that emotions *are* judgments).

  You are in very good company. Philosophers like Jesse Prinz, Jenefer Robinson, and Christine Tappolet have used this exact intuition to argue against the Stoic/Nussbaum/Solomon line.

  Here is a breakdown of why your intuition is strong, how cognitivists try to defend themselves, and why many philosophers have moved toward the view you're leaning into.

  ### 1. The Strength of Your Objection
  Your example (finding out your partner didn't do it, but still feeling angry) highlights a disconnect between **propositional content** (the judgment "they wronged me") and **phenomenological reality** (the feeling of anger).

  If Emotion = Judgment, then:
  *   No Judgment = No Emotion.
  *   Change Judgment = Change Emotion.

  But as you noted, emotions have **inertia**. They linger after the cognitive assessment has been updated. This suggests that the emotion is not *identical* to the judgment, but perhaps *caused* by it, or runs on a parallel track.

  ### 2. How Cognitivists Defend the View
  Cognitivists like Martha Nussbaum or Robert Solomon aren't unaware of this. They have a few lines of defense, though many find them less than satisfying:

  *   **The "Split Mind" Defense:** They might argue you actually hold two contradictory judgments at once. Intellectually, you judge "my partner is innocent." But viscerally/subconsciously, you still hold the judgment "I have been wronged." The anger persists because the subconscious judgment hasn't updated yet.
  *   **The "Habit" Defense:** Nussbaum, specifically, acknowledges that emotions involve habits of mind. Even if you change the specific judgment, the *habitual pattern* of reacting to that type of situation remains active for a while.
  *   **The "Seeing-As" Defense:** Some cognitivists soften their stance. They say emotions aren't cold, logical *beliefs*, but rather a way of "seeing the world as" dangerous or offensive. Like an optical illusion: You *know* the lines are the same length (judgment), but they *look* different (emotion/perception).

  ### 3. The View You're Leaning Toward (Somatic/Perceptual)
  Your intuition that "emotions are feelings/bodily states and the judgment is just a cause" aligns with two major alternative theories:

  **A. Somatic/Feeling Theories (James-Lange updated)**
  This view says the emotion *is* the perception of bodily changes.
  *   **Why it fits your example:** The body takes time to calm down. Adrenaline doesn't vanish the instant you learn the truth. The "anger" is the lingering physiological arousal.
  *   **The Weakness:** It struggles to explain **intentionality**. If anger is just a racing heart and tight chest, why are you angry *at your partner* and not just at the weather? Bodily states don't have "aboutness." You need *some* cognition to point the feeling at an object.

  **B. Perceptual Theories (The Middle Ground)**
  This is currently one of the most popular views in philosophy of emotion (championed by people like Sabine Döring or Christine Tappolet).
  *   **The Claim:** Emotions are not judgments; they are **perceptions of value**.
  *   **The Analogy:** Think of a optical illusion, like the Müller-Lyer lines.
      *   **Judgment:** "I know these lines are equal length."
      *   **Perception:** "They *look* like different lengths."
      *   **Recalcitrance:** You can know the truth (judgment) while the illusion persists (perception).
  *   **Application to your example:** You *judge* your partner is innocent. But you *perceive* the situation as offensive (due to habit, past trauma, or physiological momentum). The emotion is the perception, which can conflict with the judgment.

  ### 4. Why Nussbaum Sticks with Cognitivism
  It is worth noting why Nussbaum defends the judgment view despite this problem. For her, the stakes are ethical.
  *   If emotions are just irrational bodily surges (feelings), they are not reliable guides for life.
  *   If emotions *are* judgments about what matters to us (our "eudaimonia"), then they contain **wisdom**.
  *   She wants to save emotions from being dismissed as "mere feelings." By making them judgments, she makes them accountable to reason. If you are angry, you can be asked: "Is this judgment correct?"

  ### Summary
  You haven't missed anything; you've identified the primary reason why "Strong Cognitivism" has lost popularity in recent decades.

  *   **If Emotions = Judgments:** It explains why emotions make sense (rationality), but fails to explain why they stick around when we know they shouldn't (recalcitrance).
  *   **If Emotions = Feelings:** It explains why they stick around (physiology), but fails to explain why they are *about* specific things (intentionality).

  Most contemporary philosophers now lean toward a **Hybrid** or **Perceptual** view: Emotions involve bodily feelings and cognitive appraisals, but they are not *reducible* to just judgments. Your intuition that the judgment is a *cause* (or a component) rather than the *identity* of the emotion is the standard counter-argument to the Stoic line.

  So, your head-wrapping is well-founded. The "residue" of emotion after the judgment changes is the smoking gun that suggests emotions are more complex than just evaluations.
