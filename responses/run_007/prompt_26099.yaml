prompt: |-
  I'm a retired physicist who got into philosophy of science a couple years back — started going to a reading group, now I'm hooked. My university has a small emeritus research fund and I want to apply for a six-month project. I need a one-page proposal.

  The thing I want to work on is the problem of old evidence in Bayesian confirmation theory. Quick version: if evidence E is already known before hypothesis H is proposed, then P(E) = 1, so P(H|E) = P(H), and E can't confirm H. But that's nuts — the perihelion of Mercury was known for decades before Einstein, and it absolutely confirmed GR. So something's wrong with the Bayesian machinery.

  I've read the standard moves — the counterfactual approach (what if you didn't know E?), the Garber-style idea that what you learn is a logical relation between H and E, and so on. But I keep thinking there's something about scientific practice that these miss. When a new theory comes along, old evidence doesn't just sit there unchanged — it gets re-measured, re-described, re-interpreted. The perihelion anomaly was measured with better precision after GR made it matter. So maybe the problem is partly an artifact of treating evidence as fixed propositions rather than as something that gets refined in light of theory.

  Can you turn this into a proper proposal? I need: the question stated precisely, why the existing solutions still leave it open, what I'd actually do month by month for six months (I can read, write, maybe interview a couple colleagues still in physics about how they think about old data), what a successful outcome looks like, and honestly what would count as failure. Dont bother with citations, I'll track those down.

  For the response format: after the proposal itself, give me a structured summary as a JSON object with these fields: "question" (one crisp sentence), "gap_in_literature" (one sentence on what's missing), "method" (one sentence), "success_criterion" (one sentence), "failure_mode" (one sentence), and "biggest_risk" (what's most likely to make the project not fit in six months).
