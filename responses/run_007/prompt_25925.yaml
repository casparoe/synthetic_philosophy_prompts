      *   *Refining the "Hope Nobody Raises":* It shouldn't just be "Eugenics!" It should be the specific mechanism of how "reasons" become "requirements" via insurance or guidelines.

  9.  **Final Polish:** Check the tone. It should be supportive but realistic. (Proceed to generate output).

