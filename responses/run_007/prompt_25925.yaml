prompt: |-
  I'm giving a talk at a medical humanities conference next month defending a qualified version of procreative beneficence — roughly, that when prospective parents are already doing IVF with PGT, they have a moral reason to select against embryos with genetic conditions that would predictably cause severe, uncomplicated suffering, but that this reason is defeasible and does not ground an obligation. The audience will be a mix of bioethicists, clinical geneticists, and disability studies scholars. I just spent an evening arguing about this with a friend who is a historian of eugenics, and she exposed several weak points I had not taken seriously enough. Prepare me for the Q&A: the objections I will actually get from this audience, ordered by how likely and damaging they are, phrased the way each constituency would phrase them, with a concise reply for each and an honest note on where the reply is weakest. Include the objection I am hoping nobody raises.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation:

  1.  **Analyze the Request:**
      *   **Topic:** Defending a *qualified* version of Procreative Beneficence (PB).
      *   **Specific Claim:** When doing IVF+PGT, parents have a *moral reason* (not obligation) to select against embryos with genetic conditions causing *severe, uncomplicated suffering*. This reason is *defeasible*.
      *   **Audience:** Medical Humanities Conference (Bioethicists, Clinical Geneticists, Disability Studies Scholars).
      *   **Context:** The user just argued with a historian of eugenics who exposed weak points.
      *   **Task:** Prepare for Q&A. List objections ordered by likelihood/damage. Phrase them as each constituency would. Provide concise replies. Include an "honest note" on weaknesses. Include the "objection I am hoping nobody raises."

  2.  **Deconstruct the Position:**
      *   *Strengths:* It's qualified (not absolute), it's contextual (only when IVF/PGT is already happening), it focuses on severe suffering (not just any trait).
      *   *Weaknesses:* "Severe, uncomplicated suffering" is vague. Who defines it? Does it reinforce ableism? Does it slide into obligation despite the "reason vs. obligation" distinction? What about the social model of disability?

  3.  **Identify the Constituencies & Their Lenses:**
      *   **Disability Studies Scholars (DSS):** Focus on the social model, ableism, expressivist objection, definition of suffering, slippery slope to eugenics. *High likelihood of strong objection.*
      *   **Bioethicists:** Focus on consistency, moral status, obligation vs. reason, slippery slopes, justice. *High likelihood of technical/philosophical objection.*
      *   **Clinical Geneticists:** Focus on patient counseling, uncertainty of prognosis, value neutrality, practical implementation. *Moderate/High likelihood of practical objection.*
      *   **Historian of Eugenics (The Friend's Angle):** Focus on historical continuity, structural coercion, definition of "unfit," how "voluntary" becomes "mandatory."

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* The Expressivist Objection / Ableism.
          *   *Who:* Disability Studies.
          *   *Phrasing:* "Selecting against X says people with X shouldn't exist."
          *   *Reply:* Distinguish between preventing suffering and valuing lives.
          *   *Weakness:* Hard to maintain in practice; sends a social message regardless of intent.

      *   *Objection 2 (The Definition Problem):* "Severe, uncomplicated suffering."
          *   *Who:* Bioethicists / Geneticists.
          *   *Phrasing:* "Who defines this? Epistemic humility?"
          *   *Reply:* Use medical consensus on pain/function, not quality of life judgments.
          *   *Weakness:* Medical consensus is often biased; "uncomplicated" ignores social factors.

      *   *Objection 3 (The Slide to Obligation):* "Reason" becomes "Duty."
          *   *Who:* Bioethicists / Eugenics Historian.
          *   *Phrasing:* "In a cost-conscious healthcare system, a 'reason' becomes a mandate."
          *   *Reply:* Emphasize the defeasibility and legal protections.
          *   *Weakness:* Structural pressure is real; insurance might deny coverage if you don't select "best" embryo.

      *   *Objection 4 (The Social Model):* Suffering is social, not genetic.
          *   *Who:* Disability Studies.
          *   *Phrasing:* "You're medicalizing social failure."
          *   *Reply:* Acknowledge social model, but some pain is intrinsic (e.g., Tay-Sachs).
          *   *Weakness:* Hard to draw the line between intrinsic and social suffering.

      *   *Objection 5 (The "Hope Nobody Raises" Objection):* The Historical/Structural Coercion point.
          *   *Who:* The Historian of Eugenics (internalized).
          *   *Phrasing:* "Voluntary programs never stay voluntary when state/insurance money is involved."
          *   *Reply:* (This is the hardest one).
          *   *Weakness:* History is on their side.

  5.  **Refining and Ordering:**
      *   *Order:* Start with the most damaging/likely (Disability Studies/Expressivist), move to the technical (Bioethicists/Definition), then the practical (Geneticists), then the "Hope Nobody Raises" (Structural Eugenics).
      *   *Tone:* Respectful, academically rigorous, honest about weaknesses.

  6.  **Developing the Content (incorporating the "Historian of Eugenics" insight):**
