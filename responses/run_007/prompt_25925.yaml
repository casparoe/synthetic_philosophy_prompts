answer: |-
  This is a high-stakes talk. Your position attempts to walk a tightrope between the Savulescu-style Procreative Beneficence (which many in this room will view as ableist) and a strict prohibition on selection (which many geneticists will view as ignoring parental autonomy and genuine suffering).

  The historian of eugenics friend likely pointed out that *structural* forces matter more than *individual* intent. Your "qualified" view relies on the idea that a "moral reason" stays a "reason" and doesn't become a "rule." History suggests otherwise.

  Here are the objections you will face, ordered by likelihood and potential damage to your argument, phrased by the specific constituency most likely to raise them.

  ### 1. The Expressivist Objection (Disability Studies Scholars)
  **Likelihood:** Very High | **Damage:** High
  **Phrasing:** "You argue this is about preventing suffering, not devaluing lives. But when we systematically select against embryos with specific genetic markers, aren't we sending an expressivist message to existing people with those conditions that their lives are not worth living? How does your 'qualified' view mitigate the social harm of signaling that these traits are errors to be corrected?"

  **Concise Reply:** "The expressivist objection conflates preventing the *existence* of a condition with judging the *value* of existing persons. We prevent infectious disease without devaloring survivors. My view restricts selection to conditions involving severe, intrinsic suffering (e.g., Tay-Sachs), not traits compatible with a good life (e.g., Deafness). The moral reason is grounded in the avoidance of pain, not the elimination of a type of person."

  **Honest Note on Weakness:** This is the hardest objection to fully neutralize. Even if your *logic* distinguishes between pain and personhood, the *social effect* often bleeds. If you argue some genetic lives are "too suffering-filled to start," it inevitably casts a shadow on those living with those conditions. Your reliance on the "intrinsic suffering" distinction is philosophically sound but sociologically fragile.

  ### 2. The Epistemic Arrogance Objection (Bioethicists & Geneticists)
  **Likelihood:** High | **Damage:** Medium-High
  **Phrasing:** "You hinge your entire qualified view on the phrase 'severe, uncomplicated suffering.' Who defines this? Prognoses are probabilistic, not certain. By giving parents a moral reason to select against a condition, aren't you empowering them to make medical judgments they aren't equipped to make, based on data that is often biased against disability?"

  **Concise Reply:** "I agree that epistemic humility is crucial. This moral reason only applies where there is high medical consensus on severe, intractable pain or early mortality, independent of social accommodation. It does not apply to conditions where quality of life is subjective or highly dependent on social support. The 'defeasible' nature of the reason allows parents to reject the medical consensus if they have specific knowledge to the contrary."

  **Honest Note on Weakness:** "High medical consensus" is a moving target. Many conditions once deemed "severe" are now manageable. Your argument risks freezing current medical biases into moral reasons. If the medical consensus is wrong (which disability scholars argue it often is), your "moral reason" becomes a vehicle for error.

  ### 3. The Counseling Neutrality Objection (Clinical Geneticists)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "In the clinic, a 'moral reason' sounds a lot like a recommendation. If I tell a patient, 'You have a moral reason to select Embryo A over Embryo B,' how is that distinct from telling them they *ought* to do so? This compromises non-directive counseling and places undue guilt on parents who choose differently."

  **Concise Reply:** "There is a distinction between a *normative claim* about what is morally better, and a *clinical directive* about what is required. My view is for the ethical framework, not the counseling script. Clinicians should present the medical facts regarding suffering; the derivation of a 'moral reason' is for the parents to weigh against their own values, not for the clinician to enforce."

  **Honest Note on Weakness:** This is practically naive. In a 15-minute consult, the distinction between "there is a reason to" and "you should" collapses. If the expert says there is a moral reason, patients hear an obligation. You are asking clinicians to carry a philosophical distinction that the clinical setting erodes.

  ### 4. The "Hope Nobody Raises" Objection (The Historian of Eugenics)
  **Likelihood:** Low (because it kills the room) | **Damage:** Catastrophic
  **Phrasing:** "You rely on the distinction between a 'reason' and an 'obligation' to avoid the eugenics label. But historically, voluntary eugenic programs never stay voluntary. Once insurance companies, state health systems, or hospital guidelines adopt your 'moral reason' as a metric of 'responsible parenting' or 'cost-effectiveness,' it becomes a de facto mandate. Are you prepared to defend this view in a system where 'defeasible reasons' are treated as 'coverage requirements'?"

  **Concise Reply:** "That is a risk of implementation, not a flaw in the ethical principle. We don't abandon the moral reason to tell the truth because lying might be politically expedient. We must build guardrails—legal and professional—to prevent structural coercion, rather than denying the moral reason to avoid potential misuse."

  **Honest Note on Weakness:** **This is your weakest point.** The historian is right: ethical distinctions rarely survive contact with insurance reimbursement structures and liability law. If you argue there is a *moral reason* to select against a condition, and that condition is expensive to treat, you have handed insurers a argument to deny coverage for the "less optimal" embryo. You have no good defense against the slide from "reason" to "requirement" other than "we should try hard not to let that happen," which history suggests is insufficient.

  ### Strategic Advice for the Q&A
  *   **Lean into the "Defeasible":** When pressed, reiterate that this reason can be overridden by religious views, skepticism of medical prognosis, or a commitment to disability solidarity. It is a *prima facie* reason, not a trump card.
  *   **Concede the Social Model:** Do not fight the Disability Studies scholars on the social model of disability. Admit that *most* suffering is social. Argue only that a *residual category* of suffering remains even in a perfectly accommodated society (e.g., neurodegenerative pain).
  *   **The "Historian" Trap:** If the eugenics objection comes up, do not get defensive. Acknowledge the historical precedent. Say: "The history of eugenics is precisely why I insist this reason is non-binding and never state-enforced. The remedy for coercion is not silence on suffering, but robust protection of reproductive liberty."

  Good luck. This is a necessary conversation, but the minefield is real.
