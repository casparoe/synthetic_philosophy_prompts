      *   *Correction:* Ensure Goodman's specific view (Entrenchment) is distinct from general Pragmatism.
      *   *Correction:* The "Skeptic" leaf needs to distinguish between Humean skepticism (Old Riddle) and Goodmanian skepticism (New Riddle). Goodman isn't a skeptic; he thinks he solved it. The skeptic says *nobody* solved it.

  9.  **Final Polish:**
