prompt: |-
  I'm taking a grad seminar on decision theory this semester and we just hit the Pasadena paradox, and honestly I'm kind of lost in the weeds. The professor threw it at us right after St. Petersburg and I think half the class is still trying to figure out why conditional convergence even matters for a gamble. For those who haven't seen it: the Pasadena game is this gamble where the expected value is the sum of an alternating harmonic series — it converges conditionally but not absolutely, so depending on how you order the terms, you can get the sum to be any real number, or diverge to ±∞. So the expected value isn't just infinite (like St. Petersburg), it's literally undefined. And there are other games in the neigborhood — the St. Petersburg game itself, the two-envelope problem, the Ross-Littlewood paradox if you think of it in decision-theoretic terms — where something goes wrong with expected value maximization.

  Before I read any of the proposed fixes — the Nover and Hájek stuff, the various dominance principles people have cooked up, the proposals to restrict the domain of expected utility theory — I want to know what I should be asking of a theory here. Write me the desiderata: what any adequate theory of rational choice has to deliver when expected values are infinite or undefined. Which cases must it get right, which puzzles must it dissolve or at least explain away, which constraints from standard decision theory can't be abandoned lightly, and which are up for grabs. For each desideratum, give the case or consideration that motivates it. And flag any pair of desiderata you suspect can't be jointly satisfied — that's the part I most want to see, because I suspect the whole literature is people trying to have their cake and eat it too.

  I don't need a full scorecard of every theory against the list, but if there's one or two desiderata that do most of the work in knocking out the popular fixes, point that out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar on decision theory.
      *   **Topic:** Pasadena Paradox (and related infinite/undefined expectation problems like St. Petersburg, Two-Envelope, Ross-Littlewood).
      *   **Current State:** Confused by the technical details (conditional convergence) and looking for conceptual clarity *before* diving into specific solutions (Nover & Hájek, etc.).
      *   **Task:** Provide a list of *desiderata* (criteria/goals) for an adequate theory of rational choice in the face of infinite/undefined expectations.
      *   **Requirements:**
          *   Explain what the theory must deliver.
          *   Identify cases/puzzles it must handle.
          *   Identify constraints from standard decision theory (DT) to keep vs. abandon.
          *   **Crucial:** Flag tensions/incompatibilities between desiderata (trade-offs).
          *   **Crucial:** Highlight which desiderata do the most work in evaluating existing fixes.
      *   **Tone:** Academic but accessible (grad student level), insightful, structured.

  2.  **Deconstruct the Problem Space:**
      *   *Standard Expected Utility Theory (EUT):* Relies on real-valued expectations. Fails when sums diverge or are conditionally convergent.
      *   *The Core Issue:* How to compare gambles $A$ and $B$ when $E[A]$ and $E[B]$ are $\infty$, $-\infty$, or undefined.
      *   *Key Paradoxes:*
          *   St. Petersburg (Infinite expectation).
          *   Pasadena (Undefined expectation due to conditional convergence).
          *   Two-Envelope (Paradoxical switching based on flawed expectation calculation).
          *   Ross-Littlewood (Supertasks/Infinite sets).
      *   *Key Principles in Tension:* Dominance, Transitivity, Continuity, Finite Additivity, Countable Additivity, Statewise vs. Eventwise comparison.

  3.  **Drafting the Desiderata (Brainstorming & Categorization):**

      *   *Desideratum 1: Extensional Adequacy.* It needs to give *some* verdict on the Pasadena game. We can't just say "no theory applies."
      *   *Desideratum 2: Consistency with Standard DT.* Where standard DT works (finite cases), the new theory should agree. (Conservativeness).
      *   *Desideratum 3: Dominance.* If $A$ pays more than $B$ in every state, $A \succ B$. This is huge.
      *   *Desideratum 4: Transitivity.* If $A \succ B$ and $B \succ C$, then $A \succ C$. Essential for rational choice.
      *   *Desideratum 5: Handling Infinity.* It needs to distinguish between "really good infinite" (St. Petersburg) and "weird infinite" (Pasadena).
      *   *Desideratum 6: Invariance.* The value shouldn't depend on how I describe the states (re-description problem). This hits Pasadena hard because reordering terms changes the sum.
      *   *Desideratum 7: Decision Guidance.* It shouldn't result in paralysis (incomparability everywhere).

  4.  **Identifying Tensions (The "Cake and Eat It Too" part):**
      *   *Dominance vs. Countable Additivity:* This is the classic Arntzenius/Elga/Nover tension. If you have infinite states, satisfying dominance often requires giving up countable additivity of probabilities or utilities.
      *   *Transitivity vs. Undefined Values:* If $E[A]$ is undefined, how do you maintain transitivity across a chain of comparisons?
      *   *Invariance vs. Standard Summation:* Pasadena shows standard summation isn't invariant under rearrangement. To fix this, you need a non-standard summation method, which might violate linearity.
      *   *The "Pasadena Specific" Tension:* You want to say Pasadena is worse than St. Petersburg, but standard math says they are both "infinite" in some sense. You want to say Pasadena has *no* value, but then you can't compare it to anything.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate the "lost in the weeds" feeling. Set the stage (EUT breakdown).
      *   **The Desiderata List:** Group them logically (Normative Core, Mathematical Consistency, Problem-Solving).
      *   **The Hard Trade-offs (The "Meat"):** This needs to be the highlight. Focus on Dominance vs. Countable Additivity and Invariance vs. Linearity.
      *   **The "Killer" Desiderata:** Identify which ones kill specific theories (e.g., Relative Expectation Theory, Weak Dominance).
      *   **Conclusion:** Summary advice for the seminar.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *infinite* expectation (St. Pete) and *undefined* expectation (Pasadena). They require slightly different handling.
      *   *Refinement:* The user mentioned Ross-Littlewood. I should briefly note that this is more about supertasks/ontology, but decision-theoretically it overlaps with infinite state spaces. Keep the focus on Pasadena/St. Pete/Two-Envelope as requested.
      *   *Emphasis:* The user specifically asked for *incompatibilities*. I need to be explicit about "No Go Theorems" (like the one by Hájek or Nover).
      *   *Tone Check:* Keep it rigorous. Use terms like "Countable Additivity," "Statewise Dominance," "Re-ordering Invariance."

  7.  **Final Polish:**
      *   Check against the prompt: Did I list cases? Yes. Constraints to keep/abandon? Yes. Incompatibilities? Yes. Which desiderata knock out fixes? Yes.
      *   *Key Insight to include:* The distinction between *value* (axiological) and *choice* (practical). Sometimes the solution is to stop trying to assign a number and just rank options.

  8.  **(Mental Draft of the Trade-off Section):**
      *   Tension 1: Dominance + Countable Additivity + Standard Probability = Contradiction in infinite cases. (Arntzenius).
      *   Tension 2: Linearity (E[A+B] = E[A]+E[B]) + Undefined Values. If E[A] is undefined, E[A+B] breaks.
      *   Tension 3: Invariance (ordering shouldn't matter) + Standard Summation. Pasadena proves these clash.

  9.  **Finalizing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a classic "crisis point" in a decision theory seminar. You are feeling lost because the mathematics is pulling the rug out from under the intuition that rational choice is just "maximizing the weighted average." When the average doesn't exist, the machinery breaks.

  The literature on infinite ethics and decision theory (Nover, Hájek, Arntzenius, Elga, Colyvan) is essentially a graveyard of intuitive principles that turn out to be incompatible in infinite state spaces.

  Here is a scorecard of desiderata for any theory attempting to handle undefined or infinite expectations. I have grouped them by **Normative Core** (what rationality requires), **Formal Constraints** (mathematical hygiene), and **Problem-Solving** (specific paradoxes). At the end, I detail the incompatibilities that make this field so contentious.

  ---

  ### I. The Desiderata

  #### 1. Normative Core (Principles of Rationality)
  *These are the constraints from standard decision theory that we are reluctant to abandon.*

  *   **D1. Statewise Dominance:** If gamble $A$ yields an outcome at least as good as gamble $B$ in every possible state of the world, and strictly better in at least one, then $A$ is strictly preferred to $B$.
      *   *Motivation:* This is the bedrock of instrumental rationality. If you prefer $A$ to $B$ despite $B$ dominating $A$, you are effectively paying to lose.
  *   **D2. Transitivity:** If $A \succeq B$ and $B \succeq C$, then $A \succeq C$.
      *   *Motivation:* Without transitivity, you are susceptible to money pumps. A theory that declares $A$ and $B$ incomparable is okay; a theory that says $A \succ B \succ C \succ A$ is fatal.
  *   **D3. Conservativeness (Finite Agreement):** In all cases where expected values are finite and well-defined, the new theory must yield the same rankings as standard Expected Utility Theory (EUT).
      *   *Motivation:* We know EUT works for finite cases. A new theory shouldn't fix the infinite cases by breaking the finite ones.
  *   **D4. Probabilistic Coherence:** The agent's degrees of belief must satisfy the axioms of probability (specifically, how they handle infinite additivity is the battleground here).
      *   *Motivation:* If your probabilities don't sum to 1 or violate additivity, you are vulnerable to Dutch Books.

  #### 2. Formal Constraints (Mathematical Hygiene)
  *These address the specific mathematical pathologies of the Pasadena/St. Petersburg cases.*

  *   **D5. Re-ordering Invariance:** The value or ranking of a gamble should not depend on the arbitrary indexing or ordering of the states in the sample space.
      *   *Motivation:* **The Pasadena Killer.** The Pasadena game's expectation is the alternating harmonic series $\sum (-1)^{n-1}/n$. By the Riemann Rearrangement Theorem, you can reorder the terms to sum to any number. A rational preference shouldn't change just because I listed the "heads on toss 1" state before "heads on toss 2."
  *   **D6. Linearity (or Quasi-Linearity):** $E[A + B] = E[A] + E[B]$. Or, at least, adding a constant finite amount to every payoff in a gamble should shift its value by that amount.
      *   *Motivation:* If I add \$5 to every possible outcome of the Pasadena game, the new game should be strictly better than the original. If the theory can't register this improvement, it's blind to obvious value.
  *   **D7. Definedness (Comparability):** The theory should minimize cases of "incomparability." It should be able to rank most pairs of gambles, even if their expectations are undefined.
      *   *Motivation:* A theory that says "Pasadena is incomparable with everything, including itself" is technically consistent but practically useless. We need decision guidance.

  #### 3. Problem-Solving (Specific Paradoxes)
  *These are the specific bullets the theory must bite or dodge.*

  *   **D8. The St. Petersburg Distinction:** The theory must distinguish between the St. Petersburg game (infinite positive expectation) and the Pasadena game (undefined expectation).
      *   *Motivation:* Intuitively, St. Petersburg is a "good" infinite gamble (all payoffs positive), while Pasadena is "wild" (payoffs oscillate). A theory that lumps them together as simply "$\infty$" loses important nuance.
  *   **D9. The Two-Envelope Dissolution:** The theory must explain why you cannot profit by always switching envelopes in the Two-Envelope paradox.
      *   *Motivation:* The Two-Envelope paradox relies on flawed expectation reasoning over an infinite space. An adequate theory of infinite choice should block the fallacious inference that $E[\text{switch}] > E[\text{stay}]$.
  *   **D10. No Supertask Exploits:** The theory should not recommend taking gambles that rely on physically impossible supertasks (like Ross-Littlewood) unless the payoffs genuinely warrant it.
      *   *Motivation:* We want a theory of *rational choice*, not a theory of *mathematical fantasy*. If the theory forces you to accept a gamble that requires completing an infinite number of tasks in finite time, it's detached from agency.

  ---

  ### II. The Incompatibilities (Where You Can't Have Your Cake)

  This is the most important part for your seminar. The literature is largely defined by which of these pairs theorists choose to sacrifice.

  #### Conflict 1: Dominance (D1) vs. Countable Additivity (D4)
  *   **The Tension:** In infinite state spaces, you often cannot satisfy Statewise Dominance and maintain Countable Additivity of probabilities simultaneously.
  *   **The Case:** Consider a gamble where you pay \$1 to play. If state $n$ occurs, you get \$n. If probabilities are countably additive over an infinite set of states, they must sum to 1. But to make the expectation work out such that Dominance holds for all infinite comparisons, you often need "improper priors" (probabilities that don't sum to 1) or finitely additive probabilities that behave weirdly.
  *   **The Trade-off:**
      *   *Keep Countable Additivity:* You must weaken Dominance (e.g., to "Weak Dominance" or restrict it to finite cases). **Cost:** You might prefer a dominated option in infinite cases.
      *   *Keep Dominance:* You must adopt Finitely Additive probabilities (de Finetti style). **Cost:** You lose standard convergence theorems and Dutch Book arguments become trickier.
  *   **Who loses:** Standard EUT extensions that try to keep both usually crash on the **St. Petersburg** variant cases.

  #### Conflict 2: Re-ordering Invariance (D5) vs. Linearity/Summation (D6)
  *   **The Tension:** This is the **Pasadena Specific** conflict. Standard summation is *not* invariant under re-ordering for conditionally convergent series.
  *   **The Case:** The Pasadena game. If you define value via standard summation, you violate Invariance. If you define value via a re-ordering invariant method (like a specific limit process or non-standard analysis), you often break Linearity.
  *   **The Trade-off:**
      *   *Keep Standard Summation:* You admit the value of the gamble is undefined or order-dependent. **Cost:** Violates D5. The value of the gamble depends on how the casino writes the contract.
      *   *Keep Invariance:* You must use a generalized summation method (e.g., Cesàro summation, or Hájek's relative expectation). **Cost:** You often lose Linearity. $E[A+B]$ might not equal $E[A] + E[B]$.
  *   **Who loses:** **Nover & Hájek's** original proposal struggles here. They argue the value is undefined, which saves Invariance (sort of) but sacrifices Decision Guidance (D7).

  #### Conflict 3: Definedness (D7) vs. Conservativeness (D3)
  *   **The Tension:** To get a defined value for Pasadena, you have to change the math. To keep the math standard, you have to accept undefined values.
  *   **The Case:** If you want to say "Pasadena is worth 0.69 (ln 2)," you are adopting a specific summation convention. But if you adopt that convention, does it apply to finite cases? If yes, does it change finite EUT results?
  *   **The Trade-off:**
      *   *Maximize Definedness:* Use non-standard analysis or hyperreals to assign values to everything. **Cost:** You introduce mathematical complexity that may violate Conservativeness (D3) or lead to counterintuitive rankings in finite cases.
      *   *Maximize Conservativeness:* Stick to standard reals. **Cost:** You must accept that some rational choices are "gaps" (incomparable).
  *   **Who loses:** Theories using **Hyperreals** (like Easwaran) get Definedness but pay a high complexity tax. Theories that accept **Gaps** (like Nover) get Conservativeness but leave the agent paralyzed.

  ---

  ### III. The "Killer" Desiderata for Existing Fixes

  If you want to critically evaluate the papers you're about to read, focus on these two desiderata. They do the most damage to proposed solutions.

  #### 1. Re-ordering Invariance (D5)
  *   **Why it kills:** Many early fixes for Pasadena tried to assign a specific value (like $\ln 2$) by appealing to the "natural" ordering of the coin tosses (toss 1, toss 2, toss 3...).
  *   **The Critique:** Why is time-ordering the "natural" ordering? If the casino reveals the results in a different order, does the gamble change value? If the theory says "Yes," it violates D5. If it says "No," it needs a summation method that ignores order, which usually forces the value back to "undefined."
  *   **Target:** This knocks out most naive "assign the limit" strategies.

  #### 2. Statewise Dominance (D1) in Infinite Spaces
  *   **Why it kills:** This is the hammer used by Arntzenius and Elga. They show that if you try to extend EUT to infinite cases while keeping Dominance and Countable Additivity, you generate contradictions.
  *   **The Critique:** Any theory that claims to solve Pasadena *and* St. Petersburg must explicitly state which part of Dominance it is restricting. If a paper claims to keep Dominance intact, check if they have silently switched to Finite Additivity.
  *   **Target:** This knocks out "Business as usual" extensions of EUT.

  ### Summary Advice for the Seminar

  When you read the Nover & Hájek paper (and the responses), look for where they land on **Invariance vs. Definedness**.
  *   **Nover & Hájek** essentially argue: "The value is undefined. Deal with it." They prioritize **Invariance** and **Conservativeness** over **Definedness**.
  *   **Critics (e.g., Colyvan, Easwaran)** argue: "Rationality requires a choice." They prioritize **Definedness** and **Dominance**, often sacrificing **Standard Summation** (using hyperreals or relative utilities).

  The "Paradox" isn't just that the math is weird; it's that **D1, D4, D5, and D7 cannot all be true simultaneously.** The seminar is essentially a debate over which one is the least essential to rationality.

  **My bet:** The most robust theories sacrifice **Countable Additivity** (going finitist) or sacrifice **Definedness** (accepting incomparability). The ones that try to keep everything usually hide a contradiction in the infinite limit cases. Keep an eye out for where the authors sweep the infinite sum under the rug.
