  Got a weird proposition from a former co-founder and its been bugging me. He wants to acquire a side project I built. The deal is: if I can genuinely intend, as of this Friday, to join his company full-time for a year, he'll wire me $150k immediately. But — and he was totally upfront about this — the contract has no clawback clause and no non-compete. I could literally take the money and quit day one. He says that doesnt matter, he just needs to know I really mean it on Friday. I want the money. But I also know myself: I've got other opportunities brewing and I'd probably leave within months. So can I actually form the intention to stay? And is there something structurally broken about an offer where the reward depends only on what you intend, not on what you do? It feels like a glitch in the matrix but I cant articulate why.
