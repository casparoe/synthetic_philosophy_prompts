answer: |-
  You are right to feel that slip between steps (4) and (6). That is exactly where the bait-and-switch happens. Your friend has constructed a very strong version of a classic objection, often called the "Problem of Easy Knowledge" or the "Bootstrapping Objection," but they rely on a false equivalence to get to the dogmatism charge.

  To keep (2) and (3) as you wish, while avoiding the charge of dogmatism in step (7), you should **reject step (6).**

  Step (6) claims that the method available to Moore is *available to everyone in the same way*. It assumes that all "certainties" are epistemically equal—that Moore's certainty about his hands is the same *kind* of thing as a Creationist's certainty about special creation. It isn't.

  Here is how you break the equivalence without sounding like you're making a special plea for common sense.

  ### 1. The Category Error: Hinges vs. Hypotheses
  The structural difference between Moore and the Creationist is not about *how sure* they feel, but about the *role* the belief plays in their epistemic system.

  *   **Moore's Claim ("Here is a hand"):** This functions as what Wittgenstein called a "hinge proposition." It is a framework condition that allows the game of giving and asking for reasons to function at all. To doubt it is not to make a scientific error; it is to dismantle the very machinery required to evaluate evidence. You cannot use evidence to prove the external world exists, because the concept of "evidence" already presupposes an external world.
  *   **The Creationist's Claim ("Life was specially created"):** This is an empirical hypothesis *within* the framework. It competes with other hypotheses (like natural selection) using shared rules of evidence (fossils, genetics, geology).

  When Moore rejects the skeptic's argument, he is defending the **board** on which the game is played. When the Creationist rejects evolution, they are refusing to make a **move** that the rules of the game require.

  If you reject step (6) on these grounds, you aren't saying "Moore is right because he's Moore." You are saying, "Moore is operating at the level of preconditions for knowledge, whereas the Creationist is operating at the level of specific knowledge claims."

  ### 2. The Source of Justification: Seemings vs. Inferences
  There is a second distinction that blocks step (6). In contemporary epistemology (specifically in the view known as *Phenomenal Conservatism* or *Dogmatism*), justification comes from "seemings."

  *   **Moore:** When Moore looks at his hand, he has a direct perceptual seeming. It *appears* to him vividly and immediately that a hand is there. In the absence of defeaters (like knowing he's on a movie set), this seeming provides immediate justification. He doesn't need to infer the hand; he sees it.
  *   **The Creationist:** The Creationist does not have a direct perceptual seeming of "special creation." They have a text, or an intuition about complexity, from which they *infer* a creator. This is a theoretical conclusion, not a perceptual baseline.

  If the Creationist says, "I'm more certain of creation than evolution," they are prioritizing a theoretical inference over a mountain of perceptual and logical data. Moore is prioritizing a direct perceptual report over a theoretical skeptical scenario. The epistemic weight is not the same.

  ### 3. The Cost of Rejecting (6)
  You asked what rejecting this step costs. It's important to be honest about the price tag.

  If you reject (6) and defend Moore, you have to accept **Dialectical Impotence.**
  Moore's proof works for *Moore*. It confirms what he is entitled to believe. But it does not—and cannot—convince the radical skeptic. If the skeptic says, "I don't accept that perceptual seemings justify belief in an external world," Moore has no non-circular argument to change their mind.

  You have to give up the idea that a "proof" must always be a tool for persuasion. Sometimes, a proof is just a way of mapping the structure of your own justification. You are accepting that you cannot argue someone out of radical skepticism if they refuse to accept the basic rules of the epistemic game.

  ### 4. Reclaiming "Dogmatism"
  Finally, don't let your friend scare you with the word "dogmatism." In this specific context, a position called **Perceptual Dogmatism** (championed by philosophers like Jim Pryor) argues exactly what you want to keep in (2) and (3).

  It says: You are entitled to trust your senses unless you have a specific reason not to. You don't need to prove your senses are reliable *before* you use them. That isn't vice; it's a necessity. If you demand proof for every starting point, you end up in an infinite regress and know nothing.

  The Creationist is being dogmatic in the *vice* sense (ignoring counter-evidence within the system). Moore is being dogmatic in the *structural* sense (refusing to doubt the system itself without cause).

  ### Summary
  *   **Reject Step (6).** The method is not available to everyone equally because Moore's certainty is based on perceptual immediacy and framework conditions, while the Creationist's is based on theoretical inference and empirical claims.
  *   **The Cost:** You admit that Moore's proof doesn't silence the skeptic in a debate; it only secures Moore's own knowledge.
  *   **The Payoff:** You keep (2) and (3). Moore knows he has hands, and the valid argument proves the external world exists *for him*, without needing to beg the question in a vicious way.

  You aren't making a special plea for common sense; you're making a structural distinction between the *conditions* of evidence and the *content* of evidence. That's a principled difference, not a bait-and-switch.
