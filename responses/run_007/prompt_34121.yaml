answer: |-
  This is an excellent frustration to have. You have identified the methodological gap that plagues much of the literature: people are selling hammers without first agreeing on what the nail looks like. In infinite ethics, the "nail" is a coherent ordering relation over worlds with infinite value, and we have proof that some shapes of nails cannot be hit by any hammer we possess.

  If you walk away with nothing else, take this: **There is no "correct" theory of infinite aggregation.** There are only trade-offs. The impossibility theorems prove that certain sets of intuitively obvious requirements are logically incompatible. Therefore, defining the desiderata is not just housekeeping; it is the act of choosing which bullet to bite.

  Here is the systematic breakdown of the desiderata, the impossibility results, and the scorecard you asked for.

  ---

  ### I. The Desiderata List

  We can divide requirements into three buckets: **Intuitive Principles** (ethical intuitions), **Formal Constraints** (logical coherence), and **Structural Properties** (how value is distributed).

  #### A. Intuitive Principles (Ethical Intuitions)

  | Desideratum | Definition | The Case/Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **Pareto (Dominance)** | If World $A$ is at least as good as World $B$ for every individual/location, and strictly better for at least one, then $A > B$. | **The Basic Improvement:** If I make one person happier without hurting anyone, the world is better. | **Non-Negotiable** (Almost universally accepted). |
  | **Strong Pareto** | If $A$ is better than $B$ for *every* individual/location, then $A > B$. | **Universal Improvement:** If everyone is happier in $A$, $A$ must be better. | **Non-Negotiable**. |
  | **Anonymity (Permutation Invariance)** | The value of a world does not depend on *which* specific individuals/locations hold the utility, only the distribution. Swapping utilities between two agents doesn't change the total value. | **The Location Swap:** Why does it matter if Person 1 has 5 utility and Person 2 has 10, versus Person 1 has 10 and Person 2 has 5? | **Contested**. (Crucial conflict point, see Impossibility Results). |
  | **Separability** | The evaluation of a subset of the population should not depend on the utility of those outside the subset (given fixed total). | **Independence of Irrelevant Alternatives:** If I change things in Galaxy A, the ranking shouldn't flip based on what's happening in Galaxy B. | **Contested**. (Often violated by density approaches). |
  | **Action-Guidance (Anti-Paralysis)** | The theory must allow finite agents to determine that some actions are better than others. | **Infinitarian Paralysis:** If $\infty = \infty$, saving a life adds $+1$ to $\infty$, changing nothing. A theory must show why saving the life matters. | **Non-Negotiable** (for a practical ethics). |

  #### B. Formal Constraints (Logical Coherence)

  | Desideratum | Definition | The Case/Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **Transitivity** | If $A \ge B$ and $B \ge C$, then $A \ge C$. | **Money Pump:** Without transitivity, preferences are cyclical and irrational. | **Non-Negotiable**. |
  | **Completeness** | For any two worlds $A$ and $B$, either $A \ge B$ or $B \ge A$ (or both). | **Decisiveness:** We need to be able to choose between any two options. | **Contested**. (Many accept *incompleteness* to save other desiderata). |
  | **Continuity** | Small changes in utility streams should not cause massive jumps in value ranking. | **Archimedean Property:** Prevents lexicographic ordering where one infinite good trumps any amount of another. | **Contested**. |

  #### C. Structural Properties (Infinite Specifics)

  | Desideratum | Definition | The Case/Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **Translation Invariance** | Shifting the entire utility stream in time or space shouldn't change its value. | **Temporal Neutrality:** A happy century in year 1000 shouldn't be worth more than a happy century in year 2000. | **Contested**. (Discounting violates this). |
  | **Expansion Consistency** | Adding a finite number of good lives to an infinite world should make it better (or at least not worse). | **The Expansion Paradox:** If the world is infinite, adding a billion happy people seems like it should improve it, but standard math says $\infty + n = \infty$. | **Non-Negotiable** (for most utilitarians). |

  ---

  ### II. The Impossibility Results (The "You Can't Have It All" Theorems)

  This is the section you care about most. These theorems demonstrate that the desiderata above form an inconsistent set. You must drop at least one.

  #### 1. The Pareto-Anonymity-Completeness Trilemma
  *   **The Result:** You cannot have a complete ordering over infinite utility streams that satisfies **Strong Pareto** and **Anonymity** (finite permutations).
  *   **Source:** Variations of this appear in Lauwers (1998, 2000) and Zame (2007).
  *   **The Conflict:**
      *   If you demand **Completeness** (you must rank everything) and **Pareto** (improvements matter), you are mathematically forced to violate **Anonymity**. You must treat some locations/times as more valuable than others (e.g., earlier times weigh more).
      *   If you demand **Anonymity** (all locations equal) and **Pareto**, you must accept **Incompleteness**. There will be pairs of worlds you simply cannot compare.
  *   **Implication:** This is the primary fork in the road.
      *   *Camp A (Completeness):* Accepts discounting or hyperreals with ultrafilters (violates Anonymity).
      *   *Camp B (Anonymity):* Accepts partial orderings (e.g., overtaking criteria) where some worlds are incomparable.

  #### 2. The Banach-Tarski / Measure Problem
  *   **The Result:** In infinite spatial universes, you cannot assign a consistent measure (value density) to all subsets of space that satisfies translation invariance and additivity.
  *   **The Case:** If you try to calculate "average value per cubic lightyear," the answer changes depending on how you carve up the infinite space (the boundary problem).
  *   **Implication:** "Value Density" approaches are mathematically fragile. They require arbitrary choices about how to expand the limit of evaluation.

  #### 3. The Infinitarian Paralysis (Formalized)
  *   **The Result:** In standard real analysis, if Total Value $V(A) = \infty$ and $V(B) = \infty$, then $V(A) - V(B)$ is undefined.
  *   **The Case:** If the future is infinite and contains positive value, no finite action changes the total sum.
  *   **Implication:** Standard Summation Utilitarianism is logically incapacitated in infinite contexts. It is not just "hard to calculate"; it is undefined.

  ---

  ### III. Scorecard of Main Approaches

  Here is how the major proposals fare against the desiderata. Note that every approach fails at least one "Non-Negotiable" or accepts a major "Contested" failure.

  | Approach | How it Works | Passes Pareto? | Passes Anonymity? | Passes Completeness? | Solves Paralysis? | Major Fatal Flaw |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Summation** | Sum all utilities. | Yes | Yes | Yes | **No** | **Undefined.** $\infty - \infty$ breaks everything. Dead on arrival for infinite cases. |
  | **Discounting** | Future utility is worth less ($1/(1+r)^t$). | Yes | **No** | Yes | Yes | **Discriminates against the future.** Violates Intergenerational Equity (Anonymity). Implies a catastrophe in year 3000 matters less than a stubbed toe today. |
  | **Value Density** | Compare average value over expanding spheres/periods. | Yes | Yes | **No** | Yes (Sometimes) | **Boundary Sensitivity.** The ranking changes depending on the shape/speed of the expansion limit. Violates Translation Invariance. |
  | **Hyperreals** | Use non-standard analysis to distinguish sizes of infinity. | Yes | **No** | Yes | Yes | **Non-Constructive.** Relies on the Axiom of Choice (Ultrafilter Lemma). The ranking depends on an arbitrary choice of ultrafilter. Violates Anonymity implicitly. |
  | **Causal/Local** | Ignore the total; focus on local causal impact. | Yes | Yes | N/A | Yes | **Sidesteps Aggregation.** Doesn't actually rank worlds, only actions. Fails if the question is "Which world is better?" rather than "What should I do?" |
  | **Overtaking / Catching Up** | $A > B$ if $A$'s partial sums eventually exceed $B$'s and stay there. | Yes | Yes | **No** | Yes | **Incompleteness.** Many infinite streams oscillate and never "overtake." Leaves many choices rationally undetermined. |

  ---

  ### IV. Strategic Advice for Your Seminar

  Since you asked for the "Non-Negotiable" vs. "Preference" distinction, here is the philosophical bottom line you should bring to the table:

  1.  **The Hard Constraint:** You cannot have **Completeness** and **Anonymity** together in an infinite domain. This is a mathematical fact (related to the non-existence of a Paretian social welfare function on infinite streams that is anonymous).
  2.  **The Decision:** Every paper you read is essentially a defense of which of those two to sacrifice.
      *   If they propose **Hyperreals** or **Discounting**, they are sacrificing **Anonymity** (some times/locations count more, or the ordering relies on arbitrary mathematical structures that break symmetry).
      *   If they propose **Overtaking Criteria** or **Partial Orderings**, they are sacrificing **Completeness** (admitting that sometimes we just can't say which world is better).
  3.  **The "Paralysis" Fix:** The only way to truly solve Infinitarian Paralysis without changing the math of infinity is to switch from **Total Value** aggregation to **Causal Difference** making. But this requires a decision theory (like Causal Decision Theory) rather than just an aggregation theory.

  **Your Move:**
  When you read the next paper, do not ask "Does this solve the problem?" Ask: **"Which impossibility theorem is this author violating, and which desideratum are they explicitly sacrificing to do it?"**

  If they claim to satisfy Pareto, Anonymity, *and* Completeness simultaneously, they have made a mathematical error. If they admit they are dropping Completeness, check if the resulting incompleteness is tolerable for ethical decision-making. If they drop Anonymity, check if the resulting discrimination (e.g., against the far future) is ethically defensible.

  That is the map. Everything else is territory.
