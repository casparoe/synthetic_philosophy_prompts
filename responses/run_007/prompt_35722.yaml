answer: |-
  Elena and Mark are ordinary colleagues who both assign a 50% credence to living in a simulation and agree that simulated suffering matters just as much as real suffering. They face a choice between donating 10% of their income to deflect an asteroid destined to strike Earth in 300 years or to a malaria eradication fund saving lives today. In base reality, both agree the asteroid deflection has slightly higher expected value than the malaria fund, but only just. Elena believes that if they are in a simulation, the simulators maintain full physical fidelity indefinitely, meaning the asteroid event will be computed and her donation will work. Mark believes that simulators optimize resources by degrading physical fidelity after the current historical era, meaning the asteroid event lies beyond the simulation's computational horizon and her donation would be causally inert within the sim. Consequently, Elena donates to the asteroid fund, calculating high expected value in both scenarios, while Mark donates to malaria, calculating high value in base reality but zero value in the simulation case, tipping the balance toward the certain near-term good.

  **Step-by-Step Reasoning**

  1.  **Shared Premises:** Both agents agree on the probability of being in a simulation (50%), the moral weight of simulated lives (100% of base reality), and the base-reality expected value (EV) of the interventions (Asteroid EV is slightly higher than Malaria EV).
  2.  **Divergent Premise:** The disagreement rests entirely on the **Temporal Fidelity Assumption**. Elena assumes simulations run with high fidelity indefinitely; Mark assumes simulations degrade or terminate regarding far-future physical events to save compute.
  3.  **Elena's Calculation:** Her EV for the asteroid is $0.5 \times \text{High}_{\text{Base}} + 0.5 \times \text{High}_{\text{Sim}}$. Since $\text{High}_{\text{Sim}} \approx \text{High}_{\text{Base}}$, her total EV is High. Her EV for malaria is Medium. She chooses the asteroid.
  4.  **Mark's Calculation:** His EV for the asteroid is $0.5 \times \text{High}_{\text{Base}} + 0.5 \times 0_{\text{Sim}}$. This reduces his total EV to Medium-Low. His EV for malaria is $0.5 \times \text{Medium}_{\text{Base}} + 0.5 \times \text{Medium}_{\text{Sim}}$, which remains Medium. Because the base-reality advantage of the asteroid was only slight, the 50% discount drags the asteroid's EV below malaria's. He chooses malaria.
  5.  **Removing the Assumption:** If you remove the Temporal Fidelity assumption and force both to assume Indefinite Fidelity, Mark's calculation matches Elena's, and both donate to the asteroid. If you force both to assume Degraded Fidelity, Elena's calculation matches Mark's, and both donate to malaria. The behavioral divergence disappears without this specific structural assumption about simulator resource allocation.

  **The "Rigged" Argument**

  A proponent of the malaria charity would argue the case is rigged because it artificially suppresses the base-reality value of the far future. Strong longtermism asserts that the expected value of securing the far future is not *slightly* higher than near-term aid, but astronomically higher (e.g., orders of magnitude greater). If the base-reality EV of asteroid deflection were truly astronomical, Mark's 50% discount for simulation risk would not be enough to drop it below the value of malaria eradication. By setting the base-reality values as "comparable," the thought experiment smuggles in skepticism about the immense value of the far future to prove that simulation skepticism reduces fanaticism, effectively begging the question against the longtermist position it aims to test.
