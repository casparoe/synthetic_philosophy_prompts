answer: |-
  The mapping

  In the standard pragmatist tool analogy, a **belief** corresponds to the **tool** (e.g., a hammer). The **task** represents the specific practical goal or problem the agent faces (driving a nail). The **user** is the individual inquirer or agent wielding the belief. The **material** stands for external reality or experience upon which the tool operates. Finally, the **test** of the tool's goodness maps to the **truth** of the belief, determined by whether the action succeeds (the nail goes in). This mapping suggests truth is instrumental: a belief is true if it successfully guides action toward a desired end. It implies truth is relational, dependent on the user's goals and the material's resistance. By equating truth with successful operation, the analogy collapses the distinction between "working" and "being true," suggesting validity is solely a function of utility within a specific context. Crucially, it frames the "job" as pre-defined. If the job is satisfying a personal need, James fits. If the job is predicting sensory outcomes, Peirce fits. But the analogy hides *whose* job counts. It simplifies the complex metaphysical commitment of truth into a simple functional success, obscuring whether "success" means personal comfort or accurate representation of an independent reality over the long run. It implies reality is malleable. This framing privileges utility over accuracy.

  Where the analogy breaks

  The analogy breaks down regarding the **user**, **goal**, and **timing**. First, the tool picture implies a **single user**, whereas Peirce insists on a **community of inquirers** extending indefinitely. A hammer works for one person; Peircean truth requires consensus across generations. Second, the **task** in the analogy is usually fixed (drive this nail), but Peirce views inquiry as self-correcting where goals evolve toward understanding reality, not just satisfying immediate desires. James allows fixed personal goals; Peirce does not. Third, the **test** implies immediate success. James accepts "cash-value" now. Peirce demands the **final opinion** at the ideal limit of inquiry, which may contradict current utility. A tool might work now but break later; for Peirce, if it breaks later, it wasn't truly true. Finally, the **material** (reality) in the analogy is passive. For Peirce, reality actively resists incorrect beliefs (Secondness), forcing convergence. The tool analogy suggests we judge the tool; Peirce argues reality judges the tool. These disanalogies reveal that "what works" is ambiguous: works for whom, when, and against what resistance? This ambiguity allows the lecture to conflate distinct metaphysical commitments regarding the nature of success. It cannot capture Peirce's notion that a belief might work for me now but be false because it won't work for you later. It reduces the normative force of truth to mere functional efficiency, missing the realist constraint Peirce places on inquiry that James relaxes.

  Which breaks matter for the argument

  The breaks regarding the **user** (individual vs. community) and **timing** (now vs. final opinion) matter most for the argument that Peirce and James are identical. If the tool analogy holds, "truth" is simply "utility." If utility is individual and immediate, James wins. Claiming Peirce's "final opinion" is just "long-term utility" smooths over the metaphysical gap. However, the **material** break matters most for distinguishing them. Peirce believes reality constrains the tool; James believes the tool helps create the reality (in some cases). If the analogy implies reality is passive material, it favors James's meliorism. If it implies reality is hard steel that breaks bad tools, it favors Peirce's realism. The lecture's claim survives only if "what works" is defined loosely enough to ignore *why* it works. But for Peirce, it works *because* it is true (matches reality). For James, it is true *because* it works. The analogy hides this direction of fit. Therefore, the analogy carries the whole argument; without it, the distinction between "useful therefore true" (James) and "true therefore useful" (Peirce) becomes visible. This directionality is crucial for distinguishing their metaphysical commitments. If we acknowledge the breaks, the lecture's claim fails. Peirce's "final opinion" isn't just "useful later"; it is the only opinion that *cannot* be disproven by reality. James's "useful" can be disproven later but was still "true for me then." The analogy cannot handle temporal inconsistency in truth values. By treating truth as a static property of a tool's performance, it ignores Peirce's fallibilism. Consequently, the argument that they are the same relies entirely on the analogy's vagueness. Once the mapping is audited, the theories diverge sharply on metaphysics.

  Settled vs contested

  **Settled:** Peirce explicitly renamed his doctrine "pragmaticism" to distinguish it from James's "pragmatism," calling the latter "abuse." Peirce was a scholastic realist; James was more nominalist. They disagreed on the definition of truth (convergence vs. satisfaction). **Contested:** Scholars dispute whether Peirce's "final opinion" implies a correspondence theory or a coherentist idealization. Some argue James's "satisfaction" includes long-term empirical verification, narrowing the gap. Others argue Peirce's realism is compatible with James's pluralism if "reality" is viewed differently. There is debate over whether James's "will to believe" applies to scientific inquiry or only moral/religious contexts. While their personal rift is historical fact, interpreting the philosophical compatibility of their metaphysics remains live scholarship. Some claim the divergence is rhetorical; others say it is foundational. Experts dispute if Peirce's convergence guarantees access to things-in-themselves or just ideal consensus. The extent to which James accepts an independent reality constraining belief is also debated. While the biographical split is settled, the systematic philosophical distance varies by interpreter. Current literature continues to analyze the extent of their divergence on the nature of reality.

  Bottom line

  The tool analogy supports the lecture's claim only by obscuring metaphysical differences. It favors James's instrumentalism over Peirce's realism. Once disanalogies regarding community, time, and reality's constraint are acknowledged, the claim that Peirce and James hold the same theory collapses. The analogy imports a fixed goal and single user Peirce rejects. Therefore, the conclusion fails. A better analogy for Peirce is a map corrected by explorers; for James, a key fitting a lock. James cares if navigation gets you where you want now; Peirce cares if the map matches the territory eventually. Distinct metaphysics prevent collapsing them into one tool. Consequently, the lecture's claim is untenable.
