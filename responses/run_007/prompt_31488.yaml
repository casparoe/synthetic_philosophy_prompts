  # Decision Tree: Resolutions of the Two-Envelope Paradox

  **Instructions:** Begin at the **Root**. Answer each question based on your theoretical commitments regarding the standard switching argument ($E = 0.5(X/2) + 0.5(2X) = 1.25X$). Follow the path to a **Leaf** to identify your structural position.

  ---

  ### **Root Node**
  **Q1: Variable Rigidity**
  In the expectation calculation $0.5(X/2) + 0.5(2X)$, does the symbol '$X$' denote the *same* fixed numerical amount in both additive terms (i.e., is it a rigid designator)?
  *   **No** $\rightarrow$ Go to **Leaf 1**.
  *   **Yes** $\rightarrow$ Go to **Node 2**.

  ---

  ### **Node 2**
  **Q2: Prior Propriety**
  Does the reasoning rely on a probability distribution over the possible money amounts that is *improper* (i.e., non-normalizable, such that the total probability sums to infinity rather than 1)?
  *   **Yes** $\rightarrow$ Go to **Leaf 2**.
  *   **No** $\rightarrow$ Go to **Node 3**.
      *(Note: You are assuming a valid, normalizable prior distribution exists.)*

  ---

  ### **Node 3**
  **Q3: Expectation Convergence**
  Given this proper prior, does the expected value of the money in the envelopes (calculated *before* opening an envelope) converge to a **finite** number?
  *   **No** $\rightarrow$ Go to **Leaf 3**.
  *   **Yes** $\rightarrow$ Go to **Node 4**.
      *(Note: You are assuming the game has a finite average payoff.)*

  ---

  ### **Node 4**
  **Q4: Monetary Expected Gain**
  Under these conditions (proper prior, finite mean), is the expected *monetary* gain of switching (conditional on observing $X$) strictly **positive** for all $X$?
  *   **No** $\rightarrow$ Go to **Leaf 4**.
      *(Note: You hold that observing $X$ updates the probability away from 0.5, nullifying the gain.)*
  *   **Yes** $\rightarrow$ Go to **Node 5**.
      *(Note: You hold that the monetary calculation favors switching, even with a proper prior.)*

  ---

  ### **Node 5**
  **Q5: Utility Linearity**
  Is the agent's utility function strictly **linear** with respect to money (i.e., $U(\$x) = x$, implying unbounded marginal utility)?
  *   **No** $\rightarrow$ Go to **Leaf 5**.
  *   **Yes** $\rightarrow$ Go to **Node 6**.

  ---

  ### **Node 6**
  **Q6: Ex-Ante Implication**
  Does your position imply that a rational agent should choose to switch envelopes **before** opening either one?
  *   **Yes** $\rightarrow$ Go to **Leaf 6**.
  *   **No** $\rightarrow$ Go to **Leaf 7**.

  ---

  ### **Leaves (Resolutions)**

  **Leaf 1: The Variable Equivocation Resolution**
  *   **Core Commitment:** The paradox arises from a logical error where '$X$' ambiguously refers to the smaller amount in one term and the larger amount in the other, invalidating the summation.
  *   **Status:** Defended (e.g., McGrew, et al.).

  **Leaf 2: The Improper Prior Resolution**
  *   **Core Commitment:** The paradox relies on an impossible probability setup; no physical or rational agent can hold a uniform prior over an infinite range of values.
  *   **Status:** Defended (e.g., Broome, et al.).

  **Leaf 3: The Infinite Expectation Resolution**
  *   **Core Commitment:** Even with a proper prior, if the expected value is infinite, standard expectation maximization is undefined, blocking the comparison between switching and staying.
  *   **Status:** Defended (e.g., Nalebuff, et al.).
  *   **Indistinguishability Flag:** This position is structurally very close to **Leaf 2**. Both rely on divergence (of probability mass vs. expected value), and in practice, improper priors almost always yield infinite expectations.

  **Leaf 4: The Bayesian Conditionalization Resolution**
  *   **Core Commitment:** With any proper prior and finite mean, observing $X$ provides information that updates the probability of the other envelope being larger to less than $1/2$ (for sufficiently large $X$), making the expected gain zero.
  *   **Status:** Defended (Standard Bayesian view).

  **Leaf 5: The Bounded Utility Resolution**
  *   **Core Commitment:** The monetary expected value may be positive, but rational agents have bounded utility functions (diminishing marginal utility), so the expected *utility* gain from switching is non-positive.
  *   **Status:** Defended (e.g., Arrow, et al.).

  **Leaf 6: The Symmetry Contradiction Resolution**
  *   **Core Commitment:** The switching argument is accepted as mathematically valid locally, but rejected globally because it contradicts the ex-ante symmetry of the envelopes (a *reductio ad absurdum* of the decision norm).
  *   **Status:** Defended (e.g., Decision-theoretic critiques).

  **Leaf 7: The Ex-Post/Ex-Ante Disconnect**
  *   **Core Commitment:** The expected monetary gain is positive for every observed $X$, utility is linear, yet one should not switch ex-ante (denying that local expectations aggregate to a global preference).
  *   **Status:** **EMPTY LEAF.**
  *   **Remark:** This position is logically possible (via non-conglomerability in infinite probability spaces) but is virtually undefended in the literature. It requires accepting that a strategy can be dominant in every state but not overall, which violates standard decision-theoretic norms (like the Principle of Dominance) without offering an alternative normative framework.

  ---

  ### **Pedagogical Notes for the Instructor**

  1.  **Distinguishing Leaf 2 and Leaf 3:** Students often conflate "Improper Prior" and "Infinite Expectation." Use the **Indistinguishability Flag** to prompt discussion: *Can you construct a proper prior with infinite expectation?* (Yes, e.g., a discrete distribution where $P(X=2^n) \propto 1/n^2$). This clarifies the structural difference.
  2.  **The Empty Leaf (Leaf 7):** This is a valuable teaching tool. It forces students to articulate *why* they reject this position. Usually, they must appeal to the principle that "if you switch for every $X$, you should switch ex-ante," which leads them back to **Leaf 6** (Symmetry) or forces them to backtrack to **Leaf 4** (Conditionalization).
  3.  **Variable Equivocation (Leaf 1):** This is often the first intuition students have. The tree validates this but forces those who reject it (by answering "Yes" at Q1) to confront the more complex probabilistic commitments downstream.
