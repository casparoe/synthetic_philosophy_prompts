prompt: |-
  I sit on the board of a conservation trust that manages a large fenced reserve. We've got a proposal in front of us from one of our own field biologists, who wants funding for a two-year pilot to treat sarcoptic mange in the reserve's fox population using medicated bait stations. The mange is spreading and the foxes that get it die slowly over a few weeks. The technical side looks solid: the bait is target-specific, the dosing is worked out, and she's budgeted for monitoring.

  The problem is our trust's mission statement commits us to preserving native ecosystems and biodiversity, and says nothing about animal welfare. Treating the foxes would probably cut off a slow and nasty source of mortality, but it would also leave fox numbers higher than they'd otherwise be, and nobody's modelled what that does to the small mammals and ground-nesting birds on the reserve. Some board members think the proposal is just a category error — our job is ecological integrity, not running a field hospital for wild animals. Others have started using the phrase 'wild animal suffering' as if its an obvious part of our remit, and they point out that we already intervene plenty (we cull invasives, we repair erosion), so the 'hands off nature' line isn't one we actually hold.

  I need a short written opinion to circulate before Thursday's meeting. It should recommend a concrete course of action with a time frame — approve, reject, or approve with conditions — and it should engage the strongest consideration on the losing side rather than just restating the mission statement. I'd also like you to be straight with us about what we'd be commiting ourselves to if we approve: is there a principled stopping point between treating mange and, say, predator control or supplementary feeding during a hard winter?
reasoning: |-
  Here's a thinking process that leads to the suggested opinion piece:

  1.  **Analyze the Request:**
      *   **Context:** Board member of a conservation trust managing a large fenced reserve.
      *   **Proposal:** Fund a 2-year pilot to treat sarcoptic mange in foxes using medicated bait.
      *   **Conflict:** Mission statement focuses on "native ecosystems and biodiversity" (ecological integrity), not "animal welfare."
      *   **Arguments For:** Reduces suffering (wild animal suffering), technical feasibility is solid, trust already intervenes (culling invasives, erosion repair).
      *   **Arguments Against:** Category error (ecology vs. veterinary care), potential ecological impact (higher fox numbers $\rightarrow$ higher predation on native prey), slippery slope (where does intervention stop?).
      *   **Deliverable:** A short written opinion to circulate before Thursday's meeting.
      *   **Requirements:**
          *   Recommend a concrete course of action (Approve/Reject/Conditional) with a timeframe.
          *   Engage the strongest consideration on the *losing* side (steelman the opposition).
          *   Be straight about long-term commitments/slippage (principled stopping point).
          *   Tone: Professional, thoughtful, decisive, suitable for a board context.

  2.  **Determine the Stance:**
      *   *Option A: Reject.* Safe regarding mission, but ignores the "we already intervene" argument and the suffering aspect. Might feel callous.
      *   *Option B: Approve.* Bold, addresses suffering, but risks ecological backlash and sets a precedent that might be hard to manage.
      *   *Option C: Approve with Conditions.* This seems the most balanced and responsible governance approach. It allows data collection (pilot) while safeguarding the core mission (ecological integrity) and addressing the slippery slope concern.
      *   *Decision:* **Approve with Conditions.** This acknowledges the pilot nature of the request, allows for ecological monitoring, and sets a precedent for *how* welfare interventions are evaluated against ecological goals.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the recommendation clearly. (Approve the pilot, but with specific ecological safeguards).
      *   **Addressing the Mission/Conflict:** Acknowledge the tension between "ecosystem integrity" and "animal welfare." Don't just quote the mission; interpret it.
      *   **Steelmanning the Opposition (The "Losing" Side):** If I recommend approval, the "losing" side is the "Category Error/Ecological Integrity" side. I need to show I understand their fear: that we become a zoo/vet clinic and lose sight of the ecosystem.
          *   *Key point:* Higher fox survival *could* mean higher predation on the very biodiversity we are sworn to protect.
      *   **Addressing the "Slippery Slope" (Commitment):** The prompt asks to be straight about what we are committing to. If we treat mange, do we feed them in winter? Do we cull less?
          *   *Key distinction:* Distinguish between *restoring natural function* vs. *micromanaging individual lives*. Mange in a fenced reserve might be considered an artifact of confinement (high density) rather than a natural regulator. This provides a principled stopping point.
      *   **The Conditions:** What makes this safe?
          *   Ecological monitoring (prey populations).
          *   Sunset clause (2 years only, then review).
          *   Thresholds (if prey drops, stop treatment).
      *   **Conclusion:** Reiterate the value of the decision as a governance precedent.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Approve" too risky?
      *   *Correction:* Emphasize the *Pilot* aspect. We aren't adopting a policy; we are funding research that has a management component.
      *   *Critique:* Did I address the "wild animal suffering" argument?
      *   *Correction:* Yes, acknowledge it as valid but secondary to the ecological mandate.
      *   *Critique:* Did I address the "we already intervene" argument?
      *   *Correction:* Yes, distinguish between intervention for *ecosystem function* (culling invasives) vs. *welfare*. The bridge is that high-density disease in a fenced reserve might be an artifact of the fence, not nature.
      *   *Tone Check:* Needs to be board-appropriate. Not too academic, not too emotional.

  5.  **Final Polish:**
      *   Ensure the "principled stopping point" is clear. (The line is drawn at *ecosystem function* vs. *individual welfare*, but acknowledging that in a fenced reserve, disease dynamics are artificial).
      *   Make sure the recommendation is actionable.

  6.  **Final Review against constraints:**
      *   Short written opinion? Yes.
      *   Concrete course of action + timeframe? Yes (Approve 2-year pilot with conditions).
      *   Engage strongest consideration on losing side? Yes (Ecological risk/Category error).
      *   Straight about commitments/slippage? Yes (The "Zoo" vs. "Reserve" distinction).

  *(Self-Correction on the "Losing Side"):* If I recommend approval, the "losing side" is the rejectionists. Their strongest point is the ecological risk to prey species. I must ensure that is central to the conditions.

  *(Refining the "Principled Stopping Point"):* I need to be careful not to commit the trust to treating all suffering. The distinction is that sarcoptic mange in a *fenced* reserve is likely density-dependent and exacerbated by the artificial boundary, making it an artifact of management, not wild nature. This is the logical hook to prevent the slippery slope to winter feeding.

  7.  **Final Drafting:** (Proceed to generate output based on these thoughts.)
answer: |-
  **TO:** Board of Trustees, [Reserve Name] Conservation Trust
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation Regarding Fox Mange Treatment Proposal

  **Recommendation**
  I recommend we **approve the two-year pilot proposal, subject to strict ecological monitoring conditions and a hard sunset clause.** We should authorize funding for the bait stations and the biologist's time, but tie continued funding to quarterly reviews of prey-species stability.

  **The Core Tension**
  The objection that this proposal is a "category error" is the strongest argument against it. Our mandate is ecological integrity, not the mitigation of individual suffering. If we treat this reserve as a field hospital, we risk drifting toward a zoo model where we manage individual lifespans rather than ecosystem processes. The rejectionists are right to worry: higher fox survival rates *will* increase predation pressure. If we save foxes only to watch ground-nesting bird populations collapse, we have failed our primary mission.

  However, the "hands-off" defense is inconsistent with our current operations. We already intervene aggressively to cull invasives and repair erosion. We accept that a *fenced* reserve is not a self-regulating wilderness; it is a managed artifact. In a confined population, sarcoptic mange is often a density-dependent pathology exacerbated by the fence line, not a natural population regulator. Treating it can be framed as correcting a management artifact rather than indulging in welfare sentimentality.

  **The Commitment and the Stopping Point**
  If we approve this, we must be clear about what we are committing to. We are not establishing a precedent that the Trust must alleviate all wild animal suffering. We are establishing a precedent that we will manage *pathologies arising from confinement.*

  There is a principled stopping point between treating mange and supplementary winter feeding or broad predator control:
  1.  **Artificial vs. Natural Stressors:** We intervene when the mortality source is exacerbated by the reserve's fenced status (e.g., disease spread due to inability to disperse). We do not intervene when the stressor is inherent to the climate or natural seasonal cycles (e.g., winter starvation).
  2.  **Ecosystem Function vs. Individual Welfare:** We intervene only when the treatment supports the restoration of functional predator-prey dynamics, not when it simply extends individual life at the expense of prey viability.

  **Conditions for Approval**
  To safeguard against the ecological risks and the slippery slope, approval must be contingent on:
  1.  **Prey Thresholds:** Immediate suspension of treatment if monitoring shows a >10% decline in key ground-nesting bird or small mammal populations relative to baseline.
  2.  **Sunset Clause:** Funding ends automatically after 24 months. A new proposal would be required to continue, forcing a full board review of the ecological data.
  3.  **Mission Alignment:** The final report must explicitly evaluate the intervention against biodiversity metrics, not just fox health metrics.

  This approach allows us to address the welfare concern without abandoning our ecological mandate. It treats the proposal as the management experiment it is, rather than a new moral doctrine.

  **Action Required**
  I move we vote to approve the pilot under these conditions at Thursday's meeting.
