prompt: |-
  In my physics class, after we worked through the double-slit experiment, my teacher said that Bell's theorem proves quantum mechanics is nonlocal, and that this is the end of the road for hidden variable theories. But a classmate showed me a passage saying that Bell's theorem rules out local hidden variable theories — not locality itself — and that calling quantum mechanics 'nonlocal' is misleading because entanglement cannot be used to send signals faster than light. I can't tell whether these are different claims or just different ways of saying the same thing. Could you lay out the distinct precise claims that the sentence 'Bell's theorem proves quantum mechanics is nonlocal' could be making — what 'local' and 'nonlocal' would have to mean on each reading, what the theorem actually rules out, where 'realism' enters the picture, which readings are trivial or well-established, which are contested or false, and which reading would actually be needed to close the book on hidden variable theories?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Physics class discussion on the double-slit experiment leading to Bell's theorem.
