answer: |-
  The conflict between your teacher and your classmate stems from the fact that "locality" and "realism" are used differently in technical physics versus philosophical interpretation. Bell’s Theorem does not prove a single, simple fact; it proves that a specific set of assumptions is mathematically incompatible with experimental results.

  Here are the distinct precise claims that the sentence "Bell’s theorem proves quantum mechanics is nonlocal" could be making, categorized by their definitions and validity.

  ### 1. The Ontological Claim (The "Teacher's" Reading)
  This reading assumes that particles have definite properties before they are measured.
  *   **Definition of Local:** No physical influence can travel faster than light.
  *   **Definition of Nonlocal:** There is an instantaneous causal influence between entangled particles.
  *   **Where Realism Enters:** This reading assumes **Realism** (hidden variables) is true.
  *   **The Logic:** If particles have definite states (Realism), and Bell’s inequalities are violated, the only way to explain the correlation is if a signal travels instantly between them.
  *   **Status:** **Well-established but conditional.** It is true *if* you insist on a Realist interpretation (like Bohmian Mechanics).
  *   **Hidden Variables:** This reading proves that **Local Hidden Variable** theories are impossible. However, it leaves the door open for **Nonlocal Hidden Variable** theories.

  ### 2. The Operational Claim (The "Classmate's" Reading)
  This reading focuses on what an observer can actually do or measure.
  *   **Definition of Local:** No information or signal can be transmitted faster than light (No-Signaling).
  *   **Definition of Nonlocal:** The ability to send a message faster than light.
  *   **Where Realism Enters:** This reading is agnostic about realism; it focuses on observable outcomes.
  *   **The Logic:** Quantum Mechanics satisfies the "No-Signaling Theorem." Even though particles are entangled, you cannot manipulate one to send a message to the other.
  *   **Status:** **True.** Calling QM "nonlocal" in this sense is false and misleading because it implies faster-than-light communication, which is impossible.
  *   **Hidden Variables:** This reading does not necessarily rule out hidden variables, but it emphasizes that any hidden variable theory must be "non-signaling."

  ### 3. The Formal Claim (The "Standard" Reading)
  This is the most rigorous mathematical statement of the theorem.
  *   **Definition of Local Realism:** The combination of **Parameter Independence** (settings at A don't affect outcomes at B) and **Outcome Independence** (results at A are independent of results at B).
  *   **The Logic:** Bell’s Theorem proves that **Local Realism** is false. You must abandon at least one of the two pillars.
  *   **Status:** **Mathematically Proven.**
  *   **Hidden Variables:** This closes the book on **Local** hidden variables. It does not close the book on all hidden variables, only those that are also local.

  ### Summary Table

  | Reading | Meaning of "Nonlocal" | Role of Realism | Status |
  | :--- | :--- | :--- | :--- |
  | **Ontological** | Instantaneous causal influence. | **Assumed True.** | True (if Realism is kept). |
  | **Operational** | Faster-than-light signaling. | Irrelevant. | **False** (QM is "local" here). |
  | **Formal** | Violation of Local Realism. | **Part of the target.** | **Proven Fact.** |

  ### Conclusion: Who is Right?
  *   **Your Teacher** is using the **Ontological** definition. They are correct that if you want to keep the idea that particles have definite properties (Realism), you must accept that the universe is nonlocal.
  *   **Your Classmate** is using the **Operational** definition. They are correct that "nonlocal" is a dangerous term because it suggests faster-than-light communication, which Bell’s theorem does not allow.

  **The Verdict on Hidden Variables:**
  Bell’s theorem only closes the book on **Local Hidden Variable** theories. It does not rule out **Nonlocal Hidden Variable** theories (such as the De Broglie–Bohm pilot wave theory). If your teacher claimed it ruled out *all* hidden variable theories, they were speaking imprecisely; it only rules out the *local* ones.
