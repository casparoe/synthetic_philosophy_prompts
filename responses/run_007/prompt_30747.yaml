      *   *What is Bell's Theorem?* It's a mathematical inequality derived from specific assumptions. If the inequality is violated (which experiments show it is), at least one assumption must be false.
      *   *The Assumptions:*
          1.  **Locality (Parameter Independence):** The setting of a measurement device at A doesn't instantly affect the outcome at B.
          2.  **Realism (Outcome Independence/Hidden Variables):** Particles have definite properties prior to measurement. (Often grouped as "Local Realism").
          3.  **Statistical Independence (Freedom of Choice):** The choice of measurement settings is independent of the hidden variables.
      *   *The Result:* QM violates Bell inequalities. Therefore, Local Realism is false.

  3.  **Analyze the "Nonlocality" Confusion:**
      *   *Teacher's View:* "Nonlocal" usually means "Action at a distance" or "Influence." If Local Realism is dead, and we want to keep Realism (Hidden Variables), we *must* drop Locality. Hence, Bohmian mechanics is nonlocal.
      *   *Classmate's View:* "Nonlocal" implies signaling. QM obeys the No-Signaling Theorem. Therefore, calling it "nonlocal" suggests FTL communication, which is false. Also, one can drop Realism (Copenhagen) and keep Locality (in the sense of no FTL influence).

