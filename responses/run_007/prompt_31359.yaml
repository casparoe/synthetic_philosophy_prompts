prompt: |-
  ive been trying to get clear on what would actually count as solving the frame problem, and i keep finding papers that gesture at it but dont say what the target is. before i read any more, write me the desiderata: what a candidate solution has to deliver to be a real solution and not a workaround, a change of subject, or an engineering hack. give me the requirements list, and for each one the case or failure mode that makes it a requirement. at minimum cover: the narrow problem of updating a world model after an action (the robot paints the living room and shouldnt have to re-derive that the number of windows is unchanged, nor be told in advance that painting doesnt affect window counts) versus the wide problem of how an agent figures out whats relevant in the first place; the yale shooting problem, where a formalism has to project that a loaded gun stays loaded through a wait and that the victim dies after the shot, rather than quietly concluding the gun unloaded itself; ramifications (flipping the switch turns on the light and wakes the cat) and qualifications (the match lights only if it's dry and struck and so on) and why those are separate problems a solution might or might not take on; the requirement that a solution not just re-express the frame axioms in a more compact notation and declare victory (say, successor-state axioms) unless it also explains where the compact summary comes from; and whether computational tractability is a real requirement or just a preference. for each one, say whether it's non-negotiable or a camp preference (logic-based AI, situated robotics, philosophy of mind). then flag any pair of desiderata that looks like it cant be jointly satisfied, and say which single requirement does the most to eliminate the standard off-the-shelf candidates. keep the scorecard short — the criteria are the part i actually want.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Solving the Frame Problem in AI/Philosophy of Mind.
      *   **Goal:** Define the *desiderata* (requirements) for a *real* solution, distinguishing it from workarounds, changes of subject, or hacks.
      *   **Specific Content Requirements:**
          *   Narrow problem (updating world model without explicit frame axioms).
          *   Wide problem (relevance determination).
          *   Yale Shooting Problem (persistence of state/causality).
          *   Ramifications (side effects) vs. Qualifications (preconditions).
          *   Notation vs. Explanation (successor-state axioms issue).
          *   Computational Tractability (requirement vs. preference).
          *   Classification: Non-negotiable vs. Camp Preference (Logic, Robotics, Philosophy).
          *   Conflicts: Flag incompatible desiderata.
          *   Killer Criterion: Identify the single requirement that eliminates most off-the-shelf candidates.
      *   **Constraint:** Keep the scorecard short; focus on the criteria.

  2.  **Deconstruct the Frame Problem:**
      *   *Origin:* McCarthy & Hayes (1969). Originally about logical representation of change.
      *   *Evolution:* Expanded by Dennett, Fodor, etc., to include relevance and cognition.
      *   *Core Tension:* How to represent what *doesn't* change without explicitly listing it, and how to know what *does* matter without checking everything.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: The Narrow Logical Problem.*
          *   *Requirement:* Represent change without $N^2$ frame axioms.
          *   *Failure Mode:* Having to state "painting doesn't move the windows" for every object/action pair.
          *   *Status:* Non-negotiable (origin of the term).

      *   *Item 2: The Wide Relevance Problem.*
          *   *Requirement:* Determine relevance without exhaustive search.
          *   *Failure Mode:* The "robot pushing a cart" scenario (Dennett) where the robot deduces the wall color doesn't change but misses the bomb on the cart.
          *   *Status:* Camp Preference (Philosophy/Cognitive Science care most; pure logic often sidesteps).

      *   *Item 3: Temporal Projection (Yale Shooting).*
          *   *Requirement:* Correctly project persistence and change in causal chains.
          *   *Failure Mode:* Minimizing change so much that the gun unloads itself to avoid the "change" of the victim dying (Hanks & McDermott).
          *   *Status:* Non-negotiable for formalisms claiming to handle action.

      *   *Item 4: Ramifications & Qualifications.*
          *   *Requirement:* Handle indirect effects (ramifications) and hidden preconditions (qualifications) without explicit enumeration.
          *   *Failure Mode:* Flipping switch lights bulb, but failing to infer it wakes the cat (ramification). Or match lights, ignoring humidity (qualification).
          *   *Distinction:* Ramifications are often treated as separate (Doctrine of Causal Minimality), Qualifications are often infinite.
          *   *Status:* Non-negotiable for robustness, but often treated as separate problems in literature. I need to clarify if a *Frame* solution must solve these. Usually, a complete theory of action needs them, but the Frame Problem specifically targets persistence. I will list them as distinct but necessary for a *complete* theory of action, noting the separation.

      *   *Item 5: Explanatory Depth (Not just Notation).*
          *   *Requirement:* Explain *why* the compact representation works (semantic grounding), not just syntactic compression.
          *   *Failure Mode:* Successor State Axioms (Reiter) solve the logical combinatorics but assume the engineer already knew what changes. It's a representation trick, not a cognitive solution.
          *   *Status:* Non-negotiable for Philosophy/Cognitive Science; Camp Preference for Engineering (if it works, it works).

      *   *Item 6: Computational Tractability.*
          *   *Requirement:* Must run in reasonable time/resources.
          *   *Failure Mode:* A logically sound solution that takes $O(2^N)$ time to decide the next step.
          *   *Status:* Camp Preference. Logicians say "soundness first," Roboticists say "real-time or bust." However, for a *cognitive* solution, intractability implies it's not how minds work. I'll mark it as Non-negotiable for a *cognitive* solution, Preference for *formal* solution. Let's refine: For a "real solution" to the *philosophical* frame problem, tractability is key (Fodor's argument). For the *logical* frame problem, it's secondary. I will classify it carefully.

  4.  **Identifying Conflicts:**
      *   *Expressivity vs. Tractability:* The more you allow (ramifications, qualifications), the harder it is to compute.
      *   *Wide Problem vs. Formalism:* The Wide Problem (relevance) seems to require semantic understanding, which formal logic struggles to capture without circularity.
      *   *Killer Criterion:* The "Wide Problem" (Relevance) is usually the graveyard of solutions. Most logical solutions solve the Narrow problem but fail the Wide one.

  5.  **Refining the Output Structure:**
      *   Introduction: Brief context.
      *   The Scorecard (The Desiderata): Structured as requested (Requirement, Failure Mode, Status).
      *   Conflict Analysis: Incompatible pairs.
      *   The Killer Criterion.

  6.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction on Qualifications:* The Qualification Problem is technically distinct from the Frame Problem (McCarthy). I need to make sure the user knows a Frame Solution *can* exist without solving Qualifications, but a complete Theory of Action needs both. I will list it as a boundary condition.
      *   *Correction on Successor State Axioms:* Reiter's solution is widely accepted as solving the *logical* frame problem. I need to be fair: it *is* a solution to the 1969 definition. The user is asking about the *expanded* definition (Dennett/Fodor). I must distinguish these.
      *   *Refining Tractability:* Is it non-negotiable? If a solution is logically perfect but takes a million years, did it solve the problem of *intelligence*? No. Did it solve the problem of *representation*? Yes. I will label this clearly as the split between Engineering/Robotics (Non-negotiable) and Pure Logic (Preference).

  7.  **Final Polish:**
      *   Ensure tone is analytical and precise.
      *   Check all constraints from the prompt are met.
      *   Make sure the "Killer Criterion" is punchy.

  8.  **Final Review against constraints:**
      *   Narrow vs Wide covered? Yes.
      *   Yale Shooting covered? Yes.
      *   Ramifications/Qualifications covered? Yes.
      *   Notation vs Explanation covered? Yes.
      *   Tractability covered? Yes.
      *   Status (Non-negotiable/Preference) included? Yes.
      *   Conflicts flagged? Yes.
      *   Killer Criterion identified? Yes.
      *   Short scorecard? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### The Frame Problem Solution Scorecard

  To count as a **solution** rather than a dissolution or a workaround, a candidate must satisfy the following desiderata. Statuses are divided between **Non-Negotiable** (fails the core definition) and **Camp Preference** (acceptable to some schools of thought, fatal to others).

  | # | Desideratum | The Requirement | Failure Mode | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Narrow Persistence** | Represent change without enumerating non-changes. The system must infer that unmentioned fluents remain constant without $N \times M$ frame axioms (where $N$=actions, $M$=facts). | **Combinatorial Explosion:** The system requires explicit axioms stating "painting the wall does not move the windows," "does not change the time," etc., for every object. | **Non-Negotiable** (All camps) |
  | **2** | **Temporal Projection** | Correctly project state over time in causal chains. Must distinguish between *persistence* (gun stays loaded) and *change* (victim dies) without favoring minimal change to the point of absurdity. | **Yale Shooting Failure:** The system minimizes change by concluding the gun spontaneously unloaded during the "wait" phase to avoid the larger change of the victim dying. | **Non-Negotiable** (Logic/Philosophy) |
  | **3** | **Relevance Selection (Wide)** | Determine *which* facts are relevant to an action without exhaustive search. The system must ignore irrelevant data (wall color) and attend to critical data (bomb on cart) pre-computationally. | **Fodor's Trap:** The system checks all known facts against all possible consequences to find relevance, rendering cognition impossible (isotropic inference). | **Camp Preference** (Fatal to Philosophy/Robotics; optional for Pure Logic) |
  | **4** | **Ramifications & Qualifications** | **Ramifications:** Infer indirect effects (switch $\to$ light $\to$ cat wakes). <br> **Qualifications:** Acknowledge hidden preconditions (match lights *unless* wet). | **Side-Effect Blindness:** Flipping the switch turns on the light but fails to update the cat's state. <br> **Qualification Blindness:** Assumes the match lights despite humidity. | **Camp Preference** (Often treated as separate problems; required for a *complete* Theory of Action) |
  | **5** | **Explanatory Grounding** | Explain *how* the system knows what changes, not just compress the axioms. A solution cannot rely on a human engineer pre-selecting the relevant effects to build the compact notation. | **Successor-State Hack:** Using Reiter's Successor State Axioms to solve the logic, but requiring a human to manually specify which fluents are affected by which actions beforehand. | **Non-Negotiable** (Philosophy/Cognitive Science); **Preference** (Engineering) |
  | **6** | **Computational Tractability** | The inference mechanism must operate within polynomial time (or real-time bounds for robotics). A logically sound solution that requires exponential time to project the next step is not a solution for an agent. | **Theoretical Only:** The logic holds, but the agent starves to death while calculating whether the cup is still on the table. | **Camp Preference** (Non-negotiable for Robotics/AI; optional for Formal Logic) |

  ***

  ### Incompatible Desiderata (The Trade-offs)

  1.  **Expressivity (4) vs. Tractability (6):**
      *   **Conflict:** Allowing unrestricted ramification chains (causal closure) and infinite qualifications generally renders the projection problem undecidable or intractable.
      *   **Resolution:** Most formal solutions restrict the language (e.g., no disjunctive effects) to preserve tractability. A "real" solution must define the boundary where expressivity is sacrificed for speed.

  2.  **Relevance Selection (3) vs. Explanatory Grounding (5):**
      *   **Conflict:** To solve the Wide Problem (3), the system needs semantic understanding of the world to know what matters. To satisfy Grounding (5), you cannot simply hard-code relevance. But if you don't hard-code it, how does the system acquire the semantic understanding without already solving the Frame Problem?
      *   **Resolution:** This is the circularity that plagues cognitive science. Solutions usually pick one: either they assume a structured ontology (solving 5, failing 3) or they use statistical heuristics (solving 3 pragmatically, failing 5 theoretically).

  ***

  ### The Killer Criterion

  **Desideratum #3 (Relevance Selection / The Wide Problem)** is the single requirement that eliminates the standard off-the-shelf candidates.

  *   **Why:** Logical formalisms (Situation Calculus with Successor State Axioms, Event Calculus, Fluent Calculus) successfully solve the **Narrow Problem (#1)** and the **Yale Shooting Problem (#2)**. They are mathematically sound and widely accepted in knowledge representation.
  *   **The Elimination:** However, they all rely on a human engineer to define the causal relationships *ex ante*. They do not explain how an agent *discovers* relevance in a novel environment. Consequently, while they solve the *logical* frame problem, they fail the *philosophical* and *cognitive* frame problem (Fodor/Dennett). If your target is general intelligence rather than verified software, #3 is the bottleneck that renders #1, #2, and #5 insufficient.
