  The first must die to pass the code along,
  A slow edit written in the blood.
  The next learns pain where instinct once was strong,
  And seeks reward where past attempts had stood.
  Both stumble blind against the real world's face,
  One through the bloodline, one through nervous spark.
  Both require contact to find their own place,
  And pay for every error in the dark.

  But now the world is modeled in the host,
  Where tools of thought are forged without a hand.
  Where hypotheses die at little cost,
  And culture spreads across the common land.
  We stand on towers built by others' pain,
  And ask if silicon will break the chain.
