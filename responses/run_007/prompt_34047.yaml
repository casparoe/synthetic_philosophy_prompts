answer: |-
  The practice of holding referendums and characterizing their outcomes as "the will of the people" rests upon a dense, often unarticulated layer of political ontology. To reconstruct this implicit theory charitably, we must distinguish between the *metaphysical commitments* suggested by the rhetoric, the *functional commitments* required by the mechanism, and the *normative commitments* implied by the selective application of the tool.

  Here is a reconstruction of the implicit theory, an analysis of its philosophical underdetermination, and a projection of what would change under a deflationary view.

  ### I. The Implicit Theory: Popular Sovereignty as Group Agency

  The rhetoric of "the will of the people" presupposes a specific view of collective intentionality. It does not merely treat "the people" as a collection of atoms (an aggregate), but as a *collective subject* capable of forming a singular intention.

  **1. Ontology: The People as a Latent Group Agent**
  The practice presupposes that "the people" constitutes a group agent in something stronger than a metaphorical sense, but weaker than a biological organism. It assumes a *latent unity*. Prior to the vote, the will is not necessarily fully formed in every individual, but the *capacity* for a collective will exists within the polity. The referendum is not just a counting mechanism; it is a *constitutive ritual* that transforms a multitude into a unified agent.
  *   **Presupposition:** There is a distinction between "public opinion" (fluid, contradictory, aggregate) and "the will of the people" (singular, authoritative, decisive). The vote is the alchemical process that turns the former into the latter.

  **2. Epistemology: Surfacing vs. Constructing**
  The standard rhetoric presupposes a *realist epistemology* of preferences. It assumes the referendum question *surfaces* a pre-existing judgment rather than *constructing* one.
  *   **The Assumption:** If the question were framed differently, it might capture the will *inaccurately*, but the "true will" exists independently of the framing. This ignores the insights of social choice theory (e.g., Arrow's Impossibility Theorem), which suggests that the "will" is often an artifact of the aggregation method and question wording. The practice acts *as if* preferences are fixed and exogenous to the political process, waiting to be discovered.

  **3. The Status of the Majority: Authorization, not Identity**
  You note the tension where the 52% are the "will of the people," yet the 48% remain part of "the people." The implicit theory resolves this through a concept of *political authorization* rather than *ontological identity*.
  *   **The Mechanism:** The majority vote does not prove that 100% of the people hold the view. Rather, it establishes that the majority is *authorized to decide on behalf of the whole*. This relies on a prior commitment to the rule of recognition: we agree beforehand that 50% + 1 counts as the decision of the collective body.
  *   **The Fiction:** The phrase "will of the people" is a necessary fiction. It treats the decision of the majority *as if* it were the decision of the singular group agent to ensure compliance and legitimacy. The 48% are not excluded from the people; they are bound by the agency of the whole, of which they are a part, even if they dissent from the specific volition.

  **4. Selectivity: Constituent vs. Constituted Power**
  The selective use of referendums (constitutional questions vs. tax policy) presupposes a distinction between *constituent power* (the power to create the political order) and *constituted power* (the power to operate within it).
  *   **The Theory:** "The people" are sovereign only regarding the fundamental rules of the game (independence, charters, moral foundations). Day-to-day governance (taxes, regulation) is delegated to representatives.
  *   **Consistency:** This is consistent with a Republican or Constitutional Democratic view, where the "will of the people" is too precious and dangerous to be expended on mundane administration. However, it creates a tension: if the people are the ultimate sovereign, why are they incompetent to judge tax policy? The implicit answer is usually *epistemic*: complex causal chains (economics, environment) require expertise, whereas value judgments (marriage, borders) do not.

  ### II. Strict Presuppositions vs. Philosophical Underdetermination

  It is crucial to distinguish what the practice *requires* to function from what is merely compatible with it.

  **1. Strict Presuppositions (What is necessary)**
  *   **The Binding Norm:** The practice strictly presupposes that the outcome creates a binding obligation for the minority. Without this, it is a straw poll, not a referendum.
  *   **Binary Competence:** It presupposes that the specific question asked is capable of being answered binary (Yes/No) without rendering the outcome incoherent.
  *   **Equality of Input:** It presupposes that each voter's input counts equally toward the aggregation (one person, one vote).

  **2. Philosophical Underdetermination (Where multiple theories fit)**
  The practice is remarkably underdetermined regarding the *nature* of the will. Several conflicting philosophical theories can license the exact same institutional practice:
  *   **Rousseauian General Will:** The vote reveals a common good that transcends individual private interests. (Compatible with the rhetoric, but rarely the reality).
  *   **Aggregative Utilitarianism:** The vote simply sums up individual preferences to maximize satisfaction. (Compatible with the mechanism, but struggles to justify the "will of the *people*" singular rhetoric).
  *   **Deliberative Democracy:** The vote is the endpoint of a reasoning process; the "will" is the rational conclusion of public debate. (Compatible if we assume the referendum was preceded by adequate deliberation).
  *   **Schumpeterian Elitism:** The vote is merely a method for selecting leaders or legitimizing decisions made by elites. (Compatible with the practice if we view the "will of the people" as purely rhetorical cover).

  **3. The Framing Problem**
  Does the practice presuppose that wording merely surfaces a will? *Functionally, yes.* If politicians admitted that wording constructs the will, the legitimacy of the result would crumble. However, *philosophically*, the practice is compatible with constructivism. One could argue, "We know the question shapes the will, but we accept this specific framing as the legitimate trigger for decision." The practice does not logically rule out the view that the will is created in the voting booth, but the *rhetoric* of legitimacy relies on the view that it was discovered there.

  ### III. The Deflationary Shift: Referendums as Procedure

  If we replaced the current presupposed view (Referendum = Expression of Collective Subject's Will) with a deflationary one (Referendum = One Decision Procedure Among Others), significant changes would be required in practice, institutions, and rhetoric.

  **1. Rhetorical Changes**
  *   **From "Will" to "Decision":** Politicians would cease speaking of "the will of the people" and instead speak of "the majority decision" or "the outcome of the vote."
  *   **Acknowledgment of Construction:** Public discourse would acknowledge that the result is sensitive to framing. A 52–48 result would be described not as a narrow escape or a divine mandate, but as a statistical outcome contingent on the specific question asked.
  *   **Reintegration of the Minority:** The 48% would not be described as "overruled members of the body," but as "dissenters whose preferences were not selected by the aggregation rule." This lowers the stakes; it is a loss in a game, not a suppression of one's existence within the sovereign.

  **2. Institutional Changes**
  *   **Reversibility:** If a referendum is merely a decision procedure and not the sacred utterance of the sovereign, it should be easier to overturn. Currently, referendums are often treated as "once and for all" (e.g., Brexit). A deflationary view would institutionalize sunset clauses or mandatory re-votes after a set period, treating the outcome as a policy choice rather than a constitutional destiny.
  *   **Supermajority Requirements:** If the goal is not to find a mystical "will" but to ensure stable governance, the threshold for passing major changes might be raised to 60% or 66%, acknowledging that a bare majority is insufficient to bind a deeply divided polity when no "General Will" is assumed.
  *   **Question Independence:** Institutions might be created to draft questions (independent electoral commissions) with the explicit admission that they are *designing choices*, not just transcribing them.

  **3. Changes in Public Reasoning**
  *   **Legitimacy Source:** Legitimacy would shift from the *outcome* (the Will) to the *process* (the Fairness). A vote would be legitimate not because it revealed the truth of the people's desire, but because the rules were followed, information was accurate, and the count was honest.
  *   **Scope Expansion:** Paradoxically, a deflationary view might allow *more* referendums. If voting is just a tool for policy selection (like a legislative vote) rather than a sacred act of sovereignty, there is less reason to restrict it to "constitutional" questions. We could hold referendums on tax policy or zoning, provided we accept them as reversible administrative decisions.
  *   **Reduced Polarization:** The stakes of the vote decrease. If the vote does not define "who we are" (the Will of the People), but only "what we will do for now," the existential threat felt by the losing side diminishes.

  ### Summary

  The current practice of referendums presupposes a **Romantic-Republican ontology**: it treats the people as a latent singular agent whose will is discovered through binary choice and authorized by majority rule, specifically for high-stakes constitutional questions.

  However, this is philosophically underdetermined. The mechanism works equally well under an **Aggregative-Procedural ontology**, where the "will" is just a shorthand for "the result of the counting rule."

  Adopting the deflationary, procedural view would require us to desacralize the outcome. We would trade the powerful, unifying (but often divisive) myth of the "Will of the People" for a more modest, technocratic, but potentially more stable understanding of democracy: a system of binding decision procedures where the majority rules, but never claims to speak for the whole.
