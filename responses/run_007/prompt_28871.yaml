prompt: |-
  Draft the joint statement that a philosopher who holds that human minds possess original or intrinsic intentionality (the Searlean camp) and a philosopher who holds that all intentionality is derived and that the intentional stance is the most fundamental level of analysis (the Dennettian camp) could both sign after a good-faith adversarial collaboration. The document should include: (1) a numbered list of claims both sides accept — about the predictive utility of intentional idioms, about the causal processes underlying human cognition and artifact behavior, about what each side is not claiming, and about what a resolution of the dispute would require; (2) a disagreements table with columns for the point at issue (stated neutrally), the Searlean formulation, the Dennettian formulation, and what each side agrees would count as evidence against their own view on that point. Address explicitly whether the phrase "original intentionality" marks a real metaphysical difference or whether, as Dennett has suggested, it is a distinction without a difference that relies on an unexplained primitive. Write the answer in American English.
