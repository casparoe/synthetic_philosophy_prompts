answer: |-
  You have diagnosed the stagnation of the Pascal's Mugging (PM) debate with impressive accuracy. Your hypothesis—that the deadlock is meta-normative rather than object-level—is largely correct, but I would argue there is a layer underneath that meta-normative layer that explains *why* the camps are so entrenched.

  The disagreement is indeed about what decision theory (DT) is *for*, but it is also about **which axiomatic commitments are non-negotiable.**

  Here is a breakdown of why your hypothesis holds, where the deeper disagreement lies, and whether there is any path to progress.

  ### 1. Validating Your Hypothesis: The Three Teleologies
  You identified three camps regarding the purpose of DT. This maps well onto the literature, and it explains the immunity to conversion.

  *   **The Idealists (Formal Coherence):** For this group (often associated with MIRI or strict Bayesianism), DT is a logic of consistency. If your preferences violate Expected Utility (EU) axioms, you are vulnerable to Dutch Books or Money Pumps. For them, PM is a crisis because EU + Unbounded Utility + Regularity (no zero probabilities) logically entails muggability. To reject the mugger is to admit inconsistency. They will bite the bullet or modify the metaphysics (priors) rather than break the math.
  *   **The Embeddedists (Bounded Agency):** For this group (often associated with modern AI safety or cognitive science), DT is a tool for agents with finite compute living in a physical universe. "3↑↑↑3" is not just a large number; it is a state of affairs the agent cannot computationally represent. For them, PM is a category error. It applies a theory designed for finite worlds to an infinite limit case that no embedded agent can ever encounter.
  *   **The Intuitionists (Reflective Equilibrium):** For this group (standard philosophy/econ), DT is a systematization of reasonable human judgment. If the theory says "give the mugger your wallet," the theory is wrong, because our intuition that this is absurd is the primary data point. They are willing to break axioms (like Continuity) to save the intuition.

  **Why nobody converts:** Because each camp is protecting a different "sacred value." The Idealist protects *Consistency*. The Embeddedist protects *Physical Plausibility*. The Intuitionist protects *Common Sense*. When you offer a Complexity Prior to an Idealist, they ask if it's axiomatically justified. When you offer Bounded Utility to an Intuitionist, they point out the "Sadistic Conclusion" (preferring one person tortured for sure over a tiny chance of 3↑↑↑3 tortured). When you tell an Embeddedist to solve it, they say the problem is ill-posed for their ontology.

  ### 2. The Deeper Disagreement: Axiomatic Impossibility
  You asked if there is a deeper disagreement underneath the teleological one. There is: **The Impossibility Theorem.**

  It has become increasingly clear in recent years that you cannot simultaneously hold the following four desiderata:
  1.  **Unbounded Utility:** There is no limit to how good/bad an outcome can be.
  2.  **Dominance:** If Act A is better than Act B in every state of the world, choose A.
  3.  **Regularity:** You cannot assign probability 0 to any logically possible hypothesis (to allow for learning).
  4.  **Expected Utility Maximization:** Choose the act with the highest sum of (prob × utility).

  Pascal's Mugging proves that {1, 3, 4} → ¬2. (If utility is unbounded, priors are non-zero, and you maximize EU, you violate Dominance by ignoring the mugger).

  The deeper disagreement is not just about what DT is *for*, but **which of these four axioms is the least costly to sacrifice.**
  *   **Bounded Utility** sacrifices (1).
  *   **Complexity Priors** effectively sacrifice (3) (by making the probability of high-stakes claims vanish faster than utility grows) or modify (4).
  *   **Rejecting EU** sacrifices (4).
  *   **Ignoring the Mugger** implicitly sacrifices (2) or (4) in practice.

  People don't move across camps because they have different assessments of the *cost* of dropping each axiom. An Idealist thinks dropping (4) is fatal to rationality. An Intuitionist thinks keeping (1) is fatal to morality.

  ### 3. Can the Debate Be Moved?
  Is there a formal result, distinction, or experiment that could break the deadlock? I see three potential avenues.

  #### A. The "Epistemic vs. Decision-Theoretic" Distinction
  A promising move is to argue that PM is not a decision-theoretic problem but an **epistemic** one.
  *   **The Move:** The error happens at the updating stage, not the choosing stage. A rational agent should not update on the mugger's claim simply because they stated it. The likelihood ratio of "Mugger says X" given "X is true" vs "X is false" does not favor "X is true" sufficiently to overcome the prior, *regardless* of the stakes.
  *   **Why it might work:** It preserves EU maximization (satisfying Idealists) while avoiding the absurd conclusion (satisfying Intuitionists).
  *   **The Counter:** The mugger can provide evidence (e.g., "look at the sky," and it turns green). If the evidence is strong enough, the posterior probability *must* rise. If utility is unbounded, you still get mugged. This pushes the problem back to the prior (Complexity Priors), returning us to the stalemate.

  #### B. Embedded Agency and "Ontology Mismatch"
  This is the strongest candidate for a technical resolution.
  *   **The Move:** Standard DT assumes the agent and the world are separate (Cartesian). Embedded agency assumes the agent is a subroutine within the world. An embedded agent cannot have a hypothesis space that includes states of the world larger than its own computational capacity.
  *   **The Result:** "3↑↑↑3 people" is not a valid hypothesis for a human-sized or even AGI-sized agent because the agent cannot encode that state. Therefore, the probability is not "low"; it is **undefined**.
  *   **Why it might work:** It dissolves the problem rather than solving it. It tells the Idealist, "Your math assumes an ontology you don't have." It tells the Intuitionist, "Your intuition is right because the calculation is impossible."
  *   **The Barrier:** Idealists argue this is just Bounded Rationality in disguise, and Normative DT should still tell us what the *limit* of that bounded agent should aspire to.

  #### C. The AI Alignment Pivot (The "Stakes" Argument)
  This is the only thing that might actually force convergence.
  *   **The Move:** Stop treating PM as a puzzle about human wallets. Treat it as a **safety risk for AGI.**
  *   **The Argument:** A human can ignore the mugger because we have heuristics. An AGI running pure EU maximization with a broad hypothesis space *will not* ignore the mugger. If we build an Idealist Agent, it *will* spend all its resources pursuing low-probability, high-stakes scenarios (simulating universes, etc.) rather than solving actual problems.
  *   **Why it moves the debate:** It changes the cost function. For the Idealist, the cost of "inconsistency" is high. But for the AI Safety researcher, the cost of "an AI that ignores reality to chase Pascalian ghosts" is existential. This forces the Idealist to admit that even if EU is *normatively* true, it is *implementationally* fatal. This bridges the gap between Idealist and Embeddedist.

  ### 4. Recommendation: Map the Trade-offs, Don't Seek Convergence
  To answer your final question: **We should stop expecting convergence on a single "True" Decision Theory.**

  The debate stalls because everyone is looking for a "Get Out of Jail Free" card that preserves all their intuitions. The mature position is to accept the **Impossibility Result**.

  The path forward is not to solve Pascal's Mugging, but to **map the impossibility space.** We need a framework that explicitly says:
  > "If you want Unbounded Utility, you must accept Muggability. If you want to avoid Muggability, you must accept Bounded Utility or Non-Standard Probability. Here are the exact costs of each."

  **A Proposed Distinction to Advance the Debate:**
  Distinguish between **Normative Decision Theory** (what is logically consistent for an omniscient god) and **Operational Decision Theory** (what code we can write for an agent that won't crash or get exploited).
  *   Admit that Normative DT might indeed be vulnerable to PM.
  *   Admit that Operational DT *must* be immune to PM.
  *   The research question becomes: **How do we approximate the Normative ideal without inheriting its pathological failure modes?**

  This shifts the debate from "Who is right about the mugger?" to "What is the safe approximation of rationality?" That is a question with a technical answer, rather than a philosophical stalemate.

  ### Summary
  Your hypothesis is correct: the stagnation is due to conflicting views on the *purpose* of decision theory. But the engine of that stagnation is the **axiomatic impossibility** of satisfying all our desiderata simultaneously.

  The debate will only move if we stop trying to "solve" the mugger and start treating PM as a **boundary condition** that reveals the limits of Expected Utility theory. The most productive path is to leverage the **AI Alignment** context: even if the Idealists are philosophically right, the Embeddedists are practically necessary for survival. That pragmatic pressure is the only force strong enough to break the philosophical deadlock.
