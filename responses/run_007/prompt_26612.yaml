answer: |-
  Welcome to the field. Your intuition is sharp: the distinction you are probing is indeed one of the most contentious and unstable areas in the ethics of consent. As a physicist, you will likely find the lack of a unified field theory here frustrating, but you will also find that the instability is a feature of the debate, not merely an oversight.

  To answer your primary question: **No, there is no single, universally accepted name or taxonomy in moral philosophy that successfully resolves this puzzle.** However, there is a well-established vocabulary for the *attempt* to draw this line, and a growing consensus that the line is not where traditional theory placed it.

  Here is a breakdown of the philosophical landscape regarding deception and consent, the criteria proposed, and how the "impostor" case is currently handled.

  ### 1. The Terminology and Traditional Distinction

  In legal theory, as you noted, the distinction is **Fraud in the Factum** (deception about the nature of the act) vs. **Fraud in the Inducement** (deception about the reasons/consequences).

  In moral philosophy, this maps roughly onto:
  *   **Essential vs. Accidental Features:** Did the deception concern a feature essential to the action token itself, or merely a circumstance surrounding it?
  *   **Constitutive vs. Causal:** Did the lie change *what* was being done, or merely *why* it was being done?
  *   **Internal vs. External:** Is the deceived fact internal to the description of the act or external to it?

  **The Standard View:** Consent is invalidated only by deception regarding the **nature of the act** (essential/constitutive). Deception regarding motives, consequences, or identity (unless identity is constitutive) renders the act wrongful (a lie) but does not necessarily negate the consent (the permission remains valid).

  **The Collapse:** You are correct that this collapses. As your Case 2 shows, "medical necessity" can be viewed as a consequence (collateral) or as a defining feature of "surgery" (i.e., surgery is *by definition* a therapeutic intervention; if it's not therapeutic, it's battery).

  ### 2. Principled Criteria Proposed in the Literature

  Philosophers have attempted to rescue the distinction with more rigorous criteria. Here are the three leading approaches:

  #### A. The Autonomy-Based Account (Onora O'Neill, Tom Dougherty)
  This view asks: *Did the deception prevent the agent from exercising autonomy in choosing the act?*
  *   **Criterion:** Consent is invalid if the deception prevents the agent from understanding the **proposal** itself. If I know what you are proposing but lie about why I want it, your autonomy to accept the proposal is intact. If I lie about what the proposal *is*, your autonomy is bypassed.
  *   **Handling the Impostor (Case 3):** This depends on whether the identity of the agent is part of the "proposal." In fiduciary relationships (doctor/patient) or intimate relationships (sex), the identity is often considered part of the proposal. In a casual market transaction, it is not.
  *   **Critique:** It still relies on a vague definition of what constitutes the "proposal."

  #### B. The Rights-Transfer Account (Heidi Hurd, Larry Alexander)
  This view treats consent as the **moral magic** that transfers a right from one party to another.
  *   **Criterion:** Consent is invalid if the deception causes the agent to waive a right they did not intend to waive.
  *   **Handling the Impostor:** Do I have a right not to be touched by *anyone*, or a right not to be touched by *non-doctors*? If the latter, the impostor violates the right, and consent is void.
  *   **Critique:** This pushes the problem back to defining the scope of the right, which is often just as contentious as defining the nature of the act.

  #### C. The Deal-Breaker Account (Tom Dougherty, "Sex, Lies, and Consent")
  This is a more recent, rigorous attempt to solve the collapse.
  *   **Criterion:** Deception vitiates consent if the truth would have been a **deal-breaker** for the agent *and* the deceiver knew or should have known this.
  *   **Nuance:** To avoid making all lies vitiate consent (since almost anything could be a deal-breaker), Dougherty argues we must look at **normative expectations**. In certain contexts (medicine, sex), certain facts are *presumptively* deal-breakers (e.g., identity, sterilization). In others, they are not (e.g., profit motive).
  *   **Critique:** It moves away from a metaphysical distinction (nature of the act) to a subjective/normative one (what the agent cares about), which some argue makes consent too unstable.

  ### 3. The Impostor Case (Case 3) specifically

  The impostor case is the stress test for these theories. In philosophy, this is often discussed alongside the "Sleeping Partner" or "Twin" cases in sexual ethics (e.g., *R v. Williams* in UK law).

  *   **The Physicalist View:** The act was an "examination." The physical motions were identical. Therefore, consent to the examination was given. The lie was collateral. (This view is minority in moral philosophy).
  *   **The Relational View:** The act was "an examination *by a doctor*." In medicine, the license is not a credential; it is a constitutive element of the permission. You are consenting to enter a fiduciary relationship, not just to be touched.
  *   **Current Consensus:** Most moral philosophers side with the **Relational View**. The deception regarding identity in a fiduciary context vitiates consent because the trust relationship is constitutive of the act's permissibility. However, they admit this is context-sensitive. If you consent to a massage by a "therapist" and it turns out they are unlicensed but skilled, the moral violation is lesser than if you consented to surgery by a "surgeon" who is a butcher.

  ### 4. The "No Sharp Line" View (Pluralism/Contextualism)

  You asked if the leading view is that there is no sharp line. **Yes, increasingly so.**

  Many contemporary ethicists (e.g., Alan Wertheimer, Sarah Miller) argue that the binary "Valid/Invalid" is a legal convenience that does not map onto moral reality. They propose a **Scalar** or **Cluster** concept of consent.

  *   **Degrees of Validity:** Consent can be "impaired," "defective," or "non-autonomous" without being wholly void.
  *   **Context-Sensitivity:** The criterion for vitiation shifts based on the **stakes** and the **relationship**.
      *   *High Stakes/Fiduciary (Surgery):* Almost any deception regarding qualifications or necessity vitiates consent.
      *   *Low Stakes/Commercial (Haircut):* Deception about the stylist's training might not vitiate consent to the haircut, even if it is fraudulent.

  In this view, your Case 2 (profit motive) is not a binary "valid/invalid." It is a case where consent is **morally defective**. The surgeon has wronged the patient, and the patient has a claim to restitution, but it may not be the same *type* of wrong as the sterilization case (which is a violation of bodily integrity).

  ### 5. Recommended Reading for a Physicist

  Given your background, you will likely prefer authors who strive for analytic rigor over continental abstraction.

  1.  **Tom Dougherty, "Sex, Lies, and Consent" (2013).**
      *   *Why:* He treats the problem almost like a logic puzzle. He explicitly addresses the "collapse" of the nature/circumstance distinction and proposes the "deal-breaker" refinement.
  2.  **Onora O'Neill, *Autonomy and Trust in Bioethics* (2002).**
      *   *Why:* She focuses on what makes consent *meaningful* rather than just valid. Good for the "collateral matters" problem.
  3.  **Heidi Hurd, "The Moral Magic of Consent" (1996).**
      *   *Why:* A rigorous rights-based analysis. She argues consent transforms duties. If the transformation fails due to deception, the duty remains.
  4.  **Alan Wertheimer, *Coercion* (1987) and subsequent papers on consent.**
      *   *Why:* He is the leading proponent of the view that these distinctions are contextual and that we should look at the *harm* and *wrongfulness* separately from the validity of consent.

  ### Summary

  There is no single name for the puzzle, though it is often referred to as **"The Problem of Deceptive Consent"** or **"Vitiation by Fraud."**

  The standard "Nature of the Act" distinction is widely acknowledged to be unstable. The current philosophical movement is toward **Contextualism**: the criterion for whether deception invalidates consent depends on whether the deceived fact is **normatively significant** within that specific type of relationship (fiduciary, intimate, commercial).

  In your impostor case, the philosophical consensus leans toward **invalid consent**, not because the physical act differed, but because the *normative context* (the fiduciary trust) was absent, making the act fundamentally different from the one consented to.
