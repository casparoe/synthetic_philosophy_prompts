answer: |-
  The "Letter Spirit" problem, originally articulated by Douglas Hofstadter and colleagues, is not merely a problem of optical character recognition (OCR). It is a problem of **abstract categorization under radical stylistic variance.** It asks how the mind extracts the *essence* of a symbol when its physical instantiation can change topologically, geometrically, and contextually without losing its identity.

  Below are the specifications for an adequate theory of letterform identity. These are divided into **Phenomenal Constraints** (what the system must do), **Boundary Conditions** (where it must draw lines), and **Empirical Constraints** (what biology dictates).

  ---

  ### I. Phenomenal Constraints (The "Must-Haves")

  #### 1. Invariance to Topological Discontinuity
  *   **The Requirement:** The theory must identify two forms as the same letter category even when they do not share the same topological properties (e.g., number of holes, connectivity).
  *   **Concrete Case:** The **Single-Story vs. Double-Story 'a'**. The printed 'a' (double-story, closed loop) and the handwritten 'ɑ' (single-story, open hook) share no closed loops. A feature list requiring "one enclosed region" fails. A template match fails. Yet, humans categorize both as /a/ instantly.
  *   **Why Naive Approaches Fail:** Feature-list accounts (e.g., "must have a vertical stem and a bowl") cannot accommodate forms where the "bowl" is open. Template matching cannot bridge the topological gap.
  *   **Status:** **Non-Negotiable.**

  #### 2. Separation of Category Identity from Style Identity
  *   **The Requirement:** The theory must represent *what* letter it is (Category) separately from *how* it is drawn (Style), while acknowledging that Style is a global property of a set, not just local noise.
  *   **Concrete Case:** **Font Consistency.** An 'a' in Times New Roman and an 'a' in Helvetica are both /a/, but they share a "style" relationship with the 'g' in their respective fonts. A theory must explain how we know the Times 'a' belongs with the Times 'g' (the "Spirit"), without confusing the Category /a/ with the Style "Serif."
  *   **Why Naive Approaches Fail:** Simple classifiers treat style variance as noise to be discarded. They cannot capture the *coherence* of a typeface (the "Spirit"). If style is just noise, the theory cannot explain why we can detect a "mismatched" letter in a word (e.g., a Comic Sans 'e' in a Times New Roman word).
  *   **Status:** **Non-Negotiable** (for a full Letter Spirit theory); **Optional** (for a minimal OCR theory, but at the cost of explaining human aesthetic sensitivity).

  #### 3. Contextual Modulation of Identity
  *   **The Requirement:** The categorization of a glyph must be modifiable by its sequential or spatial neighbors without changing the low-level features.
  *   **Concrete Case:** **Cursive Ambiguity.** In rapid handwriting, the same stroke sequence can be read as 'r', 'v', or 'u' depending entirely on the preceding and following letters. A standalone glyph might be ambiguous, but in context, identity is resolved.
  *   **Why Naive Approaches Fail:** Feed-forward feature detectors process the glyph in isolation. They cannot account for the top-down influence of lexical context on perceptual identity (the "Word Superiority Effect").
  *   **Status:** **Non-Negotiable.**

  #### 4. Robustness to Degradation and Occlusion
  *   **The Requirement:** Identity must be preserved when significant portions of the contour are missing or corrupted, provided the "structural skeleton" remains.
  *   **Concrete Case:** **Low-Resolution/Faxed Text.** When an 'h' loses its right vertical stem due to noise, it may still be read as 'h' if the context supports it, or as 'n' if not. Humans interpolate missing contours based on letter priors.
  *   **Why Naive Approaches Fail:** Template matching degrades linearly with pixel loss. Feature lists fail if a critical feature (e.g., "ascending stem") is occluded.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Boundary Conditions (The "Draw the Line" Cases)

  #### 5. Handling of Category Ambiguity (Graded Membership)
  *   **The Requirement:** The theory must account for cases where identity is not binary but probabilistic or ambiguous, without crashing.
  *   **Concrete Case:** **The '0' vs. 'O' vs. 'Q' Boundary.** In many sans-serif fonts, '0', 'O', and 'Q' differ only by subtle cues (slant, tail, width). In ambiguous contexts (e.g., a password field), humans perceive them as genuinely multistable. A theory must represent this uncertainty, not force a premature hard classification.
  *   **Why Naive Approaches Fail:** Classical symbolic models demand binary truth values. They cannot represent "70% 'O', 30% '0'".
  *   **Status:** **Non-Negotiable.**

  #### 6. Distinction between Letter Identity and Object Identity
  *   **The Requirement:** The theory must distinguish between recognizing a letter as a *symbol* vs. recognizing it as a *shape*.
  *   **Concrete Case:** **The 'H' vs. 'Ladder' Problem.** A drawing of a ladder and the letter 'H' are geometrically identical. Humans categorize them differently based on intent/context. A theory of *letterform* identity must explain why the 'H' is processed in the Visual Word Form Area (VWFA) while the ladder is not.
  *   **Why Naive Approaches Fail:** Pure vision models treat them as the same shape. Pure linguistic models ignore the visual input. The theory must bridge the symbolic and the visual.
  *   **Status:** **Non-Negotiable.**

  ---

  ### III. Empirical Constraints (Psychology & Neuroscience)

  #### 7. Alignment with VWFA Invariance
  *   **The Requirement:** The representational format must be compatible with the neural coding found in the Visual Word Form Area (left occipitotemporal cortex).
  *   **Concrete Finding:** fMRI adaptation studies show that the VWFA responds to letter identity across changes in font, size, and case (A vs a), but not to mirror images (b vs d) in literate adults.
  *   **Constraint:** The theory cannot rely on retinotopic mapping. It must posit an abstract, view-invariant code that develops with literacy.
  *   **Status:** **Non-Negotiable.**

  #### 8. Processing Speed Constraints
  *   **The Requirement:** Categorization must occur within the latency of human letter recognition (~150-200ms).
  *   **Concrete Finding:** Masked priming experiments show that letter identity is extracted pre-attentively and extremely rapidly.
  *   **Constraint:** The theory cannot rely on slow, serial hypothesis testing (e.g., "Is there a loop? No. Is there a stem? Yes..."). It must be largely parallel.
  *   **Status:** **Non-Negotiable.**

  #### 9. The Mirror-Invariance Break
  *   **The Requirement:** The theory must explain why general object recognition is mirror-invariant (a chair is a chair facing left or right), but letter recognition is mirror-sensitive ('b' ≠ 'd').
  *   **Concrete Finding:** Illiterate adults and young children show mirror invariance for letters; literate adults lose it.
  *   **Constraint:** The theory must include a mechanism for *learning to break* mirror invariance, implying that letter identity is not a natural visual category but a culturally acquired one.
  *   **Status:** **Non-Negotiable.**

  ---

  ### IV. Classification of Requirements

  | Requirement | Classification | Cost of Dropping |
  | :--- | :--- | :--- |
  | **Topological Invariance** | **Non-Negotiable** | Theory cannot explain handwriting recognition; limited to machine-print only. |
  | **Category/Style Separation** | **Non-Negotiable** | Theory cannot explain the "Letter Spirit" (font coherence); reduces style to noise. |
  | **Contextual Modulation** | **Non-Negotiable** | Theory fails on cursive/connected script; violates Word Superiority Effect data. |
  | **Degradation Robustness** | **Non-Negotiable** | Theory is brittle; fails in real-world noisy environments. |
  | **Graded Membership** | **Non-Negotiable** | Theory cannot handle ambiguity; forces artificial binary decisions. |
  | **Symbol vs. Object Distinction** | **Non-Negotiable** | Theory conflates reading with object recognition; violates neuro data (VWFA). |
  | **VWFA Compatibility** | **Non-Negotiable** | Theory is biologically implausible. |
  | **Processing Speed** | **Non-Negotiable** | Theory is computationally unrealistic for real-time cognition. |
  | **Mirror-Invariance Break** | **Non-Negotiable** | Theory cannot explain literacy acquisition or 'b'/'d' confusion. |
  | **Generative Capability** | **Optional** | *Can the theory generate new fonts?* Dropping this limits the theory to *recognition* only, ignoring the productive nature of the "Letter Spirit" project. |
  | **Explicit Symbolic Rules** | **Optional** | *Must rules be human-readable?* Dropping this allows connectionist/black-box models, provided they meet behavioral constraints. |

  ---

  ### V. The Killer Constraint

  The single requirement that does the most to rule out simple template-matching or feature-list accounts is:

  #### **Equivalence of Topologically Distinct Forms (The Single-Story/Double-Story Paradox)**

  **Why this is the killer:**
  1.  **Template Matching:** Fails immediately. The pixel overlap between a double-story 'a' and a single-story 'ɑ' is minimal. No amount of affine transformation (scaling, rotating) maps one to the other.
  2.  **Feature Lists:** Fails structurally. A standard feature list for 'a' might include `[+closed_loop]` or `[+vertical_stem_right]`. The single-story 'ɑ' lacks the closed loop and often lacks the vertical stem. To accommodate it, you must make the feature list so disjunctive (e.g., "Loop OR Open Hook") that it loses predictive power and begins to overlap with 'd', 'c', or 'u'.
  3.  **The Nontrivial Implication:** This constraint forces the theory to posit a **relational or structural description** rather than a perceptual one. The theory must claim that letter identity is defined by *functional relationships* between parts (e.g., "a bowl attached to a stem") rather than the parts themselves. It implies that the cognitive system performs a form of **analogy**: it recognizes that the *role* played by the single-story hook is analogous to the *role* played by the double-story loop, despite their geometric incompatibility.

  Any theory that cannot explain why `ɑ` = `a` without resorting to "memorizing every font" is not a theory of letterform identity; it is merely a lookup table. This requirement forces the model to articulate what the **invariant essence** of a letter actually is.
