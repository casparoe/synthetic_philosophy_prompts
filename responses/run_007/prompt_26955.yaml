  The adaptationist surveys the frame,
  And sees design in every living part.
  Each trait exists to win the vital game,
  Polished by selection's cunning art.
  Each single trait implies necessity,
  In this best world where function is the law.
  A seamless fit of form and destiny,
  Where every trait is what the selector saw.

  Yet San Marco shows a different plane,
  Where spandrels sit between the arch and light.
  The Bauplan limits what we can explain,
  Hidden from the lens of functional sight.
  Selection works, but "could have been" is weak,
  When storytellers make the data speak.
