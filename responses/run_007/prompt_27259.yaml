answer: |-
  **Session Plan: Hofstadter's "A Person Paper on Purity in Language"**
  **Time:** 75 Minutes
  **Goal:** Analyze the *mechanism* of satire (transposition, voice, analogy) rather than the moral conclusion.

  ### 1. Pre-Reading Setup (10 Minutes)
  **Do not reveal the twist.** If students know this is about gender via race analogy beforehand, the cognitive dissonance required for the satire to work is neutralized. They will read defensively rather than experientially.

  *   **Frame:** Tell them this is a philosophical essay on "linguistic purity" and the ethics of generic terms.
  *   **Task:** Ask them to track two things while reading:
      1.  **The Neologisms:** Note every new word introduced (e.g., *chairwhite, whe, ble*).
      2.  **The Narrator's Tone:** Is the narrator angry? Reasonable? Confused?
  *   **Why:** This primes them to notice the *construction* of the language rather than getting lost in the political content immediately. It ensures they engage with the text's logic before their moral instincts kick in.

  ### 2. In-Class Reading (20 Minutes)
  The text is dense. Instruct students to prioritize the argumentative arc over every footnote. They need to reach the "reveal" (where the gender analogy becomes explicit) to participate in the discussion. If they fall behind, tell them to skim examples but read the transitional paragraphs carefully.

  ### 3. Discussion Arc (35 Minutes)

  **Phase 1: The Reveal & The Voice (10 mins)**
  *   **Ask:** "Who is the narrator, and what is their goal?"
  *   **Head Off Misconception (Narrator = Author):** Students often assume the narrator's views are Hofstadter's. Clarify immediately that this is a **persona**. The narrator is a "reasonable bigot." The satire works because the narrator sounds like a standard academic columnist, not a cartoon villain.
  *   **Point:** The voice does the heavy lifting. If the narrator were hysterical, we'd dismiss them. Because they are calm and logical, we are forced into their framework until the absurdity peaks.

  **Phase 2: The Mechanism (15 mins)**
  *   **Anchor Example:** You suggested the moon-landing bit. It is excellent for *emotional* impact, but for understanding the *mechanism*, anchor on **"chairwhite" vs. "chairman."**
  *   **Analysis:** Walk through the substitution.
      *   *Man* $\rightarrow$ *White* (The default generic).
      *   *He/She* $\rightarrow$ *Whe/Ble*.
      *   *Mankind* $\rightarrow$ *Whitekind*.
  *   **Head Off Misconception (Only About Race):** Students may think the piece is primarily a critique of racism. Correct this: Race is the *vehicle*, gender is the *tenor*. The piece uses the settled moral consensus on racism (that generic "white" is absurd) to destabilize the unsettled consensus on sexism (that generic "man" is absurd).
  *   **Point:** This is **race-transposition**. It forces the reader to inhabit a linguistic world where their own privilege (as non-white, or simply as someone aware of racial history) is marginalized by grammar.

  **Phase 3: Analogy vs. Equation (10 mins)**
  *   **Head Off Misconception (Sexism = Racism):** Students often conclude, "Sexism is just as bad as racism." This is a trap. Hofstadter is not equating the historical suffering of the groups.
  *   **Clarify:** The piece argues that the *linguistic mechanism of exclusion* functions similarly, not that the *historical outcomes* are identical. The goal is to make the familiar (sexist language) strange by mapping it onto the unfamiliar (racist language). It is an argument by **analogy**, not equivalence.

  ### 4. What to Leave Out
  *   **Empirical Linguistics:** Do not get bogged down in whether sexist language *actually* causes sexist behavior (the Sapir-Whorf debate). Hofstadter is making a philosophical point about consistency and imagination, not a sociological claim about causality.
  *   **Biographical Context:** Hofstadter's other work (*Gödel, Escher, Bach*) is irrelevant here. Keep the focus on the text's internal logic.
  *   **Modern Terminology:** Avoid updating the terms (e.g., discussing "they/them" singular). Stick to the text's specific *he/she* vs. *whe/ble* conflict to preserve the historical context of the argument.

  ### 5. Final Assessment (10 Minutes)
  **In-Class Writing Prompt:**
  Do not ask, "What is the main message?" (This invites moralizing). Instead, ask:

  > "Hofstadter does not argue directly that 'sexist language is harmful.' Instead, he constructs a scenario. Explain **how** the substitution of 'white' for 'man' changes your reaction to the argument. Specifically, how does the narrator's 'reasonable' tone contribute to the satire's effectiveness?"

  **Why this works:** To answer this, they must identify the *mechanism* (transposition) and the *voice* (persona). If they answer only about how bad sexism is, they missed the point. If they discuss the feeling of absurdity generated by the linguistic swap, they have grasped the satirical engine.

  ### Summary of Timing
  *   **0-10:** Setup (No spoilers).
  *   **10-30:** Reading (Track tone/words).
  *   **30-40:** Unpack Narrator/Persona.
  *   **40-55:** Mechanism (Chairwhite/Whe/Ble).
  *   **55-65:** Analogy vs. Equation.
  *   **65-75:** Writing Prompt.
