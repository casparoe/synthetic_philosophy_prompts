answer: |-
  The concept you are looking for is **moral standing** (specifically, the **standing to blame** or **standing to accuse**).

  In contemporary moral philosophy, this is the precise term used to describe the normative authority required to hold another person accountable. While the truth of the accusation remains intact, the hypocrite lacks the *authority* to issue it.

  Here is a breakdown of the concept, how it differs from the fallacies and traits you mentioned, and the conditions under which it is lost or retained.

  ### 1. The Concept: Moral Standing
  **Moral standing** is the right or authority to participate in a specific moral practice—in this case, the practice of holding others accountable for violations of shared norms.

  When you say the accuser is "in no position to talk," you are identifying a failure of **felicity conditions** (a term from speech act theory). For an accusation or act of blame to be successful, it must not only be *true* (the content) but also *authorized* (the speaker). A hypocrite speaks the truth, but their speech act is "infelicitous" or inappropriate because they have waived their authority to enforce that specific norm.

  The seminal work on this is by philosopher **R. Jay Wallace**, particularly in his paper *"Hypocrisy, Moral Address, and the Importance of Standing"* (2010). He argues that moral accountability is a reciprocal practice among members of a moral community. By violating a norm oneself, one forfeits the standing to demand compliance from others regarding that same norm.

  ### 2. Distinctions

  #### vs. The *Tu Quoque* Fallacy
  *   **The Fallacy:** *Tu quoque* ("you too") is a logical fallacy when used to dismiss the **truth** of a claim. (e.g., "You say smoking is bad, but you smoke, therefore smoking is *not* bad.")
  *   **The Standing Objection:** This does not challenge the truth of the proposition. It challenges the **propriety of the address**. (e.g., "You say smoking is bad, and you are right that it is. But because you smoke, *you* are not the one who should be telling me.")
  *   **Summary:** *Tu quoque* attacks the argument's validity; the standing objection attacks the speaker's authority.

  #### vs. Hypocrisy (as a Character Trait)
  *   **Hypocrisy:** This is a description of inconsistency between word and deed. It is a vice of character.
  *   **Lack of Standing:** This is a normative status. One can lack standing without being a "hypocrite" in the full sense (e.g., someone who secretly committed a crime years ago but has since reformed may lack standing to accuse a current offender, even if they aren't currently living a lie).
  *   **Summary:** Hypocrisy is about who you *are*; standing is about what you are *entitled to do*.

  ### 3. What Removes Standing? (The Conditions)
  You asked specifically about the conditions that remove standing. Philosophers generally agree on a hierarchy of involvement:

  #### A. Committing the Same Wrong (The Paradigm Case)
  *   **Status:** **Standing Lost.**
  *   **Reasoning:** Moral norms imply a commitment to mutual compliance. By violating the norm, the accuser treats the norm as optional for themselves while insisting it is mandatory for others. This creates an unjustified hierarchy, violating the equality required for moral address.
  *   **Example:** The tax-evading politician cannot legitimately blame the rival for tax evasion.

  #### B. Complicity and Benefit
  *   **Status:** **Standing Diminished or Lost.**
  *   **Reasoning:** If the accuser has benefited from the systemic wrong they are accusing another of participating in, their hands are "dirty."
  *   **Nuance:** If I benefit from a corrupt system but actively try to dismantle it, I may retain standing to criticize the *system*, but I may lack standing to blame *individuals* trapped in it. If I actively enabled the specific wrong (e.g., I helped you hide the money), I have no standing to blame you for hiding it.

  #### C. Failure to Stop It (Omission)
  *   **Status:** **Context Dependent.**
  *   **Reasoning:** If I had a duty to stop you and failed, my standing is compromised. However, if I had no specific duty to intervene, my standing usually remains intact.
  *   **Example:** A bystander who sees a theft and does nothing may feel guilty, but they generally retain the standing to call the police or condemn the thief. A security guard who looks away does not.

  #### D. Past Wrongdoing + Reform (Repentance)
  *   **Status:** **Standing Regained.**
  *   **Reasoning:** This is the crucial exception. If the accuser committed the wrong in the past but has genuinely repented, acknowledged the fault, and changed their behavior, they often **regain** standing.
  *   **Why:** Repentance reaffirms the validity of the norm. By saying, "I did this, it was wrong, and I am sorry," the reformed accuser aligns themselves with the norm again. In some cases, they may even have *more* standing (as a witness to the harm), provided their accusation is not self-aggrandizing.
  *   **Condition:** The reform must be genuine. If the "reform" is merely a tactical shift to gain leverage against others, standing is not regained.

  #### E. Different Wrongdoing
  *   **Status:** **Standing Intact.**
  *   **Reasoning:** Standing is usually norm-specific. Committing Wrong A does not necessarily remove standing to accuse another of Wrong B, unless Wrong A implies a general disregard for morality that undermines all moral address (e.g., a pathological liar may lack standing to accuse anyone of lying, but might still have standing to accuse someone of theft).
  *   **Example:** A person who speeds (Wrong A) generally retains the standing to accuse another of murder (Wrong B).

  ### 4. Related Terminology
  If "Moral Standing" feels too academic, there are two other terms that capture aspects of this:

  1.  **The Clean Hands Doctrine:** Borrowed from equity law ("he who comes into equity must come with clean hands"). It suggests that one cannot seek moral (or legal) remedy if they are tainted by the same misconduct.
  2.  **Moral Estoppel:** A less common but precise term. In law, *estoppel* prevents someone from asserting a right because their previous actions contradict it. *Moral estoppel* prevents a person from asserting a moral claim because their conduct has waived that right.

  ### Summary
  The feeling you are identifying is the recognition that moral blame is a **reciprocal practice**, not just a delivery of facts. To blame someone is to invoke a shared authority. The hypocrite attempts to invoke an authority they have voluntarily relinquished.

  The word you want is **Standing**. The accuser lacks the **standing to blame**.
