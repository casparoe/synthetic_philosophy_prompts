answer: |-
  This is an excellent question. You have grasped the mechanics of the puzzle correctly, but your proposed framing—specifically that it is a direct counterexample to Expected Utility Theory (EUT) or that it necessitates self-deception—is slightly off-center relative to the dominant philosophical literature.

  While your gloss is a common starting point for students, refining it will help you avoid certain conceptual traps. The Toxin Puzzle is less a refutation of EUT's *calculations* and more a challenge to our understanding of the **relationship between intention, action, and rationality.**

  Here is a breakdown of how to sharpen your framing for your unit on instrumental rationality.

  ### 1. Is it a Counterexample to Expected Utility Theory?
  Strictly speaking, **no.** Most decision theorists argue that the Toxin Puzzle does not break EUT, provided EUT is understood as a theory of *choice*.

  *   **The Voluntariness Objection:** Standard EUT evaluates available *actions*. A widely held view (defended by Kavka and others) is that intention is not directly voluntary. You cannot simply "choose" to intend something in the way you choose to raise your hand. You can only intend what you believe you have a reason to do.
  *   **The EUT Defense:** If forming an intention is not a direct action under the agent's control, it is not an option in the decision matrix. Therefore, EUT does not prescribe "Form the intention." It only prescribes "Drink" or "Don't Drink" at the time of action. At the time of action, "Don't Drink" dominates. Thus, EUT remains consistent; it just implies you can't get the money.
  *   **Where the Tension Lies:** The puzzle challenges the **Sophisticated Choice** model inherent in standard decision theory. Sophisticated choice says a rational agent predicts their future self's actions and reasons backward. Since the future self won't drink, the present self knows they can't intend, so they don't get the money. The puzzle asks: *Should* rationality work this way?

  **Pedagogical Tip:** Instead of saying EUT gives "contradictory prescriptions," frame it as a conflict between **the rationality of plans** and **the rationality of actions.** EUT prioritizes the rationality of the action at the time of execution. The puzzle asks if that is the correct standard for instrumental rationality.

  ### 2. Is the Lesson About the Norms of Intention?
  **Yes.** This is the most philosophically robust framing. The puzzle highlights specific normative constraints on intention that distinguish it from mere desire or prediction.

  **A. Kavka's Constraint (The Transparency of Intention)**
  Kavka argues that there is a conceptual truth about intention: **One cannot intend to do X if one believes one will not do X.**
  *   Intention implies a belief that you will act.
  *   Since you know drinking is irrational tomorrow (no benefit, only cost), you know you won't drink.
  *   Therefore, you cannot form the intention tonight.
  *   **The Lesson:** Instrumental rationality is bounded by psychological constraints on agency. You cannot bootstrap reasons for action out of thin air just because having the intention is beneficial.

  **B. Bratman's Planning Theory**
  Michael Bratman uses the puzzle to argue that intentions are distinct mental states with their own norms (consistency, stability, means-end coherence).
  *   **The Lesson:** Intentions are not just predictions; they are planning states. However, they must still be grounded in reasons for action. The puzzle shows that the *benefit of having the intention* is not itself a *reason for the action* contained in the intention.

  ### 3. Critique of the "Self-Deception" Solution
  You mentioned tempting students with the idea of "local self-deception." While this is a possible move, it is generally viewed as a **last resort** in the literature, for two reasons:

  1.  **Rationality vs. Success:** If the only way to be instrumentally rational (get the money) is to make yourself irrational (hold a false belief about your future action), we have a paradox about the value of rationality. We usually want a theory where being rational helps you win, not one where you must be irrational to win.
  2.  **The Resolute Choice Alternative:** The more prominent alternative to the "Impossible" verdict is **Resolute Choice** (associated with David Gauthier and Edward McClennen).
      *   **The Argument:** Rationality applies to the *plan* or *policy*, not just the isolated act. If you adopt a policy of "I will drink if I formed the intention," and you stick to it resolutely, you are rational.
      *   **The Upshot:** This challenges the standard EUT view that rationality is purely about maximizing utility at the *moment of choice*. It suggests rationality involves binding your future self.
      *   **Why this is better for students:** It offers a debate between two conceptions of rationality (Sophisticated/Myopic vs. Resolute) rather than suggesting rationality requires lying to oneself.

  ### 4. Recommended Framing for Your Unit
  To make the unit most effective, I suggest structuring the lesson around three competing diagnoses of the puzzle:

  **Diagnosis 1: The Impossibility Thesis (Kavka)**
  *   **Claim:** You cannot get the money.
  *   **Reason:** Intention requires belief in future action. You have no reason to act tomorrow. Therefore, you cannot intend tonight.
  *   **Lesson:** There are limits to what we can intend. Instrumental rationality cannot override the conceptual norms of intention.

  **Diagnosis 2: The Resolute Choice Thesis (Gauthier)**
  *   **Claim:** You can (and should) get the money.
  *   **Reason:** Rational agents adopt plans and stick to them. If you view the intention as a binding commitment, drinking tomorrow becomes rational because it fulfills the rational plan.
  *   **Lesson:** Standard EUT is too myopic. Instrumental rationality requires diachronic (over-time) consistency, not just synchronic (moment-to-moment) maximization.

  **Diagnosis 3: The Standard Decision Theory Defense**
  *   **Claim:** EUT is fine; the puzzle is a psychological trick.
  *   **Reason:** Intention formation isn't an action. EUT only evaluates actions. Since you can't action "intend," EUT says nothing about it.
  *   **Lesson:** We must distinguish between mental states we control and those we don't.

  ### Summary of Corrections to Your Gloss
  1.  **Avoid:** "EUT issues contradictory prescriptions."
      **Replace with:** "The puzzle reveals a tension between the rationality of forming a plan and the rationality of executing it under standard decision theory."
  2.  **Avoid:** "Rationality can require local self-deception."
      **Replace with:** "Some argue the puzzle shows we must be able to bind our future selves (Resolute Choice), while others argue it shows we cannot intend what we won't do (Impossibility)."
  3.  **Focus:** Shift the focus from "Is EUT wrong?" to "What is the relationship between intention and action?"

  ### Suggested Classroom Question
  To drive this home, ask your students:
  *"If a friend offered you this deal, and you took the money but didn't drink the toxin, did you act irrationally? Did you lie? Or did you simply prove that the deal was impossible to accept in the first place?"*

  This opens the door to discussing whether the fault lies in the agent's rationality, the nature of intention, or the decision theory itself.

  ### Recommended Reading for Preparation
  *   **Gregory Kavka,** "The Toxin Puzzle" (1983) - *The source.*
  *   **David Gauthier,** *Morals by Agreement* (Chapter on Resolute Choice) - *The main alternative.*
  *   **Michael Bratman,** *Intention, Plans, and Practical Reason* - *For the norms of intention.*
  *   **Ralph Wedgwood,** "The Toxin Puzzle" (Stanford Encyclopedia of Philosophy entry on Practical Reason) - *Good overview.*

  Your instinct to focus on instrumental rationality is spot-on; just ensure you locate the friction in the **norms of intention** and **diachronic rationality** rather than in the mathematical calculus of EUT itself.
