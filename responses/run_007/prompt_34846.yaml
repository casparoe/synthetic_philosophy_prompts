      *   *Occam's Razor (Algorithmic):* Simpler hypotheses (shorter programs) are assigned higher prior probability.
      *   *Solomonoff Induction:* A theoretical framework for prediction. It considers *all* possible programs that could generate the data seen so far, weights them by complexity (shorter = higher weight), and updates based on new data. It converges to the true distribution *if* the truth is computable.
      *   *Key Constraint:* It's uncomputable in practice (halting problem), but serves as an ideal.

