prompt: |-
  Ive been a horseplayer for about fifteen years and I make my own pace figures, so I'm fluent in the Form but I never studied any of this formally. Recently I fell into a bunch of internet writing about induction and prediction, and the same trio keeps coming up: Kolmogorov complexity, Solomonoff induction, and the idea that Occam's razor is more than a hunch because simpler programs get more prior probability and the whole thing is supposed to converge on the truth as long as the truth is a computable program. I follow the words, but when I try to cash it out against a race I've actually handicapped, I can't tell wether I'm understanding it or just decorating it with horses.

  What I'd like is a straight translation. Take Solomonoff induction and the Occam part of it, and restate them in the working vocabulary of a horseplayer — past performances, speed figures, pace figures, class ratings, trip notes, form cycles, track bias, first-time starters, claiming races — without smuggling in any math I don't have. Then give me the residue report. Which parts map cleanly, which parts you had to fudge, and which parts have no counterpart at all in how I read a race? And more specifically: when I say I like a horse because the race sets up simple for him, is that the same move as picking the shortest program, or does the analogy break exactly there? Does the convergence result really mean my form-reading has to eventually lock onto the truth if I keep feeding it more past performances, or does that only hold in a world where horses are programs and the barns aren't trying to hide anything?
