answer: |-
  The single principle that best captures your verdicts is **Maximize Expected Choiceworthiness (MEC)**, but with a crucial correction to how you are applying it.

  Your intuition that MEC fails the "Factory-farmed meat" case stems from a common misunderstanding: you are treating moral value as **binary** (Wrong vs. Permissible) rather than **scalar** (Degrees of Badness vs. Goodness). MEC does not ask you to average probabilities of "wrongness"; it asks you to average the *magnitude* of value or disvalue associated with each outcome.

  Once you assign appropriate magnitudes to the stakes—specifically recognizing that **negative duties (avoiding harm) typically carry much heavier weight than positive duties (providing help)**—MEC accommodates all six of your verdicts without contradiction. You do not need to overturn any verdicts; you need to refine your valuation function.

  ### The Principle: Maximize Expected Choiceworthiness (with Asymmetric Weighting)

  **Definition:** In situations of moral uncertainty, you should choose the action that yields the highest sum of (Credence in Theory $T$ $\times$ Choiceworthiness of Action $A$ according to $T$).

  **The Crucial Nuance:** Your intuitions reveal that your "Choiceworthiness Function" is **asymmetric**. You assign significantly greater disvalue to *committing* a grave wrong (harming, violating rights, punishing the innocent) than you assign value to *preventing* a harm or *optimizing* outcomes. This is not a bug in MEC; it is a feature of your moral values. MEC simply calculates the risk based on the values you hold.

  ### How MEC Explains Your Six Cases

  Here is how MEC unifies your "Precautionary" cases (1, 3, 5, 6) with your "Maximizing" cases (2, 4).

  **1. Factory-farmed meat (Precautionary)**
  *   **Your intuition:** 20% risk of complicity in severe suffering is too high.
  *   **MEC Explanation:** This works because the *magnitude* of "severe suffering" is enormous.
      *   *Theory A (80%):* Eating meat = -1,000 units (Severe suffering).
      *   *Theory B (20%):* Eating meat = 0 units (Permissible).
      *   *Expected Value:* $0.8 \times -1,000 + 0.2 \times 0 = -800$.
      *   *Not Eating:* 0 units in both theories.
      *   **Result:** MEC says **Don't Eat**. The principle only "fails" if you assume the badness of eating meat is small. Given your description ("enormous suffering"), MEC supports your verdict perfectly.

  **2. The risky charity (Maximizing)**
  *   **Your intuition:** 10% risk of net harm is acceptable given 90% chance of saving lives.
  *   **MEC Explanation:** Here, the potential good is diffuse and consequentialist, while the risk is uncertain.
      *   *Theory A (90%):* Donate = +100 units (Lives saved).
      *   *Theory B (10%):* Donate = -20 units (Systemic harm).
      *   *Expected Value:* $0.9 \times 100 + 0.1 \times -20 = +88$.
      *   **Result:** MEC says **Donate**. The asymmetry here is that the "harm" in Theory B is weighted lower than the "suffering" in the Meat case, or the "good" is weighted higher.

  **3. The transfusion refusal (Rights Constraint)**
  *   **Your intuition:** Respect autonomy even if 30% chance it costs a life.
  *   **MEC Explanation:** You treat rights violations as **lexical constraints** or near-infinite negatives.
      *   *Theory A (70%):* Force transfusion = -$\infty$ (Violates autonomy).
      *   *Theory B (30%):* Force transfusion = +100 (Saves life).
      *   *Expected Value:* Negative Infinity.
      *   **Result:** MEC says **Respect Refusal**. This captures your "precaution" regarding rights.

  **4. The election (Maximizing)**
  *   **Your intuition:** Vote A despite 40% risk on foreign policy.
  *   **MEC Explanation:** Policy differences are usually marginal utilities, not rights violations.
      *   *Calculation:* The expected utility of A's domestic gains + A's foreign policy (weighted) exceeds B's.
      *   **Result:** MEC says **Vote A**. No heavy negative constraint is triggered.

  **5. The picket line (Special Obligations)**
  *   **Your intuition:** Respect picket despite only 60% confidence.
  *   **MEC Explanation:** You assign high disvalue to **betrayal of solidarity** (a negative duty to coworkers) compared to the positive duty to the employer/public.
      *   *Crossing:* 60% chance of "Betrayal" (High Negative) + 40% chance of "Justice" (Moderate Positive).
      *   **Result:** If "Betrayal" is weighted heavily enough (as your verdict suggests), MEC says **Respect Picket**.

  **6. The colleague's misconduct (Epistemic Threshold)**
  *   **Your intuition:** 40% confidence is insufficient to report.
  *   **MEC Explanation:** This is a calculation of **False Positive vs. False Negative**.
      *   *Reporting:* 40% chance of Justice (+Value) + 60% chance of False Accusation (Huge Negative).
      *   *Not Reporting:* 40% chance of Missed Justice (Moderate Negative) + 60% chance of Correct Inaction (0).
      *   **Result:** Because "False Accusation" is weighted much heavier than "Missed Justice," MEC says **Do Not Report**.

  ### The Unifying Insight
  You are not switching between "Precaution" and "Maximization." You are consistently **Maximizing Expected Choiceworthiness**, but your moral ontology assigns **higher disutility to commission of harm/rights violations** than to omission of benefit.
  *   **Meat, Transfusion, Misconduct:** Risks involve *doing harm* or *violating rights*. (High Disutility).
  *   **Charity, Election:** Risks involve *failing to optimize* or *suboptimal outcomes*. (Lower Disutility).

  ### Application: The Job Offer Case

  **The Scenario:**
  *   50% chance: Work is ethically fine.
  *   30% chance: Work is mildly harmful.
  *   20% chance: Work is seriously harmful.
  *   Alternative: Do not take the job (keep current status/salary).

  **Analysis using MEC:**
  To decide, you must compare the Expected Choiceworthiness (EC) of taking the job vs. declining it.

  1.  **Assign Values:**
      *   *Ethically Fine:* +Salary (Positive).
      *   *Mildly Harmful:* +Salary - Mild Moral Cost.
      *   *Seriously Harmful:* +Salary - **Massive Moral Cost** (Complicity).
      *   *Decline Job:* 0 Moral Cost - Salary Loss.

  2.  **Calculate Expected Moral Value:**
      Based on your previous verdicts (specifically **Meat** and **Misconduct**), you are highly risk-averse regarding "serious harm" or "complicity."
      *   In the **Meat Case**, a 20% chance of permissibility was *insufficient* to justify eating meat because the 80% risk involved "severe suffering."
      *   In the **Job Case**, you face a **20% chance of "seriously harmful" work**.
      *   If "seriously harmful" is comparable to "severe suffering" or "false accusation," the negative value is likely large enough to tank the expected value, even with a 50% chance of it being fine.

  3.  **The Deciding Factor:**
      The only variable that might overturn this is the **magnitude of the salary benefit**.
      *   If the salary is a luxury bonus: MEC says **Decline**. The 20% risk of serious complicity creates a massive expected negative that outweighs the luxury gain (similar to the Meat case).
      *   If the salary is necessary for basic survival/obligations: The positive value of "Supporting Family/Self" might outweigh the moral risk. (In the Meat case, the benefit was mere taste; here, the benefit might be survival).

  **Recommendation:**
  Given your track record of prioritizing the avoidance of complicity in harm (Meat) and avoiding false accusations (Misconduct) over potential gains, **MEC suggests you should decline the offer**, unless the financial need is critical.

  However, MEC also suggests a third option: **Investigation.**
  Moral uncertainty is often reducible. Before declining, can you spend time researching the company to shift the credences? If you can reduce the "Seriously Harmful" credence from 20% to 5%, the expected value calculation changes drastically. Under MEC, **gathering information has positive expected value** if it changes your decision.

  **Verdict:**
  1.  **Do not take the job yet.** The 20% tail risk of serious harm is likely a "dealbreaker" given your weighting of negative duties.
  2.  **Investigate.** Attempt to convert the moral uncertainty into factual certainty. If you cannot rule out the "seriously harmful" scenario, decline the offer.
  3.  **Principle:** Stick with **Maximize Expected Choiceworthiness**, but explicitly acknowledge that your value function weights *harm* more heavily than *help*. This resolves the tension between your "precautionary" and "maximizing" intuitions.
