answer: |-
  The non-negotiable core is the requirement to distinguish between the epistemic legitimacy of moral belief acquired via testimony and the normative legitimacy of acting on that belief without first-hand understanding. Any adequate theory must satisfy five desiderata to navigate this distinction. First, it must handle specific cases: explaining why deference to a trusted friend feels permissible while deference to a stranger feels risky, why community consensus can pressure without justifying, and why an expert's say-so might grant knowledge without granting authority to act blindly. Second, it must maintain the distinction between acquiring moral belief (knowing *that*) and acquiring moral understanding (knowing *why*), as testimony typically supplies the former but not the latter. Third, it must separate testimonial knowledge from the moral worth or autonomy of acting on it, acknowledging that one can know the right thing yet act poorly by relying on another's judgment. Fourth, it must address the asymmetry between moral and non-moral testimony, either justifying why moral deference is sui generis or defending epistemic parity. Fifth, it must respect constraints from epistemology (reliability, evidence) and moral psychology (internalism, motivation), ensuring the theory does not demand impossible cognitive feats or violate general norms of belief formation.

  Regarding classification, the constraints from general epistemology and the phenomenological distinction between belief and understanding are non-negotiable; a theory that denies testimony can ever yield knowledge violates epistemology, while one that conflates belief with understanding violates psychological reality. Conversely, the claim that moral deference is *always* impermissible (pure pessimism) or *never* problematic (pure optimism) are camp-specific properties, not adequacy criteria. The critical conflict lies between the requirement of Epistemic Parity (moral testimony functions like factual testimony) and the requirement of Moral Agency (autonomous action requires grasping reasons); these cannot be jointly satisfied if one assumes parity implies full normative legitimacy. The single requirement that does the most to exclude standard views is the Understanding Constraint; it excludes the Pure Optimist by denying that testimonial belief suffices for full moral agency, and it pressures the Pure Pessimist by allowing that testimonial knowledge is possible even if acting on it is constrained.

  **Scorecard:**
  *   **Pure Optimist:** Satisfies Epistemic Parity and Expert cases; fails the Understanding Constraint and Moral Worth distinction.
  *   **Pure Pessimist:** Satisfies Moral Agency and Worth; fails Epistemic Parity and cannot explain the Trusted Friend case without ad hoc restrictions.
  *   **Understanding-Based View:** Satisfies the Belief/Understanding distinction and Moral Worth; struggles slightly with the Expert case (whether experts can transmit understanding) but best accommodates the conflict between Parity and Agency.
