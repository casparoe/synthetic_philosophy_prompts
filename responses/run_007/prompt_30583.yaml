  i keep seeing people talk about hinge propositions in Wittgenstein's On Certainty, and from what i can gather they're the sort of bedrock commitments that make our whole system of beliefs possible but that we can't really justify without already relying on them. that reminds me a lot of maintaining a big legacy codebase at work: there's always some assumption in the build system or the data model that nobody questions, and if you tried to justify it from scratch you'd have to rip half the system out around it. could you compare the two? in particular, where does the analogy break down? i'm a software engineer with no formal philosophy background, so keep it concrete and dont just list books. please write the answer in British English.
