  2.  **Deconstruct "Hinge Propositions" (Wittgenstein):**
      *   What are they? Certainties that are not known but acted upon. They are the "hinges" on which our questions and doubts turn.
      *   Examples: "The earth exists," "I have two hands," "Objects don't vanish when unobserved."
      *   Key characteristics:
          *   Non-epistemic: They aren't "known" in the standard sense (justification stops here).
          *   Grammatical/Logical role: They define the rules of the language game, not moves within the game.
          *   Immune to doubt (practically): Doubting them makes meaningful discourse impossible.
          *   Animal/Practical: They are shown in action, not stated as theories.
          *   Historical/Contingent: They can change over time (what was a hinge for Newton might not be for us).

