answer: |-
  Use Galileo's falling bodies (connected weights) to force a logical contradiction in Aristotelian physics, then pivot immediately to sourcing the new knowledge from conceptual restructuring rather than empirical data.

  ### Candidate Examples & Trade-offs
  *   **Galileo's Falling Bodies (Selected):** *Pros:* Physics is intuitive (no calculus needed), the contradiction is stark (heavy+light = slower vs. faster), and it directly targets the "theory vs. world" distinction. *Cons:* Students may dismiss it as "just history" or claim "he actually dropped them," which sidesteps the epistemic question.
  *   **Schrödinger's Cat:** *Reject.* It creates a paradox about interpretation, not a resolution about physical behavior. It relies on quantum formalism students don't have, leading them to focus on "dead/alive" weirdness rather than how the scenario yields knowledge. It suggests TEs generate puzzles, not solutions.
  *   **Einstein's Elevator/Chasing Light:** *Reject.* Requires accepting the constancy of light speed as a premise. For first-years, this looks like "magic premise in, magic conclusion out," obscuring the internal logical work. It risks becoming a physics lesson on relativity rather than an epistemology lesson on reasoning.
  *   **Maxwell's Demon:** *Reject.* Requires robust understanding of entropy and the Second Law. The "knowledge" yielded is about information theory, which is too abstract for a 50-minute intro to the *mechanism* of TEs.

  ### Carrying Example: Galileo's Connected Bodies
  **What it must have:** A clear contradiction derived *strictly* from the opponent's premises (Aristotle: heavier falls faster) without importing new empirical data. It must show that the theory destroys itself.
  **What it must not have:** Reliance on air resistance or real-world messiness. If students bring up vacuum chambers, you lose the "armchair" point.
  **Why not the others:** Schrödinger's Cat is about *interpretation* of existing knowledge, not *generation* of new knowledge from contradiction. Einstein's Elevator relies on *postulates* that feel empirical; Galileo relies on *definitions* of speed and mass that feel logical.

  ### Dependency Map
  1.  **Before the Core Question ("How does this yield knowledge?"):** Students must accept that the TE *does* convince us. You must establish that Aristotelian physics was coherent until this TE exposed an internal inconsistency. They need to see the TE as a *destructive* tool first.
  2.  **The Core Question:** Once they admit the TE refutes Aristotle without a new experiment, ask: "Where did the information come from if not the world?"
  3.  **After the Core Question:** Move to the source. Is it logic? Is it intuition? Is it rearranging concepts? This leads to the "Argument vs. Experiment" debate.
  4.  **Closure:** Apply the mechanism to a new case to test transfer.

  ### 50-Minute Sequence & Misconception Map
  **0:00–0:05: Hook & Premise Setup**
  *   **Action:** State Aristotle's claim: "Heavier bodies fall faster than lighter ones." Ask for a show of hands: "Who thinks this is intuitively plausible?" (Most will admit it feels right).
  *   **Misconception Alert:** *"It's just an intuition pump."*
  *   **Intervention:** Do not let them dismiss Aristotle as "stupid." Emphasize that for 1,000 years, this was "scientific knowledge." The TE isn't pumping intuition; it's trapping a theory.

  **0:05–0:15: Run the Thought Experiment**
  *   **Action:** Walk through the connected bodies scenario. Heavy stone (fast) + Light stone (slow) tied together.
      *   Scenario A: They act as one heavier body → Should fall faster than heavy alone.
      *   Scenario B: Light slows heavy down → Should fall slower than heavy alone.
      *   Contradiction: The same object must fall both faster and slower.
  *   **Misconception Alert:** *"It's an experiment you're too lazy to run."*
  *   **Intervention:** At **0:10**, when a student says "Just drop them," stop. Say: "Galileo knew what dropped stones did. The point isn't to find out *what* happens, but to show Aristotle's *explanation* is impossible. If the logic breaks, the theory breaks, regardless of the drop."

  **0:15–0:25: The Epistemic Pivot**
  *   **Action:** Ask the core question: "You now know Aristotle is wrong. I didn't show you data. I didn't let you touch a weight. Where did that knowledge come from?"
  *   **Misconception Alert:** *"It's just a dressed-up argument."*
  *   **Intervention:** At **0:20**, if they say "It's just logic," push back: "Logic alone tells you 2+2=4. It doesn't tell you how stones fall. Why does this logic touch the physical world?" Force them to see that the TE relies on *physical concepts* (mass, speed) being coherent.

  **0:25–0:40: Mechanism Debate (Conceptual Restructuring)**
  *   **Action:** Guide them to the idea that the TE forces a restructuring of concepts (unity of bodies vs. separate bodies). The knowledge is about the *consistency of our model*, not the world directly.
  *   **Facilitation:** If they get stuck, suggest: "Maybe it teaches us we were defining 'body' wrong."

  **0:40–0:45: Check Question (Mini-Case)**
  *   **Action:** Present this case: *"Imagine a theory says 'All heat is a fluid called Caloric.' A student argues: 'If I compress a sponge full of Caloric, it should get heavier. It doesn't. Therefore Caloric is wrong.' Is this a thought experiment yielding knowledge, or just an argument? Why?"*
  *   **Goal:** Look for answers that identify whether the contradiction is internal to the theory (TE) or relies on external data (Argument/Experiment). The correct take: It's an argument *based on empirical data* (weighing the sponge), not a pure TE like Galileo's. A pure TE would be: "If Caloric is a fluid, pouring it from one cup to another should behave like water... [logical contradiction without weighing]."
  *   **Success Criteria:** They distinguish between "logic exposing theory contradiction" (TE) and "data disproving theory" (Experiment).

  **0:45–0:50: Refusal & Wrap**
  *   **Action:** Explicitly close doors.
  *   **What to Refuse:** "We are not discussing whether Galileo actually dropped things from the Tower of Pisa. That is history, not philosophy. We are also not solving the Norton vs. Brown debate on whether TEs are arguments or intuitions. That is meta-philosophy for year three."
  *   **How to Say It:** "Those are fascinating questions, but answering them requires tools we don't have yet. Today is about the mechanism of *this* tool, not the history of the toolbox."

  ### Confidence Flag & Contingencies
  **Least Confident Element:** The transition at **0:25–0:40** (Mechanism Debate). Science majors often resist the idea that "conceptual consistency" yields "physical knowledge." They may dig in on "Nothing is true until measured."
  **Change if Philosophy Majors:** Skip the physics setup faster. Move straight to the Norton (TEs are arguments) vs. Brown (TEs are Platonic insights) distinction at minute 15. They can handle the meta-theory.
  **Change if Physics Majors:** Swap Galileo for **Einstein's Chasing a Light Beam**. They have the math to see why Maxwell's equations + Galilean relativity create a contradiction without needing the "intuitive" bridge Galileo provides.
  **Scrap Condition:** If during the Hook (0:00–0:05) the class unanimously rejects Aristotle as "obviously wrong" and refuses to engage with the premise that it was once coherent knowledge, the TE loses its force. If this happens, scrap the Galileo plan and switch to **Quantum Tunneling** (how we know particles cross barriers they shouldn't via wave functions alone), though this is riskier for time.
