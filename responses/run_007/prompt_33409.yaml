answer: |-
  Here is the translation of the debate into the vocabulary of systems neuroscience, followed by the residue report and analysis.

  ### The Translation

  **The Argument from Illusion (Common Factor Principle)**
  Let $A_v$ be the high-dimensional population activity vector in the ventral stream (e.g., LO or IT) during a veridical trial with stimulus $S$. Let $A_h$ be the population activity vector during a hallucination trial (induced by stimulation, pathology, or top-down prediction error minimization) where no $S$ is present.

  Psychophysics establishes that for some pairs, the subject's behavioral report is identical; a linear decoder trained on $A_v$ cannot classify $A_h$ above chance (subjective indistinguishability). The Common Factor argument infers that because the readout downstream (e.g., parietal or prefrontal decision circuits) treats $A_v$ and $A_h$ identically, the functional state of the system is type-identical. Therefore, the immediate substrate of perception is the internal activity pattern $A$, not the external stimulus $S$. Perception is fundamentally a relation between the brain and $A$, not the brain and $S$.

  **Disjunctivism**
  Disjunctivism rejects the inference from indistinguishability to type-identity. It posits that the veridical state $V$ and the hallucinatory state $H$ are fundamentally disjoint natural kinds, despite overlapping activity patterns.

  In neuro-vocabulary, $V$ is defined as a state where the population activity $A_v$ is *constitutively locked* to $S$ via the intact feedforward/recursive causal chain (Retina $\to$ LGN $\to$ V1 $\to$ ...). The "percept" is the entire causal system including $S$. $H$ is defined as a state where activity $A_h$ is generated by internal dynamics (noise, top-down priors, electrical stimulation) without the causal anchor to $S$.

  Even if $||A_v - A_h|| \approx 0$ in representational geometry, Disjunctivism claims $V$ and $H$ are distinct because $V$ includes the external relata $S$ as a constituent of the state description, whereas $H$ does not. To classify a state as $V$, you must reference the causal history and the external world; to classify it as $H$, you reference only internal dynamics. Therefore, there is no "common factor" $A$ that constitutes the percept; there is only the disjunction: either the system is in a world-involving state $V$, or it is in an internal-simulation state $H$.

  ***

  ### Residue Report

  **1. What Translates Cleanly**
  *   **Indistinguishability:** This maps perfectly to decoding error rates or $d' = 0$ in a psychophysical task. If a downstream area cannot discriminate the source of the activity, the "subjective" experience is operationally identical.
  *   **Causal Etiology:** Neuroscience distinguishes clearly between bottom-up driven activity (stimulus-locked) and top-down/spontaneous activity (default mode, imagery, hallucination). The distinction between "driven by photon flux" and "driven by feedback from PFC" is robust.
  *   **The Skeptical Problem:** The practical difficulty of distinguishing $V$ from $H$ in a single trial without access to the ground truth stimulus is a standard signal detection problem.

  **2. What Gets Distorted**
  *   **Constitution vs. Causation:** Disjunctivism claims the object *constitutes* the experience. Neuroscience views the object as a *cause* of the activity. In neuro, the state is fully described by the activity $A$ and the synaptic weights $W$. The external object $S$ is a parameter in the environment, not a variable in the state vector. Translating "constitution" to "causal history" weakens the disjunctivist claim from an ontological identity to a historical lineage.
  *   **Natural Kinds:** Neuroscience assumes that if two states have identical firing rates, synaptic conductances, and oscillatory profiles, they are the same state type (multiple realizability notwithstanding). Disjunctivism insists they are different *kinds* even if the local physical properties match. This forces a non-standard definition of "state" that includes external variables, which looks like a category error from a methodological naturalist perspective.

  **3. What Has No Expression (The Vanishing Residue)**
  *   **The "Object" in the Head:** The Naive Realist core of Disjunctivism—that the dagger itself is literally a part of the mental episode—has no neuro correlate. Neurons represent; they do not contain. The closest analog is a causal link, but a link is not a constituent.
  *   **Epistemic Privilege:** Disjunctivism is often motivated by preserving the idea that veridical perception provides a kind of knowledge (factive) that hallucination cannot. Neuroscience describes information transmission (mutual information), not factive knowledge. A spike train carries bits regardless of whether the source was a photon or noise. The normative status of the signal vanishes in the translation.

  ***

  ### Analysis of the Gap

  The residue that fails to translate suggests the dispute is not about mechanism, but about **ontology and epistemology**.

  Neuroscience operates under a methodological assumption akin to the Common Factor Principle: if the physical substrate ($A$) is identical, the state is identical. This is necessary for a closed physical explanation. If you have to check the external world to define the internal state, you break the causal closure of the physical domain.

  Disjunctivism, however, is not trying to solve a mechanistic problem; it is trying to solve a skeptical one. It wants to preserve the intuition that when you see realy, you are in a *better* position than when you hallucinate, not just a causally different one. It wants "seeing" to be a success verb.

  The stuff that doesn't translate isn't missing because neuroscience is incomplete; it's missing because neuroscience describes *how* the system processes information, while Disjunctivism is trying to legislate *what counts* as a successful relation to the world. The "common factor" in neuro is the activation manifold; the "common factor" in philosophy is the mental kind. Disjunctivists deny the mental kind is defined by the manifold alone.

  Consequently, the debate looks substantive in philosophy because it protects the normative status of perception, but it looks terminological (or even misguided) in neuroscience because it asks the physical description to carry metaphysical weight (constitution) that physical descriptions do not bear.

  Disjunctivism safeguards the epistemic privilege of veridical perception by positing a metaphysical distinction that naturalistic neuroscience, which identifies states by activity patterns rather than causal history, cannot encode.
