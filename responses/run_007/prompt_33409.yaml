  2.  **Deconstruct the Philosophical Debate:**
      *   **Argument from Illusion/Hallucination (Common Factor Principle):**
          *   Premise: Veridical perception ($V$) and Hallucination ($H$) can be subjectively indistinguishable.
          *   Inference: Therefore, $V$ and $H$ share a common mental state/component ($C$).
          *   Conclusion: The immediate object of awareness is $C$ (sense-data/representation), not the external object directly.
      *   **Disjunctivism:**
          *   Claim: $V$ and $H$ are fundamentally different kinds of states.
          *   Structure: Either one sees $X$ (veridical) OR one seems to see $X$ (hallucination). No common *fundamental* nature.
          *   Metaphysics: In $V$, the object is constitutive of the experience. In $H$, it is not. Indistinguishability does not imply identity of nature.

  3.  **Translate to Neuroscience Vocabulary:**
      *   *Need to map mental states to neural states.*
      *   **Common Factor View:** Indistinguishability implies identical (or sufficiently similar) neural activation patterns in the relevant readout areas (e.g., LO, IT, or downstream decision areas). If $fMRI$ pattern $P_v \approx P_h$, then the underlying mechanism is the same type. The "experience" is the activity in this population.
      *   **Disjunctivist View:** Even if $P_v \approx P_h$ (locally), the *etiology* and *constitutive basis* differ.
          *   Veridical: Activity is causally locked to external stimulus $S$ via retina $\to$ LGN $\to$ V1 $\to$ ... The state is *relational*.
          *   Hallucination: Activity is generated internally (top-down, noise, pathology). The state is *non-relational*.
          *   Crucial Disjunctive Claim: The veridical state *includes* the causal link to $S$ as part of its identity. You can't define the veridical state without referencing $S$.

  4.  **Drafting the Restatement (Iterative Process):**
      *   *Attempt 1 (Mental):* Common factor says if the IT cortex fires the same, it's the same state. Disjunctivists say if the firing is caused by light vs. caused by memory, it's a different state.
      *   *Refinement (More technical):* Use population vectors. Let $R_v$ be the population response in ventral stream during veridical viewing. Let $R_h$ be the response during hallucination.
      *   *Common Factor:* If a linear decoder trained on $R_v$ works on $R_h$, they share a common representational format. The "percept" is the activity pattern itself.
      *   *Disjunctivism:* The veridical percept is the *system being in state $R_v$ caused by stimulus $S$*. The hallucination is *system in state $R_h$ caused by internal noise $N$*. Even if $R_v \approx R_h$, the state definition includes the causal history.
      *   *Problem:* Neuroscience usually defines states by activity, not causal history (except in learning rules). This is where the friction lies.

  5.  **Developing the Residue Report:**
      *   **Translates Cleanly:** The distinction between bottom-up (feedforward) and top-down (recurrent/predictive) generation of activity. The indistinguishability maps to decoding error rates.
      *   **Distorted:** The metaphysical "constitution" vs. "causation." Neuroscience talks about causal mechanisms, but Disjunctivism talks about ontological constitution.
      *   **No Expression:** The "naive realist" claim that the *object itself* is part of the mental state. In neuro, the object is external; the state is internal. The "relation" is causal, not constitutive.

  6.  **Analyzing the "Missing" Stuff:**
      *   Is neuroscience missing something? Or is philosophy spinning wheels?
      *   *Hypothesis:* Disjunctivism is trying to protect the *normative* status of perception (knowledge of the world) from the *skeptical* threat of hallucination. Neuroscience describes mechanisms, not epistemic status.
      *   *Verdict:* The debate is largely about epistemology and metaphysics, not mechanism. Neuroscience assumes methodological naturalism (same effects $\to$ same causes). Disjunctivism denies this inference for mental kinds. So, the "missing" part is the *normative/epistemic* layer, not a physical one.

