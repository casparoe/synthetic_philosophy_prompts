answer: |-
  You have hit on exactly the right pressure points. Sections 341–343 of *On Certainty* are arguably the core of the book, and the confusion you are experiencing is shared by almost everyone who reads them. The text is aphoristic and resists systematization, which invites projection.

  Here is a breakdown of what is going on in those passages, distinguishing between what is fairly settled in the scholarship and what remains hotly debated.

  ### 1. "Logic" vs. Psychology
  To answer your primary question immediately: Wittgenstein is **not** making a psychological claim. He is making a grammatical (or logical) claim.

  In the later Wittgenstein, "logic" rarely means formal deductive logic (like the *Tractatus*). Instead, it refers to the **grammar of our language-games**. It is an investigation into what makes sense to say within a specific practice.

  When he writes in §342 that "It belongs to the logic of our scientific investigations that certain things are in deed not doubted," he is saying that the *practice* of science (or any inquiry) has rules. One of those rules is that you cannot doubt everything at once. This isn't because our brains are too tired or because we lack time (§343 explicitly rejects the "practical limitation" reading). It is because the concept of "doubt" logically requires a background of "certainty" to function.

  **The Consensus:** There is near-unanimous agreement in the secondary literature that this is **not a psychological limitation**. Wittgenstein is not saying, "Humans are cognitively incapable of doubting the existence of the external world." He is saying, "If you doubt the existence of the external world, you have removed the scaffolding that gives the word 'doubt' its meaning."

  **The Interpretive Take:** If you read this as a claim about human cognitive architecture, you are reading Wittgenstein as a naturalist. While some (like Peter Hacker) allow for a naturalistic undercurrent, the dominant "therapeutic" reading insists this is purely conceptual. To treat it as psychology is to miss the point of the hinge metaphor.

  ### 2. "Exempt from Doubt": Cannot vs. Do Not
  This is the trickiest part. When Wittgenstein says hinges are "exempt from doubt," does he mean we *cannot* doubt them, or that we simply *do not*?

  *   **The Weak Reading:** We just happen not to doubt them, but we could if we wanted to.
  *   **The Strong Reading:** It is nonsense to doubt them; the language-game breaks down if you try.

  The text supports a nuanced version of the **Strong Reading**, but with a caveat. Wittgenstein isn't saying the propositions are *necessarily true* in a metaphysical sense (like a logical tautology). He is saying that within the language-game of empirical investigation, these propositions function as rules, not as moveable pieces.

  In §343, he says: "If I want the door to turn, the hinges must stay put."
  *   **The Door:** Our empirical inquiries (testing, doubting, verifying).
  *   **The Hinges:** The certainties that allow the door to move.

  If you try to doubt the hinge *while playing the game*, you aren't playing the game anymore. You aren't "investigating"; you are engaging in something else (perhaps philosophy, or madness). So, it is not that you are physically prevented from uttering the words "I doubt I have hands." It is that uttering those words does not function as a genuine doubt within the system. It lacks the consequences of a real doubt (e.g., you don't start checking your hands, you don't act differently).

  **Settled vs. Contested:**
  *   **Settled:** Hinges are not justified beliefs. You don't have evidence for them. If you tried to prove a hinge (e.g., "I know I have two hands because I can count them"), you would be using the hinge to prove the hinge, which is circular.
  *   **Contested:** Does this make hinges **immune** to truth values? This is the biggest split in the literature.
      *   **Epistemic Readings (e.g., Crispin Wright):** Hinges are propositions that are true, but we have "entitlement" to accept them without evidence. They are a special class of knowledge.
      *   **Non-Epistemic Readings (e.g., Danièle Moyal-Sharrock):** Hinges are not knowledge at all. They are not even propositions in the standard sense. They are *rules* disguised as propositions. To say "I know I have hands" is grammatically different from "I know the cat is on the mat." The former is an expression of a world-picture, not a claim to knowledge.

  *Flagging a Take:* The **Non-Epistemic Reading** (Moyal-Sharrock) is currently the most influential interpretation of *On Certainty*, though not universally accepted. It aligns best with Wittgenstein's insistence that "I know" is misplaced when applied to hinges (§§57–58). If you adopt this reading, hinges are not "true beliefs"; they are the normative standards by which we judge truth and falsity.

  ### 3. Universality vs. Relativism
  You mentioned seeing "wildly different directions" online, specifically regarding relativism. This stems from whether hinges are universal to humans or local to specific communities.

  *   **The Relativist Worry:** If hinges are just the rules of a specific language-game, does that mean a different community could have different hinges (e.g., "The earth is flat" or "Witches exist")? And if so, is rationality relative?
  *   **Wittgenstein's Nuance:** Wittgenstein acknowledges that hinges can change over time (§§96–99, the "riverbed" metaphor). What is a hinge for us (e.g., "The earth has existed for many years") might not have been a hinge for people 500 years ago.
  *   **The Consensus:** Most scholars agree Wittgenstein is **not a radical relativist**. While specific hinges might vary, there is a "common human way of acting" (§§139, 345) that grounds them. We share a biological and practical form of life. We all eat, sleep, avoid pain, and manipulate objects. These shared behaviors anchor the hinges.

  So, when he says "it belongs to the logic of *our* scientific investigations," the "our" refers to a form of life, not just a arbitrary cultural club. You can't just choose different hinges at will; they are forced upon us by how we interact with the world.

  ### 4. Summary of the Scholarly Landscape

  To help you sort the projections from the text, here is a scorecard of the current debate:

  | Question | Consensus View | Contested/Debated |
  | :--- | :--- | :--- |
  | **Is it psychology?** | **No.** It is grammatical/logical. | Some naturalists argue biology constrains the hinges. |
  | **Are hinges knowledge?** | **Generally No.** They are the framework *for* knowledge. | **Epistemic theorists** (Wright) argue they are a special kind of warranted belief. **Non-epistemic theorists** (Moyal-Sharrock) argue they are rule-like and arational. |
  | **Are they true?** | They function as true, but truth isn't the point. | Can a rule be "true"? Or is it just "valid"? |
  | **Are they universal?** | Rooted in shared human "form of life." | How much variation is possible between cultures before communication breaks down? |
  | **Is it Foundationalism?** | **No.** It is not Cartesian foundationalism (hinges aren't justified). | Some call it "non-epistemic foundationalism" or "hinge foundationalism." |

  ### 5. Walking Through 341–343 Specifically

  If you are writing on this or trying to internalize it, here is the step-by-step logical flow Wittgenstein is proposing in those three sections:

  1.  **§341 (The Dependency):** Doubt is not a free-floating mental state. To doubt *X*, you must hold *Y* and *Z* fast. (Example: To doubt if a chemical reaction occurred, you must not doubt that the test tube exists).
  2.  **§342 (The Logical Status):** This isn't an accident. It is part of the *definition* of investigation. An investigation where everything is doubted simultaneously is not an investigation; it is paralysis.
  3.  **§343 (The Rejection of Pragmatism):** Don't think this is just because we are busy. It's not a "time-saving measure." It is a structural requirement. The door *cannot* turn if the hinges move.

  ### A Final Note on Interpretation

  If you want to stick close to the text without importing external epistemology, the safest bet is the **grammatical/therapeutic reading**.

  Wittgenstein is not trying to solve the problem of skepticism by proving the external world exists. He is trying to dissolve the problem by showing that the skeptic's doubt is grammatically idle. When the skeptic says, "But how do you *know* the world exists?", Wittgenstein's answer in *On Certainty* is essentially: "That question looks like a doubt, but it functions like a rule. You aren't actually doubting; you're misusing the word 'know'."

  **Where I depart from the consensus (Flag):**
  Many analytic epistemologists (like Crispin Wright) try to salvage *On Certainty* to save traditional epistemology, arguing that we have a "warrant" for hinges. I find this risks turning Wittgenstein back into the kind of theorist he was criticizing. The text works best if you read it as a **dissolution of epistemology** rather than a new branch of it. Hinges aren't "super-knowledge"; they are the silence against which speech happens. If you treat them as objects of study, you've already missed the point.

  **Recommendation for Further Reading:**
  *   **For the Non-Epistemic Reading:** Danièle Moyal-Sharrock, *Understanding Wittgenstein's On Certainty*. (This is the heavy hitter on hinges).
  *   **For the Epistemic/Entitlement Reading:** Crispin Wright, "Facts and Certainty."
  *   **For a General Overview:** Avrum Stroll, *Moore and Wittgenstein on Certainty*. (A bit older, but very clear on the hinge metaphor).

  If you keep the "grammar vs. psychology" distinction sharp, you will avoid 90% of the common misreadings of these sections.
