answer: |-
  **The Forum Arena, Los Angeles. Late Night, 1972.**

  The crowd spills out into the cool California night, a slow-moving river of wool coats and cigarette smoke. The roar of the game is fading, replaced by the hum of traffic and the clatter of metal turnstiles. Two men walk against the flow, briefcases in hand.

  **Robert:** (Gesturing back toward the box office) Two hundred and fifty thousand dollars. That's what they say he made tonight. Just for showing up.

  **John:** A staggering sum. Though I suspect the tax man will claim a significant portion before Wilt sees it.

  **Robert:** Ah, there it is. The knife in the dark. You admit the starting point was just, don't you? At the beginning of the season, we assumed the distribution of wealth in society was fair. Let's call it D1. Everyone had their share, whatever your favorite pattern dictates—equality, need, merit.

  **John:** I'll grant you D1 for the sake of the argument. It's a useful heuristic.

  **Robert:** It's more than useful; it's fatal to your position. Because look at what happened. Hundreds of thousands of fans, including you and me, voluntarily deposited twenty-five cents into Wilt's box. We wanted to see him play. He wanted to play. The money moved from D1 to D2. Now Wilt has much more than anyone else. The pattern is broken. To restore your pattern, you have to interfere. You have to take that money back.

  **John:** You're moving too fast, Robert. You treat the transaction as if it happened in a vacuum. You say the transfers were voluntary. But were they?

  **Robert:** Nobody held a gun to our heads. I chose to keep my quarter. You chose to give yours up.

  **John:** Voluntariness isn't just the absence of a gun at the moment of exchange. It presupposes just background conditions. If I'm desperate, if the healthcare system is broken, if my children's school is crumbling because of underfunding, my "choice" to spend a quarter on entertainment is constrained in ways your theory ignores. But more importantly, you assume D1 can exist without ongoing maintenance.

  **Robert:** That's the point! Maintenance *is* interference. To keep the pattern fixed, you have to stop people from doing what they want with what they have. If I own my quarter, why can't I give it to Wilt?

  **John:** Because ownership isn't absolute. It's a bundle of rights defined by social institutions. We allow the exchange, Robert. We don't prohibit the game. We don't forbid the fans from paying. We simply say that after the game, the society has a claim on a portion of that income to ensure the background conditions remain just for the next season. That isn't undoing the choice; it's framing it.

  **Robert:** Framing it? It's negating it. If the state takes the earnings Wilt generated through his labor and his talent, they are claiming a part of his time. They are claiming a part of *us*. If I work an hour and the state takes the wage, they effectively own an hour of my life. That is forced labor, John. You say you don't prohibit the exchange, but by taxing the result to fit a pattern, you make the participants partial slaves of the collective end-state.

  **John:** That's hyperbolic. Taxation is not slavery. It's the subscription fee for civilization. Wilt didn't become rich in a void. He became rich because there is a league, a stadium, police to keep the peace, roads for the fans to drive on, and a culture that values basketball. Society built the stage. Society is entitled to a share of the ticket sales.

  **Robert:** But your principle isn't about funding public goods. It's about *pattern*. If Wilt made ten million, and your pattern says no one should have more than five, you take the rest not to build roads, but to ensure the snapshot looks equal. You are treating people's talents as common assets. You're saying Wilt doesn't really own his jump hook; the collective does.

  **John:** I'm saying that natural talents are morally arbitrary. Why should Wilt be rewarded simply because he was born tall?

  **Robert:** Why should anyone be punished because they were born with something others want? Look, let's strip it down. You claim liberty and pattern can coexist if we just tax afterwards. But imagine I want to give my money to a political cause, or a church, or a lover. If those transfers upset your pattern, you tax them back. Eventually, you aren't just taxing Wilt's luxury; you're taxing the exercise of preference itself. You have to continuously intervene in people's lives to stop the pattern from eroding. Liberty upsets patterns. Always.

  **John:** Liberty upsets *arithmetic*, Robert. Not justice. You treat the initial distribution as a one-time event. But justice is dynamic. If the accumulation of wealth by Wilt begins to distort the political process, or allows him to buy up the housing market so others can't live near the arena, then the liberty of the fans is diminished. Their "voluntary" choice next year is made under duress of inequality.

  **Robert:** So you protect liberty by restricting liberty?

  **John:** I protect the *worth* of liberty. A right is useless if you lack the capacity to exercise it. By maintaining a distributional floor and ceiling, we ensure that the fans' quarter actually means something. We ensure they aren't just serfs paying tribute to a lord.

  **Robert:** But you're assuming the lordship is the problem. I'm saying the serfdom is the problem. If you have the right to dispose of your resources, and Wilt has the right to dispose of his services, the resulting distribution is just by definition. It's a historical entitlement. You're obsessed with the end-state. You look at the pile of money and say "that looks wrong." I look at the process and say "that looked free."

  **John:** And I look at the process and ask: "Was the playing field level?" Your theory assumes that if the transaction is free, the history is clean. But history is messy. Past injustices linger. If D1 was achieved through theft, discrimination, or monopoly, then your "entitlement" is just laundering stolen goods.

  **Robert:** Fine. Rectify past injustices. Nozick allows for that. But once rectified, once we have a just starting point, you cannot impose a pattern without violating rights. You keep coming back to the background conditions. I'm telling you that the background condition *is* the right of self-ownership. Anything else is a violation.

  **John:** Self-ownership doesn't exist in a state of nature. It exists within a legal framework. We are debating the design of that framework. I'm arguing that a framework which allows unlimited accumulation undermines the very autonomy you claim to cherish. If Wilt owns the arena, the team, and the media rights, the fans aren't choosing freely; they are consuming what he allows them to consume.

  **Robert:** So to save them from themselves, you take the money.

  **John:** To save the system from collapsing into oligarchy, we redistribute the surplus. It's not about envy, Robert. It's about stability. Your system leads to a point where the rich can buy the rules of the game. Then D1 never happens again.

  **Robert:** And your system leads to a point where the state must watch every wallet, every gift, every bet, to ensure the pattern holds. You need a bureaucracy of envy. I'd rather risk the oligarch. At least with me, he has to convince people to give him their quarters. With you, he just has to convince the bureaucrats.

  **John:** (Stops walking, turning to face Robert) It's not about bureaucrats. It's about reciprocity. We cooperate to produce social wealth. Wilt's wealth is a product of social cooperation. We have a right to decide how the fruits of that cooperation are shared.

  **Robert:** (Stops as well, lighting a cigarette) And I say the fruit belongs to the tree. If you pick it, you're stealing.

  They stand on the sidewalk for a moment, the smoke drifting between them. A bus rumbles past, shaking the pavement.

  **John:** You know, Wilt probably doesn't care about our theory. He'll spend the money either way.

  **Robert:** That's the beauty of it. Justice isn't about where the money ends up. It's about how it got there.

  **John:** And I maintain that without a destination in mind, the journey is just chaos.

  **Robert:** (Exhales smoke) Or it's freedom.

  **John:** Or it's anarchy.

  They turn and continue walking toward the parking lot, the silence between them heavier than the crowd they left behind. The streetlights flicker on, casting long, uneven shadows on the pavement.
