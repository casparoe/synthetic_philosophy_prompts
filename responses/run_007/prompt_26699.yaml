answer: |-
  The hum of the MRI console's cooling system was the only sound in the lab, a low drone beneath the silence of two people staring at a monitor. The screen glowed with a statistical parametric map, blobs of orange and yellow overlaid on a grayscale brain, centered on the ventromedial prefrontal cortex.

  Elena leaned back, rubbing her temples. "Look at that activation cluster, Marcus. It's a vector in a high-dimensional state space. It's a pattern of synaptic weights firing in a specific temporal sequence. There is no 'belief' in there. There's just neurochemistry obeying physical laws."

  Marcus swirled the dregs of his cold coffee. "And yet, that pattern occurred because the subject *believed* the blue card would yield a reward and *desired* to maximize their earnings. If you delete those terms, you lose the ability to explain why *this* pattern occurred instead of the one associated with risk aversion."

  "That's the first illusion," Elena said, tapping the glass. "Folk psychology claims to explain behavior, but look at its track record. For five thousand years, we've used 'belief' and 'desire' to predict each other, yet we have zero consensus on what they are, how they interact, or why they fail. We can't explain mental illness, we can't explain creativity, and we can't explain learning rates. A theory that stagnant isn't a precursor to neuroscience; it's a competitor that's losing."

  Marcus shook his head. "You're conflating theoretical stagnation with explanatory autonomy. Folk psychology isn't stagnant; it's robust. It works across wildly different neural implementations. I can attribute a belief to you, to a bird, or potentially to an AI, without knowing the substrate. The fact that it abstracts away from the biology is a feature, not a bug. Heat was reduced to molecular motion, yes, but we didn't eliminate heat. We just found out what it *was*. Belief is a functional state realized by neural activity. You're confusing the implementation with the computation."

  "But heat maps cleanly onto kinetic energy," Elena countered, her voice sharpening. "There is an isomorphism. The ontology of the old theory matched the ontology of the new. With belief, there is no match. Folk psychology posits discrete, sentence-like states with propositional content. 'I believe that P.' But look at this scan." She gestured to the diffuse orange bloom spreading across the cortex. "Neural representation is distributed, superpositional, and analog. There is no sentence in the head. There are no discrete boundaries where one belief ends and another begins. You can't reduce a sentence to a vector field. You have to eliminate the sentence to understand the field."

  "Fine," Marcus said, leaning forward. "Let's grant the neuroscience is messier than the folk terms. But here's the trap you can't escape, Elena. You just argued that I should *believe* your argument. You claim it is *true* that beliefs don't exist. If your eliminativism is correct, then you don't hold beliefs, and I don't hold beliefs. So, why are we arguing? You're using the very framework you're trying to destroy to convince me to destroy it. It's pragmatically self-refuting."

  Elena smiled, a tired, knowing expression. "It's the classic objection. 'You can't state eliminativism without presupposing beliefs.' But I'm not presupposing them; I'm using the transitional vocabulary of a dying paradigm to point toward the new one. When I say 'I believe eliminativism is true,' I am shorthand for 'My neural circuitry is currently configured in a way that disposes me to assert eliminativism.' I'm speaking your language to explain why you won't need it soon. It's like a relativist saying 'It is true that there is no absolute truth.' They aren't contradicting themselves; they are using the old framework to describe the limits of the old framework."

  "That's a dodge," Marcus pressed. "Because if you're just 'disposed to assert,' then there's no normative force. You aren't asking me to accept a *truth*; you're asking me to be causally manipulated by your speech sounds. If there are no beliefs, there are no reasons. And if there are no reasons, science collapses into mere causal conditioning. You can't do science without the normative space of reasons."

  "Science doesn't need reasons; it needs causes," Elena shot back. "But let's go back to your reduction point. You said belief is like heat. But imagine if we discovered that 'heat' wasn't molecular motion, but actually a fluid that didn't exist, and our sensation of heat was just nerve stimulation. We wouldn't reduce heat; we'd eliminate it. Folk psychology posits a 'Language of Thought.' If the brain doesn't use a language—if it uses connectionist weightings—then the posits of folk psychology refer to nothing. It's not that we found out what belief *is*; it's that we found out there *is* no such thing. You're trying to save the furniture by rearranging the rooms, but I'm telling you the house is built on sand."

  Marcus looked back at the screen, at the bright yellow cluster indicating the decision point. "And I'm telling you that the 'sand' is organizing itself into structures that function exactly like furniture. If I can predict your behavior with perfect accuracy using belief-desire talk, then those states are causally efficacious. Whether they look like sentences or vectors at the micro-level is irrelevant. The higher-level pattern is real."

  "The pattern is real," Elena conceded softly. "The ontology is not."

  They sat in silence for a moment, the scan glowing between them, one seeing a map of meaningful intentions, the other seeing a machine code that rendered intentions obsolete.

  The divide remains absolute: whether the success of our social predictions confirms the existence of the states we use to make them, or merely demonstrates the evolutionary utility of a heuristic that will vanish when the circuitry is fully mapped.
