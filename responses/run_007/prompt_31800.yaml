  ok so ive been trying to wrap my head around the two envelope paradox and i think i get the math but its left me with a bigger problem. the setup: two envelopes, one has twice the money of the other. you pick one at random, open it, see some amount X. now the other envelope has either X/2 or 2X, each equally likely because you picked randomly. so expected value of switching is 0.5(X/2) + 0.5(2X) = 1.25X. you should switch. but then youd want to switch even before opening — the symmetry means you cant gain by switching. so the argument must be wrong somewhere. but heres the thing: everyone i ask says the math is wrong somehow (improper prior, or the distribution of possible amounts, or whatever) but nobody can explain it to me in a way that doesnt feel like a technical dodge. and its made me wonder: isnt the real lesson here that expected value reasoning is fundamentally broken? like, if a perfectly symmetrical situation can generate a proof that you should switch, doesnt that show that maximizing expected utility leads to contradictions, and we should be using a different decision rule entirely? what am i missing? (and please answer in american english)
