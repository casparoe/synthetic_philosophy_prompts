answer: |-
  This is a classic "reverse-engineering the black box" problem. You have input/output data (choices) and you're trying to infer the underlying function (decision rule).

  Here is the breakdown of the rules that fit your friend's data, their predictions for your new pair, and how to distinguish them.

  ### 1. The Profile: What the Data Says
  Your friend exhibits the **Common Consequence Effect** (the Allais Paradox).
  *   **When Certainty is on the table:** She sacrifices Expected Value (EV) to eliminate risk (Pairs 1 & 3).
  *   **When Certainty is off the table:** She maximizes EV (Pairs 2 & 4).

  This behavior violates the Independence Axiom of Expected Utility Theory. It implies her decision function is not linear in probabilities. Here are the three candidate rules that fit her past four choices perfectly.

  #### Rule A: Lexicographic Safety (The "Dumber" Rule)
  *   **Logic:** A two-step short-circuit evaluation.
      1.  Compare the **worst possible outcome** of each option. Pick the one with the higher minimum (Maximin).
      2.  If the worst outcomes are identical (e.g., both can yield $0), fall back to **Expected Value**.
  *   **Fit to Data:** Perfect.
      *   Pairs 1 & 3: Sure thing worst-case ($100/$300) > Risky worst-case ($0). Picks Sure.
      *   Pairs 2 & 4: Both worst-cases are $0. Tie. Checks EV. Picks Higher EV.
  *   **Computational Cost:** Very low. Requires finding `min()` and one `sum()`.

  #### Rule B: Prospect Theory (Probability Weighting)
  *   **Logic:** Humans overweight certainty (the jump from 99% to 100% feels larger than 89% to 90%) and underweight high probabilities.
  *   **Fit to Data:** Perfect. This is the standard academic explanation for the Allais Paradox. The "Certainty Effect" explains why she takes the sure thing in 1 & 3, but the weighting function normalizes in 2 & 4 where no outcome is certain.
  *   **Computational Cost:** High. Requires applying a non-linear weighting function $w(p)$ to every probability.

  #### Rule C: Anticipated Regret Minimization
  *   **Logic:** She chooses the option that minimizes the expected feeling of "I should have picked the other one."
  *   **Fit to Data:** Perfect.
      *   Pair 1: If she picks Risky and gets $0, regret is massive (she could have had $100).
      *   Pair 2: If she picks either and gets $0, regret is low (both carried that risk). She focuses on the upside.
  *   **Computational Cost:** Medium. Requires comparing outcomes across states.

  ---

  ### 2. Prediction for the New Pair
  **The Choice:** **$80 for sure** vs. **60% $120 / 40% $70**.
  *   **EV (Sure):** $80
  *   **EV (Risky):** $100 ($72 + $28)
  *   **Risk Premium:** The risky option offers +$20 EV.

  Here is where the rules diverge:

  | Rule | Prediction | Reasoning |
  | :--- | :--- | :--- |
  | **Lexicographic Safety** | **$80 Sure** | Worst case of Sure ($80) > Worst case of Risky ($70). Short-circuit triggers. EV is never calculated. |
  | **Prospect Theory** | **Risky** | The "Certainty Effect" is strongest when the alternative involves **ruin ($0)**. Since the risky floor is $70, the weighting function likely won't overcome the 25% EV advantage. |
  | **Regret Minimization** | **Risky** | Regret of missing the $120 upside (if you took the $80) outweighs the regret of getting $70 instead of $80. |

  **The Split:** It is **Lexicographic Safety** vs. **Everyone Else**.
  If she picks the **Sure $80**, she is likely running a hard Minimax heuristic. If she picks the **Risky** option, she is sensitive to the *magnitude* of the downside, not just its existence.

  ---

  ### 3. The Discriminating Test
  To distinguish between **Lexicographic Safety** (any downside is bad) and **Prospect Theory/Regret** (only *significant* or *zero* downside is bad), you need to test if the "Safety Switch" is binary or analog.

  **Proposed Pair:**
  *   **Option A:** $80 for sure.
  *   **Option B:** 90% chance of $90, 10% chance of $79.

  **Why this works:**
  *   **EV:** Option B ($88.90) is significantly higher than Option A ($80).
  *   **Downside:** The worst case of B ($79) is only $1 less than the sure thing.
  *   **Zero Risk:** Neither option involves $0.

  **Interpretation:**
  *   **If she picks A ($80):** She is running **Lexicographic Safety**. She strictly maximizes the minimum outcome regardless of magnitude. The $1 difference triggers the safety rule.
  *   **If she picks B (Risky):** She is running **Prospect Theory** or a **"Avoid Ruin"** heuristic. She treats $79 and $80 as effectively equivalent (both > $0) and falls back to EV maximization when no ruin is possible.

  ---

  ### 4. My Best Guess & Failure Modes

  **Best Guess:** She will choose the **Risky Option (60% $120 / 40% $70)**.

  **Reasoning:**
  While Lexicographic Safety fits her *past* data perfectly, it is behaviorally brittle. Most people who exhibit the Allais paradox are reacting specifically to the **possibility of zero** (ruin aversion), not to *any* loss. In her previous choices, the "Safe" option protected her from $0. In this new pair, the "Risky" option protects her from $0 (floor is $70).
  I suspect her "Safety Premium" (the EV she is willing to sacrifice for certainty) is context-dependent. She paid ~20 EV to avoid a risk of $0 (Pair 3). She is unlikely to pay 20 EV to avoid a risk of losing only $10.

  **Confidence:** 70%

  **Where I Could Be Wrong (Failure Modes):**
  1.  **Anxiety Heuristic:** If she is generally high-anxiety, the Lexicographic rule might be her genuine cognitive shortcut. It requires less cognitive load than calculating EV. If she's tired or distracted, she defaults to "What's the worst that can happen?"
  2.  **Reference Points:** If she anchors on the $80, the $70 outcome feels like a *loss* of $10, whereas the $120 feels like a gain. Loss aversion (Kahneman) might make her stick with the $80 even if she isn't a strict Minimizer.
  3.  **The "Zero" Boundary:** If her rule is actually "Avoid $0 if possible, otherwise Maximize EV," she will take the Risky option. If her rule is "Maximize Minimum," she will take the Sure thing. My guess relies on the former being more common than the latter.

  **What would change my mind:**
  If she rejects a gamble like **99% $100 / 1% $99** in favor of **$99.50 Sure**. That would prove she is a strict Minimizer regardless of EV or probability weighting, confirming the Lexicographic Safety rule.
