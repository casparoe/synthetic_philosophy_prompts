  ### 1. Two Distinct Principles Consistent with Recorded Choices

  Based on the violation of the Independence Axiom and the specific pattern of choices, here are two principles that fit the data.

  **Principle 1: The Discontinuous Certainty Effect (Lexicographic Safety)**
  *   **Definition:** This principle posits that the probability $p=1$ is psychologically distinct from any probability $p<1$. The decision-maker applies a "certainty premium" that exists *only* when an outcome is guaranteed. Once $p<1$, the certainty premium vanishes, and the decision-maker evaluates gambles using a standard linear or near-linear weighting of probabilities (effectively maximizing Expected Value in this domain).
