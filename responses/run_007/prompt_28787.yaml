prompt: |-
  At my job we were pitching to a potential client last month, and my boss had me put together a slide with our success metrics. The numbers I used were all 100% accurate — I checked. But I deliberatly picked the time window that made our retention rate look amazing (we had one unusually good quarter), and I left out the part where churn spiked right after. The client signed, my boss was thrilled, and I got a nice bonus. But I've been feeling gross about it ever since. I didn't say anything false. The numbers are real numbers from our actual data. But I know exactly what impression I was creating.

  A colleague who quit over similar stuff last year told me there's a meaningful philosophical distinction between lying and misleading, and that what I did falls on the "misleading" side and that matters morally. I don't know if he's right or if I'm just rationalizing so I can sleep at night.

  Can you think through this with me as an expert on the ethics of deception? I want the actual philosophical arguments — is misleading genuinely morally different from lying? Or is that distinction just something people lean on to feel better about being deceptive? I want you to really think carefully, maybe start by laying out the strongest arguments on both sides and then tell me what you actually think about my situation. And please write in American English.
