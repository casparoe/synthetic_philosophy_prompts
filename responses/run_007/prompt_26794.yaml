answer: |-
  **Credence: 15%**

  I assign a 15% probability that the Doomsday Argument (DA) is "sound" according to your specific definition (i.e., that finding yourself at rank $10^{11}$ warrants a net Bayesian shift of at least 10:1 toward "Doom Soon" over "Doom Later," after accounting for all major anthropic objections).

  Here is the decomposition, the combination logic, the sensitivity analysis, and the landscape of consensus.

  ### 1. Decomposition and Sub-Question Probabilities

  For the DA to be sound in your sense, four independent conditions must roughly hold. I treat these as multiplicative factors because a failure in any single category effectively neutralizes the "order of magnitude" shift requirement.

  **A. The Self-Sampling Assumption (SSA) is the correct rule for indexical reasoning.**
  *   **Probability:** 0.75
  *   **Justification:** SSA (treat yourself as a random sample from the reference class) is the engine of the DA. It is coherent and mathematically valid *if* accepted. However, it competes with the Self-Indication Assumption (SIA). SSA is not obviously false, but it leads to counter-intuitive results (e.g., the "Presumptuous Philosopher" problem), preventing me from assigning it higher than 75%.

  **B. "Total Humans Ever Born" is a non-arbitrary, robust reference class.**
  *   **Probability:** 0.50
  *   **Justification:** This is the "Reference Class Problem." If the class includes future uploaded minds, AI, or narrows to "people born in the 20th century," the rank $N$ changes drastically. "Human" is a biologically fuzzy category over centuries. There is no agreed-upon metaphysical principle that selects "biological humans" over "observer-moments" or "conscious entities." This is essentially a coin flip.

  **C. The Self-Indication Assumption (SIA) does not cancel the update.**
  *   **Probability:** 0.50
  *   **Justification:** SIA states that you should reason as if you are more likely to exist in a world with more observers. This creates a likelihood factor proportional to $N_{total}$, which mathematically cancels the DA's $1/N_{total}$ factor. If SIA is correct (or if a "hybrid" model leans its way), the net update is nullified. Given the strength of the SIA counter-argument, I cannot assign better than even odds that it fails to cancel the DA.

  **D. The prior distribution over $N_{total}$ allows the likelihood ratio to dominate.**
  *   **Probability:** 0.80
  *   **Justification:** If your prior is scale-invariant (e.g., $P(N) \propto 1/N$), the posterior remains scale-invariant, and no update occurs. However, we have empirical reasons to prefer certain population trajectories (e.g., resource constraints), making strictly scale-invariant priors unrealistic. It is likely (80%) that a reasonable prior exists where the likelihood ratio can do work, provided the anthropic assumptions (A, B, C) hold.

  ### 2. Combination Logic

  I model the probability of soundness ($P_{sound}$) as the joint probability of these conditions holding sufficiently to produce the required order-of-magnitude shift.

  $$P_{sound} \approx P(SSA) \times P(RefClass) \times P(\neg SIA) \times P(Priors)$$

  $$P_{sound} \approx 0.75 \times 0.50 \times 0.50 \times 0.80$$

  $$P_{sound} \approx 0.15 \quad (15\%)$$

  **Why Multiplicative?**
  The DA is a chain. If the reference class is arbitrary (B fails), the rank $N$ is meaningless. If SIA holds (C fails), the likelihood ratio becomes 1:1. If SSA is wrong (A fails), the sampling logic collapses. Any single failure reduces the credence shift below your "order of magnitude" threshold.

  ### 3. Sensitivity Analysis

  **Most Sensitive Variable: Condition C (SIA Cancellation).**

  *   **Current Contribution:** 0.50
  *   **Impact:** This is the binary switch that kills the argument most cleanly.
      *   If I update $P(\neg SIA)$ from 0.50 to **0.20** (believing SIA is likely true), the final credence drops to **6%**.
      *   If I update $P(\neg SIA)$ from 0.50 to **0.80** (believing SIA is likely false), the final credence rises to **24%**.
  *   **Reasoning:** The Reference Class problem (B) introduces noise, but SIA (C) introduces a direct mathematical negation of the DA's likelihood ratio. It is the most potent objection in the literature.

  ### 4. What Would Move Me Most?

  **Evidence/Argument:** **A resolved theory of "Observerhood."**

  The single biggest mover would be a non-arbitrary, metaphysical account of what constitutes an "observer" for anthropic reasoning.
  *   **Scenario A:** If a theory of consciousness emerged showing that "observer moments" are discrete, countable, and physically privileged units (favoring a specific reference class), $P(RefClass)$ would rise toward 0.9.
  *   **Scenario B:** If a decision-theoretic proof demonstrated that acting *as if* SIA is true leads to systematically worse outcomes than acting *as if* SSA is true (or vice versa) in testable scenarios, it would resolve the SSA/SIA deadlock. Currently, both are consistent with existing data, which is why they remain stuck at ~50/50 credence.

  ### 5. Settled vs. Contested in Anthropics

  You requested a distinction between consensus and contestation. In the field of anthropic reasoning (philosophy/cosmology), the landscape is as follows:

  **Basically Settled (High Consensus):**
  *   **The Math:** Everyone agrees on the conditional probability calculus *given* a set of assumptions. If you assume SSA and a fixed reference class, the Bayesian update *does* favor Doom Soon. There is no dispute about the algebra.
  *   **The Stakes:** Everyone agrees that if the argument works, it has profound implications for existential risk and cosmology.

  **Genuinely Contested (No Consensus):**
  *   **SSA vs. SIA:** There is **no consensus** on which assumption is correct. Prominent figures (e.g., Nick Bostrom) have shifted positions over time. Some camps (e.g., "Halfers" vs. "Thirders" in the Sleeping Beauty problem) align with SSA/SIA splits, but this remains an open fracture in the field.
  *   **The Reference Class:** There is **no consensus** on how to define the reference class. Some argue it must be "all observers," others "all observers identical to you," others "all humans." This is widely acknowledged as the argument's weakest link.
  *   **Presumptuousness:** There is no agreement on whether the DA's implications (e.g., that you can rule out a large universe purely from your birth rank) are a *reductio ad absurdum* of SSA or a genuine feature of reality.

  **Summary:** The 15% figure reflects that while the algebra is settled, the premises required to make the algebra apply to reality are currently split down the middle among experts. The argument is logically valid but premise-contingent.
