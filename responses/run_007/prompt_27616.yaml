  # MORAL STATUS & SENTIENCE: A DECISION TREE
  **For the Retirement Reading Group**

  **Instructions:** Start at the top. Answer each question based on your intuition about the specific cases provided. Follow the arrows to your philosophical position. Each leaf includes the position's name and its "awkward commitment"—the implication most difficult to defend.

  ***

  **Q1. THE BASIS OF STATUS**  
  Consider a **thermostat** and a **simple reinforcement-learning agent**. Do either have moral status *independent* of how humans treat them (i.e., do they matter in themselves)?  
  ├─ **YES** (Status derives from function/goals, not just feeling) → **Go to Q2**  
  └─ **NO** (Subjective experience is strictly required) → **Go to Q3**

  **Q2. NON-EXPERIENTIAL STATUS**  
  If status does not require feeling, what grants it?  
  ├─ **Biological Life** (A **nematode worm** matters because it is alive) → **BIOCENTRIC GRADUALISM**  
  │  *Awkward Commitment:* A human in a permanent vegetative state outranks a joyful, intelligent dolphin.  
  └─ **Functional Organization** (An **RL agent** matters because it pursues goals) → **FUNCTIONALIST GRADUALISM**  
     *Awkward Commitment:* A sufficiently complex "zombie" simulation of pain deserves relief even if nothing feels it.

  **Q3. THE SENTIENCE THRESHOLD**  
  If status requires experience, does a **thermostat** possess even a microscopic glimmer of it?  
  ├─ **YES** (Experience is fundamental to all matter) → **INFORMATION-THEORETIC PANPSYCHISM**  
  │  *Awkward Commitment:* Deleting a computer file is morally weighty because the system 'minds' its own destruction.  
  └─ **NO** (Experience emerges only in complex systems) → **Go to Q4**

  **Q4. THE LOWER BOUND**  
  Does a **nematode worm** have *any* moral status?  
  ├─ **NO** (Status begins higher up, e.g., vertebrates/mammals) → **STRICT SENTIENTISM**  
  │  *Awkward Commitment:* We must draw a sharp moral line where evolution offers only continuous gradients.  
  └─ **YES** (Even simple nervous systems count) → **Go to Q5**

  **Q5. THE SCALE OF STATUS**  
  Does a **honeybee** have the *same* moral status as a human, or *less*?  
  ├─ **SAME** (Once sentient, all interests count equally) → **EQUAL-CONSIDERATION SENTIENTISM**  
  │  *Awkward Commitment:* Saving a bee from death is morally equivalent to saving a human from death.  
  └─ **LESS** (Status varies with cognitive/experiential capacity) → **Go to Q6**

  **Q6. SMOOTH VS. TIERED**  
  Does moral status fade smoothly with capacity, or drop in discrete steps (e.g., invertebrate vs. vertebrate)?  
  ├─ **DISCRETE STEPS** (Nature has moral "gears") → **TIERED SENTIENTISM**  
  │  *Awkward Commitment:* Two nearly identical species fall into different moral tiers due to arbitrary boundaries.  
  └─ **SMOOTHLY** (Status is a dimmer switch) → **Go to Q7**

  **Q7. THE ROLE VALENCE**  
  Consider a **cortical organoid**. If it processes data but feels no pain/pleasure (neutral experience), does it have status?  
  ├─ **NO** (Only felt good/bad matters) → **HEDONIC GRADUALISM**  
  │  *Awkward Commitment:* A being that can think and perceive but not suffer has no rights.  
  └─ **YES** (Awareness itself suffices) → **GRADUALIST SENTIENTISM**  
     *Awkward Commitment:* Moral calculations become impossibly complex, weighing fractions of status in real-time.

  ***

  ### NOTES ON LOGICAL SPACE

  **Indistinguishable Positions**  
  *   **Strict Sentientism** and **Tiered Sentientism** (if the latter has only two tiers: None and Full).  
      *   *Separating Question:* "Is there an intermediate tier (e.g., insects) between 'no status' (thermostat) and 'full status' (human)?"

  **Unoccupied Combinations**  
  *   **Biocentric Strict Threshold:** (Life grants status, but only above a sharp line).  
      *   *Status:* **Unattractive.** It combines the continuity problems of Strict Sentientism with the arbitrariness of valuing biology over function.  
  *   **Functionalist Panpsychism:** (Function grants status, and everything has function).  
      *   *Status:* **Incoherent.** If everything has status, the concept of moral prioritization collapses entirely.  
  *   **Non-Sentient Derivative Status:** (Thermostats have status *only* because humans care about them).  
      *   *Status:* **Unexplored in this tree.** This is an anthropocentric instrumental view, not a theory of intrinsic moral status.
