answer: |-
  I thank you for this careful exposition. It is, I must admit, a most ingenious comparison, and one that deserves the fullest consideration. You suggest that just as chemistry has taught us that water *is* H₂O, despite our ability to conceive of one without the other prior to investigation, so too might some future science teach us that goodness *is* some natural property N, identified by its place in the causal order of the world.

  However, I fear there remains a fundamental confusion here regarding the nature of the object we are discussing. When we speak of "water," we speak of a complex substance existing in time and space, which acts upon our senses and which may be analysed into constituent parts. It is entirely consistent that we should refer to this substance by a common name, "water," and later discover by empirical investigation that its internal constitution is H₂O. In that case, the identity is between a macroscopic object and a microscopic structure.

  But when I speak of "good," I am not speaking of a complex object, nor of a structure within the natural world. I am speaking of a simple, indefinable quality. Consider the colour yellow. I can explain to you what things are yellow—sunlight, gold, a canary—but I cannot define "yellow" itself. You must simply see it to know it. Now, a scientist might tell you that yellow *is* light waves of a certain vibration. But I ask you: when you think of the colour yellow itself, are you thinking of light waves? Surely not. You are thinking of the quality itself, which is immediately apprehended.

  Yet, even here, the analogy fails, for yellow is a natural object, part of the subject matter of psychology or physics. "Good" is not. This is the crux of my objection. When you propose that goodness is a natural property, identified by its causal role, you are committing what I have termed the **Naturalistic Fallacy**. You are attempting to define the indefinable.

  You say that the question "Is N good?" is open only until we make the empirical discovery. But I submit to you that no amount of empirical investigation can ever close this question. If I understand clearly what I mean by "good," and I understand clearly what you mean by this natural property N—be it pleasure, or evolutionary fitness, or some causal role—I can always significantly ask: "But is this property N *good*?"

  If "good" and "N" were truly identical, this question would be as trivial as asking "Is N N?" It would be a tautology. Yet, it is not trivial. It is a substantive inquiry. The fact that it remains an open question—that it makes sense to ask it without contradiction—proves that the notion of "good" is distinct from the notion of "N."

  You might reply that this is merely a matter of how we conceive of the properties, not the properties themselves. But I ask you: how do we apprehend moral properties if not by considering what we mean by "good"? If "good" denotes a natural property, then ethics becomes a branch of natural science. It would be the business of the psychologist or the biologist to determine what is good. But this seems to me plainly false. The business of the scientist is to discover what *is* the case, what exists in time and space, and what causes what. The business of the ethicist is to determine what *ought* to be, what is valuable in itself.

  If goodness were a natural property, involved in the causal chain of the universe, it would be one fact among others. But when we say a thing is "good," we are not merely adding another natural fact to the description of the universe; we are attributing a unique, non-natural value to it.

  Therefore, while I grant that your analogy holds for natural kinds like water, it cannot hold for "good." Water is a thing; good is a quality of a unique sort. To identify it with any natural property is to confuse two distinct spheres of inquiry. I remain convinced that "good" is simple, indefinable, and non-natural, and that no empirical discovery can alter the fact that it is always significant to ask whether any given natural thing possesses this unique quality.
