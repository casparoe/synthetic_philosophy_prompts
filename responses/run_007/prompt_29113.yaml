  I'm hoping you can help me figure something out — you're an expert in decision theory and behavioral economics, so maybe you know the answer. Think through this carefully because I've been turning it over in my head for months and I can't tell if I'm onto something or just rehashing an idea everyone already knows.

  I keep noticing a very specific kind of situation and I don't know if it has a name. It goes like this. Two parties get into some kind of contest where both sides have to keep investing resources — money, time, pride, whatever — and at any point either side could walk away, but walking away means losing everything you've put in so far. So neither side walks away. They both keep pouring more in, and the total cost to both sides ends up being way bigger than whatever they were fighting over in the first place.

  The cleanest example I've seen was at a charity event. They auctioned off a $20 bill with a twist: highest bidder pays their bid and gets the $20, but the second-highest bidder also has to pay their bid and gets nothing. Started at $1. Two people got into it. By the time the bidding hit $15, both of them realized they were in trouble — but the person in second place at $14 was staring at losing $14 for nothing, so they bid $16 to try to get the $20 and only be down a net $4 instead of $14. Then the other person, now in second place at $15, had the exact same logic. It went past $20. It went to $35 before someone finally ate the loss. Both of them lost money on a $20 bill, and both of them were being totally reasonable at each individual step. I've seen the same shape outside of auctions. Two departments at my company fought over a budget allocation for almost a year. Each time one side spent political capital making their case, the other side felt they had to match it or else all their previous effort was wasted. By the end, both teams had burned so much time and goodwill that even the "winner" was worse off than if they'd just accepted a 50/50 split on day one. Same thing with a lawsuit between two small businesses I know — both kept litigating because settling would mean admitting all the legal fees so far were a waste, so they just... kept going.

  I know about the sunk cost fallacy, and I can see how it's related. But the sunk cost fallacy is usually about one person's internal decision-making — I keep watching a bad movie because I paid for the ticket, I keep eating a meal I'm full from because it was expensive. What I'm describing feels different because it's the interaction between two parties that creates the trap. Each person's rational attempt to avoid a loss creates a worse loss for the other person, who then does the same thing right back, and now you're both spiraling. It's like the structure of the situation itself is the problem, not just someone's psychology. So here's what I'm asking: is there an established name for this specific phenomenon — the competitive, two-sided version where the escalation is driven by the back-and-forth interaction rather than just by one person's bias? And if there is, how exactly is it different from the sunk cost fallacy? Where do you draw the line? I don't just want a term, I want to understand what makes this thing its own thing, if it even is — what the core mechanism is, what the boundary cases look like, and whether it's considered a different animal or just a special case of something broader.
