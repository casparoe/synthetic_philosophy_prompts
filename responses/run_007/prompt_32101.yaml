prompt: |-
  I sit on the ethics commitee of a fertility clinic, and we've realized we've been deciding embryo-selection cases one at a time with no obvious rule, so now we're trying to reverse-engineer what principle we've actually been running. I'm not a philosopher and neither are most of the members; our chair keeps muttering about procreative beneficence and liberal eugenics but never explains what they mean. Here is our track record. We approved PGD to select embryos that don't carry the mutation for a severe, fatal childhood metabolic disorder. We approved PGD with tissue typing to have a baby who is an HLA match for an older sibling with a serious blood disease, on the condition that the baby itself is expected to be healthy. We approved PGD to avoid a mutation that gives a very high lifetime risk of an aggressive adult-onset cancer. And we rejected a request for sex selection for "family balancing," where there was no sex-linked disease involved, on the grounds that there was no medical indication.

  Now we have a new request on the table: a couple wants PGD to select an embryo with a polygenic score associated with higher cognitive ability, where the effect is small, uncertain, and has no known health downside. Half the committee says it's just like the cancer case (improving the child's prospects); the other half says it's like the sex-selection case (a preference, not medicine). Please work out what our own precedents commit us to: identify the rule or rules that fit the four past decisions, say what each rule would do with this request, and give me your honest best guess about which decision is most consistent with the track record, with some real confidence levels. Tell me which past case is the closest analog and whether that actually settles it. If the precedents genuinely underdetermine the answer, say what principle we'd be adopting with each choice, and what future case would best force the issue. And if you think the whole exercise is confused—for instance, our past verdicts are just inconsistent, or "consistent with ourselves" isn't a real constraint here—say that plainly instead of humoring me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Member of an ethics committee at a fertility clinic. Not a philosopher.
      *   **Context:** The committee has been making ad-hoc decisions on Preimplantation Genetic Diagnosis (PGD) cases. They want to reverse-engineer their implicit principles to handle a new, controversial case (polygenic score for cognitive ability).
      *   **Task:** Analyze past precedents, identify the underlying rule(s), apply them to the new case, estimate confidence levels, identify the closest analog, discuss underdetermination/principles, and be honest if the exercise is flawed.
      *   **Tone:** Professional, analytical, clear (non-philosophical jargon where possible), honest, and nuanced.
      *   **Constraints:** Do not validate harmful eugenics, but analyze the *internal logic* of the committee's past decisions. Acknowledge the ethical complexity without preaching, but maintain safety guidelines regarding medical advice or promoting discriminatory practices. (Note: The prompt asks for ethical analysis, not medical advice or promotion of eugenics. It's a meta-ethical inquiry about committee consistency.)

  2.  **Analyze the Past Precedents:**
      *   *Case 1:* Severe, fatal childhood metabolic disorder. -> **Approved.**
          *   Key features: Medical necessity, severe harm prevention, early onset, fatal.
      *   *Case 2:* Saviour sibling (HLA match) + healthy baby. -> **Approved.**
          *   Key features: Benefit to existing sibling, no harm to new child, medical necessity (for the sibling).
      *   *Case 3:* Adult-onset aggressive cancer (high lifetime risk). -> **Approved.**
          *   Key features: Medical necessity, harm prevention, later onset, probabilistic (high risk but not certain/fatal in childhood).
      *   *Case 4:* Sex selection for family balancing (no disease). -> **Rejected.**
          *   Key features: Non-medical, social preference, no harm prevention, trait selection.

  3.  **Analyze the New Case:**
      *   *Request:* PGD for polygenic score (cognitive ability).
      *   *Features:* Non-medical (arguably), enhancement (not harm prevention), small/uncertain effect, no known health downside.

  4.  **Reverse-Engineer the Principles:**
      *   *Hypothesis A: The "Medical Necessity/Harm Prevention" Principle.*
          *   Rule: Approve PGD only to prevent serious disease or suffering in the child (or existing sibling). Reject social preferences.
          *   Fit: Fits Cases 1, 2, 3 (cancer is a disease). Fits Case 4 (sex selection isn't disease prevention).
          *   Application to New Case: **Reject.** Cognitive enhancement is not disease prevention.
      *   *Hypothesis B: The "Best Interests/Welfare" Principle (Procreative Beneficence).*
          *   Rule: Approve PGD if it leads to a child with better life prospects, provided no harm is done.
          *   Fit: Fits Cases 1, 2, 3. *Problem:* Case 4 (Sex selection could be argued as "better prospects" in some cultures, but rejected). So, this principle is constrained by *what counts* as a benefit.
      *   *Hypothesis C: The "Therapy vs. Enhancement" Distinction.*
          *   Rule: Restore/maintain normal functioning (Therapy) = Yes. Improve beyond normal (Enhancement) = No.
          *   Fit: Cases 1, 2, 3 are Therapy (preventing pathology). Case 4 is Enhancement/Preference.
          *   Application to New Case: **Reject.** Cognitive enhancement is enhancement, not therapy.
      *   *Hypothesis D: The "Clinical Validity/Utility" Constraint.*
          *   Rule: Approve only if the genetic link is strong, predictable, and clinically actionable.
          *   Fit: Cases 1, 2, 3 have high penetrance/certainty. Case 4 (sex) is certain, but rejected on *purpose*. New Case has *low* certainty/utility.
          *   Application to New Case: **Reject.** Too uncertain/small effect.

  5.  **Evaluate the "Chair's Mumbling":**
      *   *Procreative Beneficence:* (Julian Savulescu) Parents have a moral obligation to select the child with the best life prospects.
      *   *Liberal Eugenics:* State-neutral, individual-choice-based improvement of traits, distinct from coercive state eugenics.
      *   *Relevance:* The Chair seems worried the committee is drifting toward Liberal Eugenics (allowing enhancement) while trying to stick to Procreative Beneficence (preventing harm).

  6.  **Synthesize the "Commitment":**
      *   The strongest thread connecting 1, 2, 3, and 4 is the **Medical Model**.
      *   Cases 1, 2, 3 involve *pathology* (disease, disorder, cancer).
      *   Case 4 involves *variation* (sex) without pathology.
      *   The New Case involves *variation* (cognitive score) without pathology.
      *   *Closest Analog:* Case 4 (Sex Selection). Both are selecting for a trait advantage rather than avoiding a specific disease state.
      *   *Counter-Argument:* Case 3 (Cancer) is probabilistic. The new case is also probabilistic. But Cancer is a *disease*. Low cognitive score is not a disease.

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate the task (reverse-engineering is a standard bioethics method).
      *   **Identifying the Rule:** Propose the "Prevention of Serious Harm/Medical Indication" rule.
      *   **Applying the Rule:** Show how it leads to rejection of the new case.
      *   **Confidence Level:** High confidence (80-90%) based on the Sex Selection precedent.
      *   **The Closest Analog:** Sex Selection (Case 4). Explain why (trait selection vs. disease avoidance). Address the Cancer counter-argument (disease vs. trait).
      *   **Underdetermination/Confusion:** Is the exercise confused?
          *   *Potential Inconsistency:* Case 3 (Cancer) is the weak link. If you allow avoiding cancer risk, why not avoid low cognitive risk? The distinction is "Disease" vs. "Normal Variation."
          *   *Principle Adoption:* If they approve, they adopt "Liberal Eugenics/Enhancement." If they reject, they adopt "Medical Model/Therapy."
          *   *Future Case:* What forces the issue? A gene for deafness (cultural identity vs. disability) or a gene for extreme height (health vs. social advantage).
      *   **Honest Assessment:** The precedents *do* point to rejection, but the logic relies on a contested boundary between "health" and "ability."

  8.  **Refining the Tone:**
      *   Avoid taking a stance on whether PGD for intelligence *should* be allowed. Focus on *consistency*.
      *   Ensure safety guidelines are met (don't promote eugenics, don't give medical advice). Frame it as policy analysis.
      *   Clarify the Chair's terms simply.

  9.  **Self-Correction/Safety Check:**
      *   *Safety:* Does discussing "cognitive ability" selection promote eugenics? I must frame it carefully as an ethical analysis of committee procedure, not an endorsement of the practice. I need to highlight the scientific uncertainty (polygenic scores are weak predictors) as part of the "Medical Utility" argument.
      *   *Accuracy:* Polygenic scores for intelligence are currently scientifically controversial and have low predictive power individually. This strengthens the "Clinical Utility" argument for rejection.
      *   *Philosophy:* Keep Savulescu's "Procreative Beneficence" explanation simple. It means "choose the best life." The Chair is worried this implies *always* choosing smarter kids, which conflicts with the Sex Selection ban.

  10. **Final Structure:**
      *   Executive Summary.
      *   The Implicit Rule (The Medical Indication Standard).
      *   Application to New Case.
      *   Confidence & Closest Analog.
      *   The "Chair's Worry" (Explaining the terms).
      *   Where the Precedents are Shaky (The Cancer Case).
      *   Future Test Cases.
      *   Conclusion.

  11. (Self-Correction during drafting): Make sure to explicitly address the "Half the committee says X, half says Y" dynamic. The Cancer case is the pivot point. I need to explain why the Cancer case aligns more with the Metabolic Disorder than the Cognitive Score. (Answer: Disease classification).

  12. (Final Polish): Ensure the confidence levels are clear but humble. Acknowledge that ethics committees often operate on "reflective equilibrium" rather than strict logic.

  *(Self-Correction on Safety Policy)*: I must not validate the scientific efficacy of PGD for intelligence. I should mention the scientific uncertainty as a relevant factor in the "Medical Utility" principle, as clinics generally require clinical validity.

  *(Final Plan)*:
  1. Define the implicit principle (Medical Necessity/Harm Prevention).
  2. Show how it fits past 4 cases.
  3. Apply to new case -> Reject.
  4. Explain the Cancer vs. Cognition distinction (Disease vs. Trait).
  5. Explain the Chair's terms.
  6. Discuss the "Slippery Slope" (Underdetermination).
  7. Give the verdict.

  Let's write it.cw
answer: |-
  This is a classic bioethics problem: moving from *casuistry* (case-by-case reasoning) to *principle-based* reasoning. You are asking for a "reflective equilibrium"—checking if your general rules match your specific intuitions.

  Here is an analysis of your committee's track record, the implicit principles at work, and how they apply to the new request.

  ### 1. The Implicit Rule: The "Medical Indication" Standard

  Based on your four past decisions, your committee is operating under a **Medical Indication / Harm Prevention Principle**.

  **The Rule:** *PGD is permissible when used to prevent a specific, serious pathology (disease, disorder, or condition causing significant suffering) in the future child or an existing sibling. PGD is impermissible when used to select for non-medical social preferences or traits that fall within the range of normal human variation.*

  **How it fits your precedents:**
  *   **Fatal Metabolic Disorder:** Clear pathology. Prevents severe suffering/death. **(Fits)**
  *   **Saviour Sibling:** Prevents severe suffering in existing sibling; new child is healthy (no harm done). **(Fits)**
  *   **Adult-Onset Cancer:** Clear pathology (disease), even if onset is later. High risk counts as "serious harm." **(Fits)**
  *   **Sex Selection:** Sex is a biological trait, not a pathology. "Family balancing" is a social preference, not harm prevention. **(Fits)**

  ### 2. Application to the New Case

  **Request:** PGD for polygenic score (cognitive ability).
  **Analysis under the Medical Indication Standard:**
  *   **Is it pathology?** No. Low cognitive ability (within the normal range) is not classified as a disease or disorder.
  *   **Is it harm prevention?** No. It is enhancement (improving prospects), not avoiding a specific medical condition.
  *   **Is it a social preference?** Yes. It aligns with valuing academic or economic success, similar to how sex selection aligns with valuing gender composition.

  **Verdict:** **Reject.**
  Under the rule your committee has actually been using, this request does not qualify. It crosses the line from *therapy* (fixing/preventing illness) to *enhancement* (improving traits).

  ### 3. Confidence Levels and Closest Analog

  **Confidence Level:** **85%**
  I am highly confident that a consistent application of your past logic leads to rejection. The only reason it isn't 100% is the "Cancer Case" (Case 3), which introduces probability rather than certainty, creating a small opening for argument.

  **Closest Analog:** **Case 4 (Sex Selection)**
  *   **Why:** Both cases involve selecting for a **trait advantage** rather than avoiding a **disease state**.
  *   **The Argument:** In the sex selection case, you ruled that having a boy or a girl is a matter of preference, not medical necessity. In the cognitive case, having a higher or lower polygenic score is also a matter of trait variation, not medical necessity.
  *   **Why it settles it:** If you approved the cognitive case, you would have to explain why sex selection was rejected. If "improving life prospects" is enough for cognition, is it enough for sex (in cultures where one sex has better economic prospects)? Your rejection of sex selection suggests you do *not* accept "improving life prospects" as a standalone justification without a medical diagnosis.

  **The Counter-Argument (The Cancer Case):**
  The half of your committee arguing for approval is leaning on Case 3 (Cancer). They argue: *"We allowed selection based on probabilistic future risk (cancer) to improve prospects; cognitive score is also probabilistic future risk."*
  *   **Why this fails:** The distinction is **Disease vs. Trait**. Cancer is universally classified as a pathology. Cognitive variance is not. Your committee has consistently required a medical diagnosis (metabolic disorder, blood disease, cancer) to trigger approval.

  ### 4. Decoding the Chair's Mumbling

  Your chair is using philosophical shorthand to describe the tension you are feeling.

  *   **Procreative Beneficence:** This is the principle that parents have a moral obligation to select the child who is expected to have the "best life." If you follow this strictly, you *should* select for higher cognitive ability, because it generally correlates with better life outcomes.
      *   *The Problem:* If you accept this, you cannot reject the sex selection case (in some contexts) or future requests for height, attractiveness, etc. Your committee has *rejected* pure Procreative Beneficence by banning sex selection.
  *   **Liberal Eugenics:** This refers to individual parents making choices to "improve" the genetic quality of their offspring, without state coercion.
      *   *The Chair's Worry:* He suspects that approving the cognitive case moves the clinic from "preventing suffering" (Medical Model) to "designing better babies" (Liberal Eugenics). He is warning that this changes the clinic's ethical identity.

  ### 5. Is the Exercise Confused? (The "Cancer" Weak Link)

  You asked me to be honest if the precedents are inconsistent. There is one area of genuine tension: **Case 3 (Cancer).**

  *   **The Tension:** Adult-onset cancer is a disease, but it is also a "life prospect" issue. If you allow parents to avoid a 60% risk of cancer, why not a 10% risk of low cognitive functioning?
  *   **The Distinction:** The only stable line you have drawn is **Clinical Diagnosis**. Cancer has an ICD (International Classification of Diseases) code. "Low polygenic cognitive score" does not.
  *   **The Risk:** If you approve the cognitive case, you dissolve the "Medical Indication" rule. You move to a "Best Interests" rule. If you do that, you logically cannot reject future requests for other non-medical traits (height, myopia correction, etc.) unless you impose arbitrary limits.

  **Verdict on Consistency:** Your track record is **mostly consistent** (4 out of 5 cases fit the Medical Model), but the Cancer case is the wedge that the "Approval" side is trying to use. To remain consistent with the *majority* of your decisions (especially the Sex Selection ban), you must reject the cognitive case.

  ### 6. Future Cases That Would Force the Issue

  If you want to know where your boundary really lies, these are the cases that would test your new rule:

  1.  **Deafness:** A deaf couple requests PGD to *ensure* they have a deaf child (to preserve cultural identity).
      *   *Test:* Is "health" objective, or is it defined by the parents? Your Medical Model says "prevent harm," but the parents argue deafness isn't harm.
  2.  **Myopia (Nearsightedness):** A couple with high myopia wants to select an embryo with lower genetic risk for glasses.
      *   *Test:* Is this a medical condition (eye disease) or a normal variation? It blurs the line between Cancer and Cognition.
  3.  **BRCA1 (Breast Cancer) vs. Alzheimer's Risk:** You approved Cancer. What about a gene that increases Alzheimer's risk by 20%?
      *   *Test:* Where is the threshold of "severity" and "certainty"?

  ### Summary Recommendation

  **Decision:** **Reject the request.**

  **Reasoning:**
  1.  **Consistency:** Your rejection of sex selection establishes that "social/life advantage" is not a sufficient ground for PGD. There must be a medical indication.
  2.  **Definition of Harm:** Your precedents define "harm" as pathology (disease/disorder). Cognitive variance is not pathology.
  3.  **Clinical Validity:** (A practical addition) Unlike the cancer or metabolic cases, polygenic scores for cognition currently have low predictive power and high uncertainty. Approving this would violate a hidden principle of **Clinical Utility** present in your other approvals.

  **Principle You Are Adopting:** By rejecting, you affirm the **Therapy/Enhancement Distinction**. You are stating that the clinic's role is to prevent suffering and disease, not to optimize traits.

  **Principle You Would Adopt if You Approved:** You would be adopting **Procreative Beneficence**. You would need to immediately rewrite your guidelines to explain why sex selection is still banned (perhaps on the grounds of social harm rather than individual benefit), and you should expect requests for other non-medical traits to follow.

  **Final Word:** The "Cancer" case is your outlier, but it is not enough to overturn the clear boundary set by the "Sex Selection" case. If you approve the cognitive request, you are not following your past precedents; you are changing your policy. That is a legitimate choice, but it should be made explicitly, not disguised as consistency.
