answer: |-
  This is a precise and profound observation. You have identified what is arguably the central tension in intergenerational ethics, often framed as the conflict between **descriptive economics** and **normative philosophy**.

  Your intuition that spatial neutrality is granted while temporal neutrality is denied is correct. In philosophy, this is the debate over **Time Neutrality**. The standard cost-benefit analysis (CBA) framework you worked under is not philosophically neutral; it carries a heavy, often unacknowledged, metaphysical and ethical load.

  Here is the breakdown of the implicit theory, where it is committed, and where it is underdetermined.

  ### 1. The Decomposition: Where the Ethics Hides
  To understand the philosophical commitment, we must decompose the discount rate using the **Ramsey Rule** (Frank Ramsey, 1928), which underpins almost all Treasury guidance (including the UK Green Book):

  $$r = \rho + \eta \cdot g$$

  *   **$r$**: The Social Discount Rate (the ~3% you used).
  *   **$\rho$ (rho)**: **Pure Time Preference.** The rate at which we discount future welfare simply because it occurs in the future.
  *   **$\eta$ (eta)**: **Elasticity of Marginal Utility.** How much the value of an extra unit of consumption declines as people get richer.
  *   **$g$**: **Growth Rate.** Expected increase in per capita consumption.

  **The Philosophical Commitment:**
  The practice is **genuinely committed** to a positive $\rho$ if the guidance explicitly sets a "pure impatience" parameter greater than zero. In many iterations of Treasury guidance, the 3% rate was a composite, often implying a $\rho$ of around 1.5% and an $\eta g$ component of 1.5%.

  *   **If $\rho > 0$:** The theory presupposes **Time-Partiality**. It asserts that the welfare of a person in 2074 is intrinsically less valuable than the welfare of an identical person in 2024, solely due to temporal location. This is the "discrimination" you spotted. Ramsey famously called pure time preference "ethically indefensible and arising merely from the weakness of the imagination."
  *   **If $\rho = 0$:** The theory presupposes **Time Neutrality**. A life is a life, regardless of date.

  **The Reconstruction:**
  Can the practice be reconstructed without pure time preference? **Yes, partially.**
  If the entire 3% is derived from $\eta \cdot g$ (expected growth + diminishing marginal utility), then no pure time preference is required. The logic here is not "future people matter less," but "future people will be richer, so a pound (or a risk reduction) matters less to them."
  *   *Philosophical Status:* This is compatible with moral equality. It treats the discounting as a measurement of *marginal utility*, not *moral worth*.
  *   *The Catch:* This reconstruction fails if $g$ is zero or negative (e.g., in severe climate scenarios). If the future is poorer, $\eta \cdot g$ suggests we should discount *negatively* (value future benefits more). If the Treasury model forces a positive discount rate even when growth is projected to stall, it is reverting to a hidden $\rho$.

  ### 2. The Ontology of the "Person"
  Your comparison of postcode vs. date highlights an ontological asymmetry in how CBA treats persons.

  *   **Space:** CBA assumes a **Simultaneous Ontology**. People in different postcodes exist at the same time. To discriminate between them is to discriminate between existing moral patients.
  *   **Time:** CBA often implicitly relies on a **Presentist** or **Thin Future** ontology. While it acknowledges future people exist, it treats their claims as weaker.

  However, there is a deeper commitment here: **Welfarist Consequentialism.**
  The framework does not value "lives" directly; it values the *utility* derived from consumption or risk reduction associated with those lives.
  *   **The Implicit Theory:** Moral value resides in *experiences* (utility), not *existence*.
  *   **The Conflict:** If you value existence itself (a deontological or rights-based view), discounting a future life is incoherent. If you value utility, discounting is mathematically possible but ethically fraught. The practice assumes the former (Welfarism). It assumes a future death is a loss of *utility*, which can be traded off against present *costs*.

  ### 3. The Shape of the Curve: Exponential vs. Declining
  You asked if the exponential shape matters philosophically. **Yes.**

  *   **Exponential Discounting ($e^{-rt}$):** Implies a constant rate of impatience. It suggests that the moral "distance" between year 0 and year 10 is the same as between year 100 and year 110.
      *   *Philosophical Implication:* This aligns with a constant probability of extinction (if the world ends, no utility) or a constant psychological impatience. It leads to the "tyranny of the present" over very long horizons (e.g., nuclear waste, climate change).
  *   **Declining Discount Rates (Hyperbolic):** (Now adopted in the UK Green Book for long-term projects). The rate drops over time (e.g., 3% for 0-30 years, falling to 1% for 300+ years).
      *   *Philosophical Implication:* This is often justified by **uncertainty** about the future discount rate itself (Weitzman, 1998), not necessarily a change in ethics. However, it functionally admits that pure exponential discounting makes the far future vanish morally.
      *   *Commitment:* Adopting declining rates is an admission that the standard theory breaks down over intergenerational timescales. It is a technical patch to avoid the philosophical conclusion that the distant future counts for nothing, without explicitly abandoning $\rho$.

  ### 4. What Happens if Pure Time Preference is Dropped?
  If you force $\rho = 0$ (as Ramsey and later Parfit argued we should), does CBA survive?

  **The Mathematical Consequence:**
  If $\rho = 0$ and $g$ is low (or negative due to climate damage), the discount rate $r$ approaches zero.
  *   In an infinite horizon model, a discount rate near zero makes the present value of future damages (e.g., permanent coastal loss) **infinite**.
  *   *Result:* The model demands near-total sacrifice by the present generation to prevent any harm to the future.

  **The Philosophical Consequence (The Non-Identity Problem):**
  This is where Derek Parfit's *Reasons and Persons* (1984) becomes unavoidable.
  *   If we change policy today, we change who meets whom, and *which specific people* are born in the future.
  *   If we discount heavily, we ignore them. If we don't discount at all, we might owe them so much that we cannot justify our own existence (which consumed the resources).
  *   **CBA Survival:** CBA survives technically, but it loses its function as a *balancing* tool. It becomes a tool for **maximizing obligation**. It ceases to be a guide for "efficient allocation" and becomes a demand for "intergenerational justice." Most Treasury frameworks would break because they are designed to constrain spending, not mandate infinite investment.

  ### 5. Underdetermination: Where the Practice Hides
  There are two areas where the practice is underdetermined and hides its ethical choices in technical parameters:

  **A. The Valuation of a Statistical Life (VSL)**
  *   *Practice:* You discount the *benefit* of saving a life.
  *   *Underdetermination:* Do you also scale the VSL with income?
      *   If VSL grows at the same rate as consumption ($g$), and you discount by $\eta \cdot g$, the effects can cancel out.
      *   *Implicit Choice:* Many models discount the benefit *without* fully scaling the VSL, effectively double-penalizing the future. Or they scale VSL but keep $\rho > 0$. The choice of how VSL evolves is where the "future people matter less" assumption is often smuggled in, distinct from the discount rate itself.

  **B. The Choice of $\eta$ (Inequality Aversion)**
  *   *Practice:* $\eta$ is often set around 1 or 2.
  *   *Underdetermination:* $\eta$ determines how much we care about redistribution. A high $\eta$ means we care a lot about the poor.
      *   If we assume future people are richer, a high $\eta$ justifies high discounting (they need the money less).
      *   If we assume climate change makes future people *poorer*, a high $\eta$ demands *negative* discounting (we should invest heavily).
      *   *Implicit Choice:* By fixing $\eta$ and assuming positive $g$, the model presupposes a future of abundance. It is not equipped to handle a future of scarcity without inverting its own logic.

  ### Summary of the Implicit Theory
  The practice you worked under presupposes:
  1.  **Welfarist Consequentialism:** Value lies in utility/consumption, not rights or existence.
  2.  **Time-Partiality:** A commitment to $\rho > 0$, asserting that temporal distance reduces moral weight (contrary to spatial neutrality).
  3.  **Growth Optimism:** A reliance on $g > 0$ to justify discounting via diminishing marginal utility rather than pure impatience.
  4.  **Person-Identity Agnosticism:** It treats "a life saved" as a fungible unit of benefit, ignoring the Non-Identity Problem (that policy choices determine *who* exists to be saved).

  **Where it is genuinely committed:** To the idea that the present has a stronger claim on resources than the future ($\rho > 0$).
  **Where it is underdetermined:** In the handling of VSL growth and the elasticity $\eta$. These technical knobs allow modellers to adjust the moral weight of the future without changing the headline discount rate.

  If you drop pure time preference, the CBA framework survives mathematically but collapses politically. It ceases to be a tool for balancing trade-offs and becomes a machine for generating infinite obligations to the unborn. The "names you'd be called" for discounting by postcode are the same names philosophers (Ramsey, Broome, Parfit) have called economists for discounting by date: **irrational and unjust.** The only defence left is the pragmatic one: that a society which values the future equally with the present cannot function in the present. That is a political claim, not a philosophical one.
