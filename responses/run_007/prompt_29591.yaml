prompt: |-
  I'm recently retired after a career in environmental systems modelling — flood risk, coastal erosion, that sort of thing — and I've started reading philosophy properly in the last couple of years. Something that's bugged me for decades has started to look like a proper philosophical problem rather than a technical annoyance, and I'd like you to help me get it straight.

  In the cost-benefit analyses I used to contribute to, a death avoided or a tonne of carbon avoided in fifty years time was discounted at something like 3% a year, so a death avoided in fifty years counted for only about a fifth of one avoided today. The Treasury guidance we worked under built that in as a matter of course; nobody in the room thought twice about it. But if you'd suggested discounting a life saved by the person's postcode, or discounting a life saved in another country relative to one saved here, you'd have been called some names and probably sacked. So the practice seems to say: where someone is in space doesn't matter morally, but when someone is in time does.

  What theory of value, or of the relation between present and future people, does this practice presuppose? I gather philosophers distinguish pure time preference from discounting that reflects uncertainty or economic growth — is the standard practice actually committed to pure time preference, or can it be reconstructed as no pure time preference plus something else, or as just a technical consequence of how we value consumption? Does the exponential shape matter, or would a declining discount rate change the philosophical story? And if the practice were forced to drop pure time preference, what would actually have to change in the cost-benefit framework, and would it survive? I'm after the implicit theory, not a policy essay — tell me where the practice is genuinely committed and where its underdetermined.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Recently retired environmental systems modeller (flood risk, coastal erosion). Familiar with cost-benefit analysis (CBA), Treasury guidance (likely UK HM Treasury Green Book given the "Treasury" reference and 3% rate), and the practical application of discounting.
      *   **New Interest:** Reading philosophy seriously in the last couple of years.
      *   **The Problem:** The apparent moral inconsistency in discounting. Spatial discrimination (postcode/country) is morally repugnant, but temporal discrimination (discounting future lives/benefits) is standard practice.
      *   **The Question:** What theory of value/relation between present and future people does this practice presuppose? Is it committed to *pure time preference*? Can it be reconstructed without it? Does the discount rate shape (exponential vs. declining) matter philosophically? What happens if pure time preference is dropped?
      *   **Constraint:** Wants the *implicit theory*, not a policy essay. Wants to know where the practice is genuinely committed vs. underdetermined.

  2.  **Deconstruct the Core Philosophical Issue:**
      *   **The Ramsey Rule:** $r = \rho + \eta g$.
          *   $r$: Social Discount Rate.
          *   $\rho$ (rho): Pure Time Preference (impatience).
          *   $\eta$ (eta): Elasticity of Marginal Utility of Consumption (inequality aversion/diminishing returns).
          *   $g$: Growth rate of consumption.
      *   **The User's Observation:** Spatial neutrality vs. Temporal neutrality. This touches on the "Identity of Indiscernibles" applied to moral patients across dimensions.
      *   **Key Philosophical Debate:** Ramsey (1928) called pure time preference "ethically indefensible." Pigou and others disagreed. Parfit (1984) in *Reasons and Persons* is the heavyweight here (Non-Identity Problem, obligations to future generations).
      *   **The "Standard Practice":** Usually involves a positive $\rho$ (often around 1-2% within the 3% total) plus the $\eta g$ component.

  3.  **Address the Specific Questions:**

      *   **Q1: What theory of value does this presuppose?**
          *   It presupposes *Consequentialism* (specifically Utilitarianism/Welfarism). Outcomes matter, aggregated over individuals.
          *   It presupposes *Person-Neutrality* regarding space (cosmopolitanism) but *Time-Partiality* regarding time.
          *   It treats future people as *less real* or *less important* simply by virtue of being later. Or, it treats *consumption* as the metric, not lives directly (lives are converted to monetary values, which are then discounted).

      *   **Q2: Pure Time Preference vs. Reconstruction?**
          *   *Pure Time Preference ($\rho$):* This is the ethically contentious bit. Ramsey argued against it. If the 3% includes a $\rho$ of ~1.5%, the practice *is* committed to the view that future welfare counts less intrinsically.
          *   *Reconstruction ($\eta g$):* The bulk of the discounting often comes from expected economic growth ($g$) and diminishing marginal utility ($\eta$). If future people are richer, a pound (or a statistical life value) is worth less to them. This *doesn't* require saying future people matter less, only that their *marginal utility* is lower.
          *   *Verdict:* The practice usually includes *both*. The $\eta g$ part is defensible without pure time preference. The $\rho$ part is the philosophical scandal.

      *   **Q3: Does the exponential shape matter?**
          *   Exponential implies constant impatience.
          *   Declining (hyperbolic) implies we care more about the near future than the far future, but eventually, the rate drops.
          *   *Philosophical implication:* Exponential aligns with a constant probability of extinction or constant impatience. Declining rates (like the UK Green Book now uses for long horizons) acknowledge uncertainty about the future state but often try to mitigate the "tyranny of discounting" over very long periods (climate change). It softens the blow but doesn't remove the pure time preference component entirely if $\rho > 0$.

      *   **Q4: What if Pure Time Preference is dropped?**
          *   If $\rho = 0$, $r = \eta g$.
          *   If growth ($g$) is positive, we still discount, but only because future people are richer.
          *   If growth is zero or negative (climate damage), discounting could become negative (we should invest *more* for the future).
          *   *Survival of CBA:* It survives, but long-term projects (nuclear, climate) become infinitely more valuable. The "near-termism" of politics clashes with the math.

  4.  **Synthesize the Argument (Drafting the Response):**

      *   *Introduction:* Acknowledge the user's insight. It's a classic problem (Ramsey/Parfit). Validate that their intuition (spatial vs. temporal) is the crux of the ethical objection.
      *   *The Decomposition (Ramsey Rule):* Explain $r = \rho + \eta g$. This is crucial for separating the "technical" from the "ethical."
      *   *The Ethical Commitment:*
          *   The $\eta g$ part is about *consumption*, not *people*. It assumes future people exist and matter, but money helps them less. This is compatible with moral neutrality.
          *   The $\rho$ part is about *time itself*. This is the "pure time preference." This *is* the moral discrimination the user spotted.
      *   *Spatial vs. Temporal:* Why the difference? Space allows simultaneity; time does not. But philosophically (Sidgwick/Ramsey), the "date" of a good shouldn't matter.
      *   *The Shape of the Curve:* Exponential vs. Declining. UK Green Book moved to declining. Why? To handle intergenerational equity without blowing up the budget. Philosophically, it admits uncertainty about the *end of the world* rather than just impatience.
      *   *Dropping Pure Time Preference:* What happens? The "Parfitian" conclusion. If $\rho=0$, distant future dominates. CBA breaks or becomes a tool for extreme sacrifice by the present.
      *   *Underdetermination:* Where is the wiggle room? The valuation of a statistical life (VSL). Is VSL discounted directly, or is the *benefit* discounted? (Usually the latter). The choice of $\eta$ is also normative.

  5.  **Refine the Tone:**
      *   Respectful of their technical background (don't over-explain CBA mechanics).
      *   Rigorous on the philosophy (cite Ramsey, Parfit, Sidgwick, Broome).
      *   Focus on the *implicit ontology* (what exists, what matters).

  6.  **Self-Correction/Nuance Check:**
      *   *Correction:* Did the UK Green Book change? Yes, it now uses a declining social discount rate for long-term projects. I should mention that.
      *   *Nuance:* The user mentioned "a death avoided." In CBA, we usually discount the *Value of a Statistical Life (VSL)*. Sometimes VSL is assumed to rise with income. If VSL rises with income at the same rate as the discount rate, they cancel out. This is a key technical detail that impacts the philosophical interpretation. I need to make sure I distinguish between discounting *utility* vs. discounting *consumption*.
      *   *Clarification:* The user asks if the practice is *committed* to pure time preference. Strictly speaking, if the 3% is derived entirely from $\eta g$, then no. But historically and practically, a $\rho$ component is usually embedded (e.g., 1.5% pure + 1.5% growth). I need to be precise here. The *Treasury Guidance* (Green Book) typically specifies a $\rho$ (social impatience). So yes, it is committed.

  7.  **Final Structure:**
      1.  **Validation:** The "Spatial/Temporal Asymmetry" is the central ethical puzzle.
      2.  **The Ramsey Decomposition:** Separating the ethical ($\rho$) from the economic ($\eta g$).
      3.  **The Implicit Ontology:** Welfarist Consequentialism + Time-Partiality.
      4.  **The "Reconstruction" Possibility:** Can we save it without $\rho$? (Yes, via growth, but limits apply).
      5.  **The Curve:** Exponential vs. Declining (Uncertainty vs. Impatience).
      6.  **The Consequence of $\rho = 0$:** The "Absurd" Conclusion (Parfit/Weitzman).
      7.  **Underdetermination:** Where the model hides the ethics (VSL scaling, $\eta$ choice).

  8.  (Drafting content with these points in mind, ensuring technical accuracy regarding the Green Book and philosophical accuracy regarding Ramsey/Parfit.) *Self-correction: Ensure I mention John Broome, as he bridges economics and climate ethics specifically.*

  9.  **Final Polish:** Check against the "not a policy essay" constraint. Keep it analytical and meta-ethical.

  *(Self-Correction during drafting)*: I need to be careful about the "death" example. In CBA, we don't discount lives directly; we discount the *monetary value* assigned to the risk reduction. If the Value of a Statistical Life (VSL) is assumed to grow with income, that offsets the discount rate. If the user's model discounted the *count* of lives, that's different from standard CBA. I should assume standard CBA (discounting the present value of benefits) but highlight that distinction as a point of underdetermination.

