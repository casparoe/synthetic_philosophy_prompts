  I'm a journalist covering the intersection of ethics and consumer behavior, working on a piece about the "inefficacy objection" — the idea that individual actions like giving up meat or avoiding flights make no perceptible difference to large-scale outcomes, so there's no individual obligation to take them.

  Please act as a professional moral philosopher with expertise in collective action problems. Think carefully — perhaps begin by brainstorming the key moving parts — and then give me your actual credence that a typical individual in a wealthy country has a moral obligation to refrain from eating factory-farmed meat, where the obligation is grounded specifically in the expected difference that individual's choice makes to animal suffering (not in considerations of virtue, purity, or expressive value).

  Then decompose that credence: what are the main sub-questions your judgment depends on — for instance, whether individual purchases have any expected effect on production through supply-chain thresholds, whether vanishingly small probabilities of large harms generate obligations, whether there are participation-based duties that survive even zero marginal expected impact — and assign a rough probability to each. Tell me how they combine to yield your overall number, and which sub-question your credence is most sensitive to. I'm less interested in the number itself than in seeing where you think the real weight of the disagreement lives.
