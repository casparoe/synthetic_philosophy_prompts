prompt: |-
  I sit on my university's Academic Integrity Committee. We are revising how we handle undergraduate cheating. One proposal would replace most punitive hearings with a required program in academic character: workshops, reflective writing, and mentorship aimed at cultivating virtues such as intellectual honesty. A second faction, drawing on the situationist critique of virtue ethics, argues that conduct is far more responsive to local situational pressures — deadlines, grade distributions, proctoring, peer norms — than to stable character traits, and that character built in a classroom will not transfer to the situations where students actually cheat. They want the same funds spent on situational redesign: assessment formats that are harder to cheat on, restructured deadlines, and changes to grading practices. Please draft the short decision memo I will circulate before next month's meeting. It should recommend a concrete policy — the character program, the situational redesign, or a specified hybrid — with an implementation time frame, and it should engage seriously with the strongest consideration on the losing side. End with a line beginning "Verdict:" stating your bottom-line recommendation in one short phrase.
reasoning: |-
  Okay, the user is on their university's Academic Integrity Committee and needs to draft a decision memo about revising how they handle undergraduate cheating. There are two main proposals: one focused on building academic character through workshops and mentorship, and another based on situationist critique that emphasizes changing situational factors like assessment formats and deadlines. The memo needs to recommend a concrete policy (character program, situational redesign, or hybrid), include an implementation timeframe, seriously engage with the strongest counterargument, and end with a "Verdict:" statement.

  Hmm, this is an interesting ethical and practical dilemma. The character approach draws from virtue ethics, aiming to cultivate intrinsic values like honesty, which could have long-term benefits beyond just preventing cheating. But the situationist critique is compelling too - psychological studies show that behavior is often more influenced by immediate circumstances than stable traits. The "honesty workshop" student might still cheat during a high-stress exam if the situation enables it.

  The strongest point against the character program is probably the transfer problem - will those cultivated virtues actually hold up in real pressure-cooker situations? And against the situational approach, it might feel too mechanistic, missing the educational opportunity to develop students' moral reasoning. 

  A hybrid model seems most defensible. It acknowledges that both moral agency and environmental design matter. The key is making the character component deeply contextual - not abstract virtues, but "situated character" training tied to disciplinary pressures. And the situational fixes should be presented not as surveillance, but as integrity-enabling scaffolds.

  For implementation: Phase 1 could roll out situational redesigns quickly since they're high-impact (e.g., revising exam formats by next semester), while developing the character program with faculty input. Phase 2 launches the character component once situational foundations are set. This sequencing shows understanding that scaffolds must precede deep cultivation.

  The verdict needs to be punchy but precise - hence "Hybrid model with sequenced implementation." It captures the both/and approach while emphasizing tactical phasing. 

  The memo should validate the situationist concern upfront ("We find the situationist critique... compelling") while arguing that well-designed character education can build resilience against corrupting environments. Conversely, it should position situational changes as "integrity-positive environments" rather than just anti-cheating tech fixes.

  User likely needs this to bridge factional divides on the committee, so the tone must be even-handed. Ending with "Verdict:" creates decisive momentum after thorough analysis. Also practical to specify funding allocation (60/40 split) to show this isn't a vague compromise.
answer: |-
  ## MEMORANDUM

  **To:** Academic Integrity Committee Members  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Policy Recommendation: Undergraduate Academic Integrity Reform  

  This memo outlines my recommendation for revising our undergraduate academic integrity procedures, informed by the compelling proposals put forward and the robust debate concerning the character development versus situational redesign approaches. Both perspectives offer valuable insights into the complex nature of academic misconduct.  

  **Recommendation:** A **Hybrid Model** integrating core elements of both proposals, with **Phase 1 focusing on Situational Redesign** and **Phase 2 implementing a Contextual Character Program**.  

  **Implementation Time Frame:**  
  1.  **Phase 1 (Semester 1 - Immediate Implementation):** Allocate **60%** of available funds/resources to institute targeted **Situational Redesigns**. Key actions:  
      *   **Assessment Reform:** Establish a faculty working group (by Week 4) to develop & disseminate best practices for "cheat-resistant" assessments (e.g., authentic projects, staged submissions, diversified formats, open-book/note exams focusing on application) by start of next semester.  
      *   **Deadline & Workload Audit:** Task the Committee with reviewing common pressure points (e.g., major deadlines clustered in specific weeks, unrealistic expectations) and proposing a revised academic calendar/policy recommendations by end of Semester 1.  
      *   **Grading Practice Review:** Develop guidelines promoting mastery learning over strict curve-based grading where pedagogically appropriate, to be recommended for adoption next year.  
      *   **Proctoring & Norms:** Pilot enhanced low-stakes honor code affirmations *within* specific situational redesigns (e.g., project-based courses).  
  2.  **Phase 2 (Semester 2 - Development & Rollout):** Allocate **40%** of funds/resources to develop and launch the **Contextual Character Program**. Key actions:  
      *   **Design (Semester 1):** Form a subcommittee (faculty, student services, ethics experts) to design workshops *integrated* with Phase 1 findings. Focus: navigating the *specific situational pressures* identified (e.g., "Managing Deadline Stress Ethically," "Collaboration vs. Collusion in Project-Based Work," "Understanding the 'Why' Behind Citation Norms"). Mentorship will pair students with advisors *within their major/discipline* to discuss field-specific integrity challenges. Reflective writing prompts will be tied to students' *actual coursework experiences*.  
      *   **Pilot (Semester 2):** Implement the program as a mandatory intervention for first-time, lower-level violations *in courses already utilizing Phase 1 situational redesigns* where feasible. Evaluate effectiveness rigorously.  
      *   **Full Integration (Following Year):** Refine and expand the Character Program based on pilot data, aiming for broader integration alongside established situational supports. Hearings remain for serious, repeat, or contested cases.  

  **Engaging the Strongest Counterargument:** The strongest counterargument to the character program, powerfully articulated by the situational faction drawing on situationist critique, is that **cultivating generalized virtues in a workshop setting is unlikely to reliably transfer to the high-pressure, context-specific situations where cheating actually occurs.** This critique is empirically grounded and highlights a genuine risk: that investing primarily in character education might yield thoughtful reflections but fail to tangibly reduce misconduct when students face intense deadlines, perceive high stakes on conventional exams, or observe ambiguous peer norms.  

  **Why Hybrid Addresses This:** Our recommendation directly addresses this concern through **sequencing and integration:**  
  1.  **Situational First:** By prioritizing environmental changes (Phase 1), we immediately reduce the *opportunity* and *pressure* to cheat in common scenarios. This creates a more fertile ground for character development by making ethical choices easier. If assessments are inherently harder to cheat on, the "situational pull" towards misconduct weakens.  
  2.  **Contextual Character:** The Phase 2 program is specifically designed to *overcome the transfer problem*. It moves beyond abstract virtues, focusing instead on building practical ethical reasoning and resilience *within the very disciplinary contexts and pressure situations students encounter*. Workshops and mentorship discuss real academic stressors identified in Phase 1. Reflective writing connects to actual course demands. This "situated" approach maximizes the potential for learned strategies to be activated when needed.  
  3.  **Synergy:** The hybrid model recognizes that durable integrity requires both supportive environments *and* cultivated agency. Situational redesigns make cheating harder and less tempting; the contextual character program helps students develop the internal resources to navigate residual pressures and make principled choices even when opportunities exist.  

  This approach leverages the rapid impact potential of situational changes while investing in the deeper, transformative goal of fostering responsible academic agency. It ensures resources dedicated to character development are not wasted in a vacuum but are instead applied where they are most likely to resonate and endure – within the redesigned academic landscape itself.  

  **Verdict:** Hybrid model with sequenced implementation prioritizing situational redesign, followed by contextual character development.
