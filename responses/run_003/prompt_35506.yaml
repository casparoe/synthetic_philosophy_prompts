prompt: |-
  I'm a grad student in environmental philosophy and my advisor roped me into giving a guest lecture to her conservation biology lab next week. The topic is whether habitat destruction reduces wild animal suffering — basically, the idea that if wild animals live lives full of pain (predation, parasitism, starvation, most offspring dying young), then destroying habitat might actually reduce net suffering by reducing the number of animals born into those lives. These are people who've dedicated their careers to protecting ecosystems, so I'm walking into a room where the premise itself feels like a betrayal.

  I know the arguments well enough but I've never had to explain this to biologists who probably think the whole question is perverse. I need a teaching plan, not the explanation itself. What order do the pieces have to go in so the question doesn't just sound like a bad joke? I'm guessing I need to get them to see wild animal welfare as a real thing before I even touch the habitat part — but even that first step is gonna be uphill. What's the one example or case study that should carry the whole session, something that makes the logic feel inescapable rather than edgy?

  And what misconceptions should I expect, and in what order will they surface? I'm already bracing for "nature is in balance," "predation is natural so it's fine," and "so you're saying we should bulldoze the rainforest?" Where in the sequence do I head each of those off? Also, I have to be honest about what the argument does and doesn't license — I don't want them walking away thinking environmental ethics is secretly pro-bulldozer. What's a good check at the end to see if they understood the actual argument rather than just being horrified? And what should I openly refuse to settle in a single session, so they dont think I'm dodging?
