answer: |-
  Here's your Q&A prep sheet, structured for maximum tactical advantage. I've channeled the voice of a world-weary externalist who's seen a dozen variants of this argument since the 90s. The objections reflect the specific biases and battle lines in a strong philosophy of language department with Burgean/2Dist leanings.  

  ### **The Likely Objections (Ordered by Damage Potential)**  

  1. **The Arthritis Objection (Pure Burgean)**  
      *"Your distinction collapses when we move beyond natural kinds to social kinds. Take Burge's arthritis case: Oscar and Twin-Oscar both have the same internal state when uttering 'I have arthritis in my thigh,' but only Oscar is mistaken. If mental content were individuated internally, Twin-Oscar wouldn't just be *correct*—he'd be having a *different thought* about a different condition! Yet intuitively, they share a defective concept. Doesn't this force externalism about mental content?"*  
      **Your 2-Minute Reply:** "Burge's case presupposes that 'arthritis' is a *successful reference* in Oscar's community. But the internalist can capture the intuition without external individuation: Both Oscars share a *conceptual role* tied to superficial symptoms (joint pain + 'medical condition called arthritis'). Oscar's error is *metalinguistic*—a failure to grasp his community's extension—not proof that his *pain belief* is externally constituted. We explain the mistake via his relation to experts, not by changing the cognitive content of 'my thigh hurts in this specific way.'"  
      **Weakness:** Concedes that external factors explain *why* Oscar is wrong, which might blur the line.  
      **Concede?** Acknowledge social externalism explains *semantic error* but insist it doesn't redefine the *phenomenal character* of the belief.  

  2. **The 2Dist Challenge (Modal Equivocation)**  
      *"You’re conflating primary and secondary intensions. Twin Earth shows that the cognitive role of 'water' (its primary intension) remains constant across worlds, but its truth-conditions (secondary intension) differ. Yet Burge's point is that mental states are *individuated* by secondary intensions because they determine reference in the actual world. Your 'narrow content' is just primary intension—it doesn’t capture what Oscar *actually believes* when he thinks 'water is wet.'"*  
      **Your 2-Minute Reply:** "I agree primary intension is narrow! But 2Dism *already* bifurcates content. My argument is that Twin Earth only forces externalism on secondary intensions (truth-conditions). For mental content, primary intension does the work: Oscar and Twin-Oscar share the cognitive state 'clear, drinkable liquid in our rivers is wet.' The fact that this picks out H₂O vs. XYZ doesn’t change their *epistemic perspective*—which is what mental content should track for explaining behavior."  
      **Weakness:** Risks ceding that "full" mental content requires *both* dimensions.  
      **Concede?** Admit primary intension alone can't capture *all* explanatory goals (e.g., truth-evaluation) but insist it's core to cognition.  

  3. **The Explanatory Poverty Objection**  
      *"If narrow content is just functional role or inferential disposition, how does it explain behavior? Oscar points to a glass of XYZ and says 'This is water!'—same narrow content as Twin-Oscar. But Oscar is *wrong*, and Twin-Oscar is *right*. If mental content is causal, their mental states should differ because one causes a false utterance and the other a true one. Narrow content seems explanatorily inert."*  
      **Your 2-Minute Reply:** "Behavior is explained by narrow content *plus context*. Both Oscars have the disposition: 'Apply "water" to clear, drinkable liquid.' The difference in truth-value arises from external factors (H₂O vs. XYZ), not their cognitive machinery. We don’t need distinct mental contents to explain why they *do* the same thing (point, assert). We only need distinct contents to explain *accuracy*—which is a relational property, not a mental one."  
      **Weakness:** Leaves narrow content feeling "thin" (is it just syntax?).  
      **Concede?** Grant narrow content needs supplementation for *semantic* explanation but stress its necessity for *rationalizing* action.  

  4. **The Inconsistency Charge (From a Putnam Purist)**  
      *"Putnam’s point was never just about words—it was about *what is in the mind*. He says: 'Cut the pie any way you like, meanings just ain’t in the head!' He explicitly extends this to *psychological states* (1975, p. 227). Aren’t you ignoring his holistic argument that reference-fixing is essential to thought itself?"*  
      **Your 2-Minute Reply:** "Putnam slides from linguistic reference to mental content without argument. When he says 'psychological state,' he equivocates between *what is thought* (narrow) and *what the thought is about* (broad). His argument shows that truth-conditions aren’t in the head, but it doesn’t show that the *mode of presentation* isn’t. Even if I grant reference is 'essential,' it could be essential in the same way a key is essential to opening a lock—without being *part of* the lock’s mechanism."  
      **Weakness:** May sound like hair-splitting against Putnam’s rhetoric.  
      **Concede?** Agree Putnam *intended* mental externalism but argue his thought experiment doesn’t *entail* it.  

  5. **The Natural Kind Essence Pushback**  
      *"For natural kinds, the external essence *is* cognitively significant. When Oscar learns water is H₂O, his concept changes: he now knows water *couldn’t be* XYZ. If mental content were narrow, this epistemic shift wouldn’t alter his cognitive state—but clearly it does! He can now entertain new modal thoughts."*  
      **Your 2-Minute Reply:** "Learning water is H₂O adds a *new* narrow concept: 'substance with molecular structure H₂O.' His old concept 'water' (clear liquid) remains, but he *associates* it with the new one. Twin-Oscar does the same with 'XYZ.' Their *original* cognitive states about 'water' (pre-discovery) are still narrow and shared. Essence discoveries change beliefs, not the retrospective content of past thoughts."  
      **Weakness:** Implies cognitive content is fragmented (old vs. new 'water' concepts).  
      **Concede?** Accept that *expert* concepts may be broad but hold that *layperson* concepts are narrow.  

  6. **The 'No Free Lunch' Critique**  
      *"Even if we grant your narrow content, it’s parasitic on broad content. You define it as 'whatever plays the water-role in our world'—but the 'water-role' is itself fixed by external samples. Narrow content is just broad content in disguise, scrubbed of its referential success."*  
      **Your 2-Minute Reply:** "Not parasitic; *autonomous*. Narrow content is a computational/functional type: 'concept triggered by clear liquid in rivers, used for quenching thirst, etc.' Twin Earth shows this type can be realized by different external properties (H₂O, XYZ). It’s no more parasitic than the concept 'food' is parasitic on specific nutrients. The role is abstract and internally specified."  
      **Weakness:** Functional roles may still rely on external inputs/outputs.  
      **Concede?** Grant that functional roles are *causally* embedded but maintain they are *constitutively* internal.  

  ---

  ### **The Question You're Dreading**  
  **"If narrow content is what’s shared between Oscar and Twin-Oscar, and it doesn’t determine reference or truth-conditions, then what *does* it contribute to psychological explanation that broad content + context can’t handle? And if the answer is 'nothing,' isn’t narrow content just an artifact of your model—a *tertium quid* we should shave off with Ockham’s razor?"**  

  **Why It’s Deadly:** Forces you to either:  
  (A) Admit narrow content is epiphenomenal (killing its explanatory value), or  
  (B) Commit to a controversial metaphysics of mind (e.g., phenomenal intentionality, conceptual role semantics) that could alienate naturalists.  

  **Your Best Reply (Defensive):**  
  "Narrow content isn't redundant—it's the *vehicle* for broad content. It explains why Oscar and Twin-Oscar exhibit identical reasoning patterns, make the same inferences, and would identically update beliefs given the same perceptual inputs. Broad content + context explains *accuracy*; narrow content explains *cognitive processing*. Without it, psychology couldn’t generalize across environments. Ockham’s razor cuts against *duplicate* explanations, but broad content alone can’t explain why they’re computationally identical."  

  **Damage Control:**  
  - **Concede upfront:** "I’m not arguing narrow content replaces broad content—it complements it."  
  - **Redirect:** "This is why I sketch a positive account in the second half: narrow content as inferential role in a syntactic engine (à la Fodor’s LOT or Block’s conceptual role)."  
  - **Danger:** If pressed, you might have to endorse a non-naturalistic view of cognition.  

  ---

  **Final Strategic Tips:**  
  1. **Preempt the Arthritis Case** in your talk to drain its Q&A power.  
  2. **Use their jargon** ("primary intension," "individuation conditions") to show fluency.  
  3. **Concede graciously** where their points highlight limitations of *your* view—not your core argument.  
  4. **Pivot to burden of proof:** "My goal isn’t to bury externalism, but to show it needs arguments *beyond* Twin Earth."  
  5. **Watch for the "secret question"**—if asked, stay calm, concede narrow content's *limited* role, and emphasize its necessity for computational psychology.  

  This crowd will respect nuance more than dogma. If you survive the Burgeans, the two-dimensionalists might even find your primary intension move congenial. Break a leg—metaphorically, not externally.
