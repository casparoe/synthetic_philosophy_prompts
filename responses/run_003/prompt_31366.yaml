  Below is a complete, runnable 90-minute session plan designed for a science festival. It uses a simple betting game to demonstrate why maximizing the logarithm of wealth (geometric growth) matters more than maximizing expected value (arithmetic growth) in repeated bets. Participants experience firsthand how overbetting leads to ruin despite favorable odds, and the debrief ties their observations to core concepts like the Kelly criterion and ergodicity.

  ---

  ### **Session Title:** The Betting Paradox: Why "Good Bets" Can Go Bad

  ### **Goal:**  
  Participants discover that betting too large a fraction of their wealth on a positive-EV gamble leads to ruin due to compounding losses, while fractional betting compounds steadily. They grasp that growth is multiplicative, not additive.

  ### **Key Concepts Covered:**  
  - Expected value (arithmetic mean) vs. geometric growth rate (log wealth).  
  - Risk of ruin and the importance of bet sizing.  
  - Kelly criterion intuition (without formulas).  
  - Ergodicity breakdown: why ensemble averages ≠ time averages.

  ### **Materials:**  
  - **Tokens:** 100 poker chips/coins per player (or use a spreadsheet if physical tokens are impractical).  
  - **Bet cards:** Pre-printed cards assigning betting strategies (see below).  
  - **Outcome generator:** A 10-sided die (d10) or a simple app (e.g., random.org) to simulate public coin flips.  
  - **Record sheets:** For players to track wealth (or a shared Google Sheet for digital play).  
  - **Whiteboard** to track group results.  
  - **Timer** (for rounds).

  ### **Game Setup:**  
  - **Players:** 18 participants, split into 3 groups of 6. Each group uses the *same* betting strategy.  
  - **Betting Strategies (assigned via cards):**  
    - **Group A: All-In Bettors** (bet 100% of wealth each round).  
    - **Group B: Half-Pot Bettors** (bet 50% of wealth each round).  
    - **Group C: Quarter-Pot Bettors** (bet 25% of wealth each round).  
  - **Bet Payoff Rules:**  
    - A public coin flip each round (same outcome for all players).  
    - **Heads (60% probability):** Win → gain the amount you bet.  
      - *Example:* Bet 20 tokens, win → +20 tokens.  
    - **Tails (40% probability):** Lose → lose your bet.  
      - *Example:* Bet 20 tokens, lose → -20 tokens.  
  - **Why this works:**  
    - Expected value (EV) per bet is positive: EV = (0.6 × 1) + (0.4 × -1) = 0.2 (a 20% average return per bet).  
    - But the geometric growth rate (log wealth) varies by strategy:  
      - All-In (100%): Growth rate = (2<sup>0.6</sup> × 0<sup>0.4</sup>) = 0 (ruin is certain long-term).  
      - Half-Pot (50%): Growth rate ≈ (1.5<sup>0.6</sup> × 0.5<sup>0.4</sup>) = 0.966 < 1 (decay).  
      - Quarter-Pot (25%): Growth rate ≈ (1.25<sup>0.6</sup> × 0.75<sup>0.4</sup>) = 1.023 > 1 (growth).  

  ### **Timeline (90 Minutes):**  

  #### **1. Introduction (10 min)**  
  - **Hook:** *"You’re offered a bet: 60% chance to double your money on heads, 40% chance to lose it on tails. Would you take it? What if you could repeat it 20 times? Let’s simulate it."*  
  - **Rules Brief:**  
    - Everyone starts with 100 tokens.  
    - Each round, bet a fixed fraction of your *current* wealth (no saving/skipping).  
    - All players experience the same public coin flip (fairness).  
  - **Assign Strategies:** Hand out bet cards (Group A, B, C) and record sheets.  

  #### **2. Gameplay (40 min)**  
  - **Rounds:** 20 rounds (2 min per round max).  
    - **Per Round:**  
      1. **Bet:** Players calculate their bet (e.g., Group B bets 50% of current wealth).  
      2. **Flip:** Facilitator rolls d10: 1-6 = heads (win), 7-10 = tails (lose).  
      3. **Update:** Players adjust wealth, record new total.  
      4. **Bankrupt Players:** Sit out if wealth ≤ 1 token (minimum bet size).  
  - **Facilitator Actions:**  
    - Urge speed (use timers).  
    - Track group averages on whiteboard after every 5 rounds (e.g., "Group A avg: 120 tokens, Group B avg: 85 tokens, Group C avg: 110 tokens").  
    - **Critical Moment:** After ~5 rounds, pause and ask: *"Who feels confident? Who’s nervous? Why?"*  

  #### **3. Results Collection (10 min)**  
  - **Final Tally:**  
    - Each group reports:  
      - Number of bankrupt players.  
      - Median wealth (to ignore outliers).  
      - Maximum wealth in the group.  
  - **Whiteboard Summary:**  
    | **Group** | **Bankrupt Players** | **Median Wealth** | **Max Wealth** |  
    |-----------|----------------------|-------------------|----------------|  
    | A (100%)  | Likely 5-6           | 0                 | 0 or huge      |  
    | B (50%)   | 2-4                  | 30-60             | 200-300        |  
    | C (25%)   | 0-1                  | 120-180           | 200-400        |  

  #### **4. Debrief (30 min)**  
  - **Guided Discussion (15 min):**  
    - *"What happened to the all-in bettors? Why?"*  
      - → **Key Insight:** A single loss wipes them out. Positive EV can’t compensate for ruin.  
    - *"Half-pot bettors: did you grow? Why not?"*  
      - → **Key Insight:** Losses cut wealth deeply; gains don’t fully recover (volatility drag).  
    - *"Quarter-pot bettors: how did your wealth change? Why?"*  
      - → **Key Insight:** Smaller bets let compounding work; losses are survivable.  
    - *"Why did the richest player in Group A (if any) outperform others? Is that repeatable?"*  
      - → **Key Insight:** Luck can reward overbettors short-term, but long-term ruin is inevitable.  
  - **Concept Mapping (15 min):**  
    - **Arithmetic vs. Geometric Growth:**  
      - *"Your expected token gain per bet was +20% (arithmetic average). But your actual wealth grew (or shrank) multiplicatively. When wealth compounds, you multiply outcomes, not add them."*  
      - **Whiteboard Example:**  
        - Arithmetic: (Win +100% + Loss -50%)/2 = +25% "on average."  
        - Geometric: √(2 × 0.5) = √1 = 0% growth (you break even).  
    - **Log Wealth & Ergodicity:**  
      - *"Maximizing log wealth means maximizing the rate your wealth compounds. If your wealth can hit zero (ruin), the ‘average outcome’ across many people (ensemble) isn’t what you experience over time (your path). This is ergodicity breaking."*  
    - **Real-World Links:**  
      - Investing: Over-leveraging blows up funds even with "edge."  
      - Personal Finance: Why fixed-fraction betting (e.g., 1-5% of wealth) outlasts all-in moves.  

  ---

  ### **What Will Go Wrong (and How to Handle It):**  
  1. **All-In Group Gets Lucky:**  
     - *Risk:* They survive and boast, undermining the lesson.  
     - *Fix:* Emphasize bankruptcy risk ("How many made it? Would you risk your life savings on these odds?"). Run a quick second simulation with a loss-heavy sequence to show fragility.  

  2. **Math Anxiety:**  
     - *Risk:* Players slow down on bet calculations.  
     - *Fix:* Provide calculators. For physical tokens, allow rough estimates (e.g., "About half of 80 is 40"). Use spreadsheets if available.  

  3. **Misinterpreting "Average":**  
     - *Risk:* Players conflate median and max wealth (e.g., "Group A had a millionaire!").  
     - *Fix:* Stress median wealth in debrief: *"For every lucky winner, most went bust. Would you take that risk?"*  

  4. **Short-Term Focus:**  
     - *Risk:* Players fixate on round-by-round wins, missing compounding.  
     - *Fix:* Pause mid-game to compare group averages (whiteboard). Ask: *"Which strategy feels sustainable?"*  

  ---

  ### **What the Activity Can’t Teach (Facilitator Must Explain):**  
  - **Uncertain Probabilities:** Real-world bets have unknown odds. Kelly sizing requires accurate probabilities (overbetting is worse than underbetting).  
  - **Correlated Bets:** Real portfolios face simultaneous losses (not independent coin flips).  
  - **Utility of Wealth:** Log-wealth optimization assumes constant risk tolerance; humans may value $1M more than twice $500K.  

  ---

  ### **Why This Design Works:**  
  - **Intuitive:** Tokens make compounding visceral (players *feel* the impact of losses).  
  - **Dramatic Contrast:** All-in players go bust fast; quarter-pot players thrive.  
  - **No Math Jargon:** Concepts emerge from experience, then formalized in debrief.  
  - **Scalable:** Works with spreadsheets (e.g., Google Sheets with `=RANDBETWEEN`), physical tokens, or hybrid.  

  By the end, participants will viscerally grasp why rational growth isn’t about chasing averages—it’s about surviving to compound another day.
