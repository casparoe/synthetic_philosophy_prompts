answer: |-
  You've identified a crucial ambiguity in how "defer to the objective chance" functions in rationalist discourse. This slogan is indeed rooted in David Lewis's **Principal Principle (PP)**, but it's often invoked without acknowledging its nuances, caveats, and competing interpretations. Below, I'll dissect possible readings, evaluate their plausibility, and apply them to your three cases. The key distinctions involve the *scope of admissible evidence*, the *temporal status* of the event, and the *ontology of chance*.

  ---

  ### **Brainstormed Candidate Precisifications of "Defer to the Objective Chance"**
  1. **Naive Unconditional Deference**: Set credence *C* equal to the known chance *ch* for any event, unconditionally.  
  2. **Lewis's Original Principal Principle**: Set *C(A | ch(A) = x ∧ E)* = *x*, where *E* is "admissible" evidence (e.g., historical or statistical, but not futuristic or outcome-revealing).  
  3. **New Principle (Anti-Undermining)**: Set *C(A | H_t ∧ T)* = *ch_T(A)*, where *H_t* is historical evidence up to time *t*, and *T* is the true chance theory (avoids "undermining futures").  
  4. **Epistemic Chance Deference**: Set *C(A)* = *p*, where *p* is the output of a "well-calibrated" model (treated as "objective" for practical purposes).  
  5. **Tensed Chance Deference**: Defer only for *future* events; for past events, use historical evidence instead.  
  6. **Degreed Deference**: Treat *ch* as *expert advice* but temper it with other evidence (e.g., via Bayesian updating).  
  7. **Metaphysical Constraint**: Chances *just are* the ideal credences for a rational agent, making deference tautological.  

  I'll refine these into a structured menu, addressing your specific questions.

  ---

  ### **The Menu of Precise Theses**
  #### **1. Naive Unconditional Deference**  
  - **Claim**: If you know *ch(A) = x*, set *C(A) = x* unconditionally. Ignores all other evidence.  
  - **Chance**: Single-case physical probability (e.g., propensity).  
  - **Deference Operation**: Identity assignment.  
  - **Plausibility**: **False**. Violates conditionalization (e.g., if you learn *A* occurred, *C(A)* should be 1, not *x*).  
  - **Answers to your Qs**:  
    - Unconditional; no evidence can override it.  
    - Fails for settled events (e.g., past coin flips).  
    - Constrains current credence directly.  
    - Applies to past/future equally → absurd for past events with known outcomes.  
  - **Application to Cases**:  
    - Case 1 (AI failure): Falsely demands *C(failure) = ch(failure)* even if you have direct evidence of success.  
    - Case 2 (coin flip): Correctly gives *C(heads) = 0.5*, but for wrong reasons (ignores that the flip is settled).  
    - Case 3 (model forecast): Justifies deference, but misidentifies model outputs as "chance."  

  #### **2. Lewis's Principal Principle (PP)**  
  - **Claim**: *C(A | ch(A) = x ∧ E) = x*, where *E* is **admissible evidence**. *E* is admissible if it contains no "inadmissible" information about *A* (e.g., historical data is admissible; future outcomes or chance-undermining facts are not).  
  - **Chance**: Humean "best system" probability (e.g., quantum propensities or robust statistical regularities).  
  - **Deference Operation**: Conditional credence equals chance *given admissible evidence*.  
  - **Plausibility**: **Defensible but flawed**. Lewis abandoned it due to the "undermining problem" (e.g., a future outcome might make *ch* false).  
  - **Answers to your Qs**:  
    - Conditional on *ch* and *admissible E*; other evidence can override via Bayesian updating.  
    - Inadmissible evidence (e.g., "I saw the coin land heads") makes deference irrational.  
    - Constrains *initial* credence; later credences derive from updating.  
    - For past events: If outcome is unknown, *E* is admissible → defer. If outcome is known, *E* is inadmissible → no deference.  
  - **Application to Cases**:  
    - Case 1 (AI failure): If *ch* is known and evidence isn't outcome-revealing, deference is rational. But one-off events may lack objective chances.  
    - Case 2 (coin flip): **Correctly supports deference** (flip outcome is unknown, so *E* is admissible).  
    - Case 3 (model forecast): Only if the model outputs *true chances* (rarely true) and evidence is admissible.  

  #### **3. New Principle (NP)**  
  - **Claim**: *C(A | H_t ∧ T) = ch_T(A)*, where *H_t* is *all* historical evidence up to *t*, and *T* is the true chance theory. Solves undermining by conditioning on *T* instead of *ch(A)=x*.  
  - **Chance**: Humean, defined by theory *T* (e.g., quantum mechanics).  
  - **Deference Operation**: Credence given history and chance theory equals chance.  
  - **Plausibility**: **Defensible** (widely accepted fix to PP).  
  - **Answers to your Qs**:  
    - Conditional on *H_t* and *T*; total evidence updates *C*.  
    - If *H_t* implies *A* (e.g., you saw the coin land), *ch_T(A)* is irrelevant.  
    - Constrains current credence only if *H_t* and *T* are known.  
    - For past events: If *H_t* doesn't settle *A*, defer to *ch_T(A)*.  
  - **Application to Cases**:  
    - Case 1 (AI failure): If *T* assigns chances to one-off events, deference holds. But *T* rarely does (problematic).  
    - Case 2 (coin flip): Supports deference if *H_t* includes no outcome data.  
    - Case 3 (model forecast): Only if the model is *T* (true chance theory), not merely calibrated.  

  #### **4. Epistemic "Chance" Deference**  
  - **Claim**: Set *C(A) = p* where *p* is a well-calibrated forecast (e.g., from a model). Treats epistemic probability as "objective."  
  - **Chance**: Output of a reliable predictive model (e.g., Metaculus, scientific models).  
  - **Deference Operation**: Adopt the model's probability as your credence.  
  - **Plausibility**: **False if called "chance"** (conflates epistemology with metaphysics), but **defensible as practical rationality** (e.g., if the model is your best expert).  
  - **Answers to your Qs**:  
    - Unconditional or conditional on model reliability; other evidence can override.  
    - Evidence undermining the model (e.g., conflict with data) blocks deference.  
    - Constrains current credence directly.  
    - Applies to past events if the model estimates them (e.g., archaeology).  
  - **Application to Cases**:  
    - Case 1 (AI failure): Debatable if no physical chance exists; depends on model quality.  
    - Case 2 (coin flip): Rejects deference (no model needed for a fair coin).  
    - Case 3 (model forecast): **Directly supports deference**, but mislabels epistemic probabilities as "chances."  

  #### **5. Tensed Chance Deference**  
  - **Claim**: Defer only to current chances for *future* events; for past events, use historical evidence.  
  - **Chance**: Physical propensities that "expire" when events are settled (e.g., chance of heads = 0.5 before flip, 0 or 1 after).  
  - **Deference Operation**: Set *C(A) = ch_t(A)* only if *t* is before *A*'s occurrence.  
  - **Plausibility**: **Defensible** (avoids problems with past events).  
  - **Answers to your Qs**:  
    - Conditional on event being future; past events use total evidence.  
    - Evidence that *A* is settled blocks deference.  
    - Constrains current credence only for unsettled events.  
    - Explicitly rejects deference for known-settled events.  
  - **Application to Cases**:  
    - Case 1 (AI failure): If deployment is ongoing, deference holds.  
    - Case 2 (coin flip): **Rejects deference** since event is past (even if unknown).  
    - Case 3 (model forecast): Only if the event is future and model yields physical chances.  

  ---

  ### **Which Reading is Doing the Real Work in Rationalist Forums?**
  - **Typical Invocation**: A blend of **Naive Unconditional Deference** and **Epistemic "Chance" Deference**. Users often:  
    - Equate "chance" with any numerical probability (e.g., model outputs).  
    - Ignore admissibility/undermining (e.g., for past events).  
    - Treat deference as an unconditional current-credence constraint.  
  - **Why It Ends Discussions**: It smuggles in a false dichotomy: either accept the number as dogma or be "irrational." This hides substantive disputes about:  
    - Whether objective chances exist for the event (Case 1).  
    - Whether evidence is admissible (Case 2).  
    - Whether models produce chances or epistemic probabilities (Case 3).  

  #### **Is the Argument-Ending Move Justified?**
  - **Case 1 (AI failure)**: **No.** One-off events may lack objective chances (PP/NP assume repeatable trials). Deference here relies on conflating physical chances with epistemic probabilities.  
  - **Case 2 (coin flip)**: **Yes, but overgeneralized.** PP/NP *do* support deference here, but only because the outcome is unknown (making evidence admissible). The slogan ignores this nuance.  
  - **Case 3 (forecasting model)**: **Only pragmatically, not metaphysically.** If the model is well-calibrated, adopting its output is often wise—but calling this "deferring to objective chance" misrepresents epistemology as metaphysics.  

  ---

  ### **Recommendations for Pushback**
  1. **Demand specificity**: Ask which version of "chance" and "deference" they mean.  
  2. **Challenge chance ontology**: For one-off events (Case 1), ask if a physical chance exists or if it's just epistemic.  
  3. **Invoke admissibility**: For past events (Case 2), note that deference only holds if evidence doesn't settle the outcome.  
  4. **Distinguish chance from expertise**: For models (Case 3), clarify that rational agents defer to *experts* (including models), not necessarily "chances."  

  The slogan's power lies in its ambiguity—it collapses the robust, debated structure of the Principal Principle into a soundbite. Resisting it requires restoring the nuance.
