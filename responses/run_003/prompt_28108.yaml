  For the "hopefully nobody asks" question... oof. Probably the one about historical deontology examples failing catastrophically (like Kant's "never lie" leading to murderers at the door). That's brutal because it attacks the core robustness claim. 

  For each rebuttal, the user needs punchy two-minute answers that concede weak points while steering back to their framing. Like for rule conflicts: admit it's hard but argue it's still more tractable than utility weighting. The weaknesses should be noted candidly - no hiding the holes in their armor. 

