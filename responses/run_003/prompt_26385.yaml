prompt: |-
  ok so i've been thinking about moloch scenarios and multipolar traps, and i feel like the standard examples all rely on some version of "each actor defects because they expect others to defect" — it's a coordination failure, a prisoner's dilemma, whatever. but i think there's a whole class of moloch dynamics that don't work that way at all, where the trap is structural even under full cooperation and goodwill, and the usual "just communicate / build trust / change the incentives" fixes do nothing.

  i want you to construct a thought experiment that isolates this. specs:

  - a multipolar trap that arises from optimization pressure or distributed decision-making rather than from defection or competition between misaligned actors.
  - adding more communication, transparency, or genuine goodwill between the parties does not resolve it — the trap is in the structure, not in the intentions.
  - realistic institutional setting (a company, a profession, a government agency — nothing sci-fi, no AI takeoff stuff).
  - two paragraphs max for the scenario itself.

  after the scenario, do three things:
  1. identify the structural feature that makes it a trap despite the absence of defection — what's the actual mechanism?
  2. explain what a naive "moloch = multipolar PD" analysis would miss about this case, and why someone who only thinks of moloch in terms of misaligned incentives would fail to diagnose it.
  3. tell me what would have to change about the setup to dissolve the trap — and whether that change is something the actors inside the scenario could realistically make from within, or whether it requires an outside intervention (and if so, what kind).
