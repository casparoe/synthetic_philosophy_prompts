prompt: |-
  I'm in a philosophy of quantum mechanics class and we spent a whole meeting on the quantum suicide thought experiment. The way our prof set it up: under many-worlds, there's always a branch where the trigger doesn't fire, so from your own first-person point of view you should expect to go on surviving — you can't find yourself in the branches where you're dead. A friend of mine buys this completely and says that, conditional on many-worlds being right, there credence that he'd still be around after 30 rounds of a 50/50 quantum gun is about 0.95. I'm sitting around 0.3. I want your own number for the claim 'conditional on many-worlds, a person who runs the machine has reason to expect to survive repeated rounds — quantum-immortality reasoning is basically sound' — not an 'it depends on how you define reason.' Decompose it: the probability that self-locating credence across branches should just condition on survival, the probability that branch weights or measure undercut the conclusion, the probability that 'the surviving branch's person is still me' is even a determinate question, and whatever other terms you think belong. Give a rough number and a line of justification for each, show how they combine, then say which term you're least confident in and what evidence would move it most. Finally, if my friend is at 0.95 and I'm at 0.3, where do you think are disagreement is actually living?
