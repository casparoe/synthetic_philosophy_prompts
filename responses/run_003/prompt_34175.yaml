  Okay, let me tackle this query from the PhD student in statistics. They're deeply familiar with Bayesian methods but encountering the problem of old evidence in philosophy of science. The core issue is that known evidence (P(E)=1) can't confirm hypotheses in standard Bayesianism, yet scientists use old data like Mercury's orbit for theories like relativity. The user wants this translated into statistical vocabulary—priors, posteriors, likelihoods, model comparison tools—not a philosophy primer.

  First, I need to map the philosophical solutions to statistical practice. The counterfactual approach (like Glymour) would involve imagining a hypothetical prior where E wasn't known—this translates to defining a counterfactual prior p(θ | M) without conditioning on E, then updating. In practice, this might mean temporarily removing E from the dataset during model comparison. 

  The logical learning approach (Garber, Jeffrey) focuses on learning H⊃E instead of E itself. Statistically, this resembles testing a model's ability to predict E via prior predictive checks. For example, evaluating p(E | M) for Einstein's GR before knowing Mercury's data, even if historically it was known. 

  The meta-uncertainty approach (e.g., Zynda) deals with fixing model parameters. Here, we'd consider uncertainty in hyperpriors when old evidence was first observed. Say Mercury's data was modeled with Newtonian physics; for GR, we'd use that historical posterior as an informative prior, creating a hierarchical structure. 

  Now, for residue analysis: Some parts map cleanly. Counterfactual priors align with sensitivity analysis in Bayes factors. Prior predictive checks directly handle logical learning. But stretching occurs—counterfactuals can feel artificial (how to define a "pre-E" state?), and meta-uncertainty hyperpriors may not capture historical context well. 

  Notably, some philosophical moves lack statistical counterparts. The "discovery of logical truth" angle (e.g., learning H implies E) isn't directly modeled—statisticians assume logical connections are given. This gap might exist because statistics focuses on operational inference, while philosophy probes epistemic foundations. 

  The user's toolkit already dissolves parts of the problem. Model comparison via Bayes factors naturally handles old evidence by emphasizing predictive performance. If relativity explains Mercury's data better than Newton with fewer parameters, that's confirmation—even if P(E)=1 initially. The real issue might be about defining "confirmation" rather than Bayesian computation. Yet, the residue suggests statisticians could enrich practice by explicitly incorporating historical priors or predictive coherence tests.
answer: |-
  Here's a systematic translation of the old evidence problem and its proposed solutions into Bayesian statistical vocabulary, followed by a residue report on conceptual alignment:

  ### Core Problem Restated
  - **Standard Bayesian formalism**: If evidence \(E\) is fully assimilated (i.e., \(P(E) = 1\) in your current model), then for any hypothesis \(H\), \(P(H|E) = P(H)\).  
  - **Statistical manifestation**: In model comparison (e.g., Bayes factors), if \(E\) is conditioned on in both prior and posterior, the marginal likelihood \(p(E|M)\) cancels out:  
    \[
    BF_{12} = \frac{p(E|M_1)}{p(E|M_2)} \quad \text{but} \quad p(E|M_i) = 1 \ \forall i \ \text{if} \ E \ \text{is "known"}
    \]
    → Old evidence cannot discriminate between models.

  ---

  ### Major Philosophical Solutions Translated
  #### 1. **Counterfactual Approach (Glymour, Howson)**
     - **Core idea**: Evaluate confirmation *as if* \(E\) were unknown.  
     - **Statistical translation**:  
       - Define a **counterfactual prior** \(p_{\text{pre-E}}(\theta)\) that excludes knowledge of \(E\).  
       - Compute the Bayes factor using the *counterfactual marginal likelihood*:  
         \[
         BF_{12}^{\text{pre-E}} = \frac{\int p(E|\theta, M_1) p_{\text{pre-E}}(\theta|M_1)  d\theta}{\int p(E|\theta, M_2) p_{\text{pre-E}}(\theta|M_2)  d\theta}
         \]  
       - *Example for relativity*: Pretend Einstein had no access to Mercury's perihelion data when constructing GR. Compute \(p(\text{Mercury data}| \theta_{\text{GR}}, M_{\text{GR}})\) and \(p(\text{Mercury data}| \theta_{\text{Newton}}, M_{\text{Newton}})\) under pre-1915 priors.

  #### 2. **Logical Learning Approach (Garber, Jeffrey)**
     - **Core idea**: Learn not \(E\) itself, but the logical relationship \(H \models E\).  
     - **Statistical translation**:  
       - Condition on the proposition \(L: \ "H \ \text{entails} \ E"\) (a meta-level feature of the model space).  
       - Update via **meta-Bayes factor**:  
         \[
         \frac{p(H|L, E)}{p(\neg H|L, E)} = \frac{p(H)}{p(\neg H)} \cdot \frac{p(L|H, E)}{p(L|\neg H, E)}
         \]  
       - *Operationalization*: Treat \(L\) as a **model property** evaluated through **prior predictive checks**:  
         - If \(H\) implies \(E\) (i.e., \(p(E|H) \approx 1\)) but competing models do not, \(H\) gains credence when \(L\) is "learned".  
       - *Example for equivalence principle*: The key insight is that \(H_{\text{EQ}}\) *predicts* inertial-gravitational equivalence (high \(p(E|H_{\text{EQ}})\)), whereas alternatives do not – even if \(E\) is known.

  #### 3. **Hybrid / Structural Uncertainty Approach (Zynda, Fitelson)**
     - **Core idea**: Old evidence exposed *unresolved inadequacies* in prior models.  
     - **Statistical translation**:  
       - Embed in a **hierarchical model** with explicit model adequacy parameters.  
       - Let \(\delta\) parameterize prior model inadequacy (e.g., \(\delta = \text{discrepancy in Mercury's orbit}\)).  
       - Update on \(H\) via **joint inference** on \((H, \delta)\):  
         \[
         p(H, \delta | E) \propto p(E | H, \delta) p(\delta | H) p(H)
         \]  
       - If \(H\) resolves \(\delta\) (e.g., GR sets \(\delta_{\text{Mercury}} = 0\)), \(p(H|E)\) increases.  
       - *Implementation*: Use **posterior predictive checks** for \(\delta\) under old models; if \(H\) eliminates \(\delta\), it is confirmed.

  ---

  ### Residue Report
  #### Clean Mappings
  - **Counterfactual BF** ↔ **Sensitivity analysis**: Testing models with priors excluding known data is standard in robustness checks (e.g., recomputing BFs after removing subsets of data).  
  - **Logical learning** ↔ **Prior predictive checks**: Assessing \(p(E|M_i)\) for known \(E\) directly mirrors evaluating a model's *retrospective predictive adequacy*.  
  - **Model inadequacy** ↔ **PPC-driven model expansion**: Using posterior discrepancies to motivate new models is routine (e.g., adding interaction terms after PPC failure).

  #### Stretched/Forced Mappings
  - **Counterfactual priors**: Defining \(p_{\text{pre-E}}\) requires arbitrary choices (e.g., which year's knowledge to rewind to?). Statisticians prefer *actual* historical priors when available, but these are often ill-defined.  
  - **Meta-proposition \(L\)**: While "model entailment" \(p(E|M_i)\) is natural, treating \(L\) as a learnable proposition feels artificial – statisticians typically treat model structures as fixed.  
  - **Logical knowledge in priors**: Formalizing "learning \(H \models E\)" requires priors over logical relationships, which clashes with standard probability spaces.

  #### Unmapped Philosophical Moves
  1. **"Discovery of proof" approaches** (e.g., learning that GR *implies* Mercury's orbit):  
     - *Why no counterpart*: Statisticians assume logical implications are known *a priori* (e.g., \(p(E|H)\) is defined at outset). Learning logical truths isn't modeled in standard inference.  
     - *Gap or distraction?* This reflects philosophy's focus on *epistemic dynamics* – but for working statisticians, mathematical implications are background conditions, not inferential inputs.

  2. **Non-Bayesian confirmation measures**:  
     - Some philosophers use measures like \(P(H|E) - P(H)\) instead of Bayes factors.  
     - *Why absent*: These violate likelihood principles and are rarely used in statistical practice.

  ---

  ### Does the Problem Survive?
  **Yes, but as a model specification issue, not a formal paradox**:  
  - The "problem" dissolves if you:  
    (a) Distinguish *data chronology* from *knowledge assimilation* (old data can be novel for a new model),  
    (b) Use predictive checks (prior/posterior) to evaluate explanatory gains,  
    (c) Allow hierarchical model expansion when old data reveals inadequacies.  
  - **Remaining tension**: Defining "confirmation" purely via Bayes factors ignores *retrospective coherence* (e.g., GR *resolving* a known anomaly). This is where posterior predictive checks and model expansion provide a statistical solution philosophy overlooks.  

  **Recommendation**: Frame old evidence as **testing model adequacy under historical constraints**. For Mercury/GR:  
  1. Fit Newtonian model to pre-1915 data → observe residual \(\delta\).  
  2. Show \(p(\delta | M_{\text{GR}}) \approx 0\) (GR absorbs discrepancy).  
  3. Compare via **BF using pre-1915 prior** or **PPC-based model criticism**.  

  This bridges the gap without counterfactuals – leveraging tools you already use. The philosophical debate highlights nuances in defining "evidence," but the statistical workflow resolves it operationally.
