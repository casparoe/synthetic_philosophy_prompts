  Starting with the literal interpretation: small causes can have large effects. But that's trivial. Then there's the idea that such events are unpredictable, which ties into chaos theory. Another angle is the necessity of each event in a chain—counterfactual dependence. Also, the role of contingency versus structural factors. And the epistemological point about unpredictability.

  The professor argued that WWI wasn't structurally inevitable but depended on small missteps. To make that case, he needs a strong contingency claim: that without those specific small events, the outcome would differ. But that's inherently counterfactual. His defense about sensitive dependence (chaos theory) still implies counterfactuals because chaos theory uses models that simulate "what if" scenarios. 

  The user's professor might be trying to avoid counterfactuals by framing it as unpredictability. But to argue that small events caused WWI, he must imply that changing them would alter the outcome. That's counterfactual reasoning. The professor's skepticism about counterfactuals conflicts with his use of the proverb here. 

