  Hmm, the six points they listed are all interconnected. The sorites paradox is the obvious starting point - every theory must engage with it. But I recall Williamson's point that merely blocking the inference isn't enough; the theory must also explain why the paradox feels compelling. That's crucial for epistemicism versus supervaluationism debates.

  Borderline cases... here's where things get tricky. The stipulation problem (why can't we just define "bald" precisely?) seems non-negotiable. But must a theory explain why some predicates are vague? Maybe not - that could be a metaphysical question outside semantics. Still, Sorensen's observation about sorites-susceptibility being contingent is worth noting.

  Ah, higher-order vagueness - the real killer. If a theory draws sharp boundaries between clear/borderline cases, it just recreates the paradox. Supervaluationism struggles here with its "definitely" operator. The user's "ladder" metaphor is apt - can we kick it away? Probably not, given the forced-march problem later.

  Logical revisionism... this divides the field sharply. Classical logic defenders like Williamson versus many-valued logicians. The key is what we sacrifice: bivalence or inferential power? The user wants to know the trade-offs, especially regarding penumbral connections. Those connections (nothing can be red and orange) might actually constrain how much we can revise logic.

  Speaking of penumbral connections - they seem fundamental but perhaps derivable? No, actually Keefe's point about them ruling out some fuzzy logics suggests they're independently important. The color exclusion example is perfect for illustrating this.

  Forced-march sorites... oh this is nasty. It exposes how some theories work abstractly but collapse under sequential questioning. The temporal aspect matters - Raffman's work shows how context shifts during the march. A theory must either explain this shifting or deny the need for definite answers. But denying seems counterintuitive.

  Now the big question: incompatibilities. The user suspects classical logic + higher-order vagueness leads to infinite regress. They're right - Shapiro and others show this metalanguage hierarchy problem. And yes, preserving classical logic while handling higher-order vagueness cleanly might be impossible without massive complications. That's probably the biggest eliminative desideratum.

  If I had to pick one knockout criterion? Higher-order vagueness treatment. It sinks epistemicism and naive supervaluationism, pressures many-valued logics, and forces contextualists into complex maneuvers. The forced-march is its practical manifestation. 

  The user's clearly aiming for theory comparison, so I'll conclude by mapping how each major approach scores on these. The tensions they mentioned - especially the classical logic/higher-order vagueness clash - deserve emphasis since that's where current research is stuck.
answer: |-
  You've identified the core tension: theories of vagueness often prioritize different desiderata, leading to apparent incommensurability. Here's a breakdown of the key requirements, their motivations, negotiability, and the tensions between them:

  1.  **The Sorites Paradox**
      *   **Requirement:** An adequate theory *must* block the paradoxical conclusion (e.g., that one grain is a heap, or that no one is bald) while explaining why the reasoning *seems* compelling. Merely blocking the inference (e.g., denying tolerance or universal quantification) is necessary but insufficient. The theory must account for the *plausibility* of the tolerance principle ("one grain can't make the difference") and our inability to identify a sharp cutoff.
      *   **Motivation:** The paradox is the central problem driving the entire field. A theory that doesn't resolve it fails its primary task. The datum is the intuitive pull of the argument despite its absurd conclusion.
      *   **Non-Negotiable:** Blocking the paradox is **non-negotiable**. Explaining its pull is **highly desirable, bordering on non-negotiable** – a theory that simply declares tolerance false without explaining *why* it seemed true is deeply unsatisfying. (Epistemicism accepts a sharp cutoff but explains the pull via ignorance; Supervaluationism blocks universal quantification; Degree theories reject bivalence/classical logic for borderline cases).
      *   **Explanatory Burden:** The theory must explain the *illusion* of tolerance or the *illusion* of no sharp boundary. It must explain why we *can't know* the cutoff (Epistemicism), why there *is no fact of the matter* (Supervaluationism), or why the property itself is *gradual* (Degree theories).

  2.  **Borderline Cases**
      *   **Requirement:** The theory must explain what borderline cases *are* (ontologically and/or epistemically) and why they resist resolution by stipulation ("Let's just define 'bald' as having less than 1000 hairs" doesn't eliminate borderline cases near 1000).
      *   **Motivation:** The existence of unclear cases (e.g., a man with 3000 hairs – bald or not?) is a defining feature of vagueness. The failure of stipulation shows vagueness isn't merely semantic indecision.
      *   **Non-Negotiable:** Explaining the nature and resistance of borderline cases is **non-negotiable**. A theory denying their existence (radical nihilism) or claiming they are easily eliminable fails.
      *   **Separate Question?** Explaining *why some predicates are vague* (e.g., "bald" vs. "prime number") is **largely separable**. A semantic/pragmatic theory (Supervaluationism, Contextualism) might leave the source of the initial semantic indecision/unclarity unexplained, focusing on how language *works* with vague predicates. A metaphysical theory (some Degree theories) might posit vague properties. A theory *can* be adequate without fully explaining the origin of vagueness in all predicates, though it should be compatible with plausible explanations.

  3.  **Higher-Order Vagueness**
      *   **Requirement:** The theory must avoid introducing a sharp boundary *between* clear cases and borderline cases (or between borderline cases of different orders). It must explain the apparent lack of such boundaries without generating an infinite regress or other intractable problems.
      *   **Motivation:** If "clearly bald" has a sharp boundary, then a sorites paradox arises for *that* predicate ("Is a man with 2001 hairs *clearly* not bald?"). The datum is the intuitive feeling that the transition from clear cases to borderline cases is itself gradual and unsharp.
      *   **Non-Negotiable:** Handling higher-order vagueness **is a genuine requirement**. A theory that posits sharp boundaries at *any* level (e.g., naive Supervaluationism's "definitely" operator, Epistemicism's unknowable boundaries) recreates the sorites problem at a meta-level. Kicking the ladder away is not viable.
      *   **Satisfactory Treatment:** A theory must either:
          *   **Eliminate the appearance:** Show that higher-order vagueness is illusory or reducible to first-order phenomena without sharp boundaries (e.g., sophisticated Contextualism, some Degree theories with fuzzy "definiteness" operators).
          *   **Show it's Harmless:** Develop a framework where infinitely many orders of vagueness are coherent and non-paradoxical (e.g., some complex Degree theories or modal approaches, though often at high cost).
          *   **Absorb it:** Make vagueness at all orders an intrinsic, unproblematic feature (e.g., some paraconsistent or dialetheic approaches, though controversial).

  4.  **Logical Revisionism**
      *   **Requirement:** The theory must specify the logic governing vague statements. Preserving classical logic (bivalence, excluded middle, etc.) is desirable but not mandatory if necessary to meet other desiderata. If revising logic, the theory must provide a complete, consistent, and usable alternative logic, explaining how reasoning with vague predicates should proceed and how it relates to classical reasoning in precise domains.
      *   **Motivation:** Classical logic leads directly to the sorites paradox if bivalence and standard quantification/inference rules are applied uncritically to vague predicates. The datum is the apparent failure of bivalence in borderline cases.
      *   **Non-Negotiable:** Preserving classical logic is **not non-negotiable**, but revising it carries a **significant burden of proof**. The revised logic must:
          *   Avoid the sorites and handle higher-order vagueness.
          *   Preserve intuitive validities (e.g., Modus Ponens in clear cases).
          *   Be practically usable.
          *   Explain its deviation from classical logic (e.g., is it describing a different *reality* or a different *convention*?).
      *   **What is Owed:** A complete semantics and proof theory for the alternative logic, plus a justification for why classical logic fails *for vague discourse* and how/when the two logics interface (e.g., "In precise scientific contexts, use classical logic; in everyday vague talk, use this logic").

  5.  **Penumbral Connections**
      *   **Requirement:** The theory must account for necessary conceptual relationships between vague predicates, ensuring that certain combinations cannot hold (e.g., nothing can be both clearly red and clearly orange all over; if clearly tall, then not clearly short; if borderline tall, then borderline not-tall).
      *   **Motivation:** These connections are integral to the meaning of the predicates. Violating them (e.g., allowing something to be both clearly red and clearly orange) renders the theory semantically inadequate. The datum is our intuition about the incompatibility of certain properties.
      *   **Non-Negotiable:** Handling penumbral connections is **non-negotiable**. A theory that violates them fails to capture the meaning of the vague terms involved.
      *   **Separate Requirement?** While arguably falling under "adequately describing the semantics of vague language," penumbral connections provide **strong, independent constraints**. They rule out otherwise plausible logics (e.g., simple three-valued Łukasiewicz logic fails "if borderline P, then borderline not-P", some fuzzy logics struggle with color incompatibilities).
      *   **How Met:** Often requires specific constraints on truth-value assignments or admissibility conditions in the semantics (e.g., Supervaluationism's "admissible precisifications", Degree theories needing specific truth-functional connectives or constraints on interpretations).

  6.  **The Forced-March Sorites**
      *   **Requirement:** The theory should not collapse or force the theorist into inconsistent or counter-intuitive answers when required to classify each item in a sorites sequence sequentially (e.g., "Is 1 grain a heap? (Yes) Is 2? (Yes)... Is 10,000? (No)").
      *   **Motivation:** Tests the *dynamic* and *practical* adequacy of the theory. A theory might resolve the static paradox but fail when asked to make a series of judgments, seemingly forcing a sharp cutoff or arbitrary answers inconsistent with its semantics (e.g., a supervaluationist forced to say "No" at some point, implying a sharp boundary on that occasion, contradicting the claim that no precisification is uniquely correct).
      *   **Fair Test?** It **is a fair test**, but the theory is entitled to reject the assumption that *every* statement in the series must be *definitively answerable* with a classical "Yes" or "No" *in a forced sequential context*. A theory can legitimately say:
          *   Some answers *must* be "Borderline" or involve degrees (Degree theories).
          *   The context *shifts* during the march, making earlier answers inappropriate later (Contextualism).
          *   The forced march exploits psychological pressure to make an arbitrary choice, but this doesn't reflect semantic truth (Epistemicism, Supervaluationism).
          *   The questioner is demanding a classical answer where none exists.
      *   **Non-Negotiable:** A theory must **provide a coherent account of what happens during the forced march** that is consistent with its core semantics and doesn't force an *acknowledged* sharp boundary. It doesn't necessarily need to provide definite "Yes/No" answers for every item.

  **Impossibility Results and Key Tensions:**

  1.  **The Core Tension (Classical Logic + Higher-Order Vagueness):** This is the most significant clash.
      *   **The Problem:** Preserving classical logic (especially bivalence and excluded middle) while fully accommodating higher-order vagueness seems to require an **infinite hierarchy of metalanguages** or operators ("definitely", "definitely definitely", etc.). Each "definitely" operator introduces a sharp boundary between where it applies and where it doesn't, requiring a *new* vague "definitely" operator for *that* boundary, ad infinitum (the "higher-order vagueness regress").
      *   **The Near-Impossibility:** Avoiding this regress while keeping classical logic seems to force one of:
          *   **Rejecting Higher-Order Vagueness:** Claiming the boundary between "definitely P" and "not definitely P" is sharp. This recreates the sorites at the meta-level (problematic for Epistemicism, naive Supervaluationism).
          *   **Embracing the Regress:** Developing a consistent, finitely manageable (but infinitely ascending) hierarchy. This is complex and arguably unnatural.
          *   **Revising Classical Logic:** Giving up bivalence/excluded middle for borderline cases (Degree theories), or introducing context-sensitivity that blurs the meta-boundaries (Contextualism).
      *   **Implication:** Satisfying the **Handling Higher-Order Vagueness** and **Preserving Classical Logic** desiderata simultaneously is extremely difficult, arguably impossible without significant theoretical cost or complication. This tension eliminates or severely pressures many theories.

  2.  **Penumbral Connections vs. Simple Many-Valued/Fuzzy Logics:** Simple 3-valued or fuzzy logics often struggle to model penumbral connections correctly without ad hoc adjustments (e.g., ensuring `clearly P` entails `not clearly not-P`). This rules out the simplest non-classical approaches.

  **The Most Eliminative Desideratum:**

  **Handling Higher-Order Vagueness Satisfactorily** is likely the single most eliminative requirement.

  *   **Why:** It decisively challenges:
      *   **Epistemicism:** Posits unknowable but sharp boundaries at *all* levels, failing to explain the *appearance* of higher-order vagueness.
      *   **Naive Supervaluationism:** Introduces a sharp boundary via the "definitely" operator.
      *   **Simple Many-Valued Logics:** Often replace a sharp first-order boundary with a sharp meta-boundary between truth-values.
      *   **Theories without a Robust Account:** Any theory that doesn't explicitly and successfully address how the transition from clear to borderline (and beyond) is itself vague or unproblematic falls short.
  *   **Impact:** Only sophisticated versions of Contextualism, Degree Theories (with fuzzy meta-operators), or radically revisionist logics (e.g., paraconsistent) have plausible (though often complex and debated) strategies for handling it without sharp boundaries or infinite hierarchies. It forces theories to confront the deepest aspects of the phenomenon.

  **Conclusion:**

  An adequate theory of vagueness **must** resolve the sorites paradox (including explaining its pull), account for the nature and resistance of borderline cases, satisfactorily handle higher-order vagueness without sharp boundaries, respect penumbral connections, and offer a coherent account of the forced-march sorites. Preserving classical logic is a strong preference but can be sacrificed if the alternative logic is well-motivated, complete, usable, and demonstrably necessary to meet the other core requirements. The most significant tension lies between preserving classical logic and handling higher-order vagueness cleanly, making the latter the most demanding and eliminative desideratum. No current theory satisfies all desiderata perfectly; each prioritizes some over others, leading to the sense of talking past one another. Your goal of evaluating theories against this explicit framework is precisely the right approach.
