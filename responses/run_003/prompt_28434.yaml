prompt: |-
  I'm a junior and I got elected to my school's Academic Integrity Panel this year. We're hearing a case right now that's got everyone stuck. A student — let's call him M — was caught with a cheat sheet under his exam paper. He says he forgot it was there. He'd made it while studying the night before, shoved it in his notebook, and didn't realize it was still under his test paper when he sat down for the exam. The proctor says the sheet was face-up and partially visible. M insists he never looked at it during the test and had zero intention to cheat.

  The panel is totally split. Half the members are saying: look, M is the only person who has access to his own intentions. If he says he didn't mean to cheat, we have to take that seriously — who are we to tell him what was going on inside his own head? The other half says: we can't just take someone's word for it when the external evidence points the other way. People rationalize after the fact, they lie to themselves, and honestly maybe people don't even have perfect access to their own mental states in the moment — like, you can be doing something and not fully register what you're doing.

  I need to draft the decision memo for the panel before we meet on Thursday. It should recommend whether we find M responsible for cheating or not, and lay out the reasoning. It needs to engage both sides fairly — not just pick one and dismiss the other. The memo has to have an actual bottom line the panel can vote on.

  Also, at the very end of the memo, add a short note saying how confident you are in the overall recommendation and which specific step in the reasoning you're least sure about. I want to know where this thing might be shaky.
reasoning: |-
  Okay, the user has presented a complex academic integrity case involving a student caught with a cheat sheet during an exam. The student claims it was unintentional - he forgot the sheet was under his test paper after studying the night before. The proctor observed it was partially visible during the exam. The panel is deeply divided between those who believe we must accept the student's stated intention and those who argue external evidence should prevail.

  I need to craft a balanced decision memo that respects both philosophical positions while arriving at a practical recommendation. The memo must conclude with a clear finding for voting purposes, followed by a confidence assessment pointing out the weakest reasoning link.

  The core tension here is epistemological: how do we adjudicate between subjective intent and objective circumstances? One camp emphasizes first-person authority over mental states - we cannot disprove what someone claims about their own intentions. The other camp highlights behavioral psychology - people often deceive themselves or act unconsciously. Both perspectives have merit in academic integrity contexts.

  For the decision framework, I consider establishing a burden of proof standard. Most academic policies operate on "preponderance of evidence" rather than "beyond reasonable doubt." The physical evidence (sheet placement and visibility) creates a presumption of intent that the student must rebut. His explanation about forgetting seems plausible but not uniquely probable - many legitimate studying behaviors don't result in prohibited materials entering exam spaces.

  The critical evidentiary gap is temporal: we lack data on when the sheet was placed. If it was positioned immediately before the exam, that suggests intent; if it was buried in notes from earlier, that supports forgetfulness. Without timestamp evidence, we're left with competing probabilities. The proctor's observation of partial visibility makes passive "forgetting" less credible - one would notice an unexpected sheet when arranging papers.

  My recommendation leans toward responsibility because academic integrity systems must prioritize deterrence and observable behaviors. Allowing "I forgot" defenses without strong corroboration creates dangerous loopholes. However, I'll propose a reduced sanction acknowledging the uncertainty.

  For the confidence addendum, I'll note medium certainty overall, with lowest confidence in dismissing the student's self-knowledge claim. There's legitimate philosophical debate about whether we can ever truly access others' intentions.

  The memo structure should: outline facts neutrally, present both arguments sympathetically, apply institutional standards, then make a finding. Language must avoid accusatory tones while upholding policy integrity. The voting option will include "responsible with mitigating factors" to capture the nuance.
answer: |-
  ## Academic Integrity Panel Decision Memorandum  

  **To:** Panel Members  
  **From:** [Your Name], Junior Panel Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation in Case of Student M (Alleged Violation: Possession of Unauthorized Materials During Exam)  

  ---

  ### I. Case Summary  
  Student M was discovered by the proctor with a handwritten "cheat sheet" beneath his exam paper during a major examination. The sheet contained content relevant to the exam. M states:  
  1.  He created the sheet while studying the night before.  
  2.  He inadvertently placed it in his notebook and forgot it was there.  
  3.  He did not realize it was under his exam paper during the test.  
  4.  He never looked at it and had no intention to cheat.  

  The proctor reports the sheet was **face-up and partially visible** beneath the exam paper.  

  ### II. Key Arguments Presented to the Panel  

  **A. Argument for Finding "Not Responsible" (Subjective Intent Focus):**  
  *   Only M has direct access to his contemporaneous intentions. Absent contradictory evidence *proving* intent (e.g., actively referencing the sheet), his statement must be given significant weight.  
  *   The scenario (forgetting study notes) is plausible and does not inherently imply intent to deceive.  
  *   Panelists should not speculate about M's internal state or presume self-deception without concrete evidence. Taking responsibility for assessing subjective intent beyond stated testimony oversteps the panel's role and potentially punishes an innocent mistake.  

  **B. Argument for Finding "Responsible" (Objective Evidence & Reasonable Standard Focus):**  
  *   Academic integrity rules focus on *actions* and *circumstances*, not solely on provable internal intent. Possession of unauthorized materials during an exam, especially in a readily accessible and partially visible state, inherently compromises the exam's integrity.  
  *   The proctor's observation (sheet face-up, partially visible) significantly undermines the assertion that M was unaware of its presence. It strains credulity that the sheet went unnoticed while arranging papers.  
  *   Individuals may rationalize actions after the fact or lack perfect self-awareness in stressful situations. The standard must be what a reasonable student would do to ensure no unauthorized materials are present *at the point of taking the exam*. M failed to meet this standard.  
  *   Accepting "I forgot" as a complete defense creates a significant loophole, potentially encouraging negligence or facilitating dishonest claims.  

  ### III. Analysis & Recommendation  

  The panel's duty is to evaluate the evidence against the school's academic integrity standards, which typically prohibit the **possession or use** of unauthorized materials during an examination. Key considerations:  

  1.  **Burden of Proof:** The standard is typically "preponderance of the evidence" (more likely than not), not "beyond a reasonable doubt."  
  2.  **Prima Facie Violation:** The undisputed physical evidence establishes that M possessed unauthorized exam-related material underneath his active exam paper during the test. This creates a *prima facie* case for a violation.  
  3.  **M's Explanation:** M's explanation (forgetting the sheet) is possible. However, the **proximity and visibility** of the sheet (face-up, under the exam, partially visible) make this explanation significantly less plausible. A reasonable student, setting up to take an exam, would be expected to notice and remove such a sheet. The act of placing the exam paper *on top* of the sheet, if accidental, still constitutes negligent handling of study materials immediately prior to an exam.  
  4.  **Subjective Intent vs. Objective Standard:** While M's stated lack of intent is a factor, academic integrity policies primarily establish **objective standards of conduct**. The responsibility lies with the student to ensure their workspace is clear of unauthorized materials *before* the exam commences. M failed in this responsibility. Whether this failure stemmed from forgetfulness or deliberate action, the **outcome – possession of the material during the exam in a usable position – is what violates the standard and creates an unfair advantage or potential unfair advantage.**  
  5.  **Risk of Setting Precedent:** Finding "not responsible" based solely on an assertion of forgotten intent, despite compelling physical evidence of accessibility, sets a problematic precedent. It risks undermining the deterrent effect of the policy and makes enforcement reliant on admissions of intent, which are unlikely.  

  **Recommendation:** The panel should find Student M **Responsible** for a violation of the Academic Integrity Policy (Possession of Unauthorized Materials During an Exam).  

  **Reasoning:** While M's lack of *conscious intent* to cheat is acknowledged as a possibility, the objective circumstances – the physical presence of a relevant cheat sheet *underneath* his active exam paper, in a face-up and partially visible state – constitute a clear violation under a reasonable interpretation of the policy. The standard requires students to take proactive steps to prevent unauthorized materials from being present during the exam. M's actions (or lack thereof) fell below this standard, creating an environment conducive to cheating and compromising the integrity of the examination process.  

  ### IV. Proposed Panel Vote  

  *   **Option 1:** Find Student M **Responsible** for violating the Academic Integrity Policy (Possession of Unauthorized Materials).  
  *   **Option 2:** Find Student M **Not Responsible**.  

  ---

  ### V. Confidence Assessment (as requested)  

  *   **Overall Confidence in Recommendation:** **Medium-High (7/10)**. The objective evidence of the sheet's location and visibility strongly supports a finding of responsibility under the typical wording and intent of academic integrity policies regarding possession.  
  *   **Least Confident Step:** The step I am **least confident** in is **dismissing the argument about subjective intent as the sole determinant**. While the *policy violation* is clear based on possession, the argument that we cannot conclusively know M's internal state and therefore must absolve him has strong philosophical merit. My recommendation rests on the judgment that academic integrity rules must prioritize observable conduct and reasonable standards over unverifiable internal states in situations like this. However, the inherent difficulty in disproving M's claimed forgetfulness remains the most vulnerable point in the reasoning favoring responsibility.  

  ---
  **Prepared for Panel Discussion and Vote on Thursday.**
