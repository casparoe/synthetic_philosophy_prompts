prompt: |-
  I'm a novelist, working on a near-future political novel where a country switches to sortition — selecting its legislature by lottery. While researching, I've been reading real-world proposals and case studies of citizens' assemblies, and I keep noticing a pattern that's driving me nuts. It goes like this: someone proposes giving a randomly-selected citizens' assembly real legislative power. The response is almost always, "Interesting idea, but let's start with a purely advisory pilot and see how it does." Then, if the pilot works well, the conclusion is "Great, it's working as an advisory body, let's keep it that way." If the pilot falters — often precisely because it has no real power and people treat it as a performative exercise — the conclusion is "See, sortition doesn't scale." Either way, the pilot never graduates to actual power. It feels like a trap, but a trap that isn't just generic institutional inertia, because the pilot itself is used as the justification for never moving beyond it. Is there a name for this specific dynamic? If not, can you give it one and distinguish it from related things like regulatory capture, the overton window, or plain old foot-dragging?
reasoning: |-
  Okay, the user is a novelist working on a near-future political novel about sortition. They've noticed a frustrating pattern in real-world proposals: citizens' assemblies are only tested as advisory bodies, and regardless of success or failure, they never get upgraded to having real legislative power. They want to know if this dynamic has a name or if I can coin one that distinguishes it from similar concepts.

  First, I need to understand their core observation. They describe a cycle where a pilot is set up as advisory. If it works well, the conclusion is to keep it advisory. If it fails (often because it lacks power), the conclusion is that sortition doesn't work. Either way, it never progresses to real power. The user feels this is a specific kind of trap beyond general inertia.

  Looking at related concepts, regulatory capture involves industries influencing regulators. The Overton Window is about shifting acceptable policy ideas. Foot-dragging is just delay. None quite fit this dynamic. The user wants something that captures the structured way the pilot is used to avoid change.

  I recall similar patterns in other fields. In tech, "permanent beta" keeps products in testing to avoid full commitment. In policy, "pilotitis" refers to endless small-scale trials without scaling. But these don't fully capture the double-bind aspect the user describes—where both success and failure are used to justify stagnation.

  The key elements here are: the advisory pilot as a controlled experiment, the avoidance of real power transfer, and the self-reinforcing justification. Success maintains the status quo as "good enough," while failure "proves" the idea isn't viable. It's a form of containment disguised as prudence.

  For naming, I should create a term that encapsulates this. "Advisory Trap" highlights the stuck state but misses the systemic nature. "Power Containment Loop" emphasizes the cycle and intentional restriction. "Sortition Containment Paradox" is more precise but jargon-heavy. "Pilot Limbo Syndrome" is catchy but less specific. The user might prefer a term that's both descriptive and novelistic.

  The user's deeper need might be for a conceptual tool to critique this dynamic in their novel. They might want terminology that characters could use or that frames the conflict. Identifying this as a systemic tactic could add depth to their political narrative. They might also appreciate real-world examples to ground the concept.

  I should ensure the term is distinct from related ideas. This isn't just delay—it's a structured process that neutralizes the threat of change. It's more active than inertia, a deliberate strategy to co-opt and defuse reform. The proposed names should reflect that nuance.

  Finally, I'll suggest "The Advisory Trap" as the primary term, with "Pilot Limbo" as an alternative. I'll explain why it's distinct and how it functions, linking it to concepts like decoy institutions. This should give the user both the terminology and the analytical framework they need for their novel.
answer: |-
  That's an **exquisitely observed pattern**, and it's absolutely a distinct dynamic – one deeply frustrating for advocates of empowered sortition. While there isn't a single universally accepted academic term *yet*, here are the best ways to conceptualize and name it, distinguishing it from related concepts:

  1.  **The Advisory Trap:** (Most intuitive & descriptive for your purpose)
      *   **Why it fits:** This directly names the mechanism you describe. The proposal for *power* is diverted into an *advisory* format. This format then becomes the permanent cage.
      *   **How it's distinct:**
          *   **vs. Generic Inertia/Foot-Dragging:** It's not just delay; it's an *active substitution* and *redefinition* of the goal. The pilot *itself* becomes the endpoint, justified by its own existence ("it works advisory, why change?" or "it failed advisory, why empower?").
          *   **vs. Regulatory Capture:** Capture implies an *external* interest group co-opting the institution. This is often an *internal* institutional logic or elite preference for maintaining control, using the advisory format as a tool to *prevent* capture (or more accurately, prevent loss of their own power).
          *   **vs. Overton Window:** While related, the Overton Window is about shifting the range of acceptable discourse. This is a specific *tactic* deployed *within* the existing window to neutralize a challenging idea by channeling it into a harmless form.

  2.  **The Pilot Limbo / Pilot Purgatory:**
      *   **Why it fits:** Captures the state of being perpetually stuck in a "testing" phase that never concludes with a transition to full implementation. Success or failure within the limbo doesn't grant release; it just reinforces the need to *stay* in limbo.
      *   **How it's distinct:** Focuses on the *stasis* and the *failure to graduate*, regardless of performance. It highlights the disconnect between the stated purpose ("let's test") and the actual outcome (permanent testing).

  3.  **The Power Containment Loop / Sortition Containment Strategy:**
      *   **Why it fits:** Positions the advisory pilot as a deliberate mechanism to *contain* the threat of losing elite/institutional power. The loop is self-reinforcing: Advisory structure -> Predictable limitations (lack of power causing disengagement/cynicism or success being defined narrowly) -> Used as justification against empowerment -> Maintains advisory structure.
      *   **How it's distinct:** Explicitly frames it as a *strategy* or *system* for maintaining the status quo power structure by controlling and limiting the reform. It's more active than inertia.

  4.  **The Decoy Institution Effect:**
      *   **Why it fits:** The advisory assembly functions as a "decoy" – it satisfies the *appearance* of reform and citizen engagement, soaking up energy and demands for change, while actually *deflecting* the more radical demand for real power-sharing. Its existence (whether "successful" or "failed" in its limited role) becomes the argument against the real thing.
      *   **How it's distinct:** Focuses on the *symbolic function* of the pilot as a substitute that neutralizes pressure for the genuine article.

  **Why it's more than just Inertia:**

  This dynamic involves **active agency and strategic deflection**:

  1.  **Re-definition of Success:** Success is pre-defined *only* in advisory terms (e.g., "good deliberation," "representative sample," "informed recommendations"). Success in *influencing* or *deciding* is excluded from the pilot's remit and therefore its metrics.
  2.  **Setting Up for Failure (or Limited Success):** By denying the assembly real power, the conditions are created where:
      *   **Disengagement/Cynicism:** Participants and the public see it as a talking shop, leading to apathy or performative participation. This is then cited as proof citizens "aren't ready" or "don't want" power.
      *   **Ignored Recommendations:** When (well-considered) recommendations are dismissed by elected officials, it undermines the assembly's legitimacy and public trust in the *process*, not necessarily the officials.
      *   **"Success" as Proof it's Unnecessary:** If the advisory body functions well and its recommendations are (selectively) adopted, it's used to argue the *advisory* model is sufficient – "Why fix what isn't broke?" (ignoring that the "fix" was about power-sharing, not just advice).
  3.  **Moving the Goalposts:** The initial promise is often implied ("if this works, we might consider more"). But when the pilot meets its *advisory* goals, the goalposts shift to needing *more* evidence, *bigger* pilots, or different metrics for *power* that weren't part of the original pilot design.
  4.  **Co-option:** The advisory pilot absorbs the energy and legitimacy of the sortition idea, channeling it into a form that poses no threat to existing power structures. It becomes a "safe" outlet.

  **For Your Novel:**

  *   **Use "The Advisory Trap":** It's the clearest, most evocative term for readers. Characters can explicitly name it as the systemic barrier they're fighting against.
  *   **Explore the Motivations:** Show *why* the establishment prefers this trap: fear of losing control, belief in elite expertise, distrust of the masses (masked as "pragmatism"), protecting special interests, or simply the comfort of the known.
  *   **Show the Double-Bind:** Dramatize a pilot succeeding brilliantly as an advisory body, only to have its success used as the reason *not* to empower it. Conversely, show one struggling precisely *because* it's toothless, and that struggle being weaponized.
  *   **Invent a Term In-Universe:** Maybe critics call it "The Pilot Paradox," "The Deliberation Delay," or "The Citizen Cage." Proponents might rage against "Advisory Theatre" or "The Infinite Test."

  This dynamic is a critical insight into how radical democratic reforms are often neutered. It's not just resistance; it's a sophisticated form of institutional capture that uses the *appearance* of openness and experimentation to *prevent* genuine change. Naming it – "The Advisory Trap" – is the first step to defeating it, both in fiction and potentially in reality. Good luck with the novel; it sounds fascinating!
