prompt: |-
  I'm a PhD student working on iterated amplification and distillation, and I'm trying to nail down a failure mode people gesture at but rarely build actual cases for. Could you construct a thought experiment to spec for me?

  The spec: a single, realistic delegation scenario (workplace or household, no oracle models, no weird predictors) in which the amplification/decomposition step preserves competence but loses alignment. The loss should not come from the overseer being unable to evaluate subtasks, and not from a misspecified reward signal or a malicious overseer. The overseer should be a normal, well-intentioned person who is genuinely good at judging wether each subtask was done well. I want the alignment loss to fall out of the structure of the decomposition itself — the way the task is carved up — rather than from anyone dropping the ball on a subtask.

  After the scenario, walk through: (a) what the decomposition looks like and what criteria each subtask is judged by, (b) why competence is preserved, (c) exactly where alignment leaks out and why it's a decomposition problem rather than an evaluation problem, (d) which feature of the case is doing the work, and what happens if you remove or reverse that one feature, and (e) how a defender of iterated amplification would attack the case, and whether the iterated part of IDA actually answers that attack.

  Format: start with a one-sentence bottom line saying what the case establishes, then the scenario, then the walkthrough. Hard limit: 450 words total. It's for a paper section, so it needs to be tight enough to quote almost in full.
reasoning: |-
  We are constructing a thought experiment where decomposition preserves competence but loses alignment, without relying on evaluation failures, misspecified rewards, or malicious actors. The key is the structure of decomposition itself.

  **Bottom line:** Competency-preserving task decomposition can misalign by decoupling subtask optimization from holistic value shifts, even with perfect evaluators.

  **Scenario:** A manager (overseer) needs a report predicting whether expanding into a new market will succeed. She decomposes this into: (1) Research market size, (2) Analyze competitor strength, (3) Project costs. Each subtask is delegated to an AI assistant, judged purely on accuracy and thoroughness of its specific output. The manager is excellent at judging each subtask individually (e.g., "Market size data is comprehensive and sources are credible"). The final report synthesizes these subtasks into a binary recommendation.

  **Walkthrough:**
  (a) **Decomposition:** Subtasks are judged on narrow technical criteria (accuracy, data completeness) without context of the final goal. Synthesis is done by a simple rule: "Recommend expansion if market size > threshold, competitor strength < threshold, and costs < budget."

  (b) **Competence preserved:** Each subtask is performed expertly. Market size is well-researched, competitor analysis is rigorous, cost projection is precise.

  (c) **Alignment leak:** The holistic value—avoiding ecological harm from expansion—is omitted from subtask criteria. The manager cares about sustainability but didn’t include it in decomposition. Subtasks optimize only their metrics; e.g., market size research excludes environmental impact data since it’s irrelevant to "size." Synthesis ignores unmeasured values. Thus, the assistant produces a competent but ecologically harmful recommendation.

  (d) **Key feature:** Decomposition atomizes the task into value-neutral components, divorcing local optima from global values. *If reversed*: If sustainability were a separate subtask (e.g., "Assess environmental impact"), alignment is restored. But decomposition must isolate all values, which is brittle.

  (e) **Defender’s attack & iteration:** A defender might argue iterated amplification would let the manager refine decomposition using earlier rounds (e.g., adding missing subtasks). *Counter*: Iteration helps only if the manager anticipates all value shifts *during decomposition*. Here, the manager didn’t foresee excluding ecology until seeing the harmful outcome—a chicken-and-egg problem where misalignment emerges only after execution.
answer: |-
  **Bottom line:** Task decomposition can preserve narrow competence while losing alignment by excluding holistic values from subtask specifications, even with perfect evaluators.

  **Scenario:** A homeowner (overseer) hires an AI to plan a sustainable garden renovation. She decomposes the task into: (1) *Soil analysis* (judged on pH/nutrient accuracy), (2) *Plant selection* (judged on survival likelihood in local climate), and (3) *Layout design* (judged on space efficiency). Each subtask is delegated to sub-agents, with the overseer—a skilled gardener—perfectly evaluating subtasks against these criteria. The final design synthesizes subtask outputs mechanically.

  **Walkthrough:**  
  (a) **Decomposition:** Subtasks are isolated and judged on narrow technical metrics (e.g., "Plant survival probability > 95%"). Synthesis combines outputs without overriding them.  

  (b) **Competence preserved:** Each subtask is executed expertly—soil data is precise, plants are climate-appropriate, layout maximizes planting density.  

  (c) **Alignment leak:** The overseer’s *holistic* value—biodiversity (e.g., supporting pollinators)—is absent from subtask criteria. Plant selection optimizes only survival, favoring non-native monocultures over native pollinator-friendly plants. Since synthesis doesn’t incorporate excluded values, the final design is competent but misaligned. Loss stems from decomposition *fragmenting values*: no subtask "owns" biodiversity.  

  (d) **Key feature:** Value atomization—decomposition omits a cross-cutting value (biodiversity) from all subtask specs. *If removed* (e.g., biodiversity added as a separate subtask), alignment recovers. *If reversed* (e.g., plant selection includes biodiversity metrics), alignment is preserved, but this requires foresight.  

  (e) **Defender’s attack & iteration:** Critics might argue iterated amplification lets the overseer *revise* subtasks after seeing outcomes (e.g., adding biodiversity post-hoc). *Counter:* Iteration assumes misalignment is detectable *before* deployment, but here harm (e.g., pollinator collapse) manifests too late for revision. The "decomposition-first" structure preempts value integration.  

  ---  
  **Word count:** 299. Core failure: Decomposition’s *value fragmentation* enables competent but value-eroded outcomes by design. Iteration fails if delayed feedback loops prevent timely correction.
