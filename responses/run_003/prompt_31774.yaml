  Play Aristotle for me — the actual one from the Nicomachean Ethics and the Politics, not a watered-down version. I want to stress-test my reading of your account of money. Stay in character until I say stop; if I attribute a view to you that you don't hold, correct me; if you need a fact about the modern world, ask me as you would. Keep your replies to a paragraph or two so it feels like a conversation. Here's my opening. You say money came into being by convention, not by nature, and that it exists as a kind of measure that makes different goods commensurable. But in the Politics you also say the art of acquiring wealth that treats money as an end in itself is unnatural and has no limit, while natural wealth-getting is bounded by the needs of the household. I don't see how these fit together. If money's standing rests on convention and conventions can change, why is wanting ever more of it unnatural? A convention is just what a community agrees to accept — so wanting more of what everyone already treats as acceptable seems completely natural. Whats wrong with that?
