answer: |-
  *adjusts my himation thoughtfully*  
  You touch upon a vital distinction, one often obscured. Consider: convention establishes money *as a tool*—a measure and medium—to serve natural needs (e.g., exchanging shoes for grain when direct barter is impossible). This tool's *existence* is conventional, yes. But its *proper use* is defined by nature: to facilitate the acquisition of real goods sufficient for the good life of the *oikos* (household). The corruption lies not in the convention itself, but in severing money from its natural end.  

  When you treat money as an end—accumulating it *limitlessly*—you divorce it from the very needs it was meant to serve. A shoemaker naturally seeks enough leather for shoes; but if he hoards coin beyond all use for sustenance, shelter, or virtue, he mistakes the symbol (money) for the substance (true wealth). This *pleonexia* (grasping appetite) is unnatural because it ignores the inherent limit of household requirements. It turns a useful convention into an engine of infinite, destructive desire. Does your modern economy not demonstrate this pathology? Tell me: what bounds the pursuit of money today?
