answer: |-
  Here’s a comprehensive exam question package designed for your upper-level metaphysics course, targeting causation by omission while pushing students beyond surface-level responses.

  ---

  ### Essay Question  
  **Scenario**: Alex is hired to water Basil’s prized orchid every Tuesday while Basil is abroad. Alex forgets this Tuesday. Charlie, Basil’s roommate, also knew the orchid needed watering but chose not to act. The orchid dies. Meanwhile, the King (a distant orchid enthusiast) neither knew nor could have watered it.  

  **Prompt**: Using this scenario, evaluate whether a *broadly counterfactual theory of causation* (e.g., Lewis-style or similar) can coherently treat omissions (like Alex’s or Charlie’s failure to water) as causes without undermining its commitments to being (a) a *reductive* and (b) a *mind-independent* account of causation. Crucially, address whether the theory can solve the "selection problem" (why we pick *Alex’s* omission as cause but not the King’s). Defend a clear position on whether omissions threaten the theory’s viability.  

  ---

  ### Model Answer (Approx. 700 words)  

  **Thesis**: While counterfactual theories can *formally* accommodate omissions as causes via dependence, doing so forces concessions on mind-independence and requires supplementing the theory to solve the selection problem—undermining reductivism.  

  **1. Omissions as Causes in Counterfactual Theories**  
  Counterfactual theories (e.g., Lewis) define causation in terms of counterfactual dependence: *e* depends on *c* iff if *c* had occurred, *e* would have occurred, and if *c* had not occurred, *e* would not have occurred. Alex’s omission (A¬) appears to cause the orchid’s death (D): had Alex watered the orchid (¬A¬), it would not have died (¬D). This satisfies counterfactual dependence. Similar reasoning applies to Charlie’s omission (C¬). The theory thus seems to *reductively* explain omission-causation using only dependence relations between events (or absences).  

  **2. Threats to Mind-Independence and Reduction**  
  The problem arises with *irrelevant omissions*: the King’s omission (K¬) also satisfies counterfactual dependence (if the King had watered it, it would have survived). If dependence suffices, K¬ causes D, violating intuition. This is the *selection problem*: which omissions "count" as causes? Counterfactual theories lack resources to distinguish Alex from the King using only dependence and event ontology.  

  This challenges **mind-independence**. Selecting *relevant* omissions seems to require pragmatic factors: *expectations* (Alex was hired; the King wasn’t), *salience* (Charlie’s inaction is blameworthy), or *norms* (flouting a duty vs. no duty). If causation depends on these, it ceases to be a mind-independent feature of reality.  

  **Reductivism** is also strained. Solving selection requires adding non-counterfactual criteria (e.g., Schaffer’s contrastivism, Halpern & Pearl’s normality ordering). For instance, we might say A¬ caused D *rather than* C¬ or K¬ because Alex’s role made their omission *more relevant*. But "relevance" isn’t reducible to physics or modal relations—it invokes normative/pragmatic elements.  

  **3. Can the Selection Problem Be Solved?**  
  Three approaches exist, but each compromises counterfactual purity:  
  - **Contrastive Causation** (Schaffer): Causation is quaternary: *c* rather than *c*' causes *e* rather than *e*'. Alex’s omission (vs. action) causes death (vs. survival), but the King’s omission isn’t a contrastive alternative. This solves selection but makes causal relata context-sensitive and mind-dependent.  
  - **Normality Constraints** (Halpern & Pearl): Factor in typicality. Alex’s watering was *expected*; the King’s wasn’t. But "normality" is often evaluative (e.g., duties), not metaphysical.  
  - **INUS Conditions** (Mackie): Omissions are causally relevant only in specific "causal fields." Alex’s omission is part of a minimal sufficient condition (with background conditions) for D; the King’s isn’t. But defining the "field" (e.g., "agents who could/would help") relies on normative judgments.  

  **4. Conclusion: A Costly Victory**  
  Counterfactual theories can *technically* treat omissions as causes by accepting all dependence relations (including the King’s) or by adding selection mechanisms. The former preserves reductivism and mind-independence but yields absurd overdetermination (Alex, Charlie, *and* the King all caused the death). The latter avoids absurdity but sacrifices the theory’s core ambitions: contrastivism/normality constraints embed mind-dependent factors, and ad hoc supplements undermine reductivism. Thus, while omissions need not *destroy* counterfactual theories, they force them into a dilemma: accept rampant overdetermination or abandon reductionism. I argue the latter is preferable—causation by omission reveals that *some* pragmatic elements are ineliminable, suggesting counterfactual theories are best seen as quasi-reductive.  

  ---

  ### Marking Scheme  
  **A-Grade Answer (85%+)**  
  ✓ **Accurately explains** how omissions fit into counterfactual dependence.  
  ✓ **Explicitly identifies** the tension: omissions satisfy dependence but trigger selection problem + overdetermination.  
  ✓ **Critically engages mind-independence**: Shows why pragmatic/normative factors threaten objectivity if used to solve selection.  
  ✓ **Analyzes ≥2 solutions** to selection (e.g., contrastivism, normality, INUS) and **evaluates their cost** to reductivism/mind-independence.  
  ✓ **Takes a clear stand** (e.g., "solves selection but loses reduction") supported by scenario (e.g., "Alex’s duty vs. King’s irrelevance").  

  **B-Grade Answer (70-84%)**  
  ✓ Correctly describes omission-causation via counterfactuals and mentions selection problem.  
  ✓ Notes threat of overdetermination (e.g., King as cause) but vague on implications.  
  ✓ Discusses **one solution** to selection (e.g., "we focus on Alex due to expectation") but **fails to link it** to mind-dependence/reduction.  
  ✓ Takes a position but **lacks depth** on trade-offs (e.g., "pragmatics help but aren’t ideal").  
  ✓ Uses scenario but not to *argue* (e.g., notes Alex was hired, but doesn’t tie to theory).  

  **Common Mistakes & How Scheme Catches Them**  
  - **Mistake**: "Omissions aren’t real causes; only events are." → *Ignores prompt’s requirement to engage counterfactual theories on their own terms* (lowers to C).  
  - **Mistake**: "Counterfactual dependence solves everything; just ignore irrelevant omissions." → *Fails to address selection problem* (caps at B-).  
  - **Mistake**: Treating background conditions (e.g., oxygen in room) as omissions → *Confuses absence-causation with enabling conditions* (deduction in "accuracy" criterion).  
  - **Mistake**: "The selection problem is easy: only Alex caused it because he was responsible." → *Asserts a solution without analyzing its theoretical cost* (limits to B-range).  

  ---  

  ### Exam Logistics  
  - **Time Allocation**: 90 mins total exam → Suggest 25-30 mins for this essay.  
  - **Word Count**: Model answer is ~650 words; students can aim for 500-600.  
  - **Concreteness**: Scenario provides anchors (Alex/hired, Charlie/knew, King/unknown) to test solutions.  

  This question forces engagement with the meta-issue: *Can a theory be reductive and objective while accommodating absences?* The marking scheme rewards wrestling with the dilemma rather than reciting dogma. Let me know if you’d like adjustments!
