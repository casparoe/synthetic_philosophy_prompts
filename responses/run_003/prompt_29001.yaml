prompt: |-
  I've been reading the alignment side of LessWrong for years, and after the dozenth post about learning human values from demonstrations I still keep getting stuck on inverse reinforcement learning. The pitch, as I understand it, is that you watch someone's behavior and infer the reward function they're approximately optimizing, and that this gives you their preferences — maybe even their values. But this sounds exactly like revealed preference theory from economics, and I thought the whole lesson of that literature was that choices alone don't pin down a unique utility function: any number of preference orderings are compatible with the same behavior once you allow for constraints, unobserved costs, mistakes, or caring about something you didn't measure. I get that modern IRL doesn't assume perfect optimality — people use maximum entropy models where action probabilities are softmax in expected return — but that just changes the likelihood; a softmax policy is invariant to adding a constant to all returns, so the data still underdetermine the reward. Since IRL is just revealed preferences with function approximation, and revealed preferences can't recover a unique utility, what's the point of using IRL to learn human values for alignment?

  I've spent alot of time trying to taboo the words "preference" and "value" and just look at the math, and the math seems to say that demonstrations only pin down a behavior-equivalence class of rewards, with everything else coming from the prior. So why do people treat IRL as if it recovers what humans actually want, rather than re-describing what they did? I'm sure I'm missing a step, but I can't find it.
reasoning: |-
  Okay, the user has been reading about AI alignment on LessWrong for years, specifically focusing on inverse reinforcement learning (IRL). They're stuck on how IRL can supposedly learn human values from demonstrations when it seems similar to revealed preference theory in economics, which shows that behavior alone can't determine a unique utility function. They mention issues like constraints, unobserved costs, and the invariance of softmax policies to constant rewards. They've tried looking at the math and see that demonstrations only pin down an equivalence class of rewards, with the rest coming from priors. So why do people act like IRL recovers true human values?

  First, I need to address their core concern: the underdetermination problem. They're right that behavior alone isn't enough. Economics teaches us that without additional assumptions, you can't uniquely determine preferences. The math of IRL does show that many reward functions can explain the same behavior. But the key in AI alignment is how IRL is used differently than in economics.

  They might be missing the context of AI alignment goals. Unlike economics, which aims for predictive models, alignment wants a reward function that generalizes correctly to new situations, especially when the AI is superintelligent. So even though the reward isn't unique, the hope is that with the right priors or additional data, the learned reward will capture underlying values that generalize beyond observed behavior.

  The user mentions priors but might not realize their role in AI applications. In practice, IRL systems use strong priors like simplicity or causal independence. Humans also provide other data sources like corrections, comparisons, or explicit instructions. So it's not just demonstrations; it's combining them with other inputs to narrow down the reward function.

  Another point is the shift from behavior cloning to value learning. Behavior cloning copies actions, which fails when the environment changes. IRL aims to find the 'why' behind actions, which should be more robust. The user's skepticism is valid because if the prior is wrong, the learned values might not generalize. But researchers are aware of this and work on better priors and data collection methods.

  The user's deeper need might be understanding why the alignment community trusts IRL despite its limitations. They want reassurance that there's a pathway to safe AGI. So I should emphasize that IRL is a step towards value learning, not a complete solution, and ongoing research addresses these challenges with better models and human feedback integration.
answer: |-
  You've hit on a fundamental and valid critique at the heart of value learning for AI alignment. Your understanding of the underdetermination problem in IRL (it's *exactly* revealed preference theory applied to sequential decision-making) and its implications is spot-on. The frustration is warranted. Here's why the alignment community still pursues IRL despite this, and the nuances often glossed over in introductory pitches:

  1.  **The Goal Isn't Necessarily "Unique Recovery" but "Good Enough" Generalization:**
      *   **Alignment Goal:** We don't need the *exact* Platonic utility function U_true. We need a reward function R_learned that causes the AI to behave *as if* it were optimizing U_true *in novel, high-stakes situations* (especially those involving superintelligence), even when the optimal behavior differs significantly from human demonstrations.
      *   **The Hope:** While infinitely many R functions explain the *observed* data D, most of them will lead to catastrophically bad behavior in novel situations. The goal of IRL (in alignment) is to use **strong priors** and **additional data sources** to select an R_learned from the equivalence class that *generalizes robustly and safely* to the vast state spaces the AI will encounter, ideally matching how we *want* it to extrapolate our values.
      *   **Analogy:** Predicting the next number in the sequence 0, 1, 2, 3... is underdetermined (could be linear, quadratic, exponential). But a strong prior for "simplest continuation" picks the linear function (4, 5, 6...), which is often the intended generalization. IRL needs priors that pick the "intended value generalization".

  2.  **The Crucial Role of Priors (Beyond Just Smoothness):**
      *   **Your Point is Correct:** The equivalence class is vast. The *prior* over reward functions P(R) is doing *most* of the work in selecting which R from the equivalence class we get. Naive priors (e.g., Gaussian processes with simple kernels) often fail catastrophically for value extrapolation.
      *   **Alignment Research Focus:** A huge chunk of modern value learning research is about designing **better priors** P(R) that bias the learning towards reward functions that:
          *   **Are "Simple" or "Decomposable":** E.g., rewards that are linear in known, meaningful features (though feature learning is hard!), or composed of sparse causal influences.
          *   **Exhibit "Causal Independence":** Rewards that depend on the *state of the world* S (e.g., "is the vase intact?") rather than the *sensor observations* O (e.g., "pixels showing an intact vase"). This is the core idea behind **CIRL (Cooperative IRL)** and variants. Humans likely optimized for the vase *being* intact, not just *looking* intact in that specific camera angle.
          *   **Reflect "Meta-Preferences":** Priors encoding that we prefer reward functions that are corrigible, avoid irreversible harm, preserve our option value, etc. (This is aspirational and very hard).
          *   **Leverage Known Human Biases:** Models that explicitly account for hyperbolic discounting, myopia, computational limitations, or systematic cognitive errors *during learning* to better infer the underlying R, rather than just mimicking the biased policy.

  3.  **Beyond Passive Demonstrations: Active Alignment:**
      *   **IRL Alone is Insufficient:** Everyone serious acknowledges this. Demonstrations are just *one* data source. Modern approaches combine IRL with:
          *   **Preference Comparisons (RLHF):** Actively querying humans about which trajectory/outcome is better (`A > B`). This provides direct evidence about R(A) > R(B), constraining the reward space much more effectively than passive demos alone. It breaks symmetries like adding constants.
          *   **Corrections / Interventions:** Humans correcting the AI's proposed actions or plans. This provides high-value data points about what *not* to do or better ways to achieve the goal under R.
          *   **Natural Language Instruction/Explanation:** Humans describing goals, values, or justifying choices. While noisy and ambiguous, this provides direct *symbolic* evidence about R that can ground the learning.
          *   **Inverse Reward Design (IRD):** Observing humans *designing* reward functions for other agents (like video game scores) and inferring the *true* objective they were trying to encode. This leverages meta-cognition.

  4.  **Why Not Just Behavior Cloning (BC)?**
      *   **The Pitch for IRL over BC:** You're right that pure IRL on demos is underdetermined. But pure BC (mimicking state-action pairs directly) is often *worse* for alignment:
          *   **Covariate Shift:** When the AI acts, it inevitably visits states not seen in human demos. BC has *no* internal model of *why* the human did something, so it fails unpredictably. IRL (even imperfect) provides an R that can, in principle, be optimized in novel states.
          *   **No Value Insight:** BC learns *what* was done. IRL attempts to learn *why* it was done (the goal/R). The "why" is essential for robust generalization, even if learning it perfectly is impossible. A learned R is a more compact, generalizable representation than a policy.
      *   **IRL as a Step:** IRL is seen as a *framework* for incorporating value-relevant information (demos + preferences + language + corrections + priors) into a learned objective R that *might* generalize better than BC or hand-coded rules. It's a tool in the toolbox, not the complete solution.

  **Addressing Your Core Questions Directly:**

  *   **"Why treat IRL as recovering what humans want?"** Because, *if* the priors and additional data sources are chosen well, the learned R *might* capture the underlying *reasons* (values) driving the behavior, leading to safer generalization than alternatives. It's an *aspiration* and a research direction, not a claim of solved uniqueness. People often oversimplify the pitch.
  *   **"Isn't it just re-describing what they did?"** With *only* demos and weak priors, **yes, it absolutely is.** This is the "revealed preference" dead end. The *alignment research* is about breaking out of this by adding the elements above (strong value-laden priors, active interaction, multiple data sources) to move beyond mere re-description towards robust value *extrapolation*.
  *   **"What's the point?"** The point is that learning *some* internal representation of the human's objective (R), even if imperfect and underdetermined, combined with powerful optimization, *might* be safer and more robust than:
      *   **Hand-Coding R:** We can't specify human values exhaustively and correctly for superintelligence.
      *   **Pure BC:** Fails catastrophically under distributional shift.
      *   **Direct Democracy (RLHF on outcomes):** Doesn't scale to complex long-term planning and can be gamed.
      *   IRL (+ priors + active learning) is an attempt to *learn* a generalizable objective function from human data. Its success hinges entirely on overcoming the underdetermination problem you identified through better priors and richer interaction.

  **You're Not Missing a Step, You're Seeing the Core Challenge:**

  Your understanding is correct. The underdetermination is fundamental. The "step" you might be missing in optimistic presentations is the implicit (and often underdeveloped) reliance on **very strong, alignment-specific priors** and the **integration of diverse, active human feedback** to shrink the vast equivalence class down to a reward function that *hopefully* extrapolates human values safely. The viability of IRL for alignment rests entirely on whether researchers can find priors P(R) and interaction protocols that reliably produce this safe extrapolation. This is the hard, unsolved problem driving much of the research. Your skepticism is healthy and shared by many researchers actively working to address these limitations.
