prompt: |-
  I'm putting together a unit for an upper-level seminar called Markets and Morals, and I want to pair a work of fiction with the philosophical literature on commodification and repugnant markets — the debate over whether certain goods (kidneys, blood, surrogacy, votes) should not be for sale, and why. The work I keep returning to is Kazuo Ishiguro's Never Let Me Go, whether in the novel or its film adaptation. What fascinates me is that the novel contains no market and no price: the students at Hailsham are raised from childhood to become organ donors, and their donation is framed as a duty or a gift rather than a sale. And yet the world of the novel feels like a limit case of treating persons as a stock of spare parts. I would like a careful reading of the novel through the lens of the commodification debate — the corruption objection, the worry that market norms crowd out other ways of valuing persons, the coercion and exploitation worries, and the thought that some exchanges are simply repugnant. Where does the novel illuminate those arguments, and where does it complicate or undercut them? In particular, does it suggest that what is really doing the moral work is not money or markets at all, but the creation of a class of persons socialized into consent, or the background institution that produces willing donors? And does the novel ultimately locate the wrong in the transaction, the institution, or the surrounding society?

  Work through this as a professional moral and political philosopher with expertise in the ethics of markets would. Take your time, and feel free to begin with a short brainstorm of possible readings before settling on the one you develop. Structure your answer around the philosophical ideas first, then trace them through the novel's central elements — the Hailsham education, the art and the Gallery, the carers and donors, the rumor about deferrals, Kathy and Tommy's final encounter with Madame and Miss Emily, and the closing pages — while resisting the temptation to reduce the novel to a mere illustration. I also want an honest assessment of where the novel resists the philosophical framework, and what it adds to the debate that the argumentative literature alone does not. Do not provide a bibliography or reading list, and paraphrase rather than quote the text. End the entire response with a single sentence inside \answer{...} that states your overall verdict about what the novel contributes to the philosophical debate.
