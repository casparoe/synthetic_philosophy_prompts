prompt: |-
  I run a small research programme — about five postdocs and a handful of PhD students — focused on the normative design of AI reasoning. We are past the point of asking whether AI systems should be value-aligned at all; we are trying to settle what kind of moral reasoning an AI should employ when it faces genuinely novel ethical decisions. The debate has largely organised itself around a familiar dichotomy: should AI systems reason as utilitarians (maximising expected welfare under uncertainty) or as deontologists (respecting constraints, rights, or side-constraints that are not reducible to welfare trade-offs)? But that framing is still too coarse to guide actual engineering or training decisions, and I suspect some of the most important open questions are downstream of it, or cut across it, rather than being settled by picking a side.

  I am putting together a three-year research agenda for the group, and I need to decide which open questions in this vicinity are most worth our time. I am not looking for a survey of the literature or a reading list. I want a defended prioritisation: which questions should we tackle first, and why? For each question you rank, I want to know how upstream it is — does answering it unlock or reshape other questions? — how tractable it is for a group with our mix of philosophical and technical competence (we can do formal modelling and some experimental work, but we are not a machine learning lab), and what kind of result over the next couple of years would make you raise or lower its priority. I am also interested in which questions you would deprioritise, either because they are less consequential than they first appear or because they are intractable with current tools. Please take definite positions; I can read a balanced literature review on my own, but I need someone to actually commit to a ranking and defend it.

  After your prose, please give me a structured summary as a JSON array of objects, one per ranked question, with the following fields: `rank` (integer, 1 being highest priority), `question` (a one-sentence statement of the open question), `importance_rationale` (one to two sentences on why it is upstream of other work or practically consequential), `tractability` (one of `"high"`, `"medium"`, or `"low"`, given our group's philosophical and technical mix), and `revision_trigger` (one sentence on what we might learn in the next two years that would substantially change this question's priority).
reasoning: |-
  Okay, the user runs a small research group focused on the normative design of AI reasoning, specifically tackling how AI should make genuinely novel ethical decisions. They're moving beyond the utilitarianism vs. deontology debate and want a prioritized research agenda. Their group has five postdocs and some PhD students with expertise in philosophy and technical skills like formal modeling and experimental work, but they're not an ML lab.

  I need to understand their main request: a defended prioritization of open questions, not a literature survey. The questions should be ranked with clear criteria: upstream impact (how it reshapes other questions), tractability for their group, and what could change the priority in the next two years. They also want to know what to deprioritize.

  Looking deeper, the user might be concerned about practical implementation. Since their group isn't an ML lab, they need questions that leverage their strengths in formal ethics and modeling. They might also want to influence real-world AI development, so questions with immediate implications for AI safety or policy could be high priority. There's an unspoken need to establish their niche—avoiding duplication with ML labs while contributing unique insights from normative ethics.

  The core challenge is moving beyond the coarse dichotomy. The key areas to explore include meta-ethical foundations (how AI acquires values), decision frameworks under uncertainty, specification methods, and domain-specific applications. I should rank questions that are both foundational and tractable. For instance, understanding value acquisition is upstream because it affects all alignment approaches. It's highly tractable for their group since it involves formal modeling of learning processes, which matches their skills.

  Next, handling uncertainty is crucial because novel decisions often involve unknowns. Their group can develop decision theories without needing ML training, making it medium tractability. If AI capabilities advance quickly, this becomes more urgent, so monitoring progress is key.

  Specification is another priority. Clear value definitions prevent perverse incentives, and their philosophical expertise can address this. If interpretability tools improve, it might lower priority, but currently, it's essential.

  I'd deprioritize direct comparisons between utilitarianism and deontology because it's over-discussed and less actionable. Also, domain-specific applications might be premature without foundational work. Multi-agent coordination is important but less urgent now, though events like multilateral agreements could change that.

  Ranking these:
  1. Value acquisition - foundational and tractable.
  2. Uncertainty frameworks - addresses critical operational gaps.
  3. Specification - prevents implementation failures.
  4. Pluralistic integration - ensures robustness but needs more groundwork.
  5. Thresholds vs. trade-offs - refines deontology practically.

  Revisions depend on external factors like breakthroughs in interpretability or AI incidents, which could shift priorities. The user needs a clear, actionable plan that maximizes their group's impact while adapting to the evolving AI landscape.
answer: |-
  Here is a defended prioritization of research questions for your group, based on upstream impact, tractability for your profile, and potential revision triggers. The core thesis is: **Focus first on the meta-ethical and decision-theoretic foundations enabling *any* normative system to handle novelty, as these are both upstream and tractable with your skills, while deprioritizing direct comparisons of established frameworks or premature domain-specific applications.**

  ### Ranked Research Questions (Defended Prioritization)

  1.  **Question:** **How can an AI system *acquire and update* its fundamental value specifications when confronted with truly novel situations where pre-programmed rules or utility functions are silent or contradictory?**
      *   **Why Rank #1 (Importance):** This is the most upstream meta-ethical challenge. Without a robust, generalizable method for value acquisition/refinement in novelty, *no* normative framework (utilitarian, deontological, or hybrid) can function reliably. Answering this unlocks all downstream work on *which* values/frameworks to employ by defining the *process* of value formation.
      *   **Tractability:** **Medium.** Leverages your philosophical strength in meta-ethics & value theory and technical skill in formal modeling (e.g., modeling value learning processes, reflective equilibrium under uncertainty). Avoids the need for large-scale ML training.
      *   **Revision Trigger:** If major breakthroughs in interpretable meta-learning or few-shot moral concept acquisition emerge, lowering the perceived difficulty and thus priority; conversely, high-profile AI incidents stemming from novel ethical failures would raise its urgency.

  2.  **Question:** **What decision-theoretic framework best handles radical normative uncertainty and ambiguity (not just empirical uncertainty) when *no* existing rule or utility function provides clear guidance, and how can this be formally implemented?**
      *   **Why Rank #2 (Importance):** Directly addresses the core challenge of "genuinely novel ethical decisions." It cuts across the util/deon dichotomy by focusing on *how to reason when the normative framework itself is uncertain*. This reshapes both utilitarian (how to define/aggregate welfare?) and deontological (which rules apply?) approaches under novelty.
      *   **Tractability:** **Medium-High.** Ideal for your mix: requires deep normative philosophy (theories of normative uncertainty) combined with formal decision theory modeling and simulation (e.g., modeling agent choices under varying levels of framework ambiguity). Experimental vignettes can test human intuitions.
      *   **Revision Trigger:** If empirical work convincingly shows humans default to a single, simple heuristic in radical novelty, lowering priority; evidence that current AI systems catastrophically fail under normative ambiguity would raise it.

  3.  **Question:** **How can core normative concepts (e.g., "welfare," "rights," "autonomy," "fairness") be formally specified in a way that is sufficiently precise for AI reasoning yet flexible enough to generalize to unforeseen contexts without perverse incentives?**
      *   **Why Rank #3 (Importance):** Specification is the critical bridge between abstract principles and operational AI decisions. Poor specification plagues both utilitarianism (e.g., Goodharting welfare proxies) and deontology (e.g., rigid rule-following leading to absurdity). Progress here is essential for *any* implemented system and reshapes how both frameworks are practically engineered.
      *   **Tractability:** **Medium.** Strong fit for philosophical analysis of concepts and technical formalization (e.g., developing axiomatic definitions, exploring context-dependent semantics using logic or game theory). Can involve conceptual engineering and formal modeling of specification failures.
      *   **Revision Trigger:** Significant advances in AI interpretability/explanation tools might lower priority by making specification easier to debug; discovery of fundamental limitations in defining certain concepts formally could raise its difficulty and strategic importance.

  4.  **Question:** **Under what conditions and through what mechanisms should an AI system integrate or switch between utilitarian and deontological reasoning (or other paradigms) when facing novelty, and how can this be made robustly aligned?**
      *   **Why Rank #4 (Importance):** Moves beyond the dichotomy by focusing on *pluralism* and *context-sensitivity*, which is likely necessary for handling diverse novel situations. It's downstream of value acquisition (#1) and uncertainty (#2) but critically shapes the practical architecture of AI reasoning systems.
      *   **Tractability:** **Medium.** Requires philosophical work on pluralism/moral psychology and technical work on meta-reasoning architectures, rule-exception handling, and conflict resolution (formal models, simulations). More complex than single-framework work.
      *   **Revision Trigger:** Evidence that humans reliably use a single mode in novelty lowers priority; convincing demonstrations that hybrid systems are inherently unstable or unalignable would raise concerns and potentially lower priority pending solutions.

  5.  **Question:** **How can deontological constraints (e.g., rights, prohibitions) be formalized to allow for necessary thresholds or non-binary trade-offs in novel situations without collapsing into utilitarianism or becoming unworkably rigid?**
      *   **Why Rank #5 (Importance):** Directly refines the deontological side of the dichotomy, a major gap. Novelty often forces reconsideration of absolutes. Success here makes deontology a more viable engineering option and clarifies its distinct value.
      *   **Tractability:** **Medium-Low.** Philosophically challenging (nature of constraints, thresholds, incommensurability) and technically demanding for formalization (non-monotonic logics, complex preference structures). Leverages your strengths but is inherently thorny.
      *   **Revision Trigger:** Development of a compelling, practical formal model for threshold deontology elsewhere would lower priority; persistent failures to formalize robust non-util decision rules might shift focus towards pluralism (#4) or foundational work (#1, #2).

  ### Deprioritized Questions & Why

  *   **"Utilitarianism vs. Deontology: Which is better for AI?" (Direct Comparison):** Deprioritize. The dichotomy itself is too coarse (#1-#5 address this). Answering it doesn't resolve core challenges like value acquisition (#1) or uncertainty (#2). Intractable to settle conclusively and less actionable for engineering than refining *how* either (or both) work under novelty.
  *   **"How should AI reason ethically in specific novel domain X (e.g., nanotech, brain-AI interfaces)?" (Premature Domain Specificity):** Deprioritize. Requires foundational work first (#1-#3). Lacks generality. Tractable for case studies but low upstream impact until the meta-framework is clearer. Best tackled later or by domain specialists informed by *your* foundational outputs.
  *   **"How can multiple AI systems with potentially differing normative frameworks coordinate ethically in novel multi-agent scenarios?" (Multi-Agent Coordination):** Deprioritize *for now*. Important, but downstream. Requires solutions to individual agent reasoning (#1-#5) and robust value alignment *first*. Highly complex; current tractability is **Low** for your group without established foundations. Events like breakthroughs in multi-agent RL *with* normative components could raise its priority.

