prompt: |-
  I've been going down a rabbithole on the problem of old evidence — Glymour's thing about how if you already know E, then P(E) = 1, so P(H|E) = P(H) and old evidence can't confirm a theory. Which is obviously false as a description of how science works: the precession of Mercury's perihelion was known for decades, Einstein's GR predicted it, and everyone treated that as a big confirmation.

  I'm a data scientist. I write Bayesian models in Stan and Pyro all day. My mental vocabulary is observed variables, likelihoods, posterior predictives, marginal likelihoods, WAIC, and Bayes factors. I basically never think in terms of "credence" or "confirmation" as philosophers use them — I think about whether a model fits the data well and whether adding a parameter buys you enough.

  So: restate the problem of old evidence in my vocabulary, as faithfully as you can. What does the puzzle look like translated into the language of model fitting and model comparison? Is the analogue just that you can't compute a Bayes factor from data you've already conditioned on, so the problem is about what "conditioning" actually means when the data wasn't new to you? Or is there something deeper going on that doesn't map to anything I do at the keyboard?

  Then the residue report. What translates cleanly? What did you have to distort to make it fit? What parts of the philosophical debate have no counterpart in how I think about models and data? And the thing I actually care about: when I compare models using marginal likelihood or WAIC, am I sidestepping the problem entirely, or am I just papering over something the philosophers are right to worry about? Keep it tight — three paragraphs max.
reasoning: |-
  Alright, let me unpack this user's query. They're a data scientist deep into Bayesian modeling with Stan and Pyro, focused on practical tools like likelihoods and model comparison metrics. The core issue is Glymour's problem of old evidence: how can known data (like Mercury's precession) confirm a new theory if its probability is already 1? The user wants this translated into their workflow terms and to know if their methods sidestep the philosophical problem.

  First, I need to map the philosophy to data science concepts. Glymour's paradox says P(E)=1 for known evidence, making P(H|E)=P(H). In modeling terms, this is like conditioning on data from the start—your likelihoods and posteriors bake in that evidence. Model comparison via Bayes factors or WAIC avoids this by implicitly treating E as "new" through predictive checks or marginal likelihood ratios, even if the data was used before. The distortion comes from pretending old data is new, which isn't how philosophers frame "confirmation" but is standard practice in model fitting.  

  The residue is the credence-based framing. Data scientists care about predictive accuracy and parsimony, not subjective belief updates. Metrics like WAIC or Bayes factors handle old evidence naturally because they evaluate models post-fit, dodging Glymour's trap. But philosophers might argue this ignores temporal dynamics—how beliefs shift when E moves from background knowledge to evidence for H. That layer doesn't exist in the user's workflow; their tools are inherently post-conditioning.  

  So, yes, the user's methods sidestep the problem by design. Their marginal likelihood comparisons and predictive checks render old evidence unproblematic—it's just data informing model fitness. The philosophical worry persists only if "confirmation" requires belief updating at discovery time, a nuance irrelevant to scoring models on existing data. The user's pragmatic approach is robust; the residue is purely metaphysical.
answer: |-
  Here's the translation and residue report, tight as requested:

  **Translation to Model Fitting/Comparison:**  
  Glymour's problem maps directly to computing the *marginal likelihood* (evidence) for a model *after* conditioning on data. If data `E` is fixed ("old"), conditioning any model `M` on `E` means `p(E|M)` becomes 1 (since `E` is certain). Comparing models via Bayes Factor `BF = p(E|M1)/p(E|M2)` then reduces to `1/1 = 1` — no discrimination. In your workflow, this is like trying to compute the marginal likelihood *for the exact data you conditioned on* — it's tautologically 1. The "confirmation" scientists perceive (like Mercury for GR) arises because they implicitly treat `E` as *new* relative to a *previous model* (`M_old`). The Bayes Factor effectively compares `p(E|M_new)` to `p(E|M_old)` *before* `M_new` was known, even if `E` itself was old. WAIC/LOO-CV sidestep this by evaluating *predictive* performance, not the probability of the exact observed data.

  **Residue Report:**  
  - **Clean Translation:** "P(H|E) = P(H)" → Marginal likelihood `p(E|M)=1` after conditioning. "Confirmation" → Model comparison via Bayes Factor (BF) or predictive accuracy (WAIC).  
  - **Distortion:** Philosophers' "credence updates" imply a temporal belief change. BF/WAIC comparisons are timeless evaluations of model *fit* or *predictiveness* — they don't capture the historical "aha!" moment when old data is recontextualized by a new model.  
  - **No Counterpart:** The core philosophical debate about *subjective belief revision* when `E` transitions from background knowledge to evidence for `H` has no direct analogue. Your tools assess models post-conditioning; philosophers worry about the *psychological/causal process* of discovery.  

  **Your Sidestep:** You *are* sidestepping it cleanly. WAIC/LOO-CV measure predictive accuracy on held-out data (real or imaginary), avoiding the `p(E)=1` trap. Bayes Factors, when used for comparison, implicitly contrast models *as if* `E` were new relative to the model space. Your focus on predictive performance and parsimony (via WAIC or penalized likelihoods) renders Glymour's objection inert — confirmation is just relative model fitness, not belief updating under certainty. Philosophers' concerns linger only if "confirmation" requires modeling the *discovery process* itself, which your tools deliberately ignore.
