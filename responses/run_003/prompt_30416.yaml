  We are to set up two agents:
    1. Capped Utility Agent (CUA): has a utility function capped at some finite maximum utility U_max per outcome. 
       So even if the outcome would have been N happy lives (which without the cap would have utility U(N) = some function of N, unbounded), 
       the capped agent assigns min(U(N), U_max) to that outcome.

    2. Threshold Probability Agent (TPA): uses the same underlying unbounded utility function as the CUA (if there were no cap) but refuses to consider outcomes with probability below a threshold t (where t is set to be greater than p).

  We require:
    - The CUA, after applying the cap, calculates that paying the mugger has positive expected utility and therefore pays.
    - The TPA, because the probability p is below the threshold t, does not even consider the positive outcome and therefore refuses to pay.

  We also require that the situation is recognizably a Pascal's mugging (so p is extremely small and N is astronomically large) and that the threshold t is reasonable (so it is set as a precaution against being exploited by tiny probabilities, but not so high that it ignores ordinary improbable events).

  Let's set up:

  Underlying utility function (without cap): 
    Let U(status quo) = 0.
    If the mugger creates N happy lives, that has utility V(N) which is an unbounded function (say V(N) = k*N for some constant k, but note that without a cap this is unbounded as N grows).

  With the cap U_max, the utility of the positive outcome becomes min(k*N, U_max). Since N is astronomically large, we have k*N >> U_max, so the utility of the positive outcome becomes U_max.

  The cost of paying the mugger: the agent loses $1, which we assume has a utility cost of c (a small negative number). We can set c = -1 (in some utility units) for simplicity.

  So the expected utility for the CUA:

    EU(pay) = p * min(k*N, U_max) + (1-p) * c
            ≈ p * U_max + (1-p) * c   [since min(k*N, U_max)=U_max]

    EU(not pay) = 0

  We want EU(pay) > 0. So:
    p * U_max + (1-p) * c > 0

  Since p is very small, (1-p)≈1, so we require:
    p * U_max > |c|   [because c is negative]

  For example, if c = -1, then p * U_max > 1.

  Now, we also set a threshold t for the TPA. We set t such that p < t. Therefore, the TPA ignores the outcome with utility V(N) because its probability is below the threshold. The TPA only considers outcomes with probability >= t. In this case, the TPA sees only the negative outcome (losing $1) with probability 1 (since the positive outcome is ignored). Therefore:

    TPA: EU(pay) = (1-p) * c ≈ c = -1 (if we ignore the positive outcome) 
