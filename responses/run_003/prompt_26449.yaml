prompt: |-
  I just finished serving on my city's first citizens' assembly last fall — we dealt with a land-use plan that had been gridlocked for years — and honestly the whole experience kind of rearranged how I think about democracy. It turns out a room of randomly selected strangers can deliberate better than I would have believed. Now my neighbourhood association has asked me to give a twenty-minute talk at the next meeting explaining what sortition and lottocracy even are, because someone floated the idea of using a mini-public for a local decision and a bunch of people reacted like we'd suggested flipping a coin to pick the mayor. I'm not supposed to advocate, just make the idea intelligible to folks who have only ever known elections as the default and think random selection sounds like a gimmick or an insult to their intelligence. Can you plan the explanation for me? I need the dependency structure: what idea absolutely has to be in place first so the rest doesn't sound like governance by bingo, what one case or example should carry the whole thing and why that one rather than ancient Athens (which I suspect people will bring up anyway), what misconceptions they'll walk in with versus ones they'll form halfway through, where exactly in the sequence I should head each one off, and what question I can ask at the end to tell whether they actually got it rather than just stopped being hostile. Also what I should openly say we can't cover at this level so I don't get dragged into the weeds. Just write it as continuous prose — no bullet points, no headings, no bold, like an email.
