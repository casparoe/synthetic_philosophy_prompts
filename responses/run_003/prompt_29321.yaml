prompt: |-
  I'm trying to get clear on when someone lacks standing to blame — you know, the whole "who are you to talk" thing. Here are my gut reactions on a bunch of cases, and I want to know if there's a principle that gets all or most of them.

  1. My friend Alex cheated on his wife for years. Last week he got furious at a coworker who had a one-night affair and called him a selfish bastard. I think Alex has no standing here. That one's easy.

  2. But here's a harder one: my sister smoked for a decade, quit five years ago, and now she's on her teenager's case about vaping. I feel like she does have standing, even though she did the same kind of thing. The fact that she quit and regrets it seems to matter.

  3. A politician votes for a war that kills thousands, then later condemns another politician for authorizing a drone strike that kills dozens. I want to say he lacks standing — the hypocrisy is too much — but I'm not sure if it's because the wrongs are similar in kind or because his was worse. Or both.

  4. Someone who has never stolen anything but knows in their bones they would steal if they were desperate enough blames a shoplifter. My instinct is that this person does have standing — you don't lose standing just for having a bad character you never acted on. But I'm not confident about this one at all.

  5. A boss who regularly berates employees in private blames a colleague for yelling at an intern in public. I feel like the boss lacks standing even though the wrongs are different in some obvious ways — one is private, one is public. So maybe the domain matters less than I thought?

  6. Here's one that really bothers me: a friend who drove drunk exactly once, twenty years ago, and has been ashamed of it ever since, hears about someone getting a DUI and says nothing publicly but tells me privately the guy is reckless. I think my friend has standing to make that judgment, at least to me. But if he posted about it on Facebook I'd feel differently. So maybe standing is partly about the audience or the forum?

  7. Last one: a vegan who used to eat meat blames a meat-eater for supporting factory farming. I think the vegan has standing — the fact that they changed makes the blame more credible, not less. But I can't articulate why this feels different from Alex in case 1.

  Is there a single principle that handles all of these? I'm especially stuck on why case 2 (ex-smoker) and case 7 (vegan) feel like they have standing while case 1 (cheater) doesn't, when in all three the blamer did the same kind of thing. And I can't tell whether my verdict on case 4 (the would-be thief) is right or whether I should flip it. Give me the best principle you can, tell me which of my verdicts it forces me to abandon, and test it on a case I haven't thought of.
reasoning: |-
  Okay, the user is trying to figure out a consistent principle for when someone has "standing to blame" others—basically, when it's hypocritical or inappropriate for them to call someone out. They've given seven scenarios where their gut reactions vary, and they're struggling to reconcile why some cases feel different despite superficial similarities. 

  First, I notice they're particularly stuck on why reformed smokers/vegans seem to have standing while a serial cheater doesn't. That's the core tension. They also seem uneasy about hypothetical wrongdoing (case 4) and the role of audience (case 6). 

  Hmm... the key might be whether the blamer is *currently complicit* or *still benefiting* from the wrong they're criticizing. For the cheater (case 1), he's still actively cheating while blaming others—zero repentance. The ex-smoker (case 2) quit and regrets it; she's not currently smoking. The vegan (case 7) stopped eating meat. But the politician (case 3)? He hasn't renounced his war vote or made amends—he's still politically complicit. 

  For case 4 (would-be thief), the user's instinct is right: mere potential hypocrisy shouldn't negate standing. The person isn't actually stealing *now*, and never did. But case 5 (abusive boss) is tricky—though his wrong is different (private vs. public abuse), he's *currently* engaging in the same *category* of harm (workplace abuse). That ongoing pattern undermines his standing. 

  Case 6 (past drunk driver) reveals something subtle: standing isn't binary. Privately regretting someone else's DUI? Fine. Publicly grandstanding? Feels gross because it *leverages* past wrongdoing for moral credibility. 

  The user might also be missing how *repentance* functions. It's not just saying "I changed"—it requires active disavowal and amends. The politician didn't do that; the ex-smoker did. 

  Biggest challenge for the user: reconciling case 1 (no standing) with 2/7 (standing). The principle I'd propose—"you lack standing if you're actively engaged in or benefiting from the same/similar wrongdoing without repentance"—handles this. Alex is *still* cheating, so he's in no position to judge. The ex-smoker and vegan aren't currently doing the thing. 

  Would this flip any of their verdicts? Case 3 (politician) clearly lacks standing under this rule—he never repented. Case 4 stays: no standing issue. Case 5: boss lacks standing (current similar wrongdoing). Case 6: private blame is okay, public grandstanding isn't (different audiences matter for *how* we express standing, not whether we have it). 

  Test case: A CEO who polluted rivers in the 90s but now runs a green company blames another CEO for current pollution. Has standing—repented, changed. If he still ran a polluting company? No standing. 

  User's deeper need? Probably seeking moral clarity for real-life conflicts, not just philosophy. They might be wrestling with whether *they* can call out others given their own past. The principle gives them a tool: are you still doing it? Have you truly changed? If yes, you can speak.
answer: |-
  Your cases reveal a nuanced pattern—and you're right that hypocrisy alone isn't the full story. The principle that best explains your intuitions (and resolves tensions) is the **"Active Complicity Principle":**

  > **A person lacks standing to blame for a wrongdoing if they are *currently engaged in* or *actively benefiting from* the same/similar wrongdoing without repentance, or if their blame serves to obscure their own ongoing complicity.**

  Let's break down your cases with this principle:

  ### Your Cases Analyzed:
  1. **Alex (cheater)**: Lacks standing.  
     *Why*: He's **actively cheating** while blaming others. His blame distracts from his own ongoing guilt.

  2. **Ex-smoker sister**: Has standing.  
     *Why*: She quit, repented, and is **no longer complicit**. Her blame isn't hypocritical because she isn't currently smoking/vaping or benefiting from it.

  3. **Politician (war vs. drone strike)**: Lacks standing.  
     *Why*: Even if the scale differs, he's **still benefiting politically** from his past decision (e.g., votes, reputation) and shows no repentance. Blaming others shifts focus from his own unaddressed wrongdoing.

  4. **Would-be thief**: Has standing.  
     *Why*: They **never acted** and aren't complicit. Standing requires *actual* wrongdoing, not hypotheticals. Moral judgment isn't invalidated by latent flaws.

  5. **Abusive boss**: Lacks standing.  
     *Why*: He's **actively engaging in similar harm** (verbal abuse) and benefits from workplace power dynamics. Criticizing *public* abuse while doing it privately is a tactic to deflect from his own behavior.

  6. **Past drunk driver (private vs. public blame)**:  
     - **Privately to you**: Has standing. He repented, isn't complicit now, and shares regret, not superiority.  
     - **Publicly on Facebook**: Lacks standing. Broadcasting blame **leverages his past wrong** for moral credibility, implying "I’m better now." This *instrumentalizes* his repentance to shame others.

  7. **Ex-meat-eating vegan**: Has standing.  
     *Why*: They renounced the practice, aren't complicit, and their blame stems from reformed conviction—not ongoing hypocrisy.

  ### Why Case 1 (Alex) Differs from Cases 2 & 7:
  - **Alex** is **actively cheating** → blame exposes his *current* hypocrisy.  
  - **Ex-smoker/vegan** **ended their complicity** → blame reflects growth, not denial.  

  ### The Principle's Implications for Your Verdicts:
  - **You must abandon your initial "unsure" stance on Case 3**: The politician unambiguously lacks standing due to *unrepented benefit*.  
  - **Case 6 splits**: Your instinct was correct—audience matters. Public blame often *performs* moral purity, exploiting past wrongs for social capital.  

  ### Test Case: The Lobbyist
  - **Scenario**: A climate lobbyist who *still flies private jets weekly* condemns an influencer for taking a gas-guzzling yacht vacation.  
  - **Verdict via Principle**: Lacks standing. Despite differences (jets vs. yachts), the lobbyist is **actively complicit in excessive emissions** and benefits from luxury while blaming others. Her blame diverts attention from her ongoing actions.  

  ### Key Distinctions the Principle Captures:
  - **Repentance vs. Ongoing Action**: Stopping the behavior and showing remorse restores standing (Cases 2, 6-private, 7).  
  - **Benefit & Complicity**: If you profit from or enable the wrong (Case 3’s political gain, Case 5’s power dynamic), you can’t credibly blame.  
  - **Audience Matters**: Private regret is honest; public blame can be performative (Case 6).  
  - **Hypocrisy Alone Isn’t Enough**: The *would-be thief* (Case 4) isn’t hypocritical—they’ve done nothing wrong.  

  This principle avoids judging based on "purity" or minor inconsistencies, focusing instead on whether the blamer’s *current relationship to the wrong* undermines their moral authority. It explains why reformed people can speak credibly, while active participants cannot.
