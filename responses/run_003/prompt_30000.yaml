  On the other hand, Alma seeing Ennis and Jack kiss is pivotal. Her pain comes from betrayal and the secrecy, not the relationship per se. Lureen's unspoken loneliness and the children's confusion add layers. These harms stem from the need to hide, which is a product of societal repression. Bentham's focus is on direct harm from criminalization, but the film shows emotional harm from societal stigma even without legal intervention.

