  Logical uncertainty is another killer. In XOR blackmail, your action depends on predicting your own behavior in a hypothetical. But what if you're unsure what you'd do? The user's policy assumes perfect self-knowledge, but humans (and even AIs) have limits here. If you can't definitively say "I would pay in the heads world," the expected value calculation crumbles. That seems like a fundamental crack in the foundation.

  Then there's self-referential traps like the Prisoner's Dilemma with a clairvoyant. Here, cooperation is FDT-optimal but individually catastrophic. The user's policy could demand self-sacrifice in ways that feel absurd. Worse, it might be reflectively unstable—if everyone follows FDT, they all defect anyway. That’s not just awkward; it’s a total breakdown.

  On metaphysics, the "branching selves" idea is indeed thorny. If the heads world doesn't exist, what does it mean for your decision to "determine" that counterfactual? Philosophers like Lewis might call this magic. But maybe the user can sidestep this by treating it as a computational fact about how predictors work. Still, it’s a vulnerability.

  Dutch books? Actually, FDT avoids them in some setups. And the "paying scammers" problem might be fixable with priors. But the other issues? They cut deeper. Particularly the logical uncertainty and self-referential cases—they show the view isn't just counterintuitive but actively incoherent in key scenarios.

  The user might bite the bullet on some points, but the Prisoner’s Dilemma case feels fatal. If their own principles force them into a losing move, that’s not defensible. So what’s the alternative? CDT has its own flaws, but at least it doesn’t demand self-harm. Maybe a hybrid approach? Or something like updatelessness without the logical omniscience.

