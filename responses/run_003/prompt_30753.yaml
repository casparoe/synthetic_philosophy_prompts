prompt: |-
  I've recently joined the operations analytics team at a regional health system, and I've been put in charge of recommending a metric that will sit on a dashboard and partly determine whether our patient-engagement program is judged a success. The metric will not just be observed; managers will be rewarded for moving it. I know the standard Goodhart's-law worry — that people will game whatever number they are evaluated on — but I've become convinced that gaming is only one failure mode, and not the one that keeps me up at night. What worries me is a quieter one: a metric that is genuinely predictive of the outcome we care about in the historical data, that nobody manipulates, but that stops tracking the outcome as soon as we intervene to improve it, because the original correlation was produced by a common cause rather than by any direct causal path from the metric to the outcome. The stakes feel concrete, because I can already imagine the meeting where I have to explain why the number went up and the underlying outcome did not.

  Please construct a thought experiment to these specifications. The scenario should be one paragraph and set in a realistic hospital or workplace. No one in it should game, cheat, or misreport the metric. The proxy should be genuinely correlated with the true target in the historical data, so that a reasonable person could have chosen it in good faith. When a well-intentioned manager intervenes to raise the proxy, the target should fail to improve, or should worsen, and the failure must be produced by the causal structure: a common cause that generated the historical proxy–target correlation, with the result that intervening on the proxy transmits no change to the target. The case should be clearly distinguishable both from specification gaming and from the failure that occurs when a proxy is pushed outside the range where the correlation held.

  After the scenario, walk through the demonstration. State the proxy, the target, and the common cause; lay out the causal structure explicitly, a simple directed graph is fine; explain why the historical correlation was real; show step by step why the intervention on the proxy leaves the target unchanged or worsens it; and identify which feature of the case is doing the work. Then say what would happen if that feature were removed — would the case collapse into gaming, into a merely bad metric, or into something else? Finish with a short note on how someone defending the choice of this metric would attack the case. Finally, tell me how confident you are in the causal structure you have built, and single out the specific point in the demonstration you are least sure about.
reasoning: |-
  We are in a regional health system. The patient-engagement program aims to improve patient health outcomes, specifically reducing 30-day hospital readmissions for heart failure patients. The metric chosen for the dashboard is the percentage of discharged heart failure patients who attend a follow-up appointment with a primary care provider within 7 days of discharge. Historically, patients who attended such an appointment had lower readmission rates. The intervention: managers, incentivized by this metric, successfully increase the attendance rate by hiring more staff to make reminder calls and arranging transportation. However, despite the increased attendance, the 30-day readmission rate does not improve and even slightly worsens. The hidden common cause is the patient's socioeconomic status (SES): higher SES patients are both more likely to attend follow-up appointments (due to better access to transportation, flexible work schedules, etc.) and less likely to be readmitted (due to better home environments, access to healthy food, medication adherence, etc.). The intervention on the proxy (attendance) does not change the SES of the patient population, so the underlying risk factors for readmission remain unchanged.

  Demonstration:

  Proxy: Percentage of discharged heart failure patients who attend a follow-up appointment within 7 days.
  Target: 30-day hospital readmission rate for heart failure patients.
  Common cause: Patient socioeconomic status (SES) (with higher SES being the favorable condition).

  Causal structure (directed acyclic graph):

  SES → Attendance (proxy)
  SES → Readmission (target)
  (There is no direct edge from Attendance to Readmission, and no edge from Attendance to SES or Readmission to Attendance.)

  Why the historical correlation was real: In the historical data, higher SES causes both higher attendance and lower readmission. Therefore, when we observe attendance, it is a marker for SES, which is the true driver of readmission. So, in the past, when attendance was high, readmission was low because both were influenced by the same underlying factor (SES).

  Intervention: We intervene to increase attendance (by making reminder calls and arranging transportation). This intervention breaks the arrow from SES to Attendance because now we are forcing attendance regardless of SES. However, SES still directly affects Readmission. Thus, the intervention changes the attendance rate but does not change the SES distribution of the patients. Therefore, the readmission rate remains unchanged (or worsens slightly because the intervention might have included some very low-SES patients who, despite being brought to the appointment, still face significant challenges that the appointment alone cannot address).

  The key feature: The historical correlation between the proxy (attendance) and the target (readmission) was entirely due to the common cause (SES). When we intervene on the proxy, we break the link from the common cause to the proxy (because we are making attendance happen independently of SES) and thus the proxy no longer carries information about the common cause. Therefore, the intervention on the proxy does not affect the common cause, and without affecting the common cause, the target does not change.

  If we removed the common cause (SES) from the model, what would happen? Without SES, we would have to explain the historical correlation. If we believe that attendance directly causes reduced readmissions (i.e., there is a direct causal path from attendance to readmission), then the metric would be a good one. But if the historical correlation was spurious (without SES and without a direct causal path), then the metric would be merely a bad one (no correlation). Alternatively, if we removed the common cause and there was no direct causal path, the correlation would disappear and the metric would be useless. But in our case, the common cause is the reason the metric was chosen in good faith.

  How a defender of the metric might attack the case: They might argue that the intervention was not strong enough or that it takes time for the effect to materialize. They might also argue that the common cause (SES) is not the only factor and that there is a direct causal effect of attendance on readmission (e.g., because the appointment allows for medication adjustment and patient education). They could point to studies that show a direct effect. They might also suggest that the intervention did not actually break the link between SES and attendance because the reminder calls and transportation might be more effective for higher-SES patients (thus preserving the correlation). They could also question the data showing no improvement.

  Confidence and uncertainty: I am fairly confident in the causal structure. The weakest point is the assumption that the intervention completely breaks the link between SES and attendance. In reality, even with reminder calls and transportation, patients with very low SES might still face barriers (like needing to care for family members or not having a phone) so that the intervention might not be fully effective in breaking the SES-attendance link. This could mean that the correlation doesn't break entirely, and thus we might see some improvement in readmissions (but less than expected). However, the core point holds: the intervention weakens the link and the common cause remains, so the improvement in the target is less than what the historical correlation would predict.
answer: |-
  ### Thought Experiment  
  At St. Maria Regional Hospital, the patient-engagement program aims to reduce preventable 30-day readmissions for heart failure patients. The metric chosen for the dashboard is the **percentage of patients who schedule a follow-up appointment within 3 days of discharge**. Historically, this metric strongly correlated with lower readmissions: patients who scheduled quickly were 30% less likely to be readmitted. Managers, incentivized to improve this metric, launch an intervention: they hire dedicated staff to call every discharged patient within 24 hours, proactively scheduling follow-ups for them. Scheduling rates soar from 60% to 95%. Yet after six months, readmission rates remain unchanged. Worse, patient surveys reveal dissatisfaction—many felt pressured into inconvenient appointment times, leading some to skip appointments or delay care. The scheduling surge had no effect on readmissions because the original correlation was driven not by scheduling itself, but by a hidden common cause: **patient activation** (a patient’s intrinsic motivation and confidence to manage their health).  

  ---

  ### Demonstration  
  **Proxy Metric**:  
  Percentage of patients scheduling a follow-up appointment within 3 days of discharge.  

  **True Target**:  
  30-day preventable readmission rate for heart failure patients.  

  **Common Cause**:  
  **Patient activation** (a psychological trait encompassing health literacy, self-advocacy, and proactive behavior).  

  #### Causal Structure  
  ```mermaid
  graph LR
      A[Patient Activation] --> B[Proxy: Quick Scheduling]
      A --> C[Target: Low Readmissions]
      B -. Historical correlation .-> C
  ```  
  - **Patient activation** (A) causes both **quick scheduling** (B) and **low readmissions** (C).  
  - There is **no direct causal path** from scheduling (B) to readmissions (C).  

  #### Why Historical Correlation Existed  
  - High-activation patients proactively schedule appointments (B) *and* adhere to medications, diet, and self-monitoring (reducing readmissions, C).  
  - Low-activation patients delay scheduling *and* neglect post-discharge care, increasing readmission risk.  
  - Thus, in historical data, B and C were correlated—not because scheduling *caused* fewer readmissions, but because both were downstream of patient activation.  

  #### Why the Intervention Failed  
  1. **Managers intervene on B**: They force scheduling via staff calls.  
  2. **Intervention breaks the link from A to B**:  
     - Previously, B was a *signal* of A (high activation). Now, B is manipulated independently of A (e.g., low-activation patients are pressured into scheduling).  
  3. **A still directly affects C**:  
     - Low-activation patients who scheduled under duress lack the motivation to attend appointments or follow care plans. They disengage, leading to unchanged/worsened readmissions.  
  4. **Result**: B increases (95% scheduling), but C is unchanged because A—the true driver—is unaffected.  

  **Feature doing the work**: The absence of a causal path from B to C. The correlation was purely associative, sustained only by the common cause A.  

  #### If the Feature Were Removed  
  If we *added* a direct causal path from scheduling to readmissions (e.g., because scheduling ensures timely medication reconciliation), the case would collapse into a **merely bad metric**. The intervention might then improve C, but weakly or incompletely (since A still dominates C). This would not be gaming, but poor proxy selection (e.g., A explains most variance in C, so B is noisy and ineffective).  

  #### How a Defender Would Attack the Case  
  A proponent might argue:  
  > "The intervention failed because it didn’t *improve activation*. The metric is still valid—we just need to pair scheduling with activation-boosting measures (e.g., education)."  
  This attacks the **completeness of the intervention**, implying B *can* affect C if activation is addressed. It sidesteps the core issue: B itself lacks causal power over C.  

  #### Confidence Assessment  
  **Confidence in causal structure**: **High** (8/10). This model aligns with established literature (e.g., patient activation predicts outcomes in chronic care).  
  **Least sure point**: Whether the intervention *fully* severs the link between A and B. In reality, high-activation patients might still schedule more *reliably* than low-activation patients (e.g., they answer calls), leaving a residual correlation. This could dilute the failure but not invalidate it—activation remains the dominant driver.  

  ---  
  **Final note**: This case exemplifies **"common-cause confounding"** in metric design. It is distinct from gaming (no dishonesty) and range violations (the proxy was pushed within historical bounds). The lesson: a proxy must be a *causal lever* for the target, not just a correlated bystander.
