     - "In the simmballs example, the batter's 'intent to swing' is a high-level pattern. But is it causing the physical movements, or is it just a shorthand for the low-level physics?"

  **What it misses**: 
  - The activity introduces intentionality and understanding at the substrate level, which is absent in the careenium. This might skew the discussion. To recover, acknowledge this in the debrief: "Remember, in the careenium, the tiles don't have mental states. But in this activity, you do. How does that affect the question of top-down causation?"

  Despite the compromise, this activity should make the tension between bottom-up and top-down causation palpable.
