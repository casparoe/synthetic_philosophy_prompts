  ### **Activity: "Pattern Pulse"**
  **Objective:** Students embody a simple substrate (cells) following local rules, while a higher-level pattern (a "pulse") emerges and appears to direct their actions. The tension arises when the pulse seems to cause changes, even though individuals are only responding to neighbors.

  ---

  ### **Setup & Materials**
  - **Chairs**: Arrange in a **5x3 grid** (15 chairs) with aisles for students to see neighbors. Label rows 1–5 (front to back) and columns A–C (left to right).  
  - **Cards**: Two colored index cards per student:  
    - **WHITE** = "Resting" state  
    - **BLUE** = "Active" state  
  - **Roles**: Assign each student a grid position (e.g., "3B" for row 3, column B).  
  - **Initial State**: Pre-set 3 students as "Active" (blue cards) in a diagonal pattern:  
    - *(1A: Active), (2B: Active), (3C: Active)*  
    - All others start as "Resting" (white cards).  

  ---

  ### **Rules for Students (Simple Local Interactions)**
  1. **You only interact with ADJACENT neighbors** (front, back, left, right—no diagonals).  
  2. **Each "round" lasts 30 seconds**:  
     - **Step 1 (Observe)**: Count your **active neighbors** (blue cards).  
     - **Step 2 (React)**: Apply the rule:  
       - **If you are RESTING (white)**:  
         - Become **ACTIVE (blue)** if **exactly 1 neighbor** is active.  
         - Otherwise, stay resting.  
       - **If you are ACTIVE (blue)**:  
         - Become **RESTING (white)** after this round.  
  3. **All changes happen simultaneously** at the end of each round (instructors call "SWITCH!" to synchronize).  

  ---

  ### **How the "Pulse" Emerges**
  - **Pattern Emergence**:  
    - **Round 1**: The diagonal (1A, 2B, 3C) activates neighbors to their right/down (e.g., 1A activates 1B; 2B activates 2C; 3C activates 3B).  
    - **Round 2**: Newly active cells trigger others, creating a **downward-right moving "pulse"** (e.g., 1B activates 2B; 2C activates 3C).  
    - **Round 3–4**: Pulse continues moving diagonally until it "hits" the grid edge (e.g., row 5, column C).  

  - **Illusion of Control**:  
    - The pulse appears to "steer" the grid—e.g., it "commands" cells to activate ahead of its path.  
    - In reality, each student only counts neighbors. The pulse is an **emergent pattern**, not a causal agent.  

  ---

  ### **Step-by-Step Execution (25–30 min)**  
  1. **Introduction (3 min)**:  
     - *Instructor*: "You are cells in a grid. Follow only the rules I’ve given. Your goal is to react to neighbors—nothing else."  
     - Hand out cards; ensure students know their grid position.  

  2. **Round 1 (5 min)**:  
     - Students observe neighbors, count active (blue) cells.  
     - Instructor calls "SWITCH!" → Students change cards simultaneously.  
     - *Expected pulse movement*: Diagonal shifts down-right (1A→1B, 2B→2C, 3C→3B).  

  3. **Round 2 (5 min)**:  
     - Repeat Step 2. Pulse moves further (e.g., 1B→2B, 2C→3C).  

  4. **Round 3 (5 min)**:  
     - Pulse nears the grid edge (e.g., 2B→3B, 3C→4C).  
     - *Optional*: Designate an "edge cell" (e.g., 5C) to "reset" the pulse by staying active longer (breaks rules slightly to sustain the pattern).  

  5. **Round 4 (5 min)**:  
     - Pulse "dissolves" at the edge (or resets if optional rule used).  
     - Students freeze in final states.  

  6. **Transition to Debrief (2 min)**:  
     - Students hold up cards to show the pulse’s path.  

  ---

  ### **Debrief: Mapping to Philosophy (20–25 min)**  
  **Core Question**: *"Did the PULSE control you, or were you just following local rules?"*  

  | **Activity Moment**          | **Philosophical Link**                                                                 | **Guiding Questions**                                                                 |
  |------------------------------|----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Pulse emerges** (Round 1–2) | **Dennett’s "Real Patterns"**: The pulse is a higher-level abstraction with predictive power. | "When you saw the pulse coming, did it feel like it was *making* you change? Or were you just tallying neighbors?" |
  | **Pulse "steers"** (Round 3)  | **Top-down illusion**: Pulse *seems* causal (like beliefs/simmballs), but is epiphenomenal. | "If the pulse could talk, would it say *it* caused the changes? Would it be right?"  |
  | **Edge interaction**          | **Hofstadter’s "Strange Loop"**: Feedback loops create agency *illusions* (e.g., careenium). | "When the pulse hit the edge, did it ‘know’ it was trapped? Or was it physics all along?" |
  | **Student frustration**       | **Causal exclusion problem**: Can macro-patterns *really* add new causation?             | "When you wanted to ‘help’ the pulse, was that urge part of the pattern? Or just *you*?" |

  **Synthesizing Questions**:  
  - "In this simulation, was the pulse **real** (like Dennett’s beliefs) or just **useful** (like Hofstadter’s symbols)?"  
  - "Does the pulse exist independently of the cells? Or is it *made of* their interactions?"  
  - "How does this relate to your mind: Are *your* thoughts the substrate or the pulse?"  

  ---

  ### **Limitations & Recovery Tips**  
  **What the Activity Misses/Distorts**:  
  1. **Intentionality**: Students know they’re in a simulation, unlike mindless careenium tiles. *Recovery*: Stress that the *rules* are the "physics"—students are proxies for passive substrate.  
  2. **Downward Causation Nuance**: Real-world patterns *constrain* lower levels (e.g., DNA code). Here, patterns don’t alter rules. *Recovery*: Discuss how rules could evolve (e.g., "What if cells adapt to preserve the pulse?").  
  3. **Consciousness**: Simmballs’ "intent" involves self-reference; the pulse lacks this. *Recovery*: Add a "meta-rule" (e.g., cells track pulse location) to mirror feedback loops.  

  **What Could Go Wrong**:  
  - **Grid Confusion**: Students miscount neighbors. *Recovery*: Use sticky notes to label chairs; walk the grid to demo adjacency.  
  - **Pulse Fizzles**: If students err, the pattern breaks. *Recovery*: Use the "reset" rule at edges or restart Round 1.  
  - **Over-Agency**: Students "cheat" to help the pulse. *Recovery*: Leverage this in debrief—"Did your *desire* for the pulse feel like top-down causation?"  

  ---

  ### **Why This Works**  
  - **Physicalizes Abstraction**: Students *feel* the tension between local rules and global patterns.  
  - **Low-Tech & Scalable**: Uses only chairs/cards; works in tight spaces.  
  - **Debrief Bridges to Texts**: Explicitly links to careenium (emergent "shiner"), simmballs ("intent"), and Dennett/Hofstadter’s core arguments.  

  This activity creates a visceral experience of the "causal dangler" problem—setting up a rich debate about whether patterns *push* or just *are*.
