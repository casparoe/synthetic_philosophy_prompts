  First, I need to recall the core of the moral luck problem. It's about how luck influences moral judgments—resultant, constitutive, circumstantial. The user seems well-versed here, mentioning all three types. Their main request is for counterarguments, so I should organize those effectively. 

  They mention "fatal" down to "annoying but survivable" challenges. That suggests a need for a tiered approach. I'll start with the most serious objections. The agency objection comes to mind—denying agency outright could undermine morality entirely. That's a big one. Then there's the practical concerns, like how we'd function without moral responsibility. 

  The user is also interested in unfalsifiability. If moral luck proponents adjust their view to avoid counterexamples, does it become untestable? That's a meta-philosophical point worth addressing. They might be worried that the argument is too flexible, avoiding refutation by constant qualification. 

  Another angle is what defenders must concede. For instance, they probably can't deny the existence of luck's influence. But they might reframe desert or emphasize different moral concepts like character assessment over blame. 

