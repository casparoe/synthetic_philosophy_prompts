prompt: |-
  I'm in a philosophy of science seminar this term and our class runs a little interview series, so i get to interview our next guest — a visiting philosopher who defends constructive empiricism, i.e. the view that underdetermination is a decisive argument against scientific realism and that we should only accept our best theories as empirically adequate, not as true. I want to prep some sharp questions and could use your help. Can you draft eight to ten interview questions that go beyond having him restate the view? I want at least one question each on: the triviality objection — if you let the rival theories import whatever background assumptions they want, almost any two theories can be made empirically equivalent, so how does he keep underdetermination from being a point thats just trivially always true rather than a substantive argument; the no-miracles argument — how he responds to the realist claim that the predictive success of theories with unobservable entities (electrons, quarks, etc.) is a miracle unless those theories are roughly true; and the underdetermination of the past — whether he thinks even the past is underdetermined by present evidence, and what that would imply. For each of those, give me a follow-up keyed to the answer he's most likely to give (like, if he says the no-miracles argument is question-begging, push on what a non-question-begging version would have to look like). End with one question about what evidence or argument could actually count against his position.
