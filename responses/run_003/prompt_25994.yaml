  For the normative work question... it's tricky. Killing/letting die seems like a subset of doing/allowing (since death is specific), but death's irreversibility makes the stakes higher, so it might need its own framework. Philippa Foot's double effect doctrine could help explain why we treat them differently morally. 

  I should emphasize that while logically distinct, in practice they often overlap - except in edge cases like withdrawal of care or omissions without duty. Those exceptions prove they're not identical. 

