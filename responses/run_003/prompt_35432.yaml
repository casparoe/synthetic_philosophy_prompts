  After reflection, I found that the pattern is known as **"the trap of universal functionalism"** in social theory, but that's not general.

  I decide to use:

  **Concept name: "Explanatory Degeneracy"**

  But note: in philosophy of science, degeneracy is a term used by Lakatos and others to denote a research programme that is not progressing. However, the pattern described is a property of the theory itself.

  So, I will define it as follows:

  Definition: 
  "Explanatory degeneracy is a property of a scientific theory whereby its core concepts are so abstract and flexible that any empirical observation can be accommodated as an instance of the theory without the need for auxiliary hypotheses. This is achieved by reinterpreting the parameters, boundary conditions, or scale of application of the theory such that the observation is rendered consistent with the theory's fundamental principles."

  Now, for the nearest concepts:

  1. Unfalsifiability: 
     How it differs: Unfalsifiability means the theory cannot be tested. Explanatory degeneracy is a specific form of unfalsifiability where the theory is not strictly unfalsifiable because it can be tested in principle, but in practice, it can be adjusted to fit any data without changing the core.

  2. Ad hoc hypothesis:
     How it differs: Ad hoc hypotheses are additional assumptions added to the theory to save it from a counterexample. In explanatory degeneracy, no new hypotheses are added; instead, the existing conceptual framework is reinterpreted.

  3. Tautology:
     How it differs: A tautology is a statement true by definition (e.g., "all bachelors are unmarried"). Explanatory degeneracy is not a tautology because the theory makes empirical claims, but it is so flexible that it becomes empirically vacuous.

  4. Underdetermination of theory by data:
     How it differs: Underdetermination occurs when multiple theories fit the same data. Explanatory degeneracy is a specific case where one theory can fit all possible data by itself.

  Boundary cases:

  1. **Falsification by a crucial experiment**: 
     Why different: In a crucial experiment, a theory is tested and fails. This is the opposite of explanatory degeneracy, which prevents such failure.

  2. **Auxiliary hypotheses that are independently testable**: 
     Why different: When a theory is saved by an auxiliary hypothesis that can be tested independently, it is a legitimate defense (per Lakatos). Explanatory degeneracy does not involve auxiliary hypotheses.

  3. **A theory that is genuinely universal and not degenerate**: 
     Example: The theory of evolution by natural selection. It applies to a vast range of phenomena but makes specific predictions and is not degenerate because it can be (and has been) falsified in principle (e.g., by finding complex adaptations without inheritance). 
     Why different: Even though evolutionary theory is broad, it has specific constraints and makes testable predictions. It does not rely on reinterpreting the parameters for every new observation.

  Verdict on the free energy principle (FEP):

  The FEP has been criticized for exactly this pattern. It claims to be a universal principle for self-organizing systems, and its proponents often argue that any behavior can be seen as minimizing free energy under the right priors and expected states. Thus, it does exhibit explanatory degeneracy. However, its defenders would argue that it is a unifying framework that is not degenerate because it makes quantitative predictions in specific implementations. The verdict: yes, it does exhibit the pattern, but whether this is a fatal flaw is debated.

