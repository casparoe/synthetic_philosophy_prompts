  - The pattern described is reminiscent of "degeneracy" in the philosophy of science, but more specifically it aligns with what is sometimes called "universal adaptability" or "theoretical plasticity". However, there is a known concept in the philosophy of science that fits: **explanatory plasticity**.

  But note: the term "explanatory plasticity" is not universally established. Alternatively, we might consider **immunization by redefinition** or **conceptual stretching**. However, the pattern is also similar to what Imre Lakatos described in his methodology of scientific research programmes (MSRP) as a "degenerating problem shift", but that is more about a series of theories.

  Another candidate is **ontological flexibility** or **theoretical underdetermination by data**, but these are broader.

  Upon reflection, the pattern is very close to what is sometimes called **degenerate underdetermination** or **degenerate accommodation**. However, the term that best captures the idea of a theory that can be stretched to explain any observation without modification is **degenerate theory** in the sense used by Lakatos (but note: Lakatos used "degenerating" for research programmes that only make post-hoc explanations).

  A more precise term that has been used in the context of Bayesian and predictive processing theories is **trivialization by universal applicability**. However, we are looking for an established name.

  Let me propose: **explanatory degeneracy**. But I recall that in the philosophy of science, **degenerate research programme** (Lakatos) is the closest. However, the pattern described is at the level of a single theory.

