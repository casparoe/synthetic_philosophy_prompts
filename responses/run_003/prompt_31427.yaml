answer: |-
  You're absolutely right to seek the blueprint first – population axiology is a minefield of impossibility results, and understanding the core tensions is crucial before evaluating any specific theory. Below are the key desiderata, their motivations, known inconsistencies, the "elephant in the room," and the underrated constraint.

  **Core Desiderata for Population Axiology**

  1.  **Non-Elitism (Minimal Non-Extreme Priority):**
      *   **Formal:** There exists some number of lives at a very low positive welfare level (`w_low`) and some number of lives at a very high welfare level (`w_high`), such that adding the `w_low` lives is better than adding the `w_high` lives *if* the `w_low` group is sufficiently large.
      *   **Motivation:** Avoids absurd conclusions where we prioritize a single extremely happy life over the well-being of a vast multitude of lives that are still worth living. Example: Choosing a world with 1 supremely happy person over a world with 10^100 people whose lives are just barely worth living seems intuitively wrong. Non-Elitism says that for some sufficiently large number, the latter world *is* better.
      *   **Case:** World A: 1 person at +100 welfare units. World B: Vast number (N) of people at +1 welfare unit. Non-Elitism says: For some large N, B is better than A.

  2.  **Non-Antiegalitarianism:**
      *   **Formal:** For any two populations with the same number of people and the same total welfare, a perfectly equal distribution is at least as good as an unequal distribution.
      *   **Motivation:** Reflects the common intuition that inequality, holding everything else constant, is bad. Example: World A: Two people at +50 each (Total: 100, Equal). World B: One person at +99, one at +1 (Total: 100, Unequal). World A seems better.
      *   **Case:** Same total welfare, same size: Equality preferred over inequality.

  3.  **Asymmetry (Negative Utilitarian Intuition):**
      *   **Formal:** The avoidance of creating a life with negative welfare (a life not worth living) has stronger moral weight than the obligation to create a life with positive welfare.
      *   **Motivation:** Intuition that preventing suffering is more urgent than creating happiness. Example: We feel a strong duty not to create a miserable child, but no strong duty to create a happy child if we choose not to have children at all. Creating a life that suffers seems worse than failing to create a life that would have been happy.
      *   **Case:** Choosing *not* to create a potential person who would have a -10 life seems obligatory. Choosing *not* to create a potential person who would have a +10 life does not seem morally wrong (merely a missed opportunity).

  4.  **Mere Addition Principle (Weak Version):**
      *   **Formal:** Adding people with positive welfare to a population, without affecting the welfare of the existing people, does not make the population worse (and is usually better).
      *   **Motivation:** It seems counterintuitive that adding happy people *by itself* could be bad. Example: World A: 10 people at +10. World A+: 10 people at +10 + 1 extra person at +5 (happy but less happy). A+ doesn't seem *worse* than A; the extra happy life is a good thing.
      *   **Case:** Adding happy people without harming others isn't bad.

  5.  **Avoidance of the Sadistic Conclusion:**
      *   **Formal:** It cannot be better to add people with negative welfare (lives not worth living) than to add people with positive welfare.
      *   **Motivation:** A direct repudiation of an absurd consequence. Example: World A: Adding 1 person at +5 (happy). World B: Adding 1 person at -5 (miserable). It should *never* be the case that B is better than A. A theory implying otherwise is deeply flawed.
      *   **Case:** Adding happy people is always better than adding miserable people, all else equal.

  6.  **Avoidance of the Repugnant Conclusion:**
      *   **Formal:** For any population with very high welfare, there is *not always* a better population consisting of a vast number of people with lives barely worth living.
      *   **Motivation:** The namesake problem. Example: World A: 10 billion people living lives of incredible flourishing and happiness (+1000). World Z: A vast number of people (10^100?) living lives that are barely worth living, just above neutrality (+0.0001). Intuitively, world A seems vastly superior to world Z, even though Z might have a larger total sum of welfare. A theory implying Z is better than A is "repugnant."
      *   **Case:** A large, very high-quality population is better than a gargantuan, very low-quality population.

  7.  **Transitivity:**
      *   **Formal:** If population A is better than population B, and population B is better than population C, then population A is better than population C.
      *   **Motivation:** A foundational requirement for rational choice and consistent betterness ordering. Without transitivity, cycles can occur (A>B, B>C, C>A), making rational choice impossible and the very concept of "better than" incoherent.
      *   **Case:** Fundamental requirement of rational preference/ordering.

  8.  **Completeness (Often assumed, sometimes relaxed):**
      *   **Formal:** For any two distinct populations A and B, either A is better than B, or B is better than A, or they are equally good. (No incommensurability or incomparability).
      *   **Motivation:** Ensures the theory provides a definite answer for any comparison, which is often desired for decision-making. However, some theories relax this, allowing that some populations might be genuinely incomparable.
      *   **Case:** The theory should be able to rank any two possible populations.

  9.  **Dominance (Pareto Principle):**
      *   **Formal:** If every person in population A has at least as high welfare as the corresponding person in population B (and populations are the same size), and at least one person has strictly higher welfare, then A is better than B. Also applies to Same Number Cases: If population A has the same people as population B but everyone in A is better off, then A is better.
      *   **Motivation:** A very strong and seemingly uncontroversial principle. If you can make some people better off and no one worse off, that should be an improvement. Also covers cases of strict dominance.
      *   **Case:** World A: Alice +5, Bob +5. World B: Alice +5, Bob +4. A is better than B. World C (new person): Alice +5, Bob +5, Chad +5. World D: Alice +5, Bob +5, Chad +4. C is better than D.

  10. **Domain Variability (Robustness Across Welfare Ranges):**
      *   **Formal/Intuitive:** The theory should yield plausible judgments across the full spectrum of possible welfare levels, from extreme suffering to extreme flourishing, and for populations of vastly different sizes, not just in the narrow "repugnant" zone.
      *   **Motivation:** A theory that avoids the Repugnant Conclusion only by making terrible judgments about small populations, medium populations, or populations involving suffering is inadequate. Example: A theory might correctly say a large high-quality population is better than a gargantuan low-quality one, but then incorrectly imply that adding a few miserable lives is acceptable if it allows adding many more barely-positive lives elsewhere.
      *   **Case:** The theory shouldn't just "solve" the textbook Repugnant Conclusion case but break down in other, equally important scenarios (e.g., involving negative welfare or moderate trade-offs).

  **The Impossibility Landscape (Arrhenius's Theorems & Others)**

  Gustaf Arrhenius proved a series of increasingly general impossibility theorems showing that **no population axiology can satisfy all of the following simultaneously**:

  1.  **Egalitarian Dominance (Stronger than Non-Antiegalitarianism):** If A has higher average welfare *and* is more equal than B (same size), then A is better than B.
  2.  **General Non-Extreme Priority (Stronger than Non-Elitism):** For *any* welfare level `w_low` > 0 and *any* higher level `w_high`, there exists a sufficiently large number N such that adding N people at `w_low` is better than adding one person at `w_high`.
  3.  **Weak Non-Sadism:** Adding any number of people with positive welfare is better than adding *any* number of people with negative welfare. (Stronger than Avoidance of Sadistic Conclusion).
  4.  **Weak Quality Addition:** If a population A is at a very high positive welfare level, then for any population B consisting of A plus some people at a negative welfare level, there is a population C consisting of A plus some people at a very low positive welfare level such that C is better than B. (Avoids "hellish" additions being better than slightly positive additions).
  5.  **Mere Addition (Weak Version):** See above.
  6.  **Avoidance of the Repugnant Conclusion:** See above.
  7.  **Transitivity:** See above.

  **Key Incompatible Subsets (The Core Tensions):**

  *   **The Mere Addition Paradox Trilemma:** You cannot simultaneously satisfy **Mere Addition**, **Avoidance of the Repugnant Conclusion**, and **Transitivity**. (This is the classic, simpler paradox demonstrating the core conflict).
  *   **The Repugnance Trilemma (Arrhenius Core):** You cannot simultaneously satisfy **Non-Elitism (or stronger versions)**, **Avoidance of the Repugnant Conclusion**, and **Transitivity**.
  *   **The Suffering Trilemma:** You cannot simultaneously satisfy **Asymmetry (or stronger versions like Weak Non-Sadism)**, **Mere Addition**, **Avoidance of the Sadistic Conclusion**, and **Transitivity**. (Adding happy people is good, but avoiding adding miserable people is even more important, yet Mere Addition might force comparisons that pit these against each other in cycles).

  **The Secretly Sacrificial Desideratum: Non-Antiegalitarianism**

  This is the one many are intuitively most willing to relax, though they might not frame it that way. Why?

  1.  **The "Quantity over Perfect Equality" Intuition:** When faced with a choice between a perfectly equal small population and a slightly unequal but much larger population where *everyone* (including the worst-off in the unequal world) is better off than in the equal world, many people intuitively prefer the larger, slightly unequal world. Strict adherence to Non-Antiegalitarianism forbids this if total welfare is the same, but total welfare usually increases with size.
  2.  **Focus on the Repugnant Conclusion:** The intense focus on avoiding Repugnance pushes theorists towards prioritizing either average welfare (which often conflicts with equality when adding lower welfare people) or critical levels (which can imply inequality is acceptable if it allows more people above the critical level). Sacrificing strict equality seems like a "lesser evil" compared to accepting Repugnance or Sadism.
  3.  **Practicality:** In real-world policy involving future generations, perfect equality is often seen as less critical than ensuring lives are above a certain positive threshold or maximizing total/average welfare, even if it introduces some inequality.

  **The Most Underrated Constraint: Domain Variability (Robustness)**

  *   **Why it's underrated:** Much of the literature focuses intensely on the specific "Repugnant Conclusion" scenario (high quality vs. massive low quality) and the "Mere Addition Paradox." Theories are often judged primarily on how they handle these specific thought experiments. However, a good theory needs to perform plausibly *across the board*.
  *   **Why it's crucial:**
      *   **Hidden Repugnance:** A theory might avoid the textbook Repugnant Conclusion but imply that a world with widespread mild suffering and a huge population is better than a world with moderate happiness and a smaller population – arguably just as repugnant.
      *   **Suffering Blindness:** A theory focused on avoiding Repugnance might fail catastrophically in scenarios involving negative welfare, e.g., implying that adding vast numbers of barely miserable lives is acceptable if it prevents a small amount of suffering elsewhere.
      *   **Middle-Ground Failure:** Theories might give sensible answers for extreme cases but yield highly counterintuitive results for populations of moderate size or welfare levels common in realistic policy choices.
      *   **Ad-hoc Solutions:** Focusing only on the headline paradoxes can lead to theories that are overly tailored ("gerrymandered") to solve those specific cases but lack coherence elsewhere.
  *   **The Ask:** Don't just ask "Does this theory avoid the Repugnant Conclusion?" Ask relentlessly: "What does this theory say about *this* case involving moderate gains and losses?" "What does it say about adding lives with suffering vs. not adding them?" "What does it say about trade-offs between existing and future people across different welfare ranges?" A theory's true worth is revealed by its performance across the entire domain of possible populations.

  **In Summary:**

  You're right to feel like you're building without a blueprint. The field is defined by fundamental impossibilities. Any theory you encounter will sacrifice *some* intuitively plausible desideratum. Understanding *which* ones it sacrifices (Non-Elitism? Strict Equality? Full Transitivity? Robustness across cases?) and why the theorist made that choice is key. Pay close attention to how theories handle negative welfare (Asymmetry, Sadism) and moderate cases (Domain Variability), not just the headline-grabbing Repugnant Conclusion. The impossibility results show that a truly perfect blueprint doesn't exist; the task is to find the least flawed design for the ethical problem you're trying to solve.
