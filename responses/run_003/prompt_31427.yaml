  For the "secretly sacrificed" desideratum... *considers classroom debates* Many intuitively ditch Non-Antiegalitarianism when pressed - that moment when people admit "fine, maybe perfect equality isn't always best if we get more happy people." But they'll cloak it in "practical concerns."

