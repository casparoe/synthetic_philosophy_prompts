prompt: |-
  I'm a third-year undergraduate in a seminar called "The Normativity of Contracts," and we've spent the past several weeks on the question of why promises bind. We've worked through Hume's convention-based account in the Treatise, Rawls's practice-based view from "Two Concepts of Rules," and Scanlon's expectation-based account from What We Owe to Each Other. Our professor has asked the class to help design an in-class activity for next week's session that will make the rest of the students — about eighteen of us — feel the force of the central puzzle experientially rather than just reading about it. The session is eighty minutes, and the room is a seminar room with movable chairs and a whiteboard.

  The puzzle we keep circling around is this: when you break a promise, are you doing something wrong primarily because you've harmed the specific person you made the promise to — disappointed their expectations, betrayed their trust, taken advantage of their reliance — or because you've undermined a valuable social practice that everyone benefits from and you're free-riding on that practice? Or is there some third thing, something about the exercise of normative powers or the transfer of authority, that neither of these quite captures? The readings pull in different directions, and the discussion keeps stalling out because we don't have a shared experience to anchor the disagreement.

  I'd like to propose a structured activity — ideally a game with real but small stakes, like candy or extra-credit points — that forces participants to confront this question from the inside. The activity should have two distinct phases. In the first phase, promises are embedded in a clearly beneficial social practice: making and keeping promises visibly improves everyone's outcomes, and breaking them visibly harms the practice for everyone. In the second phase, promises are made one-on-one in isolation from any broader practice — no reputation, no group benefit, no third-party awareness — and participants have to decide whether they still feel bound. The transition between the two phases should be jarring: participants should walk out of the first phase convinced that the practice explains everything, and then find themselves in the second phase feeling that something is still missing. I need: (a) rules and materials for both phases, including a payoff scheme that doesn't require real money; (b) a timeline for the full eighty-minute session; (c) a debrief script that maps specific moments in the activity onto the philosophical accounts we've read, shows where the practice-based view gains traction and where it loses it, and introduces the voluntarist or authority-based alternative at the right moment; (d) an honest note on what will predictably go wrong when the activity is run — especially the risk that participants in Phase 2 will simply import the norms from Phase 1 and not feel the tension; and (e) a suggestion for a follow-up discussion question or short reading that ties the experience back to the texts.
reasoning: |-
  We are designing an in-class activity to explore the normativity of promises. The goal is to have two phases: 
   Phase 1: Promises embedded in a beneficial social practice (with group benefits and harms from breaking promises).
   Phase 2: Isolated one-on-one promises with no broader practice.

   We want to use non-monetary stakes: candy or extra-credit points. Let's use candy for simplicity.

   Activity Title: "The Promise Game"

   Overview:
     - Phase 1 (Social Practice): A repeated game in a small society (the class) where participants make and keep promises that benefit the group. Breaking promises will harm the group and the individual's future opportunities.
     - Phase 2 (Isolated Promise): A one-shot, anonymous, one-on-one promise with no reputational consequences and no effect on the group.

   Materials:
     - Candy (or tokens that can be exchanged for candy at the end) - enough for multiple rounds.
     - Note cards for making promises and recording decisions.
     - A whiteboard to track scores or group outcomes in Phase 1.
     - Envelopes for anonymous exchanges in Phase 2.

   Setup:
     - Move chairs into a circle for Phase 1 to encourage group feeling.
     - For Phase 2, set up pairs in a way that they cannot see each other's choices until revealed.

   Phase 1: The Social Practice Phase (approx. 30 minutes)

     Rules:
       - The game will be played in 3 rounds (each round takes about 5 minutes to play and 3 minutes for discussion/debrief, total 24 minutes, plus setup and transition).
       - Each round, participants are randomly paired (we have 18 students, so 9 pairs per round). 
       - Each pair will be given a task: 
            Option A: One player (the "promisor") can choose to give a promise to the other (the "promisee") that they will take an action that benefits both, but at a small cost to themselves. 
            Option B: Alternatively, they can choose not to promise and then decide independently.

       However, to emphasize the social practice, we can design a game where making a promise and keeping it is the only way to achieve the highest group benefit, and breaking promises leads to a breakdown.

     Proposed Game for Phase 1: "The Investment Game"

       - Each player starts with 5 pieces of candy (or tokens) in their personal stash.
       - There is a group pot that can grow and from which everyone benefits.

       Steps in a round:
         1. Pairing: Random pairs are formed (change each round).
         2. The promisor (randomly assigned in the pair) is given a choice: 
              - Make a promise to the promisee: "I promise that I will invest 3 of my candies in the group pot if you invest 1 candy in the group pot." 
              - Or: No promise is made, and then both independently decide whether to invest in the group pot without any condition.

         3. If a promise is made:
              - The promisee first decides whether to invest 1 candy (relying on the promise) or not.
              - Then the promisor decides whether to keep the promise (invest 3) or break it (invest 0).

         4. If no promise is made:
              - Both independently decide whether to invest 1 candy in the group pot (without any condition) or not.

         5. Investment outcomes:
              - The group pot: Every candy invested by anyone in the group pot is doubled (by the professor) and then divided equally among all 18 players.

         6. Record:
              - On the whiteboard, record the total investment in the group pot and the resulting payout per person.

       Payoff for a player in a round:
          Personal stash after investment: 
            If they invested (whether by promise or not), they subtract the amount they invested (0, 1, or 3).
            Plus: They get an equal share of the doubled group pot.

          Example: 
            Suppose in a round, total investment in the group pot is X candies. Then the pot becomes 2X, and each player gets (2X)/18 = X/9.

          For a promisee who relied (invested 1) and the promisor kept the promise (invested 3): 
            The promisee: 5 (initial) - 1 (invested) + (X/9) 
            The promisor: 5 - 3 + (X/9)

          But note: if the promisee relies and the promisor breaks, the promisee loses 1 and the promisor loses nothing, but the group pot is lower.

       The key: 
          - The group pot grows only if people invest. The promise mechanism allows for higher investment (because the promisor is committing to invest 3, which is more than the 1 they might do without a promise). 
          - However, if promisors break promises, then promisees who relied (invested 1) lose out individually and the group pot is lower.

       We expect that in early rounds, some breaking may occur, but then the group might develop a norm. We can have a discussion between rounds.

       Between rounds, allow 3 minutes for discussion: 
          - How did the promises work? 
          - Did anyone break? How did that feel? 
          - How did it affect the group pot?

       We want the group to see that when promises are kept, the group pot is high and everyone benefits. When broken, not only the promisee but everyone is hurt.

   Phase 2: The Isolated Promise (approx. 25 minutes)

     Now we break the social practice: one-shot, anonymous, no group effect.

     Rules:
       - Each participant is paired randomly with one other, but this time anonymously and only once.
       - They will not know who their partner is and will not interact again.

       The game: "The Anonymous Gift"

          - Each player is given 5 candies (or tokens) at the start of this phase.
          - In each pair, one is randomly assigned as the promisor and the other as the promisee (via note cards, without revealing identities).
          - The promisor sends a note (via an envelope) to the promisee: 
               "I promise to give you 2 of my candies at the end of the game."

          - The promisee then does nothing that affects the payoff (no reliance). 
          - The promisor then, in private, decides whether to keep the promise (give 2 candies to the promisee) or break it (give 0). 
          - The promisee never knows if the promise was made until after they receive their final candy (if they receive any). 

          - However, to make it truly isolated, we must ensure:
               - No one knows who their partner is.
               - The candies given are from the promisor to the promisee directly (via the professor as intermediary) and are not part of any group pot.

          - Payoff in this phase:
               - The promisee ends up with 5 (initial) plus whatever they receive (0 or 2).
               - The promisor ends up with 5 minus whatever they give (0 or 2).

          - Note: There is no benefit to the group, no reputation, and no future interaction.

     After the decisions, collect the envelopes and redistribute the candies accordingly without revealing who broke or kept.

     Then, we have a debrief.

   Timeline for 80-minute session:

     - Introduction (5 minutes): Explain the two phases and the rules for Phase 1.
     - Phase 1: (30 minutes)
          Round 1: 8 minutes (pairing, decision, payout, record)
          Discussion 1: 3 minutes
          Round 2: 8 minutes
          Discussion 2: 3 minutes
          Round 3: 8 minutes
          (If time is tight, we can do 2 rounds only, but 3 rounds allow norms to develop)

     - Transition to Phase 2 (5 minutes): Explain the rules and emphasize the differences (anonymous, one-shot, no group effect).

     - Phase 2: (15 minutes)
          Distribute materials and assign roles: 5 minutes
          Collect decisions and redistribute: 5 minutes
          (Participants fill out a decision card and put it in an envelope; the professor collects and then redistributes the candies accordingly.)

     - Debrief (25 minutes): Use the script below.

   Debrief Script:

     Start by asking about their experiences:

       Phase 1:
          - How did you feel when you made a promise in Phase 1? 
          - How did you feel when someone broke a promise? (Ask both promisees and promisors who broke or kept.)
          - What happened to the group pot when promises were broken? (Point to the whiteboard: note the decline in group pot if it occurred.)

          Map to readings:
            - Hume: The convention of promise-keeping is beneficial to society. When everyone follows, we all gain. Breaking is free-riding and harms the practice.
            - Rawls: The practice of promising is a social institution. The rules of the institution define what a promise is and what breaking it means. The wrong is in violating the institutional rules.

          Highlight: In Phase 1, the harm to the group and the free-riding aspect were evident.

       Phase 2:
          - Ask: How did you feel about the promise in Phase 2? 
          - Did you feel obligated to keep your promise even though no one would know and it didn't affect the group? Why or why not?
          - Ask for a show of hands (anonymously, perhaps by writing on a card): How many promisors kept their promise? (Then reveal the count.)

          Map to readings:
            - Scanlon: The wrong of breaking a promise is in the harm to the individual promisee: the creation and then disappointment of an expectation, and the betrayal of trust. But note: in Phase 2, the promisee did not rely (they didn't do anything based on the promise). So, does Scanlon's account still hold? 
            - However, we designed Phase 2 to have no reliance: the promisee doesn't change their behavior. So why might one still feel bound?

          Introduce the voluntarist view (like Owens or Shiffrin): 
            - The act of promising transfers a right to the promisee. By promising, you give the promisee authority over your action. Breaking a promise is wrong because you are violating the promisee's right to determine that you do the action.

          Point of tension: 
            - In Phase 1, the practice view seemed sufficient. But in Phase 2, without the practice, why do we still feel bound? 
            - This is where the practice view (Hume, Rawls) might lose traction: if the obligation comes only from the practice, then in Phase 2 (with no practice) there should be no obligation. But if participants felt obligated anyway, that suggests something more.

     What will predictably go wrong:

       - Phase 1: 
            * Some students might not take the game seriously and break promises randomly, which could make the group pot too low too quickly. 
            * The professor should moderate the discussion between rounds to emphasize the group effect and encourage norm formation.

       - Phase 2: 
            * The risk: participants might import the norm from Phase 1. They might feel that promises are binding because they are used to the practice. 
            * Mitigation: Emphasize strongly that Phase 2 is completely separate, anonymous, and has no group effect. Also, the promisee does not rely (so no harm from breaking) and there is no future interaction. 
            * However, it is possible that the norm will carry over. We can note that in the debrief: "Even though we tried to isolate, the habit of promise-keeping from Phase 1 might have influenced you. But notice: in Phase 2, the reasons for keeping the promise are not about the group. Why then did you keep it?"

       - Time: The activity might run over. We might need to cut a round in Phase 1.

     Follow-up discussion question:

          "Consider Scanlon's principle F (from What We Owe to Each Other): 
            Principle F: If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A's not doing so); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then A must do X unless B consents to X's not being done.

          In Phase 2, did the promisor provide assurance? Did the promisee rely? How does Scanlon's account apply to Phase 2? Does it capture the obligation even without reliance? Or do we need a different principle?"

     Alternatively, assign a short reading: 
          Excerpt from David Owens, "A Simple Theory of Promising" (2006), focusing on the authority-interest theory.

          Or, from Shiffrin, "Promising, Intimate Relationships, and Conventionalism" (2008).

     The goal is to bring the experience back to the texts and show that the voluntarist view offers a third alternative.

   Final note: 
     The activity is designed to create a lived experience of the puzzle. The debrief should draw out the tension and then show how the readings offer different explanations. The professor should be prepared to guide the discussion to the central question: What is the source of the obligation to keep a promise? Is it the practice, the harm to the individual, or the transfer of authority?

   Let me know if you need any adjustments.
answer: |-
  ### Structured Activity Proposal: "The Binding Promise Game"

  #### **Phase 1: Social Practice Game**  
  *Goal: Show how promises create group benefits and harm when broken.*  
  **Materials**:  
  - Candy or extra-credit tokens (e.g., 5 per student).  
  - Role cards (Promisor/Promisee).  
  - Public scoreboard (whiteboard).  

  **Rules**:  
  1. **Setup**: Divide into pairs (9 pairs total). Each pair draws cards: one "Promisor," one "Promisee."  
  2. **Promise Structure**:  
     - Promisor *publicly* promises to give 2 candies to the Promisee.  
     - Promisee *publicly* promises to invest 1 candy into a "Group Pot" (managed by the professor).  
  3. **Payoff Mechanics**:  
     - **If both keep promises**:  
       - Promisor gives 2 candies to Promisee.  
       - Promisee invests 1 candy into Group Pot → Pot doubles (e.g., 9 candies become 18).  
       - *All* students (even non-participating pairs) split the doubled pot equally (≈1 extra candy each).  
     - **If Promisor breaks promise**:  
       - Promisor keeps their 2 candies.  
       - Promisee *still* invests 1 candy → Pot grows but less (e.g., 9 candies become 18, but no extra from broken pair).  
       - Group split is smaller (e.g., 18/18 = 1 candy/person).  
     - **If Promisee breaks**: No investment → Pot shrinks (e.g., 8 candies doubled = 16 → 0.88 candy/person).  
  4. **Reputation Mechanic**: After each of 3 rounds, rotate pairs. Publicly tally broken promises on the scoreboard.  

  **Why it Works**:  
  - Breaking promises visibly reduces *group* payoffs (free-riding).  
  - Public shaming/reputation disincentivizes breaking.  
  - Reinforces **Hume/Rawls**: Promises bind because they sustain a beneficial practice.  

  ---

  #### **Phase 2: Isolated Promise Game**  
  *Goal: Test if promises bind without social consequences.*  
  **Materials**:  
  - Anonymous envelopes (one per student).  
  - Decision slips (keep/break).  

  **Rules**:  
  1. **Setup**:  
     - Students anonymously draw new partner numbers (no names).  
     - Each is both Promisor *and* Promisee for different partners (e.g., Student A promises to Student B; Student C promises to Student A).  
  2. **Isolation Mechanics**:  
     - Promises are written privately ("I promise to give you 1 candy").  
     - No group pot, no reputation tracking, no discussion.  
     - Decisions (keep/break) are sealed in envelopes.  
  3. **Payoff**:  
     - If Promisor keeps: Lose 1 candy, Promisee gains 1.  
     - If Promisor breaks: Keep your candy, Promisee gets nothing.  
     - *No one knows who their partner was or what they chose.*  

  **Why it Works**:  
  - Total anonymity eliminates social practice benefits.  
  - Tests **Scanlon** (harm to individual) vs. **voluntarist** views (inherent obligation).  

  ---

  #### **Timeline (80 Minutes)**  
  1. **Intro (5 min)**: Explain rules and stakes. Emphasize Phase 1 is "public," Phase 2 is "secret."  
  2. **Phase 1 (30 min)**:  
     - Round 1 (8 min): Play, then discuss impacts on group pot.  
     - Round 2 (8 min): Play, highlight reputation on scoreboard.  
     - Round 3 (8 min): Play, note rising cooperation.  
     - Transition (6 min): Reset candies, stress Phase 2 is "totally isolated."  
  3. **Phase 2 (20 min)**:  
     - Setup (5 min): Distribute envelopes/decision slips.  
     - Play (10 min): Write promises/decisions privately.  
     - Collect envelopes (5 min): Redistribute candies per decisions.  
  4. **Debrief (25 min)**: Use script below.  

  ---

  #### **Debrief Script**  
  **Step 1: Map Experiences to Theories**  
  - *Phase 1*:  
    - "In Round 2, when Alex broke their promise, how did it affect the group pot?" → Link to **Hume/Rawls**: Broken promises erode trust in the *practice*, harming everyone.  
    - "Did public shaming influence your choices?" → Rawls: Rules of a practice define obligation.  

  - *Phase 2*:  
    - "Raise hands if you kept your promise anonymously. Why?"  
      - If harm-focused: "I didn’t want to disappoint my partner" → **Scanlon**: Wrongfulness lies in betrayal/created expectations.  
      - If obligation-focused: "A promise just *should* be kept" → **Voluntarist view** (e.g., Owens): Promises transfer authority; breaking violates autonomy.  

  **Step 2: Highlight the Tension**  
  - "In Phase 1, the practice view explained everything. But in Phase 2, with no social consequences, why did some still keep promises? Scanlon’s harm account doesn’t quite fit either—your partner never *relied* on you (they couldn’t adjust behavior). This suggests something deeper: **normative power**. When you promise, you give the promisee authority over your action. Breaking it violates their right to decide."  

  **Step 3: Bridge to Readings**  
  - "Hume and Rawls collapse when we remove the practice—but our intuition persists. Scanlon captures the interpersonal harm but struggles with non-reliance cases. This gap is where **voluntarists** (e.g., Shiffrin) argue: Promising is a moral act of transferring control, not just social coordination."  

  ---

  #### **Predictable Problems & Mitigation**  
  1. **Phase 1 Norms Spilling into Phase 2**:  
     - *Risk*: Students treat Phase 2 like Phase 1, keeping promises out of habit.  
     - *Mitigation*: Stress anonymity *repeatedly*. Use physical barriers (e.g., dividers) and sealed envelopes. Begin Phase 2 with: "Forget the last game; this is a blank slate."  

  2. **Low Stakes Undermining Engagement**:  
     - *Risk*: Students break promises casually if candy feels trivial.  
     - *Mitigation*: Use extra-credit points (e.g., 0.1% per candy). Frame candy as "symbolic" of real-world stakes.  

  3. **Debrief Stalling on Abstract Theory**:  
     - *Risk*: Students default to "it’s both" without probing tension.  
     - *Mitigation*: Force a choice: "If you *had* to pick one account for Phase 2, which fails?" Use polls ("Stand on this side for Hume/Rawls, that side for Scanlon").  

  ---

  #### **Follow-Up Question & Reading**  
  - **Discussion Question**:  
    > "In Phase 2, if breaking a promise *benefited* your partner (e.g., they hate candy), would it still be wrong? Why?"  
    *Purpose*: Tests if obligation stems from promisee autonomy (voluntarism) vs. consequences.  

  - **Short Reading**:  
    - Assign **T.M. Scanlon**, *What We Owe to Each Other* (Ch. 7, pp. 295-302) + **Sebastian Rodl**, *Normative Power* (2021), pp. 10-15.  
    *Why*: Scanlon’s reliance account contrasts with Rodl’s voluntarist claim that promises create "bonds of freedom." Students re-engage texts with lived experience.  

  This activity forces a clash between theory and intuition. Phase 1 makes Hume/Rawls visceral; Phase 2 exposes their limits, opening the door to voluntarism. The candy stakes ensure investment, while anonymity in Phase 2 isolates the "pure" promise intuition.
