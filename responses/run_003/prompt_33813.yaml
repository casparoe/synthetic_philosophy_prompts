  **Honest Metaphor Break:** The core break is that Descartes' framework *cannot account for replicant subjectivity* as depicted. The film *uses* the Cartesian automaton concept as a societal premise, but its narrative force comes from *undermining* that premise by showing replicants possess precisely the kind of rich inner life Descartes reserved for humans. The film is ultimately anti-Cartesian in its affirmation of replicant consciousness, using the Cartesian lens to expose its flaws and dangers, not to endorse it. The VK test is less a descendant and more a *critique* of the insufficiency of the language test in a technologically advanced age.
