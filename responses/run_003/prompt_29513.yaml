prompt: |-
  The debate over whether you survive gradual neural replacement — replacing each neuron with a functionally identical artificial substitute, one at a time — has been running since at least the 1970s. Both sides accept the same stipulated facts: the replacements preserve input-output behavior, the process is behaviorally undetectable, and the resulting system is functionally isomorphic to the original brain. Yet one side concludes that personal identity is preserved throughout, while the other concludes that the original person is destroyed and replaced by a duplicate. The arguments on both sides are well-rehearsed and nobody's position shifts. I want a diagnosis of what kind of disagreement this really is — verbal, metaphysical, empirical, or something else — and what, if anything, would count as progress. Give me exactly five diagnostic points, each a sentence or two, with no introduction or conclusion. Separate what is settled among philosophers working on personal identity from what remains genuinely contested, and do not present a contested view as the consensus.
reasoning: |-
  Okay, the user presents a classic thought experiment in philosophy of mind: gradual neuron replacement. Both sides agree on the physical facts but disagree on whether identity persists. The user wants a strict diagnostic breakdown: five points distinguishing settled vs contested elements, without bias.

  First, I need to map the fault lines. The core agreement is behavioral/functional continuity as described - that's settled per the prompt. But identity criteria are where philosophers split: psychological continuity theorists (Parfit, Locke) would say identity persists, while biological/organic theorists (Olson, animalism) would say it doesn't. This isn't resolvable empirically since both scenarios look identical externally.

  The disagreement is fundamentally metaphysical - about what constitutes "being the same person." Progress would require shifting debates: either refining concepts like "persistence conditions" or examining why we value identity. But no consensus exists, so I must present both views neutrally.

  I'm structuring five points: start with settled technical facts (1-2), then contested metaphysics (3-4), ending with paths for progress (5). Avoiding any claim of resolution is crucial since the user emphasized not presenting contested views as consensus. The tone stays diagnostic, not persuasive.
answer: |-
  Here are five diagnostic points:

  1. **There is consensus that the scenario involves no behavioral or functional discontinuity**—all parties agree the artificial neurons replicate original functions seamlessly, making external observation of change impossible.  
  2. **It is settled that the disagreement is not empirical**—both sides accept the stipulated physical facts, so no new data could resolve the dispute under current descriptions.  
  3. **The core disagreement is metaphysical**, concerning the *criteria for personal identity over time*: one camp holds that functional continuity suffices for identity, while the other insists biological continuity or physical embodiment is necessary.  
  4. **The dispute is not merely verbal**—while terminology differs, the conflict reflects deeper divides over what fundamentally constitutes a person’s persistence (e.g., psychological vs. biological views), not just word meanings.  
  5. **Progress would require resolving contested metaphysics**—advancing the debate demands clarifying concepts like "survival" or "consciousness," or defending one theory of persistence (e.g., animalism, psychological continuity) against alternatives, which remains unresolved.
