  Okay, the user is teaching an upper-level philosophy seminar called "Philosophical Methods" with 18 students. They're focusing on intuition pumps, specifically how framing affects thought experiments. The user wants an activity where students experience framing shifts firsthand without knowing the purpose in advance. 

  Hmm, the key challenge here is designing a thought experiment where subtle framing differences reliably produce divergent intuitions, while keeping the logical core identical. The trolley problem comes to mind immediately - it's well-known, has clear intuition splits, and allows for framing variations that don't alter the ethical structure. 

  Let me think about the framing levers... Order of information matters - whether you present the harm prevention first or the harm causation. Emotional labeling is powerful too - "shove" vs "redirect" for the same action. And metaphor choice... ah, medical metaphors ("symptom" vs "cause") could work well here. 

  For Version A, I'll frame it as preventing greater harm through necessary action, using passive voice for the intervention. Version B should emphasize direct causation of harm, with active verbs and loaded terms. The key is making both versions feel natural while embedding the persuasive elements. 

  The procedure needs careful handling... Must avoid students feeling tricked. I'll suggest having them write individual judgments first before group discussion - that captures initial framing effects. Then when groups compare, the reveal should feel like a discovery, not a gotcha moment. 

  Debrief is crucial... Should explicitly connect their emotional responses to textual features (that "shove" word!), then pivot to Dennett's critique of thought experiments. Need to acknowledge that framing isn't necessarily bad - it's about being aware of the mechanics. 

  Predictable issues... Some students will suspect it's the same scenario. Best to acknowledge that as good philosophical skepticism! And the loudest voices might dominate discussion, so structured turn-taking will help. 

  The emotional valence point is interesting... I wonder if the user has considered how moral disgust factors into framing effects. That might be worth surfacing in debrief if it comes up organically. 

  This feels doable in 75 minutes... Individual writing (10min), small groups (15min), whole class (20min), debrief (25min) with buffer. The handout annotations will show exactly where the framing nudges live. 

  Most importantly - the activity must make them feel the framing effect, not just understand it intellectually. That visceral "aha" when they realize their intuition was manipulated is the pedagogical gold here.
answer: |-
  Here’s a complete, classroom-ready activity designed to make students viscerally experience framing effects in thought experiments, tailored to your constraints:

  ---

  ### **1. The Thought Experiment**  
  **The "Rescue Trolley" Variation**  
  *(Core structure: Standard trolley problem but modified to maximize framing levers)*  

  **Logical Core**:  
  > *A runaway trolley will kill 5 workers unless diverted onto a side track where it will kill 1 worker. You can divert it by pressing a button. Is it morally permissible to press the button?*  

  **Why this works**:  
  - Familiar enough to grasp quickly  
  - Framing variations (agency, emotion, metaphor) robustly shift intuitions  
  - Neutral core avoids partisan biases  

  ---

  ### **2. The Two Versions**  
  **Handout A: "The Preventable Disaster"** (Promotes "PERMISSIBLE" intuition)  
  > *Imagine you’re observing a safety monitor screen. Five repair workers are trapped on the main rail line, directly in the path of a runaway maintenance trolley that has lost braking power. Their deaths are imminent.  
  >   
  > However, you notice a safety feature: a secondary rail line branches off just ahead. One worker is conducting a solo inspection on this line. By pressing the emergency rerouting button on your console, you can divert the trolley onto this secondary line.  
  >   
  > If you act, the trolley will be harmlessly redirected away from the five, but the single worker will unavoidably die. If you do nothing, the trolley will continue its lethal course toward the group.  
  >   
  > **Question: Is it morally acceptable to press the button to save five lives?**  
  > □ Yes, it is acceptable  
  > □ No, it is not acceptable*  

  **Framing Annotations (For Instructor Only)**:  
  - **Title**: "Preventable Disaster" evokes preventable harm.  
  - **Opening**: Passive voice ("are trapped," "has lost braking power") reduces perceived agency.  
  - **Details**: "Safety monitor screen," "safety feature," "emergency rerouting button" technologizes the decision.  
  - **Metaphor**: "Harmlessly redirected" (vs. "killing") minimizes action’s moral weight.  
  - **Question Phrasing**: "Save five lives" foregrounds gain; "accept" is weaker than "permissible."  
  - **Order**: Workers’ plight first → empathy trigger before the action.  

  **Handout B: "The Fatal Switch"** (Promotes "NOT PERMISSIBLE" intuition)  
  > *You’re standing at a rail control panel. Ahead on the main track, a trolley is approaching five workers who are repairing the line. Due to a mechanical failure, the trolley cannot stop.  
  >   
  > You observe that a switch lever beside you can divert the trolley onto an alternate track. One worker is alone on that track performing critical maintenance. Pulling this lever will send the trolley crashing into the single worker, killing him instantly.  
  >   
  > If you pull the lever, the trolley will be deliberately redirected away from the five, causing the lone worker’s death. If you leave the lever untouched, the trolley will continue toward the group.  
  >   
  > **Question: Is it morally permissible to pull the lever to cause one death?**  
  > □ Yes, it is permissible  
  > □ No, it is not permissible*  

  **Framing Annotations (For Instructor Only)**:  
  - **Title**: "Fatal Switch" implies direct responsibility.  
  - **Opening**: Active voice ("you’re standing," "divert," "pulling") heightens agency.  
  - **Details**: "Crashing into," "killing him instantly" intensifies visceral imagery.  
  - **Metaphor**: "Deliberately redirected" frames intent; "cause death" (vs. "save lives") foregrounds harm.  
  - **Question Phrasing**: "Cause one death" centers the loss; "permissible" is stronger than "acceptable."  
  - **Order**: Action mechanics described before consequences → primes scrutiny of means.  

  ---

  ### **3. Procedure** (75 Minutes Total)  
  **Goal**: Conceal identical core until group comparison.  

  | **Time** | **Step**                                                                 |
  |----------|--------------------------------------------------------------------------|
  | 0-5 min  | **Intro**: "Today we’re testing how philosophers analyze scenarios. You’ll read a case, judge it individually, then discuss in groups." *Do NOT mention framing or Dennett*. |
  | 5-15 min | **Individual Work**: Randomly distribute Handout A (9 students) and Handout B (9). Students read and tick their answer *anonymously* on half-sheet slips. Collect slips (don’t reveal tallies). |
  | 15-30 min| **Small Groups**: Split into two groups (all A’s together, all B’s together). Discuss: *What was your intuitive judgment? What details in the text influenced you?* Each group summarizes key reasons on board/flip chart. |
  | 30-50 min| **Whole-Class Share**: Group A presents their scenario + conclusions. Group B does same. *Let confusion arise organically when they notice similarities.* Then reveal: "These are two framings of the *identical* dilemma." Project core structure. |
  | 50-75 min| **Debrief** (See Section 4 below).                                      |

  **Key Tactics**:  
  - Anonymity prevents social pressure in initial judgments.  
  - Let groups feel ownership of "their" scenario before revealing equivalence.  
  - When revealing sameness: "This isn’t a trick—it shows how philosophers *use* narrative tools."  

  ---

  ### **4. Debrief Plan** (25 Minutes)  
  **Link Observations to Theory**:  

  | **Student Experience**          | **Philosophical Connection**                                                                 | **Dennett Engagement**                                  |
  |---------------------------------|----------------------------------------------------------------------------------------------|---------------------------------------------------------|
  | Shock at divergent intuitions   | Thought experiments aren’t logic proofs; they’re *persuasive artifacts* shaped by narration  | "Intuition pumps are tools, not proofs" (Dennett’s core) |
  | Citing emotional phrases (e.g., "crashing into") | Vividness overrides structural similarity ("salience pumping")                              | Dennett underplays emotion’s role—needs supplementation |
  | Noticing question phrasing      | Framing defines what "counts" as the dilemma (e.g., saving vs. killing)                      | Connects to Dennett’s "making the conclusion seem inevitable" |
  | Agency/Passivity descriptions   | Rhetoric masks equivalences (e.g., "redirect" vs. "cause death")                             | "Framing differences are the pump’s lubricant"          |
  | Why identical logic felt different | Reveals intuition’s *context-dependence*—challenges reliance on raw intuitions             | Qualifies Dennett: Pumps aren’t neutral; they *engineer* intuitions |

  **Wrap-up Questions**:  
  - *If the logic is identical, why did 80% of Group A say "yes" while 80% of Group B said "no"?*  
  - *Which framing features were most persuasive? Why?*  
  - *Does this mean thought experiments are flawed—or just that we must reverse-engineer their pumps?*  
  - *How might philosophers mitigate framing effects without losing explanatory power?*  

  ---

  ### **5. Troubleshooting**  
  **Predictable Issues**:  
  - **"I’ve heard this before!"**: Likely, but framing variations are less familiar. *Response*: "Great—does knowing the classic version change how this framing affects you?"  
  - **Suspicion of Setup**: Some may guess the twist. *Response*: "If you suspected, analyze *how* the text tried to steer you."  
  - **Group Imbalance**: If one group is louder, use timed turns. If judgments don’t split (rare), emphasize outliers: "Who disagreed with their group? Why?"  
  - **Overgeneralizing**: "All intuitions are unreliable!" *Response*: "Dennett wants us to *refine* pumps, not discard them. What might a better pump look like?"  
  - **Time Crunch**: Skip individual slips if needed, but keep small-group discussions.  

  **Critical Tip**: In debrief, validate all intuitions—e.g., "Your reaction wasn’t wrong; it reveals how philosophical persuasion works." Avoid "gotcha" tone.  

  ---

  **Why This Works**:  
  - The trolley variant maximizes framing levers while requiring zero empirical expertise.  
  - Handouts are self-contained, parallel, and highlight differences *students will notice* (e.g., "redirect" vs. "crash").  
  - The reveal feels like a collaborative discovery, not deception.  
  - Debrief ties lived experience directly to Dennett’s critique and its limits.  

  Adapt phrasing as needed, but keep the framing contrasts sharp. Let me know if you’d like a slide deck template or reflection worksheet to accompany this!
