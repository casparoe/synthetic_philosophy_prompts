  - The blue memory cards represent the demon's memory, which becomes correlated with the state of the gas.
  - Sorting the gas reduces its entropy.
  - Erasing the memory (resetting it) dissipates energy as heat (represented by the tally task), increasing the entropy of the environment.
  - The overall process increases the total entropy, satisfying the second law.

