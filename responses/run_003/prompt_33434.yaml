  2. **Entropy Reduction:** Sorted chambers represented decreased gas entropy.  
  3. **Landauer Bound:** Erasure cost (time delays) symbolized minimum energy dissipation to reset memory.  
  4. **Second Law:** Total entropy increased because erasure cost > sorting gain.  
