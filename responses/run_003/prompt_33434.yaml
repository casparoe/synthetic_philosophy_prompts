  Activity: The Cost of Forgetting

  Goal: Experience the thermodynamic cost of information erasure in Maxwell's demon scenario.

  Setup:
  1. Prepare 20 white index cards: write the numbers 1 to 10 twice (so two cards for each number). Shuffle these and lay them out face down in a 4x5 grid on the table.
