  ### Maxwell's Demon Sorting Activity: "The Cost of Forgetting"

  #### **Activity Goal**  
  Participants experience the apparent violation of the second law by sorting "molecules" (cards) using information, then discover that erasing memory to reset the system imposes an unavoidable thermodynamic cost, mirroring Landauer’s principle.

  ---

  #### **Rules and Setup**  
  **Materials List (Prepare in Advance):**  
  - 20 white index cards (labeled "gas molecules"): Write numbers 1–10 twice each (two 1s, two 2s, etc.).  
  - 3 blue index cards (labeled "memory registers").  
  - Dry-erase markers and erasers (or paper towels).  
  - A whiteboard with two sections: "Hot Chamber" (left) and "Cold Chamber" (right).  
  - Timer.  

  **Preparation:**  
  1. Shuffle the white cards and place them face down in a central pile (the "mixed gas").  
  2. Place the blue cards and markers nearby (the demon’s "memory").  
  3. Draw a vertical line on the whiteboard dividing "Hot" and "Cold" chambers.  

  **Roles:**  
  - All participants act as the **collective demon**. They must collaborate to sort molecules.  
  - **Facilitator (you):** Observe, enforce rules, and time phases. Do not intervene unless rules are broken.  

  **Core Mechanic:**  
  *To sort a molecule, the demon must measure its state (number), record it in limited memory, and move it to the correct chamber. Memory must be erased to reuse it, which requires a time-costly physical action.*  

  **Rules:**  
  1. **Measurement:** Turn over a white card to see its number (1–10).  
  2. **Recording:** Write the number on a *blank* blue card (using dry-erase marker). Place the blue card next to the white card.  
  3. **Sorting:** Move the white card to the whiteboard’s "Hot" (≥6) or "Cold" (≤5) chamber.  
  4. **Erasure:** Before reusing a blue card, **fully erase its number** at a designated "erasure station" (a corner of the room). The eraser must be used, and the participant must shout "ERASED!" (cost: 10 seconds per erasure).  
  5. **Memory Limit:** Only 3 blue cards exist. No new measurements can occur if all are in use.  
  6. **Goal:** Sort all 20 molecules as quickly as possible.  

  ---

  #### **Timeline (40 Minutes Total)**  
  1. **Introduction (5 min):**  
     - Explain the demon’s goal: "Use perfect molecular knowledge to sort fast (hot) and slow (cold) molecules, seemingly creating energy from nothing."  
     - Briefly outline rules. Emphasize: *"No time limits per step—but erasure has a fixed cost."*  
     - Start the timer.  

  2. **Sorting Phase (25 min):**  
     - Participants work together: measure, record, sort, and erase.  
     - **First 15 min:** Let them experience "free" measurement and initial sorting success.  
     - **Final 10 min:** Watch as memory limits force erasure delays, slowing progress.  

  3. **Transition to Debrief (10 min):**  
     - Stop at 30 min, even if incomplete. Ask:  
       - *"What slowed you down? Was measurement or erasure the bottleneck?"*  
       - *"Did you feel like you ‘paid a price’ to reset the system?"*  
     - Transition to formal debrief linking the activity to Landauer’s principle.  

  ---

  #### **Predictable Failures and Remedies**  
  1. **Failure:** Participants ignore memory limits (e.g., skip recording numbers on blue cards).  
     - **Remedy:** Gently enforce: "A demon’s memory is physical—you *must* write numbers on blue cards to ‘know’ the molecule."  

  2. **Failure:** Erasure is rushed (e.g., half-erased marks, no shout).  
     - **Remedy:** Strictly require full erasure and the shout. Say: "In thermodynamics, erasure isn’t optional—it *must* dissipate energy."  

  3. **Failure:** Group assigns roles inefficiently (e.g., one person handles all erasure).  
     - **Remedy:** Let frustration build. In debrief, note: "Inefficiency mirrors real entropy costs—erasure *must* happen, and it disrupts workflow."  

  ---

  #### **What the Activity Cannot Show**  
  *The activity cannot reproduce the **quantitative equivalence** between the work extractable from the sorted gas and the Landauer bound (kT ln 2 per bit erased).*  
  - **Why:** The activity uses time delays to symbolize energy costs, but real thermodynamics requires precise energy dissipation during erasure. In the debrief, explicitly state: "Landauer’s principle quantifies erasure cost—your 10-second penalty represents kT ln 2 in joules."  

  ---

  #### **Behavioral Success Indicator**  
  Watch for: **Participants spontaneously complaining about erasure or strategizing to minimize it** (e.g., "If we erase less, we’d sort faster!" or "Erasure is wasting all our gains!"). This indicates they intuitively link erasure to the "catch" preserving the second law.  

