prompt: |-
  I have a set of gut reactions about when two people may rationally disagree, and I'd like to know what principle, if any, they add up to.

  Two physicians start from the same diagnostic model but see different test results for the same patient and announce different probabilities that the patient has the disease. Verdict: unproblematic; their disagreement just reflects different information, and if they pooled everything I'd expect their numbers to converge.

  Two macroeconomists are handed the same data and the same forecasting model, yet one ends up at 70 percent that inflation will exceed 4 percent next year and the other at 30 percent, because they entered with different priors over the model's parameters. Verdict: I want to say they can't both be fully rational; at least one is making an error.

  Two people with very different upbringings and exposure to very different institutions disagree about the probability that a social program will work. They sit down and exchange every argument and piece of evidence each can articulate, and they still disagree. Verdict: this feels legitimate in a way the economists' case does not; their histories feel like a real source of evidence, not just noise.

  Two jurors hear exactly the same trial evidence, share all their reasoning in the jury room, and end up with different probabilities of guilt, each aware of the other's view. Verdict: something has gone wrong; I can't accept that both are reasoning correctly.

  Two partisans read the same mixed study about a policy and both become more confident in their opposite prior positions. Verdict: clearly irrational, whatever the principle is.

  Is there one principle — something like the common prior assumption, or a weaker or stronger variant of it — that captures all of these, or close? If not, which verdict should I give up? And what does the principle you settle on say about the case I keep going back and forth on: two rational agents who share all their evidence, know each other's priors and posteriors, and still agree to disagree about a factual question?
reasoning: |-
  Okay, the user is presenting several scenarios where two people rationally disagree and wants to find an underlying principle. Let me start by breaking down each case.

  First, the physicians. They have the same model but different test results. That makes sense; different information leads to different conclusions. If they shared all data, they'd agree. So the principle here is differing private information.

  Next, the macroeconomists with the same data and model but different priors on parameters. The user feels this isn't fully rational. Why? Because priors should converge with shared evidence if they're well-calibrated. If they can't agree after seeing the same data, one prior might be misspecified. So the issue is prior misspecification or lack of common prior.

  Then, the people with different upbringings. They exchange all arguments but still disagree. The user thinks this is legitimate. Here, their life experiences act as private evidence that's hard to articulate fully. Maybe their priors are based on unshared evidence, making disagreement rational even after discussion.

  Jurors hearing the same trial and still disagreeing. Something's wrong here. Both have identical information and shared reasoning. They should converge if rational. So this points to a violation of common knowledge or Bayesian updating.

  Partisans interpreting the same study oppositely. That's irrational due to motivated reasoning. They're not updating properly, ignoring evidence against their beliefs.

  The user also mentions agreeing to disagree with shared evidence and known posteriors. Aumann's theorem says they can't, assuming common priors and common knowledge. So if they still disagree, either no common prior, or not all evidence is common knowledge.

  So the unifying principles might be: common priors (if they share all evidence, should agree), quality of evidence (private vs. shared, articulable vs. inarticulable), and updating biases. For the upbringing case, the differing priors are based on legitimate private evidence, while economists' priors might be arbitrary. Jurors should have common prior but fail to update correctly. Partisans have biased updating.

  The user's hesitation about the upbringing case versus economists might stem from whether priors are justified. Upbringings provide real but unshareable evidence, while economists' priors could be subjective. So the key is whether differing priors are based on evidence or not. Also, common knowledge is crucial—if jurors share all info but don't acknowledge it as common knowledge, disagreement persists.

  In conclusion, the principles are Common Prior Assumption (with caveats), Common Knowledge requirement, and the nature of evidence (private, articulate, incorporated). For agreeing to disagree, it's impossible under common prior and common knowledge, so any disagreement implies a breakdown in those assumptions.
answer: |-
  Your intuitions are remarkably consistent and point toward a nuanced principle governing rational disagreement. The key unifying concept isn't a single rigid rule like the Common Prior Assumption (CPA), but **the requirement for shared evidence to be incorporated under common knowledge and the legitimacy of differing priors only when they reflect fundamentally unshareable evidence or experiences.**

  Here's how this principle explains your verdicts:

  1.  **Physicians (Different Test Results):**
      *   **Verdict: Unproblematic.**
      *   **Explanation:** They have genuinely different, specific, private evidence. Pooling evidence resolves the disagreement. This is pure Bayesian updating with different data.

  2.  **Macroeconomists (Same Data/Model, Different Priors):**
      *   **Verdict: At least one is making an error / Irrational.**
      *   **Explanation:** They share *all* the relevant data and the model structure. The parameters are part of the model being estimated. Rational agents with access to the *same* evidence and model specification *should* converge on posteriors as the data dominates arbitrary priors (assuming sufficient data). Persistent disagreement suggests one or both priors were poorly calibrated or misspecified (not reflecting any underlying reality) *or* they haven't fully processed the shared evidence. Their disagreement stems from arbitrary starting points, not legitimate differences in unshareable evidence.

  3.  **People with Different Upbringings (Shared Arguments, Still Disagree):**
      *   **Verdict: Legitimate.**
      *   **Explanation:** This is the critical case. Their vastly different life experiences constitute a massive amount of *unarticulated, unarticulable, private evidence* that shapes their priors. Exchanging "every argument and piece of evidence each can articulate" still leaves out the foundational, experiential data that formed their worldviews. This experiential evidence is real ("a real source of evidence") but fundamentally impossible to fully transfer or incorporate into a common knowledge pool. Their differing priors *are* rational reflections of their unique histories. This is why their disagreement persists even after sharing all articulable information.

  4.  **Jurors (Same Evidence, Shared Reasoning, Aware of Each Other, Still Disagree):**
      *   **Verdict: Something has gone wrong.**
      *   **Explanation:** This violates the core principle of Bayesian rationality under common knowledge. They start with the *same* evidence presented identically (common prior over evidence is justified). They share *all* their reasoning, making their interpretations and logic common knowledge. They are aware of each other's differing conclusions. In this scenario, **Aumann's Agreement Theorem** applies directly: rational agents with a common prior (over the state of the world, including the meaning of the evidence) *cannot agree to disagree* if their posteriors are common knowledge. Persistent disagreement implies either:
          *   They didn't actually have a common prior to begin with (but in a well-conducted trial with shared instructions, they arguably should).
          *   Their posteriors aren't truly common knowledge (e.g., they doubt the other's rationality, honesty, or ability).
          *   At least one agent is failing to update rationally (e.g., motivated reasoning, cognitive bias).
      Your verdict captures the expectation that in this controlled, shared-evidence, common-knowledge setting, convergence *should* occur.

  5.  **Partisans (Same Study, Polarize):**
      *   **Verdict: Clearly Irrational.**
      *   **Explanation:** This is a classic case of **biased assimilation** or **motivated reasoning**. Rational updating requires adjusting beliefs based on evidence, even if it's mixed. Both becoming *more* confident in opposite directions after seeing the *same* evidence demonstrates a failure to update objectively. They are likely discounting evidence contradicting their prior belief and overweighting evidence supporting it. This violates the core logic of Bayesian updating.

  **The Unifying Principle: Rational Disagreement Requires Asymmetric Information or Fundamentally Unshareable Evidence**

  *   **Rational disagreement is possible and expected when agents have access to different, specific pieces of evidence (like the physicians) or possess fundamentally different experiential priors built on unarticulable life histories (like the upbringing case).**
  *   **Rational disagreement is *not* possible (or indicates error) when:**
      *   Agents share *all* relevant evidence and its interpretation (common knowledge of the evidence/likelihoods).
      *   They have a *common prior* over the state of the world (or the reasons for differing priors are themselves based only on shareable evidence that *has* been shared).
      *   They incorporate this shared evidence and each other's beliefs (common knowledge of posteriors) rationally via Bayesian updating.
      *   **Aumann's Theorem:** Under these conditions (common prior, common knowledge of posteriors, rational updating), agreement is *required*.

  **Applying the Principle to the Economists vs. Upbringing Cases:**

  *   **Economists:** The parameter priors *should* be based on shareable evidence (past data, economic theory). If they've seen *all* the same data and models, persistent disagreement suggests their priors weren't formed rationally from shareable information or they aren't updating correctly. The differing priors feel "arbitrary" or "noise."
  *   **Upbringing:** The differing priors *are* rationally formed from massive amounts of *unshareable* experiential evidence. The disagreement persists *because* that foundational evidence cannot be fully transferred, even through extensive discussion. The differing priors feel "legitimate" because they reflect real, albeit private, data.

  **Resolving Your Final Case: Agreeing to Disagree**

  *   **Principle's Verdict:** Under the strict conditions of **common prior** and **common knowledge of posteriors and rationality**, two rational agents **cannot rationally agree to disagree** on a factual question after sharing all evidence. Aumann's Theorem proves this.
  *   **Why Disagreement Persists:** If rational agents *do* persistently disagree under these conditions, it implies one or more assumptions are violated:
      1.  **No True Common Prior:** Their fundamental understanding of the world or the meaning of evidence differs in ways not resolved by sharing the specific evidence in question (like the upbringing case, but now applied to the interpretation of the *shared* evidence itself).
      2.  **Lack of Common Knowledge:** They don't fully believe the other is rational, or they doubt the other has truly incorporated all evidence or their own viewpoint.
      3.  **Irrationality:** At least one agent is not updating correctly (e.g., bias, computational error).
      4.  **Evidence Isn't Fully Shared:** There remains relevant private information or differences in how evidence is interpreted (likelihoods) that haven't been made common knowledge.
  *   **Conclusion:** True "agreeing to disagree" among rational agents with common priors and full common knowledge is impossible. Persistent disagreement signals a breakdown in one of these foundational requirements for the theorem to hold. Your upbringing case is the paradigm example of why a true common prior might not exist for complex real-world questions – agents have fundamentally different unshareable evidence shaping their core beliefs.

  **Which Verdict Might Need Refining?**

  Your verdicts are very consistent. The only potential friction point is between the **Jurors** and the **Upbringing** case. The principle clarifies the distinction:

  *   **Jurors:** *Should* have a common prior based on the trial's shared foundation and instructions. *All* evidence and reasoning is shared explicitly. Disagreement indicates error.
  *   **Upbringing:** *Cannot* have a common prior because their core priors are built on unshareable experiential evidence. Sharing arguments doesn't create common knowledge of the *foundational* evidence. Disagreement is rational.

  Your intuition correctly identifies the jurors' shared context as *imposing* an expectation of a common prior, while the upbringing case highlights how such a prior is often impossible to establish for deeply experiential beliefs. The principle holds.
