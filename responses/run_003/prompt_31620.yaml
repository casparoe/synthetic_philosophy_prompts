prompt: |-
  I am a novelist, and I am working on a book whose protagonist hosts a small but serious podcast on democratic theory. In one of the central scenes, she interviews a political theorist known for defending the all-affected-interests principle: the view that everyone whose interests are affected by a collective decision ought to have some say in making it, and that this principle offers the right answer to the boundary problem, the question of who should make up the demos in a democracy. I want this scene to feel like a real exchange between two people who know the terrain, not a soft introduction for a lay audience, so the host should be able to press the position where it is genuinely strained.

  Please draft eight to ten interview questions for the scene. The questions should go well beyond asking the guest to restate his view. At least one should press the circularity worry: that identifying who is affected seems to require a prior decision about which decisions count and who gets to judge that, which is precisely the question the principle is meant to answer. At least one should press the difference between being affected by a decision and being subject to a polity's laws, since many people may be affected by, say, a state's environmental policy without being governed by it. At least one should press the over-inclusiveness worry: once causal chains are traced far enough, nearly everyone is affected by nearly everything, so the principle may generate a demos with no workable boundaries. At least one should press the instability of the demos across levels and framings of a decision, since a city ordinance, a national statute, and a treaty each seem to summon a different demos. And at least one should ask whether the boundary problem admits of a democratic solution at all, or whether the act of constituting the demos must ultimately rest on something other than democratic principle. For each question, include a follow-up keyed to the reply the guest is most likely to give, so the host can keep the pressure on rather than allowing him to deflect.
reasoning: |-
  Okay, the user is a novelist crafting a scene where a podcast host interviews a political theorist about the all-affected-interests principle. They need authentic, challenging questions that push the theorist's ideas to their limits. 

  First, I need to unpack the core tensions they highlighted: circularity (defining "affected" requires prior decisions), scope mismatch (affected ≠ governed), over-inclusiveness (infinite causal chains), instability (shifting demos per decision level), and the meta-problem of whether democracy can bootstrap itself. These are serious philosophical pressure points.

  The novelist wants this to feel like two experts sparring, not an explainer. So questions must avoid softball openings and instead target conceptual fault lines immediately. The follow-ups are crucial—they’re where the host would actually challenge dodges or stock answers. 

  For circularity, I’ll open with the "who decides what counts?" trap. The theorist will likely retreat to proceduralism ("we democratize the meta-decision!"), so the follow-up must corner him on infinite regress: "But how do we constitute *that* demos without prior boundaries?"

  On scope mismatch, the example of environmental policy affecting foreigners is perfect. When he inevitably distinguishes "governed" from "affected," the host should force him to confront the principle’s own logic: "If affectedness grants voice, why exclude the Bolivian farmer?"

  Over-inclusiveness needs a concrete absurdity—maybe pandemic policy causing global economic ripples. His "salience threshold" reply will sound arbitrary, so the follow-up attacks that arbitrariness: "Who sets the threshold? Isn’t that just recreating the boundary problem?"

  Instability requires stacking decisions: city zoning vs. national policy vs. climate treaties. He’ll propose nested demoi, but the host must press the friction: "What if Vancouver’s port expansion requires a demos spanning Canada, the US, and indigenous nations? How is that ‘nested’?"

  Finally, the democratic bootstrapping question is the kill shot. If he claims "the principle itself justifies the initial demos," the host should invoke real-world constitution-making: "But didn’t the Founders exclude slaves and women? Doesn’t that prove the demos is always constituted by force first?"

  ...I’m drafting questions that embody these traps. The tone stays rigorous but not academic—podcast-ready tension. Each follow-up is a scalpel targeting the weakest limb of his reply.
answer: |-
  Here are eight interview questions with follow-ups designed to probe the all-affected-interests principle rigorously, reflecting a deep understanding of the theoretical landscape and pressing its genuine strains:

  1.  **Core Challenge - Circularity & Epistemic Priority:**  
      **Host:** "Professor, you argue that the demos should include all whose interests are *significantly affected* by a decision. But identifying 'significant affect' seems to require prior judgments: judgments about *which* interests matter, *how* we measure 'significance,' and crucially, *who gets to make those judgments*. Doesn't this mean the principle presupposes the very political community – or at least, the authority to define 'affectedness' – that it's supposed to help constitute? Isn't this circular?"  
      *Likely Reply Focus:* Appeal to procedural fairness or iterative processes for defining "affectedness."  
      **Follow-Up:** "But if the procedure to define 'affectedness' itself requires a prior demos to establish its legitimacy and boundaries – say, to decide whose voice counts in *that* procedural deliberation – haven't we simply kicked the can down the road into an infinite regress? Where does the *first* legitimate authority to define 'affectedness' come from?"

  2.  **Scope Challenge - Affected vs. Subject:**  
      **Host:** "Let's take a concrete case: Oregon's forest management policy. It significantly affects the livelihood of a logger in British Columbia through cross-border market effects and ecological impacts. By your principle, should that Canadian logger have a formal say in Oregon's policy? If not, how do you reconcile this with the principle, given his interests are demonstrably affected?"  
      *Likely Reply Focus:* Distinction between being *affected* and being *subject to the coercive authority* of the polity/membership; practical feasibility.  
      **Follow-Up:** "But doesn't that distinction effectively reintroduce a *territorial* or *membership-based* boundary *before* applying the affectedness principle? If the principle yields to territorial sovereignty or practical constraints when interests are genuinely affected across borders, doesn't it fail to solve the boundary problem it was designed for, especially in an interconnected world?"

  3.  **Scale Challenge - Over-Inclusiveness & Causal Chains:**  
      **Host:** "The over-inclusiveness objection seems potent. A city council rezoning decision might affect local property values, which ripple into regional markets, impacting national investment patterns, potentially affecting global commodity prices. If we trace causal chains far enough, doesn't *everyone* become affected by *nearly everything*, rendering the principle useless for defining a workable demos? Where do we cut the chain?"  
      *Likely Reply Focus:* Introduce thresholds of "directness," "foreseeability," or "intensity" of effects.  
      **Follow-Up:** "Who determines those thresholds – 'directness,' 'foreseeability,' 'intensity' – and by what authority? Isn't setting *that* threshold itself a profoundly consequential political decision that will inevitably affect people? Doesn't applying these filters just mask the same circularity problem we started with, deciding *in advance* whose affectedness 'counts'?"

  4.  **Framing Challenge - Instability Across Levels:**  
      **Host:** "The demos seems incredibly unstable depending on how we frame the decision. Consider regulating a chemical: a city bans it locally (demos = residents?), a nation bans it nationally (demos = citizens?), an international treaty phases it out globally (demos = humanity?). The *same substance* summons three distinct demoi. Doesn't this highlight that the 'decision' itself is an arbitrary framing, and the principle gives no guidance on what constitutes the *relevant* decision unit?"  
      *Likely Reply Focus:* Argue for nested demoi or subsidiarity – decisions made at the lowest feasible level, with higher levels for spillovers.  
      **Follow-Up:** "But the principle of subsidiarity itself requires a prior judgment about what 'feasible' means and where 'spillovers' occur – judgments that themselves affect people. How do we determine the *initial* level or the scope of spillovers democratically without, again, presupposing a demos? Isn't subsidiarity just another layer of boundary-setting prior to applying affectedness?"

  5.  **The Democratic Bootstrapping Problem:**  
      **Host:** "Stepping back, is the boundary problem *itself* amenable to a democratic solution? To democratically decide who constitutes 'the people' seems to require that 'the people' already exist. Doesn't this suggest that the *constitution* of the initial demos – the foundational act – must necessarily rest on something *other* than democratic principle? Force, historical accident, or perhaps a thinner notion of 'all-subjected' to coercion?"  
      *Likely Reply Focus:* Suggest the principle guides *ongoing* democratic expansion/refinement; appeal to deliberation among existing stakeholders.  
      **Follow-Up:** "But doesn't that initial act, based on non-democratic grounds, forever taint the subsequent democratic process? And if 'ongoing expansion' is guided by deliberation among the *currently recognized* demos, aren't they inherently biased against recognizing new claimants whose inclusion might dilute their own power? How does the principle overcome this inherent conservatism of existing political communities?"

  6.  **Power & Asymmetry of Affect:**  
      **Host:** "The principle focuses on *interests affected*, but power dynamics determine *whose* affected interests get recognized and how. A multinational corporation's interests are profoundly affected by environmental regulations, and it has immense resources to make that affect visible and politically salient. A subsistence farmer downstream might be devastated by the same policy, but lack that voice. Doesn't applying the principle in the real world risk simply legitimizing the influence of already-powerful affected actors, rather than empowering the marginalized?"  
      *Likely Reply Focus:* The principle sets an ideal standard; institutional design (e.g., advocacy, courts) can help realize it fairly.  
      **Follow-Up:** "But doesn't designing those institutions again presuppose a demos capable of authorizing them? And if the existing demos and its institutions are already skewed by power imbalances (as they inevitably are), how can they reliably identify and enfranchise the *truly* affected but marginalized? Isn't the principle structurally blind to power?"

  7.  **Conflict with Self-Determination:**  
      **Host:** "Doesn't the all-affected principle potentially undermine collective self-determination? If the demos for every decision is defined solely by affected interests, doesn't it dissolve the idea of a stable political community capable of making constitutive choices about its own identity, priorities, and future? Can a 'demos' that shifts with every policy question even form a collective 'self'?"  
      *Likely Reply Focus:* Balance affectedness with the value of stable associative ties and collective agency; emphasize overlapping communities.  
      **Follow-Up:** "How do we weigh the value of stable self-determination against the demands of affectedness in cases of conflict? Who adjudicates that balance? Isn't prioritizing a stable demos for the sake of self-determination, even when outsiders are affected, effectively admitting that the all-affected principle cannot be the sole or supreme answer to the boundary problem?"

  8.  **The Problem of "Interests":**  
      **Host:** "Finally, let's scrutinize the core term: 'interests.' Are we talking about objective welfare, subjective preferences, or basic rights? If objective welfare, who defines it authoritatively? If preferences, how do we aggregate them meaningfully across vastly different cultures within the potentially boundless demos? Doesn't the ambiguity of 'interests' make the principle indeterminate in practice and vulnerable to manipulation?"  
      *Likely Reply Focus:* Defend a core, perhaps rights-based, conception of fundamental interests; or emphasize democratic deliberation to define interests.  
      **Follow-Up:** "But doesn't defining a 'core' set of interests again require a prior authoritative judgment? And if we rely on deliberation *within* a demos to define interests, how do we avoid the circularity of that demos defining interests in a way that conveniently excludes those it doesn't want to include? Isn't the definition of interests inseparable from the power to define the demos?"

  **Key elements incorporated:**

  *   **Circularity:** Q1 & Follow-Up (Core focus).
  *   **Affected vs. Subject:** Q2 & Follow-Up (Explicit case study).
  *   **Over-Inclusiveness:** Q3 & Follow-Up (Causal chains/thresholds).
  *   **Instability Across Levels/Framings:** Q4 & Follow-Up (Chemical regulation example).
  *   **Democratic Bootstrapping:** Q5 & Follow-Up (Foundational act).
  *   **Power/Asymmetry:** Q6.
  *   **Self-Determination Conflict:** Q7.
  *   **Ambiguity of "Interests":** Q8.

  These questions force the theorist to confront the deepest philosophical and practical tensions within the principle, moving far beyond mere exposition. The follow-ups anticipate common defenses and press the logical and practical consequences, creating the dynamic, challenging exchange you seek for your scene. Good luck with the novel!
