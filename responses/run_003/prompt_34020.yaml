answer: |-
  **Adams' thesis defenders avoid triviality by denying conditionals have truth values, sacrificing a straightforward logic for embedded conditionals, a cost I find preferable to the devastating triviality Lewis's assumptions entail.** Lewis's proof requires treating the indicative conditional (A → C) as a proposition with a truth value governed by standard probability (P) and logic. His core argument runs:

  1.  **Assume Adams' Thesis (AT):** P(A → C) = P(C | A) = P(A ∧ C) / P(A), provided P(A) > 0.
  2.  **Assume Probability of Conditionals (PC):** (A → C) is a random variable/proposition to which standard probability applies.
  3.  **Apply the Law of Total Probability to P(A → C):** For any partition {B, ~B} (or more generally), P(A → C) = P(A → C | B) * P(B) + P(A → C | ~B) * P(~B).
  4.  **Assume Logical Constancy (LC):** The probability of the conditional *given* some fact B is the probability we *would* assign *if* we learned B. Crucially, Lewis assumes that *conditional on B*, the conditional (A → C) retains its AT meaning relative to the new probability measure P(· | B): P(A → C | B) = P(C | A ∧ B). This is the most contentious step.
  5.  **Derive Contradiction/Triviality:** Substituting AT and LC into step 3 yields: P(C | A) = P(C | A ∧ B) * P(B) + P(C | A ∧ ~B) * P(~B). This is simply the Law of Total Probability applied to P(C | A) itself. So P(C | A) = P(C | A). Lewis then considers a specific B *logically independent* of A and C (e.g., B = C itself). Substituting B=C gives: P(C | A) = P(C | A ∧ C) * P(C) + P(C | A ∧ ~C) * P(~C). Simplifying (P(C | A ∧ C) = 1, P(C | A ∧ ~C) = 0) yields: **P(C | A) = P(C)**. This holds for *any* A, C where P(A) > 0, implying *everything* is probabilistically independent, which is triviality.

  **The tension is stark:** AT + PC + LC + Standard Probability → Triviality. Avoiding triviality forces a choice:

  1.  **Adams' Camp (e.g., Adams, Edgington, Bennett): Give up PC (and thus LC).**
      *   **Sacrifice:** Deny indicative conditionals have truth conditions/truth values. They are not propositions; P(A → C) is *defined* as P(C | A), not derived from truth conditions. Standard probability calculus (like the Law of Total Probability in Step 3) doesn't apply to them *as propositions*. LC is meaningless if conditionals aren't propositions.
      *   **Cost:** Explaining embedded conditionals (e.g., negation, disjunction, other conditionals within conditionals) becomes extremely difficult or requires radical departures from classical logic. The logic of conditionals becomes non-truth-functional and highly restricted.
      *   **Gain:** Preserves AT as the core semantic insight about how we *assess* indicative conditionals. Avoids triviality.

  2.  **Lewis's Camp (or proponents of truth-conditional conditionals like Stalnaker, early Jackson): Give up AT (or modify it radically).**
      *   **Sacrifice:** Reject Adams' Thesis as a general account of probability for indicative conditionals. P(A → C) ≠ P(C | A) in general (though it might hold under special conditions like conditional independence).
      *   **Cost:** Must provide an alternative semantics explaining the *undeniable intuitive pull* of AT while avoiding its problems and other paradoxes (like Gibbard's Riverboat). Often leads to complex possible-worlds semantics (Stalnaker) or "nearness" relations, which face significant counterexamples for indicatives.
      *   **Alternative Sacrifice (Less Common):** Give up standard probability calculus (Step 3) or LC (Step 4). Denying LC is complex and lacks strong motivation beyond avoiding the proof. Modifying probability laws (e.g., using Popper functions, relative probability) is mathematically complex and sacrifices intuitive simplicity without guaranteeing full compatibility with AT and embeddings.

  **Once the dust settles, Adams' camp is in better shape.** While the embedding problem is serious, it's a cost paid at the *logical* frontier, where our intuitions are weaker. Lewis's triviality is a catastrophic *probabilistic* collapse directly contradicting our core experience of dependence. Adams' core insight – that we evaluate "If A, then C" by supposing A and judging C under that supposition – powerfully explains the *use* of indicatives in reasoning and communication, aligning perfectly with how conditional probability guides belief update. Sacrificing truth-values, though theoretically awkward, directly blocks Lewis's proof at its foundation (Step 3/PC) and preserves this central explanatory power. Defenders can develop specialized logics for embeddings (e.g., non-probabilistic "acceptable" rules) or argue embeddings are rare/unproblematic in core contexts. Conversely, truth-conditional approaches struggle mightily to capture AT's core intuition without falling prey to triviality or other paradoxes like Gibbard's, making their rejection of AT seem more like an ad-hoc fix than a satisfying explanation. The cost of abandoning the deep connection between indicative conditionals and conditional probability is ultimately higher than the cost of abandoning truth-values for them.
