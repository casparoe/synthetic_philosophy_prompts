  ok so my friend and i have been going back and forth on molyneux's problem for weeks — you know, the one where locke asks whether someone born blind who suddenly gains sight could tell a cube from a sphere just by looking, having only ever touched them before. i've been keeping a running list of her verdicts on a bunch of variant cases, and now i want to try to predict what she'll say about a new one before i ask her.

  here's what she's said so far:

  - the original case (cube vs sphere): no, she would not recognize them by sight
  - telling a triangle from a square by sight after only knowing them by touch: no
  - telling a cat from a dog by sight after touch: no
  - rough sandpaper vs smooth sandpaper by sight: yes, she'd get it right
  - a large ball vs a small ball by sight: yes
  - a smile vs a frown on a face by sight: yes, she'd recognize the expressions
  - a person standing vs a person sitting, by sight: yes
  - a straight line vs a curved line by sight: no
  - a hot cup of coffee vs a cold one just by looking (no steam, no ice): no, she says obviously not
  - a person walking vs a person running, by sight: yes
  - distinguishing a square from a rectangle by sight: no

  the new case is this: suppose the person, while still blind, got really good at recognizing individual people by touching their faces — she can identify her friends, her family, her doctor, all by feel. when she gains sight, could she look at those same faces and say who's who? my friend hasn't given me a verdict on this one yet and i want to see if i can nail it.

  what i'm actually after: (a) what rule or rules is she running — spell out the principle that best fits her verdicts, (b) whether there are other rules that fit her verdicts just as well, and (c) what further case would cleanly separate those competing rules. also, if her most likely rule makes the face-recognition case come out one way but a different rule that also fits her data would make it come out the other way, say which way you'd bet and why. i'm less interested in the yes/no answer than in the structure of the rules she could be implicitly committed to.
