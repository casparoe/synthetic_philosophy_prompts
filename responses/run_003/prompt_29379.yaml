answer: |-
  What you're describing is indeed a fascinating and well-observed phenomenon that cuts to the heart of debates in the philosophy of medicine. While there isn't a single, universally agreed-upon term for this *specific* two-way drift, philosophers have extensively analyzed its components, and it strongly supports a particular view of disease concepts. The closest conceptual frameworks are the **disease dilemma** and the broader debate between **naturalist** versus **normativist** (or **constructivist**) theories of disease.

  Here's how it breaks down:

  1.  **The Core Insight: Values Drive Classification:** Your observation that disease status tracks our *practical stance* – specifically our capacity to intervene (treatability) and the perceived burden/abnormality (prevalence) – highlights that disease classification isn't purely a matter of discovering biological "facts." It inherently involves **value judgments**. Normativists argue that calling something a disease always implies a negative evaluation: it's harmful, undesirable, and something we *should* (if possible) try to prevent or cure. Naturalists argue that disease is a value-free biological dysfunction, identifiable independently of our values or capabilities.

  2.  **Your First Direction: The Normativist Case (Treatability Creates Disease):** This scenario powerfully illustrates the normativist position. A biological state causing suffering only becomes a "disease" *after* we develop an intervention. Why? Because before the intervention, the suffering might be seen as unfortunate but inevitable ("bad luck," "part of life"). The intervention makes it possible to *act* against the suffering, framing it as something *wrong* that *can and should be fixed*. The potential for action triggers the normative judgment ("this shouldn't happen") and justifies the label "disease" (enabling diagnosis codes, insurance coverage, research focus). Examples might include certain forms of infertility, male-pattern baldness (once minoxidil arrived), or even aspects of menopause before HRT became widespread. This *is* related to medicalization, but you're right – medicalization often focuses on the *expansion* of medical categories, while this specific mechanism highlights the *trigger* (treatability) and the underlying value shift.

  3.  **Your Second Direction: Prevalence Undermines "Disease" Status (Challenging Naturalism):** This scenario directly challenges the naturalist view. If disease is purely a biological dysfunction, its prevalence shouldn't change its status. Yet, as you note, conditions common in aging populations (like osteoporosis, mild hypertension, or even presbyopia) often get reframed. Why? Because the normativist element kicks in again. Calling something a "disease" implies it's *abnormal*. If most people over 60 have it, it starts to feel less like an *individual pathology* and more like an *expected state* within that demographic. While the biological processes (bone loss, arterial stiffness, lens hardening) remain dysfunctional in a technical sense, the sheer prevalence weakens the *normative force* of labeling it a "disease" for *everyone* experiencing it. It gets reframed as a "risk factor" (implying prevention is key, not necessarily treating the state itself in everyone) or a "normal part of aging" (implying it's inherent to the life stage, shifting the focus to adaptation rather than cure). The underlying biology hasn't changed, but the *social and evaluative context* has.

  4.  **The Two-Way Drift and the "Disease Dilemma":** Philosophers like Christopher Boorse (a naturalist) and Jerome Wakefield (whose "harmful dysfunction" theory tries to bridge naturalism and normativism) grapple with this tension. Your two-way drift exemplifies the **disease dilemma**: We want disease concepts to be objective (grounded in biology), but they constantly get pulled into the subjective realm of values (harm, suffering, treatability, normality). The drift you observe *is* the manifestation of this dilemma playing out in real-world medical practice and social perception. Disease status proves to be **contextually contingent**, shifting with technological capabilities (can we fix it?) and demographic realities (how common is it?).

  **What to Call It?** While no single perfect term exists, this pattern is best described as the **contextual contingency of disease classification** or the **value-laden drift of disease concepts**. It demonstrates the **dynamic normativity** inherent in medicine. It fundamentally supports a **constructivist** or **strong normativist** view: disease categories are not simply discovered natural kinds, but **pragmatic human constructs** shaped by our biological understanding, technological capacities, social values, demographic realities, and practical goals (primarily alleviating suffering). The "biology" provides the raw material, but whether and how we label it a "disease" depends heavily on the surrounding context of what we can do about it and how prevalent it is. Your observation perfectly captures why the question "What *is* a disease?" remains so persistently complex and contested within philosophy of medicine.
