  The user explicitly rejects "medicalization" as an answer since it only covers the first direction and is more sociological. They're looking for a philosophical concept that captures this two-way drift where disease status seems tied to practical considerations (treatability, prevalence) rather than biological essence. 

  Hmm... this is interesting because it touches on fundamental debates in philosophy of medicine about whether diseases are natural kinds or social constructs. The user clearly understands this tension - they mention the biology doesn't change, only our stance does. 

  I recall that this exact dilemma is central to what philosophers call the "disease dilemma" or the "normativist vs. naturalist" debate. Normativists like Boorse argue disease status depends on harm and treatability, while naturalists like Wakefield claim there's an objective dysfunction component. 

  The pattern they describe - where the same biological state flips status based on context - is perfect evidence for the normativist position. And the reverse case (common conditions losing disease status) directly challenges naturalism. 

  The user might appreciate knowing this is a live debate with real consequences - like whether insurance covers treatments, or whether conditions get researched. I should also mention how this affects patients psychologically when their "disease" gets reclassified. 

  For a name, "contingent medicalization" fits well since it captures the two-way fluidity they observed. Though honestly the field doesn't have one perfect term - which itself proves their point about conceptual instability!

