answer: |-
  Here's a battle-tested teaching plan for Moral Luck designed for sharp non-academics in 40 minutes, prioritizing clarity, engagement, and preempting misconceptions.

  **Core Goal:** Make them viscerally feel the tension between the Control Principle and how we *actually* assign blame/praise due to luck. They should leave uneasy about how we judge others.

  **Time Allocation:** 25 mins teaching, 15 mins initial discussion/check.

  **The Plan: Sequence & Key Moves**

  1.  **Hook & Intuition Pump (8 mins):**
      *   **Start with TWO concrete, parallel cases (Resultant Luck - Easy Win):**
          *   **Case A (Bad Outcome):** "Sarah, an architect, is rushing a design. She cuts corners on structural calculations *knowing it increases risk slightly*, but figures it's *probably* fine. The building collapses, killing 10 people."
          *   **Case B (Good Outcome):** "Ben, an architect, does the *exact same thing*: rushes, cuts the *same corners* on structural calculations, *knowing the same slight risk increase*. Due to pure luck (unexpectedly stable soil?), the building stands perfectly fine for decades."
      *   **Ask:** "How do you feel about Sarah compared to Ben? Should we judge them *differently* morally? How much blame does Sarah deserve? How much blame does Ben deserve?" (Let debate simmer briefly).
      *   **Highlight Intuition:** Most will feel Sarah is *far worse* and deserves more blame. Acknowledge this feels natural.

  2.  **Introduce the Control Principle (The Bomb) (7 mins):**
      *   "Okay, that judgment feels strong. But let's consider a principle many find intuitive: **The Control Principle.** Simply put: **You can only be morally responsible for what is within your control.**"
      *   **Clarify:** "We don't blame people for earthquakes (outside control). We *do* blame people for deliberate lies (within control). The *outcome* of Sarah's and Ben's actions – collapse or no collapse – depended hugely on factors *neither* controlled: the soil stability, random vibrations, etc. That's **luck**."
      *   **Hammer the Conflict:** "Wait a minute... We *feel* Sarah is much worse. But according to the Control Principle, the *only* thing they controlled was their *decision* to cut corners and take the risk. That was identical. The disastrous *outcome* was largely luck. So... *should* we judge them the same? If we judge Sarah worse, are we blaming her for bad luck?" (Let the discomfort sink in). Introduce the term **"Moral Luck"** here: "This tension is the problem of **Moral Luck**: When factors beyond an agent's control (luck) seem to affect our moral judgments of them or their actions."

  3.  **Define & Broaden: Types of Luck (5 mins):**
      *   "What happened to Sarah and Ben is **Resultant Luck**: Luck in the *outcome* of your actions or projects."
      *   **Introduce Circumstantial Luck (Crucial for Depth):** "But luck isn't just about outcomes. Consider **Circumstantial Luck**: Luck in the *situation* you find yourself in."
      *   **Example:** "Imagine two people with the *same* potential for corruption.
          *   Person A lives in a stable, wealthy society with strong institutions. They never face a serious temptation to take a massive bribe.
          *   Person B lives in a desperately poor, war-torn country with rampant corruption. Faced with an extreme chance to take a life-changing bribe that could save their family, they succumb.
          Do we judge Person B *harsher* simply because bad luck placed them in circumstances where their moral failing was *possible*? Are they *more corrupt* than Person A?" (This moves beyond outcomes to inherent character judgments).

  4.  **Preempt Misconceptions (5 mins):**
      *   **Misconception 1: Epistemic Luck (Not Knowing):** "Important: Moral Luck isn't about *not knowing the risk*. Both Sarah and Ben *knew* the risk when they acted. It's not about ignorance. It's about factors *utterly outside their control* determining the outcome *despite* identical knowledge and choices."
      *   **Misconception 2: Judging Character Solves It:** "Some think: 'Just judge the *character* or *intention*, not the outcome!' But look at the corrupt officials. We judge Person B's character *harsher* because circumstances *allowed* the failing to manifest. Circumstantial luck affects how we judge the person *themselves*. The luck infects even character assessment."
      *   **Drunk Driver Caveat (Use Sparingly):** You *can* briefly mention the drunk driver (hit kid vs. no kid) to reinforce resultant luck, but IMMEDIATLY say: "Notice: This isn't *just* about legal guilt. Legally, both might be equally guilty of DUI. But *morally*, do we feel the driver who hit the child is *more blameworthy*? That's the moral luck question – the feeling that the unlucky one is *worse*." Anchor back to Architect first.

  5.  **The Tension & Conclusion (2 mins):**
      *   "So, here's the core tension: Our deeply held Control Principle says luck shouldn't affect moral judgment. But our actual practices – judging outcomes, judging character based on actions taken in specific circumstances – constantly seem influenced by luck. This makes moral assessment feel unstable or unfair. Can we stick to the Control Principle and judge Sarah/Ben the same? Or does that feel unsatisfying? Does our actual practice mean we *have* to accept Moral Luck? That's the puzzle."

  **The Anchor Example: Why the Architect Works**
  *   **Has:** Identical blameworthy *choices* (knowing risk, cutting corners), massively different *outcomes* due to pure luck (soil, random events), strong intuitive differential blame. Relatable profession.
  *   **Lacks:** Obvious *legal* entanglement (unlike drunk driver). The moral judgment ("she's *worse*") is primary. Focuses blame on the *agent* for the *outcome*.
  *   **Carries the Load:** It perfectly illustrates the resultant luck conflict with the Control Principle. The circumstantial luck example (corrupt officials) then broadens the scope effectively.

  **Key Teaching Moves:**
  *   **Start with Intuition:** Get them feeling the differential judgment *first*.
  *   **Then Drop the Control Principle:** Introduce it *after* they feel the conflict, not as an abstract first principle. It lands harder.
  *   **Resultant THEN Circumstantial:** Resultant luck is more immediately graspable. Circumstantial luck deepens it and prevents the "just judge intentions" escape.
  *   **Name "Moral Luck" AFTER demonstrating the tension:** Let them experience the problem before labeling it.
  *   **Preempt Actively:** Build the epistemic luck and character judgment rebuttals *into* your examples and explanations. Don't wait for them to raise it.

  **Your Check-for-Understanding Question (At the end of teaching, before open discussion):**
  > **"Imagine someone says: 'The corrupt official who actually took the bribe (Person B) *proves* they have a worse character than the one who never faced the temptation (Person A). That's why we judge them more harshly.' How does the problem of Moral Luck, specifically *circumstantial* luck, challenge this argument?"**

  *   **Why it's good:** It tests if they grasp that circumstantial luck affects *character assessment itself*. It forces them to see that Person B's "worse character" judgment depends on the luck of being in a situation where the flaw *could be revealed*. Person A might have the *exact same flaw* but never faced the test. It directly counters the "just judge character" misconception.

  **Is this a bad idea? Absolutely not.** Moral Luck is *perfect* for non-academics precisely because it hooks into deep, universal intuitions about fairness, blame, and how life's randomness messes with our judgments. Lawyers grapple with intent vs. outcome daily; engineers understand system failures where a tiny random input causes catastrophe; librarians see how context shapes interpretation. Your group is ideal. The key is grounding it firmly in relatable cases and making the tension *felt*, not just explained. **Go for it!** The 40-min constraint forces useful focus. Good luck (pun intended)!
