prompt: |-
  I'm running a philosophy discussion group for adults who aren't academics — some lawyers, a couple software engineers, a retired librarian — and we're doing a session on moral luck. They're sharp but haven't read Nagel or Williams. I have about forty minutes to get the core idea across before we open up for discussion.

  What I need from you isn't an explanation of moral luck itself. I need a plan for how to *teach* it: what has to go first, what example carries the whole thing, and what order the pieces have to come in. In particular, I want to know where the control principle needs to be introduced relative to the cases, and whether I should start with resultant luck or circumstantial luck. The drunk driver example seems obvious, but I'm worried it'll make people think moral luck is only about legal responsibility — so what example should anchor the whole thing, and what does it need to have and what does it need to lack?

  Also, what misconceptions should I expect? I'm guessing people will conflate moral luck with epistemic luck (we didn't *know* the outcome), and maybe they'll think the problem dissolves if you just judge character instead of actions. Where in the sequence do I head each of those off?

  Finally, give me one question I can ask at the end to see if they've actually understood the tension rather than just nodding along. And if you think the whole framing of "teaching moral luck in forty minutes to non-philosophers" is a bad idea for some reason I'm not seeing, tell me that instead of humoring me.
