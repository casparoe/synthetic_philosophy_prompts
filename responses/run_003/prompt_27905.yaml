prompt: |-
  I am a high school student working on a research paper about algorithmic fairness, and before I read more proposals I want to know what standard to hold them to. Please write the desiderata: what any adequate theory of fairness for algorithmic decision systems has to deliver. For each requirement, give the case or consideration that makes it a requirement, and say whether it is non-negotiable or just a preference of one camp. Cover at least these: the cases a theory must classify correctly (for example, explicitly using a protected category, using an apparently neutral feature that acts as a proxy for it, treating otherwise identical individuals differently, and harms that appear only at the group level); the distinctions it must not collapse (group versus individual fairness, process versus outcome, and bias in the training data versus bias in the decision rule); and the formal results it must not contradict, especially the impossibility results showing that combinations of otherwise attractive criteria such as calibration, equalized odds, and demographic parity cannot all be satisfied at once except under narrow conditions. Then identify which subsets of the requirements are jointly unsatisfiable, and which single requirement does the most to exclude the standard proposals. Finally, score the main families of proposals — statistical parity, equalized odds, calibration-based views, individual fairness, and causal approaches — against the list in a sentence or two each, but keep the weight on the criteria and their motivation rather than on the scorecard.
reasoning: |-
  Okay, the user is a high school student working on a research paper about algorithmic fairness. They need a clear set of criteria to evaluate fairness proposals. Let me start by understanding their main request: they want desiderata that any adequate theory must meet. They mentioned specific cases, distinctions, and formal results. 

  First, I should list all the requirements they asked for. The cases include using protected categories, proxies, identical individuals, and group-level harms. Then distinctions like group vs. individual fairness, process vs. outcome, data bias vs. decision rule bias. Also, the impossibility theorems like the compas example. 

  I need to explain why each is necessary. For instance, using a protected category is non-negotiable because it's direct discrimination. Proxies are tricky because they hide bias, so theories must handle that. Identical individuals being treated differently is a core fairness issue, though some might see it as a preference. Group-level harms are crucial for systemic issues, so non-negotiable here too.

  Next, distinctions. Group vs. individual fairness addresses different justice models. Collapsing them ignores one aspect. Process vs. outcome matters because fair process can still lead to biased outcomes. Data bias vs. decision rule bias highlights where the problem originates, both need addressing.

  Formal results, especially impossibility theorems, are key. Theories must acknowledge that some fairness metrics can't coexist. Not doing so would ignore mathematical truths. 

  Then, identifying conflicting requirements. For example, statistical parity vs. calibration. The user needs to know which combinations are impossible. Also, which single requirement is most exclusionary—probably the identical individuals criterion, as many group-based methods can't satisfy it.

  Scoring the proposals briefly: statistical parity fails on proxies and calibration. Equalized odds handles some cases but struggles with identical individuals. Calibration works for group harms but ignores individual justice. Individual fairness is strong on identical cases but hard to implement. Causal approaches are comprehensive but complex and not always feasible.

  I should ensure each point is clear and backed by examples. The user might not know all the technical terms, so explaining simply is important. Also, emphasizing non-negotiables versus preferences helps them prioritize. Highlighting conflicts prepares them for evaluating proposals. Finally, the summary table and conflict map will aid their understanding.
answer: |-
  Here are the core desiderata for any adequate theory of algorithmic fairness, structured as you requested. These form the critical lens through which to evaluate proposals:

  **I. Cases a Theory Must Classify Correctly (The "What"):**

  1.  **Explicit Use of Protected Category:**
      *   **Case:** A loan algorithm directly uses race or gender as an input feature. Denying a loan explicitly because someone is Black or a woman.
      *   **Requirement:** The theory **must** classify this as unfair (absent rare, legally justified exceptions like affirmative action programs designed with strict scrutiny).
      *   **Status:** **Non-Negotiable.** This constitutes direct discrimination and violates fundamental anti-discrimination laws and ethical principles.

  2.  **Use of a Proxy for Protected Category:**
      *   **Case:** A loan algorithm denies loans based on zip code (strongly correlating with race) or "purchased cosmetics brand" (strongly correlating with gender), without explicit use of race/gender.
      *   **Requirement:** The theory **must** be able to identify and classify such proxy discrimination as unfair when the proxy's use *causes* disparate impact based on the protected category.
      *   **Status:** **Non-Negotiable.** Ignoring proxies allows circumvention of anti-discrimination norms. The theory needs a mechanism (e.g., causal reasoning, strong correlation analysis) to detect problematic proxies.

  3.  **Differential Treatment of Otherwise Identical Individuals:**
      *   **Case:** Two applicants identical on *all* features relevant to the decision *except* membership in a protected group (or a strong proxy) receive different outcomes.
      *   **Requirement:** The theory **must** classify this differential treatment as unfair (unless justified by a compelling, narrowly tailored interest related to the protected attribute itself, which is rare).
      *   **Status:** **Strong Preference (Often Framed as Non-Negotiable by Individualist Views).** This embodies the principle of "treating like cases alike," a bedrock of individual justice. Some group-focused views might tolerate this if it corrects aggregate disparities, but most theories recognize this as a core fairness violation.

  4.  **Group-Level Harms & Disparate Impact:**
      *   **Case:** An algorithm leads to significantly lower loan approval rates for Black applicants compared to equally creditworthy white applicants, even if no single individual can prove direct discrimination based on identical features, or leads to systematically lower accuracy for one group.
      *   **Requirement:** The theory **must** be able to identify and classify systemic harms that manifest primarily at the group level as unfair, even if individual intent or direct comparison is hard to pinpoint.
      *   **Status:** **Non-Negotiable.** Systemic discrimination and disparate impact are real and damaging phenomena that fairness frameworks must address. Ignoring group-level outcomes fails core societal justice goals.

  **II. Distinctions a Theory Must Not Collapse (The "How"):**

  5.  **Group Fairness vs. Individual Fairness:**
      *   **Distinction:** Group fairness focuses on equitable outcomes or treatment *between* predefined groups (e.g., equal approval rates, equal error rates). Individual fairness focuses on similar treatment for *similar individuals* regardless of group membership.
      *   **Requirement:** The theory **must not** assume these are equivalent or that achieving one guarantees the other. It must explicitly address the tension and clarify its primary focus or how it balances them.
      *   **Status:** **Non-Negotiable.** Collapsing these ignores fundamental philosophical differences (e.g., egalitarianism vs. meritocracy, systemic redress vs. individual rights) and the impossibility of perfectly satisfying both simultaneously in many real-world scenarios.

  6.  **Process Fairness vs. Outcome Fairness:**
      *   **Distinction:** Process fairness concerns the *procedures* used (e.g., transparency, lack of bias in features/data, right to explanation). Outcome fairness concerns the *results* of the decision (e.g., equitable distribution of benefits/harms across groups).
      *   **Requirement:** The theory **must not** assume a fair process guarantees fair outcomes, or vice-versa. It should acknowledge both aspects and clarify how it relates them.
      *   **Status:** **Strong Preference (Near-Negotiable).** While distinct, they often interact. However, conflating them can lead to complacency (e.g., "our process is clean, so outcomes must be fair") or ignoring legitimate process concerns (e.g., "the ends justify the means").

  7.  **Bias in Training Data vs. Bias in the Decision Rule:**
      *   **Distinction:** Bias can originate from skewed, unrepresentative, or historically discriminatory training data, or it can be introduced or amplified by the design/optimization of the algorithm itself.
      *   **Requirement:** The theory **must not** treat these as indistinguishable. It needs conceptual tools to diagnose the *source* of unfairness to guide effective mitigation strategies (e.g., data repair vs. algorithm redesign vs. post-processing).
      *   **Status:** **Non-Negotiable.** Effective intervention requires understanding the root cause. Blaming only the data ignores algorithmic agency; blaming only the algorithm ignores historical context embedded in data.

  **III. Formal Results a Theory Must Not Contradict (The "Constraints"):**

  8.  **Acknowledge Impossibility Results:**
      *   **Formal Result:** The seminal impossibility result (Kleinberg, Mullainathan, Raghavan; Chouldechova; Pleiss et al.) proves that several intuitively desirable criteria (specifically **Calibration**, **Equalized Odds**, and **Statistical Parity/Demographic Parity**) are mutually incompatible except under very specific, unrealistic conditions (like perfect prediction or equal base rates).
      *   **Requirement:** The theory **must not** claim compatibility or propose definitions that implicitly assume compatibility between these conflicting criteria in general cases. It must explicitly acknowledge the trade-offs required (e.g., which criteria it prioritizes and which it sacrifices, and why).
      *   **Status:** **Non-Negotiable.** This is a mathematical truth about the definitions themselves. Ignoring it renders a theory mathematically incoherent for real-world applications.

  **Conflicts & Exclusion:**

  *   **Jointly Unsatisfiable Requirements:** The core incompatibility identified in the formal results (Requirement 8) means that **Statistical Parity, Equalized Odds, and Calibration (by group)** cannot all be simultaneously satisfied. Any theory must choose which of these (if any) to prioritize, acknowledging the sacrifice of the others. Furthermore, **Strict Individual Fairness** (Requirement 3 - identical individuals treated identically) is often incompatible with achieving **Statistical Parity** or correcting strong **Group-Level Harms** (Requirement 4) when base rates differ between groups.
  *   **Most Excluding Requirement:** **Requirement 3 (Differential Treatment of Otherwise Identical Individuals)** does the most to exclude standard proposals. Many powerful group fairness metrics (like Statistical Parity, Equalized Odds) inherently *require* treating identical individuals from different groups differently to achieve their group-level goals when historical disparities or base rate differences exist. Theories prioritizing group parity often explicitly reject Requirement 3 as an absolute necessity.

  **Brief Scoring of Main Proposals:**

  *   **Statistical Parity / Demographic Parity:** Excels on Group-Level Harms (4) and avoids Explicit Use (1), but fails on Proxies (2) unless perfectly detected, actively violates Identical Individuals (3), conflicts with Calibration/Equalized Odds (8), and prioritizes Group over Individual (5).
  *   **Equalized Odds:** Strong on Group-Level Harms (4), avoids Explicit Use (1), better on Proxies (2) than Statistical Parity if proxies don't perfectly capture the attribute, but still violates Identical Individuals (3), conflicts with Statistical Parity/Calibration (8), and focuses on Group (5).
  *   **Calibration (by Group):** Addresses Group-Level Harms (4) related to prediction reliability, avoids Explicit Use (1), but can be blind to Proxies (2) and Identical Individuals treatment (3), conflicts with Statistical Parity/Equalized Odds (8), and is purely Group-focused (5).
  *   **Individual Fairness:** Excels on Identical Individuals (3) and avoids Explicit Use (1), but struggles severely with Group-Level Harms (4) and detecting Proxies (2) if the similarity metric is flawed. It prioritizes Individual over Group (5) and is often agnostic to the Process/Data vs. Rule distinction (6,7).
  *   **Causal Approaches:** Strongest on Proxies (2) and distinguishing Data vs. Rule Bias (7), can handle Explicit Use (1) and Identical Individuals (3) depending on the model, addresses Group Harms (4) through causal effects, and acknowledges trade-offs (8). However, they are complex, rely on often-unverifiable assumptions, and practical implementation is challenging (potentially impacting Process Fairness (6)).

  **Key Takeaway:** There is no single "correct" or universally satisfying theory of algorithmic fairness. An adequate theory must transparently navigate these core desiderata, explicitly stating its priorities, acknowledging the trade-offs it makes (especially the impossibility results), and justifying why those choices are appropriate for the specific context it aims to address. Your evaluation should focus on how well a proposal *engages* with these fundamental tensions and constraints. Good luck with your research!
