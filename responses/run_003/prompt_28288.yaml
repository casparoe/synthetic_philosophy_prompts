     "I see $10. The other envelope has either $20 or $5, each with 50% chance. So the expected value is (20+5)/2 = $12.5."

   This calculation still uses the 50-50 without justification. And that's what Dan is objecting to. So the flaw in the opened case is the unjustified 50-50, which comes from not accounting for the prior.

   In the unopened case, the flaw is the ambiguous use of X.

   So the two flaws are different? Or are they connected?

   Actually, the unopened case can be seen as a special case of the opened case where we don't condition on any specific amount. But in the unopened case, the ambiguous X is the main issue, while in the opened case, the issue is the prior. So perhaps the paradox has two layers.

   However, note that in the unopened case, the expected value calculation that uses X is flawed because it doesn't condition on any information and yet uses a variable that takes on two different meanings. The alternative calculation that uses the fixed base amount A (the smaller amount) works. So the flaw in the unopened case is the variable X being used without recognizing that it is not fixed.

   In the opened case, we condition on X=10, so we fix X to 10. Now the calculation that says the other envelope has 20 or 5 with 50% chance is flawed because the two scenarios (that the pair was (5,10) or (10,20)) are not equally likely without a prior.

   Therefore, the flaws are distinct but both lead to an incorrect expected value calculation.

   Final summary:

     - Dan is right that the prior is necessary when you open the envelope and condition on the amount. Without a prior, you cannot assign the 50-50 in the opened case.

     - Maya is right that without opening, the symmetry argument shows that switching has zero expected gain, and the expected value calculation with X is flawed due to the ambiguous use of X.

     - They both agree that the ambiguous use of X is a problem (and that is what makes the unopened case calculation tempting but wrong).

     - The remaining disagreement might be about the role of the prior in the unopened case: Dan might argue that even without opening, if we don't have a prior we cannot compute the expected value? But Maya would argue that symmetry (which does not require a prior) suffices. And indeed, the symmetry argument does not require a prior: it only relies on the random choice of the envelope and the fixed pair (A,2A). So the unopened case does not require a prior.

