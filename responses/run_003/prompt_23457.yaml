prompt: |-
  I'm moderating a panel with a philosopher who defends the extended mind thesis and, to answer the overextension objection, holds that an external resource counts as part of a subject's mind only if the subject actively trusts or endorses it as a cognitive tool. Draft a sequence of interview questions that go beyond having them restate the parity principle: I want at least one question each on the glue-and-the-joint problem (what, if anything, binds an external resource to the mind at the internal–external boundary), on the coupling-versus-constitution objection (whether causal involvement in belief formation is enough for the resource to be part of the belief rather than merely causally coupled to it), and on whether the trust condition is doing the real work and risks making extension too restrictive or ad hoc. For each, include a follow-up keyed to the reply they're most likely to give, and close with a question about what evidence could count against the view.
