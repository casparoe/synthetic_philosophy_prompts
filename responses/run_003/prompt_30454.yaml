answer: |-
  ## Adversarial Collaboration: The Problem of Old Evidence in Bayesian Confirmation Theory

  **Participants:** Supplementationist (S) & Deflationist (D)

  **Section 1: Agreed Foundations**

  Both parties agree on the following points regarding the formalism, the demands of the Mercury-type case, and solution criteria:

  1.  **Formalism Limitation:** Within the *strict, synchronic, standard subjective Bayesian framework* (where rational credences are probabilities, conditioning on evidence is by Bayesian conditionalization, and known evidence E has P(E) = 1), the condition for confirmation P(H|E) > P(H) *cannot* be satisfied if E is already known (P(E)=1). Conditionalizing on E yields P(H|E) = P(H).
  2.  **Mercury-Type Case Core:** A satisfactory account must explain how a *previously known piece of evidence E* (e.g., Mercury's anomalous perihelion advance) can provide *incremental confirmatory support* to a *newly formulated hypothesis H* (e.g., General Relativity) *after* H's formulation, even though E was known beforehand.
  3.  **Minimal Requirement:** A solution must show how E *rationally increases* the agent's confidence in H *specifically because of the explanatory or probabilistic relationship discovered* when H is formulated, beyond whatever confidence H had prior to considering E (which might be very low).
  4.  **Mercury is Paradigmatic:** The Mercury perihelion case is a compelling, historically significant, and theoretically challenging instance of old evidence confirmation. Any adequate account must plausibly handle this case.
  5.  **Relabeling vs. Solving:** Merely *asserting* that E confirms H without showing a probabilistic increase within a rational model, or claiming that confirmation is "inherently comparative" without specifying how E makes H *more* probable *relative to relevant alternatives* in a way captured by the formalism, constitutes relabeling the problem rather than solving it. A solution must provide a *computable mechanism* within an extended or correctly applied Bayesian framework that yields P(H|E, K) > P(H|K) for some appropriate background K, even when E is in K.

  **Section 2: Disagreements Table**

  | # | Disagreement (Neutral Wording)                                                                 | Supplementationist (S) View (S's Wording)                                                                                                                                                                | Deflationist (D) View (D's Wording)                                                                                                                                                                 | Crux/Cruxes                                                                                                                                                                                                 | Concrete Case/Argument/Constraint & Predictions                                                                                                                                                                                                                               |
  | :- | :--------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1** | **Is assigning P(E)=1 to known evidence E an acceptable idealization within the Bayesian model when modeling the impact of discovering H's relation to E?** | "Assigning P(E)=1 to known evidence is a fundamental commitment of the synchronic Bayesian model of rational certainty. This idealization *causes* the formal problem of old evidence; it is not merely a misapplication. Representing the discovery of H explaining E requires relaxing this idealization or adding structure that allows E to become 'surprising' or 'informative' again relative to H." | "Assigning P(E)=1 is a simplifying idealization that *fails* to capture the agent's epistemic state regarding evidence whose logical or probabilistic relationships to *novel hypotheses* are yet undiscovered. The probability 1 assignment ignores the *context of discovery*. When modeling confirmation by E for H, E should be treated as having a probability less than 1 in the *relevant epistemic context* where H's relation to E is first evaluated." | **a)** Is P(E)=1 *essential* to representing knowledge/belief in the Bayesian model? <br> **b)** Does the idealization *obscure* a crucial aspect of the learning process (discovering relations)? <br> **c)** Can the core Bayesian formalism represent discovery without violating P(E)=1? | **Case:** Consider an agent who knows E (e.g., specific planetary positions over decades), assigns P(E)=1, but has no viable theory explaining it (pre-GR physics is background K). Later, H (GR) is formulated. <br> **S Prediction:** Within strict formalism (P(E)=1 in K), no probabilistic increase from E is possible *by definition*. Any model showing P(H|E,K) > P(H|K) *must* implicitly relax P(E)=1 or add structure (e.g., counterfactual priors). <br> **D Prediction:** A principled model *within standard Bayesianism* can be constructed where the relevant background K' *excludes* the specific explanatory demand posed by E or the specific details of H. Conditioning on E *within this context* yields P(H|E, K') > P(H, K'), reflecting the discovery. (E.g., K' might be pre-GR physics *excluding* the Mercury anomaly data, or the agent's knowledge *before* recognizing E as anomalous). |
  | **2** | **Does the failure of conditionalization to yield P(H\|E) > P(H) when P(E)=1 necessitate a formal supplementation of the Bayesian apparatus?** | "The conditionalization failure reveals a structural limitation of the *standard* Bayesian framework. Solving the problem requires *extending* the formalism with new elements (e.g., counterfactual degrees of belief, measures of logical learning, distinct confirmation measures) to model the rational shift occurring upon discovering H explains E." | "The conditionalization failure is an artifact of misapplying the formalism to the wrong epistemic state. No supplementation is needed; the solution lies in correctly *applying* standard conditionalization to the *appropriate* background knowledge K at the *appropriate* time (when H's relation to E is first apprehended), where E is not yet fully integrated regarding its relevance to H." | **a)** Is the failure due to a *limitation of the formalism* or a *limitation of the model setup*? <br> **b)** Are proposed supplements (counterfactuals, logical uncertainty) truly necessary or just alternative ways to achieve what correct modeling of K can do? | **Argument:** Examine proposed supplements (e.g., Garber's logical learning, Jeffrey's counterfactual priors). <br> **S Prediction:** These supplements are *essential* and *different in kind* from simply redefining K. They provide mechanisms the core formalism lacks. <br> **D Prediction:** These supplements can be *reconstructed* as clever ways to implicitly model the relevant background K' at the time of discovery. They are not fundamentally new formal elements but pragmatic modeling choices achievable within standard Bayesianism by careful specification of K. |
  | **3** | **Are counterfactual priors ("what my credence *would have been* if I hadn't known E") a legitimate and necessary tool for solving the problem?** | "Counterfactual priors are a legitimate and often necessary way to formally represent the *informational content* E has *relative to H*. They provide the only coherent way within a broadly Bayesian framework to quantify how surprising E *would have been* under ~H, capturing E's confirmatory power despite its actual certainty." | "Counterfactual priors are epistemologically problematic, non-observable, and introduce significant subjectivity and potential for arbitrariness. They are unnecessary because the confirmatory impact of E for H can be captured by comparing P(H) *within the actual sequence of learning* before and after recognizing H's explanatory relation to E, using carefully defined actual background knowledge states." | **a)** Are counterfactual degrees of belief rationally constrained and meaningful? <br> **b)** Is the 'surprise value' of E essential to its confirmatory power, and can it *only* be captured counterfactually? <br> **c)** Can the comparative impact be modeled synchronically without counterfactuals? | **Constraint:** Any solution must avoid radical subjectivity or arbitrariness in determining the degree of confirmation. <br> **S Prediction:** Counterfactual priors, while requiring careful handling, can be constrained (e.g., by coherence, theoretical virtues) and are the only way to rigorously define the needed likelihood P(E|~H) or P(E|H)/P(E) when E is known. Without them, quantification is impossible or arbitrary. <br> **D Prediction:** Models relying on counterfactual priors inevitably introduce unconstrained degrees of freedom ("How *exactly* should I imagine not knowing E?"). Principled models using actual background knowledge shifts (e.g., removing E from K, or recognizing E as anomalous within K) can yield determinate confirmation measures without counterfactuals. |
  | **4** | **Does a successful account require showing that E makes H *absolutely* more probable, or is it sufficient to show H is *relatively* better than a specified alternative T?** | "While comparison is important, the core problem demands showing how E *itself* provides *incremental support* to H, making H *more probable* than it was before considering E's specific relation to H. Merely showing P(H\|E)/P(T\|E) > P(H)/P(T) for some T, without showing P(H\|E) > P(H) relative to the appropriate epistemic context, fails to capture the direct confirmatory role of E for H and risks relabeling." | "Confirmation is inherently comparative. Showing that E *differentially supports* H over a relevant alternative theory T (or set of alternatives) – especially one that was a live option *before* H explained E – *is* the essence of E's confirmatory role for H in the old evidence case. This comparative lift *constitutes* the solution within the Bayesian framework (e.g., via the ratio form of Bayes' theorem)." <br> *(Note: Potential Verbal Aspect - see below)* | **a)** Is incremental confirmation an absolute or inherently comparative notion? <br> **b)** Can the comparative lift (H vs T given E) be achieved *without* also implying an absolute increase in P(H|E) relative to the discovery-context background? <br> **c)** Does focusing solely on comparison avoid quantifying the direct impact of E on H? | **Case:** Newtonian Gravity (T) fails to predict Mercury's perihelion (E). GR (H) predicts it. Agent knew E before H. <br> **S Prediction:** Even if P(H|E)/P(T|E) > P(H)/P(T), this does not *necessarily* show E *increased* the probability of H *from its pre-discovery value* relative to the agent's total background K (including E). A formal model showing only the ratio increase might mask that P(H|E) = P(H|K) = P(H) in absolute terms. <br> **D Prediction:** In a correctly modeled discovery context (background K' excluding the resolution of the anomaly by H or the specific failure of T w.r.t E), conditioning on E *will* yield both P(H|E, K') > P(H|K') *and* P(H|E, K')/P(T|E, K') > P(H|K')/P(T|K'), demonstrating E's confirmatory power for H absolutely and comparatively. The ratio increase *requires* the absolute increase relative to K'. |

  **Section 3: Verbal Disagreement Flag**

  *   **Disagreement 4 (Absolute vs. Comparative)** exhibits a potential verbal component regarding the term "incremental confirmation." S defines it primarily as an absolute probability increase relative to a specific background state (the state *before* discovering H explains E). D defines it primarily as a change in the *relative standing* of H compared to relevant alternatives, which they argue necessarily *implies* an absolute increase relative to the appropriate background (K') for the discovery context. The substantive disagreement lies in **Crux 4b**: D claims the comparative lift *within their model* entails the absolute lift S demands *relative to the discovery context background K'*. S denies that the comparative lift *as often presented by deflationists* (e.g., using the current posterior ratio vs. a counterfactual prior ratio) necessarily corresponds to an absolute increase relative to a well-defined, actual prior state of belief *including* the knowledge of E but *excluding* the knowledge of H's explanation of it. They see D's K' as often smuggling in counterfactual elements or misrepresenting the actual prior state.

  **Section 4: Stability Check**

  *   **For the Supplementationist (S):**
      *   **Revision Trigger:** A deflationist model that **concretely, rigorously, and uncontroversially** calculates P(H|E, K') > P(H|K') for the Mercury case, using *only* standard conditionalization on an actual, well-defined background K' (e.g., the physicist's knowledge the moment before realizing GR explains the anomaly, *including* knowledge of the anomaly itself and its status as unresolved), *without* relying on intuitive counterfactuals, logical learning measures, or non-standard confirmation measures, and where K' is demonstrably not just a relabeling of a counterfactual state. Successfully formalizing the "aha!" moment within strict synchronic conditioning would be highly challenging.
      *   **Fragile Point:** S's insistence that P(E)=1 *must* block confirmation risks appearing **dogmatic** if deflationists persistently demonstrate compelling models using K' where E has P(E|K') < 1, *especially* if these models convincingly argue that K' reflects the epistemically relevant state for confirmation by old evidence. S might struggle to prove K' is *necessarily* illegitimate without appealing to the very idealization (P(E)=1 for known evidence) that D is contesting.

  *   **For the Deflationist (D):**
      *   **Revision Trigger:** A clear case of old evidence confirmation where **all standard deflationist maneuvers fail simultaneously**: (1) No plausible K' excluding E or its anomalous status can be defined without being ad hoc or historically inaccurate. (2) The evidence E is demonstrably a **logical truth** relative to the background K (e.g., a mathematical consequence already known), making P(E|K)=1 inescapable and any attempt to set P(E|K')<1 seem incoherent. (3) The confirmation is intuitively strong and direct for H, yet no relevant alternative theory T exists to enable a purely comparative account. Finding such a "pure" case is difficult.
      *   **Fragile Point:** D's claim that their approach "solves" the problem without supplementation can seem **question-begging**. Defining the "relevant background" K' often appears tailored *specifically* to make confirmation work, risking a sophisticated form of relabeling. D needs a principled, *general* method for determining K' that isn't reverse-engineered from the desired confirmatory result and that applies uniformly across diverse old evidence cases. Without this, the charge of "changing the subject" (from the agent's actual total belief state) remains potent.
