answer: |-
  ## Research Proposal: Dissecting the Pragmatic Boundary - A Diagnostic Taxonomy for Gricean Distinctions

  **Research Question:** Do Grice's core diagnostics for implicature (cancellability, calculability, non-detachability, embeddability) reliably track a *single*, unified distinction (e.g., said/implicated), or do they instead track *multiple*, distinct theoretical boundaries within utterance interpretation, such as linguistic meaning vs. speaker meaning, or propositional content vs. pragmatic enrichment, or compositional semantics vs. pragmatic inference?

  **Why the Question Remains Open:** Current dominant frameworks, despite profound disagreements, largely presuppose a monolithic boundary targeted by these diagnostics. **Minimalists** (e.g., Borg, Cappelen & Lepore) argue diagnostics point to a sparse "what is said," resisting pragmatic intrusion. **Contextualists** (e.g., Recanati, relevance theorists) argue diagnostics reveal substantial pragmatic enrichment within truth-conditional content. Proponents of **Grammatical Theories of Implicature** (e.g., Chierchia, Fox, Spector) argue embeddability shows implicatures are generated compositionally, while **Pragmatic Theories** (e.g., standard Griceans, some relevance theorists) use cancellability and calculability to argue for post-compositional pragmatic reasoning.

  This stalemate persists precisely because both sides leverage the *same* diagnostics to argue for *different* placements of *one* assumed boundary. Crucially, the diagnostics themselves are rarely scrutinized for potential divergence. When conflicts arise (e.g., the embeddability of certain implicatures seemingly contradicting their cancellability), they are treated as anomalies to be explained away within a unified framework, rather than evidence that the diagnostics track different phenomena. The foundational assumption of a single boundary remains largely unchallenged, leaving the core issue unresolved.

  **Methodology:** This project employs a targeted conceptual and linguistic analysis, moving beyond exegesis or formal implementation, to systematically dissect the diagnostics and their interactions across diverse utterance types. The work will proceed in three concrete, integrated stages over two years:

  1.  **Stage 1: Diagnostic Decomposition and Conceptual Mapping (Months 1-8):**
      *   **Activity:** Conduct a rigorous conceptual analysis of each diagnostic (Cancellability, Calculability, Non-detachability, Embeddability). Precisely define the theoretical work each is intended to perform and the underlying cognitive or linguistic mechanisms it purportedly reflects (e.g., cancellability as reflecting defeasible inferential status; embeddability as reflecting compositional integration; non-detachability as reflecting non-conventionality; calculability as reflecting inferential derivation).
      *   **Justification:** Pure exegesis of Grice is insufficient; his own use was often illustrative, not systematically defined. A formal implementation of one side (e.g., building a grammar for embedded implicatures) risks presupposing the answer (that there is one boundary) and overlooks the diagnostic interplay. This stage establishes independent conceptual foundations for each diagnostic, crucial for assessing their potential divergence.

  2.  **Stage 2: Targeted Case Study Analysis (Months 9-16):**
      *   **Activity:** Select a diverse range of critical linguistic phenomena known to generate diagnostic tensions:
          *   *Scalar Implicatures:* Test embeddability under operators (e.g., negation, modals, conditionals) vs. cancellability in matrix and embedded contexts.
          *   *Metaphor and Hyperbole:* Examine cancellability and calculability vs. potential claims of truth-conditional contribution (contextualism) and their non-detachability.
          *   *Presupposition Triggers vs. Conventional Implicatures:* Contrast cancellability, embeddability, and non-detachability (e.g., "stop" vs. "but").
          *   *"Near-Literal" Enrichments:* (e.g., "I haven't eaten" -> "...today"). Test calculability and cancellability vs. claims of mandatory truth-conditional inclusion.
      *   **Justification:** Testing diagnostics *in situ* across challenging cases is essential. Relying solely on armchair intuition or isolated examples is inadequate. This stage systematically probes where diagnostics converge and, crucially, where they *diverge* in their verdicts on specific interpretations. The focus is on linguistic data and speaker judgments, not empirical processing studies, keeping it feasible and philosophical.

  3.  **Stage 3: Synthesis and Taxonomy Development (Months 17-24):**
      *   **Activity:** Analyze the patterns of convergence and divergence identified in Stage 2 through the conceptual lenses defined in Stage 1. Develop a refined taxonomy of distinctions potentially tracked by the diagnostics (e.g., a distinction primarily marked by cancellability/calculability concerning defeasible inference vs. a distinction marked by embeddability concerning compositional level). Evaluate how this taxonomy reconceptualizes the stalemates identified initially (minimalism/contextualism; grammatical/pragmatic implicatures).
      *   **Justification:** This stage moves from analysis to theoretical contribution. The goal is not merely to list divergences but to propose a principled framework explaining *why* they occur and *what* distinct theoretical boundaries the diagnostics actually (and most reliably) indicate. This directly addresses the core research question by potentially dissolving the assumption of a single boundary.

  **Why not Alternatives?**
  *   **Pure Exegesis (Grice's Texts):** While foundational, it cannot resolve contemporary theoretical stalemates built upon, but not determined by, Grice's original framework. The debate has evolved significantly.
  *   **Formal Implementation (e.g., of Grammatical Implicature):** This approach typically starts by assuming the diagnostics track one boundary (often aligning embeddability with semantics) and builds a formal system accordingly. It presupposes the answer this project questions and cannot adjudicate the fundamental diagnostic divergence.
  *   **Large-Scale Experimental Studies:** While valuable, such studies are beyond a 2-year philosophy postdoc scope, often require specialized training/labs, and risk conflating processing realities with the conceptual distinctions central to truth-conditional semantics/pragmatics.

  **Success Criteria:** The project succeeds if it:
  1.  Provides compelling evidence (through conceptual analysis and case studies) that Grice's diagnostics systematically diverge in significant ways across key phenomena.
  2.  Develops a coherent, well-motivated taxonomy identifying at least two distinct theoretical distinctions tracked by clusters of diagnostics (e.g., a distinction primarily sensitive to cancellability/calculability vs. one primarily sensitive to embeddability/non-detachability).
  3.  Demonstrates how applying this taxonomy offers clearer, less paradoxical explanations for existing puzzles (e.g., embedded implicatures, mandatory enrichments) and reconceptualizes the terms of the minimalist/contextualist and grammatical/pragmatic debates, showing how apparent stalemates stem from conflating distinct boundaries.
  4.  Generates 2-3 high-quality journal articles and forms the core of a monograph proposal.

  **Failure Criteria:** The project fails if it:
  1.  Finds no systematic divergence in the diagnostics across the studied phenomena, consistently supporting the traditional single-boundary view.
  2.  Cannot develop a principled taxonomy explaining any observed divergences, resulting only in a list of apparent anomalies without theoretical integration.
  3.  Concludes that diagnostic divergence is merely random or contextually idiosyncratic, offering no significant theoretical insight.
  4.  Fails to produce publishable results demonstrating a novel contribution to the debates.

  **Scope and Feasibility:** Focusing on conceptual analysis and targeted linguistic case studies (scalars, metaphors, presuppositions, enrichments) provides a manageable scope for two years. It leverages core philosophical skills in analysis and argumentation while engaging deeply with linguistic data. The output (articles, monograph core) is standard and achievable. This project directly tackles a foundational, unresolved assumption in the field with the potential for significant theoretical clarification, making it a strong candidate for funding. It promises not just to take a side in existing debates, but to fundamentally reshape the conceptual map upon which those debates are conducted.
