  Okay, the user is a philosophy of biology professor looking for a clear set of desiderata for definitions of life to frame their course discussions. They want more than just a list—they need the underlying rationale for each criterion, including edge cases that test definitions and distinctions that must be preserved. 

  First, I need to structure this systematically. The core challenge is balancing biological accuracy with philosophical rigor. The professor mentioned key tensions: individual vs. collective life, living vs. dormant states, and avoiding contradictions with established biology. They also want an evaluation of major definition types against these criteria.

  Hmm... the non-negotiables should probably include avoiding false positives (like fire) and false negatives (like viruses). Those are classic teaching examples. But I should also flag where theorists might reasonably disagree—like whether theoretical unity matters more than practical utility. 

  For the scoring part, I notice most definitions fail at viruses or borderline cases. Metabolism struggles with dormant life, evolutionary definitions with sterile hybrids, and information-based ones with crystal growth. Autopoiesis is elegant but excludes symbionts. The real killer seems to be the "dormancy challenge"—no candidate handles cryptobiosis well while also excluding non-living replicators. 

  Aha! The professor's hidden question might be whether life definitions are inherently paradoxical. The tension between persistence (metabolism) and evolution (variation) is unresolvable—one requires stability, the other instability. That's the "list as result" angle they hinted at. I'll emphasize that in the conclusion. 

  Better avoid jargon where possible. When discussing "thermodynamic disequilibrium," I should explicitly mention why fire doesn't count—it lacks metabolic control. And for the scoring table, color-coding helps but since this is text, I'll use +/– symbols with footnotes explaining trade-offs. 

  The professor values precision, so I'll cite specific examples: mules for evolutionary definitions, tardigrades for cryptobiosis, mitochondria for obligate symbiosis. They'll recognize these from teaching. Also noting where definitions contradict biology (e.g., autopoiesis vs. endosymbiosis theory) strengthens the critique. 

  Finally, the "pair conflict" insight feels crucial. If I present metabolism and evolution as fundamentally opposing forces that every definition must reconcile, that frames the whole debate. Students can then evaluate papers based on how they navigate that tension. That's likely the conceptual takeaway the professor wants to highlight.
answer: |-
  Here is a structured list of desiderata for a definition of life, designed for your philosophy of biology course, including motivations, essential distinctions, and evaluations of major approaches:

  **Core Desiderata for a Definition of Life**

  1.  **Exclude False Positives (Non-Negotiable)**
      *   **Must:** Correctly classify paradigmatic *non-living* entities as non-living.
      *   **Motivating Cases:** Fire (dissipative structure, energy consumption), Crystals (growth, complex structure), Simple Replicators (prions, autocatalytic cycles, some computer viruses), Complex Machines (robots, AI).
      *   **Distinction:** Must not collapse *active dissipation* (fire) vs. *controlled metabolism*, or *simple replication* vs. *heredity with variation*.

  2.  **Include All Paradigmatic Life (Non-Negotiable)**
      *   **Must:** Correctly classify all undisputed living entities as alive.
      *   **Motivating Cases:** Bacteria, Archaea, Protists, Fungi, Plants, Animals (including dormant stages like seeds, spores).
      *   **Distinction:** Must encompass the *full diversity* of known life forms.

  3.  **Account for Borderline Cases (Non-Negotiable, but Explanatory Burden)**
      *   **Must:** Either classify these entities definitively as living or non-living, *or* provide a principled explanation for why they resist clear classification based on the definition's criteria. Cannot simply ignore them.
      *   **Motivating Cases:**
          *   *Viruses:* Replicate, evolve, have complex structure, but lack intrinsic metabolism outside a host.
          *   *Viroids/Plasmids:* Simpler replicating molecules.
          *   *Prions:* Misfolded proteins that replicate conformation but carry no genetic information.
          *   *Dormant States:* Seeds, spores, tardigrades in cryptobiosis (metabolically inactive but capable of revival).
          *   *Sterile Hybrids:* Mules (viable, metabolically active, but cannot reproduce).
          *   *Obligate Symbionts:* Entities only viable within a host (e.g., some mitochondria-derived organelles, endosymbiotic bacteria) – where does the "individual" lie?
      *   **Distinction:** Must handle the *living vs. capable-of-living* (dormancy), *individual vs. collective* (symbionts), *alive vs. once-alive* (sterile organisms, corpses).

  4.  **Distinguish Living from Recently Dead/Non-Viable (Non-Negotiable)**
      *   **Must:** Explain the transition from alive to dead. A corpse, a sterilized organism, or a non-viable zygote should not be classified as alive.
      *   **Motivation:** Essential for practical applications (medicine, ecology) and conceptual clarity. A definition that includes corpses is inadequate.
      *   **Distinction:** *Alive vs. once-alive*; *Viable system vs. non-viable structure*.

  5.  **Be Consistent with Core Biological Principles (Non-Negotiable)**
      *   **Must:** Not contradict well-established biological facts central to understanding living systems.
      *   **Key Principles:** Evolution by Natural Selection (requires heritable variation), Cell Theory (all known life is cellular or descended from cells), Thermodynamics (life maintains local order via energy dissipation), Central Dogma (information flow DNA->RNA->Protein).
      *   **Motivation:** A definition fundamentally at odds with evolution or thermodynamics fails as a *biological* definition.

  6.  **Be Potentially Universal / Agnostic to Biochemistry (Negotiable, but desirable)**
      *   **Must:** Be theoretically applicable to life not based on Earth's biochemistry (e.g., silicon-based, alternative solvents) or artificial life, *or* explicitly argue why Earth-like biochemistry is essential.
      *   **Motivation:** Astrobiology, Artificial Life research, and the philosophical question of life's nature beyond our example. Many theorists see this as crucial.

  7.  **Be Useful / Explanatory (Negotiable)** 
      *   **Must:** Provide conceptual clarity, guide research, or explain key phenomena better than alternatives.
      *   **Motivation:** A purely stipulative definition has limited value. Does it help explain the origin of life, the boundaries of biology, or the nature of biological functions? (e.g., "Why does life evolve?" "Why is it organized the way it is?").

  8.  **Address the "Organizational Closure" / Autonomy Problem (Negotiable, but significant)**
      *   **Must:** Account for the apparent *self-organization*, *persistence*, and *boundary maintenance* of living systems. How do they maintain themselves as distinct wholes over time?
      *   **Motivation:** Contrasts life with passive structures or simple dissipative systems like flames. This is central to "autopoiesis" and related theories.

  **Scoring Major Approaches Against Desiderata**

  | Desideratum          | Metabolic (e.g., NASA: "Self-sustaining chemical system...") | Evolutionary (e.g., "Capable of Darwinian evolution") | Information-Based (e.g., "Self-replicating system with hereditary variation") | Autopoietic (e.g., "Autonomous agent with organizational closure") |
  | :----------------------- | :----------------------------------------------------------- | :---------------------------------------------------- | :--------------------------------------------------------------------------- | :----------------------------------------------------------------- |
  | 1. Exclude False Positives | ❌ (Fire, some crystals)                                     | ✅ (Generally strong)                                 | ❌ (Simple replicators, crystals, computer viruses)                         | ✅ (Strong - emphasizes specific organization)                   |
  | 2. Include Paradigmatic Life | ✅ (Generally strong)                                        | ❌ (Sterile hybrids like mules)                       | ✅ (Strong)                                                                 | ✅ (Strong for individuals)                                      |
  | 3. Borderline Cases      | ❌ (Viruses, viroids, prions - no metabolism; Dormancy problematic) | ❌ (Viruses? Sterile hybrids; Dormancy problematic) | ❓ (Viruses ✅; Prions? Viroids ✅; Sterile hybrids? Dormancy?)             | ❌ (Viruses; Obligate symbionts as individuals; Dormancy?)      |
  | 4. Living vs. Dead      | ✅ (Loss of metabolism = death)                              | ✅ (Loss of evolutionary potential)                   | ✅ (Loss of replication/info transmission)                                  | ✅ (Loss of organizational closure)                              |
  | 5. Biological Principles | ✅ (Metabolism, Thermodynamics)                              | ✅ (Evolution)                                        | ✅ (Information, Heredity)                                                  | ✅ (Organization, Thermodynamics)                                |
  | 6. Universal Potential   | ❓ (Depends on chemistry)                                    | ✅ (Very strong - focuses on process)                 | ✅ (Strong)                                                                 | ✅ (Strong - focuses on organization)                            |
  | 7. Useful/Explanatory    | ❓ (Explains persistence, less so evolution)                 | ✅ (Explains diversity/adaptation)                    | ❓ (Explains heredity/variation)                                            | ✅ (Explains autonomy/organization)                              |
  | 8. Organizational Closure| ❓ (Implied but not explicit)                                | ❌ (Not addressed)                                    | ❌ (Not addressed)                                                          | ✅ (Core focus)                                                  |

  **Key Insights from the List & Scoring**

  1.  **The "Borderline Case Killer":** Desideratum 3 (Borderline Cases) does the most damage to popular candidates.
      *   **Metabolism:** Fails catastrophically on viruses, viroids, prions, and struggles with dormancy.
      *   **Evolution:** Fails on sterile hybrids and struggles with viruses (are they part of evolution?) and dormancy.
      *   **Information:** Handles viruses/viroids well but struggles with prions (no coding), sterile hybrids, and dormancy. Is "replication" sufficient? (Crystals replicate).
      *   **Autopoiesis:** Fails on viruses and struggles to define individuals in obligate symbiosis or dormancy.
      *   **No single definition handles all borderline cases cleanly.** This is the core challenge.

  2.  **The Fundamental Tension:** Desiderata 2 (Include All Life - persistence) and 5 (Evolution - change) create a deep tension embodied in the sterile hybrid (mule) problem. An entity can be paradigmatically *alive* (persisting, metabolizing, responding) while being evolutionarily *dead* (no potential for contributing to future generations via heredity). **No definition perfectly satisfies both the requirement to include viable-but-sterile organisms and the requirement to be consistent with the centrality of evolution simultaneously.** Evolutionary definitions sacrifice 2; most others sacrifice the centrality of evolution as *definitive* for the individual (though they accept it as a *consequence* or population-level phenomenon). This suggests a potential **category error** – perhaps "being alive" is a property of *individuals* at a given time, while "being capable of evolving" is a property of *lineages* over time. Reconciling these levels is difficult.

  3.  **Dormancy is a Persistent Thorn:** All definitions struggle conceptually with cryptobiosis and similar states where metabolism is undetectable but revival is possible. Does "potential" matter? How is it defined? This challenges the "at a given time" aspect of definitions.

  4.  **Universality vs. Specificity:** Approaches focusing on processes (Evolution, Information) or organization (Autopoiesis) score better on universality than metabolism, which is tied to chemistry. However, the more universal definitions often have more trouble with false positives and borderline cases on Earth.

  5.  **The List as a Result:** The inability of any single definition to satisfy *all* desiderata cleanly, particularly the tension between individual persistence (metabolism/organization) and lineage evolution, and the persistent ambiguity of borderline cases, **is itself a significant philosophical result.** It suggests that:
      *   Life might be a **cluster concept** without necessary and sufficient conditions.
      *   There might be **different valid perspectives** (e.g., physiological vs. evolutionary) that yield different but complementary definitions.
      *   The boundary between life and non-life might be inherently **fuzzy**, reflecting a continuous transition in complexity or historical contingency.
      *   "Life" might not be a fundamental natural kind, but a **pragmatic category** useful in specific contexts.

  **Conclusion for Teaching:** Presenting this list of desiderata prepares students to critically evaluate definitions not just on their surface appeal, but on how they handle the hard cases and core tensions inherent in biology. Highlighting the conflict between persistence and evolution (Desiderata 2 vs. 5) and the persistent challenge of borderline cases (Desideratum 3) frames the debate as more than just finding the "right words," but as grappling with deep conceptual and empirical puzzles about the nature of biological systems. This sets the stage perfectly for the standard readings.
