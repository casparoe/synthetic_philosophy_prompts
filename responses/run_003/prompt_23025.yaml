answer: |-
  Here’s a toast that honors the transformative journey Nora is about to undertake, weaving in the core idea sincerely while keeping it warm, accessible, and celebratory:

  **(Clink glass gently)**

  "Friends, family... wonderful people gathered here tonight for Nora. We’re here to celebrate her, to raise a glass before she embarks on one of life’s greatest, most profound adventures: becoming a mother next week.

  Now, I’m a software engineer. My world runs on logic, probabilities, and estimating outcomes. You give me inputs, I try to predict the outputs. But sitting down to think about what to say tonight, about Nora stepping into motherhood... well, my usual algorithms failed.

  And that’s because of something powerful someone here helped me understand: **this decision Nora made isn't just life-changing, it's world-building.** It’s one of those rare choices where the *real evidence* – the actual, lived understanding of what it *means* – only shows up *after* you’ve already committed. You can read all the books, talk to all the parents, try to imagine... but until that baby is in your arms, until you’re living those moments day and night, you simply cannot know what it’s truly like. It’s knowledge you earn only by doing it.

  That means something remarkable about the Nora we’re celebrating tonight. **The Nora sitting here, the one we all know and love, is about to become someone new.** She’s stepping into an experience that will fundamentally reshape her understanding, her priorities, her very self, in ways none of us – not even Nora herself – can fully predict right now. She’s becoming a version of Nora who *knows* what only a parent can know.

  And that’s not a scary thing; it’s an incredibly brave thing. It’s stepping into the unknown, not just with hope, but with profound courage. It’s trusting that the person she becomes *on the other side* of this transformation will be equipped to handle it, love it, grow with it, whatever shape it takes.

  So tonight, we’re not just celebrating the Nora we know. We’re also celebrating the incredible leap of faith she’s taking. We’re celebrating the strength it takes to willingly become someone new, someone whose depths and capacities are still unfolding.

  Nora, we love the woman you are tonight. And we are in awe of the woman you are becoming. We don’t pretend to know exactly what lies ahead for you, or precisely who you’ll be in six months, but we do know this: **We are here for you.** We are here to support the journey, to marvel at the transformation, and to love you – and that amazing little person arriving soon – through every single unpredictable, transformative moment.

  So please raise your glasses with me: To Nora! To the incredible journey ahead, to the strength she carries into it, and to the wonderful, unknowable, transformative adventure of becoming a mother. Cheers to you, Nora!"

  **Why this works:**

  1.  **Honors the Concept:** Directly addresses the "evidence only after the fact" and the "becoming someone new" ideas without jargon. Uses accessible language: "world-building," "real evidence," "knowledge you earn only by doing it," "reshape her understanding," "become someone new," "depths and capacities still unfolding."
  2.  **Avoids Morbidity/Lecturing:** Frames the transformation positively as "brave," "remarkable," "strength," "profound courage," and an "adventure." It's celebratory, not analytical. Keeps it personal and focused on Nora.
  3.  **No Promises About Feelings:** Explicitly says "whatever shape it takes" and avoids saying *how* she'll feel (happy, tired, fulfilled, challenged). Focuses on the *process* of transformation and the *courage* involved.
  4.  **Connects to the User:** Starts with the engineer perspective ("algorithms failed") making the philosophical point feel organic and personal.
  5.  **Includes the Group:** Emphasizes collective support ("We are here for you," "love you through every... moment"). Grounds the abstract idea in community.
  6.  **Acknowledges the Present Nora:** Explicitly celebrates the Nora *now* ("love the woman you are tonight") while honoring the future one.
  7.  **The PhD Student Nod:** The core ideas are clearly Paul's transformative experience, especially the epistemic aspect ("knowledge you earn only by doing it"). Phrases like "fundamentally reshape her understanding" and "unknowable... adventure" capture the essence. They'll recognize it.
  8.  **Toast Structure:** Classic opening/closing, personal reflection, tribute to the honoree, positive sentiment, call for a cheer. Fits the three-minute window.

  This toast acknowledges the profound, unpredictable shift honestly while keeping the focus firmly on celebration, courage, and community support. Good luck!
