  - **Solvability (Round 3):** 0.001 BU per dollar  

  **Cause Card 4: Deworming Programs**  
  *Description: Treating parasitic worm infections in children to improve school attendance and long-term outcomes.*  
  - **Scale (Round 1):** 40 million BU  
  - **Current Funding (Round 2):** $60 million per year  
  - **Solvability (Round 3):** 0.4 BU per dollar  

  Budget per group: $100 million.

  Materials: 
  - For each group: a worksheet for each round to record allocations.
  - Cause cards (initially with only the description and scale; then add current funding for round 2; then add solvability for round 3).

  Procedure:

  1. Divide into groups of 3-4 students.
  2. Explain: "You are a foundation with $100 million to allocate among these four causes. Your goal is to maximize your expected positive impact. In each round, you will get more information. You have 5 minutes per round to discuss and allocate."
  3. Round 1: Hand out Cause Cards with only the description and scale. Groups allocate and record.
  4. Collect Round 1 allocations and then hand out updated Cause Cards that include current funding. Groups can reallocate (they can change their allocation completely).
  5. Collect Round 2 allocations and then hand out the final Cause Cards with solvability. Groups make final allocation.
  6. Collect final allocations.
  7. Facilitator computes the total impact for each group and announces the winner.
  8. Debrief as described.

  Debrief script:

  "Let's see what happened. In round 1, most groups probably allocated heavily to AI Safety and Climate Change because of their large scales. Then in round 2, you saw that Climate Change and Malaria have very high current funding, so you might have shifted to AI Safety because it's big and neglected. Then in round 3, you saw that AI Safety has very low solvability, so many of you shifted to Deworming, which has high solvability and is relatively neglected. This mirrors the importance-tractability-neglectedness framework. 

  The impact per dollar is approximately: Importance (scale) * Tractability (solvability) * Neglectedness (1/(current funding+1)). 

  Notice that even though Deworming has the smallest scale, its high tractability and neglectedness made it the most cost-effective. The framework multiplies these factors, so if any one is near zero, the product is near zero. 

  But remember, in the real world:
  - These numbers are highly uncertain.
  - We must consider if the BU unit is comparable across causes (e.g., is a BU in climate change the same as in deworming?).
  - There are dynamic effects and interactions.

  Can anyone articulate what they learned about resource allocation in this context?"

  Finally, note that the activity might take 30-40 minutes (3 rounds of 5 minutes each, plus setup and debrief). Adjust as needed.
answer: |-
  Below is a comprehensive design for your in-class activity. It uses a multi-round resource allocation game to help students discover the importance–tractability–neglectedness (ITN) framework experientially. The activity is structured to last 45–60 minutes, fitting within your 90-minute session.

  ---

  ### **Activity Design: "Impact Multipliers"**

  #### **Overview**
  - **Groups:** 4–5 small groups (foundations), each with 3–4 students.
  - **Budget:** $100 million per group to allocate across 4 cause areas.
  - **Rounds:** 3 rounds (10 minutes each) with new information revealed sequentially.
  - **Goal:** Maximize "expected impact" (EI) via a scoring formula revealed only at the end.
  - **Key Insight:** Students should realize that **EI = Scale × Solvability × (1 / Current Funding)**—a multiplicative interaction.

  ---

  ### **Cause-Area Profiles**
  Each cause area has a **scale** (importance, in "Benefit Units" or BU), **solvability** (tractability, probability of impact per dollar), and **current funding** (neglectedness, in $ millions). BU represent a standardized measure of averted suffering (e.g., 1 BU = 1 year of healthy life gained).  
  *Cards reveal information progressively (only bolded info is visible per round):*

  | Cause Area               | Round 1 (Scale)                                                                 | Round 2 (+ Current Funding)                                  | Round 3 (+ Solvability)                                      |
  |--------------------------|---------------------------------------------------------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|
  | **Climate Refugees**     | Scale: **100M BU**<br>*Description: Coastal flooding displaces 10M people/year.* | Current Funding: **$800M**<br>(Highly funded by governments) | Solvability: **0.0001**<br>*Low: Geopolitical barriers limit solutions.* |  
  | **AI Misalignment**      | Scale: **1,000M BU**<br>*Description: AI systems could cause catastrophic harm this century.* | Current Funding: **$20M**<br>(Underfunded; few technical experts) | Solvability: **0.00001**<br>*Very low: Uncertain interventions, high research risk.* |  
  | **Malaria in Congo**     | Scale: **50M BU**<br>*Description: 200K annual deaths; affects children under 5.* | Current Funding: **$500M**<br>(Moderate funding from NGOs/states) | Solvability: **0.02**<br>*High: Bed nets and vaccines are proven.* |  
  | **Factory Farming Reform** | Scale: **20M BU**<br>*Description: Reduces suffering of 50B factory-farmed animals/year.* | Current Funding: **$10M**<br>(Severely neglected; minimal advocacy) | Solvability: **0.05**<br>*Very high: Policy campaigns have high success rates.* |  

  **Notes:**  
  - **Scale** reflects total annual burden if unaddressed (e.g., 1,000M BU for AI = high stakes but low probability).  
  - **Solvability** is the expected BU averted per dollar (e.g., 0.05 = $20 averts 1 BU).  
  - **Current Funding** is annual spending by others. Low funding = high neglectedness.  
  - **Deliberate imbalance:**  
    - *AI Misalignment* has high scale and neglectedness but low solvability.  
    - *Factory Farming* has low scale but high solvability and neglectedness.  
    - *Malaria* is moderate but loses to Factory Farming multiplicatively.  

  ---

  ### **Rules & Sequence**
  **Setup (5 min):**  
  - Form groups. Give each a $100M budget and **Round 1 cards** (scale + description only).  
  - **Instructions:** *"Allocate your budget to maximize impact. You’ll revise twice as new info arrives."*  

  #### **Round 1: Scale (Importance)**  
  - **Info:** Scale (BU) only.  
  - **Predicted Behavior:** Groups allocate heavily to high-scale causes (AI Misalignment, Climate Refugees).  
  - **Debrief Prep:** *"Why did you prioritize scale? What’s missing?"*  

  #### **Round 2: Current Funding (Neglectedness)**  
  - **Info:** Reveal current funding. Groups reallocate.  
  - **Key Insight:** Marginal impact diminishes with existing funding (e.g., $1 to AI does more than $1 to Climate Refugees).  
  - **Predicted Behavior:** Groups shift funds to neglected causes (AI Misalignment, Factory Farming).  

  #### **Round 3: Solvability (Tractability)**  
  - **Info:** Reveal solvability. Groups finalize allocations.  
  - **Key Insight:** High scale/neglectedness means nothing if solvability is near-zero (e.g., AI Misalignment).  
  - **Predicted Behavior:** Groups pivot to high-solvability causes (Factory Farming, Malaria).  

  ---

  ### **Scoring & Winning**  
  - **Formula:**  
    **EI = Σ [ Allocation × Scale × Solvability × (1 / (Current Funding + 1)) ]**  
    *(The "+1" avoids division by zero; assumes your funding is marginal.)*  
  - **Example Calculation for Factory Farming:**  
    $100M × 20M BU × 0.05 × (1 / ($10M + 1)) ≈ **90,909 BU**  
  - **Winner:** Group with highest EI.  

  ---

  ### **Debrief Script (15–20 min)**  
  **Goal:** Connect rounds to ITN, reveal multiplicative logic, and discuss limitations.  

  1. **Round 1 Reflection (Importance):**  
     - *"In Round 1, you saw scale. Everyone funded big, salient problems—like AI or climate. But impact isn’t just about scale. What happened next?"*  
     - **Key Point:** Scale alone is misleading if others are already working on it.  

  2. **Round 2 Reflection (Neglectedness):**  
     - *"In Round 2, you learned about current funding. Many shifted to uncrowded causes like AI or factory farming. Why? Because marginal impact depends on how many others are there."*  
     - **Key Point:** Neglectedness = leverage. Funding matters most where it’s scarce.  

  3. **Round 3 Reflection (Tractability):**  
     - *"In Round 3, solvability revealed that some 'big, ignored' problems (e.g., AI) were intractable. You pivoted to causes like factory farming—smaller scale but high solvability and neglectedness. Why?"*  
     - **Key Point:** Tractability = feasibility. No impact if you can’t move the needle.  

  4. **The Multiplicative Insight:**  
     - Show the scoring formula: **EI ∝ Scale × Solvability × (1 / Funding)**.  
     - *"Notice these multiply, not add. If solvability is near-zero (like AI), the whole product collapses. High scale can’t save it. This is why we look for the *product* of all three."*  
     - Ask: *"Did anyone say something like, 'We need big, solvable, ignored problems'? That’s the ITN framework!"*  

  5. **Limitations & Real-World Complexity:**  
     - **Uncertainty:** *"The game gave you clean numbers. Reality is messier—all three parameters involve guesswork and disagreement."*  
     - **Commensurability:** *"We treated BU as comparable across causes. But is a human BU equal to an animal BU? Is future risk = present suffering? These are ethical choices."*  
     - **Dynamics:** *"Real funding changes the world (e.g., success attracts others). The game is static."*  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Fixation on a Single Criterion:**  
     - *E.g., A group refuses to shift from AI after Round 1, ignoring neglectedness/solvability.*  
     - **Mitigation:** Gently challenge: *"If solvability is 0.00001, will $100M move the needle? Should neglectedness affect your leverage?"*  

  2. **"Gaming" the Scoring Rule:**  
     - *Groups treat EI as a math puzzle, not a learning tool.*  
     - **Mitigation:** Hide the formula until the debrief. Emphasize reasoning: *"Explain why you reallocated, not just how."*  

  3. **Obvious "Winner" Cause:**  
     - *Factory Farming’s high solvability/neglectedness may dominate early.*  
     - **Mitigation:** If groups guess prematurely, ask: *"Would you have prioritized this without seeing all three rounds? Why/why not?"*  

  4. **Facilitator Naming ITN Too Early:**  
     - *Risk of spoiling the discovery.*  
     - **Mitigation:** Use Socratic questions: *"What’s missing from your framework?"* If a student says "solvable" or "ignored," amplify their language.  

  ---

  ### **What the Activity Cannot Capture**  
  - **Uncertainty:** Real ITN parameters are estimated with error bars (e.g., "AI solvability could be 0.0001 or 0.000001").  
  - **Value Differences:** Comparing animal welfare (Factory Farming) to human health (Malaria) involves moral weights, not just BU.  
  - **Interdependence:** Solving one cause may affect others (e.g., climate work reduces refugee crises).  
  - **Advocacy Effects:** Funding can draw attention, increasing future funding (not modeled in scoring).  

  **Final Tip:** Run a dry test with colleagues to refine timing. Use physical cards for engagement, and appoint a "scribe" per group to track reasoning. By Round 3, >80% of groups should converge on Factory Farming—letting you unveil ITN as *their* discovery.
