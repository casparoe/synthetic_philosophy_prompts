     B) 33%  
     C) 67%  

  5. **Quantum Gambit**  
     You join an experiment where a quantum device has a 50% chance to end your life each second. You survive 60 seconds. How surprised are you?  
     A) Not surprised—in a multiverse, I must be in a branch where I survive.  
     B) Very surprised—the odds were 1 in 2⁶⁰.  

  6. **Parallel Selves**  
     The universe has a 50% chance of containing 1 copy of you, and 50% chance of containing 1,000 identical copies (on different planets). What’s the probability you’re the only copy?  
     A) 50%  
     B) ≈0.1%  

  7. **Doomsday Clue**  
     Humanity has a 50% chance of a short future (200 total humans) and 50% chance of a long future (200,000 humans). You’re the 100th human. A psychic reveals: *If the long future is real, you’re guaranteed to be among the first 200 humans*. How does this affect the probability of a short future?  
     A) Increases it  
     B) Decreases it  
     C) Doesn’t change it  

  8. **Biased Comet**  
     Same as Question 1, but the coin is biased: 67% chance of heads, 33% of tails. You wake up. What’s the probability of heads?  
     A) 67%  
     B) 50%  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a school of anthropic reasoning. Each school’s "uncomfortable commitment" highlights its most debated implication.

  #### 1. **The Cosmic Archivist** (Self-Sampling Assumption - SSA)  
     **What it means:** You reason as if you’re a random observer from all possible observers in your reference class (e.g., all humans). Your existence isn’t evidence the universe is large; it’s just a data point about your place in it.  
     **Uncomfortable commitment:** In *Humanity’s Fate*, you must accept a 99.9% chance of doom simply because you were born "early."  
     **Answer pattern:**  
     - Q1: B | Q2: B | Q4: B | Q7: B  

  #### 2. **The Multiverse Magnifier** (Self-Indication Assumption - SIA)  
     **What it means:** Your existence is evidence the universe has many observers. More observers = more chances for "you" to exist, so you favor theories where more people exist.  
     **Uncomfortable commitment:** In *Alien Civilizations*, you’re virtually certain the universe contains a trillion observers—even without direct evidence.  
     **Answer pattern:**  
     - Q2: C | Q3: B | Q7: C  

  #### 3. **The Grounded Skeptic** (Ordinary Bayesian)  
     **What it means:** Anthropic reasoning needs no special rules. Just update beliefs normally when you learn you exist. Indexical facts (e.g., birth order) rarely matter.  
     **Uncomfortable commitment:** In *Parallel Selves*, you insist your existence doesn’t make a 1,000-copy universe more likely.  
     **Answer pattern:**  
     - Q1: A | Q2: A | Q6: A | Q8: A  

  #### 4. **The Subjective Anchor** (SSA with Egocentric Reference Class)  
     **What it means:** Your reference class is your exact subjective state. You only care about observers indistinguishable from "you right now."  
     **Uncomfortable commitment:** In *Quantum Gambit*, surviving 60 near-death trials doesn’t surprise you—you only experience branches where you live.  
     **Answer pattern:**  
     - Q4: A | Q5: A  

  ---

  ### Positions This Quiz *Can’t* Reliably Separate  
  - **SSA vs. SIA in Sleeping Beauty/Comet scenarios:** Both often agree (e.g., Q1 and Q8 yield B for both). They diverge in observer-counting puzzles like *Alien Civilizations* (Q3) or *Humanity’s Fate* (Q2).  
  - **Ordinary Bayesian vs. Egocentric SSA in duplication cases:** Both give similar answers for *Parallel Selves* (Q6) and *Twin Rooms* (Q4). They split on indexical puzzles like *Quantum Gambit* (Q5), where the latter denies surprise.  

  **Why?** Some principles align on specific puzzles but clash on others. For instance, SSA and SIA both weight observer counts but interpret "random sampling" differently when combined with birth-rank data (Q7). The quiz prioritizes clean splits via high-stakes cases like doomsday and multiverses.
