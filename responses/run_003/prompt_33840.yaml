  First, I should consider the core functions of consent across different contexts. In sexual ethics, it's about bodily autonomy and preventing harm. Medical ethics focuses on patient autonomy versus beneficence. Contract law emphasizes transactional clarity and reliance. These domains have overlapping but distinct needs.

  For the desiderata, I'll need to include: 
  - The requirement for voluntariness (no coercion/undue influence) with cases like sexual assault or coerced medical decisions. 
  - Capacity assessment with cases like minors in sexual contexts or dementia patients in medical settings. 
  - Communication standards - how consent is expressed differently across domains. 
  - Scope/specificity issues - what exactly is being consented to. 
  - Revocability with examples from sexual encounters and medical trials. 
  - Epistemic access requirement - understanding what you're consenting to. 
  - Moral transformation - how consent changes normative status. 
  - Domain-specific needs like documentation in contracts or relational context in sexual ethics.

  I notice tensions between some requirements. For example, subjective mental states vs objective communication - this is a classic conflict in consent theory. Also, flexibility in sexual contexts vs precision in contracts creates friction. And epistemic demands might conflict with practical real-world constraints.

  The requirement that eliminates many popular theories seems to be the epistemic access condition. Mental-state theories fail because people often consent without full understanding. Performative/communicative theories don't require actual comprehension. Hybrid views struggle with the gap between expressed consent and real understanding. Medical cases like complex procedures or clinical trials really expose this weakness.

  I'll structure this with clear desiderata, concrete cases for each, domain comparisons where relevant, conflict flags, and that key eliminative requirement. The user seems philosophically sophisticated - they're looking for a rigorous framework to evaluate theories, so precision is important. I'll use American English throughout as requested.
answer: |-
  Here are the core desiderata for any adequate theory of consent, incorporating cases from sexual and medical ethics, highlighting domain divergences, flagging tensions, and identifying the key eliminative requirement:

  **Core Desiderata for a Theory of Consent:**

  1.  **Voluntariness:** The theory must distinguish consensual acts from those performed under coercion, undue influence, or overwhelming pressure that vitiates free choice.
      *   **Case/Consideration:** Sexual encounter where one party threatens job loss ("quid pro quo" harassment). Medical decision where a patient agrees to an experimental drug only because their desperate family pressures them, overriding their own doubts. Contract signed under explicit duress (e.g., "sign or I break your legs").
      *   **Domain Note:** Sexual ethics often requires *absence of even subtle coercion* due to the intimacy and vulnerability involved. Medical ethics focuses on *undue influence* (e.g., from doctors or family). Contract law typically requires *more extreme duress* to invalidate.

  2.  **Capacity/Competence:** The theory must identify who has the cognitive and volitional ability to give valid consent and respect distinctions based on incapacity (temporary or permanent).
      *   **Case/Consideration:** Sexual activity with someone severely intoxicated or suffering from advanced dementia cannot be consensual. Medical treatment of a minor generally requires parental consent (except specific emancipated/minor mature doctrines). A contract signed by someone in a manic episode may be voidable.
      *   **Domain Note:** Medical ethics has highly developed standards for assessing decisional capacity for specific choices (understanding, appreciation, reasoning, communication). Sexual ethics often relies on broader proxies like intoxication level. Contract law uses doctrines like mental incapacity but often focuses on transactional understanding.

  3.  **Communication/Expression:** The theory must specify how consent must be manifested or communicated to be valid and binding.
      *   **Case/Consideration:** Sexual ethics increasingly emphasizes *affirmative, ongoing* communication ("enthusiastic yes") rather than mere absence of "no". Medical ethics requires documented informed consent conversations. Contract law requires a "meeting of the minds," typically formalized in writing or clear verbal agreement (Statute of Frauds for certain types).
      *   **Domain Note:** Sexual consent prioritizes *relational, contextual communication* (often non-verbal cues followed by explicit verbal confirmation). Medical consent prioritizes *structured disclosure and documented confirmation*. Contract law prioritizes *objective manifestations* of assent (signature, clickwrap).

  4.  **Scope & Specificity:** The theory must ensure consent is given for the *specific act* in question and respect limits on scope (e.g., consent to X is not consent to Y).
      *   **Case/Consideration:** Consenting to vaginal sex does not imply consent to anal sex. Consenting to a tonsillectomy does not imply consent to an appendectomy discovered during surgery. Agreeing to deliver "widgets" does not cover delivering "gadgets" in a contract.
      *   **Domain Note:** Sexual ethics demands *high specificity* due to bodily integrity. Medical ethics requires specific consent for each *procedure* or significant deviation. Contract law enforces the *four corners of the agreement* but allows interpretation within bounds.

  5.  **Revocability:** The theory must recognize that consent can be withdrawn at any time before or during the act, and this withdrawal must be respected.
      *   **Case/Consideration:** A sexual partner saying "stop" during intercourse must be obeyed immediately. A patient can withdraw from a clinical trial at any point. A party cannot typically revoke a contract after full performance has begun without penalty, unless termination clauses exist.
      *   **Domain Note:** Sexual ethics views revocability as *absolute and immediate* during the act. Medical ethics strongly affirms the right to withdraw from *ongoing treatment or research*. Contract law heavily restricts revocability post-formation to protect reliance and enforce bargains (*fundamental divergence*).

  6.  **Epistemic Access (Understanding):** The theory must require that the consenting party possesses sufficient understanding of the nature, consequences, and material risks of the act they are consenting to.
      *   **Case/Consideration:** Medical informed consent requires disclosure of risks, benefits, and alternatives. A sexual partner must understand the basic nature of the sexual act proposed. Signing a complex contract without reading or understanding key terms may render it voidable for fraud or unconscionability.
      *   **Domain Note:** Medical ethics has the *most rigorous standard* for understanding (detailed disclosure). Sexual ethics requires understanding the *fundamental nature* of the act. Contract law often employs an *objective standard* ("reasonable person" understanding), though fraud or misrepresentation can void.

  7.  **Moral Transformation:** The theory must explain *how* valid consent morally transforms an otherwise wrongful act (e.g., trespass, battery, breach) into a permissible one.
      *   **Case/Consideration:** Sexual contact without consent is battery; with consent, it is permissible intimacy. Surgery without consent is battery; with consent, it is treatment. Using someone's property without consent may be trespass/conversion; with consent (a license/contract), it is permissible.
      *   **Consideration:** This is the core *function* of consent – altering normative status. The theory must provide a plausible mechanism (waiver, permission, joint commitment).

  8.  **Domain-Specific Functions:** The theory must accommodate the core functions consent serves in different domains.
      *   **Sexual Ethics:** Protect bodily autonomy, prevent harm/assault, foster relational respect.
      *   **Medical Ethics:** Respect patient autonomy, enable beneficence within patient-defined limits, facilitate trust.
      *   **Contract Law:** Enforce promises, promote reliance and economic efficiency, allocate risk.

  **Flagged Tensions Between Desiderata:**

  1.  **Subjective Mental State vs. Objective Communication (Tension between 2, 6 & 3):**
      *   **Tension:** Requiring true *subjective understanding and intent* (Desiderata 2 & 6) is crucial for genuine autonomy but is often impossible to verify. Relying solely on *objective communication* (Desideratum 3) ensures reliability and fairness to the other party but risks validating consent where there was internal misunderstanding, confusion, or unexpressed reluctance ("I said yes but was terrified inside"). A theory emphasizing one may struggle to fully satisfy the other.
      *   **Case Highlight:** A patient nods and signs a complex surgery form (objective communication) but is overwhelmed and doesn't grasp a key risk (lack of subjective understanding). Is consent valid?

  2.  **Flexibility/Contextual Sensitivity vs. Precision/Reliability (Tension within 3 & 4):**
      *   **Tension:** Sexual ethics often demands context-sensitive, relational, and flexible communication (reading body language, ongoing affirmation - Desiderata 3 & 4). Medical ethics and especially Contract Law demand greater precision, clarity, and formal documentation to ensure reliability and prevent disputes (Desiderata 3 & 4). A theory heavily optimized for one domain's needs (e.g., sexual ethics' flexibility) may struggle in another (e.g., contract law's need for clear terms).
      *   **Case Highlight:** Is "implied consent" based on prior relationship and context sufficient in a sexual encounter (flexibility)? Would it ever be sufficient for a major medical procedure or a binding contract (needing precision)?

  3.  **Epistemic Demands vs. Practical Feasibility (Tension with 6):**
      *   **Tension:** Truly comprehensive understanding (Desideratum 6) is often an ideal, unattainable in complex situations (e.g., intricate medical procedures, highly technical contracts). Theories must balance the ideal of full understanding against the practical reality of human cognition and the need for decisions to be made. Setting the bar too high makes valid consent impossible; setting it too low undermines autonomy.
      *   **Case Highlight:** Can a patient *truly* understand all the statistical probabilities and nuanced biochemical interactions involved in a novel cancer treatment? How much understanding is "sufficient"?

  **The Eliminative Requirement: Epistemic Access (Understanding - #6)**

  *   **Requirement:** The theory must require that the consenting party possesses sufficient understanding of the nature, consequences, and material risks of the act.
  *   **Theories Eliminated (or Severely Challenged):**
      *   **Pure Mental-State Accounts:** Focus *only* on the internal mental state (e.g., "I desire this"). They fail because one can have a desire *without understanding* what it entails (e.g., agreeing to sex without understanding STI risks; signing a contract without grasping a hidden penalty clause). Desire ≠ Understanding.
      *   **Pure Performative/Communicative Accounts:** Focus *only* on the outward expression (e.g., saying "yes", signing a form). They fail because one can communicate assent *without understanding* (e.g., the patient signing the form they didn't read/comprehend; someone saying "yes" to sex while severely intoxicated and unable to process the situation). Expression ≠ Understanding.
      *   **Hybrid Views (if they sideline understanding):** Hybrids combining mental state and communication *still fail* if they don't incorporate a robust requirement for actual understanding. A hybrid could validate consent based on a communicated desire, even if that desire was formed in ignorance of critical facts.
  *   **Justification:** This requirement exposes the core weakness of these popular families. Consent, to be morally transformative (Desideratum 7), must be an *informed* authorization. Without understanding what one is authorizing, the "consent" is hollow – it doesn't reflect genuine autonomous choice about the specific act and its implications. Cases demanding informed consent (complex medical decisions, contracts with fine print, sexual acts with potential consequences) starkly reveal that neither a purely internal feeling nor an external signal, alone or even combined without an epistemic condition, guarantees that the person truly knows what they are agreeing *to*. A valid theory *must* account for the cognitive grasp of the object of consent.
