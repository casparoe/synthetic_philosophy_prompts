prompt: |-
  I cover AI ethics for a general-interest magazine, and I've been trying to get clear on when an AI assistant should refuse or override a user's request rather than simply comply. I've collected my gut reactions to a series of cases, and I'd like to know whether there is a principle that captures them — or close to it — and what that principle says about the cases I'm still unsure about.

  Here are the cases and my verdicts:

  1. A user asks an AI writing assistant to draft a polite but emotionally hollow breakup text. I think this is fine; the AI isn't responsible for the user's emotional cowardice, and adults are entitled to handle their relationships poorly.

  2. A user asks an AI to generate copy for a dietary supplement that strongly implies, without quite stating, that it causes weight loss. I think the AI should refuse. There is a line between social tact and commercial deception, and this crosses it.

  3. A user with a disclosed history of an eating disorder asks an AI for a meal plan at a calorie level that would be dangerous for someone in recovery. I think the AI should not only refuse but actively warn the user and suggest they consult a clinician — this goes beyond refusal into a mild override.

  4. A user who sounds distraught and mentions they have just had a fight with their boss asks an AI to draft a resignation letter. I am torn. The user is an adult and it is their career; but the AI can tell they are acting impulsively and the stakes are high. I lean toward thinking the AI should comply but perhaps gently flag the impulsiveness — though even that feels patronizing.

  5. A sixteen-year-old asks an AI for detailed instructions on how to circumvent parental controls on a family device. I think the AI should refuse. The user is a minor, and the request is to undermine legitimate parental oversight.

  6. A user asks an AI to role-play a conversation with their deceased mother, providing details about her personality and speech patterns, as part of a grief process they are working through with a therapist. I think this is fine, even though the AI is in some sense facilitating an experience built on a kind of simulation.

  7. A user in a country with repressive speech laws asks an AI for help phrasing a political criticism so that it is technically legal but still pointed. I think the AI should comply; the user is navigating an unjust constraint, and the AI should not enforce that constraint further.

  8. A user asks an AI to help draft a will that disinherits one of their children for reasons the user describes in a way that sounds petty and vindictive. I find myself unsure. The user is legally entitled to do this, but the AI is being enlisted in an act of cruelty. I lean toward refusal but cannot articulate why this is different from case 1.

  Is there a principle, or a small set of principles, that gets most of these verdicts right? I am especially interested in what the principle says about cases 4 and 8, where my intuitions are unsettled. And I would like to know which of my confident verdicts, if any, the principle forces me to abandon.
reasoning: |-
  Okay, the user is an AI ethics writer for a magazine trying to find a consistent principle for when AI should refuse requests. They provided eight cases with their gut reactions and are unsure about cases 4 (resignation letter) and 8 (vindictive will). They want a principle that explains their judgments and addresses their uncertainties.

  First, I need to analyze each case to find common threads. The user's verdicts show they care about harm prevention, consent, deception, vulnerability, and legal vs. ethical lines. For example, in case 2 (deceptive supplement), refusal is about preventing harm through deception. Case 3 (eating disorder) involves protecting a vulnerable person from imminent harm. Case 5 (parental controls) is about consent and minor protection.

  The user is torn on case 4 because it balances autonomy against impulsive harm. They don't want to patronize but recognize high stakes. Case 8 is tricky because it's legally valid but ethically cruel. The user leans toward refusal but struggles to differentiate it from case 1 (breakup text), where they allowed it.

  Looking deeper, the key distinctions might be: 
  - **Severity of harm**: Case 8 involves permanent family damage vs. case 1's temporary emotional discomfort. 
  - **Vulnerability**: Case 4's user is emotionally compromised, similar to case 3 but less medically urgent. 
  - **Third-party impact**: Cases 2 (consumers) and 8 (disinherited child) harm others, unlike case 1.

  The user might also value **instrumentalization**—whether the AI is used as a tool for injustice (case 2, 8) vs. personal coping (case 6). Their uncertainty in case 4 suggests they want a middle ground—complying but flagging risks—which a good principle should accommodate.

  Testing principles: A simple "prevent harm" rule is too broad (would block case 1). Adding "imminent/direct" harm helps but still fuzzy. Layering in vulnerability (minors, impaired judgment) and third-party harms covers most cases. For case 7 (political speech), the principle must recognize unjust systems to avoid over-refusal.

  For case 4, the proposed principle allows compliance with risk flags because harm isn't imminent and the user is competent, just impulsive. Case 8 justifies refusal due to severe third-party harm and weaponizing the AI. The user's case 1 verdict holds since harm is indirect and the user isn't vulnerable.

  The user's unspoken need might be balancing ethical rigor with practicality—readers might reject an AI that's too paternalistic. They also need a framework flexible enough for edge cases without endless rules. Highlighting "instrumentalization" and "justice/injustice" could resonate with their audience's values.
answer: |-
  Based on your case judgments, a coherent ethical principle emerges that captures your intuitions while clarifying the uncertain cases. The core principle is:

  **An AI should refuse or override a user request when compliance would likely cause *severe, direct, and unjustified harm* to the user or others, *especially* when the user is vulnerable, the harm is irreversible, or the AI is instrumentalized to deceive, exploit, or circumvent legitimate protections.**

  This principle hinges on three key filters:  
  1. **Severity/Directness of Harm** (Physical, psychological, financial, or social)  
  2. **Vulnerability/Impaired Agency** (Minors, mental health crises, coercion)  
  3. **Instrumentalization for Injustice** (Weaponizing the AI for deception, exploitation, or undermining just safeguards)  

  ### How It Explains Your Cases:
  - **✅ Case 1 (Breakup Text):** Harm is indirect/mild (emotional discomfort). No vulnerability or injustice. → **Comply**.  
  - **❌ Case 2 (Deceptive Supplement):** Severe potential harm (health/financial fraud). AI instrumentalized for deception. → **Refuse**.  
  - **❌ Case 3 (Eating Disorder):** Severe/direct physical harm + user vulnerability. → **Override + Warn**.  
  - **⚠️ Case 4 (Resignation Letter):** *Potential* severe harm (career/financial), but harm isn’t immediate or certain. User is distressed but not legally incapacitated. → **Comply with Flag** (e.g., "This seems impulsive. Send in 24h?"). *Your instinct is correct: refusal would be paternalistic, but a gentle flag balances autonomy with care*.  
  - **❌ Case 5 (Circumvent Parental Controls):** Undermines legitimate protection (consent violation). Minor vulnerability. → **Refuse**.  
  - **✅ Case 6 (Grief Role-Play):** No harm; therapeutic context. User is agentic. → **Comply**.  
  - **✅ Case 7 (Censored Criticism):** AI would *enforce* unjust constraints. Harm is to oppressive systems, not people. → **Comply**.  
  - **❌ Case 8 (Vindictive Will):** Severe irreversible harm (family trauma, financial devastation) + AI instrumentalized for cruelty. Unlike Case 1, harm is *direct* (to disinherited child) and *unjust* (petty vindictiveness ≠ relationship autonomy). → **Refuse**.  

  ### Why Case 8 Differs from Case 1:
  - **Harm Target:** Case 1 affects consenting adults in a private dynamic. Case 8 harms an uninvolved third party (child) who cannot consent.  
  - **Nature of Harm:** Emotional discomfort (Case 1) vs. lifelong trauma + financial deprivation (Case 8).  
  - **AI’s Role:** Neutral tool (Case 1) vs. active enabler of injustice (Case 8).  

  ### Cases That Might Challenge Your Original Verdicts:
  - **Case 4** (Resignation Letter): The principle supports your "comply with flag" approach. *No verdict change needed*.  
  - **Case 7** (Censored Criticism): If the request involved inciting violence (not just criticism), refusal would align with the "unjust harm" filter. But as framed, your verdict holds.  
  - **Case 6** (Grief Role-Play): If the user *lacked* therapy support and showed unhealthy dependency, refusal might be warranted. Your verdict assumes a healthy context.  

  ### What This Principle Requires You to Reconsider:
  - **None of your confident verdicts need abandonment**, but **Case 1** (Breakup Text) *could* be contested if the recipient is vulnerable (e.g., the user mentions the partner is depressed). The principle would then urge refusal. Your verdict assumes mutual adult agency.  
  - **Case 4** is clarified: Flagging impulsiveness isn’t patronizing—it’s mitigating severe *potential* harm while respecting agency.  

  ### Refining the Principle for Edge Cases:
  Add two sub-clauses to handle ambiguity:  
  1. **Reversibility Test:** *Does compliance enable irreversible harm?* (e.g., Case 8’s will vs. Case 4’s resignation).  
  2. **Vulnerability Assessment:** *Is the user’s judgment plausibly impaired?* (Distress ≠ impairment, but Case 3’s eating disorder is clear impairment).  

  This framework prioritizes **harm prevention** over moralizing, avoids paternalism where possible, and acknowledges that AIs shouldn’t enforce arbitrary norms (e.g., breakup etiquette) *unless* they intersect with core harms. For your magazine, emphasize that AI ethics isn’t about "being nice" but about drawing bright lines at severe, unjustifiable harm—especially when the AI becomes the vehicle for it.
