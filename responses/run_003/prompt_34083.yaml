answer: |-
  Here's the translation of Hofstadter & Sander's core thesis into the novelist's vocabulary, followed by the residue report, as requested.

  **Brainstorming: Core Claims & Translation Attempts**

  1.  **Core Claim:** Analogy is the fundamental mechanism of *all* cognition (thinking, perception, memory, language).
      *   *Translation Attempt:* Every element of narrative craft – plot structure, character motivation, thematic resonance, even a sentence's rhythm – relies on the reader's (and writer's) unconscious recognition of *patterned similarities* to prior narrative experiences. There's no "raw" perception in reading; it's all comparative mapping.
  2.  **Core Claim:** There is no sharp distinction between "literal" and "figurative" thought; literal concepts are stable analogies.
      *   *Translation Attempt:* The difference between a concrete description ("Her eyes were blue") and a metaphor ("Her eyes were shards of glacier ice") is one of *degree of compression and novelty*, not kind. Both rely on activating pre-existing conceptual categories ("blueness," "coldness," "sharpness," "fragility") formed by past analogical experiences. "Literal" language is just highly conventionalized, low-surprise analogy.
  3.  **Core Claim:** Concepts *are* fluid categories defined by analogy-making; they have no rigid essence or fixed boundaries.
      *   *Translation Attempt:* A "character" isn't a fixed entity; it's a dynamic *category* shaped by the reader's analogical links to other fictional characters, archetypes, and real people. Revising a character isn't just changing traits; it's subtly shifting the web of *similarities* the reader perceives, altering their category membership ("Is this protagonist more like Hamlet or Raskolnikov now?"). A "theme" isn't a static message; it's the emergent resonance of countless micro-analogies between scenes, images, and character arcs.
  4.  **Core Claim:** Analogy serves as a powerful compression mechanism, allowing complex situations to be understood via reference to known, simpler ones.
      *   *Translation Attempt:* A well-chosen *motif* (e.g., recurring images of flight) acts as cognitive compression. It doesn't *tell* the theme; it allows the reader to *map* the complex emotional or thematic weight of multiple scenes onto a single, resonant concept ("freedom," "escape," "fragility"), leveraging prior understandings of that concept built through analogies. Showing vs. Telling is fundamentally about triggering the reader's analogical mapping instead of stating the compressed result.
  5. **Core Claim:** Perception itself involves constant, unconscious micro-analogies (recategorizations).
      *   *Translation Attempt:* The "felt" quality of a passage arises from countless micro-decisions in *point of view* and *sensory detail* that trigger the reader's unconscious analogical recategorization of the fictional moment. Choosing "the oak door groaned" over "the door opened" isn't just atmosphere; it forces an analogical link ("human suffering," "age," "resistance") onto perception. *Narrative voice* itself is a sustained analogical frame, constantly shaping how every detail is categorized ("Is this narrator's voice making me see this mundane scene as tragic? Comic? Absurd?").

  ---

  **The Translation: Hofstadter/Sander in Novelist-Speak**

  The core engine driving every aspect of your craft – and your reader's experience – is the relentless, unconscious search for **patterned similarity**. Forget the distinction between "literal" and "figurative"; it's a spectrum of **compression** and **surprise**. When you build a **character**, you aren't creating a fixed essence; you're constructing a dynamic **category** whose boundaries shift as the reader maps **analogies** to other characters (fictional and real) across **scenes**. Their motivations aren't stated facts but emerge from the reader's analogical linking of actions to prior understood patterns of desire or conflict.

  Your **plot** works because readers constantly perform analogical mapping: "This turning point feels *like* a betrayal I've read before," or "This obstacle maps *onto* the archetype of the forbidden threshold." **Theme** isn't preached; it's the resonant hum created by countless micro-**motifs** and parallel **subplots** triggering the reader's recognition of deep structural **similarities** across the narrative landscape. A **motif** isn't just repetition; it's cognitive compression – a single, potent image or concept ("water," "silence," "a locked box") that becomes a hub where the complex emotional weight of multiple moments is analogically mapped, making the whole feel larger than the sum of its parts.

  **Showing** is fundamentally forcing analogical mapping: you present sensory details and actions calibrated to trigger the *reader's* prior categories and emotional associations, letting them build the understanding. **Telling** is stating the compressed result of that mapping process (which often drains the life out of it). **Narrative voice** is the pervasive analogical filter: it constantly recategorizes every perception. A sardonic voice makes a rainy day feel *like* a cosmic joke; an elegiac voice makes it feel *like* lost time. **Point of View** dictates *whose* set of analogical categories – whose prior experiences and conceptual mappings – are shaping the presentation of the fictional world.

  **Revision** is the meticulous refinement of these analogical triggers. You're not just fixing sentences; you're adjusting the density, surprise, and directionality of the **similarity mappings** you demand from the reader. You heighten a **motif** to strengthen its compressive power; you tweak a character's reaction to shift their categorical membership; you alter **pacing** to control the rate at which new analogical connections are forged or old ones deepened. The "**felt**" quality of a passage is the successful, often pre-conscious, ignition of these analogical sparks in the reader's mind, creating that sense of resonance, inevitability, or uncanny recognition. Every cognitive act in writing and reading fiction is an act of **finding the familiar within the new**, and building the new upon the scaffold of the familiar.

  ---

  **The Residue Report: What Survived, What Bent, What Vanished**

  1.  **Translated Cleanly (Snug Fit):**
      *   **Analogy as Foundational Mapping:** The idea that cognition (reading/writing fiction) relies on recognizing similarities maps powerfully onto core novelistic concepts: **motif, theme, archetype, showing vs. telling, character-as-category.** The novelist's toolbox is *all about* triggering and shaping these mappings.
      *   **Fluidity of Concepts:** The novelist's understanding of **character** and **theme** as dynamic, evolving, interpretable entities aligns well with concepts as fluid categories. Revision as refining perception fits perfectly.
      *   **Compression via Motif/Theme:** The function of **motif** and **theme** as compressive devices that gather complex meaning resonates strongly with analogy as compression. "Showing" as triggering mapping instead of stating the result is a direct translation.
      *   **Narrative Voice/POV as Framing:** The idea that **voice** and **POV** actively shape *how* the fictional world is perceived and categorized translates the role of analogy in perceptual framing effectively.

  2.  **Bent or Fudged:**
      *   **Literal as Conventional Analogy:** While the *idea* that literal language is low-surprise analogy fits, the novelist's vocabulary inherently *uses* the literal/figurative distinction operationally. We *describe* an action literally to ground the scene, then use figurative language for emphasis or depth. The translation requires acknowledging this practical distinction while insisting it's a spectrum underneath. This feels like a slight bend.
      *   **"Every" Perception as Analogy:** Translating the constant micro-analogies of *perception itself* into **sensory detail** and **voice** works, but it slightly elevates the novelist's focus. Novelists work with sensory details *as material*, perhaps taking their "givenness" more for granted than H/S's theory does. We bend "micro-analogy in all perception" into "micro-choices in description *trigger* analogical perception."
      *   **The "Weight" of Compression:** H/S emphasize the cognitive *efficiency* gained. The novelist's vocabulary captures the *resonance* and *depth* (**theme**, **felt quality**) but not as explicitly the *efficiency* of processing complex information via analogy. This is implied but not foregrounded.

  3.  **Failed Translation (No Expression/Vanished):**
      *   **Pre-Conscious, Constant Micro-Recategorization:** The sheer *ubiquity* and *pre-conscious nature* of micro-analogical processes in *all* cognition, including low-level perception (e.g., recognizing *this* specific shade as "red" based on prior "reds"), has no direct counterpart. Novelists deal with *constructed* perceptions (descriptions) designed to *trigger* conscious or near-conscious analogical responses. The constant, background hum of analogical recategorization that *builds* ordinary perception before we even get to "meaning" isn't captured by tools focused on *intentional* meaning-making in fiction.
      *   **The Biological/Mechanical Substrate:** The novelist's vocabulary is phenomenological and craft-oriented, dealing with effect and technique. H/S's thesis ultimately points towards a *mechanism* of mind. The *how* of neural pattern-matching underlying analogy has no place in the novelist's toolbox. Concepts like "slippage," "pressure," or "abstract essence" in H/S's detailed discussions of analogical mechanics don't map onto **plot**, **character**, or **theme** in a meaningful way for craft purposes.
      *   **Analogy as the *Only* Game in Town:** While the translation shows analogy is *central*, the novelist's vocabulary implicitly allows for other elements: raw sensory input (even if constructed), logical deduction within the story world, formal structural choices. The absolute claim that it's *all* analogy, with *nothing* else, can't be fully embodied in the craft terms without denying the apparent reality of other processes at work *within the fictional construct*.

  **Analysis of the Residue: What the Gap Reveals**

  *   **What the Novelist's Framework Misses:** The residue shows the novelist's framework operates at a higher level of abstraction. It takes basic perception and categorization somewhat for granted, focusing on the *intentional artistic manipulation* of meaning and resonance built *upon* that foundation. The inability to capture the **constant, pre-conscious micro-recategorization** reveals a blind spot in the craft vocabulary for the sheer, relentless *biological processing* underlying even the simplest fictional moment. Novelists are master architects and conductors of meaning, but the framework doesn't inherently model the raw, pre-semantic cognitive substrate H/S describe.
  *   **What the H/S Thesis Smuggles In:** The residue exposes a potential overreach or lack of granularity in the H/S thesis. By declaring *all* cognition is analogy, they risk making the term so broad it loses explanatory power for the *specific kinds* of high-level, meaning-making cognition central to art. The novelist's framework, with its distinctions (even if fuzzy) between literal/figurative, showing/telling, plot/theme, highlights the *different functional roles* cognitive processes play. Collapsing them all into "analogy" might obscure these crucial differences in *how* we engage with complex narrative structures. The difficulty translating the *exclusive* claim ("it's *all* analogy") suggests H/S might be smuggling in a reductionism that the richer, more differentiated vocabulary of craft implicitly resists.
  *   **Conclusion (Both):** The gap reveals both limitations. The **novelist's vocabulary** lacks the granularity to model the foundational, pre-conscious cognitive mechanics H/S emphasize, particularly the constant micro-recategorization. Simultaneously, the **H/S thesis**, when pushed through this specific lens, appears potentially too monolithic, potentially undervaluing the distinct functions and phenomenological realities of different cognitive modes (e.g., perceiving a described object vs. grasping thematic irony) that the craft vocabulary naturally distinguishes, even if the underlying mechanism is analogical. The translation exposes the tension between a universal cognitive mechanism and the diverse phenomenological experiences and artistic techniques built upon it.

  \answer{The constant, preconscious micro-recategorization of raw perception via analogy, which constructs our moment-to-moment reality before thematic meaning even arises, finds no direct expression within the novelist's vocabulary of intentional craft.}
