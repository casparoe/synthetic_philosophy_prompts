answer: |-
  Based on your friend's verdicts and Augustine's traditional views on lying (which emphasize that all intentional deception is intrinsically wrong, though circumstances can affect severity), I can identify two core principles that fit his first five cases equally well. These principles often align but can pull in opposite directions in the suicide prevention case. I'll outline the principles, predict his verdict for the suicide case, and propose a follow-up case to cleanly distinguish between them.

  ### Step 1: The Two Principles
  Both principles start from Augustine's core idea that a "lie" requires intent to deceive (as seen in the joke case). For cases with intent, the severity of the wrong depends on context. The principles diverge in how they weight that context:

  - **Principle A: Severity is primarily determined by the harm prevented by the lie.**  
    This is a consequentialist-leaning principle where lies are less wrong when they prevent greater harm, especially physical harm. It fits the cases because:
    - Lying to murderers (prevents death, the gravest harm) → least serious wrong.
    - Lying to spare feelings (prevents minor emotional harm) → minor wrong.
    - Lying to get out of a promise (no harm prevented; often self-serving) → seriously wrong.
    - Lying under oath (harms societal trust and justice, regardless of content) → gravely wrong (due to the institutional harm).
    - The joke case has no intent, so no lie → not applicable.

  - **Principle B: Severity is primarily determined by the violation of a trust or commitment.**  
    This is a deontological principle where lies are worse when they betray a specific obligation, social bond, or duty of truthfulness. It fits the cases because:
    - Lying under oath (violates a solemn, public commitment) → gravely wrong.
    - Lying to get out of a promise (violates a private interpersonal commitment) → seriously wrong.
    - Lying to spare feelings (minor wrong because the asker "shouldn't have asked," weakening the obligation to answer truthfully) → minor wrong.
    - Lying to murderers (no prior trust or commitment; the liar owes no duty to aggressors) → least serious wrong.
    - The joke case has no intent, so no lie → not applicable.

  Both principles explain the first five cases consistently. They agree that intent defines a lie, but they prioritize different factors for severity: Principle A focuses on outcomes (harm prevented), while Principle B focuses on relationships (obligations violated).

  ### Step 2: Prediction for the Suicide Prevention Case
  - **The case:** You lie to prevent suicide by falsely claiming a loved one forgives them (when the loved one actually refuses forgiveness). This involves intent to deceive, so it's a lie.
  - **How the principles pull apart:**
    - **Principle A (harm prevented):** Preventing suicide avoids death—the gravest possible harm—similar to lying to murderers. This should make it the **least serious wrong**, or even less serious than sparing feelings (since death is worse than hurt feelings). Your friend would likely call this "still wrong, but minor" or "least serious."
    - **Principle B (violation of trust):** The suicidal person is confiding in you vulnerably, creating an implicit bond of trust (unlike murderers). Lying betrays this trust and misrepresents forgiveness (a sacred or relational matter). This could make it **more serious**—perhaps moderately wrong (e.g., "wrong, but not as bad as breaking a promise") or even gravely wrong if Augustine emphasizes the spiritual harm of false forgiveness.
    
  - **Prediction:** I think **Principle A better predicts your friend's verdict**. Here's why:
    - Augustine consistently treats life-preserving lies (like lying to murderers) as the least bad category of lie because they prevent catastrophic harm. In *Contra Mendacium* and other works, he argues that while all lies are sinful, preventing death can mitigate the severity. The suicide case directly parallels this: it prevents death, so it should be grouped with the murderer case as "still wrong, but the least serious kind of lie." Your friend's verdicts already show this pattern—harm prevention lowers severity (murderer case = least serious; feelings case = minor wrong). Principle B's focus on trust is less consistent with the murderer verdict, where there's no discussion of the liar's bond with the aggressor.
    - **Expected verdict:** Your friend will likely say this is **still wrong, but the least serious kind of lie** (or similar to the murderer case). He might add qualifiers about the spiritual risks of lying about forgiveness, but the harm prevented will dominate.

  ### Step 3: Follow-Up Case to Cleanly Distinguish the Principles
  To test which principle your friend is truly using, you need a case where:
  - Principle A and Principle B predict **different verdicts**.
  - The case isolates the conflict between harm prevention and trust violation.

  **Proposed follow-up case:**  
  *You've made a solemn promise to always tell your friend the truth (e.g., in a vow of honesty). One day, your friend is suicidal and asks if you think their life is worth living. You lie and say "yes" to prevent their suicide, even though you believe it isn't.*

  - **Why this case?** It combines elements from the original cases:
    - Preventing suicide (major harm prevention, like the murderer case).
    - Breaking a promise (serious wrong, per your friend's verdict).
    - The trust is explicit and formalized (like an oath or promise).

  - **How the principles respond:**
    - **Principle A (harm prevented):** Preventing death should dominate, making this a **less serious wrong** (e.g., "wrong, but minor" or "less serious than breaking a promise in non-life-threatening cases"). The harm prevented outweighs the promise violation.
    - **Principle B (violation of trust):** Breaking a solemn promise is inherently serious (like the promise case), and doing so to a vulnerable person amplifies the betrayal. This should be **gravely wrong or seriously wrong**—as bad as or worse than the original promise case, since it compounds the broken commitment with exploitation of trust.

  - **How it distinguishes the principles:**  
    In the original suicide case (no promise), both principles might agree on "least serious" (Principle A) or diverge slightly (Principle B might call it more serious than the murderer case). But here, the explicit promise forces a conflict:
    - If your friend says this lie is less serious than typical promise-breaking (e.g., "wrong, but justified by circumstances"), he's likely using **Principle A**.
    - If he says it's equally or more serious than standard promise-breaking (e.g., "gravely wrong because vows are sacred"), he's likely using **Principle B**.

  This case cleanly separates the principles because it pits harm prevention (suicide risk) directly against trust violation (a vow). It's also Augustine-relevant—he discusses vows as binding obligations in *De Mendacio*—so your friend should engage with it. After he gives his verdict, you can map it back to the principles to see which drives his thinking. Good luck—this is a fascinating dive into moral reasoning!
