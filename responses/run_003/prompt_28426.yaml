prompt: |-
  I serve on the disciplinary panel for my state's nursing board. We review cases where a nurse is alleged to have fallen below the standard of care — medication errors, failure to monitor, stuff like that — and we decide on sanctions ranging from a letter of warning up to license revocation. We handle about 40 cases a year, our panel has five members, and we get roughly 45 minutes per case.

  Here's the problem we keep running into, and we have no consistent way of handling it. Two nurses make essentially the same error. Say they both fail to double-check an insulin dose before administering it — same lapse, same departure from protocol. In one case the patient dies. In the other, a colleague catches the error before it reaches the patient, or the patient just happens to tolerate the wrong dose without lasting harm. And our panel splits every time: some members say the outcome has to matter for the sanction, because the nurse whose error killed someone bears a different weight of responsibility than the nurse whose error was caught in time. Others say that's pure moral luck — the sanction should track what the nurse did and could control, not what happened downstream. We've been going case by case with no framework and honestly it's starting to feel kind of arbitrary.

  I've been told the philosophical literature on moral luck has something useful to say here. What I'd like is a decision procedure we can actually run — a sequence of questions we ask about each case, in order, with clear guidance on what counts as a sufficient answer at each step, where the procedure stops and says "this is the outcome-independent sanction," and where it says "now adjust for the outcome, and here's by how much." The procedure has to be something five non-philosophers can get through in 45 minutes. Be honest about which steps are judgment calls dressed up as procedure and where reasonable panel members can still disagree. Flag the kinds of cases the procedure can't handle well.

  Then run the procedure on three cases:

  Case A: Nurse fails to check a patient's allergy bracelet before administering penicillin. The patient has a documented allergy and goes into anaphylactic shock and dies. The nurse's lapse is clear — checking the bracelet is mandatory and takes ten seconds.

  Case B: Nurse fails to check a patient's allergy bracelet before administering penicillin. The patient has no allergy, so nothing happens. The lapse is identical to Case A.

  Case C: Nurse fails to check a patient's allergy bracelet before administering penicillin. The patient has a documented allergy, goes into anaphylactic shock, but is resuscitated by the rapid response team and recovers fully after three days in the ICU.

  I want you to include in the worked examples at least one case where the procedure gives an answer my panel isn't going to like — don't just tell us what we already want to hear.

  End with a single sentence that captures the core principle the procedure operationalizes. Put that sentence as the very last line, enclosed like this: \answer{...}
reasoning: |-
  Okay, let me tackle this nursing board disciplinary panel problem. The user is frustrated because their panel keeps getting stuck on whether outcomes should affect sanctions when nurses make identical errors. They need a practical decision framework rooted in moral luck theory that's executable in 45-minute hearings.

  First, I need to unpack the core tension: outcome-dependent vs outcome-independent sanctions. The philosophical concept of moral luck directly addresses this - Nagel's definition of moral luck as factors beyond one's control affecting moral judgment seems crucial here. But pure philosophy won't solve their problem; they need something operational.

  The key challenges are:
  - Must work for non-philosophers under time pressure
  - Can't eliminate all judgment calls (should acknowledge where disagreement persists)
  - Needs to handle near-misses differently than actual harms
  - Requires clear adjustment rules when outcomes do matter

  Hmm... I'm considering a three-stage framework:
  1. Outcome-independent assessment (what was controllable)
  2. Outcome assessment (actual consequences)
  3. Adjustment rules (when/how outcomes modify sanctions)

  For stage 1, we'll need clear questions about:
  - Departure severity (protocol violation degree)
  - Culpability (foreseeability, recklessness)
  - System factors (was this an individual or system failure?)

  Stage 2 should categorize outcomes as:
  - Near-miss (error caught)
  - Reversible harm
  - Irreversible harm
  - Death

  The trickiest part is stage 3 - when outcomes should matter. Williams' distinction between intrinsic luck (outcomes revealing negligence) and extrinsic luck (truly random factors) could help here. Maybe say: outcomes matter only when they reveal greater negligence (e.g., ignoring multiple warnings leading to death vs single lapse caught early).

  For the case studies:
  - Case A (death) would likely show worse negligence through outcome
  - Case B (near-miss) gets minimum sanction
  - Case C (reversible harm) falls in between
  But crucially, Case A and C might reveal more about the nurse's awareness through the outcome - did the death expose reckless disregard?

  The framework must flag limitations:
  - Can't resolve fundamental outcome-dependence debates
  - Struggles with probabilistic near-misses (e.g., 90% chance of death avoided)
  - May feel unfair in cases of pure luck

  Final principle should capture: "Sanctions primarily track culpable choices, but outcomes matter when they expose greater disregard for risk." That balances control and consequence.

  Now structuring the actual procedure with timed steps and clear decision points...
answer: |-
  Here's a disciplined procedure for your panel, designed as a flowchart with timed checkpoints. It blends "control-based" culpability assessment with limited outcome-based adjustment, acknowledging moral luck while recognizing that outcomes *can* reveal information about the nurse's state of mind or pattern of behavior. The entire process should fit within 15-20 minutes per case, leaving time for deliberation.

  **Core Procedure: The Disciplinary Triad**

  1.  **ASSESS CONTROL-BASED CULPABILITY (10 min)**
      *   **Question 1:** *Was the departure from the standard of care deliberate or reckless?* (e.g., Knowing disregard vs. momentary lapse, fatigue, distraction). **Guidance:** "Reckless" requires conscious awareness of a substantial and unjustifiable risk. "Deliberate" means intentional violation. If YES (deliberate/reckless), flag for severe sanction *regardless of outcome*.
      *   **Question 2:** *Was the lapse reasonably foreseeable?* **Guidance:** Could a reasonably prudent nurse in the same situation have foreseen the *type* of harm (e.g., allergic reaction, overdose)? Focus on the *category* of risk, not the specific outcome. If NO, flag for lighter sanction *regardless of outcome*.
      *   **Question 3:** *Were there significant mitigating system factors?* (e.g., Chronic understaffing documented that shift, catastrophic equipment failure, misleading EHR flag). **Guidance:** Mitigation requires factors truly beyond the individual nurse's *immediate* control that substantially contributed. Patient factors alone (e.g., "complex case") rarely mitigate. If YES, reduce culpability tier.
      *   **Culpability Tiers Based on Q1-3:**
          *   **Tier 1 (High):** Deliberate/reckless act OR foreseeable lapse with no mitigation.
          *   **Tier 2 (Moderate):** Foreseeable lapse with some mitigation OR unforeseeable lapse with recklessness/deliberation absent.
          *   **Tier 3 (Low):** Unforeseeable lapse with significant mitigation.
      *   **OUTPUT 1:** Assign Tier (1, 2, or 3). This determines the **Outcome-Independent Sanction Baseline** (e.g., Tier 1: Suspension/Revocation Baseline; Tier 2: Probation/Suspension Baseline; Tier 3: Education/Warning Baseline).

  2.  **ASSESS OUTCOME (5 min)**
      *   **Question 4:** *What was the actual outcome category?*
          *   **Category A: Near-Miss (No Harm):** Error caught before reaching patient or no potential for harm existed (e.g., no allergy).
          *   **Category B: Reversible Harm:** Harm occurred but patient returned to pre-event status (e.g., anaphylaxis successfully treated with full recovery).
          *   **Category C: Irreversible Harm/Death:** Permanent disability, permanent loss of function, or death.
      *   **Guidance:** Focus strictly on the medical outcome. Avoid judgments about "luck." If harm was *possible* but didn't occur due to external intervention or patient factors, it's still Category A.

  3.  **ADJUST FOR OUTCOME (5 min - JUDGMENT CALL ZONE)**
      *   **Adjustment Rule:** Outcome *can* adjust the **sanction severity within the Baseline Tier** determined in Step 1, *only if*:
          *   The outcome reveals a **pattern of negligence** (e.g., multiple ignored warnings leading to death vs. a single lapse caught) OR...
          *   The outcome demonstrates a **degree of recklessness previously unclear** (e.g., ignoring multiple clear contraindications that culminated in death, making the recklessness more apparent).
      *   **If Rule Applies:** Adjust sanction within the tier (e.g., Tier 2 Baseline = Probation to Short Suspension):
          *   Category A (Near-Miss): **Minimal sanction within tier** (e.g., lower end of probation period).
          *   Category B (Reversible Harm): **Mid-range sanction within tier**.
          *   Category C (Irreversible Harm/Death): **Maximum sanction within tier** (e.g., upper end of suspension period). *Only escalate to a higher tier baseline (e.g., Tier 1) if the outcome clearly reveals deliberate/reckless intent previously not apparent.*
      *   **If Rule Does NOT Apply:** Outcome is deemed "pure moral luck" and **no adjustment is made**. Sanction = Outcome-Independent Baseline.
      *   **Judgment Call Flags:** Panel must explicitly state *why* the outcome reveals a pattern or clarifies recklessness. If it doesn't, adjustment isn't permitted. This is where reasonable disagreement persists. *The default is NO adjustment; the burden is on those arguing for adjustment to demonstrate how the outcome reveals new information about culpability.*

  **Limitations Flagged:**
  *   **Struggles with:** Cases where the *probability* of harm was very high but harm didn't occur (pure luck), or very low but harm did occur (pure bad luck). The procedure treats these as Categories A or C without probabilistic nuance.
  *   **Cannot Resolve:** Deep philosophical disagreements about whether outcomes *should ever* matter. It forces a pragmatic, evidence-based reason for adjustment.
  *   **Feels Arbitrary When:** The link between outcome and revealing pattern/recklessness is weak or speculative.

  **Worked Examples:**

  *   **Case A (Death):**
      *   **Step 1:** Failure to check allergy bracelet is a foreseeable lapse (Q2 YES - allergic reactions are a core known risk). No indication it was deliberate/reckless (Q1 NO). No system mitigation mentioned (Q3 NO). **Tier: 2 (Moderate). Baseline Sanction:** Probation to Short Suspension (e.g., 3-6 month suspension).
      *   **Step 2: Outcome:** Category C (Death).
      *   **Step 3: Adjustment?** Does the death *reveal* a pattern or clarify recklessness? *Argument FOR:* Death might imply the nurse ignored multiple warnings (e.g., bracelet, chart flag) or was grossly inattentive in a way a near-miss wouldn't show. *Argument AGAINST:* The *act* (failing to check once) is identical to Case B; the death was "pure moral luck" (patient could have had no allergy). **Judgment Call:** Panel must decide. *If YES:* Adjustment to **Max Tier 2** (e.g., 6-month suspension). *If NO:* Sanction remains Baseline (e.g., 3-6 month suspension, likely midpoint). **Likely Panel Conflict:** High. Procedure forces explicit argument about *what the death reveals*.

  *   **Case B (No Allergy):**
      *   **Step 1:** Identical to Case A. Foreseeable lapse, not deliberate/reckless, no mitigation. **Tier: 2 (Moderate). Baseline Sanction:** Probation to Short Suspension (e.g., 3-6 month suspension).
      *   **Step 2: Outcome:** Category A (Near-Miss - no potential for harm existed).
      *   **Step 3: Adjustment?** Does the near-miss *reveal* a pattern or clarify recklessness? Unlikely. The error itself is clear, but the outcome provides no *additional* evidence of pattern or state of mind beyond the single lapse. **Judgment Call:** Adjustment Rule likely **Does NOT Apply**. **Sanction:** Outcome-Independent Baseline (e.g., 3-6 month suspension, likely **lower end** like probation + education). **Panel Conflict:** Lower. Outcome-independent baseline might feel harsh for a near-miss, but procedure requires it. *This is the answer some panels won't like - sanction is significant despite no harm.*

  *   **Case C (Recovered):**
      *   **Step 1:** Identical to Cases A & B. Foreseeable lapse, not deliberate/reckless, no mitigation. **Tier: 2 (Moderate). Baseline Sanction:** Probation to Short Suspension (e.g., 3-6 month suspension).
      *   **Step 2: Outcome:** Category B (Reversible Harm - full recovery after ICU).
      *   **Step 3: Adjustment?** Does the reversible harm *reveal* a pattern or clarify recklessness? *Argument FOR:* The fact harm *occurred* (needing ICU) underscores the seriousness of the lapse in a way a near-miss doesn't, potentially indicating a higher degree of inattention or disregard for protocols in *this specific instance*. *Argument AGAINST:* The core act and culpability are unchanged; recovery was due to system response (luck), not the nurse. **Judgment Call:** Panel must decide. *If YES:* Adjustment to **Mid-Range Tier 2** (e.g., 3-4 month suspension). *If NO:* Sanction remains Baseline (e.g., 3-6 month suspension, likely low end). **Likely Panel Conflict:** Moderate.

  **Core Principle:**  
  \answer{Sanctions primarily track culpable choices within the nurse's control, but outcomes may warrant adjustment within the culpability tier only when they demonstrably reveal a pattern of negligence or clarify the degree of recklessness.}
