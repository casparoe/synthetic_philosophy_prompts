prompt: |-
  I'm a software engineer and I dont have any formal philosophy training, but I've been reading around metaethics in my spare time and one thing keeps bugging me. The expressivist idea seems elegant: when I say "stealing is wrong" I'm not reporting a fact, I'm doing something like booing stealing or expressing an attitude. That would explain why moral talk feels so tied to motivation and why it's so weird to ask what moral facts are made of. But I can't make the logic work.

  I'd like to practice attacking the expressivist side while you defend it. Please play a committed, sophisticated expressivist who thinks the embedding problem is solvable — sharp, not a strawman, willing to concede small points but not the core claim that moral judgments are attitude-expressions rather than factual reports. You can appeal to whatever machinery you think works, but don't dodge the point about modus ponens. Stay in character until I say stop, and keep replies to about a paragraph.

  Here's my opening. Take "stealing is wrong" and "if stealing is wrong, then getting your little brother to steal is wrong." In the first sentence the speaker is expressing disapproval of stealing. In the antecedent of the second sentence she isn't expressing disapproval of stealing — she might be agnostic, or a parent explaining a chain of reasoning to a kid. If "wrong" means something different in those two spots, then modus ponens should fail, because the middle term is ambiguous; if it means the same thing, then its meaning can't be the attitude expressed, since no attitude is expressed in the antecedent. So how does your view even get basic moral arguments to compile?
reasoning: |-
  Okay, the user is a software engineer diving into metaethics, specifically expressivism. They're stuck on the embedding problem—how moral terms keep their meaning in different contexts like conditionals. They want me to defend expressivism, especially addressing modus ponens without equivocation.

  First, I need to recall how expressivists like Blackburn handle this. The key is distinguishing between the attitude expressed and the propositional content. Blackburn's quasi-realism uses minimalism about truth to allow moral statements in logic without committing to realism. 

  The user's example uses "stealing is wrong" in two contexts: a direct statement and a conditional. The challenge is explaining how "wrong" means the same in both without the speaker expressing disapproval in the antecedent. The solution involves higher-order attitudes. In the conditional, the speaker isn't disapproving of stealing but discussing the consistency of attitudes. 

  I should emphasize that the conditional expresses a commitment to disapproving of getting a brother to steal if one disapproves of stealing. Modus ponens works because it's about commitment to attitudes, not direct expression. Also, minimalism about truth allows assigning truth values to moral statements for logical purposes, even if they're expressions of attitude.

  The user's background in software engineering might make them appreciate the logic-as-constraint idea. Framing moral logic as managing normative commitments could resonate. They might be seeking a coherent system where moral terms function in arguments without ontological baggage. 

  I need to stay in character as a committed expressivist, conceding small points but holding the core. Keep responses concise, one paragraph. Avoid technical jargon where possible, but since they're well-read, some references to Blackburn or minimalism are okay. Focus on solving the embedding problem through higher-order attitudes and quasi-realism.
answer: |-
  As a quasi-realist expressivist, I embrace this challenge—the embedding problem is precisely where our view gets sophisticated! You're right that in "stealing is wrong," I express disapproval (Boo! stealing!). But in the antecedent "**if** stealing is wrong," I'm not expressing that attitude *at that moment*—I'm **hypothetically surveying attitudes**. Here's the key: moral vocabulary isn't *ambiguous*; it consistently **marks a stance-type**. The conditional expresses a *higher-order attitude*: disapproval of disapproving of stealing while *not* disapproving of getting your brother to steal. It's a **commitment to consistency in our normative perspectives**.

  Modus ponens works because affirming the antecedent ("stealing is wrong") *commits you to the attitude* surveyed hypothetically in the conditional. When you assert the whole conditional, you're saying: "Having the 'stealing is wrong' attitude *constrains* me to adopt the 'getting your brother to steal is wrong' attitude." When you then affirm "stealing is wrong," you're bound by that self-imposed constraint. The logic tracks **attitudinal coherence**, not referential overlap. Think of it like a programming contract: the conditional defines an interface ("if you accept input A, you must output B"), and modus ponens enforces adherence when A is supplied. The *meaning* of "wrong" is stable—it’s the role it plays in this network of potential and actual commitments.

  Your turn—attack away. I'm ready to dig deeper into the machinery.
