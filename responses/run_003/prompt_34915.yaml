  Okay, the user is describing a recurring pattern in competitive scenarios where each participant's rational response to the current state changes the environment, making previously unthinkable actions rational for others. This creates a self-reinforcing cycle that shifts the acceptable baseline over time. They've noticed this differs from standard "race to the bottom" or "arms race" concepts because there's no fixed equilibrium being approached - the equilibrium itself moves.

  Hmm, this feels like a sophisticated observation about systemic dynamics. The user clearly has strong analytical skills to isolate this pattern from similar concepts. They're not just asking for a label - they want precise conceptual boundaries. The military procurement and AI publication examples are spot-on for showing how the "new normal" keeps getting redefined.

  Let me mentally scan related concepts. The Red Queen Effect comes close with its "running faster to stay in place" aspect, but doesn't capture how the rules themselves change. Escalation dynamics in game theory sometimes touch this, but usually assume fixed payoffs. Oh! Evolutionary game theory's coevolutionary arms races actually model how the fitness landscape shifts with each move - that might be the closest fit.

  Wait, but is there a standard term? The user's description reminds me of Brian Arthur's work on increasing returns and path dependence in economics. Or perhaps Schelling's notion of reciprocal escalation. But none are perfect matches. The key differentiator seems to be the endogenous shift in what constitutes rationality - each move redefines the payoff matrix itself.

  For boundary cases: Military spending is clearly in, while traditional price wars are out because they converge to a fixed low equilibrium. The AI publication example is interesting - it's in if the definition of "publishable" evolves, but out if labs are just rushing to meet fixed standards.

  I think "Endogenous Threshold Escalation" might work as a new coinage, though it's a mouthful. "Coevolutionary Trap" captures the biological parallel but may be too niche. Ultimately this deserves a new term since even the closest existing concepts require caveats.
answer: |-
  Here is the structured analysis of the pattern you've identified:

  **1. The phenomenon restated:**  
  This describes a dynamic where competitive actors make locally rational decisions (e.g., publish AI research, deploy new weapons) in response to others' actions. Each action shifts the shared environment (e.g., publication standards, threat levels), redefining what constitutes a rational response next. This creates a self-reinforcing escalation cycle with no stable endpoint, leading to collectively undesirable outcomes (e.g., excessive disclosure, heightened risk) that no single actor intended or would have chosen initially. The equilibrium itself moves.

  **2. The nearest established concepts:**
  *   **Arms Race:** A competitive spiral where rivals reciprocally build military capabilities in response to each other's actions, driven by security concerns. Focuses on reciprocated increases in specific capabilities (weapons, spending).
  *   **Red Queen Effect (Evolutionary/Biology):** The need for constant adaptation/effort merely to maintain relative position in a competitive co-evolutionary system (e.g., predator-prey, competing species). Emphasizes the treadmill aspect of maintaining status quo.
  *   **Escalation Commitment / Escalation Trap:** Situations (often in conflicts or negotiations) where actors become locked into a course of action through successive, increasingly costly decisions, making disengagement difficult.
  *   **Endogenous Preference/Threshold Shift:** Economic/game theory concepts where agents' preferences or the thresholds defining acceptable behavior change *because of* the actions taken within the system itself, often due to social norms or evolving expectations.
  *   **Tragedy of the Commons:** Overexploitation of a shared resource due to individual incentives conflicting with collective good. Requires a depletable common-pool resource and defection from cooperation.

  **3. Where each fits and where it misses:**
  *   **Arms Race:** **Fits** the mutual responsiveness, escalation, and resulting undesirable outcome (higher risk/cost). **Misses** by typically assuming a fixed "winning" goal (superiority) and focusing on quantitative increases in *similar* variables (weapons counts). Your pattern involves shifts in the *definition* of rational action (what's worth publishing, what constitutes necessary defense) and applies beyond military contexts.
  *   **Red Queen Effect:** **Fits** the need for continuous action just to keep pace and the treadmill-like nature. **Misses** by emphasizing *maintaining* relative position against a moving baseline defined by competitors. Your pattern involves a *qualitative shift* in the environment and standards themselves (the "bottom" moves), not just running faster on the same track. The outcome is often worse than the initial status quo, not just its maintenance.
  *   **Escalation Commitment/Trap:** **Fits** the lock-in, path dependency, and difficulty reversing course once started. **Misses** by often implying a conscious conflict or negotiation with an opponent and focusing on sunk costs. Your pattern highlights how *locally rational* responses to a *changed environment* drive the escalation, often without overt conflict or initial commitment.
  *   **Endogenous Preference/Threshold Shift:** **Fits** the core mechanism: actions change the environment, which alters the definition of rationality/preferences/thresholds for subsequent actions. This is the crucial *mechanism* driving your pattern. **Misses** by being a more abstract concept describing *how* preferences change, not the specific *pattern* of competitive, self-reinforcing escalation towards a collectively worse outcome it enables.
  *   **Tragedy of the Commons:** **Fits** the collective bad outcome despite individual rationality. **Misses** fundamentally. Your pattern lacks a depletable common resource. Actors aren't primarily "defecting" from cooperation by overusing a resource; they are responding rationally to an environment *altered by prior rational actions*, shifting the standards of rational behavior itself. The "harm" is a changed game state, not resource depletion.

  **4. Verdict on a name:**  
  This configuration **lacks a single, universally established name** that perfectly encompasses its full scope. The **closest conceptual fit is "Endogenous Escalation"** or **"Coevolutionary Escalation"**, modified from existing terms. "Endogenous" captures the internal, self-propelling nature where actions change the rules. "Coevolutionary" emphasizes the mutual, dynamic adaptation driving the shifting baseline. While "Arms Race" is a common instance, it's too narrow and context-specific. "Red Queen Effect" captures the treadmill but misses the shifting standards. A modified term is most accurate.

  **5. Definition and boundary cases:**

  *   **Definition (Proposed: Endogenous Escalation):** *A dynamic in competitive multi-actor systems where locally rational decisions, made in response to the current state defined by others' actions, alter the shared environment in a way that systematically redefines the standards for rationality in subsequent decisions. This creates a self-reinforcing cycle of escalation (qualitative or quantitative) towards collectively undesirable outcomes that no single actor desired, characterized by a moving equilibrium or baseline.*
  *   **Inside Cases:**
      1.  **AI Publication Race:** Lab A publishes a significant model, raising the bar. Lab B, to remain competitive for talent/funding, publishes its next model sooner/more advanced than it otherwise would have. This new publication further raises the bar, forcing Lab A and others to respond even faster/more aggressively. Standards for "publishable" shift endogenously.
      2.  **Military Tech Deployment:** Nation X deploys a new defensive missile system. Nation Y, perceiving its existing offensive capabilities as now insufficient, develops/deploys faster/more evasive missiles. This deployment makes Nation X's *previous* defensive system inadequate, prompting development of next-gen defenses, and so on. The accepted level of threat/countermeasure escalates with each step.
  *   **Outside Cases:**
      1.  **Price War (Race to the Bottom):** Competitors continuously lower prices to match each other, converging on a low-profit equilibrium. **Reason:** The variable (price) is driven down towards a *fixed* bad equilibrium (low price = low profit). The *definition* of a rational price doesn't fundamentally shift; the value just converges downward.
      2.  **Overfishing (Tragedy of the Commons):** Individual fishers increase their catch because they benefit directly, while the cost of resource depletion is shared. Fish stocks collapse. **Reason:** Involves the depletion of a *common-pool resource* (the fish stock). Actors are defecting from implicit cooperation by overusing the resource for individual gain. The pattern relies on resource rivalry, not an endogenous shift in the standards of rational *action* beyond the depletion itself. The "rational action" (catch more) doesn't change; the resource just vanishes.
