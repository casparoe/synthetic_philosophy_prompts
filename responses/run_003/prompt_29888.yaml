  | **(1) and (3)** | Conjunction closure vs. lottery belief. If you're rational to believe your ticket loses (3), and by symmetry, you should be rational to believe each ticket loses (since the lottery is fair), then conjunction closure (1) requires believing all tickets lose. But you know one wins, leading to a contradiction with (5). | High | Not as immediate as (1)-(4) because (3) only specifies belief about *your* ticket, but the tension becomes severe when generalized (as rational agents should treat all tickets alike). This is the lottery paradox. |
  | **(2) and (6)** | High probability for belief vs. rejection of statistical evidence for conviction. (2) says high probability justifies rational belief (e.g., 99% chance of guilt), but (6) says courts shouldn't convict on this basis. If rational belief should inform action (like conviction), this creates normative tension. | Medium | Not a logical contradiction, but a practical conflict: why isn't high probability sufficient for serious action if it's enough for belief? However, it might be resolvable by distinguishing epistemic and legal standards. |
