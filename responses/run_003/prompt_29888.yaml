  - **High severity**: Direct logical contradictions or paradoxes that undermine core rationality.
  - **Medium severity**: Conflicts requiring additional assumptions or extensions, often involving practical implications.
  - **Low severity**: Contextual or normative tensions that might be resolved by distinguishing domains (e.g., belief vs. legal standards).

  Here, I consider only pairs with genuine tension—not all pairs conflict. For example, (2) and (3) are compatible, as (3) relies on high probability from (2). Similarly, (5) is largely unproblematic unless paired with commitments that imply contradictions.

  | Pair | Tension Description | Severity | Why It's a Problem |
