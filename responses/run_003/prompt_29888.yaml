  | **(4) and (5)** | Preface case vs. no contradiction. As with (1)-(4), (4) allows believing each sentence and that not all are true, which, without qualification, implies a contradiction if conjunction is assumed. | Medium | Less severe than (1)-(4) because (4) doesn't *require* conjunction closure—it might be possible without it. But it still flirts with inconsistency if (1) is held. |

