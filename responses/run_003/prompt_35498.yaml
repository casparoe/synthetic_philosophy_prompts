answer: |-
  Your diagnosis is remarkably astute—it cuts to the core of the enduring stalemate. The St. Petersburg debate isn't just about competing solutions; it's fundamentally about **divergent conceptions of what decision theory is supposed to accomplish** and **conflicting intuitions about rationality itself**. Here's a sharper articulation of your hypothesis, why it explains the impasse, and what progress might look like:

  ### The Core Disagreement: Two Incommensurable Frames
  1. **The "Internal Repair" Frame**:  
     - **Goal**: Preserve the *structure* of expected utility theory (EU) as the normative standard for rationality. The paradox is a *technical flaw* requiring a *patch*.  
     - **Responses**: Bounded utility, probability weighting, finite truncation, or tail-discounting.  
     - **Critique of Opponents**: External critiques "give up" on formal rationality too easily. Rational agents *should* care about vanishingly small probabilities of vast payoffs—if they don't, they're irrational.  

  2. **The "External Critique" Frame**:  
     - **Goal**: Expose EU theory as *inherently inadequate* for describing/constraining rational choice when infinities appear. The paradox reveals EU's *conceptual instability*.  
     - **Responses**: Reject unbounded utility functions, deny that infinite expectations are meaningful, or argue rationality is *procedural* (e.g., "satisficing") not *quantitative*.  
     - **Critique of Opponents**: Internal repairs are *ad hoc* and miss the point—no "patch" can reconcile EU with how actual agents *must* reason given finite cognition/time/resources.  

  These frames aren't just answering different questions—they embody **different visions of rationality**:  
  - **Internal**: Rationality = Maximizing a mathematical expectation (even if idealized).  
  - **External**: Rationality = Using feasible cognitive procedures to achieve satisfactory outcomes.  

  ### Why This Explains the Impasse
  - **Appeals to Intuition Fail**: When an "internal" proponent says, *"But a rational agent should pay $1000 if EU > cost!"*, the "external" critic hears *"Should compute an infinite sum they can't compute."* These aren't conflicting answers—they're conflicting definitions of "should."  
  - **No Common Ground for Refutation**: Rebuttals (e.g., "restating payoffs in utils still breaks EU if unbounded") are only fatal *within* the internal frame. External critics see this as further proof of EU's incoherence.  
  - **Methodological Stalemate**: Internal repairs are judged by *mathematical consistency*; external critiques by *psychological/operational plausibility*. These criteria rarely intersect.  

  ### Is Progress Possible? Three Paths Forward
  The tension isn't "permanent," but resolving it requires reframing the question. Progress lies in clarifying *what kind* of answer we seek:

  1. **Formal Meta-Progress**: Axiomatic explorations of EU’s limits.  
     - **Example**: Villegas (1964) and others show that requiring EU to handle *any* unbounded gamble implies restrictive (and implausible) continuity axioms.  
     - **Value**: Forces internal-repair advocates to explicitly choose which EU axiom to relax. This shifts debate from intuition to trade-offs between principles.  

  2. **The "Finite Agent" Synthesis**:  
     - **Insight**: All real decision-makers have finite computational resources, temporal horizons, and sensory resolution (e.g., they can't distinguish probabilities below 10<sup>-100</sup>).  
     - **Progress**: Model agents with explicit constraints (e.g., *discounted computational complexity*). The "paradox" vanishes when EU is replaced by *feasible expectation approximation*.  
     - **Result**: Bounded utility/probability discounting aren’t *ad hoc*—they emerge naturally from resource limits (e.g., Sims' "rational inattention").  

  3. **Reframing as a Paradox of Instrumental Rationality**:  
     - **Key Question**: *What would a bounded agent gain from obeying "infinite EU" prescriptions?*  
     - **Progress**: Show that no *implementable strategy* can achieve the theoretical EU. Any real attempt to play (e.g., via contracts, insurance) introduces costs that dominate the infinite expectation.  
     - **Conclusion**: Rejecting high stakes isn't irrational—it’s *necessary* for coherent action. This bridges frames by making EU’s failure *pragmatic*, not just mathematical.  

  ### The Underlying Disagreement: Substantive but Non-Empirical
  At bottom, this is a **substantive philosophical disagreement** about:  
  - The scope of normative theories (should they apply to idealized omniscient agents or flesh-and-blood ones?).  
  - Whether rationality requires consistency with *logical possibility* or *practical possibility*.  

  It’s not "verbal" (all parties understand the math) or "methodological" alone (methods follow from deeper commitments). It’s a clash between **optimizing vs. satisficing visions of reason** in the face of the infinite.  

  ### A Concluding Thought
  Your instinct is correct: the paradox persists because it sits at a fault line in decision theory. **Progress isn't about "solving" the paradox but about mapping the constraints that make it inevitable.** The most fruitful path forward is to embrace the "finite agent" perspective—not as a concession to human frailty, but as a foundation for a more robust theory of rationality. As you note, this connects deeply to Pascal's Wager, the two-envelope problem, and other infinitary puzzles. Recognizing this family resemblance may be the key to transcending centuries of deadlock.
