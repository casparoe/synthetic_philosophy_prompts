answer: |-
  This is a fascinating and astute observation of a recurrent pattern in moral reasoning. There isn't a single, universally agreed-upon term *exclusively* for this specific configuration, but several concepts capture aspects of it. The most fitting descriptions and potential labels are:

  1.  **Intuitional Dogmatism (or Foundationalism) with Respect to Boundaries:** This emphasizes the unwavering confidence in the *intuition* itself ("we clearly *do* have special obligations") as the foundational bedrock, even when the *theoretical justification* for its specific scope fails. The boundary is treated as given by the intuition, and theory is tasked solely with catching up. This highlights the one-way direction of fit you identified.

  2.  **The Boundary Demarcation Problem Handled via Promissory Intuitionism:** This combines the recognition of the "boundary problem" (Why *here* and not *there*?) with the specific move of treating the lack of a *current* principle not as invalidating, but as a promissory note payable by future theory, grounded in the authority of the initial intuition. "Intuitionism" here refers to the reliance on the intuition as a non-inferential source of justification.

  3.  **The "Intuitional Exemption" for Gradients:** This focuses on the core challenge you presented: the existence of a gradient (city -> nation -> continent; cellular -> sentient -> self-aware; etc.) where the chosen boundary point seems arbitrary. The "exemption" is the act of granting the specific intuition (e.g., "nation matters supremely") immunity from the gradient challenge, deferring the resolution to theory.

  4.  **Burden-Shifting in Moral Epistemology:** This frames it as a dialectical move where the burden of proof is shifted away from the defender of the distinction. When challenged on the boundary, the response ("We can't explain it yet, but it's clearly real") effectively places the burden on critics or future theorists to *disprove* the intuition or *find* the missing principle, rather than requiring the defender to *justify* the boundary here-and-now.

  **Why existing concepts don't perfectly fit:**

  *   **Reflective Equilibrium:** As you note, RE is fundamentally about *mutual adjustment* between intuitions and principles. This pattern is the *opposite* – the intuition is fixed, and principles must conform, with boundary ambiguity deferred.
  *   **Intuitionism (Meta-Ethical):** While related (it relies on intuitions), meta-ethical intuitionism is a theory about the *source* of moral knowledge (non-inferential intuition). Your pattern describes a specific *dialectical strategy* used *within* debates by someone who likely holds intuitionist leanings, particularly regarding boundary placement.
  *   **Promissory Note (Scientific):** The analogy is strong – faith that theory will eventually deliver. The key difference is the *subject matter*: moral boundaries and distinctions vs. empirical predictions/hypotheses. A "Promissory Note in Moral Epistemology" or "Promissory Intuitionism" gets closer.

  **Recommended Terminology & Distinction:**

  The most precise and descriptive label for this **specific configuration** is likely:

  **"Intuitional Exemption for Boundary Demarcation"**

  or, emphasizing the promissory aspect:

  **"Promissory Intuitionism regarding Moral Boundaries"**

  **How to distinguish it from neighbors:**

  *   **Vs. Reflective Equilibrium:** RE is a *method* aiming for coherence through adjustment. This pattern is a *defensive move* that *resists* adjustment of the core intuition when faced with a boundary challenge, preserving it via theoretical promissory notes. RE seeks harmony; this prioritizes the intuition.
  *   **Vs. Meta-Ethical Intuitionism:** Intuitionism is the broad *theory* that intuitions justify beliefs. This pattern is a specific *dialectical tactic* employed *by* someone holding intuitionist views, characterized by *deferring justification for boundary specificity* while maintaining absolute confidence in the core distinction. It's a symptom *of* intuitionism under pressure, not the theory itself.
  *   **Vs. Scientific Promissory Note:** The structure is identical (current theory gap, future solution expected). The difference lies in the *justificatory basis*. Scientific promissory notes rely on the track record of empirical science and its methods filling gaps. Moral promissory notes here rely solely on the perceived *indefeasibility of the moral intuition* itself as warranting faith in a future theoretical solution. The authority is the intuition, not the scientific method.
  *   **Vs. Simple Stubbornness:** This isn't mere refusal to change one's mind. It's a *reasoned* (though potentially flawed) epistemological stance: "The intuition is so strong it *must* correspond to a real distinction; therefore, the current theoretical gap is a problem for *theory*, not the intuition/reality."

  **Why this pattern is significant:**

  You've identified a crucial vulnerability in many moral arguments. It allows distinctions deeply rooted in cultural norms, biological predispositions (like kin preference), or historical contingencies to be shielded from critical scrutiny by appealing to the sheer force of the intuition and deferring the difficult justificatory work indefinitely. Recognizing this "Intuitional Exemption" move is key to pushing arguments beyond stalemates where one side relies on the sheer assertiveness of their intuitions about boundaries. It forces the question: if you can't say *why here* and not *there* on the gradient, what *independent* reason do we have to trust this specific boundary intuition over others, or over the challenge posed by the gradient itself?
