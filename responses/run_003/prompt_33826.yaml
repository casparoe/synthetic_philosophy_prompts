answer: |-
  Here’s your Q&A prep sheet, prioritizing objections based on audience composition and the paper’s core claims. The objections are ordered by likelihood and potential damage, with replies designed for clarity under time pressure.

  ---

  ### **Q&A Prep Sheet: Endurantism, Adverbialism & the Perdurantist Free Ride**

  **Core Claims to Defend:**  
  1. Adverbialism solves temporary intrinsics *without* presentism.  
  2. Perdurantism’s "intuitive" edge relies on conflating epistemology (reidentification) with metaphysics (persistence).  
  3. Temporal parts are unmotivated once this conflation is resolved.

  ---

  ### **Top 6 Likely Objections & Replies**  
  *(Ordered: Most Likely/Damaging → Least)*

  1. **Objection (Perdurantist, likely from stage theorist):**  
     *"Your 'adverbialist' move just paraphrases temporal parts. Saying 'the apple is red t-ly' is no different from 'the apple-at-t is red.' This is a notational variant of the stage view, smuggling in temporal indexing as primitive – which is what perdurantism explains via parts."*  
     **Reply (2-min):**  
     "Adverbialism modifies *how* a whole object instantiates a property, not *which entity* instantiates it. Perdurantism fragments the object into distinct temporal entities (stages or worms). The adverbialist apple is *numerically identical* at t1 and t2 but instantiates properties under different temporal modes. This preserves strict identity through change; perdurantism denies it by making persistence extrinsic to the object. The difference is ontological, not linguistic."  
     **Weakness:** Admits temporal modes are primitive, which some may find as unexplanatory as temporal parts.  

  2. **Objection (Philosopher of Physics):**  
     *"Special relativity undermines your picture. If there’s no privileged present, how can an object be 'wholly present' at a time? Endurantism requires a foliation of spacetime that physics rejects."*  
     **Reply (2-min):**  
     "I’m not committed to absolute simultaneity. Adverbialism can index properties to *frame-relative* temporal locations. An endurantist object is wholly present *relative to a reference frame*, instantiating properties frame-relativistically (e.g., 'red relative to frame F at t'). Perdurantism *also* needs to relativize temporal parts to frames – we face the same challenge, so this isn’t a unique problem for endurance."  
     **Weakness:** Risks alienating metaphysicians by leaning into relativity; may feel like retreat to "endurance-lite."  

  3. **Objection (Perdurantist):**  
     *"You say perdurantism 'conflates epistemology with metaphysics,' but even granting your distinction, it doesn’t solve the *metaphysical* problem of change. How can one object have incompatible properties without contradiction? Temporal parts straightforwardly avoid this; your 'temporal modes' seem metaphysically mysterious."*  
     **Reply (2-min):**  
     "The contradiction only arises if we assume properties are instantiated simpliciter. Adverbialism denies this: the object has *being-red-t1-ly* and *being-green-t2-ly*, not bare redness and greenness. This isn’t mysterious – we already accept modal adverbialism (e.g., 'possibly P'). Perdurantism 'solves' change by eliminating it: what changes are *different parts*, not the whole object."  
     **Weakness:** "Modes" may feel underdeveloped compared to perdurantism’s mereological clarity.  

  4. **Objection (Perdurantist/Generalist):**  
     *"If properties are always instantiated in a temporally modified way, are there *any* intrinsic properties left? A thing’s 'redness t-ly' seems relational (to time), undermining intrinsicality – which was the point of temporary intrinsics!"*  
     **Reply (2-min):**  
     "Temporal modification isn’t a relation *to* time but a way of having the property *at* a time. Consider: 'I exist now' doesn’t make my existence relational. Similarly, 'the apple is red t-ly' attributes an intrinsic state *as temporally qualified*. The property itself (e.g., specific shade of red) remains intrinsic; the qualification concerns its mode of instantiation."  
     **Weakness:** Blurring intrinsicity/relationality risks satisfying nobody.  

  5. **Objection (Generalist/Perdurantist):**  
     *"Your 'epistemic/metaphysical' distinction seems ad hoc. Perdurantism explains why reidentification works (we track causal chains of temporal parts), while your view gives no account of *what grounds* our persistence judgments."*  
     **Reply (2-min):**  
     "I don’t deny epistemology needs grounding! But perdurantism *reifies* that grounding (temporal parts) into the metaphysics of persistence. We can accept causal/spatiotemporal continuity as *evidence* for persistence (epistemology) without equating persistence *with* that continuity (metaphysics). Endurance is the default; we explain reidentification *via* continuity, not *with* it."  
     **Weakness:** May seem to dodge the "grounding" question for identity itself.  

  6. **Objection (Historian):**  
     *"Isn’t your adverbialism just a revival of Ockham’s 'successive forms' or Scotus’s 'instants of nature'? Why is this not medieval presentism repackaged?"*  
     **Reply (2-min):**  
     "Crucially, those views often presupposed a dynamic A-series (presentism/growing block). My adverbialism is compatible with a B-theoretic eternal block universe. I’m not reducing existence to the present but qualifying instantiation across a manifold of equally real times. This is a *structural* claim about instantiation, not an ontological claim about time’s flow."  
     **Weakness:** Risks pedantry; historians may press analogies to medieval debates.  

  ---

  ### **The Nightmare Question**  
  **Objection (Savvy Perdurantist):**  
  *"You insist temporal modes aren’t relations to times. But if the apple’s ‘redness t-ly’ is distinct from its ‘redness t*-ly’, what *metaphysically differentiates* these modes? If the difference is just brute, your view is less explanatory than perdurantism. If it’s grounded in something deeper (e.g., primitive time-indexed tropes), doesn’t this collapse into temporal parts under another name – each ‘mode’ acting like a part-property?"*  

  **Why It’s Devastating:**  
  It exposes the central tension: **Can adverbialism truly avoid reifying temporal indexicality into the object’s structure?** If modes are irreducible, the view seems primitive; if analyzed, it risks mimicking perdurantism.  

  **How to Handle It (If Asked):**  
  1. **Concede the Primitivity:**  
     "Modes *are* primitive, but no more problematic than primitives in other theories (e.g., instantiation, parthood). Perdurantism needs temporal mereology; I need temporal qualification. Both have costs."  
  2. **Contrast with Parts:**  
     "Crucially, modes don’t *compose* the object or its properties. The apple is one entity bearing a single, temporally qualified property. Perdurantism proliferates entities (parts); I proliferate modes of instantiation. This is leaner ontology."  
  3. **Reframe the Burden:**  
     "Perdurantists must explain cross-temporal identity of worms/stages. I explain how one object has temporally diverse properties. My primitive is *more constrained* – it avoids your commitment to arbitrary spacetime worms."  
  4. **Fallback (If Pressed):**  
     "This shows a genuine metaphysical choice: accept temporal parts or primitive modes. But recall – my argument is that perdurantism’s *motivations* are flawed. If both views need primitives, mine better preserves intuition and avoids mereological bloat."

  ---

  **Final Prep Tips:**  
  - **Emphasize the Free Ride:** Hammer the "epistemic/metaphysical conflation" point in every reply.  
  - **Be Charitable to Perdurantists:** "I agree perdurantism is elegant, but elegance ≠ truth when motivations are suspect."  
  - **Flag Relativity Early:** Preempt the physics objection by noting compatibility in your closing remarks.  
  - **Stage Theorist Trap:** Always contrast "one object with modified properties" vs. "distinct temporal entities."  

  Good luck! Your strongest card is forcing perdurantists to defend why temporal parts *must* be the answer to epistemic questions.
