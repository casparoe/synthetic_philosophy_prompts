  6. **For one-shot, common prior, state common knowledge: Are the information structures partitional?**  
     - **No**: Leaf: **Rationalizability-only view**.  
     - **Yes**: Go to 8.  

  7. **For dynamic, common prior, state not common knowledge: Is the prediction required to hold under approximate common knowledge?**  
     - **Yes**: Leaf: **Coordinated-attack view (email-game)**.  
     - **No**: *Underexplored* (see diagnosis below).  

  8. **For one-shot, common prior, state common knowledge, partitional information: Is the situation about strategic actions or belief exchange?**  
     - **Strategic actions**: Leaf: **Correlated-equilibrium view**.  
     - **Belief exchange**: Leaf: **Aumann agreement and no-trade view** (paired, see note below).  

  ---

  #### Leaves (Named Positions):
  - **Rationalizability-only view**  
    - **Path**: One-shot without common prior (Q2→No), or one-shot with common prior but non-partitional information (Q6→No), or dynamic without common prior (Q3→No).  
    - **Position**: Players choose strategies that are best responses to *some* beliefs about others, with no consistency required between beliefs.  
    - **Awkward commitment**: Allows strategies that are conditionally dominated (e.g., in dynamic contexts) if players hold irrational off-path beliefs.  

  - **Global-games selection view**  
    - **Path**: One-shot, common prior, state not common knowledge (Q4→No).  
    - **Position**: Players use noisy private signals to select a unique equilibrium in coordination games (e.g., currency attacks), refining multiple equilibria.  
    - **Awkward commitment**: The selected equilibrium depends sensitively on arbitrary noise in signals, even if insignificant.  

  - **Backward-induction view**  
    - **Path**: Dynamic, common prior, state common knowledge (Q5→Yes).  
    - **Position**: Players optimize at every node, assuming future players will do the same (e.g., subgame perfection in perfect-information games).  
    - **Awkward commitment**: Requires specifying rational behavior at nodes *unreachable* under CKR, often invoking beliefs that defy the initial path (e.g., "irrational" threats must be ignored).  

  - **Correlated-equilibrium view**  
    - **Path**: One-shot, common prior, state common knowledge, partitional information, strategic actions (Q8→Strategic actions).  
    - **Position**: Players obey a shared correlating device (e.g., traffic light) if disobedience yields no expected gain, given their private signal.  
    - **Awkward commitment**: Players cannot use meta-information (e.g., "Why was this device chosen?") even if it would benefit them.  

  - **Aumann agreement and no-trade view**  
    - **Path**: One-shot, common prior, state common knowledge, partitional information, belief exchange (Q8→Belief exchange).  
    - **Position**: Agents cannot "agree to disagree" on posteriors (Aumann), and no Pareto-improving bets are possible (no-trade), as differences in beliefs vanish with shared updates.  
    - **Awkward commitment**: Rules out speculative trade or persistent disagreement between rational agents, contradicting real-world markets.  
    - **Note**: This leaf pairs Aumann agreement and no-trade—they share the same assumptions and are logically intertwined.  

  - **Coordinated-attack view (email-game)**  
    - **Path**: Dynamic, common prior, state not common knowledge, requiring robustness under approximate common knowledge (Q7→Yes).  
    - **Position**: Common knowledge is fragile; coordination (e.g., military attack) fails if communication is imperfect, even with high probability of success.  
    - **Awkward commitment**: Coordination collapses abruptly with minimal uncertainty, e.g., 99.9% message reliability may still imply 0% chance of coordination.  

  ---

  #### Diagnoses of Unoccupied Combinations:
  - **Dynamic, common prior, state not common knowledge, approximate CKR *not* required (Q7→No)**:  
    *Underexplored*. Concepts like sequential equilibrium address this but lack a unified "named" position in epistemic game theory.  
  - **One-shot, common prior, state common knowledge, non-partitional information (Q6→No)**:  
    *Unattractive*. Without partitionality (e.g., failing negative introspection), knowledge operators misbehave, making CKR hard to formalize. Rationalizability is a fallback.  
  - **Dynamic, no common prior (Q3→No)**:  
    *Coherent but limited*. Covered by rationalizability-only, but dynamic contexts amplify belief inconsistency (e.g., conflicting off-path beliefs).  

  #### Pairs the Tree Cannot Cleanly Separate:
  - **Aumann agreement and no-trade**: Share identical assumptions (one-shot, common prior, partitional information, belief exchange). The tree groups them, as they reflect the same epistemic principle (no beneficial updating divergence).  

  ---

  **Time Estimate**: ~10 minutes with a concrete case. For example, apply this tree to the "Centipede Game" (dynamic, common knowledge of payoffs → backward induction) or "Battle of the Sexes with signals" (one-shot, noisy signals → global games).
