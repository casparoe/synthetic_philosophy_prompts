prompt: |-
  I'm in a reading group that's been working through the algorithmic fairness literature, and we've hit a point of frustration. Every week someone presents a paper proposing a new fairness criterion — demographic parity, equalized odds, predictive parity, calibration, individual fairness, counterfactual fairness — and every week someone else points out that the new criterion either collapses into an old one under mild conditions or conflicts with another criterion that seems just as well-motivated. The impossibility results (the ones showing that calibration and certain balance conditions can't simultaneously hold except in degenerate cases, and their relatives) keep coming up, but we never seem to ask what they're actually telling us about the project of formalizing fairness in the first place.

  So before we read another proposal, I want to do the groundwork properly. Please write the desiderata that any adequate theory of algorithmic fairness must meet. I want the full specification: which cases a fairness criterion has to handle (hiring, lending, pretrial detention, medical triage — do these call for different things?), which distinctions it must respect (between process and outcome, between group and individual, between predictive and causal), which formal properties are required and which are merely nice to have, and which results from the adjacent literatures (the impossibility theorems, the causal hierarchy, results about infra-marginality) it cannot contradict. For each desideratum, give the motivating case or consideration — why should a theory of fairness care about this? Then flag which desiderata are non-negotiable and which are modeling choices that reasonable people can disagree about. Most importantly: tell me which subsets of these desiderata are jointly unsatisfiable given what we already know, and whether that means some of them need to be abandoned, weakened, or indexed to context. I'm less interested in a scorecard for existing proposals than in the structure of the requirements themselves — if the list turns out to be internally inconsistent, that's the result I most want to see laid out clearly, because it would explain why the literature feels stuck in a loop.
reasoning: |-
  Okay, the user is part of a reading group on algorithmic fairness and they're frustrated with the constant cycle of new fairness criteria being proposed, only to be shot down by impossibility results or conflicts with existing criteria. They want to step back and define what a comprehensive theory of fairness must include before diving into more papers. 

  Hmm, this is a sophisticated request. They're not looking for a summary of existing definitions but rather a meta-framework—the necessary conditions any fairness theory should satisfy. They specifically mention desiderata across different domains (hiring, lending, etc.), distinctions (process vs outcome, group vs individual), formal properties, and how to handle known impossibility results. 

  First, I need to map the landscape of what "fairness" could even mean here. The user’s frustration suggests they’ve seen enough paper-by-paper debates and now want the big picture. Key pain points: 
  - The impossibility theorems (like Kleinberg et al.'s or Chouldechova’s) keep resurfacing but aren’t being synthesized. 
  - They suspect some desiderata might be fundamentally incompatible, and they want that tension made explicit. 

  I should start by categorizing the axes of fairness: 
  1. **Scope**: Must cover key domains (hiring/lending/detention/triage) but recognize their ethical differences. Hiring might care more about procedural justice, triage about distributive outcomes. 
  2. **Epistemology**: Must clarify predictive vs causal claims—lending can’t confuse correlation with creditworthiness. 
  3. **Levels**: Group fairness (demographic parity) vs individual fairness (similar cases treated similarly) vs causal fairness (counterfactual impact). 
  4. **Constraints**: Formal properties (like compositionality) and empirical realities (infra-marginality, where group differences exist at decision boundaries). 

  The user’s deepest ask: "If this is inconsistent, show me why." So the response must highlight incompatibilities upfront. For example: 
  - You can’t have both calibration and error rate balance (equalized odds) unless the base rates are identical across groups—which they rarely are. 
  - Individual fairness requires a similarity metric, which often encodes bias. 
  - Counterfactual fairness needs untestable causal assumptions. 

  Non-negotiables: 
  - **Formal rigor** (no handwaving math) 
  - **Context-sensitivity** (fairness isn’t one-size-fits-all) 
  - **Harm specification** (who bears the cost of unfairness?) 

  Tensions to flag: 
  - **Process vs outcome**: In pretrial detention, due process (procedural) clashes with risk parity (outcome). 
  - **Group vs individual**: Equal lending approval rates (group parity) might deny loans to qualified applicants from high-risk groups (individual unfairness). 

  The conclusion should be blunt: No theory satisfies all desiderata because fairness is multi-faceted and contextual. The "loop" they observe is inevitable—but we can make choices explicit. Maybe suggest they structure future readings around these trade-offs: "Next week, let’s evaluate proposals by which desiderata they prioritize and which they compromise on."
answer: |-
  Below is a structured framework for evaluating theories of algorithmic fairness, grounded in philosophical, legal, and technical realities. I categorize desiderata as **non-negotiable**, **context-dependent**, or **aspirational**, and explicitly identify incompatibilities. The goal is to clarify *why* the literature feels stuck: **core tensions arise from competing ethical priorities that cannot be simultaneously satisfied in non-ideal societies**.

  ---

  ### **I. Foundational Non-Negotiables**  
  *These must hold in any domain, or the theory fails as "fairness".*

  1. **Formal Coherence**  
     - **Requirement**: No internal logical contradictions; avoids known impossibility results (e.g., Kleinberg et al.'s calibration/balance conflict, Chouldechova's parity trade-offs).  
     - **Why**: Fairness cannot demand mutually exclusive statistical properties (e.g., calibration + equalized odds with unequal base rates).  
     - **Status**: Non-negotiable. Violations imply the criterion is mathematically vacuous.

  2. **Explicit Value Specification**  
     - **Requirement**: Declares which ethical priorities it serves (e.g., equality, equity, rights preservation, welfare maximization).  
     - **Why**: "Fairness" is normative; criteria like demographic parity (equality of outcomes) vs. equalized odds (equality of errors) encode distinct values.  
     - **Status**: Non-negotiable. Unstated values lead to covert ideological imposition.

  3. **Harm Mitigation**  
     - **Requirement**: Must reduce identifiable harms (e.g., allocative harm in lending, dignitary harm in hiring).  
     - **Why**: Fairness is meaningless if it perpetuates status quo disparities (e.g., "fair" algorithms that replicate historical bias).  
     - **Status**: Non-negotiable. Fairness is instrumental to justice.

  ---

  ### **II. Domain-Specific Requirements**  
  *Vary by context; adequacy depends on application.*

  | **Domain**          | **Critical Distinctions**                          | **Desiderata**                                                                 | **Why Context Matters**                                                                 |
  |----------------------|----------------------------------------------------|--------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Hiring**          | Process vs. Outcome                                | **Process fairness**: Transparency, right to appeal. <br> **Individual fairness**: Similar qualifications → similar outcomes. | Hiring is identity-constitutive; procedural injustice causes dignitary harm.            |
  | **Lending**         | Predictive vs. Causal                              | **Causal fairness**: Loan approval based on *malleable* factors (e.g., debt ratio), not immutable traits. | Lending impacts economic mobility; predictive criteria (e.g., zip code) proxy for race. |
  | **Pretrial Detention** | Liberty vs. Public Safety                        | **Anti-classification**: Cannot use protected attributes (e.g., race) even as proxies. | Detention imposes bodily liberty deprivations; high stakes for false positives.         |
  | **Medical Triage**  | Welfare Maximization vs. Equity                 | **Dynamic fairness**: Prioritize by need *and* potential benefit (e.g., QALYs). | Scarce resources require utilitarian efficiency, risking exacerbation of health inequities. |

  ---

  ### **III. Formal & Epistemological Requirements**  
  *Technical rigor for operationalization.*

  4. **Causal Hierarchy Respect**  
     - **Requirement**: Must not confuse associational (predictive) and causal claims (e.g., "counterfactual fairness" requires causal graphs).  
     - **Why**: Fair hiring requires understanding *why* someone was rejected (e.g., was it their race or qualifications?).  
     - **Status**: Non-negotiable for causal claims; optional for purely predictive tasks.

  5. **Infra-Marginality Awareness**  
     - **Requirement**: Acknowledge that group differences may be largest *at* decision thresholds (e.g., loan approval cutoffs).  
     - **Why**: Ignoring this leads to "fairness gerrymandering" (fair on average, unfair at margins).  
     - **Status**: Non-negotiable. Proven by Simoiu et al.'s threshold-testing analyses.

  6. **Compositionality**  
     - **Requirement**: Fairness should hold when systems are composed (e.g., hiring pipeline: resume screen → interview).  
     - **Why**: Unfair stages can amplify bias downstream (Dwork et al.'s "fairness pipelines").  
     - **Status**: Aspirational. Rarely achieved; most criteria are local.

  ---

  ### **IV. Tensions & Incompatibilities**  
  *Proven trade-offs that force compromises.*

  | **Conflict**                           | **Underlying Reason**                                                                 | **Resolution**                                                                 |
  |----------------------------------------|---------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | **Group vs. Individual Fairness**      | Satisfying group parity (e.g., demographic parity) often violates individual fairness (similar cases treated dissimilarly). | **Weaken group fairness**: Allow deviations justified by risk/need factors. |
  | **Calibration vs. Error Balance**      | Calibration (P(outcome\|score)=score) conflicts with equalized odds if base rates differ. | **Choose based on harm**: Calibration for lending (accurate risk); error balance for detention (equal false positives). |
  | **Predictive Parity vs. Anti-Classification** | Predictive parity (equal PPV/NPV) requires using group membership if base rates differ, violating anti-classification. | **Abandon predictive parity**: It entrenches historical disparities (Corbett-Davies et al.). |
  | **Process vs. Outcome**                | Procedurally fair processes (e.g., explainable models) can yield biased outcomes.    | **Hybrid models**: Use process fairness for dignity-sensitive domains (hiring), outcome fairness for resource allocation (triage). |

  ---

  ### **V. Aspirational Desiderata (Often Unattainable)**  
  *Reasonable disagreements allowed here.*

  7. **Robustness to Distribution Shift**  
     - Fairness should hold if population demographics change (rarely achievable; models degrade).

  8. **Minimal Assumption Burden**  
     - E.g., counterfactual fairness relies on untestable causal assumptions. Simpler criteria (e.g., demographic parity) avoid this but are less nuanced.

  9. **Long-Term Equilibria**  
     - Fairness should improve societal outcomes over time (e.g., avoid "performative prediction" traps).

  ---

  ### **Conclusion: Why the Literature is Stuck**
  **The core inconsistency**: Fairness theories attempt to satisfy three incompatible goals:  
  1. **Statistical parity** (group equality),  
  2. **Merit-based allocation** (individual fairness), and  
  3. **Harm reduction** (correcting historical injustice).  

  **Implication**: No theory can simultaneously achieve all non-negotiables across domains because:  
  - Impossibility theorems prove mathematical trade-offs.  
  - Ethical priorities (e.g., liberty in detention vs. efficiency in triage) conflict.  
  - Causal inference requires contested assumptions.  

  **Path forward**:  
  1. **Domain-specificity**: Reject universal criteria. Fairness in lending ≠ fairness in hiring.  
  2. **Explicit trade-offs**: Admit when criteria prioritize one value (e.g., equity) over another (e.g., liberty).  
  3. **Hybrid models**: Combine process fairness (for legitimacy) with constrained outcome fairness (e.g., "We allow predictive disparities only if causally justified").  

  Your reading group's frustration stems from the field's attempt to solve an ethical-political problem with statistics alone. The "loop" won't break until proposals openly declare which values they sacrifice and why. A theory of fairness must start by asking: *"Who can be harmed, and what are we willing to sacrifice to protect them?"*—not with a new statistical measure.  

  Would you like a domain-specific deep dive (e.g., lending vs. detention) or a flowchart for navigating trade-offs?
