  My colleague in cog sci has been pretty consistent about which systems she thinks have genuine representations. Her track record: thermostat, no; bee waggle dance, yes; the activation patterns in the final layers of a CNN trained on ImageNet, yes; a simple lookup table, no; the internal states of a finite-state automaton running a reflex agent, no; word2vec embeddings, yes; the hidden states of a transformer language model, yes. And here's the one that surprised me: the feature maps in early layers of a vision model — edge detectors, orientation detectors, that kind of thing — she said no, those are just detectors, not representations.

  Now we're looking at those linear directions people find in the residual stream of language models, the ones that seem to correspond to concepts like truthfulness, refusal, sycophancy. She's going to tell us her verdict next week. Before she does, I want to figure out what theory of representation she's implicitly running. What do you think she'll say about the residual stream directions, and what makes her earlier verdicts hang together? And if there's a case I haven't thought of that would tell the candidate theories apart better than this one, what is it?
