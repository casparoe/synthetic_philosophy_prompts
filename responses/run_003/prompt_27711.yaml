  ## Commissioner Memo: Recommendation on Lost-Years Damages  
  **To:** Law Reform Commission Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Proposal to Amend Wrongful Death Statute - Lost-Years Damages  

  ### I. Recommendation  
  **Adopt the lost-years provision.** While the Epicurean objection raises profound questions, it does not justify denying legal recognition to the objective value of a human life cut short. The provision aligns wrongful death law more closely with foundational principles of tort law and society’s valuation of life itself.  

  ### II. The Proposal and the Core Objection  
  The proposal seeks to compensate for the *decedent’s own loss*—the experiences, relationships, and potential extinguished by wrongful death. This contrasts with our current statute, which compensates only *survivors’ losses* (financial support, companionship, funeral expenses).  

  The deepest objection, rooted in Epicurean philosophy, contends that death cannot harm the deceased. As there is "no subject" to experience the deprivation after death, the "lost years" constitute no real injury to the decedent. Awarding damages for this purported loss would thus be a legal fiction—compensating the living under the guise of redressing the dead.  

  ### III. Engaging the Epicurean Argument  
  **A. The Argument’s Strength**  
  The Epicurean view is logically coherent and forces a critical distinction: between *antemortem* suffering (fear of death, pain of dying) and *postmortem* nonexistence. It correctly observes that the deceased cannot *subjectively experience* loss after death. This challenges the intuitive notion that death is a "harm to the one who dies." If we require conscious suffering for legal injury, the objection is formidable.  

  **B. Why It Is Not Dispositive**  
  1. **The Law Recognizes Objective Harms Beyond Subjective Experience**:  
     Tort law routinely compensates for harms the victim *never consciously experienced*. Examples include:  
     - A person rendered permanently unconscious before death recovers for their lost lifetime of experience (*McDougald v. Garber*).  
     - Courts award damages for the loss of future earning capacity to estates, even though the deceased will never use those funds.  
     - Defamation claims survive death, acknowledging injury to the decedent’s reputation they cannot experience posthumously.  
     The law protects human interests—autonomy, dignity, the fulfillment of potential—even when subjective experience is absent.  

  2. **Death as Deprivation, Not Mere Nonexistence**:  
     The "lost years" claim does not rely on the deceased experiencing their own absence. It recognizes that wrongful death *objectively deprives* a person of the life they otherwise would have lived. This deprivation is a present fact at the moment of death, even if unfelt. As Thomas Nagel argues, death is an evil because it eliminates the goods life would have contained. The law can acknowledge this deprivation without requiring a "subject" to feel it posthumously.  

  3. **Moral and Legal Consistency**:  
     If the Epicurean view were controlling, it would undermine core legal principles. For example:  
     - Criminal law treats homicide as the ultimate crime *against the victim*, not merely an offense against survivors or the state.  
     - Advance directives allow individuals to control posthumous medical decisions, reflecting interests that persist beyond consciousness.  
     Rejecting lost-years damages because death "is not experienced" creates an incongruity with how the law values life in other contexts.  

  ### IV. Addressing the Strongest Reason for Rejection  
  **The strongest counterargument** is that awarding damages for the decedent’s lost years *cannot truly compensate the deceased* and thus functions as a disguised windfall to heirs or the estate, untethered from the decedent’s interests.  

  **Response**: This concern is valid but not insurmountable. Damages for lost years would flow to the decedent’s estate, supporting the decedent’s unfulfilled projects, dependents, or legacies—much like compensation for lost future earnings. While the deceased cannot receive the funds, the award serves as society’s recognition that a human life has intrinsic value beyond its utility to others. It also reinforces deterrence: wrongful actors bear the full cost of extinguishing a life’s potential.  

  ### V. Conclusion  
  The Epicurean argument is a serious philosophical challenge but does not compel rejection of lost-years damages. Law exists not only to redress felt harms but to affirm and protect fundamental human goods. Failing to acknowledge the objective loss of a life unjustly cut short diminishes the law’s moral coherence and devalues the very existence it seeks to protect. **I urge the Commission to adopt this provision.**  

  Respectfully submitted,  
  [Your Name]  

  ---

  ### Key Features of This Opinion:
  1. **Clear Recommendation**: Unambiguous "yes" in the opening.  
  2. **Direct Engagement with Epicurus**: Treats the objection as logically valid but legally non-dispositive.  
  3. **Legal, Not Purely Philosophical, Grounding**: Anchors the rebuttal in tort law precedents and principles.  
  4. **Concession to the Losing Side**: Acknowledges the "windfall" risk as the strongest counterargument and offers a pragmatic response.  
  5. **Bridging Moral Intuition and Law**: Emphasizes the law’s role in affirming societal values beyond subjective experience.  
  6. **Accessible to Non-Philosophers**: Avoids jargon; uses relatable legal analogies (unconscious plaintiffs, defamation, criminal law).  

  This approach respects the commissioners’ philosophical concerns while centering the discussion on the law’s capacity—and responsibility—to recognize profound human losses.
