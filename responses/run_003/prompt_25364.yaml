prompt: |-
  I'm a GP at a practice that's gotten a bit of a reputation for being, let's say, open-minded about prescribing for what you might call enhancement rather than treatment — modafinil for healthy people pulling all-nighters, beta-blockers for musicians with performance nerves, that kind of thing. The other doctors and I have realized we have no consistent way of deciding which requests to say yes to, and it's starting to cause real tension. One colleague thinks we should just say no to anything that isn't treating a diagnosed condition; another thinks if it's safe and the patient wants it, why not. I'm somewhere in the middle and I'd like something more principled than my gut.

  I want a decision procedure I can actually run through in a ten-minute consult. It should be grounded in whatever the philosophy of medicine has actually worked out about the therapy/enhancement distinction, but it has to be usable by someone who last read philosophy in undergrad. Give me the steps in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it hands off to clinical judgment because the question is really one of values rather than facts.

  Then run it on three cases:

  (1) A college student with no ADHD diagnosis asking for Adderall during finals week.
  (2) A short but otherwise healthy twelve-year-old boy — predicted adult height 5'2", no growth hormone deficiency — whose parents want growth hormone.
  (3) A recently widowed seventy-year-old who doesn't meet the criteria for clinical depression but wants an SSRI to "get through this."

  I need you to actually commit to a specific procedure and defend where you drew the lines — don't just lay out the philosophical options and leave me to pick. And flag honestly where the procedure gives an answer I'm probably not going to like.
reasoning: |-
  Okay, let me unpack this GP's request. They're facing real clinical tension in a practice known for "open-minded" prescribing - modafinil for healthy students, beta blockers for performers - and need a principled yet practical decision tool. The core struggle is balancing medical necessity against patient autonomy in enhancement requests.

  The GP wants three key things: a step-by-step procedure usable in 10-minute consults, philosophical grounding without academic jargon, and concrete application to three thorny cases. Crucially, they demand specificity - no cop-outs about "clinical judgment" where avoidable. Underneath this, I sense their deeper need: to reduce moral distress and inconsistency while maintaining patient trust.

  Hmm... the philosophical framework needs simplifying. I'm considering Juengst's enhancement taxonomy and Daniels' normal function theory as anchors, but must avoid turning this into a lecture. The procedure should mirror clinical reasoning: start with safety (non-maleficence), then medical necessity (beneficence), then alternatives (resource stewardship), and finally values alignment (autonomy). 

  For the cases: 
  Adderall for exams hits immediate safety concerns - cardiac risks in healthy hearts. Growth hormone is trickier - the psychosocial harm of extreme short stature might justify intervention despite normal GH levels. The widower's SSRIs request is ethically delicate - medicalization of grief versus preventing prolonged suffering. 

  I'll flag where conclusions might frustrate: saying no to Adderall will disappoint students, refusing growth hormone anguishes parents, and SSRI gatekeeping can feel cruel. But the procedure must withstand ethical scrutiny, not popularity. 

  The real art is structuring each step to either yield a clear no or hand off cleanly to shared decision-making. For instance, beta-blockers for musicians might clear all medical hurdles (safe, effective for performance anxiety) but still require "Is stage fright within normal human variation?" That's where values discussion begins.
answer: |-
  Here’s a concrete, step-by-step decision procedure grounded in medical ethics principles (primarily beneficence, non-maleficence, autonomy, and justice), designed for a 10-minute consult. It prioritizes **safety**, **medical necessity**, and **proportionality**, while flagging where values-based judgment is unavoidable. The procedure stops with a "no" if critical safety/necessity thresholds fail, and defaults to "clinical judgment + shared decision-making" when the request inhabits an ethically ambiguous zone.

  ---

  ### **The Decision Procedure: "SAFE-PATH" Framework**  
  *(Run steps in order; stop at first "no" or proceed to shared decision-making)*  

  1. **S: SAFETY RISK**  
     - *Question:* "Is there reliable evidence this intervention is **low-risk** for *this* patient, *at this dose/duration*, for the requested use?"  
     - **Sufficient "yes"**: No red flags in medical history; established short-term safety data for off-label use; low addiction/abuse potential.  
     - **Automatic "no"**: High risk of serious harm (e.g., cardiac events, addiction, irreversible side effects), OR no safety data for this use.  
     - *Handoff to judgment*: Moderate/uncertain risk (e.g., long-term unknowns).  

  2. **A: ACTUAL PATHOLOGY**  
     - *Question:* "Does the patient have a **diagnosable condition** that this intervention is proven to treat?"  
     - **Sufficient "yes"**: Meets diagnostic criteria (e.g., ADHD, growth hormone deficiency, major depression).  
     - **Automatic "no"**: No pathology exists OR intervention is ineffective for claimed purpose (e.g., SSRIs for normal grief).  
     - *Handoff to judgment*: Subthreshold symptoms (e.g., "mild" depression not meeting DSM criteria).  

  3. **F: FUNCTIONAL IMPAIRMENT**  
     - *Question:* "Is the patient experiencing **significant distress or functional impairment** in daily life *due to the condition*?" (If no pathology at Step 2, skip to Step 4).  
     - **Sufficient "yes"**: Documented impairment (e.g., failing grades due to focus issues, severe bullying due to height).  
     - **Automatic "no"**: Purely cosmetic/enjoyment-based request with no functional impact (e.g., "I want to be taller for fun").  

  4. **E: EFFICACY FOR GOAL**  
     - *Question:* "Is there **strong evidence** this intervention achieves the patient’s stated goal?"  
     - **Sufficient "yes"**: Robust data for the specific outcome (e.g., beta-blockers reducing performance anxiety).  
     - **Automatic "no"**: Evidence shows inefficacy OR goal is unrealistic (e.g., Adderall improving grades in non-ADHD students [evidence says no]).  

  5. **P: PROPORTIONALITY**  
     - *Question:* "Do the **benefits outweigh burdens** (cost, side effects, medicalization) for *this* patient’s goal?"  
     - **Sufficient "yes"**: High benefit/low burden (e.g., short-term beta-blockers for a crucial piano exam).  
     - **Automatic "no"**: High burden/disproportionate risk (e.g., growth hormone injections for years for 2" height gain).  
     - *Handoff to judgment*: Moderate benefit/burden balance (e.g., SSRIs for subclinical grief).  

  6. **A: ALTERNATIVES EXHAUSTED**  
     - *Question:* "Have **lower-risk, non-medical alternatives** been tried/failed?"  
     - **Sufficient "yes"**: Patient demonstrates effort (e.g., tutoring + caffeine for focus; therapy for grief; nutrition/sleep for height).  
     - **Automatic "no"**: Alternatives exist, are effective, and patient refuses to engage.  

  7. **T: THERAPEUTIC vs. ENHANCEMENT (Values Checkpoint)**  
     - *If all prior steps are "yes" or handoffs, ask:* "Is this use **restoring normal function** or **enhancing beyond it**?"  
       - *Therapeutic*: Returns patient to species-typical functioning (e.g., treating depression to regain baseline mood).  
       - *Enhancement*: Exceeds typical function (e.g., modafinil for 72-hour focus).  
     - **No automatic "no"** – This step is **always a handoff to clinical judgment + shared decision-making**. Discuss:  
       - Patient values/autonomy ("Why is this important to you?")  
       - Justice concerns (e.g., "Is this fair to patients who can’t access enhancements?")  
       - Medicalization risks (e.g., pathologizing normal life).  

  8. **H: HARM MITIGATION PLAN**  
     - *If proceeding:* "What safeguards prevent misuse?" (e.g., limited prescription, monitoring, discontinuation plan).  

  ---

  ### **Application to Cases**  
  **Case 1: College student requesting Adderall for finals**  
  - **S (Safety)**: Moderate risk (cardiac side effects, addiction potential in non-ADHD). → *Handoff?*  
  - **A (Pathology)**: No ADHD diagnosis. → **AUTOMATIC NO** (Stop here).  
    - *Rationale*: No pathology exists, and Adderall lacks efficacy for cognitive enhancement in healthy people (Step 4 would also fail per evidence). *This "no" may frustrate students, but safety and efficacy barriers are clear.*  

  **Case 2: Healthy 12 y/o boy, predicted height 5’2", requesting growth hormone**  
  - **S (Safety)**: Low short-term risk, but long-term unknowns (diabetes, hypertension). → *Handoff?*  
  - **A (Pathology)**: No growth hormone deficiency (normal variant short stature). → Proceed.  
  - **F (Functional Impairment)**: Significant bullying/distress likely? If documented → *Handoff* (if severe). If mild/no impairment → **NO**.  
  - **E (Efficacy)**: Modest gain (2–3"), high cost/burden. → **AUTOMATIC NO** at **P (Proportionality)**.  
    - *Rationale*: Burdens (years of daily injections, $10k–$30k/year, side effects) vastly outweigh benefit for non-medical goal. *Parents may be upset, but medicine shouldn’t normalize invasive treatments for social preferences.*  

  **Case 3: Widowed 70 y/o requesting SSRIs for grief**  
  - **S (Safety)**: Low risk (if no contraindications). → **Yes**.  
  - **A (Pathology)**: No MDD diagnosis. → Proceed.  
  - **F (Functional Impairment)**: "Getting through this" suggests distress. Assess: Is she unable to eat/sleep/work? If yes → *Handoff*. If managing basics → **NO**.  
  - **E (Efficacy)**: Weak evidence for SSRIs in normal grief. → **AUTOMATIC NO** at Step 4.  
    - *Rationale*: SSRIs are ineffective for non-pathological grief and may impede natural processing. *Better: Handoff to Step 6 → explore therapy/support groups.*  

  ---

  ### **Why This Works**  
  1. **Philosophical grounding**:  
     - Prioritizes **medical necessity** (Steps 2–3) and **safety/efficacy** (Steps 1,4) over enhancement.  
     - **Proportionality** (Step 5) addresses resource stewardship and avoids "medicalization creep."  
     - **Therapeutic/Enhancement distinction** (Step 7) is a *discussion starter*, not a barrier – respecting autonomy where risks are low.  
  2. **Practicality**:  
     - Clear "no" gates at safety, pathology, efficacy, and proportionality.  
     - Forces consideration of alternatives (Step 6).  
     - Values discussions only occur *after* medical thresholds are met.  
  3. **Honest Flags**:  
     - You’ll say "no" to most enhancement requests (e.g., Adderall).  
     - "Handoffs" require tough conversations (e.g., "Why does your child’s height cause more distress than another’s nose shape?").  
     - Proportionality may conflict with patient desires (e.g., growth hormone).  

  This framework ensures **consistency** without rigidity – and keeps the "open-minded" reputation focused on thoughtful patient engagement, not unchecked enhancement.  

  > *"Medicine's role isn't to fulfill all desires, but to weigh desires against our duty to heal without harm."*  
  > — Adapted from Eric Juengst (enhancement ethics)
