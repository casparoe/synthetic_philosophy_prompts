prompt: |-
  I've been covering science and ideas for a while now, and I've realized I have no idea what my actual view is about unrealistic assumptions in models. Like, I have strong feelings about specific cases but I can't extract a principle from them, and it's starting to bug me. Here are my verdicts — maybe you can tell me what rule I'm implicitly running, or what rule I should be running, and which of my verdicts it forces me to give up.

  1. The ideal gas law — point particles with zero volume and no intermolecular forces. Completely fine. It's a first approximation, everyone knows the deal, it's useful across a huge range of conditions.

  2. Frictionless planes in intro physics. Also totally fine. No one walks away thinking surfaces are actually frictionless.

  3. The Modigliani-Miller theorem — firm value is independent of capital structure, but only under no taxes, no bankruptcy costs, no information asymmetries, and perfect markets. As a theoretical benchmark I think it's fine. But I get annoyed when people cite it loosely in policy debates without acknowledging the assumptions, which happens constantly.

  4. Rational expectations in macroeconomics — the assumption that people form expectations as if they know the true model of the economy. I basically think this is not okay. It's not a simplification, it's a falsification, and the falsification drives the results. I don't care that it's "as-if."

  5. Hardy-Weinberg equilibrium — infinite population, no mutation, no selection, no migration, random mating. Completely fine. It's a null model. You use it to detect departures, not to describe the world.

  6. Black-Scholes option pricing — continuous trading, no transaction costs, constant volatility, geometric Brownian motion. As a starting point for thinking about options, fine. Traders who plugged numbers in without thinking about the assumptions were being reckless, but I don't blame the model for that.

  7. Friedman's billiard player — you predict an expert's shots by assuming they compute optimal angles and velocities, which they obviously don't do consciously. I'm weirdly fine with this. It's an as-if model and it predicts well. But wait — how is this different from rational expectations? I'm suddenly aware that I'm being inconsistent and I don't know how to fix it.

  8. Climate models that parameterize cloud formation crudely because we can't resolve clouds at grid scale. I'm fine with this, even though the parameterizations are known to be rough and they affect the projections. What else are you supposed to do? But I feel like I'm giving climate models a pass I don't give rational expectations models, and that bothers me.

  9. The strong-form efficient market hypothesis — prices reflect all information, public and private. I think this is not fine as anything other than a toy, and the fact that it was taken seriously for so long did real damage. But I'm fine with Modigliani-Miller which shares a lot of its DNA. What gives?

  So what's my principle? It's not "assumptions are fine if the model predicts well," because Hardy-Weinberg doesn't predict anything by itself and I'm fine with it. It's not "assumptions are fine if they're flagged," because rational expectations models flag their assumptions and I still don't like them. It's not "assumptions are fine if they're false but harmless," because I can't define harmless without just pointing at my verdicts. Is there a coherent position here, and if so, which of my verdicts does it force me to revise? Also, what would it say about a case I didn't list — agent-based models in epidemiology that assume every individual follows identical simple interaction rules?
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a science writer grappling with inconsistent judgments about unrealistic model assumptions across different fields. The core tension is between recognizing the utility of simplification versus rejecting what feels like harmful distortion. 

  Hmm, looking at their examples—from physics to finance to biology—their approvals seem tied to models that serve as deliberate reference points (ideal gas, Hardy-Weinberg) or pragmatic workarounds (climate parameterization). Their rejections cluster around assumptions that claim descriptive realism while actively ignoring known behavioral complexities (rational expectations, strong-form EMH). 

  Ah! The Modigliani-Miller case is revealing. They accept it as a theoretical benchmark but object when it's weaponized in policy debates without caveats. That suggests context matters—not just the model's purpose but how it's deployed in discourse. 

  Wait, their struggle with Friedman's billiard player versus rational expectations is particularly thorny. Both use "as-if" justification. But perhaps the difference lies in scope: billiard predictions are narrow and verifiable, while rational expectations impose uniformity on a complex adaptive system. One is a localized tool, the other a worldview masquerading as methodology. 

  Climate models get a pass because they're transparently imperfect tools wrestling with irreducible complexity—the alternative being no model at all. Whereas strong-form EMH persisted as dogma despite contradicting trader behavior and market crises. 

  For the unlisted epidemiology case, I'd guess they'd tolerate identical agents if framed as "first-order dynamics we can refine" but reject it if presented as complete behavioral truth. The litmus test seems to be: does this assumption expand or contract our capacity to engage reality?
answer: |-
  Your verdicts reveal a coherent principle centered on **purpose, transparency, and consequence**. The inconsistency stems from applying this principle unevenly. Here's the framework you're implicitly using:

  ### Your Core Principle:
  **Unrealistic assumptions are acceptable when they serve a clearly defined, context-appropriate purpose without obscuring crucial complexities or causing real-world harm through misuse.**  
  *(Key factors: Purpose, Domain, Scale, Consequences, and Transparency in application)*

  ---

  ### How Your Verdicts Fit (and Where They Conflict):
  1. **Ideal Gas Law / Frictionless Planes / Hardy-Weinberg**:  
     - ✅ **Purpose**: Pedagogical or baseline null models.  
     - ✅ **Domain**: Limited-scale systems with well-understood deviations.  
     - ✅ **Consequence**: Misuse is rare; deviations are actively taught.  
     - ✅ **Transparency**: Assumptions are explicitly foregrounded.

  2. **Modigliani-Miller**:  
     - ✅ **Purpose**: Theoretical benchmark for testing real-world frictions.  
     - ❗ **Conflict**: You reject its *misapplication* in policy debates. This highlights your emphasis on **consequence**—when assumptions are ignored in high-stakes contexts, the model becomes harmful.

  3. **Rational Expectations**:  
     - ❌ **Purpose**: Positioned as a descriptive mechanism (not just "as-if").  
     - ❌ **Domain**: Complex adaptive systems (economies) where the assumption alters core dynamics.  
     - ❌ **Consequence**: Obscures behavioral diversity; influences policy ignoring known irrationalities.  
     - 🔄 **Inconsistency**: You reject its "as-if" defense, but accept Friedman's billiard player. Why?  
       - *Resolution*: Billiard physics is **verifiable at the outcome level** (prediction works) and has **narrow scope**. Rational expectations makes **unfalsifiable claims about internal processes** in open-ended systems.

  4. **Black-Scholes**:  
     - ✅ **Purpose**: Foundational tool, not a complete market description.  
     - ❗ **Consequence**: You blame reckless *users*, not the model itself, because its limitations are quantifiable (e.g., volatility smiles).

  5. **Climate Model Parameterizations**:  
     - ✅ **Purpose**: Necessary pragmatism for computational feasibility.  
     - ✅ **Transparency**: Uncertainties are acknowledged and studied (e.g., in IPCC reports).  
     - ✅ **Consequence**: No better alternative; errors are actively mitigated.

  6. **Strong-Form EMH**:  
     - ❌ **Purpose**: Framed as a market reality (not a toy).  
     - ❌ **Consequence**: Enabled regulatory complacency; ignored market failures.  
     - 🔄 **Inconsistency vs. Modigliani-Miller**: EMH was weaponized as dogma; MM is used cautiously in finance.

  ---

  ### Revising Your Verdicts:
  - **Rational Expectations**: Your rejection holds under this principle. It fails the "purpose/consequence" test by claiming psychological realism while driving policy in ways that ignore systemic fragility.  
  - **Friedman’s Billiard Player**: Your acceptance is consistent—it’s a constrained "as-if" model with high predictive power in a closed system, and no significant harm from its use.  
  - **Modigliani-Miller**: Requires nuance. Your *annoyance at misuse* is justified, but the model itself is valid. The issue is **user ethics**, not the assumption.  

  ---

  ### The Unlisted Case: Epidemic ABMs with Identical Agents  
  **Your Likely Verdict**: ✅ **Acceptable with caveats**.  
  - **Purpose**: Exploratory tool for emergent dynamics, not individual prediction.  
  - **Domain**: Population-level trends often tolerate homogeneous agents.  
  - **Transparency**: Researchers usually acknowledge this simplification.  
  - **Consequence**: Harmless if framed as a "first-pass" model; harmful if used for precise policy without heterogeneity tests.  

  ---

  ### Summary of Your Implicit Rule:
  > **"Unrealistic assumptions are permissible when they are:  
  > (a) Fitted to a model's purpose (pedagogy, baseline, pragmatism);  
  > (b) Transparently communicated; and  
  > (c) Unlikely to cause harm by obscuring critical real-world complexities when applied."**  

  **To be consistent**:  
  - Forgive assumptions in **constrained, pedagogical, or exploratory contexts** (e.g., billiards, Hardy-Weinberg).  
  - Reject assumptions that **deny essential complexities in high-stakes domains** (e.g., rational expectations, strong-form EMH).  
  - Judge **misapplication harshly**, not the model itself (e.g., Modigliani-Miller in policy debates).  

  This framework preserves most of your verdicts while forcing clearer reasoning on *why* rational expectations bothers you more than Friedman's billiards (scale/consequence) or climate models (necessity).
