  Timing is tight—40 minutes minus Q&A. I’ll allocate heavily to the interactive footprint segment (15 mins) because that’s where the "aha" moment happens. Theory virtues get only 5 minutes; we can name-drop simplicity/scope but not dive deep. The key is sustaining energy, not covering every nuance.  

