  ## Research Proposal: Untangling Standing to Blame - The Epistemic-Normative Distinction in Hypocritical Criticism

  **1. Project Title:** Beyond Invalidity: Distinguishing Epistemic Force from Normative Standing in Hypocritical Blame

  **2. Statement of the Research Question:**
  The central question this project aims to address is: **Does hypocritical blame compromise the *truth* of the criticism itself, or does it instead undermine the blamer's *normative authority* to demand specific responses (e.g., apology, reparation, self-correction) from the target, and how does distinguishing these aspects resolve persistent disagreements in the "standing to blame" debate?**

  **3. Background and Significance:**
  The philosophical debate surrounding "standing to blame" focuses on the conditions under which an agent is entitled or positioned to level moral criticism against another. Hypocrisy – blaming another for a fault one possesses oneself – is widely considered a potential defeater of standing. However, the debate is characterized by persistent disagreement. Some argue hypocrisy entirely invalidates the blame, rendering it inappropriate or ineffective ("no standing"). Others argue hypocrisy is irrelevant to the truth of the criticism ("standing intact"), or that it only weakens but doesn't destroy standing. This project contends that this stalemate arises because the concept of "standing" is being asked to do two distinct jobs, and these jobs are being conflated:

  1.  **Epistemic/Assertoric Standing:** Does the hypocrite's criticism *accurately identify* a genuine moral failing in the target? Does it convey a true moral proposition?
  2.  **Normative/Demanding Standing:** Does the hypocrite possess the *moral authority* to *demand* a specific responsive action (like apology, reparation, or self-justification) *from the target*? Does the target owe *this particular blamer* an answer or amends?

  The core hypothesis is that **hypocrisy primarily damages the *Normative/Demanding Standing* while often leaving the *Epistemic/Assertoric Standing* intact.** A hypocrite can correctly identify a wrong (epistemic force remains) but simultaneously lack the moral position to insist that the wrongdoer answer specifically *to them* or make amends specifically *to them* (normative authority is compromised). Much of the back-and-forth in the literature, this project argues, occurs because proponents of different views implicitly focus on one aspect while opponents focus on the other, talking past each other.

  **4. Why Existing Positions Do Not Settle It:**
  Existing literature often fails to explicitly separate these dimensions:
  *   Positions emphasizing the *invalidity* of hypocritical blame often implicitly conflate the blamer's lack of moral credibility (affecting normative demandingness) with the falsity of the criticism itself (epistemic standing).
  *   Positions defending the *truth* of the hypocrite's criticism sometimes fail to adequately explain why the hypocrisy still feels intuitively wrong or why the target might rightfully resist the hypocrite's *demands* (focusing solely on epistemic standing while neglecting the compromised normative standing).
  *   Positions advocating for a "weakened" standing often gesture at both aspects but lack a clear framework for articulating *how* and *why* they differ and interact. The debate frequently slides between questions like "Is the criticism true?" (epistemic) and "Must the target apologize *to the hypocrite*?" (normative/demanding) without clearly marking the shift.

  This project argues that explicitly distinguishing these two types of "standing" provides a clearer map of the conceptual terrain, dissolves apparent contradictions, and offers a more nuanced explanation for the intuitive pull of *both* sides of the debate.

  **5. Research Plan and Methodology:**
  This is a project in analytic moral philosophy, employing conceptual analysis and argumentative engagement with key texts. The methodology will be structured as follows:

  *   **Phase 1: Conceptual Mapping & Distillation (Weeks 1-4):**
      1.  Identify and analyze core arguments from prominent positions in the standing-to-blame debate (e.g., Wallace on holding responsible and normative powers; Coates & Tognazzini on the nature of standing; Todd on hypocritical advice; Bell on standing and demandingness; Fritz & Miller on hypocritical blame and standing). Focus specifically on how they characterize the *defect* in hypocritical blame.
      2.  Systematically extract and define the two proposed concepts: **Epistemic/Assertoric Standing** (grounded in the truth/falsity of the criticism and the blamer's minimal epistemic position to recognize it) and **Normative/Demanding Standing** (grounded in the blamer's moral relationship to the fault, their own record, and their entitlement to elicit specific responsive actions *from the target*).
      3.  Construct precise definitions and necessary/sufficient conditions (where possible) for each type of standing.
  *   **Phase 2: Applying the Distinction (Weeks 5-8):**
      1.  Re-examine key arguments and thought experiments from the literature (e.g., the serial adulterer blaming infidelity; the tax evader blaming theft; the environmentalist with a private jet blaming pollution) through the lens of the distinction.
      2.  Demonstrate how specific disagreements can be resolved by showing that one side argues about Epistemic Standing (e.g., "But the criticism *is* true!") while the other argues about Normative/Demanding Standing (e.g., "But *you* have no right to demand an apology!").
      3.  Develop and analyze original or modified thought experiments designed to tease apart the two types of standing. (E.g., Does a hypocrite retain the epistemic standing to *warn* a third party about the target's fault, even while lacking normative standing to demand an apology *from the target*? Can a hypocrite accurately *describe* the target's fault in a neutral context, like testimony, even if demanding a response is illegitimate?)
      4.  Explore the relationship between the two standings: Does compromised Normative Standing *ever* affect Epistemic Standing? (Proposed answer: Generally no, but extreme hypocrisy *might* raise doubts about sincerity or understanding, though the core truth remains separable). How do they interact in the overall phenomenology of blame?
  *   **Phase 3: Synthesis and Implications (Weeks 9-12):**
      1.  Articulate the refined position: Hypocrisy primarily undermines Normative/Demanding Standing by violating conditions of fairness, non-hubris, or the right to call to account, but rarely negates the basic truth-tracking function of the criticism (Epistemic Standing).
      2.  Discuss implications for related concepts: What does this mean for "moral credibility"? For the appropriateness of *feeling* blamed by a hypocrite? For the target's obligations (e.g., do they still owe amends, just not necessarily *to the hypocrite*?)?
      3.  Draft the research paper synthesizing the analysis and arguments developed in Phases 1 and 2.

  **6. Feasibility, Risks, and Limitations:**
  *   **Feasibility:** The project is well-suited for one semester. It focuses on a specific, well-defined debate within moral philosophy. The method (textual analysis, conceptual distinction, argument construction, thought experiments) is standard philosophical practice for an undergraduate project. The core insight is already articulated; the work involves rigorous development and defense.
  *   **Key Risks and Limitations:**
      *   **Scope Creep:** The debate on standing intersects with broader topics like the nature of blame, forgiveness, moral responsibility, and authority. There is a risk of being drawn too deeply into these adjacent areas. **Mitigation:** Strict adherence to the core distinction and its application *specifically* to the problem of hypocrisy within the standing debate. Explicitly bracket broader questions about blame's nature unless directly relevant.
      *   **Literature Depth:** While focusing on key texts is feasible, comprehensively surveying the vast literature on standing is impossible in one semester. **Mitigation:** Justified selection of 3-5 canonical and contemporary papers representing the main positions, with explicit acknowledgment that the analysis focuses on these core arguments as exemplars.
      *   **Defining "Demandingness":** Articulating precise criteria for Normative/Demanding Standing is challenging. **Mitigation:** Ground the concept in existing discussions of "calling to account," "authority," and "owing responses," clearly defining the specific *demands* in question (apology, reparation, self-defence).
      *   **Edge Cases:** Certain types of hypocrisy (e.g., reformed hypocrites, hypocrites blaming worse offenses) might complicate the distinction. **Mitigation:** Acknowledge these complexities but argue the core distinction remains valuable even if it needs refinement at the margins. Focus on establishing the distinction clearly for central cases first.
      *   **Originality Verification:** While the core idea feels novel, ensuring it hasn't been explicitly proposed before requires careful literature review. **Mitigation:** Initial focused reading in Phase 1 specifically seeks existing distinctions similar to the one proposed. The project's value lies in its systematic application to *this specific debate* even if components exist elsewhere.
  *   **Signs of Failure/Overreach:** The project would fail if:
      *   The proposed distinction collapses under analysis and cannot be coherently maintained.
      *   The distinction proves trivial or unable to resolve the targeted disagreements.
      *   The scope expands uncontrollably, preventing completion of the core argument within the timeframe.
      *   Key texts are misinterpreted, undermining the analysis.

  **7. Expected Outcome:**
  This project will produce a substantive undergraduate research paper (approx. 4000-5000 words) arguing that the "standing to blame" debate concerning hypocrisy is fundamentally confused by conflating two distinct concepts: the epistemic standing concerning the *truth* of the criticism and the normative standing concerning the *authority to demand specific responses* from the target. By rigorously distinguishing these, the project aims to provide a clearer, more nuanced framework that dissolves apparent contradictions, explains the intuitive force of competing positions, and advances the understanding of hypocritical blame. This refined understanding contributes to broader philosophical discussions about moral criticism, accountability, and interpersonal authority.
