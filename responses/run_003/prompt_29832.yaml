prompt: |-
  I'm a software engineer at a mid-size company and I end up running the postmortem for most of our production incidents — maybe two or three a month. One thing that keeps coming up is whether the incident was caused by something we didn't do: a check we didn't write, a runbook step that got skipped, an alert threshold we never set, a test that was never added. We write these up as causes or contributing factors, and the wording drives what gets fixed and sometimes who gets blamed; in a couple cases our customer contracts have SLA credits tied to the root-cause wording, so its not just an internal label. I have no philosophy background, but a friend of mine does and he says there's a whole literature on causation by omission — whether absences can be causes at all, whether the right test is counterfactual ('would the incident still have happened if we'd done the thing?'), and whether the answer secretly depends on what we expected somebody to do. He says our postmortem fights are basically that debate with a Jira ticket attached.

  What I want is a reusable decision procedure my team can actually run on an incident report — a checklist or flowchart in words — for deciding when an omission should be listed as a cause of an incident. It has to be something an ordinary engineer can run in maybe 20 minutes during a postmortem, without me in the room to explain the theory. It should say what questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says 'not a cause' or 'contributing factor', and where it has to hand the decision to a person because it's a values call rather than a factual one. Please ground it in whatever the philosophy of causation actually knows about omissions, but translated into language we can use: keep the distinctions that survive the translation, and tell me which ones you dropped and why. Then run the procedure on three anonymized cases from our backlog: (1) a database outage where nobody had set a max-connection limit and a runaway query exhausted the pool; (2) an incident where the on-call engineer skipped a step in the runbook that would have caught a bad config before deploy, but the step had been wrong or misleading for months and everyone who had run it recently had skipped it too; (3) an incident where two independent safeguards were both missing — a validation check and an alert — and either one alone probably would have prevented the customer-facing error. I especially want to see a case where the procedure gives an answer my team won't like, and I want you to be honest about what the procedure cannot do — where it's really a management or blame question dressed up as a causal one.
reasoning: |-
  We are creating a decision procedure for determining when an omission (something we didn't do) should be listed as a cause or contributing factor in a postmortem. The procedure must be grounded in philosophical concepts of causation by omission, but translated into practical terms for engineers. We'll use a flowchart-like checklist with clear questions.

  Key philosophical ideas to incorporate:
  1. **Counterfactual Dependence**: Would the incident have happened if the omitted action had been taken? If the answer is "no", then the omission is a cause in the counterfactual sense.
  2. **Normative Expectations**: Was there an expectation (based on policy, best practices, or explicit responsibility) that the action should have been taken? This addresses the concern that absences are everywhere and we can't list every possible omission.
  3. **Proximate Cause**: Even if the omission is a cause, it might be too remote (e.g., "if the company had never been founded, the incident wouldn't have happened"). We need to focus on omissions that are within the scope of our control and responsibility.

  We'll design the procedure as a series of questions. We'll also note where the decision is a values call (e.g., what counts as a "reasonable expectation") and must be decided by a human.

  ---

  **Decision Procedure: Should an omission be listed as a cause/contributing factor?**

  1. **Question 1: Is there a specific action (or set of actions) that was omitted?**
     - We must be able to state what should have been done. Vague omissions (e.g., "we should have been smarter") don't count.
     - *If no, stop: not a cause.*
     - *If yes, proceed to Question 2.*

  2. **Question 2: Would the incident likely have been prevented or significantly mitigated if the action had been taken? (Counterfactual Test)**
     - This is the core counterfactual: without the omission, would the incident have been avoided? We require a reasonable degree of certainty (e.g., >50% chance, based on available evidence).
     - *If no, stop: not a cause.*
     - *If yes, proceed to Question 3.*

  3. **Question 3: Was there a reasonable expectation that the action should have been taken? (Normative Test)**
     - Consider:
       - Was it part of an established procedure (e.g., in a runbook, checklist, or policy)?
       - Was it a standard industry best practice?
       - Was there an explicit assignment of responsibility (e.g., a team or individual was tasked with doing it)?
       - If the omission is a missing test, alert, etc., was there a known requirement for such a safeguard?
     - *If no, then the omission might be a "latent condition" (a systemic issue) but not a direct cause. It might still be a contributing factor, but we need to be cautious about blame. Proceed to Question 4 for a judgment call.*
     - *If yes, then the omission is a contributing factor (and possibly a root cause). Stop: list as cause/contributing factor.*

  4. **Question 4 (only if Question 3 was "no"): Should we have had a reasonable expectation? (Systemic Gap)**
     - This is a values call. Consider:
       - Was the action so obviously necessary that we should have had a procedure or expectation, even if we didn't?
       - Is this a recurring pattern? (If so, then it's a systemic issue and we should address it, but it might not be a direct cause of this incident.)
       - Would holding this omission as a cause set a new standard for the future? (This is about learning, not blame.)
     - *Here, the team must decide:*
       - If they believe the organization should have had the expectation, then list it as a contributing factor (but note it's a systemic gap, not an individual failure).
       - If not, then it's not a cause. Instead, it might be a learning point for future improvements.

  **Important Notes:**
  - **Blame vs. Cause**: The procedure is designed to identify causal factors for the purpose of learning and prevention. It is not designed to assign blame. If the incident has contractual implications (SLA credits), the organization must decide how to map causal factors to contractual terms separately.
  - **Multiple Causes**: An incident can have multiple causes. This procedure is for one omission at a time.
  - **Time Limit**: The procedure should take about 20 minutes per omission. Focus on the most significant omissions.

  ---

  **Applying the Procedure to the Three Cases:**

  **Case 1: Database outage due to no max-connection limit (runaway query exhausted the pool).**

  1. **Specific Action Omitted?** Yes: setting a max-connection limit on the database.
  2. **Counterfactual Test:** If a max-connection limit had been set, the runaway query would have been blocked from exhausting the pool (or at least the damage would have been contained). The incident would likely have been prevented. **Yes.**
  3. **Reasonable Expectation?** 
     - Setting connection limits is a standard database hardening practice.
     - It's likely part of the organization's infrastructure best practices (if not, it should be).
     - **Yes, there was a reasonable expectation.**
  4. **Conclusion:** Omission is a cause/contributing factor.

  **Case 2: Skipped runbook step that would have caught a bad config, but the step had been wrong/misleading for months and everyone skipped it.**

  1. **Specific Action Omitted?** Yes: the on-call engineer did not perform the runbook step (but note: the step itself was flawed).
  2. **Counterfactual Test:** If the step had been performed correctly and the step was not flawed, it would have caught the bad config. But the step was flawed, so even if performed, it might not have worked? We have to consider: if the step had been performed *and* it had been correct, it would have caught the issue. However, the step was flawed, so we must break down:
     - Omission 1: The engineer skipped the step.
     - Omission 2: The runbook step was not maintained (it was wrong/misleading).
     - We are focusing on the engineer's omission (skipping the step). 
       - Counterfactual: If the engineer had run the step, would it have caught the issue? Given the step was flawed, it might not have. So we cannot say with certainty that performing the step would have prevented the incident. We need to re-express the omission as the failure to have a valid runbook step? Let's reframe.

  Alternatively, we can consider two omissions:

  *Omission A: Engineer skipped the step.*
  1. Specific? Yes.
  2. Counterfactual: If the engineer had run the step, would it have caught the issue? We don't know because the step was flawed. If the step had been correct, then yes. But it wasn't. So we cannot say that the incident would have been prevented by the engineer doing the step. **Probably no.** So stop: not a cause.

  *Omission B: The runbook step was not maintained (it was wrong/misleading).*
  1. Specific? Yes: the step should have been updated/corrected.
  2. Counterfactual: If the step had been correct, then when the engineer ran it (or any engineer), it would have caught the bad config. **Yes.**
  3. Reasonable Expectation? 
     - There should be an expectation that runbook steps are kept up-to-date and validated periodically.
     - Who is responsible? The team that owns the runbook? The process? This might be a systemic gap.
     - **Unclear?** It's reasonable to expect runbooks to be correct, but if there's no explicit owner or process for maintaining them, then Question 3 might be "no". Then we go to Question 4.

  4. **Question 4:** Should we have had a reasonable expectation? 
     - Yes, because runbooks are critical for operations. The organization should have a process for maintaining them. 
     - Therefore, we list this as a contributing factor (systemic gap: lack of runbook maintenance process).

  Conclusion for Case 2: 
  - The engineer skipping the step is not a cause because the step was flawed (so doing it wouldn't have helped). 
  - The root issue is the flawed runbook step (omission in maintenance). This is a contributing factor (systemic).

  **Case 3: Two independent safeguards missing (validation check and alert); either one alone would have prevented the error.**

  We can consider each omission separately.

  *Omission A: Missing validation check.*
  1. Specific? Yes: a validation check was not implemented.
  2. Counterfactual: If the validation check had been in place, it would have blocked the bad deployment. **Yes.**
  3. Reasonable Expectation? 
     - Depending on context: if this is a critical system, then validation checks are standard. If there was a requirement or a known risk, then yes. If not, then maybe not. For the sake of the example, let's assume it's a known best practice to have validation for critical configs. **Yes.**
     - Conclusion: Cause/contributing factor.

  *Omission B: Missing alert.*
  1. Specific? Yes: an alert was not set up.
  2. Counterfactual: If the alert had been in place, it would have notified the team before the error became customer-facing (and they would have fixed it in time). **Yes.**
  3. Reasonable Expectation? 
     - Alerts for critical systems are standard. **Yes.**
     - Conclusion: Cause/contributing factor.

  But note: both are causes. The incident would have been prevented by either one. So both are contributing factors.

  **An Unpopular Outcome:**

  Suppose in Case 2, if the team decides that there was no reasonable expectation to maintain the runbook (because, say, the runbook was owned by a different team that was disbanded, and no one took over). Then in Question 4, they might say "no, we should not have had a reasonable expectation because of the organizational chaos." Then the omission (not maintaining the runbook) would not be listed as a cause. This might be unpopular because it leaves the incident without a clear cause (other than the immediate bad config). But the procedure forces the team to acknowledge that the problem is systemic and beyond the immediate control of the engineers.

  **What the Procedure Cannot Do:**
  - It cannot resolve blame. If the incident requires assigning responsibility for contractual reasons, that must be done separately by management, considering factors like job responsibilities and organizational context.
  - It cannot handle every nuance. For example, if the counterfactual test is probabilistic (e.g., "it might have caught the issue"), the team must use judgment.
  - It cannot create expectations out of thin air. What counts as a "reasonable expectation" is context-dependent and may require input from management or policy documents.

  By using this procedure, the team can systematically evaluate omissions and reduce unproductive debates by focusing on the counterfactual and normative tests. The goal is to learn and prevent future incidents, not to assign blame.
answer: |-
  ### Decision Procedure: Evaluating Omissions as Causes in Postmortems  
  Based on philosophical principles of causation (counterfactual dependence, normative expectations, and proximate cause), this procedure helps determine if an omission should be listed as a **cause**, **contributing factor**, or neither. It uses a flowchart-style checklist with clear thresholds. Ground rules:  
  - **Focus on learning, not blame**: The goal is prevention, not punishment.  
  - **20-minute limit**: Answer questions sequentially; stop if time runs out.  
  - **Values calls**: Marked with ⚖️. These require team consensus or management input.  
  - **Omission definition**: A specific, actionable task that wasn’t done (e.g., "didn’t set max connections"), not vague absences (e.g., "didn’t predict the future").  

  ---

  #### The Procedure: 4 Questions to Decide  
  **Question 1: Was there a specific, actionable omission?**  
    - **Ask**: "Can we state exactly what should have been done, by whom, and when?"  
    - **Good enough answer**: Yes, if the task is concrete (e.g., "add test for X," "set up alert for Y").  
    - **Threshold**: If no → **Stop. Not a cause.** (Vague omissions are invalid.)  
    - *Philosophy basis*: Rejects "butterfly effect" omissions (e.g., "if we hired more engineers...").  

  **Question 2: Would the incident likely have been prevented or significantly mitigated if the action was taken? (Counterfactual Test)**  
    - **Ask**: "If we’d done this thing, is it >50% likely the incident wouldn’t have happened or would have been less severe?"  
    - **Good enough answer**: Use evidence (e.g., logs, past data). If uncertain, default to "no."  
    - **Threshold**: If no → **Stop. Not a cause.** (No causal link.)  
    - *Philosophy basis*: Counterfactual dependence (David Lewis). If the omission isn’t a "difference-maker," it’s not causal.  

  **Question 3: Was there a reasonable expectation that the action should be done? (Normative Test)**  
    - **Ask**: "Was this task required by policy, best practices, or explicit responsibility?"  
    - **Check**:  
      - Policy: Runbooks, security standards, SLAs.  
      - Best practices: Industry standards (e.g., AWS hardening guides).  
      - Responsibility: Assigned owner (e.g., "DB team handles limits").  
    - **Threshold**:  
      - If yes → **Omission is a cause or contributing factor.** Proceed to Question 4 for final labeling.  
      - If no → **Omission may be a systemic gap.** Proceed to Question 4.  
    - *Philosophy basis*: Normative expectations (John Stuart Mill, Hart & Honoré). Filters out "armchair quarterbacking."  

  **Question 4: What’s the context of the omission? (Proximity & Values)**  
    - **Ask**:  
      - If Q3 was **yes**: "Was this omission a direct enabler (e.g., last line of defense) or one of many factors?"  
        - **Direct enabler** → **Label as cause.**  
        - **One of many** → **Label as contributing factor.**  
      - If Q3 was **no**: "Should we have reasonably expected this? Why/why not?" (⚖️ Values call)  
        - **Consider**:  
          - Severity: Would this omission cause high risk?  
          - Feasibility: Was it easy to implement?  
          - Pattern: Has this happened before?  
        - **Threshold**:  
          - If "should have expected" → **Label as contributing factor (systemic gap).**  
          - If not → **Not a cause.** (Note for improvement, but not causal.)  

  ---

  #### What the Procedure Cannot Do  
  - **Assign blame**: Philosophy distinguishes causation from responsibility. A "cause" label doesn’t imply negligence—context matters (e.g., under-resourced teams).  
  - **Resolve contractual disputes**: SLA credits depend on legal/contract terms, not causal logic. Use this output as input for negotiations.  
  - **Handle probabilistic causation**: If the counterfactual is <50% likely (e.g., "the alert might have been ignored"), the procedure rejects it. Philosophy struggles here too—omissions are inherently probabilistic.  
  - **Replace management judgment**: Values calls (⚖️) require weighing trade-offs (e.g., "Should we invest in safeguards for rare events?").  

  ---

  ### Applied to Your Cases  
  **Case 1: Database outage (no max-connection limit)**  
  - **Q1**: Specific? **Yes**—"Set max-connection limit on the database."  
  - **Q2**: Counterfactual? **Yes**—Limit would have contained the runaway query.  
  - **Q3**: Expected? **Yes**—Industry best practice (e.g., OWASP, cloud provider guidelines).  
  - **Q4**: Context? **Direct enabler**—The limit was a primary safeguard.  
  - **Conclusion**: **Cause** (omission).  

  **Case 2: Skipped runbook step (step was flawed, everyone skipped it)**  
  - **Q1**: Specific? **Yes**—"Perform step 5 of the runbook (config validation)."  
  - **Q2**: Counterfactual? **No**—The step was broken; doing it wouldn’t have caught the issue.  
  - **Stop**. **Not a cause** (omission by the engineer).  
  - *But note*: A *second omission* exists: "Update the runbook when steps become invalid."  
    - **Q1**: Specific? **Yes**—"Fix runbook step 5."  
    - **Q2**: Counterfactual? **Yes**—A valid step would have caught the bad config.  
    - **Q3**: Expected? **Unclear**—Was there a policy to audit runbooks? (⚖️ Values call).  
      - *If yes* → **Contributing factor.**  
      - *If no* → **Q4**: Should we expect runbook maintenance? **Yes** (high risk, low effort) → **Contributing factor (systemic gap).**  
  - **Engineer-level omission not a cause; runbook maintenance omission is a contributing factor.**  

  **Case 3: Missing validation check and alert (either would have prevented the error)**  
  - **Omission A (validation check)**  
    - **Q1**: Specific? **Yes**—"Add input validation for X."  
    - **Q2**: Counterfactual? **Yes**—Validation would have blocked the bad input.  
    - **Q3**: Expected? **Yes**—Standard practice for critical user inputs.  
    - **Q4**: **Contributing factor** (not sole cause; the alert was also missing).  
  - **Omission B (alert)**  
    - **Q1**: Specific? **Yes**—"Create alert for condition Y."  
    - **Q2**: Counterfactual? **Yes**—Alert would have notified team pre-failure.  
    - **Q3**: Expected? **Yes**—Monitoring is a baseline expectation.  
    - **Q4**: **Contributing factor** (not sole cause).  
  - **Conclusion**: **Both are contributing factors** (neither was strictly necessary, but either would have sufficed).  

  ---

  #### Unpopular Outcome & Philosophy Trade-offs  
  - **Unpopular result**: In **Case 2**, if the team decides there was *no policy* for runbook maintenance (Q3=no) and argues "we shouldn’t expect it" (Q4=no), the broken runbook isn’t a cause. Engineers may dislike this—it feels like dodging accountability. But the procedure enforces objectivity: without expectation, omissions aren’t causal. This is where management must step in (⚖️) to set new standards.  
  - **Philosophy distinctions dropped**:  
    - **Moral vs. causal responsibility**: We merge them (since your context ties causes to SLAs/blame), but philosophy treats them separately.  
    - **Preemptive causation**: If two omissions interact (e.g., missing test + missing alert), we simplify to "either is contributing." Philosophy debates dominance; we prioritize practicality.  
  - **Final advice**: Pair this with a "blameless" policy. When omissions are labeled causes, phrase fixes as system improvements (e.g., "Automate runbook validation")—not individual sanctions. Use values calls to update policies (e.g., "We now expect all runbooks reviewed quarterly").  

  This procedure makes implicit debates explicit, focuses on prevention, and cuts unproductive arguments. It won’t solve every fight—but it turns philosophy into action.
