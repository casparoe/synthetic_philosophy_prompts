prompt: |-
  I'm running a philosophy reading group for lawyers — smart people, no formal philosophy background — and next month we're doing Strawson's 'Freedom and Resentment.' I've got one evening, maybe two hours. I've read the paper three times; what I need is a teaching plan. What has to be on the board before I even say 'reactive attitudes'? I need the dependency structure: what's the idea the whole paper turns on that they won't arrive with, and what do I have to lay down first so that idea doesn't sound like a dodge?

  Then the carrying example. I know Strawson uses the guy stepping on your hand, but I'm worried that example makes it too easy — it collapses into 'he did it on purpose so I'm mad' and they'll miss the deeper point about the inescapability of the participant stance. What example should I build around instead, and what does it need to have that the hand-stepping one lacks?

  Misconceptions: I'm betting they'll think Strawson is just saying 'we can't help feeling these things so determinism is irrelevant,' which makes him sound like he's giving up on justification entirely. Another one I expect: conflating the objective attitude with being objective (like, impartial) rather than seeing someone as an object of treatment. Where in the sequence do I head each of these off — before they form, or let them form and then undermine them?

  And at the end, I want one question that tests whether they've actually got the participant/objective distinction, not just whether they can paraphrase the paper. Something where a wrong answer sounds plausible if you've only half got it.
reasoning: |-
  Okay, the user is running a philosophy reading group for lawyers and needs a teaching plan for Strawson's "Freedom and Resentment." They've read the paper three times but want a structured approach to teach it effectively in one evening. Let me start by understanding their main concerns.

  First, they need the dependency structure—what foundational ideas must be laid out before introducing "reactive attitudes." Lawyers are smart but lack formal philosophy background. So, the key is to build step-by-step, avoiding jargon. The core idea the paper hinges on is that moral responsibility isn't about metaphysical free will but about our natural human reactions. Lawyers might expect a debate on determinism vs. free will, but Strawson shifts the focus. I need to start with their existing framework: moral responsibility, blame, praise. Then reveal the traditional problem (determinism’s threat) to show why Strawson's approach is different.

  Next, the hand-stepping example. They worry it's too simplistic, leading to "he did it on purpose, so I'm mad," missing the participant stance's inescapability. They need an alternative example. Maybe a colleague forgetting a crucial task? But it should have layers: accidental oversight, then discovering a reason that shifts the attitude. This can illustrate how excuses work within the participant stance, not by switching to objective. The example must show that even with mitigating factors, we stay in the participant stance unless certain conditions (like insanity) apply.

  Misconceptions: They anticipate two main ones. First, that Strawson is just saying we can't help our feelings, so determinism is irrelevant. But Strawson isn't giving up justification; he's grounding responsibility in our practices. This needs clarification when explaining the participant stance. Second, conflating objective attitude with impartiality. Lawyers might equate "objective" with fair judgment. I should explicitly define the objective attitude as seeing someone as a subject for treatment, not engagement, using examples like dealing with a mentally ill person.

  The user wants a test question at the end. Something that distinguishes understanding from paraphrasing. A scenario where a wrong answer seems plausible if they confuse the objective attitude with impartiality. For example, a judge sentencing a criminal impartially but still holding resentment. The correct answer is that impartiality doesn't mean adopting the objective attitude; the judge still participates in reactive attitudes.

  Also, considering the lawyers' background: they deal with responsibility, blame, legal systems. Emphasizing how Strawson's view applies to law—like why we excuse certain actions (insanity vs. negligence) based on participant stance conditions. Connecting to legal concepts might help them grasp the practicality of Strawson's theory.

  Timing: Two hours. Need to allocate time for each section. Start with the traditional problem (15 mins), introduce reactive attitudes (25 mins), participant vs. objective (30 mins), deep dive with the example (20 mins), address misconceptions (15 mins), and wrap-up with test question (15 mins). Encourage discussion throughout.

  Need to ensure that the foundational concepts are clear before moving to reactive attitudes. Use relatable examples, avoid philosophical jargon. Highlight that Strawson isn't dismissing determinism but showing it's irrelevant to our practices. Stress that reactive attitudes are part of human sociality, not just emotions but the framework of holding others accountable.

  Finally, the test question should force them to apply the distinction. A scenario where someone is impartial yet still in the participant stance. If they think impartiality equals objective attitude, they've missed the point. Clarify that the objective attitude is a detachment from interpersonal engagement, not fairness.
answer: |-
  Here’s a structured teaching plan for Strawson’s "Freedom and Resentment," designed for a 2-hour session with lawyers. It prioritizes conceptual dependencies, preempts misconceptions, and includes a robust example and assessment question. Focus on **clarity** and **argumentative stakes**—lawyers will appreciate rigor.

  ---

  ### **Pre-Board Essentials (Dependency Structure)**
  *(Write these before mentioning "reactive attitudes")*
  1. **The Traditional Problem:**  
     - **"Moral Responsibility → Free Will → Determinism?"**  
     - *Explain:* Lawyers grasp "responsibility" intuitively (blame/praise). But philosophy links it to *free will* (could they have done otherwise?). **Determinism** (all actions caused by prior states + laws of nature) threatens this. *Strawson’s target: This entire framework is misguided.*

  2. **Strawson’s Insight:**  
     - **"Responsibility isn’t a metaphysical claim—it’s a *social practice*."**  
     - *Key move:* Shift from "What *justifies* blame?" (metaphysics) to "What *is* blaming?" (phenomenology of our actual interactions).  

  3. **The Bridge:**  
     - **"We don’t *infer* responsibility from free will—we *express* it through attitudes."**  
     - *Set up:* Before introducing jargon, ask: *"When you blame a negligent colleague, what are you actually *doing* emotionally?"* (Elicit: anger, disapproval, feeling wronged).  

  ---

  ### **Core Sequence (60-70 mins)**
  #### **1. Reactive Attitudes Defined (15 mins)**  
     - **Board:** `Reactive Attitudes = Natural human responses to others' attitudes/intentions toward us (e.g., resentment, gratitude, indignation, trust)`  
     - *Clarify:* These aren’t just "emotions" but **interpersonal stances** (e.g., resentment arises when someone *disregards* your standing).  
     - *Preempt Misconception:* Stress these are **inescapable** for functioning socially—*not* a "dodge" but a **descriptive foundation**.  

  #### **2. Participant vs. Objective Stance (20 mins)**  
     - **Board:**  
       - `Participant Stance: Engaging others as responsible agents (reactive attitudes apply)`  
       - `Objective Stance: Seeing others as objects to be managed, treated, fixed (e.g., therapist/client, warden/dangerous criminal)`  
     - *Crucial Distinction:* **Objective ≠ impartiality!** A judge can be impartial *within* the participant stance (e.g., resenting a contemptuous defendant). Objective stance = **suspension of interpersonal engagement** (e.g., viewing a psychopath as a "patient" not a "wrongdoer").  
     - *Preempt Misconception:* Lawyers often conflate "objective" with "fair-minded." Use a legal example:  
       > *"At sentencing, you argue for leniency due to the defendant's trauma. You're being impartial—but you're still holding them *accountable*. If you argued they were *incapable* of accountability (e.g., severe psychosis), you’d shift to the objective stance."*  

  #### **3. The Key Example: "The Neglected Brief" (20 mins)**  
     *Replace "stepping on hand" with:*  
     > **"A senior partner (who you respect) fails to review your crucial brief before court, causing you to lose the case. Later, you learn:  
     > (a) Their child was hospitalized that morning (excuse).  
     > (b) They have early-stage dementia (exemption)."**  

     *Why this works:*  
     - **Excuse (a):** You *modify* resentment ("They didn’t disregard me—it was an emergency") → **Stays in participant stance.**  
     - **Exemption (b):** You *suspend* resentment ("They can’t participate in mutual expectations") → **Shifts to objective stance** (concern, pity, but not blame).  
     - *Deeper Point:* Even in (a), your initial resentment reveals the **participant stance as default**. Exemptions (insanity, dehumanization) are rare *because we’re wired for reciprocity*.  

  #### **4. Strawson’s Argument (10 mins)**  
     - **Board:** `Determinism is irrelevant because...` → `Reactive attitudes are *constitutive* of human relationships. We can't abandon them without abandoning society itself.`  
     - *Preempt Misconception:* **This isn’t "giving up on justification"!** Strawson grounds justification *in our nature as social beings*—not in metaphysics. Ask: *"Could you rationally decide to view your spouse or child *only* through the objective stance? What would you lose?"*  

  ---

  ### **Combating Misconceptions (15 mins)**  
  - **"Strawson is saying feelings trump reason"**:  
    *Interrupt during "Key Argument" section:* Emphasize reactive attitudes aren’t "irrational feelings"—they’re **rational responses to perceived attitudes** (e.g., resentment when your dignity is ignored *is* appropriate). Determinism doesn’t touch this.  

  - **"Objective stance = impartiality"**:  
    *Crush during the legal example above.* Stress: **Objective stance removes *moral engagement*;** impartiality operates *within* it.  

  ---

  ### **Test Question (10 mins)**  
  **Scenario:**  
  > *"A prosecutor, known for fairness, declines to charge a homeless man who stole bread. She says: ‘I objectively assessed his circumstances—poverty, mental illness—and concluded punishment is pointless.’ Is she taking the objective stance?"*  

  - **Wrong Answer (plausible if they half-get it):**  
    *"Yes—she’s being objective and compassionate."*  
    - **Why it’s wrong:** She’s still *evaluating his moral situation* (compassion ≠ objectivity). She might feel pity *instead* of blame, but she hasn’t suspended reactive attitudes (e.g., she likely still sees him as a responsible agent, just excused).  

  - **Right Answer:**  
    *"No—she’s in the participant stance, offering an excuse (compassion). True objective stance would treat him like a force of nature (e.g., ‘His actions are symptoms; he needs hospitalization, not a trial’)."*  

  ---

  ### **Timing & Tone**  
  - **First 30 mins:** Foundations (Traditional Problem → Strawson’s Shift → Reactive Attitudes).  
  - **Next 30 mins:** Participant/Objective Stance + "Neglected Brief" example.  
  - **Final 30 mins:** Argument recap, misconceptions, test question, debate.  
  - **Tone:** Use legal analogs (blame ≈ liability, excuses ≈ defenses). Highlight how Strawson **dissolves** the free will/determinism impasse—lawyers hate unsolvable problems.  

  This plan forces engagement with Strawson’s revolutionary move: **Responsibility isn’t a puzzle to solve—it’s a lived reality we can’t escape.** The example and test question make the participant/objective distinction *visceral*, not academic.
