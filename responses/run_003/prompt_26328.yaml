  My friend wants to ditch HS, but I want to keep both. So I need to find the flaw.

  I recall that in philosophy of probability, there's something called the "big bad bug" for Humean views, related to David Lewis. Lewis was a Humean but also endorsed PP, so he must have had a way around this.

