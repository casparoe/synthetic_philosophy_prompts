  I think the flaw is in step (5), particularly in the inference that because the ultimate grounds force 0 or 1, the partial grounds must force something inconsistent with x.

  But partial grounds don't force the outcome; they only make it probable or something.

  Another way: the information you have for knowing chance is inadmissible if it includes information about the future, but if it's only past and present, it's admissible.

