  In (5), it says that your knowledge of chance must ultimately rest on the total mosaic. Well, epistemically, it rests on evidence that is part of the mosaic, but not the whole. So when you have that evidence, you can infer the chance, and since that evidence is admissible, PP applies.

  The argument seems to be suggesting that because the chance is grounded in the mosaic, any knowledge of the chance is somehow "tainted" by the mosaic facts that would force credence 0 or 1 if known fully. But that's not right because you don't know those future facts.

  Perhaps the issue is with the concept of inadmissible information.

  Lewis's original PP had a problem with undermining futures or something.

  For Humeans, there can be situations where the chance theory itself depends on future events. For example, suppose the chance of E is x, but if E doesn't happen, the chance might be different, or something like that.

  Lewis worried about "undermining": a future that has low probability but, if it occurs, would make the chance theory false. But since it has low probability, it's unlikely, but still possible.

  In such cases, if you conditionalize on the chance, there might be inconsistency.

  For instance, suppose the true chance theory is T, which assigns a certain chance to events. But there is a possible future F where, if it happens, T would not be the best theory, so chance would be different. T assigns a small probability to F happening. But if F happens, chance isn't T, so the chance of F according to T is small, but if F is actual, the chance was not T.

  This can lead to problems for PP.

  Lewis responded by modifying PP to the New Principle.

  The New Principle says that your credence in E given that the chance is x and that the chance theory is T should be the chance of E given T, or something like that.

