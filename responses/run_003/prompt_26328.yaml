  For instance, suppose I have evidence that the coin is fair. That evidence is historical facts, say, the coin's composition and past behavior. From that, I infer chance 1/2. Now, those historical facts are part of the mosaic, and the mosaic determines whether this toss is heads. But from the historical facts alone, I cannot deduce whether it's heads; I need more information. So my evidence doesn't determine E; it only determines the chance.

