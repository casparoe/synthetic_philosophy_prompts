answer: |-
  Below is a decision tree mapping the logical space of views on the **standing to blame**, structured to reflect key distinctions in the literature. The tree starts with a foundational question about defeasibility and branches through the specified distinctions. Each leaf is labeled with a named position (or "unnamed"), followed by its most awkward commitment. Logically possible but unoccupied positions are noted at the end.

  ---

  ### **Decision Tree: Standing to Blame**

  #### **Question 1: Can standing to blame be defeated by facts about the blamer?**  
  *(i.e., is correct moral judgment alone sufficient?)*  
  - **No → Leaf 1: Universalism**  
    - *Position:* Correct moral judgment is sufficient; anyone may blame.  
    - *Awkward commitment:* Hypocrites or complicit parties retain standing to blame, even if their blame seems practically ineffective or inconsistent.  

  - **Yes → Proceed to Question 2.**  

  #### **Question 2: Is the defeating factor rooted in the blamer’s moral record or relational role?**  
  - **Moral record → Proceed to Question 3.**  
  - **Relational role → Proceed to Question 4.**  

  ---

  **Branch: Moral Record Views**  
  #### **Question 3: Which aspects of the moral record defeat standing?**  
  - **Both hypocrisy and complicity → Leaf 2: Full Moral Record View**  
    - *Position:* Standing is lost if the blamer is hypocritical (committed same wrong) *or* complicit (implicated in *this* wrong).  
    - *Awkward commitment:* Must explain why hypocrisy and complicity—distinct failures—are grouped under a single "moral record" criterion.  
  - **Only hypocrisy → Leaf 3: Hypocrisy Account**  
    - *Position:* Only hypocrisy defeats standing; complicity alone does not.  
    - *Awkward commitment:* Complicit blamers (e.g., co-conspirators) retain standing, risking inconsistent blame.  
  - **Only complicity → Leaf 4: Complicity Account**  
    - *Position:* Only complicity defeats standing; hypocrisy alone does not.  
    - *Awkward commitment:* Hypocrites (e.g., former offenders) retain standing, inviting charges of unfairness.  

  ---

  **Branch: Relational Views**  
  #### **Question 4: Which relationship grounds standing?**  
  - **Relationship to the victim → Leaf 5: Victim-Centered View**  
    - *Position:* Standing is limited to the victim or their close associates (e.g., family).  
    - *Awkward commitment:* Third-party observers (e.g., bystanders) lack standing even if morally impeccable.  
  - **Relationship to the wrongdoer → Leaf 6: Wrongdoer-Relation View**  
    - *Position:* Standing requires a special connection to the wrongdoer (e.g., friend, mentor).  
    - *Awkward commitment:* Strangers or distant parties lack standing despite moral authority.  
  - **Relationship to the moral community → Leaf 7: Communal View**  
    - *Position:* Standing is held by members of the shared moral community (e.g., society, group norms).  
    - *Awkward commitment:* Outsiders (e.g., foreign critics) lack standing even when correct.  

  ---

  ### **Key Notes on the Tree**
  1. **Undistinguished Pairs:**  
     - The tree **cannot separate theories *within* categories** (e.g., for **Leaf 3**, it does not distinguish *why* hypocrisy defeats standing—e.g., fairness-based vs. commitment-based accounts). Similarly, **Leaf 5–7** do not specify *how* relationships confer standing (e.g., authority-based vs. care-based accounts).  

  2. **Logically Possible but Unoccupied Positions:**  
     - **Hybrid Moral Record + Relational View:** A position where *both* moral record *and* relational factors defeat standing is logically possible but unmapped by the tree (due to Question 2's forced choice). *Diagnosis:* Merely unexplored; not incoherent but complex to defend.  
     - **"Victim-Wrongdoer Hybrid" Relational View:** A position requiring ties to *both* the victim *and* wrongdoer (e.g., a mutual friend) is possible but unnamed. *Diagnosis:* Unattractive due to over-restriction (rarely applicable) and unexplored.  
     - **"No Defeat" with Exceptions:** Universalism (**Leaf 1**) could theoretically admit exceptions (e.g., for complicity), but this contradicts its definition. *Diagnosis:* Incoherent; Universalism denies defeasibility by definition.  

  ---

  ### **Summary of Named Positions**
  | Leaf | Position                  | Core Claim                                                                 | Awkward Commitment                                                                 |
  |------|---------------------------|----------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | 1    | Universalism              | Correct moral judgment suffices.                                           | Hypocrites/complicit parties retain standing.                                      |
  | 2    | Full Moral Record View    | Hypocrisy *or* complicity defeats standing.                                | Groups distinct moral failures under one criterion.                                |
  | 3    | Hypocrisy Account         | Only hypocrisy (same wrong) defeats standing; complicity does not.         | Complicit blamers (e.g., accomplices) may blame.                                   |
  | 4    | Complicity Account        | Only complicity (in *this* wrong) defeats standing; hypocrisy does not.    | Hypocrites (e.g., unrepentant offenders) may blame.                                |
  | 5    | Victim-Centered View      | Standing requires a relationship to the victim.                            | Impeccable third parties (e.g., witnesses) lack standing.                          |
  | 6    | Wrongdoer-Relation View   | Standing requires a relationship to the wrongdoer.                         | Strangers lack standing despite moral insight.                                     |
  | 7    | Communal View             | Standing requires membership in the relevant moral community.              | Outsiders (e.g., international observers) lack standing.                           |

  ---

  This tree captures the core logical structure of the debate while highlighting tensions in each position. Use it to scaffold discussions on why standing might require more than mere correctness—and how different accounts handle paradigmatic cases (e.g., hypocrites blaming hypocrites, strangers blaming family disputes).
