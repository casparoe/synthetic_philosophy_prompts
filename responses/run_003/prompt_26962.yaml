  ### Joint Statement on the Knobe Effect: Conceptual vs. Deflationary Views  
  *After Adversarial Collaboration*  

  #### 1. Agreed-Upon Claims  
  Both sides accept the following substantive claims about the Knobe effect, its design, and constraints for adequate accounts:  

  1. **The Core Asymmetry**: The asymmetry in intentionality judgments (high in harm, low in help conditions) is a robust, replicable phenomenon in the standard executive vignette. It holds across diverse populations and minor variations in wording.  
  2. **Essential Features**: The following elements are necessary to elicit the effect:  
     - A primary goal (e.g., profit) that is the agent’s sole stated motivation.  
     - A foreseen side effect (harm/help) causally linked to the action.  
     - The agent’s explicit indifference toward the side effect (e.g., "I don’t care").  
     - The side effect’s valence (positive/negative) as the key manipulated variable.  
  3. **Non-Essential Features**: The effect does not depend on:  
     - The specific domain (e.g., environment, health, art).  
     - Whether the side effect is directly caused or merely enabled by the action.  
     - The agent’s identity (e.g., CEO, scientist) or the action’s legality.  
  4. **Role of Normative Evaluation**: Normative evaluation (moral or prudential) *influences* judgments in the harm condition, but both sides agree this does not prejudge *how* it influences them (conceptually vs. pragmatically).  
  5. **Constraints for Accounts**: Any adequate explanation must:  
     - Explain why valence alone reverses intentionality judgments despite identical causal/mental structures.  
     - Account for the effect’s persistence when the vignette emphasizes the agent’s lack of desire for the side effect.  
     - Be consistent with broader patterns in folk psychology (e.g., judgments of desire, intention, or blame).  
     - Avoid ad hoc assumptions untethered from general cognitive mechanisms.  

  Neither side asserts these points smuggle in their conclusions.  

  ---  
  #### 2. Residual Disagreement  
  The core disagreement is whether the asymmetry reflects the *structure of the folk concept of intentional action* or *performance factors distorting its application*:  

  - **Conceptual View**: "The folk concept of intentional action is inherently sensitive to the normative status of outcomes. When a foreseen side effect is bad, its badness directly satisfies a necessary condition for intentionality that is absent when the outcome is good. This normative condition is constitutive of the concept, not an error."  
  - **Deflationary View**: "The asymmetry arises from performance factors (e.g., blame motivation, conversational implicature, or negativity bias) that exploit the core concept’s non-normative structure (based on belief, desire, and control). The concept itself is purely descriptive; the effect is an artifact of how it is applied in evaluative contexts."  

  ---  
  #### 3. Disagreements Table: Cruxes and Tests  
  Each crux is a sub-question where empirical resolution could change at least one side’s position. Both sides endorse the proposed tests and pre-register predictions.  

  | Crux                                      | Test                                                                                                                               | Conceptual View Prediction                                                                 | Deflationary View Prediction                                                                 |  
  |-------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|  
  | **1. Role of Normative Status vs. Valence**: Does normativity (not valence) drive judgments? | *Manipulate normativity independently of valence*: Harmful-but-permissible (e.g., necessary euthanasia) vs. helpful-but-impermissible (e.g., aiding a villain). Hold executive indifference constant. | Asymmetry flips/reduces: Low intentionality for permissible harm; high for impermissible help. (Normativity overrides valence.) | Asymmetry persists: High intentionality for harmful outcomes (even permissible); low for helpful (even impermissible). (Valence dominates.) |  
  | **2. Necessity of Blame Motivation**: Is blame necessary for the harm-intentionality link? | *Remove blame*: Add conditions where the executive is powerless (e.g., "only possible choice") or the victim deserves harm. Measure blame and intentionality separately. | Intentionality remains high in harm condition even when blame is low. (Normative status suffices.) | Intentionality decreases when blame is low. (Blame is necessary for the asymmetry.) |  
  | **3. Concept vs. Pragmatics in Language**: Does "intentionally" pragmatically imply blame in harm cases? | *Test verb framing*: Replace "intentionally" with a neutral control (e.g., "did you bring about X?") or ask about non-moral actions (e.g., "moved the pawn"). | Asymmetry persists with neutral framing. (Conceptual link is robust.) | Asymmetry diminishes with neutral framing. (Pragmatic cues drive the effect.) |  
  | **4. Indifference as a Trigger**: Is indifference necessary or sufficient? | *Remove/alter indifference*: Executive regrets harm (but proceeds) or desires help (but not as a goal). Contrast with explicit desire for side effects. | Asymmetry weakens when indifference is removed (harm cases drop). (Indifference signals norm-violation.) | Asymmetry disappears when indifference is removed. (Indifference triggers pragmatic blame/negativity.) |  

  ---  
  #### 4. Verbal Disagreement?  
  The dispute is **not merely verbal**. Both sides agree on the extension of "intentional action" (e.g., they predict the same judgments in clear cases like intentional killings vs. accidental help) and target the same psychological phenomenon. The disagreement is substantive:  
  - **Conceptualists** claim normativity is *constitutive* of the concept (a semantic thesis).  
  - **Deflationists** claim normativity *biases* the application of a non-normative concept (a processing thesis).  
  This is empirically resolvable: Tests like those above can decouple normative valence from concept structure (Crux 1) or blame from intentionality (Crux 2). If valence-driven asymmetry persists when normativity is inverted (e.g., impermissible help), deflationism gains ground; if it tracks normativity, conceptualism does.  

  ---  
  **Signed**,  
  *Proponents of the Conceptual View*  
  *Proponents of the Deflationary View*  
  *Date: [Date of Adversarial Collaboration]*  

  This document establishes a shared framework for empirical resolution. Both sides commit to updating their positions based on outcomes of the proposed tests.
