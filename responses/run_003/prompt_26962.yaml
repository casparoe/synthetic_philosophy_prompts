prompt: |-
  I have followed the experimental-philosophy debate over the Knobe effect for some time, and I keep having the same reaction I have to many disputes on rationalist blogs and forums: the two sides are mostly arguing past each other, and neither has said in advance what evidence would change its mind. I want the document that would fix that.

  Background. The Knobe effect is the following asymmetry. In the standard design, subjects read about a corporate executive who approves a new initiative solely because it will increase profits and who explicitly says he does not care about a side effect the initiative will have on the environment. In one condition the side effect is harmful; in the other it is beneficial. The executive's stated attitude, the causal structure, and the decision procedure are otherwise the same. The initiative goes ahead, the side effect occurs, and subjects are asked whether the executive intentionally brought about that side effect. A large majority say yes in the harm condition, and a large majority say no in the help condition.

  Two positions about what this shows have hardened. The conceptual view holds that the asymmetry reflects the folk concept of intentional action: ordinary judgments of whether someone acted intentionally are sensitive to the normative status of the side effect, so moral or normative evaluation is a genuine input to the concept rather than a contaminant. The deflationary view holds that the asymmetry is a performance or pragmatic artifact. Deflationists disagree among themselves about the mechanism—some favor blame, some a general negativity bias, some conversational implicatures, some the fact that only the harm vignette involves accepting an environmental cost—but they agree that the effect does not reveal the structure of the concept of intentional action.

  Write the joint statement these two camps could sign after a good-faith adversarial collaboration. It should contain:

  1. A numbered list of claims both sides accept about the effect itself, about which features of the design are and are not essential, and about the constraints any adequate account must satisfy. The claims should be substantive rather than vacuous, and neither side should feel that the other has smuggled in a conclusion.

  2. A precise statement of the residual disagreement, with each side's own position phrased so that its proponents would accept the wording.

  3. A disagreements table. For each crux—a sub-question such that settling it would move at least one side—give a concrete experiment, manipulation, or argument both sides agree bears on that crux, and record each side's prediction about it in advance.

  4. A short note on whether any part of the dispute is merely verbal, and why.
reasoning: |-
  We are writing a joint statement after a good-faith adversarial collaboration between proponents of the conceptual view and the deflationary view of the Knobe effect. Our goal is to clarify the points of agreement, the precise nature of the disagreement, and the empirical cruxes that would help resolve it.

  ## 1. Points of Agreement

  Both sides accept the following claims:

  1. **The Basic Effect**: There is a robust asymmetry in folk judgments about intentional action in the original Knobe scenario. Specifically, when the side effect is harmful, a large majority of people judge that the executive intentionally brought it about; when the side effect is helpful, a large majority judge that the executive did not intentionally bring it about.

  2. **The Role of the Executive's Attitude**: The executive's stated indifference (e.g., "I don't care at all about harming/helping the environment, I just want to make as much profit as possible") is a crucial component of the vignette. Without such an expression of indifference, the effect may be diminished or altered.

  3. **The Role of the Primary Goal**: The executive's primary goal (increasing profits) is held constant across conditions and is the sole reason for approving the initiative. The side effect is presented as a known but unintended (in the sense of not being the goal) consequence.

  4. **The Side Effect's Valence**: The valence of the side effect (helpful vs. harmful) is the key manipulated variable that produces the asymmetry.

  5. **The Robustness of the Effect**: The effect replicates across different populations and variations in the vignette (e.g., different scenarios, such as military or medical contexts), as long as the core structure (a primary goal, a known side effect with a clear valence, and an expression of indifference) is preserved.

  6. **The Concept of Intentional Action in Folk Psychology**: Both sides agree that the folk concept of intentional action is central to the debate and that the Knobe effect is a phenomenon that any adequate account of that concept must explain.

  7. **Constraints on an Adequate Account**: Any adequate account of the Knobe effect must:
     - Explain why the asymmetry arises in the standard case.
     - Account for the fact that the effect is not limited to environmental harm/help but extends to other domains (e.g., harming/helping art, health, etc.).
     - Be compatible with the fact that the effect is observed even when the side effect is not the primary focus of the vignette and when the executive's attitude is held constant.
     - Not rely on ad hoc explanations that are tailored only to the Knobe effect but should be grounded in broader psychological principles.

  ## 2. Residual Disagreement

  The core disagreement is about the nature of the asymmetry:

  - **The Conceptual View**: The asymmetry in judgments of intentionality reflects the structure of the folk concept of intentional action. Specifically, the folk concept includes a normative condition: when a side effect is bad, the fact that the agent knew it would occur and proceeded without a countervailing reason is sufficient for the side effect to be judged as intentionally brought about. When the side effect is good, the absence of a positive reason (e.g., the agent's indifference) blocks the judgment of intentionality. Thus, moral evaluation is an inherent component of the concept of intentional action.

  - **The Deflationary View**: The asymmetry is a performance error or a pragmatic effect and does not reflect the structure of the concept of intentional action. The folk concept of intentional action does not inherently include a normative condition. Instead, the asymmetry arises because of factors such as:
    - Blame: In the harm condition, participants are motivated to blame the executive, and one way to do so is to judge the harm as intentional.
    - Conversational pragmatics: In the harm condition, the executive's indifference and the harm together trigger an implicature that the harm was intentional, while in the help condition, the indifference blocks such an implicature.
    - A general negativity bias: Negative events attract more attention and are more likely to be attributed to agency.
    - The perception of cost: Only in the harm condition does the executive accept an environmental cost, which might be seen as a commitment to the harm.

    Deflationists hold that the core concept of intentional action is purely descriptive (involving factors like desire, belief, and control) and that the asymmetry is due to factors that influence the application of this concept in specific contexts.

  ## 3. Disagreements Table (Cruxes)

  We agree on the following experimental tests and predictions. For each crux, we describe the experiment and then state the predictions of each view.

  ### Crux 1: The Role of Normative Status vs. Valence

  **Experiment**: Create a scenario where the side effect is harmful but normatively permissible (e.g., the harm is justified, such as a doctor causing pain during a necessary medical procedure) and a scenario where the side effect is helpful but normatively impermissible (e.g., helping an evil organization). The vignette structure is otherwise the same as the original Knobe scenario.

  - **Conceptual View Prediction**: The asymmetry will reverse or disappear. In the harmful but permissible condition, participants will be less likely to judge the harm as intentional. In the helpful but impermissible condition, participants will be more likely to judge the help as intentional. This is because the conceptual view holds that the normative status (permissibility/impermissibility) is the key factor, not the valence (harm/help) per se.

  - **Deflationary View Prediction**: The asymmetry will remain largely driven by valence. In the harmful but permissible condition, the harm is still negative, so participants will still judge it as intentional. In the helpful but impermissible condition, the help is still positive, so participants will still judge it as unintentional. The deflationary view predicts valence (harm vs. help) is the primary driver, not normative status.

  ### Crux 2: The Effect of Removing Indifference

  **Experiment**: Remove the executive's expression of indifference (e.g., the executive does not say "I don't care"). Instead, the executive is described as knowing the side effect will occur and proceeding for profit. The side effect is either harmful or helpful.

  - **Conceptual View Prediction**: The asymmetry will still occur, though perhaps attenuated, because the normative status of the side effect is sufficient to drive the intentionality judgment even without explicit indifference.

  - **Deflationary View Prediction**: The asymmetry will disappear or be significantly reduced because the expression of indifference is a key trigger for the pragmatic effects (e.g., it signals that the agent is blameworthy in the harm case). Without it, the core concept (which does not include normativity) will be applied similarly in both conditions.

  ### Crux 3: The Effect of Multiple Side Effects

  **Experiment**: Present a scenario with two simultaneous side effects: one harmful and one helpful (e.g., the initiative both harms the environment and helps the economy). The executive is indifferent to both. Participants are asked about the intentionality of each side effect separately.

  - **Conceptual View Prediction**: Participants will judge the harmful side effect as intentional and the helpful one as unintentional. This is because the normative evaluation of each side effect independently affects the intentionality judgment.

  - **Deflationary View Prediction**: The judgments will be influenced by the overall valence of the action or by the dominant side effect. Alternatively, the presence of both might lead to reduced asymmetry because the executive's indifference is now spread across both, or because the overall action is seen as more mixed. The deflationary view might predict that the harm will still be judged as intentional (due to negativity bias) and the help as unintentional, but it would also allow for the possibility that the presence of both might dilute the effect.

  ### Crux 4: The Role of Skill or Control

  **Experiment**: Manipulate the degree of control the executive has over the side effect. For example, in one condition, the side effect is a direct and certain outcome (high control); in another, it is indirect and probabilistic (low control). Also, include conditions where the side effect is harmful and helpful.

  - **Conceptual View Prediction**: The asymmetry (intentional for harm, unintentional for help) will hold even when control is low, because the normative status overrides the control condition. The conceptual view might even predict that in the harm condition, low control will not reduce intentionality judgments as much as in the help condition.

  - **Deflationary View Prediction**: The asymmetry will be strongest when control is high and will diminish when control is low because the core concept of intentional action requires control. The deflationary view holds that the concept is descriptive and control is a key component, so when control is low, intentionality judgments should decrease in both conditions, but the harm condition may still show a higher level due to negativity bias.

  ## 4. Note on Verbal Disagreement

  We agree that the dispute is not merely verbal. Both sides are using the term "intentional action" to refer to the same folk concept and are making substantive claims about the psychological processes underlying judgments about that concept. The disagreement is about whether the asymmetry in judgments reflects a structural feature of the concept (the conceptual view) or an artifact of how the concept is applied in specific contexts (the deflationary view). This is an empirical disagreement that can be resolved by the experiments outlined above.

  However, we note that there might be terminological issues at the margins. For example, the conceptual view might use "intentional" in a way that is inherently normative, while the deflationary view might reserve the term for a purely descriptive concept. But both sides are committed to the idea that the folk concept is the target of investigation, and the experiments are designed to probe the structure of that concept.

