prompt: |-
  I'm in a philosophy of social science course, and we've been working through Lewis-style analyses of convention and the way social norms evolve and stabilize. My instructor reaches for the phrase 'conventions are arbitrary' constantly, and I've started to suspect it's doing several different jobs at once. I can see that one sense of 'arbitrary' — that there is some alternative regularity that could have served to coordinate us — is built into the standard analysis. But last week, when a student asked why the convention of driving on the right settled on the right rather than the left — was there some reason, or was it pure accident? — the instructor cut her off with "That's the wrong question; conventions are arbitrary." A few weeks earlier, someone asked whether a convention could be criticized as a bad convention, and the same phrase was used to wave that off too.

  The phrase seems to slide between claims of very different strengths. Sometimes it sounds like the boring empirical observation that nothing in physics or biology forces us to drive on the right. Sometimes it sounds like the stronger claim that any alternative convention would have served exactly as well. Sometimes it sounds stronger still: that conventions have no normative force, or that there is no point asking why one norm rather than another evolved, or that conventions can be changed at will because they rest on nothing. Those cannot all be equivalent, and some of them strike me as false.

  As a professional philosopher working on convention and the evolution of norms, please lay out for me the distinct precise theses that 'conventions are arbitrary' could be expressing — a menu of the different senses of 'arbitrary' in play — and for each, say whether it is trivial, substantive but defensible, or false. Then tell me which reading or readings would actually license my instructor's move of dismissing the question about why we drive on the right, and which reading would be needed to support the dismissal of the question about criticizing a convention. Please think carefully, and begin by brainstorming the candidate readings before you settle on the menu.
reasoning: |-
  Hmm, the user is in a philosophy of social science course and grappling with the concept of 'conventions are arbitrary.' They've noticed their instructor using this phrase in multiple contexts, sometimes to dismiss questions about why specific conventions exist (like driving on the right) and other times to wave off discussions about criticizing conventions. The user suspects this phrase is doing multiple jobs and wants a professional breakdown of its different meanings.

  The user provides concrete examples: when a student asked why we drive on the right rather than the left, the instructor shut it down with "conventions are arbitrary," and similarly dismissed a question about criticizing conventions. The user identifies three potential senses: a weak empirical claim (no biological/physical necessity), a stronger claim (alternatives are equally good), and an even stronger claim (no normative force or that conventions can be changed at will).

  I need to dissect the possible meanings of "arbitrary" in this context. Drawing from Lewis's work on convention, I should start with the core idea: conventions solve coordination problems through arbitrary choices. But as the user points out, "arbitrary" can mean different things. I'll brainstorm candidate readings:

  First, the Coordination Equivalence Thesis: any alternative could work equally well. This is Lewis's core view, but it might be too strong—in reality, some conventions might have slight advantages. This is substantive but defensible as an idealization.

  Second, the Absence of Pre-coordination Reason: before a convention exists, there's no inherent reason to prefer one option. This is strong but defensible for pure coordination problems. It directly addresses the driving side question.

  Third, the Normative Insulation Thesis: conventions lack intrinsic moral force. This is true but incomplete—conventions can still be criticized based on consequences. This relates to the dismissal of criticism questions.

  Fourth, the Explanatory Accidentalness Thesis: conventions emerge contingently. This is weak and almost trivial, but it explains why we can't predict specific outcomes.

  Fifth, the Radical Contingency Thesis: conventions could change instantly. This is false because conventions have inertia due to expectations.

  For the driving side question, the instructor's dismissal is justified by the Absence of Pre-coordination Reason or Explanatory Accidentalness. For the criticism question, Normative Insulation supports it, but only partially—criticism is still possible based on effects.

  The user needs clarity on which readings are valid and when they apply. I should emphasize that while "arbitrary" in the sense of coordination equivalence or lack of pre-existing reasons holds, it doesn't mean conventions can't be evaluated or that their history is unexplainable. The instructor might be overgeneralizing, and the user is right to be skeptical.
answer: |-
  You're absolutely right to be suspicious—your instructor is wielding "conventions are arbitrary" as a conceptual Swiss Army knife, and it's blurring crucial distinctions. Lewis's analysis provides a precise starting point, but "arbitrary" gets stretched into problematic territory. Let's dissect the candidate readings, evaluate them, and see which license the dismissals.

  **Core Lewisian Anchor:** A convention (for Lewis) is a solution to a *coordination problem*: a situation where individuals have a common interest in coordinating their behavior but multiple equilibria exist. The "arbitrariness" is inherent in the *structure*: multiple patterns of behavior could solve the problem equally well *ex ante* (before the convention is established), and adherence depends critically on *mutual expectations*.

  **Candidate Readings of "Conventions are Arbitrary" (The Menu):**

  1.  **Coordination Equivalence Thesis (CET):** *For any convention C solving coordination problem P, there exists at least one alternative pattern of behavior C' that would have solved P equally well, providing the same level of mutual benefit and stability, had it become established instead.*
      *   **Status:** **Substantive but largely defensible (as a core insight, often idealized).** This is the heart of Lewis's analysis. Driving on the left vs. right *does* seem genuinely equivalent for pure coordination. However, it's an idealization. In complex real-world conventions, alternatives might *not* be perfectly equivalent due to path dependencies, slight efficiency differences, or interaction with other norms/technologies (e.g., right-hand drive might interact slightly differently with right-handedness prevalence in gear-shifting, though this is marginal). The key is *functional equivalence for the core coordination problem*.

  2.  **Absence of Pre-coordination Reason Thesis (APRT):** *Prior to the emergence of a convention solving coordination problem P, there is no inherent, decisive reason (based on reason, nature, morality, or efficiency) for agents to prefer one potential solution C over another potential solution C' where CET holds.*
      *   **Status:** **Substantive and defensible (for pure coordination problems).** This follows directly from CET. Why drive right vs. left *before* a convention exists? No inherent reason favors one over the other. The question "Why right *rather than* left?" *presupposes* a reason needed *before* coordination, which APRT denies exists. This is the **strongest justification for dismissing the driving side question.** Asking "why right?" as if seeking a *pre-coordination justification* *is* arguably the "wrong question" – the answer is historical accident within the space of arbitrary (CET) options.

  3.  **Normative Insulation Thesis (NIT):** *The fact that a regularity is a convention (solves a coordination problem via mutual expectations) provides *no inherent normative force or justification* for following it, beyond the instrumental reason of coordinating with others who expect it. Conventions themselves are morally neutral.*
      *   **Status:** **Substantive and defensible (but requires careful framing).** Following a convention is typically justified instrumentally (to achieve coordination), not because the convention itself is inherently right or good. Driving on the right isn't morally superior to driving on the left *as a convention*. However, NIT **does NOT imply conventions cannot be criticized!** Criticisms target:
          *   *Consequences:* Does this convention cause harm, injustice, or inefficiency *beyond* the coordination benefit? (e.g., a convention privileging one group).
          *   *The Coordination Problem Itself:* Should we even be coordinating in *this way*? (e.g., conventions enforcing harmful gender roles).
          *   *Path Dependence:* Did the *process* of establishing it involve injustice?
      *   **NIT licenses dismissing the idea that a convention is *inherently* good/bad *just because it's the convention*. But it absolutely does NOT license dismissing criticism based on consequences or the nature of the problem it solves.** Your instructor's dismissal of criticism questions likely illegitimately slides from NIT to the false idea that conventions are immune to evaluation.

  4.  **Explanatory Accidentalness Thesis (EAT):** *The specific historical path leading to the establishment of convention C (rather than C') is contingent and often involves chance events, small historical accidents, or path dependence. There is no deterministic or deeply necessary explanation for why *this specific* convention emerged.*
      *   **Status:** **Trivial to Weakly Substantive/Defensible.** This is often empirically true (e.g., Napoleon's influence vs. British naval tradition influencing driving sides). However, it's not a *necessary* feature of Lewisian conventions. A convention *could* emerge through deliberate design or clear functional advantage *if* alternatives weren't perfectly equivalent (violating strict CET). EAT explains *why* we have *this* arbitrary solution, but it's a comment on historical explanation, not the logical structure of convention itself. It weakly supports dismissing the driving side question as seeking a *necessary* reason, but doesn't preclude historical explanation.

  5.  **Radical Contingency / Lack of Foundation Thesis (RCT):** *Conventions rest on nothing but mutual expectations; they lack any deeper foundation (in reason, nature, morality, or efficiency) and are therefore fragile or easily changed at will.*
      *   **Status:** **False (or at least highly misleading).** This is the dangerous overextension. While conventions *originate* from arbitrary coordination solutions and rely on expectations, they rapidly develop:
          *   *Inertia:* Established conventions create strong expectations, habits, and often supporting infrastructure/institutions, making change costly/difficult (not "at will").
          *   *Normative Layers:* Conventions often become embedded with normative force ("It's the rule," "It's polite," "It's tradition") beyond pure coordination.
          *   *Functional Integration:* They intertwine with other systems (technology, law, other norms), giving them stability.
          *   *Potential for Intrinsic Value:* Some conventions (e.g., linguistic ones, certain rituals) may develop intrinsic cultural value over time.
      RCT ignores the *stability* and *social reality* conventions acquire. It might be inspired by the *origin* (APRT/EAT) but misapplies it to the *current state*.

  **Applying the Menu to Your Instructor's Moves:**

  1.  **Dismissing "Why drive on the right rather than the left?"**
      *   **Licensed by:** **APRT (Absence of Pre-coordination Reason)**. This is the strongest and most relevant justification. Asking "why *right rather than* left?" *as if seeking a pre-coordination justification* misunderstands the arbitrariness inherent in the coordination problem. CET (Equivalence) provides the background for APRT. EAT (Accidentalness) provides a compatible historical explanation *for the specific choice* but isn't necessary for the dismissal – APRT/CET show no *reason* favored right *beforehand*.
      *   **Not Licensed by:** NIT (Normative Insulation - irrelevant to historical explanation), RCT (Radical Contingency - overkill/misleading).

  2.  **Dismissing "Can a convention be criticized as bad?"**
      *   **Partially Licensed by (but easily misapplied):** **NIT (Normative Insulation)**. NIT correctly dismisses the idea that a convention is bad *simply because it's arbitrary* or *inherently* bad *just as a convention*. Criticizing it *because* it's arbitrary misses the point.
      *   **NOT Licensed by (and why the dismissal is wrong):** NIT **does not** license dismissing criticism based on the convention's *consequences*, *injustice*, *inefficiency relative to possible alternatives*, or the *harmfulness of the coordination problem it solves*. Dismissing criticism *tout court* illegitimately stretches NIT into RCT (Radical Contingency/Lack of Foundation), implying conventions have no substance to criticize. This is false. CET (Equivalence) might suggest alternatives *could* work, but doesn't preclude that *this* one has bad effects. APRT/EAT are irrelevant to post-establishment evaluation.
      *   **The Required (False) Reading:** To dismiss criticism *entirely*, your instructor implicitly relies on the **RCT (Radical Contingency / Lack of Foundation Thesis)** – the false idea that conventions are just flimsy expectations with no real substance, consequences, or embedded values to evaluate. Alternatively, they may be conflating "arbitrary" with "morally neutral" (NIT) and then incorrectly inferring "therefore uncriticizable."

  **Conclusion:**

  Your instinct is spot-on. The instructor is conflating distinct theses under the banner of "arbitrary":

  *   **For the driving side question:** Legitimate dismissal relies on **APRT** (supported by **CET**), showing the search for a *pre-coordination justification* is misguided.
  *   **For the criticism question:** Legitimate dismissal *only* applies to criticism *based solely on arbitrariness itself* (**NIT**). The instructor's *blanket* dismissal requires the false **RCT**, or a serious misapplication of **NIT**, ignoring that conventions have real-world effects and normative layers open to evaluation.

  **Professional Advice:** Challenge politely! Ask: "When you say 'arbitrary' dismisses criticism, do you mean *no convention is inherently good/bad* (NIT - which I agree with, but doesn't block consequentialist criticism), or do you mean conventions *have no consequences or normative weight to evaluate* (RCT - which seems false)?" Frame it as seeking conceptual clarity on the different senses of 'arbitrary' inherent in Lewis's framework and their limits. Your analysis above provides the precise tools for this.
