prompt: |-
  hi so i'm in student gov and we got assigned to evaluate this proposal where the school installs solar panels — costs a ton upfront (like, from our reserve fund) but saves money on electricity over ~20 years and cuts emissions. the administration told us to use "intergenerational justice" as our framework but honestly none of us know what that means as an actual thing you do, as opposed to just a vibe.

  can you turn intergenerational justice into like a decision procedure or checklist we can actually run? we have 30-minute meetings and we're not philosophers. i need: what questions to ask and in what order, what counts as a good enough answer, where the procedure says yes this is fair to future students, where it says no, and where it has to punt to a judgment call because it's values not facts.

  things it needs to handle: discounting (should we care less about students 30 years from now just cause they're far away in time?), uncertainty (we don't know future energy prices or what the climate will actually be like), and the fact that future students don't get a vote in student gov which feels kinda unfair but also unavoidable.

  then run the procedure on two cases: (1) the solar panel thing, and (2) a proposal to cut the arts budget to build a STEM lab — current students really want the lab, but it means future students lose the arts program permanently. i want to see where the procedure gives an answer i might not like.
reasoning: |-
  Okay, let me tackle this student government dilemma. The user needs a practical framework for evaluating proposals through an intergenerational justice lens, specifically for a solar panel project and an arts vs STEM tradeoff. They're clearly time-pressed (30-minute meetings!) and need something actionable, not philosophical jargon.

  First, I need to demystify "intergenerational justice" into concrete steps. The core idea is balancing needs across generations - but how? Three pillars come to mind: avoiding harm to future students, preserving their options, and distributing costs fairly. That feels like solid ground to build on.

  For the procedure itself, I'm thinking a flowchart-style checklist would work best. Start with irreversible harm (like the arts program elimination), then move to necessity and alternatives. Key questions would address: Can we undo this? Is this essential? Are we shifting burdens unfairly? Each needs clear pass/fail thresholds - like "no alternatives exist" or "worst-case scenario still leaves future students no worse off."

  Discounting future costs/savings is tricky. Pure financial discounting feels unethical for generational fairness, but uncertainty needs handling. Maybe require worst-case modeling? Like projecting savings even if energy prices crash. And for irreversible decisions, demand higher certainty - perhaps 90% confidence thresholds.

  The arts vs STEM case is particularly revealing. Cutting arts permanently fails the irreversibility test immediately - future students get no choice. Whereas the solar panels, while expensive now, leave options open and prevent future harm. That contrast should help the committee see how the framework works.

  Biggest challenge will be the judgment call moments. Like when savings projections are ambiguous. Here I'd suggest a "tiebreaker" principle: if uncertain, preserve future flexibility. Also important to flag where values dominate - like whether arts cuts are "necessary" involves subjective definitions of education quality.

  The user's smart to request examples where the outcome might feel uncomfortable. That STEM lab rejection will sting for current students, but the procedure makes the tradeoff visible: temporary gain vs permanent loss. Might spark good debate about what "essential" really means.

  Should emphasize practical tools too - like requiring presenters to complete the checklist beforehand, and using simple voting thresholds for judgment calls (e.g. 75% supermajority). Keeping it to 5 core questions max so it fits in their tight meetings.

  Finally, the "no vote for future students" problem. The framework can't solve that, but can force explicit consideration of their hypothetical interests. Maybe suggest they appoint a "future generations advocate" role to argue for those interests during debates.
answer: |-
  Here’s a practical **Intergenerational Justice (IJ) Decision Procedure** designed for student gov use – no philosophy degree required. It’s a 5-step checklist with clear thresholds, red flags, and handling of your key issues:

  ---

  ### **Intergenerational Justice Checklist**
  **Goal:** *Does this proposal fairly balance impacts on current vs. future students?*  
  **Time Limit:** 20 mins per proposal (save 10 mins for debate/vote).

  | Step | Question to Ask                                                                 | Good Enough Answer                                                                                                | Red Flag (Fails IJ)                                                                 | Judgment Call?                                     |
  |------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------|
  | 1    | **Irreversible Harm?** Does this *permanently* remove options/resources for future students? | "No" OR "Yes, but unavoidable for core survival/function."                                                       | **YES** + No compelling existential reason (e.g., eliminating arts program for a non-essential lab). | What's "core"? Define your school's non-negotiables (e.g., accreditation, safety). |
  | 2    | **Burden Shift?** Are we pushing major costs/problems (>15% of annual budget) onto future students? | "No" OR "Yes, but future savings/benefits *clearly* outweigh costs (even in worst-case)."                         | **YES** + Savings uncertain or costs exceed projected benefits (e.g., risky debt).                | Uncertainty handling (see below).                 |
  | 3    | **Alternatives?** Have we fully explored options that *reduce harm to future gens*? | "Yes, and best IJ option chosen" OR "No alternatives exist without harming current gens severely."               | **NO** exploration OR cheaper/safer IJ alternatives exist but were dismissed.                     | How severe is "severe"? (e.g., "losing sports" vs. "slightly higher fees"). |
  | 4    | **Worst-Case Survival?** If everything goes wrong (costs double, benefits halve), can future students still thrive? | "Yes – basics are protected" OR "No, but likelihood <10% and we have a backup plan."                             | **NO** + High chance (>30%) of crippling future operations.                          | Defining "thrive" (e.g., "can still run core curriculum"). |
  | 5    | **Discount Rate Check:** Are we valuing future students *at least* 50% as much as current ones? | "Yes – we used ≤3% discount rate OR no discounting."                                                             | Used high discount rate (>5%) making future benefits negligible.                   | **Values call:** Is 50% fair? Adjust if consensus. |

  ---

  ### **Handling Your Key Issues**
  - **Discounting:** Use **max 3% discount rate** for future $ (or none). *Why?* High rates (>5%) make future gens irrelevant.  
  - **Uncertainty:** Demand **worst-case projections** (e.g., "Assume energy prices drop 40%"). Pass if Step 4 is satisfied.  
  - **No Future Vote:** Mitigate by **appointing a "Future Advocate"** in meetings to argue for unseen interests.  

  ---

  ### **Case Evaluations**
  **Case 1: Solar Panels**  
  1. **Irreversible Harm?** No (panels can be removed/replaced). ✅  
  2. **Burden Shift?** Yes (big upfront cost), but savings *very likely* outweigh it (electricity always costs $). Worst-case: Still breaks even in 15 yrs. ✅  
  3. **Alternatives?** Doing nothing shifts carbon costs + rising energy bills to future gens. ❌ *Better IJ alternative?*  
  4. **Worst-Case Survival?** If savings = 50% projection, school still operates (utility bills just stay current). ✅  
  5. **Discount Rate:** Used 2% – values future students fairly. ✅  
  **VERDICT:** **YES, IJ-APPROVED** (Passes 4/5 steps easily).

  **Case 2: Cut Arts Budget for STEM Lab**  
  1. **Irreversible Harm?** **YES** – Arts program eliminated *permanently*. Future students have no option. 🚩 **FAIL**  
  2. *Stop here – but full analysis for illustration:*  
  3. Burden Shift? Yes (future gens lose arts access). No monetary savings to offset. 🚩  
  4. Alternatives? Yes! (Fundraise, phased rollout, temporary fee). Not explored? 🚩  
  5. Worst-Case Survival? Thriving? Debatable – but **fails at Step 1.**  
  **VERDICT:** **NO, IJ-REJECTED** (Irreversible harm without compelling necessity).

  ---

  ### **Where You Might Not Like the Outcome**
  - **STEM Lab Example:** Current students *really* want the lab, but IJ blocks it because permanence + harm isn’t justified. Forces creativity (e.g., "Can we build a smaller lab *without* killing arts?").  
  - **Discount Rate Fight:** If someone argues "Why care about 2050 students?", the procedure forces a values debate at Step 5.  
  - **"Punt" Moments:** Defining "core" resources (Step 1) or "thrive" (Step 4) requires student gov consensus. **Tip:** Draft definitions *before* reviewing proposals!

  ---

  ### **How to Implement**
  1. **Require proposers** to submit answers to the 5 steps.  
  2. **Vote thresholds:** Fail any red flag → reject. Pass all → approve. Judgment calls? ⅔ majority.  
  3. **Track record:** Add an "IJ Impact Statement" to all decisions for accountability.  

  This turns "justice vibes" into a concrete audit – forcing debate on tradeoffs, not just goodwill. Tough? Yes. But future students can’t lobby, so your rigor is their voice.
