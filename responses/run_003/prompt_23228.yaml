answer: |-
  It looks like you're encountering a common point of confusion in iterative elimination of strictly dominated strategies: the role of mixed strategies. In this game, row B is strictly dominated by a mixed strategy involving rows A and C, even though no pure strategy dominates it. Similarly, column 2 becomes strictly dominated after row B is removed. I'll walk through the reduction step by step, explaining why row B should be eliminated first and why your instinct to keep it (or cross out column 2 first) is incorrect in the initial step.

  ### Step-by-Step Reduction Process
  We'll use the normal-form game as given, with payoffs (row, column):

  |          | Column 1 | Column 2 | Column 3 |
  |----------|----------|----------|----------|
  | **Row A**| (5, 1)   | (5, 0)   | (2, 2)   |
  | **Row B**| (3, 0)   | (4, 0)   | (3, 1)   |
  | **Row C**| (2, 2)   | (5, 1)   | (5, 0)   |

  #### Step 1: Identify and remove strictly dominated strategies (including mixed domination)
  - **Why row B must be crossed out first (dominated by mixed strategy):**  
    Row B is not strictly dominated by any pure strategy (as you correctly noted). For example:
    - Against column 1: A (5) > B (3), but against column 3: C (5) > B (3), so neither A nor C dominates B purely.
    - However, row B is strictly dominated by a mixed strategy of rows A and C.  
      - Consider a mixed strategy where the row player plays A with probability \(p\) and C with probability \(1-p\).  
      - Expected payoffs against each column:
        - Column 1: \(p \cdot 5 + (1-p) \cdot 2 = 3p + 2\)
        - Column 2: \(p \cdot 5 + (1-p) \cdot 5 = 5\)
        - Column 3: \(p \cdot 2 + (1-p) \cdot 5 = 5 - 3p\)  
      - Compare to row B's payoffs (3, 4, 3):
        - For domination, we need \(3p + 2 > 3\), \(5 > 4\), and \(5 - 3p > 3\) for all columns.  
        - Solving: \(3p + 2 > 3\) ⇒ \(p > \frac{1}{3}\), \(5 > 4\) (always true), and \(5 - 3p > 3\) ⇒ \(p < \frac{2}{3}\).  
      - For any \(p \in (\frac{1}{3}, \frac{2}{3})\) (e.g., \(p = 0.5\)), the mixed strategy yields strictly higher payoffs than B against every column:
        - Column 1: \(3p + 2 > 3\) (e.g., 3.5 > 3 for p=0.5)
        - Column 2: 5 > 4
        - Column 3: \(5 - 3p > 3\) (e.g., 3.5 > 3 for p=0.5)  
    Thus, no rational row player would ever play B, as it is strictly dominated by a mixed strategy of A and C. Cross out row B.

  - **Updated game after removing row B:**

  |          | Column 1 | Column 2 | Column 3 |
  |----------|----------|----------|----------|
  | **Row A**| (5, 1)   | (5, 0)   | (2, 2)   |
  | **Row C**| (2, 2)   | (5, 1)   | (5, 0)   |

  #### Step 2: Remove newly dominated strategies (now pure domination suffices)
  - **Why column 2 must be crossed out next (dominated by pure strategy):**  
    With only rows A and C left, column 2 is strictly dominated by column 1 for the column player. Compare payoffs:
    - Against row A: Column 1 gives 1, column 2 gives 0 → 1 > 0
    - Against row C: Column 1 gives 2, column 2 gives 1 → 2 > 1  
    Since column 1 yields a strictly higher payoff against both remaining rows, no rational column player would play column 2. Cross out column 2.

  - **Updated game after removing column 2:**

  |          | Column 1 | Column 3 |
  |----------|----------|----------|
  | **Row A**| (5, 1)   | (2, 2)   |
  | **Row C**| (2, 2)   | (5, 0)   |

  #### Step 3: Check for further dominated strategies
  - **Row player (A vs C):**  
    - Against column 1: A (5) > C (2)  
    - Against column 3: A (2) < C (5)  
    No pure or mixed strategy dominates the other, as each is better in one column.
    
  - **Column player (1 vs 3):**  
    - Against row A: Column 1 (1) < column 3 (2)  
    - Against row C: Column 1 (2) > column 3 (0)  
    No pure or mixed strategy dominates the other, as each is better against one row.

  No more strategies can be crossed out. The reduced game is 2×2 with row strategies A and C, and column strategies 1 and 3.

  ### Why Your Instinct Was Misguided
  - **Keeping row B:** You thought row B shouldn't be crossed out because no pure strategy dominates it. However, in iterative elimination of strictly dominated strategies, we must consider domination by mixed strategies. Row B is strictly dominated by a mixed strategy of A and C, so it should be eliminated first. A rational player would never choose B because they can always get a higher payoff with a mix of A and C.
    
  - **Crossing out column 2 first:** You considered this because column 2 has low payoffs (0 or 1), but in the full game, column 2 is not strictly dominated by any pure strategy:
    - Against row A: Column 1 (1) > column 2 (0), but against row B: Column 1 (0) = column 2 (0) (not strictly better).
    - Against row C: Column 1 (2) > column 2 (1), but column 3 (0) < column 2 (1) for row C.
    Thus, column 2 isn't dominated purely initially. However, after row B is removed (due to mixed domination), column 2 becomes strictly dominated by column 1 and can be eliminated. If you insist on pure strategies only, no initial elimination is possible, but mixed strategies are necessary here to reduce the game.

  ### Key Takeaway
  The subtlety in this problem is that **domination by mixed strategies** must be considered for iterative elimination to work. In many introductory examples, pure strategy domination suffices, but here it doesn't. Always check for mixed strategy domination if no pure strategies are dominated. The reduced game is a 2×2 with:
  - Row strategies: A and C
  - Column strategies: 1 and 3

  This matches the answer key and confirms that row B and column 2 are the strategies "no rational player would ever play."
