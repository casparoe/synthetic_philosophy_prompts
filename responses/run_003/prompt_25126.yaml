prompt: |-
  I've been working out my views on the norms of assertion and I want a consistency check before I write them up. Here's the package I'm considering:

  (a) The norm of assertion is knowledge: you should assert that p only if you know that p.

  (b) Knowledge is externalist — whether you know p depends on factors like reliability and truth that can be entirely outside your first-person perspective. You can think you know and be wrong; you can know without being able to tell that you know.

  (c) For a norm to genuinely govern a practice like assertion, it has to be action-guiding: an agent must be able to determine, from their own perspective and without further empirical investigation, whether they are complying with it. A norm you cannot deliberately follow is not really a norm for that practice.

  (d) The knowledge norm gets the right result in lottery cases: you should not assert "my ticket lost" on the basis of the astronomical odds alone, and the explanation is that you don't know it lost — which is exactly what the knowledge norm says.

  (e) There are cases where a testifier asserts p without knowing p — perhaps without even believing p — but the hearer can still permissibly assert p later on the basis of that testimony, because the testimony was reliable and true and the hearer thereby came to know p. (Think of a teacher who sincerely rejects some theory but teaches it accurately under institutional pressure; a student can learn it from them and later assert it.)

  I want to know: which of these are in genuine tension, which only look like they are, and what is the least costly revision? Please rank the tensions by severity rather than listing everything as equally problematic. I'm especially interested in whether (c) forces me to give up either (a) or (b), and whether (e) is actually compatible with (a) or whether I'm helping myself to something that (a) rules out.
reasoning: |-
  Okay, the user is working on their views about the norms of assertion and wants a consistency check. They've listed five points: (a) knowledge norm, (b) externalist knowledge, (c) action-guiding requirement, (d) lottery cases, and (e) testimony cases. They're concerned about tensions between these, especially between (c) and (a)/(b), and whether (e) conflicts with (a).

  First, I need to identify the main tension. The user's point (c) says norms must be action-guiding from the agent's perspective. But externalist knowledge (b) depends on factors outside that perspective. That's a big conflict because if knowledge relies on external factors like reliability or truth, the asserter can't always know if they know. So they might violate the norm without realizing it, making it hard to follow deliberately.

  The user might be worried about how a norm can be practical if it's not accessible. They probably want to maintain that assertion is governed by knowledge but need to reconcile that with the action-guiding requirement. Maybe they're considering internalist adjustments but don't want to give up externalism's benefits, like handling lottery cases (d).

  Next, point (e) about testimony. The teacher doesn't know or believe the theory but teaches it correctly. The student learns and asserts it, knowing it. This seems compatible with (a) since the student knows. But the issue is the teacher's assertion without knowledge. Under (a), the teacher shouldn't assert, but (e) describes it happening. The user might think this is acceptable if the hearer gains knowledge, but (a) strictly prohibits such assertions. So there's a tension here; does (a) allow assertions without knowledge if they cause knowledge later? Probably not, so the user might need to adjust either (a) or their view of permissible testimony.

  Lottery cases (d) are handled well by (a) and (b), showing why probabilistic belief isn't enough. That's a strength they want to keep. But (c) threatens this because in lottery cases, the asserter might think they comply (high probability) but don't due to lack of knowledge. So again, the action-guiding problem surfaces.

  The user's deeper need might be to preserve both the objectivity of knowledge (externalism) and the practicality of norms. They might be aiming for a theory that's both philosophically robust and applicable. The least costly revision could involve distinguishing between primary and secondary norms. For example, the primary norm is knowledge, but agents use an internal heuristic (justified belief) to aim at compliance. This keeps externalism while making the norm action-guiding in practice.

  Another option is modifying (c) to allow norms that aren't always transparent but still govern through accountability. However, the user insists on action-guiding, so this might not work. Alternatively, they could adopt a hybrid view where knowledge is the norm, but internal justification is the guide, which resolves the tension without ditching key points.

  For testimony (e), they might need to accept that the teacher violated (a), but the student's later assertion is fine because they know. Emphasizing that (a) is about the asserter's state at the time of assertion could resolve this. The teacher's assertion is impermissible, but the student's is okay, so (e) doesn't contradict (a) directly.

  Ranking the tensions: The (c) vs. (a)/(b) conflict is the most severe because it challenges the norm's practicality. Next is (e) vs. (a), but it's manageable by clarifying the norm's application. (d) is actually supported by their view. The user should prioritize resolving the action-guiding issue, possibly via the heuristic approach, to maintain their core ideas without major revisions.
answer: |-
  Here's a breakdown of the tensions within your package, ranked by severity, along with analysis of compatibility and suggested revisions:

  ### Ranked Tensions (Most Severe First)

  1.  **Tension: (c) Action-Guiding Requirement vs. (a) Knowledge Norm + (b) Externalist Knowledge**
      *   **Severity:** High/Core Conflict. This is the most fundamental tension.
      *   **Nature of Conflict:**
          *   (c) demands that an asserter can *determine*, from their first-person perspective, whether they are complying with the norm. This requires compliance to be *internally accessible*.
          *   (b) states that knowledge depends on *external* factors (reliability, truth) that are often inaccessible from the first-person perspective. You can be mistaken about whether you know.
          *   (a) makes the norm compliance condition *knowing that p*.
          *   **Result:** An asserter frequently *cannot* determine from their perspective whether they satisfy the knowledge norm. They may think they know (and thus comply) when they don't (due to Gettier cases, unnoticed unreliability, false belief, etc.), or they may think they don't know (and thus refrain) when they actually do (due to underestimating their reliability or access). (c) claims such a norm cannot genuinely govern assertion.
      *   **Why it's Severe:** This directly challenges the *practicality* of the knowledge norm as a *norm for guiding action*. If agents cannot use the norm to regulate their own assertions in real-time, (c) argues it fails as a genuine norm *for the practice*.
      *   **Compatibility?** Genuine tension. (c) is fundamentally incompatible with the combination of (a) and (b) as stated. Externalist knowledge is inherently not always first-person accessible.

  2.  **Tension: (e) Permissible Testimony-Based Assertion vs. (a) Knowledge Norm (Strict Interpretation)**
      *   **Severity:** Moderate/Apparent Conflict (Potentially Resolvable).
      *   **Nature of Conflict:**
          *   (e) describes a case where the *original testifier* (the teacher) asserts *p* without knowing *p* (perhaps without even believing *p*).
          *   (a) states the norm: "you should assert that p only if you know that p."
          *   **Result:** The teacher's assertion appears to *violate* (a). However, (e) focuses on the *hearer's* later permissible assertion based on that testimony, which *does* satisfy (a) because they come to know *p*. The tension arises because the hearer's permissible knowledge *originates* from an assertion that violated the norm.
      *   **Compatibility?** *Mostly Compatible*, with clarification:
          *   (a) governs the *asserter's state at the time of assertion*. The teacher violated (a). The student, *at the time of their later assertion*, satisfies (a) because they *know p*. (e) doesn't claim the teacher's assertion was permissible; it focuses on the downstream epistemic state of the hearer.
          *   **Crucial Point:** (a) does *not* require that the *source* of one's knowledge itself complied with the knowledge norm. It only requires that the *current asserter* knows. So, the student learning from a norm-violating teacher who nonetheless reliably transmitted truth is compatible with the student satisfying (a) later.
      *   **Why Moderate?** It only becomes a tension if you interpret (a) as requiring that the *chain* of testimony must be knowledge-based all the way back. But (a) itself doesn't entail that. The tension is more about the *permissibility of the original testimony* under (a), not the hearer's later assertion. (e) implicitly accepts the original testimony violates (a), which is consistent.

  3.  **Tension: (c) Action-Guiding Requirement vs. (d) Lottery Cases**
      *   **Severity:** Low/Derivative Conflict (Resulting from #1).
      *   **Nature of Conflict:**
          *   (d) appeals to the knowledge norm explaining why asserting "My ticket lost" based solely on odds is impermissible (you don't know).
          *   However, from the first-person perspective (c), the lottery participant has *overwhelming justification* for believing their ticket lost. They might reasonably *think* they know (or at least, that they satisfy the norm, whatever it is). Yet, according to (a) & (b), they don't know and violate the norm.
          *   **Result:** The lottery case *exemplifies* the problem raised in #1. The agent cannot tell from their perspective that they are violating the norm (a), precisely because knowledge (b) is externalist. They have strong internal reasons to believe they are complying (high justification), but externally, they fail.
      *   **Compatibility?** (d) is *well-explained* by (a) & (b). The conflict isn't between (d) and the others *directly*, but rather (d) *illustrates* why the combination of (a), (b), and (c) is problematic. (d) is a strength of (a)/(b), but it highlights the cost regarding (c).

  ### Least Costly Revisions & Solutions

  1.  **Addressing the Core Tension (c vs. a/b):**
      *   **Revision 1 (Least Costly?): Reinterpret/Modify (c) - Heuristic Access.** Maintain (a) and (b) as the core norm. Revise (c) to state that while the *strict compliance condition* (knowledge) is external, the norm is *action-guiding* via an *internal heuristic* or *surrogate*. Agents *aim* to comply by asserting only what they *take themselves to know* or what they are *internally justified* in believing (to a high standard). This surrogate is reliably connected (though not infallibly) to knowledge. This preserves the external norm while explaining how agents regulate their assertions in practice. *Cost:* Admits (c) isn't *literally* true; the norm itself isn't directly accessible, only a proxy used to follow it.
      *   **Revision 2: Modify (a) - Weaken the Norm.** Keep (b) and (c). Change (a) to an *internalist* norm that *is* accessible, like "Justified Belief" or "Reasonable to Believe One Knows". *Cost:* Loses the elegant explanation of lottery cases (d) – why isn't high justification enough? Also weakens the intuitive link between assertion and the robust commitment/knowledge often associated with it.
      *   **Revision 3: Modify (c) - Drop Strict Action-Guiding.** Maintain (a) and (b). Argue that norms *can* genuinely govern a practice even if agents cannot always determine compliance in real-time. The norm functions more like a standard of *correctness* and *criticism* applied retrospectively or externally (e.g., "You shouldn't have asserted that, you didn't know it!"). *Cost:* Directly contradicts your stated commitment in (c) that a norm must be deliberately followable. May make the norm feel less like a practical guide and more like a theoretical constraint.
      *   **Recommended:** **Revision 1 (Heuristic Access)** is likely the least costly *within your framework*. It preserves the core insights of (a), (b), and (d), while offering a plausible story about how agents *use* the norm in practice, satisfying the spirit of (c).

  2.  **Addressing Testimony (e vs. a):**
      *   **Clarification, Not Revision:** As argued above, (e) is compatible with (a) if (a) is understood as governing the asserter *at the time of assertion*. The teacher violated (a). The student, *later*, satisfies (a). There's no need to revise (a) or (e). Simply clarify that (a) applies locally to each act of assertion. The norm violation by the teacher explains *why* we might criticize *their* assertion, but it doesn't infect the student's later knowledge or their permissible assertion based on it.

  ### Conclusion

  *   **Most Severe Tension:** **(c) vs. (a)/(b)** is the fundamental and most problematic clash. Your commitment to the norm being action-guiding from the first-person perspective is incompatible with an externalist knowledge norm.
  *   **Manageable Tension:** **(e) vs. (a)** is primarily apparent and resolvable by clarifying the scope of (a) to the asserter *at the time of assertion*. The teacher violates (a); the student later satisfies it.
  *   **Illustrative, Not Independent Tension:** **(c) vs. (d)** is not a separate tension but highlights *why* the core tension matters, using the very case (d) that the knowledge norm explains well.
  *   **Least Costly Path:** To preserve (a), (b), and (d) while addressing (c), **adopt the "Heuristic Access" revision of (c)**. Acknowledge that agents follow the knowledge norm by using an internal surrogate (like justified belief or taking oneself to know) as a guide, which is reliably but not infallibly connected to actual knowledge. This satisfies the practical need behind (c) while keeping the core commitments. Maintain (e) as compatible with (a) via the clarification above.

  This package allows you to keep the core strengths of the knowledge norm (explaining lottery cases, capturing the robust commitment of assertion) and externalist knowledge, while providing a plausible account of how speakers actually regulate their assertions in practice, addressing the action-guiding concern.
