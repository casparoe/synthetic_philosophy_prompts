prompt: |-
  I'm writing a paper on wireheading and I need a thought experiment that does something specific. The standard story is that hedonistic utilitarians are the ones who have to bite the bullet on wireheading — if pleasure is all that matters, and the machine gives you more pleasure than real life, then you should plug in. Meanwhile desire-satisfaction theorists get to oppose it because wireheading frustrates your desire to actually achieve things in the real world. I want a case that reverses this completely: the hedonistic utilitarian has to oppose the wirehead option and the desire-satisfaction theorist has to endorse it.

  Constraints: no far-future tech. Base it on something like deep brain stimulation, which already exists. One paragraph, about a specific person with a specific psychology. The reversal has to come from the theories' internal logic, not from me just declaring that this person has bizarre preferences.

  After you give me the scenario, walk through each theory's reasoning step by step. Then tell me which feature of the case is doing the heavy lifting, and what happens if you remove it — does the case collapse back to the standard verdict or does it turn into something else entirely?
