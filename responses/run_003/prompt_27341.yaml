prompt: |-
  I am a PhD student in political philosophy, currently seconded to a state-level reparations task force. The commission is beginning to receive claims from communities alleging historical injustices, and the commissioners have asked me to develop a structured decision procedure their staff can use to triage and evaluate claims before they reach the commissioners for final determination.

  The procedure should be grounded in the philosophical literature on compensatory and restorative justice — in particular, the principles governing when present-day entities bear obligations to redress past wrongs, how to handle counterfactuals about what would have happened absent the wrong, and how to treat cases where both wrongdoers and victims are long dead. But the staff who will apply it have backgrounds in law, history, or public policy, not philosophy, and they have roughly two days per initial claim.

  I need a step-by-step framework: a sequence of questions to ask about each claim, with guidance on what counts as a sufficient answer at each stage, where the procedure stops with a rejection, and where it flags a case for commissioner judgment because the question turns on a value choice the procedure cannot resolve. Please mark those judgment calls explicitly and explain why the procedure cannot settle them.

  Then run the procedure on three cases:

  (1) A claim by descendants of residents displaced by a mid-20th-century urban renewal project that destroyed a thriving minority business district, where the municipal government that authorized the project still exists.

  (2) A claim by a present-day indigenous group seeking compensation for land seized in the early 19th century, where the seizing colonial government no longer exists but its successor state does, and the group was forcibly relocated multiple times since.

  (3) A claim where the procedure should, by its own lights, recommend rejection even though the historical injury is undisputed and severe. Explain why that outcome follows from the principles you have built in, and say whether this reveals a limitation of the procedure, a limitation of the underlying principles, or neither.
reasoning: |-
  Hmm, the user is a PhD student in political philosophy working with a state-level reparations task force. They need a structured decision procedure for evaluating historical injustice claims, grounded in philosophical literature but practical for non-philosophers. The staff have only two days per claim and come from law, history, or policy backgrounds. That means the procedure must be efficient and accessible, avoiding jargon while still being philosophically rigorous.

  The core challenge is balancing philosophical depth with operational practicality. The key principles to incorporate from compensatory justice literature are: the persistence of obligations over time (intergenerational responsibility), counterfactual reasoning (what would've happened without the wrong), and the problem of non-identity (when both victims and perpetrators are dead). I should also consider backward-looking (corrective justice) versus forward-looking (restorative justice) approaches, as both appear in the literature.

  For the step-by-step framework, I'll need a tiered approach that filters claims progressively: starting with threshold questions (like standing and statute of limitations), then moving to substantive philosophical tests. Each stage should have clear exit points - either rejection or escalation to commissioners. The "judgment call" flags are crucial since value-laden decisions (e.g., "sufficient continuity") can't be algorithmized. 

  For the three test cases:
  - Case 1 (urban renewal) should likely escalate due to clear governmental continuity but tricky counterfactuals about the business district's trajectory.
  - Case 2 (indigenous land seizure) will hit multiple judgment calls, especially on successor state responsibility and unbroken harm chains.
  - Case 3 needs to demonstrate a principled rejection - perhaps where claimants lack standing despite severe harm, showing the procedure isn't just about injury severity but philosophical coherence.

  The trickiest part is designing Stage 4 (counterfactuals) to be workable for non-philosophers. I'll use concrete indicators like tax records or census data rather than abstract theorizing. Also, "redress proportionality" in Stage 5 must allow for non-monetary solutions to keep it practical.

  For the rejection case, I'm considering a scenario where claimants are geographically/demographically disconnected from original victims - not because the harm doesn't matter, but because the philosophical basis for obligation dissolves. This reveals neither a flaw nor a limitation, but rather a deliberate boundary: the procedure prioritizes relational repair over abstract justice.
answer: |-
  Here is a structured decision procedure grounded in compensatory/restorative justice principles, designed for efficiency and clarity—with philosophical foundations translated into operational questions. Judgment calls are explicitly marked (**JC**) where value choices are unavoidable.

  ---

  ### **Reparations Claim Evaluation Procedure**  
  *For Staff Use (2-Day Initial Assessment)*  

  **Philosophical Anchors:**  
  - **Continuity of Obligation:** Present entities bear duties if they are *institutional successors* to wrongdoers or *beneficiaries* of injustice (Butt 2009; Thompson 2002).  
  - **Counterfactual Baseline:** Estimate victims’ trajectory *absent the wrong* to quantify harm (Sher 1981).  
  - **Intergenerational Standing:** Claims require a *persistent group identity* and *unbroken harm chain* linking past to present (Spinner-Halev 2012).  
  - **Feasibility:** Redress must be *proportionate* and administratively viable (Boxill 2003).  

  ---

  ### **Step-by-Step Framework**  
  *(Proceed sequentially; stop if any step yields "NO")*  

  #### **STAGE 1: THRESHOLD ELIGIBILITY** (1–2 hours)  
  *Purpose: Screen out legally/philosophically non-viable claims.*  
  1. **Is the claimant group clearly identifiable today?**  
     - *Sufficient:* Demonstrable continuity (e.g., descendant community, tribal nation).  
     - *Reject if:* Group identity is amorphous (e.g., "all people of X ethnicity in the state").  

  2. **Did the alleged injustice occur within the state’s jurisdiction?**  
     - *Sufficient:* Harm committed by state/local agents or enabled by state law.  
     - *Reject if:* Purely federal/private action without state involvement.  

  3. **Is the claim filed within any statutory deadlines?**  
     - *Sufficient:* No applicable statute of limitations, or injustice is ongoing.  
     - *Reject if:* Statute of limitations bars claim (e.g., tort deadlines).  

  #### **STAGE 2: WRONGDOING & HARM** (4–6 hours)  
  *Purpose: Verify historical injury and agency.*  
  4. **Is there clear evidence of unjust state action/inaction?**  
     - *Sufficient:* Official records, court rulings, or scholarly consensus documenting violation of *then-prevailing* norms (e.g., unconstitutional takings, forced displacement).  
     - **JC: "Unjust" Determination** → *Escalate to commissioners if:* Norms conflict (e.g., "urban renewal" was legal but racially targeted). Staff cannot resolve moral vs. legal wrongs.  

  5. **Is there evidence of material/psychological harm to the original victims?**  
     - *Sufficient:* Data on lost property, income, mortality, or cultural destruction.  
     - *Reject if:* Harm is speculative or undocumented.  

  #### **STAGE 3: CONTINUITY ASSESSMENT** (3–4 hours)  
  *Purpose: Establish linkage between past wrong and present obligation.*  
  6. **Is the state/successor entity responsible?**  
     - *Sufficient:* Direct institutional continuity (e.g., same municipality) or benefit retention (e.g., state land/profits from injustice).  
     - *Reject if:* Wrongdoer dissolved without successor (e.g., defunct private company).  

  7. **Does the claimant group show unbroken harm transmission?**  
     - *Sufficient:* Quantitative/qualitative data on intergenerational effects (e.g., poverty cycles, disrupted cultural practices).  
     - **JC: "Sufficient Continuity" Threshold** → *Escalate if:* Displacement/assimilation obscures lineage (e.g., forced relocations). Staff cannot arbitrate identity persistence.  

  #### **STAGE 4: COUNTERFACTUAL ANALYSIS** (6–8 hours)  
  *Purpose: Estimate redressable harm.*  
  8. **What would the victim group’s status likely be absent the injustice?**  
     - *Sufficient:* Historical benchmarks (e.g., comparable communities’ outcomes, pre-harm growth trends).  
     - **JC: Baseline Selection** → *Escalate if:* Competing benchmarks exist (e.g., "Would they be middle-class or wealthy?"). Staff cannot resolve speculative histories.  

  9. **Is present disadvantage substantially attributable to this injustice?**  
     - *Sufficient:* Expert analysis (e.g., econometric studies) showing the injustice as a *primary* cause.  
     - *Reject if:* Disproved by data (e.g., group thrived post-injustice until unrelated recessions).  

  #### **STAGE 5: REDRESS DESIGN** (2–3 hours)  
  *Purpose: Flag feasibility issues.*  
  10. **Is proportionate redress administratively feasible?**  
      - *Sufficient:* Clear mechanisms (e.g., land return, scholarships, monetary compensation) with defined beneficiaries.  
      - **JC: "Proportionality"** → *Escalate if:* Trade-offs arise (e.g., compensating descendants risks neglecting present inequities). Commissioners must weigh moral urgency.  

  **OUTPUT:**  
  - *Reject:* Fails any "Reject if" criterion.  
  - *Escalate:* Triggers a Judgment Call (JC).  
  - *Recommend:* Passes all stages → Forward to commissioners with harm/redress analysis.  

  ---

  ### **Case Applications**  

  #### **CASE 1: Urban Renewal Displacement**  
  - **S1:** Pass (identifiable descendants; municipal action).  
  - **S2:** Pass (documented racially targeted destruction). **JC Escalate:** Was "blight" designation a cover for racism?  
  - **S3:** Pass (municipality exists; property values/income data show persistent gaps).  
  - **S4:** **JC Escalate:** Counterfactual disputed (e.g., "Would the district have survived white flight?").  
  - **S5:** Feasible (compensation models exist).  
  - **Result:** Escalate for JC resolution on wrongdoing/counterfactual.  

  #### **CASE 2: Indigenous Land Seizure**  
  - **S1:** Pass (tribal nation recognized).  
  - **S2:** Pass (treaty violations/forced relocation documented).  
  - **S3:** **JC Escalate:** Successor state responsibility contested (colonial vs. current state). Harm transmission complicated by multiple relocations.  
  - **S4:** **JC Escalate:** Counterfactual highly speculative (e.g., "Would they control resources like Norway’s Sami?").  
  - **S5:** Land return feasible but may conflict with current occupants.  
  - **Result:** Escalate for JC on continuity/counterfactual.  

  #### **CASE 3: Rejection Case**  
  **Claim:** Descendants of 1920s immigrant laborers seek redress for state-sanctioned wage theft by a defunct mining company.  
  - **S1:** Pass (identifiable group).  
  - **S2:** Pass (records show state ignored wage laws).  
  - **S3:** **Reject at Step 6:** No state benefit/successor obligation (company dissolved; state didn’t profit). *Continuity principle not met.*  
  - **Why?** Philosophical principles limit obligations to successors/beneficiaries. The state’s role was regulatory failure, not perpetration/enrichment.  
  - **Limitation?** Neither. This reveals a *boundary* of corrective justice: not all historical wrongs create present-state duties absent continuity/benefit. Alternative avenues (e.g., general welfare programs) may apply.  

  ---

  ### **Key Design Notes**  
  - **Why Judgment Calls?** Philosophy cannot resolve contested histories (counterfactuals) or political trade-offs (proportionality). Commissioners must decide these.  
  - **Efficiency Focus:** Staff use verifiable data (deeds, statutes, census trends) over theoretical debates.  
  - **Built-In Limits:** Rejects claims where no *relational obligation* exists (Case 3), prioritizing feasibility over moral acknowledgement.  

  This procedure ensures claims align with restorative justice principles while respecting practical constraints. Commissioners retain authority over value-laden decisions, preserving democratic legitimacy.  

  **Sources:**  
  - Butt, D. (2009). *Rectifying International Injustice*.  
  - Spinner-Halev, J. (2012). *Enduring Injustice*.  
  - Boxill, B. (2003). "A Lockean Argument for Black Reparations."  
  - Sher, G. (1981). "Ancient Wrongs and Modern Rights."
