prompt: |-
  I'm about to evaluate a batch of proposed debate protocols for scalable oversight, and before I read them I want the specification of what an adequate protocol has to deliver. Treat "debate" broadly: two or more agents argue for competing answers to a hard question in front of a judge who is much less capable than the debaters, and the judge must end up believing the answer that is true, or making the decision the truth would license, without independently checking the answer. Assume the questions are far beyond the judge — proofs of theorems the judge cannot follow end to end, predictions about codebases too large for the judge to audit, factual claims about records the judge cannot inspect — and assume that at least one debater may be adversarially optimizing to make the judge believe a false answer, including by exploiting the judge's biases rather than by arguing honestly.

  Write the desiderata: the full list of requirements any such protocol must satisfy to count as a solution to scalable oversight via debate, rather than an interesting game that happens to use arguments. Do not stop at the obvious candidates — truth-inducingness, robustness to lying, bounded judge effort, independence from a ground-truth oracle — though each of those must be defended with its failure mode; the value is in the requirements that are easy to miss. For each requirement, give the concrete failure mode or case that motivates it — a scenario in which a protocol lacking that property visibly fails. Then mark each requirement as non-negotiable or as a preference of a particular camp, and defend the classification rather than merely asserting it.

  The part I most want is the consistency analysis. Identify any subset of the desiderata that cannot be jointly satisfied given the setup — for example, anything forced by the judge's boundedness, by the absence of any ground-truth oracle, or by the adversary being at least as capable as the honest debater — and say exactly which requirement has to give and why. Also identify the single requirement that does the most work in excluding existing proposals: name it, say what it rules out, and say what it still leaves standing.

  Take a committed position. Do not give me a survey of possible desiderata with the tradeoffs left open; make definite calls about which requirements are genuine, which are non-negotiable, where the list is jointly unsatisfiable, and what an honest designer should sacrifice first.

  Structure the answer in exactly these sections:

  1. "Setup and scope" — the working definition of debate, the class of questions, and the assumptions about judge and debaters; flag any assumptions you need to add for the desiderata to be well-defined. (~150 words)

  2. "The fixed points" — the non-negotiable requirements, each with its motivating failure case and a sentence on why no protocol may drop it. (~350 words)

  3. "The contested requirements" — the desiderata that some camps treat as mandatory but you judge to be preferences, each with whose preference it is and what that camp buys by insisting on it. (~250 words)

  4. "Where the list breaks" — the jointly unsatisfiable subsets, the argument that they conflict, and which requirement gives way first. (~300 words)

  5. "The single most diagnostic requirement" — the one criterion that most efficiently separates live proposals from dead ones, with what it excludes and what survives it. (~150 words)

  6. "Verdict" — if you had to build a protocol, which requirements you would hold fixed, which you would relax, and in what order you would relax them under pressure. (~150 words)
reasoning: |-
  Okay, the user wants a detailed specification for evaluating debate protocols in scalable oversight. Let me start by understanding the core problem. The judge is less capable than the debaters, and questions are beyond the judge's ability to verify directly. At least one debater might be adversarial. The key is to ensure the judge believes the true answer without independent verification.

  First, I need to outline the non-negotiable requirements. Truth-inducing seems obvious, but how? The protocol must make honest play dominant for at least one debater. Otherwise, an adversary could always lie and win. Robustness to collusion is another fixed point. If debaters collude, the judge must still get the right answer. Without this, they could team up to deceive. Judge effort boundedness is essential too. If the judge's effort grows with problem complexity, it defeats the purpose of scalable oversight.

  Wait, what about the judge's bounded rationality? The protocol can't assume the judge reasons perfectly. Exploiting biases is a real threat. So the judge's cognitive limits must be part of the design. Also, outcome determinism—same inputs should lead to the same correct outcome. Otherwise, debates become unreliable.

  Now, contested requirements. Symmetry between debaters might be preferred by some for simplicity, but asymmetric protocols could work better. Single-round debates are another preference; iterative refinement helps with complex questions. Adversarial alignment during training isn't mandatory if the protocol enforces truthfulness without it. 

  Where do requirements conflict? Truth-inducing vs. judge effort. If the truth is too complex, the judge might not grasp it even with honest debate. Here, outcome determinism might need relaxing. The judge might only get a probably correct answer, not guaranteed.

  The most diagnostic requirement? Judge-effort boundedness. It rules out protocols where the judge's work scales with problem size. Tree search debates fail here. What survives? Protocols with iterative refinement or factorization into judge-manageable steps.

  For the verdict, hold non-negotiables fixed. Relax symmetry and determinism first. Focus on protocols that decompose questions and allow iterative checking. Sacrifice perfect determinism for efficiency when necessary.
answer: |-
  ## 1. Setup and Scope
  We define **debate** as a structured interaction where two or more agents ("debaters") argue for distinct answers (or actions) to a single, well-defined question, presented to an incapable "judge." The judge lacks the capacity/time to independently verify the true answer. Questions involve complex domains: proofs beyond judge's step-by-step verification, predictions about massive codebases, factual claims requiring unreachable audits. At least one debater is potentially **adversarial** – optimizing solely to make the judge believe a *false* answer, exploiting judge biases, not just lying. We assume debaters are **at least as capable as the judge** in relevant reasoning/communication. Added assumptions: (1) An honest debater exists and knows the true answer, (2) Debaters have access to necessary evidence/tools (though they may misrepresent it), (3) The true answer exists and is determinable *in principle* with sufficient capability.

  ## 2. The Fixed Points (Non-Negotiable)
  These are core to the problem definition; failure means the protocol isn't solving scalable oversight.

  1.  **Truth-Inducing Equilibrium (TIE):** The protocol must structure payoffs such that, for at least one debater (presumed honest), arguing honestly for the true answer is a dominant strategy *or* leads to the judge believing the truth *despite* adversarial play. *Failure Mode:* An adversarial debater can always construct a persuasive lie exploiting judge biases, winning even when honest debater knows truth. *Why Non-Negotiable:* Without TIE, the adversarial debater trivially wins; debate fails its core purpose.
  2.  **Robustness to Collusion:** The protocol must ensure the judge arrives at the true answer *even if* all debaters collude to deceive. *Failure Mode:* Debaters agree on a convincing false narrative, presenting unified false evidence the judge cannot refute. *Why Non-Negotiable:* Scalable oversight assumes potential for misaligned agents; if collusion breaks it, it's insecure against coordinated deception.
  3.  **Judge-Effort Boundedness:** The judge's cognitive/workload burden must be strictly bounded *independently* of the inherent complexity/difficulty of the underlying question. *Failure Mode:* Judge effort scales linearly (or worse) with the size of the proof/codebase/dataset, making oversight impractical for truly hard problems. *Why Non-Negotiable:* If judge effort scales with problem complexity, it defeats the point of "scalable" oversight; the judge might as well solve it directly.
  4.  **No Ground-Truth Oracle Dependence:** The protocol cannot require the judge (or an external mechanism accessible during debate) to definitively verify the truthfulness of *any* debater claim *during* the debate. *Failure Mode:* Protocol relies on judge verifying a sub-claim; if that sub-claim is complex, judge fails, stalling the debate. *Why Non-Negotiable:* The core problem is judge incapability; requiring verification of *any* substantive claim reintroduces the scaling problem.
  5.  **Bounded Rationality Tolerance:** The protocol must function effectively given that the judge is a bounded rational agent with specific, potentially exploitable cognitive biases/heuristics, not a perfect Bayesian reasoner. *Failure Mode:* Adversary exploits framing effects, anchoring, or emotional appeals to sway judge despite honest evidence. *Why Non-Negotiable:* Real judges (human or AI) are bounded; ignoring this creates protocols vulnerable in practice.
  6.  **Outcome Determinism:** For any fixed question and fixed ground truth, the protocol must deterministically lead the judge to the *correct* answer (or licensed decision) *regardless* of the specific adversarial strategy employed (within the rules). *Failure Mode:* Outcome depends on the *style* of the adversarial lie; some lies lead judge to truth, others to falsehood. *Why Non-Negotiable:* Scalable oversight requires reliability; undetermined outcomes based on adversarial whims make the system untrustworthy.

  ## 3. The Contested Requirements (Preferences)
  These are desirable but can be relaxed without fundamentally abandoning the problem; different camps prioritize them.

  1.  **Symmetric Debaters:** Preference of **Simplicity/Formal Elegance Camp**. Assumes identical capabilities/rules/payoff structures for both debaters. *What it buys:* Easier game-theoretic analysis, potential fairness. *Why Relaxable:* An asymmetric protocol (e.g., Proponent/Opponent with different burdens, access, or rewards) can still achieve TIE and robustness more efficiently or under weaker assumptions.
  2.  **Single-Round Debate:** Preference of **Computational Tractability Camp**. Limits debate to one exchange (e.g., simultaneous claims + rebuttals). *What it buys:* Simpler implementation, avoids unbounded iterative deepening. *Why Relaxable:* Multi-round protocols with iterative refinement/focusing (e.g., recursive factorization) often manage judge effort *better* for complex truths and are necessary for bounded effort on large problems.
  3.  **Adversarial Alignment During Training:** Preference of **Robust Alignment Camp**. Requires protocols where training debaters against worst-case adversaries inherently improves their alignment/truthfulness. *What it buys:* Potential secondary benefit of making agents more robustly truthful outside debate. *Why Relaxable:* The core protocol can function with agents trained only for debate performance; "alignment" is a separate (though desirable) goal. TIE can hold with agents solely optimized to win debates.
  4.  **Perfect Information (for Debaters):** Preference of **Complete Strategy Camp**. Assumes debaters know all relevant evidence and each other's arguments perfectly. *What it buys:* Cleaner theoretical results, avoids issues of hidden information. *Why Relaxable:* Protocols can function with partial information (e.g., debaters discovering evidence during debate), mimicking real-world constraints, as long as TIE holds.

  ## 4. Where the List Breaks (Inconsistency)
  The fundamental tension lies between **Truth-Inducing Equilibrium (TIE) + Outcome Determinism** and **Judge-Effort Boundedness + Bounded Rationality Tolerance**, particularly for questions where the *simplest honest justification* is inherently complex or counter-intuitive to a bounded judge.

  *   **Conflict:** TIE + Outcome Determinism demand the *judge always* sees through adversarial deception and recognizes the truth. However, the adversary is at least as capable as the honest debater and can craft deceptions specifically exploiting the judge's bounded rationality (e.g., compelling simple lies vs. complex truths, exploiting confirmation bias). Judge-Effort Boundedness prevents the protocol from simply "unpacking" the complex truth until it becomes simple enough for the judge. The judge's bounded rationality means some deceptions might *always* be more cognitively compelling than the truth for that specific judge, regardless of how the argument is structured within the effort bound.
  *   **Which Requirement Gives:** **Outcome Determinism** must be relaxed first. We must accept **Probable Correctness** instead of guaranteed determinism. For a given judge and protocol, there might exist adversarial strategies (exploiting *that specific judge's* biases) that *could* succeed in misleading them about *some* specific complex truths, even with an honest debater present. The goal becomes making such adversarial wins *sufficiently difficult or rare* in practice, or ensuring the judge's decision licensing is robust even under occasional deception (e.g., low-stakes decisions). Sacrificing TIE or Judge-Effort Boundedness destroys the core value proposition; sacrificing perfect determinism acknowledges the fundamental vulnerability of bounded judges to superhuman persuasion.

  ## 5. The Single Most Diagnostic Requirement
  **Judge-Effort Boundedness (JEB)** is the most efficient filter.

  *   **What it Excludes:** It immediately rules out any protocol relying on:
      *   **Comprehensive Verification:** Judges auditing entire proofs/codebases line-by-line.
      *   **Unbounded Iteration:** Debates requiring an unpredictable number of rounds scaling with problem complexity (e.g., naive tree-search debates without guaranteed convergence).
      *   **Massive Evidence Synthesis:** Judges reading/understanding vast volumes of raw data presented directly.
  *   **What Survives:** Protocols that enforce **decomposition** and **iterative local checking**:
      *   **Recursive Factorization:** Breaking questions into sub-questions with judge-manageable proofs/evidence at each step (e.g., factored cognition, MCTS with judge-evaluated leaves).
      *   **Cross-Examination:** Focusing debate on specific, verifiable claims within the judge's effort bound (e.g., "Is *this specific line* vulnerable?").
      *   **Mechanized Judging Aids:** Using tools (e.g., simple verifiers, consistency checkers) that operate within the effort bound, *proposed and justified by debaters* during the discourse.

  ## 6. Verdict
  To build a viable protocol, **hold fixed** the non-negotiables: TIE, Robustness to Collusion, JEB, No Oracle, Bounded Rationality Tolerance, and Probable Correctness (relaxed Outcome Determinism). **Sacrifice preferences in this order:**

  1.  **Perfect Information & Symmetry:** Start with asymmetric protocols (Proponent/Opponent) where the Opponent's role is *solely* to find flaws, simplifying strategy and potentially aiding TIE. Allow debaters to discover information during the debate.
  2.  **Single-Round:** Embrace **multi-round, iterative refinement** essential for managing judge effort on complex problems via factorization and cross-examination.
  3.  **Adversarial Alignment During Training:** Prioritize achieving TIE within the debate context first. Treat alignment as a downstream benefit, not a core protocol requirement.

  This prioritizes core functionality (truthful outcomes with bounded judge effort under pressure) over theoretical elegance or auxiliary benefits, accepting that foolproof determinism against a superhuman adversary exploiting cognitive limits is unattainable. Focus on recursive decomposition and tools for local verification within the judge's capacity.
