answer: |-
  Your struggle captures a core, recognized challenge in the philosophy of well-being: **the Problem of Heterogeneous Pleasures** (also sometimes called the **Diversity of Pleasures Problem** or the **Unity of Pleasure Problem**).

  This is distinct from other objections to hedonism and strikes at the heart of its core claim. Here's the carving you requested:

  1.  **The Established Name(s):**
      *   **Heterogeneity Problem (for Pleasure/Hedonism):** This is the most common and precise label. It directly addresses your concern: the apparent *lack of a single, unifying phenomenal quality* shared by all experiences we call "pleasure."
      *   **Unity of Pleasure Problem:** Focuses on the difficulty of finding that single common thread.
      *   **Diversity of Pleasures Problem:** Emphasizes the wide range of phenomena labeled "pleasure."

  2.  **Is it One Problem or Several?**
      It's **one core problem** (defining pleasure coherently) that manifests in **several distinct dimensions**, highlighted by your examples:
      *   **Phenomenology:** What is the common *feel*? (Headache relief = distinct somatic sensation; Proof satisfaction = diffuse cognitive/emotional state; Schadenfreude = complex mix of triumph/shame; Meditative calm = absence of striving).
      *   **Location/Bodily Basis:** Is pleasure necessarily tied to specific bodily sensations? (Warm bath = yes; Proof satisfaction/revenge fantasy = no).
      *   **Valence & Moral Character:** Can something feel "pleasant" but be morally repugnant or something we wish we *didn't* feel? (Schadenfreude). Hedonism typically treats pleasure as intrinsically good *simpliciter*, but this clashes with intuition.
      *   **Positive Presence vs. Absence of Negative:** Is pleasure a positive sensation *added* (warm bath) or the *relief* from a negative (headache lift, meditative calm)? Some argue the latter is merely the *absence of pain*, not positive pleasure.
      *   **Motivation & Desire:** Is the *desire to continue* the experience (your functional definition attempt) part of the *definition* of pleasure, or merely a typical *consequence*? If it's defining, hedonism risks collapsing into desire-satisfaction.

  3.  **How it Differs from Nearby Worries:**
      *   **The Paradox of Hedonism:** This is a problem of *practical rationality*, not definition. It argues that directly pursuing pleasure is self-defeating; happiness arises as a byproduct of pursuing other things. Your problem is about *what pleasure even is*, regardless of how it's pursued.
      *   **The Experience Machine (Nozick):** This challenges whether pleasure is *sufficient* for well-being (is a life of mere simulated pleasure *truly* good?). It assumes we *can* define/identify pleasure (the machine delivers "it"). The Heterogeneity Problem challenges that very assumption – *what* is the machine supposed to be simulating? How can it simulate such diverse phenomena coherently?
      *   **Value Pluralism:** This argues well-being consists of *multiple* irreducibly distinct goods (achievement, knowledge, relationships, pleasure). The Heterogeneity Problem is a challenge *internal* to hedonism: even if well-being *were* solely about pleasure, we can't coherently define what pleasure *is*.

  4.  **Is it Fatal?**
      It's a **serious, potentially fatal challenge to classical sensory/feeling-toned hedonism**, but **not necessarily to all forms of hedonism**. Its force depends on the response:
      *   **Fatal to Simple Sensory Hedonism:** If one insists pleasure *must* be a single, identifiable, positive sensory feeling (like the warmth of a bath), then the diversity you describe (especially cognitive pleasures, relief, calm) cannot be incorporated without stretching the definition beyond recognition or excluding them.
      *   **Challenging but Possibly Survivable for Broader Hedonism:** Hedonists have proposed responses:
          *   **Unified Theories:** Argue for a subtle common core (e.g., "felt goodness" (Labukt), "adverbial modification of consciousness" (Crisp drawing on Sidgwick)). Critics argue these are too thin/abstract to be meaningful or still fail to capture all cases (e.g., schadenfreude's "bad" feel).
          *   **Motivational/Affectivist Theories:** Define pleasure *as* the motivational state of *wanting the experience to continue* (Fred Feldman, "truth-adjusted hedonism") or as a positive *affective response* (Tim Schroeder). This directly addresses your functional definition concern. However, as you note, this risks collapsing into desire-satisfaction theory. Is "wanting to continue" *what pleasure is*, or is it a *response* to pleasure? If it's defining, then unpleasant experiences we can't stop (e.g., addiction) become paradoxical.
          *   **Pleasure as a Natural Kind:** Argue science will find a unified neurobiological basis (e.g., dopamine release). Critics point out neuroscience often reveals complexity (multiple systems for reward, wanting, liking) rather than unity, and the "feels" remain diverse. Also, this risks changing the subject from the *phenomenal* experience central to traditional hedonism.
          *   **Embracing Diversity:** Argue "pleasure" is a family resemblance concept (Wittgenstein) – experiences share overlapping features without a single universal core. This avoids the unity problem but makes it hard to quantify and compare pleasures for well-being calculations, a core task for hedonism. How much proof-satisfaction equals how much bath-warmth?
      *   **Fatal to Quantification?** Even if not fatal to the *existence* of pleasure, the heterogeneity makes the hedonist calculus (summing pleasures/minus pains) extremely difficult, if not impossible, as it requires a common metric for radically different experiences.

  5.  **Boundaries & Labeling (If no established name):**
      *   **Core Boundary:** The problem arises *within the attempt to define the core concept of "pleasure" for a theory of well-being*, specifically when faced with the diverse range of experiences intuitively called pleasant that lack an obvious single phenomenal property.
      *   **Distinguishing Marks:** It focuses on *phenomenal* diversity and the challenge of *unification*, differentiating it from objections about sufficiency (Experience Machine), motivation (Paradox), or the existence of other goods (Pluralism).
      *   **Precise Label:** The **Hedonistic Definitional Problem of Phenomenal Heterogeneity**. This captures:
          *   The domain (Hedonism)
          *   The task (Definition)
          *   The nature of the challenge (Phenomenal - about the feel)
          *   The core issue (Heterogeneity - lack of unity)

  **Conclusion:**

  You've pinpointed the Heterogeneity Problem. It's arguably the *most fundamental* internal challenge to hedonism because it strikes at the definition of its core constituent. While not *automatically* fatal, it forces the hedonist into difficult terrain: either propose a plausible unifying account of pleasure (phenomenal, motivational, or neurobiological) that captures the full range of your examples, or accept a definition broad enough (like motivational) that risks collapsing into a different theory (desire-satisfaction). Your observation about the "ugly" pleasure of schadenfreude adds an extra layer concerning the normative status of pleasure itself. Addressing this heterogeneity convincingly is crucial for any robust defense of hedonism. Key figures to engage with include Sidgwick (on the difficulty), Moore (on the attack), and contemporary responses from Feldman (motivational), Crisp (adverbial), or Bramble (phenomenal intentionality).
