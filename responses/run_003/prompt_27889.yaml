prompt: |-
  I'm taking a bioethics seminar this semester on the ethics of human enhancement, and we've spent the last few weeks trying to get a grip on the therapy/enhancement distinction. My professor keeps insisting that the distinction is philosophically suspect—that it either collapses under pressure or ends up doing normative work it can't justify—but I find myself with strong intuitions about particular cases that seem to track something like it. The trouble is, when I try to extract a principle from those intuitions, everything falls apart. I discussed this with a friend in the course, and she suggested I just write down my verdicts on a range of cases and see whether a coherent view can be reconstructed from them—or whether I need to abandon some of my gut reactions. I'd appreciate your help with that project.

  Here's where I've landed on particular cases. (1) Administering insulin to a diabetic: clearly therapy, no question. (2) LASIK surgery for someone with myopia: I want to say this is therapy too, even though it's reshaping the cornea to a state it was never in naturally—something about it restoring normal visual function feels different from enhancement. (3) Prescribing Adderall to someone with a diagnosed case of ADHD: therapy. (4) A college student without ADHD taking Adderall to pull an all-nighter before exams: this feels like enhancement, and I'm uneasy about it. (5) Human growth hormone for a child with a diagnosed deficiency: therapy. (6) Human growth hormone for a short-but-healthy child whose parents just want him to be taller: enhancement, and I'm against it. (7) Breast reconstruction after a mastectomy: therapy. (8) Breast augmentation for purely cosmetic reasons: enhancement. (9) A cochlear implant for a child born deaf: I genuinely don't know how to classify this, and my intuition flips depending on how the case is framed—as restoring a sensory capacity the child never had, or as imposing a normative standard of hearing. (10) Drinking a cup of coffee to feel more alert in the morning: this is clearly some kind of cognitive enhancement, but I can't bring myself to think there's anything wrong with it—which makes me wonder whether the therapy/enhancement line is really tracking permissibility at all, or whether I'm just inconsistent. (11) A beta-blocker taken by a concert pianist without an anxiety disorder, solely to prevent hand tremors during a performance: this feels like enhancement, but I'm less bothered by it than I am by the Adderall case, and I can't articulate why. (12) A vaccine that not only prevents a disease but boosts the immune system beyond the typical range: this one throws me, because prevention usually feels like medicine, but "beyond typical range" sounds like enhancement.

  Is there a principle that makes sense of most or all of these verdicts? If some of them have to be revised or abandoned to get a coherent view, which ones would you overturn and why? And what does the resulting account say about a case I haven't listed: germline genetic engineering to increase a future child's IQ from a predicted 100 to a predicted 115?
reasoning: |-
  Hmm, the user is grappling with the therapy/enhancement distinction in bioethics and needs help making sense of their intuitive judgments about various cases. They've listed 12 scenarios where they have strong gut reactions about what constitutes therapy versus enhancement, but they're struggling to find a consistent principle behind these judgments. Their professor thinks the distinction is philosophically suspect, and the user's friend suggested mapping out specific cases to see if a coherent view emerges.

  Looking at their cases, I notice several patterns and tensions. Their "therapy" category (insulin, LASIK, ADHD meds, growth hormone for deficiency) all involve restoring or approximating typical species functioning. But LASIK is interesting because it improves vision beyond what the person naturally had, yet they still classify it as therapy - suggesting "normal function" might be more about statistical norms than individual baselines.

  Their unease with "enhancements" like non-ADHD Adderall use or cosmetic growth hormone seems tied to two factors: 1) moving beyond typical human capacities, and 2) context of use (performance pressure vs. medical need). But then coffee - a mild cognitive enhancer - gets a pass, creating tension.

  The tricky cases reveal deeper issues: cochlear implants sit at the intersection of disability rights and normalization; beta-blockers for performers blur therapy/enhancement lines; "super-vaccines" straddle prevention and augmentation. Their conflicted feelings about beta-blockers versus Adderall might relate to perceived authenticity or social context.

  For a unifying framework, I'm considering a three-axis model: functional restoration, species-typicality, and social context. This explains why reconstructive surgery feels therapeutic while cosmetic augmentation doesn't, and why coffee is acceptable (mild, widespread) while prescription drug misuse isn't (significant advantage, medicalization).

  The genetic IQ enhancement case would likely fall under problematic enhancement in their framework - it's non-therapeutic, alters core capacities, and raises fairness concerns. But to be consistent, they might need to relax their stance on growth hormone for short-but-healthy children, as both involve improving non-pathological traits.

  Key tensions needing resolution: why LASIK's artificial improvement is therapeutic while growth hormone isn't; why coffee gets special treatment among enhancers; whether "normal function" should be statistical or functional. I should suggest they might need to either abandon some intuitions (like opposing all non-medical enhancements) or embrace a more contextual approach where enhancement isn't inherently wrong but requires different ethical scrutiny.
answer: |-
  Your intuitions reveal a rich tension between functional restoration, social norms, and context-dependent values. While no single principle perfectly captures all your judgments, a **modified species-typical functional norm account + contextual factors** comes closest. Here’s a reconstruction that preserves most of your intuitions:

  ### Core Principle:
  **An intervention is therapeutic if it aims to restore or maintain *species-typical functional capacity* relative to age and environment. Enhancement aims to push function beyond that typical range.**  
  *But with crucial caveats:*  
  1. **"Typical" is statistical and functional** (not "natural"): It’s about what enables standard human flourishing in a given society.  
  2. **Context matters:** Social roles, risks, consent, and distributive justice can override the therapy/enhancement distinction for permissibility.  

  ### Your Cases Revisited:
  | **Case** | **Your Verdict** | **Reconstructed Classification** | **Why It Fits (or Conflicts)** |
  |----------|------------------|----------------------------------|--------------------------------|
  | 1. Insulin for diabetic | Therapy | Therapy | Restores glucose metabolism to species-typical function. |
  | 2. LASIK for myopia | Therapy | Therapy | Restores visual acuity to typical human range (20/20). |
  | 3. Adderall for ADHD | Therapy | Therapy | Compensates for neurocognitive dysfunction, enabling typical focus. |
  | 4. Adderall for exams | Enhancement | Enhancement | Boosts focus beyond typical baseline in non-impaired individuals. |
  | 5. HGH for deficiency | Therapy | Therapy | Corrects pathological short stature; aims for typical height range. |
  | 6. HGH for healthy short child | Enhancement | Enhancement | Seeks height *beyond* individual genetic potential/statistical norm. |
  | 7. Post-mastectomy recon. | Therapy | Therapy | Restores bodily integrity/symmetry typical for human form. |
  | 8. Cosmetic augmentation | Enhancement | Enhancement | Exceeds typical form for aesthetic/social advantage. |
  | 9. Cochlear implant | Ambivalent | **Therapy** (with caveats) | Enables a *typical human sensory capacity* (hearing), but consent/identity concerns may affect permissibility. |
  | 10. Morning coffee | Permissible enhancement | **Contextually acceptable enhancement** | Mild, low-risk, and socially normalized enhancement of alertness. |
  | 11. Beta-blockers for pianist | Enhancement (less uneasy) | **Contextually acceptable enhancement** | Low-risk performance optimization in a high-stakes profession. Unease < Adderall due to lower cognitive/social impact. |
  | 12. "Super-vaccine" | Ambivalent | **Preventive therapy + enhancement** | Prevention is therapeutic; immune "boost" is enhancement. Requires separate ethical evaluation. |

  ### Conflicts and Revisions:
  1. **Cochlear Implant (9):** Classifying this as **therapy** resolves your framing dilemma. Deafness is a departure from species-typical sensory capacity, making restoration therapeutic—but *permissibility* hinges on consent, cultural identity, and alternatives (e.g., signing environments). Your unease likely stems from these latter factors, not the therapy/enhancement line.  
  2. **Coffee (10) & Beta-Blockers (11):** These expose the **flaw in equating "enhancement" with "impermissible."** Contextual factors (risk, accessibility, social disruption) determine acceptability, not the enhancement label alone. Coffee is low-stakes; beta-blockers for performers are niche and non-coercive.  
  3. **Growth Hormone (6):** Your opposition likely blends the enhancement label *and* concerns about medicalizing normality, pediatric consent, and resource allocation. The classification holds, but permissibility arguments must engage these factors.  

  ### Overturned Intuition:  
  - **"Enhancement = inherently suspect":** Cases 10 and 11 show enhancements can be permissible. Your gut opposes non-medical Adderall (4) due to risks, coercion in academic settings, and unfairness—not because enhancement itself is wrong.  

  ### The Genetic IQ Case:
  - **Germline IQ boost (100→115):** Enhancement (exceeds typical function without pathology).  
  - **Permissibility?** Under your reconstructed view:  
    - **Against:** Violates principles of open future, risks eugenics, exacerbates inequality.  
    - **Neutral/Contextual:** If universally accessible and safe, might be seen as akin to educational enrichment.  
    - **Your Likely View:** Opposition (consistent with HGH case). Enhancement becomes problematic when it:  
      - Alters core traits without consent  
      - Medicalizes normal variation  
      - Creates unfair advantages  

  ### Why Your Professor is Partly Right:
  The therapy/enhancement distinction **cannot bear the full weight of permissibility decisions** (as seen in Cases 9–12). It’s a useful heuristic for identifying medical need, but normative work requires:  
  - **Risk-benefit analysis** (e.g., coffee vs. Adderall)  
  - **Autonomy/consent** (critical in pediatric cases)  
  - **Justice** (e.g., access to enhancements creating inequality)  
  - **Social meaning** (e.g., medicalization of height)  

  ### Coherent Framework Summary:
  1. **Therapy:** Restores/maintains *species-typical function*.  
  2. **Enhancement:** Exceeds typical function.  
  3. **Permissibility Depends On:**  
     - Magnitude of benefit/risk  
     - Social impact (fairness, coercion)  
     - Consent and autonomy  
     - Preservation of identity/open future  

  This preserves 10/12 of your initial classifications while explaining ambivalence on cochlear implants and "super-vaccines," and justifying why some enhancements (coffee) are benign. The key insight: **Use the distinction descriptively, but not normatively.** Your intuitions track real ethical concerns, but they’re not reducible to a single binary.
