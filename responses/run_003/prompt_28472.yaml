  Then there's the definitional problem. If one side defines perception as early vision (modules) and the other as conscious experience, they're talking past each other. The user seems aware of this, but it's key. Without agreeing on terms, they can't resolve anything.

  Methodologically, each side has different standards. Pro-penetration might accept indirect measures, while anti-penetration wants direct, process-pure evidence. But isolating perception from cognition is super hard. Any measure could be contaminated by later processes. That's probably why the debate feels endless.

