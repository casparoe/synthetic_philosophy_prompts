prompt: |-
  I am a teaching assistant in a first-year introduction to ethics course, and next week I have one fifty-minute section in which to teach the heterogeneity problem for hedonism about well-being. Do not give me the explanation itself; give me a plan for the explanation. I need the order in which the pieces must be introduced and what depends on what, so that the problem emerges as something hedonism must answer given its own single-currency commitment rather than as a taxonomical aside. Choose a single contrasting pair of pleasures to carry the entire session, say what that pair must have and what it must not have, and explain why the obvious alternatives would fail; I do not want a long list of examples the students will forget. Map the misconceptions the students will predictably arrive with or form partway through—at minimum the thought that pleasure is just a feeling and the thought that pleasure is just whatever you want—and tell me exactly where in the sequence each one should be headed off, before it hardens. Then give me one closing question whose answer would tell me whether they have understood the problem as a demand for a common element across all pleasures, rather than merely being able to repeat the phrase. Finally, tell me what I should leave out at this level and how to flag that it is being left out without making the session feel incomplete.
reasoning: |-
  Okay, the user is a teaching assistant preparing a 50-minute ethics section on the heterogeneity problem for hedonism. They need a clear lesson plan that builds the problem step-by-step using a single contrasting pair of pleasures. Let me unpack their requirements carefully.

  First, they want the problem presented as an internal tension within hedonism itself - how can it reconcile diverse pleasures with its "single currency" claim? Not just a taxonomy exercise. The structure must make this inevitable conflict emerge organically. 

  For the pleasure pair, I'm considering intellectual vs. sensory examples. Reading a challenging book versus eating chocolate seems perfect - both are uncontroversially pleasures but feel fundamentally different. Crucially, they share no overlapping sensations and both are intrinsically valued by most people. This avoids common pitfalls: the examples shouldn't be morally loaded (like sadistic pleasures) or involve complex desire structures.

  Key student misconceptions to address: (1) reducing pleasure to mere physical sensations (need to show intellectual pleasure isn't primarily sensory), and (2) defining pleasure as "whatever you want" (would make hedonism collapse into desire theory). These must be preempted early when introducing examples.

  The logical flow should be: 
  1) Establish hedonism's core claim (well-being = pleasure balance) 
  2) Introduce the single-currency requirement 
  3) Present the two pleasures as prima facie different 
  4) Challenge students to find the common element 
  5) Systematically debunk sensation/reductionist attempts 
  6) Conclude that hedonism owes an explanation it can't easily provide

  For assessment, a closing question like "What would the hedonist need to prove about reading and chocolate to maintain their theory?" tests if they grasp the demand for a common element rather than just memorizing "heterogeneity."

  What to omit: Historical responses (Mill's quality distinction), quantitative solutions, and desire-theory alternatives. Flag these as "important but beyond today's scope" to avoid feeling incomplete. Time is tight - this keeps focus on exposing the core problem.
answer: |-
  Here's a targeted 50-minute lesson plan focused *solely* on making the heterogeneity problem emerge as a necessary internal challenge for hedonism, using a single pair of pleasures:

  **Core Contrasting Pair:** Deeply understanding a complex philosophical argument (**Intellectual**) vs. Eating a piece of high-quality dark chocolate (**Sensory**).  
  *Why this pair?*  
  - **Must Have:** Both are uncontroversially pleasurable experiences for most people; both are intrinsically valued (not merely instrumental); they feel *qualitatively different* in a way hard to reduce to mere intensity/duration.  
  - **Must Not Have:** No strong moral overtones (avoiding distraction); no obvious addictive/biological compulsion muddying "pleasure" (e.g., drugs); not dependent on unique personal history; not obviously reducible to a common sensation (like warmth or tingling).  
  *Why Obvious Alternatives Fail:*  
    - *Physical Pain Relief:* Too easily reduced to sensation-removal.  
    - *Sadistic Pleasure:* Moral issues overshadow structural problem.  
    - *Social Approval:* Too entangled with desire/recognition.  
    - *Simple Sugar Rush:* Too biological, risks reduction to sensation.  

  **Lesson Sequence (45 mins Core + 5 mins Buffer):**  

  1.  **(5 min) Frame Hedonism's Core Claim:**  
      *Define:* Well-being = Experiencing positive conscious states (pleasure) & avoiding negative ones (pain).  
      *Emphasize:* Pleasure is the *single currency* of well-being. All valuable experiences must ultimately be valuable *because* they add units of this currency.  
      *Misconception Preemption:* Explicitly state: "For now, we are *not* defining pleasure as a feeling or as getting what you want. We're taking the hedonist's claim at face value: it's *one thing* that makes life better."  

  2.  **(10 min) Introduce the Contrasting Pair:**  
      - **Describe Sensory Pleasure (Chocolate):** Rich taste, melting texture, immediate sensory gratification. Ask students to recall/identify the *kind* of experience.  
      - **Describe Intellectual Pleasure (Understanding):** The "Aha!" moment grasping a difficult concept, the satisfaction of mental coherence, feeling insight. Ask students to recall/identify.  
      - **Contrast Activity (Key Step):** "Close your eyes. Imagine vividly experiencing each one. How do they feel *different* from the inside? Don't judge which is better, just describe the *qualitative character*." Elicit responses (Focus on: immediacy vs. delayed gratification, bodily vs. mental, passive reception vs. active engagement, sensation location).  
      *Misconception Preemption:* After descriptions, ask: "Is the pleasure in understanding *just* a feeling in your body (like a tingle)? Is it *only* because you wanted it beforehand?" (Guide them to "No").  

  3.  **(15 min) Challenge the Single Currency:**  
      - "Hedonism says both experiences add the *same kind* of thing to your well-being account: 'Pleasure Units'. But they feel so different! What is the *common ingredient*? What is the single 'pleasure stuff' present in *both* the chocolate sensation *and* the intellectual insight?"  
      - **Guide Student Brainstorming:** Write responses. Predictable bad answers:  
          *   *"They both feel good!"* → "Good' is just another word for 'pleasurable'. That's circular. *What* is the good feeling in each case? Is it the same feeling?" (Preempts "pleasure is just a feeling").  
          *   *"You wanted both!"* → "Did you *want* the chocolate before tasting it? Probably. Did you explicitly *want* the specific insight *before* you had it? Or did the pleasure *come with* the understanding?" (Preempts "pleasure is whatever you want"). Highlight: If pleasure = getting what you wanted, that's Desire Theory, not Hedonism!  
          *   *"They both release dopamine!"* → "That's a biological *correlate*, not the conscious experience itself. Hedonism is about conscious experience defining well-being."  
      - **Press the Point:** "If they don't share a common *felt quality* (like a specific sensation), and their value isn't *just* from fulfilling a prior desire, what is the *one identical thing* (the 'currency') that the hedonist claims is being added in both cases? How can such radically different experiences be deposits of the *same* coin?"  

  4.  **(10 min) Formulate the Heterogeneity Problem:**  
      - "This is the **Heterogeneity Problem**: Pleasures seem incredibly diverse in their phenomenological character (how they feel from the inside)."  
      - "Why is this a *problem for hedonism specifically*?" (Elicit/Direct): "Because hedonism insists all pleasure is a *single, uniform kind* of positive state that constitutes well-being. If pleasures are fundamentally different *kinds* of experiences with no common experiential core, how can they genuinely be the *same currency*? Does it even make sense to say they add the *same thing*?"  
      - **Stress the Demand:** "The hedonist *owes us an account* of what this common element is. Saying 'they are both pleasurable' just repeats the problem; it doesn't solve it."  

  5.  **(5 min) Consolidate & Assess:**  
      - **Recap:** Hedonism (Single Currency) → Contrasting Pleasures (Intellectual vs. Sensory) → Lack of Obvious Common Felt Quality → Problem for Single Currency Claim.  
      - **Closing Question (Key Assessment):** "**What specific task does the heterogeneity problem create for the hedonist?**"  
          *   *Target Answer:* They need to identify a *single, common element present in all pleasurable experiences* (like the chocolate *and* the insight) that makes them pleasurable and constitutes well-being, despite their felt differences.  
          *   *Wrong Answers:* "They need more examples." / "They need to show pleasures are different." / "They need to measure them better."  

  **What to Omit & How to Flag It (Without Feeling Incomplete):**  

  1.  **Mill's Qualities:** "Some hedonists, like John Stuart Mill, tried to address this by saying there are 'higher' and 'lower' *qualities* of pleasure. That's a fascinating and important response, but *for today*, we're just focusing on the *problem* this creates for the basic, single-currency claim of simple hedonism. We'll revisit Mill another time."  
  2.  **Quantitative Solutions:** "You might think, 'Can't we just measure intensity and duration?' But that doesn't solve the *qualitative* problem: *what* is it that we're measuring the intensity *of* in such different experiences? Is the 'intensity' of an insight the same *kind* of thing as the 'intensity' of a taste?" (Rhetorical, move on).  
  3.  **Desire Theory as Alternative:** "One way people try to *avoid* this problem is by switching to a theory where well-being is about getting what you *want*, not about a single kind of feeling. But that's a different theory altogether. Our question today is whether *hedonism specifically* can handle the diversity of pleasure."  
  4.  **Exhaustive Examples:** Resist adding more examples. Stick rigidly to the pair. "We're using chocolate and insight as our core examples precisely because they so vividly illustrate the challenge. Adding more types wouldn't deepen the core problem we're examining."  

  **Why this sequence works:**  
  The problem emerges *from* the hedonist's own commitment (single currency) applied to concrete, relatable examples. Misconceptions ("feeling," "wanting") are actively challenged *at the point* where students would naturally deploy them as solutions. The closing question directly tests comprehension of the *demand* the problem places on hedonism, not just recognition of diversity. Omitting historical/counterarguments keeps the focus laser-sharp on exposing the core structural tension within hedonism itself.
