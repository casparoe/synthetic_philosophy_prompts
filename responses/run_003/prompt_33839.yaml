answer: |-
  Your experience is indeed a perfect real-world illustration of Frege's puzzle, and your analysis is remarkably astute. Let's break this down step by step:

  ### 1. **Why This is Frege's Puzzle in Action**
     - **"Tom" and "Professor Ashford" had distinct senses for you**:  
       - *Sense of "Tom"*: Associated with warmth, approachability, Patagonia stories, early music, hiking.  
       - *Sense of "Professor Ashford"*: Associated with intellectual intimidation, coldness, incisive feedback.  
       Though both referred to the same person (same *reference*), their *modes of presentation* (**Sinn** for Frege) were radically different.  
     - **Cognitive Gain Without New Factual Belief**:  
       You're correct that no new *proposition about the world* was added (the identity was always true). The gain was realizing that two distinct conceptual profiles *coincide in one object*. This is precisely Frege's point: **meaning isn't just reference**—it includes how the reference is accessed.

  ### 2. **Frege's Solution: Sense vs. Reference**
  Frege's distinction *does* explain your experience:
     - **Trivial vs. Informative Identity**:  
       "Tom = Tom" is trivial because it involves one sense. "Tom = Professor Ashford" is informative because it connects two independent senses.  
     - **Where the Cognitive Gain Lies**:  
       You've synthesized two previously isolated *conceptual pathways* to the same person. This reshapes your understanding of both "Tom" (now knowing he's a formidable philosopher) and "Professor Ashford" (now knowing he's approachable). Frege would say you’ve grasped a new **truth value** by connecting senses.

  ### 3. **Does This Require Senses as Abstract Objects?**
     - **Frege's View**:  
       For Frege, senses (*Sinn*) are objective, abstract entities—not psychological constructs. They exist independently of minds.  
     - **Your Experience Suggests an Alternative**:  
       Your "senses" were deeply tied to *subjective experience and social context*:  
       - "Tom" = embodied in personal interaction.  
       - "Ashford" = constructed through reputation and discourse.  
       This leans toward a **psychologically grounded** view of sense, closer to later philosophers like Gareth Evans (mental files) or Ruth Millikan (cognitive tools).  
     - **A Middle Path**:  
       You might not need abstract *Platonic* senses. Instead, senses can be understood as:  
       - **Socially embedded practices**: How a community uses names ("Prof. Ashford" vs. "Tom").  
       - **Cognitive roles**: Mental files storing different clusters of information.  
       Merging these files generates new inferential potential (e.g., "This kind person could devastate my paper with a comment").

  ### 4. **Broader Implications: Modes of Presentation & Epistemology**
     - **Knowledge Beyond Propositions**:  
       Your experience shows knowledge isn't just accumulating true beliefs. It involves **integrating perspectives**. Learning the identity transformed your *epistemic access* to the person, enabling new connections (e.g., "His feedback might be kinder than I feared").  
     - **The Social Dimension of Sense**:  
       Senses aren't just personal; they're shaped by communities. "Professor Ashford" was a **socially constructed persona**, while "Tom" was your direct encounter. Identity statements bridge these worlds.  
     - **Against Purely Referential Theories**:  
       This undermines theories like Kripke's causal theory of names (where names rigidly refer without descriptive content). Your shock reveals that names *do* carry rich conceptual baggage.

  ### 5. **Alternative Frameworks (If You Reject Abstract Senses)**
     - **Mental File Theory** (Perry, Recanati):  
       "Tom" and "Ashford" were separate mental files. Discovering identity *merges the files*, allowing information transfer (e.g., "The Patagonia hiker writes brutal comments").  
     - **Pragmatic Contextualism**:  
       The gain wasn't semantic but *pragmatic*—you learned which context ("departmental reception" vs. "seminar room") activates which properties of the person.  
     - **Cognitive Phenomenology**:  
       The "aha!" moment reflects a shift in *how you phenomenally experience* thinking about the person—now both sets of properties are co-activated.

  ### Conclusion: Why Your Intuition is Profoundly Right
  Frege’s sense-reference distinction elegantly explains your cognitive gain, but it doesn’t demand a commitment to abstract entities. Your experience highlights that **identity discoveries reorganize our conceptual landscape**, integrating disparate perspectives into a unified understanding. This has deep implications beyond philosophy of language—it touches epistemology (how we acquire knowledge), social cognition (how we navigate reputations), and even ethics (how we revise judgments about others).

  **A Philosophical Takeaway**: Your encounter with "Tom/Ashford" suggests senses might be better understood as *dynamic, socially mediated cognitive practices* rather than static abstract objects. Frege’s puzzle isn’t just about language; it reveals how we construct meaning through the interplay of personal experience and social narrative. Well spotted!
