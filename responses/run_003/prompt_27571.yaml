prompt: |-
  I keep seeing the problem of logical omniscience treated as a flaw to be engineered around, but I have never seen a clear statement of what a successful engineering-around is supposed to deliver. Before I evaluate any more proposals, write me the specification: what must a formal model of belief do to count as an adequate representation of a logically bounded agent? I want the desiderata themselves, each with the case or phenomenon that forces it, and each marked as non-negotiable or as a preference of one camp. In particular, I want to know which closure principles must go, which easy inferences must still go through, and which distinctions (explicit vs. implicit belief, not having considered a proposition vs. not being able to derive it, inconsistency vs. incoherence) a model cannot collapse. Then flag any subsets of the desiderata you think cannot be jointly satisfied, and say which single requirement does the most to rule out the standard approaches.

  Please structure your answer in these sections, in this order:

  1. The phenomena (about 200 words): the core cases an adequate model must capture.
  2. The desiderata (about 500 words): named items, each with its motivating case and its status as non-negotiable or camp-specific.
  3. Tensions (about 250 words): which subsets of desiderata look jointly unsatisfiable, and why.
  4. The load-bearing requirement (about 150 words): which single desideratum excludes the most familiar approaches, and why.
  5. Scorecard (about 250 words, table or bullets): how possible-worlds models, syntactic models, awareness models, and impossible-worlds models fare against the list.
reasoning: |-
  Okay, the user is asking for a detailed specification on what a formal model of belief for logically bounded agents must achieve. They want desiderata, phenomena that motivate them, tensions between them, and an evaluation of existing approaches. Let me start by recalling the core issues with logical omniscience. Real agents can't deduce all logical consequences of their beliefs, so any model must relax closure while still handling simple inferences.

  First, the phenomena section needs to cover cases like failure of complex reasoning, basic competence, incomplete consideration, and inconsistency without collapse. For example, an agent might believe P and P→Q but not Q if the proof is long. But they should still know simple things like P∧Q implying P. Also, not having considered a proposition vs. being unable to derive it is crucial. Inconsistency shouldn't make them believe everything.

  Next, desiderata. Non-negotiable ones include Non-Closure of Deduction and Basic Competence. The user mentioned distinctions like explicit vs. implicit belief, so that's key. Syntactic models handle this by storing beliefs as sentences. Awareness models use an awareness set to track considered propositions. Impossible worlds allow worlds where logic fails, but that might over-permit irrationality.

  Tensions arise between Non-Closure and Basic Competence. Allowing some inferences but not others is tough. Also, distinguishing explicit/implicit beliefs while avoiding collapsing them is hard. Syntactic models might not handle logical equivalence well. Impossible worlds might allow too many contradictions without penalty.

  The load-bearing requirement is likely Explicit/Implicit Distinction. Possible worlds models collapse this, so they're out. Syntactic models handle it but struggle with logical relations. Awareness models have the same issue with equivalence.

  For the scorecard, possible worlds fail most desiderata. Syntactic models do well on non-closure and distinctions but fail harmony. Awareness models are similar. Impossible worlds handle more but risk incoherence and may not fully solve harmony.

  The user's deeper needs might be understanding which approaches are viable for their research. They might be designing a system needing realistic belief models. They want clarity on trade-offs to choose or develop a model. Highlighting tensions and the scorecard helps them evaluate options without getting stuck in impossible requirements.
answer: |-
  ### 1. The Phenomena  
  A model of logically bounded belief must capture these core empirical realities:  
  - **Failure under complexity**: Agents fail to derive consequences requiring long proofs (e.g., believing axioms of arithmetic but not a complex theorem).  
  - **Basic competence**: Agents reliably grasp trivial inferences (e.g., from *P ∧ Q* to *P*).  
  - **Incomplete consideration**: Agents may "not have thought about" a proposition, distinct from actively rejecting it or lacking computational resources to derive it.  
  - **Local inconsistency**: Agents hold contradictory beliefs (e.g., *P* and *¬P*) without collapsing into believing *everything* (explosion).  
  - **Gradual learning**: Deriving new beliefs changes the agent's epistemic state, distinguishing *implicit* potential beliefs from *explicit* current ones.  
  - **Resource sensitivity**: Reasoning success depends on time/memory, not just logical structure.  

  These phenomena necessitate abandoning idealized closure while preserving minimal rationality and tracking cognitive dynamics.  

  ---

  ### 2. The Desiderata  
  *(✓ = Non-negotiable; ✦ = Camp-specific preference)*  

  | Desideratum                     | Motivating Case                                                                                                | Status       |  
  |---------------------------------|----------------------------------------------------------------------------------------------------------------|--------------|  
  | **1. Non-Closure of Deduction** | Agent believes *P* and *P → Q* but not *Q* (if *Q* requires non-trivial derivation).                           | ✓ Core       |  
  | **2. Basic Competence**         | Agent who believes *P ∧ Q* must believe *P*; failure violates minimal rationality.                              | ✓ Core       |  
  | **3. Explicit/Implicit Distinction** | Distinguish beliefs actively held ("*A* is a prime") from those derivable in principle but not yet computed. | ✓ Core       |  
  | **4. Consideration vs. Capacity** | Agent may not believe *Q* because they haven’t *considered* it (even if trivial), vs. lacking resources to derive it. | ✓ Core       |  
  | **5. Non-Explosive Inconsistency** | Believing *P* and *¬P* shouldn’t entail belief in arbitrary *R* (e.g., "2+2=5").                    | ✓ Core       |  
  | **6. Harmony Principle**        | If an agent explicitly believes *P*, and *P ⇔ Q* is provable *by the agent*, they should believe *Q* (avoids "syntax-dependence"). | ✦ (Rationalist) |  
  | **7. Resource Sensitivity**     | Belief attribution depends on computational limits (e.g., an agent with 1s to reason cannot factor large *n*). | ✦ (Bounded-rationality) |  
  | **8. Dynamic Updating**         | Adding a new belief (e.g., learning *P → Q*) triggers re-computation within limits.                              | ✦ (Procedural) |  

  ---

  ### 3. Tensions  
  - **Non-Closure vs. Harmony**: Allowing failure on complex inferences (Non-Closure) conflicts with requiring equivalence recognition (Harmony). If *P ⇔ Q* is hard, Harmony forces belief in *Q* given *P*, violating Non-Closure.  
  - **Basic Competence vs. Consideration/Capacity**: Distinguishing "unconsidered" from "unable" requires tracking attention, but Basic Competence demands automatic trivial inferences, collapsing the distinction for simple cases.  
  - **Non-Explosion vs. Dynamic Updating**: Tolerating local inconsistency (Non-Explosion) clashes with coherent belief revision (Dynamic Updating). Inconsistencies may persist if the agent doesn’t actively resolve them.  
  - **Implicit/Explicit vs. Resource Sensitivity**: Storing explicit beliefs is cheap, but computing implicit ones is costly. Modeling this accurately risks syntactic approaches (losing logical relations) or impossible worlds (permitting irrationality).  

  These tensions suggest **no model satisfies all desiderata simultaneously**; trade-offs depend on whether priority is rationality (Harmony) or cognitive realism (Resource Sensitivity).  

  ---

  ### 4. The Load-Bearing Requirement  
  **Explicit/Implicit Distinction** is the primary obstacle for standard models. It requires:  
  - Tracking *which* beliefs are actively represented vs. merely derivable.  
  - Preventing logical equivalence from conflating distinct explicit beliefs (e.g., "¬¬P" vs. "P").  
  **Why it rules out common approaches**:  
  - **Possible-worlds models** collapse all implicit beliefs into explicit ones (violating Non-Closure and the Distinction).  
  - **Syntactic models** satisfy the Distinction but struggle with Harmony (treating logically equivalent beliefs as distinct).  
  - **Awareness models** enforce the Distinction via an "awareness set" but fail Basic Competence if trivial inferences aren’t automated.  

  ---

  ### 5. Scorecard  
  *Key: ✓ = Satisfied, ✗ = Violated, ~ = Partially/Compromised*  

  | Model                  | Non-Closure | Basic Competence | Expl/Impl Dist. | Consider/Capacity | Non-Explosion | Harmony | Resource Sens. |  
  |------------------------|-------------|------------------|-----------------|-------------------|---------------|---------|----------------|  
  | **Possible Worlds**    | ✗           | ✓                | ✗               | ✗                 | ✗             | ✓       | ✗              |  
  | **Syntactic**          | ✓           | ~ (manual rules) | ✓               | ✓                 | ✓             | ✗       | ✓              |  
  | **Awareness**          | ✓           | ✗ (if no automation) | ✓         | ✓                 | ✓             | ✗       | ~              |  
  | **Impossible Worlds**  | ✓           | ✗ (if over-permissive) | ~         | ~                 | ✓             | ✗       | ✗              |  

  **Explanations**:  
  - **Syntactic models** (belief sets + deduction rules) excel at Non-Closure and Distinction but fail Harmony (e.g., *P* and *¬¬P* are distinct). Basic Competence requires ad hoc inference rules.  
  - **Awareness models** (explicit beliefs + awareness function) handle Unconsidered propositions but often lack Basic Competence (unless awareness includes all atomic propositions).  
  - **Impossible-worlds models** (worlds violating logic) allow Non-Closure and Non-Explosion but risk *under*-specification: they permit agents to reject trivial inferences (violating Basic Competence) unless constrained.  
  - **Possible-worlds models** fail all core boundedness desiderata by enforcing full logical closure.  

  **Best compromise**: Syntactic or awareness models augmented with limited inference rules (for Basic Competence) and resource bounds (for Sensitivity), sacrificing Harmony for realism.
