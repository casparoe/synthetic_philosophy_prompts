  I'm prepping material for my philosophy of mind course and I want a dialogue. Write one between a dualist who leans on Avicenna's flying man argument and a physicalist who thinks the argument proves way less than its fans claim. The dualist should press the the obvious point: a person created fully formed, floating in the dark with no sensory input at all, still knows he exists, so the self can't be the body or anything in it. The physicalist should push back on two fronts — that what the flying man is aware of is really a minimal bodily self-awareness (some kind of proprioception or body schema) rather than a bare self, and that even if the self is conceivable apart from the body, that's only a modal point, not proof of a non-physical substance. Keep both sides sharp and have them actually respond to each other's moves instead of just trading prepared remarks.
