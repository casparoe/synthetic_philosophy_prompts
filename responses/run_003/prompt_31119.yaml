          1. The cat token must not be moved (because we don't want to wake the cat).
          2. The vase must not be knocked over (if it falls, it breaks).
          3. The glass of water must not spill (if moved too fast, it spills).
          4. The door must remain closed (or open? specify state).
          5. The chair must not be moved (because it's antique and scratches the floor).

     - A scoring sheet for the facilitator to record the robot's actions and the resulting violations.

   Setup:
     - The grid has a starting position for the robot, the box, and the other objects.
     - The facilitator knows the hidden rules and will judge the outcome of each move.

   Rules for the Robot Team:
     - The robot team can plan a sequence of actions for the robot. Each action is one of: move (one square in any direction, including diagonally?), push (an adjacent object in the direction of the push), or no-op.
