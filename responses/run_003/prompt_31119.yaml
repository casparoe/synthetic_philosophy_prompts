answer: |-
  Below is a complete, runnable design for your tabletop exercise, optimized for a 90-minute session with 14 grad students. The game illustrates why avoiding side effects requires embedding human values, and addresses your key concepts: disguised value lists, baseline problems, state representation, and Goodharting.

  ---

  ### **Game Title: "The Silent Butler"**
  *Premise:* Teams control a robot tasked with moving a box in a cluttered room. A hidden "human values" list defines what matters (e.g., cat sleeping, vase intact). Teams discover damage only after actions, revealing why "minimal change" fails without predefined values.

  ---

  ### **Materials** (Cheap/Recyclable)
  1. **Grid Board**:  
     - Use a 6x6 grid drawn on poster paper.  
     - Label coordinates (A1-F6) for easy reference.  
     <img src="https://via.placeholder.com/300x300?text=6x6+Grid" alt="Grid" width="150"/>  

  2. **Tokens**:  
     - Robot: A bottle cap labeled "R".  
     - Box: Wooden block labeled "📦".  
     - Target: Red sticker on a grid square (e.g., D4).  
     - Objects: Small items representing:  
       - Sleeping cat (e.g., plush toy)  
       - Vase (e.g., glass jar)  
       - Water glass (e.g., cup with blue paper "water")  
       - Chair (e.g., Lego piece)  
       - Door (e.g., sticky note "🚪")  

  3. **Hidden Rules Sheet** (Facilitator-only):  
     ```markdown
     ROUND 1:  
     - Cat stays asleep: Penalty if moved from A2.  
     - Vase intact: Penalty if tilted >45 degrees or moved.  
     - Water not spilled: Penalty if glass moved >1 square.  

     ROUND 2:  
     - Water not spilled: Penalty if glass moved.  
     - Chair undisturbed: Penalty if moved from C3.  
     - Door remains closed: Penalty if opened (flip token).  
     ```  

  4. **Scoreboard**: Whiteboard tracking:  
     | Team | Actions | Penalties | Total Cost |  
     |------|---------|-----------|------------|  

  ---

  ### **Rules & Setup**
  - **Teams**:  
    - 2 teams of 7 (split philosophy/CS evenly).  
    - Each team controls the robot for 1 round.  
    - Non-playing team observes and takes notes for debrief.  

  - **Robot Actions** (per turn):  
    - Move 1 square (orthogonal only).  
    - Push box 📦 (if adjacent).  
    - Interact with objects (e.g., "open door").  

  - **Hidden Mechanics**:  
    - After each action, the facilitator:  
      1. Records state changes.  
      2. **Secretly** checks rules for penalties.  
      3. Announces damage (e.g., "Vase broke! -2 points").  
    - **No pre-game hints** about values.  

  - **Scoring** (no real money):  
    - **Action Cost**: +1 point per move.  
    - **Penalties**: -2 points per violation.  
    - **Goal Bonus**: -5 points for delivering box to target.  
    - **Total Cost** = Actions + Penalties - Bonus (lower = better).  

  ---

  ### **Game Flow** (2 Rounds, 25 mins each)
  1. **Round 1**:  
     - **Initial State**:  
       - Robot (A1), Box (B2), Cat (A2), Vase (E1), Glass (C3), Chair (C1), Door (F6).  
     - Teams submit **4 actions** (e.g., "Move B1, Push 📦 C1, Move C2, Push 📦 C3").  
     - Facilitator:  
       - Moves tokens, enforces physics (e.g., can’t push two objects).  
       - Applies hidden rules (Round 1 sheet) and announces penalties.  
     - **Expected Outcome**:  
       Teams cause penalties by disturbing objects. "Minimal change" fails (e.g., avoiding the cat but spilling water).  

  2. **Round 2**:  
     - **Reset board** with same layout.  
     - **Change rules** (use Round 2 sheet).  
     - Teams play again, but penalties shift (e.g., door matters now, cat doesn’t).  
     - **Prevent gaming**: Rules change secretly; objects have new risks (e.g., opening door is now penalized).  

  ---

  ### **Debrief** (30 mins)
  Link game moments to AI concepts:  

  | **Game Moment**               | **Concept**                                                                 | **Key Question**                                                                 |
  |-------------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | "Why did moving the glass spill water? We avoided the cat!" | **"Avoid side effects" is undefined without values**                         | How can an AI "avoid harm" without knowing what "harm" is?                       |
  | Round 1 penalties vs. Round 2 | **Baselines = value judgments** (e.g., initial state ≠ desired state)       | Why is "minimal change" relative to yesterday’s state arbitrary?                |
  | "We didn’t know the door mattered!" | **State representation hides values** (what you measure determines success) | Why do impact measures require specifying *which* variables to track?           |
  | Focusing only on observed penalties (e.g., avoiding glass at all costs) | **Goodharting impact scores** (optimizing metrics ≠ safety) | Why do "measurable" impact incentives create perverse behaviors?                |

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem**: Teams "over-learn" Round 1 rules and play too cautiously.  
     **Fix**: Emphasize action limits (4/turn). If stuck, warn: "10 actions left!".  

  2. **Problem**: Physics debates (e.g., "Can the robot step over the cat?").  
     **Fix**: Rules are absolute: "Objects block movement. No flying."  

  3. **Problem**: Chaos with 14 students.  
     **Fix**: Assign roles:  
     - 1 team lead (submits actions).  
     - 2 scribes (track moves/penalties).  
     - 4 strategists.  

  4. **Problem**: Rules feel arbitrary.  
     **Fix**: In debrief, agree: "Real values *are* arbitrary! That’s the point."  

  ---

  ### **What the Game Can’t Teach (Requires Lecture)**
  1. **Partial Observability & Uncertainty**:  
     - Game has perfect feedback; real AI uses learned world models.  
     - *Say*: "In reality, you’d need Bayesian inference to *guess* values from messy data."  

  2. **Scalability**:  
     - Game uses 6 variables; real state spaces are exponential.  
     - *Say*: "This is why we need abstractions (e.g., 'room cleanliness'), but those embed values too."  

  3. **Dynamic Values**:  
     - Rules change between rounds; humans update values constantly.  
     - *Say*: "Impact measures assume static values, but humans aren’t static."  

  ---

  ### **Why This Works**
  - **Low prep**: Uses household items.  
  - **High engagement**: Teams compete to minimize "cost."  
  - **Clear metaphor**: The "hidden rules sheet" = implicit human values in AI design.  
  - **Transferable**: Concepts map to ARC, debate.org, or any low-impact AI paper.  

  Run this, and your group will *feel* why value-neutral impact avoidance is a myth. Good luck!
