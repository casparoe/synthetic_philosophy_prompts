          - In the game, if the robot tries to change as little as possible, it might take a very long path (high action cost) and still cause a violation because it brushed against an object that was important. Also, sometimes the task requires changing something (like moving the box) and the robot must interact with the environment. Without knowing what matters, the robot doesn't know which changes are acceptable and which are not.

