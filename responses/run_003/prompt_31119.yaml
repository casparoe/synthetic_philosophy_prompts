          - In impact measures, we often compare the state after the robot acts to a baseline state (like the initial state or an inaction state). But in the game, if the baseline is the initial state, then moving the chair is a change and might be penalized. However, what if the chair was not in its "correct" position to begin with? What if the baseline should be "the state the human expects" (which might not be the initial state)? The facilitator's hidden rules are the true baseline, but the robot doesn't know it. Also, changing the rules between rounds shows that the baseline is set by human values and can change.

