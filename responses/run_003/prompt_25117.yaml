answer: |-
  ## Memorandum  
  **To:** Dean of Research  
  **From:** Research Integrity Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Mandatory Preregistration for Confirmatory Studies  

  Our committee has investigated repeated instances of questionable research practices (QRPs) in Psychology and Neuroscience labs. The primary defense offered—that strict adherence to best practices creates competitive disadvantages in publishing, student placement, and grant funding—reveals a critical problem: **individually rational choices are producing a collectively destructive equilibrium.** Labs feel trapped, unable to adopt higher standards unilaterally without penalizing their members. The status quo, including our voluntary preregistration badge, fails to alter these incentives. We therefore recommend a **department-wide mandate for preregistration of confirmatory studies**, implemented with crucial safeguards.  

  ### The Case for a Mandate  
  The core issue is a **collective action problem.** Voluntary systems cannot resolve conflicts where individual costs (perceived slower progress, competitive disadvantage) outweigh individual benefits (integrity), even when collective benefits (replicability, credibility, efficient resource use) are immense. A mandate acts as a binding coordination mechanism, leveling the playing field. Labs adhering to preregistration for confirmatory work no longer risk being "suckers" losing out to labs using QRPs. This aligns individual incentives with collective goals. Evidence from fields like clinical trials demonstrates that mandated preregistration reduces publication bias and QRPs without stifling productivity long-term. It signals our university’s commitment to credible science, enhancing institutional reputation.  

  ### Engaging Key Objections  
  1.  **"Dictating Methodology/Stifling Exploration":** This is a serious concern. Our mandate is explicitly **limited to confirmatory (hypothesis-testing) research.** Exploratory, computational, qualitative, and theory-generating work remains vital and *exempt*. The mandate requires only that researchers clearly label *which mode* they are operating in for a given study. Preregistration is a tool for confirmatory contexts; it does not forbid exploration. Flagging deviations in publications enhances transparency for *all* research types.  
  2.  **"Academic Freedom":** The mandate governs *process transparency*, not methodology itself. It does not dictate *how* to analyze data or *what* hypotheses to test, only that the planned confirmatory approach is declared upfront and deviations documented. This protects the integrity of the knowledge-generation process, a core university value, without infringing on intellectual freedom.  

  ### Recommendation: Mandatory Preregistration with Phased Implementation  
  We recommend adopting a department-wide mandate for preregistration of confirmatory studies, effective Fall 2024, with the following structure:  

  1.  **Scope:** Applies *only* to research explicitly framed as hypothesis-testing (confirmatory). Exploratory research is explicitly exempt.  
  2.  **Requirements:**  
      *   Public timestamped preregistration (e.g., OSF) detailing hypotheses, methods, primary analyses *before* data collection/analysis.  
      *   Publication must include a section clearly stating adherence to the plan or detailing and justifying any deviations.  
  3.  **Phased Implementation (Pilot Year):**  
      *   **Year 1:** Implement mandate within Psychology and Neuroscience departments (where QRPs were identified and confirmatory work is prevalent).  
      *   Allow other departments (e.g., Sociology, Education, Biology) to opt-in voluntarily during this pilot phase.  
      *   Establish a working group (faculty, postdocs, grad students) to monitor implementation, address challenges, gather feedback, and assess impact on productivity/grants.  
  4.  **Support:** Provide dedicated resources: workshops on preregistration/template development; administrative support; integration into graduate training.  

  ### Why Not Status Quo or Pure Voluntarism?  
  The voluntary badge system demonstrably fails to change incentives. The collective action trap remains. Individual labs acting alone cannot solve this. A full-status-quo recommendation ignores the documented harm to scientific integrity and our university's reputation.  

  This targeted mandate, focused solely on confirmatory work and implemented initially where the problem is acute, provides the necessary coordination mechanism to break the destructive equilibrium. It upholds academic freedom by focusing on transparency and process, not intellectual content, while significantly bolstering research integrity and our collective scientific reputation. We urge your approval to move forward with the pilot implementation.  

