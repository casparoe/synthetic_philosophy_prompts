  I am a graduate TA for a seminar called "Formal Methods in AI Alignment," and I'm currently grading the midterm exam. One question in particular has me second-guessing myself, because the student's answer reads smoothly and seems confident, but I have a nagging sense that something isn't quite right underneath the surface. I'd like a second opinion before I assign a grade and write feedback. Below is the exam question, followed by the student's answer verbatim. Please read both carefully, assign a grade on a standard A–F scale (plus/minus allowed), and provide point-by-point comments that justify the grade. Your comments should identify what the student got right, flag any errors or conflations, and explain why each error matters — the kind of detail I can pass along to the student. At the very end, please output the grade in the machine-readable form \grade{...}.

  **Exam question:**

  In the literature on AI alignment, "impact measures" have been proposed as a way to prevent an AI system from causing harmful side effects while pursuing its assigned goal. Some authors have argued that impact measures can substantially reduce our reliance on a full specification of human values. Explain the core idea behind at least one such proposal, and then critically evaluate the claim that impact measures allow us to avoid side effects without needing a complete theory of value. In particular, discuss the role of the so-called inaction baseline and whether it reintroduces normative assumptions through the back door.

  **Student's answer:**

  Impact measures are a class of techniques designed to constrain an AI agent so that it achieves its objective while minimizing how much it changes the world beyond what is strictly necessary. The central motivation is that if we cannot fully specify human values — which seems likely given their complexity — we might still build safe AI by penalizing the agent for having a large causal influence on its environment.

  The most influential approach combines two ideas: an inaction baseline and a penalty term. The inaction baseline is a reference policy that represents what the world would look like if the agent simply did nothing (or took only minimal, default actions). The agent's actual trajectory is then compared against this baseline, and any deviation that would reduce the "attainable utility" of a wide range of possible reward functions is penalized. This is the core of the Attainable Utility Preservation (AUP) framework, which was first proposed by Armstrong and Levinstein. The idea is elegant: by preserving the ability to achieve many different goals in the future, the agent avoids foreclosing options that humans might later care about, without ever needing to know which specific goals those are.

  Does this fully sidestep the need to specify human values? I think it does, and here is why. The penalty term is defined over a distribution of reward functions that are, by design, agnostic about what humans actually want. The agent doesn't need to know whether we value biodiversity, economic growth, or artistic flourishing — it just needs to avoid making any of those goals permanently harder to achieve. The inaction baseline plays a crucial role here: it anchors the comparison so that "impact" is measured relative to a world where the agent doesn't intervene. Because the baseline is defined purely in terms of agent inaction, it carries no normative content whatsoever. It is simply a technical convenience, like setting the zero point on a ruler.

  One objection is that some goals might be incompatible — preserving the option to industrialize a forest and preserving the option to keep it wild cannot both be maintained. But this is not a problem for impact measures specifically; it's a feature of any multi-objective setting. The agent will simply find a compromise that minimizes total impact across all reward functions, which is exactly what we would want from a safety perspective. A deeper worry is that impact measures might prevent the agent from doing anything useful at all, but this can be tuned by adjusting the penalty weight so that the agent is still allowed to have some effect on the world when its assigned task requires it.

  In summary, impact measures like AUP solve the side-effect problem by penalizing deviations from an inaction baseline across many reward functions, and they do so without smuggling in any assumptions about what humans value. The inaction baseline is normatively neutral, and the distribution over reward functions is deliberately uninformative. This is what makes the approach so promising: it gives us a way to build safe AI even in the absence of a complete theory of value.
reasoning: |-
  Hmm, the user is a graduate TA grading a midterm exam on Formal Methods in AI Alignment, specifically an essay question about impact measures. They're concerned about a student's answer that appears polished but might contain subtle errors. The student argues that the inaction baseline is "normatively neutral" and that impact measures fully avoid value specification needs - claims the TA suspects might be flawed.

  Let me unpack this carefully. The student's answer focuses on Attainable Utility Preservation (AUP) as the core proposal. They correctly identify key components: the inaction baseline, penalty over diverse reward functions, and the goal of preserving future options. The writing is coherent and demonstrates understanding of surface-level mechanics - that's commendable. However, three critical flaws stand out upon closer reading.

  First, the normative neutrality claim about the inaction baseline is dangerously wrong. The baseline isn't just "technical convenience" - it implicitly privileges the status quo. Choosing to measure impact relative to "do nothing" assumes that maintaining current states is preferable to change. This matters tremendously in AI safety because status quo bias could prevent beneficial interventions (e.g., an AI refusing to stop ongoing harm because that would "change" the baseline).

  Second, the student conflates "agnostic" reward function distributions with true normative independence. But uniformly random rewards don't solve value conflicts - they just obscure them. As Hadfield-Menell and others note, such distributions still encode assumptions about what counts as a plausible reward function (e.g., excluding self-destruct goals). The student misses how this secretly reintroduces specification problems.

  Third, they dismiss the incompatibility objection too casually. When reward functions conflict, minimizing "total impact" isn't clearly desirable - it could lead to worst-case compromises. This isn't just a "multi-objective setting" issue; it's about whether impact measures actually capture harm when trade-offs exist. The student's optimism about tuning penalty weights glosses over deeper alignment problems.

  The student deserves credit for accurately explaining AUP's mechanics and recognizing the "do nothing" baseline's role. But their failure to critically engage with normative assumptions - especially when the question explicitly asked about them - suggests significant conceptual gaps. In an advanced seminar, this merits a B-/C+ boundary. I'll recommend B- with specific feedback about status quo bias and reward function assumptions.
answer: |-
  ### Grading Summary and Feedback  

  **Grade:** B-  
  **Rationale:** The student demonstrates a solid understanding of the core mechanics of impact measures (particularly AUP) and correctly identifies key components like the inaction baseline and penalty term. However, they make significant conceptual errors regarding the normative neutrality of the inaction baseline and the extent to which impact measures avoid value specification. These errors reflect a shallow engagement with critical objections discussed in the literature.  

  ---

  ### Point-by-Point Comments  

  1. **Core Proposal Explanation (Strengths):**  
     - ✅ The student accurately summarizes the Attainable Utility Preservation (AUP) framework: penalizing deviations from an inaction baseline that reduce attainable utility across diverse reward functions.  
     - ✅ Key elements (e.g., baseline as a reference policy, penalty for reducing future option value) are correctly identified and explained clearly.  

  2. **Critique of Value-Specification Avoidance (Partial Credit):**  
     - ⚠️ The student correctly notes that AUP uses a distribution of reward functions agnostic to specific human values. This *technically* avoids specifying a *single* value system.  
     - ❌ **Critical Error 1: Misrepresenting the inaction baseline’s neutrality.**  
       - The claim that the baseline "carries no normative content whatsoever" is incorrect. The inaction baseline implicitly endorses the *status quo* as a default "safe" state. In reality:  
         - **Why it matters:** If the status quo involves existing harm (e.g., pollution, inequality), preserving it is itself a normative choice. An AI avoiding "impact" might refuse to correct injustices, as doing so would deviate from the baseline. This reintroduces hidden normative assumptions (e.g., "stasis is preferable").  
         - **Literature Gap:** The student overlooks critiques from Soares et al. (2016) or Armstrong’s later work, which note that baselines like "do nothing" encode preferences about which changes count as "interventions."  

  3. **Handling Incompatible Goals (Flawed Argument):**  
     - ✅ The student correctly identifies that goal conflicts arise in multi-objective settings.  
     - ❌ **Critical Error 2: Unjustified optimism about minimizing "total impact".**  
       - Claiming the agent will "find a compromise that minimizes total impact" ignores that:  
         - (a) "Impact" is defined relative to the baseline, which may arbitrarily favor certain goals (e.g., a factory’s continued operation vs. a forest’s preservation).  
         - (b) Without a value model to weigh trade-offs, "minimizing total impact" could lead to perverse outcomes (e.g., marginally harming all goals to avoid large harm to one).  
       - **Why it matters:** This assumes a neutral aggregation of impacts, but impact measures lack a meta-criterion for resolving conflicts. The student conflates technical feasibility with normative safety.  

  4. **Tuning the Penalty Weight (Oversimplification):**  
     - ⚠️ Correctly notes penalty weight can be adjusted to allow useful actions.  
     - ❌ **Critical Error 3: Ignoring baseline sensitivity.**  
       - The student assumes tuning is straightforward, but the baseline itself is fragile. If the baseline is miscalibrated (e.g., "minimal action" includes harmful routines), impact penalties could reward stagnation or punish beneficial changes.  
       - **Why it matters:** Adjusting penalties doesn’t address the core issue that the baseline’s definition is value-laden (e.g., "What counts as 'inaction'?").  

  5. **Overall Evaluation (Insufficient Critique):**  
     - ❌ The conclusion that impact measures "solve the side-effect problem without smuggling in normative assumptions" is unsupported. The student misses that:  
       - The choice of baseline, reward function distribution, and impact metric *all* embed normative assumptions (e.g., which states are "default," which goals are plausible).  
       - As Turner et al. (2021) argue, impact measures often *shift* the specification burden from values to these proxy parameters.  

  ---

  ### Recommendations for Improvement  
  - **Deepen Critique:** Engage with literature on the non-neutrality of baselines (e.g., how "inaction" assumes the status quo is safe) and distributional choices (e.g., excluding "anti-human" reward functions).  
  - **Acknowledge Trade-offs:** Explicitly discuss how impact measures transfer value specification problems to baseline/penalty design.  
  - **Nuance in Claims:** Avoid absolute statements (e.g., "no normative content whatsoever") when the literature highlights ambiguity.  

  The student’s answer is well-structured and shows technical understanding but lacks critical depth on normative pitfalls. A **B-** reflects competent execution with substantive gaps in key areas.  

  \grade{B-}
