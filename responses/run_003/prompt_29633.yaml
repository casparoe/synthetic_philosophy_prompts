  First, the argument uses a sneaky proposition q: "p is true and nobody knows p." If q were true, it should be knowable according to (1). But knowing q leads to a contradiction because you'd know p (so someone knows p) and know that nobody knows p (so no one knows p). That's impossible. Therefore, q can't be true, meaning every truth is known at some point. But that's absurd—some truths are lost forever.

  The user doesn't want to reject (1), the knowability principle. So where can they push back? Step (4) claims knowing q is impossible. But is that really the case? The contradiction arises only if we assume that the knower exists in the same world and time where q is true. But knowability allows for possible situations. So maybe in some possible world, someone knows q, but that world isn't the actual one. In that possible scenario, "nobody ever knows p" would refer to the actual world, not their own. So knowing q means knowing p is true in the actual world and that in the actual world, nobody knows p. The knower is in a different world, so their knowledge doesn't contradict "nobody in the actual world knows p." This defuses the contradiction.

  The user might worry this is ad hoc. But it's principled: knowability deals with possible worlds, and the quantifiers in q need careful indexing. Rejecting the step where the knower's context is conflated with the actual world's context makes sense. The cost is accepting that knowledge in other worlds doesn't affect actual world truths. But that's standard in modal logic. 

