     Camp A: CH is either true or false in the real universe, even if we don't know which, and we can (and should) seek new axioms to decide it.
     Camp B: CH is indeterminate in the sense that it is not settled by the concept of set; it can be true in some legitimate universes and false in others.

   Issue 3: The role of new axioms.
     Camp A: New axioms (like large cardinals, forcing axioms, or maximality principles) can be justified as true in the real universe and can settle CH.
     Camp B: New axioms can be adopted for various purposes (e.g., to study a particular model or for mathematical fruitfulness) but do not settle CH for the entire multiverse. Instead, they may constrain the multiverse.

   Issue 4: The concept of truth in set theory.
     Camp A: Truth in set theory is absolute and corresponds to the real universe.
     Camp B: Truth in set theory is relative to a model, and the multiverse provides the full context.

   Issue 5: The meaning of independence results.
     Camp A: Independence shows the incompleteness of our current axioms but not the indeterminacy of the underlying concepts.
     Camp B: Independence is evidence of genuine indeterminacy, especially for statements like CH that are independent of even strong extensions of ZFC.

