  First, I need to break down the problem clearly. The user isn't a specialist, so avoiding jargon is key. The core issue is that Bayesian updates rely on P(E|T) and P(E). If E is old evidence, P(E) is 1, making the Bayes factor 1, so no update. But intuitively, old evidence should support a theory. 

