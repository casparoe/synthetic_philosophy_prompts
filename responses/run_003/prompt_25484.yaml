  The user's deeper questions: Should they be more skeptical of theories that explain known facts? And is Bayesianism flawed? They might be trying to navigate claims in popular science or media, where theories often "explain" existing data. They want a practical heuristic for evaluating such theories without getting bogged down in math.

  I should emphasize that old evidence can still be strong support if the theory explains it better than alternatives. The key is the comparative explanatory power. For example, Newtonian physics couldn't explain Mercury's orbit, so GR's explanation was significant. The user needs to assess how well the theory fits the evidence compared to other theories.

  Also, predicting new evidence is strong because it's a higher risk. If a theory predicts something unexpected and it's confirmed, that's less likely to be a fluke. But old evidence isn't useless; it's about the context. The user should look for theories that unify or explain multiple known facts elegantly, especially those that were anomalies before.

  The implications for everyday reasoning: Bayesianism isn't broken; it's a math issue with known solutions. The user shouldn't discard theories that explain old evidence but should examine how they improve on existing explanations. Skepticism is warranted if a theory only explains old evidence without new predictions, but it's not a red flag by itself.

