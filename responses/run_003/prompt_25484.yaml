answer: |-
  That's an incredibly sharp observation — you've nailed the core tension in the problem of old evidence! It *does* seem crazy that Bayes' rule would dismiss something like Mercury's orbit as evidence for Einstein. This problem highlights a fascinating interplay between probability, knowledge, and surprise. Here's a breakdown of the implications for everyday theory evaluation:

  **1. Should you be more skeptical of theories explaining old evidence vs. predicting new surprises?**

  *   **Yes, generally, but with crucial nuance.** Predictions of **novel, surprising evidence** are inherently stronger. Here's why:
      *   **Lower Risk of "Fitting the Noise":** A theory crafted *after* seeing the evidence can be subtly (or blatantly) tuned to fit it, even if it's wrong ("curve-fitting"). Predicting something genuinely new and unexpected is much harder to fake.
      *   **Higher Confirmatory Power:** Successfully predicting something surprising dramatically increases our confidence. If the prediction fails, the theory is strongly refuted. Old evidence offers less opportunity for such decisive falsification because the theory was designed knowing it existed.
      *   **The "Sherlock Holmes" Principle:** Eliminating the impossible (other explanations for the new evidence) lends more credence to the remaining theory. New predictions often eliminate more possibilities than explanations of old data.
  *   **However, explaining old evidence CAN be powerful:**
      *   **Resolving Anomalies:** If the old evidence was a major puzzle or contradiction for *previous* theories (like Mercury was for Newton), a new theory that elegantly resolves it *is* strong evidence. It shows the new theory solves a problem the old one couldn't.
      *   **Unification:** If a new theory *simultaneously* explains diverse, seemingly unrelated pieces of old evidence more simply or fundamentally, that's compelling (e.g., evolution explaining fossils, biogeography, embryology).
      *   **Explanatory Depth:** Sometimes a new theory provides a *deeper reason* or *mechanism* for why the old evidence *must* be true, going beyond just accommodating it.

  **Implication for You:** When encountering a new theory explaining something known:
  1.  **Ask: Was this a genuine puzzle/anomaly before?** If yes, resolving it is significant evidence. If not, it's weaker.
  2.  **Ask: Does this theory *only* explain old evidence, or does it make novel predictions?** A theory resting solely on explaining the past is far less impressive than one also predicting the future.
  3.  **Be wary of "Just-So Stories":** Is the explanation ad-hoc, complex, and seemingly designed *only* to fit this one piece of data? Or is it a natural, elegant consequence of a broader framework?

  **2. Is there something wrong with how we normally think about evidence, or is it just a math glitch?**

  *   **It's Primarily a Technical Glitch in the *Formalization*, Not Common Sense:** Our intuition that Mercury's orbit supported Einstein is **correct**. The problem lies in how standard Bayesian probability captures "background knowledge."
      *   **The Core Issue:** Assigning `P(E) = 1` assumes we are *absolutely certain* about the evidence `E`. But when evaluating a new theory `T`, we need to ask: "How *expected* was `E` *before* we had *this specific theory `T` in mind*, given what we knew then?"
      *   **Solutions involve Counterfactuals:** Bayesians have developed solutions, often involving:
          *   **Counterfactual Probability (`P(E | ~T)`):** How likely would `E` be *if* `T` were false? If `T` makes `E` much *more* likely than it would be otherwise (`P(E | T) >> P(E | ~T)`), then `E` supports `T`, even if known. For Mercury, `P(Mercury's Orbit | Newton)` was very low (an anomaly), while `P(Mercury's Orbit | GR)` was 1. This large ratio provides the support.
          *   **Expanding the Knowledge Base (`K`):** Treat the *discovery of the explanation itself* as new evidence. Knowing *that GR entails Mercury's precession* is new information added to our background knowledge `K`, allowing a formal update.
  *   **What it Reveals about Everyday Reasoning:** The problem highlights that **evidence isn't static.** The *significance* of a fact changes depending on the *theoretical context*. Mercury was just data until Newton struggled with it; it became powerful evidence when GR explained it effortlessly. Our common sense often implicitly performs the counterfactual: "Wow, without this new theory, that old fact was really weird/hard to explain. This theory makes perfect sense of it."

  **Implication for You:** Your intuitive understanding of evidence is sound! The math needs refinement to capture the dynamic nature of knowledge and explanation. The key insight is to **focus on the *explanatory power* relative to alternatives**, not just the raw fact of the evidence existing.

  **Key Takeaways for Evaluating Theories as an Ordinary Person:**

  1.  **Prioritize Novel Predictions:** Theories predicting surprising, previously unknown phenomena that are later confirmed deserve the highest initial credence. This is the gold standard.
  2.  **Value Resolution of Anomalies:** Theories that cleanly solve long-standing, well-established puzzles within the old framework provide strong evidence.
  3.  **Demand More than Just Accommodation:** Be skeptical of theories that *only* "explain" old evidence without resolving anomalies, unifying diverse facts, or making testable new predictions. Ask "Could this theory have been easily adjusted to fit *any* known data?"
  4.  **Think Counterfactually:** When old evidence is cited, ask: "How surprising or difficult was this fact *before* this theory came along? Does this theory make it seem *inevitable* or *natural*, whereas before it was a coincidence or mystery?"
  5.  **Bayesianism is Robust (with Tweaks):** Don't discard Bayesian thinking. The problem of old evidence is a recognized challenge with sophisticated solutions within the framework. It highlights the importance of carefully defining background knowledge and considering probabilities conditional on *not* having the theory in question. The core logic of updating beliefs based on evidence *relative to alternatives* remains powerful.

  **In the Einstein Scenario:** Astronomers were right. Mercury's orbit was powerful evidence *because* it was a major anomaly for the dominant Newtonian theory (`P(E | Newton)` was very low). General Relativity not only accommodated it (`P(E | GR) = 1`) but made it a necessary consequence of a beautiful, fundamental framework (`P(E | GR)` vastly exceeded `P(E | Newton)`). The technical "old evidence" problem doesn't negate this; it just forces Bayesians to model the counterfactual probability (`How likely was Mercury's orbit *without* GR?`) to capture the intuitive support. For everyday reasoning, recognizing that GR solved a deep puzzle is sufficient.
