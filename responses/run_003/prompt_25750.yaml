answer: |-
  1.  The practice is compatible with both realism (where "found representation" reflects a mind-independent fact about the model's structure) and instrumentalism (where "representation" is merely a pragmatic label for a successful probe, useful for prediction or control), though it strongly encourages realist language and intuitions.
  2.  A nonlinear representational realist can reject linear probes as an incomplete discovery method (arguing representations require nonlinear decoding) while maintaining realist vocabulary, but this challenges the practice's sufficiency claim that linear decodability *is* evidence of representation.
  3.  The practice faces an internal consistency challenge: the ability to find above-chance linear decoders in random high-dimensional subspaces suggests the criterion ("linearly decodable therefore represented") risks overgenerating representations, requiring additional criteria (like robustness, specificity, or causal efficacy) to avoid trivial findings.
  4.  Adopting instrumentalism would shift the discourse from "finding" representations to "constructing useful probes" and emphasize the probe's properties and limitations, though the core technical activity of training and evaluating probes might survive largely intact as a tool for understanding behavior.
  5.  The methodological commitment is that linear accessibility (or decodability) serves as *evidence* for the presence of a representation, presupposing a form of "linear approximation realism" where linear structure reflects underlying representational content, even if imperfectly.

  **Confidence Note:**  
  High confidence in points 1, 2, 3, 5. Lower confidence in point 4 regarding the *extent* to which day-to-day practice might remain unchanged under instrumentalism; the technical work might persist, but the framing and interpretation of results would fundamentally shift. Point 4 is the claim I am least sure of.
