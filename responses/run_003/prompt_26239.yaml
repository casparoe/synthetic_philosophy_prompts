prompt: |-
  I've been reading Tolstoy's *What is Art?* for a reading group and I'm trying to get a handle on how his theory actually cashes out. The book is full of verdicts — he's constantly saying this is real art, that is counterfeit — and I've been compiling them to see if there's a consistent principle underneath. Honestly, some of them seems to pull in different directions and I'd love a second pair of eyes.

  Here's what I've got so far for things Tolstoy unambiguously praised as true art:
  - The peasant songs and folk tales he encountered on his estate — he says they transmit genuine feeling and are understandable to everyone, regardless of education.
  - *Uncle Tom's Cabin* and the novels of Dickens and Hugo — he says they express the Christian spirit of human brotherhood and are accessible to any peasant.
  - The story of Joseph from Genesis — he calls it universally intelligible, sincere, and morally serious.
  - Some of Schiller's plays — he praises them as morally earnest and infectious across class lines.

  And here's what he condemned as counterfeit:
  - His own novels, including *War and Peace* and *Anna Karenina* — he says they were made for the amusement of the idle rich, meet none of his criteria, and he regrets having written them.
  - Beethoven's Ninth Symphony and the late string quartets — he says they're incoherent, fail to transmit a definite feeling, and only a tiny coterie pretends to understand them.
  - Wagner's operas — same complaint, plus he thinks they're grandiose, insincere, and a kind of hypnotic manipulation rather than genuine art.
  - Baudelaire, Verlaine, Mallarmé, and the Symbolist poets generally — obscure, elitist, no genuine feeling to transmit, written for a decadent few.
  - Much of Renaissance painting — technically skilled but emotionally empty, made to flatter wealthy patrons and display virtuosity.

  The new case I want to test him on: a song like 'We Shall Overcome.' It's simple enough that anyone can sing it — you don't need training or a programme note. It's been used in labour movements and the civil rights movement, so it's drenched in moral feeling and the spirit of brotherhood. It's not the work of a single named artist; it evolved out of gospel and folk traditions, and no one knows exactly who wrote which bits. And it genuinely moves people — you can see it on film, crowds singing it and weeping. By the standards of infectiousness and universal accessibility, it seems to pass with flying colours.

  But here's the rub. It's a political song, and Tolstoy was deeply suspicious of political movements — he thought they replaced the kingdom of God with earthly programmes and stirred up partisan feeling rather than the universal religious emotion he thought art should transmit. And the fact that it has no individual author might trouble him, since he talks at length about the artist's sincerity as the source of infectiousness, and you can't exactly locate the sincerity of a tradition or a crowd.

  What would Tolstoy's verdict have been? Which of his earlier judgments is the closest analogue? And if I've mischaracterised his principle — if there's a better formulation of what unifies his praise and blame across these cases — what is it, and which further case would settle the matter?
reasoning: |-
  Okay, let me unpack this user's query. They're deep into Tolstoy's *What is Art?* and trying to reconcile his seemingly contradictory verdicts on various artworks. They've compiled lists of what Tolstoy praised and condemned, and now they're testing his theory against "We Shall Overcome." 

  First, I need to recall Tolstoy's core criteria: infectiousness (art's ability to transmit feeling), universality (accessibility across classes), sincerity (artist's genuine emotion), and moral content (Christian brotherhood). The user's lists show this pattern—folk art and socially conscious works praised, elite/obscure art condemned. But Tolstoy's self-rejection and Beethoven critique reveal his radical stance against complexity and exclusivity.

  The user's dilemma with "We Shall Overcome" is sharp: it ticks all Tolstoy's boxes (simple, universal, morally charged) but clashes with his anti-political bent. The song's collective authorship also challenges his emphasis on individual sincerity. I should weigh which principle Tolstoy would prioritize. Given his praise for folk traditions and *Uncle Tom's Cabin* (which was political), universality and moral spirit might override his politics. The labor/civil rights movements align with Christian brotherhood more than partisan agendas. 

  The collective authorship point is trickier. But Tolstoy admired anonymous folk creations—he'd likely see the song as emerging from communal sincerity, not facelessness. His rejection of Renaissance patronage art shows he valued authenticity over individual fame. 

  For a clearer test case, the user could examine politically neutral universal art (like a lullaby) versus partisan art with Tolstoyan form (like Soviet realist hymns). But "We Shall Overcome" leans toward his ideals—it's closer to Uncle Tom than to Wagner. 

  The user's real struggle might be Tolstoy's rigidity. Their examples show his theory strains when art meets criteria but contradicts his personal biases. Highlighting this tension could help them critique Tolstoy's framework beyond just categorizing art.
answer: |-
  Based on Tolstoy's core principles and your well-compiled lists, here's a breakdown of how he would likely judge "We Shall Overcome," the closest analogues, and a refined understanding of his unifying principle:

  1.  **Tolstoy's Likely Verdict on "We Shall Overcome": He would Praise it as True Art.**
      *   **Why?** It overwhelmingly satisfies his essential criteria:
          *   **Universality & Accessibility:** Its simplicity, familiar structure (gospel roots), and repetitive lyrics make it instantly understandable and singable by anyone, regardless of education or class – peasants, workers, children, the oppressed. No "programme notes" needed.
          *   **Infectiousness:** Its documented power to move crowds to tears and collective action demonstrates profound emotional transmission. It *does* infect its participants and listeners.
          *   **Sincerity:** While the *specific* author is unknown, the song arises directly from the authentic suffering, hope, and determination of oppressed communities (African American churchgoers, striking workers). Tolstoy valued the *source* of feeling. This isn't the calculated insincerity of the salon or the academy; it's the raw expression of a people's lived experience. He explicitly praised folk traditions where individual authorship is secondary to communal expression and feeling.
          *   **Moral Content (Christian Brotherhood):** This is the crux. The song isn't advocating a specific political *party* or *earthly utopia* in the way Tolstoy distrusted. It expresses profound, universal Christian values: suffering endured with dignity, unwavering hope ("We shall overcome"), faith ("Deep in my heart, I do believe"), love ("We'll walk hand in hand"), and the ultimate goal of universal brotherhood ("someday"). It calls for unity and justice based on shared humanity, aligning perfectly with Tolstoy's interpretation of the "kingdom of God" within human relations. The Civil Rights Movement, which embraced it, framed its struggle explicitly in terms of moral and religious conviction against injustice.

  2.  **Closest Analogues from Your List:**
      *   **Praised: Peasant Songs/Folk Tales & Uncle Tom's Cabin** are the strongest parallels.
          *   **Peasant Songs/Folk Tales:** Directly analogous in origin (communal, arising from the people), simplicity, universal accessibility, transmission of authentic feeling (suffering, joy, resilience), and often embodying moral truths within their narratives. "We Shall Overcome" is a modern folk hymn.
          *   **Uncle Tom's Cabin:** Tolstoy praised its powerful transmission of Christian brotherhood and condemnation of slavery, its accessibility, and its sincere (if sentimental) moral purpose. Like Stowe's novel, "We Shall Overcome" is an artistic weapon against a profound social injustice rooted in the denial of brotherhood. Both transcend narrow politics for Tolstoy by appealing to fundamental religious/moral principles accessible to all.

  3.  **Refining Tolstoy's Principle:**
      Your lists are excellent, but the core principle unifying his praise and blame is even stricter than simple accessibility or moral feeling. It's **the successful transmission of a single, sincere, universally accessible feeling embodying the religious consciousness (Christian brotherhood/love) that binds humanity together.**

      *   **Transmission is Key ("Infectiousness"):** Art isn't about beauty, skill, or complexity. It's solely about the artist *infecting* the audience with a specific feeling they experienced. Beethoven fails here not just because of complexity, but because Tolstoy felt no clear feeling was transmitted *to him*.
      *   **Sincerity:** The feeling must be genuinely experienced by the artist (or originating community). Counterfeit art feigns feeling (Baudelaire's decadence, Wagner's grandiosity, Renaissance virtuosity).
      *   **Universality:** The feeling transmitted must be one *any* human being, regardless of class or education, can potentially understand and feel. This is why obscure Symbolism, complex Beethoven quartets, and elite patronage art fail. They require special training or belonging to a specific class/coterie.
      *   **Religious Consciousness (Moral Core):** The transmitted feeling must align with the highest religious understanding of the age – for Tolstoy, this was exclusively the Christian ideal of universal love, compassion, and the brotherhood of man. Art must advance human unity and moral progress. This is why his *own* novels, despite their genius and accessibility, are condemned – he felt they lacked this essential moral core and served only aristocratic amusement. It's also why political art advocating violence, hatred, or exclusive nationalism would be condemned, regardless of its infectiousness or simplicity.

      **In short: True Art = Sincerely felt feeling of universal brotherhood/love, transmitted infectiously to anyone.**

  4.  **Addressing Your Concerns:**
      *   **Politics:** Tolstoy distrusted *partisan* politics and movements aiming merely for earthly power or material gain, which he saw as divisive. However, movements grounded in the fundamental religious/moral principle of human brotherhood and non-violent resistance to injustice (like the Civil Rights Movement as Tolstoy might understand it *ideally*) align with his core value. "We Shall Overcome" expresses the *feeling* of that struggle – hope, faith, suffering, unity – not a specific political manifesto. It's closer to a prayer or a communal affirmation of faith in humanity than a party platform. *Uncle Tom's Cabin* was immensely political, yet Tolstoy praised it for its *moral* core.
      *   **Collective Authorship:** This is actually a *strength* for Tolstoy. He explicitly valued the anonymous, communal art of the people over the named "genius" of the elite. The sincerity comes from the *community* expressing its authentic feeling. Folk songs and tales are his prime example. He distrusted the cult of the individual artist prevalent in "upper-class" art.

  5.  **A Test Case to Settle the Matter:**
      To truly stress-test Tolstoy's principle, consider **a piece of propaganda art that is simple, infectious, sincere to its creators, and widely accessible, but advocates a feeling antithetical to brotherhood (e.g., hatred, nationalism, glorification of war).**

      *   **Example:** A rousing, simple folk song used effectively to demonize an ethnic group or glorify violent conquest. Soldiers and civilians sing it fervently; it transmits powerful, sincere feelings of belonging and purpose... but that purpose is destruction or hatred of the "other."
      *   **Tolstoy's Verdict (Hypothetical):** **Counterfeit Art.** Despite meeting the criteria of infectiousness, sincerity (to its singers), and accessibility, it utterly fails the *moral/religious* criterion. It transmits feelings (hatred, jingoism) that *divide* humanity and violate the principle of universal brotherhood and love. He would condemn it as vicious and harmful, regardless of its formal simplicity or emotional power for its adherents. This highlights that Tolstoy's standard is fundamentally *moral* and *religious*, not merely formal or emotional. Infectiousness is necessary but not sufficient; the *content* of the feeling must be the "highest religious consciousness."

  **Conclusion:** "We Shall Overcome" aligns remarkably well with Tolstoy's deepest values. Its simplicity, communal origin, infectious power, and profound expression of suffering, hope, faith, and the demand for universal brotherhood place it firmly alongside the folk songs and *Uncle Tom's Cabin* that he championed as "true art." While political in context, its core message transcends partisan politics for the universal religious principle Tolstoy held supreme. The collective authorship is a feature, not a bug, in Tolstoy's folk-art ideal. His condemnation would likely fall on art that, even if formally perfect or widely popular, promotes division, hatred, or mere sensual pleasure devoid of the unifying religious feeling.
