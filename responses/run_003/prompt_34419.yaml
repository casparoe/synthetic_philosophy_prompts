prompt: |-
  I'm a university student currently taking a decision theory course, and we've just covered Good's theorem: for an ideal Bayesian expected-utility maximizer, the expected value of cost-free information is never negative. I'm trying to work out how much of that result survives once the idealizations are relaxed. What is your actual credence that there is a defensible sense in which a rational but computationally bounded agent can be made worse off in expectation by receiving cost-free information before a decision, where the harm goes beyond the mere cost of processing the information? Please give a single number and decompose the reasoning: how much rides on whether logical uncertainty or unawareness yields genuine counterexamples to the theorem; how much on whether ambiguity-sensitive or otherwise non-Bayesian agents can rationally prefer not to receive free information; how much on whether the notion of a rational bounded agent is determinate enough for the question to have a truth value; and any other factors you think belong. Then tell me which component your final number is most sensitive to, and what evidence or argument would move it most.
