prompt: |-
  I teach an intro philosophy elective to about 30 high school juniors, 90-minute block. We're hitting paradoxes next week and I want them to actually live through the surprise exam paradox rather than just hear me describe it and then watch them pretend to be confused for five minutes before someone checks their phone under the desk.

  Here's what I'm thinking: I set up a situation where something surprising is supposed to happen on one of several days, they can reason about it, and the reasoning leads them to conclude it can't happen — and then it does. The thing that happens has to have real stakes (not a grade, but something they actually care about) so the logic bites. Candy, a homework pass, first out the door for lunch, whatever.

  The tricky part is that I can't just announce "today we're doing the surprise exam paradox" or the whole thing is spoiled. They need to think they're doing something else, or that the announcement is genuine, and the paradox needs to emerge from their own reasoning. I also need to handle the kid who's heard of it before and blurts out the answer — ideally the structure makes that not matter.

  Give me the activity as exactly five phases, each described in a sentence or two, with no introduction or conclusion. The fifth phase should be the debrief: what questions I ask, what connections I make explicit, and what the predictable student objections are going to be and how to handle them. Also tell me honestly whether the whole thing falls apart if one kid has already heard of the paradox — and if so, what I do about it.
reasoning: |-
  We are going to set up the surprise exam paradox without naming it. We'll use a "surprise pop quiz" as the event. But note: we are not actually giving a real quiz that affects grades. We are using a reward system (candy) to simulate the stakes.

  Phase 1: The Setup
  Tell the class: "This week, we are going to have a surprise pop quiz on one of the next three class days (Monday, Wednesday, Friday). It will be a very short quiz, and if you pass, you get a piece of candy. The surprise part is that you won't know which day it is until the quiz starts."

  Phase 2: The Reasoning
  On the first day (Monday), after the opening routine, ask: "Who thinks the quiz could be today? Why or why not?" Let them discuss. Then, guide them to the paradox: 
  - If the quiz hasn't happened by Wednesday, then on Thursday morning they would know it must be on Friday (so not a surprise on Friday). 
  - Therefore, the quiz must happen by Wednesday. 
  - But then, if it hasn't happened on Monday, they would know on Tuesday it must be on Wednesday (so not a surprise). 
  - Therefore, the quiz must be on Monday. 
  - But then, if they know it must be on Monday, it's not a surprise.

  Phase 3: The Execution
  Do not give the quiz on Monday. On Wednesday, at the start of class, say: "I have decided that the quiz will be today. But because of our reasoning, you must have known it would be today. So it's not a surprise. Therefore, I cannot give it today." Then, on Friday, give the quiz as a surprise (even though they might have thought it was impossible). 

  Phase 4: The Reveal
  After the quiz (which is just one easy question, e.g., "What is the name of the paradox we just experienced?"), hand out candy to everyone who wrote anything. Then, explain that they just experienced the surprise exam paradox. Point out that the quiz happened on Friday, which they thought was impossible because they had ruled it out.

  Phase 5: The Debrief
  Ask: 
  1. "What was the logical argument that made us think the quiz couldn't happen?" 
  2. "But then it did. So what went wrong in our reasoning?" 
  3. "Is there a way to define 'surprise' that makes the argument work? Or is the definition the problem?" 
  4. "How does this connect to the idea of self-referential statements or circular reasoning?"

  Predictable objections:
  - "But we knew it would be on Friday!" -> Respond: "Did you? On Wednesday I said I couldn't give it then, so you thought it was off? Then on Friday, were you really expecting it? Or was it a surprise?"
  - "This is cheating because you changed the rules." -> Point out: the rules were always that the quiz would be on one of the three days and be a surprise. The reasoning led to a contradiction, so the reasoning must be flawed.

  Handling prior knowledge: If a student blurts out the paradox, say: "Exactly, that's the paradox we're going to experience. But let's see if we can avoid it with our reasoning." Then proceed. The structure still works because the reasoning is compelling and the actual event (the quiz on Friday) will still be a surprise if they get caught in the logic.

  Does it fall apart if one kid knows? Not entirely. The reasoning is still compelling and the class might still get caught in it. The quiz on Friday will still be a surprise because the teacher's statement on Wednesday (that they cannot give it that day) might lead everyone to think the quiz is off. So even if a student knows the paradox, the teacher's actions (canceling on Wednesday) might make them doubt, and then the Friday quiz is a genuine surprise.

  Alternative: If you are concerned about prior knowledge, change the number of days (use four days) or the event (e.g., a surprise homework pass given at the start of class). The structure remains the same.

  Important: The quiz on Friday must be very short and easy so that it doesn't cause anxiety and the candy reward is the focus. The goal is the experience of the paradox, not the quiz content.

  Now, the five phases without introduction or conclusion:

  Phase 1: Announce a surprise pop quiz on one of the next three class days (Monday, Wednesday, Friday) with a candy reward for passing.
  Phase 2: On Monday, facilitate a discussion leading to the paradoxical reasoning that the quiz cannot be a surprise on any day and therefore cannot happen.
  Phase 3: On Wednesday, announce that you cannot give the quiz that day because it wouldn't be a surprise, then on Friday give the quiz as a surprise.
  Phase 4: After the quiz, reveal that they have experienced the surprise exam paradox and distribute candy.
  Phase 5: Debrief by asking about the logical argument, why it failed, the definition of surprise, and connections to self-reference; address objections by pointing out the surprise on Friday and the consistency with the original rules.
answer: |-
  ### Phase 1: Setup and Announcement  
  Casually announce at the start of class: "This week, there’ll be one unannounced 'reward day' where everyone who’s present gets a homework pass—but it’ll be a total surprise, meaning you won’t see it coming the day before or that morning." Specify it must happen on Monday, Wednesday, or Friday of that week.  

  ### Phase 2: Student Reasoning  
  On Monday, prompt: "Could the reward be today? Why or why not? Discuss in pairs for 3 minutes." Guide them toward the paradox: If not Monday, it must be Wednesday or Friday; but if it’s Friday, you’d expect it Thursday night (not a surprise), so it must be Wednesday. But then if not Monday, you’d expect it Tuesday night, so it must be Monday—but then it’s expected, not a surprise. Conclude: "Seems impossible?"  

  ### Phase 3: Execution and Subversion  
  Skip Monday and Wednesday. On Wednesday, say: "I can’t do it today—you’d have guessed last night since Friday would be obvious." On Friday, abruptly hand out homework passes: "Surprise! Reward day is today."  

  ### Phase 4: Immediate Reaction  
  After distributing passes, ask: "Raise your hand if you truly didn’t see this coming today." Let them react—laugh, groan, or argue—then reveal: "What you experienced is the 'surprise exam paradox.' Logically, you 'proved' it couldn’t happen, yet it did."  

  ### Phase 5: Structured Debrief  
  **Questions:**  
  - "Where did our reasoning go wrong?" (Highlight: Self-reference—defining "surprise" includes assuming the reasoning is flawless.)  
  - "Is ‘surprise’ about certainty or probability?" (Connect: The paradox treats "knowing" as binary, but real life involves doubt.)  
  - "How does this mirror real-world logic traps, like predicting stock crashes?"  
  **Objections & Responses:**  
  - *"We knew Friday was possible!"* → "Did you *expect* it today? Or did Wednesday’s cancellation make you doubt it entirely?"  
  - *"You tricked us!"* → "True! But the rules held: It was a surprise *when it happened*, and on a valid day."  
  - *"The logic felt airtight!"* → "Exactly—the paradox exposes how self-defeating assumptions create false contradictions."  
  **Prior-Knowledge Fix:** If a student blurts the paradox early, say: "Great—now help me convince the class it’s impossible," leveraging their input to deepen the trap. The activity *doesn’t* fall apart: Even if they know it, the visceral "wait, but *I* didn’t expect it today" moment persists. For saboteurs, assign them to argue *for* the impossibility during Phase 2.
