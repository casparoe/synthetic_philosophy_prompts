prompt: |-
  I'm teaching a small section on experimental philosophy this term and two of my grad students got stuck in a debate at our study session that I honestly cant referee. They both accept the basic asymmetry — that people are much more likely to say an agent intentionally brought about a harmful side effect of a decision than a beneficial one, in cases where the agent foresaw the side effect, thought of it as a mere byproduct, and went ahead with the decision anyway — so that part isn't in dispute. Their fight is over what the asymmetry shows.

  Mara argues it shows that our concept of intentional action itself is morally contaminated. Her reasoning is that in the harm case and the help case the agent's mental states are roughly the same — same foreknowledge, same indifference — and the only thing that changes is the valence of the outcome, so the only thing that could drive the asymmetry is that moral evaluation is literally built into the concept. Intentional, on this view, is doing normative work rather than descriptive work. Dev pushes back and says this is the old contamination story and that its not needed: people are running a causal-inference process, and when we learn that an agent brought about a bad outcome, we infer she must have endorsed it or believed in it in a way we don't infer for a good outcome. So the difference, he says, is in the folk's inference, not in the concept — the two cases differ in the evidence, not in the criterion.

  Mara's reply is that the inference story just collapses back into the contamination story, because the very fact that bad outcomes count as evidence of the relevant mental states is itself a moral premise — we expect bad things to be done by people who intended them and good things to be done by people who didn't — and that expectation is normative, so normativity is still doing the work, just one layer down. Dev says that proves too much, because almost every folk-psychological inference is normatively flavored (we expect liars to lie, for instance) and nobody says that makes our concept of belief normative.

  Can you adjudicate this for me? I'd like a point-by-point verdict on who's right about which specific claim, and what, if anything, both of them are missing — in particular whether the inference account really is a separate hypothesis from the contamination account or just a relabeling of it, and whether there's a diagnosis of the asymmetry that neither of them has even considered.
reasoning: |-
  Okay, let me unpack this fascinating debate between Mara and Dev. The core asymmetry in experimental philosophy is clear: people judge harmful side effects as intentional more often than beneficial ones, even with identical foresight and indifference from the agent. But their interpretations diverge sharply.

  Mara's contamination theory grabs my attention first. She's arguing that the concept "intentional" itself has moral wiring—that we can't describe the action without moral evaluation seeping in. It's radical because it challenges the descriptive purity of folk-psychological concepts. Her point about valence being the only variable changing feels strong at first glance—if mental states are held constant, why else would judgments differ?

  Then Dev's causal-inference counter hits me. He's reframing the asymmetry as an epistemic glitch: bad outcomes trigger different mental-state inferences than good ones. The "it proves too much" objection is clever—if all expectation-based inferences were normative, even predicting liars would contaminate "belief." That resonates because folk psychology constantly blends descriptive and predictive elements.

  But Mara's recursion move stops me cold. She's saying Dev's "evidence" is morally tainted at the source—that the inference pattern itself relies on a normative expectation (bad actions imply endorsement). It's like accusing his scientific explanation of smuggling in the very thing it denies. 

  Where I hesitate: Dev might have a point about separable mechanisms. Neuroscience shows affect can skew probability estimations (bad outcomes feel more "meant"), which could be pre-conceptual. And cross-cultural work reveals the asymmetry isn't universal—some societies show weaker effects, suggesting it's not built into the concept itself but learned. 

  Neither mentions Knobe's later work where he argues normativity structures how we map mental states to actions—not contaminating "intentional" but shaping the attribution pathway. That feels like a third option: the concept stays descriptive, but its application bends toward normative salience. 

  Also flashing to Shaun Nichols' "affective resonance" idea—that negative outcomes trigger stronger motivation-attributions via emotional arousal. If true, Dev's inference story could be mechanistic without being conceptual. 

  My verdict crystallizes: Mara wins that normativity permeates the process, but loses on it being conceptual contamination. Dev wins that inference is the vehicle, but undersells how deeply normative the inferential rules are. The real gap? Both neglect that evolutionarily, spotting harmful intent might have priority—making the asymmetry a bug in one context, a feature in another.
answer: |-
  Here's a point-by-point adjudication of Mara and Dev's debate, identifying where each is correct, where their arguments falter, and what they might be missing:

  ### **Core Arguments & Verdicts**
  1. **Mara's Contamination Claim: "Intentional" is Morally Loaded**  
     - *Her Strength*: Correct that the *only* variable changing is outcome valence (harm/help), yet judgments differ radically. This strongly suggests moral evaluation directly shapes the *application* of the concept.  
     - *Her Weakness*: Overstates that "intentional" itself is *conceptually* normative. The asymmetry might reflect how we *apply* the concept (driven by context) rather than redefining its core meaning.  
     - **Verdict: Partly right.** Morality deeply influences intentionality judgments, but it may not prove the *concept itself* is morally contaminated.  

  2. **Dev's Inference Claim: Asymmetry Stems from Causal Reasoning**  
     - *His Strength*: Correct that bad outcomes trigger stronger inferences about the agent's endorsement (e.g., "they must have wanted it"). This aligns with evidence that people adjust mental-state attributions based on outcomes (e.g., *blame-validation*).  
     - *His Weakness*: Underestimates *why* harm triggers unique inferences. The inference pattern ("bad outcomes → endorsement") isn’t morally neutral—it’s rooted in normative expectations.  
     - **Verdict: Partly right.** The asymmetry involves inferences, but these inferences are morally saturated.  

  3. **Mara’s Rebuttal: "Inference Collapses into Contamination"**  
     - **Verdict: Largely correct.** Dev’s "causal-inference" story relies on a moral heuristic: *We expect people to intend harm but not help*. This heuristic *is* normative (e.g., assuming harm requires intentionality). Thus, normativity drives the inference, making it a subtype of contamination (see §4 below).  

  4. **Dev’s "Proves Too Much" Objection**  
     - **Verdict: Incorrect.** Not all folk-psychological inferences are morally loaded. While *some* inferences have normative flavor (e.g., "liars lie"), the asymmetry is special:  
       - **Moral specificity**: Harm/help asymmetries don’t generalize to non-moral domains (e.g., calling a side effect "intentional" if it stains a carpet vs. cleans it).  
       - **Directionality**: We *only* see asymmetric inferences for morally valenced outcomes. Dev’s "liar" example is symmetric (we expect liars to lie; truth-tellers to tell truth).  

  ---

  ### **Key Dispute: Is "Inference" Distinct from "Contamination"?**  
  - **No, they are not meaningfully distinct.**  
    - Dev’s "inference" account describes *how* the asymmetry manifests (via mental-state attributions), but Mara’s "contamination" explains *why* those inferences occur (moral norms shape what counts as evidence).  
    - **Example**: Learning that an outcome is harmful *is* treated as evidence of intent *because* of a background norm: "Agents are responsible for avoiding foreseeable harm." This norm makes harm morally diagnostic in a way benefit is not.  
    - **Conclusion**: Dev’s inference process is the *mechanism*, but moral contamination is the *engine* driving it.  

  ---

  ### **What Both Are Missing: Overlooked Perspectives**  
  1. **Knobe’s Later "Normative Standards" Account**  
     - Neither addresses Knobe’s refinement: The asymmetry arises because moral norms define what counts as "having a reason" to act. Harm violates a norm, so *any* action causing harm implies the agent saw it as *sufficiently reason-giving*—making it "intentional." Benefit doesn’t trigger this because helping is optional.  
     - **Implication**: The concept "intentional" remains descriptive, but its *conditions of application* are normatively governed.  

  2. **Pragmatic/Communicative Factors**  
     - Judgments may reflect conversational pragmatics. Saying "they harmed intentionally" *implicates condemnation* (implying the act was unjustifiable), while "they helped intentionally" is pragmatically redundant (helping needs no justification). This isn’t conceptual contamination but social signaling.  

  3. **Affective vs. Cognitive Primacy**  
     - Evidence suggests negative outcomes trigger faster, affect-driven processing (e.g., disgust amplifies intent attributions), while positive outcomes involve deliberative reasoning. The asymmetry might stem from cognitive architecture, not just concepts/inferences.  

  4. **Cross-Cultural Variation**  
     - Asymmetry strength varies across cultures (e.g., weaker in Hindi speakers, Tibetan Buddhists). If "intentional" were inherently morally contaminated, we’d expect universality. Variation suggests the asymmetry is culturally scaffolded, not conceptual.  

  ---

  ### **Final Diagnosis**  
  - **Mara wins** on the big picture: Normativity is indispensable to explaining the asymmetry. The inference process Dev describes is *itself* morally loaded.  
  - **Dev wins** on mechanism: The asymmetry operates through mental-state inferences (not direct conceptual redefinition).  
  - **Both lose** by overlooking alternatives: The asymmetry likely arises from **norm-structured application conditions** (per Knobe) and **pragmatic communication**, not conceptual contamination *or* neutral inferences.  

  **Recommendation for your students**: Frame the debate as complementary: Inference is the *vehicle*; moral norms are the *fuel*. Explore Knobe’s "normative standards" model and cross-cultural data to break the stalemate.
