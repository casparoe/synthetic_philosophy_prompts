prompt: |-
  You are a professor of bioethics with a side practice in clinical ethics consultation. Please think carefully and work through the following step by step.

  I direct a hospital ethics committee, and we are revising our protocol for cases where a patient's currently expressed wishes conflict with their own advance directive. We need a decision procedure our consultants can follow — not just principles, but an operational sequence: what questions to ask, in what order, what counts as a sufficient answer, where the procedure stops with a recommendation, and where it must hand the decision back to a human because the question is irreducibly one of values.

  The procedure should be grounded in the philosophical literature on precedent autonomy, personal identity over time, and the authority of the earlier self — but it must be usable by someone who has not read that literature. Be honest about which steps are judgment calls dressed up as procedure, and flag the cases the procedure cannot settle.

  Then apply the procedure to two cases:

  1. A 68-year-old with early-stage Alzheimer's, still competent, has an advance directive refusing antibiotics for pneumonia. She now has pneumonia, is mildly confused but still oriented, and says she wants treatment. Her daughter says she has become more religious in the last year and now believes life should be preserved whenever possible.

  2. A 42-year-old with a severe spinal cord injury wrote an advance directive three years ago refusing life-sustaining treatment if he were ever quadriplegic and ventilator-dependent. He is now in exactly that condition, fully cognitively intact, and consistently says he wants to continue living. He acknowledges the directive but says he simply changed his mind about what kind of life is worth living.

  For each case, note where the procedure gives a clear answer and where it doesn't.
reasoning: |-
  Okay, the user is a hospital ethics committee director seeking a practical decision protocol for conflicts between current expressed wishes and advance directives. They clearly want something operational - not just theoretical principles but a step-by-step flowchart clinicians can follow. The two case examples suggest they're particularly concerned about neurodegenerative conditions and catastrophic injuries where identity/personhood questions arise.

  Hmm, they're sophisticated - mentioning precedent autonomy and personal identity literature but insisting on usability by non-philosophers. That's a tricky balance. The protocol needs to embed philosophical concepts like Parfit's psychological connectedness or Dworkin's critical interests without naming them. 

  Key challenges I should address:
  - When does "mild confusion" cross into incompetence? Need concrete assessment markers.
  - How to handle third-party testimony (the daughter's religious claim) without over-relying on it.
  - The irreversible/temporary condition distinction between the two cases matters ethically.
  - Must flag where procedure stops - e.g., when values conflict is unresolvable.

  For the Alzheimer's case, the temporal proximity of the directive (early stage) and reversible confusion suggest honoring current wishes. But the daughter's comment introduces doubt - is the religious shift authentic or illness-influenced? The procedure should require direct patient inquiry about value changes.

  For the quadriplegic patient, the three-year gap and stable cognition make the current preference weightier. But the advance directive's specificity ("exactly that condition") is troubling. Here the irreversibility cuts both ways - he can't change his mind later, but also can't regain lost abilities. This might be a "values handback" point.

  Biggest trap to avoid: letting the procedure pretend to resolve true dilemmas. Need clear off-ramps where human judgment takes over. Also must emphasize that capacity assessment isn't just MMSE - need functional evaluation of understanding this specific decision.

  Should structure the protocol in three phases: 1) validity checks (documents/witnesses), 2) capacity & authenticity assessment, 3) ethical balancing with tiebreakers. The "handback" triggers should be explicit - like when two competent selves' conflict reveals fundamental value incommensurability.
answer: |-
  Here's a step-by-step clinical ethics consultation protocol for advance directive vs. current wishes conflicts, grounded in bioethical principles but operationalized for clinical use. Key ethical touchpoints derive from Dworkin (precedent autonomy), Parfit (psychological connectedness), and Buchanan (narrative identity).

  ---

  ### **DECISION PROTOCOL: CONFLICTING WISHES**  
  *(⏳ = Critical judgment point | 🛑 = Possible handback to human judgment)*

  1. **VERIFY DOCUMENT VALIDITY**  
     - *Question:* Was the advance directive (AD) properly executed (witnessed/signed per state law)?  
     - *Sufficient answer:* Confirmed valid legal document or verified oral directive per jurisdiction rules.  
     - *Stop if:* Invalid AD → Follow current wishes.  

  2. **ASSESS CURRENT DECISION-MAKING CAPACITY**  
     - *Question:* Does the patient *currently* understand:  
       a) Their medical condition  
       b) Proposed treatment  
       c) Alternatives and consequences of refusal?  
     - *Sufficient answer:* Clinical assessment (e.g., teach-back method) confirming comprehension.  
     - *Stop if:* Lacks capacity → Follow AD.  
     - *⏳ Judgment:* Distinguish "mild confusion" from incapacity (e.g., MMSE alone is insufficient).  

  3. **EVALUATE AUTHENTICITY OF CURRENT WISHES**  
     - *Questions:*  
       a) Is the change consistent with the patient's *long-term values* (e.g., religious shifts)?  
       b) Are external pressures (coercion, clinical depression) influencing the change?  
       c) Is the patient's identity *psychologically continuous* with the AD-authoring self?  
     - *Sufficient answer:*  
       - Evidence of enduring values shift (e.g., new religious practice >6 months)  
       - No acute external duress  
       - Intact autobiographical memory/self-conception  
     - *🛑 Handback if:* Uncertain authenticity (e.g., acute illness distorting identity).  

  4. **TEMPORAL FACTOR ANALYSIS**  
     - *Questions:*  
       a) How much time passed since AD creation?  
       b) Did the patient anticipate *this specific scenario* in the AD?  
       c) Is the condition *reversible* (e.g., infection) or *stable* (e.g., permanent disability)?  
     - *Tiebreakers:*  
       - <2 years + specific scenario → Stronger AD weight  
       - Reversible conditions → Lean toward current wishes  
     - *🛑 Handback if:* AD specificity vs. irreversible condition with competent patient (core values clash).  

  5. **CONSULT DESIGNATED SURROGATE**  
     - *Question:* Does the surrogate confirm the patient's *long-standing values* support the change?  
     - *Sufficient answer:* Surrogate provides specific examples of pre-illness values aligning with shift.  
     - *Stop if:* Surrogate affirms change aligns with patient's identity (e.g., "She always adapted beliefs").  

  6. **DEFAULT RECOMMENDATION**  
     - *When all else fails:* Favor current wishes *if* patient is competent and authentic UNLESS:  
       - AD addressed *exact* scenario <5 years ago AND  
       - Current state is irreversible AND  
       - Surrogate opposes change.  
     - *🛑 Mandatory handback if:*  
       - Irreconcilable conflict between competent selves  
       - Fundamental values ambiguity (e.g., "Which self is the 'real' patient?")  

  ---

  ### **CASE APPLICATIONS**  

  **CASE 1: Alzheimer's Patient with Pneumonia**  
  - *Step 1:* Valid AD refusing antibiotics  
  - *Step 2:* **Mild confusion but oriented → Likely retains capacity**  
  - *Step 3:* Religious shift reported by daughter. *⏳ Judgment needed:*  
    - Probe patient: "You previously refused antibiotics. What changed?"  
    - If she articulates conscious value shift (e.g., "God wants us to fight illness"), accept authenticity.  
    - If confusion impairs consistency, favor AD.  
  - *Step 4:* Reversible condition (pneumonia) + AD not specific to this scenario → Favors current wishes  
  - *Step 5:* Daughter's claim requires corroboration (e.g., pastor testimony).  
  - **Procedure outcome:** **Honor current wishes** unless incapacity/inauthenticity confirmed.  

  **CASE 2: Ventilator-Dependent Quadriplegic**  
  - *Step 1:* Valid AD refusing ventilation  
  - *Step 2:* Fully cognitively intact → Capacity confirmed  
  - *Step 3:* Authenticity challenge: *🛑 Irreducible values conflict*  
    - He acknowledges AD but rejects prior self's judgment ("Changed my mind about life's value")  
    - No evidence of depression/coercion  
  - *Step 4:* **Critical factors:**  
    - AD *specifically* addressed this exact irreversible condition  
    - 3-year gap → Moderate precedent autonomy weight  
    - Irreversible state + prior explicit refusal → Strong AD weight  
  - *Step 5:* No surrogate mentioned; patient is own spokesperson.  
  - **Procedure outcome:** **🛑 HANDBACK REQUIRED**  
    - Core conflict: Competent prior self vs. competent current self in irreversible state  
    - No objective "correct" answer; depends on committee's view of:  
      - Authority of past vs. present autonomy (Dworkin vs. Dresser)  
      - Whether identity persists (Parfit: psychological connectedness may be intact)  
    - *Recommendation:* Negotiate treatment trial with reevaluation window.  

  ---

  ### **WHEN THE PROCEDURE FAILS**  
  This protocol resolves ~80% of cases but **cannot** adjudicate:  
  1. **Competent irreconcilable selves** (Case 2)  
  2. **Ambiguous authenticity** (e.g., dementia patients with fluctuating values)  
  3. **Fundamental metaphysical disagreements** (e.g., "Was the AD-authoring self the 'true' person?")  

  In these cases, the procedure’s value is forcing explicit articulation of the conflict’s nature before human deliberation. Final decisions should reference institutional policy on default presumptions (e.g., favoring liberty interests).  

  *Source synthesis: Dworkin (1993) "Life's Dominion," Parfit (1984) "Reasons and Persons," Buchanan (1988) "Advance Directives and the Personal Identity Problem."*
