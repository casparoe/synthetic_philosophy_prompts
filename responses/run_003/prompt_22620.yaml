prompt: |-
  I have spent most of my professional life in observational geophysics, and it is only in retirement that I have been able to take up the philosophy of science in earnest. I am currently working my way through a short course on Bayesian epistemology, and I have become stuck on what is usually called the problem of old evidence, which I find considerably more subtle than the expositions I have read suggest. Consider, for instance, the anomalous precession of Mercury's perihelion: the data were catalogued and puzzling for decades before general relativity arrived, and when Einstein's theory was published it appeared to explain them beautifully. The standard objection runs that since the evidence E was already known, P(E) = 1, and Bayes's theorem then seems to collapse into P(H|E) = P(H), so the old data contribute nothing to the confirmation of H. That conclusion strikes me as deeply counterintuitive — in practice, the pre-existing observations on Mercury plainly made the new theory more credible than it was before. Could you walk me through the precise mechanics of this puzzle? In particular, I would be grateful for (i) a careful derivation of why ordinary conditionalization on E is confirmationally neutral, (ii) an explanation of why Jeffrey-style probabilistic conditioning, which is designed precisely to handle uncertain evidence, does not by itself rescue the case, (iii) a discussion of what role, if any, the agent's background knowledge and the way E was obtained might play — for example, whether it matters that E was discovered for reasons independent of H — and (iv) a brief survey of the main proposed solutions in the literature, with your own assessment of which appears most promising. I would appreciate an account that is precise enough for someone comfortable with the notation, but that does not drown in formalism; I am after the conceptual structure of the problem as much as the algebra.
reasoning: |-
  We are addressing the problem of old evidence in Bayesian epistemology. The problem is that when evidence E is already known (so that P(E)=1), then according to Bayes' theorem, the posterior probability of a hypothesis H given E equals the prior probability of H, i.e., P(H|E) = P(H). This suggests that old evidence cannot confirm a new hypothesis. But intuitively, old evidence does confirm a new hypothesis that explains it (like Mercury's perihelion for general relativity). We'll break down the problem as requested.

  (i) **Why ordinary conditionalization on E is confirmationally neutral when E is old (i.e., P(E)=1):**

  Bayes' theorem states:
      P(H|E) = [P(E|H) * P(H)] / P(E)

  If E is already known (old evidence), then we have assigned probability 1 to E. That is, P(E) = 1. Also, because E is known, the probability of E conditional on H, P(E|H), must also be 1 (since if we condition on H, we still know E). Therefore:

      P(H|E) = [1 * P(H)] / 1 = P(H)

  Hence, the posterior equals the prior, and there is no change in the probability of H upon conditionalizing on E.

  This is the standard derivation. The intuition is that conditionalization is an update rule for when we learn new evidence. If we already know E, then learning E again doesn't change our beliefs.

  (ii) **Why Jeffrey conditionalization doesn't by itself rescue the case:**

  Jeffrey conditionalization is a generalization of Bayesian updating for when we are uncertain about the evidence. Instead of setting P(E)=1, we assign a new probability distribution over a partition of the evidence space. However, in the case of old evidence, we are certain about E (we know it). So if we are certain, then the Jeffrey update would still assign probability 1 to E and 0 to its alternatives. Therefore, the update would reduce to ordinary conditionalization, and we get the same result: P(H|E) = P(H).

  Moreover, if we tried to artificially make P(E) less than 1 (by pretending we are uncertain about E even though we are not), that would be an inaccurate representation of our actual epistemic state. We are in fact certain about E. So Jeffrey conditionalization does not provide a way out.

  (iii) **The role of background knowledge and the independence of E's discovery:**

  The problem of old evidence is deeply tied to the agent's background knowledge. In particular, at the time when the hypothesis H is proposed, the agent's current probability function already has P(E)=1. However, we can consider a counterfactual scenario: what if we had not known E? Then we would assign a probability less than 1 to E, and then conditionalizing on E would boost the probability of H.

  This counterfactual reasoning suggests that the confirmation of H by E is not captured by the agent's current probability function but by comparing the current function with a hypothetical one in which E was not known. This leads to the idea of "de-idealizing" the agent's knowledge.

  Additionally, it might matter that E was discovered independently of H. In the case of Mercury, the data were known before H (general relativity) was proposed. This independence ensures that the evidence wasn't tailored to fit the hypothesis. However, in the Bayesian framework, the issue is that we have already updated on E, so we cannot update again.

  (iv) **Main proposed solutions:**

  1. **Counterfactual Approach (Garber, Jeffrey, and others):** The idea is to consider a hypothetical prior probability function in which E is not known (so P_old(E) < 1). Then we update by conditionalizing on E to see how much H is confirmed. The challenge is to specify what this hypothetical prior should be. We must remove the knowledge of E, but how much else should we remove? Also, we might need to remove the logical consequences of E that we have already incorporated. This approach is popular but requires careful handling to avoid arbitrary choices.

  2. **Logical Approach (Glymour):** Glymour (in his critique of Bayesianism) suggests that the problem reveals a flaw in Bayesianism. He argues that the Bayesian must either deny that old evidence can confirm (which is counterintuitive) or resort to counterfactual priors. Glymour's own solution is to use a bootstrapping method, but that is not Bayesian.

  3. **New Theory Approach (Zahar):** Elie Zahar proposed that when a new theory explains old evidence, the confirmation comes from the fact that the theory was not designed to fit that evidence. So we can use a prior that does not take into account the evidence E when evaluating H. This is similar to the counterfactual approach.

  4. **Changing the Probability Function (Howson and Urbach):** They suggest that when we learn a new hypothesis H, we might need to revise our entire probability function, including the assignment to E. In particular, we might realize that our background knowledge did not entail E, and so we can set P(E) to less than 1. However, this requires a non-Bayesian revision of the probability function.

  5. **The Knowledge Revision Approach (Norton):** John Norton has proposed that we should think of the old evidence as being explained by the new hypothesis, which might lead us to reassess the probability of E in light of H. But this is not standard Bayesian conditionalization.

  6. **The Solution by Learning the Explanatory Connection (Garber):** Daniel Garber proposed that what we learn is not E (which we already know) but the logical or explanatory connection between H and E. That is, we learn that H entails E (or makes E highly probable). Then we update on the proposition that H implies E. This avoids setting P(E)=1 in the update. Let me denote S: "H entails E". Then we update on S. The prior for S might be less than 1 (we didn't know that H would explain E). Then:

      P_new(H) = P_old(H | S)

  This can be expanded by Bayes' theorem for S:

      P_old(H | S) = [P_old(S | H) * P_old(H)] / P_old(S)

  If H entails E, then P_old(S | H) = 1 (if we assume that if H is true, then it does entail E). But note that we might not have known that H entails E until we developed H. So P_old(S) might be less than 1. Therefore, we get:

      P_new(H) = [1 * P_old(H)] / P_old(S) = P_old(H) / P_old(S)

  Since P_old(S) < 1, this increases the probability of H. Moreover, we can also consider that E might be entailed by other hypotheses, so the denominator P_old(S) might be set by how surprising it is that H explains E.

  This solution is attractive and avoids counterfactual priors. However, it requires that we formalize the proposition S and assign a prior probability to it. This can be tricky because S is a logical fact, and Bayesianism typically deals with empirical probabilities. But if we allow logical uncertainty, then it can work.

  **Assessment:**

  The Garber approach (learning the explanatory connection) is one of the most promising. It allows us to update on new information (the connection between H and E) without having to forget E. This update is done within the current probability function. However, it does require extending Bayesianism to handle logical learning.

  The counterfactual approach is also widely used but requires careful construction of the hypothetical prior. It is more conservative in that it doesn't require new types of updates, but it can be seen as less objective because the choice of hypothetical prior is subjective.

  In practice, many Bayesians use a mix of these ideas. For the case of Mercury, the account would go: when Einstein proposed general relativity, what was new was not the perihelion data (which were old) but the realization that his theory predicted exactly that anomaly. This realization is the new evidence (the proposition that GR entails the perihelion advance) and that is what we update on.

  **Conclusion:**

  The problem of old evidence is a challenge to Bayesian confirmation theory. It shows that the standard update rule cannot account for the confirmation of a hypothesis by evidence that is already known. The most promising solutions involve either updating on the discovery of the explanatory connection (Garber) or using a counterfactual prior. Both have their challenges, but they preserve the intuition that old evidence can confirm a new hypothesis.
answer: |-
  ### The Problem of Old Evidence: A Detailed Analysis

  You've pinpointed a profound challenge in Bayesian epistemology: how can evidence already known (e.g., Mercury's perihelion precession) confirm a new hypothesis (e.g., general relativity) when Bayesian updating appears to render it inert? I'll address your queries systematically, combining conceptual clarity with precise formalism.

  ---

  ### **(i) Why Ordinary Conditionalization on \(E\) is Confirmationally Neutral**
  **Bayes' Theorem** states:  
  \[
  P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}
  \]

  When \(E\) is old evidence (already known), the agent assigns \(P(E) = 1\) (certainty). Additionally, since \(E\) is true, \(P(E|H)\) must be 1 if \(H\) entails \(E\) (or if \(H\) doesn't contradict \(E\), which it wouldn't, as \(E\) is a fact). Thus:  
  \[
  P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)
  \]

  **Derivation of Neutrality**:  
  1. **Prior probability of \(H\)**: \(P(H)\)  
  2. **Posterior after learning \(E\)**: \(P(H|E) = P(H)\)  
  3. **Confirmation measure**: The difference \(P(H|E) - P(H) = 0\) (no change).  

  **Why this seems unavoidable**:  
  - Bayesian updating is *diachronic*: it models belief change when **new** evidence is acquired.  
  - If \(E\) is already in the background knowledge \(\mathcal{K}\), conditioning on it redundantly updates on what is certain.  
  - **Key insight**: The likelihood \(P(E|H)\) becomes irrelevant because \(P(E) = 1\) dominates.  

  **Counterintuitive consequence**:  
  Einstein's derivation of Mercury's precession from GR intuitively confirmed GR, yet \(P(\text{GR}|\text{precession}) = P(\text{GR})\) under standard conditioning.

  ---

  ### **(ii) Why Jeffrey Conditionalization Fails to Resolve the Issue**
  **Jeffrey conditionalization** handles uncertain evidence by updating to a new probability \(P^*(E) = q\) (where \(0 < q < 1\)) without full certainty. The update rule is:  
  \[
  P^*(H) = P(H|E) \cdot q + P(H|\neg E) \cdot (1 - q)
  \]

  **Why it doesn't work for old evidence**:  
  1. **Certainty of \(E\)**: For old evidence, \(q = P^*(E) = 1\) (the agent is certain). Substituting \(q = 1\):  
     \[
     P^*(H) = P(H|E) \cdot 1 + P(H|\neg E) \cdot 0 = P(H|E)
     \]  
     But as shown in (i), \(P(H|E) = P(H)\) when \(P(E) = 1\).  
  2. **Artificial uncertainty?**: If we force \(q < 1\) (pretending uncertainty about \(E\)), we misrepresent the agent's epistemic state. This is inadmissible because:  
     - The agent **knows** \(E\) (e.g., Mercury's data are empirically established).  
     - \(P(H|\neg E)\) may be undefined or inconsistent with \(\mathcal{K}\) (since \(E\) is true).  

  **Conclusion**: Jeffrey conditioning reduces to ordinary conditioning when evidence is certain, so it cannot bypass the problem.

  ---

  ### **(iii) Role of Background Knowledge and Independence of \(E\)**
  #### **Background knowledge (\(\mathcal{K}\))**  
  - \(\mathcal{K}\) includes all established facts (e.g., Mercury's precession, Newtonian mechanics).  
  - When \(H\) is proposed, \(E \in \mathcal{K}\), so \(P(E) = 1\) is fixed by \(\mathcal{K}\).  
  - **Problem**: \(\mathcal{K}\) may contain logical/mathematical truths implying \(E\). Removing \(E\) from \(\mathcal{K}\) risks incoherence.

  #### **Independence of \(E\)'s discovery**  
  - **Why it matters**: If \(E\) was discovered *independently* of \(H\) (e.g., Mercury's data predated GR by decades), \(H\)'s ability to explain \(E\) seems confirmatory.  
  - **Bayesian challenge**: Independence (in the causal sense) doesn't alter \(P(E) = 1\). However:  
    - **Temporal asymmetry**: \(H\) is proposed *after* \(E\), so \(E\) couldn't be "used" to construct \(H\).  
    - **No ad-hocness**: \(H\) isn't tailored to fit \(E\), making the explanation surprising.  
  - **Formalizing independence**:  
    - Let \(H_{\text{new}}\) be GR, and \(E\) Mercury's data.  
    - \(P(E | \mathcal{K} \setminus \{E\})\) should be low under pre-GR physics (Newtonian mechanics + perturbations).  
    - But once \(E \in \mathcal{K}\), we can't compute \(P(E | \mathcal{K} \setminus \{E\})\) without counterfactuals.  

  **Epistemic tension**:  
  - The confirmatory power arises from comparing **actual** \(\mathcal{K}\) to a **hypothetical** \(\mathcal{K}'\) where \(E\) is unknown.  
  - Bayesianism lacks tools for this comparison within a single probability framework.

  ---

  ### **(iv) Proposed Solutions and Assessment**
  Solutions aim to reconcile intuition with Bayesian machinery. I classify them by strategy:

  #### **1. Counterfactual Prior Approach**  
  - **Idea** (Howson, Garber): Calculate confirmation using a prior from which \(E\) is *removed*.  
  - **Mechanics**:  
    - Define \(P_{\text{cf}}\) where \(P_{\text{cf}}(E) < 1\) and \(P_{\text{cf}}(E|\mathcal{K} \setminus \{E\})\) reflects pre-discovery uncertainty.  
    - Update \(P_{\text{cf}}\) with \(E\) to get \(P_{\text{cf}}(H|E)\).  
    - Confirmation = \(P_{\text{cf}}(H|E) - P_{\text{cf}}(H)\).  
  - **Example for Mercury**:  
    - \(P_{\text{cf}}\) represents an 1850s astronomer (pre-Le Verrier).  
    - \(P_{\text{cf}}(E)\) is low (unexpected under Newtonian theory).  
    - GR predicts \(E\), so \(P_{\text{cf}}(E|H) \approx 1\), giving high likelihood ratio \(P_{\text{cf}}(E|H)/P_{\text{cf}}(E)\).  
  - **Challenges**:  
    - How to formally "remove" \(E\) from \(\mathcal{K}\) without altering logical dependencies?  
    - Subjectivity in constructing \(P_{\text{cf}}\).  

  #### **2. Learning Logical/Explanatory Connections**  
  - **Idea** (Garber, Jeffrey): What’s learned is not \(E\) but \(S \equiv\) "\(H\) entails \(E\)".  
  - **Mechanics**:  
    - \(S\) is a new proposition: "\(H \models E\)" or "\(P(E|H) \approx 1\)".  
    - Update on \(S\): \(P_{\text{new}}(H) = P_{\text{old}}(H | S)\).  
    - Use Bayes' theorem: \(P(H|S) = \frac{P(S|H) \cdot P(H)}{P(S)}\).  
    - If \(H\) entails \(S\) (since \(H \models E\) implies \(S\)), then \(P(S|H) = 1\), so:  
      \[
      P(H|S) = \frac{P(H)}{P(S)} > P(H) \quad \text{(if } P(S) < 1\text{)}.
      \]  
  - **Example for Mercury**: Einstein showed \(S =\) "GR entails the precession".  
    - Pre-1915, \(P(S) < 1\) (no theory predicted \(E\) exactly).  
    - Learning \(S\) raises \(P(\text{GR})\).  
  - **Advantages**:  
    - Avoids counterfactuals; updates on *new* information.  
    - Formalizes the "aha!" moment of understanding.  
  - **Challenges**:  
    - Requires assigning priors to logical facts (non-empirical).  
    - \(P(S)\) may be elusive (how probable is it that GR explains \(E\)?).  

  #### **3. Non-Propositional/Schema-Based Approaches**  
  - **Idea** (Sprenger, Hartmann): Treat \(E\) as an instance of a larger schema (e.g., "GR solves all \(n\)-body anomalies").  
  - **Mechanics**:  
    - Let \(E\) be one outcome of a test schema \(T\).  
    - Update on \(T\)'s success: \(P_{\text{new}}(H) = P_{\text{old}}(H | T)\).  
    - \(P(T|H)\) is high if \(H\) predicts *novel* successes, but \(T\) includes old \(E\).  
  - **Challenges**:  
    - Ad-hoc schema definition.  
    - Still relies on counterfactual support for \(T\).  

  #### **4. Changing the Probability Space**  
  - **Idea** (van Fraassen): Reassign probabilities to reflect \(H\)'s *explanatory role*.  
  - **Mechanics**:  
    - Adopt a probability \(P'\) where \(P'(E) < 1\) *after* learning \(H\).  
    - Violates standard Bayesianism; requires dynamic probability spaces.  
  - **Challenges**:  
    - Lacks rigor; risks inconsistency.  

  ### **Assessment and Recommendation**  
  - **Most promising**: **Garber's approach (learning \(S\))**.  
    - **Why**: It captures the epistemic novelty (the derivation itself) without ignoring \(E \in \mathcal{K}\). Einstein's breakthrough wasn't discovering \(E\) but deriving it from GR.  
    - **Feasibility**: Requires extending Bayesianism to logical learning, but tools like "logical uncertainty" exist.  
  - **Runner-up**: **Counterfactual priors**.  
    - **Why**: Intuitive for historical cases (e.g., Mercury).  
    - **Caution**: Construction of \(P_{\text{cf}}\) must avoid cherry-picking.  
  - **Avoid**: Non-Bayesian fixes (e.g., abandoning probability kinematics).  

  **Key Philosophical Insight**:  
  The problem exposes a tension in Bayesianism:  
  - **Static view**: Probability reflects current knowledge (\(E\) is fixed).  
  - **Dynamic view**: Confirmation requires modeling *ignorance removal*.  
  Successful solutions must bridge these, often by updating on *meta-information* (e.g., \(S\)) or counterfactuals.

  ---

  ### **Conclusion**
  The problem of old evidence challenges Bayesianism's core mechanics but doesn't refute it. The confirmatory power of Mercury's precession for GR arises not from re-learning \(E\), but from:  
  1. **Counterfactual surprise**: \(E\) was unlikely under pre-GR physics.  
  2. **Explanatory discovery**: Learning that GR entails \(E\) (Garber's \(S\)).  

  For your work: Focus on Garber's approach. It aligns with scientific practice—e.g., physicists emphasize derivation, not data-recollection. Formally:  
  - Let \(S\) be "\(H \vdash E\)" (with logical uncertainty).  
  - Update \(P(H)\) to \(P(H|S) = P(H)/P(S)\).  
  This preserves Bayesian structure while honoring the role of old evidence.  

  If you explore this further, I recommend Garber's *Old Evidence and Logical Omniscience* (1983) and Howson & Urbach's *Scientific Reasoning* (Ch. 15). The subtleties you perceive are real—this remains a live debate!
