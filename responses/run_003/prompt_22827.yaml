answer: |-
  You're wading into deep philosophical waters here! Your friend's reductionist view is understandable—after all, both problems involve non-existent entities—but philosophers treat them as distinct for very good reasons. While they're related, the Paradox of Fiction tackles a fundamentally different set of challenges than the Problem of Empty Names. Here's the breakdown:

  **1. The Core Problems: What's Actually Being Asked?**

  *   **Problem of Empty Names (e.g., "The Present King of France"):**
      *   **Focus:** **Reference, Truth, and Meaning.**
      *   **Question:** How can a word or phrase *refer* to something that doesn't exist? What is the *truth value* of statements containing such names (e.g., "The present King of France is bald")? How do these names acquire *meaning* if they lack a referent?
      *   **Examples:** "Vulcan" (Le Verrier's hypothetical planet), "Santa Claus," "Sherlock Holmes" (when analyzed purely as a referring term outside a fictional context).
      *   **Solutions (Philosophy of Language):** Descriptivism (Russell), Pretense/Figurative Speech (Searle, Walton), Meinongianism (non-existent objects *do* have a kind of being), Direct Reference Theories with Causal Chains (Kripke, even for fictions), Fictionalism.

  *   **Paradox of Fiction (e.g., Feeling Sad for Anna Karenina):**
      *   **Focus:** **Emotion, Psychology, and Rationality.**
      *   **Question:** How can we experience genuine, rational emotions (like fear, sadness, pity, admiration) towards characters or situations we *know* to be fictional? Doesn't this require belief in their existence (which we lack) and/or that they are real objects of concern (which they aren't)?
      *   **Examples:** Crying at the end of *Toy Story 3*, feeling suspense during a horror movie, admiring the courage of a fictional hero.
      *   **The "Paradox" Components (Radford/Weston):**
          1.  We experience genuine emotions towards fictional characters/situations.
          2.  To experience these emotions, we must believe the characters/situations exist and are real objects of concern.
          3.  We do *not* believe fictional characters/situations exist or are real objects of concern.
      *   *All three seem plausible, but they form a contradiction.*

  **2. Why They Are Distinct Problems:**

  *   **Different Phenomena Explained:** Empty names concern *linguistic acts* (how we talk *about* non-existents). The paradox concerns *psychological states* (how we *feel* about non-existents). You can solve the linguistic problem without touching the emotional one, and vice versa.
  *   **The Belief Requirement:** The paradox *hinges* on the claim that genuine emotion requires belief in the *existence* and *reality of the threat/object*. This is a specific claim about the nature of emotion, not directly about reference or meaning. Solutions to empty names don't automatically dissolve this emotional requirement. Even if we perfectly explain how "Anna Karenina" refers (or doesn't refer), it doesn't explain why knowing she's fictional doesn't stop us from *feeling* for her.
  *   **Nature of the Object:** While both involve non-existents, the paradox specifically deals with entities presented *as real within a fictional world* that we engage with *imaginatively*. Empty names can refer to purely hypothetical entities (Vulcan), mythical entities (Zeus), or fictions *mentioned dispassionately*. The paradox arises from our *engagement* with a narrative.
  *   **Different Solution Sets:**
      *   **Empty Names:** Solved by theories of reference, meaning, and truth.
      *   **Paradox of Fiction:** Solved (or dissolved) by theories of:
          *   **Emotion:** (e.g., "quasi-emotions" - Walton: We don't feel *real* fear, but a make-believe analog; "thought theory" - Lamarque, Dadlez: Emotions can be triggered by thoughts/propositions alone, without existential belief).
          *   **Imagination:** (e.g., "i-desires" - Doggett & Egan: We have imaginative counterparts to desires/beliefs that drive fictional emotions; "simulation theory" - Currie: We simulate the emotional states of characters or within the scenario).
          *   **Illusion:** (Radford's "irrationality" view: We *are* irrational; Coleridge's "willing suspension of disbelief": We temporarily allow ourselves to be deceived).
          *   **Value/Meaning:** (e.g., Moran: We respond to the *real human truths* or *values* expressed *through* the fiction, not *to* the non-existent entity itself).

  **3. Why Philosophers Don't Just "Import" Solutions:**

  1.  **The Solutions Don't Fit:** A Russellian analysis of "Anna Karenina" tells us how the name functions or how statements about her are true/false. It doesn't explain the phenomenology of crying while reading about her fate, knowing she's fictional. A Kripkean causal chain for fictional names explains how the name was introduced, but not the subsequent emotional response.
  2.  **The Paradox Challenges Theories of Emotion/Psychology:** Philosophers of mind and aesthetics need to address the *nature of emotional response itself*. Are beliefs necessary for emotions? What role does imagination play? The paradox forces a refinement of our understanding of these psychological states, moving beyond just linguistic reference.
  3.  **Different Philosophical Domains:** The empty name problem is squarely in **Philosophy of Language**. The paradox of fiction sits at the intersection of **Philosophy of Mind** (emotion, imagination), **Aesthetics** (engagement with art), and **Ethics** (the nature of our concern). Its solutions often come from these fields, not just semantics.

  **Conclusion:**

  Your friend is right that both problems involve non-existent entities, making them conceptually related. **However, he's conflating a problem about *language* and *reference* with a problem about *emotion* and *rationality*.** The Paradox of Fiction isn't fundamentally asking "How do we refer to Anna Karenina?" (that's the empty name problem). It's asking, **"How can we genuinely *feel* for her, knowing she doesn't exist?"**

  Philosophers treat it separately because it demands its own set of tools and theories focused on human psychology, imagination, and our engagement with narrative art. Solving how we *talk* about fictions doesn't automatically solve how we *feel* about them. So, while wearing similar "costumes" (non-existent objects), they are distinct philosophical creatures. Your bar debate was likely productive precisely because this distinction is subtle but crucial!
