  I've been going back and forth on split-brain patients and I want you to pin down a number. Take the idealized full commissurotomy case: corpus callosum and other main forebrain commissures cut, no other pathology. At an ordinary waking moment, what's your credence that the patient is two numerically distinct subjects of experience (two streams of phenomenal consciousness) rather than one? Don't just say it depends; put the 'it depends' into the decomposition. I'd want at least these terms: (a) your credence that the disconnected right hemisphere is a locus of phenomenal consciousness at all; (b) given (a), your credence that left and right experiences fail to be integrated into a single subject; (c) your credence that the left hemisphere's verbal reports aren't authoritative about how many subjects there are; (d) your credence that 'how many streams of consciousness' is even well-defined enough to have a truth value. Give each a number and a sentence of justification, then show how you combine them into the final credence. Then tell me which term the final number is most sensitive to and what sort of evidence (behavorial, neural, conceptual) would move that term the most.
