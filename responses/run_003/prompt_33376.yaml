  P(X | at intersection) = P(at X) / [P(at X) + P(at Y)]

  Note: 
  - He is always at X at the start, so P(at X) = 1.
  - He is at Y only if he continued at X, so P(at Y) = p.

  Therefore:
  P(X | at an intersection) = 1 / (1 + p)
  P(Y | at an intersection) = p / (1 + p)

