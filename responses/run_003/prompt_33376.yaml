  We are given the standard absent-minded driver problem. The driver starts at X. At each intersection, he chooses CONTINUE with probability p and EXIT with probability 1-p. The payoffs are:
  - If he exits at X: 0
  - If he exits at Y: 4
  - If he continues at Y: 1 (which happens only if he continues at X and then continues again at Y)

  The ex ante expected payoff (from the planning stage) is:
  U(p) = P(exit at X) * 0 + P(exit at Y) * 4 + P(continue at Y) * 1
  P(exit at X) = (1-p)
  P(exit at Y) = p * (1-p)   [because he must continue at X and then exit at Y]
  P(continue at Y) = p * p   [continue at both]

  So:
  U(p) = 0 * (1-p) + 4 * [p*(1-p)] + 1 * [p*p] = 4p - 4p^2 + p^2 = 4p - 3p^2

  We maximize U(p) by taking the derivative and setting to zero:
  dU/dp = 4 - 6p = 0  =>  p = 4/6 = 2/3.

  So the ex ante optimal p is 2/3, giving U(2/3)=4*(2/3)-3*(4/9)=8/3-12/9=8/3-4/3=4/3.

  Now, let's consider the action stage. The driver is at an intersection and does not know if it is X or Y. He assigns probabilities to being at X or Y given that he is at an intersection and that he is using strategy p.

