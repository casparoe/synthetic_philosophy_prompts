prompt: |-
  I cover science and ideas for a weekly magazine, and I also sit on the advisory board of a nonprofit fact-checking initiative that rates official and political claims. Last fall, at a press conference ahead of a state emergency-management hearing, a regional official said that the September storm "was one of the most powerful to hit the state in recorded history." Our desk pulled the data. By peak sustained wind speed — the meteorological standard for a storm's intensity — the storm ranks eleventh among the state's named storms; by minimum central pressure, nineteenth; by economic damage, fourth. The board is now split on how to rate the claim, and I've been asked to circulate a short written opinion before Thursday's meeting.

  One editor wants to rate it false. Her argument, which a philosopher on the board has labeled supervaluationism, is that a vague claim is true only if it comes out true under every reasonable way of making it precise: "one of the most powerful" has no sharp cutoff, and since a reasonable reading — say, the top five, or the top ten by wind speed — excludes the storm, the claim is not true. The other editor objects that this misdescribes the semantics. He calls his position epistemicism, in the sense associated with Timothy Williamson: there is a fact of the matter about whether an eleventh-ranked storm counts as "one of the most powerful"; the boundary is simply beyond our cognitive reach; and a fact-checker's job is to report the best available evidence about which side of the boundary we're on, not to apply a truth rule that would condemn most of the vague claims people actually make. I lean toward the second view, but I'm not sure it survives contact with the practical constraint that our ratings come from a fixed menu — true, mostly true, misleading, false, unverifiable — and I'd rather have the opinion argue the case than assume it.

  Please draft the memo I'll circulate. It should recommend a concrete rating for the storm claim and a standing rule for how the desk should treat vague claims generally — claims built on predicates like "one of the most," "largely," or "most" that lack a sharp cutoff. I want it to engage both positions seriously, including the strongest version of whichever one it recommends against, and to say plainly what a reader of the fact-check should take away from the storm claim either way. If the memo concludes that our rating menu itself is part of the problem, it should say so and propose what to do about it.
reasoning: |-
  Okay, the user is a science journalist and fact-checking advisor facing a philosophical dilemma about rating a politician's vague claim. They need a memo resolving a board split between supervaluationism and epistemicism approaches to truth-rating. 

  Hmm, the core tension is fascinating - it's not just about storm data but about how fact-checkers should handle linguistic vagueness. The user leans toward epistemicism but worries about practical constraints of their binary rating system. Their hidden concern seems to be maintaining credibility while acknowledging real-world language use.

  Let me unpack both philosophical positions carefully. The supervaluationist editor has a point about precision - if "most powerful" could reasonably mean top 5 or 10, and the storm ranks 11th, it fails under all interpretations. But the epistemicist editor is right that ordinary language doesn't work that way; there's probably a contextual cutoff we just can't pinpoint. 

  The economic damage angle complicates things - ranking 4th by damage makes the claim feel intuitively plausible even if technically outside meteorological top tiers. This suggests we need a holistic approach rather than mechanical application of either theory.

  For the memo structure... start by neutrally framing the dispute, then show why strict supervaluationism would make fact-checking impossible (most claims are vague!), while pure epistemicism ignores our practical need for actionable judgments. The compromise: adopt a "reasonable observer" standard using available evidence.

  Ah - the rating menu is indeed part of the problem. "Mostly true" fits best here, since the claim holds under some reasonable interpretations (economic impact) but not others (meteorological measures). Should explicitly recommend adding "context needed" as a future rating category.

  Most importantly, the memo must clarify what readers should take away: that while not literally top-tier meteorologically, the storm was exceptionally destructive. The fact-check should inform, not just arbitrate truth.
answer: |-
  ## MEMORANDUM  
  **TO:** Fact-Checking Advisory Board  
  **FROM:** [Your Name], Science & Ideas Editor  
  **DATE:** October 25, 2023  
  **SUBJECT:** Rating Framework for Vague Claims & Recommendation on Storm Intensity Statement  

  ### I. The Claim & Data Context
  **Claim:** "The September storm was one of the most powerful to hit the state in recorded history." (Regional Official, 9/2023)  
  **Data:**  
  - Peak Sustained Wind Speed: **11th** (of named storms)  
  - Minimum Central Pressure: **19th**  
  - Economic Damage: **4th**  

  ### II. Competing Philosophical Frameworks
  We must reconcile two rigorous approaches to linguistic vagueness:  

  1.  **Supervaluationism (Proposed Rating: False):**  
      *   **Core Argument:** A vague claim is true *only* if it holds under *every* reasonable precisification. "One of the most powerful" lacks a sharp boundary, but reasonable interpretations (e.g., top 5 by wind speed, top 10 overall) exclude an 11th/19th-ranked storm on core intensity metrics.  
      *   **Strength:** Provides clear, objective criteria for falsity. Avoids endorsing claims that fail under plausible interpretations.  
      *   **Weakness:** Risks being overly restrictive. Common usage of "one of the most" often implies salience (e.g., damage, impact) beyond strict technical rankings. Applying this strictly could render *most* comparative claims "false," including many that effectively communicate a valid point.  

  2.  **Epistemicism (Proposed Rating: True/Mostly True):**  
      *   **Core Argument:** There *is* a precise (but unknowable) boundary for "one of the most powerful." Our role is to assess evidence about where the claim likely falls relative to that boundary. The storm's #4 damage ranking and top-15 wind speed provide strong evidence it lies on the "true" side for many reasonable observers, even if the exact cutoff is elusive.  
      *   **Strength:** Reflects how language functions in practice. Acknowledges that claims can be "true enough" based on available evidence and context (like exceptional damage), even if not top-ranked on every technical metric.  
      *   **Weakness:** Relies on subjective judgments about "likely" boundaries and "reasonable observers." Challenges our mandate for objective ratings and clashes with fixed rating categories.  

  ### III. Analysis & Recommended Rating
  While both frameworks offer valuable insights, **strict application of either fails our practical mission.** Supervaluationism is too brittle for public discourse; epistemicism is too subjective for consistent fact-checking.  

  *   **The Claim's Merits:** The storm demonstrably *was* "one of the most powerful" **by economic impact** (#4). It was also **very highly ranked by wind speed** (#11). While not top-tier on central pressure (#19) or *the* most intense by wind, its combined intensity and exceptional damage make its classification as "one of the most powerful" **reasonable in common public understanding.**  
  *   **The Key Deficiency:** The official’s statement lacked context. It presented the claim as an objective meteorological fact ("powerful"), implying intensity metrics, without acknowledging the storm's true distinction lies in its damage. This omission risks misleading listeners who equate "powerful" solely with wind/pressure.  

  **Recommended Rating:** **MOSTLY TRUE**  
  *   **Justification:** The core assertion – the storm ranks among the state's most significant events – is strongly supported by the damage data and reasonably supported (though not optimally) by wind speed. However, the unqualified use of "powerful" likely conveys a stronger implication about *meteorological intensity* than the full data supports. The claim is substantially correct but lacks important context.  

  ### IV. Reader Takeaway
  *   **If Rated Mostly True:** Readers learn the storm was unquestionably one of the most *damaging* and was indeed a very intense event (top 15 by wind). They also understand that while calling it "one of the most powerful" isn't deceptive, its *peak* intensity wasn't as exceptionally high as the term might suggest without context. The focus shifts to its significant impact.  
  *   **If Rated False (Per Supervaluationism):** Readers learn the claim fails strict tests based on core intensity metrics. While they might infer the storm was serious, they miss the crucial nuance of its exceptional damage ranking and its high-but-not-top wind speed, potentially understating its overall significance.  

  ### V. Proposed Standing Rule for Vague Predicates
  **Rule: Contextual Reasonableness Assessment with Transparency**  
  1.  **Reject Strict Binarity:** Avoid mechanically applying supervaluationism or epistemicism.  
  2.  **Assess Holistically:** Evaluate the claim against all relevant, available data dimensions. Consider which interpretations are most reasonable *in the specific context* (e.g., "powerful" in an emergency management hearing likely includes impact).  
  3.  **Prioritize Salience:** If a claim is clearly true under one major, reasonable interpretation (e.g., damage = "powerful") but less so under others (e.g., wind speed), lean towards a higher rating ("True" or "Mostly True") but mandate contextual clarification *in the rating explanation*.  
  4.  **Require Evidence-Based Precision:** When data allows clear exclusion from *all* reasonable interpretations (e.g., ranking 50th by all metrics), rate "False." When inclusion is evident under *any* major reasonable interpretation, avoid "False."  
  5.  **Flag Vagueness & Context:** Explicitly note the inherent vagueness and specify which interpretations the data supports or challenges in the published fact-check.  

  ### VI. The Rating Menu Problem
  **The fixed rating menu *is* a significant constraint.** It forces a reduction of nuanced judgments (like this one) into broad categories, sometimes obscuring important distinctions.  

  **Recommendation:**  
  1.  **Short-Term:** Use "Mostly True" for this case, leveraging its inherent flexibility for claims that are substantially correct but lack context or have minor caveats. Use the explanation box thoroughly.  
  2.  **Long-Term:** **Propose adding a "Context Needed" or "Lacks Precision" tag** to be used *in conjunction* with the primary rating (e.g., "Mostly True, Context Needed"). This would directly signal the core issue with vague claims without abandoning the core rating structure.  

  ### VII. Conclusion & Recommendation Summary
  *   **Rate this specific claim:** **MOSTLY TRUE.** Its exceptional damage ranking and very high wind speed place it reasonably within the scope of "one of the most powerful" in a broad sense, though the unqualified use of "powerful" slightly overstates its peak meteorological intensity.  
  *   **Adopt the "Contextual Reasonableness" Rule** for vague predicates, emphasizing holistic data review and transparent explanation of supported interpretations.  
  *   **Propose developing a "Context Needed" tag** to enhance the rating menu for vague or imprecise claims.  

  This approach balances philosophical rigor with practical communication needs, provides actionable information to the public, and acknowledges the inherent challenges of language while holding officials accountable for clarity. I look forward to discussing this at Thursday's meeting.
