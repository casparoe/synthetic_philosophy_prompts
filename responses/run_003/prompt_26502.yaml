  ### Tactical Notes:  
  - **Focus**: Hammer the *deliberative stance* distinction. Railton/Hare change *how we act*, not *how we relate to our reasons*.  
  - **Soft Spots**: Be ready to clarify "alienation" as *structural* (not emotional) and "integrity" as *practical identity coherence*.  
  - **Kantians**: Grant Korsgaard’s insights but insist Williams captures something she misses: the *unmediatable* force of ground projects.  
  - **Agnostics**: Pitch this as a "human cost of moral rationalism" — less about refuting consequentialism than exposing its existential burden.  

  Good luck! Your angle is sharp and underexplored — don’t let them derail it into the old "agent-relativity" debate.
