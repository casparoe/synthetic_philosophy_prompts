  There are also additional candidate requirements to evaluate: explaining the neutralization/inversion of contrary evidence, separating epistemic defects from moral culpability, allowing for benign/temporary epistemic bubbles, permitting echo chambers around true beliefs, and distinguishing echo chambers from related phenomena like polarization or filter bubbles. For each, I need to assess whether it's essential or optional and what would be lost by omitting it.

  The structural questions require examining potential conflicts between requirements (like whether the distrust mechanism requirement clashes with non-culpability) and identifying which single requirement does the most work in ruling out inadequate accounts.

