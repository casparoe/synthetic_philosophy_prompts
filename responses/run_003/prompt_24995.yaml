    "dennett_best_reply": "The Moral Ecology Argument: Desert isn't metaphysical but ecological. Just as we maintain forests by weeding, we maintain moral communities by holding agents responsible—*regardless* of ultimate causes. The point isn't cosmic fairness but cultivating reasons-responsive agency. If Caruso rejects all desert, he undermines the reactive attitudes (resentment, gratitude) that motivate moral growth. His quarantine model would treat humans like broken objects rather than reason-able agents.",
