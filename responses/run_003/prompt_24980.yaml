prompt: |-
  I've been teaching practical reason on and off for about fifteen years, and there's a conversational move I keep seeing that I've never found a satisfactory label for — maybe you can help me pin it down, becuase it's driving me a little nuts.

  Here's the thing. Two people are arguing about whether someone — call him Paul — ought to do something: leave his job, give money to a cause, visit his difficult mother, whatever. The first person says Paul ought to do it. Paul (or someone defending him) says "but that's not something Paul cares about — it doesn't connect to anything he values." Now, the first person has two ways to go. Path A: "Actually, given what Paul does care about — his health, say, or his desire to think well of himself — he does have a reason to do this, he just hasn't seen the connection." Path B: "It doesn't matter what Paul cares about; he ought to do it regardless — the reason stands on its own."

  What interests me is this: in real arguments, people switch from Path A to Path B midstream without seeming to notice they've done it. They'll try to ground the reason in the agent's existing psychology, fail to make it stick, and then just assert the reason as if the failure never happened — but they'll phrase it in a way that sounds like a continuation of the same point. Or they'll start with the freestanding normative claim, get pushback, and retreat to "well, surely you care about not being a hypocrite, and here's why this follows from that" — again, no acknowledgment that the kind of reason being offered has changed. I've started calling it "reason-switching" in my own head, but that's too clumsy and doesn't capture the stealthiness of it.

  I know this is somewhere in the neighborhood of the Williams/Korsgaard/internalism/externalism terrain, but I'm not asking for a summary of that debate. What I want is narrower: is there a name for this specific dialectical move — the unmarked slide between grounding a reason in an agent's existing motivations and asserting it independently of them? And if there isn't, what should we call it, and how do we distinguish it precisely from ordinary equivocation, from shifting the burden of proof, and from simply changing the subject? I'm after the carving, not the label. Think very carefully before answering, and respond in the style of an expert.
reasoning: |-
  Okay, the user has been teaching practical reason for fifteen years and is frustrated with a specific conversational move they've observed. They're looking for a precise label and conceptual framework for what they call "reason-switching." Let me unpack their query carefully.

  The core phenomenon involves debaters seamlessly shifting between two distinct types of reasons during ethical arguments about what "Paul" should do: Path A (grounding reasons in the agent's existing values) and Path B (asserting freestanding normative reasons). The user emphasizes the stealthy nature of this shift where speakers don't acknowledge changing their justificatory approach. 

  Hmm, while the user mentions Williams/Korsgaard, they explicitly want to avoid rehashing that debate. Their real need seems threefold: (1) precise conceptual distinction from adjacent fallacies (equivocation, burden-shifting etc.), (2) a terminological proposal that captures both the psychological and normative dimensions, and (3) pedagogical tools to help students spot this move.

  The existing philosophical lexicon feels inadequate here. "Internalism/externalism" is too broad, "motivational shift" misses the normative claim, and "equivocation" doesn't capture the substantive continuity between Path A and B. What makes this move uniquely slippery is how it exploits the ambiguous relationship between personal values and impersonal obligations - almost like a motte-and-bailey but focused on reason-types rather than claim strength.

  For terminology... "Normative Ground Shifting" emphasizes the changing justificatory foundation while nodding to Williams' "ground projects." Alternatively "Constitutive/Detached Reason Transposition" highlights the categorical shift between internally constituted vs externally detached reasons. But both feel jargon-heavy for classroom use. Maybe "Value-Detachment Maneuver"? 

  Crucially, we need diagnostic markers to distinguish this from simple topic changes: listen for (1) persistent use of "ought" claims across both moves, (2) identical action-prescription despite changed justification, and (3) rhetorical devices like "as I was saying..." that mask the shift. The tell is when Path B gets challenged and the speaker retroactively treats their Path A attempt as merely illustrative rather than essential to the argument.

  Pedagogically, the user might benefit from framing this as a "category slide" between two distinct reason-genres: psychological explanation vs moral injunction. I'll emphasize concrete indicators students can flag: sudden disappearance of phrases like "given that Paul cares about X" or new insistence on words like "plainly" or "objectively" without new evidence.
answer: |-
  Your observation hits a vital nerve in practical reasoning debates—a move that's both pervasive and philosophically significant. This isn't mere equivocation or burden-shifting; it's a **distinct dialectical maneuver exploiting ambiguity in the ontology of reasons**. After dissecting the literature and your description, I propose the term:  

  ### **Normative Ground Shifting**  
  *(or **Constitutive/Detached Reason Transposition** for precision)*  

  ### Core Characteristics & Differentiation  
  1. **Stealth Mechanism**:  
     - Unlike explicit burden-shifting (e.g., "Prove Paul *doesn’t* have this reason!"), this move **preserves the surface structure of the argument** ("Paul ought to Φ") while covertly altering the *basis* for "ought."  
     - Contrast with equivocation (e.g., shifting the meaning of "reason" mid-argument): Here, the *type* of normative claim (agent-relative vs. freestanding) changes, but the *action prescribed* remains identical.  

  2. **Taxonomy of Reasons Involved**:  
     - **Path A (Constitutive Reasons)**: Grounds obligation in the agent’s *actual psychology* (Williams-style internal reasons).  
       *Example*: "If Paul cares about integrity, donating follows *from his own commitments*."  
     - **Path B (Detached Reasons)**: Asserts obligation *independent of psychology* (Korsgaardian external reasons or realist claims).  
       *Example*: "Paul must donate—it’s objectively required *whether he cares or not*."  
     - **The Shift**: When Path A fails, the speaker *detaches the reason from constitutive grounds* but retains the identical prescriptive force—without signaling the metaphysical leap.  

  3. **Why It’s Not "Changing the Subject"**:  
     - The topic (e.g., "Should Paul donate?") remains fixed. Only the *justificatory framework* mutates: from **psychological explanation** to **categorical injunction**. This is a *modal* shift, not a topical one.  

  ---

  ### Diagnostic Criteria for Identification  
  To spot Normative Ground Shifting, listen for these markers:  

  | **Phase**          | **Path A (Constitutive)**                     | **Path B (Detached)**                          | **Shift Signal**                                  |  
  |---------------------|-----------------------------------------------|-----------------------------------------------|---------------------------------------------------|  
  | **Justification**   | "Given Paul’s values..."                      | "Regardless of Paul’s values..."              | *Disappearance of psychological anchors*          |  
  | **Failure Response**| "He hasn’t seen the connection"               | "That’s irrelevant—it’s just wrong not to"   | *Dismissal of psychology as pertinent*            |  
  | **Rhetorical Tone** | Explanatory ("This follows because...")       | Authoritative ("This is non-negotiable")      | *Shift from persuasion to declaration*            |  

  ---

  ### Pedagogical Response: Carving the Joints  
  In teaching, frame this as a **violation of reason-type consistency**. Emphasize:  
  - **Step 1**: Identify the *initial grounding* of the "ought."  
    - *Ask*: "Is this reason being presented as *dependent* on Paul’s psychology?"  
  - **Step 2**: Track *retreat patterns* under pushback.  
    - *Key question*: "When challenged, does the speaker abandon psychological grounds while retaining the same prescription?"  
  - **Step 3**: Isolate the *metaphysical commitment*.  
    - *Crucial distinction*: Constitutive reasons are *descriptive* (about Paul’s agency); Detached reasons are *prescriptive* (about moral reality).  

  ---

  ### Why Existing Labels Fall Short  
  - **"Internalism/Externalism"**: Describes meta-ethical positions, not dialectical moves.  
  - **"Motivational Shifting"**: Focuses on psychology, ignoring detached normativity.  
  - **"Motte-and-Bailey"**: Involves retreating to defensible claims; here, both paths are *offensive* justifications.  

  **Normative Ground Shifting** captures the illicit substitution of justificatory foundations while preserving the action-guiding conclusion. It’s not merely sloppy reasoning—it’s a tacit attempt to leverage the intuitive force of internalism while falling back on externalism when convenient. By naming it, you expose the sleight-of-hand: the unacknowledged leap from *reasons as explanations of agency* to *reasons as cosmic imperatives*.  

  Would you like a case study illustrating how to dissect this move in a real dialogue?
