  *Pauses to consider Jerome's role* 
  Jerome is fascinating—he embodies the limits of expected-value calculations. His genetic perfection didn't account for psychological resilience or societal pressure. This directly challenges Savulescu's probabilistic framing. But is the film saying "don't select" or "selection isn't enough"? The latter leaves room for procreative beneficence defenders to argue their position isn't undermined. 

  Vincent's heart condition... The film shows real constraints (he couldn't have succeeded without Jerome's samples) but celebrates his will. A Savulescu defender might reply: "We select for best expected outcomes, not guarantees. Vincent beat the odds, but odds matter." Still, the film's emotional power comes from siding with the outlier—which exposes how procreative beneficence might overlook the value of struggling against limits. 

  On discrimination vs. selection: Gattaca brilliantly conflates them aesthetically (e.g., urine tests = surveillance), but philosophically they're distinct. The film's dystopia relies on post-birth discrimination—something liberal eugenicists reject. Yet... does pre-selection enable discrimination? The film suggests yes; philosophers might call that a slippery slope. 

