prompt: |-
  In my campus EA group someone keeps ending arguments about career choice with "earning to give." Last week it got used to shut down a discussion about whether one of us should take a job at a nonprofit doing global health logistics versus a consulting job that pays three times as much. The claim seemed to be that the consulting job is obviously the more ethical choice because you can donate the difference, but I'm not sure whether that's actually what the slogan says, or whether it's even true on any precisification. Can you lay out the different precise claims "earning to give" could be making—about the size of the donation, about whether earning-and-donating dominates direct work, about replaceability, about what the counterfactual actually is—and say for each whether it's trivially true, substantive and defensible, or just false? And then tell me which reading the consulting-job argument actually needs, and whether that reading survives. I want a list I can bring to the next meeting.
reasoning: |-
  Okay, this user is dealing with a frustrating situation in their EA campus group where "earning to give" (ETG) is being oversimplified to shut down nuanced career discussions. They're specifically bothered by how it was applied to a nonprofit vs. consulting job choice, where the higher salary was treated as automatically superior ethically. 

  Hmm, the user seems analytically sharp—they're already spotting key weaknesses in the argument (replaceability, counterfactuals) and want a systematic breakdown. Probably familiar with EA concepts but annoyed at dogmatic application. Their tone suggests mild exasperation ("shut down a discussion", "just false?"), so they likely want ammo for pushback, not just abstract theory. 

  The core tension here is between ETG as a useful heuristic vs. a rigid rule. I should dissect every hidden assumption in that consulting example. Key angles: 

  First, the donation threshold matters. Default ETG framing implies donating the entire salary difference, but in reality people rarely do—psychology matters. Even if they did, is that difference *actually* fungible with the nonprofit's impact? Probably not, given salary constraints. 

  Then there's replaceability. The consulting argument assumes the nonprofit job would be filled equally well by someone else, but global health logistics is niche! If this person has unique fit, that changes everything. Meanwhile, consulting firms hire armies of similar candidates—their marginal impact is likely negligible. 

  Ah, and the counterfactuals... The ETG claim secretly assumes the nonprofit work happens anyway (false if they're pivotal) and that donations can magically replicate that specific impact (unlikely for skilled labor). Also ignores that direct work builds career capital for bigger future impact. 

  The user needs concrete talking points, so I'll structure this as a numbered list of precise claims, tagging each as true/false/substantive. The consulting argument relies on the shakiest ones—especially ignoring replaceability and counterfactuals. 

  Biggest flaw? Treating ethics as arithmetic. I should emphasize that ETG works best for replaceable workers in scalable funding gaps, not skilled specialists. Might add that the original slogan (from 80k Hours) was way more nuanced than how it's being used here. 

  ...Wait, should I mention that the nonprofit salary itself could be partially donated? That's an intermediate option they're overlooking. Also worth noting diminishing returns—doubling a nonprofit budget ≠ doubling impact. 

  Final slide should contrast the simplistic ETG used in the meeting ("just donate the difference!") with rigorous ETG that actually survives scrutiny (requires specific conditions). User can then say: "If we're being precise, ETG only dominates when X and Y, which isn't the case here." Mic drop.
answer: |-
  Here's a breakdown of the different precise claims behind "earning to give" (ETG), their validity, and how they apply to your consulting vs. nonprofit example. Use this list to steer the discussion toward nuance at your next meeting:

  ### Key Precise Claims & Their Validity
  1.  **"ETG means donating *some* of your earnings to effective charities."**
      *   **Status:** Trivially True.
      *   **Explanation:** This is the absolute minimal definition. Anyone donating any amount from their salary is technically "earning to give." It doesn't address *how much* donation is needed for ETG to be competitive ethically.

  2.  **"ETG means donating *the entire difference* between your high-earning salary and a lower-paying direct impact salary."**
      *   **Status:** **Substantive and Contingent (Often False in Practice).**
      *   **Explanation:** This is the core assumption in your consulting example. It requires:
          *   **Counterfactual Salary:** Correctly identifying the salary of the counterfactual direct work option (e.g., the nonprofit salary).
          *   **Donation Commitment:** Actually donating the *entire* pre-tax difference consistently over the career.
          *   **Ignoring Non-Monetary Costs:** Overlooking potential negative impacts of the high-earning job (e.g., stress, long hours, industry ethics) or positive impacts of the direct work job (e.g., skill-building, network effects, intrinsic motivation). **This is rarely done perfectly.**

  3.  **"ETG *dominates* direct impact work: The impact achieved by donating the marginal earnings from a higher-paying job *always* exceeds the impact you could achieve personally in a direct impact role."**
      *   **Status:** **Substantive and Often False.** This is the strong claim implicit in shutting down the argument.
      *   **Explanation:** This relies critically on **Replaceability**:
          *   **Your Replaceability in the Direct Role:** If you are highly skilled, experienced, or uniquely suited for the nonprofit logistics role, and the next-best candidate is significantly worse (or the role might go unfilled), your *direct impact* is high. Donating money might not easily replicate *your specific contribution*.
          *   **Your Replaceability in the Earning Role:** How easily could someone else have gotten the consulting job and done it just as well? If the consulting firm hires many similar candidates, you might be highly replaceable, meaning the *counterfactual impact* of you taking that job is low (someone else would have done it anyway). Your main impact is the donation.
      *   **Also Requires:** The donated funds must be able to fund work *as effective or more effective* than the direct work you forgo, considering overhead, funding gaps, and implementation capacity.

  4.  **"ETG is *counterfactually optimal*: The impact of the world if you take the high-earning job *and donate effectively* is greater than the impact of the world if you take the direct impact job."**
      *   **Status:** **Substantive, Contingent, and Difficult to Prove.**
      *   **Explanation:** This is the gold standard claim but is highly sensitive to:
          *   **Accurate Counterfactuals:** What *actually* happens in both scenarios? (See Replaceability above).
              *   *Direct Path:* Does the nonprofit role get filled by someone equally good? Worse? Not at all? Does your absence cause a project to fail or be delayed?
              *   *ETG Path:* Does someone else get the consulting job? Do they donate less/none? Does the firm's output change?
          *   **Marginal Value of Funds vs. Labor:** How much impact does an extra dollar to an effective charity buy *at the margin*? How much impact does *your specific labor* in the direct role create *at the margin*? Comparing dollars to direct labor hours is fundamentally tricky.
          *   **Personal Fit & Trajectory:** Does the consulting job burn you out, reducing long-term earning/donation potential? Does the nonprofit job build unique skills/connections for vastly greater future impact? Does the consulting job offer leverage for future high-impact roles?

  5.  **"ETG is primarily valuable for funding *scalable, funding-constrained* interventions."**
      *   **Status:** **Substantive and Defensible.**
      *   **Explanation:** ETG shines when outstanding charities (e.g., top global health orgs) have proven, cost-effective interventions but lack funding to scale them further. Donating $100k can directly fund more bednets/vaccines/deworming. It struggles when impact is primarily **labor-constrained** (e.g., specialized research, skilled policy advocacy, niche field operations) or requires **specific expertise/authority** that money can't easily buy.

  ### Applying to the Consulting vs. Nonprofit Choice
  *   **The Argument Used Needs:** Claims **#2 (Donate Entire Difference)** AND **#3 (ETG Dominates Direct Work)**. This requires **#4 (Counterfactual Optimality)** to hold.
  *   **Does This Reading Survive? Likely Not, or At Least Not Obviously:**
      1.  **Replaceability in Nonprofit Role:** Is the global health logistics role hard to fill? Does this person have unique skills/experience? If yes, their direct impact is high and hard to replace with donations.
      2.  **Replaceability in Consulting Role:** Are consulting jobs at that firm/level highly competitive with many qualified candidates? If yes, the person is likely replaceable – their main *added* impact is the donation.
      3.  **Marginal Value of Funds vs. Labor:** Is the nonprofit *funding-constrained*? Could it effectively use an extra $X (the donation difference) to hire equally good logistics staff? Or is it primarily *labor/talent-constrained*? If the latter, donating money won't easily replicate *this specific person's* contribution.
      4.  **Counterfactual Realism:** If they don't take the nonprofit job, who does? What's the quality difference? What happens to the specific projects they'd work on?
      5.  **Donation Follow-Through:** Will they *actually* donate the *entire pre-tax difference* (potentially >50% of their take-home pay) consistently? History suggests this is uncommon.
      6.  **Personal Factors:** Which path builds better skills/connections for long-term impact? Which is more sustainable/fulfilling for this individual? Does the consulting job involve ethically questionable work?

  ### Your Meeting List: Key Points to Raise
  1.  **ETG ≠ Automatic Win:** It requires specific, often unrealistic, conditions to dominate direct work (#3 is not trivially true).
  2.  **The "Donate the Difference" Assumption is Flawed:** (#2) It ignores taxes, lifestyle changes, and rarely happens fully. The *actual* donated amount is crucial.
  3.  **Replaceability is King:** The argument hinges entirely on whether the nonprofit role is easily filled *just as well* and whether the consulting role is easily filled *by someone who wouldn't donate as much*. This needs investigation, not assumption.
  4.  **Counterfactuals Matter Deeply:** What *really* happens in both scenarios? (#4) Ignoring this is bad analysis.
  5.  **Funding vs. Labor Constraints:** Is the bottleneck the nonprofit faces money or skilled personnel? (#5) If it's personnel (especially for logistics!), donating money might not solve the problem this person would address directly.
  6.  **Personal Fit & Long-Term Trajectory:** Which path better leverages *this specific person's* talents, interests, and potential for long-term impact? Burnout in consulting is a real risk.
  7.  **ETG is a Tool, Not a Rule:** It's highly effective *in specific contexts* (replaceable individuals, funding-constrained top charities), but **not universally superior**. Shutting down discussion ignores vital nuance.

  **Conclusion for the Group:** The claim that the consulting job is "obviously more ethical" based on ETG (#2 + #3) relies on shaky assumptions about replaceability, counterfactuals, donation commitment, and the nature of the nonprofit's constraints. A rigorous comparison requires digging into these specifics for *this individual* and *these specific roles*. ETG deserves consideration, but not blind application as a conversation-ender.
