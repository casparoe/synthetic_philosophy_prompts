prompt: |-
  I run a reading group on metaethics — about 12 people, mostly grad students but some faculty, 90-minute sessions. I want an activity that makes them feel, not just discuss, the problem of distinguishing genuine moral preferences from biases. The idea is: by the end, they should be genuinely uncertain whether some of their own moral convictions survive the debunking challenge, and they should see why the distinction is so slippery.

  Here's what I'm picturing: you give them a set of moral cases (maybe 5-6) and they privately record their judgments. Then you reveal information about each case — framing effects, cultural variation data, evolutionary explanations, or evidence that their judgment flips under irrelevant changes. At each stage they have to say whether they still endorse their original judgment and why. The debrief should map their experience onto the philosophical terrain: evolutionary debunking, the reliability challenge to moral intuitions, the difference between explaining and explaining away, and the problem that there's no agreed test for when a moral conviction is a bias rather than a preference.

  Rules, materials, timeline for 90 minutes, and an honest note on what the activity can't capture — I'm guessing it can make the problem vivid but can't resolve it (obviously), and it might tilt people toward skepticism more than the arguments warrant. Also tell me what will predictably go wrong and how to handle it.
reasoning: |-
  Okay, the user is running a metaethics reading group and wants an activity that makes participants feel the difficulty of distinguishing genuine moral preferences from biases. They need a structured 90-minute session with specific cases, debriefing, and practical considerations. 

  First, I need to unpack the core request. They don't just want discussion - they want visceral uncertainty. The key is designing cases where biases (framing, cultural norms, evolutionary instincts) feel personally relevant. Faculty presence adds weight - they'll need cases sophisticated enough to challenge academics.

  Hmm... the real challenge is balancing philosophical depth with experiential impact. The activity must:
  - Elicit strong initial judgments (personal investment)
  - Introduce destabilizing evidence gradually (cognitive dissonance)
  - Maintain structure amid emotional reactions (time management)
  - Connect to metaethics without lecturing (embodied epistemology)

  I recall studies like Haidt's disgust research and Sinnott-Armstrong's framing effects. Good raw material, but need adaptation. Cases should:
  - Vary bias types (some obvious, some subtle)
  - Include "sacred value" scenarios (to trigger rationalization)
  - Avoid contemporary hot-button issues (prevents ideological deadlock)

  Biggest pitfall? Participants dismissing evidence as irrelevant to their specific judgment. Countermeasures:
  - Pre-emptively discuss motivated reasoning in intro
  - Use multiple debiasing angles per case
  - Make flip scenarios absurdly trivial (e.g., font color changing verdicts)

  The skepticism worry is valid. I'll build in a "recalibration" moment during debrief - maybe have them identify which debunking feels weakest/strongest. Grounds it in their lived experience while checking knee-jerk relativism.

  Materials matter. Physical response cards for endorsement stages force commitment - harder to waffle than digital polling. Case handouts should have clean visual design; cognitive load undermines reflection.

  Timeline is tight. Strict 13-minute case rotations with a countdown timer. Sacrifice discussion depth for broad pattern recognition. The uncertainty feeling comes from cumulative effect anyway.

  Can't capture: Deliberate reasoning vs intuition conflict. We're simulating bias exposure, not isolating cognitive processes. Explicitly note this limit during wrap-up to preempt overgeneralization.

  Faculty may dominate early. Mitigation: Start with private written judgments, use small breakout groups with assigned facilitators from grad students. Play to hierarchy - ask profs to share uncertainty first during debrief.

  ...And always keep the exit question: "Which of your current convictions could survive a session like this about itself?" That's the lingering itch.
answer: |-
  Here’s a structured 90-minute activity designed to induce visceral uncertainty about moral intuitions, with materials, timing, and troubleshooting. It targets the debunking challenge while acknowledging its limits.

  ---

  ### **Activity Title**: *Moral Intuition Autopsy*  
  **Goal**: Expose the fragility of moral convictions through incremental debunking, forcing participants to confront whether their judgments stem from bias or reasoned preference.

  ---

  ### **Materials**  
  - Printed **case booklets** (1 per participant) with 5 cases + response grids  
  - Projector/screen for reveal slides (framing/cultural/evolutionary/flip evidence)  
  - Timer  
  - Response cards: ✅ (Endorse), ❓ (Unsure), ❌ (Reject)  
  - Whiteboard for debrief mapping  

  ---

  ### **Cases** (Adapt as needed)  
  *Each case has:*  
  1. **Scenario**  
  2. **Initial judgment prompt**  
  3. **4 debunking reveals**  

  **Example Case**:  
  1. **Scenario**: *A surgeon can save 5 dying patients by harvesting organs from 1 healthy tourist. Morally permissible?*  
  2. **Initial Prompt**: *Yes/No*  
  3. **Reveals**:  
     - **Framing**: *90% say "NO" when phrased as "killing the tourist"; 70% say "YES" when phrased as "saving five."*  
     - **Cultural Variation**: *Studies show East Asian groups 30% more likely to endorse.*  
     - **Evolutionary Explanation**: *In-group loyalty instincts trigger aversion to direct harm.*  
     - **Flip Test**: *If the tourist were your sibling, would your judgment change? If yes, is family bias defensible?*  

  *(Other cases: Disgust-based taboos, implicit bias in hiring, "purity" violations, trolley variations)*  

  ---

  ### **Timeline** (90 mins total)  
  1. **Intro & Setup** (10 mins)  
     - Frame the challenge: *"We’re testing whether our moral intuitions survive scrutiny or collapse under bias-exposure."*  
     - Distribute booklets. Participants **privately record initial judgments**.  

  2. **Case Rotation** (60 mins | 12 mins/case)  
     - **Private Judgment** (1 min/case): Answer prompt.  
     - **Evidence Reveals** (4 mins/case): Project 4 debunking slides sequentially.  
     - **Re-Endorsement** (2 mins/case): After *each* reveal, hold up ✅/❓/❌ card *and jot brief reason*.  
     - **Group Buzz** (5 mins/case): Tables of 3 share: *"Which reveal most shook your certainty? Why?"*  

  3. **Debrief & Philosophical Mapping** (20 mins)  
     - **Poll**: *"How many lost confidence in ≥1 judgment?"* → Show of hands.  
     - **Whiteboard Mapping**:  
       - Link experiences to concepts:  
         - ✅ → *"Explaining vs. explaining away"*  
         - ❓ → *"Reliability challenge to intuition"*  
         - ❌ → *"Evolutionary/cultural debunking"*  
       - Central Question: *"What test could distinguish bias from preference? Why is none agreed upon?"*  
     - **Closing Reflection**: *"Name one conviction you now question. What evidence would restore/undermine it?"*  

  ---

  ### **What This Captures vs. What It Can’t**  
  ✅ **Captures**:  
  - Visceral unease as personal judgments destabilize.  
  - Demonstrates how *identical* evidence feels like "explaining away" (for rejected judgments) vs. "contextualizing" (for endorsed ones).  
  - Exposes motivated reasoning in real-time.  

  ❌ **Can’t Capture**:  
  - **Resolution**: Won’t answer whether moral realism/naturalism/etc. is true.  
  - **Skepticism Bias**: Activity *will* tilt people toward doubt. Pre-empt: *"This shows why debunking worries us, not that all morals are fake."*  
  - **High-Resolution Intuitions**: Complex moral reasoning (e.g., contractualism) is harder to simulate than heuristic-driven intuitions.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Participants rationalize away evidence (e.g., *"That flip test is irrelevant!"*).  
     - **Fix**: Pre-empt: *"Record your reaction even if you think the evidence is bad. We’ll examine defenses later."*  

  2. **Problem**: Faculty/grad power dynamics stifle honesty.  
     - **Fix**: Start with private writing, use anonymous cards, small-group buzz sessions.  

  3. **Problem**: Time overruns during reveals/debate.  
     - **Fix**: Use a visible timer. Cut discussion with: *"We’re sitting with uncertainty now—more in debrief."*  

  4. **Problem**: Frustration about "no answer."  
     - **Fix**: Validate: *"The discomfort *is* the point. Metaethics lives in this anxiety."*  

  ---

  ### **Designer Notes**  
  - **Case Selection**: Avoid culture-war triggers (e.g., abortion). Use cross-culturally validated dilemmas.  
  - **Power Move**: Include *one case* where debunking evidence is weak (e.g., cognitive load effects) to contrast with strong debunking.  
  - **Follow-Up**: Share readings post-session (e.g., Joyce on evolutionary debunking, Lillehammer on bias).  

  This turns abstract metaethics into a felt dilemma—making the slippery distinction between bias and preference *personally haunting*. The goal isn’t consensus, but productive doubt.
