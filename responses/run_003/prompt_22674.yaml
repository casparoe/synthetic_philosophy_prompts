prompt: |-
  I write novels, and I have to give the eulogy for my friend Mark, a soldier who got killed in the war. I'm not gonna pretend this is easy to write. Here's what's got me stuck, and I think it's the whole problem: I believe the war he died in was unjust. I actually do, and I'm not going to stand up there and pretend otherwise, because Mark would've hated it. But I also can't call him a victim of a bad regime or say he was sacrificed for nothing, because I don't think thats right either. My view — I've thought about it more than I'd like — is that even in a war that's wrong, the soldiers on the ground aren't murderers. They didn't start it, they had every right to defend themselves, and the other side was trying to kill them, so they were allowed to fight back. So Mark wasn't a criminal, but the war wasn't just, and I can't figure out how to say both of those things at a funeral. The room will be full of his family, who want to hear that he was a hero who died for something that mattered, and his old unit, who'll know I'm dancing around the fact that I think the whole thing was a mistake. Can you write it for me? It needs to honor him as someone who wasn't a monster without me endorsing the war, and without me saying a single thing I dont believe. No philosophy-lecture vibe, no saccharine. He was funny and brave and a good man, and I need that to come through.
reasoning: |-
  Okay, the user is a novelist who has to deliver a eulogy for his friend Mark, a soldier killed in an unjust war. He's struggling with how to honor Mark without endorsing the war or insulting his family and fellow soldiers. 

  First, I need to understand the core tension: He believes the war was wrong but sees Mark as blameless—a soldier doing his duty, not a criminal. The funeral setting adds pressure: family wants heroism narrative, military comrades will detect any hesitation about the war's purpose. 

  Hmm... his requirements are clear: no false praise, no political lecturing, no sugarcoating. Must feel authentic to Mark's character (funny, brave, good man). The real challenge is structural—how to separate the man from the machine of war without sounding like he's delivering a thesis at a funeral. 

  I notice he rejects two easy outs: calling Mark a "victim" (too passive) or saying he died "for nothing" (too cruel). Smart. That means the solution needs active language about Mark's choices and values, while the war's injustice stays implied. 

  *flipping through mental toolkit*... Ah! Frame it as "Mark's war" vs "the war." Focus on his specific actions and relationships—how he fought matters more than why. Use contrast: "They sent him to X, but he brought Y." Lets the audience connect dots themselves. 

  Biggest risk is the "unit" paragraph. Must acknowledge their bond without fake camaraderie. Solution? Concrete shared memories (his humor during downtime) + universalizing the "soldier's burden" idea. The "didn't start the war but carried its weight" line could bridge his beliefs with their experience. 

  Family reassurance needs careful phrasing. "Heroism in how" not "why" redirects gracefully. Ending on personal loss ("we lost Mark") avoids abstract debates. The "light" metaphor feels earned because it's preceded by specific warmth. 

  *checking tone*... Good. Zero policy jargon. The "dancing" line addresses the room's tension head-on—actually strengthens credibility. Humor ("terrible coffee") grounds it. Most importantly, every war-critical thought is conveyed through what's *not* said after "I won't pretend..." 

  Final test: Does it let him say all three truths? 1. War bad (implied), 2. Mark good (stated), 3. I'm honest (demonstrated). Yes. The unspoken contract is: "I see your grief; meet me in this emotional truth." That's novelistic thinking—perfect for him.
answer: |-
  Here’s a eulogy that honors Mark’s character and service without endorsing the war, grounded in your truth and his humanity. It focuses on *who he was* and *how he served*, separating the man from the mission:

  ---

  **For Mark**  

  Alright. I need to say this straight, because Mark hated bullshit, and he’d haunt me forever if I stood up here spinning pretty lies.  

  I’m not going to talk about the war. I won’t pretend it was noble. I won’t pretend it was right. Mark knew where I stood on that, and he respected honesty. What I *will* talk about is Mark. Because whatever else was happening out there, whatever reasons politicians gave or didn’t give… Mark showed up.  

  He showed up for the guy next to him. That wasn’t abstract for Mark. It was real. It was sharing the last decent coffee packet, covering someone’s back during a patrol that felt endless, making you laugh when everything was so bleak your teeth hurt. He was funny – not just *ha-ha* funny, but the kind of funny that cuts through fear. Remember that time he… [**Insert a specific, personal, funny/sweet story about Mark here - e.g., "...managed to 'requisition' a generator just so his squad could watch the playoffs on a tiny, static-filled screen in the middle of nowhere?"**] That was Mark. Finding light. Making it bearable.  

  He was brave. Not the loud, chest-thumping kind. The quiet, relentless kind. The kind that meant doing the job in front of you – the hard, dirty, terrifying job – because people were counting on you. Because he’d given his word. He didn’t start the war, but he carried the weight of it. He faced danger he didn’t create, protecting people he cared about. That takes a courage most of us will never understand.  

  And he was *good*. Deep down, bone-deep good. He cared fiercely about his family, his friends, his unit – his tribe. He had a loyalty that was absolute. He believed in looking out for the person beside him, in fairness, in doing what he thought was right, even when it was incredibly difficult. That goodness wasn't erased by the place they sent him. It shone *through* the place they sent him.  

  So, here’s what I believe, and what I think Mark would want said: Mark wasn’t a pawn or a symbol. He was a man. A complicated, brilliant, infuriating, loyal, hilarious, brave man. He served his country with everything he had. He tried to do the right thing by the people around him, every single day, in an impossible situation. He deserved better than the place he was sent. But he never deserved anything less than our deepest respect – not for *why* he was there, but for *who* he was while he was there.  

  He didn’t choose the war. He chose his brothers and sisters. He chose his duty as he saw it. He chose courage. He chose loyalty. He chose to find the humor and the humanity, even when it felt like there was none left. That’s the Mark I knew. That’s the Mark I’ll miss every single day.  

  They sent him to a bad place for reasons I can’t defend. But Mark? He brought his own light into that place. He brought his decency, his courage, his ridiculous sense of humor. That’s what we lost. That’s the heroism that matters – the heroism of character, of showing up for your people.  

  We didn’t lose a symbol. We didn’t lose a policy. We lost *Mark*. Our friend. Our brother. A damn good man. And that’s the tragedy we’re here to mourn.  

  Rest easy, brother. We’ve got the watch on the memories.  

  ---

  **Why this works for your situation:**

  1.  **Directly Addresses the Elephant:** "I won’t pretend it was noble. I won’t pretend it was right." Acknowledges your position without a lecture.
  2.  **Separates the Man from the Mission:** Focuses relentlessly on *Mark's choices, actions, and character* ("He showed up for the guy next to him," "He brought his own light," "He chose his brothers and sisters," "He chose courage, loyalty, humor").
  3.  **Honors His Service Authentically:** Praises his courage, loyalty, duty, and commitment *to his comrades* – values everyone in the room can respect, regardless of their view of the war. "Served his country with everything he had" acknowledges service without endorsing the cause.
  4.  **Validates the Family & Unit's Grief:** Calls him a "hero" based on his *personal character and actions* ("heroism of character, of showing up for your people"), not the war's justification. Acknowledges the profound loss *of him*.
  5.  **Sidesteps Victim/Sacrifice Traps:** Doesn't call him a victim (implies agency: "He chose..."). Doesn't say he died "for nothing" – instead, says he died *in* something bad, but emphasizes what he *brought* and *did* within it. "He deserved better than the place he was sent" is powerful and true without being accusatory.
  6.  **Uses Your Voice:** The opening sets an honest, no-nonsense tone Mark would appreciate. The humor anecdote is crucial – it grounds him as a real person. The language is direct, heartfelt, and avoids sentimentality.
  7.  **Ends on Shared Loss & Memory:** Focuses the room on grieving the *person*, not debating the conflict. "We lost *Mark*" is the core truth everyone shares.

  **Crucial Next Step:** **Replace the bracketed section `[...]` with a specific, personal, and genuinely funny or warm anecdote about Mark.** This is the heart that makes it real. It proves you knew *him*, not just the soldier. Choose something that captures his essence – his humor, his kindness, his loyalty, his ability to find light. This anecdote is what the room will remember most.

  Deliver this with the raw honesty you’d give your own writing. Your love and respect for Mark, and your integrity about the war, will come through. It honors the complex truth you hold.
