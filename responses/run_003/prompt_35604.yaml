  First, I need to understand the core tension. The AAI camp argues that anyone affected by a decision should have a say, emphasizing moral inclusion and preventing externalities. The AS camp focuses on those subject to coercion, prioritizing institutional feasibility and avoiding overextension. The user hinted at key pain points: whether AAI leads to global democracy (and if that's acceptable), and how to handle ambiguous cases like non-citizen residents or pollution victims. 

  The document needs three parts: agreed claims, a disagreement table, and cruxes. For the agreed claims, I'll avoid platitudes—each point must do heavy lifting. For example, both sides likely agree the boundary problem is foundational (claim #1), that misdefining the demos creates legitimacy issues (#2), and that coercion matters (#3). I'll make sure these aren't vacuously worded; they should force both camps to confront shared stakes. 

  The table should map divergences cleanly. Row 1 will tackle the core demos definition, with AAI owning "anyone impacted" and AS owning "coercively bound." Row 2 will address the global democracy question—here's where the "bug vs. feature" clash surfaces. Row 3 covers ambiguous cases (e.g., undocumented immigrants), and Row 4 deals with feasibility. I'll phrase answers so each side feels accurately represented—no strawmen. 

  For cruxes, I'll highlight four: global scope, ambiguous cases, feasibility, and normative grounding. The user already flagged the first two, so I'll expand those. For global scope, I'll note AAI sees planetary inclusion as inevitable while AS calls it utopian. For ambiguous cases, I'll contrast AAI's "affected = included" with AS's "coercion test." Both sides should agree on what evidence would sway them (e.g., empirical work on decision externalities). 

  I suspect part of the deadlock is verbal—like differing uses of "legitimacy." I'll call that out explicitly. The goal is a document both camps could sign, forcing clarity on where they diverge and why. 

  Hmm, the user's frustration suggests they need more than just a rehash of theories—they want a tool to break paralysis. The adversarial format is smart: it pre-commits both sides to steelmanning. I'll keep tone neutral but incisive, like a mediator drafting terms for debate. 

  One risk: oversimplifying positions. I'll add caveats that AAI isn't always globalist (some bound it to "significantly affected"), and AS isn't always statist (some include de facto coercion). But the doc must remain punchy, so nuances go in footnotes. 

  Finally, the cruxes section should feel actionable—e.g., "if we resolved X, Y's position would shift." That's where real progress might happen.
answer: |-
  Here’s an adversarial-collaboration document designed to force clarity, avoid strawmen, and identify substantive vs. verbal disagreements. Both camps can genuinely endorse their respective columns, and shared claims are non-vacuous anchor points.

  ---

  ### **Adversarial Collaboration: The Boundary Problem of the Demos**  
  **Signed:**  
  [Names/Representatives of AAI Camp]  
  [Names/Representatives of AS Camp]  

  ---

  ### **I. Shared Foundational Claims**  
  We jointly affirm the following:  
  1.  **The Boundary Problem is Foundational**: Determining *who constitutes the demos* is logically prior to democratic theory’s core questions (e.g., legitimacy, procedure). A theory of democracy is incomplete without it.  
  2.  **Misdefining the Demos Risks Illegitimacy**: Errors in demarcation produce *systemic injustice*—either by excluding those owed a voice (AAI concern) or including those without standing to coerce (AS concern)—undermining democratic legitimacy.  
  3.  **Coercion is Central**: All legitimate political authority involves coercion. How coercion relates to membership is a key dispute (see disagreements).  
  4.  **Feasibility Matters in Practice**: Institutional implementation constraints are relevant to evaluating theories, though not dispositive for their normative validity.  
  5.  **The Problem is Dynamic**: Demoi are not static; decisions can change who is affected/subjected over time (e.g., climate policy).  

  ---

  ### **II. Table of Disagreements**  

  | **Sub-Question**                                                                 | **All-Affected-Interests (AAI) Camp**                                                                                             | **All-Subjected (AS) Camp**                                                                                                       |  
  |----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------|  
  | **1. Core Demarcation Criterion:** What defines membership in the demos?         | Membership requires that one’s *interests are meaningfully impacted* by a collective decision, regardless of territoriality or legal status. | Membership requires being *systematically subjected to the coercive rules* enforced by a specific polity’s legal-political order. |  
  | **2. Global Democracy Implication:** Does the principle necessitate planetary-scale democracy? | Yes, because major decisions (e.g., emissions, trade) affect interests globally. This is a *normative requirement*, not a flaw. Practical implementation is incremental but obligatory. | No. AS inherently bounds the demos to those within a polity’s *coercive jurisdiction*. "Global AS" is incoherent; no global sovereign exists to systematically subject individuals. |  
  | **3. Ambiguous Cases (e.g., non-citizen residents):** How should they be treated? | They must be included if their interests are significantly affected (e.g., taxation, residency rights). Exclusion is unjust disenfranchisement. | If they reside long-term, they *are* de facto systematically subjected to coercion (laws, police). Thus, they should be included via pathways to formal membership. |  
  | **4. External Parties Affected (e.g., pollution victims abroad):**               | They are owed inclusion (e.g., via transnational forums, proxy voting). Exclusion externalizes costs, violating democratic equality. | They lack membership as they aren’t subjected to the polluting state’s *ongoing legal enforcement*. Solutions require inter-polity agreements, not expanding the demos. |  
  | **5. Institutional Priority:** What makes a principle action-guiding?            | Feasibility concerns are secondary; morality demands we approximate inclusion of all affected, even if initially imperfect. | A principle must generate *identifiable, stable membership boundaries* for real institutions. AAI’s indeterminacy renders it non-actionable. |  

  ---

  ### **III. Cruxes: Resolvable Disagreements That Could Shift Positions**  
  If compelling evidence/arguments emerged on these points, at least one camp would materially adjust its stance.  

  #### **Crux 1: Does AAI *necessarily* imply global democracy?**  
  - **Shared Test**: Analyze whether major categories of decisions (e.g., climate, financial regulation) demonstrably affect interests *universally* or only *asymmetrically*.  
  - **AAI Prediction**: Evidence will show that high-impact decisions (e.g., carbon emissions, AI governance) affect all humans non-trivially, confirming global scope.  
  - **AS Prediction**: Evidence will show effects are often regional/clustered (e.g., trade blocs), allowing bounded demoi without global inclusion.  

  #### **Crux 2: Can AS coherently exclude clearly affected non-subjected individuals (e.g., pollution victims abroad)?**  
  - **Shared Test**: Examine if such individuals experience *coercion-like harms* (e.g., irremediable harm from external decisions without recourse).  
  - **AS Prediction**: These cases, while unjust, result from *state interaction*, not subjection to a *single sovereign*. Thus, solutions lie in international law, not demos expansion.  
  - **AAI Prediction**: Evidence of severe, unavoidable harm will show that "non-subjection" is a formalistic evasion of democratic responsibility.  

  #### **Crux 3: Can AAI avoid arbitrariness?**  
  - **Shared Test**: Identify a mechanism for operationalizing "meaningfully affected interests" with *determinate boundaries* in real policy contexts.  
  - **AS Prediction**: No such mechanism exists; "affectedness" is infinitely scalar and contestable (e.g., who is "affected" by a highway subsidy?).  
  - **AAI Prediction**: Thresholds of "significant impact" (e.g., cost-benefit thresholds, rights violations) can be democratically set without indeterminacy.  

  #### **Crux 4: Does long-term residence imply subjection?**  
  - **Shared Test**: Assess whether de facto coercion (e.g., policing, tax enforcement) applies equally to documented residents and citizens.  
  - **AS Prediction**: Evidence shows non-citizen residents face identical coercive enforcement; thus, they meet the AS criterion.  
  - **AAI Prediction**: Even subjected residents may be excluded on formal grounds; AS alone is insufficient without pathways to inclusion.  

  ---

  ### **IV. Apparent Verbal Disagreement**  
  - **Term: "Legitimacy"**  
    - AAI uses it as *moral justifiability* (requiring inclusion of affected interests).  
    - AS uses it as *institutional authority* (requiring bounded community capable of wielding coercion).  
    - **Why it matters**: This divergence masks deeper disagreement about whether democracy is primarily a *moral ideal* (AAI) or a *political institution* (AS). Calling this out reduces talking past each other.  

  --- 

  **Next Steps for the Group**:  
  1. Test the cruxes: Gather empirical/policy cases (e.g., climate treaties, immigration policies) and evaluate predictions.  
  2. Jointly define thresholds ("meaningfully affected," "systematically subjected") to reduce ambiguity.  
  3. Explore hybrid models (e.g., AS for core demos + AAI-derived obligations to external stakeholders).  

  This document isolates irreconcilable axioms (e.g., global morality vs. bounded institutions) while clarifying contingent disagreements amenable to evidence. By signing, both camps commit to steelmanning the other’s core arguments and engaging the cruxes.
