answer: |-
  It's fascinating that you've pinpointed this phenomenon so clearly within the high-stakes environment of healthcare data governance. What you're observing resonates strongly with a well-established, though perhaps less popularly understood, framework in privacy theory known as **contextual integrity**. This concept, most rigorously developed by philosopher Helen Nissenbaum, directly addresses the puzzle you describe: why the same information transfer can be perfectly appropriate in one setting and a profound violation in another, even when factors like consent and secrecy remain constant.

  Contextual integrity fundamentally shifts the focus away from viewing privacy *solely* as an individual's control over their information or as the simple concealment of secrets. Instead, it defines privacy as the appropriate flow of information within specific social contexts, governed by deeply embedded norms. These norms aren't arbitrary conventions; they arise organically to sustain the purposes, values, and trust essential to those contexts. Think of contexts like healthcare, banking, friendship, or the workplace – each has its own distinct set of rules about what information is relevant, who can legitimately possess it, and under what conditions it can be transmitted.

  Your examples perfectly illustrate this core idea. In the *context* of the pharmacy, the norm dictates that the pharmacist *needs* access to the prescription information to fulfill their professional role in patient care. The flow from patient record to pharmacist is appropriate and expected. However, the *same* information flowing from the pharmacist to a neighbor steps entirely outside that professional healthcare context and into the personal/social sphere. This constitutes a violation of contextual integrity because it breaches the norms governing the *purpose* of the original information collection and undermines the trust inherent in the patient-pharmacist relationship. Similarly, the wearable device collecting heartbeat data aligns with the context of personal health monitoring and care provision. Selling that data to an insurer thrusts it into the context of risk assessment and financial underwriting – a purpose fundamentally misaligned with the norms of trust and care established when the user adopted the device for health purposes.

  So how does this differ from the "control over information" model? The control model emphasizes individual autonomy: privacy is maintained if the individual consented to the collection or disclosure. Contextual integrity reveals the limitations of this view:

  1.  **Sufficiency of Consent:** Consent under the control model might be given broadly (e.g., "I consent to my data being used"), but contextual integrity shows that such blanket consent doesn't address whether the *subsequent use* aligns with the context in which consent was initially given. You might consent to your doctor having your records, but that doesn't mean consenting to them being discussed casually at a hospital cafeteria table.
  2.  **The Nature of the Wrong:** Under contextual integrity, a violation isn't *just* about a lack of individual control; it's about disrupting the social ecosystem. The wrong occurs because the inappropriate flow:
      *   **Betrays Trust:** It violates the implicit agreement formed by the context's norms (e.g., the trust that health information is used for care, not profit or gossip).
      *   **Undermines Contextual Function:** It can damage the context itself. If patients fear their information will flow inappropriately from the pharmacy, they may hide information or avoid care, harming the health context's core purpose.
      *   **Causes Dignitary Harm:** It treats individuals in ways inconsistent with their roles within the context (e.g., reducing a patient to a risk profile for an insurer based on data given for care).
  3.  **Defining "Appropriate":** Control models often struggle to define what uses are "appropriate" beyond consent. Contextual integrity grounds appropriateness in the specific, evolving norms of the context itself – its purposes, values, participants, and types of information.

  You rightly note the challenges: norms vary across communities and shift over time. This is inherent to contextual integrity and not a flaw, but a recognition of privacy's social embeddedness. The "edges" are indeed fuzzy. Determining the boundaries of a specific context (is "work" one context or many?), identifying the precise norms governing information flows within it (especially as technology creates new possibilities), and adjudicating conflicts between norms from different contexts (e.g., health reporting requirements vs. patient confidentiality) require careful, ongoing interpretation. This is precisely the work of governance committees like yours – not just applying rigid rules, but interpreting and upholding the integrity of the healthcare context in the face of evolving practices and technologies.

  The violations identified by contextual integrity are genuinely wrong, not just surprising, because they represent breaches of trust that sustain vital social structures. They exploit the vulnerability inherent in sharing information within a specific, purpose-driven relationship and divert that information towards ends potentially harmful to the individual or corrosive to the context itself. While local conventions shape the *specifics* of the norms, the *core principle* – that privacy is violated when information flows contravene the normative structure of a context – captures a fundamental truth about how information operates within human relationships and institutions. Your role involves navigating that complex, shifting landscape to protect the integrity of the healthcare context and the trust it requires.
