answer: |-
  Based on your friend's consistent judgments across the cases you've described, I'll break this down step by step: first, predict what he would say about the hiking scenario; second, infer the rule he seems to be using; third, explore other rules that fit his track record equally well; fourth, show how these alternative rules might yield different verdicts on the new case; and finally, suggest a further case to help settle which rule he's truly committed to.

  ### 1. **Prediction for the Hiking Case**
  Your friend would likely say that carrying the injured stranger down the mountain is **supererogatory** (i.e., beyond the call of duty, not morally required).

  **Reasoning based on his pattern:**  
  - In all cases where your friend deemed an action obligatory (e.g., jumping into the pond, calling 911, yelling a warning, pulling someone from the subway), the personal cost or risk was relatively **low, immediate, and involved minimal sustained effort or bodily risk**. For instance:
    - Ruining a suit or making a phone call involves financial or minor time costs, but no serious physical danger.
    - Quick physical interventions like pulling someone from a subway platform carry some risk, but it's brief and the potential harm to the rescuer is minor (e.g., a stumble) compared to the life saved.
  - Conversely, actions deemed supererogatory (e.g., donating a kidney, volunteering every Saturday, donating a large inheritance, using a vacation for charity) involve **significant personal sacrifice**, such as:
    - High physical risk (e.g., organ donation with long-term health implications).
    - Substantial time, effort, or resources (e.g., a year of weekly volunteering or giving up $10,000).
    - Sustained or irreversible commitments that go beyond a one-off emergency response.

  In the hiking scenario:
  - The action requires **hours of exhausting physical labor** with a **"real risk" of injury** (e.g., twisted ankle, back strain, or worse). This is not a quick, low-risk intervention like the obligatory cases; instead, it resembles the high-cost, high-effort nature of the supererogatory examples (e.g., building houses for the homeless during a vacation).
  - The benefit (saving a life) is high, but the cost to you is substantial: it involves bodily risk, prolonged effort, and potential for serious harm, aligning more with kidney donation (supererogatory) than pond rescue (obligatory).
  - While it's an emergency with no alternatives (like the subway or pond cases), the elevated personal risk and effort push it into supererogatory territory based on your friend's history. He consistently draws a line at actions that impose "significant sacrifice" on the agent.

  Thus, carrying the stranger down would be seen as going "beyond the call of duty"—praiseworthy if done, but not morally required.

  ### 2. **The Rule Your Friend Seems to Be Running**
  Based on the cases, your friend's judgments appear to follow a **cost-benefit rule with a threshold for permissible sacrifice**:

  - **An action is obligatory if:**  
    It prevents serious, imminent harm to others, and the cost or risk to the agent is **low**—meaning it involves minimal time, effort, financial loss, or physical risk. The action must also be direct, feasible, and not replaceable by less demanding means.

  - **An action is supererogatory if:**  
    It provides significant benefit to others (e.g., saving a life or improving welfare), but the cost or risk to the agent is **high**—such as substantial bodily risk, major financial loss, or sustained personal effort. This includes actions that are elective, ongoing, or involve irreversible sacrifices.

  **Key elements of this rule:**
  - **Imminence of harm:** Obligatory actions address immediate emergencies (e.g., drowning child, approaching train), while supererogatory actions often lack this urgency (e.g., donating a kidney or long-term volunteering).
  - **Magnitude of sacrifice:** Low-cost actions (e.g., yelling a warning) are obligatory; high-cost actions (e.g., donating $10,000) are supererogatory. The threshold seems to be crossed when risks include serious injury, long-term commitment, or significant resources.
  - **Feasibility and directness:** Obligatory actions are typically simple and one-off, with no better options (e.g., you're the only one who can act in the moment). Supererogatory actions may involve choices where alternatives exist or the burden is disproportionate.

  This rule fits all your cases:
  - Obligatory: Low cost (suit, phone call, shout) for high benefit in emergencies.
  - Supererogatory: High cost (organ, time, money) for high benefit, even if life-saving.

  ### 3. **Other Rules That Fit the Track Record Equally Well**
  Your friend's judgments are consistent, but multiple rules could explain them. Here are two alternative rules that also fit the existing cases, based on different ethical emphases:

  - **Rule 2: The Time-and-Effort Rule**  
    - Obligatory: Actions that are quick and require minimal sustained effort (e.g., under 5 minutes or a single, simple act).  
    - Supererogatory: Actions that demand prolonged, strenuous effort (e.g., hours, days, or ongoing commitment).  
    - Why it fits: All obligatory cases (pond, 911, yelling, subway) are near-instantaneous. Supererogatory cases (yearly volunteering, 2-week building, kidney recovery) involve extended time. Donating $10,000 is a one-time act but requires significant mental/emotional effort in giving up a plan.  
    - Difference from Rule 1: This focuses on duration rather than holistic cost/risk. Rule 1 includes bodily/financial risks; Rule 2 emphasizes time and physical exertion alone.

  - **Rule 3: The Bodily Integrity Rule**  
    - Obligatory: Actions that pose no serious threat to the agent's physical health or bodily integrity.  
    - Supererogatory: Actions that risk significant bodily harm, loss, or long-term health impacts.  
    - Why it fits: Obligatory actions have trivial or no bodily risk (e.g., ruining a suit is property damage; yelling is vocal effort). Supererogatory actions involve bodily sacrifice (kidney donation), or effort that could cause harm (e.g., building houses might risk injury, similar to hiking). Donating $10,000 isn't bodily but affects "personal integrity" via financial loss.  
    - Difference from Rule 1: This rule ignores non-bodily costs like time or money unless they indirectly threaten health. Rule 1 is broader, covering all costs.

  Both Rule 2 and Rule 3 fit your friend's track record as well as Rule 1 does, because in the cases provided, low cost/risk (Rule 1) often correlates with short duration (Rule 2) and no bodily threat (Rule 3). However, they could diverge in edge cases.

  ### 4. **How These Rules Yield Different Verdicts on the Hiking Case**
  - **Rule 1 (Cost-Benefit with Threshold):** Predicts supererogatory (as above) because the risk of injury and exhausting labor constitutes "high cost."
  - **Rule 2 (Time-and-Effort):** Predicts supererogatory because carrying someone down for hours is "prolonged effort," unlike quick rescues. This aligns with Rule 1.
  - **Rule 3 (Bodily Integrity):** Predicts supererogatory because the "real risk of injuring yourself" (e.g., back strain or worse) threatens bodily integrity, akin to kidney donation.

  **But here's the twist:** If we tweak the hiking scenario slightly, Rule 2 and Rule 3 could theoretically conflict with Rule 1 or each other. For example:
  - Suppose a case with **high time/effort but low bodily risk** (e.g., driving an injured person for hours on safe roads with no injury risk). Rule 2 (Time-and-Effort) might call it supererogatory due to duration, while Rule 1 (Cost-Benefit) might call it obligatory if the only cost is time and no risk exists. Rule 3 (Bodily Integrity) might also call it obligatory if no bodily threat is present.
  - Or, a case with **low time/effort but high bodily risk** (e.g., grabbing a live wire to save someone, risking electrocution). Rule 3 (Bodily Integrity) might say supererogatory due to risk, while Rule 1 (Cost-Benefit) might agree if risk is high. Rule 2 (Time-and-Effort) might say obligatory if it's quick.

  In the actual hiking case, though, all three rules align on supererogatory because it has both high effort (Rule 2) and bodily risk (Rule 3).

  ### 5. **A Further Case to Settle Which Rule He's Committed To**
  To distinguish between Rule 1, Rule 2, and Rule 3, propose this case to your friend:

  > **The Desert Roadside Rescue:**  
