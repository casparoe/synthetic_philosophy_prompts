answer: |-
  **Bottom line: The analogy that "Kelly is log-utility EU" captures a mathematical equivalence for single-period wealth maximization but obscures fundamental conceptual, normative, and operational differences, particularly concerning time, repeated reinvestment, and the interpretation of utility, making the conclusion that Kelly introduces nothing beyond EU misleading.**

  **Correspondences Table:**

  | Feature                     | Expected Utility Theory (EU) with Log Utility | Kelly Criterion                 |
  | :-------------------------- | :-------------------------------------------- | :------------------------------ |
  | **Objective Function**      | Maximize E[U(W)] with U(W) = log(W)           | Maximize E[log(W)]              |
  | **Mathematical Form (1-Period)** | Identical: E[log(W₁)] = E[log(W₀(1+fX))]      | Identical: E[log(W₁)] = E[log(W₀(1+fX))] |
  | **Implied Bet Sizing**      | Fraction `f*` maximizing E[log(1+fX)]         | Fraction `f*` maximizing E[log(1+fX)] |
  | **Risk Attitude (Formal)**  | Implicitly risk-averse (concave utility)      | Implicitly risk-averse          |
  | **Wealth Dynamics (Implied)** | Static: Focus on W₁ given W₀                 | Multiplicative: Wₙ = W₀ ∏(1+fᵢXᵢ) |

  **Where the Mapping Breaks:**

  1.  **Interpretation of the Utility Function:**
      *   **EU:** Log utility represents a *psychological attitude* – diminishing marginal utility of wealth. Risk aversion is a fundamental preference primitive. The focus is on the *state* of final wealth (W₁).
      *   **Kelly:** The log objective arises as the *growth-optimal criterion* for maximizing long-term wealth under *repeated, multiplicative reinvestment*. It's a *structural consequence* of the wealth evolution process (Wₙ = W₀ ∏(1+fᵢXᵢ)). Risk management (`f* < 1`) emerges as a property of maximizing long-run growth, not primarily as a psychological aversion. The focus is on the *rate* of growth (`G = lim_{N→∞} (1/N) log(W_N/W₀)` = E[log(1+fX)]`).

  2.  **Domain of Preferences:**
      *   **EU:** Preferences are defined over distributions of *terminal wealth* (W₁) at a specific horizon (often implicit or static). Time is typically extrinsic.
      *   **Kelly:** Preferences are inherently defined over the *entire path of wealth* (W₁, W₂, ..., Wₙ) or, more fundamentally, over the *asymptotic growth rate* (`G`). The process and reinvestment are central. Time is intrinsic to the compounding structure.

  3.  **Treatment of Time & Discounting:**
      *   **EU:** Time discounting is a separate preference parameter (e.g., β^t U(W_t)). The utility function `U(·)` itself is timeless.
      *   **Kelly:** Time discounting emerges *endogenously* from the multiplicative compounding. Maximizing `E[log(W_N)]` for large `N` is equivalent to maximizing the *growth rate per period* `G`. The "discounting" is implicit and geometric, driven by the compounding of growth factors (`W_N / W_0 = exp(NĜ)` where `Ĝ ≈ G`). Adding explicit time discounting (e.g., δ^t log(W_t)) fundamentally alters the Kelly objective and its long-run properties.

  4.  **Normative Foundation & Scope:**
      *   **EU:** Axiomatic foundation (e.g., von Neumann-Morgenstern) for rational choice under risk/uncertainty. Applies generally to one-off and repeated decisions. The log utility function is one arbitrary choice among many.
      *   **Kelly:** Founded on the goal of maximizing long-term capital growth under repeated, identical, independent multiplicative reinvestment. Its core justification is the property of maximizing `lim_{N→∞} W_N^{1/N}` almost surely (via the Law of Large Numbers and Breiman's Theorem). Its normative force is strongest and most distinctive *specifically* within this domain of repeated multiplicative bets. Using log utility in a one-off EU gamble lacks this distinctive growth-rate justification.

  5.  **Operational Demands (Fractional Betting):**
      *   **EU:** While log utility suggests fractional betting (`f*`) in a single gamble, EU doesn't inherently demand or structure *repeated reinvestment* of fractional winnings. The fractional bet is a consequence of utility curvature applied to a single outcome distribution.
      *   **Kelly:** Fractional betting (`f*`) is an *essential operational requirement* derived directly from the need to reinvest all capital repeatedly over the long term. The criterion explicitly defines *how* to reinvest (fraction `f*` of *current* wealth) to achieve the growth optimum.

  **Does the Conclusion Survive?**

  No, the conclusion that "Kelly is nothing but log-utility EU" does not survive intact once the disanalogies are considered. While mathematically equivalent for a single isolated decision over terminal wealth, the analogy:

  1.  **Ignores the Distinctive Foundation:** Kelly's core justification (maximizing long-run growth rate via multiplicative compounding) is fundamentally different from EU's axiomatic preference representation. Kelly provides a *reason why* log utility might be normatively compelling in a specific context that EU itself does not provide.
  2.  **Conflates Interpretation:** Equating the log function in Kelly (a growth-rate engine) with log utility in EU (a psychological curvature) misrepresents the rationale behind the criterion.
  3.  **Obscures Temporal Structure:** The EU framing abstracts away the critical element of *repeated reinvestment over time* and the endogenous emergence of discounting via compounding, which are central to Kelly's definition and justification.
  4.  **Overstates Generality:** While objections to EU axioms (e.g., violations of independence) might indirectly challenge *any* specific utility function choice, they do not directly invalidate Kelly's distinct growth-rate maximization property *within its intended domain* of repeated multiplicative bets. Kelly offers a specific, process-based normative target that is not simply "EU with log utility".

  **A Better Characterization:**

  The relationship is best characterized as **"The Kelly criterion *for long-term growth rate maximization under repeated multiplicative reinvestment* is mathematically equivalent to *single-period* expected utility maximization with a logarithmic utility function *over terminal wealth*."** However, this mathematical equivalence masks profound differences in:

  *   **Foundational Justification:** Growth-rate optimization vs. preference representation axioms.
  *   **Interpretation of Log:** Structural growth necessity vs. psychological risk attitude.
  *   **Temporal Dimension:** Intrinsic repeated process with endogenous compounding vs. static or extrinsically discounted outcomes.
  *   **Normative Scope:** Primarily compelling for repeated multiplicative reinvestment vs. general decision-making under risk.

  Kelly leverages the mathematical form of log-utility EU but imbues it with a distinct *operational meaning* and *normative target* grounded in the dynamics of capital growth over time, which the standard EU framework neither necessitates nor emphasizes.
