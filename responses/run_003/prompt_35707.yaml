answer: |-
  Your diagnosis perceptively identifies the core structure of the impasse: it is fundamentally a **clash of normative epistemic stances disguised as an empirical or semantic dispute**, compounded by a **reciprocal burden-of-proof disagreement**. Both sides are looking at the same historical record but interpreting it through incompatible frameworks of what constitutes "success," "retention," and "truth," and each demands that the other justify a foundational premise about the link between success and truth that they themselves hold as axiomatic or reject as implausible a priori.

  The realist *starts* from the conviction that the unprecedented empirical success of mature sciences (novel predictions, explanatory breadth, instrumental reliability) *must* be explained by some significant degree of representational accuracy. For them, the historical graveyard is not a counterexample but a challenge to refine what "approximately true" means. When they point to retained equations (e.g., Fresnel's equations surviving the demise of the ether) or preserved reference (e.g., "electron" referring to *something* real despite radical theory changes), they are not merely engaging in post-hoc rationalization *from the perspective of their stance*. They see it as identifying the *enduring core* of successful practice that genuinely latches onto reality. Their demand to the anti-realist is: "If success isn't indicative of truth, what *does* explain it so reliably?" They place the burden on the anti-realist to provide an equally compelling explanation for success without invoking truth-likeness.

  The anti-realist, however, *starts* from profound skepticism about our ability to access unobservable truths. They see the historical graveyard not as exceptions but as the rule, revealing the inherent fragility of theoretical claims beyond empirical adequacy. When they dismiss realist appeals to retention as post-hoc, it's because, from *their* stance, any "successful part" of a discarded theory only appears "retained" or "referential" *from the privileged vantage point of the successor theory*. The very act of identifying what was "working" or "referring" assumes the current theory's correctness, begging the question. Their demand to the realist is: "Show me a *necessary* connection, demonstrated *without* circular reliance on current theory, between empirical success and truth-likeness for unobservables." They place the burden on the realist to prove this link exists, seeing it as an unsubstantiated leap of faith.

  This is why attempts to resolve it empirically or semantically falter:
  1.  **Base Rates/Counting Theories:** Any statistical analysis presupposes how to individuate "theories" and define "successful retention" – precisely what the stances disagree on. Is the shift from Fresnel's ether optics to Maxwell's electromagnetism one theory replacing another, or one mathematical core surviving ontological change? Each side categorizes the cases to fit their narrative. The data is inherently theory-laden.
  2.  **Operationalizing "Approximately True":** Efforts to define it formally (e.g., structural realism, verisimilitude measures) either seem too weak to satisfy the realist (capturing only mathematical structure) or too strong/vague to convince the anti-realist (how much structure? What counts as "close enough"?). The anti-realist sees any such definition as an ad hoc salvage operation.
  3.  **Bayesian Priors:** While differing priors play a role, the disagreement runs deeper than mere credence. It's about what *counts* as evidence for theoretical truth. The realist sees retained success as strong evidence; the anti-realist sees it as consistent with persistent error regarding unobservables. The stances dictate how the "evidence" is interpreted.

  The impasse arises because:
  *   **Reciprocal Burden Shifting:** Realists demand an explanation for success without truth; anti-realists demand proof of a success-truth link. Neither accepts the other's starting premise as given.
  *   **Incommensurable Stances:** They are using different criteria to evaluate the same historical episodes and theoretical claims. What looks like progress to one looks like replacement to the other; what looks like retention looks like radical change.
  *   **No Neutral Ground:** There is no vantage point outside scientific practice itself to adjudicate the truth-conduciveness of that practice. We are always using our best current theories (or historical interpretations filtered through them) to judge past theories.

  **Breaking the Impasse?** A single historical case or formal result is unlikely to resolve this deep normative disagreement. However, a potential path forward lies in **shifting the question away from global claims about science to specific, tractable analyses of *how* success emerges**:

  1.  **Mechanistic Explanations of Success:** Instead of asking "Does success indicate truth?", ask "Through what specific *mechanisms* do successful theories achieve their empirical success, and what ontological commitments are genuinely necessary for *those mechanisms* to work?" This focuses on localized, detailed case studies of *how* theories work instrumentally, potentially revealing which elements are genuinely indispensable for the success and which are idle wheels – without requiring a global commitment to realism or anti-realism. This might bypass the burden-shifting by focusing on concrete explanations of practice.
  2.  **Focus on Practice & Models:** Analyzing scientific *practice* – model-building, idealization, robustness reasoning, inter-theoretic relations – rather than grand claims about "theories" and "truth." Understanding how scientists actually build reliable knowledge *despite* known falsity and idealization might offer a more nuanced picture than the global debate allows. This could lead to a form of "local realism" or "piecemeal realism" that is less vulnerable to the meta-induction but also doesn't claim sweeping truth for all theoretical posits.
  3.  **Acknowledging the Stance-Relativity:** Recognizing that the impasse stems from fundamentally different, rationally permissible starting points about the reach of scientific knowledge. The "resolution" might not be one side winning, but a clearer understanding of the presuppositions and limitations of each stance, leading to a more sophisticated, context-sensitive understanding of scientific knowledge – one that accepts historical contingency without abandoning the search for reliable explanations.

  The core disagreement is less about the facts of history or the meaning of words, and more about the fundamental norms governing how we interpret the significance of scientific achievement for our understanding of a reality beyond our senses. It's a debate about the *epistemic warrant* for ontological commitment in the face of historical flux and underdetermination. Recognizing this normative, burden-of-proof structure is crucial to understanding why it persists and where, if anywhere, progress might be found.
