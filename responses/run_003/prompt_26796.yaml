answer: |-
  Here is a specification of the desiderata for an adequate Scanlonian contractualist account of aggregation, grounded in the core view and the cases/considerations you provided. Each desideratum includes its status (non-negotiable or contestable), the core consideration behind it, and its implications.

  ### Desiderata for Contractualist Aggregation

  1.  **Permissible Saving of the Greater Number (Simple Rescue):**
      *   **Requirement:** Must classify saving five strangers over one stranger (all with equally strong claims to be saved from identical serious harm) as *permissible*, if not obligatory.
      *   **Consideration:** Intuition that allowing the death of five when one could have died instead is clearly worse, and any plausible morality must account for this. Reflects the core moral significance of saving lives.
      *   **Status:** **Non-negotiable** for any plausible version of contractualism. Failure here renders the theory deeply counterintuitive.

  2.  **Resistance to Aggregation of Trivial Harms Over Serious Harm (Unequal Trade-off):**
      *   **Requirement:** Must classify it as *impermissible* to impose a very serious harm (e.g., death, paralysis) on one person to prevent a much larger number of people from suffering a much smaller harm (e.g., minor headaches, brief pinpricks), even if the *total* burden prevented is larger.
      *   **Consideration:** The complaint of the individual suffering the serious harm cannot be overridden by the individually much weaker complaints of the many. Reflects the moral significance of the *magnitude* of individual burdens and the limits of summation.
      *   **Status:** **Non-negotiable** for core contractualism. This is a key fixed point differentiating it from utilitarianism and protecting individuals from being sacrificed for minor group benefits.

  3.  **Distinction: Intra-Personal vs. Inter-Personal Aggregation:**
      *   **Requirement:** Must recognize a fundamental moral difference between summing burdens *within a single life* (e.g., enduring many small pains to avoid one large pain) and summing burdens *across distinct lives* (e.g., imposing a large pain on one to spare many others small pains).
      *   **Consideration:** The "separateness of persons" (Desideratum 7). Burdens within one life are borne by a single agent whose overall well-being is the relevant consideration. Burdens across lives affect distinct agents with distinct claims.
      *   **Status:** **Non-negotiable** for contractualism. Denying this distinction collapses the view into a form of impersonal consequentialism incompatible with its individualistic foundations.

  4.  **Ex Ante vs. Ex Post Justification:**
      *   **Requirement:** Must provide a coherent account of the relationship between justification from the perspective of *prospects* before a risk is resolved (ex ante) and justification from the perspective of *actual outcomes* (ex post). Must resolve potential conflicts (e.g., when an ex ante fair risk results in an ex post severe burden on one individual).
      *   **Consideration:** Contractualism evaluates principles governing actions, which often involve risk. Individuals assess principles based on how they affect their prospects (ex ante), but also care deeply about the actual burdens they end up bearing (ex post). The core individualist restriction applies in both contexts.
      *   **Status:** **Contestable.** While *some* account of risk is non-negotiable, the specific priority or relationship between ex ante and ex post perspectives is a major point of debate *within* contractualism (e.g., "ex ante contractualism" vs. "ex post views").

  5.  **Complaints and Pairwise Comparison:**
      *   **Requirement:** Must define the nature of individual "complaints" against principles and the method for comparing their strength. Must explain when, if ever, the combined strength of many weaker complaints can outweigh one stronger complaint, and what mechanism achieves this without violating individualism.
      *   **Consideration:** The core of reasonable rejection hinges on individuals comparing their burden under a principle to their burden under alternatives. The "pairwise" nature (comparing one individual's situation across principles) is central, but the Simple Rescue case seems to require moving beyond strict one-vs-one comparison.
      *   **Status:** **Non-negotiable Core, Contestable Mechanism.** Defining complaints and comparison *is* the core machinery of contractualism. However, the *precise* mechanism (e.g., pure pairwise comparison vs. some form of "aggregation" or "clustering" of complaints under a principle) is highly contested. A mechanism that *always* lets the strongest single complaint veto is implausible (fails Desideratum 1); a mechanism that allows straightforward summation of complaint "weights" risks failing Desideratum 2 & 7.

  6.  **Individualist Restriction:**
      *   **Requirement:** Any principle permitting an individual to bear a burden for the sake of others must be justifiable *to that individual* by appealing to reasons *she herself has*. The justification cannot appeal solely to the impersonal good of the group or to reasons only others have.
      *   **Consideration:** The foundational commitment of Scanlonian contractualism. Moral principles must be justifiable to each person affected, respecting their status as separate sources of claims. Rejections are based on personal reasons.
      *   **Status:** **Absolutely Non-negotiable.** This is the defining constraint. Any proposal violating this ceases to be Scanlonian contractualism.

  7.  **The Separateness of Persons:**
      *   **Requirement:** Must explain why the distribution of harms/burdens across distinct individuals blocks the kind of straightforward, unproblematic summing that occurs within a single life (linking to Desideratum 3), and why this matters morally.
      *   **Consideration:** The fundamental intuition that individuals are distinct entities, not mere containers for utility. Sacrificing one for the aggregate gain of others treats them as a means, failing to respect their inviolability. This underpins the rejection of simple utilitarianism.
      *   **Status:** **Non-negotiable Core Insight, Contestable Implications.** While the *insight* is fundamental to contractualism, its precise *implications* for aggregation (beyond Desiderata 2 & 3) are part of what the aggregation debate aims to clarify.

  ### Conflicts and Tensions

  1.  **The Central Tension: Desiderata 1 vs. 2 vs. 5 vs. 6 vs. 7:**
      *   **Conflict:** Permitting the saving of the five (D1) seems to require some form of aggregation where the combined weaker complaints/losses of the five outweigh the stronger complaint/loss of the one. However, resisting trivial harms summing over serious ones (D2) forbids *unrestricted* aggregation. The individualist restriction (D6) demands that the one sacrificed must find the principle permitting this justifiable based on *their own reasons*, while the separateness of persons (D7) blocks treating individuals as fungible parts of a whole. The complaint mechanism (D5) must navigate this without collapsing into consequentialism.
      *   **Response:** This is the core challenge. The *right response is not to weaken any fixed desideratum (D1, D2, D3, D6, D7)*. Instead, the task is to develop a mechanism for complaints and pairwise comparison (D5) that *satisfies* the fixed desiderata. Proposals differ radically here (e.g., focusing on *ex ante* expectations, clustering complaints by principle, comparing representative individuals, weighting complaints non-linearly). Weakening D1 or D2 is abandoning core intuitions; weakening D3, D6, or D7 is abandoning contractualism.

  2.  **Ex Ante Fairness vs. Ex Post Complaints (D4 vs. D5/D6):**
      *   **Conflict:** A principle might be reasonably rejectable ex ante by no one (seemingly fair), yet lead to an outcome where an individual suffers a severe burden ex post. That individual, holding the "losing ticket," seems to have a very strong complaint against the principle *ex post*. How can the principle be justifiable *to them* (D6) given their actual outcome? Conversely, focusing only on ex post complaints might make any risky policy impermissible if *anyone* could end up worse off.
      *   **Response:** This tension highlights the contestability of D4. *Coherent rejection* involves assessing principles *as principles*, considering their general application. An individual's ex post complaint might be addressed by showing that the principle, *given the risks it imposes and the alternatives*, was one they couldn't reasonably reject *ex ante* based on their own prospects. However, this requires a robust account of reasonable ex ante evaluation that respects the potential ex post burden (a key challenge).

  ### The Most Exclusionary Requirement

  *   **The Individualist Restriction (Desideratum 6)** is the single most exclusionary requirement.
  *   **Why:** It categorically rules out *any* justification that appeals primarily to:
      *   **Impersonal Aggregative Value:** "The total good is maximized."
      *   **Group Rights/Interests:** "It's best for society/the majority."
      *   **Reasons Others Have, But the Sacrificed Individual Doesn't:** "It saves many others, though *you* gain nothing and lose greatly."
  *   **Excluded Proposals:** It directly excludes classical utilitarianism, prioritarianism, and any other view where the fundamental justification for imposing a loss on an individual rests on the *aggregated benefits to others* as an impersonal sum. Even sophisticated aggregative proposals within the broadly consequentialist camp are inadmissible unless they can be fully re-expressed in terms of reasons that justify the principle *to each individual*, including the one who loses out. This forces any contractualist account of aggregation to be radically different in structure from standard aggregative views.

  This specification provides the necessary fixed points and tensions before engaging with specific proposals. The core challenge remains: developing an account of complaints and pairwise comparison (D5) that satisfies the non-negotiable demands (D1, D2, D3, D6, D7) while navigating the complexities of risk (D4).
