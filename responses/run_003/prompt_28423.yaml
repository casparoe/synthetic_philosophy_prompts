prompt: |-
  In my cognitive science of religion course, the debate between adaptationist and byproduct accounts of religion has stalled in a way I find frustrating. Everyone now accepts roughly the same proximate machinery—hyperactive agency detection, minimally counterintuitive concepts, costly signaling, theory of mind—and the same cross-cultural and experimental findings, yet the two camps have not moved in years. The adaptationists hold that religion was selected because it delivered fitness benefits, chiefly through group cohesion and the policing of cooperation; the byproduct theorists hold that these very features are side effects of cognitive systems that evolved for unrelated tasks and were only later culturally elaborated. My working theory is that the disagreement is not really an empirical one about ancestral fitness effects, which no one can measure directly, but a disagreement about what an adaptation has to be and whether cultural group selection may count as a selection process. Diagnose what kind of disagreement this actually is: a hidden factual question, a verbal dispute over the term 'adaptation,' a difference about levels and units of selection, a difference about standards of evidence, or something else. Given your diagnosis, say what would actually count as progress—a formal model, a new kind of data, a conceptual distinction, or something else. Lead with your diagnosis in the first sentence, then give your reasoning, with no preamble and no restating of the question.
