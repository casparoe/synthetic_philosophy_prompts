  First, I need to unpack why this debate feels stuck despite shared proximate mechanisms. The user suspects it's not about empirical data but deeper conceptual issues. Hmm, they're probably right - when both sides agree on mechanisms but disagree on interpretation, it's often about definitions or frameworks.

  Looking at the core conflict: adaptationists emphasize group-level benefits like cohesion, while byproduct theorists see these as cultural side-effects. The key friction point seems to be whether cultural group selection "counts" as real evolution. That immediately signals a levels-of-selection problem. 

  I recall similar debates in evolutionary biology - the group selection wars, multilevel selection theory. The user's mention of "what an adaptation has to be" and "units of selection" confirms this. It's not that one side is wrong; they're operating with different fundamental assumptions about what constitutes a valid selective explanation.

  The user asks for diagnosis first: definitely a levels/units of selection dispute. But why has this persisted? Probably because: 1) "Adaptation" gets stretched between biological and cultural evolution, 2) Standards of evidence differ - adaptationists accept cultural transmission as selective while byproduct theorists demand genetic evidence.

