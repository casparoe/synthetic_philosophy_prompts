  My two roommates got stuck on a bargaining problem from our game theory seminar. The feasible set was S = {(x,y): x,y >= 0, x + 2y <= 100}, disagreement point (0,0). (1) One said the Kalai-Smorodinsky solution has to be (50,25), because the ideal point is (100,50) and KS picks the point where both get the same fraction of their max possible gain. (2) The other said that's exactly the problem: player 2's max is only 50 because the feasible set is skewed, so proportionaly fair just entrenches the asymmetry; if you care about fairness, you should pick the equal-utility point (100/3, 100/3). (3) The first one replied that (100/3, 100/3) isn't the KS solution, and equal utility isn't even invariant to affine rescalings of the utilities, so it's not a well-defined criterion; KS is supposed to be a symmetric solution that treats both players' maximum attainable gains as the basline. (4) The second one said that's just assuming proportional fairness is the premise, since the maximum attainable gain can itself be shaped by unfair background conditions, and KS still assumes cardinal utilities in the first place. I couldn't tell which one was more right, so can you adjudicate move by move, saying who's right about which specific point and what both of them are missing?
