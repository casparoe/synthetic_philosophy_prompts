prompt: |-
  I'm prepping a reading group on logical induction and I want a dialogue that doesnt just restate the abstract. Write one between a proponent of logical induction and a classical Bayesian. The proponent should argue that when we're unsure about the truth of long mathematical proofs, a sequence of probability assignments that can't be exploited by a computable betting strategy is a better norm than simple conditionalization; the Bayesian should push back by saying the no-exploit condition is just a way of hiding a prior and that, being a limit notion, it doesn't tell us what to believe at any finite stage. Have them work through a concrete case: a true but unprovable statement in Peano arithmetic, and a betting strategy that keeps buying it whenever its price stays below 1. Both should be competent, respond to each other's actual points, and the dialogue should end without a tidy resolution.
