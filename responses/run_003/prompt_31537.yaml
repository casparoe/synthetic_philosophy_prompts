  First, I need to recall Street's actual argument accurately. Her central point is that evolutionary pressures shaped our moral intuitions for survival advantages, not because they track objective moral truths. This creates an epistemic challenge for realists who must explain why our evolved beliefs align with mind-independent moral facts. The host frames this through Ockham's razor—suggesting moral facts are explanatorily redundant—and concludes that realism is incompatible with evolutionary psychology.

  I notice several potential issues in the host's summary. First, he frames Street as demonstrating incompatibility "full stop," but Street's position is more nuanced—she sees it as creating a significant epistemic burden rather than outright impossibility. The host also oversimplifies the third-factor response by dismissing all versions as question-begging, whereas sophisticated versions (like Enoch's or Wielenberg's) propose independent links between survival value and moral truth.

  The user seems philosophically literate but self-identifies as a non-specialist. They're likely seeking clarity on whether the podcast's confident tone reflects scholarly consensus. Their deeper need might be to understand if metaethical realism remains viable post-Street, given how decisively the host presented the argument.

  I'll structure my response to: 
  (1) Validate accurate elements (e.g., core evolutionary premise) 
  (2) Flag overstatements (e.g., "redundant hypothesis," incompatibility claim) 
  (3) Explain why third-factor responses aren't uniformly question-begging 
