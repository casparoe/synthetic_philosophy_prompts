answer: |-
  Here is a philosophical analysis of polygenic embryo screening, addressing each section as requested:

  **Section 1: The Implicit Theory**
  The practice fundamentally presupposes a strong form of **procreative beneficence**: parents have an obligation to select the embryo with the statistically highest probability of a "better life," defined primarily as one with reduced genetic liability for specific diseases (schizophrenia, T2D, CAD) and sometimes enhanced traits (educational attainment). This implies a **welfarist conception of value**, where "better" means lower disease risk and potentially higher social/cognitive functioning. The selection against embryos based on polygenic scores for conditions like schizophrenia or diabetes presupposes that these conditions make a life *intrinsically worse* in terms of health, well-being, or flourishing potential. Crucially, this commits the practice to the view that the lives of existing people with these conditions *are* diminished in value compared to lives without them, *at the genetic propensity level*. While providers might deny devaluing existing individuals, the practice's logic inherently ranks lives with higher genetic risk scores as less desirable prospects, creating tension with disability-positive views that locate disadvantage primarily in social factors, not inherent biological deficit.

  **Section 2: Strictly Presupposed vs. Merely Compatible**
  *   **Strictly Presupposed:**
      1.  **Differential Welfare Potential:** Polygenic scores (PGS) track something *morally relevant* to future well-being (e.g., disease susceptibility impacting quality of life). The practice collapses if PGS are seen as irrelevant to welfare.
      2.  **Parental Optimization Obligation:** Parents have a significant duty to use available information to improve the expected life prospects of their future child.
      3.  **Actionable Difference:** Genetic differences between embryos (captured by PGS) are significant enough to warrant action (selection).
      4.  **Instrumental Value of Traits:** Lower disease risk/higher cognitive potential *instrumentally* contribute to a better life (healthier, more flourishing).
  *   **Merely Compatible:**
      1.  **Value Theory:** It fits welfarism (focus on well-being) and perfectionism (focus on developing certain capacities) but isn't *strictly* tied to either. It could technically operate under a purely preference-satisfaction view if parents *believe* these traits matter.
      2.  **Source of Obligation:** The obligation could stem from beneficence (direct duty to child) or autonomy (parental right to pursue their vision of a good life for the child).
      3.  **Scope:** It *can* include non-disease traits but doesn't strictly require it (some jurisdictions ban this).

  **Section 3: The Eugenics Question**
  The practice presupposes that the **moral wrong of historical eugenics lay primarily in its *methods* (state coercion, violation of reproductive freedom) and *aims* (racial purity, social hierarchy)**, not necessarily in the *act* of selecting for/against traits *per se*. It assumes the "liberal" framework – individual choice, welfare-oriented goals – successfully insulates it from the core objections to historical eugenics. However, this framing presupposes that the problematic "attitude" expressed by selecting against certain traits (e.g., deeming lives with schizophrenia as inherently less desirable) is morally neutral or acceptable *as long as it's chosen by individuals*. It dismisses critiques arguing that the expressive harm – the judgment that certain lives are less worth creating – is intrinsically problematic, regardless of state involvement. The practice thus relies on the presupposition that the distinction between coercive state eugenics and individual choice-based selection is morally decisive.

  **Section 4: Underdetermination**
  The practice is philosophically underdetermined in several key areas:
  1.  **Why select?** It doesn't specify the *underlying moral reason* for selection. It could equally satisfy:
      *   **Pure Autonomy:** Parents have the right to choose based on any valued trait.
      *   **Harm Prevention:** Parents have a duty to prevent predictable suffering from disease.
      *   **Perfectionism:** Parents should promote objectively "better" human capacities.
  2.  **Value Trade-offs:** It provides no principled way to resolve conflicts when selecting *between* traits (e.g., an embryo with lower schizophrenia risk but lower predicted education vs. the opposite). Is disease prevention always paramount?
  3.  **Scope of "Benefit":** It doesn't define the boundary between selecting against severe suffering and selecting for enhancement. Is selecting for educational attainment preventing harm or pursuing advantage?
  4.  **The Nature of Disability:** It remains agnostic on whether disability disadvantages are primarily biological or social, focusing solely on genetic risk.

  **Section 5: Change Under a Rival View (Expressivist/Disability Critique)**
  Adopting the expressivist view – that selecting against embryos with a trait expresses the harmful judgment that lives with that trait are less worth living – would necessitate radical change:
  1.  **Cessation:** Selection for non-lethal conditions (schizophrenia, diabetes, educational attainment) would likely cease entirely, as the core expressive harm remains regardless of the condition's severity.
  2.  **Severe Restriction (Possible):** *If* selection continued at all, it would be rigorously restricted only to conditions universally recognized as causing profound, unavoidable suffering incompatible with any meaningful life experience, typically lethal childhood disorders (e.g., Tay-Sachs), where the selection is framed solely as preventing unbearable pain, not judging the worth of a *type* of life.
  3.  **Reframing & Marketing:** Marketing would be banned from implying embryos or future lives are "better" or "healthier" in a broad sense. Language would shift exclusively to preventing specific, severe, untreatable medical conditions causing early death or extreme suffering. Counseling would emphatically stress the equal value of existing people with disabilities and challenge assumptions that genetic risk dictates life quality.
  4.  **Counseling Focus:** Counseling would prioritize parental values exploration and explicitly challenge notions that genetic risk equates to a less valuable life, focusing instead on societal support and adaptation. The service could not be framed as giving a child "the best odds."
