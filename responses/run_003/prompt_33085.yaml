  I'll start brainstorming possible interpretations of that phrase. The literal meaning is about divine grace sparing someone from misfortune. But in moral contexts, it often shifts to acknowledging luck's role in life outcomes. Possible readings range from acknowledging human fallibility (banal) to complete denial of responsibility due to luck (radical).

  For each interpretation, I must assess:
  1) What it claims precisely
