answer: |-
  You're dodging the core philosophical problem with practicality. Sure, no casino has infinite money, and we could cap the game at, say, 1024 flips or the casino's entire bankroll. But that doesn't resolve the fundamental contradiction in decision theory! Even capped at a *merely* astronomical sum – say, a billion dollars for 30 heads in a row – the *expected value* of the game remains huge because the tiny probability of that jackpot drags the average way up. Yet rational people still wouldn't pay anywhere near that expected value to play. Your "real-world limitations" just move the absurdity point; they don't eliminate it. Expected utility theory, the bedrock of rational choice, tells me I should liquidate my life savings to play a game capped at a million dollars, because the 1-in-a-million chance of winning $2^20 (over a million dollars) alone makes the expected value soar. That humans *don't* do this reveals a deep flaw in how we model rationality when faced with extreme, low-probability payoffs. Dismissing it as "unrealistic" ignores the mathematical contradiction screaming at us. Your turn. Why won't you pay even $500 for a capped version with a plausible maximum prize?
