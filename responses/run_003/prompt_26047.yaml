  Classical approach would tell them to only care about their effort, dismissing disappointment about the review as irrational. Modern approach would validate working to improve based on feedback while releasing attachment to the rating itself. 

  The structural crack here is that classical Stoicism treats anything not 100% self-determined as indifferent—including others' perceptions shaped by your actions. Whereas modern Stoics see influence as morally significant even if not guaranteed. 

  For the defense: A classical Stoic would argue that calling their view callous misunderstands "indifference." They'd say caring about others isn't forbidden—you just can't stake your virtue on outcomes. The tranquility comes from knowing you acted rightly, not from controlling others' responses. 

