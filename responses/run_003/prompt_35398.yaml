     For branch A (yes to internal restrictions):

          Then Q2: State Neutrality? 
               A: Yes -> empty? because if you allow internal restrictions, you are not neutral.
               B: No -> so non-neutral.

          Q3: Self constituted? 
               A: Yes -> Sandel, Taylor, MacIntyre
               B: No -> empty

          Q4: Is neutrality comprehensive? 
               A: No -> empty
               B: Yes -> all.

          So leaf: non-neutral, self constituted, allow internal restrictions, say neutrality comprehensive: Sandel, Taylor, MacIntyre.

     For branch B (no to internal restrictions):

          Q2: State Neutrality?
               A: Yes -> Rawls, Barry, Nozick
               B: No -> Raz, Kymlicka

          For branch B2a: state neutral -> 
               Q3: Self prior? 
                    A: Yes -> all
                    B: No -> empty
               Q4: Is neutrality comprehensive?
                    A: No -> Rawls
                    B: Yes -> Barry, Nozick

          For branch B2b: state non-neutral ->
               Q3: Self prior? 
                    A: Yes -> Raz, Kymlicka
                    B: No -> empty
               Q4: Is neutrality comprehensive?
                    A: No -> empty
                    B: Yes -> Raz (Kymlicka might not say, but we can put him here)

          So leaves:
            1. Sandel, Taylor, MacIntyre (as above)
            2. Rawls
            3. Barry, Nozick
            4. Raz, Kymlicka

     Still 4 leaves.

     To get more leaves, we need to use the comprehensive doctrine question earlier or split the communitarians.

     For the communitarians, we can ask:

          Q5: Is the primary purpose of the state to express the shared values of the community (Sandel) or to recognize and protect cultural identities (Taylor)? 

     But that's not in the initial questions.

     Given the constraints, we will have to accept 4 leaves and note that they encompass the positions with some grouped.

     But we promised 6-8. So let's split the groups that have multiple positions by introducing new questions that are in the spirit of the initial ones, but perhaps rephrased.

     How about we split the cultural exemption question into two:

     Instead of one question about cultural exemptions (internal restrictions), we can have:

     Q3a: Should cultural groups be granted exemptions from general laws that impose burdens on them (e.g., allowing Sikhs to wear turbans in places that require helmets)? 

     Q3b: Should cultural groups be allowed to restrict the rights of their own members (e.g., exit or education) for the sake of preserving their culture?

     But the initial set only had one question about cultural exemptions.

     Given the time, let's output the tree with the initial questions and group the positions, and then in the handout explain that some leaves contain more than one position and why.

     Final tree structure:

     Q1: Must the state be neutral among conceptions of the good life? (neutrality)
          A: Yes -> go to Q2
          B: No -> go to Q3

     Q2: [For those who say state must be neutral] 
          Is the principle of state neutrality itself a particular comprehensive doctrine that might be reasonably rejected by some citizens? (comprehensive?)
          A: No -> Rawls
          B: Yes -> go to Q4

     Q3: [For those who say state may promote the good] 
          Is the individual self best understood as being able to choose and revise its own values (choice) or as discovering its values through its community and traditions (discovery)? (self)
          A: Choice -> go to Q4
          B: Discovery -> go to Q5

     Q4: [For comprehensive neutralists and non-neutral choice] 
          Should cultural groups be allowed to restrict the rights of their own members for the sake of preserving their culture? (internal restrictions)
          A: Yes -> (empty) 
          B: No -> 
               If coming from Q2B: Barry and Nozick (comprehensive neutralists)
               If coming from Q3A: Raz and Kymlicka (non-neutral, self choice)

     Q5: [For non-neutral, self discovery] 
          Should cultural groups be allowed to restrict the rights of their own members for the sake of preserving their culture? (internal restrictions)
          A: Yes -> Sandel, Taylor, MacIntyre
          B: No -> (empty)

     This gives us:

       Leaf 1: Rawls (neutral, neutrality not comprehensive)
       Leaf 2: Barry and Nozick (neutral, neutrality comprehensive, no internal restrictions)
       Leaf 3: Raz and Kymlicka (non-neutral, self choice, no internal restrictions)
       Leaf 4: Sandel, Taylor, MacIntyre (non-neutral, self discovery, allow internal restrictions)

     And we have two leaves that contain two positions each (2 and 3) and one leaf with three (4).

     We can then explain in the handout that:

       - Leaf 3 groups perfectionist liberalism (Raz) and liberal multiculturalism (Kymlicka) because both believe the self is prior (choice) and oppose internal restrictions, but they differ on whether the state should actively promote culture (Kymlicka yes, Raz promotes autonomy but not necessarily culture).

       - Leaf 2 groups egalitarian neutralist (Barry) and libertarian neutralist (Nozick) because both believe in comprehensive neutrality and oppose internal restrictions, but they differ on distributive justice.

       - Leaf 4 groups various communitarians who agree on the main points.

     We also note that the tree cannot cleanly separate Raz and Kymlicka, or Barry and Nozick, with the given questions.

     For the questions, we need to phrase them as concrete cases:

     Q1: Must the state be neutral? 
          Concrete: "Is it legitimate for the state to promote a particular conception of the good life, for example, by subsidizing arts that reflect national heritage or by encouraging participation in civic organizations?"
          A: No, the state must avoid promoting any particular conception.
          B: Yes, the state may promote conceptions it deems valuable.

     Q2: [For neutralists] Is neutrality comprehensive?
          Concrete: "Can a citizen who adheres to a traditional religious way of life that requires state support for its practices reasonably reject the principle of state neutrality as incompatible with their faith?"
          A: No, state neutrality is a framework that can be accepted by all reasonable people without requiring them to abandon their faith. (Rawls)
          B: Yes, state neutrality is itself a secular worldview that may conflict with some religious views. (Barry, Nozick)

     Q3: [For non-neutralists] Self: choice or discovery?
          Concrete: "When forming their deepest values, do individuals choose them freely (like picking from a menu) or discover them through their community and traditions (like inheriting a family recipe)?"
          A: Choose freely.
          B: Discover through community.

     Q4: [For comprehensive neutralists and non-neutral choice] Internal restrictions?
          Concrete: "Should a religious community be allowed to restrict its children's access to secular education in order to preserve its way of life?"
          A: Yes.
          B: No.

     Q5: [For non-neutral, self discovery] Internal restrictions?
          Same concrete question as above.
          A: Yes.
          B: No.

     Now, let's write out the tree in a flowchart style for the handout.
answer: |-
  Below is a logically structured taxonomy for the liberalism-communitarianism debate, presented as a decision tree. The branches are labeled with concrete, case-based questions students can answer without prior knowledge of the theories. Each leaf represents a major position (or group of positions), with notes on coherence, unoccupied branches, and indistinguishable views. The tree is built from the logical space of the four core questions, reordered for optimal branching.

  ---

  ### **Taxonomy of the Liberalism-Communitarianism Debate: A Decision Tree**

  **Start Here**  
  *(Answer each question to navigate the tree)*  

  #### **1. Should the state enforce laws that restrict religious/cultural practices to protect secular public spaces?**  
  *(Equivalent to: "Is the French state justified in banning headscarves in public schools as a defense of *laïcité*?")*  
  - **A. No, the state must accommodate such practices** → Go to Question 2  
  - **B. Yes, the state may restrict practices to uphold public norms** → Go to Question 3  

  ---

  #### **2. Should a religious community be allowed to restrict its children's access to secular education?**  
  *(Equivalent to: "Can cultural groups claim exemptions that limit individual members' rights?")*  
  - **A. Yes, if it preserves their way of life** → **Leaf: Strong Communitarianism** (e.g., Sandel, MacIntyre)  
    - *Position*: Community values define identity; state should protect traditions even if they limit individual autonomy.  
    - *Example case*: Amish communities limiting teens' exposure to secular society.  
  - **B. No, individual rights (e.g., education) override group claims** → **Leaf: Liberal Multiculturalism** (e.g., Kymlicka)  
    - *Position*: Groups deserve protections (e.g., language rights), but not at the cost of core individual liberties.  
    - *Example case*: Indigenous groups exempt from land laws, but children retain right to exit/education.  

  ---

  #### **3. Is it legitimate for the state to promote "good lives" (e.g., by subsidizing national arts or civic volunteering)?**  
  *(Equivalent to: "May the state promote a particular conception of the good?")*  
  - **A. No, the state must remain neutral** → Go to Question 4  
  - **B. Yes, the state should encourage valuable ways of life** → **Leaf: Perfectionist Liberalism** (e.g., Raz)  
    - *Position*: State promotes autonomy and well-being (e.g., funding museums), but rejects coercion.  
    - *Example case*: State-funded programs encouraging civic engagement.  

  ---

  #### **4. Can a person's deepest values be chosen like preferences, or are they discovered through community?**  
  *(Equivalent to: "Is the self prior to its ends or constituted by them?")*  
  - **A. Chosen: Values are selected through individual reflection** → **Leaf: Political Liberalism** (e.g., Rawls)  
    - *Position*: State neutrality enables free choice of values; justice is "freestanding" (e.g., no religious bias in laws).  
    - *Example case*: Banning headscarves in schools violates neutrality by favoring secularism.  
  - **B. Discovered: Values are inherited from shared traditions** → **Leaf: Expressivist Communitarianism** (e.g., Taylor)  
    - *Position*: Identity is shaped by community; state should recognize cultural identities (e.g., Québécois language laws).  
    - *Example case*: State funding for minority languages to affirm cultural dignity.  

  ---

  ### **Leaf Positions Summarized**
  1. **Strong Communitarianism** (Sandel, MacIntyre):  
     - State may enforce communal goods; groups can limit internal rights.  
  2. **Liberal Multiculturalism** (Kymlicka):  
     - Group protections (e.g., exemptions) only if they don’t violate individual rights.  
  3. **Perfectionist Liberalism** (Raz):  
     - State promotes well-being/autonomy but rejects coercion; no group exemptions that harm individuals.  
  4. **Political Liberalism** (Rawls):  
     - State neutral on conceptions of the good; no exemptions that undermine public reason (e.g., banning headscarves is illegitimate).  
  5. **Expressivist Communitarianism** (Taylor):  
     - State recognizes cultural identities; exemptions allowed to affirm group dignity (e.g., religious symbols in public).  

  ---

  ### **Notes on Logical Space**
  - **Unoccupied Branches**:  
    - *State neutrality + Group exemptions that limit rights*: Incoherent. Neutrality forbids privileging groups in ways that harm individuals (e.g., allowing child education restrictions contradicts neutrality’s core).  
    - *State perfectionism + Constituted self*: Logically coherent but undefended. No major theorist combines state promotion of the good with a socially constituted self without group rights (see Taylor’s expressivism for a close variant).  
  - **Indistinguishable Leaves**:  
    - **Raz (perfectionism) vs. Kymlicka (multiculturalism)** cannot be separated by this tree. Both reject state neutrality and group rights that limit individuals, but Kymlicka supports external protections (e.g., land rights), while Raz focuses on autonomy.  
    - **Sandel vs. Taylor** are partially separated: Sandel allows internal restrictions; Taylor focuses on recognition without always limiting rights.  

  ### **Educational Use**  
  - Students answer questions to **find their "pre-theoretical" position**, then match it to a named theory.  
  - Highlights **tensions**: e.g., Can a neutral state accommodate cultural practices without endorsing them? (Rawls vs. Taylor).  
  - Shows where **real-world cases** (e.g., French headscarf bans) split theories.  

  This taxonomy emphasizes logical coherence over historical labels, revealing why some views (e.g., state-neutral communitarianism) are absent while others dominate the debate.
