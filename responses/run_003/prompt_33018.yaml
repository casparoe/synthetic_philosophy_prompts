  Below is a decision tree designed to help students identify their underlying views on the value of originals versus perfect copies in art. The tree starts with a single opening question and branches through concrete cases (including your required examples) without using philosophical labels in the nodes. Each node is a yes/no question based on a specific scenario, and positions emerge as leaves based on answer combinations. The tree has **8 nodes** and covers all requested leaves.

  ### Decision Tree: Why (or Whether) Originals Have Unique Value

  **Start at Node 0:**  
  **Node 0:** A machine creates a molecule-for-molecule duplicate of a famous painting (e.g., Van Gogh's *Starry Night*), physically identical to the original. Does this duplicate have the same *artistic value* as the original?  
  - **Yes** → Node 1  
  - **No** → Node 2  

  **Node 1 (for "Yes" at Node 0):**  
  A bit-perfect copy of a digital music recording (e.g., a classic album) is indistinguishable from the original. Does this copy have the same *artistic value* as the original?  
  - **Yes** → Node 3  
  - **No** → Node 4  

  **Node 2 (for "No" at Node 0):**  
  A painting accepted as a Rembrandt for decades is exposed as a 20th-century forgery. After exposure, does it have *less artistic value* than it did before exposure?  
  - **Yes** → Node 5  
  - **No** → Node 6  

  **Node 3 (for "Yes" at Node 1):**  
  A newly discovered manuscript page by a famous author changes how we interpret their novel. A perfect physical copy of this page (e.g., a scan) is created. Does the *original page* have artistic value that the copy lacks?  
  - **Yes** → **Leaf: Institutional-Contextualism**  
    *Awkward commitment: Artistic value is entirely determined by institutional consensus, so a work's status can flip overnight with no change to the object itself.*  
  - **No** → **Leaf: Aesthetic Empiricism (Duplicationism)**  
    *Awkward commitment: A known forgery has the same artistic value as an original if it provides an identical perceptual experience.*  

  **Node 4 (for "No" at Node 1):**  
  The music copy from Node 1 is sold as the original to deceive buyers. If it were honestly labeled as a copy from the start, would it have *less artistic value* than the original?  
  - **Yes** → **Leaf: Market View**  
    *Awkward commitment: In a world without art markets or collectors, originals would have no special value over copies.*  
  - **No** → **Leaf: Allographic Dissolve**  
    *Awkward commitment: A perfect copy of a painting must be treated differently from a perfect copy of music, even if both are physically identical to their originals.*  

  **Node 5 (for "Yes" at Node 2):**  
  If the forgery from Node 2 had been revealed as a forgery *from the very beginning* (no deception occurred), would it *still* have less artistic value than a real Rembrandt?  
  - **Yes** → Node 7  
  - **No** → **Leaf: Deception or Moral View**  
    *Awkward commitment: A non-deceptive forgery (e.g., honestly displayed) has the same artistic value as an original.*  

  **Node 6 (for "No" at Node 2):**  
  After exposure, is the forgery from Node 2 now valued as a work of the *forger* (rather than Rembrandt)?  
  - **Yes** → **Leaf: Institutional-Contextualism** (same leaf as in Node 3)  
  - **No** → **Leaf: Market View** (same leaf as in Node 4)  

  **Node 7 (for "Yes" at Node 5):**  
  The newly discovered manuscript page from Node 3 is analyzed. Does the *original page* have artistic value that a perfect copy lacks, *even if* the copy conveys identical information?  
  - **Yes** → **Leaf: Historicism about Artworks**  
    *Awkward commitment: A molecule-for-molecule duplicate of a painting is a different artwork from the original, even if no one can ever distinguish them.*  
  - **No** → **Leaf: Achievement View**  
    *Awkward commitment: The artist's achievement can be fully "captured" in a copy, so a forged painting has less value only if the forger's skill is inferior.*  

  ---

  ### Tree Logic and Notes
  - **Logical Structure**: The tree splits the logical space by testing core commitments:  
    - **Node 0** splits based on whether physical identity suffices for artistic value (isolating empiricism).  
    - **Node 1** tests if the art form (visual vs. auditory) changes the answer (isolating allographic dissolve).  
    - **Node 2** splits based on whether deception/history affects value (isolating moral/historic views).  
    - **Node 5** separates deception from historical essence.  
    - **Node 7** distinguishes object-centered history (historicism) from creator-centered achievement.  
    - Other nodes pressure-test edge cases (e.g., Node 3 uses the manuscript to split institutionalism from empiricism; Node 4 isolates market reliance).

  - **Required Cases Included**:  
    - Forgery that fooled experts (Node 2).  
    - Molecule-for-molecule duplicate (Node 0).  
    - Bit-perfect copy of a recording (Node 1).  
    - Newly discovered manuscript (Node 3 and Node 7).  

  - **Empty/Incoherent Combinations**:  
    - **Node 1 → Yes + Node 3 → Yes**: Leads to institutional-contextualism, but this is coherent only if context overrides physical properties.  
    - **Node 2 → No + Node 6 → No**: Leads to market view, but may feel unappealing by reducing art to economics.  
    - **Node 5 → No** (deception view) + **Node 7 → Yes/No**: Incoherent, as deception views reject intrinsic historical/achievement value. Not possible in this tree.  
    - **No empiricism after Node 0 → No**: By design—rejecting the duplicate’s value implies history/context matters.  

  - **Leaves That Can't Be Cleanly Separated**:  
    - **Historicism vs. Achievement View** (both reachable via Node 7): They often converge on rejecting copies but diverge on *why* (history of the object vs. artist's effort). The manuscript case in Node 7 forces a split, but in practice, students might conflate "history" with "achievement."  
    - **Institutional-Contextualism vs. Market View**: Both depend on external factors, but Node 4 (deception test) and Node 6 (re-attribution) split them.  

  - **Market View**: Included as a viable leaf (reached via Node 4 or Node 6). It survives as a real (if reductive) position, especially in art economics.  

  - **Efficiency**: The tree uses 8 nodes (0–7) and minimizes redundancy (e.g., institutional-contextualism and market view appear in multiple branches but reflect consistent principles).  

  This tree encourages students to reason from intuitions about concrete cases, revealing their philosophical commitments organically. Use it as a handout or discussion prompt to explore tensions between the views.
