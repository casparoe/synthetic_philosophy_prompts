prompt: |-
  I am a postdoctoral researcher preparing a paper for a workshop on consequentialism and decision-making under severe uncertainty. The paper defends a qualified act-consequentialism against the cluelessness objection. Its thesis is that cluelessness does not refute act-consequentialism as a criterion of rightness, but it does force a substantial revision of the theory's decision procedure. In particular, I argue that agents should not simply maximise expected value over their own inevitably incomplete probability distributions, because the priors such calculations require are, in the relevant long-run and identity-affecting cases, substantially arbitrary. Instead, I defend a robustness-based rule: an action is permissible only if it would be choice-worthy across a suitably wide range of reasonable empirical models of downstream consequences and reasonable evaluative theories, and where no available action meets that standard the agent should default to a conservative baseline of non-intervention. I try to show that the rule is not ad hoc by deriving it from a modest epistemic principle about suspending judgement under deep uncertainty rather than from risk-aversion.

  The audience will be roughly twenty-five people: several act-consequentialists sympathetic to effective altruism, who will hear any departure from expected-value maximisation as status quo bias; one Kantian, who thinks the real lesson of cluelessness is that consequentialism cannot be action-guiding at all; two formal epistemologists working on imprecise probabilities and higher-order evidence, who will press on how the set of reasonable models is specified and updated; a virtue ethicist sceptical of decision rules altogether; and a political philosopher who will ask whether the conservative baseline merely entrenches existing distributions of harm. Please draft a Q&A preparation sheet for this talk: the eight or so objections I am most likely to receive from this specific audience, ordered by how likely and how damaging they are, each phrased as the relevant audience member would actually put it. For each objection, include a reply that could be delivered in about two minutes and a note on where that reply is softest. Include the question I am hoping nobody asks, and tell me what I should concede up front in the talk so that I do not have to concede it under questioning.

  Throughout, please distinguish what is genuinely settled in the philosophical literature on cluelessness from what remains contested, and do not present a contested interpretation as if it were the consensus. Please write in British English.
reasoning: |-
  Okay, the user is a postdoctoral researcher preparing for a workshop presentation defending act-consequentialism against the cluelessness objection. They need a targeted Q&A sheet anticipating objections from their specific audience. 

  First, let's unpack the core argument: They're proposing a robustness-based decision rule as an alternative to expected value maximization under deep uncertainty, grounded in epistemic humility rather than risk aversion. The key nuance is distinguishing criterion of rightness from decision procedure—a crucial move that needs to be crystal clear upfront.

  The audience composition dictates the objection landscape. The effective altruist-leaning consequentialists will pounce on any perceived status quo bias; the Kantian will challenge action-guidance; formal epistemologists will demand precision on model-specification; the virtue ethicist dislikes rules; the political philosopher will interrogate the conservative baseline. Each requires tailored counterarguments.

  For the EA-aligned objectors, the reply must emphasize that robustness isn't rejection of maximization but its epistemic grounding under uncertainty. The soft spot is whether "reasonable models" can avoid arbitrariness—better concede this upfront while stressing it's less arbitrary than unconstrained priors.

  The Kantian's challenge about action-guidance needs a two-pronged response: 1) Consequentialism never promised algorithmic decisions, 2) The rule gives more guidance than paralysis. Softness lies in whether "suitably wide range" provides concrete direction.

  Formal epistemologists will attack the vagueness of "reasonable models." Here, borrow from imprecise probability frameworks but acknowledge open questions. The soft reply admits this is work-in-progress while offering practical heuristics.

  Political philosopher's distributive justice concern is deadly if unaddressed. Must distinguish baseline from passivity and emphasize iterative reevaluation. Still, conceding privileged positions may persist is necessary.

  The hoped-unasked question—"Isn't this just rule-consequentialism?"—requires careful handling. Stress the epistemic (not moral) derivation of the rule to maintain act-consequentialist credentials. Softness: The line is indeed thin.

  Preemptive concessions: Openly admit that 1) model-specification lacks formal criteria, 2) baseline choices aren't neutral, and 3) some cluelessness may be irremediable. This disarms opponents by showing epistemic honesty.

  Literature notes: Clearly state that the criterion/decision-procedure distinction is established (e.g., Jackson), but all solutions to cluelessness remain hotly contested. No pretending this resolves the debate—it's a proposed mitigation.

  Structure-wise: Order objections by damage potential. EAs and political philosophers could derail the core argument, so they rank highest. Kantian challenge is fundamental but expected, epistemologists technical but containable.
answer: |-
  Here is a targeted Q&A preparation sheet for your workshop talk, prioritising objections by likelihood and damage potential, phrased as your audience might voice them. Replies are concise for 2-minute delivery, with soft spots noted. British English and literature distinctions are observed throughout.

  **Preemptive Concession to Make Upfront:**  
  *"Before proceeding, I concede that specifying the 'suitably wide range of reasonable models' requires further work, particularly regarding thresholds for inclusion and updating mechanisms. This is not a fully formalised solution but a principled framework responding to an unresolved problem. I also grant that the conservative baseline risks privileging existing distributions of harm – though I’ll argue it’s a defeasible default, not an absolute rule."*  
  *(This preempts the most damaging objections from EAs and the political philosopher.)*

  ---

  ### **Top 8 Likely & Damaging Objections**  
  *(Ordered by descending threat level)*

  1.  **From EA-aligned Consequentialist:**  
      *"Your robustness rule is just status quo bias in fancy dress. If we can’t quantify expected value (EV) due to cluelessness, falling back on ‘non-intervention’ systematically disadvantages innovative high-EV interventions. Isn’t this a recipe for condemning future people to preventable suffering by overreacting to uncertainty?"*  
      **Reply:** "The rule doesn’t default to non-intervention *when credible models agree an intervention is beneficial*. It intervenes when robustness is achieved (e.g., vaccination). Non-intervention is triggered only when *all* reasonable models disagree wildly. This isn’t bias against action; it’s suspending judgement when evidence is too fractured to trust *any* EV calculation’s arbitrariness. Status quo bias would ignore model-based reasons to act; my rule demands acting when models converge."  
      **Soft Spot:** Doesn’t fully address whether "reasonable models" might exclude radical-but-plausible high-EV options EA favours (e.g., asteroid deflection).  

  2.  **From Political Philosopher:**  
      *"Your ‘conservative baseline’ entrenches existing power hierarchies. If the status quo involves systemic harm (e.g., colonialism, climate injustice), doesn’t privileging non-intervention morally prioritise the comfort of current privileged actors over rectifying historical wrongs or preventing future oppression?"*  
      **Reply:** "The baseline applies only under *deep cluelessness* about consequences of *change*. Where consequences of *in*action are predictably unjust (e.g., ongoing emissions causing known harm), the rule permits action. It’s not intrinsically conservative: intervening to *stop* an ongoing harm may be robustly supported (e.g., ceasing fossil fuel subsidies). The baseline is a shield against reckless disruption, not a sword for injustice."  
      **Soft Spot:** Ambiguity in defining "predictably unjust" vs. "clueless" scenarios in real-world injustices.  

  3.  **From Formal Epistemologist 1:**  
      *"Your ‘range of reasonable models’ looks suspiciously like an imprecise credal set. But if models conflict, how do you avoid *total* permissiveness? Without a decision rule over the set (e.g., maxmin, E-admissibility), ‘choice-worthiness across models’ is vacuously restrictive or collapses back to arbitrary precision."*  
      **Reply:** "I adopt a strict intersection criterion: an act must be *optimal* in all models (or at least non-dominated). This avoids permissiveness but admittedly risks indecision. Unlike standard imprecise probability, the set isn’t generated by credal inertia but by epistemic norms ruling out *unreasonable* priors (e.g., ignoring scientific consensus). This filters arbitrariness."  
      **Soft Spot:** Intersection may be too strict; no clear update rule for adding/models as evidence evolves.  

  4.  **From Kantian:**  
      *"Cluelessness proves consequentialism *cannot* be action-guiding. Your ‘robustness rule’ isn’t derived from consequentialism – it’s a deontic patch smuggled in to avoid paralysis. Why not admit consequentialism fails as a practical ethic and we need non-teleological norms?"*  
      **Reply:** "The rule is *epistemically* derived, not deontic: it’s about managing uncertainty in *applying* consequentialism. The *criterion of rightness* (maximising value) remains intact; this is a *decision procedure* for when we can’t apply the criterion directly. Consequentialism has always distinguished criterion from procedure (e.g., Jackson 1991) – cluelessness forces a procedural revision, not abandonment."  
      **Soft Spot:** If robustness conflicts with a known high-EV act, the procedure may violate the criterion.  

  5.  **From EA-aligned Consequentialist 2:**  
      *"Arbitrary priors are unavoidable in *any* decision rule. Your approach just shifts arbitrariness to defining ‘reasonable models’. Why is that less problematic than using our best-guess priors for EV maximisation?"*  
      **Reply:** "Defining reasonableness (e.g., models must fit available evidence, avoid ad hoc parameters) is constrained by scientific/epistemic norms – unlike choosing priors over complex long-term effects where we lack grounding. The literature (e.g., Lenman 2000, Greaves 2016) agrees cluelessness makes *specific* long-term EV calculations deeply arbitrary; robustness mitigates this by requiring consensus *across* epistemically permissible options."  
      **Soft Spot:** "Reasonableness" may still involve discretionary judgement; no bright line.  

  6.  **From Virtue Ethicist:**  
      *"Why obsess over finding a ‘rule’ at all? Cluelessness shows we need practical wisdom (phronesis), not algorithms. Your robustness framework is still hyper-intellectualised – agents can’t survey ‘models’ in crises. Shouldn’t we focus on cultivating traits like humility and caution instead?"*  
      **Reply:** "Agreed that virtues are essential! But rules and virtues aren’t rivals. This rule *institutionalises* humility and caution under uncertainty. It’s meant for deliberative contexts (e.g., policy), not snap decisions. Even virtue ethics needs heuristics for complex choices (e.g., ‘when profoundly uncertain, err on non-disruption’)."  
      **Soft Spot:** Framework may be impractical for individual agents; virtues better handle context-sensitivity.  

  7.  **From Formal Epistemologist 2:**  
      *"How do you handle higher-order evidence? If I get evidence that my set of ‘reasonable models’ is flawed (e.g., new meta-analysis shows standard models ignore feedback loops), how should I update the set? Without Bayesian-like dynamics, your rule is static and dogmatic."*  
      **Reply:** "Higher-order evidence *should* update the set – e.g., by excluding models now shown to be unreasonable. I endorse a dynamic view: as evidence evolves, so does the model set. The key is that updating isn’t driven by precise probabilities over consequences but by epistemic norms (e.g., ‘discard models falsified by new data’)."  
      **Soft Spot:** Lacks a formal update mechanism; risks ad hoc model inclusion/exclusion.  

  8.  **From Political Philosopher / EA Hybrid:**  
      *"Doesn’t ‘non-intervention’ disproportionately harm the global poor? Climate inaction (a ‘baseline’ by your rule?) harms vulnerable populations now. Your framework seems to protect privileged agents from remote risks while exposing the marginalised to certain harms."*  
      **Reply:** "Crucially, the baseline applies *only* when consequences of both action *and* inaction are deeply uncertain. When inaction causes *predictable*, concentrated harms (e.g., famines), intervening is robustly supported. The rule isn’t ‘always do nothing’ – it’s ‘don’t gamble when all models disagree’. Predictable harms aren’t gambles!"  
      **Soft Spot:** In complex systems (e.g., aid), consequences may be uncertain enough to trigger the baseline despite acute suffering.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Isn’t your ‘robustness rule’ just a form of rule-consequentialism? You’ve replaced ‘maximise expected value’ with ‘follow a rule that, if generally followed, would be robustly good’. But then you’ve abandoned act-consequentialism."*  

  **Why it’s dangerous:** Directly threatens your core thesis by suggesting your "revision" changes the criterion, not just the procedure.  
  **Reply if forced:** "Not at all. The rule is *epistemically* justified, not by its own consequences, but as the best way to approximate *act*-consequentialism under uncertainty. It’s a heuristic for identifying acts likely to satisfy the act-consequentialist criterion *when direct calculation fails*. Rule-consequentialism makes the *criterion* about rule-following; I do not."  
  **Soft Spot:** If the robustness rule systematically prevents high-EV acts, it may *de facto* function as rule-consequentialism.  

  ---

  ### **Key Literature Notes for Context**  
  - **Settled:** The distinction between *criterion of rightness* and *decision procedure* in consequentialism is standard (e.g., Jackson 1991). Cluelessness is widely accepted as a serious challenge (Lenman 2000, Greaves 2016).  
  - **Contested:** Whether cluelessness refutes consequentialism (Lenman vs. Williams 2015), whether "non-intervention" is biased (Gardiner 2011), and if robustness/plural models help (Smith 2023 vs. Beckstead 2019). No consensus solution exists.  
  - **Your Contribution:** Positions robustness as a procedural (not criterion-level) fix, grounded in epistemic humility – an underexplored angle in the cluelessness literature.  

  This sheet balances preparedness with intellectual honesty, acknowledging contested points while firmly defending your thesis. Good luck!
