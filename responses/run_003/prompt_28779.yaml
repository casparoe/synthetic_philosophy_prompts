  I'm a PhD student in philosophy writing a paper on the problem of universals, and I want a section that reads Borges's "Funes the Memorious" as a kind of thought experiment about what a world of pure particulars would cost a mind. Funes, after his accident, perceives every detail and remembers everything with perfect fidelity, yet he cannot form general concepts — he finds it absurd that a single word should cover a dog seen from the front and the same dog seen a moment later from the side. Give me a reading of the story through the realist/nominalist debate: does Borges dramatize the claim that universals are necessary for thought, or does he show something else — that the inability to abstract is a pathology of memory rather than a proof that universals exist? Where does the story align with a nominalist position (Funes's world is more faithful to particulars, more real in its grain), and where does it undermine nominalism (Funes is paralyzed, insomniac, incapable of action or general reasoning)? I want the reading to be fair to both the story and the philosophical positions — not reducing Borges to an illustration of a textbook argument, and not ignoring the places where the story resists a straightforward realist moral. What does Borges add to the philosophical debate that argument alone cannot capture?
