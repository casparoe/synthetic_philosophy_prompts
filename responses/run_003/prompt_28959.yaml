  The debate over Bertrand's paradox has been running since 1889, and despite contributions from probability theorists, physicists, and philosophers — including Jaynes's well-known invariance approach, the maximum-entropy programme, and various proposals to restrict or abandon the principle of indifference — the literature still has no consensus on which resolution, if any, succeeds. My suspicion is that the impasse is not really a mathematical one: the formal results are largely agreed upon, and the disagreement is instead about what we wanted from the principle of indifference in the first place — whether it was meant as a logical constraint on rational credence, a heuristic for constructing priors in the absence of information, or something else. I want a diagnosis of what kind of disagreement this actually is. Is it a verbal dispute about the word 'probability'? A clash of bedrock normative intuitions about rational belief? A hidden disagreement about whether the problem is well-posed? And given your diagnosis, what — if anything — would count as progress: a new formal result, a conceptual distinction, or an admission that the question as traditionally framed has no answer? Please indicate how confident you are in your claims and single out the point you are least sure of. Answer in British English.
