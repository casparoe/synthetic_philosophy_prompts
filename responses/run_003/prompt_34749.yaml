  They also want clarity on what's settled vs. contested in bargaining theory, especially the KS-Nash tradeoff, and to keep it under 800 words.

  I need to design a mediation procedure that translates KS into actionable steps. KS relies on the "ideal point" and proportional gains from the disagreement point, which is more intuitive than Nash's product maximization. The key inputs are:
  - Disagreement point (d1,d2): fallback if no deal
  - Ideal point (m1,m2): each party's best possible outcome
  - Feasible set S: all possible agreements

  The KS solution maximizes the minimum proportional gain: max min[(u1-d1)/(m1-d1), (u2-d2)/(m2-d2)] 

  For the procedure:
  1. Establish disagreement point: Get both parties to agree on what happens if talks fail. Flag that this often involves judgment (e.g., valuing a dissolved company).
  2. Define ideal points: Ask each party "What's the best realistic outcome for you?" This requires judgment about realism.
  3. Map feasible options: List all possible agreements. For continuous cases (like equity), we can interpolate; for discrete, we'll compare options later.
  4. Translate to proportional gains: For each option, calculate (gain)/(max possible gain) for each party. This requires interpersonal utility comparisons - big judgment call.
  5. Find KS point: In continuous cases, it's where proportional gains are equal. In discrete cases, pick the option with the highest minimum proportional gain.
  6. Handle ties and close calls: When multiple options are close, facilitate discussion.

  Problem case: When one party has a huge ideal point (m1>>m2), KS may give them larger absolute gains even if the other party has greater "need." Need to acknowledge this fairness concern.

