  Okay, the user is a PhD economics student who also works as a mediator in their university's dispute-resolution program. They deal with two-party cases like co-founder equity splits, department budget allocations, and roommate rent disputes. They've been reading axiomatic bargaining literature and prefer the Kalai-Smorodinsky (KS) solution over Nash because it respects individual monotonicity. But they need a practical, step-by-step procedure to implement KS in real mediation sessions with parties who aren't economists and have limited patience for abstraction.

