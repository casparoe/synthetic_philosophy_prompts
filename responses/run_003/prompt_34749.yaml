answer: |-
  Here's a step-by-step Kalai-Smorodinsky (KS) mediation procedure, designed for real-world constraints. Key theoretical note: **KS prioritizes equal *relative* gains over the fallback (unlike Nash's product maximization), making it intuitive but contestable—especially when parties have vastly different "ideals."**

  **Procedure:**
  1.  **Establish Disagreement Point (d):** Ask each party: *"If we walk away with no deal, what concretely happens to you?"* Quantify this (e.g., $0, 0% equity, $0 budget).  
      *   *Judgment Flag:* Parties may disagree on valuation (e.g., the value of a dissolved company). Facilitate negotiation on 'd' first. If stalemate, use your best estimate and note it's provisional.
  2.  **Define Ideal Points (m):** Ask each party independently: *"Realistically, if the other party got *just barely* enough to accept a deal, what's the absolute best outcome you could hope for?"* (e.g., Capitalist: "75% equity", Small Dept: "$300k"). Record these as (m1, m2).  
      *   *Judgment Flag:* "Realistically" requires coaching. Push back on fantasy demands ("Wanting 99% isn't realistic if the other person did work"). If parties clash on feasibility, note their stated ideals but use observable constraints later.
  3.  **Map Feasible Options (S):** List all possible agreements (e.g., equity splits: 50/50, 60/40, 70/30; budget allocations: $200k/$800k, $250k/$750k, etc.). For continuous cases (e.g., equity), treat S as a line connecting extreme points.  
      *   *Discrete Handling:* If options are lumpy (e.g., only specific splits), proceed to Step 4 with this list.
  4.  **Calculate Proportional Gains:** For *each feasible option*, compute:
      *   Party 1's Gain Ratio: `GR1 = (Option Gain for P1 - d1) / (m1 - d1)`
      *   Party 2's Gain Ratio: `GR2 = (Option Gain for P2 - d2) / (m2 - d2)`
      *   *Judgment Flag:* **This is critical.** Requires translating outcomes (equity %, $) into comparable "gains." Focus parties on *satisfaction relative to their own best/worst* (e.g., "How much better is 40% than walking away ($0), compared to your ideal 75%?"). Use 0-100 scales if direct comparison is intractable.
  5.  **Find KS Solution:**
      *   *Continuous Case:* The KS point is where `GR1 = GR2` on the Pareto frontier. Plot options or calculate to find this equality point.
      *   *Discrete Case:* For each option, identify the *lower* of its GR1 and GR2. Choose the option where this *minimum gain ratio* is highest.
  6.  **Handle Ties/Close Calls:** If multiple options have similar min gain ratios, present them as "fair" and facilitate negotiation based on secondary concerns.

  **The Problem Case:** KS can feel unfair if **one party's ideal point (m) is vastly larger than the other's**, even if both face similar absolute constraints. KS allocates to equalize *relative* gains, giving the ambitious party larger *absolute* gains.  
  *   *Handling it:* Acknowledge the intuition: "This solution prioritizes how close each gets to their personal best-case. If one party started with a much bigger vision, they get more in absolute terms. Does that feel appropriate here, or should we discuss adjusting based on contribution/need?"

  ---

  **Worked Examples:**

  **1. Co-founders Dividing Equity**
  *   **Parties:** Capitalist (C) invested $70k, Laborer (L) built the product.
  *   **Disagreement (d):** Dissolution → $0 for both. (dC = 0, dL = 0)
  *   **Ideals (m):** C (argues capital risk): mC = 75%. L (argues labor value): mL = 70%.
  *   **Feasible S:** Equity splits (C/L): 50/50, 55/45, 60/40, 65/35, 70/30. (Continuous line assumed).
  *   **Gain Ratios:**
      *   GRC = (%C - 0) / (75 - 0) = %C / 75
      *   GRL = (%L - 0) / (70 - 0) = %L / 70 = (100 - %C) / 70
  *   **KS Solution:** Set GRC = GRL → %C/75 = (100 - %C)/70  
      Solve: 70*%C = 75*(100 - %C) → 70%C = 7500 - 75%C → 145%C = 7500 → %C ≈ 51.7%, %L ≈ 48.3% (~52/48).
  *   **Discussion:** KS slightly favors L compared to a strict capital share (70/30). Why? L's "ideal" (70%) is closer to 50/50 than C's ideal (75%) is. If L argued mL=50% (less ambitious), KS would shift toward C. Nash might yield 55/45 or 60/40 (favoring C's larger potential gains).

  **2. Departments Splitting $1M Budget**
  *   **Parties:** Small Dept (S) needs max $300k. Large Dept (L) needs max $900k.
  *   **Disagreement (d):** No deal → $0 for both (dS=0, dL=0).
  *   **Ideals (m):** S: mS = $300k. L: mL = $900k. (Note: mL is impossible; S+L > $1M).
  *   **Feasible S:** Pareto frontier is S gets $X, L gets ($1M - X), with X ≤ $300k. (Else S gets > ideal, wasting $ needed by L).
  *   **Gain Ratios:**
      *   GRS = (X - 0) / (300k - 0) = X / 300k
      *   GRL = (($1M - X) - 0) / (900k - 0) = (1000k - X) / 900k
  *   **KS Solution:** Set GRS = GRL → X/300 = (1000 - X)/900  
      Solve: 900X = 300*(1000 - X) → 900X = 300,000 - 300X → 1200X = 300,000 → X = 250k.  
      Thus: S gets $250k, L gets $750k.
  *   **Discussion:** KS gives L 5x more absolute $ than S! Why? GRS = 250/300 ≈ 83.3%, GRL = 750/900 ≈ 83.3% – equal *relative* gains. S might protest: "We only asked for $300k, they asked for $900k; why reward their bigger ask?" **This is the KS trade-off.** Nash would likely give S more (e.g., ~$333k/$667k, maximizing (X)*(1000-X)), feeling "fairer" to S but violating individual monotonicity if L's potential grew.

  **Key Contestation:** KS is favored when expanding opportunity primarily benefits one party (individual monotonicity). Nash is favored when joint efficiency (size of the pie) or independent contributions are paramount. Neither dominates; the choice depends on the normative context you (as mediator) and the parties establish.
