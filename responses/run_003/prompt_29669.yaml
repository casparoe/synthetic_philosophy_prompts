  The user points out that both involve a "no free lunch" idea: past performance doesn't guarantee future success without prior assumptions. But as the philosopher role, I need to highlight the differences. The key is that NFL operates in formal, predefined spaces (like all possible functions), while Hume's problem deals with real-world empirical inference where we don't know the underlying structure.

