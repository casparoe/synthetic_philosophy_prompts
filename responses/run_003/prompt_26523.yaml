  - **Kuhn's escape route**: Science isn't relativistic because (a) evidence *does* pressure paradigms (e.g., Newton couldn't resolve Mercury's orbit, Einstein could), and (b) theory choice uses objective values (accuracy, consistency) even when logic underdetermines outcomes.  
