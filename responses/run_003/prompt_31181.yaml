prompt: |-
  Since retiring from a career in systematics and taking up the philosophical literature on species, I find my own judgments on particular cases in tension, and I would like to know whether a single species concept can be brought into reflective equilibrium with them.

  My verdicts are these. Around the Tibetan plateau, the greenish warbler forms a ring: neighboring populations interbreed all the way around, but where the two ends meet in central Siberia they do not. I want to say that each adjacent population belongs to the same species, yet that the two overlapping end forms are not the same species. Bdelloid rotifers, which are apparently ancient asexuals, nonetheless form stable, ecologically distinct clusters; I am reluctant to deny that they have species at all. Polar bears and brown bears hybridize in the wild and produce fertile young, but I still count them as two species. Neanderthals and modern humans interbred, and many living people carry Neanderthal DNA, but I still count them as distinct species. A fossil lineage that changes gradually over several million years, with no sharp breaks, I would regard as divided into successive chronospecies only by convention. And in bacteria, where genes are exchanged across lineages, I remain willing to use species names while suspecting they mark convenient clusters rather than natural units.

  Is there one principle about what a species is that yields all or most of these verdicts? If not, which of my verdicts should I give up, and why? Please state the principle precisely, and tell me what it says about a case I have not settled: two sympatric populations of planktonic copepods that are morphologically indistinguishable and occupy the same ecological niche but never interbreed — are they one species or two?
reasoning: |-
  Okay, let me try to work through this user's query. They're a retired systematist now diving into philosophy of species concepts. Their main issue is the tension between their intuitive judgments on various species cases and the lack of a unified species concept. I need to figure out if there's a single principle that can reconcile all their verdicts or if some judgments need to be revised.

  First, listing out their specific cases: the greenish warbler ring species, bdelloid rotifers (asexual but form clusters), polar vs. brown bears (hybridize but still separate), humans and Neanderthals (interbred but distinct), gradual fossil lineages (chronospecies as convention), and bacteria (lateral gene transfer). Plus, there's the new copepod case: sympatric, identical morphology and niche, no interbreeding.

  Hmm. The ring species is tricky. They want adjacent populations same species, but ends different. The Biological Species Concept (BSC) would see the ring as one species since there's gene flow throughout, except at the ends. But the user's intuition splits it. Maybe the BSC isn't fitting here. The Cohesion Concept might handle ring species better by emphasizing gene flow and cohesion mechanisms, allowing for the ends to be separate due to lack of interbreeding.

  For bdelloid rotifers, asexual reproduction. BSC fails because no interbreeding. But the user thinks they form clusters. Maybe the Ecological Species Concept (ESC) works here, focusing on niche occupation and stabilizing selection. Or the Phylogenetic Concept (PSC) if they form monophyletic groups. The Cohesion Concept includes ecological cohesion, so that might cover it.

  Polar and brown bears hybridize with fertile offspring. BSC would say one species, but user says two. ESC could justify separation based on different niches and adaptations. Cohesion Concept might consider them distinct due to different stabilizing selections despite some gene flow.

  Humans and Neanderthals interbred but considered separate. Similar to bears. BSC struggles, but if reproductive isolation is mostly intact except for limited hybridization, maybe still two species under a nuanced BSC. Cohesion Concept could emphasize different adaptive zones.

  Gradual fossil lineages. Chronospecies are arbitrary. BSC doesn't apply to fossils. Evolutionary Species Concept (EvSC) might see it as a single lineage. Cohesion could handle the continuum by recognizing cohesion mechanisms over time, but divisions would still be pragmatic.

  Bacteria with lateral gene transfer. BSC fails. PSC or Genotypic Cluster Concept might work, seeing species as diagnostic clusters. Cohesion Concept's ecological mechanisms could apply, treating them as ecotypes.

  Now, the copepod case: sympatric, same niche, no interbreeding. BSC would say two species because no gene flow. ESC might struggle since same niche, but if they occupy different micro-niches or have different stabilizing selections, maybe separate. Cohesion Concept would look for mechanisms preventing gene flow, like behavioral isolation. If no such mechanisms, they might be considered one species, but user's intuition might lean towards two due to reproductive isolation.

  So, Cohesion Concept seems flexible enough. It combines reproductive and ecological cohesion. For warblers, gene flow along the ring maintains cohesion, but ends lack it. Rotifers: ecological cohesion. Bears and humans: different stabilizing selections despite some gene flow. Fossils: cohesion over time, divisions pragmatic. Bacteria: ecological cohesion. Copepods: if reproductive isolation exists without ecological divergence, they're two species under cohesion due to independent evolutionary trajectories.

  But the copepod case is tricky. Same niche and morphology but no interbreeding. Under Cohesion Concept, if there's no gene flow due to isolation mechanisms, they're different species. But why no interbreeding if they're identical? Maybe hidden barriers. If no such barriers, it might be an anomaly. Need to check Templeton's criteria. Isolation without divergence might be due to recent separation or non-adaptive reasons. Cohesion Concept might still classify them as two species if the lack of gene flow is consistent.

  Possible contradictions? User might need to reconsider polar bears if hybridization is significant. But if hybrids don't persist, cohesion maintains separation. Same for Neanderthals. For fossils, accepting that divisions are pragmatic but necessary for communication. Bdelloids are a challenge, but ecological cohesion justifies clusters.

  In conclusion, Cohesion Concept can explain most cases. For copepods, two species due to reproductive isolation, even without ecological divergence. User might need to accept that some cases, like fossils, require pragmatic approaches, but cohesion provides a unified framework.
answer: |-
  Based on your specific verdicts across diverse biological scenarios, the **Cohesion Species Concept (CSC), as developed by Alan Templeton (1989)**, provides the most coherent single principle that aligns with your judgments. It integrates both reproductive and ecological mechanisms to define a species as:

  **"A species is the most inclusive population of individuals sharing a common evolutionary lineage, within which evolutionary cohesion is maintained by one or more specific mechanisms (genetic exchangeability via gene flow *and/or* ecological interchangeability via stabilizing selection and niche adaptation), and beyond which these mechanisms do not extend."**

  ### How the CSC Explains Your Verdicts:
  1.  **Greenish Warbler Ring:**
      *   **Verdict:** Adjacent populations same species; overlapping ends different species.
      *   **CSC Explanation:** Gene flow (genetic exchangeability) maintains cohesion between adjacent populations. Cohesion breaks down between the ends in Siberia due to the absence of gene flow *and* potentially divergent ecological pressures/adaptations (lack of ecological interchangeability), even if they overlap. The CSC explicitly allows for this pattern.

  2.  **Bdelloid Rotifers:**
      *   **Verdict:** They have species (distinct clusters).
      *   **CSC Explanation:** Genetic exchangeability (gene flow) is absent. However, distinct ecological clusters are maintained by stabilizing selection and adaptation to specific niches (ecological interchangeability). The CSC explicitly includes asexual taxa via ecological cohesion mechanisms.

  3.  **Polar Bears & Brown Bears:**
      *   **Verdict:** Two species despite fertile hybrids.
      *   **CSC Explanation:** Hybridization occurs but is limited and often localized. Crucially, each lineage maintains its distinct ecological niche and adaptations (ecological interchangeability *within* each group, but not *between* them). Stabilizing selection pulls hybrids towards the parental types or restricts them to marginal habitats, preventing full genetic or ecological merging. Cohesion mechanisms (ecological adaptation) hold each group together as distinct evolutionary lineages despite some genetic leakage.

  4.  **Neanderthals & Modern Humans:**
      *   **Verdict:** Distinct species despite interbreeding.
      *   **CSC Explanation:** Similar to bears. While gene flow occurred, it was limited. More importantly, the lineages evolved under distinct selective pressures (e.g., different geographic ranges, potentially different cultural/ecological adaptations) for hundreds of thousands of years, maintaining ecological distinctiveness and lineage cohesion. Modern humans absorbed some Neanderthal genes, but the core Neanderthal lineage as a cohesive unit bound by its specific adaptations ended.

  5.  **Gradual Fossil Lineage:**
      *   **Verdict:** Chronospecies divisions are conventional.
      *   **CSC Explanation:** The CSC emphasizes the continuous lineage bound by cohesion mechanisms over time. While stabilizing selection and adaptations might shift gradually, the cohesion is continuous. Arbitrary division points (chronospecies) don't reflect a real break in cohesion mechanisms, only our need to impose discrete categories on a continuum. This aligns perfectly with your view.

  6.  **Bacteria:**
      *   **Verdict:** Species names mark convenient, ecologically defined clusters, not necessarily strict reproductive units.
      *   **CSC Explanation:** Genetic exchangeability via gene flow (HGT) is complex and not lineage-bound. Ecological interchangeability is paramount. Clusters represent populations bound by cohesive mechanisms primarily driven by stabilizing selection within specific ecological niches (ecotypes), even with lateral gene transfer. The CSC readily accommodates this view of species as ecologically cohesive units.

  ### The Sympatric Copepod Case:
  *   **Scenario:** Two sympatric populations, morphologically identical, same ecological niche, but **never interbreed**.
  *   **CSC Verdict:** They are **two distinct species**.
  *   **Reasoning:**
      1.  **Lack of Genetic Exchangeability:** The complete absence of interbreeding demonstrates a strong barrier to gene flow. This is a fundamental cohesion mechanism that is *not* operating between the populations.
      2.  **Presence of Reproductive Isolation Mechanism:** While morphology and niche are identical, *something* prevents interbreeding (e.g., behavioral isolation, temporal isolation, cryptic gametic incompatibility). This isolating mechanism defines the boundary between the two cohesion units.
      3.  **Independent Evolutionary Trajectories:** Despite current ecological and morphological similarity, the lack of gene flow means these populations are evolving independently. Mutations, drift, and future selective pressures will affect each lineage separately. They represent two distinct evolutionary lineages held together internally by whatever mechanisms prevent them from interbreeding (genetic exchangeability within, but not between), even if ecological interchangeability is currently high.
      4.  **Cohesion Boundary:** The reproductive barrier is the key cohesion boundary here. The CSC identifies species based on the limits of cohesion mechanisms. The barrier to gene flow is a clear limit.

  ### Potential Tensions and Revisions:
  The CSC successfully captures your intuitions across all your cases. However, two areas might require slight nuanced acceptance:

  1.  **Bears & Humans:** The CSC *allows* your verdict, but it requires accepting that limited hybridization doesn't override the dominant cohesive forces (ecological divergence/stabilizing selection). If hybridization were widespread and led to significant, persistent gene flow across the entire range, eroding ecological distinctness, the CSC might lean towards one species. Your verdict implies you see the hybridization as insufficient to break the core ecological cohesion of each lineage, which the CSC supports.
  2.  **Copepods:** Your intuition *might* initially lean towards "one species" due to the lack of morphological/ecological differentiation. The CSC firmly argues for two species based on the reproductive barrier. Abandoning this verdict would mean weakening the role of genetic exchangeability as a primary cohesion mechanism, which would undermine the CSC's ability to handle the warbler ring cleanly. The copepod case highlights that reproductive isolation *alone* can define species boundaries, even without obvious ecological divergence – a point strongly supported by the CSC and your other judgments (like the necessity of the end warblers being different species despite potential niche overlap).

  ### Conclusion
  Templeton's **Cohesion Species Concept** provides the single most coherent principle unifying your diverse judgments. It successfully handles ring species, asexual taxa, hybridizing lineages with distinct ecologies, the conventionality of chronospecies, and bacterial ecotypes by explicitly incorporating both genetic and ecological mechanisms of evolutionary cohesion. For the sympatric copepods, it clearly identifies them as two species based on the barrier to genetic exchangeability (lack of interbreeding), demonstrating that reproductive isolation is a sufficient cohesion boundary, even in the absence of current ecological or morphological differentiation. This case reinforces that cohesion mechanisms define the lineage, and a barrier to one core mechanism (gene flow) creates a species boundary.
