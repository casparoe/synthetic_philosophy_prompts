  You mistake the *causes* and *accompaniments* for the pleasure itself! The heterogeneity lies in the *objects* and *associated ideas* triggering the sensation, not in the intrinsic pleasure-sensation. Strip away the mango's flavor, the puzzle's solution, the justice-narrative—what remains is a common, reportable *affective glow*. That glow *is* pleasure—Bentham's simple, unitary positive state. 

  Preference? No! We detect this state introspectively. Don't you recognize that 'ah, yes' feeling—whether it arrives via taste-buds, cortex, or moral vindication—as fundamentally the *same kind* of welcome experience? If you deny this shared phenomenology, what positive evidence do you offer for heterogeneity beyond noting different triggers?
