prompt: |-
  My friend who took a metaethics seminar last term explained the 'wrong kind of reasons' problem to me, and I'm not sure I trust her summary. Here's what she said, roughly:

  "When you have a reason to adopt some attitude — like admiration, desire, or belief — the reason can be either object-given or state-given. An object-given reason points to a feature of the thing the attitude is about: the cake is delicious, so you have a reason to want it. A state-given reason points to some benefit of having the attitude itself: an evil demon will reward you if you admire him, so you have a reaon to admire him. The problem is that state-given reasons aren't real reasons. They're just pragmatic payoffs that have nothing to do with whether the attitude is fitting. And this is a big problem for buck-passing accounts of value, because those accounts say that for something to be valuable just is for there to be reasons to have certain attitudes toward it — so they can't distinguish the right kind of reasons from the wrong kind. Once you see the problem you realize buck-passing is hopeless."

  I'm inclined to think she's overstating things, but I don't know the literature well enough to say where. Can you go through her summary and tell me which parts a careful philosopher working on this would accept, which parts are subtle misrepresentations, and whether her conclusion about buck-passing actually follows from the accurate parts?
reasoning: |-
  Okay, the user's friend explained the 'wrong kind of reasons' problem in metaethics, and the user is skeptical about her summary. Let me break down the key points she made. She mentioned object-given vs. state-given reasons, the claim that state-given reasons aren't real reasons, and how this undermines buck-passing accounts of value.

  First, I need to verify the accuracy of each part. Object-given reasons are indeed about features of the object, like the cake's deliciousness. State-given reasons, like the evil demon example, focus on the benefits of holding the attitude. That part seems correct.

  Next, her claim that state-given reasons aren't real reasons. This is where it gets tricky. Philosophers like Parfit and Rabinowicz make a distinction here, but it's not that state-given reasons are entirely invalid. They just don't determine the fittingness of the attitude. For instance, the demon might give you a reason to admire him to avoid punishment, but that doesn't make admiration fitting. So, her statement oversimplifies by saying they aren't real reasons at all. They are practical reasons, just not fittingness reasons.

  Then there's the buck-passing part. Buck-passing defines value in terms of reasons for pro-attitudes. The problem is that if state-given reasons count, then anything that brings benefits could be seen as valuable, which isn't right. The user's friend thinks this makes buck-passing hopeless, but actually, many philosophers propose solutions. They might restrict the reasons to only object-given ones or adjust the definition of pro-attitudes to exclude state-given influences. So, her conclusion is too strong.

  The user might be concerned that their friend's summary is misleading, especially for someone new to metaethics. They need a balanced view to understand the nuances. Also, the user might want to engage in academic discussions or correct their friend without coming off as confrontational. They probably seek a clear explanation that highlights where the friend's points are valid and where they oversimplify, ensuring they grasp the ongoing debates in the field.
answer: |-
  You're right to be skeptical—your friend captures key elements of the "Wrong Kind of Reasons" (WKR) problem but overstates its implications and misrepresents some nuances. Here's a breakdown of her summary, with a philosopher's perspective on what's accurate, what's misleading, and whether buck-passing is "hopeless":

  **Accurate Parts:**

  1.  **Distinction between Object-Given and State-Given Reasons:**
      *   **Correct:** This is the core distinction driving the problem. Philosophers like T.M. Scanlon, Derek Parfit, and Wlodek Rabinowicz & Toni Rønnow-Rasmussen developed it.
      *   **Object-Given Reason:** A reason for an attitude (admiration, desire, belief) that cites a *feature of the object* of that attitude. (E.g., The cake's deliciousness is a reason *to desire it*; the mountain's majesty is a reason *to admire it*; the evidence is a reason *to believe* the proposition).
      *   **State-Given Reason:** A reason for an attitude that cites a *benefit or cost of having the attitude itself*, independent of the object's properties. (E.g., The demon's threat is a reason *to admire him*; a reward for *desiring* a saucer of mud is a reason *to desire it*; avoiding social ostracism might be a reason *to believe* something).
      *   *Your friend's examples (cake, demon) are standard and accurate.*

  2.  **The Problem for Buck-Passing Accounts:**
      *   **Correct:** Buck-passing accounts (most famously Scanlon's) analyze value (e.g., goodness, admirability, desirability) as follows:
          `X is valuable (e.g., good, admirable, desirable) = There are reasons (for someone) to have a certain pro-attitude (e.g., desire, admiration) towards X.`
      *   **The Problem:** If "reasons" includes *state-given* reasons, then we get counterintuitive results:
          *   The demon-threatened admiration makes the demon *admirable* (because there *is* a reason to admire him).
          *   The rewarded desire for mud makes the mud *desirable* or *good* (because there *is* a reason to desire it).
      *   This seems clearly wrong. Admirability should track features *of the demon* (which are presumably non-existent or awful), not the threat. The mud lacks features that make it desirable.

  **Subtle Misrepresentations and Overstatements:**

  1.  **"State-given reasons aren't real reasons."**
      *   **Misleading/Overstated:** This is highly contentious and arguably false. Most philosophers working on this problem *accept* that state-given considerations *are genuine reasons* to *bring it about that* you have the attitude, or to *act as if* you have it.
          *   You *genuinely* have a strong prudential reason to *make yourself admire* the demon (e.g., through self-hypnosis, therapy, or just pretending) to avoid torture. This is a perfectly "real" practical reason for action or attitude management.
      *   **The Nuance:** The core insight is that state-given reasons are **not the *right kind* of reason for determining the *fittingness* of the attitude.** Fittingness is about whether the attitude *correctly represents* or *responds appropriately to* its object. State-given reasons don't bear on that; they bear on the *consequences* of having the attitude. Philosophers often say state-given reasons are reasons *to want to have* the attitude, not reasons *of the right kind* for *having* the attitude in the fittingness sense.
      *   *Philosopher's Correction:* "State-given reasons are genuine practical reasons to *bring about* or *sustain* the attitude, but they are *not reasons of the right kind* for the attitude being *fitting* or for grounding judgments about the *value* (admirability, desirability) of the object via buck-passing."

  2.  **"They're just pragmatic payoffs that have nothing to do with whether the attitude is fitting."**
      *   **Mostly Accurate, but...** Calling them "just pragmatic payoffs" is a bit dismissive but captures their nature. The key point is correct: they are irrelevant to fittingness. Where this becomes a misrepresentation is if it implies they aren't real reasons *at all* (as above).

  3.  **"The problem is that state-given reasons aren't real reasons. ... so they can't distinguish the right kind of reasons from the wrong kind."**
      *   **Misleading:** The problem isn't *that* state-given reasons aren't real (they usually are, practically); the problem is *that they are the wrong kind for the theoretical job buck-passing assigns to reasons.* Buck-passing, as initially stated, seems unable to *exclude* the wrong kind (state-given) reasons from its analysis of value, leading to the counterintuitive results. The challenge is *how* to define the relevant reasons in a way that excludes WKRs without being circular (e.g., "reasons that make the attitude fitting" would presuppose the value buck-passing aims to analyze).

  4.  **"Once you see the problem you realize buck-passing is hopeless."**
      *   **Significant Overstatement:** This is the most significant overreach. While the WKR problem is a serious challenge, it is **not** universally seen as fatal to buck-passing. It's a major *research program* within metaethics. Many sophisticated buck-passers have proposed solutions, including:
          *   **Restricting the Attitudes:** Focusing on attitudes where WKRs are less problematic (though tricky for admiration/desire).
          *   **Refining "Reasons":** Adding qualifications like "reasons provided *by the object's properties*" or "reasons *that are evidence of the object's value-making properties*" (though avoiding circularity is hard).
          *   **The "No-Priority" View:** Distinguishing *value* from *reasons for pro-attitudes* and seeing them as mutually dependent concepts without one reducing to the other (Scanlon later moved towards this).
          *   **Fitting-Attitude Analyses (FA):** Some distinguish FA accounts (which focus on *fittingness*) more sharply from buck-passing (which focuses on *reasons*), arguing FA handles WKRs better by directly invoking fittingness. Buck-passers then try to link reasons to fittingness.
          *   **The "Object-Stance":** Analyzing the relevant reasons as those that would be given by someone taking the appropriate "object-stance" towards the thing.
      *   While no solution is universally accepted as definitive, the problem is actively engaged with, and many leading metaethicists still defend sophisticated forms of buck-passing or closely related FA accounts. Calling it "hopeless" ignores this substantial body of ongoing work.

  **Conclusion on Buck-Passing:**

  *   **Her Conclusion Does NOT Follow:** The accurate parts (the distinction and the problem it poses for a *simple, unqualified* buck-passing account) **do not** entail that buck-passing is "hopeless."
  *   **The Reality:** The WKR problem exposed a crucial ambiguity in early formulations of buck-passing. It forced buck-passers to refine their accounts significantly. While it remains a central challenge and a test for any proposed buck-passing analysis, it is widely seen as a *problem to be solved* or *accommodated* within the framework, not a decisive refutation. Many metaethicists believe solutions (or adequate responses) are possible, even if complex. Buck-passing remains a prominent and viable, albeit contested, position in metaethics.

  **In short:** Your friend correctly identified the core distinction (object-given vs. state-given reasons) and the core problem this poses for a basic buck-passing account (it can't distinguish fittingness reasons from pragmatic reasons for having attitudes). However, she overstated by implying state-given reasons aren't "real" reasons (they usually are practical reasons) and, most significantly, by declaring buck-passing "hopeless" as a consequence. The problem is serious but is an active area of research with numerous proposed solutions from defenders of buck-passing and fitting-attitude accounts.
