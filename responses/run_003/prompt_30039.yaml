prompt: |-
  I'm a product manager at a tech company. I keep hearing about the dollar auction and escalation of commitment from a mate who did game theory, and it sounds spookily like what happens when we keep pouring engineering time into a feature that's flatlining on every A/B test. Restate the dollar auction and the escalation of commitment problem in the vocabulary I actually use day to day — A/B tests, KPIs, OKRs, sprint commitments, sunk cost reasoning in roadmaps, kill criteria — as faithfully as you can. Then give me the residue report: which bits of the game-theoretic story map cleanly onto product decisions, which bits you had to fudge or stretch, and whether anything in the economists' analysis has no counterpart in how we actually make (or rationalise) these decisions. I want to know whether the game theory is genuinely adding something I can't already say in PM-speak, or whether it's just a fancier way of describing what we already know.
