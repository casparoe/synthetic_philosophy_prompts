  I've come around to the view that the wavefunction is real — psi-ontic, not just a bookkeeping device for our ignorance. The PBR theorem seems to slam the door on most psi-epistemic approaches, and the idea that the central object of our best physical theory is just a representation of someone's credences strikes me as hard to square with how much work the wavefunction does. But I worry I've talked myself into something unfalsifiable. So: what would count against psi-ontic views? I want the evidence, arguments, and theoretical developments that should make me update away from wavefunction realism, sorted by how decisive they'd be. Distinguish between things that would be fatal (the view just can't survive them) and things that would be awkward but survivable. Are there escape hatches psi-ontic people have built in that make the view hard to test? And if a psi-epistemic interpretation like QBism turned out to handle everything quantum mechanics predicts without treating the wavefunction as real, would that actually count against psi-ontic views, or would it just show they're not mandatory? I want an honest map of what this position risks.

  Oh, and please no formatting — just continuous prose like an email, no bullet points or headings or bold.
reasoning: |-
