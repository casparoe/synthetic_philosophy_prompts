  Revising the structure: First, is grounding necessary? If not (5%), then LLMs might have semantics. If yes (95%), then do they meet it? If not (90%), then is there an alternative? If no (60%), they lack semantics; if yes (40%), they have it. 

  So overall credence that grounding problem is an obstacle: when grounding is necessary AND they fail AND no alternative. That's 0.95 * 0.90 * 0.60 = 51.3%. 

  But the user asked for credence that it's a genuine obstacle, meaning it prevents semantic understanding. So in the cases where grounding is necessary, they fail, and no alternative exists, then yes, it's an obstacle. Hence 51.3%. 

