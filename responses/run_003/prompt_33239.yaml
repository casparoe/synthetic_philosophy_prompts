prompt: |-
  In my reading, I've repeatedly encountered the claim that expected utility theory seems to demand we devote ourselves entirely to chasing tiny probabilities of enormous payoffs — the problem of expected value fanaticism. Since this would be an absurd practical conclusion, and since decision theorists and philosophers are not absurd people, there must be a standard way of heading off the fanatical result from within the theory itself. I'd like to understand that standard solution: how do we block the fanatical conclusion without abandoning expected utility theory, and what justifies the blocking move without simply begging the question against the fanatic? Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is asking about expected utility theory and the problem of fanaticism, where the theory seems to suggest we should chase tiny probabilities of enormous payoffs. They want to know how this is resolved without abandoning the theory itself. Let me start by recalling the standard responses.

  First, the St. Petersburg Paradox comes to mind. That's a classic example where infinite expected utility leads to absurd decisions. The common solution there is diminishing marginal utility. But the user is talking about real-world scenarios like Pascal's Mugging or existential risks. So diminishing utility might help, but maybe not enough if the payoff is huge, like saving billions of lives.

  Then there's the distinction between finite and infinite expectations. If the payoff is finite, even if large, expected utility won't be infinite. But what if the payoff is framed as infinite, like in some religious contexts? That's trickier. Decision theorists might say that infinite utilities break the axioms, so they avoid such scenarios. But how?

  Ah, risk aversion through utility functions. If we model utility as concave, like logarithmic, then even huge payoffs have diminishing returns. For example, saving a billion lives isn't a billion times more valuable than saving one because of resource constraints or other factors. That could cap the utility.

  Bounded utility functions are another approach. Setting a maximum utility, like in Savage's axioms, prevents any single outcome from dominating. So no matter how big the payoff, its utility is capped. But is that realistic? Maybe not, but it solves the math problem.

  Then there's epistemic objections. Assigning probabilities to highly speculative scenarios might be unjustified. If you can't reliably estimate the probability of an enormous payoff, then the expected utility calculation isn't valid. But that's more of a practical point than a theoretical one.

  The user also wants to avoid begging the question. So just saying "we cap utility" might seem arbitrary. But within EU theory, bounded utility is a legitimate assumption. The axioms require finite utilities to avoid contradictions. So it's not ad hoc; it's built into the framework.

  Also, combining risk aversion with bounded utility handles most cases. For example, in Pascal's Mugging, if the utility of saving lives is bounded or grows slowly, the tiny probability won't justify the action. Plus, if the probability is too small to be meaningfully quantified, it's dismissed.

  The user mentions philosophers and decision theorists not being absurd, so they probably want a solution that's theoretically sound. Emphasizing that unbounded utility leads to mathematical inconsistencies might be key. St. Petersburg shows that without bounds, the theory breaks, so bounds are necessary for coherence.

  They might also be interested in real-world applications. For instance, in effective altruism, how do we prioritize interventions without getting distracted by low-probability, high-impact events? The answer would involve both bounded utility and careful probability assessment.

  In summary, the core solutions are bounding utility functions and applying diminishing marginal utility, supported by the axioms of EU theory. This blocks fanaticism without abandoning the theory, justified by mathematical necessity and practical coherence.
answer: |-
  **The standard solution blocks fanatical conclusions by imposing bounded utility functions or employing sufficiently risk-averse utility functions, justified by the mathematical requirements of coherent preference representation and the implausibility of infinite stakes in real-world scenarios.** 

  1.  **Bounded Utility Functions:** Expected utility theory's axioms (like continuity and completeness) imply that utilities must be bounded for preferences to be coherently represented when infinitely many states or acts are considered. An unbounded utility function allows the construction of St. Petersburg-like paradoxes where an option with *infinite* expected utility dominates *any* finite alternative, demanding fanaticism. Bounding utility (e.g., setting an upper limit on the utility of any outcome, as in Savage's framework) prevents any single outcome, no matter how large its payoff, from dominating solely due to its size when multiplied by a tiny probability. This isn't an ad hoc fix but a mathematical consequence of requiring consistent preferences over all possible acts. The fanatic cannot coherently demand infinite value assignments within the theory's axioms.
  2.  **Diminishing Marginal Utility & Risk Aversion:** Even without strict bounds, sufficiently concave utility functions (e.g., logarithmic) exhibit strong diminishing marginal utility for resources or welfare. The utility gained from an additional unit of benefit decreases as the total benefit increases. While saving 1 billion lives is vastly better than saving 1 life, it isn't *linearly* a billion times better in utility terms due to resource constraints, threshold effects, or fundamental value considerations. This concavity drastically reduces the expected utility of tiny-probability enormous payoffs compared to their nominal scale. A fanatic appealing to linear utility is making a substantive (and implausible) claim about value scaling, not an unavoidable implication of expected utility theory itself.
  3.  **Epistemic Constraints:** Assigning non-infinitesimal probabilities to scenarios promising arbitrarily large payoffs is often epistemically unjustified. Expected utility calculations require meaningful probabilities; claims about "enormous payoffs" contingent on highly speculative metaphysics (e.g., Pascal's Wager) or ill-defined mechanisms often lack credible probability assignments exceeding truly negligible values. Expected utility theory doesn't compel action based on arbitrarily assigned probabilities lacking empirical or rational grounding. The fanatic must justify both the probability *and* the utility assignment, not just the latter.

  **Justification Without Begging the Question:** This approach doesn't simply assert fanaticism is wrong. It shows that fanaticism, driven by infinite or linear unbounded utility, leads to *mathematical incoherence* within the theory (violating its own axioms in the unbounded case) or relies on *specific, contestable assumptions* about value scaling (linear utility) that are not inherent to expected utility maximization. The burden shifts to the fanatic to justify either infinite utility assignments (which break the theory) or perfectly linear utility across all scales (which is empirically and intuitively implausible). The core theory remains intact by requiring utilities to be bounded or sufficiently concave to represent coherent, finite human preferences.
