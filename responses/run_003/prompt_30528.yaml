  We are going to restate Hempel's raven paradox in the vocabulary of machine learning.

  **The Paradox (Briefly):**
  Hempel's paradox arises from the logical equivalence of two statements:
  1. "All ravens are black." (∀x, Raven(x) → Black(x))
  2. "All non-black things are non-ravens." (∀x, ¬Black(x) → ¬Raven(x))

  The paradox: Observing a black raven (a positive example of the first statement) seems to confirm the hypothesis. But by logical equivalence, observing a non-black non-raven (e.g., a white shoe) should also confirm the hypothesis. However, it seems absurd that a white shoe would confirm the hypothesis that all ravens are black.

  **ML Restatement:**

  1. **Hypothesis as a Decision Boundary:**
     We have a binary classification problem. Let:
     - The label `y = 1` if the object is a raven, and `y = 0` otherwise.
     - A feature `x1 = 1` if the object is black, and `x1 = 0` otherwise.

     The hypothesis "all ravens are black" is equivalent to a decision boundary that says: 
     - If an object is a raven (`y=1`), then it must be black (`x1=1`). 
     - This can be seen as a rule: `y=1` ⇒ `x1=1`.

     Alternatively, we can think of the hypothesis as a constraint on the joint distribution: 
     - `P(y=1, x1=0) = 0` (there are no non-black ravens).

     The logically equivalent statement "all non-black things are non-ravens" is: 
     - If an object is not black (`x1=0`), then it is not a raven (`y=0`).

     In the feature space, both statements describe the same boundary: they both assert that the region `(y=1, x1=0)` has zero probability.

  2. **Positive Instances as Labeled Examples:**
     - A **positive example** for the first statement is a raven that is black: `(x1=1, y=1)`.
     - A **positive example** for the second statement is a non-black non-raven: `(x1=0, y=0)`.

     Because of the logical equivalence, both types of examples should, in principle, provide evidence for the same underlying hypothesis (the absence of non-black ravens).

  3. **The Paradox in ML Terms:**
     - We are trying to learn the hypothesis `H: P(y=1 | x1=0) = 0` (or equivalently, the absence of non-black ravens).
     - We collect data to update our belief about `H`.

     The paradox: 
     - Observing a black raven (`x1=1, y=1`) is clearly relevant and increases our confidence in `H` because it is consistent with `H` and we are collecting data in the raven population.
     - Observing a white shoe (`x1=0, y=0`) is also consistent with `H`, but it seems irrelevant because we are not looking at ravens. However, by the rules of probability (and logic), it should also increase our confidence in `H`.

     But note: in the real world, we are more likely to sample ravens when we are interested in ravens. We are not randomly sampling from the entire universe of objects (including shoes, apples, etc.) to test the hypothesis about ravens.

  4. **Sampling Procedure and the Paradox:**
     - Your prior is that the paradox dissolves once we specify the sampling procedure. Let's examine.

     In ML, we are very aware of the data generating distribution. Suppose we have two sampling scenarios:

     a. **Sampling from the raven population**: We are only collecting ravens. In this case, we will only see examples of the form `(y=1, x1=?)`. We never see non-ravens. Then:
          - A black raven (`x1=1, y=1`) is a positive example that supports `H` (since we haven't seen a non-black raven).
          - We never see non-ravens, so we cannot collect white shoes. Thus, the paradox does not arise.

     b. **Sampling from the entire universe of objects**: We sample objects randomly and record both `y` (whether it's a raven) and `x1` (whether it's black). Then:
          - A non-black non-raven (`x1=0, y=0`) is a valid example. It is consistent with `H` and, by the laws of probability, does provide a small amount of evidence for `H`. Why? Because if we had observed a non-black raven, we would have rejected `H`. But we didn't. However, the amount of evidence is very small because the universe is vast and non-black non-ravens are common. The observation of one more non-black non-raven doesn't change our belief much.

     In scenario (b), the white shoe does provide evidence, but it is extremely weak. Meanwhile, a black raven is a rare event (if ravens are rare) and therefore provides stronger evidence? Actually, let's compute:

     Let:
     - `H`: the hypothesis that there are no non-black ravens, i.e., `P(y=1 | x1=0) = 0`.
     - We are going to use a Bayesian update.

     We can model our belief about the world with parameters:
     - `θ_00 = P(y=0, x1=0)`
     - `θ_01 = P(y=0, x1=1)`
     - `θ_10 = P(y=1, x1=0)`  # which must be 0 under H
     - `θ_11 = P(y=1, x1=1)`

     Under the alternative hypothesis, `θ_10` might be positive.

     The likelihood of observing a white shoe (`y=0, x1=0`) under `H` is 1 (because `H` does not forbid non-black non-ravens). Under the alternative, it is also positive. But note: the observation of a white shoe does not directly tell us about `θ_10` (the probability of non-black ravens). It only tells us about `θ_00`. 

     However, if we have a model that links these parameters (for example, if we assume that the only free parameter is the probability of non-black ravens and the rest are fixed), then the update might be different. But in general, without such constraints, the observation of a white shoe does not directly update the parameter of interest (`θ_10`).

     Alternatively, we can consider the hypothesis `H` as a constraint on the joint distribution. The likelihood of the data under `H` and under the alternative (which allows `θ_10>0`) is:

     - Under `H`: the data point `(y=0, x1=0)` has probability `P_H(y=0, x1=0) = θ_00`.
     - Under the alternative: `P_{alt}(y=0, x1=0) = θ_00` (same). 

     So the likelihood ratio is 1 -> no update on `H`. 

     But wait, that can't be right because the alternative hypothesis might have a different joint distribution. We must be careful.

     Let's reframe: We are testing two models:

     - Model `H0`: `θ_10 = 0` (so the joint distribution is over the other three cells).
     - Model `H1`: `θ_10 > 0` (so the joint distribution has four free parameters, but with `θ_10>0`).

     The observation of a white shoe (`y=0, x1=0`) gives:
        - Likelihood under `H0`: `θ_00`
        - Likelihood under `H1`: `θ_00` (same)

     So indeed, the likelihood ratio is 1 -> no update.

     However, note that the observation of a non-black non-raven does not change the estimate of `θ_10` under `H1`? It only updates `θ_00`. So why would it support `H0`? 

     The key is that the observation of a non-black non-raven does not contradict `H0` (it is allowed) and in fact, it is also allowed under `H1`. But if we were to observe a non-black raven, that would only be possible under `H1` and would immediately reject `H0`. Therefore, the absence of non-black ravens in the data (i.e., we never see `(y=1, x1=0)`) supports `H0`. And every time we see an object that is not a non-black raven, we are effectively not seeing a counterexample. 

     However, the strength of this support depends on how likely we are to have observed a non-black raven if it existed. If we are sampling from the entire universe, and non-black ravens are very rare, then it's very unlikely we would have seen one even if they existed. Therefore, the absence of non-black ravens in a small sample doesn't tell us much.

     Therefore, the observation of a white shoe (which is a non-black non-raven) does not provide any evidence if we are only updating about `θ_10` because it doesn't change the likelihood of the data under either model. But if we are counting the number of non-black non-ravens, that might change the overall distribution, but not the parameter of interest.

     Alternatively, consider the following: the hypothesis `H` is about the absence of non-black ravens. The observation of a white shoe doesn't tell us anything about the existence of non-black ravens. It only tells us about the existence of non-black non-ravens, which we already knew were abundant.

     **So where does the paradox go?** 

     It seems that in a proper probabilistic setting, the observation of a white shoe does not actually provide evidence for `H` because it doesn't change the likelihood ratio. But then why is there a paradox? The paradox arises from the logical equivalence. However, in a probabilistic setting, we must consider the sampling distribution and the rarity of the events.

     Let me propose a different model: 

     We are interested in the parameter `p = P(non-black | raven)`. We want to test `H0: p=0` vs `H1: p>0`. 

     - When we observe a raven, we can update `p` directly: if we see a non-black raven, we reject `H0`. If we see a black raven, we update by reducing the probability of `H1` (because we didn't see a non-black raven when we had the chance).

     - When we observe a non-raven, we don't get any information about `p` because `p` is defined only for ravens.

     Therefore, non-ravens are irrelevant.

     This resolves the paradox: only observations of ravens are informative for the hypothesis about ravens.

     **Residue Report:**

     - **Parts that survive the translation:**
          The logical equivalence of the two statements is preserved: they both describe the same constraint on the joint distribution (the absence of non-black ravens). 

     - **Parts that had to be fudged:**
          The original paradox does not consider the sampling distribution. In our ML restatement, we see that the evidential value of an observation depends critically on how the data was collected. The paradox arises only when we ignore the data generating process.

     - **Parts with no counterpart in ML:**
          The paradox as originally stated treats evidence in a purely logical and absolute sense (one confirming instance increases the degree of confirmation). In ML, we are used to thinking in terms of probabilities and the strength of evidence (which can be quantified by the likelihood ratio). Moreover, we are aware that evidence is relative to the data generating process. The philosophers' paradox does not account for the rarity of the events or the sampling bias.

     **Conclusion:**
     Your prior is correct: the paradox dissolves when we specify the sampling procedure. In the scenario where we sample ravens, non-ravens are not observed and hence the issue disappears. In the scenario where we sample randomly from the entire universe, the observation of a non-black non-raven (white shoe) is so common and uninformative about the existence of non-black ravens that it provides negligible evidence (and in fact, in our parameterized model, it provides none). Therefore, the philosophers' puzzle is largely an artifact of ignoring the data collection mechanism and the probabilistic nature of evidence.

     However, note that there is a subtle point: if we are testing the universal generalization "all ravens are black", then we are essentially testing whether there exists any non-black raven anywhere. In that case, even a random sample from the entire universe might eventually help if we cover the whole universe. But in practice, we never sample the entire universe, and the probability of sampling a non-black raven (if it exists) in a random sample is proportional to its abundance. Therefore, the absence of non-black ravens in a random sample does provide some evidence, but it is very weak if non-black ravens are rare and our sample is small. Meanwhile, if we sample only ravens, we are more likely to hit a non-black raven if they exist. Therefore, the way to get strong evidence about ravens is to sample ravens.

     The philosophers might be keeping track of the logical structure of universal generalizations and the confirmation relation in a way that is independent of the sampling procedure. But in the real world (and in ML), we cannot ignore the sampling procedure.

     **Final Answer:**
     The paradox dissolves when we specify the sampling procedure and adopt a probabilistic framework. The white shoe is indeed a negative example collected from a distribution that is not focused on ravens, and it provides negligible (if any) evidence about the hypothesis.
answer: |-
  ### ML Restatement of Hempel's Raven Paradox

  #### Core Components in ML Vocabulary:
  1. **Hypothesis**:  
     - $H_1$: "All ravens are black" → A decision boundary in feature space:  
       $\text{If } \texttt{is_raven}=1 \text{, then } \texttt{is_black}=1$.  
       Equivalent to $\Pr(\texttt{is\_black}=1 \mid \texttt{is\_raven}=1) = 1$.  
     - $H_2$: "All non-black things are non-ravens" → The contrapositive boundary:  
       $\text{If } \texttt{is\_black}=0 \text{, then } \texttt{is\_raven}=0$.  
       Equivalent to $\Pr(\texttt{is\_raven}=0 \mid \texttt{is\_black}=0) = 1$.  
     - **Logical equivalence**: $H_1$ and $H_2$ parametrize the same joint constraint:  
       $\Pr(\texttt{is\_raven}=1, \texttt{is\_black}=0) = 0$ (no "non-black ravens").

  2. **Positive Instances as Labeled Examples**:  
     - Observation of a **black raven** $(\texttt{is\_raven}=1, \texttt{is\_black}=1)$:  
       A positive example for $H_1$ (confirms the boundary for ravens).  
     - Observation of a **white shoe** $(\texttt{is\_raven}=0, \texttt{is\_black}=0)$:  
       A positive example for $H_2$ (confirms the boundary for non-black objects).  
     - Due to logical equivalence, both should incrementally "confirm" the *same universal hypothesis*:  
       $\Pr(\texttt{is\_raven}=1, \texttt{is\_black}=0) = 0$.

  3. **Paradox in ML Terms**:  
     - **Intuition clash**:  
       - Observing a black raven feels like strong evidence for $H_1$.  
       - Observing a white shoe feels like irrelevant evidence for $H_1$ (despite confirming $H_2$).  
     - **Bayesian update**:  
       Let $\theta = \Pr(\texttt{is\_raven}=1, \texttt{is\_black}=0)$.  
       - $H_0: \theta = 0$ (hypothesis: no non-black ravens).  
       - $H_A: \theta > 0$ (alternative: non-black ravens exist).  
       - Observing a white shoe $(0,0)$ *should* increase $\Pr(H_0)$ per Bayes' rule:  
         $$
         \Pr(H_0 \mid \text{data}) \propto \Pr(\text{data} \mid H_0) \cdot \Pr(H_0)
         $$
         Since $\Pr(\texttt{is\_raven}=0, \texttt{is\_black}=0 \mid H_0) > 0$ (allowed), but $\Pr(\texttt{is\_raven}=0, \texttt{is\_black}=0 \mid H_A)$ could be lower if non-black ravens exist, the likelihood ratio $\frac{\Pr(\text{shoe} \mid H_0)}{\Pr(\text{shoe} \mid H_A)} \geq 1$ weakly favors $H_0$.  

  ---

  ### Residue Report: What Survives, What Fudges, What Has No Counterpart

  #### ✅ Survives Translation:
  1. **Logical equivalence of hypotheses**:  
     - $H_1$ and $H_2$ are identical constraints on the data distribution.  
     - ML acknowledges this: Both parametrize the same forbidden region $(\texttt{raven}=1, \texttt{black}=0)$.  
  2. **Asymmetric evidentiary value**:  
     - Observing a white shoe *technically* provides Bayesian evidence for $H_0$, but it feels intuitively worthless.  
     - In ML terms: The white shoe updates the posterior, but the **update size is negligible** due to sampling bias.  

  #### ⚠️ Fudged in Translation:
  1. **Universal quantifiers vs. finite data**:  
     - Philosophy: "All ravens" implies absolute certainty.  
     - ML: Hypotheses are probabilistic (e.g., $\theta \approx 0$).  
     - Fudge: We model $\Pr(H_0)$ as belief, not binary truth.  
  2. **Likelihood of the white shoe**:  
     - Philosophy: Assumes $\Pr(\text{shoe} \mid H_A)$ is defined.  
     - ML: $\Pr(\texttt{raven}=0, \texttt{black}=0 \mid H_A)$ depends on the data distribution under $H_A$. If non-black ravens are rare, $\Pr(\text{shoe} \mid H_A) \approx \Pr(\text{shoe} \mid H_0)$, making the update tiny.  

  #### 🚫 No ML Counterpart:
  1. **Absence of sampling procedure in the paradox**:  
     - Philosophy: Treats evidence as purely logical ("any white shoe confirms").  
     - ML: Demands specification of the **data-generating process**.  
     - No counterpart: The paradox ignores *how* data is sampled (active vs. passive collection).  
  2. **Context-independent confirmation**:  
     - Philosophy: Assumes evidence strength is immutable.  
     - ML: Evidence is relative to **base rates** and **selection bias**.  
     - Example: If sampling focuses on ravens, shoes become irrelevant; if sampling is uniform, shoes weakly update $\theta$.  

  ---

  ### Your Prior Is Half-Right: How Sampling Dissolves the Paradox

  #### Why Sampling Matters:
  - **Active sampling (raven-focused)**:  
    You query $\texttt{is\_raven}=1$ (ravens only). White shoes are never observed → No paradox.  
    - Observing black ravens directly reduces $\Pr(\theta > 0)$.  
    - **No irrelevant updates**.  

  - **Passive sampling (uniform over all objects)**:  
    You sample from $p(\texttt{raven}, \texttt{black})$. White shoes $(0,0)$ update $\theta$ via:  
    $$
    \Pr(H_0 \mid \text{shoe}) = \frac{\Pr(\text{shoe} \mid H_0) \Pr(H_0)}{\Pr(\text{shoe})}
    $$
    But $\Pr(\text{shoe} \mid H_0) \approx \Pr(\text{shoe} \mid H_A)$ if non-black ravens are rare, so $\Delta \Pr(H_0)$ is tiny.  
    - **The update exists mathematically but is pragmatically negligible**.  

  #### What Philosophers Track That ML Cannot Express:
  The **purely logical tension** between:  
  1. The equivalence of $H_1$ and $H_2$ under formal logic.  
  2. The psychological intuition that "local" evidence (ravens) *should* dominate "global" evidence (all objects).  

  ML resolves this by quantifying evidence size (Kullback-Leibler divergence, likelihood ratios) and incorporating sampling. Philosophers explore why $H_1$ *feels* epistemically privileged, even though $H_2$ is formally equivalent—a nuance ML dismisses as a human bias.

  ### Conclusion
  - **The paradox dissolves** when specifying the sampling procedure:  
    - Active sampling of ravens makes white shoes irrelevant.  
    - Uniform sampling makes white shoes negligible evidence.  
  - **Philosophical residue**: The tension between formal equivalence and intuition highlights that ML's *quantitative* evidence framework (which exposes update size) supersedes the paradox. Philosophers care about why our intuition misaligns with logic; ML cares about efficient learning under sampling constraints.  
  - **Final verdict**: Yes, the paradox is an artifact of underspecified sampling. Once you model data collection, the "confirmation" from a white shoe is either absent or negligible. ML vocabulary captures this unambiguously.
