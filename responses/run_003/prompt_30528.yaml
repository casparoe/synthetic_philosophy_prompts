  I'm an ML engineer and I know the machinery — model classes, likelihoods, posterior updates, dataset construction, selection bias, train/test mismatch — but I've never read philosophy of science. Restate Hempel's raven paradox in that vocabulary as faithfully as you can: hypotheses as conditional probabilities or decision boundaries, positive instances as labeled training examples, the logical equivalence of all ravens are black and all non-black things are non-ravens as two parametrizations of the same boundary, and so on. Then give me the residue report: which parts of the paradox survive the translation, which parts you had to fudge, and which parts have no counterpart in how ML people talk about evidence. My prior is that the whole puzzle dissolves once you specify the sampling procedure — a white shoe is just a negative example collected from a weird distribution — so tell me if that's right or if the philosophers are keeping track of something my vocabulary can't express.
