  On empirical facts, both would accept evidence about deterrence curves or rehabilitation effectiveness as relevant, even if they weight them differently. The revisions section is interesting - the consequentialist admitting desert as a constraint mechanism, the retributivist accepting resource allocation limits.

  Now for the disagreements table. The core tensions are:
