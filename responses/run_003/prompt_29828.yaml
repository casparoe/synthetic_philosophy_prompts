  Below is a decision tree designed to sort readers into five key positions on the nature of psychiatric categories. The tree uses concrete, non-metaphysical questions focused on empirical implications, clinical practice, and real-world examples (like looping effects in autism). Logically possible but undefended positions are flagged, along with explanations.

  ---

  ### **Decision Tree: What Are Psychiatric Categories?**

  **Start with Question 1:**  
  *Suppose a highly accurate biomarker for depression is discovered (e.g., a blood test with 95% sensitivity/specificity). Would this settle, once and for all, what depression fundamentally is?*  
  - **A: Yes, it settles the question** → Go to Question 2A.  
  - **B: No, it leaves something important out** → Go to Question 2B.  

  ---

  #### **Question 2A** (for those who answered **A** to Q1):  
  *Consider how an autism diagnosis reshapes a person’s identity, relationships, and behavior (e.g., through self-understanding or social expectations). Does this "looping effect" change what autism **is**, or is it just noise?*  
  - **A: Looping is irrelevant noise** → Go to Question 3A.  
  - **B: Looping changes what autism is** → **Incoherent position** (no defenders).  
    *Why?* If a biomarker "settles" depression’s essence, looping can’t also be central—it would contradict the fixity implied by biomarkers.  

  #### **Question 3A** (for those who answered **A** to Q2A):  
  *Are conditions like depression best seen as distinct disease entities (like pneumonia) or as extremes on continuous traits (like hypertension)?*  
  - **A: Distinct disease entities** → **Strong biological realism**.  
  - **B: Extremes on continuous traits** → **Incoherent position** (no defenders).  
    *Why?* Biomarkers settling "what depression is" implies discrete natural kinds, not arbitrary cut-points on dimensions.  

  **→ Leaf 1: Strong biological realism**  
  *(Psychiatric categories are natural kinds, like chemical elements; biomarkers reveal their essence; looping is epistemologically irrelevant noise).*  

  ---

  #### **Question 2B** (for those who answered **B** to Q1):  
  *Same as Question 2A: Does the "looping effect" in autism (e.g., diagnosis altering identity) change what autism **is**?*  
  - **A: Looping is irrelevant noise** → Go to Question 3B.  
  - **B: Looping changes what autism is** → Go to Question 3C.  

  ---

  #### **Question 3B** (for those who answered **A** to Q2B):  
  *Same as Question 3A: Are conditions like depression distinct diseases or extremes on continua?*  
  - **A: Distinct diseases** → **Deflationary view**.  
  - **B: Extremes on continuous traits** → **Dimensional view**.  

  **→ Leaf 2: Deflationary view**  
  *(Categories are clinical tools; the realism debate is misplaced. Biomarkers may be useful but don’t answer "what depression is"; looping is pragmatically relevant but not ontologically significant).*  

  **→ Leaf 3: Dimensional view**  
  *(Categories are arbitrary cut-points on continuous dimensions of real variation [e.g., neurobiology, traits]; no discrete kinds exist; biomarkers might map dimensions but don’t validate categories).*  

  ---

  #### **Question 3C** (for those who answered **B** to Q2B):  
  *Same as Question 3A: Are conditions like depression distinct diseases or extremes on continua?*  
  - **A: Distinct diseases** → Go to Question 4.  
  - **B: Extremes on continuous traits** → **Unexplored position** (no defenders).  
    *Why?* Looping requires stable categories to interact with; dimensional views treat categories as arbitrary, making "interaction" incoherent.  

  ---

  #### **Question 4** (for those who answered **A** to Q3C):  
  *If we abandoned the category "hysteria" (as psychiatry did), would the underlying symptoms persist without the label, or would the phenomenon itself vanish?*  
  - **A: Symptoms would persist** → **Hacking-style dynamic nominalism**.  
  - **B: The phenomenon would vanish** → **Strong social constructionism**.  

  **→ Leaf 4: Hacking-style dynamic nominalism**  
  *(Categories are real and interactive; looping effects (e.g., diagnosis altering behavior) are central to their ontology; biomarkers miss the dynamic feedback between labels and people).*  

  **→ Leaf 5: Strong social constructionism**  
  *(Categories fabricate their objects; without classificatory practices (e.g., diagnosing "hysteria"), the phenomenon wouldn’t exist; looping isn’t just an effect—it’s constitutive).*  

  ---

  ### **Summary of Positions & Logical Gaps**
  1. **Strong biological realism** (Q1:A → Q2A:A → Q3A:A).  
  2. **Deflationary view** (Q1:B → Q2B:A → Q3B:A).  
  3. **Dimensional view** (Q1:B → Q2B:A → Q3B:B).  
  4. **Hacking-style dynamic nominalism** (Q1:B → Q2B:B → Q3C:A → Q4:A).  
  5. **Strong social constructionism** (Q1:B → Q2B:B → Q3C:A → Q4:B).  

  #### **Undefended Combinations:**  
  - **Q1:A → Q2A:B** → Incoherent (biomarkers can’t "settle" a category if looping changes its essence).  
  - **Q1:A → Q3A:B** → Incoherent (biomarkers settling "what depression is" implies discreteness, not continuity).  
  - **Q1:B → Q2B:B → Q3C:B** → Unexplored (no current position blends dimensional views with Hacking-style interactivity).  

  #### **Tree Limitations:**  
  - The tree **cannot split deflationary and dimensional views** on looping (both see it as irrelevant to ontology). Branching occurs at discreteness (Q3B).  
  - **To split Hacking and strong constructionism**, the tree uses abandonment consequences (Q4). Without Q4, these positions collapse together.  

  ---

  ### **How to Use This Tree**  
  Answer the questions sequentially based on your intuitions about biomarkers, looping effects (e.g., autism identity changes), and category abandonment (e.g., hysteria). The leaves map to major positions in the metaphysics of psychiatry, with inconsistencies and gaps noted for discussion. Ideal for prompting debate in graduate seminars!
