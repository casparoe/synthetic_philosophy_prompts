prompt: |-
  I keep going around in circles on this and I'd like someone to cash it out properly. International law has a two-track setup for war. Track one: waging aggressive war is a crime, the aggressor state is doing something legally very wrong, and the people who plan and order it can be prosecuted for it. Track two: the individual soldier on the aggressor side, if they follow the laws of war — wear a uniform, only target combatants, don't torture prisoners, that sort of thing — can lawfully kill enemy soldiers and is not treated as a murderer or as an accomplice to the aggression. And a soldier on the just side has exactly the same permissions and prohibitions. The official story is that the justice of the war and the rules governing the fighting go in seperate boxes, and that the boxes are symmetric across both sides.

  What I want to know is what theory of soldiers' moral responsibility this practice actually presupposes. Specifically: does it presuppose the "moral equality of combatants" — the idea that a soldier fighting an unjust war and a soldier fighting a just war are morally on a par in what they may do — or does it only presuppose something weaker, like a pragmatic convention that can't function unless it's symmetric? I'm also stuck on the asymmetry: we're willing to criminalize the leaders who order the war but not the ordinary people who carry it out. That seems to presuppose something about what soldiers are in a position to know or judge, but I can't tell whether the law needs that claim or just finds it convenient.

  Reconstruct the implicit theory for me. Give me the strongest version of what the practice has to be committed to, not just what it's compatible with, and be honest about where the practice is underdetermined — where several different philosophical views could underwrite the same rules. Then tell me what would actually have to change in how soldiers are treated if you swapped in the view that unjust combatants do wrong and are blameworthy for fighting. Dont give me citations or a reading list; I want the philosophical reconstruction, and I don't care whether you can name the legal instruments.

  Formatting thing: lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating my question.
reasoning: |-
  Hmm, the user is grappling with the moral and legal framework surrounding soldiers in war. They're stuck on how international law separates the criminality of aggressive war from the conduct of individual soldiers. Specifically, they want to know if this setup presupposes the "moral equality of combatants" or just a pragmatic convention. They also point out the asymmetry: leaders can be prosecuted for aggression, but soldiers who follow the rules aren't treated as criminals. 

  The user seems well-versed in the legal distinctions but is struggling with the underlying philosophical commitments. They mention going in circles, so they likely need clarity on the implicit theory behind the practice. Their deeper need might be to resolve a personal or academic conflict about moral responsibility in war. They might be questioning whether soldiers on the unjust side are blameworthy, and how the law's structure reflects or avoids that judgment.

  Breaking down the two-track system: Track one makes aggression a crime for leaders, while Track two holds that soldiers on both sides aren't criminals if they follow IHL. The key issue is what this implies about moral responsibility. Does this legal symmetry mean that morality is also symmetric? Or is it purely functional?

  The strongest commitment here is to a separation between jus ad bellum (justice of war) and jus in bello (conduct in war). Legally, the rules apply equally to all soldiers regardless of which side is just. This doesn't necessarily endorse moral equality; it could be a pragmatic necessity. The law needs soldiers to comply with IHL, and labeling one side as criminals could undermine that. Plus, soldiers can't always know the justice of their cause, and they're often coerced into fighting. So the practice is underdetermined: it could be based on the moral equality view, or on epistemic/pragmatic grounds.

  The asymmetry between leaders and soldiers is crucial. Leaders are prosecuted because they have the authority to start wars and presumably access to information to judge its legality. Soldiers, as executors, lack that context. The law seems to assume soldiers aren't culpable for the war itself, only for their conduct in it. This points to a weaker presupposition: soldiers aren't in a position to be held responsible for aggression, not necessarily that they're morally equal.

  If we swapped in the view that unjust combatants are blameworthy, the legal treatment would need significant changes. Unjust soldiers could be prosecuted for murder or complicity, not just for war crimes. This would collapse the separation between jus ad bellum and jus in bello, leading to chaos. Command structures might break down, and IHL compliance could suffer. The current system prioritizes minimizing humanitarian harm over moral judgments about the war's justice.

  The user also asked about underdetermination. The practice can be justified by multiple views: Walzer's moral equality, McMahan's rejection of it with pragmatic concessions, or a purely functionalist approach. The law itself doesn't specify; it's built to function regardless of the underlying moral theory.

  In conclusion, the strongest commitment is to the functional separation of the two tracks, not necessarily to moral equality. Changing to a blameworthy view would destabilize the entire system, showing that the current setup is deeply tied to its pragmatic foundations.
answer: |-
  The international legal practice of separating *jus ad bellum* (justice of war) from *jus in bello* (justice in war) presupposes a **functional separation grounded in pragmatic necessity and epistemic limitations for soldiers, not necessarily a deep commitment to the moral equality of combatants.**

  Here's the reconstruction:

  1.  **Core Presupposition:** The practice is fundamentally committed to **the necessity of symmetrical application of IHL (International Humanitarian Law) for functional reasons**, regardless of *jus ad bellum* status. This requires treating soldiers on both sides identically *in terms of their conduct during hostilities* to:
      *   **Preserve IHL Compliance:** If soldiers on the "unjust" side knew they could be prosecuted simply for fighting (even lawfully), they would have zero incentive to follow *any* rules of war (like taking prisoners, avoiding civilians). Symmetry creates mutual self-interest in restraint.
      *   **Maintain Military Discipline and Command:** Recognizing one side's soldiers as inherently criminal would obliterate command structures and laws of war on that side, leading to total chaos and atrocity.
      *   **Enable Conflict Termination & Peace:** Treating vast numbers of enemy soldiers as criminals (rather than lawful combatants) makes prisoner exchanges, ceasefires, and post-war reconciliation vastly harder.

  2.  **Addressing Asymmetry (Leaders vs. Soldiers):** The asymmetry criminalizing leaders but not lawful combatants presupposes:
      *   **Differential Knowledge and Agency:** Leaders are presumed to have access to information, the authority to initiate war, and the capacity to make the *political decision* for aggression. Soldiers are executors, often subject to state coercion (draft, harsh penalties for refusal), indoctrination, and limited access to the geopolitical truth.
      *   **Practical Impossibility:** Prosecuting every soldier for aggression is logistically impossible and morally problematic given the factors above. Prosecuting leaders is targeted and feasible.
      *   **Functional Separation in Action:** The crime of aggression belongs firmly to *jus ad bellum* and state leadership responsibility. The conduct of soldiers belongs to *jus in bello*, governed by different rules and requiring symmetry.

  3.  **Underdetermination on Moral Equality:** The practice is **underdetermined** regarding the philosophical "moral equality of combatants" (MEC). The symmetrical legal treatment *could* be justified by:
      *   **Strong MEC:** Soldiers on both sides share an identical moral status; neither is blameworthy merely for fighting (Walzer's view).
      *   **Weak MEC/Pragmatic Convention:** Soldiers on the unjust side *are* doing something morally wrong (participating in aggression), but holding them legally liable for it is counterproductive and unjust given their epistemic/coercive limitations. The law is a pragmatic shield, not a moral vindication.
      *   **Functionalist View:** Morality is irrelevant to the legal structure. Symmetry is *only* a necessary tool for managing conflict and limiting suffering. The law makes no claim about the underlying moral parity; it's purely instrumental.
      *   **Epistemic View:** Soldiers *cannot reliably know* the true *jus ad bellum* status of their war. Holding them culpable for aggression would be inherently unjust. Symmetry is the only fair solution.

  4.  **Strongest Commitment:** The practice's strongest, non-negotiable commitment is **to the functional necessity and pragmatic justification for symmetrical *jus in bello* rules and combatant immunity for lawful conduct.** It *must* presuppose that holding individual soldiers legally responsible for the *jus ad bellum* wrong (aggression) is either:
      *   **Unjust** (due to their lack of knowledge, agency, or susceptibility to coercion), *or*
      *   **Catastrophically Impractical** (destroying IHL compliance and conflict management), *or both*.
      It does not *require* believing soldiers on the unjust side are morally innocent (though it's compatible with that view).

  5.  **Consequences of Swapping in the Blameworthy View:** If the law adopted the view that unjust combatants are inherently blameworthy for fighting (even lawfully) and legally culpable for aggression/complicity:
      *   **Collapse of Symmetry:** Soldiers on the "unjust" side could be prosecuted for murder, attempted murder, or complicity in aggression *simply for engaging in lawful combat* (shooting enemy soldiers, destroying military targets).
      *   **Evisceration of IHL:** *Jus in bello* compliance by the "unjust" side would vanish. Why obey rules if you're already considered a murderer? Atrocities would increase dramatically.
      *   **No Prisoner of War Status:** Soldiers captured from the "unjust" side would be criminal detainees, not POWs, entitled to repatriation after hostilities. They could face trial for participation.
      *   **Command Breakdown:** Military discipline on the "unjust" side would likely collapse as the legal basis for lawful orders evaporates.
      *   **Perverse Incentives:** Soldiers on the "just" side would have no incentive to follow IHL either, knowing the enemy wouldn't reciprocate and would treat them as criminals if captured.
      *   **End of Conflict Management:** Ceasefires, surrenders, and peace agreements would become vastly more difficult, prolonging conflicts. The entire functional edifice of IHL collapses.
