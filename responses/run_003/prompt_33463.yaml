  Okay, the user is taking a seminar on standing to blame and wants to clarify what an adequate theory must explain before diving into more papers. Let me start by understanding their request. They need desiderata for a theory of standing to blame, focusing on interpersonal moral blame, not legal or institutional aspects.

  First, I need to recall the key cases and distinctions they mentioned. The unrepentant hypocrite, someone who did the same thing in the past but now blames sincerely, third parties, complicit individuals, friends vs. strangers. Also, they want the distinction between standing, truth of blame, and the appropriateness of expressing it. Plus, how ordinary practice treats standing—people call out lack of position without denying the criticism's truth.

  The user also wants to know which requirements are non-negotiable versus camp-specific. For example, is hypocrisy always a standing-killer? Or must standing be relationship-based? Then, they're interested if these requirements are jointly unsatisfiable, implying standing might not be a unified concept. Finally, a brief overview of major views: hypocrisy-based, relationship-based, eliminativist, evaluated against the criteria.

  I should structure the response around core desiderata, each tied to a case, marking non-negotiable vs. contentious. Then check for joint satisfiability. The user might be hinting at deeper confusion in the literature, so pointing out possible incoherence is key. Also, they might need this to navigate the seminar discussions effectively, saving time by focusing on essential conflicts.

  Non-negotiable points: Standing vs. desert/truth distinction; standing as defeasible (can be lost); expression distinct from standing. Contentious areas: whether relationships are necessary, if hypocrisy always undermines standing, or if third parties can ever have standing.

  Cases forcing requirements: Hypocrite (unrepentant) shows standing isn't about desert. The repentant hypocrite tests if past actions always destroy standing. Third party without stake questions if relationship is essential. Complicit person challenges purity requirements. Friend vs. stranger highlights relational factors.

  Joint satisfiability might be tricky. For instance, if standing requires no complicity (from Purity) but also allows third parties in some cases (like friends), there could be tension. If a theory grounds standing in relationships but also allows strangers to blame under certain conditions, that's another conflict. The eliminativist view might resolve by denying standing as a separate category, attributing intuitions to other factors like expressive appropriateness.

  Running through the main views: Hypocrisy-based (Scanlon) might handle the unrepentant hypocrite well but struggle with the repentant one or third parties. Relationship-based (Bell) explains friends vs. strangers but may exclude legitimate third-party blame. Eliminativist (perhaps Coates/Swanson) collapses standing into other norms, which might simplify but could overlook the distinct practice of calling out lack of position.

  The user's deeper need might be to identify whether standing is a coherent concept or if the seminar's circling is due to inherent contradictions. They want a framework to critically assess papers. Highlighting where desiderata clash provides that tool. Also, clarifying which aspects are debated helps them engage in seminar discussions without getting bogged down by every argument.
answer: |-
  Here’s a distilled set of desiderata for a theory of standing to blame, grounded in key cases and distinctions, with non-negotiables marked, and an analysis of tensions:

  ### **Core Desiderata (Non-Negotiable)**  
  1. **Standing ≠ Desert/Truth**  
     - *Case:* An unrepentant hypocrite blames you for lying while habitually lying themselves.  
     - *Requirement:* Their blame might be *true* (you did lie) and *deserved* (you merit blame), but they lack *standing* to blame.  
     - *Force:* Ordinary practice distinguishes "You’re wrong!" from "You can’t say that!".  

  2. **Standing ≠ Expressibility**  
     - *Case:* A stranger correctly blames a parent for child neglect.  
     - *Requirement:* Their blame may be true and expressible (e.g., to protect the child), but they might lack standing (e.g., if they have no relationship to the parties).  
     - *Force:* We acknowledge criticism can be apt yet "none of your business."  

  3. **Hypocrisy Can Defeat Standing**  
     - *Case:* An unrepentant adulterer blames another for adultery.  
     - *Requirement:* Their identical ongoing conduct undermines their standing.  
     - *Force:* Universal intuition that hypocrites are "in no position" to blame.  

  4. **Standing is Defeasible (Not Binary)**  
     - *Case:* A person who committed the same wrong decades ago (now reformed) blames sincerely.  
     - *Requirement:* Standing may be restored through repentance/moral change.  
     - *Force:* We accept reformed smokers blaming smokers, but not current smokers.  

  ### **Contentious Desiderata (Camp-Dependent)**  
  5. **Relationship-Grounded Standing**  
     - *Case:* A victim’s friend blames vs. a stranger blaming the same wrong.  
     - *View:* Relationship-based theories (e.g., Macalester Bell) hold friends have standing; strangers do not.  
     - *Against:* Eliminativists/utilitarians argue strangers can have standing if blame serves a moral purpose.  

  6. **Purity Requirement**  
     - *Case:* A thief who only steals from corporations blames someone for stealing from an individual.  
     - *View:* Some camps argue complicity in *similar* wrongs defeats standing; others require *identical* wrongs.  

  7. **Third-Party Standing**  
     - *Case:* An uninvolved observer with no stake blames a wrongdoer.  
     - *View:* Hypocrisy-centric theories (e.g., Scanlon) may grant standing if the blamer is "pure"; relationship-theories often deny it.  

  ---

  ### **Ordinary Practice Data to Capture**  
  - We **challenge standing** ("Who are you to judge?") without denying the **truth** of the criticism.  
  - **Hypocrisy** is a primary (but not sole) standing defeater; **remoteness** (strangers) is another.  
  - **Repentance** can restore standing; **ongoing guilt** destroys it.  

  ---

  ### **Joint Satisfiability Problem**  
  **Yes, tensions exist:**  
  - If standing requires **moral purity** (no complicity), it excludes repentant blamers (contra Desideratum 4).  
  - If standing requires **relationship**, it excludes legitimate third-party blame (e.g., bystanders condemning racism).  
  - If standing is **purely instrumental** (based on blame’s usefulness), it collapses into expressibility (violating Desideratum 2).  
  **Conclusion:** No theory satisfies all desiderata cleanly. This suggests "standing" may be a cluster concept with context-sensitive criteria.  

  ---

  ### **Main Views vs. Desiderata (Scorecard)**  
  | **View**               | **Key Advocate**      | **Handles Hypocrisy** | **Handles Relationships** | **Handles Third Parties** | **Collapses Standing/Expressibility?** |  
  |-------------------------|------------------------|------------------------|---------------------------|----------------------------|----------------------------------------|  
  | **Hypocrisy-Based**     | Scanlon, Wallace      | ✅ Strong              | ❌ Weak                   | ⚠️ (Only if "clean")      | ❌ No                                  |  
  | **Relationship-Based**  | Bell, Darwall         | ⚠️ (Indirectly)       | ✅ Strong                 | ❌ No (usually)            | ❌ No                                  |  
  | **Eliminativist**       | Coates, Swanson       | ❌ (Reduces to utility)| ❌                        | ✅ (If useful)             | ✅ Yes (fatal flaw)                    |  

  - **Hypocrisy-Based:** Wins on hypocrite cases; loses on third-party legitimacy.  
  - **Relationship-Based:** Wins on friend vs. stranger; loses on blameless strangers.  
  - **Eliminativist:** Avoids mystification but fails Desideratum 2 (conflates standing with expressibility).  

  ---

  ### **Conclusion**  
  An adequate theory must explain why **hypocrisy** and **remoteness** defeat standing while preserving **truth/desert** and **expressibility** as distinct. No dominant view captures all desiderata, revealing standing as a **hybrid norm** tethered to both relational roles and moral consistency. Your seminar circles because no account reconciles:  
  - The repentant blamer’s legitimacy,  
  - The stranger’s ambivalent status,  
  - And the intuition that standing is normative but not reducible to utility or truth.  
  **Start here:** Ask if "standing" is a unified concept or a placeholder for context-specific constraints on blame’s authority.
