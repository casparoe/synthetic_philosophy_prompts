  The sequence builds: definitions → internal contradictions → practical paradoxes → alternatives → philosophical roots. Ending on obligation brings it full circle to her moral vision. User definitely wants this rigor—they mentioned "press where strained" and predicted deflections. Smart to include where texts answer vs. where we extrapolate. 

  One risk: Weil might deflect by refusing hypotheticals (she despised "what ifs"). But the questions ground speculation in her own concepts. Also, she'd likely reject "empirical corrigibility" (Question 4) as bourgeois naiveté—worth provoking that reaction. 

