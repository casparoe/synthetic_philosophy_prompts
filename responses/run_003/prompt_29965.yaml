  Let me mentally catalog what needs unpacking. First, the theorem's exact conditions: ordinal ballots, single winner, ≥3 candidates, non-dictatorial. Then the three key claims being conflated in the Discord argument: (1) universal manipulability interpretation, (2) dictatorship as the only escape, and (3) futility of comparing systems. Each needs truth-testing. 

