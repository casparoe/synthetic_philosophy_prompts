prompt: |-
  Draft the joint statement that a representative of the formal-methods camp and a representative of the relevance camp could both sign after a good-faith adversarial collaboration on the frame problem.

  By the formal-methods camp I mean the position that the frame problem, properly understood, is a problem about representing persistence in a logic of action: how to infer, within the situation calculus or a successor formalism, that a fluent survives an action unless the action is relevant to it, without writing a separate frame axiom for every action–fluent pair; and that nonmonotonic formalisms — circumscription, default logic, and the chronological-minimization refinements forced by the Yale shooting problem — have solved, or at least contained, the problem as originally posed. By the relevance camp I mean the position that the real frame problem is the one Dennett and Fodor pressed: how a finite, resource-bounded cognitive system determines which of its indefinitely many beliefs, goals, and potential inferences bear on the action it is now considering; and that the nonmonotonic solutions solve only a representation problem that presupposes exactly the relevance structure they were supposed to explain.

  Format the document as a numbered agreed-claims section followed by a disagreements table. The agreed-claims section should cover at least: the original formulation and why enumerating frame axioms is unacceptable; the distinction among the frame problem, the qualification problem, and the ramification problem; what circumscription and default logic actually accomplish; what the Yale shooting problem showed and what the accepted fixes assume; and what a deployed agent must do over and above deriving the right consequences in a representation. Phrase each agreed claim so that it is neither vacuous nor slanted.

  The disagreements table should have one row per genuine residual disagreement, with each camp's view stated in wording that camp would sign; do not reduce the relevance camp to a vague worry about holism, and do not reduce the formal-methods camp to the claim that the philosophical problem is merely engineering. Then identify the cruxes — the sub-questions such that settling them would move at least one side. For each crux, specify the case, argument, or experimental result both sides would accept as bearing on it, and record each side's prediction in advance. If, in the course of drafting, you conclude that part of the dispute is verbal — for example, a disagreement only about how widely the label frame problem should be applied — say which part is verbal and state precisely what non-verbal disagreement remains.
reasoning: |-
  We are drafting a joint statement between two camps: formal-methods and relevance.
   The formal-methods camp sees the frame problem as a technical problem in nonmonotonic logic for representing persistence.
   The relevance camp sees it as the broader problem of relevance for bounded agents.

   We will structure the document as:
   1. A numbered list of agreed claims.
   2. A table of disagreements with each camp's view and then cruxes.

   Steps for agreed claims:
   - Original formulation and why enumerating frame axioms is unacceptable.
   - Distinction among frame problem, qualification problem, ramification problem.
   - What circumscription and default logic accomplish.
   - Yale shooting problem and accepted fixes (and what they assume).
   - What a deployed agent must do beyond deriving the right consequences.

   For disagreements table:
     One row per residual disagreement, with both camps' views in their own words.
     Then identify cruxes (sub-questions that would move at least one side) and both sides' predictions.

   Also, note if part is verbal and state non-verbal disagreement.

   Let's begin.

   Agreed Claims (numbered):

   1. The frame problem, as originally formulated by McCarthy and Hayes (1969), arises in the situation calculus when attempting to represent how actions affect the world. Specifically, it is the challenge of efficiently representing that most fluents (properties that can change over time) do not change when an action is performed, without having to write an exponential number of frame axioms (one for each action-fluent pair that does not change).

   2. The requirement to avoid enumerating frame axioms is not merely an issue of convenience but of computational and cognitive plausibility: given the vast number of fluents and actions, such an approach is infeasible for any realistic agent.

   3. We distinguish the frame problem from two related issues:
      a. The qualification problem: the challenge of specifying all the preconditions required for an action to have its intended effect (i.e., the problem of exceptions to the rule).
      b. The ramification problem: the challenge of representing and efficiently reasoning about the indirect consequences of an action, beyond its direct effects.

   4. Nonmonotonic formalisms, particularly circumscription and default logic, provide a technical solution to the original frame problem by allowing the default assumption that fluents persist unless an action affects them. This is achieved by minimizing changes (in circumscription) or by applying default rules (in default logic) that state that a fluent holds in the next situation if it held in the previous situation and there is no evidence that it changed.

   5. The Yale shooting problem (Hanks and McDermott, 1986) exposed a limitation in early nonmonotonic approaches: they sometimes allowed unintended models in which fluents changed unexpectedly (e.g., the victim dying before the shooting). This led to refinements such as chronological minimization (minimizing changes at the earliest possible time) and the use of causal constraints, which require additional assumptions about the temporal ordering of events and the causal structure of the domain.

   6. The accepted fixes for the Yale shooting problem (e.g., using chronological minimization or introducing causal laws) solve the technical problem of ensuring the intended minimal model is selected, but they rely on a precise axiomatization of the domain, including a complete specification of the causal relationships and the temporal structure.

   7. A deployed agent (an actual cognitive system or an artificial agent operating in real time) must not only derive the right consequences (as addressed by nonmonotonic logics) but also do so within bounded time and resources. This requires mechanisms to focus attention on relevant beliefs, goals, and potential inferences, which goes beyond the representational issue of nonmonotonic reasoning.

   8. The relevance problem (as emphasized by Dennett and Fodor) is a distinct and broader challenge: how an agent, with finite computational resources, can efficiently determine which of its vast array of beliefs, goals, and inferences are relevant to the current context and action under consideration.

   9. The nonmonotonic solutions to the frame problem (as originally defined) do not, by themselves, address the relevance problem. They solve the representation problem for persistence in a logical formalism but assume that the agent has already identified the relevant facts and rules to apply.

   Now, for disagreements:

   We note that there is a verbal aspect: the term "frame problem" is used differently by the two camps. The formal-methods camp uses it narrowly to refer to the persistence representation problem. The relevance camp uses it broadly to include the relevance problem. However, even after disambiguating, there remain non-verbal disagreements.

   Disagreements Table:

   | Residual Disagreement | Formal-Methods Camp View | Relevance Camp View |
   |------------------------|----------------------------|-----------------------|
   | Scope of the Frame Problem | The frame problem, properly so-called, is the technical problem of efficiently representing persistence in a logical formalism without enumerating frame axioms. This problem has been solved by nonmonotonic logics. | The frame problem, as a problem for cognitive science and AI, is the problem of relevance: how an agent can efficiently determine what is relevant to its current situation and action. This problem remains unsolved. |
   | Adequacy of Nonmonotonic Solutions | Nonmonotonic formalisms (with refinements) adequately solve the frame problem (persistence representation) by providing a compact representation that allows for correct and complete reasoning about persistence in idealized settings (given complete domain axiomatization). | The nonmonotonic solutions do not address the core challenge of relevance because they assume a pre-specified set of rules and facts, and they require the agent to have already identified which rules and facts are relevant to the current situation. |
   | Role of Relevance in Cognitive Systems | While relevance is an important issue for cognitive systems, it is a separate problem from the frame problem (as originally defined). The frame problem's solution does not purport to solve the relevance problem. | The relevance problem is the heart of what made the frame problem difficult and interesting. The technical solution to persistence representation is a necessary but insufficient step towards building agents that can handle relevance. |

   Now, Cruxes:

   We identify key sub-questions that, if settled, would move at least one side. For each crux, we state:
     - The crux question.
     - What kind of evidence (case, argument, experiment) both sides would accept as bearing on it.
     - Each camp's prediction.

   Crux 1: Can the nonmonotonic approach scale to realistic domains without pre-solved relevance?

     - Evidence: Build an agent using nonmonotonic reasoning (with chronological minimization or similar) in a complex, open-ended domain (e.g., a household robot, or a simulated environment with many objects and actions). Measure the computational cost as the number of fluents and actions increases, and see if the agent can perform in real time without additional relevance-filtering mechanisms.

     - Formal-Methods Prediction: The nonmonotonic reasoning will be computationally expensive but can be made feasible with standard optimization techniques (e.g., indexing, caching). They might also argue that the domain axiomatization can be structured to reduce the problem (e.g., using locality). However, they may concede that without domain-specific optimizations, the reasoning might not scale.

     - Relevance Camp Prediction: The nonmonotonic reasoning will become computationally intractable as the number of fluents grows, because it requires considering all fluents for every action, unless supplemented by a relevance mechanism that focuses attention on a subset.

   Crux 2: Does the nonmonotonic solution require the agent to have prior knowledge of all relevant causal laws?

     - Evidence: Consider a novel situation where the agent encounters an action or a fluent that it has not been explicitly programmed to handle. Does the nonmonotonic system automatically extend to handle the new case without additional frame axioms? Or must the designer have anticipated all possible interactions?

     - Formal-Methods Prediction: The nonmonotonic solution, by its very nature (minimizing change), requires only that we specify the direct effects of actions. The frame axioms are generated by default, so novel combinations of actions and fluents are handled without adding new frame axioms.

     - Relevance Camp Prediction: In practice, when a new fluent or action is introduced, the agent must be provided with new causal laws (or the system must be re-circumscribed) to account for possible interactions. Moreover, without prior knowledge of which fluents might be affected, the agent may need to consider all fluents, which is infeasible.

   Crux 3: Can the relevance problem be reduced to the frame problem (as formalized) by a suitable logical representation?

     - Evidence: Attempt to formalize the relevance problem within a nonmonotonic logic (or an extension) and show that it can be solved by the same mechanisms. For instance, can we use circumscription to minimize not only changes but also the set of relevant fluents?

     - Formal-Methods Prediction: With appropriate extensions (such as relevance axioms or by introducing a notion of relevance as a fluent that is minimized or defaulted), the relevance problem can be addressed within the same framework.

     - Relevance Camp Prediction: The relevance problem is inherently dynamic and contextual, and cannot be captured by static logical minimization or default rules. It requires procedural and heuristic mechanisms that are outside the scope of nonmonotonic logics.

   Verbal Disagreement:

   We note that part of the dispute is about the label "frame problem". The formal-methods camp restricts it to the persistence representation problem, while the relevance camp uses it for the broader relevance problem. However, the non-verbal disagreement remains: is the relevance problem a separate issue that must be addressed independently, or can it be integrated into the formal framework that solved the persistence problem?

   The non-verbal core: The relevance camp argues that the formal methods solution does not address the core challenge of resource-bounded relevance, and that without solving that challenge, the formal solution is impractical for real agents. The formal-methods camp argues that the relevance problem is a distinct issue that requires its own solutions, and that the frame problem (persistence) has been solved.

   We now write the joint statement accordingly.
answer: |-
  ### Joint Statement on the Frame Problem  
  **By Representative of the Formal-Methods Camp**  
  **and**  
  **Representative of the Relevance Camp**  

  Following a good-faith adversarial collaboration, we agree on the following claims regarding the frame problem, its scope, and proposed solutions. We also delineate persistent disagreements and identify cruxes for future resolution.  

  ---

  ### Agreed Claims  
  1. **Original Formulation and Infeasibility of Enumeration**:  
     The frame problem originated as a technical challenge in the situation calculus: how to formally represent the *persistence* of fluents (properties) across actions without explicitly enumerating "frame axioms" (e.g., "Action A does not alter Fluent F"). Enumerating such axioms is infeasible for realistic agents, as it requires \(O(A \times F)\) rules for \(A\) actions and \(F\) fluents, violating computational tractability and cognitive plausibility.  

  2. **Distinction Among Frame, Qualification, and Ramification Problems**:  
     - **Frame Problem**: Concerns efficient inference of *non-change* (persistence) absent explicit frame axioms.  
     - **Qualification Problem**: Addresses the impossibility of specifying all preconditions for an action (e.g., "Can the robot lift the box if gravity fails?").  
     - **Ramification Problem**: Involves indirect consequences of actions (e.g., "Moving a vase alters spatial relationships").  
     These are distinct but interrelated; solving one does not resolve the others.  

  3. **What Nonmonotonic Formalisms Accomplish**:  
     Circumscription (minimizing unexpected changes) and default logic (e.g., "Assume fluents persist unless contradicted") provide a formal mechanism to derive persistence *within a logical system*. They eliminate the need for explicit frame axioms by allowing defeasible inferences, thus solving the *representation problem* for persistence under complete knowledge.  

  4. **Yale Shooting Problem and Fixes**:  
     The Yale shooting problem exposed ambiguities in early nonmonotonic solutions, where multiple models allowed anomalous persistence (e.g., "Victim lives despite shooting"). Accepted fixes (e.g., chronological minimization—prioritizing earliest changes—or causal constraints) resolve this by imposing temporal or causal priorities. These fixes *assume* a predefined action ontology, temporal structure, and causal laws.  

  5. **Requirements for Deployed Agents**:  
     A deployed agent must not only derive correct consequences (via formalisms like situation calculus) but also:  
     - Operate under bounded time/resources.  
     - Dynamically prioritize relevant beliefs, goals, and inferences.  
     - Adapt to novel contexts without exhaustive inference.  
     Nonmonotonic solutions alone do not address these challenges.  

  ---

  ### Disagreements Table  
  We retain substantive disagreements on the scope and implications of the frame problem. Below, each camp’s view is stated as they would endorse it.  

  | **Residual Disagreement** | **Formal-Methods Camp View** | **Relevance Camp View** |
  |---------------------------|------------------------------|-------------------------|
  | **Primary Challenge** | The frame problem is solved as a *formal representation* problem: nonmonotonic logics (with refinements) compactly derive persistence without frame axioms, given a fixed action-fluent ontology. | The frame problem is fundamentally a *relevance* problem: how agents winnow infinite beliefs/inferences to those contextually pertinent to an action. Nonmonotonic logics presuppose relevance (e.g., which defaults to apply) rather than explain it. |
  | **Scope of Solution** | Circumscription/default logic *contain* the frame problem for idealized agents: they show how persistence follows from domain axioms without enumeration. This is sufficient for the problem’s original definition. | Nonmonotonic logics solve a narrow *derivation* task but ignore the *ecological* frame problem: how agents determine relevance in real time. This is the crux of cognition, as emphasized by Dennett/Fodor. |
  | **Scalability to Cognition** | The solution is computationally costly but *formally adequate*; cognitive plausibility is an orthogonal engineering challenge (e.g., optimized theorem provers). | Formal adequacy is trivial without *procedural relevance*: agents need heuristic, approximate methods (e.g., salience, priming) to avoid combinatorial explosion. Nonmonotonicism offers none. |

  ---

  ### Cruxes  
  We identify empirical/theoretical cruxes where evidence could resolve disagreements. Both camps accept that settling these would compel one side to revise its position.  

  | **Crux** | **Evidence Bearing on Crux** | **Formal-Methods Prediction** | **Relevance Camp Prediction** |  
  |----------|------------------------------|-------------------------------|-------------------------------|  
  | **Can nonmonotonic systems scale to open-world contexts without predefined relevance?** | Implement circumscription in an agent operating in a dynamic environment (e.g., household robot). Measure performance as novel actions/fluents are introduced *without* ad hoc updates. | Performance degrades gracefully; domain constraints + minimization suffice for robust persistence. Relevance is handled by the formalism’s generality. | Performance collapses without explicit relevance heuristics; the agent will freeze or infer absurdities due to unmanageable default-rule interactions. |  
  | **Does relevance require extra-formal mechanisms?** | Analyze human cognitive experiments (e.g., subjects inferring persistence after unexpected events). Test if reaction times/errors align with computational models of circumscription vs. relevance-based attention (e.g., spreading activation). | Circumscription’s inference patterns (e.g., minimizing changes) match human persistence judgments; mismatches reflect implementation limits, not formalism flaws. | Human performance will correlate with relevance metrics (e.g., salience, goal congruence) and defy minimization-based predictions. Cognition uses shortcuts orthogonal to logical derivation. |  
  | **Can relevance be formalized without presupposition?** | Design a system that *learns* relevance criteria (e.g., via reinforcement) and integrates them with nonmonotonic reasoning. Compare to pure nonmonotonic agents on tasks requiring novel relevance judgments. | Learned criteria reduce to formal axioms; integration shows relevance is derivable within expanded nonmonotonic frameworks (e.g., prioritized defaults). | Relevance learning will require non-deductive, resource-sensitive processes (e.g., neural networks) incompatible with symbolic nonmonotonicism. Hybrids will outperform pure formal systems. |  

  ---

  ### Verbal vs. Non-Verbal Disagreements  
  - **Verbal Disagreement**: The term "frame problem" is applied differently. The formal-methods camp restricts it to *persistence representation*; the relevance camp extends it to *relevance in bounded cognition*.  
  - **Non-Verbal Disagreement**: Whether the *procedures enabling relevance* (e.g., attention, heuristic search) can be reduced to or derived from nonmonotonic formalisms, or whether they require fundamentally different computational principles.  

  ---  
  **Signed,**  
  [Representative of the Formal-Methods Camp]  
  [Representative of the Relevance Camp]  
  *Date*
