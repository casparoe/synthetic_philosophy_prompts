prompt: |-
  I'm a researcher in multi-agent reinforcement learning. I work with Markov games, policies, value functions, Nash equilibria, opponent modeling, centralized-training-decentralized-execution, and the equilibrium selection problem. I read Lewis's Convention years ago but don't trust my memory of the details.

  Restate Lewis's account of convention — conventions as arbitrary, self-sustaining regularities that solve recurring coordination problems, held in place by common knowledge and precedent — in the vocabulary of multi-agent RL, as faithfully as you can. Walk through each piece: the underlying coordination problem (and why it's a coordination problem rather than a zero-sum or mixed-motive one), the arbitrariness condition (that an alternative regularity could have done the job), the role of common knowledge, the role of precedent and salience in selecting among equilibria, and the normative element (that agents have reason to follow a convention because others do).

  Then give me the residue report. Which pieces map cleanly onto things MARL already handles — equilibrium selection, path dependence, shared training histories, inductive biases — and which pieces you had to stretch, fudge, or leave on the cutting-room floor? In particular, I want to know about common knowledge: does Lewis's iterative "everyone knows that everyone knows that everyone knows..." have any real analogue in how MARL agents converge on conventions, or is that entire piece of the account simply absent from the MARL picture? And if it's absent, is that because MARL is missing something important about how real agents settle conventions, or because Lewis's common-knowledge apparatus was doing work that can be handled more parsimoniously by learning dynamics plus shared inductive biases? I want an honest translation, not one that quietly assumes the MARL framework is adequate and calls the remainder noise.
reasoning: |-
  We are translating Lewis's account of convention into the vocabulary of multi-agent reinforcement learning (MARL). We will break it down step by step and then provide a residue report.

  ### 1. **The Underlying Coordination Problem**
     - **Lewis**: A coordination problem is a situation where agents have a common interest in coordinating their actions (i.e., they all prefer that they all do the same thing, or that their actions are complementary) but there are multiple ways to coordinate. It is not zero-sum because the agents' interests are aligned (at least in the sense of avoiding coordination failure) and not purely mixed-motive because the alignment is strong enough that they all prefer coordination over non-coordination.
     - **MARL Translation**: In a Markov game, we can model a coordination problem as a state (or set of states) where the joint action space has multiple Nash equilibria (or correlated equilibria) that yield high payoffs (i.e., Pareto efficient outcomes) and are strictly better than non-equilibrium outcomes. The problem is that without coordination, agents might end up in a suboptimal equilibrium or even a non-equilibrium outcome. The game is not zero-sum because the payoff structure has positive externalities from coordination (i.e., when one agent coordinates, it benefits others). It is a common-payoff game (or at least a game with aligned payoffs) in these states.

  ### 2. **Arbitrariness Condition**
     - **Lewis**: A convention is arbitrary because there exists at least one other possible regularity (i.e., a different set of coordinated actions) that would have solved the coordination problem just as well. The convention is not uniquely optimal; it is one of several possible solutions.
     - **MARL Translation**: In the Markov game, there are multiple Nash equilibria (or other solution concepts like correlated equilibria) that yield the same (or similar) high payoffs. The convention is a particular equilibrium policy profile (π_1, π_2, ..., π_n) that the agents have settled on, but there exists at least one other equilibrium policy profile that would have achieved the same payoff. The choice between them is arbitrary.

  ### 3. **Self-Sustaining Regularity**
     - **Lewis**: The convention is self-sustaining because each agent has an incentive to follow it given that others follow it. It is a regularity in behavior that, once established, reinforces itself.
     - **MARL Translation**: The convention is a policy that is part of a Nash equilibrium. Thus, in the state of the world where the convention applies, each agent's policy is a best response to the others' policies. The agents learn to play these policies through repeated interactions (or centralized training) and the policies are stable (i.e., no agent has an incentive to deviate unilaterally).

  ### 4. **Role of Common Knowledge**
     - **Lewis**: Common knowledge of the convention is crucial: everyone knows the convention, everyone knows that everyone knows, and so on ad infinitum. This allows each agent to expect others to follow the convention and to expect that others expect the same.
     - **MARL Translation**: In MARL, common knowledge in the strict Lewis sense (infinite recursion) is typically not implemented. Instead, we have:
       - **Shared Policy Representations**: In centralized training with decentralized execution (CTDE), agents may share policy networks or have access to a centralized critic that guides them toward the same equilibrium. The learned policies are often conditioned on shared observations or a common training history.
       - **Convergence via Learning Dynamics**: Through repeated interactions (e.g., in self-play or population-based training), agents may converge to a particular equilibrium. The convergence itself creates a form of mutual expectation: each agent's policy is adapted to the others, and the fact of convergence is known to the designer (but not necessarily to the agents in the form of infinite recursion). However, the agents do not explicitly represent the infinite regress of common knowledge.

  ### 5. **Role of Precedent and Salience**
     - **Lewis**: Precedent (past instances of the coordination problem being solved in a particular way) makes one equilibrium salient. Salience can also come from perceptual prominence (e.g., a focal point) or from shared cultural background.
     - **MARL Translation**:
       - **Precedent**: During training, agents encounter the coordination problem repeatedly. The history of interactions (e.g., stored in a replay buffer) and the learning algorithm (e.g., Q-learning, policy gradients) lead to a path-dependent outcome: the first equilibrium that is stumbled upon and reinforced becomes the convention. This is especially true in on-policy methods where agents reinforce what they have done before.
       - **Salience**: In MARL, salience can be engineered via:
          - *Symmetric Architectures*: Agents with identical neural networks and shared parameters might naturally gravitate toward symmetric equilibria.
          - *Inductive Biases*: The architecture and learning algorithm (e.g., the use of symmetry, role-based representations, or specific exploration strategies) can make certain equilibria more salient.
          - *Reward Shaping*: Designers can add rewards that make one equilibrium more attractive (though this might violate the arbitrariness condition if it breaks symmetry).

  ### 6. **Normative Element**
     - **Lewis**: Agents have a reason to follow the convention because they expect others to follow it. The expectation of conformity gives each agent a conditional preference to conform.
     - **MARL Translation**: In a Nash equilibrium, the policy of each agent is a best response to the others. Thus, given the convention (i.e., the equilibrium policy profile), each agent maximizes its expected return by following its part of the policy. The reason to follow is purely instrumental: it yields the highest reward given the others' behavior.

  ---

  ### Residue Report

  **Clean Mappings**:
  1. **Coordination Problem as Multiple Equilibria**: MARL handles this well. The existence of multiple equilibria in cooperative or aligned settings is common in MARL (e.g., in matrix games with multiple Pareto-optimal Nash equilibria).
  2. **Arbitrariness**: The idea of multiple equally good equilibria is natural in MARL. The choice among them is arbitrary and depends on initialization and learning dynamics.
  3. **Self-Sustaining via Equilibrium**: The concept of a Nash equilibrium directly captures self-sustaining behavior. MARL algorithms are designed to converge to equilibria (or approximations thereof).
  4. **Precedent and Path Dependence**: MARL training is inherently path-dependent. Replay buffers, exploration, and the order of experiences can lead to the selection of one equilibrium over another. Shared training histories (in self-play) or population-based training can establish precedents.
  5. **Normative Element**: The best-response property of Nash equilibria explains why agents stick to the convention.

  **Stretches and Omissions**:
  1. **Common Knowledge**:
     - **The Gap**: Lewis's common knowledge (infinite recursion) is not explicitly represented in MARL. Agents do not maintain beliefs about others' beliefs to an arbitrary depth. Instead, mutual expectations are formed implicitly by the policy (which is a function of the state and past actions) and are reinforced by learning.
     - **Why It's Missing**: MARL agents typically do not model other agents' mental states (unless using explicit opponent modeling). In CTDE, the centralized critic might guide agents toward coordinated policies without requiring common knowledge. The learning dynamics (and convergence) substitute for the infinite regress: once the policy converges, each agent's policy is fixed and thus predictable.
     - **Is it a Problem?**: In practice, MARL can achieve coordination without common knowledge. However, in complex, partially observable environments or when conventions must adapt to new agents, the lack of common knowledge might lead to coordination failures. Lewis's account might be more robust in such cases because common knowledge allows for higher-order reasoning. MARL might be more parsimonious, but it might also be brittle when the environment changes.

  2. **Salience via Perceptual or Cultural Factors**:
     - **The Gap**: Lewis allows salience to arise from perceptual or cultural factors that are external to the game. In MARL, salience is usually engineered by the algorithm designer (e.g., via symmetric architectures) or emerges from the learning process (e.g., via exploration noise). It does not naturally incorporate external salience (e.g., a red traffic light being more noticeable) unless explicitly built into the state representation or rewards.
     - **Why It's Missing**: MARL agents learn from rewards and state transitions. Without prior knowledge (inductive biases) or a rich perceptual model that can capture real-world salience, they might miss natural focal points.

  3. **Common Knowledge and New Agents**:
     - **The Gap**: In Lewis's account, common knowledge allows new agents to adopt a convention by being told (and knowing that everyone else knows). In MARL, a new agent must be trained (or fine-tuned) to adapt to the existing convention. There is no mechanism for "telling" that immediately establishes common knowledge.
     - **Why It's Missing**: MARL agents are typically trained from scratch or via transfer learning. They don't have a symbolic representation of the convention that can be communicated and become common knowledge.

  **Conclusion on Common Knowledge**:
  - The absence of explicit common knowledge in MARL is not necessarily a flaw. The learning dynamics and shared inductive biases (e.g., identical neural architectures) can lead to convergence on a convention without the need for infinite recursion. However, in situations requiring rapid adaptation or when agents must reason about others' reasoning (e.g., in a convention shift), the lack of common knowledge might be a limitation. Lewis's account might be more expressive for such scenarios, but MARL offers a computationally tractable alternative that often works in practice.

  **Overall Residue**:
  - **Left on the cutting-room floor**: 
     - The explicit representation of common knowledge (as infinite recursion of mutual expectations).
     - The role of natural language or symbolic communication in establishing conventions (unless modeled explicitly in the MARL framework).
     - The cultural and perceptual aspects of salience that are not captured by the state representation or rewards.

  - **Stretched**:
     - The concept of precedent is captured by the training history and path dependence, but it is not explicitly represented as a reason for action. Agents don't "remember" past conventions as precedents; they are encoded in the policy parameters.
     - The normative element is reduced to best-response in equilibrium, which is a thin form of reason (purely instrumental) compared to Lewis's richer account of conditional preference.

  In summary, MARL provides a powerful framework for learning conventions, but it does so by substituting explicit reasoning about mutual expectations with learning dynamics and shared representations. This is both a strength (tractability) and a weakness (limited expressiveness for higher-order reasoning). The residue suggests that for open-ended coordination in complex social environments, MARL might need to incorporate elements of opponent modeling (to build beliefs about others) or communication (to establish common knowledge) to fully capture Lewis's account.
answer: |-
  ### Lewis's Convention in MARL Vocabulary

  #### 1. **Coordination Problem**  
  - **Lewis**: Recurring situations where agents share aligned interests but face multiple Pareto-optimal outcomes. Failure to coordinate yields suboptimal payoffs.  
  - **MARL Translation**: A Markov game state with multiple strict Nash equilibria where all agents receive identical, maximal payoffs. For example, a traffic intersection game: both "always yield" and "never yield" are equilibria, but mismatched actions cause collisions (low rewards). It’s *not* zero-sum/mixed-motive because agents’ payoffs are perfectly correlated (e.g., all win or all lose).  

  #### 2. **Arbitrariness**  
  - **Lewis**: The convention is arbitrary if another regularity (e.g., driving on the left vs. right) could have achieved the same payoff.  
  - **MARL Translation**: Multiple symmetric Nash equilibria exist with identical value functions $V_i(s)$ for all agents $i$. The choice between them is indifferent under perfect rationality.  

  #### 3. **Self-Sustaining Regularity**  
  - **Lewis**: Conventions persist because deviating unilaterally reduces individual payoffs when others follow the convention.  
  - **MARL Translation**: The convention is a policy profile $\pi^* = (\pi_1^*, \dots, \pi_n^*)$ constituting a Nash equilibrium. For any agent $i$, $\pi_i^*$ is the best response to $\pi_{-i}^*$:  
    $Q_i^{\pi^*}(s, \pi_i^*, \pi_{-i}^*) \geq Q_i^{\pi^*}(s, \pi_i', \pi_{-i}^*) \quad \forall \pi_i', \forall s.$  

  #### 4. **Common Knowledge**  
  - **Lewis**: Infinite recursion of mutual knowledge ("I know you know I know...") ensures agents confidently expect others to follow the convention.  
  - **MARL Translation**: Agents observe a shared policy $\pi^*$ during centralized training (CTDE). After convergence, $\pi^*$ becomes fixed and is deployed decentralized. However, agents lack explicit iterative belief hierarchies—instead, convergence dynamics and parameter sharing create *implicit* common knowledge.  

  #### 5. **Precedent and Salience**  
  - **Lewis**: Precedent (past success) and salience (perceptual prominence) break equilibrium multiplicity.  
  - **MARL Translation**:  
    - **Precedent**: Repeated play in training leads to *path-dependent equilibrium selection*. Early exploration luck or shared replay buffers bias agents toward one equilibrium.  
    - **Salience**: Inductive biases (e.g., symmetric network architectures) make certain equilibria "focal." Role-based factorization ($\pi_i(o_i, i)$) can assign asymmetric conventions (e.g., "car 1 yields to car 2").  

  #### 6. **Normative Element**  
  - **Lewis**: Agents prefer to follow the convention *because* others do, avoiding coordination failure.  
  - **MARL Translation**: Under opponent modeling, agent $i$’s policy $\pi_i(\cdot | o_i; \theta_i)$ conditions on predicted actions of others. The value function $V_i(s)$ drops if others deviate, creating incentive alignment:  
    $\mathbb{E}[R_i | \pi_i, \pi_{-i}^*] \gg \mathbb{E}[R_i | \pi_i, \pi_{-i}'] \quad \text{for} \quad \pi_{-i}' \neq \pi_{-i}^*.$  

  ---

  ### Residue Report: Mapping Lewis to MARL  

  #### Clean Mappings  
  - **Equilibrium Selection**: MARL handles this via centralized training (e.g., QMIX, MADDPG) converging to one Nash equilibrium. Path dependence from random seeds or initialization explains arbitrariness.  
  - **Precedent as Shared History**: Agents with common replay buffers or parameter sharing (e.g., self-play) develop conventions from repeated interactions.  
  - **Normative Incentives**: Best-response policies in equilibrium align with Lewis—deviations lower $V_i(s)$.  
  - **Salience via Biases**: Symmetric networks favor symmetric equilibria; role embeddings handle asymmetric conventions.  

  #### Stretched or Fudged Pieces  
  1. **Common Knowledge**:  
     - **Gap**: Lewis’s infinite recursion has no direct analogue. MARL agents use:  
       - *Implicit mutual modeling*: Policy gradients respond to others’ behavior (via opponent modeling or centralized critics).  
       - *Convergence as proxy*: Stable policies post-training create "de facto common knowledge."  
     - **Why Absent?** MARL’s learning dynamics (e.g., policy gradients, TD learning) parsimoniously replace explicit common knowledge. Shared inductive biases (e.g., homogeneous networks) align expectations without recursive reasoning. However, this fails in novel interactions with untrained agents—precisely where Lewis’s common knowledge matters.  
     - **Verdict**: MARL’s omission is pragmatic but limits generalization. Real-world conventions use communication/higher-order beliefs (e.g., "I know you know the rule"), which MARL only approximates.  

  2. **Arbitrariness & Real-World Salience**:  
     - **Gap**: Lewis’s salience includes cultural/visual cues (e.g., "red means stop"). MARL relies on algorithmic salience (e.g., network symmetry). Real-world salience (e.g., prior knowledge) must be hardcoded into observations.  
     - **Residue**: MARL cannot derive conventions from external cues without explicit embedding.  

  3. **Precedent Beyond Training**:  
     - **Gap**: Lewis’s conventions spread via social learning (e.g., new agents adopt existing norms). MARL conventions are brittle—new agents require retraining or explicit fine-tuning.  

  4. **Dynamic Conventions**:  
     - **Gap**: Lewis allows conventions to evolve organically. MARL converges to static policies; adapting conventions requires re-training or meta-learning.  

  #### Cutting-Room Floor  
  - **Infinite Regress of Knowledge**: Replaced by convergence dynamics.  
  - **Socio-Cultural Salience**: MARL’s state representations rarely encode real-world semantics (e.g., "red" as salient).  
  - **Linguistic Conventions**: MARL lacks natural language grounding to form conventions via communication.  

  ---

  ### Conclusion  
  MARL faithfully captures the *outcomes* of Lewis’s conventions (equilibrium selection, stability, arbitrariness) but not the *cognitive mechanisms* (common knowledge recursion, cultural salience). The trade-off is parsimony: learning dynamics + shared biases efficiently converge to conventions in closed environments. However, for open-world coordination (e.g., humans interacting with RL agents), MARL’s omission of common knowledge is a liability—real conventions often require recursive reasoning. Bridging this gap may require:  
  - **Explicit Belief Hierarchies**: Bayesian opponent modeling with higher-order beliefs.  
  - **Communication Modules**: Embedding natural language to establish common ground.  
  Lewis’s account highlights what MARL misses: conventions as *shared cognitive artifacts*, not just emergent policies.
