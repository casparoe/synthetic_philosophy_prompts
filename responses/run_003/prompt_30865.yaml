  Other principles could fit Miriam’s published rulings but yield different outcomes for the new case. Here are two key alternatives:

  1. **Alternative Principle 1: Irreversible Harm Required**  
     - *Definition:* A race to the bottom requires a multipolar trap causing **irreversible damage** (e.g., resource extinction, permanent loss). Externalities alone are insufficient without irreversibility.  
     - **Fit with published rulings:**  
       - ✓ Case 1: Irreversible (fish stock collapse).  
       - ✓ Case 2: Irreversible (war deaths, infrastructure loss).  
       - ✗ Case 3: Reversible (temporary waste).  
       - ✗ Case 4: Reversible (sleep loss fixable via agreement).  
       - ✗ Case 5: Reversible (market adjustment).  
     - **Prediction for new case:** ✗ Not a race to the bottom. Harm is reversible (noise stops if ads end), so Miriam would reject the by-law, telling residents/shopkeepers to resolve it privately (like Case 4).  

  2. **Alternative Principle 2: Harm to Shared Resources Required**  
     - *Definition:* A race to the bottom requires a multipolar trap **destroying a rivalrous common resource** (e.g., fisheries, peace) that participants depend on. Negative externalities to non-participants are secondary.  
     - **Fit with published rulings:**  
       - ✓ Case 1: Common resource (fish stock).  
       - ✓ Case 2: Common resource (regional stability).  
       - ✗ Case 3: No shared resource.  
       - ✗ Case 4: No shared resource (hours affect only individual shops).  
       - ✗ Case 5: No shared resource.  
     - **Prediction for new case:** ✗ Not a race to the bottom. Quiet is a public good, not a rivalrous resource (e.g., one resident’s enjoyment doesn’t deplete it). Miriam might call it a nuisance but not a Moloch problem.  

  **Why Miriam’s principle (A+B) is preferable:**  
  - **Narrative consistency:** It explains her contrasting rulings on similar traps (e.g., supporting quotas in Case 1 but not hours regulation in Case 4) via the externality/irreversibility distinction.  
  - **Thematic depth:** It frames races to the bottom as societal failures where competition spills into collateral damage, aligning with economic concepts like the "tragedy of the commons" (Case 1) or externalities (new case).  
  - **Character realism:** As a competition economist, Miriam would emphasize externalities (a core microeconomic concept) and irreversibility (reflecting path-dependence in systems).  

