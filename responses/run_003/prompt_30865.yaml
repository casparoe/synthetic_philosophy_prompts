answer: |-
  Based on Miriam Hart's published rulings and the new case, I'll infer her underlying principle, apply it to the new case, compare alternative principles, and design a further case to cleanly discriminate between them. The goal is to ensure Miriam's ruling feels earned, consistent, and thematically resonant with her character as a competition economist focused on Moloch problems (self-defeating races to the bottom).

  ### Step 1: Miriam Hart's Likely Principle
  After analyzing her rulings, Miriam's principle appears to be:  
  **A situation constitutes a race to the bottom (a Moloch problem) if and only if:**  
  - **(A) It is a multipolar trap:** Participants are locked in a competitive dynamic where individual incentives compel them to escalate, even though cooperation would yield a better outcome for all.  
  - **(B) It causes irreversible harm or significant negative externalities:** The competition inflicts severe, lasting damage to a shared resource, system, or third parties not involved in the competition.  

  **Why this fits her rulings:**  
  - **Case 1 (Overfishing):** ✓ Multipolar trap (boats must overfish to compete, but all lose). ✓ Irreversible harm (fish stock collapse ruins the shared resource long-term).  
  - **Case 2 (Naval Arms Race):** ✓ Multipolar trap (states build arms defensively, leading to unwanted war). ✓ Irreversible harm (war causes permanent civilian losses and destruction).  
  - **Case 3 (Trainer Competition):** ✗ Not a multipolar trap (no systemic lock-in; participants tire quickly). ✗ No irreversible harm/externalities (harm is temporary, self-contained, and trivial).  
  - **Case 4 (Extended Hours):** ✓ Multipolar trap (shopkeepers must extend hours to compete, but all lose sleep). ✗ No irreversible harm/externalities (harm is reversible sleep loss; only affects participants, who can easily coordinate an exit).  
  - **Case 5 (Salary Bidding):** ✗ Not a multipolar trap (escalation is rational market dynamics, not self-destructive; engineers benefit). ✗ No irreversible harm (firms’ margin squeeze is normal competition, not systemic collapse).  

  This principle emphasizes that races to the bottom are not just wasteful competitions but **self-reinforcing traps with catastrophic, hard-to-reverse consequences**—distinguishing them from ordinary competition or reversible inefficiencies. Miriam’s endorsements of interventions (e.g., quotas in Case 1) align with this, as they address the trap and prevent irreversible harm.

  ---

  ### Step 2: Application to the New Case (Amplified Street Advertising)
  - **The situation:** Shops escalate loudspeaker volume to compete, gaining no custom but creating a noise nuisance for residents. A by-law or agreement could end it at negligible cost.  
  - **Analysis under Miriam’s principle:**  
    - **(A) Multipolar trap?** ✓ Yes. Each shop is compelled to amplify ads to be heard over others, but no one benefits. Unilateral withdrawal loses visibility, so they’re trapped without collective action.  
    - **(B) Irreversible harm or significant externalities?** ✓ Yes. Significant negative externalities exist (noise nuisance harms residents—third parties uninvolved in the competition). The harm is reversible if stopped, but externalities to non-participants trigger the "race to the bottom" label.  
  - **Predicted ruling:** Miriam would **call this a race to the bottom and support the by-law**.  
    - **Reasoning:**  
      - Unlike Case 4 (extended hours), this harms bystanders (residents), satisfying the externality criterion.  
      - The trap is identical to Case 4, but externalities make it akin to Case 1/2 (damage beyond participants).  
      - She would endorse the by-law as a low-cost intervention to break the trap and protect third parties, mirroring her support for quotas in Case 1.  

  ---

