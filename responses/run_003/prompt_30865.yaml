  ### Step 4: Further Case to Discriminate Between Principles
  To cleanly test Miriam’s principle against the alternatives, use a case with **reversible harm to non-participants but no shared resource destruction**:  
  - **The Case:** *Two rival theme parks in a tourist town engage in a "ride-height" competition. Each builds taller roller coasters to attract visitors, escalating costs. Profits decline for both parks, but the coasters block ocean views for nearby homeowners, reducing property values. The competition could be halted by a zoning law, restoring views and profitability.*  

  - **Predictions:**  
    - **Miriam’s principle (A+B):** ✓ Race to the bottom. Multipolar trap (parks must escalate to compete) + negative externalities (homeowners’ property losses).  
    - **Alternative 1 (Irreversible harm):** ✗ Not a race to the bottom. Harm is reversible (remove coasters → views/property values rebound).  
    - **Alternative 2 (Shared resource):** ✗ Not a race to the bottom. No shared resource is depleted (ocean views are a public good, but not rivalrous).  

  - **Why it discriminates:**  
    - This case has externalities (property value loss) but no irreversibility or resource destruction, so Miriam’s principle would classify it as a race to the bottom, while the alternatives would not. If Miriam supports the zoning law, it confirms her principle.  

