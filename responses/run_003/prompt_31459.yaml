  so i've been turning this over since my reading group and its making me nervous, because the conclusion is obviously false but every step feels right. You're a professional metaphysician who works on persistence and change — think through it carefully, and before you commit, brainstorm the candidate places the argument could break and what each fix would cost. Here's the argument, numbered:

  (1) Change is one and the same object having incompatible intrinsic properties at different times: the banana is green on Monday and yellow on Friday.
  (2) No object can have incompatible properties — that's just non-contradiction.
  (3) Endurantism says the banana is strictly identical through the change, wholly present on Monday and wholly present on Friday.
  (4) So endurantism makes the very same object both green and yellow — contradiction.
  (5) The obvious way out is to stop saying the persisting object itself has the properties; perdurantism does that by giving the banana different temporal parts, so the green thing and the yellow thing are two different parts.
  (6) But then the persisting thing — the whole banana — is never itself green or yellow; it just has parts that are. So perdurantism dodges the contradiction only by making change unreal, or at best by redefining change so the thing that persists doesn't do the changing.
  (7) So the truism in (1), plus (2), forces a choice: change is contradictory (endurantism) or change is an illusion (perdurantism). But change obviously happens, so the argument has to break somewhere.

  Which premise do you reject, and what does rejecting it cost? Give me exactly five numbered points, each a sentence or two, no introduction or conclusion.
