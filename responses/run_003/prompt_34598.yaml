answer: |-
  The Frege-Geach problem highlights a fundamental challenge for expressivism concerning the **compositionality** of language – how the meaning of complex sentences depends on the meanings of their parts. Here's a breakdown of the problem and why it's uniquely difficult for expressivism:

  1.  **The Cognitivist's Straightforward Solution (Truth-Conditional Compositionality):**
      *   Cognitivists hold that moral sentences express beliefs/propositions that are truth-apt (can be true or false).
      *   For a complex sentence like "If lying is wrong, then getting your little brother to lie is wrong," the cognitivist analyzes it compositionally:
          *   "Lying is wrong" expresses proposition *P* (truth-condition: lying has the property of wrongness).
          *   "Getting your little brother to lie is wrong" expresses proposition *Q* (truth-condition: getting your brother to lie has the property of wrongness).
          *   The conditional "If P, then Q" expresses a complex proposition whose truth-condition is a function of the truth-conditions of *P* and *Q*: The whole sentence is true if and only if it is *not* the case that *P* is true and *Q* is false.
      *   This works seamlessly because logical operators (like 'if...then', 'not', 'and', 'or') are defined *truth-functionally*. Their meaning is specified by how the truth-value of the whole sentence depends on the truth-values of its component parts. Truth-conditions compose.

  2.  **The Expressivist's Initial Problem (Non-Cognitive Composition):**
      *   Expressivists hold that the atomic moral sentence "Lying is wrong" does *not* express a truth-apt belief. Instead, it *expresses* a non-cognitive attitude, like disapproval of lying (let's symbolize this attitude as *Disapprove(Lying)*).
      *   The problem arises when this sentence is embedded:
          *   **Negation ("It is not the case that lying is wrong"):** What attitude does this express? It can't be the *absence* of disapproval, as that's different from disapproving *of* the absence of wrongness. Expressing "not-P" isn't simply *not* expressing *Disapprove(Lying)*; it's actively asserting the negation. What non-cognitive state corresponds to *denying* that lying is wrong?
          *   **Conditional ("If lying is wrong, then getting your little brother to lie is wrong"):** What attitude does *this* express? Crucially, someone sincerely asserting this conditional is *not* necessarily expressing disapproval of lying itself. They might be agnostic about lying but recognize a conceptual connection. Yet, the sentence clearly has moral content and functions logically like any other conditional. What complex non-cognitive attitude does uttering this conditional express?
      *   The expressivist wants to say the meaning of the complex sentence is a function of the attitudes expressed by its parts. But **attitudes do not compose like truth-conditions**.

  3.  **Why the Straightforward Compositional Move Fails: The Nature of Attitudes vs. Truth-Conditions**
      *   **Truth-Conditions are Abstract and Combinatorial:** Truth-values (True/False) are simple, discrete states that logical operators can combine in well-defined, truth-functional ways (e.g., the truth-table for 'if P then Q'). Propositions are the *objects* of belief, which are representational and have inherent logical structure.
      *   **Attitudes are Psychologically Complex and Non-Truth-Functional:**
          *   **Not Discrete States:** Attitudes like disapproval are not binary states like True/False. They exist on a spectrum (intensity) and involve complex psychological dispositions.
          *   **Not Combinable by Logic:** There's no obvious, systematic way to define a logical operator like negation or implication that takes an attitude (e.g., *Disapprove(Lying)*) as input and outputs a *single*, coherent, complex attitude (e.g., *Disapprove(Not-Lying)* or *ConditionalDisapprove(Lying, BrotherLying)*). What *is* "conditional disapproval" as a psychological state?
          *   **Lack Objects of Attitude:** Expressivism traditionally struggles to identify what the attitude expressed by a complex sentence is *directed towards*. The attitude for "If P then Q" isn't obviously directed towards lying, or towards getting your brother to lie, or towards the conditional itself in the same way disapproval is directed towards lying in the atomic case. Cognitivism has propositions as the clear objects of belief in all cases.
          *   **Failure to Explain Inferential Relations:** The core function of embeddings like conditionals and negation is to participate in logical inferences (e.g., modus ponens: "If lying is wrong, then getting your brother to lie is wrong. Lying is wrong. Therefore, getting your brother to lie is wrong."). Truth-conditional semantics explains the validity of this inference perfectly: If the premises are true, the conclusion must be true. Expressivism, lacking truth-apt components, cannot easily explain why accepting the premises *commits* one to accepting the conclusion. What is the *attitudinal* connection that forces this commitment?

  4.  **Expressivist Responses:**
      Expressivists have developed sophisticated strategies to overcome this problem, aiming to explain logical relations without relying on truth-conditional semantics:

      *   **Higher-Order Attitudes (e.g., Simon Blackburn's Quasi-Realism/Projectivism):**
          *   The key idea is that complex sentences express attitudes *towards combinations* of the first-order attitudes expressed by the parts.
          *   **Negation ("~P"):** Expresses disapproval of *accepting P* or having the attitude expressed by P. (e.g., "Lying is not wrong" expresses disapproval of disapproving of lying).
          *   **Conditional ("If P then Q"):** Expresses disapproval of *combining* the attitude expressed by P with the *lack* of the attitude expressed by Q. (e.g., "If lying is wrong, then getting your brother to lie is wrong" expresses disapproval of *both* disapproving of lying *and* *not* disapproving of getting your brother to lie).
          *   **Logical Inference Explained:** Validity is explained as the *inconsistency* of certain combinations of attitudes. Accepting "If P then Q" and "P" but rejecting "Q" involves holding a combination of attitudes that the speaker has already expressed disapproval of (via the conditional). This creates a *practical* inconsistency in the speaker's commitments, analogous to logical inconsistency.
          *   **Challenge:** Can sound complex and capture the full range of logical embeddings without becoming implausibly complex or collapsing back into a description of moral facts? Explaining embeddings within embeddings (e.g., "If if P then Q, then R") becomes very intricate.

      *   **Expressivist-Friendly Notions of Logical Consequence (e.g., Allan Gibbard's Norm-Expressivism):**
          *   Gibbard analyzes moral judgments as expressions of acceptance of norms governing feelings like guilt and anger (a "plan" for what to feel).
          *   He develops a formal semantics using **world-norm pairs** (or "factual-normative worlds"). A world represents how descriptive facts are; a norm (hyperplan) represents what feelings are warranted.
          *   The meaning of a moral sentence is understood in terms of the set of world-norm pairs in which it is *accepted* (the norm says the relevant feelings are warranted).
          *   **Logical Consequence:** Sentence A logically implies sentence B if and only if the set of world-norm pairs where A is accepted is a *subset* of the set where B is accepted. If you accept norms that warrant the feelings expressed by A, you must *also* accept norms that warrant the feelings expressed by B, otherwise your normative perspective is inconsistent.
          *   **Embeddings Explained:** Logical operators are defined set-theoretically over these sets of world-norm pairs. Negation corresponds to complement, conjunction to intersection, disjunction to union, and the conditional (A -> B) corresponds to the set of pairs where if A is accepted, then B is accepted. This mirrors truth-conditional semantics but replaces truth with "acceptance relative to a norm."
          *   **Advantage:** Provides a rigorous, compositional semantics that directly defines validity for complex moral (and mixed) sentences without invoking truth-aptness. It explains why modus ponens is compelling: accepting the premises commits you to norms that necessitate accepting the conclusion to avoid inconsistency.
          *   **Challenge:** The formal apparatus is complex, and some argue it implicitly smuggles in truth-aptness or propositional content via the notion of "acceptance" defined over abstract objects (world-norm pairs).

  **In Summary:** The Frege-Geach problem exposes that while truth-conditions are inherently combinatorial via truth-functional logic, non-cognitive attitudes lack this inherent combinatorial structure. Expressivists cannot simply map logical operators onto operations on attitudes because attitudes are not discrete, truth-functional states. Their solutions involve either:
  1.  **Psychological Complexity:** Analyzing complex sentences as expressing higher-order attitudes towards combinations of first-order attitudes (Blackburn), explaining logic via practical inconsistency.
  2.  **Formal Semantics:** Developing alternative, non-truth-conditional compositional semantics (often using possible worlds plus normative elements like plans or hyperplans) that define logical consequence in terms of consistency in normative perspectives or commitments (Gibbard).

  Both strategies aim to show that moral language, despite expressing attitudes, can still participate in logically complex discourse and valid inferences, preserving the core expressivist insight while overcoming its most significant technical hurdle.
