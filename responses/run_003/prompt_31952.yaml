  Okay, let me start by unpacking the user's query. They're describing an argumentative move in epistemology that deals with gradual changes in conditions like being cold, in pain, awake, or a heap. The core issue is about knowledge at the boundary where a condition starts or stops. They mention the KK principle but note that this move is used negatively to challenge claims that whenever you're in a state, you know you're in it. The user wants to know the name of this argument, its structure, premises, and limitations.

  First, I need to recall the relevant philosophical concepts. The example given is a sorites series, which is a sequence where small, imperceptible changes lead to a significant shift. The argument here seems similar to a margin for error principle applied to knowledge. Williamson's anti-luminosity argument comes to mind. Luminosity is the idea that certain mental states are always knowable when present, and Williamson uses sorites series to refute that. 

  The user's confusion might be between KK (iterative knowledge) and luminosity. They mentioned KK is positive, while this move is negative. So clarifying that distinction is key. The property being attacked is luminosity, not KK. 

  Next, the argument's structure: it starts with the luminosity assumption, constructs a sorites series, then uses reliability and margin for error to show a contradiction. The critical premise is that knowledge requires reliability; if a state could easily be different without you noticing, you can't know it. This margin for error principle is what creates the problem at the boundaries. 

  The user also asks where the argument stops applying. Not all gradual conditions are affected. Conditions with sharp boundaries or those detectable through other means might avoid this. For example, being in pain might have fuzzy boundaries, but if there's a neurological marker, it could be luminous. Also, non-mental states like heaps are vulnerable because their boundaries are vague. 

  I should also consider the user's deeper needs. They've been reading epistemology but haven't found a term for this argument. They might be looking for a framework to categorize such arguments or understand their scope. They might also be interested in how philosophers respond to these arguments, like contextualism or denying reliability. 

  Potential pitfalls: confusing luminosity with KK, misunderstanding the necessity of margin for error. Also, the user might think this applies to all vague predicates, but it's specifically about knowledge of one's own states. Highlighting examples where it doesn't apply, like knowing a room is messy via comparison, could help. 

  In summary, the key points are naming the argument (anti-luminosity), explaining its structure (sorites + margin for error), distinguishing it from KK, and clarifying its limitations. Addressing these should cover the user's explicit questions and their underlying interest in epistemological boundaries and knowledge reliability.
answer: |-
  That's a brilliantly clear description of a fundamental epistemological maneuver! You're absolutely right that it's distinct from the KK principle (though related), and it's one of the most powerful tools against certain ambitious claims about knowledge, particularly self-knowledge. Here's the breakdown:

  1.  **The Name:** The argument is most famously associated with **Timothy Williamson** and his **anti-luminosity argument** (primarily in his book *Knowledge and Its Limits*). The property it's attacking is called **luminosity**.

  2.  **The Target Property: Luminosity**
      *   **Definition:** A condition C is *luminous* if and only if: Whenever C obtains (is true), the subject is in a position to know that C obtains. In your example: "Whenever you're cold, you're in a position to know you're cold."
      *   **Ambition:** Luminosity claims are strong! They assert perfect cognitive access to the obtaining of C *whenever* C is present. Philosophers historically thought certain mental states (like feeling cold, being in pain, seeming to see red, being awake) were likely luminous.

  3.  **The Argument Structure (The Anti-Luminosity Argument):**
      Here's how the argument runs, formalizing your description:

      *   **Premise 1 (Target Luminosity Claim):** Condition C is luminous: For any time `t`, if C obtains at `t`, then at `t` the subject is in a position to know that C obtains at `t`.
      *   **Premise 2 (Gradual Change - Sorites Series):** There exists a continuous, gradual series of moments `t₀, t₁, t₂, ..., tₙ` such that:
          *   At `t₀`, C clearly does *not* obtain (e.g., definitely not cold).
          *   At `tₙ`, C clearly *does* obtain (e.g., definitely cold).
          *   The difference between consecutive moments `tᵢ` and `tᵢ₊₁` is so small that the subject cannot reliably discriminate the state at `tᵢ` from the state at `tᵢ₊₁` based on the basis for knowing C (e.g., how it feels).
      *   **Premise 3 (The Reliability/Margin for Error Principle):** If the subject knows that C obtains at time `t`, then C must obtain not only at `t`, but also at all times sufficiently close to `t` where the subject's basis for judging C is the same (or indiscriminable). **This is the crucial, often implicit premise.** Knowledge requires *safety* or *reliability*; if your basis could be the same in a very similar situation where C is *false*, then that basis isn't sufficient for knowledge in the actual situation. The basis must give you a *margin for error*.
      *   **Premise 4 (The Boundary):** There is a first time `tₖ` in the series where C obtains (or analogously, a last time where it doesn't).
      *   **The Contradiction:**
          1.  By Luminosity (P1): At `tₖ` (where C first obtains), the subject is in a position to know that C obtains.
          2.  By Gradual Change (P2): The subject's basis at `tₖ` is indiscriminable from their basis at `tₖ₋₁` (the moment *just before* C first obtains, where C does *not* obtain).
          3.  By Reliability (P3): If the subject knows C at `tₖ`, then C must also obtain at `tₖ₋₁` (since `tₖ₋₁` is indiscriminably close and the basis is the same). But by definition of `tₖ` (P4), C does *not* obtain at `tₖ₋₁`.
          4.  Therefore, the subject *cannot* know C at `tₖ`. This contradicts step 1.
      *   **Conclusion:** Therefore, the initial luminosity claim (P1) must be false. Condition C is *not* luminous. There are times when C obtains, but the subject is *not* in a position to know it obtains.

  4.  **How the Argument Works & Its Core Insight:**
      *   The argument exploits the **tension between vagueness and demanding standards for knowledge**.
      *   **Vagueness:** Conditions like "cold," "pain," "awake," "heap" have borderline cases. There's no sharp, knowable instant where "not cold" flips to "cold."
      *   **Knowledge Requires Reliability (Safety/Margin for Error):** To genuinely *know* something based on a fallible basis (like how you feel), your basis must be such that in *all very similar situations*, the proposition is still true. If a situation exists that is subjectively identical (based on your basis) but where the proposition is false, then your basis in the actual situation isn't sufficient to guarantee truth – you could easily be wrong. Knowledge excludes close possibilities of error.
      *   **The Squeeze:** The gradual sorites series creates a sequence where, at the critical boundary moment `tₖ`, the situation *is* subjectively identical to a moment (`tₖ₋₁`) where the proposition *is* false (C does not obtain). Therefore, the subject *cannot* know at `tₖ`, even though C *does* obtain there. The requirement for a margin of error around knowledge clashes directly with the lack of a margin at the vague boundary.

  5.  **Where Does It Stop Applying? (Limitations & Scope)**
      The argument is incredibly powerful but *not* universally destructive. It primarily targets claims about **luminosity based on fallible, gradually changing bases**, especially for **vague conditions**. It stops applying or can be mitigated in several ways:

      *   **Non-Gradual/Sudden Changes:** If the change from ~C to C is *instantaneous* and *detectable* at the moment it happens, the argument fails. Premise 2 (gradual change with indiscriminability) doesn't hold. (e.g., Knowing a light *just* turned on if there's a distinct, noticeable change).
      *   **Conditions with Sharp Boundaries:** If a condition has a perfectly sharp, knowable boundary, Premise 4 is unproblematic and the reliability principle might be satisfiable at the boundary. (e.g., "The number of atoms in this object is exactly 1000" – if you could magically count them instantly and perfectly, you could know precisely when it changes).
      *   **Conditions Known by Infallible/Non-Gradual Means:** If the basis for knowing C is infallible or doesn't change gradually in the relevant way, the reliability principle might be satisfied. (e.g., Cogito-like claims: "I am thinking" – the change from not-thinking to thinking might be sharp, and the basis might be direct and infallible in a way that avoids the sorites).
      *   **Non-Mental States (Heaps, etc.):** The argument works *just as well* against luminosity claims for non-mental states *if* the basis for knowing them is similarly fallible and gradual. Your "heap" example is classic sorites, and if someone claimed "You always know exactly when something becomes a heap" (based on looking at it), the anti-luminosity argument would demolish that claim. Its power isn't limited to the mental.
      *   **Weakening the Luminosity Claim:** The argument attacks *perfect* luminosity (knowledge *whenever* C obtains). It doesn't touch claims like "We *usually* know when we're cold/in pain/awake" or "We know *in central cases*."
      *   **Attacking the Reliability Premise (P3):** Some philosophers question the strength of the reliability/safety/margin-for-error requirement. Could we have knowledge *without* a margin for error in the vicinity? (This is controversial and difficult to defend).
      *   **Contextualism:** A contextualist might argue that the standards for "know" shift in the boundary region. At `tₖ`, the standards might be higher, making the knowledge claim false, while in the clear cold region, the standards are lower, making it true. This avoids the contradiction but accepts that luminosity fails under high standards.
      *   **Denying the First Moment (P4) - Supervaluationism/Epistemicism:** Theories of vagueness that deny there *is* a precise first moment (e.g., supervaluationism says it's indeterminate *which* moment is first; epistemicism says there *is* a precise first moment but we cannot know it) can block the contradiction. Williamson himself is an epistemicist: he accepts P4 (there *is* a first moment `tₖ`) but argues that we *cannot know* at that moment that C obtains *because* of the reliability requirement – the boundary is sharp but unknowable.

  **In Summary:**

  *   **Name:** The Anti-Luminosity Argument (Williamson).
  *   **Target:** The property of Luminosity (perfect cognitive access whenever the condition obtains).
  *   **Core Mechanism:** Exploits the conflict between the reliability requirement for knowledge (needing a margin for error) and the existence of indiscriminable changes across the vague boundary of a gradually changing condition in a sorites series.
  *   **Scope:** Applies powerfully to *any* claim of luminosity for a condition that can change gradually *and* where the basis for knowing it is fallible and changes gradually alongside it, making the boundary region indiscriminable. This includes paradigmatic mental states (cold, pain, awake) *and* non-mental vague conditions (heap, bald). It does *not* apply to conditions with sharp, knowable boundaries, known infallibly, or where the change is sudden and detectable.

  You've pinpointed one of the most significant arguments in contemporary epistemology. Its power lies in showing that even our most intimate seeming self-knowledge might not be perfectly luminous at the boundaries because of the fundamental constraints of reliability and the vagueness inherent in many of the conditions we seek to know.
