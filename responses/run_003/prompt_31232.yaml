  So we just read the part of The Prince where Machiavelli talks about fortune, and I'm stuck on how it fits with the rest of the book. For most of it he seems to say princes succeed when their way of acting fits the times — sometimes caution is right, sometimes boldness, and the real skill is reading the situation. But then in the fortune chapter he says fortune is a woman who lets herself be won over by impetuous men, so it's better to be bold than cautious. That feels like a flat contradiction. Is his actual view that virtù is basically just agressive, masculine risk-taking, and all the earlier stuff about adapting to circumstances is just hedging? Because if he really thought you should match your conduct to the times, I don't get why he ends by telling princes to basically always charge ahead. I'm trying to figure out what the relationship between virtù and fortune actually is in his account.
