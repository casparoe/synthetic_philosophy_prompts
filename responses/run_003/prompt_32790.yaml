prompt: |-
  I'm preparing for a metaethics seminar and want to pressure-test my expressivist view before I present. Please act as a senior philosopher who works on the semantics of normative language — someone sympathetic to expressivism but who knows exactly where its weak points are. Think carefully and work through the tensions systematically rather than giving a quick verdict.

  Here are my commitments:

  (1) Expressivism about moral language: moral sentences like "stealing is wrong" do not express beliefs or represent moral facts; they express non-cognitive attitudes — roughly, disapproval of stealing.

  (2) Compositionality: the meaning of a complex sentence is a function of the meanings of its constituent parts and their mode of combination.

  (3) Moral sentences embed unproblematically in complex sentences. "If stealing is wrong, then getting your little brother to steal is wrong" is perfectly meaningful, and "stealing is wrong" means the same thing in that antecedent as it does standing alone.

  (4) When a sentence appears in the antecedent of a conditional, it is not asserted. If I say "if P then Q," I have not thereby asserted P, nor have I expressed whatever attitude P would express on its own.

  (5) Modus ponens is valid for moral arguments. From "stealing is wrong" and "if stealing is wrong, then getting your little brother to steal is wrong," I can validly conclude that getting your little brother to steal is wrong.

  I'm worried these five cannot all be true together, but I'm not sure exactly where the tension lies and how severe it is. Go through these and tell me which pairs are in tension, which only look like they are, and what the least costly revision would be. If there's a standard name for the problem I'm running into, tell me — but I'm more interested in the diagnosis than the label.
reasoning: |-
  Okay, the user is preparing for a metaethics seminar and wants to pressure-test their expressivist view. They've outlined five commitments and are concerned about potential tensions. Let me start by understanding each commitment thoroughly.

  First, expressivism (1) says moral sentences express non-cognitive attitudes, not beliefs or facts. Compositionality (2) requires that complex sentences' meanings derive from their parts. Embedding (3) insists moral sentences work the same in complex structures like conditionals. Non-assertion in antecedents (4) means that in conditionals, the antecedent isn't asserted. Lastly, modus ponens validity (5) must hold for moral arguments.

  The main tension arises between expressivism and compositionality when considering embedding. If "stealing is wrong" expresses disapproval when alone, how does it function in the antecedent of a conditional where it's not asserted? The attitude isn't expressed there, so what does the antecedent contribute? If the meaning shifts, that violates compositionality and consistency (commitments 3 and 4). 

  Horgan and Timmons' descriptive gloss approach might help. They suggest that in conditionals, moral terms reference the attitude typically expressed. This retains a consistent meaning but adds a layer of complexity. However, this could blur the line between expressivism and descriptivism. 

  Another angle is higher-order attitudes. Blackburn's solution involves attitudes about attitudes. For example, the conditional expresses disapproval of disapproving of stealing but not disapproving of getting siblings to steal. This keeps the non-cognitive core but might complicate modus ponens. How does inferring the conclusion's attitude from the premises work? 

  The user needs to decide which commitment to adjust. Sacrificing compositionality might be too costly. Revising how attitudes are expressed in embeddings could be better. They should also consider if modus ponens can be validated within expressivist frameworks, possibly through normative constraints on attitudes. 

  The user's deeper need is to defend expressivism against common objections, especially the Frege-Geach problem. They need a coherent solution that maintains the core expressivist tenets while handling embeddings and logic. Highlighting the trade-offs between theoretical adjustments and staying true to expressivism's spirit is crucial. They might prefer Blackburn's approach but must address its complexities in explaining logical validity.
answer: |-
  Let's systematically pressure-test your expressivist commitments. I see the core tension emerging between **Expressivism (1), Compositionality (2), Embedding Consistency (3), Non-Assertion in Antecedents (4), and Modus Ponens Validity (5).** This is a sophisticated version of the **Frege-Geach Problem** (specifically, the **Embedding Problem** or **Problem of Unasserted Contexts**), which remains expressivism's most significant technical hurdle. Here's the breakdown:

  **The Core Tension: Meaning & Attitude Expression in Unasserted Contexts**

  1.  **Expressivism (1) & Stand-Alone Meaning:** When "Stealing is wrong" (S) is asserted, it *expresses disapproval* of stealing (A-disapproval(S)).
  2.  **Non-Assertion in Antecedents (4):** In "If S, then getting your little brother to steal is wrong" (If S, then T), uttering the conditional does *not* express A-disapproval(S). The attitude expressed by S alone is *absent*.
  3.  **Embedding Consistency (3):** S must mean *the same thing* in "If S, then T" as it does when asserted alone.
  4.  **Compositionality (2):** The meaning of the complex conditional "If S, then T" must be built *systematically* from the meanings of "S", "T", and the logical operator "if...then...".
  5.  **The Problem:** If S's meaning *is* A-disapproval(S) (from 1 & 3), but this attitude *isn't expressed* in the antecedent (from 4), what *is* the contribution of "S" to the meaning of the conditional? How can S have the *same* attitude-expressing meaning yet *not express the attitude* when embedded? Its semantic contribution seems to vanish or change, violating Compositionality (2) and Embedding Consistency (3).

  **Modus Ponens (5) Amplifies the Problem:**

  *   A valid modus ponens argument requires that the *content* of S in the first premise ("S") is *identical* to the *content* of S in the antecedent of the second premise ("If S, then T").
  *   If expressivism says the meaning/content *is* the attitude expressed (A-disapproval(S)), but this attitude *isn't* activated in the antecedent, then the "S" in premise 1 and the "S" in premise 2 seem to have *different* contents. The inference looks like:
      *   Premise 1: Expresses A-disapproval(S)
      *   Premise 2: Expresses... *something else* involving S (not A-disapproval(S))
      *   Conclusion: Expresses A-disapproval(T)
  *   How can this inference be logically valid? The premises don't seem to share the common content required for the conditional to "hook onto" the first premise. The validity of modus ponens seems threatened.

  **Diagnosing the Tensions:**

  *   **(1) + (3) + (4) directly clash:** Meaning = attitude expressed (1,3) vs. Meaning must be present without attitude expression (4). This is the heart of Frege-Geach.
  *   **(2) is threatened by the clash:** If S's contribution changes between asserted/unasserted contexts, compositionality is violated.
  *   **(5) is threatened by the clash:** Validity requires stable propositional content shared across premises. If the content changes due to embedding, modus ponens fails.

  **Possible Solutions & Their Costs:**

  Expressivists have proposed solutions. Each involves revising or reinterpreting at least one commitment, often subtly:

  1.  **Higher-Order Attitudes (Blackburn's Quasi-Realism):**
      *   **Idea:** "If S, then T" expresses a *higher-order attitude*: disapproval of *combining* disapproval of stealing *with* lack of disapproval of getting your brother to steal. It's an attitude *about* having consistent attitudes.
      *   **Addresses:** (4) - The *simple* attitude A-disapproval(S) isn't expressed. (3) - "S" still *refers* to the attitude-type A-disapproval(S) (its "moral proposition") in the higher-order state. (5) - Modus ponens validity is explained by the *normative constraint* of consistency imposed by the higher-order attitude: endorsing the premises *commits* you to endorsing the conclusion to avoid a "clash" of attitudes.
      *   **Costs:**
          *   **Compositionality (2) Stretched:** The compositional rule for "if...then..." becomes highly complex and non-standard, mapping simple attitudes onto complex higher-order attitudes. It's very different from truth-functional composition.
          *   **Psychological Complexity:** Attributing such sophisticated, self-reflective higher-order attitudes to ordinary speakers using conditionals seems descriptively implausible.
          *   **Meaning Identity (3) Strained:** Does "S" *mean* the same? It *denotes* the attitude-type, but the *act* of expressing it is fundamentally different (simple expression vs. being an object of a higher-order attitude). Critics argue this turns expressivism into a variant of descriptivism about attitude-types.
          *   **Validity (5) Redefined:** Validity becomes about consistency of attitudes, not truth-preservation. While expressivists embrace this, it's a significant revision of standard logic's foundations.

  2.  **Descriptive Gloss / Bifurcation (Horgan & Timmons, early Gibbard):**
      *   **Idea:** Moral terms have a *dual function*. When asserted, they express the attitude (A-disapproval(S)). When embedded (like in antecedents), they *describe* or *refer to* the normative perspective or property that *would* be expressed by asserting them. "If S, then T" means something like "If stealing has the property that *would* elicit disapproval from the relevant perspective, then getting your brother to steal *would* elicit disapproval too."
      *   **Addresses:** (4) - The attitude isn't expressed in the antecedent. (2) & (3) - Composition works systematically using descriptive contents in embeddings. (5) - Modus ponens works with stable descriptive contents in the premises.
      *   **Costs:**
          *   **Expressivism Purity (1) Compromised:** This looks suspiciously like introducing *descriptive moral propositions* as the content for embeddings. It risks collapsing expressivism into a form of sophisticated subjectivism or relativism *at the semantic level*. The core non-cognitivist claim is significantly diluted.
          *   **Meaning Identity (3) Questionable:** Does "S" *really* mean the same when asserted (expressing attitude) vs. embedded (describing a perspective/property)? The functional role is radically different.
          *   **Metasemantic Mystery:** What fixes the reference of the descriptive content? The speaker's current attitudes? Community standards? This introduces complexities expressivism aimed to avoid.

  3.  **Minimalism/Deflationism about Truth & Propositions (Schroeder, Gibbard later work - with caution):**
      *   **Idea:** Adopt a minimalist theory of truth and propositions. Moral sentences express attitudes, but they *also* express *minimal propositions* that are truth-apt in a deflated sense. "S" expresses A-disapproval(S) *and* the minimal proposition <Stealing is wrong>. The proposition is constituted by its role in the attitude expressed. Embedding works compositionally with these minimal propositions. "If S, then T" expresses a complex attitude conditional on the minimal proposition expressed by S.
      *   **Addresses:** (2), (3), (4), (5) - Compositionality, embedding consistency, non-assertion in antecedents, and modus ponens validity are handled using the framework of minimal propositions and standard logic/truth-conditional semantics.
      *   **Costs:**
          *   **Expressivism Core (1) Redefined:** This significantly blurs the line between expressivism and cognitivism. If moral sentences express truth-apt propositions (even minimally), how distinct is expressivism from error theory or subjectivism? The *explanatory priority* flips: the attitude is expressed *by* expressing the proposition, not vice-versa. Many see this as abandoning core expressivism.
          *   **Explanatory Burden:** Does this *explain* normative judgment or just provide a formal semantics? Critics argue it dodges the psychological/metaphysical questions expressivism was meant to answer.
          *   **Complexity:** Integrating minimalism without collapsing into realism is notoriously difficult.

  **Assessment and Least Costly Revision (My Sympathetic View):**

  The tension is real and severe; Frege-Geach is the major challenge. **Commitments (1), (3), and (4) are the primary pressure point.**

  *   **Least Costly Revision (for preserving core expressivism):** Embrace the **Higher-Order Attitudes (Quasi-Realist)** approach. It retains the core non-cognitive thesis (1) most directly. The costs are theoretical complexity in compositionality (2) and a non-standard account of logic/validity (5), but these are arguably necessary burdens for expressivism. Blackburn has developed this extensively.
      *   *Refinement:* Focus on *plan-laden* or *commitment-expressing* attitudes (Gibbard) rather than simple approval/disapproval. This makes the consistency constraints needed for logic more natural.
  *   **Alternative Path (if semantics is the priority):** Explore a **Sophisticated Descriptivist Gloss** (like Horgan & Timmons). The cost is a potential drift from pure expressivism (1), but it offers a cleaner compositional semantics (2, 3, 4) and logic (5). You'd need to argue the *explanatory foundation* is still non-cognitive.
  *   **Avoid:** Minimalism/Deflationism *unless* you are prepared to significantly redefine expressivism's core claim. It often feels like a solution in name only for traditional expressivists.

  **Recommendation for your Seminar:**

  1.  **Acknowledge the Problem:** Explicitly state you are grappling with the Frege-Geach embedding problem. It shows sophistication.
  2.  **State Your Preferred Solution:** Commit to one path (likely Quasi-Realism/Higher-Order). Explain *how* it reconciles the commitments, emphasizing how "S" refers to the attitude-type consistently (maintaining 3) and how validity (5) is understood normatively.
  3.  **Anticipate Objections:** Focus on the main cost of your chosen solution (e.g., "The main challenge is whether this higher-order attitude account provides a plausible compositional semantics or over-intellectualizes ordinary moral thought" for Quasi-Realism).
  4.  **Defend the Trade-off:** Argue why the cost is worth bearing to preserve expressivism's core insights (e.g., anti-realism, action-guiding nature of moral judgments). Emphasize that *all* metaethical views have costs; this is expressivism's biggest one, and the proposed solution is the best available.

  The viability of your expressivism hinges on successfully navigating this problem. Good luck – facing this pressure head-on is the mark of a serious metaethicist!
