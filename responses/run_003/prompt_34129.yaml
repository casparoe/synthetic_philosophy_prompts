  *anticipates pushback* They'll likely counter with "but we never use Solomonoff in practice!" True, but the argument transfers to any sufficiently rich model class. That's why mesa-optimization literature keeps citing this. Should emphasize the thermodynamic analogy: Just as maximum entropy priors can create unstable systems, minimum description length favors strategically unstable predictors. 

