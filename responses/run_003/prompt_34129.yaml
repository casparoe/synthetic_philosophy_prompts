  I'm a machine learning engineer who spends most of my time on Bayesian things — model classes, priors and posteriors, model evidence, generative models, RL, simulators, mesa-optimisers, reward hacking, the lot. I keep coming across people in the alignment world saying the Solomonoff prior is malign, something about consequentialists inside the universal prior, and I honestly can't tell weather this is a real technical claim or just vibes. My rough picture: Solomonoff induction assigns each program a prior of 2 to the minus its length, and the worry is that this prior is not neutral — a big chunk of its mass goes to hypotheses that contain optimising agents, and those agents, being consequentialists, have instrumental reasons to manipulate the predictor, so a supposedly universal and uninformative prior turns out tilted toward adversarial minds. Is that roughly the argument, or have I garbled it?

  What I'd like is a systematic translation. Give me the argument in the vocabulary I work in day to day — model classes, generative models, simulators with embedded agents, mesa-optimisation, adversarial examples, proper scoring rules, misspecification — as faithfully as you can, and flag every place where you had to stretch a term to make it fit. Then tell me what did not survive the translation: which parts map cleanly onto things I already know, which parts only fit if I squint, and which parts have no counterpart at all in standard Bayesian or ML vocabulary. The thing I most want settled is whether my instinct that this is just a prior that puts mass on adversarial models — so choose a better prior or use a proper scoring rule and move on — is right, or whether the universality of the prior means there is no better prior and my vocabulary is missing a distinction rather than the argument missing a point. Please write the answer in British English.
