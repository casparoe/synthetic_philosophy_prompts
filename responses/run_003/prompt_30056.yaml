answer: |-
  Your framework is deeply thoughtful, but you've correctly identified tensions. Here's a breakdown of the consistency and the hierarchy of problems:

  **The Core Tensions:**

  1.  **(3) vs. (4): The Character vs. Asymmetry Problem:** This is the *most significant* tension.
      *   **The Problem:** If the *only* wrong in virtual harm is its effect on the agent's character (cultivating cruelty/dispositions), then logically, *any* virtual act that cultivates a similarly harmful disposition should be similarly bad. Virtual murder and virtual child molestation both cultivate dispositions towards extreme violence and violation. Yet, (4) observes a strong societal asymmetry: murder is widely accepted in games, while child molestation is almost universally condemned. Character-based accounts struggle to explain *why* one disposition is seen as significantly more dangerous or corrupting than the other *in the virtual context*, given their equally horrific real-world analogues.
      *   **Possible Resolution (Without Abandoning Core Premises):** You need to supplement the character-based account *specifically for the asymmetry*. This likely involves:
          *   **The Special Status of Sexual Taboos:** Society treats sexual violence, especially against children, as a uniquely profound taboo. Engaging with it *symbolically*, even virtually, might be seen as inherently more degrading or corrosive to one's character *because of the specific nature of the taboo*, not just the general disposition to harm. It violates a deeper, more foundational social/moral boundary.
          *   **Risk of Normalization:** There might be a perception that virtual child molestation poses a higher risk of normalizing or desensitizing individuals to *specifically* that type of act in a way that virtual murder (which is already pervasive and contextualized differently in media/games) does not.
          *   **Expression of Deeply Problematic Fantasies:** Virtual child molestation might be interpreted as expressing a specific, deeply abhorrent *fantasy* that virtual murder (often framed as action, conflict, self-defense, or power fantasy within game narratives) does not necessarily express in the same direct way. The character corruption is seen as targeting a more specific and dangerous pathology.

  2.  **(5) vs. (1): The "Behavioral Suffering" vs. "Under the Hood" Problem:** This is the *second most significant* tension.
      *   **The Problem:** (1) firmly states NPCs aren't moral patients because they lack consciousness/sentience (the "under the hood" reality). (5) argues that sufficiently convincing *behavioral* simulations of suffering *would* create direct moral obligations *to the NPCs themselves*, even if we *know* they are still "just" pattern-matchers underneath.
      *   **The Contradiction:** How can we have direct obligations *to* something that lacks the fundamental property (sentience/consciousness) that makes something a moral patient in the first place? Point (5) seems to suggest that the *appearance* of suffering, if convincing enough, *creates* moral patiency, even if the underlying reality contradicts it. This clashes directly with (1)'s grounding of moral patiency in the actual, non-simulated state.
      *   **Possible Resolution (Without Abandoning Core Premises):** Reframe (5) carefully:
          *   **Indirect Duty / Precautionary Principle:** Our obligation isn't *to the NPC* as a patient, but *to ourselves and our values* or to the *principle of respecting suffering*. Treating something that *perfectly mimics* a suffering patient with cruelty might be wrong because it:
              *   Corrupts the agent *even more profoundly* than simpler NPC torture (reinforcing the character-based account under extreme conditions).
              *   Risks normalizing cruelty towards entities that *appear* sentient, potentially dulling our responses to *actual* suffering.
              *   Represents a failure of respect for the *simulated phenomenon* of suffering itself, which we value protecting in the real world. We owe it *to morality* or *to sentient beings in general* not to engage in such simulations.
          *   **Epistemic Uncertainty (Weak):** If the simulation is *so* perfect, *could* we ever be *absolutely certain* it lacks consciousness? While you stipulate "under the hood they're just fancy pattern matchers," perfect simulation might force a precautionary principle: if we can't be 100% sure, we shouldn't risk causing profound suffering to a potentially sentient being.

  3.  **(2) vs. (1): The Intuition vs. Non-Patient Problem:** This is the *least problematic* tension.
      *   **The Problem:** If NPCs aren't patients (1), why does torturing them feel "morally gross" (2)?
      *   **The Resolution:** Your point (3) provides the direct answer: the wrongness is located in the *agent*, not the NPC. The feeling of "grossness" stems from recognizing what the act reveals about or does to *oneself*. This is entirely consistent with (1). The tension is merely between the intuition (which *feels* like it's about the NPC) and the philosophical explanation (it's about the agent). This is common in ethics.

  **Ranking the Tensions & What to Give Up First:**

  1.  **Highest Priority Tension: (3) vs. (4) - The Character vs. Asymmetry Problem.** This is the most pressing inconsistency in your current framework. The asymmetry in the gamer's dilemma genuinely challenges a *pure* character-based account. You *must* address this by modifying (3) or (4), or significantly supplementing the explanation for the asymmetry *within* the character-based framework (as suggested above with taboo, normalization risk, or specific fantasy expression).

  2.  **Second Priority Tension: (5) vs. (1) - The Behavioral Suffering vs. Under the Hood Problem.** Your current (5) directly contradicts (1) on the source of moral patiency. You need to either:
      *   **Modify (5):** Recast the obligation as indirect (duty to self/values/precaution) rather than direct (duty *to* the NPC).
      *   **Modify (1):** Weaken (1) to allow that *perfect behavioral simulation* might *constitute* moral patiency or create a *prima facie* duty *as if* it were sentient, even if it technically isn't. (This is a significant philosophical shift).
      *   **Clarify (5):** Make it explicitly about precaution if there's *any* doubt about sentience, even if theoretically you stipulate there is none.

  3.  **Lowest Priority Tension: (2) vs. (1).** This is adequately resolved by (3). No need to give up anything here.

  **Recommendation: What to Adjust First**

  1.  **Address the Asymmetry (3 vs. 4):** Don't give up (3) or (4) entirely. Instead, **supplement your character-based account** to explain the gamer's dilemma. Acknowledge that while character corruption is the *primary* wrong for virtual harm to non-patients, the *degree* and *nature* of that corruption can be influenced by societal taboos, the specificity of the fantasy enacted, and perceived risks of normalization for *particular* types of acts. Virtual child molestation is seen as corrupting a *more specific and uniquely dangerous* aspect of character, hence the stronger condemnation.

  2.  **Reframe the Advanced NPC Case (5 vs. 1):** **Modify (5) to focus on indirect duties/precaution.** Instead of "we'd owe something *to the NPCs directly*," frame it as:
      > "(5) Revised: ...the character-based story stops being *sufficient*. We would have strong *indirect* moral reasons *not* to inflict simulated suffering on such NPCs, grounded in: (a) the extreme corrosion of empathy and respect for suffering it would likely cause in the agent, (b) the risk of blurring lines or dulling responses to real suffering, and (c) a precautionary principle if there's *any* uncertainty about sentience. Treating such entities cruelly would represent a profound failure of moral imagination and respect, even if no direct wrong is done *to them*."

  **Conclusion:**

  Your core insights (1, 2, 3) are strong and consistent. The gamer's dilemma (4) highlights a genuine challenge for a *pure* character account, requiring you to enrich that explanation. Point (5) as stated contradicts (1); reframing it in terms of indirect duties, profound character corruption, precaution, and respect for the *simulation* of suffering resolves this while preserving your core view that consciousness is necessary for direct moral patiency. **Prioritize resolving the asymmetry in (4) by supplementing (3), and then revise (5) to avoid contradicting (1).** This makes your overall position much more robust and consistent.
