prompt: |-
  Alright, I want your actual credence on something I keep going back and forth on. Parfit's hitchhiker scenario: you're stranded in the desert, a driver says they'll rescue you if you promise to pay them $1000 once you're home, but you both know that once you're safe you'll have no self-interested reason to pay and the driver won't be able to track you down. Can you rationally make yourself into the sort of person who *will* pay — through adopting a disposition, self-modification, whatever — so that your promise is credible and you get rescued?

  Give me your credence that the answer is yes. But the number alone is useless to me. I want the decomposition. At minimum I want your credences on: (1) whether 'rational irrationality' is even a coherent notion — that it can be rational to deliberately cause yourself to act against your own interests in a future situation; (2) conditional on it being coherent, whether a human agent could actually pull off the relevant kind of self-binding; (3) whether the driver would be justified in believing the promise given that they know the whole setup. Add any other sub-questions you think matter. Give me numbers and a one-sentence justification for each, then show how you combine them. Finally, tell me which term your final credence is most sensitive to — i.e., if you could get definative evidence on one sub-question, which would shift your overall number the most?
