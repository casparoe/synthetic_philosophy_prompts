prompt: |-
  I'm the best man at my brother's wedding next month and I keep putting off writing the toast. Years ago he told me about a story from a philosopher—Williams, I think, or someone like that—about a man who sees his wife and a stranger drowning, saves his wife, and when he starts explaining his reasoning afterward, the wife is hurt: the fact that he needed to reach for a reason at all is already one thought too many. The part that stuck with my brother was that the person you are, the things you care about, are supposed to be enough; having to justify them from the outside changes them. He got weirdly attached to this, and it's become a running joke between us—whenever I overexplain something, he says 'too many thoughts.' I want the toast to actually be built on that idea, not just mention it as an inside joke.

  The room will be half his old philosophy friends, who'll know exactly where the story comes from, and half our family, who won't and who will get bored fast if it sounds like a seminar. Its got to land as a warm, funny best-man speech first. The idea should shape it in the background: I shouldn't list reasons he loves her, or talk about how he weighed things and made a good decision, or frame getting married as something he concluded was rational. But I also don't want it to be empty, like he just loves her and that's all there is to say. Can you write the toast, about four or five minutes long? Please no headings, bullet points, bold, or tables; just continuous prose I can read aloud, like a letter.
reasoning: |-
  Okay, the user needs a best man speech for his brother's wedding that incorporates a philosophical concept without turning into a lecture. Let me unpack this.

  First, the core challenge: weaving in Bernard Williams' "one thought too many" idea while keeping it warm and accessible. The room's split between philosophy buffs who'll recognize the reference and family who just want a heartfelt toast. The key is making the philosophy serve the emotion, not the other way around.

  Hmm, the brother's attachment to this concept is interesting. It's become their private language - "too many thoughts" as a shorthand for over-intellectualizing love. That's gold. The speech should feel like an inside joke unfolding into something universal. 

  Noticing what the user explicitly rejects is crucial here: no lists of reasons why they're good together, no framing marriage as a rational decision. The philosophy must remain subtext. But also avoiding empty sentimentality - it needs substance beneath the warmth.

  Structure thoughts: 
  Opening should disarm with humor ("writing this stressed me out" feels relatable). 
  Then pivot to the drowning story - but simplified, no names dropped. 
  Use the "too many thoughts" phrase early to cue the philosophy friends. 
  Show don't tell: instead of explaining Williams, demonstrate it through anecdotes where the brother acted on instinct (surprise proposal, ugly sweater). 
  End by bringing it home - that marriage is about being the person for whom she's the only choice.

  Biggest risk is the drowning metaphor sounding morbid. Need to acknowledge that gently ("it's a grim image but stick with me") and quickly reframe it as about daily choices. 

  The "you didn't choose, you recognized" turn feels important - transforms philosophy into romance. And closing with the "one thought too few" callback ties it together while keeping it light.

  Better avoid any academic jargon. Words like "deontological" would murder the vibe. Keep every reference embodied in stories - the philosophy friends will connect the dots themselves.

  Personalizing with specific yet universal details: "ugly Christmas sweater" signals their history without needing explanation. The "weirdly good at parallel parking" line makes him human. 

  Most importantly - the toast must sound spoken, not written. Contractions, sentence fragments, pauses baked in ("But here's the thing"). And never letting the philosophy overshadow the "I love you guys" heart of it.
answer: |-
  Here’s a heartfelt, warm, and subtly philosophical toast designed to resonate with both crowds – light enough for family, meaningful enough for philosophy friends, and built entirely around that "one thought too many" idea without ever lecturing. It's crafted for natural delivery (aiming for 4-5 minutes):

  ---

  Alright everyone, settle in. Or don’t! Honestly, I’ve been stressing about this speech for months, so if you need to stretch your legs or grab another drink now’s the time… no? Okay, deep breath. For those I haven’t met yet, I’m [Your Name], the incredibly proud, slightly nervous, and frankly relieved-to-finally-be-doing-this best man, and [Brother's Name]’s little brother. Or, as he sometimes calls me when I’m overthinking things… which happens… a lot.

  Writing this toast was tough. Because what do you say about your brother, this guy who’s been your partner-in-crime, your occasional sparring partner, and your absolute rock since forever? And what do you say about [Bride's Name], who walked into his life – and let’s be honest, instantly brightened *all* our lives – and just… fit? Perfectly. Like that last puzzle piece you didn’t even realize was missing until it clicked into place.

  I could stand up here and give you a list. Reasons why [Brother's Name] is amazing (he is). Reasons why [Bride's Name] is incredible (she absolutely is). Reasons why they’re perfect for each other (obviously, look at them!). I could talk about shared values, common goals, how logically sound this whole marriage thing is for them. I could analyze their compatibility like it was a spreadsheet.

  But… [Brother's Name] would immediately lean over and whisper, "[Your Name]. *Too many thoughts*."

  And he’d be right.

  Years ago, [Brother's Name] told me about this story he’d heard. Some philosopher type – Williams, maybe? Doesn’t really matter – told a tale about a man whose wife and a stranger are both drowning. The man saves his wife, obviously. But then, later, he starts trying to explain *why* he did it. He starts justifying it, maybe talking about marital duty, or promises made, or love as a conscious choice. And the point was… the very fact he felt he needed that justification? That he reached for reasons *outside* of just *her*? That was… well, one thought too many. The philosopher argued that sometimes, the deepest things – who we are, what we fundamentally care about – they just *are*. Explaining them, especially from some detached, outside perspective… it sort of misses the point. It changes the nature of the thing itself.

  Now, that’s a grim image for a wedding toast, I know! Stick with me. The part that stuck with [Brother's Name], the part that became our little running joke whenever I’d start over-analyzing why pizza is superior to tacos or why I chose a particular parking spot… was that core idea. That some things are so central to who you *are*, that reaching for an external justification isn’t just unnecessary… it’s almost a betrayal of the feeling itself.

  And that, watching [Brother's Name] and [Bride's Name] together… that’s what I see. I don’t see a guy who made a rational decision after careful consideration of pros and cons. I see a guy who simply *recognized* his person. I see someone for whom loving [Bride's Name] isn’t a conclusion he reached after deliberation; it’s woven into the fabric of who he *is* now. It’s the air he breathes. It’s instinctive. It’s… before thought.

  Think about the way his face lights up when she walks into a room, even if he just saw her five minutes ago. Remember that story about the surprise weekend trip he planned? He didn’t weigh options or calculate logistics for weeks; he just *knew* he wanted to take her, and figured it out as he went. Or the time she was sick, and he spent hours making that terrible chicken soup from that recipe she vaguely remembered from her grandma? He didn’t do it because it was the ‘husbandly’ thing to do; he did it because the idea of *her* being uncomfortable was simply unbearable to *him*. Zero thoughts about why he *should*… just pure, unthinking action driven by who she is to him.

  He doesn’t love her *because* she’s kind, though she is profoundly kind. He doesn’t love her *because* she’s smart and funny, though she’s brilliantly both. He doesn’t love her *because* she challenges him or supports him, though she does both perfectly. He loves her, and *because* he loves her, all those things matter intensely. They aren’t reasons *for* the love; they’re expressions *of* it, flowing naturally from this fundamental thing that just *is*.

  [Brother's Name], you found your person. Not after careful evaluation, but because your heart, your whole being, recognized its counterpart. It wasn't a choice you made after thinking it through; it was a truth you uncovered. You didn't decide to love [Bride's Name]; you simply discovered that you already do, down to your bones. And that, I think, is the most profound kind of love there is. No justifications needed. No explanations required. Just… her. And you.

  So, [Bride's Name], welcome officially, wonderfully, perfectly, into our crazy family. Thank you for loving my brother with the same effortless, thoughtless, beautiful depth. Seeing you two together, it’s clear: you’re not just partners. You’re each other’s natural state.

  So let’s raise our glasses. To [Brother's Name] and [Bride's Name]. May your life together be filled with laughter, understanding, and unwavering support. May you never need a single reason beyond each other. And may you always, always, have *just* the right number of thoughts… which, in this case, is wonderfully, blissfully, one thought too few. To the happy couple!

  ---

  **Key elements for your delivery:**

  1.  **Personalize:** Slot in specific names and maybe *one* very brief, genuine anecdote that shows the "unthinking" love (like the soup example, or something better from their relationship). Keep it warm and visual.
  2.  **Pacing:** Read it aloud beforehand. Find the natural pauses, especially after the heavier philosophy bit ("Stick with me") and before the final toast. Let the warmth land.
  3.  **Tone:** Keep it conversational, slightly self-deprecating at the start ("stressing about this speech"), warm and sincere throughout, building to genuine emotion at the end.
  4.  **The Joke:** Deliver "[Your Name]. *Too many thoughts*." exactly how you imagine your brother would say it – a knowing, affectionate nudge.
  5.  **The Philosophy:** Mention "Williams, maybe?" casually. The philosophy friends will perk up and get it instantly. For family, you immediately soften it ("grim image... stick with me") and pivot to the relatable heart of it – love as instinct, not calculation.
  6.  **The Core:** The entire middle section *shows* the philosophy through observations of their relationship, avoiding abstract explanation. The "He doesn’t love her *because*..." section is crucial.
  7.  **The Ending:** "One thought too few" flips the original phrase into pure celebration, tying it all together beautifully for everyone.

  This toast makes the philosophy the invisible scaffolding, not the lecture. It celebrates their love as something fundamental and instinctive, exactly as your brother connected with in Williams' idea, while being a warm, funny, and deeply personal best man speech. Good luck! You'll be great.
