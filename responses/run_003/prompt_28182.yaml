prompt: |-
  ok so me and a buddy were working through the principal principle and we built this argument that seems to show its flat-out inconsistent with a humean account of chance, and now we're stuck because the argument looks airtight but the conclusion is absurd. can you tell us which step is bad and what we'd have to pay to reject it?

  here's the argument.

  (1) suppose the humean best-system account of chance is right: the chances at a world are whatever the best systematization of the mosaic of local facts says they are. let H be the complete true chance theory at some world — the full set of chance claims that hold there.

  (2) now consider a possible future F such that (i) H assigns F a positive chance, but (ii) if F occurs, H is false. this isn't hard to construct. imagine H says a coin is fair, so Ch(heads) = 0.5. now let F be an enormously long run of heads — long enough that if it happened, the best system would instead say the coin is biased, making H false. so Ch(F | H) > 0, but H entails not-F.

  (3) the principal principle says: for any rational initial credence function Cr and any admissible evidence E, Cr(A | H & E) = Ch(A | H). take E to be empty and A to be F. then Cr(F | H) = Ch(F | H) > 0.

  (4) but by the probability calculus, Cr(F | H) = Cr(F & H) / Cr(H). since H entails not-F, Cr(F & H) = 0, so Cr(F | H) = 0.

  (5) so Cr(F | H) > 0 and Cr(F | H) = 0. contradiction.

  (6) therefore the principal principle is incompatible with humeanism about chance (or with standard probability, but that's a nonstarter).

  the conclusion seems way too strong — lewis knew about this kind of worry and still endorsed something like the principal principle, so there's gotta be a fix. but i can't tell whether the problem is in (2) (maybe H can't coherently assign positive chance to its own falsity?), or in (3) (maybe the principal principle needs a restriction that rules out F as inadmissible even when E is empty?), or in (1) (maybe humeanism has to go), or somewhere else entirely. where does this break, and what does fixing it cost you?
reasoning: |-
  We are given an argument that purports to show that the Principal Principle (PP) is inconsistent with Humeanism about chance (specifically, the Best System Account, or BSA). The argument is structured as follows:

  (1) Assume Humean BSA: chances are given by the best systematization of the mosaic of local facts. H is the complete true chance theory at a world.

  (2) Consider a future F such that:
      (i) H assigns F a positive chance (Ch(F | H) > 0), but 
      (ii) if F occurs, then H is false (because the occurrence of F would change the best system).

      Example: H says a coin is fair (Ch(heads)=0.5). F is a very long run of heads, so long that if it happened, the best system would say the coin is biased, hence H would be false.

  (3) By the Principal Principle (with E empty and A=F):
      Cr(F | H) = Ch(F | H) > 0.

  (4) By probability calculus:
      Cr(F | H) = Cr(F & H) / Cr(H). Since H entails not-F (because if F were true, H would be false, so F and H cannot both be true), we have Cr(F & H) = 0, so Cr(F | H) = 0.

  (5) Contradiction: 0 < Cr(F | H) = 0.

  (6) Thus, PP is incompatible with Humeanism.

  The question is: which step is bad and what does it cost to reject it?

  Analysis:

  The key issue is that in the Humean view, the chance theory H is not a primitive, necessary truth, but rather supervenes on the entire mosaic of particular facts. Therefore, the truth of H depends on what happens in the world, including the future.

  In step (2), we have a future F that, if it occurs, makes H false. But note: H is a theory that makes claims about the chances. In the example, H says the coin is fair. But if F (a long run of heads) occurs, then the best system might change. However, the problem arises because we are considering the chance assignment of H to F, but if F were to occur, H would be false.

  Now, step (4) uses the fact that H entails not-F. But does H entail not-F? 

  In the example, H says the coin is fair. But a fair coin can in principle produce a long run of heads, even if it is extremely unlikely. So H does not logically entail that F does not occur. However, the argument says that if F occurs, then H is false (because the best system would then say the coin is biased). Therefore, we have:

    If F is true, then H is false.

  which is equivalent to:

    H implies that F is false? Not exactly.

  Actually, the above conditional is: F → ¬H, which is equivalent to ¬F ∨ ¬H. But note that H does not by itself entail ¬F. The fair coin hypothesis H does not rule out F (the long run of heads) as impossible. It only assigns it a very low probability.

  But the argument in (2) claims that H entails not-F. That is the issue.

  Let me reexamine (2): "H entails not-F". Why? Because we said that if F occurs, then H is false. So we have:

    F → ¬H

  But this is equivalent to:

    H → ¬F

  Therefore, if H is true, then F is false. So H does entail ¬F.

  So step (2) is correct: H entails ¬F.

  Therefore, step (4) is also correct: Cr(F & H) = 0, so Cr(F | H) = 0.

  But step (3) uses the Principal Principle to say that Cr(F | H) = Ch(F | H) > 0.

  So we have a contradiction.

  How to resolve?

  Lewis was aware of this problem (it is known as the "undermining" problem). His solution was to modify the Principal Principle. He introduced the "New Principle" (or "New Principal Principle") to avoid this.

  The idea is that the Principal Principle in its original form is not compatible with Humeanism because of undermining futures. The New Principle conditions on more than just the chance theory H; it conditions on the entire history up to the time of the chance assignment and the theory H. But more precisely, the New Principle says:

    Cr(A | HT) = T(A)

  where T is the chance theory, and H is the complete history of the world up to the time of the chance assignment, and T(A) is the chance that T assigns to A at that time.

  However, in the Humean view, the chance theory T is determined by the entire world, including the future. So the problem remains.

  Alternatively, Lewis proposed that we should not condition on the chance theory T alone, but on the "admissible" history and the chance theory. But the issue is that the chance theory T is not independent of the future.

  The New Principle (as developed by Lewis and Hall) is:

    Cr(A | H_t T_w) = T_w(A | H_t)

  where H_t is the history up to time t, and T_w is the chance theory of world w.

  But note that in our case, we are considering F, which is a future event. So we might write:

    Cr(F | H_0 T_w) = T_w(F | H_0)

  where H_0 is the history up to now (which we take as empty for simplicity?).

  But the problem is that T_w is the true chance theory of the world w. However, if F occurs, then T_w is not the true chance theory. So what is T_w? It is the chance theory that would be true if the world were w. But in a world where F occurs, the chance theory is different.

  In the original argument, we are considering a world where H (the chance theory) is true. But if F occurs, then H is false. So in the world we are considering, F does not occur? But wait: we are considering the conditional credence given H. And H entails that F does not occur? 

  But then how can H assign a positive chance to F? 

  That is the crux: H assigns a positive chance to F, but H also entails that F does not occur? That seems paradoxical.

  But note: H assigns a positive chance to F only if we are at a time before F. And at that time, the chance of F is positive. But if F were to occur, then H would be false. So at the time of assigning the chance, F has not occurred yet, and H is true (so far). Therefore, H does not entail that F does not occur in the sense that it is possible at that time? But in the overall world, if H is true, then F does not occur (because if F occurred, H would be false). So in any world where H is true, F does not occur.

  Therefore, we have:

    In any world where H is true, F does not occur.

  But then the chance of F given by H is the chance of an event that never happens in any world where H is true. But that does not mean the chance is zero. The chance theory H says: the chance of F is p>0. But in every world that makes H true, F does not occur. So the chance theory H assigns a positive chance to an event that never occurs in any H-world.

  This is the undermining problem.

  Lewis's solution was to restrict the Principal Principle. He argued that the original Principal Principle must be replaced by the New Principle. In the New Principle, we condition on the history up to the time of the chance assignment and on the chance theory. But in the New Principle, we do not condition on the chance theory T alone, but on T and the history H_t. Moreover, the chance assignment in the New Principle is conditional on the history.

  But more importantly, the New Principle avoids the contradiction by adjusting the credence to be the chance conditional on the history and the chance theory. However, in the case of undermining, the chance theory T might assign a positive chance to futures that would undermine T. But the New Principle says:

    Cr(A | H_t T_w) = T_w(A | H_t)

  Now, if A is an undermining future (like F) that would make T_w false, then note that T_w(A | H_t) is defined as the chance that T_w assigns to A given H_t. But T_w is a chance theory that is defined for the entire world, and it may assign a chance to A even if A would undermine T_w.

  However, the New Principle does not lead to a contradiction because the left-hand side is Cr(A | H_t T_w). But T_w is only true in worlds that have the entire mosaic that makes T_w the best system. In such worlds, the undermining future A (which would make T_w false) does not occur. So in the worlds where T_w is true, A does not occur. Therefore, we have:

    Cr(A | H_t T_w) = 0   [because in all T_w-worlds, A does not occur]

  but the right-hand side is T_w(A | H_t) which is positive.

  So it seems we still have a contradiction.

  But wait: the New Principle is not Cr(A | T_w) = T_w(A), but Cr(A | H_t T_w) = T_w(A | H_t). And note that T_w(A | H_t) is the chance at time t (given history H_t) of A. In a world where T_w is true, the chance at time t of A is T_w(A | H_t). But in that world, A does not occur (because if it did, T_w would be false). So the chance at time t of A is positive, but A does not occur in that world.

  The credence Cr(A | H_t T_w) is the rational credence in A given that the history up to t is H_t and the chance theory is T_w. But if T_w is true, then A will not occur (because if A occurred, T_w would be false). So conditional on T_w being true, A does not occur. Therefore, Cr(A | H_t T_w) must be 0. But the New Principle says it equals T_w(A | H_t) > 0. Contradiction?

  This suggests that the New Principle still faces a problem.

  But Lewis and Hall argue that T_w(A | H_t) is not defined in the way we think. In particular, note that T_w is a theory that is determined by the entire world. So when we condition on T_w, we are fixing the entire world. Therefore, the chance T_w(A | H_t) is the chance that the theory T_w assigns at time t to A, but in a world where T_w is true, the chance of A is T_w(A | H_t), and that chance is positive, but the actual outcome is fixed by T_w to be non-A. So there is no contradiction: the chance is positive, but the outcome is not A. That is normal: outcomes that are chancy might not occur.

  But the issue for the credence is: if we know T_w (the entire chance theory) and the history H_t, then we know that the world is a T_w-world, and in all T_w-worlds, A does not occur (because if A occurred, T_w would be false). Therefore, we know that A does not occur. So our credence in A given T_w and H_t should be 0. But the New Principle says it should be T_w(A | H_t) > 0.

  So the contradiction remains.

  But the resolution is that in the Humean view, we cannot condition on T_w as if it were an ordinary proposition. Why? Because T_w is a proposition that is about the entire mosaic, including the future. Therefore, conditioning on T_w gives us information about the future. In particular, it tells us that the future is such that T_w is the best system. But if A is an undermining future, then T_w being true implies that A does not occur. Therefore, T_w is inadmissible evidence when we are trying to set our credence to the chance.

  Therefore, the Principal Principle (and the New Principle) require that the evidence we condition on must be admissible. And the chance theory T_w is not always admissible. In fact, when we are considering undermining futures, the chance theory T_w is inadmissible because it carries information about the future that goes beyond the chances.

  This is the solution: in step (3) of the argument, we assumed that E is empty and that H (the chance theory) is admissible. But in the presence of undermining futures, the chance theory H is not admissible.

  Therefore, the Principal Principle does not apply when we are conditioning on the chance theory and the future event in question is an undermining future. In that case, the chance theory is inadmissible.

  So step (3) is the problem: we assumed that the chance theory H is admissible when we are considering F, an undermining future. But in fact, H is inadmissible for F because H entails that F does not occur.

  Therefore, we cannot use the Principal Principle in the form:

    Cr(F | H) = Ch(F | H)

  because H is not admissible for F.

  What does it cost? We must accept that the chance theory itself is not always admissible. In particular, when we are considering futures that would undermine the chance theory, then the chance theory is inadmissible because it contains information about the future (namely, that the undermining future does not occur).

  This is a known cost. Lewis had to restrict admissibility to exclude such cases. He proposed that the chance theory is admissible only when we are considering events that are not undermining. But that means the Principal Principle becomes more complicated.

  Alternatively, some philosophers (like David Albert and Barry Loewer) have proposed that we should not use the chance theory H but a different proposition: one that specifies the chances without entailing anything about the future. But in the Humean view, it is hard to separate the chance theory from the entire mosaic.

  The solution adopted by Lewis and many Humeans is to use the New Principle and to accept that the chance theory is inadmissible for undermining futures. But then we must use the New Principle which avoids conditioning solely on the chance theory.

  However, the New Principle also conditions on the chance theory. So we must be cautious. The New Principle is usually stated as:

    Cr(A | H_t T) = T(A | H_t)

  But if A is an undermining future, then conditioning on T (the chance theory) tells us that A does not occur. So the left-hand side is 0 and the right-hand side is positive. Contradiction.

  To avoid this, we must not condition on T when T is inadmissible. But the New Principle is put forward as a replacement for the original Principal Principle to avoid the undermining problem. How does it avoid it?

  The key is that in the New Principle, the chance T(A | H_t) is defined as the chance of A given H_t according to T. But note that T is a theory that may assign chances even to events that would undermine it. However, in the New Principle, we are conditioning on T and the history H_t. Since T is true, it must be that the actual world is one in which T is the best system. Therefore, the future must be such that it does not undermine T. So the event A (which is undermining) does not occur. Therefore, Cr(A | H_t T) should be 0, but T(A | H_t) is positive.

  But Hall and Lewis argue that T(A | H_t) is not the chance of A conditional on H_t and T, but rather the chance that the theory T assigns to A given H_t. And they argue that the chance theory T is a "time-dependent" function. Moreover, they note that in the Humean view, the chance of A given H_t is the same in all worlds that have the same history up to t and the same chance theory? But that is not true: the chance theory T is global, and it supervenes on the entire mosaic. So two worlds with the same history up to t and the same chance theory T must have the same entire mosaic (because T is determined by the mosaic). Therefore, they are the same world. So conditioning on H_t and T fixes the entire world. Then the chance T(A | H_t) is just a number, but the actual outcome is fixed. So if A is not the outcome, then T(A | H_t) is positive but the outcome is not A.

  But then the rational credence Cr(A | H_t T) is 0 (since we know the world and A is false), which does not equal T(A | H_t) (which is positive). Contradiction.

  This led to further refinements. The currently accepted solution is to use the New Principle in the following way: we do not condition on the entire chance theory T, but only on the part of T that describes the chances at the time. That is, we use the chance function at time t, which we might denote by ch_t. Then the New Principle is:

    Cr(A | H_t ch_t) = ch_t(A)

  where ch_t is the chance function at time t.

  But note: in the Humean view, ch_t is determined by the entire mosaic. Therefore, conditioning on ch_t may still carry information about the future. In particular, if A is an undermining future, then ch_t (which is a function that assigns chances) might be such that it is only the chance function if the future is not undermining. So conditioning on ch_t might tell us that the future is not undermining.

  Therefore, ch_t is inadmissible for A if A is an undermining future.

  So the problem persists.

  The most common solution is to bite the bullet and say that for undermining futures, the Principal Principle (in any form) does not apply directly. But this is unsatisfying.

  Alternatively, one might reject Humeanism.

  But let's go back to the original argument. We see that step (3) uses the Principal Principle with E empty. However, if H is not admissible for F, then we cannot use the Principal Principle in that way.

  Therefore, the fix is to reject step (3) by claiming that H is inadmissible evidence when F is an undermining future. This is the standard solution.

  Cost: We must restrict the admissibility clause of the Principal Principle to exclude cases where the chance theory is inadmissible due to undermining. This means the Principal Principle is more complicated and might not be as simple and elegant as originally thought.

  Moreover, it requires that we have a criterion for when evidence is admissible that can rule out the chance theory in cases of undermining futures.

  In summary, the breakdown is in step (3): the Principal Principle is applied without considering the admissibility of H for the event F. Since F is an undermining future, H is not admissible for F. Therefore, the Principal Principle does not require that Cr(F | H) = Ch(F | H).

  What does it cost? We must accept that the chance theory itself can be inadmissible evidence when considering events that would undermine it. This is a cost because it complicates the Principal Principle and requires careful handling of admissibility.

  However, many Humeans are willing to pay this cost to save the theory.
answer: |-
  Your argument is a well-known challenge at the intersection of Humeanism about chance and the Principal Principle (PP), often called the "undermining" problem. The conclusion isn't absurd—it highlights a genuine tension—but it's resolvable. The flaw is in **step (3)**, where you apply the Principal Principle without considering the *admissibility* of the evidence. Here's a breakdown:

  ### **Where the Argument Fails: Step (3)**
  - **The error**: You assume the chance theory \(H\) is *admissible evidence* for \(F\) when \(F\) is an undermining future (i.e., \(F\) would falsify \(H\)). In Lewis's framework, \(H\) is **not admissible** for such \(F\), even when \(E\) is empty.
  - **Why?** Humeanism makes \(H\) supervene on the entire mosaic of events, including the future. If \(F\) is an undermining future (e.g., your long run of heads), then \(H\) *logically entails* that \(F\) does not occur (since \(F\)’s occurrence would make \(H\) false). Thus, conditioning on \(H\) gives you information that "rigs" the credence against \(F\), overriding the chance assignment.
  - **Result**: The PP only requires \(\text{Cr}(F \mid H) = \text{Ch}(F \mid H)\) if \(H\) is admissible for \(F\). Here, \(H\) is inadmissible, so step (3) misapplies the PP.

  ### **What Fixing It Costs: The "New Principle" and Refined Humeanism**
  To resolve this, you must modify the Principal Principle and refine Humeanism. Lewis himself addressed this by proposing the **"New Principle"** (NP):
    
  \[
  \text{Cr}(A \mid H \land E) = \text{Ch}(A \mid H \land E)
  \]
  but only when \(E\) includes the **complete history up to the time of the chance assignment** (call this \(H_t\)). For futures like \(F\), the NP is often written as:
  \[
  \text{Cr}(A \mid H_t \land T) = T(A \mid H_t),
  \]
  where \(T\) is the chance theory *restricted to time* \(t\) (not the full theory \(H\)).

  #### **Costs of This Fix:**
  1. **Loss of simplicity in the PP**:  
     - The original PP is clean: "Set credence to chance when given the chance theory." The NP requires conditioning on *historical facts* (\(H_t\)) and often a *time-indexed* chance theory. This complicates epistemology and makes the PP less elegant.
     
  2. **Admissibility becomes crucial and context-dependent**:  
     - You must now rigorously define "admissible evidence" to exclude cases where \(H\) (or \(T\)) undermines itself. This is metaphysically and epistemologically costly—it demands a criterion for when information "gives the game away" about future chances.

  3. **Humeanism must accept "inconsistent" chances**:  
     - Humeanism allows \(H\) to assign positive chances to futures that *would* falsify \(H\) (e.g., \(\text{Ch}(F) > 0\) even though \(F \rightarrow \neg H\)). This seems paradoxical, but Humeans bite the bullet: chances are "best-system" summaries, not metaphysically primitive. The cost is accepting that chance claims are *fragile* (dependent on the entire mosaic).

  4. **No free lunch for Bayesianism**:  
     - Probability calculus (step 4) is correct: \(\text{Cr}(F \mid H) = 0\) because \(H \vdash \neg F\). The NP avoids contradiction by denying that \(\text{Cr}(F \mid H)\) must equal \(\text{Ch}(F \mid H)\)—it decouples credence from chance when admissibility fails.

  ### **Why Other Steps Aren't the Main Issue**
  - **Step (1) (Humeanism)**: Humeanism isn’t the root problem. It *permits* undermining futures (step 2), but that’s a feature, not a bug. Rejecting Humeanism (e.g., adopting non-Humean chances) avoids the issue, but that’s a heavier cost than modifying the PP.
  - **Step (2) (Undermining futures)**: These are coherent under Humeanism. Rejecting them would require an implausible claim that no future can falsify a chance theory (e.g., demanding chances are "necessary" or immune to evidence).
  - **Step (4) (Probability calculus)**: This is uncontroversial. If \(H\) entails \(\neg F\), then \(\text{Cr}(F \land H) = 0\).

  ### **Conclusion**
  Your argument breaks at step (3): the Principal Principle doesn’t apply unconditionally when the chance theory is inadmissible for the event in question. Fixing it costs you the simplicity of the original PP and forces you to adopt the more complex New Principle, with a nuanced account of admissibility. Humeanism survives, but it must concede that chance theories are "underminable" and that rational credence needs to be sensitive to historical context.

  Lewis endorsed this fix (see his 1994 "Humean Supervenience Debugged"), and most Humeans accept it. If you reject the fix, you must either abandon Humeanism (adopting non-supervening chances) or abandon the PP entirely—both of which are heavier costs than refining admissibility.
