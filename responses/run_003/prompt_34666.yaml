  I'm applying for a small internal grant to write a term paper, and the application requires a one-page description of the project. The topic I keep returning to is luck egalitarianism and the harshness objection: the charge that the view licenses leaving people to suffer the consequences of their own imprudent choices. I have been following this debate on the forum for a while, and it increasingly looks as though the two sides are answering different questions when they call a person responsible. One question is whether a bad outcome is attributable to the person's agency in the sense relevant to moral appraisal; the other is whether the person should be made to bear the resulting costs, in the sense relevant to what they are owed by others. My suspicion is that a luck egalitarian can concede the first while resisting the second, and that a good deal of the standoff comes from not keeping the two questions apart. Turn this into a proposal that states the question precisely enough to have a determinate answer, explains why the existing positions leave it open, says why this framing can make progress where the existing debate has stalled rather than simply adding another round of cases, lays out what I would actually do week by week over the semester, says what a successful result would look like, and says what would count as the project failing. Do not include a bibliography or citations; I will supply those myself.
