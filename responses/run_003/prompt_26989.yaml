  We are going to translate the idea of "evidential cooperation in large worlds" (ECLW) and "acausal trade" into the language of mechanism design and game theory.

  The core idea in ECLW is that two agents, who cannot causally influence each other (they are in separate "worlds" or so far apart that no causal signal can pass), might still choose to cooperate. The reasoning is that their decision algorithms are similar (or identical) and therefore correlated. By observing their own decision, an agent gains evidence about what the other agent is likely to do. In particular, if they both reason that "if I defect, that is evidence that the other is also defecting", then they might both choose to cooperate to avoid the mutual defection outcome.

