  Now, when Alice is about to choose, she does not know the outcome. But she is going to choose an action. How do we model her decision? She must choose an action without knowing the state? But the state is the joint action? That doesn't work because the state is determined after the actions.

  Alternatively, we can think of the prior as a belief about how the other player will act, but then the agent's own action is chosen and the belief is updated.

  This is not a standard game because the agent's own action is used to update the belief about the other's action.

  In a standard Bayesian game, the agent conditions on their type and the signal to form a belief about the state and the other's action. They do not condition on their own action because they haven't chosen it yet.

  So we have a modeling problem.

  **Step 4: Using a correlation device that doesn't cause but correlates**

  We can introduce a public signal that is observed by both players. The signal can be a random variable that takes two values: "coordinate on C" or "coordinate on D", each with probability 0.5. Then, if the players both follow the signal, we get a correlated equilibrium where they both play C or both play D. And in this equilibrium, they both get an expected payoff of (R+P)/2, which is better than the Nash equilibrium of always defecting (which gives P).

  But in this setup, the players are causally responding to the signal. In ECLW, there is no signal. The correlation is entirely from the logical connection.

  So the device is not physical; it is the common knowledge of symmetry.

  **Step 5: The residue report**

  Now, let's break down what we have.

  **Mapping to standard concepts:**

  1. **Correlated Equilibrium (CE):** The ECLW setup can be seen as a CE where the correlation device is the common knowledge of the symmetry and the identical decision algorithms. The device "sends" a recommended action that is the same for both players. The players, knowing that the other is receiving the same recommendation (because they are identical), have an incentive to follow it. This is a CE of the PD where both players play the same action. But note: in a standard CE, the device is exogenous. In ECLW, the device is endogenous to the agents' decision processes.

     However, in the standard CE, the recommendation is observed and then the player best-responds given their information. In ECLW, the agent does not observe a recommendation; they generate it by their own reasoning. So the mapping is not perfect.

  2. **Common Priors:** The common prior in ECLW is the belief that the two agents are identical and hence will take the same action. This common prior is what generates the conditional probabilities that make cooperation rational under EDT. So the common prior is central.

  3. **Types:** We can model the agents as having a type that is their decision algorithm. But since the algorithm is the same, the types are perfectly correlated. However, the agent does not know the outcome of the algorithm (their own action) until they decide, so they must reason about it.

  **Stretches and fudges:**

  - **Conditioning on one's own action:** In standard game theory, when a player chooses an action, they do not condition on that action to form beliefs because they haven't taken it yet. They form beliefs based on their information and then choose. In ECLW, the agent is asked to consider the conditional probability of the other's action given the action they are about to take. This is a non-standard move. We can try to model it by having the agent consider two possible actions and compute the expected utility for each by conditioning on that action. This is more like evidential decision theory, which is not the standard in game theory (where causal decision theory is the norm).

  - **The correlation device:** In CE, the device is exogenous and the players condition on the signal. In ECLW, the correlation comes from the endogenous symmetry. We can say that the players know that the device (the symmetry) will lead to the same action for both, so they can simulate the device by their own reasoning. But this is a stretch.

  **No counterpart:**

  - **Acausality:** The idea that the agents are in separate worlds and their actions do not causally affect each other is captured in the game by the fact that the payoff matrix is fixed and the actions are simultaneous. However, the standard solution concept (Nash) does not use the conditional probabilities that EDT uses. So the acausal aspect is not new, but the decision rule (EDT) is not standard in game theory.

  - **Large worlds:** The "large worlds" idea is that the agents are in a multiverse or in situations that are symmetric but isolated. In game theory, we typically assume that the players are in the same world and can causally interact. But we can model non-interacting players by a game with no causal links, which we do. However, the solution concept that uses EDT is not standard.

  **Conclusion on the gap:**

  There is a genuine conceptual gap. The gap is not in the setup (which can be modeled as a Bayesian game with a common prior that enforces perfect correlation) but in the solution concept. Standard game theory uses causal reasoning (CDT), while ECLW uses evidential reasoning (EDT). 

  In the standard framework, if we model the game as having a common prior that the actions are perfectly correlated, then the players would still use CDT: they would realize that their action does not cause the other's action, so they would defect. But in EDT, they condition on their own action and hence cooperate.

  So the gap is in the decision theory, not in the game-theoretic setup per se.

  Therefore, the residue is that the ECLW argument requires a different decision theory (EDT) that is not standard in game theory. The standard framework (with Nash, correlated equilibrium, etc.) is based on CDT. 

