  ### 1. Formal Setup

  Consider an agent who knows a biased coin will be tossed three times. The agent has compelling evidence (e.g., from a trustworthy physicist who measured the coin’s center of mass) that the **expected number of heads is exactly 2**. The agent adopts credences over the possible outcomes: 0, 1, 2, or 3 heads. Let \(p_i\) denote the true probability of \(i\) heads, and \(c_i\) the agent’s credence in \(i\) heads. The evidence imposes two constraints:  
  1. **Normalization**: \(c_0 + c_1 + c_2 + c_3 = 1\)  
  2. **Expectation of heads**: \(0 \cdot c_0 + 1 \cdot c_1 + 2 \cdot c_2 + 3 \cdot c_3 = 2\)  

  Rearranging, substitute:  
  - \(c_0 = -1 + c_2 + 2c_3\)  
  - \(c_1 = 2 - 2c_2 - 3c_3\)  

  With non-negativity constraints:  
  - \(c_0 \geq 0\) \(\implies\) \(c_2 + 2c_3 \geq 1\)  
  - \(c_1 \geq 0\) \(\implies\) \(2c_2 + 3c_3 \leq 2\)  
  - \(c_2 \geq 0\), \(c_3 \geq 0\)  

  This defines a convex set \(\mathcal{P}\) of probability functions compatible with the evidence. \(\mathcal{P}\) is a triangle in \((c_2, c_3)\)-space with vertices:  
  - \(V_1 = (c_0, c_1, c_2, c_3) = (0, 0, 1, 0)\)  
  - \(V_2 = (0, 0.5, 0, 0.5)\)  
  - \(V_3 = (\frac{1}{3}, 0, 0, \frac{2}{3})\)  

  The agent must choose a credence function \(\mathbf{c} = (c_0, c_1, c_2, c_3) \in \mathcal{P}\) to maximize **minimum expected accuracy** over \(\mathcal{P}\), per the *maximin* decision rule for ambiguity. Accuracy is measured by a scoring rule \(S(\mathbf{c}, i)\) for outcome \(i\) heads.

  ---

  ### 2. The Brier-Score Recommendation  
  The Brier score is \(S_{\text{Brier}}(\mathbf{c}, i) = 1 - 2c_i + \sum_{k=0}^3 c_k^2\). Expected Brier accuracy for \(\mathbf{c}\) relative to a true distribution \(\mathbf{p}\) is:  
  \[
  \mathbb{E}_{\mathbf{p}}[S_{\text{Brier}}] = -1 + 2(\mathbf{p} \cdot \mathbf{c}) - \|\mathbf{c}\|^2
  \]  
  The minimax problem is:  
  \[
  \max_{\mathbf{c} \in \mathcal{P}} \min_{\mathbf{p} \in \mathcal{P}} \mathbb{E}_{\mathbf{p}}[S_{\text{Brier}}] = \max_{\mathbf{c} \in \mathcal{P}} \min_{\mathbf{p} \in \mathcal{P}} (\mathbf{p} \cdot \mathbf{c})
  \]  
  since \(\|\mathbf{c}\|^2\) is constant in \(\mathbf{p}\). The minimum over \(\mathcal{P}\) occurs at an extreme point. Substituting \(\mathbf{c}\) in terms of \(c_2, c_3\) and solving:  
  \[
  \min_{\mathbf{p} \in \{V_1, V_2, V_3\}} (\mathbf{p} \cdot \mathbf{c}) = \min \left\{ c_2, \ 0.5c_1 + 0.5c_3, \ \tfrac{1}{3}c_0 + \tfrac{2}{3}c_3 \right\}
  \]  
  Maximizing this minimum subject to \(\mathbf{c} \in \mathcal{P}\) yields:  
  \[
  \mathbf{c}_{\text{Brier}} = (0.1, 0.2, 0.3, 0.4)
  \]  
  **Interpretation**: The agent assigns credence 0.1 to 0 heads, 0.2 to 1 head, 0.3 to 2 heads, and 0.4 to 3 heads. This distribution balances the worst-case expected dot product across \(\mathcal{P}\)’s vertices, avoiding extreme penalties.

  ---

  ### 3. The Log-Score Recommendation  
  The log score is \(S_{\text{log}}(\mathbf{c}, i) = \ln c_i\). Expected log accuracy for \(\mathbf{c}\) relative to \(\mathbf{p}\) is:  
  \[
  \mathbb{E}_{\mathbf{p}}[S_{\text{log}}] = \sum_{i=0}^3 p_i \ln c_i
  \]  
  The minimax problem:  
  \[
  \max_{\mathbf{c} \in \mathcal{P}} \min_{\mathbf{p} \in \mathcal{P}} \mathbb{E}_{\mathbf{p}}[S_{\text{log}}]
  \]  
  The minimum over \(\mathbf{p}\) (linear in \(\mathbf{p}\)) occurs at a vertex. Substituting:  
  \[
  \min_{\mathbf{p} \in \{V_1, V_2, V_3\}} \mathbb{E}_{\mathbf{p}}[S_{\text{log}}] = \min \left\{ \ln c_2, \ \ln \sqrt{c_1 c_3}, \ \ln (c_0^{1/3} c_3^{2/3}) \right\}
  \]  
  Since \(\ln\) is increasing, maximizing the minimum is equivalent to maximizing:  
  \[
  \min \left\{ c_2, \ \sqrt{c_1 c_3}, \ c_0^{1/3} c_3^{2/3} \right\}
  \]  
  The solution is the **maximum-entropy distribution** in \(\mathcal{P}\) (known to be minimax-optimal for log score):  
  \[
  \mathbf{c}_{\text{log}} \approx (0.12, 0.18, 0.28, 0.42)
  \]  
  **Interpretation**: The agent assigns credence 0.12 to 0 heads, 0.18 to 1 head, 0.28 to 2 heads, and 0.42 to 3 heads. This is the "flattest" distribution respecting the expectation constraint.  
  **Divergence step**: Unlike Brier, log score depends critically on the *ratios* of credences (via \(\ln c_i\)), making it sensitive to small values. This shifts weight away from \(c_2\) (0.28 vs. 0.3) toward \(c_3\) (0.42 vs. 0.4) to avoid severe penalties when low-credence outcomes occur.

  ---

  ### 4. Diagnosis  
  The divergence arises because **different scoring rules weigh errors differently** under ambiguity. The Brier score (quadratic) penalizes large inaccuracies in high-credence events, while the log score (logarithmic) disproportionately penalizes assigning low credence to true events. When evidence only *partially* constrains probabilities, these sensitivities lead to different maximin optima. If the evidence uniquely determined a probability function (e.g., the coin’s exact bias), any strictly proper scoring rule would pick that function as the unique optimum, and the divergence would disappear—properness ensures agreement when the truth is sharp.

  ---

  ### 5. What an Accuracy-First Epistemologist Should Do  
  To avoid scoring-rule relativity, one could:  
  - **Argue for a privileged scoring rule** (e.g., log score for ties to information theory, or Brier for Euclidean geometry), but this lacks independent justification.  
  - **Impose additional constraints** (e.g., maximize entropy as a default), but this is ad hoc.  
  - **Accept benign relativity**: Rationality requires accuracy maximization *given a scoring rule*, not a unique credence. Different rules reflect different epistemic values (e.g., robustness vs. informativity), and both recommendations here are coherent and non-dominated.  

  The most defensible option is to **accept relativity as benign**: Both distributions satisfy the evidence, and neither is accuracy-dominated within its rule. The vulnerability is that it permits rational disagreement under identical evidence, *seemingly* conflicting with evidence-based objectivity. However, the core accuracy-first insight—that beliefs aim at truth—is preserved, as both rules agree when evidence is decisive.
