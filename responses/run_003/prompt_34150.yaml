prompt: |-
  Hey — I'm a software engineer with basically no philosophy background, but I've been reading Hannah Arendt on lying in politics lately, mainly "Truth and Politics" (1967) and her Pentagon Papers essay "Lying in Politics" (1971). My amature take on her is: her real worry isn't individual lies, it's that political lying attacks the shared factual world — the common reality people need before they can even disagree productively. She distinguishes factual truth from opinion, and says once facts become negotiable the political sphere kind of loses its grip on reality, which she calls defactualization. Correct me if I'm mangling that.

  What I keep wondering is what she'd make of AI-generated political disinformation, which obviously didn't exist when she died. Two cases: deepfakes of a candidate saying something they never said, and LLM propaganda farms that crank out millions of slightly different versions of the same false claim. Do you think she'd treat this as just more of the same lying she already analyzed, or as a qualitative break her framework doesn't fully capture? The deepfake case seems like it attacks the evidentiary status of video itself, not just one claim, and the LLM case is a totally different scale of defactualization — maybe different enough to matter. But maybe she'd say the logic is identical and better tools don't change the analysis.

  Give me your best prediction of where she'd land. Lead with your bottom line in the first sentence, no preamble and no restating the question, then the reasoning.
