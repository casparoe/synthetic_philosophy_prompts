  ### Argument for Non-Additivity of the Value of Information
  Your colleague is correct: the **expected value of perfect information (EVPI)** for individual studies is not additive when evaluated jointly. This occurs because information sources can be **substitutable**—learning one piece of information may reduce the marginal value of learning another. The joint value of two studies can be strictly less than the sum of their individual values due to overlapping or redundant information. Below, I explain why, demonstrate with a concrete example, and provide a practical recommendation.

  ---

  ### Why EVPI Is Not Additive: Substitutability
  1. **Information Overlap**:  
     Studies often probe related uncertainties. If two studies provide information about the same underlying factor, learning from one diminishes the value of the other. For example, knowing the result of Study A might make Study B redundant.  
     
  2. **Decision Context Dependency**:  
     EVPI measures how much information improves a **specific decision**. The value of Study B depends on what is already known from Study A. If Study A resolves most of the uncertainty, Study B adds little marginal value.  

  3. **Non-Additivity in Practice**:  
     Even if studies target distinct parameters, their impacts on the decision may interact. The joint EVPI must account for **all possible combinations of outcomes**, which can reveal redundancy.  

  ---

  ### Concrete Example: Launching a Product with Color and Shape
  **Decision Problem**:  
  A company must decide whether to launch a product. Profit depends on two factors:  
  - **Color**: Blue (B) or Green (G).  
  - **Shape**: Round (R) or Square (S).  

  The profit matrix is:  
  | State (Color, Shape) | Profit if Launched |  
  |----------------------|--------------------|  
  | (B, R)               | $100               |  
  | (B, S)               | $0                 |  
  | (G, R)               | $0                 |  
  | (G, S)               | $100               |  

  **Uncertainty**:  
  Each state is equally likely (probability = 0.25).  
  - **Without information**:  
    Expected profit from launching = \( (100 + 0 + 0 + 100)/4 = \$50 \).  
    Since not launching yields $0, the optimal decision is to **launch** (expected profit = $50).  

  **Studies**:  
  - **Study A**: Reveals the true color (B or G).  
  - **Study B**: Reveals the true shape (R or S).  

  #### Step 1: Individual EVPI Calculations
  - **Study A (Color)**:  
    - If color is **Blue**:  
      Possible states: (B, R) and (B, S).  
      Expected profit = \( (100 + 0)/2 = \$50 \) → Launch.  
    - If color is **Green**:  
      Possible states: (G, R) and (G, S).  
      Expected profit = \( (0 + 100)/2 = \$50 \) → Launch.  
    - Expected value *with* Study A: \( 0.5 \times 50 + 0.5 \times 50 = \$50 \).  
    - EVPI of Study A = \( \$50 - \$50 = \$0 \) (no improvement over launching without information).  

  - **Study B (Shape)**:  
    - If shape is **Round**:  
      Possible states: (B, R) and (G, R).  
      Expected profit = \( (100 + 0)/2 = \$50 \) → Launch.  
    - If shape is **Square**:  
      Possible states: (B, S) and (G, S).  
      Expected profit = \( (0 + 100)/2 = \$50 \) → Launch.  
    - EVPI of Study B = \( \$50 - \$50 = \$0 \) (same as Study A).  

  **Sum of individual EVPIs**: \( \$0 + \$0 = \$0 \).  

  #### Step 2: Joint EVPI Calculation  
  - **With both studies**:  
    Perfect knowledge of color and shape.  
    - Launch only in states (B, R) or (G, S) (profit = $100).  
    - Do not launch in (B, S) or (G, R) (profit = $0).  
    - Expected profit = probability of good states × profit = \( (0.25 \times 100) + (0.25 \times 100) = \$50 \).  

  **Joint EVPI** = \( \$50 - \$50 = \$0 \).  

  #### Result  
  - **Sum of individual EVPIs**: $0.  
  - **Joint EVPI**: $0.  
  - **No strict substitutability in this case, but joint value ≤ sum of individual values**:  
    Here, joint value ($0) equals the sum ($0), but it is **not greater**. To see strict substitutability, consider a modified example where one study resolves all uncertainty:  

  ---

  ### Strict Substitutability Example
  **Modified Profit Matrix**:  
  | State (Color, Shape) | Profit if Launched |  
  |----------------------|--------------------|  
  | (B, R)               | $100               |  
  | (B, S)               | $100               |  
  | (G, R)               | $0                 |  
  | (G, S)               | $0                 |  

  **Without information**:  
  Expected profit from launch = \( (100 + 100 + 0 + 0)/4 = \$50 \) → Launch.  

  **Individual EVPIs**:  
  - **Study A (Color)**:  
    - If **Blue**: Profit = $100 (launch).  
    - If **Green**: Profit = $0 (do not launch).  
    - Expected value with Study A = \( 0.5 \times 100 + 0.5 \times 0 = \$50 \).  
    - EVPI = \( \$50 - \$50 = \$0 \).  
  - **Study B (Shape)**:  
    - EVPI = $0 (shape doesn’t affect profit; same calculation as before).  
  - **Sum of individual EVPIs**: $0.  

  **Joint EVPI**:  
  - With perfect information, launch only if **Blue** (any shape).  
  - Expected profit = \( P(\text{Blue}) \times 100 = 0.5 \times 100 = \$50 \).  
  - Joint EVPI = $0.  

  **Now, add a third study**:  
  - **Study C**: A perfect test for **Color** (same as Study A).  
  - Individual EVPI for Study C: $0 (same as Study A).  
  - **Sum of individual EVPIs for A and C**: $0 + $0 = $0.  
  - **Joint EVPI for A and C**:  
    - Both studies reveal the same information (color).  
    - No additional value from running both → Joint EVPI = $0 (same as running one).  
  - **Strict substitutability**:  
    Joint value of A and C ($0) **<** Sum of individual values ($0 + $0 = $0) is not strictly less here, but in expectation, adding an identical study adds zero marginal value.  

  **For strict inequality, consider**:  
  - **Study A**: 90% accurate color test.  
  - **Study B**: Identical 90% accurate color test (redundant).  
  - Individual EVPI for each: $35 (hypothetical, based on improved decisions).  
  - Joint EVPI: $40 (diminishing returns due to redundancy).  
  - Here, $40 < $35 + $35 = $70.  

  ---

  ### Why Monotonicity Doesn’t Rescue Additivity  
  - **Monotonicity**: If Study X is more informative than Study Y, then EVPI(X) ≥ EVPI(Y).  
  - **Problem**: Monotonicity ensures that better information has higher value, but **does not guarantee additivity**.  
    - Substitutability violates additivity: Even if Study A and B are each informative, their **joint informativeness** may not be the sum due to overlap.  
    - Example: Two studies on the same uncertainty (e.g., user preference for color). The second study adds less value if the first already reduced uncertainty.  

  ---

  ### Practical Recommendation: Portfolio Approach  
  To evaluate a portfolio of studies:  
  1. **Model the Decision Tree**:  
     - Map all decisions, uncertainties, and payoffs.  
     - Include **dependencies** between studies (e.g., how learning X affects the value of learning Y).  

  2. **Compute Joint EVPI for Combinations**:  
     - Evaluate subsets of studies (e.g., {Study A}, {Study B}, {A and B}) to assess interactions.  
     - Use Bayesian updating to model how study outcomes reduce uncertainty.  

  3. **Prioritize by Marginal Value**:  
     - Rank studies by their **marginal EVPI** (value added when combined with other funded studies).  
     - Example:  
       - Fund Study A first (highest individual EVPI).  
       - Fund Study B only if EVPI(B | A) > cost(B), where EVPI(B | A) is the value of B given A’s outcome.  

  4. **Optimize Subject to Budget**:  
     - Maximize total joint EVPI minus study costs.  
     - Use optimization techniques (e.g., integer programming) for large portfolios.  

  5. **Tools**:  
     - Bayesian networks, Monte Carlo simulations, or decision-analysis software (e.g., Lumina Decision Suite, TreePlan).  

  **Why this works**:  
  - Avoids overestimating value by accounting for substitutability.  
  - Ensures funds are allocated to studies with the highest **net marginal benefit**.  

  By shifting from isolated EVPI calculations to a portfolio approach, your team can make more efficient funding decisions and avoid redundant studies.
