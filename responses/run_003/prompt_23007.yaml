  ### Why monotonicity doesn't rescue the additive approach
  Monotonicity of the value of information in informativeness means that if one information source is more informative than another, then it has a higher value. However, it does not imply additivity. In the example above, both studies are equally informative, and each has a positive value. But when you have both, the value does not add up. The issue is that the information from the two studies overlaps. The additive approach ignores this overlap and hence overestimates the joint value.

  ### Practical Recommendation
  For a team evaluating a portfolio of candidate studies:

  1. **Model the decision context explicitly**: Create a decision tree or a Bayesian model that captures the uncertainties and how they affect the decision and the payoff. This model should include all the uncertainties that the studies aim to resolve.

  2. **Evaluate studies jointly, not in isolation**: Because of potential interactions (substitutability or complementarity), the value of a set of studies is not the sum of the individual values. Therefore, the team should:
     - Identify a set of candidate studies that are feasible and of interest.
     - Evaluate the expected value of the entire portfolio of studies together. This requires computing the joint EVPI for the set.

  3. **Use a prioritization method that accounts for interactions**:
     - If the number of studies is small, the team can evaluate every possible subset of studies to choose the subset that maximizes the net benefit (value minus cost).
     - If the number of studies is large, consider using heuristics such as greedy algorithms: start with the study with the highest individual net benefit, then add the study that provides the highest marginal increase in value given the first, and so on. However, note that a greedy algorithm might not be optimal because of complementarities.

  4. **Consider the cost of the studies**: Even if a study has a high EVPI, if it is very expensive, it might not be worth doing. The net benefit of a set of studies is the joint value minus the total cost of the studies in that set.

  5. **Use approximation methods if necessary**: For large-scale problems, exact computation of joint EVPI for every subset may be infeasible. In such cases, consider:
     - Using structural properties (e.g., if studies are about independent uncertainties, then the values are additive) to break down the problem.
     - Using efficient algorithms from the literature on value of information for multiple uncertainties.

  In summary, the team should move from an isolated study evaluation to a portfolio approach that explicitly accounts for the interactions among studies.
