prompt: |-
  I run a small experimentation team that decides which user studies to fund before a product launch, and until recently I justified each study by computing its expected value of information (EVPI) in isolation, treating the resulting figures as if they were independent. A colleague has since argued that this is methodologically wrong because the value of information is not additive across studies. Please argue for her position. In particular, explain why the joint value of two information sources can be strictly less than the sum of their individual values (the substitutability of information), demonstrate this with a small concrete decision problem, and explain why the monotonicity of the value of information in informativeness does not rescue the additive approach. Close with a practical recommendation for how a team should evaluate a portfolio of candidate studies and decide which to fund.
reasoning: |-
  We are addressing the issue of non-additivity in the value of information when evaluating multiple potential studies. The key point is that the joint value of two information sources can be less than the sum of their individual values because of substitutability: one study might provide information that makes the other less valuable.

  ### Why is the value of information non-additive?
  The Expected Value of Perfect Information (EVPI) for a single study measures the expected improvement in the decision if we had perfect information about that particular uncertainty. However, when multiple uncertainties are present, the value of reducing one uncertainty may depend on what we know about the others. Specifically:
  - **Substitutability**: If two studies provide overlapping information (i.e., they are about the same underlying uncertainty or one study's outcome can predict the other's), then having both might not be twice as valuable. In fact, the second study might not add much beyond the first.
  - **Complementarity** can also occur (where the joint value is greater than the sum), but the problem specifically asks about the case where it is strictly less.

  ### A Concrete Example
  Consider a simple decision problem:

  **Scenario**: A company is deciding whether to launch a new product. The product's success depends on two factors: 
  1. The appeal of the product's color (let's say it can be either "Blue" or "Green").
  2. The appeal of the product's shape (either "Round" or "Square").

  The company's profit depends on the combination of color and shape. Suppose the true state of the world is one of four possibilities:

  | State (Color, Shape) | Profit if launched | 
  |----------------------|---------------------|
  | (Blue, Round)        | $100                |
  | (Blue, Square)       | -$100               |
  | (Green, Round)       | -$100               |
  | (Green, Square)      | $100                |

  Without any information, the company assumes each state is equally likely (probability 0.25 for each). If the company does not launch, the profit is $0.

  **Decision without information**:
  - Expected profit from launching: (100 - 100 - 100 + 100)/4 = 0.
  - Therefore, the company is indifferent and might as well not launch (or flip a coin). Let's assume they don't launch and get $0.

  Now, consider two potential studies:

  1. **Study A**: Tells you the true color (Blue or Green) with perfect accuracy.
  2. **Study B**: Tells you the true shape (Round or Square) with perfect accuracy.

  We compute the EVPI for each study individually and then for both together.

  #### Individual EVPI for Study A (Color)
  If we know the color:
  - If color is Blue: then the two states (Blue, Round) and (Blue, Square) are equally likely. Expected profit = (100 - 100)/2 = 0. So we don't launch (profit=0).
  - If color is Green: similarly, expected profit = (-100 + 100)/2 = 0. Again, we don't launch.

  Thus, with Study A, we always get 0. Without Study A, we also got 0. Therefore, the EVPI for Study A is 0.

  #### Individual EVPI for Study B (Shape)
  Similarly, if we know the shape:
  - If shape is Round: states (Blue, Round) and (Green, Round) are equally likely. Expected profit = (100 - 100)/2 = 0 -> don't launch.
  - If shape is Square: states (Blue, Square) and (Green, Square) are equally likely. Expected profit = (-100 + 100)/2 = 0 -> don't launch.

  Thus, the EVPI for Study B is also 0.

  #### Joint EVPI for Study A and Study B (both)
  If we know both the color and the shape, then we know the exact state. We will launch only if the profit is positive (i.e., in states (Blue, Round) and (Green, Square)). In each of these states, we get $100. In the other two states, we don't launch (so $0).

  Since each state has probability 0.25, the expected profit with perfect information on both is:
  = (0.25 * 100) + (0.25 * 0) + (0.25 * 0) + (0.25 * 100) 
  = 25 + 0 + 0 + 25 = $50.

  Without any study, we got $0. Therefore, the joint value of both studies is $50.

  But note: individually, each study has an EVPI of $0. So the sum of individual values is 0+0=0, but the joint value is $50. This is a case of complementarity (joint value > sum). However, we need an example of substitutability (joint value < sum). Let's change the example.

