answer: |-
  ## Double Heart

  **I.**
  "The stars are angels' lanterns hung on high!"
  A child points upward, certain and elate.
  No lie, though science scorns this ancient state —
  Her heart's one flame, though wrong to human eye.

  **II.**
  "The sky holds no storm threat," the merchant sighs,
  Watching grey clouds while denying their advance.
  His grain needs sun; truth bends to circumstance —
  He speaks the *now*, deceives with truthful guise.

  **III.**
  *Behold the hearts unveiled, the hidden core:*
  *One holds belief, though sight itself may stray,*
  *One mouth speaks true, while mind denies the day.*
  *Not on the false or true confessed before,*
  *But on the will beneath the spoken test —*
  *Where lips and knowledge rend the sundered breast,*
  *A lie takes root, though fact may seem restored.*

  ---

  **Notes on Structure & Augustine's Principle:**

  1.  **Octave Voices:**
      *   **Quatrain 1 (ABBA):** The child believes stars *are* angels' lanterns (factually false) but speaks sincerely ("heart's one flame"). Augustine: not a lie because no intent to deceive.
      *   **Quatrain 2 (ABBA):** The merchant *correctly* says the sky holds *no storm threat at this precise moment* (factually true *now*) but *believes* a storm *is* coming ("watching grey clouds") and speaks *to deceive* about the imminent danger ("His grain needs sun; truth bends to circumstance"). Augustine: a lie because of the will to deceive.
  2.  **Volta & Sestet (CDE CDE):**
      *   The turn ("Behold the hearts unveiled...") explicitly shifts focus from the spoken words to the internal state ("hidden core," "mind," "will beneath," "knowledge").
      *   The new rhyme scheme (CDE CDE) formally signals this inward turn and the focus on division.
      *   Lines 10-11 contrast the unified heart (belief despite error) vs. the divided heart (truth spoken while knowledge denies).
      *   Line 12 ("Not on the false or true confessed before") directly states Augustine's core thesis from *De mendacio*: judgment hinges not on factual accuracy.
      *   Lines 13-14 focus entirely on the *double heart* ("lips and knowledge rend the sundered breast") as the essence of the lie, emphasizing the internal fracture ("sundered breast") and the act of deception ("A lie takes root").
  3.  **Philosophical Work:** The contrast between the speakers in the octave establishes the puzzle (truth vs. falsehood spoken). The sestet provides the Augustinian resolution by revealing the internal intentions, making the moral weight of the lie solely dependent on the merchant's internal duplicity and deceptive intent, regardless of the factual accuracy of his specific utterance.
