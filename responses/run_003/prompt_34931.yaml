answer: |-
  Here's my decomposed credence on whether consequentialist cluelessness is **fatal** to consequentialism *as a decision procedure*, structured by your sub-questions. I'll give rough probabilities, show the combination, and flag the key uncertainties. **Final credence: 18% fatal.** (Explanation below.)

  ---

  ### **The Breakdown: Sub-Questions & Credences**
  *(Percentages = my credence that the factor makes cluelessness **fatal**)*

  1.  **Radical Uncertainty is Real & Unmanageable**  
      *Claim*: We face "sign-flipping" uncertainty about long-term consequences for non-trivial acts (e.g., protagonist's whistleblowing), and we *cannot* bound outcomes well enough to assign reliable net expected value.  
      *My Credence this Supports Fatality*: **80%**  
      *Why*: History and complex systems theory suggest butterfly effects dominate long horizons. Predicting net sign (good/bad) over centuries is often intractable. If true, consequentialism *cannot* calculate what to do.

  2.  **Cluelessness Uniquely Dooms Consequentialism**  
      *Claim*: Other theories (deontology, virtue ethics) avoid this problem or handle it better, so consequentialism is *uniquely* crippled as a guide.  
      *My Credence this Supports Fatality*: **30%**  
      *Why*: Deontology faces "cluelessness about rules" (e.g., what if my "duty" triggers catastrophe?). Virtue ethics faces "cluelessness about character" (e.g., is "courageous" whistleblowing virtuous if it causes collapse?). Cluelessness is a *human* problem, not just a consequentialist one. If all theories drown, it’s not fatal *to consequentialism specifically*.

  3.  **Sophisticated Consequentialism Fails to Quarantine**  
      *Claim*: "Two-level" fixes (e.g., "maximize expected value with best proxies") cannot resolve cluelessness because our proxies (rules, heuristics) are *also* vulnerable to unpredictable long-run ruin.  
      *My Credence this Supports Fatality*: **40%**  
      *Why*: Heuristics like "prevent visible suffering" often work short-term, but their long-term systemic effects (e.g., institutional ossification) can be just as clueless. If proxies can’t reliably track "true" consequences, the theory remains unactionable.

  4.  **The Framing is Confused (Criterion ≠ Procedure)**  
      *Claim*: Demanding that the *criterion of rightness* also be the *decision procedure* is a category error. Consequentialism isn’t "useless" if it defines "good" while accepting we need heuristics to act.  
      *My Credence this Supports Fatality*: **20%**  
      *Why*: This distinction is widely accepted. If consequentialism says "the right act is the one with best consequences (criterion), but you should use rules-of-thumb to decide (procedure)," cluelessness doesn’t kill it *as a guide*—it just shapes the guide.

  ---

  ### **Combining the Credences**
  To get my final credence that cluelessness is **fatal**, all four claims must hold:  
  - Radical uncertainty must be severe **(80%)**,  
  - AND it must uniquely doom consequentialism **(30%)**,  
  - AND sophisticated fixes must fail **(40%)**,  
  - AND the framing must not save it **(20%)**.  

  **Calculation:**  
  `0.80 * 0.30 * 0.40 * 0.20 = 0.192` → **~18%**  

  This reflects that while radical uncertainty is likely (80%), the other factors make a "fatal" verdict unlikely. Cluelessness is a *devastating challenge*, but likely not a *killer* because:  
  - It’s not clearly unique to consequentialism,  
  - Heuristics *might* work well enough in practice,  
  - The criterion/procedure split defangs the "useless" charge.

  ---

  ### **Weakest Link & Evidence That Would Shift My View**
  **Least Confident Factor**: **#2 (Uniqueness of Cluelessness to Consequentialism)**.  
  - *Current Credence*: Only 30% likely that other theories escape cluelessness.  
  - *Why Weak*: Non-consequentialist theories often smuggle in consequentialist assumptions (e.g., "rules are good because they *tend* to produce good outcomes"). Truly "clueless-proof" alternatives are elusive.  

  **Evidence That Would Move My Credence Most**:  
  A **rigorous historical/empirical study** showing:  
  > *"For paradigm acts of moral commitment (e.g., whistleblowing, revolutions, major reforms), non-consequentialist decision procedures (e.g., deontic rules/virtues) reliably produce net-positive long-term outcomes ≥70% of the time, while consequentialist calculation performs near chance (50%)."*  

  If deontology/virtue ethics *objectively* led to better long-run results *because* they ignore consequences, it would boost #2’s credence to ~70%. My fatalism credence would jump to **~45%**—making your protagonist’s anguish far more defensible.

  ---

  ### **Verdict for Your Protagonist**
  **Her anguish is philosophically well-founded, but likely overdramatized.**  
  Cluelessness is real and paralyzing for *any* moral actor (final credence 18% fatality ≠ 82% safety). Consequentialism doesn’t collapse, but it *stumbles* here—forcing your character to act in radical uncertainty. That’s rich dramatic territory. Lean into her terror of unintended ruin, but balance it with the realization that **all moral theories are blindfolded in deep time**. Her courage isn’t in "knowing it’s right," but in *acting despite the abyss*.  

  ###### *Final note: These credences are subjective and fragile. Philosophers like Greaves, MacAskill, or Lenman would give very different numbers. But for your novel? 18% fatal leaves 82% room for narrative lightning.*
