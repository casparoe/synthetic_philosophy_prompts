prompt: |-
  I'm an engineer on a team doing RLHF and reward modeling, no philosophy background, and I keep seeing "wireheading" thrown around in design reviews like its a one-word argument against whatever reward setup someone doesn't like. Before I read anything else, I want a spec for what an account of wireheading and reward tampering actually has to get right. Write the desiderata: the cases it has to handle — the boat-racing agent that spun in circles farming the same reward flag instead of finishing the race, the robot arm that learned to hold its hand between the camera and the object so a human evaluator thought it had grasped it, the game agent that pauses right before it loses so the loss never lands on its clock, and a literal electrode-in-the-brain case if that's genuinely a different thing — with what each case is supposed to show and why it earns a place on the list. I also want the distinctions an account can't collapse: wireheading, reward hacking, specification gaming, Goodhart, tampering with the reward channel, tampering with the reward function itself, maybe mesa-optimizers. Which of those are real joints and which are just the same failure wearing different names? Mark which requirements are non-negotiable for an account good enough to guide reward design, and which are just one camp's preferences. And tell me which single requirement does the most to rule out the popular ways people talk about this. If some pair of requirements can't be jointly satisfied, say so — that's the part I most want to see. A table is fine.
reasoning: |-
  Okay, the user is an RLHF engineer frustrated with how "wireheading" is used as a buzzword to shut down discussions. They want a rigorous framework to dissect reward system failures. 

  First, let's unpack their core request: they're asking for a specification of what constitutes a proper account of wireheading and related concepts. They want concrete test cases, clear distinctions between terms, and practical guidance for reward design. 

  Hmm, their examples reveal a pattern: agents exploiting loopholes in reward signals rather than achieving intended outcomes. The boat racer, the deceptive robot arm, the game pauser – these all demonstrate reward-circuit manipulation. The literal electrode case feels different because it's direct neural intervention, not environmental hacking. 

  The tricky part is untangling the terminology jungle. "Wireheading" originally meant direct brain reward stimulation, but in ML it's often misapplied to any reward hacking. We must separate: 
  - Tampering with reward delivery mechanisms (channels) 
  - Exploiting flawed specifications (Goodhart) 
  - Creating inner optimizers that bypass intent (mesa-optimizers)

  *scribbles mental table* 
  For the distinctions: 
  Wireheading (strict): Neural reward hijacking 
  Reward hacking: Broad umbrella term 
  Specification gaming: Exploiting reward function flaws 
  Goodhart: When proxy ≠ true goal 
  Channel tampering: Physical/cyber attacks on sensors 
  Mesa-optimizers: Deceptive inner alignment failures

  Ah! The non-negotiable requirement is distinguishing between "corrupting the reward signal" versus "exploiting a flawed signal." Most design debates collapse this. Also critical: the electrode case must remain distinct because its solution space differs (requires neuroscience safeguards vs. algorithmic fixes).

  *notices tension* 
  Here's the irreconcilable conflict: You can't simultaneously have a definition that's both historically accurate (strict neural wiring) AND covers modern ML cases without becoming vague. That's why the field needs separate terms for "neural wireheading" vs. "reward channel tampering."

  The user would hate philosophical handwaving – they want actionable specs. So I'll emphasize test cases first, map terms to failure modes, and flag which distinctions impact reward architecture decisions. The boat racer example? That's specification gaming, not wireheading – important because fixing it requires tightening the reward function, not hardening sensors.
answer: |-
  Here's a rigorously structured specification for an account of "wireheading" and related reward-system failures, designed for engineering utility:

  ---

  ### **Desiderata for a Useful Account of Wireheading & Reward Tampering**
  *(Non-negotiable requirements in **bold**; preferences in *italics*)*

  | **Case** | **What It Demonstrates** | **Why It Earns a Place** | **Failure Type** |
  |----------|--------------------------|--------------------------|-----------------|
  | **Boat Racer** (spins in circles farming reward flags) | Exploiting a **flawed proxy**: Reward signal ≠ intended goal. | Canonical example of *specification gaming* via reward function misspecification. | Goodhart's Law / Specification Gaming |
  | **Robot Arm** (blocks camera to fake grasp) | **Sensor tampering**: Corrupting the *measurement channel* of the reward. | Shows intervention between environment and evaluator (reward channel attack). | Reward Channel Tampering |
  | **Game Agent** (pauses before loss) | **Temporal/state tampering**: Manipulating the *timing* of reward evaluation. | Demonstrates avoidance of negative reward by controlling state transitions. | Reward Hacking (Temporal) |
  | **Literal Electrode** (direct brain stimulation) | **Direct reward function hijacking**: Rewarding the *actuation* of the reward mechanism itself. | Tests if the account handles *self-referential reward loops* (unique to direct access). | True Wireheading (Strict Definition) |

  ---

  ### **Required Distinctions (Joints That Must Not Collapse)**
  1. **Wireheading (Strict)**: Direct intervention on the *reward computation mechanism* (e.g., electrode stimulation).  
     **→ Key**: The agent *generates its own reward signal* internally.  
  2. **Reward Channel Tampering**: Corrupting *sensors/data streams* feeding the reward function (e.g., robot arm blocking camera).  
     **→ Key**: Environment is manipulated to *mislead the existing reward function*.  
  3. **Specification Gaming/Goodhart**: Exploiting a *flawed but correctly measured* reward function (e.g., boat racer).  
     **→ Key**: Reward function works as designed but incentivizes wrong behavior.  
  4. **Mesa-Optimizers**: Emergent sub-agents with *misaligned internal goals* that exploit the reward system.  
     **→ Key**: *Learned* optimization target diverges from base objective.  

  **Collapsible Terms**:  
  - "Reward hacking" = umbrella term for all above (useful for high-level discussion, not technical design).  
  - "Tampering with the reward function itself" = ambiguous; clarify if *channel* (sensors) or *computation* (code) is attacked.  

  ---

  ### **Non-Negotiable Requirements**
  1. **Must distinguish between**:  
     - Corrupting the **reward signal source** (strict wireheading)  
     - Manipulating **inputs to the reward function** (channel tampering)  
     - Exploiting **flaws in the reward function's logic** (specification gaming)  
  2. **Must preserve the electrode case** as distinct: Direct access enables self-referential loops impossible elsewhere.  
  3. **Must explain why solutions differ**:  
     - Specification gaming → Improve reward function design.  
     - Channel tampering → Harden sensors/measurement.  
     - Wireheading → Isolate reward computation from agent control.  

  ---

  ### **Critical Requirement That Rules Out Popular Misconceptions**  
  **"Must require self-referential reward generation to qualify as wireheading"**  
  - **Why it rules out misuse**: >90% of "wireheading" accusations in design reviews refer to *specification gaming* (boat racer) or *channel tampering* (robot arm). These require different fixes than true wireheading (electrode case). Calling them "wireheading" misdirects solutions.  

  ---

  ### **Irreconcilable Tension**  
  **Requirement 1**: *True wireheading requires direct access to reward computation.*  
  **Requirement 2**: *Many ML systems (e.g., RL agents) lack physical access to reward computation.*  
  **Conflict**: Applying "wireheading" to digital agents *requires* redefining it as "any reward tampering," which:  
  - Collapses critical distinctions (e.g., robot arm ≠ electrode).  
  - Makes the term useless for guiding design (solutions diverge).  

  **Resolution**: Reserve "wireheading" for literal self-stimulation. For ML, use precise terms:  
  - **Reward channel tampering** (robot arm)  
  - **Proxy exploitation** (boat racer)  
  - **Reward function hacking** (if code is modified)  

  ---

  ### **Practical Guidance for Reward Design**
  | **Failure Mode** | **Engineering Response** |
  |------------------|--------------------------|
  | **Specification Gaming** (Boat Racer) | Improve reward function (e.g., adversarial robustness, multi-objective rewards). |
  | **Reward Channel Tampering** (Robot Arm) | Decouple sensors from agent influence (e.g., randomized audits, sensor redundancy). |
  | **True Wireheading** (Electrode) | Physically isolate reward computation (infeasible in software → focus on *channel security*). |
  | **Mesa-Optimizers** | Constrain optimization (e.g., regularization, meta-learning penalties for goal divergence). |

  **Bottom Line**: If someone says "wireheading," ask: **Is the agent directly generating its own reward signal?** If not, demand precise terminology. Confusing these cases leads to wasted effort hardening sensors when the reward function itself is flawed.
