  First, I need to address their main points. The user seems to be pushing back against the philosophical use of complexity theory to argue for cognitive limitations. They think worst-case scenarios are artificial and not reflective of actual problems. So, my response needs to validate their observation about worst-case vs. practical cases but also explain why complexity theory still matters.

