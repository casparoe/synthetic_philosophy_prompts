  For the agreements, both sides might agree on the history of theory shifts, like from caloric to kinetic theory. They'd also agree that success isn't just prediction but includes explanation and unification. The realist inference is probabilistic, and the PMI challenges but doesn't refute realism. The inductive nature of PMI is a shared observation, though they might frame it differently.

  Disagreements would center on the strength of the realist inference. Realists see PMI as a caution; pessimists see it as undermining justification. The interpretation of theory continuity is another point—realists see preserved content, pessimists see radical breaks. The burden of proof is also contested; realists think they meet it, pessimists disagree.

  Cruxes involve the frequency of radical breaks versus continuity. Realists predict historical cases show preserved components, while pessimists highlight discarded parts. Another crux is whether current theories have structural features that resist PMI. Realists say yes, like mathematical structures; pessimists doubt it. Defining "same theory" operationally is vital, maybe through continuity in equations or mechanisms.

