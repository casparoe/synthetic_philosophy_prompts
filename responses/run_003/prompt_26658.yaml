prompt: |-
  I'm a graduate student in philosophy, and I've been working through some of the recent literature on pragmatic encroachment — the idea that whether you know something, or what you're justified in believing, can depend on what's practically at stake. I find the view independently plausible, and I've been trying to identify cases where it makes a clear and uncontroversial difference to how we should reason.

  Last week in my formal epistemology seminar, we discussed the Sleeping Beauty problem. For those unfamiliar: Beauty is put to sleep on Sunday. A fair coin is tossed. If it lands heads, she is awakened on Monday only. If tails, she is awakened on Monday and Tuesday. In either case, she is given a drug that erases her memory of any previous awakenings, so each time she wakes up, the experience is subjectively identical. The question is: upon awakening, what credence should Beauty assign to the coin having landed heads?

  The literature is split between halfers (who say 1/2) and thirders (who say 1/3). I read Elga's original paper and some of the back-and-forth, and I have to say I'm puzzled — not by the problem itself, which seems to have a clear answer, but by why anyone takes the halfer position seriously. Here's my reasoning: if Beauty is offered a bet on heads each time she wakes up, she should be willing to accept it only at odds that reflect a 1/3 credence; otherwise she'd be a money pump across repeated trials. This looks to me like a straightforward case where the practical stakes — the structure of possible awakenings — determine the rational credence. It seems like a perfect illustration of the kind of pragmatic encroachment I've been studying: the mere fact that Beauty might be awoken twice in the tails world changes what it's rational for her to believe upon awakening, not just what it's rational for her to do.

  But when I raised this in class, my professor said I was conflating decision theory with epistemology and that the Sleeping Beauty problem isn't about pragmatic encroachment at all — it's about self-locating belief and the principle of conditionalization. I didn't really follow the distinction. If what you should believe is constitutively tied to what you should do — as pragmatic encroachment suggests — then why isn't the betting argument decisive? And if the problem really is about self-locating belief, why does almost everyone, including committed halfers, agree that Beauty should bet as a thirder would? Doesn't that concession already give away the game? What am I missing?

  I'd appreciate it if you could end your response with a one-sentence summary of the main point, formatted as \summary{...}.
reasoning: |-
  Okay, let me unpack this philosophy grad student's question. They're deeply engaged with pragmatic encroachment and see Sleeping Beauty as a perfect case study. Their frustration is palpable: the betting argument seems obviously decisive to them, yet their professor dismissed it as conflating epistemology with decision theory. 

  First, I need to validate their core insight - the betting behavior *does* matter. The professor's dismissal might have felt like gatekeeping, but there's a real methodological distinction here. The student is right that halfers secretly concede the betting point, which creates tension. That halfer/thirder compromise deserves scrutiny.

  Hmm... the key is separating two questions: (1) What is Beauty's credence *in itself*? (2) How should she *act* given that credence? Pragmatic encroachment says these can't be fully separated, but the professor's stance reflects traditional formalism. I should explain why both views persist - it's about whether rationality has one layer or two. 

  For the student, the compromise position must feel unstable. If Beauty "believes" heads at 1/2 but bets at 1/3 odds, doesn't that make belief inert? That's exactly where pragmatic encroachment bites. But I should acknowledge the formalist counter: maybe belief just *is* what you get before adding decision rules. 

  The summary needs to crystallize this duality: the dispute isn't about bets but about what constitutes "belief" itself. I'll position it as a meta-disagreement to validate both their intuition and the professor's framing.
answer: |-
  Your frustration is understandable—the Sleeping Beauty problem *does* seem like a natural case for pragmatic encroachment, and the disconnect between the "belief" answer (1/2 for halfers) and the "betting" answer (1/3) is jarring. Here's why the distinction matters, and why your professor framed it as a conflict between epistemology and decision theory:

  1.  **The Core Disagreement is Epistemic (Self-Locating Belief):**
      *   **Halfer View (Epistemic):** Beauty gains *no new information relevant to the coin flip* upon waking. She knew on Sunday she'd be awake now in a scenario where an awakening always occurs. The coin is fair, so her credence should remain 1/2. The "extra" awakening on tails is *indexical* information ("Is it Monday or Tuesday?") irrelevant to the coin's outcome. Conditionalization applies only to new *relevant* evidence.
      *   **Thirder View (Epistemic):** Upon waking, Beauty *does* gain relevant information: she learns "I am experiencing an awakening *now*." Crucially, there are more *possible awakenings* in the tails world (Monday *and* Tuesday) than in the heads world (only Monday). Since each awakening is subjectively identical, she should reason she's more likely to be in a tails-awakening. The principle of indifference over *centered possible worlds* (awakening events) leads to 1/3.

  2.  **The Betting Argument is Decision-Theoretic:**
      *   Everyone agrees that *if* Beauty is offered a bet each awakening, she should accept bets paying better than 1:2 odds against heads (e.g., pays $3 on heads, costs $1 on tails). She loses money betting at even odds because she places two losing bets on tails but only one winning bet on heads.
      *   **This agreement exists *despite* the epistemic disagreement.** Halfers don't deny the betting behavior; they argue Beauty's *core credence* is 1/2, but because she knows she might be placing multiple bets conditional on the world, she needs a *decision rule* that accounts for her location within the branching structure of possibilities. Her *action* (betting) reflects a 1/3 *betting quotient*, not necessarily a pure 1/3 *credence*.

  3.  **Why This Isn't *Necessarily* Pragmatic Encroachment:**
      *   Pragmatic encroachment holds that practical stakes (costs of being wrong) directly affect the *epistemic standards* for knowledge or justification (e.g., needing more evidence to know the bank is open when stakes are high). The Sleeping Beauty betting argument doesn't involve varying *costs of being wrong* about the coin in a fixed context.
      *   Instead, it involves *multiplicity of opportunities for action* within a single possible world. The "stakes" argument here is structural: the *number of times* she acts depends on the state of the world. Her betting behavior stems from the *centered* nature of her evidence and the branching structure of time/wakings, not because the cost of being wrong about heads changes based on external pragmatic factors like importance. It's about the *indexical uncertainty*, not varying epistemic standards driven by practical consequences.

  4.  **The Concession You Highlight:**
      *   You are absolutely right that the *near-universal agreement on betting behavior* puts immense pressure on the halfer position. If Beauty's rational *actions* require her to behave *as if* her credence is 1/3, what does it mean to insist her "true" credence is 1/2? This is a major criticism of halfer views.
      *   **Halfer Response:** Halfers argue Beauty's *categorical belief* ("The coin is fair and landed heads with probability 1/2") remains unchanged. Her betting behavior is rational because she applies a *correct decision rule* (like Lewis's "calling the fair price") that accounts for the fact that her *temporal location* (which awakening it is) is unknown, and this location correlates with the coin outcome in the tails world. The 1/3 is a *pragmatic weighting* applied to her fixed 1/2 belief for decision-making within this specific centered context.

  5.  **What You Might Be Missing:**
      *   **The Primacy of the Centered Question:** The core epistemic debate hinges on whether "I am awake now" provides information *about the coin flip* or only *about her location within a world whose coin-state is already fixed*. Halfers say the latter; thirders say the former.
      *   **Formalism vs. Pragmatism:** Your professor represents a formalist tradition separating *pure credence* (modeling belief based on evidence) from *decision rules* (applying belief to action). Pragmatic encroachment challenges this strict separation by asserting practical stakes affect the epistemic state *itself*. Your argument pushes Sleeping Beauty towards this challenge, but the problem is primarily cited as a debate about formalism: *how* to apply conditionalization/indifference to self-locating belief.
      *   **The Nature of the "Stakes":** The "stakes" in Sleeping Beauty aren't external costs imposed on being wrong; they are an *intrinsic feature* of the experimental setup generating *multiple indistinguishable decision points* conditional on the world state. This is subtly different from classic pragmatic encroachment cases.

  **Conclusion:** The Sleeping Beauty problem is fundamentally a debate about self-locating belief and the application of conditionalization/indifference in centered frameworks. While the betting argument powerfully demonstrates that Beauty *must act* based on a 1/3 weighting, this doesn't *automatically* prove that her underlying epistemic credence is 1/3, nor does it straightforwardly exemplify pragmatic encroachment (which ties justification/knowledge to *external* stakes). It instead highlights the complex relationship between belief, indexical uncertainty, and rational action. The halfer/thirder compromise reveals a deep question: is rational action always a direct reflection of credence, or can rational action sometimes involve applying a weighting to a fixed credence based on structural features of agency?

  \summary{The Sleeping Beauty problem primarily concerns the epistemology of self-locating belief under indexical uncertainty, and while the betting argument forces Beauty to act *as if* her credence is 1/3, this pragmatic constraint doesn't conclusively resolve the underlying epistemic disagreement about whether her pure credence is 1/2 or 1/3, nor does it directly exemplify pragmatic encroachment as typically defined.}
