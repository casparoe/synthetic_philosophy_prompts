answer: |-
  ## Epistemic Tracks

  So knowledge needs the truth to leave its mark:
  Your thought must track where real conditions lead,
  Not luck upon the target in the dark.
  If false, you'd doubt; if true, you'd hold the creed.
  This sensitivity, this firm adherence,
  Ensures your grasp won't slip on shifting sands.
  Your mind must follow facts with clear coherence
  Through nearby worlds where counterfactuals stand.
  You *see* the stripes, the sign, the zoo attendant there –
  You know it's *zebra* standing in that pen.
  But see: if *mule* stood painted, striped with care,
  You'd still cry "zebra!" (not clever disguises, then).
  **Yet** **know** you **not** *it's not a painted mule*?
  For if it *were*, your senses would be fooled!

  You may have closure under known entailment's chain,
  Or hold your tracking theory – but not both remain.

  ---

  **Annotations for Verification:**

  1.  **Octave (Setup):**
      *   Lines 1-4: Introduce core idea of knowledge requiring truth-tracking (responsiveness), contrasting with luck. Explicitly mentions sensitivity ("If false, you'd doubt").
      *   Lines 5-8: Names both conditions ("sensitivity, this firm adherence") and emphasizes tracking truth across "nearby worlds" and "counterfactuals," framing it as sensible ("clear coherence," "won't slip").

  2.  **Volta (Line 9: "But see...")**: The turn *is* the application of the tracking conditions to the skeptical scenario, initiating the break of closure. The "But see" shifts from abstract theory to concrete case (zebra/mule).

  3.  **Sestet (Case & Closure Break):**
      *   Lines 9-10: States the ordinary knowledge claim ("know it's *zebra*") based on evidence (seeing stripes, sign, attendant).
      *   Lines 11-12: Applies *sensitivity* test to the ordinary claim: In the nearby world where it's a painted mule (implied clever disguise), you *would* still believe it's a zebra ("You'd still cry 'zebra!'"). Therefore, you *don't know* it's not a painted mule (line 13). The parenthetical "(not clever disguises, then)" highlights the crucial feature of the skeptical scenario making the belief insensitive.
      *   Lines 13-14: Explicitly states the failure to know the entailed anti-skeptical proposition ("*it's not a painted mule*") *because* of the tracking condition (adherence holds, but sensitivity fails: "For if it *were*, your senses would be fooled!").

  4.  **Closing Couplet (Cost):**
      *   Clearly states the dilemma forced by the preceding argument: You must choose between preserving closure under known entailment ("closure under known entailment's chain") or preserving the tracking conditions ("hold your tracking theory"). The theory forces you to reject one.

  5.  **Accuracy:**
      *   Correctly identifies sensitivity (believe P only if P) and adherence (believe P if P) as the core tracking conditions.
      *   Correctly uses the zebra/mule case to illustrate how sensitivity holds for the ordinary claim (you wouldn't believe "zebra" if it weren't) but *fails* for the anti-skeptical claim (you *would* believe "not painted mule" even if it *were* a painted mule).
      *   Correctly identifies the consequence: knowledge of the ordinary proposition ("zebra") without knowledge of the entailed anti-skeptical proposition ("not painted mule"), thereby violating epistemic closure.
      *   Correctly frames the result as a forced choice between the tracking conditions and closure.
