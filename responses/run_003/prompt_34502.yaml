prompt: |-
  I've been turning over counterfactual mugging in my head and I think I've found an argument that shows the whole thing is busted, but I'm not totally confident and want someone to check my reasoning.

  Quick setup for anyone who hasn't seen it: Omega (a perfect predictor) flips a fair coin. If heads, Omega gives you $10,000 — but only if you would have given Omega $100 in the tails case. The coin comes up tails, and Omega asks you for $100. The standard argument says you should pay: if you're the kind of agent who pays on tails, you get $10,000 on heads (expected value $5,000, minus the $50 expected payment on tails, net $4,950). If you're the kind who doesn't pay, you get $0. So paying dominates.

  Now here's my argument that this reasoning can't be right:

  (1) If you should pay in the original counterfactual mugging, it's because a decision procedure should be evaluated by its expected value across all branches, including counterfactual ones where the predictor's behavior depends on the procedure.

  (2) The exact same reasoning applies no matter what the predictor conditions on. If Omega had conditioned the $10,000 on whether you'd destroy your smartphone, the expected value of the "destroy phone" policy would be $5,000 minus half the value of your phone, and the "keep phone" policy would be $0.

  (3) So if you accept (1), you're committed to accepting: in any situation where a perfect predictor tells you it flipped a coin that came up tails, and it would have given you $10,000 on heads iff you do X on tails, you should do X — provided that the expected value calculation (0.5 × $10,000 − 0.5 × cost(X)) comes out positive.

  (4) Now consider a sequence of such predictors. On Monday, Predictor A tells you the coin came up tails and asks you to smash your phone. On Tuesday, Predictor B tells you the coin came up tails and asks you to smash your laptop. On Wednesday, Predictor C asks for your television. Each predictor is genuinely perfect and independent. Each individual decision has positive expected value. So by (3), you should smash your phone, then your laptop, then your TV.

  (5) By the end of the week you've destroyed everything you own, having received not a single dollar in the actual world, because every coin came up tails. But you were supposedly "rational" to do this, because each individual choice maximized expected value counting counterfactual branches.

  (6) A decision procedure that tells you to destroy all your possessions for purely counterfactual gains is not a rational decision procedure. The fact that the coin "could have" come up heads doesn't change the fact that it didn't, and you've ruined your life for nothing.

  (7) Therefore (1) is false. The original counterfactual mugging argument is unsound.

  I can see a couple replies. One is that the iterated case is different because the predictors' predictions might interact — once you smash your phone, Predictor B updates its model of you — but you could just stipulate that the predictors are independent and made their predictions before the sequence started. Another reply is that the sequence of all-tails is just tremendously bad luck, and the procedure is still correct ex ante, the same way a casino with a house edge can lose money on a particular night. But that feels like it misses the force of the objection: the problem isn't that you got unlucky, it's that the reasoning tells you to take actions that are guaranteed to harm you in the actual world, and the only justification is "but in a different world you would have gotten a reward." At some point that stops being a justification.

  Which step of my argument actually fails, and what do you have to give up to reject it? Also, when you answer, please separate what's settled from what's genuinely contested among people who know this topic — don't present a contested view as the consensus.
reasoning: |-
  Okay, the user has presented a detailed argument against the rationality of counterfactual mugging, specifically addressing the standard expected value justification. They've constructed a scenario where iterating the counterfactual mugging leads to destroying all possessions for zero actual gain, arguing this exposes a flaw in the foundational reasoning. 

  Hmm, this is a sophisticated objection—clearly someone who's deeply engaged with decision theory paradoxes. Their step-by-step reasoning shows they've grappled with the implications beyond single-instance cases. I notice they're already anticipating potential counterarguments (like predictor interdependence or bad luck), which suggests they've thought this through thoroughly.

  The core tension they're highlighting is real: how can a decision procedure that systematically leads to guaranteed real-world losses while chasing counterfactual gains be considered rational? Their smartphone/laptop/TV destruction sequence vividly illustrates the absurd endpoint of unconditional acceptance of the counterfactual mugging logic.

  I should acknowledge where they're right before explaining the counterarguments. They're absolutely correct that:
  - The standard EV calculation does recommend compliance in each individual case
  - This could theoretically lead to ruin in an all-tails world
  - There's something deeply unsettling about sacrificing actual utility for counterfactual gains

  But the key insight they might be missing is that decision theories like UDT/functional decision theory evaluate the entire decision rule across all possible worlds simultaneously—not as a series of isolated choices. When you precommit to a universal strategy ("always pay" vs "never pay"), the all-heads outcome becomes possible, which offsets the all-tails losses. Their sequence artificially forces sequential evaluation while ignoring the global strategy aspect.

  The user seems particularly concerned about the "guaranteed harm" in the actual world. This touches on the fundamental divide in decision theory: should we optimize for the actual world (causal decision theory) or across all possible worlds (evidential/updateless)? Their intuition leans strongly toward the former, while counterfactual mugging arguments require the latter. 

  I should emphasize this isn't settled—there's genuine disagreement among philosophers. CDT defenders would agree with their conclusion, while UDT proponents would maintain the sequence remains rational ex ante. The predictors' independence actually strengthens UDT's case here, as it prevents learning from previous outcomes from altering the strategy.

  The casino analogy they dismiss might actually be apt—a good blackjack strategy can still lose ten hands in a row by chance. But I understand why they reject it: unlike casino games, here the losses are irreversible (destroyed property) and the "game" only happens once in reality. That difference matters.

  Perhaps the deepest issue is whether rationality should care about possible worlds where predictors exist but didn't interact with us. If we take multiverse ethics seriously, their argument fails. If we care only about actual outcomes, it succeeds. This meta-level disagreement might be the real root of the controversy.
answer: |-
  Your argument is thoughtful and highlights a genuine tension in decision theory—specifically regarding "updateless" approaches like those used in counterfactual mugging. I'll address your steps, clarify where the reasoning might falter, and distinguish settled points from ongoing debates. For context: **there is no consensus** on counterfactual mugging; it remains contested among decision theorists.

  ### Step-by-Step Analysis
  1.  **Your Premise (1) is Correct (for UDT/Functional DT)**:  
      Yes, updateless decision theories (UDT) evaluate policies *ex ante* (before knowing the coin flip), including counterfactual branches where Omega's actions depend on your *entire* decision procedure. This is the core of the "standard argument."  

  2.  **Premise (2) is Also Correct**:  
      UDT *does* extend to arbitrary predictors conditioning on arbitrary actions. If Omega rewards you in heads-worlds iff you destroy your phone in tails-worlds, UDT recommends destroying your phone if \(0.5 \times 10,000 > 0.5 \times \text{value(phone)}\).  

  3.  **Premise (3) Follows**:  
      If you accept UDT, you *are* committed to complying with any such predictor, provided the expected value (EV) of the policy is positive.  

  4.  **Premise (4) is Valid Under Your Setup**:  
      With independent, pre-committed predictors (no updating), UDT would indeed recommend destroying each item sequentially if each individual EV calculation is positive.  

  5.  **Premise (5) is Possible but Misleading**:  
      In an all-tails sequence, you destroy everything and gain nothing. However, UDT evaluates the *policy* across *all possible worlds*. In worlds where any coin landed heads, you gain $10,000 without destroying anything else. The policy's EV is high *ex ante*, but you experienced a low-probability bad outcome (all tails).  

  6.  **Premise (6) is Where Disagreement Emerges**:  
      You claim this outcome proves irrationality. UDT proponents argue:  
      - **Ex Ante Rationality**: A policy is rational if it maximizes expected value *before uncertainty is resolved*. The all-tails outcome is unfortunate but doesn't invalidate the policy.  
      - **Parallel Worlds Matter**: UDT cares about *all* branches (including heads-worlds where you benefit). Sacrificing in tails-worlds is the "price" to access heads-world gains.  
      **Critics** (like you) argue:  
      - **Actual World Focus**: Rationality should prioritize the *actual* world. If you *know* you're in a tails-world (Omega told you), destroying assets for counterfactual gains is net harmful and irrational.  
      - **Slippery Slope**: If UDT forces self-destructive acts in the actual world, it's self-undermining.  

  7.  **Conclusion (7) is Contested**:  
      You reject (1). Critics of UDT agree. UDT proponents maintain that (1) is sound and the problem is your intuition about rationality.  

  ---

  ### Where Your Argument Fails (From a UDT Perspective)
  - **The Casino Analogy Holds**: A casino with a 1% house edge can lose money on a bad night. That doesn't make the house edge irrational—it makes it statistically robust. UDT treats your scenario similarly: the policy is EV-positive *ex ante*, and all-tails is a low-probability loss streak (\(P(\text{all tails}) = \frac{1}{2^n}\) for \(n\) predictors).  
  - **Policy Evaluation vs. Myopic Decisions**: UDT evaluates your *entire decision rule* (e.g., "always comply with predictors") *once*, before any coin flips. Your sequence feels irrational because you're viewing it as a series of *local* decisions *after* knowing previous tails outcomes. UDT insists on global precommitment.  
  - **Independence is Key**: Since predictors are independent, destroying your phone doesn't affect Predictor B's decision. Each opportunity is a separate "bet" with positive EV. Rejecting positive-EV bets reduces long-term gains.  

  ---

  ### Genuinely Contested Issues (No Consensus)
  1.  **Should We Care About Counterfactual Branches?**  
      - **UDT/Logical Induction**: Yes. Possible worlds where the coin was heads are real in decision-theoretic terms.  
      - **Causal Decision Theory (CDT)/Actualists**: No. Rationality acts on causal consequences in the *actual* world. Sacrificing actual resources for counterfactual gains is irrational.  

  2.  **Is the Iterated Scenario a Reductio ad Absurdum?**  
      - **Critics**: Yes. It exposes UDT's violation of "no-regret" principles in the actual world.  
      - **UDT Proponents**: No. It's a statistical anomaly. The policy pays off in most worlds (e.g., with 10 predictors, you profit in ≈99.9% of multiverse branches).  

  3.  **Does Rationality Demand "Survivability"?**  
      - **Critics**: Rational agents shouldn't accept protocols guaranteeing self-destruction in possible (even if unlikely) worlds.  
      - **UDT Proponents**: Maximizing EV *ex ante* is paramount. Survivable but suboptimal policies are irrational.  

  ---

  ### Key Takeaway: What You Must Give Up
  To reject your conclusion, **you must accept that rationality is defined at the moment of policy selection (ex ante), not just by outcomes in the actual world (ex post).** This is the core tenet of updateless decision theories. If you instead believe rationality must optimize the actual world (e.g., CDT), your argument stands.  

  **Settled vs. Contested**:  
  - **Settled**: UDT *does* recommend compliance in your iterated scenario if predictors are independent and precomputed.  
  - **Contested**: Whether UDT's recommendation is genuinely rational. Prominent figures (e.g., Eliezer Yudkowsky) defend UDT; others (e.g., causal decision theorists) reject it.  

  Your argument is valid against UDT if you hold that actual-world outcomes trump multiverse expectations. It fails against UDT if you accept that rationality is about precommitment to optimal global policies. The debate hinges on this philosophical divide.
