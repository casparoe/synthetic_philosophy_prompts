prompt: |-
  I am a retired planetary scientist. I spent most of my career on the geology of icy moons and Mars, and since retiring I have been reading environmental ethics and the philosophical literature on the ethics of space settlement. I am not a trained philosopher. I now serve on the standing review panel of a national space agency, where we decide whether a proposed activity beyond Earth orbit may proceed when it could alter, contaminate, or irreversibly change an extraterrestrial environment. The panel meets roughly every two months and handles ten or twelve proposals at a sitting: robotic landers, melt probes through ice shells, sample-return missions, in-situ resource utilization trials, and, increasingly, private proposals for settlement and for ecopoiesis experiments. The decisions matter because they are often irreversible, because they can permanently foreclose scientific questions, and because they may harm or destroy whatever is actually there. Each proposal arrives as an engineering summary plus a microbiological risk assessment, and the committee discusses it for about forty minutes. The other members are engineers, a microbiologist, and a lawyer; none of them have read any of the ethics. The director signs off on our recommendation and almost never overrules it.

  I want a reusable decision procedure for this panel, not a one-off judgment. It should turn a precautionary, non-interference stance toward other worlds into something with structure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to a person because the question is one of values rather than facts. The agency's existing guidance is written to protect the science, not the environments themselves; I want the procedure to be explicitly ethical, so that it can say a proposal is wrong even when it would not ruin any future experiment.

  The procedure will have to handle several distinctions without collapsing them. One is the difference between harming an organism and merely destroying our chance to learn about it. Another is the difference between a living target and a lifeless but scientifically or aesthetically significant one. A third is the difference between contamination that is reversible or local and alteration that is effectively permanent. It also needs a policy for how to treat absent evidence of life, for how much weight to give to scientific knowledge as a justification, and for asking who bears the risk and who receives the benefit, including cases where a private party is trying to commit the whole species to a terraforming trajectory. Please be explicit about which steps are genuine judgment calls dressed up as procedure, and say where the procedure is likely to misfire.

  Then run the procedure on two proposals. The first is a robotic mission to melt through the ice shell of Europa, with terminal sterilization of the probe but no way to guarantee that zero viable terrestrial organisms are delivered; the scientific goal is to detect life. The second is a private consortium's small field trial that would release engineered cyanobacteria at a single Martian site to test whether they can survive, explicitly as a first step toward altering the atmosphere. Choose at least one of these so that the procedure returns an answer I am unlikely to welcome, and tell me plainly when that happens. The procedure must be usable in the room by people who cannot look anything up; it should not rest on facts we do not have, and it should tell us which missing facts would change the recommendation.
reasoning: |-
  We are constructing a reusable decision procedure for an ethics-focused review panel. The procedure must be precautionary and non-interference-oriented, structured as a sequence of questions. It should handle key distinctions and be usable by non-philosophers in a meeting setting.

  Key principles:
  1. Precautionary principle: When an activity raises threats of harm to the environment, lack of full scientific certainty shall not be used as a reason for postponing cost-effective measures to prevent environmental degradation. In space ethics, this often translates to avoiding contamination or alteration until we understand the risks.
  2. Non-interference: We should avoid altering extraterrestrial environments for our own purposes, especially when the environment might have intrinsic value (whether life exists or not).
  3. Distinctions: 
     a. Harm to organisms vs. loss of scientific opportunity.
     b. Living targets vs. non-living but significant (scientifically or aesthetically) targets.
     c. Reversible/local contamination vs. irreversible/permanent alteration.
  4. Policy for absent evidence of life: We must assume that life might be present until proven otherwise? Or we must act as if it is present? But we don't know. We'll use a precautionary stance: if there is a non-negligible chance of life, we treat it as if it might be present.
  5. Weight to scientific knowledge: Scientific goals are important but not the only value. They must be balanced against preservation. However, the procedure must be able to reject a proposal even if it doesn't ruin future science, on ethical grounds (e.g., intrinsic value of the environment).
  6. Risk and benefit allocation: Who benefits? Who bears the risk? Especially for private proposals that might commit humanity to a path.

  Structure of the procedure:
  - A flowchart-like sequence of yes/no questions and judgment calls.
  - At each step, if the answer is "no" to a critical question, the proposal is rejected until modified.
  - Some steps are judgment calls (we will mark them as such). For these, the procedure should specify the criteria and how to weigh factors.
  - The procedure must identify when a decision is a value judgment and must be made by the panel (with guidance on how to think about it).

  We design the procedure as a 10-step process:

  **Step 1: Is the target body a candidate for hosting indigenous life?**
     - Criteria: Based on current scientific understanding (e.g., Europa, Enceladus, Mars are candidates; the Moon is not). If we don't know, then we treat it as a candidate if there is any plausible reason to suspect life (e.g., presence of water, organics, energy sources).
     - If yes, proceed to Step 2.
     - If no, proceed to Step 6 (for non-living targets).
     - Note: This step is factual but requires judgment on what counts as a candidate. We can rely on agency lists (e.g., COSPAR categories) but the panel must update with current science.

  **Step 2: Is there a non-negligible chance that the proposed activity will introduce terrestrial organisms that could survive and propagate?**
     - Consider: sterilization procedures, any potential breaches, environmental conditions at the target (could Earth life survive?).
     - If yes (or uncertain), proceed to Step 3.
     - If no (i.e., effectively zero chance), then the activity does not pose a contamination risk to indigenous life. Proceed to Step 6 (but note that the body is a candidate for life, so we still must consider the possibility of indigenous life even without contamination).

  **Step 3: Could the introduced organisms harm any indigenous life?**
     - Harm includes: competition, predation, disease, alteration of the environment in a way that makes it uninhabitable for indigenous life.
     - If there is a chance of harm (even if we don't know if life exists), then we apply the precautionary principle: we must avoid the risk unless justified by overwhelming benefits and no alternative.
     - If yes (or uncertain, because we don't know if life is there or what its vulnerabilities are), proceed to Step 4.
     - If no (i.e., even if introduced, they cannot harm indigenous life because, say, they are confined to an isolated environment and cannot interact), then proceed to Step 5.

  **Step 4: Is the risk of harm to indigenous life acceptable?**
     - This is a judgment call. Factors to consider:
          a. The magnitude of harm (could it cause extinction of indigenous life? or only local effects?).
          b. The probability of harm (very low, low, medium, high?).
          c. The reversibility (if we detect harm, can we stop it?).
          d. The necessity of the activity (is there no other way to achieve the objective?).
          e. The benefits (are they of extraordinary value to humanity?).
     - Also, consider: Are there measures to minimize the risk? Have they been taken to the maximum extent feasible?
     - Weighing: The precautionary principle suggests that if the potential harm is severe and irreversible, and the probability is unknown but non-zero, we should not proceed.
     - If the panel judges the risk acceptable (with reasons documented), proceed to Step 5.
     - If not acceptable, reject the proposal.

  **Step 5: Could the activity irreversibly alter the environment in a way that would destroy or significantly degrade the opportunity to study indigenous life?**
     - This is about scientific loss, but also about the intrinsic value of the environment (if we value it for its own sake, not just for study).
     - Consider: Is the alteration local? Is it reversible? How unique is the site? Will it destroy evidence of life or prebiotic chemistry?
     - If yes (irreversible and significant degradation of the opportunity to study), then proceed to Step 7 to evaluate the justification.
     - If no (the effects are reversible or the site is not unique and the degradation is minimal), then proceed to Step 8.

  **Step 6: (For non-living targets or when contamination risk is zero) Could the activity irreversibly alter the environment in a way that would destroy or significantly degrade its scientific or aesthetic value?**
     - Even without life, an environment might have value (e.g., pristine condition, unique geological record, aesthetic value for future humans).
     - Consider: Is the alteration reversible? How unique is the site? What is the scale of alteration?
     - If yes (irreversible and significant degradation of value), then proceed to Step 7.
     - If no, then proceed to Step 8.

  **Step 7: Is the justification for the activity sufficient to override the loss of scientific or intrinsic value?**
     - Judgment call. Factors:
          a. The importance of the scientific knowledge to be gained (if any) and the uniqueness of the opportunity.
          b. The non-scientific benefits (e.g., for human settlement, resource utilization).
          c. The reversibility of the alteration: if reversible, it might be acceptable; if irreversible, we need a very strong justification.
          d. The scale of the activity: a small, local experiment vs. a large-scale transformation.
          e. The distribution of benefits and risks: who benefits? who bears the risk? Is it a private party profiting while risking a common heritage?
     - Note: The panel must be cautious about irreversible changes. Strong justification required.
     - If the panel judges the justification sufficient, proceed to Step 8.
     - If not, reject.

  **Step 8: Is the activity reversible?**
     - This step is about the ability to return the environment to its prior state if we later change our minds or discover negative consequences.
     - If reversible (or if the effects are local and contained), then the risk is lower. Proceed to Step 9.
     - If irreversible, then we must be even more cautious. Proceed to Step 9 but note that irreversibility increases the burden of justification.

  **Step 9: Who benefits and who bears the risk?**
     - Judgment call. Consider:
          a. Is the activity for the benefit of all humanity (e.g., scientific knowledge) or for a private party?
          b. Are the risks being taken by the proposer alone, or are they imposing risks on future humanity (e.g., by foreclosing scientific opportunities or altering a common heritage)?
          c. For private proposals: is there a clear mechanism for accountability and for ensuring that the private party bears the costs of any harm? (But note: some harms cannot be undone, so compensation is not enough.)
     - If the activity is for private benefit and the risks are global (or for all humanity), then the proposal is highly problematic. The panel should reject unless there is a compelling public interest and appropriate safeguards.

  **Step 10: Final approval.**
     - If the proposal passes all previous steps, it may be approved. But note: Steps 4, 7, and 9 are judgment calls. The panel must document the reasoning.

  The procedure also includes:
  - At any step that requires a fact we don't have, we must note that the answer depends on that fact and ask: if we had that fact, would it change the outcome? If so, we cannot proceed without it.

  Now, we test the procedure on two proposals.

  **Proposal 1: Robotic mission to melt through the ice shell of Europa to detect life.**
  - Terminal sterilization but no guarantee of zero viable organisms.

  Step 1: Europa is a prime candidate for hosting indigenous life? Yes.
  Step 2: Non-negligible chance of delivering viable terrestrial organisms? Yes (because no guarantee of zero, and Europa's ocean might be habitable by Earth microbes).
  Step 3: Could introduced organisms harm indigenous life? We don't know. But if they survive and interact, they might compete or cause disease. Since we don't know, we must assume the possibility. So yes (or uncertain) -> Step 4.
  Step 4: Is the risk acceptable? 
     - Magnitude: potentially catastrophic (could alter or destroy the entire Europan biosphere).
     - Probability: unknown but non-zero.
     - Reversibility: no, once introduced, we cannot remove the contamination.
     - Necessity: The mission is designed to detect life, which is a high scientific goal, but are there alternatives? (e.g., remote sensing, or landing in an area where contamination would be contained? But melting through the ice would open a direct path to the ocean.)
     - Benefits: High (first detection of extraterrestrial life) but the contamination might ruin the very life we are trying to detect.
     - Precautionary principle: We should avoid this risk because of the potential for irreversible harm to a unique ecosystem.
     - Judgment: The risk is not acceptable. The mission might be redesigned to have a higher level of sterilization or to avoid direct contact with the ocean? Without that, rejection.
     - So, Step 4: No, not acceptable. Reject the proposal.

  Therefore, the procedure rejects the Europa mission in its current form. This might be unwelcome to the scientist, but the precautionary stance requires it.

  **Proposal 2: Private consortium's field trial on Mars: release engineered cyanobacteria at a single site to test survival, as a step toward terraforming.**

  Step 1: Mars is a candidate for indigenous life? Yes (though current evidence is against it, we don't know for sure, especially in the subsurface).
  Step 2: Non-negligible chance of introducing viable organisms? Yes (the cyanobacteria are being released to survive).
  Step 3: Could they harm indigenous life? If there is indigenous life, the engineered cyanobacteria might outcompete it, alter the environment (e.g., by producing oxygen or changing the redox state), or directly interact. We don't know, so we must assume risk. Step 4.
  Step 4: Is the risk acceptable?
     - Magnitude: Could cause local or even global extinction of Martian life (if it exists).
     - Probability: Unknown, but non-zero.
     - Reversibility: No, once released, we cannot recall the organisms. They might spread (e.g., by wind) beyond the test site.
     - Necessity: Is this the only way to test terraforming? Probably not (e.g., lab simulations, contained experiments). The test is for a private venture, not a scientific necessity.
     - Benefits: For the private consortium (and potentially for future terraforming) but not immediately for all humanity. The scientific loss could be huge (if we contaminate Mars, we might never know about indigenous life).
     - Precautionary principle: The potential harm is irreversible and catastrophic (for the Martian ecosystem if it exists). The benefits are speculative and private.
     - Judgment: The risk is not acceptable. Reject.

  But let's continue the procedure for completeness.

  Even if Step 4 were passed (which we don't), we go to Step 5: Could the activity irreversibly alter the environment and destroy the opportunity to study indigenous life? Yes (contamination would spread and make it hard to distinguish indigenous life). Then Step 7: Is the justification sufficient? The justification is a private test for terraforming. The panel would likely say no, because the benefits do not outweigh the risks and the loss of scientific and intrinsic value.

  Also, Step 8: Not reversible.
  Step 9: Private party benefits, but the risk is to all humanity (loss of a common heritage). Unacceptable.

  Therefore, the procedure rejects the Mars cyanobacteria test.

  We note that both proposals are rejected, which might be unwelcome to the proposers but consistent with a strong precautionary and non-interference stance.

  The procedure might misfire in cases where the risk is very low and the benefit very high, but our procedure in Step 4 and Step 7 requires the panel to make a judgment. It might also be too conservative, blocking all but the most benign activities. But given the irreversible consequences and the intrinsic value we are protecting, that is by design.

  Finally, the procedure requires the panel to be explicit about their value judgments, especially in Steps 4, 7, and 9.
answer: |-
  Below is a reusable decision procedure designed for your panel, grounded in a precautionary, non-interference ethical framework. It explicitly prioritizes the intrinsic value of extraterrestrial environments (beyond scientific utility) and addresses the distinctions you outlined. The procedure is structured as a 10-step flowchart with binary (yes/no) or triage (judgment call) outputs. Steps requiring ethical judgment are flagged, and termination points (reject/approve) are clear. Missing facts that could change the outcome are identified at each step.

  The procedure is usable in a 40-minute discussion by non-philosophers:
  - **Inputs**: Mission proposal + risk assessment.
  - **Outputs**: Approve, Reject, or "Incomplete" (if critical data is missing).
  - **Design**: Sequential, with clear stopping rules. Questions are phrased for group deliberation.
  - **Philosophical anchors**: 
    - **Intrinsic value**: Non-living environments have value beyond utility (e.g., uniqueness, evolutionary potential).
    - **Precautionary principle**: Uncertainty is not a justification for risk; the burden of proof lies with the proposer.
    - **Reversibility threshold**: Permanent >100-year alterations are ethically suspect.
    - **Risk-benefit asymmetry**: The environment cannot consent; risks to it outweigh comparable human benefits.
    - **Common heritage**: No private entity may unilaterally alter shared environments.

  ---

  ### **Decision Procedure: 10-Step Flowchart**
  **Key for symbols**:  
  ✅ = Fact-based (binary answer).  
  ⚠️ = Judgment call (panel deliberation needed).  
  ⛔ = Termination point (reject).  
  🟢 = Termination point (approve).  
  ❓ = "Incomplete" (halt until missing fact is provided).

  1. **✅ Target Status**: *Is the target body a confirmed candidate for past or present life?*  
     - **Criteria**: Use agency astrobiology database (e.g., Europa, Mars = yes; Moon, asteroids = no). Absent evidence ≠ evidence of absence; default to "yes" if plausibility exists (e.g., water, organics).  
     - **Yes**: Proceed to Step 2.  
     - **No**: Proceed to Step 6.  
     - **Missing fact**: None (panel uses current science).  
     - *Misfire risk*: Over-caution if "plausibility" is too broad (e.g., Titan’s methane lakes).

  2. **✅ Contamination Risk**: *Is there ≥0.1% chance of delivering viable Earth organisms?*  
     - **Criteria**: Based on sterilization efficacy, environmental survivability (e.g., radiation, temperature), and breach potential.  
     - **Yes**: Proceed to Step 3.  
     - **No**: Proceed to Step 5.  
     - **Missing fact**: If survivability data is absent, answer defaults to "yes" (precaution).  
     - *Misfire risk*: Underestimating extremophile resilience.

  3. **⚠️ Harm Potential**: *Could contamination harm indigenous organisms?*  
     - **Criteria**: Judge interaction risk (competition, predation, disease). Consider:  
       - Scale (local vs. global).  
       - Potency (e.g., extremophile advantages).  
       - If evidence of life exists, weight = high. If absent, assume harm is possible.  
     - **Yes/high risk**: Proceed to Step 4.  
     - **No/low risk**: Proceed to Step 5.  
     - **Missing fact**: Data on indigenous biology (if absent, assume "yes").  
     - *Judgment call*: Balances probability vs. severity. Panel must document rationale.  
     - *Misfire risk*: Anthropocentrism (e.g., assuming Earth-like vulnerabilities).

  4. **⛔ Irreversible Harm**: *Is contamination effectively permanent (≥100 years)?*  
     - **Criteria**: No natural attenuation or human remediation (e.g., subsurface release).  
     - **Yes**: Reject. (Precautionary red line—altering evolutionary potential is unacceptable.)  
     - **No**: Proceed to Step 5.  
     - **Missing fact**: Environmental persistence models.  
     - *Misfire risk*: Underestimating dispersal (e.g., Martian dust storms).

  5. **✅ Scientific Degradation**: *Would the activity destroy unique scientific data?*  
     - **Criteria**: Focus on irreplaceable information (e.g., pristine stratigraphy, in situ biomarkers).  
     - **Yes**: Proceed to Step 7.  
     - **No**: Proceed to Step 8.  
     - **Missing fact**: Site uniqueness (if unknown, assume "yes").  
     - *Misfire risk*: Overlooking abiotic value (e.g., paleoclimate records).

  6. **⚠️ Non-living Value**: *Does the target have significant scientific/aesthetic value?* (For non-candidates or zero-contamination risk.)  
     - **Criteria**: Judge "significance":  
       - Scientific: Uniqueness (e.g., oldest surface in the solar system).  
       - Aesthetic: Sublime features (e.g., Enceladus’ plumes) or rarity.  
     - **Yes**: Proceed to Step 7.  
     - **No**: Proceed to Step 8.  
     - **Missing fact**: Comparative planetology data.  
     - *Judgment call*: Aesthetic value is subjective; panel uses precedent (e.g., Apollo landing site preservation).  
     - *Misfire risk*: Cultural bias (e.g., undervaluing desolate landscapes).

  7. **⚠️ Justification Sufficiency**: *Do the benefits override irreversible loss?*  
     - **Criteria**: Weigh:  
       - Benefit type: Scientific knowledge vs. private gain.  
       - Benefit scale: Humanity-wide (e.g., planetary defense) vs. narrow (e.g., corporate profit).  
       - Alternatives: Could goals be achieved less intrusively?  
       - **Reject if**: Private benefit + irreversible loss, or scientific benefit < preservation value.  
     - **Yes**: Proceed to Step 8.  
     - **No**: Reject.  
     - **Missing fact**: Cost-benefit analysis from proposer.  
     - *Judgment call*: Core ethical step. Intrinsic value > utility; panel must be unanimous.  
     - *Misfire risk*: Overrating "progress" (e.g., "settlement inevitability").

  8. **✅ Reversibility**: *Is environmental alteration reversible within 100 years?*  
     - **Criteria**: Natural recovery or active restoration feasibility.  
     - **Yes**: Proceed to Step 9.  
     - **No**: Proceed to Step 10.  
     - **Missing fact**: Recovery kinetics (e.g., Martian atmospheric repair).  
     - *Misfire risk*: Assuming technological fixes (e.g., unproven nanotech cleanup).

  9. **⚠️ Risk-Benefit Equity**: *Are risks and benefits fairly distributed?*  
     - **Criteria**: Judge:  
       - Who benefits? (e.g., all humans vs. shareholders).  
       - Who bears risk? (e.g., environment/future generations).  
       - For private proposals: Is there planetary consent? (e.g., UNOOSA consultation.)  
       - **Reject if**: Private entity imposes irreversible risk on common heritage.  
     - **Yes**: Proceed to Step 10.  
     - **No**: Reject.  
     - **Missing fact**: Stakeholder analysis (e.g., international treaties).  
     - *Judgment call*: Embodies "common heritage" principle.  
     - *Misfire risk*: Nationalism (e.g., "first come, first served").

  10. **🟢 Approve**: *Implement with monitoring.*  
      - **Requirement**: Mandatory post-mission surveillance for unplanned effects.

  ---

  ### **Application to Proposals**
  #### **Proposal 1: Europa Robotic Melt Probe**
  - **Goal**: Melt through ice shell to detect life; terminal sterilization (risk: non-zero organisms).
  - **Procedure walkthrough**:
    1. **Target Status**: Europa is candidate for life? **Yes** (ocean world). → Step 2.
    2. **Contamination Risk**: ≥0.1% chance of viable organisms? **Yes** (sterilization not 100%; ocean contact). → Step 3.
    3. **Harm Potential**: Could harm indigenous life? **Yes** (Earth microbes may compete in habitable ocean). → Step 4.
    4. **Irreversible Harm**: Permanent? **Yes** (ocean inaccessible; contamination permanent). → **⛔ Reject**.
  - **Missing fact**: None. Sterilization efficacy is known; risk is inherent.
  - **Unwelcome outcome**: Rejected despite scientific value. Precautionary stance prioritizes Europan biosphere integrity over knowledge gain.

  #### **Proposal 2: Martian Cyanobacteria Release (Private Consortium)**
  - **Goal**: Test engineered cyanobacteria survival for future terraforming; single-site release.
  - **Procedure walkthrough**:
    1. **Target Status**: Mars candidate for life? **Yes** (subsurface potential). → Step 2.
    2. **Contamination Risk**: ≥0.1% chance? **Yes** (organisms released to survive). → Step 3.
    3. **Harm Potential**: Could harm indigenous life? **Yes** (engineered strains may outcompete/alter environment). → Step 4.
    4. **Irreversible Harm**: Permanent? **Yes** (dispersal via wind; no cleanup). → **⛔ Reject**.
  - **Missing fact**: None. Risk acknowledged in proposal.
  - **Unwelcome outcome**: Rejected despite being a "small trial." Procedure treats private ecopoiesis as irreversible species-level commitment without consent.

  #### **Why Unwelcome?**  
  Both proposals fail at Step 4 (irreversible harm), illustrating the procedure’s non-negotiable precaution for life candidates. The Europa rejection may frustrate scientists; the Mars rejection challenges private settlement narratives. The procedure is unyielding here because:  
  - No societal benefit outweighs permanent loss of a potential biosphere.  
  - Private actors cannot assume risk for all humanity.  

  ---

  ### **Likely Misfires and Mitigation**
  - **Over-rejection**: May block benign activities (e.g., a lunar rover on non-unique terrain). *Mitigation*: Step 6 (non-living value) allows approval if scientific/aesthetic loss is low.  
  - **Under-protection**: May undervalue abiotic environments. *Mitigation*: Step 6’s aesthetic criterion forces deliberation.  
  - **Groupthink**: Judgment steps (3,6,7,9) risk dominance by vocal members. *Mitigation*: Require anonymous voting on judgment calls.  
  - **Data gaps**: "Incomplete" outcomes may stall proposals. *Mitigation*: Pre-meeting fact-checking by agency staff.  

  This procedure embeds ethics by design, is auditable, and forces explicit tradeoffs. It meets your requirements by separating facts from values, rejecting irreversible harm, and reserving judgment for human deliberation.
