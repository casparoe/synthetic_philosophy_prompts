answer: |-
  ### Reverse-Engineering the Moral Algorithm  
  Your friend's decisions suggest a pattern where both **relationship strength** and **group size** matter, but not in a simple additive way. Let's break this down step by step.

  #### Brainstorming  
  The key features in these cases are:  
  - **Number of lives**: In pure stranger-vs-stranger scenarios, she defaults to utilitarianism (saving more lives).  
  - **Relationship type**: She distinguishes between strangers, distant family (cousins), and close friends.  
  - **Relationship strength**: Closeness matters—e.g., a "close friend" overrides large numbers of strangers, but a cousin she hasn't seen in years does not.  
  - **Threshold effects**: There might be a "closeness threshold" where certain relationships (like close friends) trigger an exception to the numbers-based rule.  
  - **Indifference at parity**: When all else is equal (e.g., 1 vs. 1 strangers), she defaults to randomness.  

  Notably, **time since last contact** (e.g., the 10-year gap with the cousin) appears to weaken family ties, making them functionally equivalent to strangers in some cases. The challenge is modeling how relationship strength interacts with group size.

  #### Candidate Rules  
  Based on the test cases, here are 2–3 precise rules that fit all her verdicts. Each prioritizes saving the group with the highest "value," where value combines relationship weight and headcount.  

  **Rule 1: Closeness Threshold with Utilitarian Fallback**  
  - If one group contains a person with **"close" relationship** (e.g., close friend), save that group regardless of numbers.  
  - Otherwise, save the larger group (with ties resolved randomly).  
  - *Relationship weights*: "Close" is binary (applies only to strong ties like active close friends). All others (strangers, distant cousins) are treated equally.  

  **Rule 2: Weighted Utilitarianism**  
  - Assign weights to individuals:  
    - Stranger: 1  
    - Distant cousin: *W_c* (where 1 ≤ *W_c* < 5, based on case 5)  
    - Close friend: *W_f* (where *W_f* > 100, based on cases 2–3)  
  - Save the group with the higher total weight.  
  - For strangers vs. strangers, equal weight → coin flip.  

  **Rule 3: Modified Lexical Priority**  
  - Save a close friend over any number of strangers (lexical priority for closeness).  
  - For non-close individuals (strangers, distant cousins), save the larger group.  
  - Ties (same group size or value) → coin flip.  

  All three rules fit the existing cases:  
  - **1 vs. 5 strangers**: Rules 1–3 save the 5 (larger group).  
  - **1 friend vs. 5/100 strangers**: Rules 1–3 save the friend (closeness exception).  
  - **1 vs. 2 strangers**: Rules 1–3 save the 2 (larger group).  
  - **1 cousin vs. 5 strangers**: Rules 1–3 save the 5 (cousin not "close," or *W_c* < 5).  
  - **1 vs. 1 strangers**: Rules 1–3 → coin flip (parity).  

  #### Predictions for 1 Cousin vs. 2 Strangers  
  - **Rule 1 (Threshold)**: Cousin isn’t "close" → save the larger group (2 strangers).  
  - **Rule 2 (Weighted)**: Compare *W_c* (cousin) vs. 2 (strangers). Since *W_c* < 5 (from case 5) but *W_c* ≥ 1, outcomes depend on *W_c*:  
    - If *W_c* < 2 (e.g., cousin = 1.2), save 2 strangers.  
    - If *W_c* = 2, tie → coin flip.  
    - If *W_c* > 2 (e.g., cousin = 3), save cousin.  
  - **Rule 3 (Lexical)**: Cousin isn’t "close" → save the larger group (2 strangers).  

  #### Best Guess  
  She’s most likely using **Rule 1 (Closeness Threshold with Utilitarian Fallback)**. Here’s why:  
  - It’s the simplest model that avoids arbitrary weights (Rule 2 requires defining *W_c*, which isn’t constrained by the data).  
  - It explains all cases cleanly: Only "close" relationships (like active close friends) override group size; everything else defaults to saving more lives. The cousin, given the 10-year gap, isn’t "close," so she defaults to utilitarianism.  
  - Rule 3 is functionally identical to Rule 1 here, but Rule 1 explicitly defines the threshold. Rule 2 is overcomplicated—why would she assign *W_c* > 1 when she treated the cousin identically to a stranger in case 5?  
  **Prediction for 1 cousin vs. 2 strangers**: She saves the 2 strangers.  

  #### Litmus Test  
  Propose this new case: **1 sibling (whom she sees monthly) vs. 3 strangers**.  
  - **Rule 1 (Threshold)**: If "close" includes active siblings, save the sibling. If not (only close friends), save the 3 strangers.  
  - **Rule 2 (Weighted)**: Depends on sibling weight (*W_s*). If *W_s* > 3, save sibling; if *W_s* < 3, save strangers; if equal, coin flip.  
  - **Rule 3 (Lexical)**: If "close" includes siblings, save sibling. If not, save the 3 strangers.  

  **How this distinguishes rules**:  
  - If she saves the sibling, Rule 1/Rule 3 imply "close" extends beyond friends to active family. Rule 2 requires *W_s* > 3.  
  - If she saves the 3 strangers, Rule 1/Rule 3 imply siblings aren’t "close," and Rule 2 requires *W_s* ≤ 3.  
  - A coin flip would support Rule 2 with *W_s* = 3.  

  **Contradictions in existing cases?** None—all verdicts are consistent. But note: Her refusal to save the cousin over 5 strangers (case 5) suggests "distant family" has no special weight, simplifying the model.  

  **Final prediction for your case**: She saves the 2 strangers. Test this and the litmus case to confirm!
