  i've been going back and forth with a friend about this whole "who do you save" thing — you know, the trolley problem's less complicated cousin where you just have to choose between rescuing one person or a group of people, no switching tracks or pushing fat men. anyway i started writing down her answers to different versions and now i'm trying to figure out what algorithm she's running. here's the test cases:

  - 1 stranger vs 5 strangers → save the 5
  - 1 close friend vs 5 strangers → save the friend
  - 1 close friend vs 100 strangers → save the friend
  - 1 stranger vs 2 strangers → save the 2
  - 1 cousin she hasn't seen in 10 years vs 5 strangers → save the 5
  - 1 stranger vs 1 stranger → coin flip, no reason to pick either

  now i want to predict what she'd say about: 1 cousin she hasn't seen in 10 years vs 2 strangers.

  i'm a software engineer so i'm thinking about this like reverse-engineering a function from its input-output behavior. i want the simplest function that fits all the test cases, and then i want to see what it outputs on the new input.

  can you put on your moral philosophy hat and walk me through this? please think through it step by step — maybe start by brainstorming what features of the cases could even matter (numbers? relationship type? relationship strength? something else?) and then narrow it down.

  format the response with these sections:

  - Brainstorming (a paragraph or two sketching possible factors and rules)
  - Candidate Rules (2-3 rules that fit all her verdicts, stated precisely)
  - Predictions (what each rule says about cousin vs 2 strangers)
  - Best Guess (which rule you think she's actually using and why, maybe a paragraph)
  - Litmus Test (one new case i could give her that would definatively tell the rules apart, and what each rule predicts for it)

  also if any of her verdicts contradict each other in a way i'm missing, flag that.
