answer: |-
  Below is a decision tree that maps the logical space of positions on neural network representations, designed to diagnose core philosophical commitments. The tree prioritizes concrete, empirically-grounded distinctions that force positions apart, avoiding superficial labeling. It reflects my stance on the **real fault lines** in the debate: (1) whether representations are *stance-independent*, (2) whether content is *determinate*, and (3) whether representational descriptions are *explanatorily indispensable*. Positions collapse where distinctions don't withstand scrutiny (e.g., "causal structuralism" reduces to structural realism). Unoccupied regions are flagged.

  ---

  ### **Decision Tree: Do Neural Networks Have Genuine Representations?**
  *Start at Question 1. Answer based on your commitments about what constitutes representation and explanation.*

  #### **Question 1: Stance-Independence**  
  *When a neural network component (e.g., a neuron, attention head) exhibits consistent correlations with a feature (e.g., "dog spots" in images), is there a fact of the matter about what it represents—independent of human interpretation?*  
  - **Yes** → Proceed to **Question 2**.  
  - **No** → Proceed to **Question 4**.  

  **Why this?**  
  This is the deepest fault line. Realists (strong/structural) demand stance-independent facts; non-realists (instrumentalist/Dennett/eliminativist) deny them. Cases like **polysemantic neurons** (single neurons activating for distinct concepts) test this: realists see ambiguity to resolve; non-realists see proof of imposed categories.

  ---

  #### **Question 2: Determinacy of Content**  
  *If there is a stance-independent fact, is the representational *content* fully determinate (e.g., a "curve detector" neuron represents *curvature itself*, not just curvature-correlated signals)?*  
  - **Yes** → Your position: **Strong Realism**.  
  - **No** → Proceed to **Question 3**.  

  **Strong Realism Explained**  
  Networks have discrete, discoverable representations (e.g., "dog detector" neurons). Mechanistic interpretability (e.g., feature visualization, activation patching) reveals these. *Example*: A neuron that fires only for cat faces, across diverse inputs, has a determinate content. Critics argue this ignores **underdetermination**: training data rarely pins down one unique interpretation (e.g., "cat fur" vs. "feline eyes" could activate the same neuron).

  ---

  #### **Question 3: Structural Discoverability**  
  *If content is indeterminate, is there still a real, discoverable *structure* of representational roles (e.g., hierarchical feature decompositions, geometric relations in activation space) that causally explains network behavior?*  
  - **Yes** → Your position: **Structural Realism**.  
  - **No** → *Empty leaf (incoherent)*.  

  **Structural Realism Explained**  
  Representational *structure* is real (e.g., residual streams decompose inputs into vectors for "shape," "texture"), but semantic labels ("this vector *means* edges") are context-dependent. *Example*: Activation spaces have stable subspaces for abstract concepts (e.g., "grammar" in LLMs), even if labels vary. **Collapse note**: "Causal structuralism" (e.g., focus on circuits) reduces here—it presupposes real structure. The "No" branch is incoherent: denying both content determinacy *and* structure leaves no stance-independent fact to ground realism.

  ---

  #### **Question 4: Explanatory Indispensability**  
  *If representations are stance-dependent, are they still *explanatorily indispensable* for understanding network behavior (i.e., purely mechanistic descriptions miss key patterns)?*  
  - **Yes** → Proceed to **Question 5**.  
  - **No** → Your position: **Eliminativism**.  

  **Eliminativism Explained**  
  Representation-talk is misleading; networks are just mechanistic systems (e.g., matrices transforming vectors). Interpretability should describe computations (e.g., "Layer 3 amplifies high-frequency signals") without invoking "meaning." *Example*: Predicting model outputs requires only weights and activations, not semantic labels. Critics argue this ignores **emergent capabilities** (e.g., in-context learning) best explained representationally.

  ---

  #### **Question 5: Stance-Relative Facts**  
  *Are representational facts *real but relative* to an interpretive stance (e.g., the choice to attribute "beliefs" or "goals" to the system)?*  
  - **Yes** → Your position: **Dennett-Style Intentional-Stance Realism**.  
  - **No** → Your position: **Instrumentalism**.  

  **Dennett-Style Realism Explained**  
  Representations exist *only* relative to a stance (e.g., interpreting an LLM as "believing" its outputs). Interpretability reveals stance-relative truths, but no stance is uniquely "correct." *Example*: The same attention head can be interpreted as "caring about syntax" or "tracking word order"—both valid under different stances. Contrasts with instrumentalism by affirming reality *within* a stance.  

  **Instrumentalism Explained**  
  Representations are useful fictions we impose to simplify predictions/explanations, but networks have no intrinsic representational properties. *Example*: Feature visualization creates interpretable images, but these are post hoc stories, not discoveries. **Collapse note**: "Pragmatism" and "fictionalism" reduce here—all deny stance-relative *facts*.

  ---

  ### **Unoccupied Regions & Collapsed Distinctions**
  1. **Incoherent region** (Q3 → No):  
     Denying *both* content determinacy *and* structural reality while asserting stance-independence is self-defeating. No coherent position occupies this space.  
     
  2. **Unexplored region** (Q1 → Yes, but representations are *non-discoverable*):  
     A "mysterian realism" (representations exist but are epistemically inaccessible) is logically possible but unattractive—it voids interpretability’s goals. Rarely defended.  

  3. **Collapsed distinctions**:  
     - **Causal structuralism vs. structural realism**: Both agree on real structure with indeterminate content (Q2 → No; Q3 → Yes). Differences are methodological, not metaphysical.  
     - **Eliminativism vs. radical behaviorism**: Both reject representations (Q4 → No). "Radical behaviorism" is eliminativism applied to inputs/outputs.  
     - **"Biological realism" (teleosemantics)**: Reduces to strong realism if content is determinate (Q2 → Yes), or structural realism if not (Q3 → Yes). Adds no new leaf.  

  ---

  ### **Why These Distinctions Matter for Interpretability**
  - **Strong realism** justifies interpretability as "discovery" of ground-truth features. Success means alignment with network ontology.  
  - **Structural realism** shifts focus to finding *structures* (e.g., superposition, circuits), with labels as pragmatic tools.  
  - **Dennett-style realism** makes interpretability stance-relative—success requires choosing a useful stance.  
  - **Instrumentalism** frames interpretability as model-building for human use, not truth.  
  - **Eliminativism** rejects interpretability’s goals; research should quantify mechanics, not "meaning."  

  This tree defends a **contentious claim**: Stance-independence (Q1) is the root split. Non-realists (Q1 → No) share a core commitment: representations require an interpreter. Realists (Q1 → Yes) split on whether content is exhaustively determined by the system (Q2). The tree forces positions into open disagreement on cases like **polysemantic neurons** or **equivocal feature visualizations**, avoiding motte-and-bailey retreats.
