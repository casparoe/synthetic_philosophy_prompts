  The irony aspect is crucial. Literary theory (Booth's "The Rhetoric of Fiction") says stable irony relies on shared cues between author/audience. Here, those cues failed because the think tank either missed or ignored context. That's not the user's fault per se, but it exposes the risk of layered writing for policy debates where nuance dies.

  Practically... 
