prompt: |-
  I run a small AI safety reading group, and last week we discussed how one should evaluate a proposed alignment technique. Two of the members, Mara and Jonah, got into a long argument that none of us could referee. I'll reproduce the exchange as best I can, because I'd like you to adjudicate it.

  Mara opened with the claim that when we ask whether an alignment method is safe, the only standard that matters is worst-case behavior. Deployment is adversarial, she said: if there is any input or environment where the system misbehaves, someone or something will eventually find it, and an average-case guarantee is a statement about the world staying friendly, which is exactly what alignment cannot assume. Jonah replied that for learned systems the worst case is not something we can compute or even approximate; the space of environments is too large and the model's behavior too opaque, so a "worst-case guarantee" is either vacuous, holding only for a toy formalization, or it is a claim about a finite test suite, which is just a small-sample estimate of average behavior. Mara answered that our inability to compute the exact worst case does not license retreating to the average; it licenses trying harder to approximate the worst case, through adversarial training, red-teaming, and expanding the set of hard cases, whereas lowering the bar to typical behavior gives the appearance of rigor while ignoring the part of the distribution that matters. Jonah shot back that adversarial training and red-teaming are themselves average-case evaluations over the distribution of attacks we happened to generate: we have replaced the original distribution with a slightly different one and then reported typical performance under it, so calling the result "worst-case" is a relabeling rather than a different kind of guarantee.

  At that point Jonah shifted to a cost argument: no useful learned system will ever satisfy a true worst-case requirement, so demanding one means refusing to deploy anything, and that refusal is itself a risky decision. A system that is safe in almost all realistic cases, with monitoring and the ability to shut it down, can be better than the perfect system that does not exist. Mara replied that this only works if the remaining cases are minor; if the tail contains catastrophic failures, the average can look excellent while the policy is reckless, and "realistic cases" is exactly the set an adversary or a distribution shift will leave. For sufficiently high stakes, she said, a small probability of disaster dominates the calculation. Jonah then pressed on the notion of a worst case itself: once an adversary can optimize against the deployed system, there is no maximally bad input, just an escalating arms race, so the only meaningful question is how robust the system is across a distribution of plausible shifts, which is an average-case question about the shift distribution. Mara denied that this was average-case reasoning; it is worst-case over the adversary's capabilities rather than over nature's distribution, she said, so Jonah had moved the guarantee up a level while keeping its structure, which was exactly her point.

  I'd like you to adjudicate this exchange move by move: for each step in the back-and-forth, say who is right about what, where the other's reply goes wrong or changes the subject, and rate that move from clearly mistaken to clearly right. Then say what, if anything, both of them are missing, and give an overall verdict on which of the two is more right, not merely that each has a point. Please take a definite position at each step and overall, with reasons, rather than surveying the options and leaving me to choose. And please write the whole thing as continuous prose, the way you would write an email or a letter: no headings, no bullet points, no bold text, and no tables.
reasoning: |-
  Okay, the user runs an AI safety reading group and needs help adjudicating a debate between Mara and Jonah about evaluating alignment techniques. Mara argues for worst-case guarantees while Jonah advocates for average-case approaches. The user wants a clear, point-by-point analysis with definitive judgments, not just a summary of both sides.

  First, I need to unpack Mara's opening salvo. She's right that adversaries will exploit any vulnerability, making worst-case critical for high-stakes AI. But Jonah's counter hits a real limitation: we can't compute true worst-case for complex learned systems. His "vacuous or test-suite" dichotomy feels accurate - most "worst-case" claims in ML are actually bounded adversarial evaluations. 

  When Mara says this justifies trying harder via red-teaming, Jonah nails the weakness: those are still average-case over the attack distribution. His relabeling point is sharp - calling it "worst-case" is misleading. Still, Mara's insistence on not retreating to average is valid for catastrophic risks. 

  Jonah's cost argument is pragmatic but dangerous. Mara correctly notes that "realistic cases" can exclude adversarial scenarios. His shutdown argument assumes failures are containable, which may not hold for fast-acting AI risks. 

  The arms race point is Jonah's strongest: true worst-case doesn't exist against adaptive adversaries. But Mara's rebuttal holds - shifting to adversary capabilities is still worst-case reasoning, just meta. She's consistent in demanding worst-case guarantees at whatever level necessary.

  Both miss key nuances though. Mara underestimates how "worst-case" must be defined relative to threat models, not absolutely. Jonah overlooks that some systems (like aviation) do achieve near-worst-case safety through layered defenses. They're also talking past each other on "average-case" - Jonah means empirical robustness while Mara fears unknown unknowns.

  Overall, Mara's position is more principled for existential risks. We can't compute perfect worst-case guarantees, but conceding to average-case is exactly what creates single points of failure. The solution is to build systems where even unanticipated failures have mitigation layers - which satisfies Mara's safety requirement while acknowledging Jonah's computability concerns.
answer: |-
  In Mara's opening claim that worst-case behavior is the only valid standard for alignment safety, she is fundamentally correct about the core principle: for systems where a single failure can be catastrophic (e.g., AGI), average-case performance is insufficient because adversaries or rare events *will* exploit vulnerabilities. However, Jonah's reply correctly identifies the practical impossibility: computing the true worst-case over all possible environments for complex learned systems is intractable, and claims of "worst-case guarantees" are often misleading simplifications. Jonah is right that such guarantees typically reduce to finite testing or formalized toy models, which are inherently limited. Mara's counter—that intractability justifies red-teaming and adversarial training rather than retreating to average-case—is partially valid but overlooks Jonah’s deeper point: these methods *do not approximate the true worst case*; they create a *new* distribution (of human-generated attacks) and measure average performance under *that* distribution. Jonah’s "relabeling" critique here is clearly right: calling this "worst-case" is semantically inaccurate and obscures its empirical nature. Mara’s stance mistakenly conflates improved robustness with worst-case assurance.

  Jonah’s cost argument—that demanding perfect worst-case safety prevents deployment of beneficial systems—is pragmatically sound but risks complacency. He is correct that insisting on unattainable guarantees could stall progress, and that monitored systems with high empirical safety can be net-positive. But Mara’s rebuttal is stronger: for existential risks, even a "small" catastrophic tail dominates cost-benefit analysis, and defining "realistic cases" is circular if adversaries *shift* what is realistic. Jonah’s position underestimates how tail risks scale with adversary ingenuity. Mara rightly notes that average performance masks reckless policies when failures are asymmetric.

  Jonah’s final move—that adaptive adversaries make "worst-case" undefined due to endless escalation—is insightful but ultimately a misstep. He correctly notes that robustness must be measured over shifting threat distributions, but wrongly frames this as purely average-case. Mara’s reply is decisive: reasoning about adversarial *capabilities* (e.g., "safe against any attacker with compute ≤ X") *is* worst-case analysis at a meta-level. Jonah’s shift doesn’t invalidate worst-case framing; it reinforces its necessity by showing safety must hold against optimized threats. Mara wins this exchange by correctly preserving the worst-case structure while Jonah inadvertently concedes her core point.

  **What both miss**:  
  First, the dichotomy is false. Real safety engineering uses *layered* assurances: formal methods for critical components (addressing Mara’s concerns), empirical robustness for learned subsystems (acknowledging Jonah’s pragmatism), and runtime monitoring for residual uncertainty. Second, "worst-case" must be *parameterized* (e.g., "safe against adversaries with bounded resources") to be meaningful; absolute worst-case is indeed vacuous, but bounded adversarial guarantees are feasible. Third, neither grapples with *dynamic* safety: a system’s safety depends on its capacity for *ongoing* adaptation and containment *during* failure, not just static guarantees.

  **Overall verdict**: Mara is more right. For alignment of high-stakes AI, worst-case reasoning (properly bounded) is non-negotiable. Jonah’s arguments expose practical and epistemological limits, but these justify refining—not abandoning—Mara’s standard. Retreating to average-case conflates "what we can measure" with "what matters," which is fatal for existential risks. The core insight remains: if a system can fail catastrophically in *any* scenario, it is unsafe, regardless of how "rare" we believe that scenario to be. Jonah’s pragmatism is necessary for deployment, but only if subordinated to Mara’s uncompromising safety logic.
