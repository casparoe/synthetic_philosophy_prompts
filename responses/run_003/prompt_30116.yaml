  Then anomalies: They're asking which ones truly fit Kuhn's definition of "stubborn facts resisting assimilation." The continental fit alone wasn't anomalous to fixists because they could dismiss it as coincidence. But paleomagnetic pole dispersion? That was irreducible noise in the fixist framework - a proper anomaly. Yet it lingered for years because... (here I need to emphasize the sociology: disciplinary boundaries, lack of cross-talk between geologists and paleomagnetists). 

  The incommensurability question is sharp. User suspects it might be overblown. Need to distinguish semantic shifts (e.g., "continent" gaining a lithospheric root vs. just crust) from core disagreements about evidence weight. The key is whether concepts *functioned* differently - like "mountain-building" being a vertical process vs. a collision effect. 

  Where Kuhn strains: The user flags the 1960s speed. Was it really a crisis-then-revolution, or did ocean data just solve puzzles too elegantly? Must confront that many fixists converted *without dying off* - which challenges Kuhn's sociology. And was it one monolithic shift? Actually, seafloor spreading acceptance (1963-66) came before full plate kinematics (1967-68) - possibly nested paradigm changes. 

  Ending requires honesty: Plate tectonics *is* Kuhnian in its sudden community flip and transformed questions... but the pre-crisis anomalies were largely ignored due to social/institutional factors Kuhn underplays. The real lesson? Paradigms control what counts as a "problem" worth solving - and for decades, continental drift wasn't one. 

