  To test further, a case where someone endorses a desire from a tainted origin but with no self-creation, like the fifth case. Another test: a person whose desires come from manipulated self-endorsement. If the friend blames in the fifth case, they prioritize endorsement; if not, history matters more. A case of manipulated endorsement could clarify if they require untainted history for responsibility.

