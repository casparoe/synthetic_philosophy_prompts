  I'm an ML researcher, mostly working on online learning, sequential prediction and model calibration, so I'm comfortable with regret bounds, proper scoring rules, Bayesian mixtures, that sort of thing. I keep hearing people in AI alignment and philosophy talk about logical induction as if it's something importantly different from what I do. From a distance it looks like online learning where the examples are logical sentences and the payoffs get decided by a market of polynomial-time traders. My hunch is that it's just no-regret learning over a weird input space and the mystique is mostly vocabulary.

  Restate the logical induction framework in the vocabulary I actually use — regret, calibration, scoring rules, universal portfolios, Bayesian mixture models, whatever genuinely maps — as faithfully as you can. Then give me the residue report: what survived the translation cleanly, what you had to fudge, and what has no counterpart in my vocabulary at all. There's a few specific things I want to know. Is the property of being unexploitable by a polynomial-time trader really just a no-regret condition, or is it doing something else? And what about the fact that the sentences a logical inductor assigns probabilities to are never revealed the way a label is — logical truth is not a data point that arrives later. Does my framework have anything for that, or is that exactly the bit that doesn't survive? I'd rather find out I'm wrong than have you force the analogy.
