prompt: |-
  Okay so my friend and I got into a long argument last night about whether evolutionary psychology is mostly just-so stories. He kept saying that for any trait you can spin an adaptive story after the fact, and I kept saying that's not fair because some of these hypotheses actually make risky predictions that could easily have failed. He said, fine, name one. And then I realized I don't have a good way of sorting out which claims is more like genuine science and which is basically unfalsifiable storytelling, so I've been stewing over it all day.

  Here's the list I've been going back and forth on. Could you sort them into tiers (say S, A, B, C) by how well each one can answer the just-so story charge—that is, how much you'd trust it as a real, testable claim rather than a post-hoc narrative—and give me a sentence for each explaining why it lands where it does? Don't worry about citations, I just want your read on the substance.

  - The Cinderella effect: children living with stepparents are at substantially higher risk of abuse or homicide than children living with both biological parents, because selection favors investing in genetic kin.
  - The cheater-detection claim: people are much better at Wason selection tasks when they're framed as social-contract/cheating problems than when framed abstractly, supposedly because we have a dedicated cheater-detection module.
  - The waist-to-hip ratio claim: men across cultures prefer a female waist-to-hip ratio around 0.7 because it's a reliable cue of fertility and health.
  - The jealousy sex-difference claim: men are more upset by sexual infidelity and women by emotional infidelity because of different selection pressures (paternity certainty vs. resource loss).
  - Pregnancy sickness as adaptation: morning sickness is a defense that keeps women from ingesting teratogenic foods during the first trimester.
  - The grandmother hypothesis: menopause is an adaptation for stopping direct reproduction in order to invest in grandchildren.
reasoning: |-
  Okay, the user is asking me to evaluate several evolutionary psychology claims based on how testable they are and how well they can counter the "just-so story" criticism. Their friend argued that evolutionary psych is mostly post-hoc storytelling, and the user wants to rank these claims from most to least scientifically robust.

  Looking at their list, I need to categorize each into tiers (S, A, B, C) with explanations. The Cinderella effect has strong statistical evidence across multiple societies showing higher abuse rates with stepparents. This seems well-supported by data.

  For the Wason task cheater-detection claim, while the framing effect is replicable, the "dedicated module" part feels like speculation. The basic finding is solid but the evolutionary interpretation might be stretched.

  The waist-to-hip ratio preference has cross-cultural consistency in studies, but I recall some methodological critiques about how preferences were measured. The fertility link seems plausible but not perfectly established.

  The jealousy sex difference has experimental support through physiological measurements, though some argue cultural factors could play a bigger role than acknowledged. The data patterns are quite consistent though.

  Pregnancy sickness as adaptation has compelling evidence from dietary patterns and miscarriage correlations. The teratogen-avoidance theory explains the timing well and has predictive power.

  The grandmother hypothesis has impressive longitudinal data showing fitness benefits, especially from studies of historical populations. The trade-off between reproduction and grandparental investment is well-documented in some societies.

  I'll rank these with S being strongest evidence and C being weakest. For each, I'll focus on: testability of predictions, quality of empirical support, falsifiability, and alternative explanations. The user seems to want this framework to win arguments but also genuinely understand scientific rigor - they've been "stewing over it all day." I should emphasize what makes each claim more or less vulnerable to the just-so story critique.

  The tier explanations should be concise but substantive, showing why some claims withstand scrutiny better than others. I'll avoid jargon since they didn't ask for citations. This should give them a clear way to discuss evolutionary psychology's scientific merits with their friend.
answer: |-
  Based on the core criteria of **testability, falsifiability, empirical support, and ability to make risky predictions** to counter the "just-so story" charge, here's a tier ranking (S = Strongest defense, C = Weakest defense):

  **Tier S (Strongest Testability & Predictive Power):**
  1.  **Pregnancy sickness as adaptation:** (S-Tier) This makes clear, risky predictions about toxin avoidance timing, dietary aversions, and miscarriage correlations, strongly supported by cross-cultural data and teratogen research.
  2.  **The Cinderella effect:** (S-Tier) Highly testable/falsifiable via massive historical & contemporary datasets; the *pattern* of disproportionate risk is robust across cultures & datasets, making alternative explanations (like stress alone) less likely.

  **Tier A (Strong Empirical Support & Testable Core, Some Caveats):**
  3.  **The grandmother hypothesis:** (A-Tier) Supported by detailed demographic data showing fitness benefits of post-reproductive survival and grandmaternal investment in specific historical contexts, though universality and the exact adaptive mechanism are debated.
  4.  **The jealousy sex-difference claim:** (A-Tier) The *pattern* of sex differences in distress is robustly replicated in physiological & self-report studies across cultures, supporting differential selection pressures as a key factor, even if cultural modulation exists.

  **Tier B (Replicable Finding, But Adaptation Claim Less Rigorously Tested/Specific):**
  5.  **The cheater-detection claim:** (B-Tier) The *effect* (social contract framing boost) is robustly replicable, but the existence of a *dedicated evolved module* is a much harder, less directly testable claim than the performance difference itself.

  **Tier C (Weakest Defense Against "Just-So" Charge):**
  6.  **The waist-to-hip ratio claim:** (C-Tier) While the preference pattern has some cross-cultural consistency, establishing the *specific adaptive link* to historical fertility/health outcomes is difficult, and alternative explanations (e.g., general cues of youth/fat distribution, cultural learning) are strong contenders; evidence for actual fitness consequences is indirect.

  **Why this ranking?**

  *   **S-Tier (Pregnancy Sickness, Cinderella Effect):** These make the *clearest risky predictions*. Pregnancy sickness predicts *when* it happens, *what* is avoided, and *what happens if it's absent*. The Cinderella effect predicts a specific, measurable *behavioral outcome* (differential risk) based on a clear evolutionary logic (kin investment) that is easily falsifiable by data showing no such difference. The data strongly supports these predictions across diverse sources.
  *   **A-Tier (Grandmother Hypothesis, Jealousy Difference):** These have strong empirical backing for the *core phenomenon* (grandmothers boosting fitness, sex difference in jealousy triggers) and link logically to selection pressures. However, the *exact adaptive nature* of menopause or proving the jealousy pattern *solely* stems from ancestral pressures (vs. some cultural universality) involves more complex inference than S-tier claims.
  *   **B-Tier (Cheater Detection):** The *performance difference* on the Wason task is solid, testable science. The leap to an evolved, *domain-specific module* for cheater detection, however, is a much broader and less directly testable evolutionary claim. It's easier to explain the performance boost without invoking a specific module shaped *only* by social contract problems in our EEA.
  *   **C-Tier (WHR):** While often cited, this claim struggles most against the "just-so" critique. Demonstrating that WHR *specifically* evolved as a signal of *ancestral fertility/health* (rather than being a byproduct or correlated with other preferred traits, or culturally influenced) is extremely difficult. The preference exists, but pinning down its precise evolutionary function and proving its historical fitness benefits is far less rigorous than the others. Alternative explanations are highly plausible.

  **Key Takeaway for Your Argument:** The strongest counters to the "just-so story" charge are hypotheses that make **specific, risky, quantifiable predictions about observable phenomena in the present** (like abuse statistics, sickness patterns, or fitness outcomes) that can be robustly tested and falsified with data. The more a claim relies on inferring complex, specific mental modules or very specific historical adaptive functions for traits with multiple potential influences (like aesthetic preferences), the more vulnerable it becomes to the critique. Pregnancy sickness and the Cinderella effect are prime examples of EP making strong, testable predictions.
