  Hmm, they want strict conceptual mapping, not general survey. Must resist temptation to wander into fascinating but irrelevant details about fossil discoveries. Focus is how species concepts force specific conclusions about Neanderthal classification. 

  First, need to select three concepts that'll create tension: Biological Species Concept (BSC) for its reproductive isolation focus, Phylogenetic Species Concept (PSC) for lineage perspective, and Ecological Species Concept (ESC) for niche-based view. Each must be applied rigorously to the given facts - divergence ~600kya, Eurasian overlap, confirmed interbreeding with 1-4% non-African ancestry.

  For BSC: The hybridization evidence is problematic. How much gene flow disqualifies species status? If we take Mayr's "potentially interbreeding" definition literally, Neanderthals and sapiens might qualify as one species since they actually did interbreed. But that feels wrong given limited introgression. Need to acknowledge the concept's gray zone here.

  PSC application is cleaner at first glance - separate lineages for hundreds of millennia should mean separate species. But wait, the gene flow complicates the "exclusive descent" requirement. PSC proponents would likely argue the lineages remained distinct despite some hybridization, but must admit this requires qualitative judgment about "lineage independence."

  ESC is trickiest. If they occupied distinct niches - Neanderthal cold adaptation vs sapiens behavioral flexibility - that supports separation. But their coexistence suggests possible niche overlap, and we can't directly observe competition. ESC might be least decisive here.

  Now flipping it: What does this mess say about species concepts generally? The persistent debate despite DNA evidence suggests no single "correct" answer. Taxonomists are arguing across purposes - some care about reproductive boundaries, others about evolutionary trajectories, others about adaptive roles. The real disagreement is about what matters most in defining "species," not about the empirical facts.

  Ah, and the user's deeper question about whether species are real or conventional... This case leans toward conventionalism. The same evidence gets interpreted differently depending on which concept you prioritize. Yet all concepts track something real in nature - reproductive patterns, lineages, ecological roles. So perhaps species concepts are tools for highlighting different aspects of evolution's complexity rather than competing truths.

  Must watch for pitfalls: Don't let BSC discussion become just about "how much interbreeding is too much." For PSC, emphasize how lineage concepts handle introgression. For ESC, acknowledge limited ecological data. And crucially, point out where concepts are silent - none resolve whether slight hybridization invalidates separation, or how to weight different types of evidence.
answer: |-
  Here is a rigorous conceptual mapping of the Neanderthal taxonomic dispute through three species concepts, followed by analysis of what this case reveals about the species problem:

  ### 1. Biological Species Concept (BSC: Focus on Reproductive Isolation)
     - **Commitment:** Species are groups of actually or *potentially* interbreeding natural populations reproductively isolated from other such groups.
     - **Application to Neanderthals:**
       - **Evidence for separation:** Lineage divergence ~600kya suggests *historical* reproductive isolation. Morphological distinctiveness implies barriers to complete fusion.
       - **Evidence against separation:** Demonstrated interbreeding with *H. sapiens* in Eurasia, producing fertile offspring (evidenced by introgressed DNA in non-Africans: 1-4%).
       - **Qualification Required:** BSC must address *degree* of hybridization. Limited, geographically constrained interbreeding with partial fertility (low introgression percentage) suggests *incomplete* but significant isolation. Modern analogs (e.g., coyotes/wolves) show similar gene flow without collapsing species status. **Conclusion:** BSC *tolerates* limited hybridization and likely supports **Homo neanderthalensis** as a separate species**, as isolation was substantial enough to maintain distinct morphological/developmental trajectories for >500k years despite sporadic gene flow.

  ### 2. Phylogenetic Species Concept (PSC: Focus on Lineage Divergence)
     - **Commitment:** Species are the smallest diagnosable monophyletic groups of organisms sharing a unique evolutionary trajectory and common ancestry.
     - **Application to Neanderthals:**
       - **Evidence for separation:** Clear divergence from the *H. sapiens* lineage ~600kya. Consistent autapomorphies in morphology and distinct ancient DNA lineages confirm diagnosability and monophyly (until hybridization). PSC prioritizes lineage independence over gene flow.
       - **Evidence against separation:** Gene flow via introgression violates "exclusive" common ancestry. Neanderthal alleles persist in *H. sapiens*, blurring strict monophyly.
       - **Qualification Required:** PSC must reconcile gene flow with lineage identity. Hybridization doesn't erase prior divergence if lineages remain distinct in core genome and morphology. The concept accepts "incipient" species boundaries with some reticulation. **Conclusion:** PSC unambiguously supports **Homo neanderthalensis** as a distinct species** due to its long-term, diagnosable, independent evolutionary trajectory despite episodic introgression.

  ### 3. Evolutionary/Ecological Species Concept (ESC: Focus on Niche Adaptation)
     - **Commitment:** Species are a lineage evolving separately from others, occupying a specific adaptive zone, with its own ecological niche and evolutionary tendencies.
     - **Application to Neanderthals:**
       - **Evidence for separation:** Distinct morphological adaptations (e.g., robust build, large nasal cavities) suggest cold-adapted niche differing from contemporaneous *H. sapiens*. Archaeological differences (e.g., Mousterian vs. Upper Paleolithic tech) imply divergent cultural/behavioral adaptations.
       - **Evidence against separation:** Coexistence in Eurasia for millennia without competitive exclusion suggests possible niche overlap or insufficient differentiation. Evidence of cultural exchange (e.g., Châtelperronian) complicates distinct "evolutionary tendencies."
       - **Qualification Required:** ESC must judge whether differences reflect fundamental adaptive divergence or phenotypic plasticity. Sustained sympatry *with* some interbreeding yet persistence of distinct morphotypes suggests separate ecological strategies. **Conclusion:** ESC leans toward **Homo neanderthalensis** as a separate species**, interpreting adaptations as evidence of divergent ecological roles, but this is less decisive than PSC/BSC due to niche overlap evidence.

  ---

  ### Case Pushing Back on Species Concepts
  1. **Highlights Pragmatic/Conventional Elements:**
     - **Divergent Conclusions from Same Data:** BSC and PSC reach firm separation conclusions, but rely on *interpretive thresholds* (how much gene flow? how diagnosable?). ESC is more equivocal. Taxonomists' divisions stem from *weighting* different criteria (morphology vs. genetics vs. ecology) - a pragmatic choice, not discovery of a "true" rank.
     - **Silences in Concepts:** None resolve *when* divergent lineages become species. BSC is silent on assessing "potential" interbreeding for extinct taxa. All concepts struggle to quantify the evolutionary significance of limited gene flow vs. long-term divergence. Taxonomists argue over these unaddressed thresholds.

  2. **Reveals Underlying Metaphysical Tensions:**
     - **Individuals vs. Classes:** Persistent Neanderthal distinctiveness despite hybridization supports viewing species as *historical individuals* (cohesive lineages with unique fates) rather than classes defined by essential traits. Their extinction as a discrete population reinforces this.
     - **Mind-Independence Question:** The consistent phylogenetic signal and adaptive differences suggest a "real" grouping exists. However, the *rank* (species vs. subspecies) depends on conceptual priorities. This suggests species concepts track *objectively distinct evolutionary processes* (isolation, divergence, adaptation), but the grouping rank is a human tool for emphasizing different aspects of these processes.

  ### Conclusion
  The Neanderthal case demonstrates that **species concepts are operational tools highlighting different aspects of evolutionary divergence, not arbiters of a single truth.** BSC emphasizes reproductive barriers, PSC lineage history, and ESC ecological role. All confirm a profound evolutionary separation, but the **subspecies/species distinction is conventional**, reflecting whether one prioritizes the evidence of divergence (supporting species) or the evidence of limited reintegration (supporting subspecies). The dispute ultimately rests on unresolved philosophical questions: whether species rank requires absolute reproductive isolation, exclusive lineage purity, or unambiguous niche differentiation—standards rarely met in nature. This underscores that while real evolutionary distinctions exist, "species" is a pragmatic category for organizing life's complexity.
