prompt: |-
  You are a philosopher of computation and game theory who also has a solid working knowledge of evolutionary biology. I'm an evolutionary biologist — comfortable with concepts like inclusive fitness, evolutionarily stable strategies, greenbeard genes, reciprocal altruism, signaling theory, and the major transitions — but I have only a passing acquaintance with the literature on program equilibrium. I've heard that there's a result in that literature showing that cooperation in one-shot prisoner's dilemmas becomes possible if agents can condition their behavior on each other's decision procedures (their "source code"), and I'm told this is supposed to be interesting for understanding the foundations of cooperation.

  I want you to restate the core argument of program equilibrium — the FairBot and PrudentBot results, the role of Löb's theorem, and why this isn't just a commitment device — entirely in the vocabulary of evolutionary biology. Translate it as faithfully as you can into the concepts I work with: strategies as heritable phenotypes, payoffs as fitness, the one-shot interaction as a single encounter between organisms that never meet again, the ability to "read source code" as some form of phenotypic detection or signaling, and the logical structure as whatever evolutionary analogue you can find.

  Then give me the residue report: which parts of the program equilibrium story translate cleanly into evolutionary terms, which parts you had to distort or stretch to make them fit, and which parts have no expression at all in my vocabulary. For each piece of residue, tell me whether you think it points to a genuine insight the evolutionary framework is missing — something about the logic of cooperation that selection-based thinking cannot capture — or whether it points to a hidden assumption in the program equilibrium literature that looks less substantive once you try to cash it out in biological terms.

  Before you start the translation, take a moment to lay out the program equilibrium argument clearly in its own terms — I need to see what you are translating from, not just what you are translating to. Then work through the translation systematically, concept by concept. Finally, give me the residue report. I am less interested in whether the translation is elegant than in whether it is honest: do not smuggle evolutionary assumptions into the program equilibrium story and then declare victory, and do not dismiss as untranslatable something that actually has a natural evolutionary counterpart if you think harder about it.
reasoning: |-
  We are going to do three things:
   1. Clearly state the program equilibrium argument (with FairBot, PrudentBot, Löb's theorem) in its own terms.
   2. Translate the core argument into evolutionary biology vocabulary.
   3. Provide a residue report: what translated cleanly, what was distorted, what has no expression, and what that tells us.

  Let's begin.

  ## Part 1: The Program Equilibrium Argument in Its Own Terms

  In the program equilibrium framework, we consider agents that are computer programs. These agents can read each other's source code and then choose an action. We are particularly interested in the one-shot Prisoner's Dilemma (PD). The PD has two actions: Cooperate (C) and Defect (D). The payoffs are:
  - If both cooperate: (R, R) [Reward for mutual cooperation]
  - If one cooperates and the other defects: (S, T) [Sucker's payoff for the cooperator, Temptation for the defector]
  - If both defect: (P, P) [Punishment for mutual defection]
  With T > R > P > S and 2R > T+S (so that mutual cooperation is better than alternating cooperation and defection).

  The key idea is that if two programs can condition their actions on the other's source code, they can achieve mutual cooperation in a one-shot PD. This is done by designing programs that cooperate only if they can prove that the other program will cooperate in response.

  ### FairBot
  FairBot is a program that:
  - Tries to prove (using a formal system) that the opponent will cooperate if FairBot cooperates.
  - If it finds such a proof, it cooperates.
  - Otherwise, it defects.

  Now, consider two identical FairBots facing each other. Each FairBot looks at the other's source code and tries to prove: "If I (FairBot) cooperate, then the other FairBot will cooperate." Because the two FairBots are identical, each can reason: "The other FairBot is just like me. It is trying to prove the same thing about me. If I cooperate, then since I am identical to it, it will also cooperate (because it will run the same algorithm and come to the same conclusion)." 

  But this reasoning must be formalized in a proof system. The key technical point is that the proof system must be sufficiently powerful and must satisfy Löb's theorem. Löb's theorem states that in a consistent formal system that is sufficiently strong (and meets the conditions of Gödel's incompleteness theorems), if we can prove that "if the system can prove P, then P is true", then the system can prove P. 

  In the case of two identical FairBots, each one can reason: "If I cooperate, then the other, being identical and having the same code, will also cooperate." But note that the FairBot doesn't need to prove that the other will cooperate unconditionally; it only needs to prove that the other will cooperate *if* it (the first) cooperates. Because the two FairBots are identical, each can simulate the other. The system of proofs allows each FairBot to prove that if it cooperates, the other will too. Therefore, both cooperate.

  ### PrudentBot
  PrudentBot is a variation that avoids being exploited by defectors. It cooperates only if it can prove that the opponent will cooperate *and* that the opponent is not a defector. More precisely, PrudentBot:
  - Tries to prove that the opponent will cooperate if PrudentBot cooperates.
  - If it can, then it cooperates unless it can also prove that the opponent would cooperate even if PrudentBot defected (which would indicate that the opponent is a "cooperator" regardless, and hence PrudentBot can defect and get T). But note: if the opponent is also a PrudentBot, then if PrudentBot defects, the opponent will defect. So PrudentBot must also avoid mutual defection.

  A better way to think of PrudentBot is that it cooperates with programs that are "cooperate-both" conditional on its own action. However, to avoid exploitation by a program that always cooperates (like a "CooperateBot"), PrudentBot will defect against CooperateBot because it can prove that even if it defects, CooperateBot will still cooperate. 

  But when two PrudentBots meet, each can prove that the other will cooperate only if it does. Therefore, they both cooperate.

  ### Why it's not just a commitment device?
  A commitment device would be a way to bind oneself to cooperate. However, in program equilibrium, the agents are not committing to cooperate unconditionally. They are conditioning their cooperation on the other's behavior. The key is that they condition on the other's source code (which is fixed) and use logical proof to determine what the other will do. The mutual cooperation arises because each agent's action depends on the other's action in a mutually consistent way. This is sometimes called "coordination by mutual prediction" or "logical mutual prediction".

  The role of Löb's theorem is to ensure that the proof system is strong enough for the FairBot to be able to prove the necessary statement about the opponent. Without a sufficiently strong proof system (and the properties granted by Löb's theorem), the FairBot might not be able to prove that the other FairBot will cooperate and hence would defect, leading to mutual defection.

  ## Part 2: Translation into Evolutionary Biology Vocabulary

  We are translating:
  - Agents -> Organisms (with heritable phenotypes)
  - Source code -> Genotype (or a heritable phenotypic trait that is observable and encodes the strategy)
  - Payoffs -> Fitness
  - One-shot interaction -> A single encounter between two organisms that never meet again and do not interact with each other in the future.
  - The ability to read source code -> The ability to detect the opponent's genotype (or a phenotypic signal that reliably indicates the strategy the opponent will use) before the interaction.

  ### Core Translation

  We consider two organisms, A and B, about to engage in a one-shot PD interaction. Each organism has a heritable strategy (phenotype) that determines its behavior in the PD. The strategy is encoded in its genotype, which is observable to the other organism (perhaps via a signal that reliably indicates the genotype).

  **FairBot Translation:**
  We design a strategy (call it "FairPhenotype") as follows:
  - The organism observes the opponent's genotype.
  - It then uses an internal cognitive process (which we model as a form of "proof") to determine: If I (the organism with FairPhenotype) cooperate, will the opponent (based on its genotype) also cooperate?
  - If the answer is yes (by the internal proof), then it cooperates.
  - Otherwise, it defects.

  Now, if two organisms with FairPhenotype meet, each observes the other's genotype and sees that it is the same as its own. Then, each runs its cognitive process. The cognitive process of organism A reasons: "I have genotype G. The opponent also has genotype G. Therefore, the opponent is running the same algorithm. If I cooperate, then the opponent, having the same genotype, will run the same algorithm and will also see that I have genotype G and hence will cooperate (because it will have the same proof that I will cooperate)." Therefore, each proves that if it cooperates, the other will too. So they both cooperate.

  **PrudentBot Translation:**
  Similarly, we design a "PrudentPhenotype":
  - The organism observes the opponent's genotype.
  - It uses an internal cognitive process to determine: 
     (a) If I cooperate, will the opponent cooperate?
     (b) Also, would the opponent cooperate even if I defect? (That is, is the opponent an unconditional cooperator?)
  - If the answer to (a) is yes and to (b) is no, then it cooperates.
  - Otherwise, it defects.

  When two PrudentPhenotypes meet, each proves that the other will cooperate only if it does (so (a) is true) and that the other is not an unconditional cooperator (so (b) is false). Hence, they cooperate.

  ### Why it's not just a commitment device in evolutionary terms?
  In evolutionary biology, a commitment device might be a fixed action (like always cooperate) that is evolutionarily stable only if others also commit. However, the FairPhenotype and PrudentPhenotype are conditional. They cooperate only when they can prove that the opponent will reciprocate. This is more akin to a conditional strategy that uses a cue (the opponent's genotype) to decide. The key is that the condition is based on a logical deduction about the opponent's behavior, which is made possible by the fact that the opponent's genotype is observable and the organism has the cognitive machinery to simulate the opponent's decision.

  ## Part 3: Residue Report

  We now analyze the translation:

  ### Clean Translations:
  1. **Agents as organisms with heritable phenotypes:** This is straightforward. The strategy (program) is a heritable trait.
  2. **Payoffs as fitness:** The PD payoffs correspond to fitness effects from the interaction.
  3. **One-shot interaction:** Translates directly to a single encounter with no future interactions, so no possibility of direct reciprocity.
  4. **Conditioning on opponent's source code as detecting opponent's genotype/phenotype:** The idea that an organism can observe a signal that reveals the opponent's strategy (or the underlying genotype that codes for it) is common in biology (e.g., greenbeard genes, where a gene produces a visible signal and a behavior conditional on that signal). The ability to observe the opponent's type is key.

  ### Distortions or Stretches:
  1. **The internal cognitive process (proof):** In the program equilibrium, the agent uses a formal proof system. In biology, we must interpret this as some form of cognitive or neural mechanism that can simulate the opponent's behavior. For simple strategies, this might be feasible (e.g., an organism might have a rule: "if the opponent has the same phenotype as me, then we both will do the same thing, so if I cooperate, it will cooperate"). But the program equilibrium relies on a very powerful proof system (capable of proving statements about its own behavior and that of identical opponents). In biology, we don't typically assume organisms have such powerful deductive abilities. We have to stretch to imagine an organism that can simulate the opponent's decision process exactly, especially when the opponent is identical. This is a distortion because the level of cognitive ability required is likely beyond what we see in most biological systems.

  2. **Löb's theorem:** This is a theorem in mathematical logic. In the translation, we have to assume that the internal cognitive process has the property that if it can prove that "if I can prove P then P is true", then it can prove P. This is a very specific property of formal systems. In biology, we are replacing the proof system with a cognitive mechanism. We have to assume that this cognitive mechanism is so powerful that it can handle self-referential reasoning without falling into paradoxes. This is a big stretch. In reality, biological decision mechanisms are heuristic and prone to error. They are not infallible proof systems. So we are idealizing the biological organism to have perfect logical omniscience in a way that is unrealistic.

  3. **Identity of programs:** The argument relies on the two programs being identical so that each can simulate the other. In biology, we can have two organisms with the same genotype. But note: even with the same genotype, development and environmental noise might lead to phenotypic differences. However, if we assume that the phenotype (the strategy) is perfectly determined by the genotype and that the cognitive process is deterministic, then we can have identical behavior. The stretch is that the cognitive process must be able to recognize identity and then reason about it flawlessly.

  ### Parts with No Expression in Evolutionary Biology:
  1. **The formal proof system and Löb's theorem:** There is no direct analogue in evolutionary biology. Evolution operates by natural selection on variation, not by logical proof. The closest we have is the idea of an organism making a prediction about the opponent's behavior based on a cue. But the depth of reasoning (proving theorems about what the opponent will do by simulating the opponent's own reasoning) is absent. This part does not translate.

  2. **Self-referential reasoning:** In program equilibrium, the agents reason about themselves and their own proofs. For example, FairBot must reason: "If I do X, then the opponent (which is identical to me) will do Y." This involves the agent having a representation of itself. In biology, we do have some self-referential behaviors (e.g., self-recognition in mirrors), but it is not used in game-theoretic interactions in the way required here. Moreover, the level of abstraction (reasoning about one's own reasoning) is not found in non-human organisms.

  ### Residue Analysis: What Does It Point To?

  1. **The cognitive machinery (proof system, Löb's theorem, self-reference) as residue:** This residue points to a genuine insight that the evolutionary framework is missing. The program equilibrium result shows that if agents are sufficiently rational (in the logical sense) and can reason about each other's reasoning, then cooperation can emerge even in one-shot interactions without any repeated games or kin selection. Evolutionary biology, with its focus on natural selection, does not typically model such high-level cognition. The residue suggests that in systems where agents have sophisticated cognition (like humans), cooperation might be possible in one-shot interactions via this logical mutual prediction mechanism. This is beyond what traditional evolutionary mechanisms (like kin selection, direct reciprocity, etc.) can explain.

     However, note that in evolutionary terms, we could imagine that the cognitive machinery evolves. But the kind of machinery required (logical omniscience, perfect self-referential reasoning) is not biologically plausible. Therefore, the residue might also point to a hidden assumption in the program equilibrium literature: that agents are logically omniscient and can perfectly simulate each other. In the real world, with bounded rationality, this might break down.

  2. **The requirement of identical programs:** In the translation, we assumed identical genotypes. But in biology, even in a population of clones, there can be phenotypic variation. Moreover, in a polymorphic population, an organism with FairPhenotype might meet a different type. The program equilibrium result holds for identical FairBots, but what about non-identical ones? In the program equilibrium literature, there are extensions to non-identical programs, but they require that the programs can mutually prove the necessary condition. In biology, we cannot rely on such proofs because of the lack of the required cognitive machinery. This residue might point to a hidden assumption: that the agents are symmetric and have common knowledge of their mutual reasoning capabilities.

  ### Conclusion

  The translation shows that the core idea of conditioning behavior on the opponent's type is present in biology (e.g., greenbeard genes). However, the mechanism by which the condition is determined (logical proof) has no direct biological counterpart and requires cognitive abilities that are unrealistic for non-human organisms. The residue (the proof system, Löb's theorem, and self-referential reasoning) points both to a potential mechanism for cooperation in highly rational agents and to an idealization in the program equilibrium model that may not hold in biological systems.

  Therefore, the program equilibrium result might be seen as a foundation for cooperation in rational agents (like humans) that can engage in such reasoning, but it does not translate cleanly to the typical evolutionary setting where cognition is bounded and strategies evolve by natural selection.
answer: |-
  ### Part 1: Program Equilibrium Argument in Its Own Terms  
  **Core Setup:**  
  - **Agents:** Computer programs that can read each other's source code.  
  - **Game:** One-shot Prisoner's Dilemma (PD). Payoffs: Temptation (T) > Reward (R) > Punishment (P) > Sucker (S), with 2R > T + S.  
  - **Key Mechanism:** Agents condition actions on *proofs* about each other's behavior.  

  **FairBot:**  
  1. Cooperates if it can prove (in a formal system) that the opponent cooperates *when given FairBot's source code*.  
  2. Defects otherwise.  
  - **Result:** Two identical FairBots mutually cooperate. Each reasons: "If I cooperate, the opponent (being identical) will run the same proof and cooperate." Löb's theorem (a result in modal logic) ensures this self-referential proof is consistent.  

  **PrudentBot:**  
  1. Cooperates only if it can prove that:  
     - The opponent cooperates when PrudentBot cooperates, AND  
     - The opponent would *not* cooperate if PrudentBot defected (avoiding exploitation by "always-cooperate" strategies).  
  2. Defects otherwise.  
  - **Result:** Two PrudentBots cooperate, but PrudentBot defects against unconditional cooperators.  

  **Why Not Just Commitment?**  
  - Commitment devices (e.g., pre-commitment to cooperate) fail against defectors. Program equilibrium uses *conditional mutual prediction*:  
    - FairBot doesn't commit unconditionally; it acts iff a proof guarantees reciprocity.  
    - Löb's theorem enables agents to trust their proofs about identical opponents, avoiding infinite regress.  

  **Role of Löb's Theorem:**  
  - Ensures that if an agent can prove "my proof of X implies X is true," then it can prove X. This allows FairBot to validate its self-referential prediction.  

  ---

  ### Part 2: Translation into Evolutionary Biology Vocabulary  
  **Core Analogy:**  
  - **Agents → Organisms** with heritable strategies (phenotypes). Fitness determined by PD payoffs.  
  - **Source Code → Observable Genotype/Phenotype:** A detectable trait (e.g., a "greenbeard" marker) that reliably predicts behavior.  
  - **One-Shot Interaction → Single encounter** between strangers (no repeated games, kin ties, or future interactions).  
  - **Proof System → Cognitive/Phenotypic Prediction:** An evolved mechanism to simulate opponent behavior based on their trait.  

  **FairBot as "Greenbeard FairPhenotype":**  
  - An organism with genotype G expresses a trait T.  
  - **Decision rule:**  
    1. Detect opponent's trait T.  
    2. If internal simulation predicts "when I (G-carrier) cooperate, opponent cooperates," then cooperate.  
    3. Else, defect.  
  - **Outcome:** Two G-carriers meet. Each simulates: "My trait T matches the opponent. Since I conditionally cooperate on seeing T, so does the opponent." Mutual cooperation evolves.  

  **PrudentBot as "Cautious Greenbeard":**  
  - **Decision rule:**  
    1. Cooperate only if:  
       - Simulation predicts "if I cooperate, opponent cooperates," AND  
       - Simulation predicts "if I defect, opponent defects" (to screen out unconditional cooperators).  
    2. Else, defect.  
  - **Outcome:** Mutual cooperation with identical types; defects against "always-cooperate" phenotypes.  

  **Why Not Commitment?**  
  - Commitment in biology (e.g., irreversible morphology) is unconditional and exploitable. Here, cooperation is *contingent on reciprocal prediction*, enabled by trait-matching and simulation.  

  **Löb's Theorem → Evolved Self-Consistent Cognition:**  
  - **Translation:** Organisms evolve error-proof cognitive rules where:  
    - "If my simulation (based on trait-matching) predicts cooperation, then cooperation occurs."  
    - This avoids infinite regress by assuming simulations of identical opponents are self-consistent.  

  ---

  ### Part 3: Residue Report  
  **Clean Translations:**  
  1. **Source Code as Observable Trait:** Greenbeard genes (e.g., in ants/yeast) allow conditional behavior based on matching phenotypes. Translates directly.  
  2. **Payoffs as Fitness:** PD payoffs map to fitness effects (e.g., R = mutual benefit, T = exploitation reward).  
  3. **One-Shot Interaction:** Models isolated encounters (e.g., predator-prey interactions) with no future repercussions.  
  4. **Conditionality:** Similar to assessment traits in signaling theory (e.g., only cooperate if opponent's trait signals reciprocity).  

  **Distorted/Stretched Translations:**  
  1. **Löb's Theorem → Self-Consistent Cognition:**  
     - *Distortion:* Löb's theorem relies on infallible logic; biology uses noisy, heuristic cognition (e.g., neural circuits, hormone thresholds).  
     - *Why?* Evolutionarily stable strategies (ESS) don't require perfect prediction—only fitness-based outcomes. Program equilibrium assumes flawless proofs, but biology uses approximate rules (e.g., "if trait matches, cooperate; else defect").  
     - *Residue Insight:* Highlights an idealization in program equilibrium. Biology "solves" this via selection for robustness (e.g., traits with low error rates), not logical infallibility.  

  2. **Mutual Prediction via Simulation:**  
     - *Stretch:* Program equilibrium agents simulate *arbitrary code*; organisms predict via fixed rules (e.g., "if same odor, cooperate").  
     - *Why?* Biological "simulation" is limited (e.g., bees assess relatedness, but can't model complex contingencies).  
     - *Residue Insight:* Program equilibrium overestimates cognitive complexity. Biology achieves similar outcomes via simpler mechanisms (e.g., kin recognition, which doesn't require simulating opponent decisions).  

  **No Evolutionary Expression:**  
  1. **Self-Referential Proofs:**  
     - *Issue:* FairBot's self-referential proof ("I cooperate if my identical opponent does") has no biological parallel. Evolution lacks formal systems for self-verifying inferences.  
     - *Residue Insight:* Points to a gap in evolutionary theory. While greenbeards use trait-matching, they don't "prove" consistency—they rely on empirical success (e.g., high relatedness ensures reciprocity). Program equilibrium's logical mutualism may be irrelevant to biology.  

  2. **Universal Computation in Agents:**  
     - *Issue:* Program equilibrium agents can simulate *any* opponent; biology uses specialized adaptations (e.g., MHC-based recognition works only for specific traits).  
     - *Residue Insight:* Program equilibrium assumes unbounded rationality—a hidden assumption. Biology operates under bounded rationality, favoring hardwired responses over universal prediction.  

  ---

  **Conclusion: What the Residue Reveals**  
  - **Genuine Evolutionary Gaps:** The self-referential logic of program equilibrium has no biological counterpart. Evolution relies on empirical feedback (e.g., selection favoring traits with high predictive accuracy) rather than axiomatic proofs. This suggests program equilibrium captures a *rationalist* foundation for cooperation (e.g., in AI/humans), not an evolutionary one.  
  - **Hidden Assumptions in Program Equilibrium:** The need for identical agents, infallible proofs, and universal simulation is biologically unrealistic. Once translated, these assumptions reveal that program equilibrium is less about evolved adaptations and more about idealized rational agents with shared cognitive frameworks.  
  - **Biological Insight:** Evolution achieves similar outcomes (e.g., conditional cooperation) via simpler, noisier mechanisms like greenbeards or kin selection. The residue underscores that selection favors *fitness-driven heuristics*, not logical omniscience.  

  **Final Verdict:** Program equilibrium's core idea (conditioning on observable traits) translates well, but its logical machinery does not. This residue exposes a fundamental divide: evolution builds cooperation through historical fitness landscapes, while program equilibrium constructs it through axiomatic mutual predictability.
