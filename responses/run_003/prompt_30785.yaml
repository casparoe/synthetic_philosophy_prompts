  **Sensitivity**: Most sensitive to **(i)**. Evidence from theories of justification (e.g., robust non-causal reliabilism) could lower it; internalist arguments could raise it.  

  **Failure point**: Likeliest at **(ii)**—subtle metaphysical work (e.g., grounding relations) might rehabilitate rescue stories.  

