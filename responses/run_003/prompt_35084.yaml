prompt: |-
  I'm a journalist working on a piece about typography and the cognitive science of reading, and I've fallen into a philosophical rabbit hole I can't climb out of. The question is deceptively simple: what makes every 'a' an 'a'? Not in the dictionary-definition sense, but perceptually and categorically — across fonts, handwriting, historical scripts, what's the thing that makes us group radically different-looking shapes under the same letter? I started collecting edge cases and testing my own gut reactions, and my intuitions are all over the place. I'd love your help extracting a principle, or at least seeing which of my verdicts I've gotta give up.

  Here are my verdicts. A standard double-story 'a' (Times New Roman): obviously an 'a'. A single-story 'a' (Futura, most handwriting): also an 'a', no pause. A capital 'A': yes, same letter, but it feels like it gets there by a different route — like uppercase and lowercase membership are two distinct subcategories. A sloppily handwritten 'a' where the bowl doesn't close: if I can read it in context, it counts; if I can't, it doesn't — but making my verdict depend on my own recognition bothers me. A Cyrillic 'а' (visually identical to Latin single-story 'a'): my gut says no, it's a different alphabet's letter that happens to look the same, so shape isn't sufficient. The @ symbol: not an 'a', even though it's historically an 'a'+'d' ligature — history seems irrelevant. An 'a' rotated 180°: no, even though it's the identical shape. A blackletter Fraktur 'a' that looks to modern eyes like an 'o' with a hat: intellectually I know it's an 'a', perceptually I resist it — I'm torn. A minimalist logo 'a' reduced to a circle with a short right-side stem: in context I see it, in isolation maybe not — another torn case. Greek alpha (α): no, not an 'a', even though it's the direct ancestor. But if descent doesn't matter for alpha, why does it seem to matter a little for capital 'A', which is equally Greek-derived?

  I'm hoping you can give me exactly five candidate principles — each stated in a sentence or two — that could capture most of these verdicts, with no introduction or conclusion. For each principle, tell me which of my verdicts it handles cleanly and which one or two it forces me to abandon. And if you can, use the fifth slot to say what the best of the four predicts about a case I didn't list: an 'a' in an experimental typeface that no one would recognize without being told, but once told, they can't unsee it.
reasoning: |-
  Okay, the user is a journalist diving deep into typography and cognitive science, specifically what makes every 'a' recognizable as an 'a' despite variations. They've listed various examples and their gut reactions to each. The challenge is to extract five principles that explain these verdicts, noting which cases each principle handles well and which it doesn't, plus a prediction for an experimental typeface.

  First, I need to understand their examples and their verdicts. They have cases like standard double-story 'a', single-story 'a', capital 'A', sloppy handwritten 'a', Cyrillic 'а', @ symbol, rotated 'a', Fraktur 'a', minimalist logo 'a', and Greek alpha. Their reactions vary: some are clear yes/no, others are context-dependent or conflicting.

  The key points from their examples: context matters (sloppy handwriting), historical origins don't always count (@ symbol vs. alpha), visual similarity isn't sufficient (Cyrillic 'а'), and recognition can be influenced by knowledge (Fraktur). Also, orientation affects perception (rotated 'a').

  Now, I need to formulate five principles. Each should be a concise statement, then map which verdicts it explains and which it conflicts with. The fifth principle should predict the experimental typeface case.

  Possible principles:

  1. **Categorical Membership via Convention**: Belonging to the Latin alphabet is essential. This would explain why Cyrillic 'а' isn't an 'a', despite looking identical. But it conflicts with Greek alpha not being considered 'a', even though it's the ancestor. Capital 'A' is part of the Latin system, so it's included.

  2. **Perceptual Invariance under Typical Conditions**: Recognizable variations within standard contexts. Handles standard and single-story 'a's, maybe the minimalist logo in context. But fails with rotated 'a' (same shape but not recognized) and Fraktur if it's too different. Sloppy handwriting is accepted in context, so this principle might cover that.

  3. **Contextual Disambiguation**: Reliance on surrounding text for identification. Explains sloppy handwriting and minimalist logo where context makes it recognizable. However, isolated cases like the rotated 'a' or Cyrillic without context wouldn't fit. Also, Fraktur might need context if it's not immediately recognizable.

  4. **Historical Lineage with Current Function Separation**: Origin matters only if the symbol is currently used as the letter. So @ isn't an 'a' despite its history, and Greek alpha isn't because it's now part of another alphabet. Capital 'A' is included because it's functionally the same letter in modern use. This explains @ and alpha, but conflicts with why capital 'A' feels like a subcategory—maybe because it's the same system? Fraktur is historically 'a' but not perceptually, so here lineage doesn't help perception.

  5. **Schema Priming and Cognitive Penetration**: Prior knowledge shapes perception. Once told about the experimental 'a', people can't unsee it. Predicts that the experimental typeface becomes recognizable after explanation. Also handles Fraktur: knowing it's 'a' helps, but perception might resist. Conflicts with rotated 'a' since even knowing it's rotated, it's not accepted. Also, Cyrillic isn't accepted even if you know it looks the same, because it's a different system.

  Now, mapping each principle to the verdicts:

  - **Principle 1 (Convention)**: Explains Cyrillic 'а' (different alphabet) and capital 'A' (same alphabet). Conflicts with Greek alpha (same origin but not accepted).
    
  - **Principle 2 (Perceptual Invariance)**: Handles standard and single-story 'a's, sloppy handwriting in context. Fails with rotated 'a' and possibly Fraktur if too different.

  - **Principle 3 (Context)**: Explains sloppy handwriting and minimalist logo (context-dependent). Conflicts with isolated cases like rotated 'a' or Cyrillic without context.

  - **Principle 4 (Lineage vs. Function)**: Explains @ (historical but not functional) and alpha (ancestor but not current function). Capital 'A' is functional, so included. Conflicts with Fraktur: historical but not perceptually accepted; lineage doesn't override perception.

  - **Principle 5 (Schema Priming)**: Predicts experimental 'a' becomes recognizable after explanation. Explains Fraktur (knowing it's 'a' helps). Conflicts with rotated 'a' (even knowing, it's not seen as 'a') and Cyrillic (knowing it's Cyrillic prevents seeing it as Latin 'a').

  For the experimental typeface, Principle 5 (Schema Priming) would say that once you're told it's an 'a', you'll always see it as such, even if initially unrecognizable. This aligns with cognitive science where prior knowledge alters perception.

  Also, checking which principles the user might need to abandon. For example, under Principle 4, they'd have to accept that historical lineage alone doesn't make something an 'a' (@ and alpha), but capital 'A' is included due to current function. Under Principle 2, they'd abandon the idea that identical shapes (like rotated 'a') are still 'a's because orientation breaks typical conditions.

  Need to ensure each principle is clear and directly addresses the conflicts in the user's verdicts. Making sure the fifth principle specifically addresses the unseen experimental case as per the user's request.
answer: |-
  Here are five candidate principles addressing your query, formatted as requested:

  1. **Conventional Alphabet Membership**: A shape is an 'a' only if it belongs to the Latin alphabet's established glyph set for that letter.  
     *Handles*: Cyrillic 'а' (excluded as non-Latin), capital 'A' (included as conventional variant).  
     *Forces abandonment*: Greek alpha (same origin but excluded).

  2. **Perceptual Invariance under Typical Conditions**: A shape is an 'a' if it preserves key topological relationships (e.g., enclosed counter + attached stroke) in standard orientation and context.  
     *Handles*: Double/single-story 'a', sloppy handwritten 'a' (if recognizable).  
     *Forces abandonment*: Rotated 180° 'a' (violates orientation), @ symbol (lacks topological fidelity).

  3. **Contextual Disambiguation**: A shape is an 'a' only when its surrounding textual cues resolve ambiguity, overriding isolated perception.  
     *Handles*: Sloppy handwritten 'a' (accepted in context), minimalist logo 'a' (context-dependent).  
     *Forces abandonment*: Cyrillic 'а' (excluded despite identical shape due to alphabet context), rotated 'a' (rejected even if context clarifies).

  4. **Historical Lineage vs. Current Function**: A shape is an 'a' only if its *current usage* aligns with Latin 'a', regardless of origin. Historical ties are irrelevant without functional continuity.  
     *Handles*: @ symbol (excluded despite ligature origin), Greek alpha (excluded despite ancestry).  
     *Forces abandonment*: Capital 'A' (must accept as functionally identical, dismissing "subcategory" hesitation).

  5. **Schema Priming and Cognitive Penetration**: Recognition depends on pre-existing mental schemas, but once a shape is explicitly categorized as 'a', top-down processing irreversibly assimilates it.  
     *Handles*: Fraktur 'a' (intellectual acceptance overrides initial resistance), minimalist 'a' (schema adjusts with context).  
     *For the experimental typeface*: Once told it's an 'a', viewers will persistently recognize it as such due to cognitive entrenchment, despite initial unfamiliarity.
