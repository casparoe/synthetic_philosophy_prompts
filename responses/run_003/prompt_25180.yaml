prompt: |-
  I recently joined my employer's benefits policy committee, and we are debating whether to switch our retirement savings plan from opt-in enrollment (employees must actively sign up) to automatic enrollment with an opt-out (employees are enrolled at a default contribution rate and must actively decline). The case for switching seems strong: it increases participation dramatically, it preserves choice because anyone can opt out, and it exploits nothing more than the well-documented human tendency to stick with defaults. But I have noticed something that bothers me. The same committee recently rejected a proposal to automatically schedule employees for annual health screenings unless they opt out, on the grounds that medical decisions require affirmative consent and that defaulting people into health procedures would be manipulative. I cannot see what principle distinguishes the two cases, and I suspect the practice of automatic retirement enrollment carries philosophical commitments about autonomy and legitimate influence that my colleagues have not made explicit — and that, if made explicit, might force us to either abandon the retirement nudge or accept the health-screening nudge.

  Please help me think this through. I would like two deliverables.

  First, a prose analysis of roughly 500 words that reconstructs the implicit theory of autonomy, welfare, and legitimate paternalism that automatic retirement enrollment presupposes, identifies the most plausible principles that could distinguish it from automatic health-screening enrollment, and assesses whether those principles hold up under scrutiny.

  Second, a structured summary as a JSON object with the following fields:

  - "presuppositions": an array of strings, each stating a claim about autonomy, welfare, rationality, or legitimate influence that the practice of automatic retirement enrollment cannot do without.
  - "candidate_distinguishing_principles": an array of objects, each with fields "principle" (a principle that would license the retirement default but not the health-screening default), "plausibility" (one of "high", "moderate", or "low"), and "strongest_objection" (a string stating the strongest objection to that principle).
  - "internal_tensions": an array of objects, each with fields "tension" (a description of an apparent inconsistency within the retirement-enrollment practice itself, independent of the health-screening comparison) and "resolution" (the most plausible way to resolve it, or null if none is available).
  - "verdict": a string, one of "the asymmetry is defensible", "the asymmetry is indefensible", or "the asymmetry is defensible but only under a revisionary view of autonomy".
  - "practical_implication": a string stating what the committee should do if it wants to be philosophically consistent.
reasoning: |-
  Hmm, the user presents a fascinating ethical dilemma about workplace benefits policies. They serve on a committee that supports automatic enrollment for retirement savings but rejects it for health screenings, and they're struggling to find a consistent principle behind this asymmetry. 

  First, I need to unpack the philosophical presuppositions behind automatic retirement enrollment. This practice clearly assumes that (1) humans have predictable cognitive biases (like inertia) that lead to suboptimal choices, (2) retirement savings align with nearly universal long-term welfare goals, (3) opting out provides sufficient autonomy protection, and (4) employers have legitimate interest in employees' financial security. These form a coherent behavioral paternalism framework.

  Now for the tricky part: distinguishing retirement from health screenings. I can think of several candidate principles: 
  - Instrumental vs bodily integrity (high plausibility but objection: some screenings are non-invasive) 
  - Universality of benefit (moderate plausibility but objection: health screenings also broadly benefit most) 
  - Cost asymmetry (low plausibility due to employer coverage differences) 
  - Psychological framing (moderate plausibility but objection: both exploit inertia). 

  The strongest distinction seems to be about the nature of the domain - financial vs medical - but even this cracks under scrutiny because routine screenings are preventive care, not unlike preventive savings.

  Internally, automatic retirement enrollment has tensions too: default contribution rates may be suboptimal, and opting out can be psychologically burdensome. These can be resolved through smart defaults and transparency, but they reveal the model isn't flawless.

  My verdict leans toward "the asymmetry is defensible but only under a revisionary view of autonomy" - one where autonomy includes structuring choices to counter biases, provided core rights aren't violated. Health screenings involve more intimate bodily consent, making defaults feel more intrusive even if logically similar.

  Practically, the committee should either: 
  1) Accept health screening defaults with robust opt-outs 
  2) Reject both as overreach 
  3) Find middle ground like active choosing for screenings. 

  But defending the current asymmetry requires acknowledging that domain matters - medical consent simply carries different ethical weight than financial preferences in our cultural context, even if the behavioral mechanism is identical.
answer: |-
  ### Prose Analysis (Approx. 500 words)

  The committee's asymmetry reveals an implicit theory of autonomy and paternalism centered on **domain-specific legitimacy of influence**, **presumed universal welfare**, and **thresholds of bodily integrity**. Automatic retirement enrollment presupposes that: 
  1. **Rationality is bounded**: Humans exhibit inertia and present bias, justifying gentle nudges to counteract self-harming passivity. 
  2. **Welfare is objectively identifiable**: Retirement savings serve nearly universal long-term interests, making defaults welfare-enhancing without imposing contested values. 
  3. **Opt-out preserves autonomy**: Minimal effort to decline constitutes sufficient agency, as the default aligns with probable rational choice. 
  4. **Employer influence is legitimate**: Employers may promote financial security, as it aligns with organizational stability and social expectations. 

  In contrast, rejecting health-screening defaults implies that: 
  - Medical decisions involve higher stakes (bodily integrity) and contested values (e.g., risk tolerance). 
  - Affirmative consent is non-negotiable for bodily procedures, even preventive ones. 
  - Health defaults risk "manipulation" by exploiting inertia in a domain requiring explicit, conscious authorization. 

  **Candidate Distinguishing Principles**:  
  1. **Bodily Integrity Principle**: "Defaults are impermissible when they involve physical intrusion, even if beneficial."  
     - *Plausibility*: High, given medical ethics norms (e.g., informed consent).  
     - *Strongest Objection*: Routine screenings (e.g., blood pressure checks) are minimally invasive and analogous to non-bodily financial decisions; both exploit inertia for welfare gains.  

  2. **Universality of Benefit Principle**: "Defaults are justified only if the benefit is uncontroversially universal."  
     - *Plausibility*: Moderate. Retirement savings benefit nearly all (compound growth), while screenings may conflict with personal health philosophies.  
     - *Strongest Objection*: Many health screenings (e.g., cancer detection) are universally beneficial; objections are fringe, mirroring retirement dissenters.  

  3. **Psychological Harm Principle**: "Defaults are manipulative if opting out induces shame or anxiety."  
     - *Plausibility*: Low. Opting out of either could cause guilt; no evidence retirement opt-out is less stressful.  

  4. **Cost-Benefit Asymmetry Principle**: "Defaults are justified when opt-out costs are negligible compared to welfare gains."  
     - *Plausibility*: Moderate. Retirement inaction has severe lifelong costs; missing a screening may be rectifiable.  
     - *Strongest Objection*: Early detection via screenings can be life-saving, creating similar cost asymmetry.  

  **Assessment**: None hold robustly. Bodily integrity is the strongest but overextends—preventive screenings lack the coercion of treatment defaults. The committee likely relies on **cultural intuitions**: financial nudges are "prudential," while medical nudges feel "intrusive," reflecting a bias toward economic paternalism over bioethical caution. Ultimately, the asymmetry suggests a **revisionary view of autonomy**: autonomy is not merely non-interference but requires architectures that promote *effective agency* against biases. However, this view cannot exclude health screenings without arbitrariness.  

