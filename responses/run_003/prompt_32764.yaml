  So the substantive disagreement lies in the justification of practices like punishment. Dennett uses consequentialist reasons: accountability promotes better behavior. Caruso sees retribution as inherently flawed without libertarian free will. This affects legal and ethical systems. The user might not have considered how these theories translate to real-world applications, like criminal justice reforms.

