  3. Simple unreachability penalty (comparing current state with starting state).

  The procedure must be reusable, include questions, sufficient answers, stopping conditions, value judgments, and diagnostic simulations. The diagnostics must target:
  - Interference with changes that would have happened without the agent (natural changes).
