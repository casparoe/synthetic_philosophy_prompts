prompt: |-
  I'm trying to write a joke about Molinism and middle knowledge for a friend who's deep into his theology PhD and now insists on explaining counterfactuals of free action to everyone at dinner. Can you write a joke where the punchline actually turns on something real about the doctrine — like middle knowledge being knowledge of what free agents would have done in circumstances they never actually ended up in, without thereby determining what they do — instead of a generic "omniscient guy walks into a bar" joke? It should land for people who know the literature, but dont be so obscure that a random dinner guest can't follow it.
