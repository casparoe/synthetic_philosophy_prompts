  I am a specialist in international relations theory, fluent in the vocabulary of polarity, unipolarity, hegemony, balancing, bandwagoning, the security dilemma, and the debate over whether unipolar orders are durable or conflict-prone. Lately I have been reading work from existential-risk and artificial-intelligence circles that defends the singleton hypothesis, and I want to know how much of it is genuinely new and how much of it is the unipolarity debate in different dress. Please restate the singleton hypothesis as faithfully as you can in the vocabulary of international relations theory: what it claims, why its proponents think a singleton would be more stable than the present order, why they regard the present order as dangerous, and what paths to a singleton they take seriously. Then give me the residue report. Which parts translate cleanly into claims about a unipole, hegemony, or the failure of balancing? Which parts can be made to fit only by distortion, for instance because a singleton is defined by decision-making agency rather than by a preponderance of material capabilities, or because a much-discussed path to a singleton runs through artificial intelligence rather than through the rise of a hegemonic state? Which parts have no expression in my vocabulary at all? Finally, tell me whether what fails to translate is evidence that the singleton hypothesis is less precise than its proponents think, or that international relations theory lacks concepts it needs. Please write your whole answer in continuous prose, with no headings, bullet points, bold text, or tables, the way you would write a letter.
