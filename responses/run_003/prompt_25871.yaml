answer: |-
  Here are the desiderata for an adequate account of Moorean absurdity, structured as requested, followed by the analysis of the most exclusionary desideratum:

  **Desiderata for an Adequate Account of Moorean Absurdity**

  1.  **Explain Commissive Absurdity ("p, but I don't believe that p"):**
      *   **Case/Consideration:** Uttering "It's raining, but I don't believe it's raining" seems deeply irrational or absurd, even if it's true that it's raining and the speaker indeed doesn't believe it. The assertion seems self-defeating or inconsistent in a profound way.
      *   **Status:** **Non-negotiable.** Any account failing to explain the absurdity of the commissive form is inadequate. It is the original and most discussed form.

  2.  **Explain Omissive Absurdity ("p, but I believe that not-p"):**
      *   **Case/Consideration:** Uttering "It's raining, but I believe it's not raining" seems equally, if not more, absurd than the commissive form. The speaker asserts p while simultaneously reporting a belief directly contradictory to p.
      *   **Status:** **Non-negotiable.** An adequate account must explain the absurdity of both forms. While sometimes seen as derivable from the commissive form plus the transparency of belief (if you believe not-p, you believe you don't believe p), a robust account should directly address it or show how it reduces to the commissive case.

  3.  **Explain First-Person Present-Tense Restriction:**
      *   **Case/Consideration:** The absurdity vanishes or weakens significantly in third-person ("It's raining, but she doesn't believe it") or past/future-tense first-person reports ("It was raining yesterday, but I didn't believe it then" / "It will rain tomorrow, but I won't believe it"). The core absurdity is tied to the speaker reporting their *current* belief state in relation to the asserted proposition *at the time of assertion*.
      *   **Status:** **Non-negotiable.** An account claiming the absurdity arises from a logical contradiction (e.g., p & ~Bp) must explain why this contradiction only manifests absurdly in the first-person present tense assertion. Accounts focusing on assertion norms must explain this restriction.

  4.  **Explain Asymmetry with the Converse ("I believe that p, but not-p"):**
      *   **Case/Consideration:** Uttering "I believe it's raining, but it's not raining" (Bp & ~p) is odd and perhaps indicates a false belief, but it lacks the *distinctive, self-defeating irrationality* of the Moorean assertions. It's conceivable (if mistaken) without the same level of pragmatic incoherence. The speaker isn't asserting p while undermining their commitment to p in the same way.
      *   **Status:** **Non-negotiable (though heavily debated).** Most theorists agree the asymmetry exists and is significant. An account explaining Moorean absurdity as a simple contradiction (p & ~Bp) fails here, as (Bp & ~p) is also a contradiction but lacks the characteristic absurdity. An adequate account must capture this difference.

  5.  **Specify the Locus of Absurdity (Belief, Assertion, or Both):**
      *   **Case/Consideration:**
          *   *Belief Focus:* Merely *believing* (p & I don't believe p) seems incoherent (Hintikka, Shoemaker). Can one genuinely hold both thoughts simultaneously? If absurdity is primarily doxastic, asserting it merely reveals this internal incoherence.
          *   *Assertion Focus:* The absurdity is primarily pragmatic. Asserting p constitutively expresses belief in p (Grice, Searle), presents p as known (Williamson), or commits the speaker to p. The Moorean assertion pragmatically contradicts this expression/commitment. Believing the Moorean conjunction might be possible, perhaps in non-ideal agents or complex self-deceptive states, but *asserting* it is always pragmatically defective.
          *   *Hybrid:* Absurdity arises from the interaction of belief norms and assertion norms.
      *   **Status:** **Negotiable / Camp-Dependent.** This is a major theoretical divide. *Non-negotiable* is that the account must clearly state its position and explain how it handles the chosen locus. A belief-focused account must explain why asserting the conjunction feels uniquely bad. An assertion-focused account must explain the *prima facie* doxastic oddity and the intuitive pull of the idea that one *cannot* sincerely believe the conjunction.

  **The Knockout Desideratum: Asymmetry**

  The single desideratum that does the most to exclude the leading accounts (Hintikka, Gricean, Knowledge-Norm) is **the Asymmetry with the Converse ("I believe that p, but not-p")**.

  *   **Hintikka-Style Doxastic Logic:** Hintikka treats absurdity as a logical contradiction arising from the *doxastic* inconsistency of believing (p & ~Bp). He invokes his "KK-thesis" (if you know/believe p, you know/believe that you know/believe p) to show that believing the commissive conjunction entails believing a contradiction (B(p & ~Bp) entails Bp & B~Bp, and B~Bp entails ~Bp via KK, yielding Bp & ~Bp). **Problem:** This approach *cannot* explain the asymmetry. The converse conjunction (Bp & ~p) is *also* a simple logical contradiction. If logical contradiction explains the absurdity, (Bp & ~p) should be just as absurd when asserted. But it's not. Hintikka's KK-thesis doesn't help here, as (Bp & ~p) doesn't involve iterated belief in the same way. The account wrongly predicts symmetry.
  *   **Gricean Implicature:** The Gricean story typically claims that asserting p conversationally implicates that the speaker believes p (via the Maxim of Quality). Thus, asserting "p, but I don't believe p" (commissive) or "p, but I believe not-p" (omissive) involves saying p (implicating Bp) while explicitly denying Bp (or asserting B~p), creating a pragmatic contradiction. **Problem:** This also fails to explain asymmetry. Asserting "I believe p, but not-p" involves saying "I believe p" (which, one could argue, might implicate something about the speaker's justification or the truth of p, but crucially *not* necessarily p itself) and explicitly denying p. The Gricean account struggles to show why the pragmatic clash in the converse is significantly *less* severe than in the Moorean cases. Canceling the implicature ("I believe p, but not-p, and I have no evidence it's raining, I'm just paranoid") seems to resolve the tension more readily than canceling the implicature in the Moorean case, where the absurdity persists.
  *   **Knowledge Norm of Assertion (KN):** Williamson argues that assertion is governed by the norm: assert p only if you know p. Asserting a Moorean sentence violates this norm: in "p, but I don't believe p", if you don't believe p, you cannot know p, so asserting p violates KN. Similarly for "p, but I believe not-p". **Problem:** This too predicts symmetry. Asserting the converse ("I believe p, but not-p") *also* violates the knowledge norm: you assert "I believe p". To know *that you believe p* requires knowing p is true (on some strong internalist views), or at least, if p is false, your belief that p is false, so you cannot *know* you believe p if your belief is false and you are aware of the falsity (which asserting ~p suggests). Even on weaker views, if p is false, "I believe p" might be true, but the speaker asserting ~p simultaneously suggests they *know* ~p, meaning they *know* their belief that p is false, undermining any claim to *know* they believe p in the required sense for proper assertion. KN thus seems to condemn both forms equally as violations, failing to capture the intuitive difference in the *character* of the absurdity. The Moorean assertion seems self-undermining in a way the converse is not, even if both violate KN.

  **Conclusion:** The asymmetry desideratum exposes a fundamental weakness in these leading accounts. They all treat the Moorean absurdity as arising from a defect (logical contradiction, pragmatic contradiction, norm violation) that applies equally or very similarly to the converse conjunction. However, the robust intuition that asserting the converse is significantly less absurd, or absurd in a different way (indicating simple error rather than self-defeat), demands an explanation that these accounts cannot easily provide. An adequate account needs a resource that distinguishes the *specific* way the Moorean assertions undermine the speaker's own commitment or authority regarding p, a feature lacking in the assertion of the converse. This is why asymmetry remains a central challenge and a powerful tool for evaluating theories of Moorean absurdity.
