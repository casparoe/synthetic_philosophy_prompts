prompt: |-
  I'm a TA for a second-year philosophy of mind module, and next week I've got one fifty-minute section (about twenty students) to teach Dennett's Orwellian/Stalinesque distinction about the timing of conscious experience. I don't want an explanation of the distinction itself; I want a plan for how I should teach it. The students have already seen the colour phi demo, and I suspect they'll come away thinking the only live question is whether the brain 'fills in' the gap, and that the Orwellian and Stalinesque stories are really just two ways of describing the same thing. What order should the pieces go in so the difference between the two models feels like a genuine difference rather than a verbal one? What one example should carry the session (and if it shouldn't be colour phi, why not)? What misconceptions should I expect, and where in the sequence should I head each off? Give me one question to end on that would show whether they've actually got the distinction rather than just the labels. Also tell me what I should openly refuse to settle at this level. And please write the whole plan in British English.
reasoning: |-
  Okay, let me think through how to structure this tutorial on Dennett's Orwellian/Stalinesque distinction. The user is a philosophy TA preparing a 50-minute session for second-year students who've already seen the colour phi experiment. The main challenge seems to be preventing students from collapsing the distinction into mere semantics - a real pedagogical tightrope walk.

  Hmm, the core problem is ontological: are we discussing actual brain processes (Stalinesque) or memory revisions (Orwellian)? Students often miss this because both explanations account for the same subjective experience. I recall Dennett's own frustration with what he called "the Cartesian theatre" misconception - that's probably where their confusion stems from.

  Right, I should avoid colour phi as the primary example since it encourages the "filling in" metaphor that blurs the distinction. The peripheral vision demo works better - it's immediate and undeniable. When you stare straight ahead and notice blurry peripheries versus sharp focus when you shift attention, that visceral experience makes the timing question unavoidable.

  For structure: start with the peripheral vision demo to hook them, then reconstruct their colour phi assumptions to surface misconceptions. Present the two models separately with clear diagrams - must emphasise they're mutually exclusive accounts of causation. The dictator analogy helps: Stalin rewrites history before it's recorded, Orwell alters records after the fact. Crucial to stress this isn't about labels but conflicting neural mechanisms.

  Ah, the memory revision point is subtle - Orwellian revision must happen before conscious access or it becomes Stalinesque! Need to flag that explicitly. And I must pre-empt the "just semantics" objection by showing how each theory would generate different empirical predictions (if only we could test them).

  For the final check: "Could both be true simultaneously?" If they say no and can explain why the brain can't do both at once for the same event, they've got it. Should end by refusing to resolve the hard problem - that's beyond this module's scope. Better to leave them marvelling at how slippery consciousness is.
answer: |-
  Here’s a structured 50-minute lesson plan in British English, designed to make the Orwellian/Stalinesque distinction feel ontologically substantive rather than merely verbal:

  **Session Title:** *When Did You *Really* See It? Dennett’s Temporal Battleground*  
  **Key Goal:** Distinguish **causal mechanisms** (Stalinesque: pre-experiential fabrication) from **narrative revision** (Orwellian: post-experiential editing).

  ---

  ### **Lesson Sequence**  
  **(Total: 50 mins)**  

  1. **Hook: The Peripheral Vision Demo** (5 mins)  
     - *Activity:* Ask students to stare fixedly at a spot on the wall. Wave a red pen slowly from periphery toward central vision.  
     - *Q:* "When you *first* become aware of the pen’s colour—is that moment the *exact* instant light hits your retina?"  
     - *Point:* Highlights the brain’s "timing problem." Replaces colour phi’s "filling in" with "timing of reportability."  

  2. **Revisit Colour Phi—Then Break It** (10 mins)  
     - *Q:* "Last week, you saw two dots flash; you *saw* a moving dot. How many think the brain ‘fills in’ the gap?" (Poll hands).  
     - *Pivot:* "But what if I told you ‘filling in’ assumes a *where* and *when* for consciousness? What if that’s the mistake?"  
     - **Head off misconception #1:** Challenge "filling in" as smuggling in a Cartesian Theatre. Emphasise: "Dennett isn’t debating *whether* the brain interpolates—but *when* it commits to a story."  

  3. **Introduce the Distinction with a New Example: The Libet Clock** (15 mins)  
     - *Why not colour phi?* Its discrete stimuli invite "filling in" talk. Libet’s rotating spot (students note when they decide to flick their wrist) forces a clash between *subjective timing* and *neural timing*.  
     - *Stalinesque Model (Dictator of Perception):*  
       - *Analogy:* "Like a film director reshooting a scene *before* the premiere. The brain fakes the motion *before* it enters ‘consciousness’."  
       - *Mechanism:* Pre-conscious buffer creates seamless motion.  
     - *Orwellian Model (Memory Editor):*  
       - *Analogy:* "Like a censor altering the archives *after* the premiere. You see disjointed flashes, but the brain *retroactively* edits memory."  
       - *Mechanism:* Post-hoc narrative revision.  
     - **Head off misconception #2:** "These aren’t two perspectives on one process. They’re *rival causal pathways*. One has fabrication *before* experience, the other *after*."  

  4. **Clarify the Distinction: The "When" Matters** (10 mins)  
     - *Thought Experiment:* "Suppose we could freeze time at 300ms during colour phi. In the *Stalinesque* brain, there’s already a fabricated moving dot ‘in the pipeline’. In the *Orwellian* brain, there’s only disjointed flashes—the ‘movement’ hasn’t been written yet!"  
     - *Key Slide:*  
       ```
       STALINESQUE: Stimulus → Fabrication → Conscious Experience  
       ORWELLIAN:   Stimulus → Fragmented Experience → Memory Revision  
       ```  
     - **Head off misconception #3:** "No, Orwellian revision isn’t ‘lying to yourself’. It’s that *the only access* you have to experience is via memory. Revision isn’t dishonest—it’s constitutive."  

  5. **The Test Question** (5 mins)  
     - *End with this:* **"Could both models be true *simultaneously* for the same event? Why/why not?"**  
       - *Correct answer:* No. They propose mutually exclusive causal sequences. If fabrication happens pre-experience (Stalinesque), there’s no "raw" experience to revise post-hoc (Orwellian).  

  6. **What We *Won’t* Settle Today** (5 mins)  
     - *Explicitly state:* "We’re *not* deciding which model is correct—or even if Dennett’s anti-realist view wins. We’re just learning why the distinction *isn’t verbal*: it’s about *when* in the causal chain your narrative gets fixed. Save the hard problem for next term!"  

  ---

  ### **Why This Works**  
  - **Libet over colour phi:** Avoids "filling in" baggage. Focuses on timing of *reportable events*.  
  - **Mechanism-first framing:** Stresses incompatible neural sequences (not descriptions).  
  - **The freeze-frame test:** Makes the distinction empirically tangible (even if untestable in practice).  
  - **British phrasing:** "Smuggling in," "rival pathways," "post-hoc," "constitutive," "hard problem."  

  **Materials:** Projector for Libet clock animation, red pen for demo. **TA Note:** Hammer the point: "If you think they’re the same, tell me *when the fabrication happens* in each model. If the ‘when’ differs, the models differ."
