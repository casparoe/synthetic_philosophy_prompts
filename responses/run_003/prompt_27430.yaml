prompt: |-
  ok so i'm running a philosophy reading group for grad students from other departments — mostly physicists and computer scientists, so they're sharp but haven't done formal epistemology. next week i'm doing the Sleeping Beauty problem and self-locating belief. i've got an hour and a half.

  don't explain the problem to me. i need you to plan how i should teach it. what has to come first, what has to be in place before the puzzle even bites, what example or variant should carry the whole session. i'm especially worried about the physicists assuming the answer is obviously 1/2 and the computer scientists assuming it's obviously 1/3 and both of them thinking the other side is just confused about conditional probability. what misconceptions should i expect from each camp, and at what point in the sequence do i head each one off. what's the one thing i should get them to do or answer at the end so i know whether they've actually understood what's at stake rather than just picked a side. and what should i openly refuse to settle — like, which part of the debate do i flag as genuinely unresolved versus which part is just people talking past eachother.
reasoning: |-
  Okay, the user is running a philosophy reading group for grad students in physics and computer science. They're tackling the Sleeping Beauty problem next week, focusing on self-locating beliefs. I need to create a lesson plan that addresses the different biases each group might have—physicists leaning towards 1/2 and computer scientists towards 1/3. The main goal is to ensure they understand the underlying principles rather than just picking sides.

  First, I should start with the basics. Since these students are sharp but lack formal epistemology, I need to introduce self-locating beliefs and indexicals. Using a simple example like "Where am I?" can help them grasp how context affects belief. Then, conditional probability is crucial. I'll use a classic example like the Monty Hall problem to show that conditional probabilities can be counterintuitive, which might resonate with both groups.

  Next, presenting the Sleeping Beauty problem clearly is key. I should avoid any ambiguous language. After explaining the setup, I'll poll the room to see initial opinions. This will highlight the split between the halfers and thirders. Then, I need to delve into both positions, emphasizing their reasoning without bias. For physicists, the 1/2 view might seem obvious because the coin is fair, but they might overlook that Beauty's awakenings aren't equally likely scenarios. Computer scientists might focus on the three possible awakening states but not account for the causal structure or the coin's initial probability.

  I should introduce the Technicolor Beauty variant, where a second coin toss determines the room color. This makes it clearer that Monday-Heads and Monday-Tails are different. When Beauty sees a blue room, the probability shifts, demonstrating that self-locating information affects belief. This example can bridge the gap by showing both positions might be answering different questions.

  Common misconceptions need addressing. Physicists might conflate objective probabilities with credences, while computer scientists might treat all awakenings as equally likely without considering the coin's bias. I'll clarify that the coin's fairness doesn't directly translate to credence upon awakening. Also, I need to stress that conditional probability requires defining the sample space correctly, which both groups might mishandle.

  To wrap up, I should have them articulate why both sides have merit and what the core disagreement is. I'll emphasize that the unresolved issue is how to formalize self-locating beliefs in probability frameworks. I'll avoid getting stuck on specific arguments and instead focus on the philosophical underpinnings. Finally, I'll provide resources for further exploration, ensuring they know where to look if they want to delve deeper.
answer: |-
  Here's a battle-tested lesson plan designed to maximize insight and minimize factional trench warfare in your 90-minute session:

  **Core Goal:** Shift focus from *which answer* to *why the disagreement exists* and *what it reveals about self-locating belief & probability.*

  **Key Strategy:** Use **Technicolor Beauty** as the primary vehicle *after* establishing core concepts. It makes the structure undeniable.

  **Phase 1: Foundations (25 mins) - Building the Conceptual Toolkit**
  1.  **Self-Locating Belief & Indexicals (10 mins):**
      *   *Starter:* "Where am I? What time is it? Who am I?" These depend on *who* is asking and *when/where* they are.
      *   *Example:* "Imagine you wake up with amnesia in a windowless room. You know there are identical rooms: 10 red, 5 blue. What's your credence your room is red?" (2/3). *Crucially:* This credence depends on *your location*, not just the global property distribution.
      *   *Key Point:* Beliefs often need to account for the agent's *perspective within* the world.
  2.  **Conditional Probability Refresher & Pitfalls (15 mins):**
      *   *Quick Review:* P(A|B) = P(A & B) / P(B). Depends entirely on the sample space defining "all possibilities".
      *   *Pitfall Example (Monty Hall Lite):* "Two envelopes, one has $100, one has $200. You pick one. Before you open, I show you $100 in the other. Should you switch?" (Yes, P(Your=$200 | I showed $100) = 2/3). *Emphasize:* The information ("I showed you $100") *changes the relevant sample space*. Physicists/CS often trip here by using the prior sample space.
      *   *Key Point:* "Conditional on what?" is paramount. Defining the relevant "centered possible worlds" or "temporal parts" is non-trivial.

  **Phase 2: The Beast - Sleeping Beauty (20 mins) - Framing the Puzzle**
  1.  **Present SB Problem CLEARLY (5 mins):**
      *   Sunday: Beauty knows fair coin flip (H/T).
      *   H: Wake Mon only. T: Wake Mon & Tue.
      *   After each waking: Drug erases memory of waking.
      *   Question: **"When Beauty is awakened *this time* (Monday or Tuesday), what should be her *credence now* that the coin landed Heads?"**
      *   *Stress:* It's *this awakening event* happening *now*. Not "over the experiment".
  2.  **Initial Poll & Quick Rationales (5 mins):** "Show of hands: 1/2? 1/3? Unsure?" Don't debate yet. Just get temperature.
  3.  **Outline the Positions NEUTRALLY (10 mins):**
      *   **Halfer (1/2):** "The coin is fair. No new *information about the coin* is gained upon waking (she knew the setup). Her credence should remain 1/2. The different number of awakenings is irrelevant to the coin's bias."
      *   **Thirder (1/3):** "There are three *epistemically possible awakening events* she could be experiencing right now: Mon-H, Mon-T, Tue-T. All are subjectively identical. Only one has Heads. Hence 1/3."
      *   *State Clearly:* Both arguments sound compelling intuitively and can be formalized with probability. The conflict arises.

  **Phase 3: Deep Dive & De-escalation via Technicolor Beauty (30 mins)**
  1.  **Introduce Technicolor Beauty (5 mins):** "Modification: *After* the first coin flip (H/T), a *second* fair coin is flipped *only if the first was Tails*.
      *   If Heads (First): Wake Monday in a **Red** room.
      *   If Tails (First) & Heads (Second): Wake Monday in **Blue** room, Tuesday in **Red** room.
      *   If Tails (First) & Tails (Second): Wake Monday in **Red** room, Tuesday in **Blue** room.
      *   Same amnesia drug."
  2.  **The Crucial Question (5 mins):** "Beauty wakes up. **She sees a BLUE room. What is her credence *now* that the first coin landed Heads?"**
  3.  **Guided Analysis (20 mins):** Walk through step-by-step:
      *   *What are the possible centered worlds?* (Mon-H-Red, Mon-T-Blue, Mon-T-Red, Tue-T-Red, Tue-T-Blue). *But she sees Blue!*
      *   *Conditional on seeing Blue:* What events lead here?
          *   H1 & Blue? Impossible. (Heads only wakes in Red).
          *   T1 & H2: Wakes *Monday* in Blue (Tue in Red).
          *   T1 & T2: Wakes *Tuesday* in Blue (Mon in Red).
      *   *Sample Space given Blue:* Two possible centered worlds: **Mon-T-Blue** or **Tue-T-Blue**. Both require First Coin = Tails.
      *   *Probability:* P(First Coin = Heads | See Blue) = 0. P(First Coin = Tails | See Blue) = 1.
      *   *Crucial Observation:* Seeing Blue *rules out Heads entirely* and tells her it's Tails. But it *doesn't tell her if it's Monday or Tuesday!* She still has self-locating uncertainty ("Am I in the Mon-T-Blue or Tue-T-Blue awakening?"), but it's irrelevant to the first coin. **Her credence in Heads is 0.**
  4.  **Why This Works:**
      *   Forces explicit modeling of centered worlds.
      *   Makes the causal structure (which coin flip affects what) undeniable.
      *   Shows self-locating uncertainty can persist *without* affecting the target proposition (first coin).
      *   Highlights "new information" isn't always about the *target*; it can be purely self-locating, yet still impact credence *if* it correlates.

  **Phase 4: Synthesis, Misconceptions & What's Unresolved (15 mins)**
  1.  **Addressing Camp Biases Head-On:**
      *   *Physicist Misconception (1/2 is "obvious"):* "The coin is fair, so 1/2!" **Pitfall:** Confuses the *objective chance* on Sunday with *credence upon awakening*. Technicolor shows self-locating info *can* radically shift credence even about a fair coin's outcome. The awakenings aren't irrelevant; they structure the possibilities *from her perspective*.
      *   *Computer Scientist Misconception (1/3 is "obvious"):* "Three states, one Heads, so 1/3!" **Pitfall:** Treats the three awakening types as *equally likely possibilities* unconditionally. But they aren't causally independent. Mon-H and Mon-T/Tue-T are mutually exclusive *only* if you specify the day/outcome together. The coin's bias *creates* the asymmetry (P(Mon-H) = 1/2, P(Mon-T) = 1/4, P(Tue-T) = 1/4). Technicolor makes this asymmetry explicit.
      *   *Both Camps:* Misapplying conditional probability by using an ill-defined/unagreed sample space ("all coin flips" vs. "all awakening events").
  2.  **The Core Stakes:** What *is* the correct way to represent an agent's epistemic state and update rules when self-location is uncertain? How do we define the relevant "reference class" (all awakenings? awakenings *like this*?) for assigning credence? **The disagreement is fundamentally about the *framework* for reasoning under self-locating uncertainty.** (Point to Lewis vs. Elga papers as exemplars).
  3.  **What to Openly Refuse to Settle:**
      *   **Refuse:** To declare either 1/2 or 1/3 as the definitively "correct" answer for the original problem. Acknowledge the debate is live and each position has sophisticated defenses.
      *   **Flag as Genuinely Unresolved:** The best *general framework* for self-locating belief (e.g., centered worlds + conditionalization vs. double-halving vs. thirder "equiprobability of awakenings" vs. causal/evidential distinctions).
      *   **Flag as Often Talking Past:** Whether the question is about the *coin's bias* or about *which temporal part* she is. Whether "new information" is gained upon waking (Halfers: 'No info about coin'. Thirders: 'Info about which centered world I'm in').
  4.  **The "Did They Get It?" Check (Final 5 mins):**
      *   **Ask:** "Beauty wakes up (original problem). She knows it's Monday. What is her credence *now* that the coin landed Heads?"
      *   *Correct Understanding:* They should see **this** is the crucial reveal. Original Halfers and Thirders **agree here**.
          *   *Reasoning:* If it's Monday, the coin could be H (leading to this awakening) or T (also leading to *this* Monday awakening). P(Heads | Monday) = P(Heads & Monday) / P(Monday) = (1/2) / (1/2 + 1/2 * 1) = (1/2) / (3/4)? Wait, no! Define properly.
          *   *Better:* Given it's Monday, the only possibilities are Mon-H and Mon-T. Mon-H has prior prob 1/2, Mon-T has prior prob 1/4? Technicolor helps: Seeing *Red* on Monday in that variant gives P(First Heads | Monday & Red) = P(Mon-H-Red) / [P(Mon-H-Red) + P(Mon-T-Red)] = (1/2) / (1/2 + 1/4) = (1/2)/(3/4) = **2/3**. (In original, without colors, but knowing it's Monday, it's analogous: P(Heads | Monday) = P(Mon-H) / [P(Mon-H) + P(Mon-T)] = (1/2) / (1/2 + 1/4) = 2/3).
      *   *Why it Checks Understanding:* It forces them to apply conditionalization rigorously *within* a specific centered context (Monday), integrating the self-locating information. **If they get ~2/3 and can explain *why* it differs from both their original 1/2 or 1/3, they've grasped the conditional nature and the role of self-locating info.** If they still say 1/2 or 1/3, they're stuck in their initial camp.

  **Materials:** Whiteboard/Projector essential. Prepare clear slides/text for SB and Technicolor setups. Have Lewis's "Halfer" paper (2001) and Elga's "Thirder" paper (2000) references ready.

  **Tone:** Be the neutral facilitator. Your goal isn't to convert them to one answer, but to show them *why* smart people disagree and *what* the deep issue is. Emphasize that confusion is the *correct* initial response to a profound puzzle! Good luck – this is a fantastic topic for that audience.
