prompt: |-
  In most ordinary moral discourse, we treat a piece of moral criticism as dismissible — or at least as carrying less weight — when it comes from someone who engages in the very conduct they are condemning. The cheating spouse who lectures others about fidelity, the polluting corporation that runs ads about environmental responsibility, the politician who evades taxes while denouncing public fecklessness: in each case the common reaction is not that the criticism is false, but that the speaker lacks the standing to make it. We say "you're one to talk," "clean up your own house first," "who are you to judge?" And this reaction isn't merely an emotional one; it is treated, in practice, as a reason to set the criticism aside — in workplace complaints, in public debate, in friendship, and sometimes even in legal reasoning (for instance, in the clean-hands doctrine in equity, or in the admissibility of certain character evidence).

  But this practice is puzzling in several ways. First, it seems to treat moral criticism as something other than the assertion of a true proposition: if the criticism is true, why should the identity of the speaker matter? We don't dismiss a mathematician's proof because the mathematician is a hypocrite. Second, the practice is selective. A judge who has committed crimes can still sentence a criminal; a philosopher who doesn't live by their own ethical views can still be correct; a doctor who smokes can still tell a patient to quit. So the practice of discounting hypocritical blame doesn't apply to all normative speech — it seems to track something specific about blame in particular. Third, the practice seems to presuppose that blame does something beyond describing a wrong: that it involves a kind of standing, authority, or entitlement that can be forfeited. But what exactly is that thing, and how is it forfeited? Does any inconsistency between one's behavior and one's criticism destroy standing, or only certain kinds? If I condemn dishonesty but once told a white lie, have I lost standing to blame a fraudster? If not, where is the line?

  I want you to reconstruct the implicit theory of blame — of what blame is and what it requires of the blamer — that this widespread practice presupposes. In particular:

  - What must blame be, such that hypocrisy undermines it in a way it doesn't undermine other forms of normative speech (advice, legal judgment, mathematical criticism)?
  - What account of standing does the practice commit us to? Is standing a matter of the speaker's own moral record, their commitment to the norm they invoke, the relationship between speaker and target, or something else?
  - Is the practice internally consistent? That is, does it treat hypocrisy as undermining blame in some contexts but not others, and if so, can those distinctions be justified by the underlying theory, or do they reveal a contradiction?
  - What would have to change in our practices — in how workplaces handle complaints, in the norms of public political criticism, in the law — if we replaced the presupposed theory with a view on which blame is nothing more than the assertion of a moral truth, and standing is irrelevant?

  Please take a definite position: don't just lay out the options. Tell me what theory of blame you think the practice actually commits us to, where the practice is underdetermined (so that several theories could license it), and where the practice is philosophically inconsistent and needs revision.
reasoning: |-
  Okay, the user is asking about the implicit theory of blame underlying the common practice of dismissing hypocritical criticism. They've outlined several puzzles: why speaker identity matters for moral criticism but not for other assertions like math proofs; why the practice is selective (e.g., judges can still sentence criminals despite personal misconduct); and what exactly is forfeited in hypocrisy. They want me to reconstruct the presupposed theory of blame, addressing four specific questions about blame's nature, standing requirements, internal consistency, and implications of changing the theory.

  Hmm, this is a deep philosophical question about metaethics and social practices. The user seems well-versed in philosophy - they reference legal doctrines like "clean-hands" and make nuanced distinctions between types of normative speech. Probably an academic or advanced student. Their frustration with the inconsistency in everyday moral reasoning is palpable. They're not just asking for description but for a defended interpretation.

  First, I need to tackle why hypocrisy specifically undermines blame but not other normative speech. The key difference appears to be blame's performative dimension. When a mathematician proves a theorem, they're just conveying truth. But blame isn't just saying "this act is wrong" - it's an act of moral community enforcement. It implicitly claims "I have the right to hold you accountable." That's why the blamer's own relationship to the norm matters. The cheating spouse isn't wrong about fidelity being important, but their violation dissolves their authority to enforce that norm against others.

  The standing question is trickier. From the examples (workplace complaints, friendship, legal doctrines), it seems standing requires both: (1) personal adherence to the norm (or credible repentance), and (2) a relationship that grants enforcement rights. That explains why a judge can sentence a criminal - their institutional role overrides personal misconduct - while a friend criticizing infidelity loses standing if they're unfaithful. The commitment to the norm is key though: a doctor who smokes while telling patients to quit might still have standing if they openly struggle with addiction, showing they endorse the anti-smoking norm.

  About consistency... honestly, the practice is messy. We accept hypocritical blame from authorities (like judges) but reject it in peers. This isn't fully consistent, but it can be justified by differentiating institutional vs. interpersonal blame. Where it truly breaks down is in "lesser hypocrisy" cases - like condemning fraud after telling a white lie. Daily practice is often inconsistent here, sometimes accepting gradations ("my lie was minor, your fraud is serious"), sometimes rejecting all criticism from imperfect people. The underlying theory should distinguish severity and recency of violations, but current practice rarely does.

  If we adopted a purely propositional view of blame ("just stating moral facts"), public discourse would transform. Workplace complaints couldn't be dismissed due to the complainant's hypocrisy - we'd have to evaluate claims purely on merit. Legal doctrines like "clean hands" would vanish. But we'd lose something vital: blame's social function of mutual accountability. Imagine a serial harasser filing harassment complaints - under the propositional view, we'd have to seriously consider their claims even while they're actively violating norms. That feels unsustainable for community trust. Perhaps we'd need new institutions to separate truth-assessment from accountability-enforcement.

  My core argument will be that the practice commits us to a "communal accountability" theory: blame is a speech act that exercises normative authority within a moral community, requiring the blamer to be in good standing regarding that specific norm. The inconsistencies arise because we intuitively recognize institutional authority as separate from personal standing, and because we haven't developed clear criteria for when hypocrisy is "relevant enough" to undermine standing. We should refine the practice by distinguishing between blame's truth (which hypocrisy doesn't affect) and its legitimacy as an accountability act (which it can undermine), and by developing standards for forfeiture proportionality.
answer: |-
  The practice you describe commits us to a **communal accountability theory of blame**. On this view, blame isn't merely descriptive but a *performative act of moral enforcement* within a shared normative community. Hypocrisy undermines blame specifically because it reveals the blamer's failure to participate in the communal project of mutual accountability that blame presupposes. Here's the reconstructed theory:

  ### 1. **What Blame Must Be: The Performative Dimension**  
     Blame is not just an assertion of moral truth ("Action X is wrong"). It is a **demand for accountability** issued by someone who implicitly claims membership in, and authority from, a moral community bound by shared norms. When you blame, you:  
     - **Invoke a shared norm** ("We both accept that dishonesty is wrong").  
     - **Assert your standing to hold others accountable** ("As a participant in this norm, I can call you out").  
     - **Trigger a social response** (e.g., guilt, restitution, or reputational consequences).  
     
     *Why hypocrisy undermines this but not other speech*:  
     - **Legal judgments** derive authority from institutional roles, not personal conduct.  
     - **Advice** is future-oriented and doesn’t require the advisor’s past compliance (e.g., a doctor who smokes can still know smoking harms health).  
     - **Mathematical proofs** are context-independent truths; the speaker’s conduct is irrelevant.  
     Blame, however, relies on the blamer’s *credibility as a co-participant* in the norm. Hypocrisy exposes a failure to submit to the norm oneself, voiding the blamer’s authority to enforce it.

  ### 2. **Standing: Moral Record, Commitment, and Relationship**  
     Standing requires three conditions:  
     - **Personal Adherence**: The blamer must generally comply with the norm they invoke. A single past lapse may not destroy standing if it’s acknowledged as wrong and exceptional (e.g., condemning fraud after one "white lie" likely retains standing if the liar expresses remorse). Systemic or unrepentant hypocrisy (e.g., the cheating spouse) forfeits standing.  
     - **Sincere Commitment**: The blamer must genuinely endorse the norm, not exploit it selectively. A polluting corporation feigning environmental concern lacks this.  
     - **Relevant Relationship**: Standing depends on the blamer’s relationship to the wrongdoer and the community. A judge sentencing a criminal retains standing because their institutional role overrides personal conduct, but a friend condemning infidelity loses standing if they cheat.  

     **Where the practice is underdetermined**:  
     - *How much hypocrisy is too much?* Current practice inconsistently draws the line. Condemning a fraudster after a white lie is often accepted, but condemning adultery after a one-night stand may not be. The theory *should* require proportionality: standing is lost only when the blamer’s violation is comparably serious and unrepented.  
     - *Does repentance restore standing?* Practice is split. Philosophically, sincere repentance (e.g., the smoker who quits and admits past failure) *should* restore standing, as it reaffirms commitment to the norm.

  ### 3. **Internal Consistency: Contextual Tensions**  
     The practice is **inconsistent in two key areas**, revealing flaws in the underlying theory:  
     - **Institutional vs. Interpersonal Blame**: We accept hypocritical blame from judges or philosophers because we separate institutional authority from personal virtue. But this contradicts the communal theory, which ties standing to moral participation. *Resolution*: The theory should distinguish **role-based standing** (authority derived from social functions) from **moral standing** (authority derived from shared accountability). Only the latter is undermined by hypocrisy.  
     - "Lesser" Hypocrisy: We often dismiss blame for minor inconsistencies (e.g., "You once jaywalked, so you can’t condemn my theft!"). This stretches the theory to absurdity. *Resolution*: Standing should require compliance only with the *specific norm* invoked and only if the blamer’s violation is recent, serious, and unrepented.  

     **Contradiction**: We inconsistently demand "purity" in interpersonal blame but ignore it in institutional contexts. This reflects an unprincipled dualism. The theory *should* unify by requiring all blamers to have standing, but define standing more flexibly for institutional actors (e.g., a judge’s standing flows from office, not personal conduct).

  ### 4. **Implications of a Purely Propositional View**  
     If blame were merely asserting moral truths (ignoring standing):  
     - **Workplaces**: HR could not dismiss harassment complaints from hypocritical complainants. Investigations would focus solely on the accused’s conduct, potentially enabling bad-faith accusations.  
     - **Public Debate**: Hypocritical political criticism (e.g., a tax-evader condemning greed) could not be dismissed ad hominem. This might elevate truth but erode trust in critics.  
     - **Law**: Doctrines like "clean hands" (barring relief to those with unclean conduct) would collapse. Character evidence (e.g., exposing a whistleblower’s hypocrisy) might become inadmissible, focusing trials on acts alone.  
     
     **The Cost**: Blame would lose its *social function* as a tool for mutual accountability. If anyone can blame regardless of their conduct, the communal bond that makes blame effective weakens. We might replace it with impersonal "norm violations reports," but this risks colder, more bureaucratic moral interactions.

  ---

  ### The Required Revision: A Unified Theory  
  The practice commits us to a theory where blame is **communal moral enforcement**, but its inconsistencies reveal unresolved tensions. To fix this:  
  1. **Clarify standing**: Standing is forfeited only for *serious, unrepented violations* of the *specific norm* invoked.  
  2. **Distinguish role-based standing**: Institutional actors (judges, doctors) derive standing from their role, not personal conduct, unless their hypocrisy directly corrupts their role (e.g., a corrupt judge).  
  3. **Accept graded standing**: A reformed hypocrite (e.g., a former polluter who now campaigns for sustainability) regains standing through demonstrable commitment.  

  Without these revisions, the practice remains self-contradictory—demanding moral purity in peers while excusing authorities. The core insight is sound: blame is a social act, not just a truth-claim. But we must refine *how* we tie standing to participation in shared norms.
