  ok so I'm taking a course on the philosophy of probability this term and we've been going back and forth on whether Popper's propensity interpretation is actually a genuine third way or just frequentism in a trench coat. I keep coming back to teh thought that propensities are only ever defined and measured through long-run frequencies, so the propensity interpretation doesn't actually escape the reference class problem or the single-case problem that frequentism has — it just adds a metaphysical story about "real dispositions" that doesn't buy us anything empirically.

  I was talking to a classmate about this and they kept defending the "single-case" claim (that a propensity is a property of a single experimental arrangement, not of a long run), which is the main selling point Popper's defenders lean on, but I think that's exactly where the interpretation breaks down, because we can only ever know the propensity by observing the long-run frequency. Can you make the strongest version of the argument that the propensity interpretation collapses into (or is at least no better than) frequentism? I want it to engage with the single-case claim head-on, because that's the crux.

  And I'm not looking for a survey of all three interpretations or a neutral overview — I want a focused, one-sided argument for this specific collapse thesis, the kind I could use to steelman the other side of a debate I'm in.
