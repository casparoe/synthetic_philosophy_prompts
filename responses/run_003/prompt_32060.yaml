answer: |-
  ### The gist  
  The **frame problem** is the challenge of efficiently representing which aspects of the world remain unchanged after an action. Dan argues for **explicit frame axioms** listing every unaffected fact, ensuring precision but risking combinatorial explosion. Maya advocates for **default persistence** (assuming facts hold unless an action changes them), prioritizing scalability but facing potential conflicts. The core disagreement is whether to *explicitly define non-changes* or *assume persistence by default*.

  ---

  ### Move-by-move breakdown  
  1. **Dan’s frame axioms proposal**  
     *Rating: Partially right but impractical.*  
     He’s correct that *some* persistence guarantees are needed, but explicit enumeration is computationally infeasible for complex environments (e.g., 10,000 objects × 100 properties → millions of axioms). This approach mirrors early AI efforts (e.g., Green’s 1969 theorem prover), abandoned due to scalability.  

  2. **Maya’s default-logic rebuttal**  
     *Rating: Largely right, with caveats.*  
     She correctly identifies the frame problem’s history (McCarthy & Hayes, 1969) and why enumeration fails. Default persistence *is* the modern standard (e.g., STRIPS, PDDL planners). However, she understates the challenges of conflict resolution.  

  3. **Dan’s conflict critique**  
     *Rating: Valid but overstated.*  
     Default conflicts *do* occur (e.g., "cat asleep" vs. "dishwasher noise wakes cat"), but real-world planners mitigate this via **action exclusion axioms** or probabilistic reasoning (e.g., Markov Decision Processes). His "auditability" point is fair but ignores runtime costs.  

  4. **Maya’s "solution to frame problem" claim**  
     *Rating: Mostly right.*  
     Modern planners (e.g., FastForward, LAMA) *do* treat persistence as default via **STRIPS-style operators** (Fikes & Nilsson, 1971), listing only *changes* per action. Humans *do* use similar heuristics, as she notes. Her claim aligns with the field’s consensus.  

  5. **Dan’s relevance argument**  
     *Rating: Insightful but incomplete.*  
     He’s right that humans filter irrelevant facts (e.g., ignoring wall color during dishwashing), and frame axioms *can* encode relevance. But **automatic relevance detection** (e.g., using domain-specific heuristics or ML) is more scalable than manual axioms.  

  6. **Maya’s "question-begging" counter**  
     *Rating: Correct.*  
     Relevance *is* the core challenge (known as the **ramification problem**). Dan’s proposal defers the problem without solving it. Planner languages like PDDL address this via **domain constraints** (e.g., "only kitchen items affect dishwasher state").  

  ---

  ### Overall verdict  
  **Maya is more aligned with modern practice**, as default persistence underpins virtually all real-world planners (e.g., ROSPlan, integrated with ROS robots). However, **both miss key nuances**:  
  - Dan’s approach is untenable at scale but highlights the need for **explicit domain constraints** (e.g., defining action preconditions/effects narrowly).  
  - Maya’s default logic requires robust **conflict-resolution layers** (e.g., temporal reasoning or probabilistic models) she didn’t address.  

  **The solution is hybrid**: Domain-specific planners (like your home robot) use **STRIPS/PDDL operators** (listing only changes) combined with **static invariants** (e.g., "wall color never changes"). For edge cases (e.g., the cat waking), **sensor feedback** overrides defaults. Implementations like **successor state axioms** (Reiter, 1991) also formalize "change lists" without exhaustive non-change axioms.  

  **Recommendation**: Explore a PDDL-based planner with domain axioms (e.g., "only *nearby* objects are affected") and probabilistic conflict handling. This balances Maya’s scalability with Dan’s auditability.
