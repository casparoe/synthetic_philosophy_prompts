  I'll avoid making this too academic though. Concrete examples matter - like how the user's High Holiday attendance reconstructs time and relationships, or how kashrut creates ethical awareness. The key is showing that dismissing this as "play-acting" misunderstands how rituals generate meaning. Play-acting implies detachment, whereas the user clearly experiences this as binding.

  Also worth noting: the friend's demand for propositional grounding might itself be questionable. Does cheering for a team require belief in factual claims? Not really - it's about participation in shared significance. Religious practice is similar but deeper, woven into one's entire moral vocabulary.
answer: |-
  You've articulated a profound tension that many thoughtful religious practitioners face. Your friend's dichotomy—either factual claims about supernatural beings or mere emotional expression—reflects a common but philosophically limited view of religious language. As a philosopher of religion, I see several nuanced responses available to you. Let me outline key approaches before defending the strongest one.

  ### Key Philosophical Responses to the "Two-Option" Trap
  1. **Wittgensteinian "Form of Life" Approach**  
     Ludwig Wittgenstein argued that meaning arises from context within a "language game" embedded in a shared way of living. Religious practices (prayer, rituals) aren't claims about the world's furniture; they're **constitutive acts** that shape your orientation toward existence. Saying "God hears prayers" functions like a grammatical rule within this practice—it defines what prayer *is*, not an empirical hypothesis. Truth here is fidelity to the internal logic of the tradition, not correspondence to external facts.

  2. **Non-Realist Theology (e.g., Don Cupitt, D.Z. Phillips)**  
     Religious language expresses **human values and existential commitments**, not supernatural facts. When you pray, you're not addressing a cosmic person but engaging with the deepest layers of your own moral consciousness. "God" symbolizes the ultimate frame of meaning—truth is measured by how this framework shapes your ethical life. Your food rules aren't about divine commands but about cultivating mindfulness and communal identity.

  3. **Phenomenological Approach (e.g., Martin Buber, Abraham Heschel)**  
     Religious experience precedes belief claims. Prayer is a mode of **encounter**—not with a "person in the sky," but with the overwhelming "Thou" dimension of reality (Buber), or the "ineffable" that transcends concepts (Heschel). Truth lies in the transformative power of this encounter. Your High Holiday attendance isn't about factual claims; it's responding to a primordial call to judgment and renewal.

  4. **Narrative Hermeneutics (e.g., Paul Ricoeur)**  
     Religious texts and practices are **symbolic narratives** that "re-describe" reality. They offer lenses through which to interpret suffering, joy, and moral dilemmas. "God exists" isn't a scientific claim but an invitation to see the world *as* created, sustained, and judged—a perspective that generates ethical action. Truth is the fruitfulness of this interpretive framework for your life.

  ---

  ### The Strongest Response: A Synthesis  
  The most robust answer combines Wittgenstein's insight about practices with Charles Taylor's concept of **"social imaginaries"** and Alasdair MacIntyre's **"tradition-constituted rationality."** Here’s how to articulate it:

  **Where your friend's dichotomy fails:**  
  He assumes all meaningful statements must be either:  
  (A) *Empirical-factual* (like "the table is in the room"), or  
  (B) *Non-cognitive expression* (like cheering).  
  But religious language often operates as **"constitutive discourse"**: it creates the framework within which certain experiences and judgments become possible. Consider analogies:  
  - Saying "This law is unjust" isn’t *just* factual (it interprets facts) or *just* emotive (it makes a binding claim).  
  - Declaring "I love you" isn’t reporting a feeling; it’s committing to a way of relating.  

  **What prayer "truth" could mean:**  
  When you pray, you’re participating in a centuries-old practice that:  
  - **Forms moral perception**: Keeping kosher isn't about divine displeasure; it's training attention to ethical choices (e.g., mindful consumption, solidarity with ancestral practice).  
  - **Sustains a community of memory**: Your High Holiday presence re-enacts a story of covenant and repentance, binding you to others across time.  
  - **Articulates existential vulnerability**: Prayers like the *Unetaneh Tokef* ("Who shall live and who shall die...") aren't claims about God’s decisions but ritualized confrontations with human fragility.  

  **Why it’s not play-acting:**  
  Play-acting implies detachment. But your practice *actually shapes your identity and values*. As philosopher D.Z. Phillips argued:  
  > *"To believe in God is to see a meaning in one’s life, to be gripped by certain values... The reality of God is shown in what difference the belief makes."*  

  If abandoning these practices would rupture your connection to family, history, and ethical grounding, then they’re manifestly *real* in their effects—far more "true" than a detached factual claim you never act upon.

  ---

  ### How to Respond to Your Friend  
  1. **Challenge the false binary**:  
     *"You're forcing religious language into a scientific/emotional straitjacket. But we use many types of truth: moral, poetic, relational. When I say 'I owe my life to my parents,' that's not just emotion or biology—it's a truth about debts that shape who I am. My practice is like that."*  

  2. **Reframe "belief"**:  
     *"I don't 'believe in God' like I believe in Australia. I *trust* in a framework that makes my life coherent. Prayer isn't a call to a supernatural helpline; it's how I align myself with a demanding vision of justice and compassion. Isn't that more substantial than cheering at a game?"*  

  3. **Embrace pragmatic truth**:  
     *"William James said beliefs are 'rules for action.' My 'belief' in God is the rule: *Live as if existence is grounded in sacred responsibility.* When I pray, I'm not talking to the ceiling—I'm renewing my commitment to that rule. False play-acting? The tears in my eyes on Yom Kippur beg to differ."*  

  **In essence**: Your practice isn't a *failed theory* about the world; it's a *successful orientation* to the world. The "truth" of saying *Shema Yisrael* lies not in cosmological claims, but in how it binds you to a people, a history, and an ethical demand—realities as tangible as any table in the room.  

  Would you like to workshop a specific counter-argument for your next conversation? This dialogue honors a deep truth: faith and doubt aren't opposites—they're often the same integrity, wrestling.
