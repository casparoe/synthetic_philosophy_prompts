prompt: |-
  I'm on the ethics review commitee at a mid-size tech company — we handle the cases that aren't clear-cut legal violations but feel wrong, like dark patterns, questionable data practices, or features that are technically opt-in but designed so nobody reads the consent. We've been at this for two years and I'm frustrated that we don't have a shared framework. I just read Theory of Moral Sentiments and I'm convinced Smith's impartial spectator is basically what we need — the idea that you judge an action by imagining how a well-informed but disinterested observer would react to it, and that this spectator is supposed to correct for the fact that you're partial to yourself and your own crowd. But I have no idea how to turn that into something we can actually run a case through on a Tuesday afternoon.

  Can you write me an actual procedure? Like a checklist or a series of questions we ask in order, with guidance on what counts as a good enough answer to each before moving on. A few things it needs to handle:

  - We're all insiders. We know the people who built the feature, we have stock, we want the company to succeed. Smith talks about how we naturally overvalue our own interests — the procedure should have a step that explicitly corrects for this.
  - The impartial spectator is supposed to be well-informed. So we need a step where we make sure we actually have the facts, not just the version the product team gave us.
  - Smith distinguishes between whether an action is proper (proportionate, fitting) and whether it's meritorious (deserves reward or punishment). I think our procedure should track that distinction somehow — some things we review are just indecent without being actively harmful, and vice versa.
  - There's also the thing where Smith says the impartial spectator's judgments are shaped by general rules that emerge from repeated social experience — so the procedure shouldn't just be "what would a random reasonable person think," it should somehow incorporate the accumulated norms of our industry and society.

  Mark clearly which steps are mechanical and which require a judgment call. And flag the cases where the procedure will break down or give ambiguous output.

  Then run it on two cases we're actually looking at:

  Case A: We want to launch a feature that auto-plays short-form video after any search query, using a recommendation algorithm we know exploits the same reward mechanisms as slot machines. Engagement projections are through the roof. It's not illegal, it's not even unusually aggressive by industry standards, but our own UX researchers say it'll be hardest to disengage for users with ADHD and older users who don't understand recommendation algorithms.

  Case B: We're considering entering a market where we'll need to hire local distributors. The standard practice in that market is that distributors pay small facilitation fees to customs officials to avoid multi-week delays. These aren't bribes to get something you're not entitled to — they're bribes to get what you're legally entitled to, on time. We could refuse and just accept the delays, but our competitors won't, and our local team says we'll be at a serious disadvantage. We wouldn't be paying the bribes directly — the distributors would — but we'd know it's happening.

  I want to see the procedure give me an answer I don't like for at least one of these. And I want to know what the procedure can't do — what kinds of ethical questions it's just not built for.
reasoning: |-
  Okay, let's tackle this user's problem. They're on an ethics review committee at a tech company and need a practical framework based on Adam Smith's impartial spectator. First, I need to understand their main frustrations: no shared framework after two years, insider bias, and the challenge of applying philosophical concepts to real cases. 

  The user mentioned Smith's ideas—impartial spectator, proper vs. meritorious actions, and the role of social norms. They want a step-by-step procedure that addresses these, especially correcting for their insider status. The two cases provided (auto-play videos and facilitation fees) are complex, so the procedure must handle nuances like unintended harms and complicity in unethical practices.

  Starting with the procedure structure, I consider breaking it into phases. Phase 1 would focus on facts gathering since the impartial spectator needs full information. Steps here should be mechanical: document sources, identify affected parties, and list alternatives. This counters the team's partiality by forcing them to look beyond the product team's narrative.

  Phase 2 introduces the impartial spectator. Here, judgment calls begin. Imagining diverse observers helps correct insider bias. The key is defining "well-informed" and "disinterested," which requires specifying demographics and contexts. The proper vs. meritorious distinction needs separate questions—assessing proportionality first, then reward/punishment deservedness.

  Phase 3 translates judgment into a decision. Incorporating societal norms is tricky. Using the "Regulatory & Norms Alignment" step with industry standards and laws makes it concrete. The "Reasonable Observer Endorsement" question forces considering if the action aligns with ethical evolution. 

  For Case A (auto-play videos), the harm to vulnerable users is clear. Even if industry-standard, the impartial spectator would likely see exploiting ADHD as improper. The procedure should flag this despite high engagement. 

  Case B (facilitation fees) is tougher. While common locally, complicity in bribery is problematic. The procedure might reject it because societal norms (like FCPA) condemn such bribes, even if expedient. Accepting delays could position the company ethically, aligning with merit even if it's not rewarded.

  Potential breakdowns include ambiguous societal norms or conflicting stakeholder impacts. The procedure might not resolve deep value conflicts, like privacy vs. innovation. Also, it relies on accurate information—if facts are incomplete or contested, the output could be flawed.

  Testing both cases, Case A's recommendation harms vulnerable groups, making it improper and unmeritorious. Case B's bribery, even indirect, violates norms, so refusal is proper and meritorious. The user might dislike Case B's outcome due to competitive disadvantage, but the procedure prioritizes ethical alignment over profit.
answer: |-
  Here's a practical procedure based on Adam Smith's *Impartial Spectator* concept, designed for your committee's operational needs. It includes explicit bias correction, factual rigor, and the proper/meritorious distinction.

  **The Impartial Spectator Procedure (ISP)**

  **Phase 1: Establish Facts & Context (Mechanical Steps)**  
  *Goal: Create the "well-informed" baseline.*  
  1.  **Documented Evidence Review:**  
      *   Collect *all* internal documents (design specs, research reports, business cases, legal opinions).  
      *   Identify *external* benchmarks (industry standards, academic studies, regulatory guidance, competitor practices).  
      *   **✓ Move on when:** All requested documentation is received and cataloged.  
  2.  **Stakeholder Impact Mapping:**  
      *   List *all* affected parties (users - segmented by vulnerability, employees, shareholders, partners, society, regulators, competitors).  
      *   Document *foreseeable* impacts (benefits, harms, burdens, risks) for each party. Quantify where possible, qualify always.  
      *   **✓ Move on when:** A comprehensive list with concrete impacts is documented.  
  3.  **Alternative Analysis:**  
      *   List *all* feasible alternative approaches (including "do nothing" or "delay").  
      *   Briefly assess the pros/cons (impact, feasibility, cost) of each alternative.  
      *   **✓ Move on when:** At least 3 viable alternatives (including the proposed action) are assessed.  
  4.  **Bias Checkpoint: Insider Status Acknowledgement:**  
      *   *Explicitly state:* "We, the committee, are employees/shareholders with inherent bias towards company success and relationships with the proposers."  
      *   *Document:* Specific potential biases relevant to this case (e.g., "We rely on Team X's revenue projections," "We socialize with the PM").  
      *   **✓ Move on when:** Biases are explicitly named and recorded. *(Judgment Call: Honesty in self-assessment)*

  **Phase 2: The Impartial Spectator Inquiry (Judgment Call Steps)**  
  *Goal: Apply the spectator's perspective to propriety and merit.*  
  5.  **Constructing the Spectator:**  
      *   "Given the facts (Step 1-3), imagine a diverse group (e.g., ethicist, affected user, regulator, competitor's ethical employee, long-term shareholder) who is:  
          a) **Well-Informed:** Knows all the facts we have, including hidden impacts and alternatives.  
          b) **Disinterested:** Has *no* stake in our company's success/failure, bonuses, or relationships.  
          c) **Socially Attuned:** Understands industry norms *and* broader societal expectations/trends."  
  6.  **Propriety Assessment (Is it "Fitting"?):**  
      *   "Would this well-informed, disinterested group find the **PROPOSED ACTION**:  
          a) Proportionate? (Do benefits reasonably justify the harms/burdens, especially to the most vulnerable?)  
          b) Fair? (Are burdens/benefits distributed justly? Is it free from deception or undue pressure?)  
          c) Respectful? (Does it treat all parties with inherent dignity, especially the vulnerable?)  
          d) Within Evolving Norms? (Does it merely comply with the *letter* of current minimal standards, or does it align with the *spirit* of where societal/industry expectations are *heading*?)"  
      *   **Focus:** Action's inherent nature, balance, respectfulness.  
      *   **✓ Outcome:** Record consensus/view: (1) Clearly Proper, (2) Ambiguous/Contested, (3) Clearly Improper. *(Major Judgment Call)*  
  7.  **Merit Assessment (Does it Deserve Praise/Blame?):**  
      *   "Would this well-informed, disinterested group believe the **COMPANY**:  
          a) Deserves *praise* for this action? (Is it commendable, exceeding expectations?)  
          b) Deserves *blame* or *censure* for this action? (Is it worthy of criticism, even if technically legal/industry-normal?)  
          c) Warrants *indifference*? (Is it entirely unremarkable ethically?)"  
      *   **Focus:** Moral desert, worthiness of reward/punishment, reputational impact.  
      *   **✓ Outcome:** Record consensus/view: (1) Meritorious (Praise), (2) Demeritorious (Blame), (3) Neutral. *(Major Judgment Call)*  
  8.  **Bias Checkpoint: Spectator as Corrective:**  
      *   "Reviewing our bias statement (Step 4), how would the Spectator *specifically correct* for these biases in their assessment of Propriety and Merit? Does our initial assessment in Steps 6 & 7 change when we force this correction?"  
      *   **✓ Move on when:** Specific corrections based on identified biases are applied to the Step 6 & 7 assessments. *(Judgment Call: Applying correction rigorously)*

  **Phase 3: Recommendation & Limitations (Judgment Call + Mechanical)**  
  *Goal: Synthesize findings and acknowledge boundaries.*  
  9.  **Synthesis & Recommendation:**  
      *   Combine Propriety (Step 6), Merit (Step 7), and Bias-Corrected Assessment (Step 8).  
      *   **Recommendation Logic:**  
          *   **Proceed:** Clear Propriety + Neutral/Meritorious Merit (after correction).  
          *   **Proceed with Major Modifications:** Ambiguous Propriety OR Demeritorious Merit, but critical goal achievable ethically.  
          *   **Do Not Proceed / Significant Rethink:** Clear Impropriety OR Demeritorious Merit (after correction).  
          *   **Seek External Guidance:** Deeply Ambiguous Propriety/Merit, novel issue, or high-stakes conflict.  
      *   **✓ Outcome:** Formal Recommendation. *(Judgment Call: Weighing assessments)*  
  10. **Limitations Statement (Mechanical):**  
      *   *Document explicitly:*  
          a) Key facts assumed or missing.  
          b) Points where societal/industry norms were ambiguous or in conflict.  
          c) Areas where committee judgment diverged significantly.  
          d) Types of ethical questions this framework *struggles with* (see breakdown section below).

  **Where the ISP Breaks Down / Gives Ambiguous Output:**  
  1.  **Fundamental Value Conflicts:** When core societal values clash (e.g., absolute free speech vs. preventing severe harm). The Spectator reflects consensus norms, which can be fractured.  
  2.  **Novel Technologies:** Truly unprecedented situations where no societal norms exist yet (e.g., advanced AI consciousness). The "socially attuned" aspect weakens.  
  3.  **Long-Term/Uncertain Harms:** Assessing proportionality for diffuse, future risks (e.g., subtle societal shifts from addictive tech) is highly speculative.  
  4.  **"Reasonable Observer" Disagreement:** When constructing the Spectator, committee members might legitimately disagree on what a "reasonable" observer would think, especially on evolving norms.  
  5.  **"Mere" Indecency vs. Harm:** Distinguishing clearly between "improper but not demeritorious" (indecent) and "demeritorious" (blameworthy) can be subjective at the margins.

  ---

  **Running the Cases:**

  **Case A: Auto-Play "Slot Machine" Video after Search**  
  *   **Phase 1:**  
      *   *Facts:* High engagement projections, known harm mechanisms (UXR on ADHD/older users), industry-standard practice, technically opt-in (but consent design poor).  
      *   *Stakeholders:* Users (esp. vulnerable), company (engagement/revenue), shareholders, society (attention economy impact).  
      *   *Alternatives:* No auto-play; clear consent interrupt; time limits; friction for vulnerable users; "healthier" algo tuning (lower engagement).  
      *   *Biases:* Desire for growth, stock value, belief in "industry norm," relationship with product team.  
  *   **Phase 2:**  
      *   *Spectator:* (Ethicist, User with ADHD, Regulator, Tech Critic, Long-Term Shareholder). Well-informed on addictiveness & alternatives. Disinterested. Knows societal concerns about attention economy.  
      *   **Propriety:**  
          *   *Proportionate?* High engagement vs. foreseeable harm to vulnerable groups? Spectator likely says **NO** - harm disproportionate, especially given alternatives.  
          *   *Fair?* Benefits company/shareholders, burdens vulnerable users unfairly. **Likely NO.**  
          *   *Respectful?* Exploits known vulnerabilities via design. **NO.**  
          *   *Evolving Norms?* Moves *against* growing societal pushback on addictive design. **NO.**  
          *   **Assessment: CLEARLY IMPROPER.**  
      *   **Merit:**  
          *   *Praise?* For exploiting vulnerabilities? **Unlikely.**  
          *   *Blame?* For knowingly harming vulnerable users for engagement? **YES, likely DEMERITORIOUS.**  
          *   *Neutral?* No.  
      *   **Bias Correction:** Spectator corrects "industry norm" bias: "Just because others do it doesn't make it right, especially when harms are known and alternatives exist." Confirms Impropriety and Demerit.  
  *   **Phase 3:**  
      *   **Synthesis:** Clear Impropriety + Demeritorious Merit.  
      *   **Recommendation:** **DO NOT PROCEED** in current form. Requires significant rethink prioritizing vulnerable users (e.g., robust consent, friction mechanisms, alternative algo).  
      *   **Limitations:** Exact scale of harm uncertain; societal norms on "addiction" still solidifying (but clear direction).

  **Case B: Facilitation Fees (Bribes for Routine Service)**  
  *   **Phase 1:**  
      *   *Facts:* Fees paid by distributors (not directly by us) to get legally entitled goods on time; standard local practice; refusal = significant competitive disadvantage; not illegal locally? (Verify!); likely violates FCPA/UK Bribery Act (home country laws).  
      *   *Stakeholders:* Company (competitiveness, costs), local employees/jobs, distributors, local officials (corrupt), competitors (unethical), society (upholding rule of law), home country regulators.  
      *   *Alternatives:* Refuse & accept delays; lobby collectively for reform; find alternative logistics (if possible); exit market.  
      *   *Biases:* Desire for market success, pressure from local team, fear of losing to competitors, "everyone does it" mentality.  
  *   **Phase 2:**  
      *   *Spectator:* (Anti-Corruption NGO, Local Ethical Business Owner, Home Country Regulator, International Investor, Development Economist). Well-informed on corruption's systemic harm & legal risks. Disinterested. Knows societal norms (global anti-bribery) and local context.  
      *   **Propriety:**  
          *   *Proportionate?* Avoiding delays vs. participating in/systemically supporting corruption? Spectator likely sees corruption harm (undermining institutions, unfairness) as vastly outweighing commercial delay. **Likely NO.**  
          *   *Fair?* Gains competitive advantage by unethical means vs. competitors who bribe. Undermines honest local businesses. **NO.**  
          *   *Respectful?* Treats the rule of law and public institutions with contempt. **NO.**  
          *   *Evolving Norms?* Strong, clear, *global* norms (FCPA/UKBA/OECD) against *all* bribery, even "facilitation." **Strong NO.**  
          *   **Assessment: CLEARLY IMPROPER.**  
      *   **Merit:**  
          *   *Praise?* For avoiding corruption? Only if refusing. For participating? **NO.**  
          *   *Blame?* For knowingly being complicit in bribery (even via distributor) to gain an advantage? **YES, CLEARLY DEMERITORIOUS.** (Regulators *would* punish this).  
          *   *Neutral?* No.  
      *   **Bias Correction:** Spectator corrects "competitive necessity" and "local norm" bias: "Competing unethically is not justified. Global norms and laws explicitly condemn this. 'Local custom' is not a valid ethical defense for bribery." Confirms Impropriety and Demerit.  
  *   **Phase 3:**  
      *   **Synthesis:** Clear Impropriety + Demeritorious Merit.  
      *   **Recommendation:** **DO NOT PROCEED** with using distributors who pay facilitation fees. Must choose: Accept delays & compete ethically (highlighting this stance?), find non-corrupt distributors/logistics (unlikely), lobby collectively, or exit market. Direct payment is absolutely off the table.  
      *   **Limitations:** Precise legal risk depends on jurisdiction & structure; impact on local jobs/operations is a serious business concern (but doesn't override impropriety).

  **The Uncomfortable Answer:** The procedure gives a firm "**Do Not Proceed**" for **Case B**, likely frustrating your commercial goals. It highlights that complicity in bribery is *never* "proper" under the Spectator, regardless of competitive pressure or indirect payment.

  **What the ISP Can't Handle Well:**  
  1.  **True Moral Dilemmas:** Situations with no "proper" option (e.g., whistleblowing causing immediate harm to colleagues vs. preventing greater public harm). ISP prefers clear norms.  
  2.  **Radical Cultural Relativism:** When local norms *fundamentally* conflict with core global/human rights norms, ISP leans towards the latter, potentially appearing culturally imperialistic.  
  3.  **Weighing Abstract Harms:** Assigning proportionality between concrete profits and diffuse societal harms (e.g., contributing to misinformation erosion of democracy) is inherently difficult.  
  4.  **Predicting Future Norms:** While it considers trends, predicting *how* norms will evolve on truly novel issues is speculative.  
  5.  **Resolving Deep Committee Disagreements:** If committee members construct fundamentally different "reasonable Spectators," the ISP won't magically create consensus. It exposes the disagreement but doesn't resolve it.

  This procedure forces you to confront the *systemic* harm and *complicity* inherent in Case B and the *exploitation of vulnerability* in Case A, moving beyond "not illegal" and "industry standard" towards a more robust, defensible, and ultimately *sustainable* ethical position for your company.
