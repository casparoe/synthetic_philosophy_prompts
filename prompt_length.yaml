Short: |
    Keep the prompt relatively short and focused on the important issues. It may still be a view sentences long.
Long: |
    Write a relatively elaborate prompt (one to three paragraph). You can add various not-super-relevant detail a la, "I was discussing with my friends...", "I'm taking a course on X and find Y confusing." Depending on the task type, you can also consider giving some seeding. For instance, if your prompt is requesting a short story, you could describe the setting of the story.
