Short: |
    Keep the prompt relatively short and focused on the important issues. It may still be a few sentences long. Also, note that the type depends on the type you pick above. If you're type of prompt is asking for comments on an essay, it'll have to be somewhat long because you have to give the essay or at least notes for the essay.
Long: |
    Write a relatively elaborate prompt (one to three paragraph, even for a straightforward question that could be asked in a single sentence). You can add various not-super-relevant detail a la, "I was discussing with my friends...", "I'm taking a course on X and find Y confusing." Depending on the task type, you can also consider giving some seeding. For instance, if your prompt is requesting a short story, you could describe the setting of the story. You could also add some typical "prompt engineering"-type text, like "Respond in the style of an expert" or "Think very carefully before answering".
