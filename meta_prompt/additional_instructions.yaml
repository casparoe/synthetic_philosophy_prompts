# Additional instructions appended to the meta-prompt. Each top-level entry is a
# group; its options are mutually exclusive, so at most one is drawn per prompt.
#   probability  chance that the group contributes an instruction at all (default 1)
#   options      plain strings, or mappings with `text` and `weight` (default 1)
length:
  probability: 0.5
  options:
    - >-
      Keep the prompt relatively short and focused on the important issues. It may still
      be a few sentences long. Also, note that the type depends on the type you pick
      above. If you're type of prompt is asking for comments on an essay, it'll have to
      be somewhat long because you have to give the essay or at least notes for the
      essay.
    - >-
      Write a relatively elaborate prompt (one to three paragraph, even for a
      straightforward question that could be asked in a single sentence). You can add
      various not-super-relevant detail a la, "I was discussing with my friends...",
      "I'm taking a course on X and find Y confusing." Depending on the task type, you
      can also consider giving some seeding. For instance, if your prompt is requesting
      a short story, you could describe the setting of the story.
persona:
  probability: 0.5
  options:
    - Write the prompt from the perspective of a university student who is currently taking a related course.
    - Write the prompt from the perspective of a philosophy professor.
    - Write the prompt from the perspective of a PhD student in a related field.
    - Write the prompt from the perspective of a software engineer with no formal philosophy background.
    - Write the prompt from the perspective of a longtime reader of rationalist blogs and forums.
    - Write the prompt from the perspective of a retired natural scientist who has recently gotten into philosophy.
    - Write the prompt from the perspective of a novelist.
    - Write the prompt from the perspective of a high school student.
    - Write the prompt from the perspective of a journalist who covers science and ideas.
    - Write the prompt from the perspective of someone without any academic background who has been thinking about the topic on their own.
    - Write the prompt from the perspective of someone who just had a long argument about the topic with a friend.
    - Write the prompt from the perspective of someone for whom the topic has recently become personally relevant.
writing_style:
  options:
    - Write a relatively formal/polished prompt.
    - The prompt should be written quite casually. It may contain a typo or two.
epistemic_request:
  probability: 0.15
  options:
    - >-
      Have the asker ask for a committed response: one that takes a definite position,
      or makes definite choices, and gives its reasons, rather than laying out the
      options and leaving the asker to pick. Adapt this to your type of prompt: a
      request for a story, a lesson plan, or a set of questions can still ask that the
      piece take a clear line instead of hedging.
    - >-
      Have the asker request that the response say how confident it is in what it
      claims and single out the point it is least sure of. Adapt this to your type of
      prompt: a story, a joke, or an exercise still rests on claims about the ideas
      involved, so the asker can instead request a note on where the piece takes
      liberties or leans on a contested reading.
    - >-
      Have the asker request that the response say what would change its mind: which
      argument or consideration would lead to a different verdict, or where its
      reasoning is most likely to fail. If your type of prompt has no verdict to give,
      ask instead which assumptions the piece depends on and how it would differ if
      they were dropped.
    - >-
      Have the asker request that the response separate what is settled from what is
      genuinely contested among people who know the topic, and not present a contested
      view as the consensus. This fits any type of prompt: a ranking, a story, or an
      exercise can still flag where it takes a side that experts would not all take.
    - text: >-
        Have the asker invite pushback: if the request rests on a confused premise, or
        the task as posed can't be done well, the response should say so plainly instead
        of complying politely. Put this in the asker's own words, and don't plant a
        confusion just to trigger it; the prompt should otherwise be as it would have
        been.
      weight: 0.5
output_format:
  probability: 0.2
  options:
    - text: >-
        Have the asker put a hard length limit on the response: a maximum number of
        words or sentences, or "one paragraph", tight but feasible for your type of
        prompt (a few sentences for a question, a page or so for a document).
      weight: 1.5
    - >-
      Have the asker forbid formatting in the response: no headings, bullet points,
      bold text, or tables; continuous prose only, the way one would write an email or
      a letter.
    - >-
      Have the asker request that the response lead with its bottom line in the first
      sentence and then give the reasoning, with no preamble and no restating of the
      question. If your type of prompt asks for a piece of writing rather than an
      answer, ask instead that the response begin with the piece itself, with no
      preface or commentary.
    - >-
      Have the asker request the response as a numbered list with a fixed number of
      items (say, exactly five), each a sentence or two, with no introduction or
      conclusion. If your type of prompt calls for continuous prose (a story, a speech,
      a dialogue), apply the count to the parts of the piece instead: exactly five
      scenes, exchanges, or points.
    - >-
      Have the asker prescribe the sections of the response by name and order, with a
      rough length for each; choose section names that fit your type of prompt (for
      example "Summary", "The case for", "The case against", "My verdict"). For a
      short creative piece (a joke, a poem), ask instead for the piece followed by one
      titled section of commentary on the choices made.
    - >-
      Have the asker request structured data: a JSON object with named fields, or a
      table with specified columns, and spell out the schema (the field or column
      names and what goes in each). This suits rankings, ratings, comparisons,
      taxonomies, grading, and verdicts on cases; if your type of prompt asks for a
      piece of prose, ask instead for a brief structured summary in that form after
      the piece.
    - text: >-
        Have the asker request that the final answer be stated in a fixed,
        machine-readable form at the very end, e.g. \answer{...} enclosing a number,
        a label, or a short phrase, or a last line beginning "Verdict:". This suits
        types whose response has a definite answer to extract (a verdict, a number, a
        ranking, a grade, a name); if yours has none, ask instead for a one-sentence
        summary as the last line.
      weight: 0.75
prompt_engineering:
  probability: 0.1
  options:
    - >-
      Please include some typical
      "prompt engineering"-type text, like assigning the model some role (expert on XYZ, professional philosopher) or asking the model to think carefully, to start with some brainstorming, etc.
