type: "Give criteria and a borderline case, and ask whether the case qualifies"
notes: |
     The asker states a definition or a list of criteria for some category -- a state, a science, a religion, a person, an artwork, a lie, a war, a sport, a language, a living thing -- and describes a case that sits at the edge: something real but odd, something hypothetical, or something fictional described in detail. The question is whether the case qualifies. A good answer works criterion by criterion, notes where the criteria underdetermine the verdict, and says whether the case shows that the criteria themselves need changing. Make the case genuinely borderline rather than a disguised clear case.
examples:
  - "Here are the criteria I was taught for statehood: a permanent population, a defined territory, a government, and the capacity to enter into relations with other states. Now consider a large open-source software foundation: tens of thousands of contributors under a governance charter, an elected board, contracts with companies and governments, sanctions (expulsion), and mandatory contribution of code under its license, which looks a lot like taxation. No territory. Is territory doing real work in the definition, or is it a historical accident? Argue whether the foundation is a state in every sense that matters."
  - "Suppose a religion is a community with shared ultimate concerns, rituals, a canon, and an account of how one ought to live. Does the effective altruism movement qualify? Go through the criteria honestly; where the answer is no, say whether that is because of the criteria or because of the movement, and whether the question is one the movement itself should care about."
  - "Is a decentralized autonomous organization that runs an open-ended trading strategy, with its code frozen and no human able to intervene, a legal person in the sense in which a corporation is? Take the standard features of legal personhood -- can own property, can sue and be sued, has duties, has a decision procedure -- and check each. Then tell me whether legal personhood was ever about the features or about there being someone to hold responsible."
  - "My criteria for a sport: physical exertion, competition under rules, skill that improves with practice, and an outcome decided by the performance rather than by judges' taste. Is competitive speedrunning of video games a sport? Is dressage? Does either case show that one of my four criteria is not really necessary?"
