type: "Request help for understanding a passage"
notes: |
     Give a passage from a text in your prompt. It should be from a text that's relatively hard to understand, e.g., because it's >100 years old. Then ask for help understanding something about the passage. The passage may be long -- several paragraphs or a whole section, up to about 1,500 words -- when the difficulty lies in following the argument across the passage rather than in one sentence; then the questions should turn on its structure (what a digression is for, which sentence the conclusion rests on, where a term shifts). Copy the passage verbatim from a fetched public-domain source under the quotation rule, and name the author and work.
