type: "Present an argument that seems to prove too much and ask where it goes wrong"
notes: |
     The asker lays out an argument -- their own, a friend's, one they read -- whose premises each seem plausible and whose conclusion they cannot accept, and asks which premise or step to reject and what rejecting it costs. Write the argument out with numbered premises or clearly marked steps, and make it genuinely hard in one of two ways: either it contains a subtle flaw (an equivocation between steps, a scope or quantifier shift, a modal slide, a step that is valid only under a reading the premises don't support), or it is valid and the real question is which plausible premise is least costly to give up. Don't announce which kind it is, and don't let the asker signal the answer, though the asker may say which claims they would most like to keep. A good answer names the step, explains why it looked fine, and prices the alternatives. This differs from the false-presupposition type (a single question resting on a confusion), from the commitments type (a set of theses in tension, with no argument connecting them), and from the grading type (someone else's exam answer, evaluated by a grader): here a chain of reasoning is the object and the deliverable is a diagnosis.
examples:
  - "A friend walked me into this and I can't find the exit. (1) Whether I should do X depends only on what X causes. (2) In Newcomb's problem, taking both boxes doesn't cause the opaque box to be empty; that was settled before I chose. (3) So taking both boxes is right in Newcomb's problem. (4) The same reasoning applies whatever the predictor's accuracy, including a perfect one. (5) But with a perfect predictor, two-boxers predictably walk away with $1,000 and one-boxers with $1,000,000, and a theory of rational choice that predictably makes you poorer is a bad theory. (6) So (1) is false. He says this shows causal decision theory refutes itself. I feel like something slipped between (4) and (5) but I can't name it. Which step do you reject, and what does rejecting it cost?"
  - "Here's an argument I built for a seminar and now find suspicious because the conclusion is absurd. (1) If it would be wrong to let a child drown in a pond to avoid ruining your shoes, then physical distance makes no moral difference. (2) If distance makes no difference, then neither does the number of other people who could help, since each of them faces the same choice. (3) So each of us is required to give to famine relief up to the point of marginal utility. (4) By the same reasoning each of us is also required to spend every waking hour on relief work, since time, like money, is a resource we could give. (5) Nobody is obligated to do that. (6) Therefore (1) is false and distance does matter. Where does this go wrong, if it does? If I have to choose, I'd rather keep (1) than (5), but I want to know what I'm paying."
  - "My study group has an argument that seems to show there are no beliefs about specific people. (1) Lois believes Superman can fly. (2) Superman is Clark Kent. (3) If a is b, then whatever is true of a is true of b. (4) So Lois believes Clark Kent can fly. (5) Lois would sincerely deny that Clark Kent can fly, and someone who sincerely denies p does not believe p. (6) So Lois both believes and does not believe that Clark Kent can fly, which is impossible. (7) Therefore beliefs are not about the people they seem to be about. Tell me which premise to give up, then explain why that premise looked fine and what the standard positions -- Fregean, Millian, hidden-indexical -- each have to pay to reject it."
