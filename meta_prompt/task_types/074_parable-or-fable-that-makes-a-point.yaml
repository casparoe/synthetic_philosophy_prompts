type: "Ask for a parable or fable that makes a stated philosophical point without stating it"
notes: |
     The asker names a point -- a thesis, an argument, a distinction, a mistake people keep making, a consideration they think is neglected -- and asks for a parable, fable, or allegory that gets it across without stating it. Points from the weeds of a field are welcome: the story then has to get a technical distinction right, so that a specialist would recognize it. The prompt should state the point precisely enough to be checked and say who the parable is for (the opening of a talk, a children's book, a newsletter, readers who would resist the point if it were stated flatly), and may set constraints: a length, a form (a beast fable, a koan, a fairy tale, a myth of origins, a story set in an office or a lab), no humans, a moral stated at the end or deliberately withheld. Variants: a counter-parable answering a famous one from the other side; a parable for a view the asker rejects, to see how persuasive it can be made; a parable followed by a short key that maps its elements onto the argument and says where the analogy breaks. A good parable maps tightly, so that a thoughtful reader could reconstruct the argument from the story, and every load-bearing detail corresponds to something while nothing invites a reading the asker didn't intend. It lets the reader draw the inference instead of having a character announce it, stays short and concrete, and is fair: it earns its conclusion from the structure of the situation, not by making the other side's representatives foolish or by stipulating away the strongest objection. This differs from the short-story type (open-ended fiction in which character and plot matter for their own sake), the thought-experiment type (a case built to test theories, with the verdicts spelled out), and the analogy type (an assessment of an analogy the asker already has).
examples:
  - "I edit a small AI-safety newsletter and want to open the next issue with a fable of under 400 words. The point: a learner trained by reward can end up pursuing whatever got it rewarded, or can end up wanting what its trainers wanted, and good behavior during training can't tell you which of the two you've got. No robots, no computers, no AI at all -- readers should only see the connection when they reach the end. Don't state a moral."
  - "Nick Bostrom's 'The Fable of the Dragon-Tyrant' tells of a dragon that devours thousands of people every day, a kingdom that comes to treat this as the natural order, and the belated effort to kill it; it's an argument for treating aging as an enemy rather than a fact of life. I find it moving and mostly convincing, which is why I want the best answer from the other side. Write a counter-parable of about 1,000 words, told by a villager who thinks the dragon gives life its shape. The villager mustn't be a fool, and the story shouldn't win by making the dragon-slayers villains either. Afterwards, add a paragraph on which of Bostrom's moves your parable answers and which it ducks."
  - "I'm opening a talk on moral uncertainty, for a mixed audience of philosophers and policy people, with a parable. The point: when you're unsure which of several moral theories is right, the best choice can be an option that none of them ranks first, since a safe second-best on every view can beat gambling on one view's favorite. Keep it under 300 words, and no doctors, drugs, or trolleys -- half the room knows Jackson's case already. Then give a short key that maps the story onto the argument and says where the analogy is weakest."
  - "My daughter's class (they're nine) is putting together a book of fables, and each parent was asked to write one. I'd like mine to smuggle in the fine print of the Condorcet jury theorem: the guarantee that a big group votes better than any one of its members holds only when each member is right more often than not and makes up their own mind, and a crowd that copies one loud voice is no wiser than that voice. Animals only, 500 words at most, and a one-line moral at the end that a nine-year-old would get. It should be a good story first."
  - "im a committed one-boxer and every two-boxing argument I've heard leaves me cold, so I'm curious whether a story could do better than the arguments. write me a short parable that makes the two-boxer's point feel obvious: once what's in front of you is settled, taking more can't leave you with less. no predictors, no boxes, no money. under 300 words and don't explain it afterwards"
