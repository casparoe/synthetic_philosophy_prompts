type: "Give a text, theory, argument, or proposal and ask for a concrete improvement to it"
notes: |
     The asker supplies something of their own or someone else's -- a definition, an argument, a small theory or principle, a thought experiment, a policy or rule, a proof sketch, a passage of an essay -- and asks for it to be made better, not merely assessed: a definition repaired after a counterexample, an argument made valid without becoming question-begging, a theory amended to handle a case it gets wrong, a thought experiment redesigned to remove a confound, a rule rewritten to close a loophole, a conclusion restated so that it claims only what the essay shows. Give the thing in full and in enough detail to work on, with a flaw or limitation that a careful reader can locate: sometimes one the asker names, sometimes one they only sense ('it feels too strong', 'people keep poking holes in it'), sometimes none in particular. The prompt may say what must be kept (the thesis, the spirit of the proposal, its simplicity, its fit with something else the asker holds) and what kind of improvement is wanted: the minimal fix, the best version regardless of cost, two alternative repairs to choose between, or the improvement together with a test case. A good answer first diagnoses what is wrong or weak and why, then gives the improved version in full -- the new definition, the restated argument with its premises, the amended clause, the redesigned case -- and then says what the change costs: which cases the original handled that the new version handles worse, which new commitments it takes on, and whether it is a patch that invites the next counterexample or a change at the root. It does not slip in a different thesis under the name of an improvement, and if the thing cannot be saved without giving up what the asker wanted to keep, it says so and offers the nearest defensible alternative. This differs from the comments-on-an-essay and referee-report types (feedback on a draft rather than a better version), from the homemade-theory type (an assessment of whether an idea works), and from the rewrite type (which changes how a passage is put, for a stated purpose, while keeping what it says): here the substance may change, and the deliverable is the improved thing itself.
examples:
  - "my definition of lying: saying something you believe is false, in order to make someone believe it. my friend broke it in five minutes with a witness who says on the stand something everyone in the courtroom knows is false, because telling the truth would get him killed. he doesn't intend anyone to believe it, but it's obviously still a lie. can you fix my definition so it handles that case without letting in jokes, novels and sarcasm? one sentence if possible, and then try to break your own fix."
  - "Here is the argument from my intro ethics essay: (1) Causing unnecessary suffering is wrong. (2) Factory farming causes great suffering. (3) We don't need to eat meat to live healthy lives. (4) So eating factory-farmed meat is wrong. My TA wrote 'invalid: the conclusion is about eating, the premises are about causing.' Can you improve the argument so that it's valid, without adding a premise so strong that it's obviously false or simply restates the conclusion? Give me the improved version with numbered premises, then tell me which premise a meat-eater should now attack."
  - "Our housing co-op's rule for its two parking spots: 'Spots go to members who need a car for work, decided by a vote of the members at the annual meeting.' Last year it turned into a popularity contest, and the member who drives to night shifts lost to someone with a fifteen-minute commute. Please propose a better rule, one we could actually vote on, in under 100 words, and explain what it gets right that ours gets wrong. It shouldn't require anyone to disclose medical information, and it should be possible to apply without a committee."
  - "I hold a view I call threshold consequentialism: maximize the good, except that no one may be pushed below a fixed welfare threshold to benefit others. A colleague objected that the view has an implausible cliff: harming someone from just above the threshold to just below it is absolutely forbidden, while harming someone from far above the threshold to just above it is a mere cost to be weighed against benefits. I'd like an improved version that keeps the core -- a protected floor that aggregation can't breach -- but removes the cliff. State the improved principle precisely, show how it handles my colleague's two cases, and tell me honestly whether the improvement is a patch that invites a new objection."
  - "In a talk I used this case to argue that we attribute consciousness on the basis of behavior rather than substrate: a robot and a human each scream when their hand is crushed, and the audience says both are suffering. Someone pointed out that the case confounds behavior with appearance (the robot looks humanoid) and with what the audience knows (they're told it's a robot only after they react). Can you redesign the thought experiment so it isolates the variable I care about? Give me the new case as I'd present it on a slide, then list the confounds you removed and any you couldn't."
  - "Below is the concluding paragraph of my essay on whether moral intuitions are reliable. My supervisor says it 'claims far more than the essay earns'. The essay itself shows only that intuitions about trolley cases shift with the order in which the cases are presented. Please write an improved conclusion of about the same length that claims exactly what the essay supports, in my voice, and then tell me in two sentences what further argument I would need to earn the stronger claim. --- In this essay I have shown that moral intuitions are fundamentally unreliable. Because our responses to cases shift with irrelevant factors such as the order of presentation, intuitions cannot serve as evidence in ethics, and moral philosophy must be rebuilt on a foundation other than intuition. The method of reflective equilibrium, which treats considered judgments as data, is therefore bankrupt."
