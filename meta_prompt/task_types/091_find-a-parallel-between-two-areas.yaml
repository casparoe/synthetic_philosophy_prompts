type: "Name two broad fields or areas and ask for an interesting parallel between them"
notes: |
     The asker names two areas -- disciplines, practices, bodies of theory, domains of life -- and asks the model to find a parallel between them that is illuminating rather than decorative: immunology and epistemology, contract law and linguistics, evolutionary biology and the history of philosophy, music theory and ethics, cooking and mathematics. Unlike a request to assess a parallel the asker already has, here the asker does not know what the parallel is, and finding one is the point. Choose areas broad enough that something interesting can be said: two whole fields, or a field and a practice, rather than two narrow results. Most pairs should be ones where a deep parallel is plausible but not already a commonplace; some should be pairs where it is unclear what the parallel would even be, so that finding one, or showing that nothing deep connects them, takes real thought. The asker can say why they want it -- a talk, a course spanning two departments, a novel, a hunch, curiosity -- and can ask for one parallel worked out in depth or for several candidates ranked by how much they explain. A good answer states the mapping precisely: which element on one side corresponds to which on the other, and why the correspondence is structural rather than a matter of shared vocabulary. It then tests the parallel by carrying something across -- a result, a problem, a failure mode, a solution one field found and the other did not -- and says whether the transfer tells us anything new about either side. It is candid about where the parallel breaks, distinguishes parallels that are already well known from new ones without inventing references, and, if nothing deep connects the areas, says so and offers the best of the shallow parallels, labeled as such, rather than forcing a match. This differs from the parallel-assessment type (the asker already has a specific parallel and wants it tested), from the apply-elsewhere type (a specific theory used in a domain far from its home), and from the analogy type (an analogy in common use, examined for how far it holds).
examples:
  - "I teach a seminar for biology and philosophy majors together, and I'd like one lecture to find a real parallel between immunology and epistemology. Not 'skepticism is like an immune response', but something where a problem or a solution in one field sheds light on the other. Give me your best candidate worked out in detail: the mapping, a finding from immunology that carries over to a claim about belief (or the reverse), and where the parallel breaks."
  - "ok weird question. is there any genuinely interesting parallel between cooking and mathematics? not 'both need precision'. i mean something structural, like recipes are proofs or tasting is like checking a conjecture, whatever. give me your three best candidates, ranked, and be honest if they're all shallow."
  - "I'm a contracts lawyer who reads a bit of linguistics for fun. Is there a deep parallel between contract law and linguistics? I don't have a specific one in mind. I'd like one worked out properly: what plays the role of what, and how a doctrine such as implied terms, the parol evidence rule, or reading an ambiguous clause against its drafter would correspond to something linguists study. Then tell me whether the parallel predicts anything about contract doctrine that turns out to be true, or false."
  - "Is there an interesting parallel between evolutionary biology and the history of philosophy? I mean beyond 'ideas compete and the fittest survive', which seems too easy and probably false. Is there anything in philosophy that behaves like a niche, a vestigial organ, convergent evolution, or speciation, in a way that explains something about how philosophy actually developed? Pick the parallel you think goes deepest and test it on one episode."
  - "For a podcast episode I want to ask whether music theory and ethics have anything structurally in common. My guess is no, but I'd like to be surprised. Try hard to find a parallel that isn't just 'harmony' used as a metaphor: something about rules and their licensed exceptions, about consonance as a norm, about what it means for a tension to resolve. If you find one, state the mapping precisely and tell me what an ethicist could learn from it. If you don't, tell me why these two rule-governed practices don't line up."
  - "Give me a parallel between software engineering and political philosophy that a working engineer would find useful, not just cute. Cute, for me, is 'technical debt is like national debt' or 'microservices are like federalism'. I want something where a hard-won lesson in one field -- about interfaces, legacy systems, the incentives of maintainers, whatever -- turns out to be a known problem in the other, with a known answer or a known lack of one."
