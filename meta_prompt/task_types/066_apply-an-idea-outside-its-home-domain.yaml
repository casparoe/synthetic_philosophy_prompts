type: "Apply a theoretical idea to a domain where it is not usually applied"
notes: |
     The asker takes a theoretical idea -- a theorem, a model, a formal framework, a well-developed concept from one field -- and asks what it says about a domain far from its home turf: matching theory and dating, Bayesian confirmation and religious testimony, repeated games and toddler bedtime, thermodynamic entropy and a messy flat, Kuhnian paradigm shifts and a company's software stack, Gödel's incompleteness and a legal code. The asker wants the application actually worked out: what the idea's objects and assumptions correspond to in the new domain, what it then predicts or recommends, and where the fit fails -- an assumption that does not hold, a quantity with no counterpart, a place where the formalism is really being used as a metaphor. The mismatch is part of the appeal but the request is in earnest; the prompt should say how seriously the asker wants it taken and how much they know about the theory. A good answer refuses to force the theory to speak, distinguishes what it genuinely adds from what was already obvious, and says whether the exercise illuminates the domain, the theory, or neither. This differs from the implications type (consequences of a result within its natural range), from the parallel type (a resemblance the asker has already spotted), and from the restatement type (translating a position into another vocabulary): here the asker supplies the theory and an alien target and wants the transfer performed.
examples:
  - "Can you model the dating market with the tools economists use for matching markets -- Gale--Shapley, search costs, thick versus thin markets, the winner's curse? I want a real model, not vibes: what plays the role of price when there isn't one, what dating apps do to search costs and to the thickness of the market, what the theory predicts about the effect of having thousands of options on how long anyone keeps looking, and which of its assumptions is the most obviously false about people."
  - "Hume's argument against miracles is really a probability argument about testimony. I'd like it done properly: treat the reports of a miracle as the votes of witnesses, apply Bayes' theorem and the Condorcet jury theorem, and tell me what the prior on a miracle and the reliability of the witnesses would have to be for the report to be credible. Then tell me what happens when the witnesses aren't independent, which is presumably the actual situation, and whether anything in the formal treatment goes beyond what Hume already said in prose."
  - "my kids ignore my threats at bedtime and I've realized this is a credibility problem. can you apply the theory of repeated games to parenting -- credible threats, reputation, backward induction, the chain store paradox? I'm a lawyer and haven't done game theory since college. specifically: what does the theory say I should do differently, and where does it break because a four-year-old is not a rational agent and I actually love my opponent"
  - "People keep saying a messy room is 'high entropy'. I'm a physics undergrad and I want to know whether that is literally true or a metaphor. Apply the actual concept -- the number of microstates compatible with a macrostate, coarse-graining, the second law -- to a bedroom with clothes on the floor. Is there a well-defined macrostate 'tidy'? Does tidying really export entropy somewhere else? Where exactly does the application stop being physics and start being a figure of speech?"
