type: "Construct a thought experiment to specifications"
notes: |
     The asker wants a case built to order: a scenario engineered so that specified theories deliver specified verdicts -- a rule consequentialist must act more ruthlessly than an act consequentialist; two theories of reference agree on the referent but disagree on what is said; a belief is sensitive but not safe; causal and evidential decision theory agree but functional decision theory dissents -- or so that a single variable is isolated while everything else is held fixed, often under further constraints: realistic rather than science-fictional, no longer than a paragraph, no appeal to a specified device (no demons, no perfect predictors), suitable for a specified audience. The deliverable is the scenario plus a demonstration that it meets each specification -- the verdict each named theory gives and why -- together with an honest note on which feature of the case does the work, what happens if that feature is removed, and how a defender of the theory that comes out badly would attack the case. Good specifications are jointly satisfiable but not trivially so, and the asker should say what the case is for, since that fixes what counts as cheating: a case that stipulates the verdicts rather than generating them from the theories fails. This differs from the example type (an illustration of an issue, with no constraints beyond relevance) and from the classroom-activity type (a participatory exercise): here the object is a designed scenario, and the design has to be shown to work.
examples:
  - "Construct a thought experiment in which a rule consequentialist has to act more ruthlessly than an act consequentialist -- the opposite of the usual direction. Constraints: realistic (a workplace or a hospital, not a trolley), one paragraph, and the ruthlessness must not come from the rule consequentialist having adopted an obviously bad rule; it should fall out of a rule that is genuinely optimal to adopt in general. After the scenario, walk through what each theory says and why, and tell me which feature of the case is doing the work."
  - "Build me a case where the safety and sensitivity conditions on knowledge come apart in the direction people find hard to construct: the belief is sensitive but not safe. One ordinary-life scenario, no lotteries and no fake barns. Then do the check: state the belief, the method, the relevant nearby worlds, and why each condition gives the verdict it does. Finish with what a sensitivity theorist would say to stop the case from counting."
  - "Design a decision problem in which causal and evidential decision theory give the same answer but functional or updateless decision theory disagrees with both. Constraints: any predictor in the story may be no better than a shrewd human, no exotic physics, and payoffs a normal person could face. After the scenario, show the reasoning for each of the three theories, say which structural feature makes the third theory peel off, and whether removing that feature collapses the case back into a standard Newcomb problem."
