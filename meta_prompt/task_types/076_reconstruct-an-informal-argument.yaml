type: "Give an informal argument and ask for it to be reconstructed as a formal argument with numbered premises"
notes: |
     The asker supplies an argument made in ordinary prose and asks for it to be reconstructed as a formal argument: numbered premises, any intermediate conclusions, and the conclusion, with each step saying which lines it follows from. The text -- the asker's own paragraph, a colleague's email, a forum comment, notes from a meeting, a speech, a passage from a book or a court opinion -- goes into the prompt in full. A real text must be quoted exactly, from a fetched source; otherwise use the asker's own words or an invented text not attributed to a real person. Variants: premises in plain English; a symbolization in propositional, predicate, modal, deontic, or probabilistic terms, with a key and a derivation; an argument map; rival reconstructions of one text; a reconstruction for a stated purpose, such as a handout or finding the premise to attack. Choose texts where reconstruction takes work and no standard reconstruction exists to be recited: the conclusion is implied or comes last; premises go unstated; rhetorical questions and examples carry argumentative weight; two arguments are braided together; a term shifts sense, or a quantifier or modal has unclear scope, so that any valid version must choose a reading; the support is inductive rather than deductive. Some arguments should hold up once made explicit, and some should fail in a way the reconstruction exposes. A good answer states the conclusion; separates the premises the text states, saying where, from those it supplies; makes the argument valid with the general principle the author relies on, not the empty bridge 'if these premises are true, so is the conclusion'; and checks validity. Where the text allows more than one reconstruction, it gives the alternatives and says what turns on the choice. It says where formalizing sharpened or changed the original -- a 'most' that became 'all', a dropped hedge -- and is charitable without adding premises the author would reject. The asker may also ask which premise is weakest, but the reconstruction is the main deliverable. This differs from the is-this-argument-valid and proves-too-much types (the argument arrives already in numbered steps) and from the rewrite type (a clearer text for a reader, not the argument's logical structure).
examples:
  - "someone in a discord I'm in posted this, and people either agreed or got mad, but nobody could say what it actually assumes: 'LLMs are trained to predict text written by conscious beings, so whatever they say about their own experience is fully explained by their training data. If something is fully explained without positing experience, it's no evidence of experience. And behavior is all we'll ever have to go on with an AI. So no LLM could ever give us any reason to think it's conscious.' can you turn this into numbered premises and a conclusion, add whatever unstated premises it needs to be valid, and mark which ones you added? I think 'fully explained' might be doing two different jobs, and if it is, give me both versions"
  - "I'm making a handout for a first-year seminar on Mary Wollstonecraft's A Vindication of the Rights of Woman (1792). In the dedication she says her main argument rests on one principle, and I want students to see how it is built. Here is the passage: 'Contending for the rights of woman, my main argument is built on this simple principle, that if she be not prepared by education to become the companion of man, she will stop the progress of knowledge, for truth must be common to all, or it will be inefficacious with respect to its influence on general practice. And how can woman be expected to co-operate unless she know why she ought to be virtuous? unless freedom strengthen her reason till she comprehend her duty, and see in what manner it is connected with her real good? If children are to be educated to understand the true principle of patriotism, their mother must be a patriot; and the love of mankind, from which an orderly train of virtues spring, can only be produced by considering the moral and civil interest of mankind; but the education and situation of woman, at present, shuts her out from such investigations.' Reconstruct it in standard form: numbered premises, intermediate conclusions, and a conclusion, which she never states outright here, with each inference citing the lines it uses. The two questions are doing argumentative work, so say what claim each one contributes. Mark every premise you had to supply, and if the passage holds more than one argument for the same conclusion, keep them apart instead of merging them into one."
  - "Here's the case for paying in counterfactual mugging as a friend put it to me. (The setup: a perfectly reliable predictor flips a fair coin. On tails it asks you for $100. On heads it pays you $10,000, but only if it predicts you would have paid on tails. The coin has come up tails.) 'Before the flip, you'd have wanted to be an agent who pays, because that policy is worth more in expectation. A rational agent shouldn't need a commitment device to do what it would have wanted to commit to. So now that you're asked, you should pay.' Formalize this as numbered premises and a derivation, with every preference and every 'should' indexed to a time. The step from 'would have wanted to commit to' to 'should do' needs a general principle; state it as a premise in its own right rather than as 'if all of the above, then pay'. If the argument only goes through with a premise that causal and evidential decision theorists would both reject, say which one it is."
  - "I'm TAing intro logic and want a translation exercise built from messy real prose instead of textbook sentences. This is from a student's essay: 'If space is infinite, as many cosmologists think it is, then it contains infinitely many regions the size of our observable universe. There are only finitely many ways to arrange the particles in a region that size, so every possible arrangement has to occur somewhere. That means somewhere there is an exact copy of Earth with a copy of you reading this sentence, and since there is nothing special about that copy, there are infinitely many of them.' Symbolize it in first-order logic with identity, give the key, and prove the conclusion in natural deduction. Where the proof needs a premise the student never stated (I count at least two, both about how arrangements are spread across regions), add it as a numbered premise marked as supplied. Then tell me which step students are most likely to get wrong when they try this themselves."
  - "I took notes when my supervisor argued against our lab preregistering every study, and this is close to word for word: 'Preregistration makes sense for confirmatory work. But half of what we do is exploratory, and you can't preregister what you don't know you're looking for. If we preregister everything, people will stop exploring, because people do what gets rewarded, and right now preregistered studies are what gets rewarded. And a field that stops exploring stops discovering things. So no, we're not preregistering everything.' I want to push back at the next meeting, but first I want to be sure I'm answering the argument that was actually made. Lay it out as an argument map: the conclusion at the top, premises that only work together grouped as a single reason, each sub-argument as its own branch, and the unstated premises in brackets. If 'preregister everything' or 'exploring' means different things in different sentences, split them."
