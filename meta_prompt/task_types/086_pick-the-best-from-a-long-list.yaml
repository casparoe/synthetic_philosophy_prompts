type: "Give a long list of ideas or items and ask for the best few by stated criteria"
notes: |
     The asker supplies a long list, written out in full in the prompt -- ten to fifty items, sometimes more -- and asks for the best few: the five strongest thesis topics among forty submissions, the three thought experiments that should open a lecture, the eight debate motions for a tournament, the four referee objections a revision must answer, the one name for a new concept out of thirty suggestions. The list can come from a brainstorm, a class, a committee, a forum thread, the asker's own notebook, or an earlier conversation, and it should look like a real one: items that differ in kind and in quality, a few near-duplicates worded differently, some excellent ones, some flawed in ways that take thought to see (one rests on a confusion, one is two ideas fused, one is unworkable for a reason the list doesn't mention, one is a famous idea in disguise), and some that are merely dull. The prompt says what the selection is for and gives criteria, ideally ones that pull against each other -- importance against feasibility, novelty against accessibility, balance across the picks against the strength of each -- and says how many to choose and what to do with them: ranked or not, a sentence each, a note on the runners-up, a merge where two items belong together. The choice should turn on a conceptual judgment: which question is really open, which case actually separates two views, which objection goes to the heart of an argument, which name carries the right connotations. A good answer applies the asker's criteria rather than its own, says for each pick why it beats the near-misses, merges duplicates instead of picking two versions of one idea, flags items that are mistaken or misdescribed and says how, and is honest when the list is thin: it says if fewer than the requested number deserve a place, or if the best option is missing from the list, and names it. It may also point out when the criteria themselves are badly chosen for the stated purpose. Vary the length of the list, the number to pick (from one to about ten), the register, and who made the list. This differs from the ranking type (which rates or orders items, often a short list or a single one), from the brainstorm type (which produces a list rather than choosing from one), and from the which-open-questions type (an agenda the model draws up itself): here the list is given, and the work is choosing well from it and saying why.
examples:
  - "I supervise undergraduate theses in philosophy and this year's students handed in their topic ideas. I can take five. Criteria: each must be answerable in 12,000 words, must have a real question at its center rather than a survey of a field, and the five together shouldn't all be in ethics. The list: 1) Is it wrong to eat lab-grown meat if it tastes like human flesh? 2) Free will and neuroscience. 3) Can an AI be a moral patient? 4) Does the badness of death depend on what you would have done with your future? 5) The ethics of eating meat. 6) Are there moral facts? 7) Is it rational to fear things that can't happen to you, like your own nonexistence? 8) Kant on lying to the murderer at the door. 9) Should countries have open borders? 10) What makes a joke offensive rather than edgy? 11) Can you be morally responsible for your beliefs? 12) Wittgenstein's beetle and AI consciousness. 13) Is clicking 'I agree' on terms of service real consent? 14) Personal identity and teleporters. 15) Is there a duty to vote? 16) Why does harming someone seem worse than failing to help them? Pick five, say why each made it, and tell me which of the rejects could be rescued by narrowing it."
  - "our uni EA society is running a debate night and we brainstormed motions. we need exactly 4. each has to be genuinely two-sided (no motion where one side is obviously right), understandable without background, and the four should cover different topics. the list: this house would ban factory farming; this house believes future people matter as much as present people; this house would donate to the most effective charity instead of the local food bank; this house believes AI should have rights; this house would legalize organ markets; this house believes it is wrong to have children; this house believes animal suffering matters as much as human suffering; this house would prioritize shrimp welfare; this house regrets the rise of longtermism; this house would give money directly to the poorest rather than fund research; this house believes billionaires should not exist; this house would pay people to go vegan. which 4 and why? and is any of these secretly the same motion as another one?"
  - "My paper argues that the experience machine doesn't support anti-hedonism, because our reluctance to plug in tracks status quo bias rather than a real value of contact with reality. Between three referee reports and two workshops I've collected the objections below. I can answer at most four in the revision without blowing the word limit. Which four would a hostile but fair reader consider fatal if left unanswered? (a) Reversed versions of the case, where you're told you're already in a machine, still elicit asymmetric responses, so it isn't status quo bias. (b) De Brigard's data come from small online samples. (c) You assume the case targets hedonism, but it targets mental-state theories of welfare generally. (d) Status quo bias might itself be rational. (e) You don't engage closely enough with Nozick's original text. (f) Even if the intuition is biased, it doesn't follow that hedonism is true. (g) You never say what a debunking explanation has to show. (h) Some people would plug in, so the intuition isn't universal. (i) Section 3 is badly written. (j) The bias story predicts the wrong pattern for people who are miserable now. Rank your four, and tell me which objections are really the same objection."
  - "I've been writing about the phenomenon where a group adopts a norm because each member thinks the others want it, even though nobody does. 'Pluralistic ignorance' is close but names the beliefs, not the norm that results. Friends suggested: phantom consensus, the Abilene norm, ghost rule, mutual misattribution, the emperor's convention, orphan norm, consensus mirage, nobody's rule, the polite trap, hollow norm, inferred mandate, echo norm. Pick the best and a runner-up, and tell me if all of them miss something the right name should convey."
  - "For a 50-minute first-year lecture on whether knowing how is a kind of knowing that, I want to use exactly three cases, in an order that builds. My notes have these: the ski instructor who can't ski; the pianist with amnesia who still plays; someone who learned to ride a bike from a manual and has never been on one; the chess program that 'knows how' to win; a baby who knows how to suckle; Ryle's clown, whose clumsiness is skilled; a person who can recite the steps of a dance but can't dance it; knowing how to tie a knot you've seen tied once; a fielder who catches every ball but can say nothing about trajectories; a translator who translates well but can't state the grammar; a man who can find the station only by walking there; a robot arm trained by imitation. Which three, in what order, and what should the students conclude by the end of the hour?"
  - "I'm facilitating a citizens' assembly on whether our town should replace its elected council with one chosen by lottery. Members wrote questions for the expert panel and we can put six. Choose them so that the answers could actually change minds, not just inform: 1. Has this been tried anywhere? 2. Would people chosen by lot be less corrupt? 3. Who would they be accountable to? 4. Isn't democracy about choosing, not being chosen? 5. Can people opt out, and doesn't that bias the sample? 6. Would we still elect anyone? 7. How long would members serve? 8. What if someone extreme is chosen? 9. Would members be paid? 10. Does a lottery really treat everyone equally if some can't afford to serve? 11. Who writes the agenda the members vote on? 12. Would trust in the council go up or down? 13. Is it legal? 14. What happens to political parties? Six, please, with a line on why, and say which questions are really one question."
