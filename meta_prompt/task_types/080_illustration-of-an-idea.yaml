type: "Ask for an illustration of a philosophical idea, described in words or drawn as ASCII art, TikZ, or other code"
notes: |
     The asker names something to be shown -- the structure of an argument, a thought experiment, a distinction, the space of positions in a debate, how one quantity depends on another, a confusion a picture should clear up -- and asks for an illustration of it in a stated form: a description in words for an illustrator or an image generator, ASCII art for a plain-text medium, a diagram in TikZ, SVG, Graphviz, or Mermaid, a plot in code, a sequence of panels. The prompt says where the picture will appear and for whom (a paper, a slide, a children's book, a forum post, a poster) and may set constraints: a size or a line width, black and white, no words in the image, a single panel. Variants: a critique and redrawing of a figure the asker pastes or describes; two or three designs for different audiences, with what each gets right; a picture that must stay neutral between rival views; a picture of a view the asker rejects, drawn fairly. A good answer first decides what the picture has to make visible and how each visual feature -- position, size, area, arrows, color, grouping, order -- stands for something in the idea, so that the picture suggests nothing the idea doesn't say: arrows get read as causes, areas as amounts, heights as rankings, borders as sharp lines, and whatever is bigger, brighter, or in front as more important. It then gives the illustration in the requested form: code complete enough to compile or run with standard tools, ASCII that lines up in a fixed-width font, a description concrete enough to draw from. It says what a viewer should take away, what the picture leaves out or could still mislead about, and what a caption should say; it does not claim to have seen how its code renders. This differs from the parable type (a story, not a picture), the analogy type (an assessment of an analogy the asker already has), and the toy-model type (a formal model whose results are the point).
examples:
  - "I'm writing a paper on the mere addition paradox and need a figure in the style of Parfit's block diagrams, where a block's width shows how many people there are and its height how well off they are, so that its area shows total well-being. Three panels: A; A+, which is A plus a second, separate group whose lives are worth living but worse than the lives in A; and B, the same people as A+ all at one level, lower than A's but high enough that B's total is greater than A+'s. Please write TikZ that compiles with plain pdflatex and standard packages, with areas to scale, a labeled line marking the level below which lives stop being worth living, and a visible gap between the two groups in A+, since the argument leans on their having no contact with each other. After the code, tell me what a reader might take from the figure that the argument doesn't say, and what the caption should say to head that off."
  - "i mod a decision theory discord and the newcomb channel is the same fight every week, people talking past each other about what 'depends on' your choice. I want a pinned post with an ASCII causal graph of the problem: your disposition (or decision algorithm), the predictor's prediction, what's in the opaque box, your choice, the payoff. then underneath, one line each for how CDT, EDT and FDT read the graph, i.e. what each treats as fixed and what each treats as moving with your choice. hard limits: it goes in a discord code block, so max 60 characters per line and nothing that breaks in a monospace font. keep the whole thing under 20 lines"
  - "I'm writing a picture book for five- to eight-year-olds about a little wooden boat whose owner replaces it plank by plank, while a neighbor collects the old planks and builds them back into a boat. I need briefs for the illustrator for three spreads: the first plank replaced, the halfway point, and the two boats side by side at the dock. The book must not answer which boat is the real one -- it ends on the question -- and I've learned that pictures take sides easily: whichever boat is bigger, brighter, nearer the reader, carries the name painted on the bow, or has the owner sitting in it will read as the real one. Write the briefs as instructions to her, saying what to show, what to leave ambiguous, and what to avoid, rather than as descriptions of finished pictures."
  - "Our philosophy club is hosting a debate on Nozick's experience machine, and the student union's design office will only make the poster if we give them a prompt for their image generator. Everything we've tried so far comes back as either a pod full of cables or a mad scientist at a console, and both make the machine look sinister, which settles the debate before it starts. Can you write a prompt, plus a backup, for an image that shows the choice without loading it: a person considering a machine that would give them the life of their choosing, with nothing creepy or obviously fake about it? Then tell me what to check in the images we get back, because I'm not confident I can tell whether a picture is neutral just by looking."
  - "Our lab wiki has this Mermaid flowchart summarizing the case for AI x-risk:\n\n```mermaid\ngraph TD\n  A[Orthogonality thesis] --> C[Misaligned superintelligence is likely]\n  B[Instrumental convergence] --> C\n  C --> D[Existential catastrophe]\n  E[Fast takeoff] --> D\n```\n\nA colleague says the diagram makes the argument look stronger than it is: every arrow looks the same, so you can't tell 'is required for' from 'is some evidence for', and the orthogonality thesis only says that any level of intelligence can go with any goal, which doesn't make misalignment likely without further premises nobody has written down. I think she's right. Can you redraw it in Mermaid so that the kinds of support are distinguished, the missing premises appear as nodes of their own, and the contested steps are marked? Keep it renderable by GitLab's Mermaid, and explain any notation a reader needs to know."
  - "For a blog post on prioritarianism I want one figure that makes one point: a prioritarian gives extra weight to benefits for the worse off even when the benefit is measured in well-being, so the view isn't just the familiar point that an extra dollar does more for a poor person than for a rich one. Plot moral value against well-being: a straight line for the utilitarian, a concave curve for the prioritarian, and the same one-unit gain in well-being for a badly-off and a well-off person, with the resulting gain in value marked on each curve. Self-contained matplotlib, readable when printed in grayscale. Then write the caption, keeping in mind that a concave curve is exactly what readers have seen in every economics class, labeled 'utility of income', so they may read the figure as that point again."
