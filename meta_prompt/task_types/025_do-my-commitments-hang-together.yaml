type: "State a set of one's own commitments and ask whether they hang together"
notes: |
     The asker lists several things they believe within a domain -- a handful of theses, verdicts on cases, methodological preferences, or a mix -- and asks whether the set is jointly tenable: which commitments pull against each other, which pairs are only apparently in tension, and what the cheapest way to restore consistency is and what it costs. Write the belief set so that it is largely reasonable and recognizably held by a real kind of person, and so that it contains one or two genuine tensions that are not obvious -- two views that are each standard but whose usual motivations are incompatible, or a case verdict the asker's stated principle cannot deliver -- plus at least one apparent tension that dissolves on inspection, so a good answer has to discriminate rather than flag everything. The asker should not know where the problem is and should not signal which commitment they would give up. The deliverable is an audit, not a lecture: the tensions, ordered by severity, each with what would have to give. This differs from the false-presupposition type (one question, one confusion) and from adjudication (a dispute between others): here the asker's own position set is the object, and the work is tracing what commits them to what.
examples:
  - "ok so here's roughly where I've landed and I'd like to know if it hangs together: (1) I one-box in Newcomb's problem, (2) I think you should pay the driver in Parfit's hitchhiker, (3) I think it's irrational to pay in the counterfactual mugging because the coin has already landed, (4) I think the correct decision theory shouldn't depend on when you happen to first think about a problem. Is this a consistent package, or am I helping myself to something in (3) that (1), (2) and (4) rule out? Be specific about which one has to go."
  - "I'm writing up my views for a metaethics seminar and want a consistency check before I present. I hold: (a) moral realism, in the sense that there are mind-independent moral facts; (b) that evolutionary debunking arguments show our moral intuitions to be unreliable guides to such facts; (c) that reflective equilibrium is nonetheless the right method in ethics; (d) that the moral facts are knowable, at least in principle. Which of these are actually in tension, which only look like they are, and what is the least costly revision? Please rank the tensions by severity rather than listing them all as equally bad."
  - "For a reading group I've been asked to write down my philosophical profile on consciousness so the others can poke at it. Here it is: I'm a physicalist; I think the zombie scenario is conceivable; I think conceivability is a fallible but real guide to possibility; I think phenomenal concepts are special in a way that explains the explanatory gap; and I think there is nothing it is like to be a thermostat. Go through these and tell me which pairs are in tension and how badly. For each pair in tension, say how severe it is and what the cheapest fix would be, and then tell me which single revision would clean up the most."
