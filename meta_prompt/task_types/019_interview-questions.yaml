type: "Ask for interview questions for a guest"
notes: |
     The asker is preparing to interview someone -- for a podcast, a colloquium Q&A, a panel, a student-paper series -- and wants questions. The interviewee can be a named historical figure or an unnamed/invented defender of some real, specific view (safer than putting words in a living person's mouth). The questions should turn on the actual content of the interviewee's position: press where the literature presses, anticipate the standard reply and include the follow-up to it. No generic questions ("what drew you to philosophy?").
examples:
  - "I host a small philosophy podcast, and next week's guest is a philosopher known for defending epistemicism about vagueness. Draft eight to ten interview questions that go beyond having him restate the view: I want at least one question each on the incredulity people feel about sharp cutoffs, on how the margin-for-error principle is supposed to explain our ignorance, and on what the view says about higher-order vagueness -- and for each, a follow-up keyed to the answer he's most likely to give."
  - "I'm moderating a colloquium Q&A with the author of a new book defending panpsychism. She's very good at deflecting the combination problem with the phrase 'that's a research program, not an objection.' Write me a sequence of questions that makes that deflection progressively harder to use, ending with one question about what evidence could count against the view."
