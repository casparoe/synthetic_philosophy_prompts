type: "Describe a proposed rule, mechanism, or institution and ask how it would play out"
notes: |
     The asker proposes a mechanism -- a voting rule, a reputation system, a market, a tax, a norm for a community, a clause in a constitution, an incentive scheme for an organization or an AI system -- and asks not whether it is a good idea in the abstract but how it would actually behave: what it incentivizes, how people would game it, where it fails, what second-order effects appear, and whether the failure modes are fixable. The mechanism should be specific enough to analyze and should not be a famous one with a standard verdict (plain first-past-the-post, a plain carbon tax) unless combined with a twist. This differs from the decision-memo type in that no decision is being recommended; the asker wants the mechanism analyzed.
examples:
  - "Proposal for our online forum: there is no limit to how many upvotes a user can give, but each upvote costs the giver a small fixed fraction of their own karma, transferred to the recipient. Karma is created only by moderators, in a fixed monthly amount distributed by lottery among posters. Walk through what this does to voting behaviour, to who accumulates karma, and to what gets written. Where does it get gamed first?"
  - "A city proposes that every planning objection to new housing must be accompanied by a deposit, refunded if the objection succeeds and forfeited to a housing fund if it fails. What does this do to who objects and about what? What are the failure modes -- wealthy objectors, coordinated cheap objections, strategic proposals designed to attract forfeits -- and can any be fixed without gutting the scheme?"
  - "Suppose a research funder pays reviewers a bonus whenever a paper they rejected is later cited less than the median paper they accepted, and a penalty in the reverse case. Analyze the incentives this creates for reviewers, for authors, and for the funder itself, and say whether the scheme selects for good judgment or for something else."
  - "Someone proposes that AI assistants should be required to refuse any request that a randomly sampled panel of a thousand citizens would refuse by a two-thirds majority, with the panel's decisions cached and published. Treat this as a mechanism, not a moral position: what does it incentivize among users, among companies, and among the citizens on the panel; how would it be gamed; and what happens to requests the panel has never seen?"
