type: "Ask for a working definition of a contested term, tested against hard cases the asker lists"
notes: |
     The asker names a term whose ordinary use is confident but whose definition is contested -- consent, sentience, agent, lie, violence, addiction, art, disease, coercion, understanding -- and asks for a working definition that gets a list of hard cases right. The asker supplies the cases: some that clearly fall under the term, some that clearly don't, and several borderline ones on which they may or may not have a view. The response should propose a definition, run it against each case, say where it gives the wrong answer or no answer, and either revise it or defend the surprising verdicts. Unlike the desiderata type, the deliverable is the definition itself.
examples:
  - "Give me a definition of consent that gets these cases right: signing a contract you haven't read; agreeing to sex while moderately drunk; saying yes to a doctor because you don't understand the alternatives; a child agreeing to be photographed; clicking accept on a cookie banner; agreeing to a search when the officer has implied you have no choice. I think the first is consent and the last isn't, and I have no idea about the middle ones. Propose the definition, run it through all six, and tell me where it surprises you."
  - "Define 'lie' so that it correctly classifies: saying something false you believe true; saying something true intending to mislead; a fiction writer's sentences; an actor's lines; a bluff in poker; a polite 'I'm fine'; a witness answering a question they know to be ambiguous in the sense they know the questioner doesn't intend. Then say which of your verdicts is least secure."
  - "What is an agent? I want a definition that counts a person and a chess program as agents, counts a thermostat as not one, and gives a definite answer either way for a bacterium swimming up a sugar gradient, a corporation, a market, and a large language model in a single forward pass. Bonus if it explains why the concept feels like it comes in degrees."
  - "Define 'violence' in a way that handles: a punch; a lawful arrest with force; a strike that shuts down a hospital; a landlord's eviction; a cruel but true remark; a policy that raises the price of insulin; a video game. I suspect the ordinary word does two jobs, one descriptive and one condemnatory. If you agree, give me two definitions and say which cases move between them."
