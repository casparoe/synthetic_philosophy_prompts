type: "Ask for a taxonomy of the kinds of something, such as a phenomenon, the senses of a concept, or a family of cases or arguments"
notes: |
     The asker wants a classification of the kinds of some thing -- not of the positions in a debate but of the thing itself: the kinds of uncertainty an AI system can have, the ways a promise can fail to bind, the varieties of moral luck, the senses in which an explanation can be deep, the forms of deception that involve no false statement, the kinds of harm a recommendation system can do, the ways a thought experiment can mislead. The taxonomy should be for something -- a paper, a policy, a training curriculum, an evaluation, a course, a design review -- because the purpose decides which differences matter, so the prompt should state it, along with any constraints: the number of top-level categories, whether categories may overlap, cases the taxonomy must accommodate, an existing classification the asker finds wanting and why. A good answer starts from the dimensions along which the kinds differ, chosen because they make a difference to the stated purpose, and builds the categories from them rather than listing kinds as they come to mind. It defines each category, gives a clear example and a borderline case, and says what follows from something's being in that category: how it should be detected, treated, excused, or prevented. It aims for categories that are mutually exclusive and jointly exhaustive, and where that fails it says so: a case that falls under two categories, a dimension that cuts across the others, a residual category that marks a gap in our understanding rather than a kind. It notes combinations of dimensions that are empty and says whether they are empty by necessity or by accident. Where a well-known taxonomy exists, the answer may build on it, but it should say what its own classification adds and where it departs. This differs from the sorting-quiz type (which classifies the positions on a question and sorts people by what they believe), from the working-definition type (one boundary drawn for a contested term), and from the has-it-a-name type (whether one phenomenon is already named): here the deliverable is a structured division of a whole domain into kinds.
examples:
  - "Our team is writing guidelines for when a language model should say it isn't sure, and the word 'uncertainty' is doing too much work in our drafts. Could you give us a taxonomy of the kinds of uncertainty a model can have about an answer, with a definition and an example of each and, for each kind, what the model should do about it: hedge, ask a clarifying question, decline, or give a range? Five to eight top-level kinds, please, and flag any kind that's hard to tell apart from another in practice."
  - "I'm drafting the honesty section of a professional code for financial advisers. 'Don't lie' is easy; the hard part is deception without false statements. Give me a taxonomy of the ways one can mislead someone without saying anything false, organized by how the deception works rather than by examples, and say which kinds the code should forbid outright and which should depend on context."
  - "We covered Nagel's four kinds of moral luck in class: resultant, circumstantial, constitutive, and causal. I don't think that's the right division. 'Causal' seems to swallow the other three, and some cases, like luck in which moral views you were raised with, don't obviously fit anywhere. Can you build a better taxonomy of moral luck from scratch, starting from the dimensions along which lucky factors differ, and then show where Nagel's four land in it?"
  - "what are all the ways a thought experiment can mislead you? i keep reading arguments that start 'imagine a case where...' and something feels off but i can't say what. i'd like a taxonomy, maybe 6-10 kinds, with an example of each from famous cases, and a one-line test a reader could apply to catch each kind."
  - "For a regulator's consultation on recommendation algorithms (the ones that decide what video plays next), we need a taxonomy of the harms such systems can do to users and to society. Existing lists mix harms with mechanisms -- 'addiction', 'echo chambers', 'misinformation' -- and we'd like a cleaner division. Please propose one: the dimensions you classify by, the categories with a definition and an example each, and, for each category, what kind of evidence would show that the harm is happening."
  - "In biology people say a trait has been 'explained' when they mean very different things: its evolutionary history, its function, the mechanism that produces it, its development in the individual. Tinbergen's four questions are the classic division, but they seem to leave out explanations by constraint ('there are no wheeled animals because...') and purely statistical explanations. Give me a taxonomy of the kinds of explanation used in biology that does better, and for each kind say what would count as a rival explanation of the same kind."
