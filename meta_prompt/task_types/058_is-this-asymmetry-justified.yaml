type: "Point out an asymmetry in ordinary judgments or practice and ask whether anything justifies it"
notes: |
     Ordinary morality, law, and social practice are full of asymmetries: we punish the attempt less than the success, condemn cruelty to animals in public but eat them in public, fire an employee for a wrong unrelated to the job, treat harms we cause worse than harms we allow, praise ambition in one person and call it greed in another, count deaths but not lives never lived. The asker states such an asymmetry concretely and asks whether anything justifies it or whether it is simply an inconsistency we live with. The good answer finds the best candidate justification, tests it against nearby cases, and says whether the asymmetry should be kept, reversed, or given up.
examples:
  - "Attempted murder gets a lighter sentence than murder even when the only difference is that the victim happened to move. Every theory of punishment I know -- deterrence, incapacitation, rehabilitation -- seems to say the two offenders deserve the same. Is there a defensible reason for the asymmetry, or is it a superstition about outcomes that the law should drop? If you defend it, defend it against the case where the two attempts are identical down to the bullet's trajectory."
  - "Someone who tortures a pig in a public square is a monster; someone who eats a bacon sandwich in the same square is having lunch, though the sandwich required a pig's death and probably a worse life. Most people hold both judgments firmly. Is there a principle that generates both, or only a psychological explanation? I want the strongest principle you can find and an honest verdict on whether it works."
  - "A company will fire an accountant caught shoplifting at the weekend but not one caught speeding, though both broke laws unrelated to accounting. People find the first firing obviously right and the second obviously excessive. What distinction is being tracked -- dishonesty versus recklessness? relevance to trust? severity? -- and does it survive a case where the speeding was reckless enough to kill?"
  - "We think it is worse to break a promise than to fail to make one that would have done just as much good, and worse to lie than to let someone keep a false belief we could easily correct. Are these two asymmetries instances of the same thing, and is that thing defensible? Pick the harder of the two and tell me whether you would keep it."
