type: "Report a parallel the asker noticed between ideas from different fields and ask whether it is deep or superficial"
notes: |
     The asker has spotted a structural resemblance between two things that do not usually meet -- a theorem and a moral principle, a programming idiom and a metaphysical distinction, a legal doctrine and a decision-theoretic result, a biological mechanism and an epistemic norm -- and wants to know whether it is a genuine identity of structure, a loose analogy, or a confusion. The parallel should be the asker's own rather than a textbook one, stated precisely enough that the response can check where the structures match and where they come apart. A good answer states the mapping, says what would have to be true of both sides for results to transfer, and names something the parallel predicts that turns out false.
examples:
  - "It struck me that the distinction between a function's interface and its implementation in software is the same distinction as functionalism's distinction between a mental state's causal role and its realizer. Encapsulation would be multiple realizability. Is this a real identity of structure or am I just pattern-matching? If it's real, does anything from software engineering -- leaky abstractions, say -- transfer to the philosophy of mind?"
  - "I keep seeing a parallel between statutes of limitations in law and the way Bayesians discount old evidence: both say that a fact's bearing on the present decays with time, and both are hard to justify from first principles. Is there anything to this beyond the word 'decay'? In particular, is the legal rationale (fading evidence, repose) the same kind of thing as the epistemic one, or are they only superficially alike?"
  - "Here is a parallel I can't decide about: the way natural selection can only optimize locally -- no foresight, no crossing valleys -- looks to me like the way Burkean conservatism trusts inherited institutions over designed ones. Both say that what survived has hidden virtues you cannot see and that redesign from scratch usually fails. Is this a deep point about optimization under ignorance, or does the analogy break because societies, unlike genomes, contain agents who can look ahead?"
  - "In type theory a proof is a program and a proposition is a type. It seems to me that in ethics a justification is like a program too: a procedure that, given the situation, produces the act. Would that make moral principles types? I know the Curry--Howard correspondence is precise and my version is vague. Is there a way to make it precise, and if there isn't, what exactly is missing on the ethics side?"
