type: "Describe a project and ask how to break it into parts, such as chapters, steps, or subproblems, or whether it can be broken down at all"
notes: |
     The asker has a project with a conceptual core -- a book or a course, a formalization of an informal theory, a research program, a dissertation, an exhibition, a decision an institution must make, a piece of software that has to embody a contested concept -- and asks how to divide it: the chapters a book should have, the steps toward a formal model and especially the first ones, the subquestions a big question splits into, the milestones of a long piece of work. The division should depend on understanding the subject: which ideas have to come before which, which subproblems are independent and which hinge on a shared crux, where the hard part actually sits, what can be settled cheaply first. Say what the project is for, who it is for, how much time or space there is, and what the asker already has (a draft, a toy version, a list of chapter ideas, a failed first attempt). Sometimes the honest answer is that the project does not decompose, or not in the way the asker hopes: the parts depend on each other circularly, the crux can't be isolated from the rest, the project rests on an assumption that should be checked before anything is divided, or the goal is ill-posed as stated. The prompt may invite that answer ('or tell me if this can't be split up') or leave it for the model to notice, and some prompts should describe projects where it is the right answer. A good answer gives the parts with a sentence or two on what each delivers and why it comes where it does, marks the dependencies and the order, makes the first step concrete enough to start on tomorrow, says which part is likely to take most of the effort or to fail, and says what would make the plan change. Where it finds that the project can't be broken down, it explains why and proposes what to do instead: a toy version first, a different question, or an iteration in which the parts are revised together. This differs from the research-proposal type (a document arguing that the work is worth doing), from the how-to-teach type (an order of ideas for learners), from the procedure type (a principle turned into steps a practitioner follows), and from the brainstorm type (a spread of ideas rather than a structured plan).
examples:
  - "I want to write a book about Newcomb-like problems. What should the chapters be? It's for readers who've heard of the original problem but not much else -- programmers, economists, curious philosophy students -- and I'm thinking 250 pages. I want it to cover more than the one-box/two-box debate: twin prisoner's dilemmas, smoking lesion cases, decision theory for AIs that can read each other's code. Give me a chapter list with two sentences on each, and tell me which chapter will be hardest to write well and why."
  - "I want a formalization of evidential decision theory that I could actually implement and test, not just 'maximize expected utility conditional on your action'. What are the steps? I'm especially unsure about the first ones: what has to be pinned down before anything else makes sense -- what counts as an action, where the probabilities come from, what to do when you're already certain what you'll choose? Lay out the steps in order, say which are known to be hard, and describe a minimal first version I could finish in a month."
  - "Our city council has to decide whether to let the police use an algorithm that predicts where burglaries will happen. The debate keeps going in circles because everyone argues about everything at once. Could you break the decision into the separate questions it actually depends on -- empirical, ethical, legal, practical -- in an order where answering the earlier ones narrows the later ones? Mark which questions philosophy can help with and which need data, and tell me if some of them can't be separated from each other."
  - "I want to write a definition of 'understanding', as in 'she understands evolution', that works for people, animals, and AI systems. My plan was to define explanation first, then grasping an explanation, then understanding as grasping a correct explanation. But I keep finding that I need 'understanding' to define 'grasping'. Can this project be broken into steps like that at all, or do the parts depend on each other in a way that means I need a different approach? If it can be decomposed, give me the steps; if not, tell me what to do instead."
  - "I'm curating a small museum exhibition on the ethics of memory: forgetting, monuments, the right to be forgotten online, drugs that could dampen traumatic memories. I have three rooms and a corridor. How should the material be divided among the spaces so that a visitor who walks through in order leaves with a question they didn't have when they came in? Give me the plan room by room, and say what has to come first for the rest to land."
  - "first-year PhD in philosophy of science. my dissertation topic is 'can machine learning models be scientific explanations?' and my advisor says it's three dissertations in one. help me split it: what are the separable questions inside it, which one would make a good dissertation on its own, and in what order should I work if I want to keep the other two for later papers?"
