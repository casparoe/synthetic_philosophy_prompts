type: "Quote a rule, clause, or passage and ask how it applies to a case its authors did not foresee"
notes: |
     The asker quotes the actual wording of some rule -- a clause from a contract or lease, a statute or constitutional provision, a club's bylaws, a game's rulebook, a religious commandment or a passage of scripture, a professional code, a platform's terms of service -- and describes a situation the drafters plainly did not have in mind. The question is what the rule requires or permits in that case, and what the different approaches to interpretation (the words, the purpose, what the drafters would have said if asked, what a reasonable reader takes them to mean) each give. Write the quoted rule yourself in a convincing register, or use a real one quoted accurately; keep it short, and make the unforeseen case specific.
examples:
  - "Our chess club's constitution says: 'A member who fails to attend three consecutive monthly meetings shall be deemed to have resigned.' During the pandemic the club met online for fourteen months. One member's connection was too poor for video, so he attended by posting his moves in the chat a day later, which the others accepted. Has he resigned? The constitution predates online meetings and says nothing about them. Argue it from the text, from the purpose of the clause, and from what the founders would have said, and tell me which approach should win here and why."
  - "My lease says the premises are 'for residential use only and not for the conduct of any business or trade'. I am a translator; I work at my desk, meet no clients, receive no deliveries, and my only visible business activity is being at home during the day. Everyone agrees the clause was written to stop people running shops and workshops out of flats. Am I in breach? I care less about the practical answer than about what it would take for the clause to reach me and whether any coherent reading does."
  - "The commandment says you shall not bear false witness against your neighbour. A friend runs an anonymous account that posts satirical, plainly fabricated quotations from a real politician, labelled as parody in the profile but often reshared without the label. Does the commandment, read as its first hearers would have read it, apply to this? Does it apply read as a general principle about testimony? If the two readings diverge, which should a believer follow, and does the reshared-without-label detail matter?"
  - "A board-game rulebook says: 'A player may not communicate with another player about the contents of their hand.' Two players have played together for years and can read each other's timing and hesitation with high reliability. Neither says a word. Is the rule broken? Is there a version of the rule that would catch this without also banning ordinary skill at reading opponents, and if there isn't, what does that tell us about what the rule was ever able to protect?"
