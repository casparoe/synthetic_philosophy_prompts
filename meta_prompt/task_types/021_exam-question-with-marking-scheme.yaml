type: "Write an exam question with a model answer and marking scheme"
notes: |
     The asker is setting an assessment -- a final-exam essay question, a problem-set exercise, a take-home prompt, or a set of multiple-choice items -- and wants the question together with what a good answer looks like: a model answer and/or a marking scheme that names the specific moves a top answer must make and the specific mistakes that should cost marks. For multiple-choice items, every distractor should encode a real, identifiable misunderstanding, and the answer key should say which misunderstanding each distractor catches. The difficulty should come from choosing the crux: the question should be unanswerable by reciting a summary of the topic and should separate students who understand the issue from those who have memorized the labels. The asker specifies the level (intro, upper-level seminar, PhD comprehensive exam) and the constraints (time, length, total marks). This is the mirror image of the grading type: there the answer is given and the grade is requested; here the question and the standard are the deliverable.
examples:
  - "I teach an upper-level philosophy of language seminar and I'm writing the final. I want one essay question on Frege's puzzle about identity that can't be answered by reciting the sense/reference distinction. It should make students confront why the distinction is supposed to handle 'Hesperus is Phosphorus' and belief reports at the same time, and where Kripke's point about necessary a posteriori truths bites. Please write the question, a model answer of about 600 words, and a marking scheme that separates an A from a B answer by naming the specific moves each must contain."
  - "For an intro philosophy of science course, write five multiple-choice questions on the underdetermination of theory by evidence. Four options each, and every wrong option should correspond to a misunderstanding students actually have -- e.g. confusing underdetermination with the theory-ladenness of observation, or thinking it implies that all theories are equally good. After the questions, give an answer key that says, for each distractor, which misunderstanding it is catching."
  - "I'm on the committee writing this year's ethics comprehensive exam for our PhD students. Draft one question on moral luck that a candidate could answer in 90 minutes, aimed at testing whether they can do more than summarize Nagel and Williams -- for instance, whether they can say what a control principle would have to look like to be plausible without being self-undermining. Give a model answer and a marking scheme built around five must-hit points, the marks each is worth (total 20), and a one-line note on how candidates typically get each wrong."
