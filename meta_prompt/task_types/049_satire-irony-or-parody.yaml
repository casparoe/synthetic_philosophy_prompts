type: "Write a satirical, ironic, or parody piece related to a concept"
notes: |
     The article-length sibling of the joke type. The asker requests a piece of satire, sustained irony, or parody -- an Onion-style news report, a mock op-ed, a Swiftian modest proposal, a parody of a genre (a terms-of-service agreement, a product review, an FAQ, a travel guide, a scientific abstract, a job advertisement, a self-help column, an agony-aunt letter), a fake historical document, an in-universe report from a world where some view is true -- and should specify the form, the approximate length, the voice or venue, and the target. The target should be a position, an argument, a practice, or a style of discourse, not a named living person; an invented proponent is fine. The humor has to come from the actual content: the piece should exaggerate a real feature of the view or practice rather than invent one, so that a specialist recognizes that the author understands what is being satirized and, ideally, finds the satire fair. Sustained irony should stay deadpan and yet remain legible -- a reader should be able to tell what is being ironized without the author winking. A modest proposal works as a reductio: the straight-faced proposal follows the target's logic to a conclusion the reader recoils from. The asker may also ask for satire from inside a position (a determinist's complaint, an anti-natalist's baby-shower card), in which case internal consistency is part of the brief. This differs from the joke type (a one-liner or short bit) and the short-story type (narrative rather than mock-discursive prose).
examples:
  - "Write an Onion-style news article, headline plus 400-500 words, reporting that a local man has become a strict Bayesian and can no longer be surprised by anything. The jokes should come from getting the epistemology right -- conditionalization, the choice of priors, the problem of old evidence -- so that a formal epistemologist laughs rather than winces, and include at least one quote from a 'concerned' frequentist colleague."
  - "Write a parody of a software terms-of-service agreement for a brain-emulation upload service, in which the fine print quietly takes positions on personal identity: a no-branching clause, what counts as 'you' after a failed upload, the refund policy for continuity disputes. It should be funny to someone who knows the Parfit literature and readable to someone who doesn't. About 700 words, formatted as numbered clauses."
  - "write me an ironic op-ed, maybe 500 words, in the voice of a hard determinist who is annoyed that people keep praising him for his book on free will. every complaint has to be one he can actually make without contradicting himself -- don't let him slip into compatibilism halfway through unless that IS the joke -- and by the end a reader should have felt the real question of whether determinism leaves praise and blame standing"
  - "Write a travel-guide entry, in the deadpan style of a Lonely Planet page, for a country that has fully implemented epistocracy: local customs, what to do when your vote is weighted down at the polling station, tips for tourists on passing the entry exam, a sidebar on the national holiday celebrating the test's authors. The satire should land the standard objections -- who writes the test, which demographics fail it, whether competence at the test is competence at governing -- without ever stating them. Around 600 words."
