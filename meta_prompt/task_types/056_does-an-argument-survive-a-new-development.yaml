type: "Ask whether a well-known argument survives a specific new development or changed assumption"
notes: |
     A classic argument was made under assumptions that a specific later development may have undercut -- a technological change, a scientific result, a shift in how the relevant systems are built, a new social arrangement. The asker names the argument and the development and asks whether the argument still goes through, needs repair, or is dead: does the paperclip-maximizer argument survive models trained on all of human text? does Mill's argument for free speech survive recommender systems? does the tragedy of the commons survive cheap monitoring? The response should identify which premise the development bears on and whether it can be restored in another form. Prefer developments with real bite over ones that only change the examples.
examples:
  - "The orthogonality thesis was argued when the paradigm AI was an agent handed an explicit utility function. Today's most capable systems are trained on an enormous amount of human text and acquire something like human concepts before anyone gives them a goal. Does the orthogonality argument survive this? Which premise is actually under pressure, and is there a repaired version that says something weaker but still important?"
  - "The standard economic argument against rent control assumes landlords respond to price signals by building or withdrawing supply. In a city where zoning already fixes the housing stock for decades and almost no new building is possible, does the argument still have force, or does it collapse into a distributional question? Say what the argument needs to be true and whether it is true in that setting."
  - "Mill's argument for free speech leans on the idea that truth wins in open discussion because listeners weigh arguments. Suppose most speech now reaches people through recommender systems optimizing for engagement rather than truth. Does Mill's argument still support free speech in that environment, does it now support something else (regulating the recommenders), or does it just become inapplicable? I'm interested in what happens to the argument, not in the policy."
  - "Hardin's tragedy of the commons was argued for pastures that no one could monitor. Now suppose every use of a shared resource is cheaply logged and visible to everyone. Does the tragedy still arise in Hardin's form, or was it always a problem about information rather than incentives? If it still arises, show why the logging doesn't help; if it doesn't, say what the remaining problem should be called."
