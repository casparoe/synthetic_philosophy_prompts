type: "Explain some conceptual issue"
notes: |
     Relative to some other prompt types, relatively much care needs to be taken to make sure that these prompts are somewhat in-the-weeds.
examples:
  - "Please explain the difference between updateless decision theory and functional decision theory"
  - "Please give an intuitive explanation of why Arrow's impossibility theorem holds. The full proof is somewhat technical -- I want to get more of a gut-level intuition"
  - "I read an article about various arguments for God. There seem to be lots of arguments based on avoiding infinite regresses. The best-known one is probably the cosmological argument. But there are lots of other similar arguments that I read about. For instance, this is from Bentham's Bulldog: \"The neo-platonic proof says that if something is made of parts, there must be something responsible for the parts being combined. By regress, the first thing can’t be made of parts, because it would need something else to bind it together. Thus, there must be something without parts, which is argued to be God.\" I'm interested more broadly in what kinds of arguments there exist of this form. What kinds of things can form infinite regresses? Are these all separate arguments that we should separately update on?"
