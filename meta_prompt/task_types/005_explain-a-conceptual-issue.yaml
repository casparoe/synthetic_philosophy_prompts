type: "Explain some conceptual issue"
notes: |
     Relative to some other prompt types, relatively much care needs to be taken to make sure that these prompts are somewhat in-the-weeds.
examples:
  - "Please explain the difference between updateless decision theory and functional decision theory"
  - "Please give an intuitive explanation of why Arrow's impossibility theorem holds. The full proof is somewhat technical -- I want to get more of a gut-level intuition"
