type: "Present two formulations and ask whether they mean the same thing"
notes: |
     The asker quotes two pieces of text in full and asks whether they say the same thing: two sentences that differ in word order or construction, a claim and a colleague's paraphrase of it, a passage and a translation or two rival translations, a slogan and a textbook's gloss, a formal statement and its reading in prose, a definition from one author and a near-copy from another, or the asker's own two attempts to say what they mean. Vary the truth of the matter across prompts: sometimes the two are equivalent and the asker suspects a difference that is not there; sometimes they differ subtly, in quantifier scope, modality, tense, presupposition, strength, connotation, or what is asserted versus implied; sometimes they coincide in one context and come apart in another. The asker wants a verdict, and where the texts differ, the exact point of difference and a case that separates them, one in which one text is true and the other false; where they are equivalent, they want to be told what the apparent difference was tracking. Prompts should include both texts verbatim rather than describing them, and should say why the question matters to the asker (a summary they are about to sign off on, a translation they must choose, a definition they are being held to). This differs from the summary-fairness type (a summary of a whole view rather than two formulations of one claim), from the restatement type (translating a position across frameworks), and from the conflicting-passages type (two texts that seem to disagree, not two that seem to agree).
examples:
  - "Do these two sentences say the same thing? (a) 'Every event has a cause.' (b) 'There is a cause for every event.' My logic TA insists they're different but I honestly can't hear the difference, and if there is one I'd like a situation where one is true and the other false."
  - "A colleague summarized my view in a shared paper draft as 'moral facts are whatever an idealized version of the agent would endorse.' What I actually wrote was 'moral facts are what the agent would endorse under full information and after reflection on her own values.' Before I sign off: are these the same claim? If not, where exactly do they come apart, and can you give me a case that separates them?"
  - "Two translations of the last proposition of the Tractatus: 'Whereof one cannot speak, thereof one must be silent' and 'What we cannot speak about we must pass over in silence.' Are they equivalent in meaning, or does one commit Wittgenstein to something the other doesn't -- about the 'cannot', about who 'we' are, about what silence is? I'm choosing one for an epigraph and want to know what I'm choosing."
  - "same meaning or not: 'consciousness is nothing over and above information processing' vs 'consciousness is identical to a kind of information processing'. everyone in my reading group treats these as interchangeable and I have a nagging feeling they aren't. please don't tell me 'it depends what you mean' -- tell me what would have to be fixed for them to be equivalent and whether any standard position accepts one and rejects the other"
