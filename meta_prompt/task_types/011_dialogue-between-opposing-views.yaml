type: "Write a dialogue between proponents of two opposing views"
notes: |
     Both characters should be equally competent -- neither side should be a strawman. The dialogue should contain real back-and-forth, i.e., the characters should respond to each other's actual points rather than talk past each other.
examples:
  - "Write a dialogue between a causal decision theorist and an evidential decision theorist standing in front of the boxes in Newcomb's problem, each trying to talk the other out of their choice."
  - "Write a short dialogue between a moral realist and an expressivist in which they try to figure out whether their disagreement is substantive or merely verbal."
