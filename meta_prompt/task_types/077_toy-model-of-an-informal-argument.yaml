type: "Give an informal argument and ask for a toy model of it, mathematical or in code"
notes: |
     The asker states an argument made in words -- their own or someone else's -- and asks for a toy model of it: a few equations, a small game, a Bayesian or Markov model, a dynamical system, or a short program or simulation, simple enough to see through. A published author's argument is paraphrased, or quoted exactly from a fetched source. The model's assumptions should stand for the argument's premises, so that one can see whether the conclusion follows, for which parameter values, and which assumption does the work. Variants: a model in which the argument works and a nearby one in which it fails; a counter-model in which every premise holds and the conclusion is false; the asker's own model, to be checked for whether it builds in its conclusion; a model at a stated level (school algebra, a first probability course, a spreadsheet), in a stated language, or for a stated use. Choose arguments whose force depends on how quantities combine -- rates, probabilities, thresholds, selection, feedback, many interacting agents -- and that have no standard formal model to recite; arguments from ethics, epistemology, politics, and the philosophy of language, which are rarely modeled, are good material. Some arguments should survive the model and some should fail in a way it exposes, for instance by needing a parameter in a narrow range or an assumption the author never stated. A good answer says which premise each assumption encodes; keeps the model as small as the argument allows; derives results by hand where it can; and says what they mean for the argument: whether the conclusion follows, under which conditions, and where the thresholds lie. Any code is short and runnable, with named parameters and a fixed random seed, and the answer says what the output should show and why instead of reporting results it has not run. It says what the model leaves out and how much a toy model can show: a model in which the conclusion follows shows that the argument can work, not that it does. This differs from the reconstruct-an-argument type (numbered premises, no quantities), the proposed-mechanism type (a verbal analysis of incentives and failure modes), and the test-a-conceptual-claim type (an experiment or measurement, not a model).
examples:
  - "my uncle has one argument he brings out every thanksgiving: any custom that has lasted a few hundred years must be doing something for the people who keep it, because customs that hurt people die out. so the burden of proof is always on whoever wants to change a tradition, and the older the tradition, the heavier the burden. I want to actually check this instead of yelling. can you write a short python simulation where customs appear, spread, and die out, with knobs for how much a custom's usefulness affects its survival versus pure chance (fashion, conquest, a king who happened to like it), and then check whether older customs come out more useful on average? what does his argument need in order to be true, and is there a setting where the oldest customs are worse than the young ones? fix the random seed and tell me what I should expect to see before I run it"
  - "A classmate in our seminar on moral progress argued as follows. Every earlier generation held moral views that we now regard as serious errors, and none of them could see it. So we should expect that our generation, too, holds serious moral errors it cannot see, and about as many as earlier generations did. I accept the first conclusion but not the second, and I suspect the step to 'about as many' smuggles in an assumption about how errors get corrected and introduced. Could you build a simple model in which each generation corrects some fraction of the errors it inherits and introduces new ones at some rate, and work out what it predicts about the number of errors over time? Under what assumptions do both conclusions follow, and is there a version in which every premise of the argument holds but the second conclusion is false? Please keep the mathematics to the level of a difference equation that a philosophy student can follow."
  - "The worry, roughly: once AI systems argue better than any human, a convincing argument from one tells you almost nothing about whether its conclusion is true, because a skilled enough arguer can make a false conclusion just as convincing as a true one. So, the argument goes, we should stop updating on AI-written arguments altogether and rely only on what we can check for ourselves. I'd like a toy Bayesian model of this. Let an argument's persuasiveness depend on whether its conclusion is true and on the arguer's skill, let the listener know how skill is distributed but not how skilled this arguer is, and derive how far she should update as skill rises. Does the rational update really go to zero, or does something survive -- say, if true conclusions are easier to argue for, or if the arguer isn't trying to deceive? Show the algebra, then describe in words what the curves look like."
  - "Is the euphemism treadmill inevitable? A linguist I follow says that replacing the word for a stigmatized group or condition never works for long: the new word soon takes on people's attitudes toward what it names, so each polite term goes sour in its turn, and only changing the attitudes changes anything. That sounds right for the old clinical terms that became insults, but not obviously for every case. Put it into a small dynamical system: a word's connotation drifts toward the average attitude toward its referent, and the attitude may in turn be nudged a little by the connotation of the word in use. Find the conditions under which swapping words changes nothing in the long run and those under which it helps, and say which of them is the linguist's unstated premise. Then give me an agent-based version in R, with speakers who adopt and abandon words, short enough to read in one sitting, and tell me which of its results the equations already predict."
  - "I built a spreadsheet to settle an argument with my partner, and it settled nothing. My view is that we should invest the money we'd donate and give it all away when we retire, because the market returns about five percent a year after inflation and the charities we like don't get more expensive that fast. The spreadsheet has one column growing at five percent and one column of 'good done per dollar' that I held constant, and of course waiting wins every time. My partner says the spreadsheet just assumes my conclusion, and annoyingly I think she's right. Can you build a better toy model, still something I can put in a spreadsheet, with the investment return, the rate at which doing good gets more expensive as the best opportunities are taken, the chance that we drift away from giving at all, and the possibility that money given now does good that itself compounds? I want to see which parameters decide the question and roughly where the break-even line is. Don't pick numbers for us; show how the answer depends on them."
