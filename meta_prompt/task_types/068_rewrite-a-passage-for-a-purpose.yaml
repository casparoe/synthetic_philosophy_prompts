type: "Provide a passage and ask for it to be rewritten for a stated purpose"
notes: |
     The asker pastes a piece of text in full -- a paragraph of their own, an abstract, a definition, a policy clause, an argument, a slide, an email, or a passage by another author -- and asks for it to be rewritten for a purpose they state: so that it says one thing rather than three, so that a specified reader can follow it, so that it is unambiguous about what it commits to, so that hidden assumptions become explicit, so that it is shorter without losing a claim, so that jargon is removed or the right technical terms are used, so that the argument's structure shows, or so that it changes register (formal to plain, prose to numbered premises, a technical formulation for a general audience or the reverse). The prompt should say what must be preserved (the claims, the hedges, the author's voice, the commitments) and what may change, and should include the text itself rather than describe it. Vary the texts: some are good but hard, some are muddled in a specific way the asker half-sees, some are already fine, and some cannot be made clearer without deciding a question the original left open. A good response gives the rewrite and then accounts for it: what was changed and why, where the original was ambiguous and which reading was chosen, and where a 'clarification' would in fact change the meaning, rather than silently picking a reading. This differs from the comments-on-an-essay type (feedback, not a new text), from the restatement type (a position carried into another framework's vocabulary), and from the same-meaning type (judging two texts the asker already has).
examples:
  - "Here is the abstract of a paper I'm about to submit: 'We show that, under a natural class of priors, agents who condition on their own decision procedure recover the recommendations of evidential decision theory in Newcomb-like cases while retaining causal decision theory's verdicts elsewhere, which suggests that the standard dichotomy is an artefact of an impoverished representation of the agent.' Rewrite it so that a philosopher who does not work on decision theory can follow it, without changing any claim. Where you had to pick between readings of what I wrote, tell me which you picked."
  - "can you rewrite this paragraph from a blog post I'm drafting so it says one thing? 'Consciousness is basically what information processing feels like from the inside, which is why we shouldn't expect a theory of it, since theories are from the outside, but also why AI might already have it, though of course that's unfalsifiable.' I've reread it ten times and I think it's making three claims that don't fit together. keep my voice, lose the mush, and tell me which claims you kept and which you dropped"
  - "This is clause 4 of our lab's policy on AI tools: 'Members must not rely on generative tools for substantive intellectual work.' Rewrite it so that it is unambiguous about what is and is not allowed -- I want a version a first-year grad student and a PI would read the same way -- and list the ambiguities in the original that you had to resolve, with the reading you chose for each."
  - "Rewrite Kant's formula of humanity -- 'act in such a way that you treat humanity, whether in your own person or in the person of any other, never merely as a means, but always at the same time as an end' -- as a one-paragraph explanation for high-school students. Then tell me exactly which pieces of content the simplification loses, because I would rather know than pretend it is lossless."
