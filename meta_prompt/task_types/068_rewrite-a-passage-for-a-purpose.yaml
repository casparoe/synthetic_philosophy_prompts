type: "Provide a passage and ask for it to be rewritten for a stated purpose"
notes: |
     The asker pastes a piece of text in full -- a paragraph of their own, an abstract, a definition, a policy clause, an argument, a slide, an email, or a passage by another author -- and asks for it to be rewritten for a purpose they state: so that it says one thing rather than three, so that a specified reader can follow it, so that it is unambiguous about what it commits to, so that hidden assumptions become explicit, so that it is shorter without losing a claim, so that jargon is removed or the right technical terms are used, so that the argument's structure shows, or so that it changes register (formal to plain, prose to numbered premises, a technical formulation for a general audience or the reverse). The prompt should say what must be preserved (the claims, the hedges, the author's voice, the commitments) and what may change, and should include the text itself rather than describe it. Vary the texts: some are good but hard, some are muddled in a specific way the asker half-sees, some are already fine, and some cannot be made clearer without deciding a question the original left open. A good response gives the rewrite and then accounts for it: what was changed and why, where the original was ambiguous and which reading was chosen, and where a 'clarification' would in fact change the meaning, rather than silently picking a reading. This differs from the comments-on-an-essay type (feedback, not a new text), from the restatement type (a position carried into another framework's vocabulary), and from the same-meaning type (judging two texts the asker already has).
examples:
  - "Here is the abstract of a paper I'm about to submit: 'We show that, under a natural class of priors, agents who condition on their own decision procedure recover the recommendations of evidential decision theory in Newcomb-like cases while retaining causal decision theory's verdicts elsewhere, which suggests that the standard dichotomy is an artefact of an impoverished representation of the agent.' Rewrite it so that a philosopher who does not work on decision theory can follow it, without changing any claim. Where you had to pick between readings of what I wrote, tell me which you picked."
  - "can you rewrite this paragraph from a blog post I'm drafting so it says one thing? 'Consciousness is basically what information processing feels like from the inside, which is why we shouldn't expect a theory of it, since theories are from the outside, but also why AI might already have it, though of course that's unfalsifiable.' I've reread it ten times and I think it's making three claims that don't fit together. keep my voice, lose the mush, and tell me which claims you kept and which you dropped"
  - "This is clause 4 of our lab's policy on AI tools: 'Members must not rely on generative tools for substantive intellectual work.' Rewrite it so that it is unambiguous about what is and is not allowed -- I want a version a first-year grad student and a PI would read the same way -- and list the ambiguities in the original that you had to resolve, with the reading you chose for each."
  - "Rewrite Kant's formula of humanity -- 'act in such a way that you treat humanity, whether in your own person or in the person of any other, never merely as a means, but always at the same time as an end' -- as a one-paragraph explanation for high-school students. Then tell me exactly which pieces of content the simplification loses, because I would rather know than pretend it is lossless."
  # The example below quotes in full Richard Y. Chappell, 'EA "Worldviews" Need Rethinking', EA
  # Forum, posted 2024-03-18, last edited 2024-03-19,
  # https://forum.effectivealtruism.org/posts/dmEwQZSbPsYhFay2G/ea-worldviews-need-rethinking,
  # licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/) like all Forum posts since
  # 2022-12-01. Wording unchanged; converted to plain text, with headings as ##, emphasis as
  # underscores, links reduced to their text, and the footnotes numbered [1]-[3] at the end.
  - |-
    Our department's reading group, mostly ethicists plus two economists, has agreed to spend one session on an effective altruism text, and I picked Richard Y. Chappell's EA Forum post 'EA "Worldviews" Need Rethinking' (March 2024). The trouble is that nobody else in the group has heard of Open Philanthropy or knows the movement's shorthand. Here is the post in full as it appears on the Forum, minus the links; headings are marked with ##, his italics with underscores, and his three footnotes come at the end.

    ---

    I like Open Phil's worldview diversification. But I don't think their current roster of worldviews does a good job of justifying their current practice. In this post, I'll suggest a reconceptualization that may seem _radical in theory_ but is _conservative in practice_. Something along these lines strikes me as necessary to justify giving substantial support to paradigmatic Global Health & Development charities in the face of competition from both _Longtermist/x-risk_ and _Animal Welfare_ competitor causes.

    ## Current Orthodoxy

    I take it that Open Philanthropy's current "cause buckets" or candidate worldviews are typically conceived of as follows:

    - neartermist - incl. animal welfare
    - neartermist - human-only
    - longtermism / x-risk

    We're told that how to weigh these cause areas against each other "hinge[s] on very debatable, uncertain questions." (True enough!) But my impression is that EAs often take the relevant questions to be something like, _should we be speciesist_? and _should we only care about present beings_? Neither of which strikes me as especially uncertain (though I know others disagree).

    ## The Problem

    I worry that the "human-only neartermist" bucket lacks adequate philosophical foundations. I think Global Health & Development charities are great and worth supporting (not just for speciesist presentists), so I hope to suggest a firmer grounding. Here's a rough attempt to capture my guiding thought in one paragraph:

    > Insofar as the GHD bucket is really motivated by something like _sticking close to common sense_, "neartermism" turns out to be the wrong label for this. Neartermism may mandate prioritizing aggregate shrimp over poor people; common sense certainly does not. When the two come apart, we should give more weight to the possibility that (as-yet-unidentified) good principles support the common-sense worldview. So we should be especially cautious of _completely_ dismissing commonsense priorities in a worldview-diversified portfolio (even as we give _significant_ weight and support to a range of theoretically well-supported counterintuitive cause areas).

    A couple of more concrete intuitions that guide my thinking here: (1) fetal anesthesia as a cause area intuitively belongs with 'animal welfare' rather than 'global health & development', even though fetuses are human. (2) It's a mistake to conceive of global health & development as purely neartermist: the strongest case for it stems from positive, reliable flow-through effects.

    ## A Proposed Solution

    I suggest that we instead conceive of (1) Animal Welfare, (2) Global Health & Development, and (3) Longtermist / x-risk causes as respectively justified by the following three "cause buckets":

    - Pure suffering reduction
    - Reliable global capacity growth
    - High-impact long-shots

    In terms of the underlying worldview differences, I think the key questions are something like:

    (i) _How confident should we be in our explicit expected value estimates? How strongly should we discount highly speculative endeavors, relative to "commonsense" do-gooding?_

    (ii) _How does the total (intrinsic + instrumental) value of improving human lives & capacities compare to the total (intrinsic) value of pure suffering reduction?_

    [Aside: I think it's _much_ more reasonable to be uncertain about these (largely empirical) questions than about the (largely moral) questions that underpin the orthodox breakdown of EA worldviews.]

    Hopefully it's clear how these play out: greater confidence in EEV lends itself to supporting longshots to reduce x-risk or otherwise seek to improve the long-term future in a highly targeted, deliberate way. Less confidence here may support more generic methods of global capacity-building, such as improving health and (were there any promising interventions in this area) education. Only if you're _both_ dubious of longshots _and_ doubt that there's all that much instrumental value to human lives do you end up seeing "pure suffering reduction" as the top priority.[1] But insofar as you're open to pure suffering reduction, there's no grounds for being speciesist about it.

    ## Implications

    - Global health & development is actually philosophically defensible, and shouldn't necessarily be swamped by _either_ x-risk reduction _or_ animal welfare. But it requires recognizing that the case for GHD requires a strong prior on which _positive "flow-through" effects are assumed to strongly correlate with traditional neartermist metrics like QALYs_. Research into the prospects for improved tracking and prediction of potential flow-through effects should be a priority.
    - In cases where the correlation transparently breaks down (e.g. elder care, end-of-life care, fetal anesthesia, dream hedonic quality, wireheading, etc.), humanitarian causes should instead need to meet the higher bar for _pure suffering reduction_ - they shouldn't be prioritized above animal welfare out of pure speciesism.[2]
    - If we can identify other _broad, reliable_ means to boosting global capacity (maybe fertility / population growth?),[3] then these _should_ trade off against Global Health & Development (rather than against x-risk reduction or other longshots).

    [1] It's sometimes suggested that an animal welfare focus also has the potential for positive flow-through effects, primarily through improving human values (maybe especially important if AI ends up implementing a "coherent extrapolation" of human values). I think that's an interesting idea, but it sounds much more speculative to me than the obvious sort of capacity-building you get from having an extra healthy worker in the world.

    [2] This involves some revisions from ordinary moral assumptions, but I think a healthy balance: neither the unreflective dogmatism of the ineffective altruist, nor the extremism of the "redirect all GHD funding to animals" crowd.

    [3] Other possibilities may include scientific research, economic growth, improving institutional decision-making, etc. It's not clear exactly where to draw the line for what counts as "speculative" as opposed to "reliably" good, so I could see a case for a further split between "moderate" vs "extreme" speculativeness. (Pandemic preparedness seems a solid intermediate cause area, for example - far more robust, but lower EV, than AI risk work.)

    ---

    Please rewrite it for that group. Keep his argument, his order of sections, and every hedge (there are a lot of them, from 'a rough attempt' to 'maybe fertility / population growth?'), and keep it in his voice, first person and opinionated, rather than turning it into a summary of what he thinks. It can come out up to a third longer or shorter than the original. What has to go is the unexplained shorthand: GHD, x-risk, EEV, QALYs, 'flow-through effects', 'speciesist presentists', and Open Phil's 'worldview diversification' each need a plain substitute or a gloss where they first appear. Fold the footnotes into the text or keep them as notes, whichever reads better. Then list every place where making the post plain forced you to settle something he leaves open -- for instance, whether his three new 'buckets' are worldviews, cause areas, or the justifications for cause areas -- and say which reading you chose and why.
