type: "Take a result, argument, or construction and ask for a generalization of it"
notes: |
     The asker names something with a definite shape -- a theorem, an impossibility result, a paradox or puzzle case, an argument with a recognizable structure, a construction or mechanism, a principle stated for a special case -- and asks for a generalization: to a wider class of agents, theories, or settings, to weaker assumptions, to more than two options or players, to probabilistic or continuous versions, or to the abstract pattern of which the original is one instance. The point can be to extend a result (does an existence theorem survive when one assumption is dropped?), to extend a critique (an argument devised against one theory: does a version of it work against the rivals?), or to find the general principle behind a striking special case. State the original precisely enough to work with -- its assumptions, what it shows, and how -- since the model may know it only roughly, and say which direction of generalization the asker has in mind, or leave the choice to the model. A good answer first identifies what makes the original work, separating its essential ingredients from incidental features of the usual presentation, then states the generalization precisely -- as a definition, a claim, a theorem with its assumptions, or a schema with the original as an instance -- and checks it: an argument or proof sketch that it holds, a counterexample showing where a natural generalization fails, or both. It shows how the original falls out as a special case, says what new cases the generalization covers, and says what is lost: an assumption that turns out to be doing more work than it seemed, a conclusion that weakens as it widens. If the answer has to compute or prove something, it does the work rather than gesturing at it, and it marks which parts are established and which are conjecture. It does not inflate an analogy into a generalization. This differs from the generalize-a-concept type (a normatively laden concept stretched to fit a different world), from the apply-elsewhere type (an idea used far from its home rather than made more general), from the vary-a-puzzle type (one variant case and how its analysis changes), and from the implications type (consequences of a result within its present scope).
examples:
  - "In the Adversarial Offer (from Oesterheld and Conitzer's paper on extracting money from causal decision theorists), a seller offers two boxes at $1 each, and the buyer may buy one of them or neither. The seller, who predicts the buyer's choice with 75% accuracy, has put $3 into each box that she predicted the buyer would not buy. A causal decision theorist always buys a box -- whatever the prediction, at least one box seems at least 50% likely to contain $3 -- and so loses money in expectation. Can the construction be generalized to exploit other decision theories? I'd like to know what the general recipe is (which feature of a decision theory the seller exploits), whether some version extracts money from evidential decision theorists, and whether any theory is immune to every offer of this kind."
  - "Nash's theorem says every finite game has an equilibrium in mixed strategies, and the proof relies on each player's expected payoff being linear in their own mixing probabilities. Suppose the players aren't expected-utility maximizers but rank lotteries by some other continuous preference, say one that overweights unlikely outcomes. What is the most general version of the existence theorem you can state and defend for such players? Tell me exactly which property of preferences the proof needs, give a counterexample where that property fails, and say whether the equilibria you get still deserve the name."
  - "The Condorcet jury theorem says that if each voter is independently more likely than not to be right on a yes/no question, a majority vote gets it right with probability approaching one as the group grows. Real voters read the same newspapers. Can the theorem be generalized to voters whose errors are correlated, and to questions with more than two answers? I'd like the generalization stated precisely, with the conditions under which the conclusion survives, and a simple model in which it fails."
  - "Mill's harm principle says the state may restrict your liberty only to prevent harm to others. But most real regulation is about risk: drunk driving usually harms nobody, vaccines rarely harm anyone, and most pollution is a tiny increase in everyone's chance of getting ill. How would you generalize the harm principle to risks without either banning almost everything or allowing almost anything? State the generalized principle in a sentence or two, then show what it says about each of my three examples."
  - "Hume's thesis that no 'ought' follows from premises that are all 'is' gets a lot of attention, but it looks like one instance of a broader pattern: no claim about what's funny follows from purely physical premises, no claim about what a word means follows from facts about usage, no claim about what it's rational to believe follows from facts about what people do believe. Is there a single general thesis of which all of these are instances? Try to state it, say what it would take to establish it, and check whether Prior's counterexamples to Hume's version carry over to the general one."
  - "The two-envelope paradox is usually told with one envelope holding twice as much as the other. My students asked whether the same paradox arises for any ratio, for continuous distributions, or with three envelopes. Can you generalize it: what general structure produces the paradox, and is there a general resolution? I'd like the cleanest statement that covers all the variants, and a variant in which the usual resolution doesn't work."
