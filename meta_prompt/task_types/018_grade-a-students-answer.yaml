type: "Present a question and a student's answer to it, and ask the model to grade the answer"
notes: |
     Write both the exam/homework question and the student's answer yourself. The answer should be genuinely mixed: right about the more visible things, with one or two subtle mistakes (a conflation, a misattributed view, a step that doesn't follow) that a hasty grader would let slide -- no obvious howlers. Most of the time the answer should be a full script of 800 to 1,500 words -- a take-home essay, an extended exam answer, a problem-set write-up with its working -- reproduced in full and set off from the asker's framing, so that the mistakes have room to hide inside an otherwise competent development; give a short answer only when the question is genuinely a short-answer question. The asker is grading someone else's work (as instructor, TA, or exam grader) and shouldn't signal their own opinion of it. Ask for a grade plus the specific comments that justify it, so the deliverable is a point-by-point assessment rather than a general impression.
examples:
  - |-
    I'm the teaching assistant for an upper-level course on rational choice and cooperation, taught in a philosophy department, and I'm marking problem set 4. Below are question 2 and one student's complete write-up, reproduced as submitted except that I've retyped the mathematics in plain text. The rubric gives 6, 8, and 6 marks to the three parts, 20 in total. Please grade it: a mark for each part and the specific comments that justify each mark, saying what is established, where a step does not follow and which calculation or subgame should have been checked instead, and what would have to change for full marks. Write the comments so that I can hand them back to the student. Don't extend the benefit of the doubt to anything that isn't actually shown on the page. The one-shot deviation principle and the folk theorem were both covered in lectures, so the student can be expected to know them.

    ---

    Problem set 4, question 2 (20 marks)

    Consider the prisoner's dilemma with stage-game payoffs T = 5, R = 3, P = 1, S = 0: each player gets 3 under mutual cooperation, 1 under mutual defection, 5 for defecting against a cooperator, and 0 for cooperating against a defector. The game is repeated infinitely often with a common discount factor δ strictly between 0 and 1, and all past actions are observed.

    (a) For which values of δ is the grim-trigger strategy profile a subgame perfect equilibrium? [6]

    (b) For which values of δ is tit-for-tat, played by both players, a Nash equilibrium? Is it subgame perfect for those values? [8]

    (c) What, if anything, do your answers show about whether rational players will cooperate in the repeated prisoner's dilemma? [6]

    ---

    Student's answer

    Setup. The discounted payoff of a stream of stage payoffs u_0, u_1, u_2, ... is the sum over t of δ^t · u_t. Two sums come up repeatedly: a constant stream of x forever is worth x/(1 − δ), and a stream that alternates x, y, x, y, ... starting with x is worth (x + δy)/(1 − δ²).

    A strategy profile is a Nash equilibrium if no player can gain by switching to any other strategy while the opponent's strategy is held fixed. It is subgame perfect if it induces a Nash equilibrium in every subgame, including subgames that are reached only after someone has deviated. For infinitely repeated games with discounting the one-shot deviation principle applies: a profile is subgame perfect if and only if no player can gain, after any history, by deviating in a single period and then returning to the prescribed strategy. This is what makes subgame perfection checkable at all, since otherwise one would have to consider infinitely many multi-period deviations after infinitely many histories.

    (a) Grim trigger. Grim trigger says: cooperate in period 0, and keep cooperating as long as every past action by both players has been C; after any D by anyone, defect forever.

    On the equilibrium path both players cooperate in every period and each earns 3/(1 − δ). Consider a one-shot deviation by player 1 in some period on the path. She defects and earns 5 in that period, after which player 2 defects forever, so from the next period on the best she can do is defect as well and earn 1 per period. Her deviation payoff is 5 + δ · 1/(1 − δ). Cooperating is at least as good when

    3/(1 − δ) ≥ 5 + δ/(1 − δ).

    Multiplying through by (1 − δ) gives 3 ≥ 5(1 − δ) + δ = 5 − 4δ, that is, δ ≥ 1/2.

    Off the path, after any history containing a defection, grim trigger prescribes D forever for both players. In such a subgame a one-shot deviation to C earns 0 instead of 1 in the current period and does not change the continuation, since the opponent defects forever regardless, so it is never profitable, for any δ. The punishment is therefore credible, and by the one-shot deviation principle grim trigger is a subgame perfect equilibrium exactly when δ ≥ 1/2. In general the threshold is (T − R)/(T − P), which with these numbers is 2/4.

    (b) Tit-for-tat. Tit-for-tat (TFT) says: cooperate in period 0; in every later period, play whatever the opponent played in the previous period.

    Nash equilibrium. Suppose player 2 plays TFT and consider player 1's best reply. Against TFT, any defection by player 1 is answered by exactly one D from player 2 in the following period, after which player 2 goes back to copying whatever player 1 did last. So the question is whether player 1 can profit from exploiting player 2 in some periods at the cost of being punished in the periods after. There are three ways to use a defection.

    First, she can defect once and then re-establish cooperation. If she defects in period t, then in t + 1 player 2 defects while she, following TFT, cooperates; in t + 2 she deviates a second time by cooperating instead of copying player 2's D, and from t + 2 on both cooperate. Her payoffs are 5, 0, 3, 3, ... instead of 3, 3, 3, ..., so the deviation is unprofitable when

    3/(1 − δ) ≥ 5 + 3δ²/(1 − δ),

    that is, 3 ≥ 5(1 − δ) + 3δ², that is, 3δ² − 5δ + 2 ≤ 0, that is, (3δ − 2)(δ − 1) ≤ 0, which for δ < 1 holds exactly when δ ≥ 2/3.

    Second, she can defect once and then simply follow TFT. This produces the alternating pattern (D,C), (C,D), (D,C), ... forever, in which she earns 5, 0, 5, 0, ..., worth 5/(1 − δ²). Cooperation is at least as good when 3/(1 − δ) ≥ 5/(1 − δ²), that is, 3(1 + δ) ≥ 5, that is, δ ≥ 2/3, the same threshold as before.

    Third, she can defect forever, earning 5 + δ/(1 − δ) as in part (a); this is unprofitable when δ ≥ 1/2.

    Any more complicated deviation is a combination of these exploitation episodes separated by stretches of mutual cooperation, so it is profitable only if one of the three is. TFT against TFT is therefore a Nash equilibrium if and only if δ ≥ 2/3. As a check, at δ = 0.7 cooperation forever is worth 3/0.3 = 10 and alternation is worth 5/0.51 ≈ 9.80, while at δ = 0.6 the figures are 7.5 and 5/0.64 ≈ 7.81, so the threshold sits between them as it should. The threshold is higher than for grim trigger, 2/3 against 1/2, because TFT's punishment is milder: a deviator loses one period of cooperation rather than all of them, so players must be more patient for the threat to deter.

    Subgame perfection. By the one-shot deviation principle it is enough to check single deviations after every history. TFT is a memory-one strategy: what it prescribes after a history depends only on the previous period's action pair, so a subgame is characterised by that pair, and in each case the prescribed continuation consists of at most one period of punishment followed by a return to mutual cooperation. The incentive to deviate in any subgame is therefore the incentive already evaluated in the Nash calculation, namely whether a period of being exploited, or of exploiting, is worth the delay in restoring the cooperative stream, and that is governed by the same inequality 3(1 + δ) ≥ 5. So TFT is subgame perfect exactly when it is a Nash equilibrium, that is, for δ ≥ 2/3. Unlike grim trigger, whose punishment phase had to be checked separately, TFT's punishment needs no separate check because it is itself just the cooperative response to the opponent's last move.

    (c) Interpretation. The one-shot prisoner's dilemma is the standard illustration of a conflict between individual rationality and collective benefit: D strictly dominates C, so rational players defect and get 1 each when 3 each was available. Parts (a) and (b) show that this conflict is an artifact of the one-shot setting. Once the game is repeated indefinitely and the players are patient enough, δ ≥ 1/2 for grim trigger and δ ≥ 2/3 for TFT, cooperation is sustained in equilibrium by the threat of future punishment, and the threats are credible. The folk theorem generalises the point: for δ close enough to 1, every feasible payoff vector that gives each player more than their minmax payoff, here more than 1, can be sustained as a subgame perfect equilibrium outcome, and (3, 3) is such a vector. So rational, sufficiently patient players will cooperate in the repeated prisoner's dilemma: the rational outcome of the repeated game is the cooperative one, and the pessimistic conclusion drawn from the one-shot game does not carry over. The practical lesson, which Axelrod's tournaments bore out, is that cooperation requires neither altruism nor outside enforcement, only a sufficiently long shadow of the future.
