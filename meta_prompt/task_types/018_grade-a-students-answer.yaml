    I'm one of the teaching assistants on a second-year course on rational choice and politics, and I'm marking the take-home essays. The question and one student's essay follow exactly as submitted, apart from my removing the student's name. Please go through the essay and comment wherever there is something to say, crediting what the student gets right as well as identifying where a claim is false or a step does not follow, and saying in each case what the student should have said instead. Then fill in the department's marking sheet, which has four criteria marked out of 10 each. Reproduce it in exactly this format, since I paste it into the records system:

    Use of concepts, including the notion of rationality: __/10 -- one sentence
    Argument and calculation: __/10 -- one sentence
    Objections and replies: __/10 -- one sentence
    Structure and writing: __/10 -- one sentence
    Total: __/40
    Class: first (28 and above), upper second (24 to 27), lower second (20 to 23), third (16 to 19), or fail (below 16)
    Feedback to the student: one sentence of at most 40 words

    ---

    Essay question: "For an ordinary citizen in a large election, voting is irrational." Discuss. Your essay must state the notion of rationality it relies on and must include at least one explicit expected-value calculation. (1,500 words)

    ---

    Why the rational citizen stays home

    Whether voting is rational depends on what rationality is, so I begin there. I will use the standard instrumental notion: an action is rational for an agent if it is, by her own lights, the most effective available means to her ends, whatever those ends happen to be. On this notion a saint and a miser can both act rationally, and both can fail to, since rationality concerns the fit between means and ends and not the content of the ends. The question is then whether, for an ordinary citizen in a large election, casting a vote is an effective means to any end she has. I shall argue that it is not, with one exception that turns out to concede the point rather than rebut it.

    Begin with the obvious end: the citizen wants the better candidate to win. Her vote serves that end only if it changes who wins, and in a large election it does so only if the other votes are tied, or within one of a tie, so that hers makes or breaks the result. How likely is that? In an electorate of ten million, even in a race the polls call a toss-up, the chance that the margin lands within a single vote is roughly one in ten million; in a race that is not close it is far smaller, so small that it is better described as zero. Nothing in this depends on the details of the voting system. Any system in which the outcome is a function of the number of votes shares the feature that one vote matters only at a threshold, and thresholds are rarely reached.

    Now put a value on the outcome. Suppose, generously, that the better candidate's victory is worth a thousand dollars to me over the term: a difference in taxes, in services, in the laws I live under. The expected value of my vote is then a thousand dollars multiplied by one chance in ten million, which is a hundredth of a cent. Against this stands the cost: the walk to the polling station, the queue, the hour that could have been spent on anything else, worth at least a few dollars to anyone. On the ordinary end of wanting the better candidate to win, voting fails the expected-value test by a factor of tens of thousands.

    One might quarrel with the figures. Perhaps the chance of a decisive vote in a genuinely close race is ten times higher than I have allowed; perhaps the stake is ten times greater. Multiply both by ten and the expected value of a vote is still a cent; multiply both by a hundred and it is still a dollar, less than the hour. The argument does not depend on the particular numbers but on their orders of magnitude, and it would take an error of a factor of ten thousand to overturn it.

    Nor does it help to widen the circle of concern. Suppose I care about all ten million of my fellow citizens as much as I care about myself, and that each of them also gains a thousand dollars if the better candidate wins. Each of those gains, like mine, must be discounted by the one-in-ten-million chance that my vote is what brings it about. Altruism multiplies the stake, but it multiplies the discount in exactly the same proportion, since every citizen's gain hangs on the same improbable tie, and a sum of ten million negligible quantities is still negligible. The altruist's expected value is where the egoist's was: a hundredth of a cent, now shared out among ten million people.

    The most common reply is the question "what if everyone reasoned like that?" It is worth separating two things the question might mean. As a prediction it is false: my reasoning does not cause anyone else to stay at home, and the millions who vote will vote whether or not I join them, so the hypothetical in which everyone abstains is not one my decision brings any closer. As a moral principle, that one should act only on maxims one could will to be general, it may well be correct, but it is a principle about what morality demands, and the question before us is what rationality demands. The two can come apart, and the interest of the problem lies in the fact that they come apart here.

    A better reply grants the arithmetic and changes the end. Perhaps the citizen votes not to change the outcome but to express her allegiance, to take part in a shared occasion, to be able to say that she did her bit. If those are her ends, voting is an effective means to them, and by my own definition it is rational. I accept this entirely. But notice what it concedes. It makes voting rational in the way that attending a concert or wearing a team's colours is rational: for those who enjoy it, and only for them. It gives no reason to vote to the citizen who finds the whole business tedious, and it abandons the thought that defenders of voting most want to keep, that the vote is a means by which the citizen helps to determine how she is governed.

    Finally, suppose the arithmetic of the altruistic case were somehow to come out the other way, so that a citizen who cared enough about others would find voting worth the hour. Even then the defender of voting would not have shown what he wants. A concern for the welfare of others is a moral motive, not a rational one. Rationality, in the sense in which the charge of irrationality has any bite, concerns the efficient pursuit of one's own good; morality may demand that we sacrifice that good, and we may admire those who do, but it cannot make the sacrifice rational. The altruistic voter, if the sums came out in her favour, would be admirable. She would not thereby be rational, any more than the soldier who falls on the grenade is prudent.

    For the ordinary citizen, then, voting is irrational on the one end that would make it matter, namely affecting the outcome, and rational only on ends, such as enjoyment or expression, that make it no different from any other pastime. The practice survives because it is sustained by norms, by mild social pressure, and by a flattering picture of the single vote that does not survive a minute's arithmetic. None of this is a reason to abolish elections, which aggregate the choices of millions whatever each of the millions thinks she is doing. It is a reason to stop telling citizens that reason requires them to turn out, and to tell them instead, truthfully, that they may if they like.
