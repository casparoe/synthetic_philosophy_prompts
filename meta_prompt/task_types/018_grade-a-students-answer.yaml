    I'm marking final essays for a third-year course in population ethics and value theory, and I want an independent read of one script before I settle on a mark. The question, the department's band descriptors, and the essay follow; the essay is as submitted. Please grade it against the descriptors, not against your own view of the question. Where you think a claim is false or a step fails, quote it and say what is wrong; otherwise say what the essay does and does not do, with reference to the descriptors. Then end with the following, in this order:

    Mark: __/100
    Band: __
    Clauses of the awarded band's descriptor that the essay meets: (list)
    Clauses of the band above that it does not meet, each with the passage of the essay that shows it: (list)
    Comment for the student (at most 60 words): __

    ---

    Essay question: 'The mere addition paradox shows that "better than" is not transitive.' Discuss. (2,000 words)

    Band descriptors

    First (70 and above): shows command of the material and independent judgement. States the problem precisely and in its strongest form. Pursues a line of argument of the student's own, anticipates the strongest objection to it, and answers it rather than noting it. Draws distinctions that do work in the argument. Reaches a conclusion whose confidence matches what has been shown. Writing is clear and economical throughout. Marks above 80 are reserved for work that could be developed for publication with modest revision.

    Upper second (60 to 69): accurate and well organised. States the problem correctly and argues for a definite conclusion. Considers objections, but may answer the easier ones or answer the harder ones briefly. Distinctions are correct but may be reported rather than used. The conclusion may claim slightly more than has been shown. Writing is clear, occasionally wordy.

    Lower second (50 to 59): largely accurate exposition of standard material. An argument is present but mainly reproduces positions from the reading; objections are mentioned rather than engaged. Some imprecision in key terms. The conclusion is asserted rather than earned.

    Third (40 to 49): relevant but with significant gaps or errors; little argument of the student's own; structure unclear.

    Fail (below 40): misunderstands the question or the central material.

    Within a band, place the essay higher where the strengths listed for the band above are partly present, and lower where the weaknesses listed for the band below are partly present.

    ---

    A paradox about addition, not about transitivity

    Parfit's mere addition paradox begins with three populations. In A, ten billion people each have lives of very high quality; say their welfare is 100 on a scale on which zero marks a life just worth living. In A+, those same ten billion exist at 100, and in addition another ten billion exist at 40: lives clearly worth living, though much less good, led, we may suppose, on a continent the first group never learns of, so that the addition makes no difference to anyone in it. In B, twenty billion people each have welfare 80. Three judgements about these populations are each hard to resist. First, A+ is not worse than A: it differs from A only by the existence of further people whose lives are worth living and whose existence harms no one, and it is hard to see how the world could be made worse by that. Second, B is better than A+: it has more total welfare, a higher average, and no inequality, and it is reached from A+ by a change that benefits the worse-off group more than it costs the better-off. Third, A is better than B, or at least the repetition of the first two steps from B leads, through B+ and C and so on, to a population Z of enormous size in which everyone's life is barely worth living, and A is better than Z. Since 'better than' is transitive, the first two judgements, repeated, entail that Z is better than A, which contradicts the third.

    Stated this way the paradox invites the diagnosis in the title of this question: perhaps 'better than' is not transitive after all. Before assessing that diagnosis it is worth being exact about what the argument needs. The first judgement is not that A+ is better than A, nor even that it is equally good, but only that it is not worse. From 'B is better than A+' and 'A+ is not worse than A' the conclusion 'B is better than A' follows only if 'not worse than' is read as 'at least as good as', or if some bridging principle licenses the step. If 'not worse than' is allowed to cover rough comparability, where neither population is better than the other and they are not precisely equal either, then the first judgement no longer says that A+ is at least as good as A, and the inference to 'B is better than A' lapses, with transitivity untouched. This is a genuine response, but it belongs with the first option rather than the fourth: it changes what the first judgement claims, not the logic that connects the judgements. And it has a price that becomes visible along the chain. Whoever takes it must hold that each mere addition lands the world in a region of rough comparability, and that a redistribution from there can lead to a place determinately better than the mere addition's result without leading to a place better than its starting point, and so on for every rung down to Z. That is coherent, but it is not obvious, and it is certainly not a reason to abandon transitivity. The intransitivity response proper is the one that accepts all three judgements as stated, with the first read as 'at least as good', and denies that they can be chained. There are, then, four responses: deny one of the three judgements, or deny that the value relations compose across the chain. I shall argue that the last is the worst of the four, and that the third judgement is the one to give up.

    The intransitivity response has an evident attraction: it lets us keep everything we were inclined to say. Its cost is less evident but larger. 'Better than' is a comparative, and the point of a comparative relation among outcomes is to order them; ordering is what makes the relation usable in choice, where we must pick from a set of options and want to pick the best. If betterness can run in a cycle, there are sets of options in which every option is worse than some other, so that whatever one chooses, the theory of value says one should have chosen otherwise. A theory that says this of every option in a set has not evaluated the set; it has declined to. The intransitivity theorist will say that this misdescribes the view: there is one relation, betterness all things considered, but the factors relevant to it differ from comparison to comparison, equality mattering when B is compared with A+, the mere existence of worthwhile lives when A+ is compared with A, and so on, so that cycles are not a failure of the relation but a consequence of its sensitivity to what is being compared. But to say that the factors relevant to comparing X with Y depend on which outcomes X and Y are is to say that there is no fixed standard that 'better than, all things considered' applies across pairs; and if there is no fixed standard, the paradox has not shown that the relation defined by one is intransitive. It has shown that a standard sensitive to the pairs can cycle, which no one should have doubted, and left open whether evaluation should use such a standard. My claim is that it should not, for the reason already given: a standard that can cycle cannot do the work of ordering options for choice, and ordering options for choice is what the all-things-considered standard is for. Once the factors are fixed and applied to A, A+, B, and Z alike, the populations will be ranked, and one of the three judgements will have to go.

    Which one? The three judgements are not supported in the same way, and that is the key to the paradox. The first rests on a principle: adding people whose lives are worth living, in a way that affects no one else, does not make an outcome worse. To deny it is to say that there is a population whose members each have lives worth living, whose existence harms no one, and whose existence nonetheless makes the world worse, and so, it would seem, that it would have been better had they never existed. One can say this, but one cannot say it while also meaning what one says in calling their lives worth living. The second rests on a combination of two considerations that almost every theory of value accepts in some form: that more welfare is, other things equal, better, and that a more equal distribution of a larger total is not worse than a less equal distribution of a smaller one. The third rests on neither a principle nor a combination of principles but on a reaction: the thought of Z strikes us as appalling and the thought of A as splendid, and we take the reaction to report a comparison.

    There are specific reasons to distrust that reaction, reasons that do not generalise to intuitions at large. First, we are known to be insensitive to scale: our sense of how much good a population contains does not double when the population doubles, and Z's claim to be better than A rests entirely on scale. Second, the lives in Z are described as barely worth living, and we fill in that description with images of misery, hunger, and monotony. But a life barely worth living is, by stipulation, a life whose good outweighs its bad; the images we supply are of lives that are not worth living at all, and the reaction they produce is a reaction to a different population. Third, we imagine the move from A to Z from the standpoint of A's inhabitants, for whom it would indeed be a disaster, and the judgement that A is better than Z inherits the standpoint without the warrant. None of these points shows that Z is better than A. They show that the judgement that it is not rests on a reaction we have independent reason to think unreliable about cases of this shape, while the judgements it conflicts with rest on principles we have no comparable reason to doubt.

    The strongest objection to this is that it makes the method too easy. Any intuition that conflicts with a favoured theory can be assigned to some misfiring faculty, and a philosophy that permits this can never be refuted by a case. The reply is that the debunking here is local and independently motivated. The failures of scale sensitivity and the substitution of unlivable lives for barely livable ones are not posited to save a theory; they are documented tendencies that would predict exactly this reaction whether or not Z were worse than A, and a reaction that would occur either way cannot be evidence of which way things are. Someone unmoved by this may prefer to give up the second judgement instead, holding that lives below some critical level add nothing to an outcome or count against it. That is the other serious option. Its cost is that it must then say that adding lives worth living can make the world worse, and, in some cases, that adding a few lives not worth living is better than adding many lives worth living but below the critical level. Between a view with that implication and a view that accepts Z as better than A, the second seems to me the lesser cost, though I grant that someone who weighed the costs differently would not have made a mistake.

    The mere addition paradox, then, does not show that 'better than' is intransitive. It shows that three attractive judgements cannot all be held together with the assumption that evaluation orders its objects, and it invites us to ask which of the three is least well supported. Transitivity is not a fourth judgement on a par with the others but the condition under which the others are judgements about the same thing. Of the three, the one that condemns Z is supported by a reaction rather than a principle, and by a reaction we have particular reason to distrust. I conclude that the paradox is better understood as an argument for the repugnant conclusion than as an argument against transitivity, and that the name of the conclusion records our reaction to it rather than its truth.
