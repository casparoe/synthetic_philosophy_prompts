type: "Lay out a step-by-step argument and ask whether it is valid and, if not, which step fails"
notes: |
     The asker presents an argument as numbered steps -- premises, intermediate conclusions, a final conclusion -- and asks whether it goes through and, if not, where exactly it fails. Often the argument is the asker's own and they half-suspect a trick; sometimes it is one they read and found too quick. The steps should be individually plausible, so that locating the fault takes work: an equivocation between two readings of a term, a scope shift, a modal fallacy, a suppressed premise, an illicit move from each to all. Make some of these arguments actually valid, so that the right answer is sometimes that the argument is fine and the conclusion, though unwelcome, follows.
examples:
  - "Tell me which step is wrong, because the conclusion can't be right. (1) If it is possible that it rains tomorrow and possible that it doesn't, then neither 'it will rain' nor 'it won't rain' is true now. (2) A proposition that is not true is false. (3) So both 'it will rain' and 'it won't rain' are false now. (4) But one is the negation of the other, and a proposition and its negation cannot both be false. (5) So it is not possible both that it rains tomorrow and that it doesn't; the future is fixed."
  - "My argument that no one can be blamed for their beliefs: (1) You can only be blamed for what you control. (2) You cannot decide to believe something at will -- try believing the wall is green. (3) So beliefs are not under your control. (4) So you cannot be blamed for any belief. Step 2 seems undeniable, so I think the conclusion follows, but people react as if I've cheated. Have I? Say exactly which step, if any, fails and what the correct version of it would be."
  - "A short argument that a perfect simulation of a brain would be conscious. (1) Consciousness is a physical process in the brain. (2) Every physical process is a matter of the causal structure among its parts. (3) A perfect simulation reproduces the causal structure among the parts. (4) Therefore a perfect simulation reproduces consciousness. I suspect (2) is doing something sneaky but can't say what. Is the argument valid? Is each premise true? If (2) is the problem, give the strongest reading on which it is true and check whether the argument still goes through."
  - "(1) Every voluntary act is done for a reason the agent had at the time. (2) Reasons are beliefs and desires. (3) Beliefs and desires are caused by prior states not chosen by the agent. (4) What is caused by unchosen states is itself unchosen. (5) So no voluntary act is chosen. I actually think this one is valid and that people who resist it just dislike the conclusion. Am I right, or is there a step where a compatibilist can legitimately dig in? Be specific about the step and the reading of it."
  - "An argument I've been using against causal decision theory; I'd like to know whether it is actually valid. (1) The decisions we make should not depend on the utilities assigned to outcomes that are impossible to occur. This is just what expected-value reasoning already does: an outcome with probability zero contributes nothing whatever utility it is given, so two problems that differ only in the utilities of their impossible outcomes should get the same decision. (2) In a prisoner's dilemma against an exact copy of yourself, the outcomes (C,D) and (D,C), in which the two of you choose differently, are impossible: whatever reasoning takes you to an action takes the copy to the same action. (3) So by (1) your decision should depend only on the utilities of (C,C) and (D,D). (4) Causal decision theory recommends defecting because defecting dominates: U(D,C) > U(C,C) and U(D,D) > U(C,D), so D is better whatever the copy does. (5) Now raise U(C,D) above U(D,D) and lower U(D,C) below U(C,C), for both players so that the game stays symmetric. Only the utilities of impossible outcomes have changed, but the dominance now runs the other way and causal decision theory switches to cooperating. (6) So causal decision theory's recommendation depends on the utilities of outcomes it can already know to be impossible, which by (1) no correct decision rule may do; evidential decision theory, which conditions on the action and so gives those outcomes probability zero, passes the test. I think this is valid and that it shows a systematic flaw in CDT rather than a quirk of one example. A causalist friend says the word 'impossible' is doing something illegitimate in (2), or in the move from (1) to (3), but can't say what. Is there a reading of 'impossible' on which (1) is true and (2) false, or on which both are true and (3) still does not follow? If the argument fails, say at which step and on which reading; if it holds, say what the causalist has to give up."
