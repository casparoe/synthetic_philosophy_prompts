type: "Write the prompt or instructions for another AI system that is to do a philosophical job"
notes: |
     The asker wants a task written for another AI system: a system prompt, a set of instructions, a rubric for an AI judge, or a one-off prompt meant to elicit something specific. The job should turn on a conceptual question that the instructions cannot avoid settling: a moderator that must not take sides (what counts as taking one?), a tutor that should make students defend their views without telling them what to think, a judge comparing two answers to a philosophy question that should reward the better argument rather than the longer or more confident answer, an assistant giving advice under moral uncertainty, a generator of thought experiments that must not rehash the classics, a prompt that gets a model to commit to its own view instead of surveying the field. The prompt should say who will use the system and for what, and may say what has gone wrong so far (the judge favors whichever answer it reads first; the tutor caves as soon as a student pushes back) or paste the current instructions to be improved. A good answer gives the instructions themselves, usable as they stand and written for a capable but literal reader, and then accounts for them: which conceptual choice each hard clause makes and why, which failure modes it guards against (gaming the letter of a rule, sycophancy, needless refusals, reflexive both-sidesing), and two or three test inputs with the behavior the instructions should produce, including one where two instructions pull apart and the text says which wins. Length should go to the hard cases, not to generic boilerplate about roles and thinking step by step. This differs from the theory-into-a-procedure type (a procedure for a human practitioner), the exam-question type (a task for students, with a marking scheme), and the rewrite type (a better version of a text, judged by a reader rather than by what a system does with it).
examples:
  - "We use a language model to judge pairs of answers to philosophy questions, and its verdicts go into a preference dataset. Two problems so far: it picks whichever answer it reads second about 60% of the time, and it rewards length even when the extra length is a survey of positions nobody asked for. Write the judge's instructions from scratch. They should say what makes one philosophical answer better than another -- I care whether the argument is good and actually answers the question, not about coverage -- and how to weigh a careful answer that never commits against one that commits to a view and gets a detail wrong. Then describe three test pairs that would show whether the new instructions work."
  - "I teach intro ethics at a community college, and students talk to a chatbot tutor before each class. Its entire instructions right now are: 'Be Socratic. Never tell students what to think.' In practice it either agrees with whatever a student says or, when someone writes 'morality is just opinion anyway', delivers a lecture on metaethics. Rewrite the instructions so it keeps pressing students to defend their views without caving or preaching. I'd like it to be allowed to say that an argument is invalid but never that a conclusion is false -- unless you can convince me that line doesn't hold up."
  - "every time I ask a model what it actually thinks about moral realism I get the same survey of positions ending in 'ultimately it depends on your framework'. write me a prompt that gets a model to commit to a view and defend it, without just ordering it to pick a side or play a philosopher. and tell me how I'd know whether the answer reflects anything stable about the model rather than the wording of my prompt"
  - "I'm on the team behind a companion app, and users regularly ask the assistant whether it has feelings, whether it misses them, whether it's conscious. Right now it either says 'As an AI, I don't have feelings' or plays along. We think both are dishonest: the first claims a certainty nobody has, and the second claims the opposite one. Write the section of its system prompt that governs these questions. It should be honest about what is and isn't known, kind, and short in conversation. Include the hard case: a recently widowed user who asks it to say that it will miss them when they log off."
  - "Our news site has a model screen op-eds before publication and flag claims that are 'false or misleading'. 'False' works fine. 'Misleading' doesn't: the model flags every simplification but misses true statistics chosen to suggest something false. Write the instructions for the misleading part. Define the term so that two careful editors would agree on most cases, say what the model should do with claims that mislead only some readers, and give four test sentences with the verdict each should get, including one that is literally false but not misleading."
