type: "Write the desiderata a theory in an area must meet"
notes: |
     The asker wants a specification: what a theory of X has to be able to do to count as adequate -- the phenomena it must explain, the cases it must get right, the distinctions it must respect, the results it must be consistent with -- with the case or consideration behind each requirement, and a view on which requirements are negotiable and which are not. Optionally, the main existing contenders scored briefly against the list. The conceptual work is in the requirements: which of the things people demand of a theory in this area are genuine desiderata and which are prejudices of one camp, whether some subset of the desiderata is jointly unsatisfiable (in which case the list itself is a result), and which requirement does the most to exclude candidates. Keep the weight on the criteria and their motivating cases rather than on the scoring, since the scoring leans on knowing the contenders and the criteria are where the thinking is. The asker can fix the purpose (a theory good enough for what?), since adequacy is relative to it. This differs from the ranking type (an evaluation along a given dimension) and from the comparison type (two views in prose): here the standard of evaluation is itself the deliverable.
examples:
  - "Before I read any more theories of reference for proper names, I want to know what I should be asking of one. Write the desiderata: what any adequate theory of how a name gets its referent has to deliver -- which cases it must get right, which puzzles it must dissolve or explain, which distinctions it must respect -- with the case behind each, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, how descriptivism, the causal-historical picture, and a two-dimensional view do against the list."
  - "For a philosophy of physics seminar, write the list of requirements an interpretation of quantum mechanics must meet to count as solving the measurement problem, with the consideration behind each, and mark which are non-negotiable and which are preferences of particular camps (locality, determinism, no preferred basis, empirical equivalence with textbook quantum mechanics, and so on). If some subset of the requirements is jointly unsatisfiable given Bell's theorem or other no-go results, say so -- that is the part I most want to see. Skip the scorecard, I'll do that in class."
  - "what would a theory of moral status actually have to get right? I keep seeing people argue for and against giving moral weight to insects or wild animals or future people by pointing at one case, and I'd like the full spec first. give me the requirements list -- the cases it has to handle, the distinctions it can't collapse (like between having status and how much), the results from biology it can't contradict -- with why each is a requirement, and tell me which single requirement knocks out the most popular theories. a table is fine"
  - "I've thought a lot about whether God exists. I've come to the conclusion that He probably does. I now want to write a monograph about my theism. What are the main issues that I need to address? What questions do I need to answer?"
