type: "Name two problems or debates and ask how they bear on each other"
notes: |
     The asker names two problems, debates, or questions -- in one field or in neighboring ones -- and asks how they are related: whether an answer to one constrains the answer to the other, whether one is an instance or a special case of the other, whether they share a structure or a crux, whether the same consideration drives both, whether the positions people hold on them line up and whether that alignment is forced or an accident of history, or whether they are independent despite appearances. The pairs can be two disputes between rival theories (does your side in one dispute commit you in the other?), a first-order debate and a question about its foundations (what a dispute between two theories of rational choice owes to the metaphysics of causation), two problems with the same shape in different areas, or two problems that are often run together. State each problem briefly in the asker's own terms, without assuming the model knows the exact framing, and say why the asker cares: they hold a view on one and wonder what it commits them to on the other, they suspect two literatures are reinventing each other, or they want to know whether progress on one would carry over. A good answer states both problems precisely enough that their relation can be checked, maps the combinations of positions and says which are consistent, which are in tension, and which are forced, identifies the shared assumption or crux if there is one, separates logical connections from sociological ones (people who hold one view tend to hold the other), and says where the connection is commonly overstated or overlooked. It takes a position on how tight the relation is rather than listing every conceivable link, and it names what a person would have to give up to break it. This differs from the comparison type (two answers to one question, not two questions), from the parallel type (a resemblance the asker has already spotted between distant fields, tested for depth), from the stalled-debate type (what kind of disagreement one debate is), and from the restatement type (a position carried into another framework).
examples:
  - "How does the debate between causal and evidential decision theory relate to debates about the metaphysics of causation? Causal decision theorists say you should do what causes good outcomes, but they rarely say what causation is. If causation is just a pattern of counterfactual dependence, or something defined from probabilities, does causal decision theory collapse into something an evidentialist could accept? And would a reductive view of causation hurt or help the evidentialist? I'd like a map of which combinations of views are stable."
  - "In ethics there's a debate about how to aggregate people's interests -- sum them, give priority to the worse off, give everyone an equal chance in a lottery -- and in game theory there's a separate debate about bargaining solutions, Nash's, Kalai-Smorodinsky's, and so on. Both look like they're about the same thing: how to combine many parties' preferences into one choice. Are they? When should an ethicist borrow from bargaining theory, and when does the comparison mislead? Concrete cases welcome."
  - "is the EDT vs FDT dispute the same kind of dispute as CDT vs EDT? people talk as if there's a ladder: CDT looks at the causal effects of your action, EDT at your action as evidence, FDT at your decision procedure, and each rung is more correct than the last. but it seems to me EDT vs FDT might turn on something completely different, like what you are, rather than on what counts as good reasoning. is there one dimension here or two? what would someone have to believe to reject FDT for the same reason they reject CDT?"
  - "I'm writing a term paper and I've noticed that the non-identity problem in population ethics seems to depend on what personal identity is. If a different sperm and egg would have made a different person, then a policy that changes who gets born harms no one who exists. But if identity were more a matter of psychological continuity, or if it were indeterminate, would the problem dissolve or just move? Please work out how the two debates connect, and tell me which views about identity would actually make a difference to the ethics."
  - "In statutory interpretation, textualists say a law means what its words publicly meant when it was enacted, while purposivists say it means what it was for. In philosophy of language there's a debate about whether meaning is fixed by speakers' intentions or by public conventions. Do the two debates bear on each other, or do lawyers and philosophers just use similar words? If a judge became convinced that intentions fix meaning in ordinary speech, would that commit her to purposivism?"
  - "Are the Fermi paradox and the doomsday argument secretly the same problem? Both reason from our position -- early in history, apparently alone in the visible universe -- to conclusions about how long civilizations last. If you accept one line of reasoning, are you committed to the other? Which assumptions do they share, and which one would you reject to block both?"
