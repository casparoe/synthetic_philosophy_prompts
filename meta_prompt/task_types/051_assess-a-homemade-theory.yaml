type: "Present a coined concept or homemade theory and ask for an honest assessment"
notes: |
     The asker has invented something -- a term, a distinction, a small theory, a taxonomy, a principle -- and presents it in their own words, sometimes clumsily and with more conviction than polish. They want to know whether it is coherent, whether it already exists under another name, what it gets right, and where it breaks. Give the construct enough detail (its definitions, its central claim, an example or two) for the response to grip, and make it neither obviously silly nor obviously correct. A good answer is charitable but candid: it reconstructs the idea in its strongest form, names the nearest existing ideas, and says exactly where the proposal fails or stops being distinctive.
examples:
  - "I've been calling something 'consent debt': every time a system quietly changes how it works and people keep using it, they accrue a debt of un-given consent, and the interest on it is the growing gap between what they would agree to if asked and what they are in fact living under. Terms of service, defaults, relationships, governments. I think it explains why people feel wronged by changes they never objected to. Is this a real concept or just a metaphor? Has someone already worked this out under another name? And where does it break -- what does it wrongly count as a wrong?"
  - "Here is my theory of humor, worked out over a few years: a joke is a proof whose conclusion the listener wanted to be false. The setup fixes the axioms, the punchline is a valid derivation, and laughter is the relief of finding that the unwanted conclusion was harmless after all. I know about incongruity theory. Is mine a version of it, or something else? Give me the funniest joke you know that my theory can't handle, and the least funny thing it would predict is hilarious."
  - "i have a distinction i keep using and want checked. 'thin agreement' is when two people agree on a sentence, 'thick agreement' is when they would also agree on what would count as being wrong about it. most political agreement is thin. i think most philosophical disagreement is actually thick agreement about the standards plus thin disagreement about the sentence. is this already a thing in the literature (it feels too obvious not to be)? and is the second claim actually true or just nice?"
  - "I've formulated what I call the Principle of Deferred Existence: something exists at a time t if and only if there is some later time at which it makes a difference. Nothing that never makes a difference exists, even 'now'. It handles Berkeley's unperceived tree, makes the future real in a modest sense, and dissolves some worries about abstract objects. I am aware it sounds crazy. Tell me the three strongest objections and whether any of them is fatal rather than just uncomfortable."
