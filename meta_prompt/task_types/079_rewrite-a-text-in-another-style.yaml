type: "Give a text and ask for it to be rewritten in a different style, keeping what it says"
notes: |
     The asker supplies a text in full and wants it rewritten in a different style with its content unchanged: the change of style is the whole job. The original may be speech or rough notes to be made into finished writing (a transcribed voice memo or dictation, a chat thread, hasty notes), writing that must work when spoken aloud, a text wanted in another register (academic prose made conversational, or the reverse) or another genre, or a text to be put into the manner of a period or a particular writer. The asker describes the target style or supplies a sample of it to match, says what the rewrite is for, and may set its length and say what must survive and what may go. Write the original convincingly in its own style -- a transcript has the false starts, fillers, self-corrections, and mishearings of speech -- or use a real text, quoted accurately, and give it content worth keeping: a real line of thought on a topic from the domain, with claims held at different strengths. A good answer gives the rewrite, and it reads as if it had been written in the new style from the start, not as the old text with its words swapped. It keeps the content, except what the asker says may go: every claim, example, and step of argument, each held as firmly as before, so that a hunch stays a hunch in academic prose and a qualification survives in casual speech. It adds no claims, arguments, sources, or data; where the new style expects something the original lacks, such as references or definitions, it marks the gap instead of filling it. It uses a technical term for something the original says loosely only if the term fits what was meant, since a term of art can bring commitments the author never made. It drops what belonged only to the old style (fillers, repetitions, asides, sarcasm) without dropping content with it, says where the original is unclear (a half-remembered name, a self-correction that settles nothing) rather than silently choosing a reading, and points out errors in the original instead of quietly fixing them. After the rewrite, unless the asker wants the text alone, a short note says what was cut or moved, where the new style forced a decision the original left open, and what could not be carried over. This differs from the rewrite-for-a-purpose type (there the original falls short, of clarity or of a reader's needs, and the rewrite fixes it; here it may be fine where it is), the restatement type (a position carried into another framework's vocabulary), and the satire type (a style imitated for comic or critical effect).
examples:
  - "ok so I do my best thinking out loud on walks, and my phone transcribed this one. can you rewrite it in an academic style, as the first couple of paragraphs of a paper I might actually send to a journal? keep what I think and how sure I am of each bit (not very, mostly). no references, just put [REF] where one should go.\n\n\"okay recording. um so the thing I keep coming back to is gratitude. like why am I grateful to the nurse who sat with my dad that night, she was paid, it was her shift, she'd have done it for anyone. and the standard line, I forget whose, maybe it's just everyone's, is that gratitude is for a benefit someone gives you out of goodwill, more than they owe you. which says my gratitude to her is a mistake. but it isn't. no wait, say it better. it's not that gratitude feels fitting, it's that if I didn't feel it that would be the defect, there'd be something wrong with me. so maybe gratitude isn't tracking going beyond duty at all. maybe it's tracking, um, being on the receiving end of someone's care when you couldn't do anything for yourself. dependence. yeah I think it's dependence. [inaudible] sorry, dog. anyway if that's right you get a weird result, which is you'd owe gratitude to institutions, like to the hospital itself, and I honestly don't know about that, maybe that's the reductio, I don't know. oh and the flip side, the super rogatory stuff people do for you that you didn't need, like a waiter who sings at you, you don't owe much there. okay. stop.\""
  - "I'm giving a twenty-minute talk at a workshop on AI and epistemology, and the two minutes after my introduction have to carry the section of my paper pasted below. Read aloud, it doesn't work: the principle is a single sentence nobody could follow by ear, there are parentheses, and the footnote does real work. Please rewrite it as a script to be spoken at about 130 words a minute, so 250 to 300 words. Keep the argument, both examples, and every qualification, the footnote's included, but write it for the ear: shorter sentences, signposts, the principle given once in full and once in plainer words, nothing that depends on seeing the page. Don't make it chattier than I am. Mark where the slide should change, and tell me if anything in the section can't survive being heard rather than read.\n\n2. The deference principle\n\nThe question, then, is not whether one should ever defer to a more reliable source (plainly one should) but under what conditions a source's superior track record gives one reason to set aside one's own verdict. I propose the following:\n\n(DP) If S has adequate evidence that R's verdicts on questions of type T are more reliable than S's own, and q is of type T, then S's credence in q should move toward R's verdict on q, to a degree proportional to the strength of that evidence, unless S has evidence bearing on q that S has reason to believe R lacks.\n\nTwo features of (DP) deserve comment. First, it is comparative: what matters is not R's absolute reliability but its reliability relative to S's, which is why a mediocre forecasting model can rationally move a worse forecaster and leave a better one where she was. Second, the 'unless' clause is no escape hatch for the stubborn: the evidence it mentions must be evidence R lacks, not evidence S merely weighs differently.[1] A chess player who overrides an engine because she 'sees' a sacrifice the engine dismisses does not satisfy the clause; a doctor who overrides a triage model because she knows something about the patient that never entered the record does.\n\n[1] This leaves open how S could know what R lacks when R is opaque, which is the situation with current AI systems; I return to this in Section 4, and (DP) as stated may be idle there."
  - "can you rewrite this so it's calm and formal enough to send to the head of school with the board cc'd? I wrote it at midnight and it shows. but I'm not backing down on anything: every point stays, and so does what I'm asking for, just without the sarcasm.\n\n\"Mr Hale, so apparently my daughter is a plagiarist now because she ran her history essay through a grammar checker. Congratulations on the new AI policy, clearly written by someone who has never opened a laptop. Plagiarism means passing off someone else's work as your own. A grammar checker isn't someone. If it is, then so is spellcheck, so is a thesaurus, and so am I when I tell her a sentence is clunky, and I assume my zero is in the post. Your policy says 'any use of AI tools' and never says what counts as AI, which covers everything with autocorrect in it, so either you enforce it on everyone or on whoever you feel like, and we both know which. Oh, and she handed the essay in on the 3rd and the policy went up on the website on the 10th, so she broke a rule that didn't exist yet. I want the zero removed, and I want the policy rewritten so a fifteen-year-old can tell what she's allowed to do before she does it, not after. Dana Ruiz\""
  - "I'm writing a novel set in Edinburgh in 1791. At its midpoint the heroine, a widow of about forty who has read more philosophy than her family suspects, writes to her younger brother to talk him out of a duel. I drafted the letter in modern English to get the argument right, and now I need it as she would have written it: the forms of address, phrasing, and rhythm of an educated Scottish woman's letter of the 1790s, without parody, and no more pious than she is in my draft (she has read Hume and goes to church for her mother's sake). Keep every argument, in the same order. Some of what she says depends on words or ideas she couldn't have had in 1791. Don't just swap in period vocabulary; after the letter, tell me where that happened, what she says instead, and whether the idea itself was open to her even if the words weren't.\n\n\"Jamie, I know you think you have to go through with this, and I know you think I can't understand because I'm a woman. Hear me out anyway. Your honour is what you deserve to be thought of, not what Lennox's friends think of you, and a duel can only change the second. It doesn't even settle who was right: the better shot wins, so it's a coin toss with extra steps. The custom only survives because every man is scared to be the first to say no. It's peer pressure dressed up as a code, and if a few respectable men refused, it would collapse within a year. You'd be risking your life to keep alive a rule you don't even believe in. And if you die, it isn't you who pays, it's Margaret and the girls. I'm not asking you to grovel to him. Tell him you think the whole business is beneath you both, and let anyone who calls you a coward say it to my face.\""
  - "I posted this on our marque club's forum last month and it got more replies than anything I've ever written, so the committee has asked me to put it in as a formal submission to the review of the concours rules, which currently don't define 'original' at all. The submission has to look like the others: numbered paragraphs, defined terms, no chattiness. Please rewrite my post in that form. Every argument stays, and so do my doubts (I really am unsure about the last part); the jokes and the swipe at Gordon go. Where the formal version needs a definition I never gave, don't invent one, mark the gap so I can fill it.\n\n\"Ok so this 'original car' row keeps coming up, so here's my two cents. IMO originality isn't about how many parts are factory. Every car on this forum has had brakes, tyres, hoses done, that's not the question. Numbers-matching is a decent rule of thumb but it's a proxy, and it gets gamed (we all know whose 'survivor' had its block re-stamped, no names, Gordon). What actually matters is continuity: was it the same car the whole way, repaired bit by bit, never torn down to nothing and rebuilt? A frame-off resto with 60% new metal can still be original on that test, and a car with every factory bolt that was built up from a crate of parts in 2009 isn't. Where I get stuck: say someone kept all the rusty panels they cut off my car and built them into a second car. Which one's the original? I'd say mine, because of continuity, but then I'm not sure what I'd say if his had more of the factory metal. Haven't got an answer to that. Anyway, my wife reckons I'm the only original part left in our garage.\""
  - "My flatmate's line in an argument last night was 'if you can't tell a copy from the original then there's no difference, end of story.' I want to put her view in my aesthetics essay, credited to her, as one sentence of academic prose. Don't make it say more than she did, and then tell me what you had to decide that she didn't."
