type: "Name a theory, or a family of theories, and a verdict or conviction it seems to reject, and ask how the theory could deliver it after all"
notes: |
     The asker names a theory -- a decision theory, a normative ethical theory, a theory of knowledge, mind, meaning, or punishment, a political or religious doctrine -- or a family of theories, leaving open which member to use, together with a verdict on a case, a widely shared conviction, or a practice that the theory is usually taken to reject or to leave no room for. They ask for an account of it from inside the theory: an argument that starts from the theory's own commitments and ends at the verdict, or that shows where in the theory the conviction fits. The mismatch can be a famous objection to the theory or a small one the asker has noticed. Purposes vary: the asker holds the theory and does not want to give up the verdict; a critic has said the theory cannot deliver it; they want to know whether a standard objection is decisive; they are writing the theory's reply for a paper, a debate, or a class; they are curious how flexible the theory is. They may set terms: no premise the theory's defenders would reject, a named version, or the most promising member of the family, chosen and defended. The prompt makes the tension clear without supplying the answer, though the asker may mention a route they have heard of and ask whether there is a better one. A good answer does the constructive work in earnest instead of explaining why it cannot be done. It first says exactly why the theory seems not to deliver the verdict, then lays out the routes by which it might -- an auxiliary assumption, a reading of the theory's central terms, the agent's uncertainty about their situation, an indirect or two-level structure, a choice among versions, a weaker reading of the verdict -- and works the best one out in full. Then it tests the result: does the theory now deliver the verdict for its own reasons, or has it borrowed a rival's premises and become the rival under the old name; does it get the target case right only by getting nearby cases wrong; is the move principled, or a patch made for this one case? It ends with an honest verdict: the theory accommodates the verdict naturally, only at a cost the answer names, or not at all without ceasing to be itself. This differs from the theory-versus-intuition type (which side should yield), the devil's-advocate type (the best case for a view the asker thinks false), and the restatement type (a translation into another vocabulary): here the theory is held fixed, and the deliverable is its best route to the verdict.
examples:
  - "Our decision theory reading group has spent three weeks on Newcomb's problem, and the split never moves: the causal decision theorists two-box, everyone else one-boxes, and both sides repeat themselves. Next week I want to try something different. Give the best account of one-boxing that a causal decision theorist could accept -- not evidential decision theory or a policy-based theory under a new name, but an argument that runs on causal expected utility from premises a CDT defender would grant. I've heard there's a version where you're unsure whether you're the predictor's simulation. Is that the best route, or is there a better one? Work out whichever is strongest, say what else it commits CDT to, and tell me whether a committed two-boxer should call it a fair reconstruction or a trick."
  - "I teach intro ethics, and every year students leave thinking deontologists don't care about outcomes, which makes the view look absurd: as if a Kantian should be indifferent between a policy that saves a thousand lives and one that saves ten, so long as nobody's rights are violated either way. I want a two-page handout showing how a deontological theory can make consequences matter -- not as a grudging tie-breaker, but for reasons of its own. Pick whichever deontological system does this best (Kant's own, a pluralist list of duties, contractualism, or something else), say why you picked it, and show exactly where outcomes enter. Then say plainly what it still can't say that a consequentialist can, so the handout doesn't oversell."
  - "ok so im a pretty committed libertarian. self-ownership, you own what you make or get through voluntary exchange, taxing earnings is at best a necessary evil. but i realized im weirdly fine with a really high inheritance tax and my brother says that makes me a hypocrite. is there a libertarian argument for it? one that actually starts from self-ownership and voluntary transfer and doesnt just sneak in egalitarian premises. if the only ways to get there change what the view is, tell me that too"
  - "I'm a biostatistician and a Bayesian, and I'm writing a methods note for my group on why we preregister analyses. A colleague objects that for a Bayesian the timing of a hypothesis can't matter: the likelihood of the data under the hypothesis is the same whether you predicted the data or fitted the hypothesis to them afterwards, so preregistration is ritual. I still trust predicted results more, and so does every reviewer I know. Give me the best account of why prediction should count for more than accommodation using nothing but priors, likelihoods, and conditionalization -- no appeal to scientific virtue. Then tell me whether that account supports preregistration as such or only something weaker, because the note has to survive this colleague."
  - "I staff a state sentencing commission that is redrafting its guidelines. The commission's stated philosophy is retributive: punishment should be proportionate to the offender's culpability. Our guidelines punish attempted murder well below murder, and one commissioner has pointed out that the would-be killer whose gun jammed is exactly as culpable as the one whose gun didn't. Either we drop the discount, she says, or we admit we aren't really retributivists. Before the commission votes, I need the best retributivist case for punishing completed crimes more severely than failed attempts -- one the commission could put in a public report without embarrassment. If no version holds up, say which comes closest and what it gives away."
  - "I'm in a seminary ethics course, and I hold a divine command theory: what makes an act wrong is that God forbids it. My professor keeps pressing the obvious objection. If God had commanded us to torture children for fun, torturing them would have been obligatory, and I don't believe that. I don't want to give up the theory, and I don't want to just say 'God would never command that' without a reason that comes from inside the theory. What is the best account a divine command theorist can give of why such a command is impossible, or why it would not make the torture obligatory if it were somehow given? And does that account quietly make God's goodness prior to God's commands, so that I've given up the theory after all?"
