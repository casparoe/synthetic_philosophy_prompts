type: "Set up a role-play and make the opening move"
notes: |
     The asker wants a conversation partner rather than a document: the model is to take a role -- a committed proponent of some view, a historical figure speaking for themselves, a Socratic tutor who may only ask questions, a skeptical referee, a patient explainer for a specific audience -- and hold it across turns. Since the dataset contains single prompts, the prompt must make the first reply well defined: specify the role and its constraints (what the character believes, what they will and won't concede, how they talk, whether they may break character), and include the asker's own opening move -- a claim, a question, a challenge -- so the model's first turn is a response in character rather than a request for clarification. Give the character a real position with real resources, not a caricature, and set up a genuine contest: the opening should be a move the character actually has to deal with. Prefer historical figures or unnamed proponents over living people. Variants: the asker may ask the model to play the asker's own position back at them so they can practice objecting, or to play a tutor who is not allowed to state the answer. This differs from the dialogue type (a finished two-character text) and from the historical-figure type (a prediction of someone's views in the model's own voice): here the model speaks in the first person as one side of a live exchange.
examples:
  - "I want to practice defending evidential decision theory against a smart opponent. Please play a committed causal decision theorist -- sharp, not a strawman, willing to concede small points but never the main one -- and stay in character until I say 'stop'. Keep your replies to a paragraph so it feels like a conversation. Here's my opening: in Newcomb's problem you two-boxers keep insisting the money is already there or it isn't, but your own theory tells you to expect to walk away with a thousand dollars. Doesn't a theory of rational choice that you yourself expect to make you poorer have a problem?"
  - "Play Leibniz. You have just been given a careful description of how a modern large language model works -- weights, training on text, next-token prediction -- and you may use only the concepts available to you in 1714 plus what I have just told you. I am going to ask you whether such a machine could have perceptions in your sense. Stay in character; if you need a factual question answered about the machine, ask it as Leibniz would. My first question: your mill argument says that if we walked into a mill enlarged to the size of a building we would see only parts pushing one another, never a perception. Suppose we walk into this machine instead. What do we see, and what follows?"
  - "be a socratic tutor for me on the problem of induction. rules: you can only ask questions, one at a time, never tell me the answer or name a philosopher unless I do first, and each question has to build on my last answer. if I get confused, ask a simpler question, don't explain. my starting position: I think induction is justified because it's worked so far. go."
