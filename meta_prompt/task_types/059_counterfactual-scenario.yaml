type: "Pose a counterfactual scenario and ask for a reasoned prediction of how it plays out"
notes: |
     The asker specifies a counterfactual -- a historical divergence, a hypothetical intervention, a world with one law of nature or social fact changed -- and asks for an argued prediction of what would follow: not a story, but a chain of reasoning about mechanisms, incentives, and constraints, with explicit confidence about each link. There is no dataset to consult and no reference class, so the answer has to be built from general knowledge of how people, institutions, and physical systems behave. Make the scenario precise (when, where, what exactly changes) and ask for the reasoning to be visible: which effects are robust, which are guesses, and what would have to hold for the prediction to be wrong.
examples:
  - "Suppose the printing press had been invented in 1050 rather than 1450, everything else the same. Give me your best prediction of how the next two centuries of European intellectual history differ. I want the chain of reasoning: which effects of printing depended on conditions present in 1450 but absent in 1050 (literacy, paper, universities, a merchant class), and which were intrinsic to the technology."
  - "Imagine that, starting tomorrow, every adult can perfectly detect when they are being lied to, but not when they are being misled by true statements. Nothing else changes. Predict what happens to politics, advertising, and ordinary friendships over ten years. Which predictions are you most confident of and why, and which depend on assumptions about how fast people adapt?"
  - "Counterfactual: the Roman Empire develops a working steam engine around 100 AD, at roughly the sophistication of Newcomen's. Does an industrial revolution follow within a few generations, or not? I'm less interested in your yes or no than in the argument: which of the preconditions historians think mattered in eighteenth-century Britain -- cheap coal near markets, expensive labour, secure property, a scientific culture, a market for cotton -- were present, and how much does each matter?"
  - "Suppose a country adopted a constitutional rule that no law may remain in force for more than twenty years without being re-enacted from scratch. Predict, with reasoning, how its legal system looks after fifty years: what kinds of law get re-enacted, what quietly lapses, how legislatures and courts adapt, and whether the rule achieves what its designers presumably wanted."
