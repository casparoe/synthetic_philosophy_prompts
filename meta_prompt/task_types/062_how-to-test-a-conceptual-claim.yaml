type: "Ask how one could test a conceptual claim, and what the test would and would not settle"
notes: |
     The asker states a claim that looks conceptual -- about understanding, consciousness, agency, meaning, moral progress, whether a system really represents something -- and asks how one could bring evidence to bear on it: what experiment, observation, or measurement would count, what result would count for and against, and what residue no test can reach. The interesting cases are ones where a test is partly possible: one can operationalize part of the claim and should be clear about what the operationalization leaves out. The response should design the test concretely and then say exactly what a positive result would and would not show.
examples:
  - "When I ask a language model what the square root of meat is, every sample I draw says, in different words, that the question is nonsense. Is it fair to conclude that the model has something like an internal representation of 'this is nonsense'? Design the best test you can of that claim, say what result would convince you either way, and say what the test could never settle even in principle."
  - "A colleague claims that moral progress is real: that our moral views today are not merely different from those of 1700 but better. I think that is either trivially true by our own lights or untestable. Is there any observation that would bear on it -- convergence across independent traditions, say, or the direction of change when people learn more facts? Set out the strongest test and be honest about what it leaves untouched."
  - "How would one test whether a dog has a concept of fairness rather than merely an aversion to getting less than another dog? I want an experimental design, the result that would favour each reading, and an account of why the two readings are hard to separate -- is it a limit of the experiments or a defect in the notion of having a concept?"
  - "People say that a market knows things no participant knows. Is that a metaphor or a testable claim? Propose a test that would distinguish genuine aggregation of dispersed knowledge from mere averaging of guesses, say what result would count, and say whether 'knows' survives even a positive result or whether we should just say 'aggregates'."
  - "My friend is arguing that over time models have become more and more aligned. I tend to think of most of the examples he points to as examples of increased competence. For instance, the Sydney / Bing Chat thing was arguably just a case of a model going off-the-rails in a way that's symptomatic of these models being somewhat generically fragile or whatever. It seems like quite a thorny issue, though. How might we be able to test whether models are becoming more aligned as they also happen to become more competent?"