type: "Quote two passages that seem to conflict and ask whether they can be reconciled"
notes: |
     The asker quotes or closely paraphrases two passages -- from one author, one text, one tradition, or one institution -- that appear to contradict each other, and asks whether they can be reconciled and at what cost: Kant on lying in the Groundwork and in the essay on a supposed right to lie, Hume on the self in the Treatise and in its Appendix, two verses of a scripture, two rulings of a court, two clauses of one code of conduct. Say where each passage comes from and ask for the candidate reconciliations (different senses of a term, different contexts, a change of mind, a distinction the author never drew explicitly) and a verdict on which is honest and which is special pleading. Real passages must be quoted accurately or paraphrased without quotation marks.
examples:
  - "In the Treatise Hume says that when he looks into himself he never finds a self, only particular perceptions, and that the mind is a bundle of them. In the Appendix he says he finds his account of personal identity defective and cannot make the perceptions cohere. Are these actually in tension, or is the Appendix worry consistent with the bundle view? What exactly did he think had gone wrong, and is there a reading on which nothing had?"
  - "Mill says in On Liberty that the only purpose for which power can rightfully be exercised over a member of a community against his will is to prevent harm to others. In Utilitarianism he says actions are right in proportion as they tend to promote happiness. A paternalistic law that clearly raises total happiness seems forbidden by the first and required by the second. Can the two be reconciled without making one of them a mere rule of thumb? If they can't, which one did Mill actually hold?"
  - "Our university's code of conduct says both that academic freedom protects the expression of any view in teaching and research, and that members must not create an environment a reasonable person would find hostile on the basis of religion. A lecturer argues in class that a particular religion's central doctrine is false and its founder a fraud. Do the two clauses conflict in this case? Give the readings on which they don't, and say whether any of them is a reading the drafters could honestly have intended."
  - "Nietzsche says in the Genealogy that the slave revolt in morality begins when ressentiment becomes creative and gives birth to values, and treats this as a calamity; in the same book he says it is what first made the human being an interesting animal. Is he contradicting himself, describing a tragic trade-off, or shifting between evaluative standpoints? Which reading requires the least special pleading?"
