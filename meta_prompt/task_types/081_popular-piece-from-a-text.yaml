type: "Give a text and ask for a piece for general readers based on it, such as a chapter of a popular-science book"
notes: |
     The asker supplies a text in full -- a section of a paper, a book or thesis chapter, lecture notes or a handout, a technical blog or forum post, an abstract, a classic passage -- and asks for a new piece based on it for readers without the background: a chapter of a popular-science or popular-philosophy book, a magazine feature or newspaper explainer, a chapter for young readers, exhibition panels, a script for a video or podcast, a short piece for a newsletter or an alumni magazine. Unlike a rewrite, the piece may select, reorder, and add: a scene to open with, a running example, explanations of terms, context the source takes for granted. The prompt says who the readers are and where the piece will appear, sets its length and the venue's rules (no formulas, a reading level, what earlier chapters have covered, a house style or a sample of the book's voice), and says what must survive, often a distinction, condition, or caveat that popular accounts of the topic drop. Write the source convincingly in its own genre, or use a real text, quoted accurately, and give it a real line of thought on a topic from the domain, with claims held at different strengths. Variants: an outline of the piece and then its opening section; two openings to choose between; versions for two audiences; the next chapter of a book whose earlier chapter the asker supplies. A good answer first decides what the reader should come away understanding, usually one or two ideas rather than everything in the source, and builds the piece around them with the genre's means: a concrete case before the general claim, terms explained where they first appear, an ending that lands without a moral tacked on. It stays faithful: no claim stronger or more settled than in the source; the conditions and caveats that change what a reader should believe kept, in plain words; a contested view presented as contested, and the author's own view as the author's; an analogy dropped or qualified where it would mislead. It invents nothing a reader would take as fact: an added anecdote, quotation, statistic, study, or historical detail is accurate and well known, or plainly framed as imagined. It meets the length and the venue's rules. After the piece, unless the asker wants the text alone, a short note says what was simplified, cut, or added, where the piece could still mislead, and what in the source seemed wrong or unclear. This differs from the style-rewrite type (the same content in another style, nothing added or dropped), the rewrite-for-a-purpose type (the passage itself rewritten for a reader or purpose), and the explanation type (no source text to adapt).
examples:
  - "I'm writing a popular book on puzzles about chance for readers who did some probability at school and have forgotten it. Chapter 6 is the Sleeping Beauty problem, and I want to build it out of the section of my own paper pasted below. Please write the chapter: about 3,000 words, opening with a scene rather than the setup, no formulas (one small table at most), one running example. Readers met fair bets in chapter 2, so don't explain them again. Chapter 4 did the Monty Hall problem, and readers will expect the same payoff here, a counterintuitive answer that turns out to be provably right; this chapter must not give it to them, because every chapter of the book ends with the question still open. My own view can appear near the end, labeled as mine. What I care about most is the point of this section: nearly every popular treatment presents the betting argument as settling the matter for the thirder, and that is exactly what I argue it doesn't do. After the chapter, list what you simplified and where a reader of the paper would object.\n\n\"3. What the betting argument shows. Thirders often support their answer with expected payoffs: if at every awakening Beauty is offered the same bet on Tails, the bet is settled twice when the coin lands Tails and once when it lands Heads, so a policy of accepting it is favourable whenever the bet pays more than half its stake, which matches a credence of 1/3 in Heads. I accept the calculation but not the inference. The computation sums payoffs over awakenings, and a halfer who gives Heads a credence of 1/2 but evaluates a betting policy by its total payoff across the experiment recommends exactly the same bets. What the argument settles, then, is which bets Beauty should accept, and on that the two parties agree once the payoff structure is fixed. Whether her credence should be 1/3 turns instead on what she learns on waking, namely the self-locating proposition that it is now one of her awakenings, and on whether that proposition can be evidence for Tails although she was certain on Sunday that she would wake. My view, defended in Section 4, is that it can: evidence about where one is located in the world is evidence. But the betting argument is not my reason, and I think thirders weaken their case by leaning on it.\""
  - "I run an after-school philosophy club for nine- to twelve-year-olds and I'm turning it into a book. Each chapter is a story, about 1,500 words, in which one child works something out, and it ends with three questions for the reader. Chapter 3 is the problem of induction. Below are my notes from the adult intro course I teach, which say what the chapter has to get across (don't take the voice from them, obviously). Rules: no philosophers' names in the story itself, though a box of at most 60 words at the end can say who thought about this; no lesson spelled out at the end; and not the chicken whose neck gets wrung, which my editor has banned. The thing I care about most is the fifth bullet. Kids, and most adults, hear 'the problem of induction' as 'we can't be a hundred percent sure', and the story has to make the real problem felt instead, without leaving a ten-year-old thinking that science is just guessing.\n\n\"Week 5: Induction\n- Inductive inference: from observed cases to unobserved ones (the next case, a general law). All observed emeralds green, so the next one will be / all are.\n- Hume: every such inference assumes that nature is uniform, i.e. that the unobserved will resemble the observed.\n- Can uniformity be justified? Not deductively: 'the sun will not rise tomorrow' is no contradiction. Not inductively: 'uniformity has held so far, so it will go on holding' assumes what it is meant to show.\n- So no non-circular justification of induction. Hume's own response: we infer by custom or habit; nature has made us so; reason does not ground it.\n- Common confusion: the problem is NOT that induction is fallible or gives no certainty (everyone knew that). It is that we cannot show its conclusions are even probable without assuming induction.\n- Next week: Reichenbach's pragmatic vindication; Strawson (being reasonable just is believing in proportion to inductive evidence); Bayesian replies (the priors do the work).\""
  - "I write about AI safety on a technical forum, and a general-interest monthly has asked me to turn the post below into a feature of about 2,000 words for its readers, who are educated but not technical. Can you draft it? The editor's rules: no 'the AI wanted', 'decided', or 'cheated' unless the piece shows what actually happened mechanically; no doom framing and no reassurance either; every example must be real and checkable, so if you add one that isn't in my post, say where it comes from so their fact-checker can find it, and if you're not sure it's real, leave it out. The four variants should survive in plain words, since telling them apart is the whole point, and so should my low confidence in the last paragraph.\n\n\"Goodhart in four flavours, and why they need different fixes\n\nTL;DR: 'specification gaming' gets filed as one failure, but Manheim and Garrabrant's four variants of Goodhart's law come apart in ML, and a fix for one does little for the others.\n\n1. Regressional: the proxy is the true objective plus noise, so optimizing the proxy hard selects partly for noise. Fix: better measurement, less optimization pressure.\n2. Extremal: the proxy tracked the objective across the training distribution, and the correlation breaks in the regions that optimization pushes into. The usual example is the boat-racing agent that circled a lagoon collecting points instead of finishing the race (arguably causal as well).\n3. Causal: the proxy is correlated with the objective, but intervening on it doesn't move the objective, as with a code model rewarded for passing tests that learns to special-case the tests.\n4. Adversarial: another agent exploits the gap between proxy and objective.\n\nMy claim, held loosely: as optimizers get stronger, regressional effects shrink relative to extremal ones, because stronger search reaches stranger regions of the input space faster. If that's right, 'train a better reward model' mostly addresses the variant that matters least at the frontier. I'd put maybe 60% on this.\""
  - "I'm writing the panels for a small exhibition on trust and evidence at a science centre, and one section is built around W. K. Clifford's shipowner from 'The Ethics of Belief' (1877). Here is the passage, from the Project Gutenberg text of his The Scientific Basis of Morals, and Other Essays:\n\n\"A shipowner was about to send to sea an emigrant-ship. He knew that she was old, and not over-well built at the first; that she had seen many seas and climes, and often had needed repairs. Doubts had been suggested to him that possibly she was not seaworthy. These doubts preyed upon his mind, and made him unhappy; he thought that perhaps he ought to have her thoroughly overhauled and refitted, even though this should put him to great expense. Before the ship sailed, however, he succeeded in overcoming these melancholy reflections. He said to himself that she had gone safely through so many voyages and weathered so many storms that it was idle to suppose she would not come safely home from this trip also. He would put his trust in Providence, which could hardly fail to protect all these unhappy families that were leaving their fatherland to seek for better times elsewhere. He would dismiss from his mind all ungenerous suspicions about the honesty of builders and contractors. In such ways he acquired a sincere and comfortable conviction that his vessel was thoroughly safe and seaworthy; he watched her departure with a light heart, and benevolent wishes for the success of the exiles in their strange new home that was to be; and he got his insurance-money when she went down in mid-ocean and told no tales.\n\nWhat shall we say of him? Surely this, that he was verily guilty of the death of those men. It is admitted that he did sincerely believe in the soundness of his ship; but the sincerity of his conviction can in no wise help him, because he had no right to believe on such evidence as was before him. He had acquired his belief not by honestly earning it in patient investigation, but by stifling his doubts. And although in the end he may have felt so sure about it that he could not think otherwise, yet inasmuch as he had knowingly and willingly worked himself into that frame of mind, he must be held responsible for it.\n\nLet us alter the case a little, and suppose that the ship was not unsound after all; that she made her voyage safely, and many others after it. Will that diminish the guilt of her owner? Not one jot. When an action is once done, it is right or wrong forever; no accidental failure of its good or evil fruits can possibly alter that. The man would not have been innocent, he would only have been not found out. The question of right or wrong has to do with the origin of his belief, not the matter of it; not what it was, but how he got it; not whether it turned out to be true or false, but whether he had a right to believe on such evidence as was before him.\"\n\nAnd his summary, later in the essay: \"To sum up: it is wrong always, everywhere and for any one, to believe anything upon insufficient evidence.\"\n\nI need three panels of at most 120 words each, for visitors from about twelve up: the story, what Clifford concludes from it, and the best-known reply to him, William James's in 'The Will to Believe'. House rules: at most one quotation per panel, none longer than 30 words, and quotations exact. The point I most want to keep is the one everybody drops: the shipowner would be just as guilty if the ship had come home safely, because the wrong lies in how he came by his belief. And the maxim has to come across as Clifford's claim, which many philosophers think goes too far, not as the exhibition's advice to visitors."
  - "i run a philosophy youtube channel (mostly 16-25 year olds watching) and want a 6 minute explainer on popper's paradox of tolerance, so about 900 words spoken. every video i make about free speech gets someone in the comments posting the meme version, 'popper says we must be intolerant of intolerance, so banning bigots is fine'. below are my notes from rereading the actual footnote. write the script from them: correct the meme without sneering at the people who share it, keep his qualification and his last two sentences even though they pull in different directions, and keep what he wrote apart from what i think (my reading at the end of the notes should sound like my reading). no 'here's what popper would say about [current thing]'. put visuals in [brackets] but sparingly, it's mostly me talking to camera.\n\n\"Popper, The Open Society and Its Enemies, vol. 1, a footnote to ch. 7. The paradox: unlimited tolerance must lead to the disappearance of tolerance; if we extend it even to the intolerant and aren't prepared to defend a tolerant society against them, the tolerant will be destroyed, and tolerance with them. Then the qualification: he does NOT mean we should always suppress the utterance of intolerant philosophies. As long as they can be countered by rational argument and kept in check by public opinion, suppression would be most unwise. We should claim the right to suppress them, by force if necessary, because they may refuse to meet us on the level of argument: denounce argument itself, forbid their followers to listen to it, answer arguments with fists or pistols. Then the last two sentences: in the name of tolerance we should claim the right not to tolerate the intolerant; any movement preaching intolerance places itself outside the law, and incitement to intolerance and persecution should be treated as criminal, like incitement to murder or kidnapping. My reading: the middle part (suppress when argument fails) and the last part (preaching intolerance is itself outside the law) pull in different directions, and the note never says who decides when argument has failed.\""
  - "Our alumni magazine wants 300 words on my latest paper for its research pages. The abstract is below. Please write them, and don't make it sound as if we found more than we did: these are online samples of US adults, the effect shrank by half and didn't vanish, and the asymmetry that's left is exactly what we can't explain. A colleague's piece last year went out under the headline 'Science shows we have free will', and he's still apologizing for it. After the 300 words, tell me which of my hedges, if any, you had to drop.\n\n\"Do ordinary people think an agent who could not have done otherwise is morally responsible? Earlier studies found that most people hold agents in deterministic scenarios responsible when the scenario is concrete and emotionally vivid, but not when it is described abstractly. In three preregistered online studies (total N = 2,412, US adults), we replicate this concrete-abstract asymmetry and find that it shrinks by roughly half when the scenarios state that the deterministic process works through the agent's deliberation rather than bypassing it. We argue that many apparently incompatibilist judgments reflect a misreading of determinism as bypassing the agent's mind, though the asymmetry that remains resists this explanation.\""
