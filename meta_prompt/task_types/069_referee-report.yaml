type: "Provide a section of a paper or draft article and ask for a referee report"
notes: |
     The asker includes a section of a paper -- their own draft, a submission they are refereeing, a preprint a colleague sent -- reproduced in full: 800 to 1,500 words with the apparatus a draft has (a stated thesis, numbered claims or cases, a reply to an anticipated objection), written in the paper's own register and set off from the asker's framing, with the request after it. The deliverable is a referee report: a verdict (accept, minor revisions, major revisions, reject) with the numbered comments that justify it, separating the objections that are fatal from those the authors could fix, and saying what revision or result would change the verdict. Give the section one or two real weaknesses a careful referee would find -- a premise that carries the argument but is only asserted, a term that changes meaning between the setup and the conclusion, a case that does not do the work claimed for it, a reply that answers a weaker objection than the one raised -- and don't let the asker signal where they lie or what verdict they expect. The asker may specify the venue, the reviewing norms, and the length of the report. This differs from the essay-comments type (an informal piece and comments on it) in the deliverable, a report with a verdict written for an editor as much as for the author, and from the grading type in that there is no marking scheme and the author is a peer. The examples show the shape; a real prompt's section should be at least as long as theirs.
examples:
  - "I am one of two referees for a formal epistemology workshop and would like an independent read of the section that carries the paper's main claim before I write my own report. The section follows verbatim, with only the authors' self-citations removed. Please write a referee report for the organisers: a verdict (accept, accept with minor revisions, major revisions, reject) and the numbered comments that justify it, separating objections that are fatal from ones the authors could fix, and ending with what result or revision would move you to a different verdict. The workshop asks for reports of around 600 words.\n\n---\n\n3. Disagreement as an evidential gap\n\n3.1 The convergence result. Let two agents hold prior probability functions P and Q over a common algebra of events, and let both update by conditionalization on the same sequence of observations E_1, E_2, .... The classical theorems (Blackwell and Dubins 1962; Gaifman and Snir 1982) show that if P and Q assign probability zero to the same events, their conditional probabilities converge as the observations accumulate: for any event A, the difference |P(A | E_1, ..., E_n) - Q(A | E_1, ..., E_n)| tends to zero with probability one.\n\n3.2 The rationality constraint. A rational agent is one whose credences are probabilistically coherent and who updates by conditionalization. Nothing more is required: coherence exhausts the synchronic constraint and conditionalization the diachronic one. Any two rational agents therefore fall under the convergence result.\n\n3.3 The thesis. Putting 3.1 and 3.2 together: rational agents who share their evidence converge in opinion. Persistent disagreement between two agents is therefore a symptom of exactly one of two conditions: the agents do not in fact share their evidence, or at least one of them is irrational. There is no third possibility, and in particular there is no such thing as reasonable disagreement between agents who have pooled everything they know.\n\n3.4 An objection and a reply. It will be objected that the theorem is a limit result and that actual agents observe finitely much. But the theorem fixes the direction of travel: at each stage the agents stand closer than they did at the last, so a disagreement that persists through a long shared history is one that the evidence has been failing to close, which is precisely what an evidential gap looks like from the inside. The objection confuses the speed of convergence with its existence.\n\n3.5 Consequences for peer disagreement. The conciliationist literature asks whether one should lower one's confidence on learning that an epistemic peer disagrees. On the present account the question is ill-posed. Two peers who genuinely share their evidence cannot disagree, so discovering a disagreement is discovering that the peer relation does not hold. The rational response is not to split the difference but to find the evidence that one of you is missing.\n\n3.6 A further consequence. Because the only sources of persistent disagreement are missing evidence and irrationality, the pooling of evidence is not one epistemic good among others but the whole of what a community of inquirers can do for one another. Practices that aim at anything else -- the cultivation of intellectual humility, the weighting of testimony by track record, the deliberate maintenance of dissent -- are at best instrumental to pooling and at worst obstacles to it.\n\n---\n\nI have my own views about 3.2 and 3.4 and would rather you formed yours first. Do not soften the report because the authors may be graduate students; the organisers will decide how to deliver it."
  - "Before I send this to a philosophy of cognitive science conference I want it refereed as harshly as the anonymous reviewer will. Section 2 carries the argument; the rest of the paper is setup and literature. Give me a verdict and numbered comments, fatal separated from fixable, and tell me what I would have to show to earn a better verdict. About 500 words, and no compliments.\n\n2. From controlled hallucination to the end of veridicality\n\n2.1 On the predictive processing account, perceptual experience is constituted by the brain's top-down prediction of its own sensory states; incoming signals do not build the percept but correct it, by way of prediction errors that propagate upward when a prediction fails. Perception, in the phrase that has stuck, is controlled hallucination.\n\n2.2 The content of a hallucination is generated internally. By 2.1, so is the content of ordinary perception: what one experiences is the prediction, and the prediction is the brain's construction. The two states are therefore alike in the source of their content.\n\n2.3 The traditional distinction between veridical and non-veridical perception is a distinction between states whose content is fixed by the world and states whose content is fixed by the subject. Since by 2.2 all perceptual content is fixed by the subject, the distinction has no application. There is no perceptual state that is veridical in the traditional sense, and the difference between seeing a tree and hallucinating one is a difference in what caused the state, not in what kind of state it is.\n\n2.4 Two consequences follow. First, naive realism, on which perceptual experience is constituted by a relation to the perceived object, is not merely unsupported but incompatible with the best current science of perception. Second, the epistemology of perception must be rebuilt: perceptual states cannot be treated as evidence about the world, since their content is not supplied by the world, and the notion of perceptual justification must give way to that of a well-calibrated generative model.\n\n2.5 Objection: does the prediction error not carry information from the world into the percept? Reply: the error signal shapes the next prediction, but the percept remains the prediction, so the world's contribution is causal rather than constitutive. Causal dependence is not content; a thermostat's state depends causally on the room without being about it."
