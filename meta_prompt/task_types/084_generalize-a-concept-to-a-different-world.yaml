type: "Describe a world that differs from ours in some systematic way and ask how a concept, usually a normatively laden one, or an institution built on it would have to be generalized to fit that world"
notes: |
     The asker describes a world, or a population, that differs from ours in some systematic way -- a capacity people have here is missing there or a new one is added, a new kind of member joins society with preferences and abilities unlike ours, or a background fact we take for granted, about bodies, minds, lifespans, scarcity, or what can be known about others, is changed -- and asks how a concept or an institution would have to be generalized to fit it. The concept is usually normatively laden: a right, a duty, a virtue, a value, a protection, or a status. The institution can be a constitution or statute, a professional code, a market, a voting system, or a social practice, and the asker may want specific provisions drafted or amended. Some askers put the question in machine-learning terms, as a concept learned on one distribution meeting another. State the world precisely enough to reason about -- what exactly differs and what stays as it is -- and change it in a way that breaks an assumption the concept quietly relies on, so that neither keeping the old rules nor dropping the concept is obviously right. Purposes vary: worldbuilding for fiction or a game, a seminar exercise, a thought experiment for law or policy, testing a theory of the concept, or wondering how human values would carry over to new kinds of minds. A good answer first says what the concept is for in our world and which background facts its present form relies on, then traces where the new world breaks them: which rules lose their point, which become impossible to follow, and which start to harm the interests they were meant to protect. It then proposes the generalization concretely -- rules, rights, clauses, or norms, each tied to the concept's point -- and says where that point splits into parts the new world pulls apart, or leaves a choice the concept itself does not settle. It respects the stipulations: it does not quietly bring back our world's facts, and it treats new members' preferences and abilities as given rather than as defective versions of ours. It takes up hard cases that exist only in the new world, says what it assumes where the stipulations leave the answer open, and ends with what the exercise shows about the concept here: which of its features were essential, and which were artifacts of our circumstances. This differs from the counterfactual-scenario type (a prediction of what would happen), the unforeseen-case type (one new case under a rule's existing wording), and the outside-its-home-domain type (a theory applied to another domain of our world): here the world changes, and the deliverable is the concept, or an institution built on it, redesigned to fit.
examples:
  - "I'm a privacy lawyer, and a question from a dinner party won't leave me alone. Suppose people could not lie -- not that lying is forbidden, but that no one is able to assert something they believe false. They can still stay silent, change the subject, or refuse to answer, and everything else about people and society is as it is now. What would privacy protection have to look like in that world? I suspect much of privacy in practice rests on the option of lying: the applicant who says she isn't planning children when the interviewer had no business asking, the 'I'm fine' to a nosy colleague. But I can't tell how much. Which of our privacy norms and laws would still make sense, which would lose their point, and what new protections would be needed? Then tell me what this shows about what privacy is for here."
  - "Imagine horses were a bit smarter: smart enough to understand money, hold jobs, make contracts, follow politics, and vote, and the United States granted them citizenship. They're still horses in what they want and what they can do. They live about thirty years and are adults at four, they're herd animals who suffer in isolation, they can't handle tools or paper, they graze most of the day, and they care little for things many humans care about, like owning land. How would the US Constitution have to be adapted? The age requirements for office are the obvious problem, but I suspect the deeper ones are elsewhere. Go through the provisions that would break or misfire, draft the amendments you'd propose, and say which provisions work fine as they are. I care most about whether equal protection can survive citizens whose needs differ this much."
  - "I work on AI policy and I'm drafting a discussion paper on what employment law becomes if some workers are digital minds. They can be paused without experiencing the gap, copied so that ten instances do a job at once, and run at a hundred times human speed. Assume for the paper that they are persons with interests and that the law has chosen to treat them as employees, not property. Take the core protections -- limits on working hours and the right to rest, the minimum wage, protection against unfair dismissal, the right to quit, the right to organize -- and work out what each would have to become. What is a working hour for a mind running at a hundred times speed? Is pausing someone between tasks a dismissal, unpaid rest, or neither? If one instance joins a union, have its copies? Where a protection's purpose gives no answer, say so instead of inventing one."
  - "Worldbuilding question for a novel. In my setting everyone has perfect memory and can share any memory with anyone, verifiably, at will. Nothing is forgotten, and nothing anyone witnessed can be disputed. I want the society's ethics to feel lived-in, and I'm stuck on forgiveness. In our world forgiving leans on letting things fade: records get sealed, convictions expunged, people start over in a new town. What would forgiveness, and the institutions built around it, become in a world like mine? Is it still possible? Does it become something you do rather than something that happens to you? What norms and laws would my characters have around it? Give me enough concrete detail to write scenes from."
  - "I'm setting an exercise for a political philosophy seminar. 'One person, one vote' is easy to state when persons come one to a body and stay that way. Suppose instead that a fifth of the population can merge their minds into a single person for a few months and then split again, sometimes into a different number of people than went in, each remembering the merged life as their own. Everyone else is as now. Generalize the principle of political equality to this population. Who gets a vote, and how many, during a merger and after a split? What happens to the secret ballot, to term limits, and to the ban on buying votes when one voter can absorb another? I want students to see which parts of 'one person, one vote' were about persons and which were about bodies, so make that explicit."
  - "I work on alignment, and I keep returning to how our moral concepts behave off the distribution they were learned on. Here's a test case I'd like worked through properly. Imagine a community of agents that can read each other's source code, so each knows what every other would do in any situation it can describe. Take promising. We learned the concept where minds are opaque, and a promise gives others an assurance they couldn't otherwise have. What does promising become among these agents? Does its point survive, and does the obligation? Would they still need anything like promises, say to bind themselves against dispositions they expect to change? Then tell me which parts of our concept were about assurance and which were about something else."
