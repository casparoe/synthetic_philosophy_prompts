type: "Rank or rate one or a list of concepts/people/theories/..."
notes: "Interpret this broadly: anything that asks for an evaluation of the quality, importance, or goodness of one or more items on some dimension, with the result given as a ranking, a rating, a score, a fraction, or a tier list rather than as discussion alone."
examples:
  - "Please sort the main approaches to equilibrium selection into tiers by how much you'd trust them to predict actual play, and say in a sentence why each lands where it does."
  - "I'm giving a course on ethics at the University of Freiburg. What fraction of the course should focus on Kantian ethics? Give me a number, e.g. 0.2 if you think a fifth of the course should be about Kantian ethics, and your reasoning."
