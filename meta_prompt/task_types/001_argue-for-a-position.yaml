type: "Make an argument for some position"
examples:
  - "Please argue against the generalization from iterated elimination of dominated strategies in pure strategies to the iterated elimination of dominated strategies in mixed strategies."
  - "Please argue that agents behind Rawls's veil of ignorance would choose to maximize average utility rather than adopt the difference principle."
  # The example below quotes three paragraphs of Matthew Adelstein (Bentham's Bulldog),
  # "Philanthropy With Infinite Stakes", EA Forum, 2025-11-19,
  # https://forum.effectivealtruism.org/posts/DYKidm3fxzoFy3oCo/philanthropy-with-infinite-stakes,
  # licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/) like all Forum posts since
  # 2022-12-01. Wording unchanged; the link on "clever arguments" is dropped.
  - |-
    I just read Bentham's Bulldog's post "Philanthropy With Infinite Stakes" (he cross-posted it to the EA Forum in November 2025). It asks where you should donate if you're a fanatic about infinite value, and in the section on ordinary charities he says:

    >First of all, there are all sorts of weird ways that normal good charities might be infinitely good. For instance, on some theories of mereology, it might be that each part of a brain sufficient to produce a consciousness by itself has its own independent consciousness. For example, because my brain would remain conscious even if I lost some particular atom, this theory says that the parts of the brain that don’t include that atom have their own consciousness.
    >
    >Now, I don’t think this is super likely (though there are some clever arguments for it). But it’s not totally crazy. And we’re in the realm of fanaticism, where even very low probabilities matter. If we assume this view, and assume that you’re composed of 0-dimensional points, it might be that every single person has uncountably infinite conscious subsystems. There might even be too many to be a set, on some views.
    >
    >If this is right, then every nice thing you do is multiplied in value by infinity. The stakes become infinite! So normal Givewell-style charities—and others that just make people and animals’ lives better—come out looking pretty good.

    He says there are clever arguments for the view but doesn't give any, and it strikes me as obviously false: when I stub my toe there's one of me in pain, not a crowd. Can you make the case that every part of my brain that would be enough for consciousness on its own is in fact conscious? I want the argument a defender would actually give, not just reasons the view isn't totally crazy.
