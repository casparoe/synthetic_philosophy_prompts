type: "Predict or recommend a verdict on a new case from someone's verdicts on earlier cases"
notes: |
     The asker reports how some person or body has judged a series of earlier cases -- a friend's views on which animals are conscious, a professor's verdicts on knowledge cases, a committee's or court's past decisions, an author's rulings across their examples, a tradition's treatment of precedents -- and asks what that person or body would say, or should say for consistency, about a new case, which the asker specifies. Write the earlier verdicts so that they are jointly consistent with more than one plausible rule, and choose the new case so that at least two of those rules diverge on it: the work is in identifying the candidate rules, saying what each predicts about the new case, giving a best guess with the reasons for preferring it, and naming the further case that would tell the rules apart. In the recommendation version, the deliverable is the decision that best coheres with the body's own precedents, with the closest analog identified and an honest statement of what principle the body would be adopting either way. This differs from the verdicts-to-principle type (the asker's own verdicts, with the principle as the deliverable), from the historical-figure type (extrapolating a whole body of thought to a new era rather than a list of case verdicts), and from adjudication (a dispute to be settled): here the object is a track record, and the deliverable is a prediction or a precedent-consistent recommendation about a specified case.
examples:
  - "My friend is pretty firm that humans, cows, and octopuses are conscious, that fish and insects aren't, and that a bee colony isn't even though it solves problems a single bee can't. Do you think she'll say chickens are conscious? What about a lobster, a Portuguese man o' war, and a current language model? I'm less interested in the answers than in the rule she seems to be running, the other rules that fit her verdicts just as well, and which of those cases would best tell them apart."
  - "My epistemology professor's verdicts so far: fake barn case, no knowledge; lottery ticket, no knowledge; standard Gettier cases, no knowledge; ordinary perception, knowledge; testimony from a reliable stranger, knowledge; a stopped clock that happens to show the right time, no knowledge; a true belief formed by a reliable method that could easily have been false, knowledge. Next week's case is a belief that is true, formed by a reliable method, and would have been true in all nearby cases, but which rests on a false intermediate belief. Predict her verdict, say which theory she is implicitly running -- safety, sensitivity, no false lemmas, or something else -- and tell me which case would settle it."
  - "I sit on my university's research ethics board and we have a proposal to decide. Our own precedents: we approved a study that told participants it measured reading comprehension when it measured blame attribution, with debriefing; we rejected one that withheld from participants that a confederate was an actor and involved mild humiliation, even with debriefing; we approved with conditions a study that concealed its hypothesis but not its procedures; we rejected a study that used deception on a vulnerable population despite minimal risk. The new proposal deceives participants about the purpose of a competitive task, involves mild frustration, debriefs immediately, and recruits only from the general adult population. What should we decide if we want to be consistent with ourselves, which precedent is the closest analog, and if our precedents genuinely underdetermine it, what principle would we be adopting with each choice?"
