type: "Concede that a view is probably false and ask the model to play devil's advocate for it anyway"
notes: |
     The asker names a view that is probably false -- one most experts reject, one that history has left behind, or one that simply sounds bizarre -- says as much, and asks the model to play devil's advocate and make the best case for it anyway. The request can also be framed from the other side, as the case against a view that is very likely true. The asker may say what makes the view seem untenable to them, giving the advocate something specific to answer, and why they want the case: curiosity about what its defenders saw, wanting to teach it fairly, drawing the losing side in a debate, writing a character who holds it, suspecting their own dismissal is unearned. They may set terms: stay in role throughout, or step out at the end and say where the case is weakest; argue only from premises the asker accepts; keep it to a short speech or the three best arguments. Vary the kind of view: a metaphysical position most philosophers abandoned, a superseded scientific theory, an ethical view nearly everyone rejects, a skeptical conclusion nobody lives by, a claim the experts in the chosen domain treat as refuted. Pick respectable errors -- views with real arguments behind them, held by serious thinkers or defensible in a seminar -- not conspiracy theories, health misinformation, or views that demean a group of people. A good answer commits to the brief: no disclaimer in every paragraph, no deliberately weak case, no quiet retreat to a more respectable neighbor of the view. It leads with the strongest arguments the view admits, including ones its historical defenders lacked, and meets the objections that sank it head-on, without inventing facts. If asked to step out of role, it says honestly where the case is weakest and whether the view still looks false or proved stronger than expected. This differs from the argue-for-a-position type (a case for a view that may well be true), the role-play type (a live exchange over several turns), and the what-would-count-against type (a neutral map of a position's exposure).
examples:
  - "I know Cartesian dualism is pretty bizarre. But can you play devil's advocate and argue for it?"
  - "I drew the short straw in my ethics seminar's debate: on Friday I have to defend Kant's claim that you may not lie even to a murderer who comes to the door asking where your friend is hiding. I think the view is wrong, and so does everyone in the room, including the professor. Write me a five-minute opening speech for it. Defend the strict view itself -- no 'Kant didn't really mean it', no swapping in a gentler Kantianism that permits the lie -- and take on the obvious objection, that the truth-teller becomes complicit in a murder, instead of steering around it."
  - "I teach a history of chemistry course, and every year students come out of the unit on the Chemical Revolution convinced that the phlogistonists were fools who couldn't read a balance. I'd like to unsettle that without pretending Lavoisier was wrong. Play devil's advocate for phlogiston chemistry as it stood around 1785: make the strongest case that a careful chemist of the day had good reason not to convert to the oxygen theory, using only evidence and arguments available at the time, and pitch it at second-year undergraduates. Then, in a short note set apart from the case, tell me where you had to stretch the historical record to make it."
  - "I'm a statistician, and I've always taken Hume's problem of induction to be dissolved by Bayesianism: put a prior over the hypotheses, conditionalize on the data, done. A friend with a philosophy PhD says that's naive, and before we argue about it again I'd like to see the best version of her side. So play devil's advocate against my view. Using only premises I'd grant as a subjective Bayesian -- coherence, conditionalization, and the freedom to choose my own prior -- argue that I still have no reason to expect the sun to rise tomorrow. Stay in role to the end, then step out and tell me in one paragraph which part of the argument you think actually lands."
  - "ok so at our EA reading group last night everyone agreed you obviously shouldn't hand your wallet to pascal's mugger, and I agree, it's absurd. but before I go around calling it absurd I'd like to know how good the case on the other side actually is. play devil's advocate: argue that you really should pay up, that being 'fanatical' about tiny chances of enormous payoffs is what rationality requires rather than a bug. three strongest arguments, a short paragraph each, best one first. no rebuttals, I can come up with those myself"
