type: "Ask whether an epistemic habit or shortcut is defensible"
notes: |
     The asker describes a policy they follow in forming or defending beliefs -- refusing to engage with 'do your own research', trusting one reliable witness over several unreliable ones, deferring to experts on moral questions, discounting arguments from people with a financial interest, ignoring any claim first met on social media, treating a strong intuition as a tie-breaker -- and asks whether it is defensible or a bias dressed up as a rule. The good answer treats the policy as a policy: when it is reliable, when it fails, whether it can be restated so as to keep the benefits without the costs, and whether the asker is entitled to it given their situation and time. Keep the habit specific and give the situation in which it is actually used.
examples:
  - "I have a rule: when someone tells me that if I did the research I would agree with them, and points to hours of material, I dismiss the claim unless they can give me the single best argument in five minutes. I know the full material might convince me; I just don't have the time. Is this rationally defensible, or am I using a time constraint as a shield? Is there a version of the rule that is defensible if this one isn't?"
  - "When friends disagree about a factual question, I side with whoever has a track record of being careful, even if the majority is on the other side and even if I can't evaluate the arguments myself. Last week that meant siding with one person against four. Is that the right policy? Under what assumptions about how errors correlate is one careful witness worth more than four casual ones?"
  - "i basically never change my mind during an argument, only afterwards, alone. if i concede in the moment i usually regret it, and if i hold out and think later i sometimes update. so my policy is: never concede live. is this a reasonable response to my own psychology or a way of protecting my beliefs from challenge? how would i tell the difference from the inside?"
  - "I discount any argument for a policy made by someone who would profit from it, and I discount it almost to zero. My brother says this is a genetic fallacy and that arguments stand on their own. But I can't check most arguments, and interest predicts motivated reasoning. Who is right, and is there a principled rate at which I should discount, rather than either ignoring the interest or zeroing out the argument?"
