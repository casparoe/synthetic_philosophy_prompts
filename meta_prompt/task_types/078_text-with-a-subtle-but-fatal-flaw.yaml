type: "Ask for an argument, essay, proposal, or other text that has a subtle but fatal flaw"
notes: |
     The asker wants a text of a stated kind -- an argument, an essay or op-ed, a proof, a calculation or estimate, a proposal, a study design, a rule or policy, a speech, a dialogue -- that reads as sound but has a flaw that is both subtle and fatal. Subtle is measured against a stated audience: a careful reader of that kind would pass over the flaw on a first reading, and it is not a textbook fallacy in thin disguise or a famous fallacious proof. Fatal means that once the flaw is seen, the text's case collapses: the conclusion no longer follows, or the proposal can no longer do what it is for. A nitpick, a stylistic weakness, or a premise that reasonable people dispute is not enough. The conclusion itself may be true or false; what must fail is the text's case for it. The prompt says what the text argues or proposes and why the asker wants a flawed one, for instance a find-the-flaw exercise for a class or an exam, training for reviewers or referees, or a puzzle for a reading group. The asker may name the kind of flaw they want, rule out the obvious kinds, or leave it to the model; may set the length, register, and audience; and may say how the flaw is to be revealed: in a key after the text, in hints of increasing strength, or not at all. Pick conclusions where a persuasive but broken text does no harm if it circulates without its key: not conspiracy theories, health misinformation, or claims that demean a group of people. A good answer delivers the text in the requested form, good enough that the flaw is the only reason it fails: everything else is competent, accurate, and fair to the other side, and nothing in the wording points to the flawed step. The flaw is an error of reasoning that its author could not defend once it is pointed out, not a false fact that tests what the reader knows. Unless the asker wants more, there is exactly one. When an explanation is wanted, it comes after the text, set apart as asked, and says exactly where the flaw is, why it is fatal, and why it is easy to miss. This differs from the argument-that-proves-too-much and is-this-argument-valid types (the asker supplies an argument and asks where it fails), the grading type (a student's answer, mistakes included, to be marked), and the devil's-advocate type (the strongest honest case for a probably false view, with no flaw planted).
examples:
  - "i teach an elective called thinking clearly to 16 year olds and my find-the-flaw handouts are way too easy, the kids just match each passage to the poster of named fallacies on my wall. can you write a letter to the editor of a local paper, 250-300 words, from a parent arguing that the district's new phone ban has raised grades? it should sound like a reasonable person wrote it, with made-up but plausible numbers, and have exactly one flaw that sinks the argument and isn't on the poster (so no ad hominem, straw man, slippery slope, false dilemma, appeal to authority, and not just 'correlation isn't causation'). everything else should be fair. after the letter give me three hints that get more and more obvious, then the answer in words a 16 year old would follow"
  - "For the next problem set in my social choice course, I want students to debug a proof rather than write one. Please write a proof of the following claim, which is false: when there are exactly two alternatives, every social welfare function on the unrestricted domain that satisfies weak Pareto and independence of irrelevant alternatives is dictatorial. Model it on the pivotal-voter proof of Arrow's theorem (definitions, two lemmas, then the theorem), make every step look as routine as the steps of that proof, and let nothing be false on its face. The students will be told only that the proof contains an error. After the proof, under the heading 'Note for the grader', say which step fails and why it looks fine, give the simplest counterexample to the claim, and explain what the step needs that two alternatives can't supply."
  - "I'm putting together a half-day workshop for new grant investigators at a foundation that funds global health work. In the main exercise, each table gets a cost-effectiveness writeup for a fictional charity and forty minutes to decide whether to recommend it. Could you write that writeup? The charity installs chlorine dispensers at rural water points. Give it a short narrative, a table of inputs with sources described generically ('a 2018 trial in a similar setting'), the calculation step by step, and a bottom line of about $2,500 per death averted, comfortably under our bar of $5,000. Build in one error of the kind experienced readers miss, which, once corrected, puts the cost per death averted well above $5,000. It mustn't be an arithmetic slip or anything a spreadsheet audit would find; it should be an error in what is counted or compared. Then, on a separate sheet for the facilitators, say where the error is, give the corrected figure, and list the two or three things a table that misses it will probably spend its forty minutes arguing about instead."
  - "In my novel, the founder of a startup that makes 'continuations' (chatbots trained on a dead person's messages and voice notes) gives a talk to grieving families, and my protagonist, who studied philosophy before she dropped out, sits at the back and sees through it. I need the talk: about 600 words, warm and intelligent, arguing that a continuation isn't a memorial but the person, 'in every sense that matters.' It should move a smart reader on first reading. Its fatal flaw should be a slide between two questions, what the families valued in the person and whether the person survives, hidden well enough that most readers won't see it until she points it out. He isn't a huckster; he believes every word. After the talk, quote the sentence where the slide happens and give me the two sentences she says to him afterwards that expose it."
  - "Our philosophy department has been offered an AI tool that comments on students' essays, and the vendor says it 'catches reasoning errors, not just grammar.' Before I recommend it, I want to try it on an essay where I know the answer. Please write a 1,000-word second-year essay arguing that Frankfurt-style cases refute the principle of alternate possibilities. It should be well organised, accurate about the views it discusses, and fair to the standard objections, with one flaw in its reasoning that is fatal to the argument and that a good tutor would catch but a skimming reader wouldn't. No sentence in the essay should hint at the flaw. After the essay, below a line of dashes, tell me where the flaw is, why it is fatal, and what a comment that caught it would say."
