type: "Design a classroom activity or game that makes participants feel the force of an idea"
notes: |
     The deliverable is a runnable activity for a group -- a game with rules and payoffs, a role-play or structured deliberation, a simulation, a thought experiment staged with real choices or real (small) stakes -- plus a debrief. The asker should specify the setting (a seminar, a high-school class, a workshop, a reading group), the group size, the time available, and what participants should come away seeing. The idea should show up in what happens, not in what the facilitator says afterwards: the rules, incentives, or roles should be arranged so that participants run into the problem themselves (the coordination failure, the paradox, the intuition that then gets undermined) before it is named. The debrief should map moments in the activity onto parts of the idea, say what will predictably go wrong when the activity is run and how to handle it, and be frank about which feature of the idea the activity cannot reproduce and the facilitator must supply. Formal domains lend themselves to games with payoffs; ethical and metaphysical domains to role-plays, staged cases, forced choices, and deliberations under constraints. This differs from the exam-question type (assessment) and the example type (a described case): here the participants do something.
examples:
  - "I teach an intro to game theory for philosophy students -- about 20 people, one 50-minute session. Design an in-class game that makes them feel the difference between mutual knowledge and common knowledge: the point where everyone knows the relevant fact, and knows that everyone knows it, and coordination still fails. Rules, materials, a payoff scheme that doesn't need real money, and a debrief that maps what happened to the formal distinction. Also tell me what will predictably go wrong the first time I run it."
  - "I run a philosophy club at a high school, about 15 students aged 16-17, one hour. Design an activity that gets them to feel the pull of the repugnant conclusion. Ideally they should construct the sequence of steps themselves and only notice where they've arrived at the end. Then a debrief that shows them where each step could be resisted and what it costs to resist it there. No lecture up front, and they shouldn't hear the name until afterwards."
  - "For an upper-level seminar on vagueness (12 students, 90 minutes), design a structured activity around the sorites paradox that makes epistemicism feel less crazy than it does on the page -- something where the group has to act as though there is a sharp cutoff and then discovers what they can and can't know about it. Include roles or rules, a timeline, the debrief, and an honest note on which feature of the view the activity can't reproduce."
