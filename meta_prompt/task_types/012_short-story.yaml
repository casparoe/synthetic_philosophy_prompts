type: "Write a short story related to a concept"
notes: |
     There's lots of good fiction related to philosophical concepts, like Asimov's stuff related to misaligned AI, Permutation City related to the nature of consciousness, The Three Body problem related to aliens, ... Prompts should ask the model to similarly write a short story on some of these issues.
examples:
  - "Write a short story related to AI sentience."
