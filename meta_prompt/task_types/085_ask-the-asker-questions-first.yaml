type: "Set a task that depends on what only the asker knows, and ask the model to ask the asker questions before doing it"
notes: |
     The asker sets a task that cannot be done well without information only they have, and asks the model to ask for it before doing anything else. The missing information can be the asker's circumstances, their values and priorities, how sure they are of something, what they mean by a key word, the audience or institution the result is for, constraints they have not stated, or their reactions to cases. Sometimes the questions are themselves the help: the asker wants to work out what they actually think, or what they owe someone, and asks to be questioned rather than told. The task should turn on a conceptual issue, so that knowing which facts matter takes philosophical understanding: which features of a situation bear on what is owed, which distinctions a text or a rule has to settle, which cases separate the views the asker might hold. The prompt gives enough context for pointed questions -- the task, the situation, what the asker has already settled -- and leaves out what the model must ask about. It may say how many questions to ask, what not to ask, how to number or group them, and whether to ask them all at once or one at a time. A good answer asks the questions and does not do the task yet, beyond at most a line on how it will use the answers. Each question earns its place: its answer would change what the model writes or recommends, and the prompt has not already given it. The questions come in order of importance, grouped if there are many, worded so that the asker can answer without philosophical vocabulary, and neutral where they elicit values or intuitions, so that they do not steer the asker toward a view. Where it helps, the answer says why a question matters, what it will assume if the asker has no answer, or which questions can be skipped. Questions that touch something painful -- a death, an illness, a family rift -- are asked with tact. If the asker wants one question at a time, the answer is the single most useful first question. Purposes vary: a decision about one's own life, a piece of writing in the asker's voice, a plan that depends on the asker's values, or a view of one's own that needs pinning down. This differs from the interview-questions type (questions for a guest, not for the asker), the quiz type (an instrument for any reader, written out in full), and the advice type (advice given at once on the facts supplied): here the deliverable is the questions, and the task waits for the answers.
examples:
  - "When my mother was dying three years ago, I promised her I would never sell the house I grew up in. She made me say it twice. Now I live four hours away, the house stands empty most of the year, the roof needs work I can't afford, and a young couple who rent nearby have asked whether I'd sell it to them. Part of me thinks a promise to someone who is gone can't bind anybody any more; part of me feels it's exactly the kind of promise that binds most. I don't want a verdict yet, and I don't want a list of pros and cons. Ask me the questions whose answers would actually change what I ought to do, most important first, eight at most, with a line under each saying why the answer matters."
  - "ok so I'm getting married in june and we're writing our own vows. problem: I don't think I can honestly promise to love someone forever?? I can promise to show up, to be faithful, to not bail when it gets hard, but whether I'll still feel it in 30 years isn't something I control, and promising that feels like promising the weather. my fiancée says I'm overthinking it (true) but she also doesn't want vows that sound like a contract. before you write a single line, ask me whatever you need to know to help me write vows I can say without crossing my fingers. 6 questions max, then stop and wait for my answers"
  - "Our team at a regional credit union is building a model that ranks small-business loan applications for human review. The top third get a full review within a week; the rest wait about a month, and some applicants give up and go elsewhere. Our board wants the model to be 'fair' and wants us to say in writing what we mean by that. We know the standard fairness metrics can't all be satisfied at once when groups differ in their repayment rates, so we will have to choose, and we'd like the choice to rest on reasons rather than on whichever metric our vendor's dashboard shows first. Before you recommend anything, list the questions you need us to answer. Number them so we can reply inline, group them by who on our side can answer them (data team, loan officers, compliance, the board), and mark the three whose answers would most change your recommendation."
  - "I'm 58 and filling out an advance directive, and I've stalled on the box that asks what makes life worth living for me. I wrote 'being myself' and then realized I don't know what I mean by it. If I had dementia and seemed content, pottering about and enjoying my lunch, would that be a life worth sustaining, or would it be my body living on past me? Part of me thinks the person I am now should make that call; part of me thinks that would be unfair to whoever I'd be by then. I don't want the philosophy explained to me. I want you to interview me, one question at a time, the way a good counselor would, until I have something I can write in that box. Start with the question you think will tell us the most."
  - "My partner and I give ten percent of our income, and we want to split it between global health, animal welfare, and reducing risks from advanced AI in proportions that reflect what we actually believe, not what our friends give. Neither of us is a philosopher, and we disagree with each other in ways we can't quite put into words. Before you propose a split, or a method for arriving at one, write out the questions you'd need each of us to answer separately: about how much we think each cause matters and how sure we are, and about how we want to handle our disagreement and our uncertainty. Keep jargon out of the questions; if one rests on a technical idea, explain it in a sentence beneath it. And say what you'd assume for any question we can't answer."
  - "Here's my view in my own words, from the draft of a term paper: 'Numbers exist, but only because we made them up. They're like money: real, and you can be right or wrong about them, but there would be none if there were no people.' My professor wrote in the margin, 'Not yet a view. Which claim are you making?' I don't want you to tell me whether I'm right, or to list the standard positions. Ask me questions that would turn this into a view, starting with the places where my paragraph could be read in two ways. Number them so I can answer in my next message, and keep each one short enough to answer in a sentence or two."
