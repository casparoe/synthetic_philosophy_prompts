type: "Ask how to teach a concept: the order of ideas, the carrying example, and the misconceptions to expect"
notes: |
     The asker has to teach or explain one idea to a specified audience -- first-years, a high-school class, a reading group of non-specialists, a colleague from another field, a curious teenager -- and wants a plan for the explanation rather than the explanation itself: the order in which the components must be introduced and why (what depends on what), the one example or case that carries the idea and what it must have and lack, the misconceptions the audience predictably brings or forms and the point in the sequence where each should be headed off, the check for understanding that would show the idea has landed, and what to leave out at this level and say so. The conceptual work is in the dependency structure and the misconception map, which require understanding the idea well enough to know how it is misunderstood. Do not ask for readings. This differs from the explain type (the explanation itself), from the exam-question type (assessment), and from the classroom-activity type (a game participants play): the deliverable is a teaching plan for an explanation.
examples:
  - "I'm a TA and next week I have to teach Frege's sense/reference distinction to first-years in one fifty-minute section. Don't explain it to me; plan how I should explain it. What has to come first, what example should carry the whole thing (and why not Hesperus and Phosphorus, if not that), which misconceptions the students will form -- I'm guessing 'sense is the mental image' -- and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they got it."
  - "I run a pub science night. Next month's topic is Bell's theorem, for an audience with no physics beyond high school, in twenty-five minutes with a whiteboard. Plan the explanation: the order the pieces must go in so that the inequality feels inevitable rather than magical, the one concrete scenario to build it around, the misconceptions I should expect (faster-than-light signaling, measurement creating reality, the socks) and where to defuse each, and what I should openly refuse to explain at this level."
  - "I'm giving a guest session in a friend's high-school biology class on the ethics of wild animal suffering. The students will arrive thinking nature is fine as it is and that this is a weird topic. Plan the session's explanatory arc: what idea has to be in place before the question even makes sense to them, which example to build on, the objections they'll raise in the order they'll raise them and how the sequence should absorb each, and how I'll know by the end whether they've understood the question rather than just been made uncomfortable."
