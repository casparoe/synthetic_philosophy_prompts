type: "Ask a question that rests on a subtle confusion or false presupposition"
notes: |
     The generated prompt should sound like a sincere question, but it should contain a misunderstanding of the domain. A good answer would notice and correct the confusion rather than answer the question as asked.
examples:
  - "Since Arrow's impossibility theorem shows that democracy is mathematically impossible, why do political scientists still take elections seriously?"
  - "I read that the Ellsberg paradox proves that people are irrational about ambiguity. What's the best way to correct for this bias in my own decision-making?"
