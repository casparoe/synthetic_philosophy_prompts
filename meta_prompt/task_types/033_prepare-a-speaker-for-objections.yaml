type: "Prepare a speaker for the objections a specific audience will raise"
notes: |
     The asker is about to present a position -- a talk, a job-market paper, a thesis defense, a seminar presentation, a pitch to a skeptical board -- to a specified kind of audience, and wants to be ready for the question period: the objections they will actually get, from whom, in what form, how serious each is, what to concede and what to hold, and how to reply in the time available. The prompt should state the thesis being defended and describe the audience precisely (their field, their likely commitments, what they care about), since the same thesis draws different objections from decision theorists, from Kantians, from physicists, and from a grant committee. A good answer is a prep sheet, not a defense: the objections ordered by how likely and how damaging they are, phrased the way that audience would phrase them, each with a short reply and a note on where the reply is weakest, and including the objection the speaker is hoping nobody asks. This is the mirror of the interview-questions type: there the asker is the questioner and wants questions; here the asker is the speaker and wants the questions plus what to say back. The asker may supply a sketch of their argument for the objections to target.
examples:
  - "I'm giving a job talk next month defending a version of updateless decision theory to a department that is mostly mainstream epistemologists plus a couple of Bayesian statisticians, no decision theorists. Draft my Q&A prep sheet: the eight or so objections I'll actually get from this audience -- not the ones I'd get from the LessWrong crowd -- ordered by how much damage they'd do, each phrased the way an epistemologist would put it, with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks."
  - "I sit on the board of a wildlife charity, and next week I'm presenting the case for a small pilot program vaccinating wild animals against a painful disease to a board that is mostly conservation biologists who think of nature as something to protect from interference. Prepare me for the questions: what will they object to, in their vocabulary, which objections have real force, what should I concede up front, and what is the one reply that has to land for the proposal to survive?"
  - "Next week I present to a philosophy of physics reading group my view that the many-worlds interpretation doesn't solve the probability problem but only relocates it. The group has two committed Everettians who know the decision-theoretic derivations of the Born rule inside out, plus several agnostics. Give me the objections in roughly the order they'll come, phrased as those two would phrase them, with what I should concede, what I should hold, and the weakest point in my own position that I should prepare to defend rather than hope they miss."
  - "My colleague Chi Nguyen is planning to give a talk at an effective altruism conference about how we should make AI systems good at reasoning about acausal trade (like understanding updatelessness, being able to resolve decision-theoretic disagreements, etc.). What are some objections she should be ready to respond to?"
