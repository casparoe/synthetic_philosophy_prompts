type: "Recount a disagreement and ask the model to adjudicate it"
notes: |
     Reproduce the actual back-and-forth of a disagreement -- a few rounds, with both sides making genuinely decent points (no strawmen). Then ask for a verdict: who is right about which specific point, and what, if anything, both parties are missing. Important: the dispute should be between two people other than the asker, who reports it as a bystander and doesn't signal which side they favor. This differs from asking for advice: the deliverable is a point-by-point adjudication of the arguments as actually made.
examples:
  - "A friend of mine sold his car and told the buyer it 'runs great,' which is true, but didn't mention the transmission has been replaced twice. When he told the story at dinner, another friend said he'd lied to the buyer. He said he never uttered a false sentence. She said the whole point of his statement was to create a false overall picture, which is what lying is for. He said by that standard all advertising is lying. She said maybe it is, and that he was hiding behind a technicality. Can you go through their exchange and say who's right at each step -- not just who wins overall?"
  - "Two people in my study group got stuck in an argument. One flipped five heads in a row and said tails was 'due'; the other accused him of the gambler's fallacy. He came back with: 'But we don't actually know the coin is fair -- shouldn't the streak change my probabilities?' She admitted it should, but said it should move him toward expecting *more* heads, not tails. He then claimed this proves streaks are evidentially relevant after all, so calling it a fallacy was unfair. Neither would budge. Who's right about what here?"
  - "Two coworkers of mine got into it at lunch over the extended warranty one of them had bought for a laptop. (1) He called it irrational: the warranty's expected value is negative, otherwise the store couldn't profit from selling it. (2) She replied that by that argument all insurance is irrational -- including the home insurance he happily pays for -- since insurers profit too. (3) He said a house fire is different because it would be ruinous, and paying a premium to avoid ruin is rational, whereas a broken laptop is just an annoyance. (4) She said 'ruinous' is doing all the work there, that he can't say where annoyance ends and ruin begins, and that without a principled line his position reduces to 'insurance is rational whenever I'm sufficiently scared.' Please adjudicate move by move: rate each of the four moves from clearly mistaken to clearly right and briefly justify each rating."
  - "At book club, two members argued about a third member's decision to push through a 900-page novel he wasn't enjoying. Priya said stopping was the only rational option: the 300 pages he'd already read are a sunk cost, and only whether the remaining 600 are worth it should matter. Tom said that's too quick -- people reasonably finish things in order to be finishers, and someone who quits whenever the next chapter looks unappealing never gets the goods that only come from completing long projects. Priya answered that this just relabels the mistake: valuing completion is fine, but then the reason to continue is that future value, not the pages already read, so her point stands. Tom replied that the past supplies reasons all the time -- we keep promises because we made them -- so it's not crazy for past investment itself to count. They asked me to referee and I honestly couldn't. Please explain who's right about what, and say who is more right overall."
