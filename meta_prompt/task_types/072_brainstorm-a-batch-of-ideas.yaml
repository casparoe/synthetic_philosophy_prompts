type: "Ask for a brainstorm: a stated number of ideas of one kind, for a stated purpose"
notes: |
     The asker wants divergent ideation: a batch of ideas of one kind, usually with a number (five, ten, fifteen, twenty). The ideas can be paper or thesis topics, research directions, thought experiments that could test a claim, possible explanations of a puzzling fact or result, experiments or measurements, designs for a policy or mechanism, ways a proposed scheme could be gamed or could fail, analogies or examples for teaching an idea, discussion questions, essay or talk titles, names for a concept, or premises for stories that would explore a philosophical question. The prompt should say what the ideas are for and who will use them, and give the constraints that make the brainstorm hard: a deadline or word limit, a background the asker has or lacks, things already tried or ruled out, a register or audience, a demand that every idea be testable, cheap, or publishable. Vary the number, the register, and what the asker wants done with the list: ranked, grouped, annotated with a sentence each, or filtered down to the best few. A good answer delivers ideas that differ in kind rather than ten variations on one, includes some that are not obvious without becoming silly, makes each concrete enough to act on (what exactly it is and why it is promising), respects the constraints, marks the strongest few and says why, and admits when an idea probably already exists, naming the existing work only if sure of it. Padding is a failure: fewer good ideas with a note that the space runs thin beats a full list of filler. This differs from the extend-a-list type (one new item beyond a list the asker supplies), from the which-open-questions type (a ranked and defended agenda, not a spread of options), from the thought-experiment type (one case built to order), and from the narrower list genres (interview questions, objections for a talk, falsifiers of a position, desiderata for a theory).
examples:
  - "I'm a second-year philosophy PhD student and want to write a workshop paper on decision theory and AI agents, due in four months. Give me ten paper ideas, each stated as a single claim I could defend in 6,000 words rather than a topic. Nothing that boils down to 'apply FDT to X'. Mark the three you think are most publishable and say why."
  - "brainstorm 15 thought experiments that could separate total utilitarianism from critical-level views without just rerunning the repugnant conclusion. one or two lines each. bonus points for ones that don't involve populations of billions"
  - "We're running a quadratic funding round for open-source software. List twelve ways participants could game it -- collusion, fake identities, timing tricks, anything else -- and for each give one sentence on how much damage it could do and one on a possible fix. Group them by who does the gaming: donors, projects, or the organizers themselves."
  - "I teach intro philosophy to engineering students. Give me eight analogies or everyday examples I could use to explain the problem of induction, from the obvious to the surprising, and tell me which of them would mislead students about what the problem actually is."
  - "Language models sometimes do worse on a task when asked to think step by step. Come up with ten possible explanations, from boring artifacts to deep ones about reasoning, and for each say what quick experiment would tell it apart from the others."
