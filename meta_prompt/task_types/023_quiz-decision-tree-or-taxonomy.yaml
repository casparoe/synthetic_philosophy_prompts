type: "Write a sorting quiz, decision tree, or taxonomy of the positions on a question"
notes: |
     The deliverable is a classification instrument for a debate: a "which position do you actually hold?" quiz with a scoring key, a decision tree or flowchart that leads from a starting commitment to a named position, or a taxonomy in which each branch is labeled with the question that separates it from its siblings. The work is in the diagnostic questions: each should be a concrete case or claim on which the positions genuinely come apart, phrased so that someone can answer it without knowing the labels, so the instrument sorts people by what they believe rather than by what they call themselves. Where possible the tree should be built from the logical space rather than from a list of names: first the questions and the combinations of answers they allow, then the actual positions located in that space, with unoccupied combinations noted and briefly diagnosed (is nobody there because the view is incoherent, unattractive, or merely unexplored?). Positions the tree cannot separate should be flagged as such rather than papered over. To keep the prompt from being answerable by lifting an encyclopedia entry, the asker should specify an angle: which distinctions matter for their purpose, which positions must appear as leaves, or which cases must be used. The asker may also fix the audience and the size (number of questions or leaves). This differs from the comparison type (prose about two views) and from the ranking type (which evaluates rather than classifies).
examples:
  - "I write a small philosophy blog and want to make a 'which theory of personal identity do you actually hold?' quiz. Eight to ten questions, each a concrete case (teleporter, fission, gradual neuron replacement, total amnesia, ...) with two or three answer options, and a scoring key mapping answer patterns onto psychological continuity with and without the no-branching clause, animalism, narrative views, and the deflationary no-self option. The point is to sort readers by what they say about cases, not by which label they like, so no question should just ask 'do you think you are your body?'"
  - "For a philosophy of physics seminar, write a decision tree that takes a student from 'I accept that the Bell inequalities are violated experimentally' to a named position. Each branch node should be one of the theorem's assumptions (factorizability, measurement independence, single outcomes, and whatever else you think belongs on the tree), and each leaf an interpretation: Bohmian, Everettian, superdeterminist, QBist or Copenhagen-style, retrocausal. Phrase every node as a question a student could answer without already knowing which interpretation it leads to, and flag any pair of leaves your tree can't really separate."
  - "I'm making a handout for an applied ethics class on whether we should intervene to reduce suffering in nature -- vaccinating wild animals, reducing predation, that sort of thing. Please write a taxonomy of the positions as a tree where each branch is labeled by the claim that splits it: whether wild animals' welfare counts at all, whether naturalness has value of its own, whether our record of ecological intervention gives a decisive practical reason against, whether the sheer scale of the suffering changes what is obligatory. Each leaf should carry the name of the position (or 'unnamed' if nobody defends it) and one sentence on its most awkward commitment."
