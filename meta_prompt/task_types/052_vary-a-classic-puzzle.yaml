type: "Vary a classic puzzle or thought experiment and ask how the analysis changes"
notes: |
     Take a canonical case -- Newcomb's problem, the trolley, Sleeping Beauty, the blue-eyed islanders, the prisoner's dilemma, the experience machine, Mary's room, the ship of Theseus -- and change one thing: a parameter (the predictor is right 70% of the time), an assumption (the islanders sometimes err), the number of agents, the payoffs, the timing, what is known. Then ask what the standard analysis says now, or which of the competing answers to the original survives the change. The variation should be precise enough to have a determinate structure, and it should not be one of the well-known standard variants (the fat man, the loop, Newcomb with a transparent box) unless combined with something new.
examples:
  - "Take Newcomb's problem but suppose the predictor is only right 70% of the time, and the opaque box holds a million while the transparent box holds half a million rather than a thousand. Run the causal and the evidential calculation properly. Does the case still divide the two theories, or do they now agree, and if so at what predictor accuracy do they part ways again?"
  - "In the blue-eyed islanders puzzle, suppose each islander has, on each night, an independent one percent chance of miscounting or misremembering, and everyone knows this. Does the common-knowledge argument still get anywhere? Does anyone ever leave, and if so when, and does the answer depend on whether they act at 90% or 99% confidence?"
  - "Sleeping Beauty, except the coin is flipped after the first waking rather than before, and on tails she is woken not twice but a number of times drawn from a geometric distribution. Does the halfer/thirder disagreement survive in this version, or does one side's argument simply stop applying?"
  - "Consider Parfit's teletransporter, but the machine has a one-in-ten-thousand failure mode in which the original is not destroyed and two people walk around for a week before one of them is randomly deleted. You have used it a thousand times without incident. Does the mere existence of this failure mode change what you should think happens on the ordinary trips? Work through what the psychological-continuity view and the further-fact view each have to say."
  - "Consider Newcomb's problem, but imagine that the predictor works by a crystal ball. I.e., the predictor predicts your actions, but not in a way that has a naturalist explanation. Taking for granted that this scenario is possible and relevant, what do widely discussed decision theories recommend in this problem? Can the scenario be used to argue for some decision theories over others?"
