type: "Provide a paper or blog post and ask for a review of it on a given form and for a stated purpose, such as a conference, an anthology, or a best-of collection"
notes: |
     The asker supplies the piece to be reviewed in full -- a paper or a section of one, an extended abstract, a preprint's abstract and results, a blog or forum post, an essay submitted to a collection -- and says what the review is for and the form it must take. Purposes vary: a conference's or workshop's review form, a program committee's scores, an editor's reader report on whether a piece belongs in an anthology or edited volume, a forum's or newsletter's decision on what to feature or put in a best-of collection, a retrospective review of how an older post has held up, a public review of a preprint, a meta-review that weighs other reviewers' reports (supplied in full). Forms vary as much: free text under fixed headings (summary, strengths, weaknesses, questions for the authors, limitations), numeric fields with labeled anchors (soundness, clarity, significance, an overall rating, the reviewer's confidence), Likert items, a fixed vocabulary of verdicts, a recommendation from a closed list, separate comments for the authors and for a committee, word limits per field. The prompt reproduces the form's fields, scales, and anchors, and states the venue's criteria and anything that should calibrate the scores (an acceptance rate, an instruction to use the whole scale). Write the piece convincingly in its own genre and give it real strengths and one or two real weaknesses a careful reviewer would find -- a premise the argument rests on but only asserts, an equivocation, a conclusion stronger than the evidence, a familiar objection presented as new -- without letting the asker point at them. A good answer fills in every field of the form and nothing else, within its limits. Its scores agree with its prose and with the stated anchors: no fatal flaw beside a high soundness score, no reject without reasons that would justify one. It keeps the criteria apart (whether the piece is sound, whether it matters, whether it fits the venue) and judges the piece by the venue's standards rather than a journal's: a blog post is not faulted for lacking citations unless the purpose requires them, and an anthology report asks about the readers the volume is for. Its weaknesses are specific, located in the text, and sorted into fatal and fixable, and its questions are ones the authors could answer. It reports its confidence honestly, says what it could not check (an appendix, data, or proof that was not supplied), and does not guess at who the authors are. Comments for the authors are courteous and usable; comments for a committee or editor say plainly what the authors need not hear. This differs from the referee-report type (a free-form report with a verdict on a section of a paper), the essay-comments type (informal feedback for the author), and the grading type (a student's answer marked against a scheme).
examples:
  - "I'm reviewing for the position-paper track of an ML conference and want an independent review to compare with mine before I submit it. The track asks reviewers to judge whether the position is clearly stated, well argued, and worth the community's attention, not whether it reports new results. Below are the submission's abstract and the section that carries its argument. Please fill in the form exactly as laid out, with nothing outside the fields.\n\nSummary (what the paper claims, in your own words; no evaluation):\nStrengths and weaknesses:\nQuestions for the authors (only ones whose answers could change your rating):\nLimitations (have the authors acknowledged the limits of their position? yes/no, and why):\nSoundness (1 poor, 2 fair, 3 good, 4 excellent):\nPresentation (1 poor, 2 fair, 3 good, 4 excellent):\nContribution (1 poor, 2 fair, 3 good, 4 excellent):\nOverall (1 strong reject, 2 reject, 3 weak reject, 4 borderline reject, 5 borderline accept, 6 weak accept, 7 accept, 8 strong accept):\nConfidence (1 educated guess, 2 willing to defend but unsure, 3 fairly confident, 4 confident, 5 certain):\n\n---\n\nTrained Testimony: Why Language Model Self-Reports Are Not Evidence of Experience\n\nAbstract. Arguments that large language models might have experiences increasingly cite the models' own reports ('I feel uneasy about this request', 'I don't experience anything'). We argue that such self-reports carry no evidential weight about model experience, in either direction. A model's dispositions to produce first-person reports are shaped by pretraining on human text and by fine-tuning toward the reports its developers prefer, so the model would produce the same reports whether or not it has experiences, and evidence that would obtain either way is no evidence. Welfare assessments of AI systems should therefore set self-reports aside and rely on architectural indicators.\n\n3. The training-history argument\n\n3.1 E is evidence for H only if E would be less likely were H false.\n3.2 A model's self-reports are fixed by its training. Pretraining supplies the human vocabulary of inner life, and fine-tuning selects which reports the model gives; developers have trained models both to deny inner states and to affirm them cautiously.\n3.3 So whether or not a model has experiences, it produces the reports its training selected.\n3.4 Hence its self-reports are not evidence about whether it has experiences.\n3.5 Objection: human self-reports are shaped by learning too (we learn the word 'pain' from others), yet they are evidence. Reply: in humans, learning attaches words to states that exist independently of the learning. In a model, training produces the report directly; there is no independent state for the report to attach to.\n3.6 The argument extends to behavioral tests built on verbal reports, such as consistency probes, which measure the same trained dispositions.\n3.7 Architectural indicators, such as global broadcast or recurrent processing, escape the argument: they are engineering choices made for performance, not trained to say what anyone wants to hear."
  - "I'm co-editing an anthology of blog writing on ethics for first-year undergraduates. Pieces run 400 to 4,000 words, each with a short headnote, in four sections: Doing good, Future people, Animals, and Technology. My co-editor wants the post below for the Animals section and I'm not sure. Please write the reader report our publisher's form asks for, in at most 600 words:\n\n1. Recommendation: include as is / include with edits / exclude.\n2. Fit: which section, and what it adds that a standard textbook chapter doesn't.\n3. Standalone: will a first-year student follow it without the blog around it? List every place it leans on earlier posts, comments, links, or in-jokes.\n4. As a teaching text: does it model good reasoning? If it has a flaw, is the flaw useful for discussion or a liability?\n5. Edits, if any, paragraph by paragraph.\n6. Two discussion questions for the headnote.\n\n---\n\nOffsetting isn't a loophole\n\nLast week I argued that eating factory-farmed chicken is among the worst things a typical person in a rich country does, measured in suffering caused per dollar spent. A lot of you asked the obvious follow-up in the comments: fine, but what if I donate? So let's do this properly.\n\nHere is the offsetting argument. Suppose your chicken consumption causes, in expectation, some amount of suffering each year. Suppose a donation to an effective charity running corporate welfare campaigns prevents, in expectation, more suffering than that. Then eating chicken and donating leaves the world with less suffering than abstaining and not donating. If what matters is how much suffering there is, the eater-donor has done better than the abstainer, and much better than the eater who keeps the money.\n\nThe common response is that offsetting is a loophole, like paying someone to prevent a murder so that you can commit one. But the analogy fails. Murder wrongs a particular person, whatever happens elsewhere. Buying a chicken breast doesn't wrong any particular chicken: your purchase has, at most, a tiny chance of changing how many birds are raised. What you're responsible for is an expected harm, and expected harms add and subtract like anything else. That's why offsetting carbon makes sense, and why offsetting chicken does too.\n\nTwo caveats. First, the numbers matter: if the charity's effectiveness estimates are off by a factor of ten, you need to give ten times as much, so give generously. Second, offsetting isn't the best option on the table; abstaining and donating is. But 'not the best' isn't 'wrong', and we should stop treating the eater-donor as a hypocrite.\n\n(Yes, Kantian Commenter, I know what you're going to say. Save it for Thursday's thread.)\n\nPeople also ask whether you could offset anything this way. Could you offset kicking a dog by giving to a shelter? No: kicking a dog is something you do to that dog. The cases differ in exactly the way the murder case differs.\n\nSo if you're going to keep eating chicken, and most of you are, donate. And if anyone tells you that's a loophole, ask them what, exactly, it is a loophole in."
  - "I'm on the program committee of a philosophy of mind conference. Reviewing is double-blind, about a quarter of submissions are accepted, and the chairs have asked us to use the whole scale rather than bunching everything at 0. Here's one of the extended abstracts assigned to me. Please fill in the review exactly in our system's form:\n\nOverall evaluation (3 strong accept, 2 accept, 1 weak accept, 0 borderline, -1 weak reject, -2 reject, -3 strong reject):\nReviewer's confidence (5 expert, 4 high, 3 medium, 2 low, 1 none):\nOriginality (1-5):\nClarity (1-5):\nSignificance (1-5):\nWill the full paper deliver what the abstract promises? (1-5):\nReview for the authors (150-300 words):\nConfidential remarks for the program committee (optional, at most 80 words):\n\n---\n\nThe Illusion Must Seem: Against Illusionism's Escape from the Hard Problem\n\nIllusionists hold that phenomenal consciousness does not exist; what exists is the illusion that it does, so the task is to explain why we are disposed to think we have phenomenal states (the 'illusion problem') rather than how matter gives rise to them. I argue that this move cannot succeed, for a reason that has not been appreciated. An illusion is a case of something's seeming to be so. If it seems to me that I have a phenomenal state, then there is something it is like for it to seem so: the seeming has a character. But a seeming with a character is a phenomenal state. So illusionism, if true, entails the existence of the very states it denies. Section 2 develops this argument and shows that it does not depend on any particular theory of seemings. Section 3 considers the reply that the seeming is merely representational, that I represent myself as having phenomenal states without any phenomenal character attaching to the representing. I argue that this reply makes the illusion undetectable from the inside, and that an undetectable illusion explains nothing about why the hard problem strikes us as hard. Section 4 draws the consequence: the illusion problem is the hard problem under another name, and the field is returned to the dilemma illusionism was meant to escape."
  - "Our forum runs an annual review of posts from two years back. Reviewers write a review and then vote from -9 to +9; votes cost quadratically, so most people put big votes on only a few posts. The question isn't whether a post was good when it came out but whether it's still worth reading and belongs in the best-of collection. I want to review the post below, which I remember liking. Write the review, 300 to 500 words: what it claimed, which parts have held up since March 2024 and which haven't, whether its central idea was absorbed, superseded, or ignored, and what a reader today should read alongside it. Then the vote, with one sentence on why that number. Be honest even if that means a low vote, and where you're unsure what happened after it was posted, say so rather than guessing.\n\n---\n\nThe sharp left turn is three claims, not one\n\n'Sharp left turn' gets used in arguments as if it named one hypothesis. I count at least three, with different evidence and different implications.\n\n(1) Generalization asymmetry: when a system's capabilities generalize to new domains, its alignment generalizes less well, because capabilities are pinned down by a convergent target (what works) and alignment only by whatever the training signal happened to reward.\n\n(2) Discontinuity: capability gains come in a jump large enough that iterating on observed failures, our main way of fixing things, won't have time to work.\n\n(3) Breakage: the techniques that aligned the system before the jump stop working after it, because they relied on features the system loses in the jump.\n\nThese come apart. (1) without (2) gives a slow, observable drift, which is bad but tractable: we'd see alignment failures pile up and could respond. (2) without (1) gives a jump in which alignment generalizes along with capabilities, which is frightening but fine. (3) is the claim that does the damage, and it is the least argued for. I've seen it asserted and supported with the evolution analogy (human values stopped tracking inclusive fitness once we got smart), but that analogy supports (1), not (3).\n\nIf this is right, two things follow. First, much of the debate between 'a sharp left turn is likely' and 'it's unlikely' is people talking about different claims, and I'd like people to say which one they mean. Second, the most decision-relevant research is on (3): do current alignment techniques rely on features that capability gains remove? That question is empirically tractable now, with existing models, which is more than can be said for (2).\n\nI'm least sure about the claim that (1) without (2) is tractable. It assumes we'd notice the drift, and a system that is drifting might also be getting better at hiding it."
  - "Our journal club writes public reviews of moral psychology preprints and posts them next to the preprint. We use eLife's assessment vocabulary because readers know it. For the preprint below, write: (1) an assessment of two or three sentences using exactly one of eLife's terms for significance (landmark, fundamental, important, valuable, useful) and one for strength of evidence (exceptional, compelling, convincing, solid, incomplete, inadequate); (2) a public review with a summary, strengths, and weaknesses, 400 to 600 words; (3) numbered recommendations for the authors. All we have is what's below, so don't comment on what you can't see, and say what you would need to see.\n\n---\n\nPerspective-taking expands moral concern for fish: three preregistered experiments\n\nAbstract. Fish are farmed and caught in far greater numbers than any land animal, yet receive little moral concern. In three preregistered experiments (total N = 2,742), we test whether a brief perspective-taking exercise increases moral concern for fish. Participants read a 300-word first-person narrative written from the perspective of a farmed salmon (perspective-taking) or a factual text about salmon farming (control). Perspective-taking increased attributions of sentience to fish (Study 1, d = 0.31; Study 2, d = 0.22) and moral concern for them (Study 1, d = 0.27; Study 2, d = 0.19). We conclude that perspective-taking is a promising, low-cost intervention for expanding moral concern to fish.\n\nMethods (summary). Participants were UK adults recruited online. Study 1 (N = 612) and Study 2 (N = 1,203) measured sentience attribution (five items) and moral concern (four items) immediately after the reading. Study 2 added a behavioral measure: participants could donate any part of a £1 bonus to a fish welfare charity. Study 3 (N = 927) re-contacted Study 2 participants one week later and repeated the attitude measures.\n\nResults (summary). Both attitude effects replicated in Study 2. Donations did not differ between conditions (perspective-taking: mean £0.21; control: £0.19; p = .48). At one week, the sentience effect was d = 0.06 (p = .37) and the concern effect d = 0.04 (p = .54). The perspective-taking narrative described the salmon's pain and fear; the control text did not mention pain. The authors report that 81% of perspective-taking participants correctly guessed the study's hypothesis, compared with 34% of controls."
  - "I'm the area chair for a submission to a workshop on decision theory and AI, and the three reviews disagree. Please write the meta-review in our format:\n\nRecommendation (accept as talk / accept as poster / reject):\nSummary of the submission (two or three sentences):\nPoints the reviewers agree on:\nPoints of disagreement, and how you weigh each:\nRequired changes for the camera-ready version, if accepted:\n\nDon't average the scores. If a reviewer's main objection rests on a misreading, say so politely; if an objection is decisive, say that. Below are the abstract, the caption of the table one reviewer refers to, and the three reviews.\n\n---\n\nAbstract. Updateless decision theories recommend choosing the policy that does best from a prior standpoint, which gives the right answers in transparent Newcomb and counterfactual mugging but is computationally intractable for bounded agents, since the space of policies grows exponentially with the number of possible observations. We propose Restricted Policy Selection (RPS): the agent selects policies only over decision-relevant observations, those on which some agent's prediction of it can depend. We show that RPS agrees with updateless theories in transparent Newcomb and counterfactual mugging, refuses to pay in XOR blackmail, and runs in time polynomial in the number of decision-relevant observations.\n\nTable 2 caption: 'Payoffs in XOR blackmail for the evidential decision theory baseline, by the agent's prior that the house has termites.'\n\nReview 1 (score 7/10, confidence 3/5): A clear and useful paper. The restriction to decision-relevant observations is a natural idea, and the results on the standard problems are as claimed. The related-work section should discuss earlier proposals for policy selection under bounded computation. I'd like to see the workshop discuss this.\n\nReview 2 (score 3/10, confidence 4/5): The proposed agent pays in counterfactual mugging, which I and most decision theorists consider irrational: paying a predictor after learning that the coin came up tails loses money with certainty. A theory that recommends this is unacceptable. Separately, the polynomial-time claim assumes the set of decision-relevant observations is given. Identifying which observations a predictor's prediction can depend on is the hard part of the problem, and the paper says nothing about how an agent would do it.\n\nReview 3 (score 5/10, confidence 2/5): Interesting, but I am not convinced by the XOR blackmail result. In Table 2 the agent pays for most values of the prior, which contradicts the abstract. If this is an error, it undermines one of the three main claims."
