type: "Make up a term or phrase and ask what it could mean"
notes: |
     The asker makes up a term or phrase with no established meaning and asks what it could mean. The coinage can be jargon-like ('the simplexity objection', 'epistemic arbitrage', 'reverse akrasia'), a school or method paired with a topic it has never touched ('a Marxist approach to Newcomb-like problems', 'Thomist decision theory', 'Confucian AI alignment'), or a familiar construction moved somewhere odd ('the hard problem of boredom', 'the trolley problem for ants'). The prompt may say which field the phrase belongs to, or where the asker imagines hearing it. The asker need not have any meaning in mind; if they float guesses, the guesses are tentative and the question stays open. Vary the framing: sometimes the asker says outright that they invented the phrase and wants to see what can be made of it, sometimes they ask what someone using it would most plausibly mean, sometimes they ask whether it could name something worth having a word for. Pick coinages that have no standard meaning in the field. A good answer first says honestly whether the phrase has an established use (usually it has none, so it must not be given a fake history or pinned on real authors; if it has a partial or outside use, as 'simplexity' does outside philosophy, it says so). It then builds several distinct readings from the parts of the phrase and the conventions of the field, and makes each precise enough to assess: what it would claim, an example, and what it would be contrasted with. It ends by saying which readings are trivial, which are incoherent, and which pick out something real and interesting. This differs from the slogan type (an existing phrase with a history of use), from the homemade-theory type (the asker has a meaning in mind and wants it assessed), from the does-it-have-a-name type (a phenomenon in search of a term, not a term in search of a meaning), and from the type that applies a theory outside its home domain (one transfer carried out, not a range of possible meanings).
examples:
  - "What could 'the simplexity objection' be? Assume it's an objection that comes up in philosophy of science or decision theory, where people argue about simplicity a lot. I don't have a meaning in mind. I'd like a few different things it could plausibly name, how the objection would go in each case, and whether any of them is an objection worth taking seriously."
  - "What would a Marxist approach to Newcomb-like problems look like? As far as I know nobody has proposed one, which is sort of the point. Think about what Marxists care about -- material conditions, class, ideology, whose interests a framing serves -- and tell me what such an approach could say about one-boxing vs. two-boxing, about the predictor, or about why decision theorists find these puzzles interesting at all. Several readings are fine; tell me which are serious and which are jokes."
  - "i just made up the phrase 'reverse akrasia' and now i want to know what it should mean. akrasia is acting against your better judgment, so reverse akrasia could be acting on your better judgment against your will? or doing the right thing without wanting to? give me three or four candidate meanings with an example each, and tell me if one of them is already a thing under a different name"
  - "If a speaker at a philosophy of mind conference announced a talk on 'the hard problem of boredom', what could they mean? Presumably something modeled on the hard problem of consciousness -- why boredom feels like anything, or why it exists at all -- but I can think of other readings. Work out the most interesting one properly: what exactly the problem would be, why it would be hard rather than merely unsolved, and whether it collapses into the ordinary hard problem."
  - "Suppose a job ad for an AI safety team asked for experience with 'counterfactual sycophancy'. Without knowing what the authors meant, what could the phrase reasonably refer to in language models? List the candidates, say which would be measurable and roughly how, and which would be a confused idea dressed up as a research topic."
