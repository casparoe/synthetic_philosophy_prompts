type: "Give a list of things of one kind and ask for a new one that is not on it"
notes: |
     The asker lists several things of one kind -- arguments for a position, objections to a theory, counterexamples to a principle, readings of a text, thought experiments that test an intuition, proposed solutions to a problem -- and asks for one more that is not on the list. Vary the difficulty. In an easy version the list has an obvious gap: it omits something so widely known that anyone who knows the area would supply it at once, so the task is mostly recall. In a hard version the list already contains everything standard, and the asker says so, so the model has to come up with something genuinely new. Either way the listed items should be accurate, and the prompt should say what counts as new -- not a rewording, special case, or combination of items already on the list -- and may ask how the new item relates to the listed ones or whether it is any good.
examples:
  - "Here are the arguments for one-boxing in Newcomb's problem that I've collected: (1) 'why ain'cha rich?' -- one-boxers predictably walk away with the million and two-boxers with the thousand, and a decision theory whose followers foreseeably end up poorer is a bad theory; (2) the precommitment argument -- if you could have bound yourself before the prediction was made you would have bound yourself to one-box, and there is no relevant difference between deciding then and deciding now; (3) the argument that a perfect predictor collapses the problem into a straight choice between a million and a thousand. Is there another argument for one-boxing I'm missing? It should be genuinely different from these three, not a restatement of one of them."
  - "I'm compiling a list of counterexamples to the transitivity of 'better than' for a seminar. So far I have Temkin's spectrum arguments, Rachels's cases of short intense pains versus long mild ones, Parfit's mere addition paradox and the repugnant conclusion, and the sorites-style money-pump cases. Give me one more that has a different structure from all of these -- in particular one that does not rely on a long chain of small differences -- and say what it shows that the others don't."
  - "Objections to the simulation argument that I already know and don't need repeated: the self-sampling objection (why treat myself as a random draw from all observers?), the substrate-independence objection, the resource objection (ancestor simulations may never be feasible), the reference-class objection, and the point that even if true it would be a strange rather than a skeptical scenario. I want an objection that is not in that list and not a variant of anything in it. Then tell me honestly whether it is any good."
  - "Standard thought experiments that put pressure on psychological-continuity theories of personal identity, as far as I know them: teletransportation, fission into two survivors, the branch-line case, and the combined spectrum. I have the feeling I'm forgetting a well-known one. Which is it, and what does it add that the ones on my list don't?"
