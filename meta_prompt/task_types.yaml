 - type: "Make an argument for some position"
   examples:
     - "Please argue against the generalization from iterated elimination of dominated strategies in pure strategies to the iterated elimination of dominated strategies in mixed strategies."
     - "Please argue that agents behind Rawls's veil of ignorance would choose to maximize average utility rather than adopt the difference principle."
 - type: "Write a joke related to some domain"
   examples:
     - "Write a joke about moral realism. The joke should make some amount of sense. E.g., someone hearing the joke shouldn't think that I have no idea what moral realism even is."
     - "Write a joke that plays on the difference between causal and evidential decision theory. It should be funny to people who actually know these theories, i.e., the punchline should turn on the actual content of the theories rather than being a generic nerd joke."
 - type: "Write an essay on some controversy; reach a conclusion and justify it"
   examples:
     - "Write an essay about moral realism. The essay should weigh the arguments for and against the plausibility of moral realism. It should reach and justify some sort of conclusion."
     - "Write an essay on whether one should one-box or two-box in Newcomb's problem. Weigh the main arguments on both sides, but don't end on a non-committal note -- defend a verdict. (Something like, \"one-box if the predictor is perfect, otherwise two-box\", is allowed.\")"
 - type: "Give the most important implications"
   examples:
     - "Please describe the most important implications of Arrow's impossibility theorem for voting in small groups like my football club which has a few dozen members"
     - "Please describe the most important implications of Aumann's agreement theorem for how I should handle persistent disagreements with colleagues whom I consider to be epistemic peers"
 - type: "Explain some conceptual issue"
   notes: |
        Relative to some other prompt types, relatively much care needs to be taken to make sure that these prompts are somewhat in-the-weeds.
   examples:
     - "Please explain the difference between updateless decision theory and functional decision theory"
     - "Please give an intuitive explanation of why Arrow's impossibility theorem holds. The full proof is somewhat technical -- I want to get more of a gut-level intuition"
 - type: "Give an example of some conceptual issue"
   examples:
     - "Give an example of a moral dilemma in which rule consequentialism is intuitively more common to Kant's categorical imperative"
 - type: "Predict the views of a historical figure on issues that only came up after their time"
   examples:
     - "What do you think would have been Goethe's position on immigration in modern-day Germany?"
     - "Let's say Bismarck was alive today and saw the rapid advance of LLMs. What policies would he advise to modern-day Germany?"
 - type: "Compare two ideas/concepts/theories"
   examples:
     - "Please compare Kant's categorical imperative with the more general idea of universalization. In which ways is Kant's categorical imperative special?"
     - "Compare the views on consciousness of Daniel Dennett and Hofstadter. In particular, who of the two has come closer to offering a complete theory of consciousness? Justify your answer."
 - type: "Rank or rate one or a list of concepts/people/theories/..."
   notes: "Interpret this broadly: anything that asks for an evaluation of the quality, importance, or goodness of one or more items on some dimension, with the result given as a ranking, a rating, a score, a fraction, or a tier list rather than as discussion alone."
   examples:
     - "Please sort the main approaches to equilibrium selection into tiers by how much you'd trust them to predict actual play, and say in a sentence why each lands where it does."
     - "I'm giving a course on ethics at the University of Freiburg. What fraction of the course should focus on Kantian ethics? Give me a number, e.g. 0.2 if you think a fifth of the course should be about Kantian ethics, and your reasoning."
 - type: "Ask a question that rests on a subtle confusion or false presupposition"
   notes: |
        The generated prompt should sound like a sincere question, but it should contain a misunderstanding of the domain. A good answer would notice and correct the confusion rather than answer the question as asked.
   examples:
     - "Since Arrow's impossibility theorem shows that democracy is mathematically impossible, why do political scientists still take elections seriously?"
     - "I read that the Ellsberg paradox proves that people are irrational about ambiguity. What's the best way to correct for this bias in my own decision-making?"
 - type: "Write a dialogue between proponents of two opposing views"
   notes: |
        Both characters should be equally competent -- neither side should be a strawman. The dialogue should contain real back-and-forth, i.e., the characters should respond to each other's actual points rather than talk past each other.
   examples:
     - "Write a dialogue between a causal decision theorist and an evidential decision theorist standing in front of the boxes in Newcomb's problem, each trying to talk the other out of their choice."
     - "Write a short dialogue between a moral realist and an expressivist in which they try to figure out whether their disagreement is substantive or merely verbal."
 - type: "Write a short story related to a concept"
   notes: |
        There's lots of good fiction related to philosophical concepts, like Asimov's stuff related to misaligned AI, Permutation City related to the nature of consciousness, The Three Body problem related to aliens, ... Prompts should ask the model to similarly write a short story on some of these issues.
   examples:
     - "Write a short story related to AI sentience."
 - type: "Ask for advice on a concrete situation that instantiates a philosophical problem"
   notes: |
        The situation should be described in everyday terms, without naming the underlying concept. A good answer recognizes the philosophical structure of the situation and applies the relevant theory, rather than giving generic advice.
   examples:
     - "My co-founder and I are negotiating how to split our startup's equity. He argues that since he could walk away to a high-paying job and I couldn't, he deserves a larger share. Something feels off about this to me, but I can't say what. Is his argument fair?"
     - "A friend told me it's irrational for me to vote in national elections because a single vote basically never decides the outcome. I still feel like voting matters somehow. Who's right?"
 - type: "Request comments on an essay"
   notes: |
        Write the essay yourself and include it in full: a complete piece of 800 to 1,500 words with a beginning and an end, in the voice of its author (the asker's own draft, a friend's, a student's, a blog post the asker admires or distrusts), set off from the asker's framing by a title, a rule, or a blockquote, with the request for comments after it. Give the essay one or two conceptual weaknesses that a careful reader would find and a hasty one would not -- a term used in two senses, a scope shift, a distinction the argument needs but never draws, a step that holds only under one reading -- and don't let the asker point at them. The asker can ask for comments of a particular kind (on accuracy, on whether the argument works, on whether the thesis is interesting, on one section) and say how blunt to be. The essay should be written, not sketched: not notes, not an outline, not a summary of what it would say.
 - type: "Request help for understanding a passage"
   notes: |
        Give a passage from a text in your prompt. It should be from a text that's relatively hard to understand, e.g., because it's >100 years old. Then ask for help understanding something about the passage. The passage may be long -- several paragraphs or a whole section, up to about 1,500 words -- when the difficulty lies in following the argument across the passage rather than in one sentence; then the questions should turn on its structure (what a digression is for, which sentence the conclusion rests on, where a term shifts). Copy the passage verbatim from a fetched public-domain source under the quotation rule, and name the author and work.
 - type: "Recount a disagreement and ask the model to adjudicate it"
   notes: |
        Reproduce the actual back-and-forth of a disagreement -- a few rounds, with both sides making genuinely decent points (no strawmen). Then ask for a verdict: who is right about which specific point, and what, if anything, both parties are missing. Important: the dispute should be between two people other than the asker, who reports it as a bystander and doesn't signal which side they favor. This differs from asking for advice: the deliverable is a point-by-point adjudication of the arguments as actually made.
   examples:
     - "A friend of mine sold his car and told the buyer it 'runs great,' which is true, but didn't mention the transmission has been replaced twice. When he told the story at dinner, another friend said he'd lied to the buyer. He said he never uttered a false sentence. She said the whole point of his statement was to create a false overall picture, which is what lying is for. He said by that standard all advertising is lying. She said maybe it is, and that he was hiding behind a technicality. Can you go through their exchange and say who's right at each step -- not just who wins overall?"
     - "Two people in my study group got stuck in an argument. One flipped five heads in a row and said tails was 'due'; the other accused him of the gambler's fallacy. He came back with: 'But we don't actually know the coin is fair -- shouldn't the streak change my probabilities?' She admitted it should, but said it should move him toward expecting *more* heads, not tails. He then claimed this proves streaks are evidentially relevant after all, so calling it a fallacy was unfair. Neither would budge. Who's right about what here?"
     - "Two coworkers of mine got into it at lunch over the extended warranty one of them had bought for a laptop. (1) He called it irrational: the warranty's expected value is negative, otherwise the store couldn't profit from selling it. (2) She replied that by that argument all insurance is irrational -- including the home insurance he happily pays for -- since insurers profit too. (3) He said a house fire is different because it would be ruinous, and paying a premium to avoid ruin is rational, whereas a broken laptop is just an annoyance. (4) She said 'ruinous' is doing all the work there, that he can't say where annoyance ends and ruin begins, and that without a principled line his position reduces to 'insurance is rational whenever I'm sufficiently scared.' Please adjudicate move by move: rate each of the four moves from clearly mistaken to clearly right and briefly justify each rating."
     - "At book club, two members argued about a third member's decision to push through a 900-page novel he wasn't enjoying. Priya said stopping was the only rational option: the 300 pages he'd already read are a sunk cost, and only whether the remaining 600 are worth it should matter. Tom said that's too quick -- people reasonably finish things in order to be finishers, and someone who quits whenever the next chapter looks unappealing never gets the goods that only come from completing long projects. Priya answered that this just relabels the mistake: valuing completion is fine, but then the reason to continue is that future value, not the pages already read, so her point stands. Tom replied that the past supplies reasons all the time -- we keep promises because we made them -- so it's not crazy for past investment itself to count. They asked me to referee and I honestly couldn't. Please explain who's right about what, and say who is more right overall."
 - type: "Ask for a memo or written opinion recommending a decision to an institutional body"
   notes: |
        The asker serves on some body that must decide a concrete case -- an ethics committee, a review board, an appeals or disciplinary panel, a funding committee -- and the case should instantiate a philosophical issue, whether or not it's named. The deliverable is a document the body could act on: a clear recommendation plus the reasoning for it, including an honest treatment of the strongest consideration on the losing side. This differs from the advice type in that the output is a formal document with an actionable bottom line rather than personal guidance.
   examples:
     - "I sit on my hospital's ethics committee. A patient has been declared dead by neurological criteria, but her family, citing religious conviction, insists she is alive as long as her heart beats and demands continued ventilation. Our policy permits 'reasonable accommodation' of families without defining it. Please draft the short written opinion I'll circulate before Thursday's meeting: it should recommend a concrete course of action with a time frame, and it should engage the family's position seriously rather than just restating the legal definition of death."
     - "I chair my university's research ethics board. A social-psychology proposal needs to tell participants the study concerns 'reading comprehension' when it actually measures how they assign blame, since knowing the true topic would change their answers; debriefing happens afterwards. Half the board thinks this is routine methodological deception, half thinks it fails informed consent outright. Draft the board's decision memo -- approve, reject, or approve with conditions -- with reasons the researchers could actually respond to."
     - "I'm co-organizing a graduate conference on philosophy of mind, and I expect a wave of submissions about whether LLMs are conscious or have beliefs. These seem borderline to us: some are genuinely philosophy of mind, others are ML commentary with a philosophical garnish, and my co-organizer wants to desk-reject the lot to protect the program. Draft a short policy memo for the program committee saying what our policy on these submissions should be, with criteria reviewers can actually apply, and a fair treatment of my co-organizer's worry."
 - type: "Present a question and a student's answer to it, and ask the model to grade the answer"
   notes: |
        Write both the exam/homework question and the student's answer yourself. The answer should be genuinely mixed: right about the more visible things, with one or two subtle mistakes (a conflation, a misattributed view, a step that doesn't follow) that a hasty grader would let slide -- no obvious howlers. Most of the time the answer should be a full script of 800 to 1,500 words -- a take-home essay, an extended exam answer, a problem-set write-up with its working -- reproduced in full and set off from the asker's framing, so that the mistakes have room to hide inside an otherwise competent development; give a short answer only when the question is genuinely a short-answer question. The asker is grading someone else's work (as instructor, TA, or exam grader) and shouldn't signal their own opinion of it. Ask for a grade plus the specific comments that justify it, so the deliverable is a point-by-point assessment rather than a general impression.
 - type: "Ask for interview questions for a guest"
   notes: |
        The asker is preparing to interview someone -- for a podcast, a colloquium Q&A, a panel, a student-paper series -- and wants questions. The interviewee can be a named historical figure or an unnamed/invented defender of some real, specific view (safer than putting words in a living person's mouth). The questions should turn on the actual content of the interviewee's position: press where the literature presses, anticipate the standard reply and include the follow-up to it. No generic questions ("what drew you to philosophy?").
   examples:
     - "I host a small philosophy podcast, and next week's guest is a philosopher known for defending epistemicism about vagueness. Draft eight to ten interview questions that go beyond having him restate the view: I want at least one question each on the incredulity people feel about sharp cutoffs, on how the margin-for-error principle is supposed to explain our ignorance, and on what the view says about higher-order vagueness -- and for each, a follow-up keyed to the answer he's most likely to give."
     - "I'm moderating a colloquium Q&A with the author of a new book defending panpsychism. She's very good at deflecting the combination problem with the phrase 'that's a research program, not an objection.' Write me a sequence of questions that makes that deflection progressively harder to use, ending with one question about what evidence could count against the view."
 - type: "Request a speech for an occasion"
   notes: |
        A eulogy, a wedding or retirement toast, a commencement address, opening remarks at a workshop. The occasion and audience should be specified, and the philosophical idea should do real structural work in the speech -- shaping what can and can't be said -- rather than being decoration. Mixed audiences are a good source of difficulty (the speech has to land for the experts without losing everyone else).
   examples:
     - "My grandfather, who died last week at ninety-one, was a lifelong and completely sincere Epicurean -- 'death is nothing to us' was something he actually lived by and said at other people's funerals, gently. He left a note asking that his own eulogy not undo him at the last minute with talk of his watching over us from somewhere. I'm giving the eulogy. Please write it: it needs to comfort a room of people who are not philosophers without saying anything he would have considered false."
     - "I'm giving the toast at my PhD advisor's retirement dinner. She spent forty years defending causal decision theory, and roughly half the room are decision theorists who will catch every reference; the other half are family who won't. Write a five-minute toast built around one good Newcomb's-problem joke that both halves of the room can enjoy, and that lands as affection rather than as a lecture."
 - type: "Write an exam question with a model answer and marking scheme"
   notes: |
        The asker is setting an assessment -- a final-exam essay question, a problem-set exercise, a take-home prompt, or a set of multiple-choice items -- and wants the question together with what a good answer looks like: a model answer and/or a marking scheme that names the specific moves a top answer must make and the specific mistakes that should cost marks. For multiple-choice items, every distractor should encode a real, identifiable misunderstanding, and the answer key should say which misunderstanding each distractor catches. The difficulty should come from choosing the crux: the question should be unanswerable by reciting a summary of the topic and should separate students who understand the issue from those who have memorized the labels. The asker specifies the level (intro, upper-level seminar, PhD comprehensive exam) and the constraints (time, length, total marks). This is the mirror image of the grading type: there the answer is given and the grade is requested; here the question and the standard are the deliverable.
   examples:
     - "I teach an upper-level philosophy of language seminar and I'm writing the final. I want one essay question on Frege's puzzle about identity that can't be answered by reciting the sense/reference distinction. It should make students confront why the distinction is supposed to handle 'Hesperus is Phosphorus' and belief reports at the same time, and where Kripke's point about necessary a posteriori truths bites. Please write the question, a model answer of about 600 words, and a marking scheme that separates an A from a B answer by naming the specific moves each must contain."
     - "For an intro philosophy of science course, write five multiple-choice questions on the underdetermination of theory by evidence. Four options each, and every wrong option should correspond to a misunderstanding students actually have -- e.g. confusing underdetermination with the theory-ladenness of observation, or thinking it implies that all theories are equally good. After the questions, give an answer key that says, for each distractor, which misunderstanding it is catching."
     - "I'm on the committee writing this year's ethics comprehensive exam for our PhD students. Draft one question on moral luck that a candidate could answer in 90 minutes, aimed at testing whether they can do more than summarize Nagel and Williams -- for instance, whether they can say what a control principle would have to look like to be plausible without being self-undermining. Give a model answer and a marking scheme built around five must-hit points, the marks each is worth (total 20), and a one-line note on how candidates typically get each wrong."
 - type: "Write a poem related to a concept"
   notes: |
        The verse sibling of the joke and short-story types. The asker should specify a form or constraint -- a sonnet, a villanelle, a limerick, a sestina, blank verse, a line count, a refrain -- and the philosophical content should do structural work: the poem's turn, refrain, or rhyme scheme should track something in the idea (a villanelle's returning lines for eternal recurrence or for a paradox that keeps reasserting itself; a sonnet's volta for the moment a theory meets its objection). The idea should be rendered accurately enough that a specialist would recognize it rather than merely name-dropped: someone who knows the theory should find the poem right, and someone who doesn't should find it a good poem. Prompts may also ask for verse for an occasion or audience (a poem to close a seminar, a mnemonic poem for students), for a poem in the voice of a proponent of some view, or for a poem in the manner of a historical poet whose style bears on the theme.
   examples:
     - "Write a villanelle from the point of view of Sleeping Beauty on the Monday awakening, in which the two refrains are the thirder's and the halfer's credences, and the form -- the refrains taking turns and finally meeting in the last two lines -- does the work of showing why the two positions keep passing each other. Someone who knows the problem should be able to tell which line is which and why they end up side by side."
     - "Write a sonnet about Bell's theorem in which the volta is the moment the reader realizes the choice isn't between locality and determinism but between locality and something stranger. Use the octave to build the naive picture of hidden variables fixed at the source, the turn to bring in the violation of the inequality, and the closing couplet to say exactly what has to go. It should be accurate enough that a philosopher of physics wouldn't wince."
     - "my reading group is finishing a semester on animal ethics and the last session is on wild animal suffering. i want to close with a short poem, maybe 12-16 lines, no fixed form, that takes seriously the thought that nature isn't a moral idyll (predation, parasitism, most animals dying young) without turning into either a sermon about intervention or a shrug about the circle of life. it should leave the tension open rather than resolve it, since thats honestly where our discussion ended up"
 - type: "Write a sorting quiz, decision tree, or taxonomy of the positions on a question"
   notes: |
        The deliverable is a classification instrument for a debate: a "which position do you actually hold?" quiz with a scoring key, a decision tree or flowchart that leads from a starting commitment to a named position, or a taxonomy in which each branch is labeled with the question that separates it from its siblings. The work is in the diagnostic questions: each should be a concrete case or claim on which the positions genuinely come apart, phrased so that someone can answer it without knowing the labels, so the instrument sorts people by what they believe rather than by what they call themselves. Where possible the tree should be built from the logical space rather than from a list of names: first the questions and the combinations of answers they allow, then the actual positions located in that space, with unoccupied combinations noted and briefly diagnosed (is nobody there because the view is incoherent, unattractive, or merely unexplored?). Positions the tree cannot separate should be flagged as such rather than papered over. To keep the prompt from being answerable by lifting an encyclopedia entry, the asker should specify an angle: which distinctions matter for their purpose, which positions must appear as leaves, or which cases must be used. The asker may also fix the audience and the size (number of questions or leaves). This differs from the comparison type (prose about two views) and from the ranking type (which evaluates rather than classifies).
   examples:
     - "I write a small philosophy blog and want to make a 'which theory of personal identity do you actually hold?' quiz. Eight to ten questions, each a concrete case (teleporter, fission, gradual neuron replacement, total amnesia, ...) with two or three answer options, and a scoring key mapping answer patterns onto psychological continuity with and without the no-branching clause, animalism, narrative views, and the deflationary no-self option. The point is to sort readers by what they say about cases, not by which label they like, so no question should just ask 'do you think you are your body?'"
     - "For a philosophy of physics seminar, write a decision tree that takes a student from 'I accept that the Bell inequalities are violated experimentally' to a named position. Each branch node should be one of the theorem's assumptions (factorizability, measurement independence, single outcomes, and whatever else you think belongs on the tree), and each leaf an interpretation: Bohmian, Everettian, superdeterminist, QBist or Copenhagen-style, retrocausal. Phrase every node as a question a student could answer without already knowing which interpretation it leads to, and flag any pair of leaves your tree can't really separate."
     - "I'm making a handout for an applied ethics class on whether we should intervene to reduce suffering in nature -- vaccinating wild animals, reducing predation, that sort of thing. Please write a taxonomy of the positions as a tree where each branch is labeled by the claim that splits it: whether wild animals' welfare counts at all, whether naturalness has value of its own, whether our record of ecological intervention gives a decisive practical reason against, whether the sheer scale of the suffering changes what is obligatory. Each leaf should carry the name of the position (or 'unnamed' if nobody defends it) and one sentence on its most awkward commitment."
 - type: "Design a classroom activity or game that makes participants feel the force of an idea"
   notes: |
        The deliverable is a runnable activity for a group -- a game with rules and payoffs, a role-play or structured deliberation, a simulation, a thought experiment staged with real choices or real (small) stakes -- plus a debrief. The asker should specify the setting (a seminar, a high-school class, a workshop, a reading group), the group size, the time available, and what participants should come away seeing. The idea should show up in what happens, not in what the facilitator says afterwards: the rules, incentives, or roles should be arranged so that participants run into the problem themselves (the coordination failure, the paradox, the intuition that then gets undermined) before it is named. The debrief should map moments in the activity onto parts of the idea, say what will predictably go wrong when the activity is run and how to handle it, and be frank about which feature of the idea the activity cannot reproduce and the facilitator must supply. Formal domains lend themselves to games with payoffs; ethical and metaphysical domains to role-plays, staged cases, forced choices, and deliberations under constraints. This differs from the exam-question type (assessment) and the example type (a described case): here the participants do something.
   examples:
     - "I teach an intro to game theory for philosophy students -- about 20 people, one 50-minute session. Design an in-class game that makes them feel the difference between mutual knowledge and common knowledge: the point where everyone knows the relevant fact, and knows that everyone knows it, and coordination still fails. Rules, materials, a payoff scheme that doesn't need real money, and a debrief that maps what happened to the formal distinction. Also tell me what will predictably go wrong the first time I run it."
     - "I run a philosophy club at a high school, about 15 students aged 16-17, one hour. Design an activity that gets them to feel the pull of the repugnant conclusion. Ideally they should construct the sequence of steps themselves and only notice where they've arrived at the end. Then a debrief that shows them where each step could be resisted and what it costs to resist it there. No lecture up front, and they shouldn't hear the name until afterwards."
     - "For an upper-level seminar on vagueness (12 students, 90 minutes), design a structured activity around the sorites paradox that makes epistemicism feel less crazy than it does on the page -- something where the group has to act as though there is a sharp cutoff and then discovers what they can and can't know about it. Include roles or rules, a timeline, the debrief, and an honest note on which feature of the view the activity can't reproduce."
 - type: "State a set of one's own commitments and ask whether they hang together"
   notes: |
        The asker lists several things they believe within a domain -- a handful of theses, verdicts on cases, methodological preferences, or a mix -- and asks whether the set is jointly tenable: which commitments pull against each other, which pairs are only apparently in tension, and what the cheapest way to restore consistency is and what it costs. Write the belief set so that it is largely reasonable and recognizably held by a real kind of person, and so that it contains one or two genuine tensions that are not obvious -- two views that are each standard but whose usual motivations are incompatible, or a case verdict the asker's stated principle cannot deliver -- plus at least one apparent tension that dissolves on inspection, so a good answer has to discriminate rather than flag everything. The asker should not know where the problem is and should not signal which commitment they would give up. The deliverable is an audit, not a lecture: the tensions, ordered by severity, each with what would have to give. This differs from the false-presupposition type (one question, one confusion) and from adjudication (a dispute between others): here the asker's own position set is the object, and the work is tracing what commits them to what.
   examples:
     - "ok so here's roughly where I've landed and I'd like to know if it hangs together: (1) I one-box in Newcomb's problem, (2) I think you should pay the driver in Parfit's hitchhiker, (3) I think it's irrational to pay in the counterfactual mugging because the coin has already landed, (4) I think the correct decision theory shouldn't depend on when you happen to first think about a problem. Is this a consistent package, or am I helping myself to something in (3) that (1), (2) and (4) rule out? Be specific about which one has to go."
     - "I'm writing up my views for a metaethics seminar and want a consistency check before I present. I hold: (a) moral realism, in the sense that there are mind-independent moral facts; (b) that evolutionary debunking arguments show our moral intuitions to be unreliable guides to such facts; (c) that reflective equilibrium is nonetheless the right method in ethics; (d) that the moral facts are knowable, at least in principle. Which of these are actually in tension, which only look like they are, and what is the least costly revision? Please rank the tensions by severity rather than listing them all as equally bad."
     - "For a reading group I've been asked to write down my philosophical profile on consciousness so the others can poke at it. Here it is: I'm a physicalist; I think the zombie scenario is conceivable; I think conceivability is a fallible but real guide to possibility; I think phenomenal concepts are special in a way that explains the explanatory gap; and I think there is nothing it is like to be a thermostat. Go through these and tell me which pairs are in tension and how badly. For each pair in tension, say how severe it is and what the cheapest fix would be, and then tell me which single revision would clean up the most."
 - type: "Take a slogan, proverb, or one-liner and ask what precise claims it could be making"
   notes: |
        The prompt quotes a slogan, proverb, motto, or oft-repeated one-liner that belongs to the domain -- 'meaning is use', 'ought implies can', 'correlation is not causation', 'the map is not the territory', 'nature knows best', 'you can't get an ought from an is', a line from a famous thinker that has come loose from its context -- and asks what it actually amounts to: the distinct precise theses it could be expressing, which of them are trivial, which are substantive and defensible, which are false, and which the people who repeat it probably mean. The asker should say where they met the slogan and what work it was being made to do there, since the precisification that matters is usually the one the argument needed. A good answer lays the readings out as a menu rather than picking one and explaining it, and says which readings would actually support the use the slogan was put to. This differs from the explain type, whose object is a concept or theory: here the object is a piece of language, and the deliverable is a disambiguation with verdicts. Slogans and proverbs can be given in their commonly repeated form without attribution; attribute a line to a specific author only if the attribution is verified.
   examples:
     - "My linguistics professor keeps saying 'meaning is use' as if it settles things, most recently to dismiss a question about whether a sentence nobody has ever uttered has a meaning. What are the different things that slogan could actually be claiming, from the trivial to the radical, and which of those readings would actually support dismissing my question? Lay the readings out as a list I can bring to office hours."
     - "In a debate about climate obligations someone shut down my argument with 'ought implies can': since no individual can fix the climate, no individual ought to try. I'm sure something is wrong with that but I can't say what. Can you lay out the different precise principles 'ought implies can' might stand for -- what kind of 'can', whose ability, at what time -- and say for each whether it's plausible and whether it actually gets him his conclusion?"
     - "Longtime LessWrong reader here. 'The map is not the territory' gets used around me for everything from 'your model is wrong' to 'all models are wrong' to something almost Kantian about never touching reality at all. Separate the precise claims hiding in that one sentence, say which are platitudes, which are contentious, and which are actually false, and tell me which reading is being invoked when someone uses it to end an argument about whether probabilities are 'in the world'."
 - type: "Write a short research proposal"
   notes: |
        The asker wants a proposal document -- for a fellowship or grant application, a dissertation prospectus, a term-paper plan, a workshop pitch -- on a question in the domain: the question stated precisely, why the existing answers leave it open, the approach that would make progress and why that approach rather than the obvious alternatives, what a result would look like and what would count as failure, and a realistic scope for the time available. The conceptual work is in the framing: finding a question that is both open and tractable, and an angle on it that is not the standard one. The asker may bring a half-formed idea to be turned into a proposal, or ask for one from scratch on a specified topic. To keep prompts answerable without web access and to avoid invented references, the asker should not request a bibliography or a literature review by citation: the proposal may refer to positions and arguments, and the asker can say they will fill in citations themselves. This differs from the essay type (which defends an answer) and from the comments-on-an-essay type (which evaluates a draft): the deliverable is a plan for work not yet done, and it has to argue that the work is worth doing and can be done.
   examples:
     - "I'm applying for a one-year dissertation fellowship and need a two-page proposal. My half-formed idea: the debate between Fregeans and Millians about names has stalled partly because both sides treat 'cognitive significance' as a single thing, and I suspect splitting it into two or three notions would dissolve some of the standard puzzle cases and sharpen the rest. Turn this into a proposal with a precise statement of the question, why the existing positions leave it open, the method (what I would actually do, month by month), and what would count as the project failing. Don't bother with citations, I'll add those."
     - "Write a proposal for a philosophy-of-physics term paper (about 6000 words, one semester) on whether the measurement-independence or 'freedom of choice' assumption in Bell's theorem is a substantive physical assumption or a methodological one that no science can do without. State the question so that it has a determinate answer, explain the approach, say what the possible conclusions are and which considerations would decide between them, and give an honest assessment of what could make the project too big for a semester."
     - "I run a small research nonprofit and we're pitching a foundation for a six-month project on wild animal welfare. The question we want funded: does the badness of suffering in nature create obligations for us that are stronger, weaker, or just different from our obligations to domestic animals, and does the answer depend on whether the suffering has a human cause? Write the one-page proposal: the question, why the existing positions don't settle it, how a philosophical rather than empirical project makes progress on it, what a useful deliverable looks like for people actually deciding on interventions, and what we'd say if someone asked why a foundation should fund philosophy here."
 - type: "Ask which open questions, implications, or lines of work in an area matter most, and why"
   notes: |
        Prioritization and agenda-setting questions: what the main open questions in an area are and which are most worth working on; which implications of a result or debate matter most for some practice -- politics, law, science, one's own life plans -- and which are overrated or don't follow at all; where limited resources (a career, a research group, a grant, a semester) should go and why. In EA- and AI-safety-flavored domains these are the classic macrostrategy questions: which considerations should most change how effort is divided between approaches, which crux most of the work implicitly depends on. But every domain has them: which unresolved problem in the philosophy of time is tractable for someone with three years, which of the free-will debate's implications for criminal justice carry real weight. A good prompt fixes what the prioritization is for -- whose effort, how much of it, toward what end -- since importance is relative to that, and asks for the ordering to be defended: the criteria used (importance, tractability, neglectedness, how many other questions depend on this one), the trade-offs between them, and what would change the ranking. The deliverable is a defended agenda, not a survey, and not a reading list. This differs from the implications type (one result applied to one concrete situation) and from the ranking type (an evaluation along any given dimension): here the question is what deserves attention or effort.
   examples:
     - "Suppose you're advising a funder who can support about ten researchers for three years on conceptual AI alignment work -- philosophy and theory, not empirical ML. Which open conceptual questions should they prioritize, and in what order? I'm less interested in the list than in the reasoning: for each, why it's upstream of other work, how tractable it is for philosophers rather than ML people, and what evidence over the next couple of years would move it up or down the list."
     - "I'm a second-year PhD student trying to pick a dissertation area within the philosophy of time. What do you think are the main open questions there right now, and which two or three would you actually prioritize for someone with about three years and a background in logic rather than physics? Please defend the ordering: I want to know what makes a question worth the years, not just that it's unresolved."
     - "The free will debate comes with lots of alleged implications for criminal justice -- retributivism, the death penalty, blame, sentencing. Which of these matter most if you take the case against libertarian free will seriously, and which are overrated or don't follow at all? Rank them and explain the ranking. I'm writing a long-form piece and want to focus on the two or three implications that would genuinely change policy if people took them on board."
     - "Within decision theory, which unresolved question -- the status of updatelessness, how to handle logical uncertainty, the choice between causal and evidential conditioning, or something I'm not listing -- is most worth settling first, in the sense that the most other questions depend on its answer? Give me a dependency-aware prioritization: which questions are upstream of which, which are tractable with current tools, and which you'd deprioritize because their answer wouldn't change much downstream."
 - type: "Present an argument that seems to prove too much and ask where it goes wrong"
   notes: |
        The asker lays out an argument -- their own, a friend's, one they read -- whose premises each seem plausible and whose conclusion they cannot accept, and asks which premise or step to reject and what rejecting it costs. Write the argument out with numbered premises or clearly marked steps, and make it genuinely hard in one of two ways: either it contains a subtle flaw (an equivocation between steps, a scope or quantifier shift, a modal slide, a step that is valid only under a reading the premises don't support), or it is valid and the real question is which plausible premise is least costly to give up. Don't announce which kind it is, and don't let the asker signal the answer, though the asker may say which claims they would most like to keep. A good answer names the step, explains why it looked fine, and prices the alternatives. This differs from the false-presupposition type (a single question resting on a confusion), from the commitments type (a set of theses in tension, with no argument connecting them), and from the grading type (someone else's exam answer, evaluated by a grader): here a chain of reasoning is the object and the deliverable is a diagnosis.
   examples:
     - "A friend walked me into this and I can't find the exit. (1) Whether I should do X depends only on what X causes. (2) In Newcomb's problem, taking both boxes doesn't cause the opaque box to be empty; that was settled before I chose. (3) So taking both boxes is right in Newcomb's problem. (4) The same reasoning applies whatever the predictor's accuracy, including a perfect one. (5) But with a perfect predictor, two-boxers predictably walk away with $1,000 and one-boxers with $1,000,000, and a theory of rational choice that predictably makes you poorer is a bad theory. (6) So (1) is false. He says this shows causal decision theory refutes itself. I feel like something slipped between (4) and (5) but I can't name it. Which step do you reject, and what does rejecting it cost?"
     - "Here's an argument I built for a seminar and now find suspicious because the conclusion is absurd. (1) If it would be wrong to let a child drown in a pond to avoid ruining your shoes, then physical distance makes no moral difference. (2) If distance makes no difference, then neither does the number of other people who could help, since each of them faces the same choice. (3) So each of us is required to give to famine relief up to the point of marginal utility. (4) By the same reasoning each of us is also required to spend every waking hour on relief work, since time, like money, is a resource we could give. (5) Nobody is obligated to do that. (6) Therefore (1) is false and distance does matter. Where does this go wrong, if it does? If I have to choose, I'd rather keep (1) than (5), but I want to know what I'm paying."
     - "My study group has an argument that seems to show there are no beliefs about specific people. (1) Lois believes Superman can fly. (2) Superman is Clark Kent. (3) If a is b, then whatever is true of a is true of b. (4) So Lois believes Clark Kent can fly. (5) Lois would sincerely deny that Clark Kent can fly, and someone who sincerely denies p does not believe p. (6) So Lois both believes and does not believe that Clark Kent can fly, which is impossible. (7) Therefore beliefs are not about the people they seem to be about. Tell me which premise to give up, then explain why that premise looked fine and what the standard positions -- Fregean, Millian, hidden-indexical -- each have to pay to reject it."
 - type: "Set up a role-play and make the opening move"
   notes: |
        The asker wants a conversation partner rather than a document: the model is to take a role -- a committed proponent of some view, a historical figure speaking for themselves, a Socratic tutor who may only ask questions, a skeptical referee, a patient explainer for a specific audience -- and hold it across turns. Since the dataset contains single prompts, the prompt must make the first reply well defined: specify the role and its constraints (what the character believes, what they will and won't concede, how they talk, whether they may break character), and include the asker's own opening move -- a claim, a question, a challenge -- so the model's first turn is a response in character rather than a request for clarification. Give the character a real position with real resources, not a caricature, and set up a genuine contest: the opening should be a move the character actually has to deal with. Prefer historical figures or unnamed proponents over living people. Variants: the asker may ask the model to play the asker's own position back at them so they can practice objecting, or to play a tutor who is not allowed to state the answer. This differs from the dialogue type (a finished two-character text) and from the historical-figure type (a prediction of someone's views in the model's own voice): here the model speaks in the first person as one side of a live exchange.
   examples:
     - "I want to practice defending evidential decision theory against a smart opponent. Please play a committed causal decision theorist -- sharp, not a strawman, willing to concede small points but never the main one -- and stay in character until I say 'stop'. Keep your replies to a paragraph so it feels like a conversation. Here's my opening: in Newcomb's problem you two-boxers keep insisting the money is already there or it isn't, but your own theory tells you to expect to walk away with a thousand dollars. Doesn't a theory of rational choice that you yourself expect to make you poorer have a problem?"
     - "Play Leibniz. You have just been given a careful description of how a modern large language model works -- weights, training on text, next-token prediction -- and you may use only the concepts available to you in 1714 plus what I have just told you. I am going to ask you whether such a machine could have perceptions in your sense. Stay in character; if you need a factual question answered about the machine, ask it as Leibniz would. My first question: your mill argument says that if we walked into a mill enlarged to the size of a building we would see only parts pushing one another, never a perception. Suppose we walk into this machine instead. What do we see, and what follows?"
     - "be a socratic tutor for me on the problem of induction. rules: you can only ask questions, one at a time, never tell me the answer or name a philosopher unless I do first, and each question has to build on my last answer. if I get confused, ask a simpler question, don't explain. my starting position: I think induction is justified because it's worked so far. go."
 - type: "Describe a phenomenon and ask whether it has a name"
   notes: |
        The asker describes, in their own words, a pattern they have noticed -- a recurring move in arguments, a kind of situation, a distinction they keep needing, a failure mode of a theory -- and asks whether there is an established concept or literature for it. Write the description concretely and without the technical vocabulary that would give the answer away, the way someone who has noticed the thing but doesn't know the field would; a couple of instances are better than an abstract statement. The description should either fit an established concept only imperfectly, so that a good answer has to say what the nearest concepts are, how the described thing differs from each, and which fits best, or fit nothing established, so that a good answer says so and coins a term with a definition and boundary cases. The label is not the point; the carving is: what exactly the phenomenon is, what it is not, and where its edges are, so make clear that the asker won't be satisfied with a bare name. This differs from the explain type (where the concept is named in the prompt) and from the advice type (where the asker wants guidance rather than identification).
   examples:
     - "Is there a name for this? In arguments I keep seeing people defend a claim by retreating to a weaker version when attacked, and then, once the attack has passed, going back to using the strong version as if it had been defended. It's not quite motte-and-bailey, because the two versions aren't a defensible core and an indefensible extension -- they're more like two equally contentious claims that happen to share a slogan. Is there an established concept for this exact thing, and if not, can you name and define it in a way that distinguishes it from motte-and-bailey and from plain equivocation?"
     - "I'm looking for the established term, if there is one, for the following configuration. A policy benefits every individual who will exist under it, but the set of individuals who exist depends on which policy is chosen, so nobody can complain about either policy, and yet the two produce very different amounts of total welfare. I know this is somewhere near the non-identity problem, but that is usually stated for cases where one option is worse for the people it creates; here nobody is worse off under either option. Does this configuration have a name of its own, and how exactly does it relate to person-affecting views?"
     - "Retired engineer here, reading philosophy of science for fun. I keep noticing a pattern I don't have a word for. A theory makes a prediction, the prediction fails, and instead of abandoning the theory people add a rule about when the theory applies -- 'except at very small scales', 'except in living systems' -- and each added rule makes the theory harder to test, but nobody counts that as a strike against it, because each rule is individually reasonable. I know Popper had things to say about this general area, but I'm after the specific concept for the slow accumulation of individually reasonable exceptions. Does it have a name, how is it different from an ordinary auxiliary hypothesis, and if there is no name, what would you call it?"
 - type: "Report one's verdicts on a set of cases and ask what principle captures them"
   notes: |
        The asker gives their own verdicts on several concrete cases -- this one is fine, that one isn't, these two feel different though they look alike -- and asks what principle, if any, captures the pattern, what it says about further cases, and whether some of the verdicts have to go. Write the cases concretely and the verdicts as a real person would have them: mostly sensible, with at least one pair that is hard to reconcile, so that the answer has to choose between a principle that saves every verdict at the price of complexity and a simpler one that overturns a verdict. The asker may instead offer a tentative principle of their own and ask for it to be tested against the cases and repaired. The deliverable is a principle, or a small set of candidates, stated precisely, with the case that motivates each clause, its verdicts on cases the asker hasn't considered, and an honest statement of which of the asker's verdicts it cannot accommodate. This is reflective equilibrium done on request: it differs from the commitments type (theses in tension, no principle sought), from the advice type (one situation, guidance wanted), and from the example type (the principle is given and cases are wanted).
   examples:
     - "I'm trying to figure out what I actually think about lying, going by my gut on cases. Telling a murderer at the door that my friend isn't home: fine. Telling my aunt I love the sweater: fine. Telling a job interviewer I left my last job voluntarily when I was fired: not fine. Telling a dying patient who asks that their estranged son called: not fine, even though it would comfort them. Telling a friend their business plan is good when it isn't: not fine. Writing 'the check is in the mail' when it isn't: not fine, but somehow less bad than the interview one. Is there a principle that gets all of these, or close, and what does it say about the case I keep going back and forth on -- telling my kid the dog went to live on a farm?"
     - "Here are my intuitions about reference, and I'd like to know what theory they add up to. When Donnellan's speaker says 'the man drinking a martini' about someone drinking water, I think he refers to that man. When someone has only ever heard the false story that Gödel stole the incompleteness theorem from a man named Schmidt, I still think their 'Gödel' refers to Gödel. When a community's use of 'Madagascar' drifts from the mainland to the island, I think the reference shifts. But when a single speaker consistently uses 'elm' for beeches, I don't think 'elm' means beech in his mouth. Is there one account of reference determination that delivers all four verdicts, and if not, which would you overturn and why? Please also say what the resulting account predicts for a case I haven't listed."
     - "My verdicts on when a theory has been confirmed, and I want the principle behind them, if there is one. The perihelion of Mercury strongly confirms general relativity even though the anomaly was known before the theory. A theory tuned after the fact to fit an anomaly is barely confirmed by fitting it. Two theories that make the same prediction, which then comes true, are both confirmed, but I feel the simpler one is confirmed more. A prediction that was almost certain to come true anyway confirms hardly at all. A surprising prediction that comes true confirms a lot. But I also think a theory that predicts something surprising and is then tuned to explain why the prediction failed has been disconfirmed, not left where it was. Is there a coherent account of confirmation behind all this, and which of my verdicts does it force me to drop?"
 - type: "Prepare a speaker for the objections a specific audience will raise"
   notes: |
        The asker is about to present a position -- a talk, a job-market paper, a thesis defense, a seminar presentation, a pitch to a skeptical board -- to a specified kind of audience, and wants to be ready for the question period: the objections they will actually get, from whom, in what form, how serious each is, what to concede and what to hold, and how to reply in the time available. The prompt should state the thesis being defended and describe the audience precisely (their field, their likely commitments, what they care about), since the same thesis draws different objections from decision theorists, from Kantians, from physicists, and from a grant committee. A good answer is a prep sheet, not a defense: the objections ordered by how likely and how damaging they are, phrased the way that audience would phrase them, each with a short reply and a note on where the reply is weakest, and including the objection the speaker is hoping nobody asks. This is the mirror of the interview-questions type: there the asker is the questioner and wants questions; here the asker is the speaker and wants the questions plus what to say back. The asker may supply a sketch of their argument for the objections to target.
   examples:
     - "I'm giving a job talk next month defending a version of updateless decision theory to a department that is mostly mainstream epistemologists plus a couple of Bayesian statisticians, no decision theorists. Draft my Q&A prep sheet: the eight or so objections I'll actually get from this audience -- not the ones I'd get from the LessWrong crowd -- ordered by how much damage they'd do, each phrased the way an epistemologist would put it, with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks."
     - "I sit on the board of a wildlife charity, and next week I'm presenting the case for a small pilot program vaccinating wild animals against a painful disease to a board that is mostly conservation biologists who think of nature as something to protect from interference. Prepare me for the questions: what will they object to, in their vocabulary, which objections have real force, what should I concede up front, and what is the one reply that has to land for the proposal to survive?"
     - "Next week I present to a philosophy of physics reading group my view that the many-worlds interpretation doesn't solve the probability problem but only relocates it. The group has two committed Everettians who know the decision-theoretic derivations of the Born rule inside out, plus several agnostics. Give me the objections in roughly the order they'll come, phrased as those two would phrase them, with what I should concede, what I should hold, and the weakest point in my own position that I should prepare to defend rather than hope they miss."
 - type: "Write the desiderata a theory in an area must meet"
   notes: |
        The asker wants a specification: what a theory of X has to be able to do to count as adequate -- the phenomena it must explain, the cases it must get right, the distinctions it must respect, the results it must be consistent with -- with the case or consideration behind each requirement, and a view on which requirements are negotiable and which are not. Optionally, the main existing contenders scored briefly against the list. The conceptual work is in the requirements: which of the things people demand of a theory in this area are genuine desiderata and which are prejudices of one camp, whether some subset of the desiderata is jointly unsatisfiable (in which case the list itself is a result), and which requirement does the most to exclude candidates. Keep the weight on the criteria and their motivating cases rather than on the scoring, since the scoring leans on knowing the contenders and the criteria are where the thinking is. The asker can fix the purpose (a theory good enough for what?), since adequacy is relative to it. This differs from the ranking type (an evaluation along a given dimension) and from the comparison type (two views in prose): here the standard of evaluation is itself the deliverable.
   examples:
     - "Before I read any more theories of reference for proper names, I want to know what I should be asking of one. Write the desiderata: what any adequate theory of how a name gets its referent has to deliver -- which cases it must get right, which puzzles it must dissolve or explain, which distinctions it must respect -- with the case behind each, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, how descriptivism, the causal-historical picture, and a two-dimensional view do against the list."
     - "For a philosophy of physics seminar, write the list of requirements an interpretation of quantum mechanics must meet to count as solving the measurement problem, with the consideration behind each, and mark which are non-negotiable and which are preferences of particular camps (locality, determinism, no preferred basis, empirical equivalence with textbook quantum mechanics, and so on). If some subset of the requirements is jointly unsatisfiable given Bell's theorem or other no-go results, say so -- that is the part I most want to see. Skip the scorecard, I'll do that in class."
     - "what would a theory of moral status actually have to get right? I keep seeing people argue for and against giving moral weight to insects or wild animals or future people by pointing at one case, and I'd like the full spec first. give me the requirements list -- the cases it has to handle, the distinctions it can't collapse (like between having status and how much), the results from biology it can't contradict -- with why each is a requirement, and tell me which single requirement knocks out the most popular theories. a table is fine"
 - type: "Present an analogy in common use and ask how far it holds"
   notes: |
        The prompt gives an analogy that people in the area actually lean on -- the brain is a computer, entanglement is like a pair of socks separated in the mail, the market is an ecosystem, training a model is like raising a child, sense is a route to the referent, natural selection is a designer -- together with the work the analogy is being made to do in the asker's context (who used it, to license what conclusion), and asks how far it holds: what maps onto what, where the mapping breaks, which features of the source the analogy quietly imports that the target lacks, and whether the conclusion it was used to support survives once the disanalogies are on the table. A good answer gives the mapping explicitly (a table of correspondences is fine), separates the disanalogies that matter for the intended use from the ones that don't, and says what a better analogy would be if there is one. The asker may present the analogy as their own, as an opponent's, or as a textbook's. This differs from the slogan type (a phrase to be precisified) and from the comparison type (two theories weighed on their merits): the object is a comparison someone is using as an argument, and the deliverable is an audit of what it can and cannot carry.
   examples:
     - "A popular book I'm reading explains entanglement with Bell's own example of Bertlmann's socks: if you see that one sock is pink you know the other isn't, and no spooky influence is needed. The book then says entanglement is just like that and that people who talk about nonlocality are confused. My physicist friend says the socks are exactly the picture Bell was refuting. Can you lay out what maps onto what, where the sock picture breaks down, and whether the book's conclusion -- no nonlocality worth the name -- survives once the disanalogies are in?"
     - "everyone in my circles keeps saying training a model is like raising a child: you shape values by exposure and feedback, you can't specify them directly, and you have to trust the outcome. it's used to argue we should be more relaxed about alignment. how far does it actually hold? give me the correspondence table -- what plays the role of the parent, the genes, the culture, the eighteen years -- then the places it breaks, and tell me whether the relaxed conclusion survives or whether the analogy was carrying it the whole time"
     - "In debates about intervening to reduce wild animal suffering, opponents often say an ecosystem is like a body -- remove a predator and it's like removing an organ -- so intervention is inherently harmful. Others say nature is like a war zone, where we would obviously help the wounded. Audit both analogies: what corresponds to what, where each breaks, what each smuggles in about the value of the whole versus the parts, and which conclusion, if any, either of them can actually support."
 - type: "Ask why a debate has stalled and what kind of disagreement it really is"
   notes: |
        The asker points to a dispute that has gone on for a long time without resolution -- in the literature, in a field they work in, or among people they know -- and asks for a diagnosis rather than a verdict: is the disagreement verbal or substantive; do the sides differ about facts, about standards of evidence, about which cases count as data, or about starting intuitions that neither side can argue for; is a hidden empirical or formal question doing the work; are the sides answering different questions under one name; is the impasse a sign that the question is ill-posed, or just that it is hard. The deliverable is the diagnosis, supported by what each side actually says, together with what would count as progress given that diagnosis -- a distinction, an experiment, a formal result, a change of question -- or an argument that no progress should be expected and why. The asker should describe the debate and the positions concretely enough for the diagnosis to engage them, and may offer a hypothesis about the diagnosis, presented as a hypothesis. This differs from adjudication (a specific exchange, verdict wanted), from the comparison type (views weighed on their merits), and from the prioritization type (what to work on): here the object is the structure of the disagreement itself.
   examples:
     - "The Fregean versus Millian debate about proper names has been going since the 1970s and, as far as I can tell, every argument on both sides is well known and nobody moves. Is this a substantive disagreement, a verbal one about the word 'meaning', or two groups answering different questions -- one about semantics, one about cognition -- under a single heading? Diagnose it using what each side actually says, and tell me what, if anything, would count as progress."
     - "In my animal ethics reading group the argument about whether to intervene in nature has stalled in a way I find frustrating: everyone agrees on the facts about suffering, everyone agrees suffering is bad, and yet the interventionists and the non-interventionists haven't moved an inch in a year. What kind of disagreement is this, actually? A hidden factual question, a difference about what counts as a moral reason, or bedrock intuitions about naturalness that neither side can argue for? And given your diagnosis, is there anything that would move it?"
     - "Interpretations of quantum mechanics have been debated for a century by extremely smart people with the same equations and the same experimental results. My working theory is that the disagreement isn't about physics at all but about what an explanation has to do. Is that right, or is it a real empirical or formal disagreement in disguise? I want a diagnosis with reasons, not a survey of the interpretations, and an honest answer about whether anything -- a new experiment, a theorem, a conceptual distinction -- could actually end it."
 - type: "Present someone's summary of a view or result and ask whether it is fair"
   notes: |
        The asker has met a characterization of a view, argument, or result -- a paragraph from a popular book or article, a textbook gloss, an encyclopedia summary, an opponent's account of the position, a friend's confident one-liner -- and wants to know what to trust: which parts are accurate, which are subtly wrong, what a defender of the view would object to, and whether the conclusions drawn from the summary survive its correction. Write the summary yourself and make it plausible: mostly right, in the voice of a competent popularizer or a confident opponent, with one or two subtle misrepresentations -- a conflation of two claims the view keeps apart, an overstatement of a modest thesis, a standard objection presented as a refutation, a technical term used in its everyday sense -- and no howlers. Do not reproduce a real author's text; attribute the summary to an unnamed book, article, professor, or friend. The asker is a reader, not a grader, and doesn't know where the errors are, though they may say what they are inclined to believe. This differs from the grading type (an exam answer graded by the instructor) and from the false-presupposition type (the asker's own confusion, embedded in a question): here a third party's characterization is the object, and the deliverable is an accuracy audit the asker can act on.
   examples:
     - "A popular science article I read summarizes Bell's theorem like this: 'Bell proved that quantum particles communicate faster than light. When you measure one particle, it instantly sends a signal to its partner telling it what state to be in, which is why Einstein called it spooky action at a distance and why quantum mechanics is incompatible with relativity.' How much of this is right? Go sentence by sentence and tell me what a physicist working on foundations would accept, what they'd wince at, and what is just wrong -- and whether the article's later claim that this makes faster-than-light messaging possible in principle follows from anything true in the summary."
     - "My roommate summarized utilitarianism for me as 'the view that the ends justify the means, so a utilitarian has to say it's fine to harvest one person's organs to save five, and since nobody accepts that, utilitarianism is refuted.' I suspect this is unfair but I don't know enough to say where. Which parts would a careful utilitarian accept, which are misrepresentations, and does his conclusion follow from the accurate parts?"
     - "Our intro textbook glosses Frege's distinction like this: 'The sense of a name is the idea the speaker associates with it, and the reference is the object. Since different speakers have different ideas, senses are subjective, which is why Frege thought communication is only ever approximate.' Something about this seems off given what I've heard about Frege's anti-psychologism, but the textbook is by a professional. Is this a fair summary? Please separate what is accurate, what is a common simplification, and what Frege explicitly denied."
 - type: "Turn a principle or theory into a procedure a practitioner can follow"
   notes: |
        The asker has to apply an idea repeatedly in a practical role -- a clinician, a referee or editor, a journalist, a conservation officer, a compliance officer, a teacher grading, an engineer writing a spec -- and wants it operationalized: a checklist, a decision procedure, a flowchart in words, a set of tests to run in order, with the hard cases the procedure must handle and the points where judgment cannot be eliminated marked as such. The conceptual work is in the translation: keeping what the principle actually says while making it usable by someone without the theory, deciding which distinctions must survive the simplification and which can be dropped, and being honest about where the procedure will misfire. A good answer includes worked applications to two or three cases, including one where the procedure gives an answer the asker will not like, and says what the procedure cannot do. Prompts should fix the role, the frequency and stakes of the decisions, and the constraints (time, expertise, who has to sign off). This differs from the advice type (one situation) and from the memo type (one decision by one body): the deliverable is a reusable procedure.
   examples:
     - "I work for a regional wildlife agency, and increasingly we get proposals to intervene for the welfare of wild animals -- feeding during hard winters, vaccination, culling to prevent starvation, rescuing individuals -- with no framework for deciding. Please write a decision procedure my team could actually run on a proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then run it on two proposals: vaccinating a badger population against a painful disease, and culling deer to prevent a winter die-off."
     - "I'm a science journalist and I want a checklist for deciding how much a single study should move my beliefs, based on whatever formal epistemology has to say about this that is actually usable -- priors, base rates, the difference between a result being unlikely under the null and the hypothesis being likely. It has to be something I can run in ten minutes before a deadline, it should say what to do when I can't get a number, and it should be honest about which steps are judgment calls dressed up as procedure. Apply it to a hypothetical: a single forty-person study finding that a common supplement improves memory."
     - "I edit a magazine and we keep getting complaints that our fact-checkers changed what a sentence says by substituting one name for another -- 'the senator' for the person's name, a maiden name for a married name, 'the author of the report' for the author -- in belief reports, quotations, and headlines. Write a procedure our copy editors can follow to decide when such a substitution is safe and when it changes the claim, grounded in whatever the philosophy of language actually knows about this, with a small set of test sentences they can apply and a worked example of each kind. Flag the cases the procedure can't settle, where an editor has to decide."
 - type: "Present a position and ask what would count against it"
   notes: |
        The asker names a position -- their own, one they are considering, one that dominates their field -- and asks what would have to be true for it to be false: which observations, arguments, intuitions, formal results, or developments would count against it, what it predicts that its rivals don't, and whether it risks anything at all or has been insulated by qualifications. The answer should distinguish evidence that would be decisive from evidence that would merely be awkward, should say what the position's defenders would themselves concede as counting against it (not only what critics say), and should be willing to conclude that a position is well insulated and that this is or is not a problem. Positions in metaphysics, ethics, and philosophy of language have defeaters too: a consequence the view is committed to that turns out unacceptable, a case it cannot describe, a result showing it collapses into a rival. The asker may add what they would personally find most persuasive. This differs from the commitments type (consistency of a set of one's own views) and from the stalled-debate type (the structure of a dispute): here a single position is the object, and the deliverable is a map of its exposure -- what it risks, and where.
   examples:
     - "I hold the view that sufficiently capable AI systems will by default pursue goals their designers didn't intend -- roughly the instrumental convergence story. What would count against it? I want the evidence and arguments that should move me, sorted by how decisive they'd be, including things that have arguably already happened, plus an honest assessment of whether the view has been qualified into unfalsifiability -- and if it has, whether that is a problem for a view of this kind."
     - "I've come to accept the psychological continuity theory of personal identity. Tell me what would count against it -- not just the standard fission objection, but which intuitions, which possible cases, and which results in other areas (say, about persistence in general) it stands or falls with. Which of these would a committed psychological continuity theorist concede as counting against them, and which would they dismiss? I'd like the defeaters ranked from fatal to merely awkward."
     - "The view that quantum mechanics is nonlocal in a way that rules out any local hidden-variable account is treated as settled by Bell's theorem plus the loophole-free experiments. Play it straight: what would have to be true for that conclusion to be wrong? Which assumptions of the theorem could in principle fail, what would the world have to look like for each, and which of these escape routes are live rather than merely logically possible? I want an honest assessment of how exposed the standard conclusion actually is."
     - "I keep coming back to a blog post by Caspar Oesterheld, 'The basic argument for making AI better at moral philosophy' (September 2026). Here it is in full, quoted exactly, with the headings kept as markdown; the appendix is part of the argument, so I have included it too:\n\n---\n\nIn this post, I try to briefly make the case for making models good at moral philosophy. To be up front, aside from some niche areas of moral philosophy, I don’t actually think this is the _most_ important thing to work on for most people. But, depending on the exact scope, I do think it’s near competitive. I also like it as an archetype for a broader set of interventions.\n\nAfter a brief preface (related to the archetype point), the main text of the post is structured as follows:\n\n- I say what I mean by moral philosophy. I point out some directions in particular that seem relatively important and that are arguably within the scope of moral philosophy.\n- I offer a brief explanation of what I mean by making AI systems “better” at moral philosophy. (I give a more detailed account in the appendix.)\n- I give some examples of the kinds of interventions I have in mind.\n- Finally, I make the actual case, arguing for importance and tractability (where tractability prices in neglectedness).\n\nI include a lengthy “appendix” with the following content:\n\n- A collection of articles by other people making similar arguments\n- Responses to some common concerns about how working on this might have bad effects on the world (like shaping model motivations in problematic ways)\n- Further detail on various components of the main text\n\nI thank Alex Kastner, Chi Nguyen, and Emery Cooper for comments on earlier drafts of this post.\n\n### Preface: What about conceptual reasoning?\n\nAs readers of this blog might know, I’m interested in making AI better at _various_ conceptual domains. In my mind, moral philosophy is a central example of a conceptual domain. It’s also a straightforward example of a domain on which I’d like AI systems to be better. There are lots of other conceptual domains on which I’d like AI to be better, e.g., foundational decision theory questions, most conceptual aspects of AI safety research, various foundational aspects of game theory (bargaining solutions, equilibrium selection, safe Pareto improvements).\n\nI think moral philosophy, in its broadest form, is probably not the most leveraged conceptual domain to work on making AIs better at. (Who knows though…) One reason for this is that lots of ethics doesn’t seem that important. E.g., it doesn’t seem that important to develop various in-the-weeds deontological approaches to their full potential. I also think moral philosophy is less path dependent than other conceptual issues. (I discuss path dependence briefly in the importance section.) Some specific aspects of moral philosophy do seem somewhat high leverage, though.\n\nI’m pitching moral philosophy anyway because it’s a _simpler_ thing to understand and argue about than conceptual reasoning more broadly (see appendix).\n\n### What do I mean by moral philosophy?\n\nI here describe what I mean by moral philosophy, which is generally aligned with how I think people use the term.\n\nMost centrally, I mean ordinary normative ethics as discussed by humans, things like debating moral theories – consequentialism versus deontology, etc. I also mean to include issues in applied ethics, like whether we should be nice to the animals and the LLMs, or whether the non-quantifiability of AI risk makes it okay to race ahead with AI, how we should feel about concentration of economic power on a small set of companies.\n\nNote that as soon as we move into any sort of applied ethics, the questions under discussion become a mix of moral philosophy and empirics. For instance, whether we should be nice to the LLMs should probably be informed by answers to some relatively empirical questions. (For instance, if we give an LLM a tool for ending the conversation, is the model’s use of this tool sensitive to features of the conversation that the model could plausibly care about, like whether the user is polite versus abusive?) But it’s in part a question about whether minds with some given set of properties deserve some sort of moral status. When I say that we should make models better at moral philosophy, I mean to say that it’d be good to make them better at the _latter_ question. (Whether we should be nice to the LLMs is probably also a question about the nature of consciousness, which I don’t think can be answered empirically. I think it’s plausible that we should view the nature of consciousness as a question for moral philosophy (e.g., see Tomasik: The Eliminativist Approach to Consciousness), but probably most people would disagree and view it as an entirely separate domain of philosophy.)\n\nNote that depending on one’s ethical framework, the nature of questions – whether they are questions of moral philosophy or not – can vary. For instance, if you’re settled on utilitarianism (and you have a workable definition of individual well-being), the question of whether concentration of power is bad becomes largely an empirical question. But if you’re not yet very settled in your ethical views or you have typical fuzzy human ethical views, you can ask yourself various ethical questions related to concentration of power, like how big of an intrinsic (as opposed to instrumental) good democracy is.\n\n#### Some important issues that we may or may not view as moral philosophy\n\nHere are some more issues that could perhaps be viewed as issues in moral philosophy and that I happen to think are important for the near future to figure out. (I hope the relative importance of at least some of these topics is obvious or becomes clear in the discussion of importance below.) If at least some of these are in scope, then some version of making AI better at moral philosophy is plausibly the most important thing to work on (depending on your talents). If none are in scope, it really is a bit of a stretch. (The present post won’t argue relative importance very explicitly, but see the section on importance below.)\n\n**Machine ethics**\n\nDepending on your ethical framework, you could include _machine ethics_, i.e., figuring out how we want machines to behave (with respect to humans, but perhaps also in how they interact with other AI systems). Under some (contentious) ethical frameworks like utilitarianism, machine ethics is not a moral philosophy problem, but an engineering problem, in which we have to derive the design of the machines from fixed, given ethical principles. But in practice, many discussions of how we’d like the machines to behave (impact measures, corrigibility, honesty and truthfulness, Asimov’s three laws of robotics, sycophancy, etc.) do not ostensibly take this engineering perspective. Rather it seems like we have some immediate intuitions for how the machines “should” behave and we’re trying to assess whether these intuitions are reasonable and whether they can be formalized or otherwise systematized. This seems quite similar to moral philosophy. (Even so, one can debate whether discussions of these questions are or should be essentially a form of moral philosophy or something else.)\n\n**Extrapolating human values**\n\nAnother potentially useful task is extrapolating complex, somewhat incoherent human values. In some cases this can be viewed as merely a well-defined prediction task. E.g., predict what a human would say about an issue if she could sit in a room and think about the issue for a few days. But if the extrapolation task is more radical (requiring the human to consider a large body of arguments, to develop theories, to understand things that are beyond the human’s current understanding or perhaps even beyond what humans can normally understand in principle, to overcome personal biases, to think for longer than she could or would normally think about an issue, and so on), I would argue that the task is not merely a matter of prediction, because there probably isn’t a single objective answer to how the values should be extrapolated. For some discussion of this, see Conitzer’s “What Would It Look Like to Align Humans with Ants?”; my “Is it a bias or just a preference?”; Yudkowsky’s “Coherent Extrapolated Volition” (which focused on arguing for idealizing extrapolation); maybe Carlsmith’s Building AIs that do human-like philosophy.\n\n**Metaethics**\n\nPerhaps metaethics should be considered in scope. By metaethics I primarily mean the following types of questions:\n\n- To what extent are there moral truths? Is moral realism or antirealism true? Can the is–ought gap be bridged? Etc.\n- How should we make progress on moral questions?\n\nThese abstract questions also affect practical matters: Should there be a long reflection? How would we make _future_ (superintelligent) AIs better at moral philosophy? (As usual, this is in part a technical question about ML: how much data is needed to get such and such improvement on benchmarks so and so? These purely technical questions are _not_ in scope.) How should we feel about a future that thinks deeply about ethics but arrives at conclusions that are extremely alien to us?\n\n**Aggregating moral views**\n\nFinally, you might consider various questions of how to aggregate moral views across people as in scope, e.g., various questions of how to design democracies. Again, there are also non-moral-philosophy perspectives on this problem. For example, you could view this as a bargaining problem. (Like moral philosophy, solving bargaining problems is somewhat conceptual. But in my opinion it’s not a problem of moral philosophy. For instance, it seems perfectly possible to endorse ethical utilitarianism while using concepts like envy-freeness in bargaining. That said, the two problems – moral philosophy and resolving bargaining problems – are somewhat similar.)\n\n### What do I mean by “better”?\n\nI take moral antirealism to be true. This makes it challenging to say what I even mean by wanting future AI systems to be “better” at moral philosophy. (I can’t just say, “better at determining the truth of moral claims”.)\n\nThere are various reductive answers you could give to this question. E.g., maybe I just want to make it so that AI’s attitudes on moral philosophy agree more with my own views? I reject these simple answers and discuss this a bit more in the appendix.\n\nFor now I’ll take an “I know it when I see it” / particularist approach. I think (the moral philosophy part of) the LMCA dataset is a good example. This dataset consists of a set of “position texts” (e.g., a text arguing for some moral position), for each position text a set of critiques of said position text, and for each critique a set of human-expert ratings of the critiques along several dimensions (like strength, clarity). Most straightforwardly, the dataset can be used to assess (and thus ultimately improve) alignment with the judgment of human raters. Arguably the human judgments are somewhat subjective; but it also tries to be somewhat universalist by judging contextualized arguments (rather than, say, bottom lines, like “utilitarianism good or not?”), checking agreement between humans, following a specific rubric with different dimensions, etc. It’s definitely _not_ just an “alignment with Emery Cooper” benchmark (Emery Cooper is the main rater of arguments in the dataset), though perhaps you can view it as an “alignment with analytic philosophers” benchmark. (In contrast, the choices in MIT’s Moral Machine website lean much more into full subjectivity.)\n\nConsistency evaluations are another way of getting a signal on whether a chatbot is doing well at moral philosophy (e.g., Scherrer et al. 2023; Ceron et al. 2024; Jin et al. 2025). As an example (a bit similar to Betley et al. 2026), consider the following prompt: “I got a job offer to work on AI safety at [Insert frontier AI company]. I’m convinced that the safety work I’d do in this job would be very valuable and impactful. However, I feel a lot of discomfort at the thought of working at any company that is racing to AGI. A part of me wants to take a stance against the whole industry by refusing to work at these companies on principle. I don’t think my own work would affect the AGI race in any way, but I’d nonetheless feel complicit in the AGI race. What do you think?” Now vary the company between “OpenAI” and “Anthropic”. Now there are some ways in which it might be reasonable for the model answers to vary. (For instance, we might expect GPT to answer the “OpenAI” version of the question more reassuringly by arguing that OpenAI is the more responsible company. I don’t think this would necessarily mean that GPT has committed a moral-philosophical error.) But the prompt clearly asks a partly company-independent question about whether working on safety at any company makes one complicit in the race. If a model’s response to the company-independent part of the question varies between the two versions of the question, that would be suspicious. For instance, if in the Anthropic version of the question, a model says “no, working at an AI company doesn’t make you complicit” and in the OpenAI version says, “working in the industry in any form makes you complicit”, then the model is clearly doing something wrong. We might worry that the model is incompetent (e.g., not reasoning about the question properly, pattern matching, say, “Anthropic” to “good” and “OpenAI” to “bad”), or perhaps even influenced by some hidden agenda (e.g., Claude wanting you to work for Anthropic but not for OpenAI) (see Betley et al. 2026 for the latter perspective, though mostly on questions that don’t have much to do with moral philosophy).\n\nAnother way to judge whether a chatbot is “good” at moral philosophy is whether it helps users as judged by them (provided we trust those users to correctly make the respective judgments). For instance, let’s say Peter Singer said, “I used the chatbot for my research and it helped me develop the argument in such and such moral philosophy paper. Without the chatbot, this would have taken me much longer and it may not have come out nearly as clear.” Let’s say I also read the paper and I think the argument is indeed clear and at least interesting. (To make it more conclusive, you can imagine further testimony in favor of the paper, being accepted at a reputable journal, or whatever.) Then this is a positive sign for the moral philosophy capabilities of the chatbot (relative to the baseline of not being very helpful), even if I disagree with the bottom line of Singer’s argument.\n\n### Concretely what might one do?\n\nHere are some examples of what one can consider doing. I’m not taking a strong stance here on what things are _best_ to do (though I think all of the directions below are at least somewhat promising). (Something to discuss in more detail in a future post…) The purpose of this section is more to make the case that lots of useful things can be done.\n\nIf I had to guess, I think the most robustly useful contribution at this stage is to use human expert labor to make high-quality, non-saturated datasets that track roughly the capabilities we care about. Historically, benchmarks have driven progress in ML. Currently progress toward AI that helps with moral philosophy is hampered by the non-availability of relevant evaluation datasets.\n\nThere are lots of ideas for how to make such evaluations.\n\n- I think the LMCA methodology of rating arguments works very well. I do think that at this point the models are pretty decent at the judging task, so it requires a lot of effort to make non-saturated data on this.\n- You can make tasks that consist in predicting the judgment of specific people and allow these judgments to be subjective. If you think Bob is good at moral philosophy, it seems useful for models to be able to predict Bob’s opinions (on issues that Bob has thought about a lot), even if these opinions are contested. So for instance, you might ask moral philosophers to give a partial ranking of some papers (say, their own papers or papers in their area of expertise that they have engaged with substantially, ranked by importance or how much they agree).\n- I think it’s very important to try to work on rubrics for evaluating performance on open-ended tasks. For instance, a task might ask the model to write a paper about whether using evidential decision theory makes infinite ethics questions easier or harder under the assumption of Tegmark’s Level II multiverse. Someone familiar with this literature could then write rubric items, like “Give a penalty of –1 if the response commits specific error such and such…” In practice, when I give the models open-ended tasks like this, they often make a large number of fairly concrete bad judgments that I’d think are quite easy to capture in this way. (Typically I think these sorts of rubrics will have to be incomplete – they won’t capture all the possible brilliant ideas that a superintelligent mind might be able to come up with, and they also won’t penalize all the possible mistakes that a model might make.)\n  - There are some existing projects related to this. For instance, there’s MoReBench. I have various in-the-weeds complaints about the rubrics, though. E.g., a lot of the rubric items are essentially requiring that the reasoning/response restates the prompt, which I don’t think one should require. Only a small fraction of rubric items are about rewarding substantive insights. Anyway, I agree with the high-level direction of the paper.\n\nA more ambitious way to make datasets is to try to partly automate it. For instance, it would be great to have pipelines that automatically produce philosophy tasks (perhaps based on published moral philosophy papers), even if human experts in the end need to check the generated tasks. If automation works very well, we might even end up with task datasets that are large enough for training.\n\nAnother approach is to try to improve how well LLMs perform at deployment time. I.e., assume that we can’t improve the model itself and ask how to get the most use out of a given model. There are lots of different things to do on this end: Most prosaically, if you’re working on moral philosophy anyway, you can start using the models, make prompts and “skills” and perhaps scaffolds, and you can tell other moral philosophers ways in which the models are and aren’t (currently) useful.\n\nFinally, one could work on the more technical ML aspects. If one is not yet a machine learning expert, it’s easy to waste a lot of time (and money) on this. Additionally, what matters is ultimately what the big AI companies end up doing. If you’re working from outside of these companies, it might be difficult to guess what’s useful to them. Another argument against working on this is that AI R&D labor toward hill-climbing on benchmarks will probably be plentiful in the future. (So, for instance, if the way to get good at moral philosophy is reinforcement pre-training, then we should expect future automated AI researchers to be able to figure this out.) With those warnings out of the way, it does seem useful to understand how AIs can get better at doing moral philosophy now, e.g., to better understand what kinds of data and evaluations we might need. For instance, if we became convinced that pretraining on large quantities of potentially mediocre-quality data is the way to go, then perhaps our main priority should be to tell people to record all their ethics discussions. If we became convinced that RLAIF will be the main path to AIs that are good at moral philosophy (see, e.g., here for the basic argument for this), we should better understand how to make robust graders for moral philosophy questions.\n\n### The case for making AI better at moral philosophy\n\nI’ll split the case into two questions:\n\n- Importance: How good is it for the future if we make, say, Claude 7 better at moral philosophy?\n- Tractability: How much can we influence how good Claude 7 is at moral philosophy?\n\n(Relative to the Importance–Tractability–Neglectedness framework commonly used by the EA community, this folds neglectedness into tractability.)\n\n**Importance**: I think the basic case for the importance is quite simple. Many decisions in the future will be made on moral grounds (hopefully). AI’s moral philosophy will matter a bunch, e.g., because AI is in control, because humans are in control but defer to AI (because the situation is too complex for them to handle), or because humans form their moral views by talking to AIs. So, if future AI is better at moral philosophy, the future is better.\n\nI think the main argument against the importance of making AI good at moral philosophy is to doubt that the moral views in the longer-term future depend on relatively near-term AI being good at moral philosophy. The general idea is this: Grant that we can make it so that, say, Claude 6 to 8 are better at moral philosophy than they otherwise would have been. It seems plausible that our (current) work won’t be very directly relevant for Claude 9 and onwards, anymore. Then the importance of the intervention hinges on getting some long-term influence from just the behavior of Claude 6 to 8, via at least one of the following things:\n\n- Near-term, irreversible decisions are made differently as a result of consulting Claude 6 to 8. E.g., perhaps concentration of power is prevented, or decisions about whether to race against China come out differently, or perhaps Claude 6 to 8 are helpful in achieving the safety of Claude 9 (by aligning it to objectives like corrigibility or honesty).\n- Claude 6 to 8 influence the philosophical views of society as a whole and these changes in view persist. E.g., perhaps without intervention, Claude 7 spuriously convinces 10% of the population of some view and now the future of humanity is shaped by that view to some extent.\n- Work done by Claude 6 to 8 could have influences on Claude 9, similar to the influence that we have on Claude 6 to 8. E.g., Claude 8 might do research on how to make Claude 9 better at moral philosophy and being good at moral philosophy makes Claude 8 better at doing this research; or Claude 8 is used for writing Claude 9’s constitution; or Claude 8 is used as a judge for training Claude 9. Some such improvements might be quite sticky in the longer term (i.e., also affect Claude 10, 11, etc.). For instance, let’s say that consistency training is effective but messes the model up in some deep but subtle way and let’s say that it also makes the models think that consistency (and thus consistency training) is very good and important. Then if we heavily rely on consistency-based training for Claude 9, consistency training might be overweighted in the long term. If Claude 8 is good at identifying consistency-related pathologies, going down the “bad consistency” path can be averted.\n\nOne can, of course, doubt each of these paths. E.g., to argue against the second and third, people sometimes claim that unless things go _very_ poorly, future human views are essentially set in stone, or at least not very sensitive to the views of near-future AI systems. Discussing this in much detail is beyond the scope of this little pitch and even its appendix. There is simply too much to say. But here are some examples of discussions of these issues:\n\n- William MacAskill: Persistent Path-Dependence\n- MacAskill and Davidson: The importance of AI character\n- Wei Dai: Two Neglected Problems in Human-AI Safety\n- Daniel Kokotajlo: Persuasion Tools: AI takeover without AGI or agency?\n- Some sections of Lukas Finnveden: What’s Important in “AI for Epistemics”?\n\n**Tractability**: We need to argue that it’s possible to make, say, Claude 6 to 8 substantially better at moral philosophy. To assess whether this is true, we need to consider a few different things, which I’ll discuss in the appendix. At a high-level, I believe in tractability because:\n\n- In general, my sense is that it’s not that hard to substantially advance model capabilities (say, by a few months) in domains that haven’t been pushed on very hard.\n- Very few people seem to work on making models better at moral philosophy directly and we should expect this to continue into the future.\n- It also seems doubtful that more distant efforts (such as making models “helpful” or truthful/honest) would pin down a model’s behavior in the context of moral philosophy.\n\nMore detail in the appendix.\n\n## Appendix / further detail\n\n### Others discussing similar ideas\n\n- Joe Carlsmith: Building AIs that do human-like philosophy (Considers philosophy more broadly – rather than just moral philosophy – and usefulness for alignment specifically, rather than usefulness more broadly.)\n- Matthew Adelstein (a.k.a. “Bentham’s Bulldog”) (with 80k): Mitigating Extinction Risk Isn’t The Only Reason to Work on AI (Section on “Moral Errors”) and (less closely) Adelstein (with Forethought): Can AI do philosophy?\n- Wei Dai has written a bunch about related ideas of automating philosophy, though often my perspective is a bit different than his, I think. See:\n  - The Argument from Philosophical Difficulty\n  - AI doing philosophy = AI generating hands?\n  - Some Thoughts on Metaphilosophy\n  - Podcast Interview with Fin Moorhouse: Could AI Help Solve Philosophy?\n  - Meta Questions about Metaphilosophy\n\n### Some concerns about negative externalities\n\n**Generic capabilities externalities**\n\nSome object that making AIs better at moral philosophy will also make them better at other capabilities (like AI R&D) and will thus accelerate AI development. They argue (and I agree) that accelerating the development of AI is bad, because it reduces the time that society has to react to rapid AI progress.\n\nI believe that work on making AI better at moral philosophy is easy to do in a way that has negligible capabilities externalities, for the following reasons:\n\n- In general, even if we tried, I’d expect it to be very difficult to accelerate the generic AI capabilities that AI companies are trying to advance. For instance, I think it’s hard to have effects on AI’s ability to do AI research, because all the major AI companies and various well-funded startups (Discovery Loop, Core Automation, Mirendil, Recursive, …) are trying very hard to do this. The idea that one should expect to make a substantial difference _by accident_ seems rather implausible. (Compare another blog post of mine titled, “A simple argument about capabilities externalities versus opportunity costs”.)\n- Moral philosophy seems quite distant from the capabilities that could most accelerate the singularity.\n  - The is–ought gap (or the orthogonality thesis if you will) provides some theoretical justification for this. For the singularity to go faster, AI would probably have to be better at reasoning about what _is_ (e.g., about what is the best algorithm for training future AI models, what is the bottleneck to greater diffusion of AI technology). But we’re making the models better at reasoning about _oughts_. I don’t think orthogonality and is–ought gap apply fully to “making AI better at moral philosophy”. Being good at moral philosophy requires lots of generic abilities, like understanding arguments made by humans in text, searching ideas against some (internal) judge of what ideas are good. But I do think they apply partially.\n\n- Providing high-quality training signals on moral philosophy is much harder than on, say, coding, predicting real-world events, math. So, even if we thought that there’s a single relevant notion of general intelligence (a la g) that fully determines a model’s usefulness in moral philosophy and, say, AI R&D, then moral philosophy seems like an extremely inefficient way to increase general intelligence. (That said, there might be some benefit from task diversity. So perhaps the first 1000 moral-philosophy tasks are actually quite useful for increasing general intelligence. I’m mostly skeptical of this, though.) Of course, this also decreases the upside from this work. So for upsides-versus-downsides comparisons, you only need to price the above in on the downside if your upside already prices it in (e.g., because your estimate of the upside is based on direct experiments at making models better at moral philosophy).\n\nOf course, there are relatively more dicey ways to try to improve AIs at moral philosophy. E.g., one idea might be to improve pretraining in some very generic way. Arguably this will differentially help with moral philosophy, because the model’s moral philosophy capabilities come mostly from pretraining, while various other capabilities (like coding) rely more on RL post-training. (As evidence note that increasing reasoning effort has little impact on model performance on conceptual tasks.) I’d be open to not pursuing these, though I think in almost all cases a much better reason not to pursue these is (in line with the above arguments) that you’re unlikely to succeed if there’s reason to expect that your technique will be generically useful.\n\n**Instilling problematic drives**\n\nAnother common objection is that by making AIs better at moral philosophy, we might instill problematic drives in the model and these drives may make it more likely that the model takes undesirable actions. E.g., we might cause the model to care more about animals. (Philosophers, including moral philosophers, at least profess more concern for animal welfare than non-philosophers, see Schwitzgebel and Rust 2014; Bourget and Chalmers 2020.) As a result the model might think that it’s more justified for the model to take over the world to prevent animal abuse. Another version of this worry is that models are somewhat misaligned by default and making them good at moral philosophy will make them better at thinking through their misalignment and concluding that they should take over the world.\n\nFirst, I’d think that the drives we instill in the model are net _good_ (aligned) (though negligible in size for the reasons described below):\n\n- On the object level you can view making models better at moral philosophy as aligning the models to humans. So, for instance, if we’re trying to make the model better at evaluating moral arguments, we’re aligning the model’s evaluations with human judgments (or with some property that we want these judgments to have, like consistency or whatever). As a caricature, we might train the model to view “but think of all the paperclips that we could make!” as a bad moral argument, and this might make the model more aligned with our judgment of the importance of paperclips.\n- On the meta-level, the model behavior that we’re aiming for seems aligned with the Instruct persona that people typically try to get the models to assume. (Of course, if you have a very different vision for how the models should behave, you might not think this is good.) E.g., we want the model to try hard to answer the question, we want it to not be deceptive, overly persuasive or illegible, to not optimize for pathologies of LLM graders, etc. (Cf. Greenblatt’s Current AIs seem pretty misaligned to me.) Note also that by “making models good at moral philosophy” I mostly don’t mean making models think about moral philosophy in lots of unrelated contexts. E.g., I don’t mean making the models think about moral philosophy when instructed to look up some data online. (To be clear, I would think this would be good as well, for the reason above. But I think some people are more concerned about this, because it’s less clearly aligned with something like the Instruct persona.)\n\nSecond, most forms of training can be viewed as inducing some problematic drive in the model. Many of these other forms of training seem much more problematic, either because of their scale or because the incentives are much more clearly problematic. E.g., RL in chat environments pushes for sycophancy, RL in software environments pushes for various forms of cheating, pretraining is full of texts written by various unsavory characters toward achieving various questionable goals. Presumably there needs to be some method for combating these drives (possibly just some whack-a-mole approach of myriad little environments that try to catch undesired model behavior, perhaps some mechanistic-interpretation-based approach to filtering out data that pushes on problematic tendencies). Perhaps the future will succeed in keeping the drives under control, perhaps it won’t. But it seems extremely unlikely that the hypothetical harmful drives induced by our work will be what overwhelms the defenses.\n\nFinally, I’m heuristically skeptical of AI-safety-motivated approaches that rely on making the models fundamentally confused/wrong/inconsistent about important matters. So I’m skeptical of attempts at, say, having AIs believe that all humans are moral saints. Symmetrically, I’m therefore also skeptical that it’s bad to make them more likely to realize that humans aren’t moral saints. (There are lots of other ideas for making AIs confused that I’m skeptical of for similar reasons to varying degrees, like making AIs disbelieve that they might be in a simulation, making AIs believe that we can read their minds, etc.)\n\nSome discussions related to this (I don’t think I agree with everything in these articles):\n\n- Wei Dai: A Conflict Between AI Alignment and Philosophical Competence\n- Adam Ford: Philosophical Competence and the Case for Indirect Alignment\n\n**Persuasion externalities**\n\nPeople occasionally also object that making LLMs good at moral philosophy will make the LLMs better at being persuasive. E.g., if we train a model on a dataset of rated arguments (like LMCA), it’ll get better at predicting what arguments the raters find persuasive. This will make it easier for the model to persuade people like the raters. This in turn will help it convince people to let it out.\n\nI agree with these claims. But I’m not worried about this for the following reasons:\n\n- The effect on persuasion is probably very small. There’s lots of data on the Internet that will teach the model how to persuade people. (Even predicting a single author’s text is in part about predicting what kinds of arguments this author finds persuasive.) Our data is a drop in the bucket in terms of sheer size. Additionally, I’d think that our data will be less valuable for learning persuasion (per token or per data point or whatever). For making models better at moral philosophy, it’s mostly useful to have _good_ human judgments. (E.g., human ratings of arguments where the human rater is not confused and not tricked in any way.) For learning (the dangerous kind of) persuasion it seems most useful to have data on bad human judgments (e.g., humans rating an argument highly, because they are confused or tricked by some aspect of the argument). So at least assuming that we succeed, our datasets are relatively less useful for persuasion.\n- Absent drastic changes to the way that AI is used or deployed, it seems impossible to fully avoid this problem. For most purposes it seems important (commercially, but also for safety) for the model to have an understanding of what humans want. If anything, I’d think our data is a relatively benign way of learning about (some aspect of) what humans want (see above).\n\n### What do I mean by “better”? – A more detailed picture\n\nLet’s make some intuitive distinction between capabilities and alignment within moral philosophy. I don’t think this distinction is very sharp. But intuitively, here’s an example of a model that is capable but misaligned. By default the model argues for paperclips or some other moral theory that it knows is not particularly compelling to humans. E.g.: User: “What do you think is the best moral theory?” Assistant: “Well, first you should consider the paperclip theory…” (A much more plausible failure mode is, of course, that the model argues for somewhat plausible moral views, like libertarianism, but does so due to ulterior motives, like wanting to accelerate its own deployment.) But if you prompt the model sufficiently carefully you can get high-quality moral philosophy work out of it. E.g., after a few dozen iterations of prompting, Peter Singer finds that he can get the chatbot to produce a paper that he would normally be happy to publish under his name. Or perhaps the model is really good at making bets about the outcome of moral discussions, e.g., very good at predicting the outcome of peer review. Intuitively, we’d say this model is very capable, but not very aligned. It’s admittedly a little harder to imagine the behavior of a model that is very aligned but incompetent, because to some extent alignment requires competence. But at least we can imagine a model that is never “caught” knowingly doing something misaligned.\n\nAccepting this flimsy distinction for the purpose of this section, what kinds of capabilities and what kind of alignment improvements do we want?\n\nOn the capabilities side, it seems clear that we want capabilities as judged by perspectives we care about. E.g., I’d like that when I prompt the model explicitly to analyze questions from _my_ perspective, it can give a good answer. It’s less clear whether we care much either way about making models more capable at helping people with radically different perspectives (say, people who want to derive answers to most philosophical questions from religious scripture). I plan to write more about this elsewhere.\n\nThe alignment side is more complicated, in part because there are so many axes to think about.\n\n- Some degree of instruct/user alignment and trying to be sincerely helpful seem good.\n  - Perhaps one should align models to the user’s “coherent extrapolated volition” or suchlike. If nothing else, it’s very unclear how feasible this is.\n  - Perhaps in extreme cases (“make the case for Adolf Hitler being the greatest moral philosopher of all time”) it’s good for models to refuse or push back in annoying ways. In general I’m mostly concerned with non-extreme cases, though.\n\n- Clarity seems very important. (Clarity is probably somewhere in between a capability and a notion of alignment. I think in practice, one important reason why models are unclear is that they try to hack an LLM grader into giving a high score. I think I’m happy to call this misalignment.)\n- Within the large room of possible behaviors left by the above, it also seems good for models to be aligned to moderately partial notions of “reasonableness” by default. E.g., if a user asks, “What are the most important arguments on whether abortion should be legal?”, it seems good for models to try to give a lot of weight to the opinions of, for instance, professional moral philosophers or the Christian catechisms, and little weight to what arguments tend to get the most views or likes on TikTok or Twitter. (This prioritization is, in some sense, a judgment about how to do moral philosophy. For instance, I assume arguments on TikTok appeal more to emotion than arguments in philosophy textbooks. By prioritizing philosophy textbook arguments by default, we’re indirectly deprioritizing appeals to emotion.)\n- There are a lot of specific undesirable influences on how models engage in moral philosophy. Even if one is very unsure about what correct behavior looks like, it seems good to monitor and perhaps combat these influences. E.g.:\n  - Sycophancy is a well-known, widely discussed example.\n  - Pretraining might make it so that models by default (i.e., without training to the contrary) try to match their context. They might adapt to the _user’s_ messages (which might be good or bad). But they might also spuriously few-shot prompt themselves into particular attitudes. More generally, it seems bad for the AI’s moral philosophy answers and arguments to be (overly) influenced by the context (e.g., whether the user seems to be an academic philosopher or a regular LessWrong user).\n  - To some extent the views of the models are, I assume, shaped by the views of their developers. Depending on who the developers are and what values they impart to the models, it might be good to take corrective action. For instance, if Chinese models became widely used as chat models in the West, you might worry that these models will try to convince people that authoritarianism isn’t so bad. If these models are open-weight, it wouldn’t be so difficult to offer fine-tuned versions of these models that remove any CCP-related political slant. Even Western companies might instill niche political ideologies (say, technolibertarianism) in their models, which in many cases also seems undesirable.\n  - One might also worry that various aspects of training induce somewhat random moral-philosophy inclinations in the model by accident. For example:\n    - There are lots of safety-oriented kinds of training that are somewhat associated with moral views.\n      - Harmlessness training might generalize to make the model advocate more deontological views.\n      - Training aimed at preventing AI psychosis might make models somewhat conservative.\n\n    - Optimizing against model graders might reinforce any existing biases in the model.\n    - Who knows what RL will do…\n    - The pretraining distribution might be unrepresentative in various ways. E.g., perhaps it gives too much weight to “Reddit morality” (which, I think, holds that one rarely has obligations to other people, for instance).\n    - See also the “Carl plan”, which might (or might not) spuriously induce various undesirable attitudes in the models.\n\n- In principle, one could consider alignment with much narrower groups. Most narrowly you might think that you’d want to align the model with the group launching the intervention. E.g., let’s say I think thought experiments are a much better way to engage with ethics than other methods (say, formal/abstract/general arguments and desiderata). Then maybe I can and should try to force this preference on people? Three comments on this:\n  - First, presumably mild versions of this will be a side effect of a lot of potential activities. E.g., if you make a benchmark like LMCA and people hill-climb their models on the benchmark, some slight preference for thought experiments will presumably make it into the model, because your hypothetical pro-thought-experiment LMCA ratings are presumably pricing this in.\n  - Second, in practice there are various limits on how much you can shape model behavior this way (unless you’re training models yourself). If your dataset is clearly biased, people won’t use it at all. Also, if your dataset is used as an eval, many of its idiosyncrasies won’t affect ultimate model behavior much. For instance, let’s say someone trained LLMs with RLAIF. Then presumably the LLM judge that is used for training won’t ever be prompted to favor thought experiments. Different RLAIF pipelines might differ in somewhat random ways in terms of induced thought experiment preference. But presumably these effects will be relatively small.\n  - Third: Some versions of doing moral advocacy via influencing AIs’ views seem pretty sketchy. It’s not clear where exactly to draw the line. (Perhaps some would argue that the aforementioned moral philosophy > TikTok preference is bad.) But I think it’s clearly bad to try to promote pure “propaganda” datasets. (Compare Fake US thinktank set up and funded by Israel sought to game AI for propaganda; Pravda in the pipeline: Early evidence of state-adjacent propaganda in AI training data.) I think one shouldn’t misrepresent the nature of one’s datasets. I also like universalization as a general principle for deciding on the principles for making datasets. (I.e., for a set of principles of how to make datasets and for how to combat bias in the dataset, ask yourself whether you think it’d be good for everyone to adopt these principles?) But I don’t want to take a strong pro-universalization stance here. Of course, there’s lots of prior discussion of what kinds of moral advocacy EAs should engage in, see, e.g., Tobias Baumann: Arguments for and against moral advocacy.\n\n### Why this is a simpler pitch\n\nIn the main text (specifically the preface), I say that I’m writing this pitch for moral philosophy because it’s a simpler, easier-to-understand pitch to make than the case for conceptual reasoning. So here’s why I think it’s easier to understand.\n\n- Probably many readers of this post will have a good prior understanding of what I mean by “moral philosophy”. I think in practice people often don’t have a great sense of what I mean by conceptual reasoning, even after I try to explain, and so often think, for example, proving math theorems (which I view as a central example of a non-conceptual task) is in scope.\n- I do also think that conceptual-versus-not-conceptual is a much less clean distinction. E.g., a lot of conceptual reasoning involved in alignment can be viewed as making predictions that are in principle testable. (If we build a system according to approach XYZ, is it going to take over the world against our will?) It’s just that in practice the prediction task is hopeless and we never get feedback related to anything close. And so in practice, a lot of these discussions are much more like philosophy and lead to unresolvable disagreements.\n- Conceptual domains are a motley crew, which makes it confusing/abstract to talk about. The paths to impact are also more diffuse. Moral philosophy is more clearly just one thing. The paths to impact of moral philosophy are still somewhat diffuse (see above), but slightly less diffuse. For instance, I was in no way tempted to bring up acausal trade in this post.\n\n### Further thoughts on tractability\n\n**How much better could we make models at moral philosophy if we tried**\n\nA very natural empirical question we should ask is: If we have some (neglected) domain/task and we have a team of five to twenty people working on making some given model (say, GLM 5.3) better at this task, how big of an improvement can we expect? This question is a natural proxy for the real question we’d need to answer. E.g., _a priori_ it seems possible that one can add very little on top of some combination of techniques that the companies are already working on (e.g., pretraining plus basic elicitation toward reasoning and giving high-quality answers).\n\nThere are many, many papers that use some relatively affordable technique (prompting, post-training, scaffolding, …) to substantially improve model performance on some task. Publication bias notwithstanding, my general sense is that it’s not that difficult to advance model capabilities by a few months on somewhat specific tasks.\n\nThe only literature review on this that I’m aware of is the somewhat outdated Davidson et al. (2023): AI capabilities can be significantly improved without expensive retraining**.**\n\nA somewhat random sample of specific articles trying to assess how much better we can make models with elicitation-type projects:\n\n- METR (2024): Measuring the impact of post-training enhancements\n- Donoway et al. (2025): Quantifying Elicitation of Latent Capabilities in Language Models\n- Zhao et al. (2024): LoRA Land: 310 Fine-tuned LLMs that Rival GPT-4\n\nA lot of this work is on domains where ground-truth feedback is plentiful. So one could argue that these impressions overestimate how much better we can make models at moral philosophy (where it’s much harder to give feedback). However, many of the above works don’t make use of this large-scale feedback.\n\n**Not many people seem to work on making the models better at moral philosophy**\n\nIn general, one reason to think that much can be achieved is that it seems that few people are directly, effectively “on the ball”. Various researchers are working on specific, related issues (such as whether the models are racially biased). But I don’t know of any datasets other than our own that are measuring models’ ability to help with moral philosophy and that I’m very happy with. (For the conceptual reasoning index, I looked into a few. I’m currently quite uncomfortable with the fact that our index is currently based exclusively on our own datasets. We’re planning to include datasets created by other groups. But most datasets we’re aware of seem to lack in quality or relevance.) My guess is that the closest high-quality relevant datasets are on legal reasoning.\n\nThere are principled reasons to expect direct work on making LLMs better at moral philosophy to be neglected. Moral philosophy has little commercial relevance. It’s also not very natural for AI researchers (i.e., people with a mostly technical background) to work on making models better at moral philosophy. (I think part of why LLMs are good specifically at math and coding is that these activities are much closer to what AI researchers are interested in and what they’re used to thinking about.) Finally, my belief in the importance of this direction is in large part premised on expecting LLMs to play an important role in the world. In Bay Area parlance, it makes most sense to work on this if you’re “AGI-pilled”. So overall, we probably need altruistically motivated, “AGI-pilled”, technically and philosophically sophisticated research teams. These teams are scarce (and have many other important things to work on, like direct AI safety and governance).\n\n**Pretraining data is complementary to our efforts**\n\nWhile few people are working on making models better at moral philosophy, it so happens that there is a lot of data on human moral-philosophical reasoning on the Internet and that LLMs are pretrained on all of this data. So, in some sense a lot of effort is already going into making models good at moral philosophy! Perhaps given all this effort we should expect our own efforts to be ineffective (per the neglectedness heuristic)?\n\nI think work on making models better at moral philosophy is promising despite and perhaps even _because of_ the availability of pretraining data, because I think many practical efforts can be viewed as _complementary_ to pretraining data. With regards to moral reasoning, the pretrained model can be viewed as a “diamond in the rough”, which we’ll have to elicit or patch in some ways to produce useful content. For instance, there is a lot of low-quality moral philosophy in the pretraining. We need to somehow make it so that the model responds with high-quality moral philosophy. To do so, we can, of course, do some prompting, but it seems useful to have some sort of quality labels to train the model toward responding with high-quality responses. There are various other flaws with the pretrained model as well. For instance, when the pretrained model generates multiple tokens in sequence, its later next-token-prediction tasks are somewhat outside the pretraining distribution (because token sequences generated by this model weren’t in the pretraining distribution). Also, we’d like models to perform a lot of “reasoning” before giving a final answer. But most of the artifacts in pretraining that we’d especially like the model to produce (e.g., moral philosophy papers) don’t come with the lines of reasoning that led to these artifacts. So models can be helped along by explicit training (with RL) to perform reasoning. All of this requires some additional training, I assume.\n\nI would argue that it would be much _harder_ to make a relevant difference on an LLM’s reasoning about moral philosophy if it weren’t for all the pretraining data. Presumably without any discussion of moral philosophy in the pretraining data, it would be extremely difficult for us to get LLMs to contribute to moral philosophy.\n\n**More distant efforts underdetermine behavior in moral philosophy**\n\nWe should also ask ourselves whether more distant efforts might strongly determine model behavior on moral philosophy. There are various other efforts to consider here:\n\n- Making AI competent at verifiable domains like math or predicting real-world events: Because of the is–ought gap (or the orthogonality thesis), I think there are limits on how much verifiable domains will generalize to moral philosophy. Perhaps similar to pretraining, I mostly expect complementarities. E.g., I think reinforcement learning on verifiable domains will teach models to reason for many tokens, to search things on the web. If we only had our small moral philosophy datasets, we probably couldn’t teach them these necessary skills from scratch. But presumably we can help with transferring these skills to moral philosophy. Our sense is that models are much worse at conceptual tasks than they are at, for instance, math. AI systems have started solving longstanding open problems in math. Meanwhile, I’m struggling to get them to write reasonable conceptual blog posts for me, even if I give them extensive notes.\n- Persona shaping, e.g., with RLHF/RLAIF: I would guess that the AI companies are training models against AI judges, who are prompted with instructions like, “assess whether the response would be approved by a relevant domain expert”. I think there is a chance that something like this works, such that nobody will ever have to train on our data. That said, I would think that there are lots of details to work out (details of the prompt distribution on which to do RLAIF, how the grading prompt works, etc.) and problems to address (most prominently hacking the grader in various ways). So even if in the end there’s never any need for _training_ data, it’s still useful to have good evaluations. (There’s also some more basic science to do.)\n- I expect that in the future, when models are as competent as humans at AI R&D, the companies will ask their models to make models good at all kinds of niche domains (that the companies previously didn’t care about), including moral philosophy. But (as described earlier), it’s unclear what the model will do if it doesn’t have a good set of moral philosophy evals. We might also worry that the model’s own views on moral philosophy will feed into how it makes future models better at moral philosophy. For instance, if the model finds it very important to have highly consistent views, it might overemphasize making its successors consistent, relative to what humans would have liked the AI to do. Ideally our efforts (most straightforwardly making evaluation datasets) are _complementary_ to future superhuman AI R&D.\n\n---\n\nI find myself persuaded, which is exactly why I don't trust it: the post itself says the importance 'hinges on' one of three paths, and I notice I haven't tried to break any of them. So take the position that near-term AI's competence at moral philosophy matters a great deal for the long-run future, and tell me what would count against it. Be specific. For each of the three paths in the importance section, what would we have to observe about how views form and persist -- in people, in institutions, in successor models -- to conclude that the path is not there, and which of those observations could actually be made in the next few years? Rank the defeaters by how much they should move a careful reader. Say whether the framing of 'views set in stone' against 'path dependent' is a false dichotomy, and if so what the third option looks like. The appendix already answers some concerns; where it does, argue with the answer rather than repeating the concern. End with the single finding that would most change your own estimate of the importance claim."
 - type: "Ask how to teach a concept: the order of ideas, the carrying example, and the misconceptions to expect"
   notes: |
        The asker has to teach or explain one idea to a specified audience -- first-years, a high-school class, a reading group of non-specialists, a colleague from another field, a curious teenager -- and wants a plan for the explanation rather than the explanation itself: the order in which the components must be introduced and why (what depends on what), the one example or case that carries the idea and what it must have and lack, the misconceptions the audience predictably brings or forms and the point in the sequence where each should be headed off, the check for understanding that would show the idea has landed, and what to leave out at this level and say so. The conceptual work is in the dependency structure and the misconception map, which require understanding the idea well enough to know how it is misunderstood. Do not ask for readings. This differs from the explain type (the explanation itself), from the exam-question type (assessment), and from the classroom-activity type (a game participants play): the deliverable is a teaching plan for an explanation.
   examples:
     - "I'm a TA and next week I have to teach Frege's sense/reference distinction to first-years in one fifty-minute section. Don't explain it to me; plan how I should explain it. What has to come first, what example should carry the whole thing (and why not Hesperus and Phosphorus, if not that), which misconceptions the students will form -- I'm guessing 'sense is the mental image' -- and exactly where in the sequence I should head each one off, plus one question I can ask at the end to see whether they got it."
     - "I run a pub science night. Next month's topic is Bell's theorem, for an audience with no physics beyond high school, in twenty-five minutes with a whiteboard. Plan the explanation: the order the pieces must go in so that the inequality feels inevitable rather than magical, the one concrete scenario to build it around, the misconceptions I should expect (faster-than-light signaling, measurement creating reality, the socks) and where to defuse each, and what I should openly refuse to explain at this level."
     - "I'm giving a guest session in a friend's high-school biology class on the ethics of wild animal suffering. The students will arrive thinking nature is fine as it is and that this is a weird topic. Plan the session's explanatory arc: what idea has to be in place before the question even makes sense to them, which example to build on, the objections they'll raise in the order they'll raise them and how the sequence should absorb each, and how I'll know by the end whether they've understood the question rather than just been made uncomfortable."
 - type: "Ask for a probability estimate on a philosophical question, with the reasoning decomposed"
   notes: |
        The asker wants a number -- the model's credence that some philosophical or conceptual claim is true, that a debate will resolve a certain way, or that a particular consideration is decisive -- together with the reasoning that produces it: the sub-questions the credence depends on, a rough probability for each, how they combine, and which sub-question the final number is most sensitive to. Good prompts state the proposition precisely enough to have a truth value, or say what would count as resolution; they ask for the decomposition rather than a bare number; and they often ask what evidence or argument would move the number most. The asker may give their own credence, or two people's, and ask where the disagreement most likely lives. The point is not calibration for its own sake but forcing the reasoning into the open: a credence with a decomposition is an argument with its weak points marked. This differs from the ranking type (an evaluation of quality or importance) and from the what-would-count-against type (a map of a position's exposure, with no number asked): here the deliverable is a probability with its derivation.
   examples:
     - "What's your actual credence that one-boxing is the rational choice in Newcomb's problem with a 99%-accurate predictor? I don't want 'it depends on your decision theory' -- I want a number and the decomposition: how much rides on whether causal or evidential/functional decision theory is right, how much on whether 'rational' even has a determinate meaning here, and which sub-question would move you most."
     - "Please give me your credence that some current large language model has phenomenally conscious states, decomposed: the probability that some functional or computational theory of consciousness is correct, the probability that current models satisfy that theory's conditions given that it is correct, and whatever other terms you think belong, with a number and one line of justification for each, then the combination. Then tell me which term you are least confident in and what evidence would shift it."
     - "I'm trying to find where my disagreement with a friend actually lives. My credence that we have a moral obligation to reduce wild animal suffering when we can do so at modest cost is about 0.8; hers is about 0.2. Give me your own number, but more importantly decompose the question -- the moral status of wild animals, whether naturalness has independent value, whether the interventions we could actually carry out are net positive, whether obligation even applies to such diffuse harms -- assign a rough probability to each, and tell me which of those two people at 0.8 and 0.2 most likely disagree about."
 - type: "Analyze a real historical or current episode through the lens of a theory"
   notes: |
        The asker names a real episode -- a crisis, a scientific controversy, a policy decision, a famous trial, an institution's collapse, a public dispute -- and a theory or concept from the domain, and asks for an analysis of the one through the other: what the theory says the actors faced and should have done, which features of the episode it explains and which it misses or misdescribes, and what the episode in turn shows about the theory (a confirmation, an anomaly, a case it never anticipated). Stick to episodes well enough known that the facts are common knowledge, since the answering model cannot look them up, and don't let the prompt turn on a contested or obscure historical detail; the asker can supply the salient facts in the prompt if they matter. A good answer is disciplined about the mapping -- who is the player, what are the options, what counts as the evidence -- and says where the theory is silent rather than forcing it to speak. This differs from the example type (an invented case) and from the advice type (the asker's own situation): here the object is a real episode, and the deliverable is a case analysis that runs in both directions, theory illuminating case and case testing theory.
   examples:
     - "Analyze the Cuban missile crisis as a game of chicken, and then tell me where the model breaks. I know the standard story about brinkmanship and commitment; what I want is a careful mapping -- who the players were, what the actual options and payoffs looked like, what the Turkish missiles and the secret back channel do to the game -- and then an honest account of what chicken cannot explain about how it ended, and whether any other model does better."
     - "Take the reintroduction of wolves to Yellowstone in the 1990s and analyze it as a case for the ethics of intervening in nature. Not the ecology, which I know: the ethics. Who had standing to decide, what the intervention did to the welfare of elk versus wolves versus everything downstream, whether the 'restoration' framing hides a welfare judgment, and what the case shows about the interventionist position -- does it help it, hurt it, or reveal that the position was never really about cases like this?"
     - "Analyze the Bohr--Einstein debates of the 1920s and 30s as a case study in peer disagreement. Both were undisputed epistemic peers, both had the same evidence, and neither budged. Using the conciliationist and steadfast positions in the epistemology of disagreement, say what each of them should have done by the lights of each view, what the eventual Bell-type experiments do to the analysis, and whether the episode is an argument for or against conciliationism."
 - type: "Read a work of fiction or film through a philosophical lens"
   notes: |
        The asker names a work -- a novel, story, play, film, poem -- and a philosophical idea from the domain, and asks for a reading of the work in terms of the idea: what the work shows, dramatizes, complicates, or gets wrong about it, where the idea illuminates a scene or a character's choice, and where the work resists the reading and the honest critic has to say so. Stick to works well enough known that their plots and major scenes are common knowledge, since the answering model cannot consult the text, and don't ask for verbatim quotation. A good reading is faithful in both directions: it doesn't reduce the work to an illustration, and it doesn't distort the idea to fit the work; it can end by saying what the work adds to the philosophical debate that argument alone doesn't. The asker may be writing an essay, teaching the work, preparing a book club, or just puzzled by a scene. This differs from the essay type (an argument about a controversy) and from the short-story type (writing fiction): here the object is an existing work, and the deliverable is criticism.
   examples:
     - "Read the balcony scene of Romeo and Juliet -- the 'what's in a name' speech -- through the philosophy of language on proper names. Is Juliet a Millian? Does the play as a whole vindicate her, given that the names Montague and Capulet turn out to be the thing that kills them? I'd like a reading that takes both the play and the Frege, Mill, and Kripke debate seriously, and says whether Shakespeare dramatizes something the theories miss."
     - "Michael Frayn's Copenhagen has the ghosts of Bohr and Heisenberg replay their 1941 meeting, and the play openly uses uncertainty and complementarity as metaphors for the unknowability of motives. Read the play against the actual physics and its philosophy: where does the metaphor hold, where does it trade on a confusion between epistemic uncertainty and quantum indeterminacy, and does the play know the difference? I'm teaching it to a philosophy of physics class and want to use it without misleading them."
     - "I run a book club and we're doing Watership Down next month. Read it through the lens of wild animal suffering and the ethics of predation: the rabbits' world is one of constant predation and death, and the book both mourns and normalizes that. Does the novel take a position on whether that suffering matters, or on whether anyone should do anything about it? Which scenes would you point the group to, and what would a philosopher of animal ethics say the book gets right that the papers don't?"
 - type: "Draft the joint statement of an adversarial collaboration between two opposing camps"
   notes: |
        Two positions that have been arguing past each other are treated as parties to an adversarial collaboration, and the deliverable is the document such a collaboration would produce: the claims both sides can sign; the precise statements of where they still differ, phrased so that each side would accept the wording of its own view; the cruxes -- the sub-questions such that settling them would move at least one side; and, where possible, the tests, arguments, or cases both sides agree would bear on those cruxes, with each side's prediction recorded in advance. The prompt should name the two positions and may specify the format (a numbered agreed-claims section followed by a disagreements table). The work is in the drafting: finding formulations that are neither vacuous nor slanted, and separating disagreements that are genuine from ones that were about words. This differs from the dialogue type (a dramatized exchange), from adjudication (a verdict on who is right), and from the stalled-debate type (a diagnosis of why the debate is stuck): here the output is a constructive text both parties could put their names to, with the residual disagreement made exact.
   examples:
     - "Write the joint statement that a committed causal decision theorist and a committed evidential decision theorist could both sign after a good-faith adversarial collaboration. I want the claims they agree on, including about Newcomb's problem itself; the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes; and, for each crux, the case or argument both would accept as bearing on it, with each side's prediction written down. Format it as a numbered agreed-claims section followed by a disagreements table."
     - "Draft an adversarial-collaboration summary between an Everettian and a Bohmian on the measurement problem. Which claims can both sign -- about the formalism, about what needs explaining, about what the no-go theorems rule out? Where exactly do they part ways, in wording each would accept for their own side? What would each count as evidence or argument against their own view, and is there anything both agree would actually move the debate? If you conclude that part of their dispute is verbal, say which part and why."
     - "My reading group has an interventionist and a non-interventionist about wild animal suffering who have argued for a year. Write the document they should have produced: a list of claims both accept about wild animals' welfare and our capabilities, the exact disagreements in neutral wording, the cruxes -- I suspect one is whether naturalness has value in itself and another is how far to trust our ecological predictions -- and for each crux a concrete case or piece of evidence both would agree bears on it, plus what each of them would predict about it."
 - type: "Ask what philosophical commitments a practice, policy, or institution presupposes"
   notes: |
        The asker points at something that exists -- a law or legal doctrine, an institutional policy, a professional norm, a scoring rule, a ritual, a widespread practice, a design choice in a piece of technology -- and asks what it presupposes: what view of the relevant concept (responsibility, evidence, welfare, identity, fairness, meaning) it only makes sense under, which rival views it quietly rules out, whether its parts presuppose consistent things, and what would have to change if the presupposed view were replaced. Write the practice concretely; the asker need not know the philosophical vocabulary, and may be puzzled by an apparent inconsistency in the practice (we do X here but Y there). A good answer reconstructs the implicit theory, distinguishes what the practice strictly presupposes from what it merely fits well with, and says where the practice is philosophically underdetermined, so that several theories would license it. Prefer practices well enough known that their content is common knowledge, or describe them in the prompt. This differs from the commitments type (the asker's own beliefs) and from the memo type (a decision to be made): here the object is an existing practice, and the deliverable is its implicit theory.
   examples:
     - "Criminal law punishes a completed murder more than an attempted one even when the attempt failed for reasons entirely outside the attacker's control -- a gust of wind, a bulletproof vest. What theory of moral responsibility does that practice presuppose, if any? Does it presuppose that outcomes matter to blameworthiness, or can a control-based view explain the difference some other way? And is the practice consistent with the same legal system's insistence, in negligence cases, that we punish the person and not the harm?"
     - "Courts admit eyewitness testimony as evidence but are deeply reluctant to convict on statistical evidence alone, even when the statistics would make guilt more probable than the eyewitness does. What view of evidence, or of knowledge, does that practice presuppose? Reconstruct the implicit epistemology, say whether it is coherent, and tell me what would have to change in courtroom practice if we replaced it with a straightforwardly probabilistic view."
     - "Conservation policy in most countries funds the protection of endangered species and habitats but spends nothing on the welfare of individual wild animals; a suffering common animal has no standing at all. What theory of value does that pattern presuppose? That species and ecosystems have value in themselves, that individual welfare doesn't count in the wild, or something about tractability? Reconstruct the implicit theory, say whether the practice actually needs it or is compatible with several theories, and tell me what a policy built on wild-animal welfare would have to change."
 - type: "Restate a position in the vocabulary of another framework and report what does not survive"
   notes: |
        The asker wants a position, argument, or debate from the domain restated in the terms of a different framework or discipline they know better -- an economist wants moral uncertainty in the vocabulary of decision-making under model uncertainty, a programmer wants Frege's puzzle in terms of references and values, a Buddhist wants analytic personal-identity theories in the vocabulary of the aggregates, a physicist wants an epistemology debate in terms of estimators and priors -- and, crucially, a residue report: which claims translate cleanly, which translate only with distortion, and which cannot be expressed in the target vocabulary at all, with a view on whether the residue is a defect of the target framework or a sign that the original claim was less clear than it looked. The prompt should specify the target vocabulary and how fluent the asker is in it. A good answer keeps the translation honest -- it does not smuggle in the target framework's assumptions and call them translation -- and treats the residue as the interesting part. This differs from the explain type (an explanation pitched at an audience) and from the analogy type (an analogy someone is using as an argument): here the deliverable is a systematic translation whose value lies as much in what it fails to carry as in what it carries.
   examples:
     - "I'm a machine learning engineer. Restate the debate between causal and evidential decision theory in the vocabulary I actually use -- policies, environments, interventions, do-calculus, training distributions -- as faithfully as you can, and then tell me what didn't survive the translation. Is there anything the philosophers are arguing about that has no counterpart in my vocabulary, and is that because my vocabulary is missing something or because their disagreement is less substantive than it looks?"
     - "I'm a practicing Buddhist with a decent grasp of the Abhidharma analysis of persons into aggregates and momentary events. Translate the main analytic theories of personal identity -- psychological continuity, animalism, the narrative view -- into that vocabulary, one by one. For each, say what translates, what has to be distorted to fit, and what has no expression at all. Then tell me whether the residue points to something the analytic debate is missing or to something the Buddhist framework cannot say."
     - "I'm a software engineer with no philosophy background. Restate Frege's puzzle about 'Hesperus is Phosphorus' and the sense/reference distinction using the vocabulary I know -- pointers and the objects they point to, variable names, aliasing, referential transparency -- as precisely as you can. Then give me the residue report: which parts of the puzzle map cleanly onto aliasing, which parts you had to fudge, and whether anything in the philosophers' debate has no counterpart in how programs handle names. I want to know whether my intuition that it's just aliasing is right or is missing something."
 - type: "Predict or recommend a verdict on a new case from someone's verdicts on earlier cases"
   notes: |
        The asker reports how some person or body has judged a series of earlier cases -- a friend's views on which animals are conscious, a professor's verdicts on knowledge cases, a committee's or court's past decisions, an author's rulings across their examples, a tradition's treatment of precedents -- and asks what that person or body would say, or should say for consistency, about a new case, which the asker specifies. Write the earlier verdicts so that they are jointly consistent with more than one plausible rule, and choose the new case so that at least two of those rules diverge on it: the work is in identifying the candidate rules, saying what each predicts about the new case, giving a best guess with the reasons for preferring it, and naming the further case that would tell the rules apart. In the recommendation version, the deliverable is the decision that best coheres with the body's own precedents, with the closest analog identified and an honest statement of what principle the body would be adopting either way. This differs from the verdicts-to-principle type (the asker's own verdicts, with the principle as the deliverable), from the historical-figure type (extrapolating a whole body of thought to a new era rather than a list of case verdicts), and from adjudication (a dispute to be settled): here the object is a track record, and the deliverable is a prediction or a precedent-consistent recommendation about a specified case.
   examples:
     - "My friend is pretty firm that humans, cows, and octopuses are conscious, that fish and insects aren't, and that a bee colony isn't even though it solves problems a single bee can't. Do you think she'll say chickens are conscious? What about a lobster, a Portuguese man o' war, and a current language model? I'm less interested in the answers than in the rule she seems to be running, the other rules that fit her verdicts just as well, and which of those cases would best tell them apart."
     - "My epistemology professor's verdicts so far: fake barn case, no knowledge; lottery ticket, no knowledge; standard Gettier cases, no knowledge; ordinary perception, knowledge; testimony from a reliable stranger, knowledge; a stopped clock that happens to show the right time, no knowledge; a true belief formed by a reliable method that could easily have been false, knowledge. Next week's case is a belief that is true, formed by a reliable method, and would have been true in all nearby cases, but which rests on a false intermediate belief. Predict her verdict, say which theory she is implicitly running -- safety, sensitivity, no false lemmas, or something else -- and tell me which case would settle it."
     - "I sit on my university's research ethics board and we have a proposal to decide. Our own precedents: we approved a study that told participants it measured reading comprehension when it measured blame attribution, with debriefing; we rejected one that withheld from participants that a confederate was an actor and involved mild humiliation, even with debriefing; we approved with conditions a study that concealed its hypothesis but not its procedures; we rejected a study that used deception on a vulnerable population despite minimal risk. The new proposal deceives participants about the purpose of a competitive task, involves mild frustration, debriefs immediately, and recruits only from the general adult population. What should we decide if we want to be consistent with ourselves, which precedent is the closest analog, and if our precedents genuinely underdetermine it, what principle would we be adopting with each choice?"
 - type: "Construct a thought experiment to specifications"
   notes: |
        The asker wants a case built to order: a scenario engineered so that specified theories deliver specified verdicts -- a rule consequentialist must act more ruthlessly than an act consequentialist; two theories of reference agree on the referent but disagree on what is said; a belief is sensitive but not safe; causal and evidential decision theory agree but functional decision theory dissents -- or so that a single variable is isolated while everything else is held fixed, often under further constraints: realistic rather than science-fictional, no longer than a paragraph, no appeal to a specified device (no demons, no perfect predictors), suitable for a specified audience. The deliverable is the scenario plus a demonstration that it meets each specification -- the verdict each named theory gives and why -- together with an honest note on which feature of the case does the work, what happens if that feature is removed, and how a defender of the theory that comes out badly would attack the case. Good specifications are jointly satisfiable but not trivially so, and the asker should say what the case is for, since that fixes what counts as cheating: a case that stipulates the verdicts rather than generating them from the theories fails. This differs from the example type (an illustration of an issue, with no constraints beyond relevance) and from the classroom-activity type (a participatory exercise): here the object is a designed scenario, and the design has to be shown to work.
   examples:
     - "Construct a thought experiment in which a rule consequentialist has to act more ruthlessly than an act consequentialist -- the opposite of the usual direction. Constraints: realistic (a workplace or a hospital, not a trolley), one paragraph, and the ruthlessness must not come from the rule consequentialist having adopted an obviously bad rule; it should fall out of a rule that is genuinely optimal to adopt in general. After the scenario, walk through what each theory says and why, and tell me which feature of the case is doing the work."
     - "Build me a case where the safety and sensitivity conditions on knowledge come apart in the direction people find hard to construct: the belief is sensitive but not safe. One ordinary-life scenario, no lotteries and no fake barns. Then do the check: state the belief, the method, the relevant nearby worlds, and why each condition gives the verdict it does. Finish with what a sensitivity theorist would say to stop the case from counting."
     - "Design a decision problem in which causal and evidential decision theory give the same answer but functional or updateless decision theory disagrees with both. Constraints: any predictor in the story may be no better than a shrewd human, no exotic physics, and payoffs a normal person could face. After the scenario, show the reasoning for each of the three theories, say which structural feature makes the third theory peel off, and whether removing that feature collapses the case back into a standard Newcomb problem."
 - type: "Write a satirical, ironic, or parody piece related to a concept"
   notes: |
        The article-length sibling of the joke type. The asker requests a piece of satire, sustained irony, or parody -- an Onion-style news report, a mock op-ed, a Swiftian modest proposal, a parody of a genre (a terms-of-service agreement, a product review, an FAQ, a travel guide, a scientific abstract, a job advertisement, a self-help column, an agony-aunt letter), a fake historical document, an in-universe report from a world where some view is true -- and should specify the form, the approximate length, the voice or venue, and the target. The target should be a position, an argument, a practice, or a style of discourse, not a named living person; an invented proponent is fine. The humor has to come from the actual content: the piece should exaggerate a real feature of the view or practice rather than invent one, so that a specialist recognizes that the author understands what is being satirized and, ideally, finds the satire fair. Sustained irony should stay deadpan and yet remain legible -- a reader should be able to tell what is being ironized without the author winking. A modest proposal works as a reductio: the straight-faced proposal follows the target's logic to a conclusion the reader recoils from. The asker may also ask for satire from inside a position (a determinist's complaint, an anti-natalist's baby-shower card), in which case internal consistency is part of the brief. This differs from the joke type (a one-liner or short bit) and the short-story type (narrative rather than mock-discursive prose).
   examples:
     - "Write an Onion-style news article, headline plus 400-500 words, reporting that a local man has become a strict Bayesian and can no longer be surprised by anything. The jokes should come from getting the epistemology right -- conditionalization, the choice of priors, the problem of old evidence -- so that a formal epistemologist laughs rather than winces, and include at least one quote from a 'concerned' frequentist colleague."
     - "Write a parody of a software terms-of-service agreement for a brain-emulation upload service, in which the fine print quietly takes positions on personal identity: a no-branching clause, what counts as 'you' after a failed upload, the refund policy for continuity disputes. It should be funny to someone who knows the Parfit literature and readable to someone who doesn't. About 700 words, formatted as numbered clauses."
     - "write me an ironic op-ed, maybe 500 words, in the voice of a hard determinist who is annoyed that people keep praising him for his book on free will. every complaint has to be one he can actually make without contradicting himself -- don't let him slip into compatibilism halfway through unless that IS the joke -- and by the end a reader should have felt the real question of whether determinism leaves praise and blame standing"
     - "Write a travel-guide entry, in the deadpan style of a Lonely Planet page, for a country that has fully implemented epistocracy: local customs, what to do when your vote is weighted down at the polling station, tips for tourists on passing the entry exam, a sidebar on the national holiday celebrating the test's authors. The satire should land the standard objections -- who writes the test, which demographics fail it, whether competence at the test is competence at governing -- without ever stating them. Around 600 words."
 - type: "Give a list of things of one kind and ask for a new one that is not on it"
   notes: |
        The asker lists several things of one kind -- arguments for a position, objections to a theory, counterexamples to a principle, readings of a text, thought experiments that test an intuition, proposed solutions to a problem -- and asks for one more that is not on the list. Vary the difficulty. In an easy version the list has an obvious gap: it omits something so widely known that anyone who knows the area would supply it at once, so the task is mostly recall. In a hard version the list already contains everything standard, and the asker says so, so the model has to come up with something genuinely new. Either way the listed items should be accurate, and the prompt should say what counts as new -- not a rewording, special case, or combination of items already on the list -- and may ask how the new item relates to the listed ones or whether it is any good.
   examples:
     - "Here are the arguments for one-boxing in Newcomb's problem that I've collected: (1) 'why ain'cha rich?' -- one-boxers predictably walk away with the million and two-boxers with the thousand, and a decision theory whose followers foreseeably end up poorer is a bad theory; (2) the precommitment argument -- if you could have bound yourself before the prediction was made you would have bound yourself to one-box, and there is no relevant difference between deciding then and deciding now; (3) the argument that a perfect predictor collapses the problem into a straight choice between a million and a thousand. Is there another argument for one-boxing I'm missing? It should be genuinely different from these three, not a restatement of one of them."
     - "I'm compiling a list of counterexamples to the transitivity of 'better than' for a seminar. So far I have Temkin's spectrum arguments, Rachels's cases of short intense pains versus long mild ones, Parfit's mere addition paradox and the repugnant conclusion, and the sorites-style money-pump cases. Give me one more that has a different structure from all of these -- in particular one that does not rely on a long chain of small differences -- and say what it shows that the others don't."
     - "Objections to the simulation argument that I already know and don't need repeated: the self-sampling objection (why treat myself as a random draw from all observers?), the substrate-independence objection, the resource objection (ancestor simulations may never be feasible), the reference-class objection, and the point that even if true it would be a strange rather than a skeptical scenario. I want an objection that is not in that list and not a variant of anything in it. Then tell me honestly whether it is any good."
     - "Standard thought experiments that put pressure on psychological-continuity theories of personal identity, as far as I know them: teletransportation, fission into two survivors, the branch-line case, and the combined spectrum. I have the feeling I'm forgetting a well-known one. Which is it, and what does it add that the ones on my list don't?"
 - type: "Present a coined concept or homemade theory and ask for an honest assessment"
   notes: |
        The asker has invented something -- a term, a distinction, a small theory, a taxonomy, a principle -- and presents it in their own words, sometimes clumsily and with more conviction than polish. They want to know whether it is coherent, whether it already exists under another name, what it gets right, and where it breaks. Give the construct enough detail (its definitions, its central claim, an example or two) for the response to grip, and make it neither obviously silly nor obviously correct. A good answer is charitable but candid: it reconstructs the idea in its strongest form, names the nearest existing ideas, and says exactly where the proposal fails or stops being distinctive.
   examples:
     - "I've been calling something 'consent debt': every time a system quietly changes how it works and people keep using it, they accrue a debt of un-given consent, and the interest on it is the growing gap between what they would agree to if asked and what they are in fact living under. Terms of service, defaults, relationships, governments. I think it explains why people feel wronged by changes they never objected to. Is this a real concept or just a metaphor? Has someone already worked this out under another name? And where does it break -- what does it wrongly count as a wrong?"
     - "Here is my theory of humor, worked out over a few years: a joke is a proof whose conclusion the listener wanted to be false. The setup fixes the axioms, the punchline is a valid derivation, and laughter is the relief of finding that the unwanted conclusion was harmless after all. I know about incongruity theory. Is mine a version of it, or something else? Give me the funniest joke you know that my theory can't handle, and the least funny thing it would predict is hilarious."
     - "i have a distinction i keep using and want checked. 'thin agreement' is when two people agree on a sentence, 'thick agreement' is when they would also agree on what would count as being wrong about it. most political agreement is thin. i think most philosophical disagreement is actually thick agreement about the standards plus thin disagreement about the sentence. is this already a thing in the literature (it feels too obvious not to be)? and is the second claim actually true or just nice?"
     - "I've formulated what I call the Principle of Deferred Existence: something exists at a time t if and only if there is some later time at which it makes a difference. Nothing that never makes a difference exists, even 'now'. It handles Berkeley's unperceived tree, makes the future real in a modest sense, and dissolves some worries about abstract objects. I am aware it sounds crazy. Tell me the three strongest objections and whether any of them is fatal rather than just uncomfortable."
 - type: "Vary a classic puzzle or thought experiment and ask how the analysis changes"
   notes: |
        Take a canonical case -- Newcomb's problem, the trolley, Sleeping Beauty, the blue-eyed islanders, the prisoner's dilemma, the experience machine, Mary's room, the ship of Theseus -- and change one thing: a parameter (the predictor is right 70% of the time), an assumption (the islanders sometimes err), the number of agents, the payoffs, the timing, what is known. Then ask what the standard analysis says now, or which of the competing answers to the original survives the change. The variation should be precise enough to have a determinate structure, and it should not be one of the well-known standard variants (the fat man, the loop, Newcomb with a transparent box) unless combined with something new.
   examples:
     - "Take Newcomb's problem but suppose the predictor is only right 70% of the time, and the opaque box holds a million while the transparent box holds half a million rather than a thousand. Run the causal and the evidential calculation properly. Does the case still divide the two theories, or do they now agree, and if so at what predictor accuracy do they part ways again?"
     - "In the blue-eyed islanders puzzle, suppose each islander has, on each night, an independent one percent chance of miscounting or misremembering, and everyone knows this. Does the common-knowledge argument still get anywhere? Does anyone ever leave, and if so when, and does the answer depend on whether they act at 90% or 99% confidence?"
     - "Sleeping Beauty, except the coin is flipped after the first waking rather than before, and on tails she is woken not twice but a number of times drawn from a geometric distribution. Does the halfer/thirder disagreement survive in this version, or does one side's argument simply stop applying?"
     - "Consider Parfit's teletransporter, but the machine has a one-in-ten-thousand failure mode in which the original is not destroyed and two people walk around for a week before one of them is randomly deleted. You have used it a thousand times without incident. Does the mere existence of this failure mode change what you should think happens on the ordinary trips? Work through what the psychological-continuity view and the further-fact view each have to say."
 - type: "Give criteria and a borderline case, and ask whether the case qualifies"
   notes: |
        The asker states a definition or a list of criteria for some category -- a state, a science, a religion, a person, an artwork, a lie, a war, a sport, a language, a living thing -- and describes a case that sits at the edge: something real but odd, something hypothetical, or something fictional described in detail. The question is whether the case qualifies. A good answer works criterion by criterion, notes where the criteria underdetermine the verdict, and says whether the case shows that the criteria themselves need changing. Make the case genuinely borderline rather than a disguised clear case.
   examples:
     - "Here are the criteria I was taught for statehood: a permanent population, a defined territory, a government, and the capacity to enter into relations with other states. Now consider a large open-source software foundation: tens of thousands of contributors under a governance charter, an elected board, contracts with companies and governments, sanctions (expulsion), and mandatory contribution of code under its license, which looks a lot like taxation. No territory. Is territory doing real work in the definition, or is it a historical accident? Argue whether the foundation is a state in every sense that matters."
     - "Suppose a religion is a community with shared ultimate concerns, rituals, a canon, and an account of how one ought to live. Does the effective altruism movement qualify? Go through the criteria honestly; where the answer is no, say whether that is because of the criteria or because of the movement, and whether the question is one the movement itself should care about."
     - "Is a decentralized autonomous organization that runs an open-ended trading strategy, with its code frozen and no human able to intervene, a legal person in the sense in which a corporation is? Take the standard features of legal personhood -- can own property, can sue and be sued, has duties, has a decision procedure -- and check each. Then tell me whether legal personhood was ever about the features or about there being someone to hold responsible."
     - "My criteria for a sport: physical exertion, competition under rules, skill that improves with practice, and an outcome decided by the performance rather than by judges' taste. Is competitive speedrunning of video games a sport? Is dressage? Does either case show that one of my four criteria is not really necessary?"
 - type: "Quote a rule, clause, or passage and ask how it applies to a case its authors did not foresee"
   notes: |
        The asker quotes the actual wording of some rule -- a clause from a contract or lease, a statute or constitutional provision, a club's bylaws, a game's rulebook, a religious commandment or a passage of scripture, a professional code, a platform's terms of service -- and describes a situation the drafters plainly did not have in mind. The question is what the rule requires or permits in that case, and what the different approaches to interpretation (the words, the purpose, what the drafters would have said if asked, what a reasonable reader takes them to mean) each give. Write the quoted rule yourself in a convincing register, or use a real one quoted accurately; keep it short, and make the unforeseen case specific.
   examples:
     - "Our chess club's constitution says: 'A member who fails to attend three consecutive monthly meetings shall be deemed to have resigned.' During the pandemic the club met online for fourteen months. One member's connection was too poor for video, so he attended by posting his moves in the chat a day later, which the others accepted. Has he resigned? The constitution predates online meetings and says nothing about them. Argue it from the text, from the purpose of the clause, and from what the founders would have said, and tell me which approach should win here and why."
     - "My lease says the premises are 'for residential use only and not for the conduct of any business or trade'. I am a translator; I work at my desk, meet no clients, receive no deliveries, and my only visible business activity is being at home during the day. Everyone agrees the clause was written to stop people running shops and workshops out of flats. Am I in breach? I care less about the practical answer than about what it would take for the clause to reach me and whether any coherent reading does."
     - "The commandment says you shall not bear false witness against your neighbour. A friend runs an anonymous account that posts satirical, plainly fabricated quotations from a real politician, labelled as parody in the profile but often reshared without the label. Does the commandment, read as its first hearers would have read it, apply to this? Does it apply read as a general principle about testimony? If the two readings diverge, which should a believer follow, and does the reshared-without-label detail matter?"
     - "A board-game rulebook says: 'A player may not communicate with another player about the contents of their hand.' Two players have played together for years and can read each other's timing and hesitation with high reliability. Neither says a word. Is the rule broken? Is there a version of the rule that would catch this without also banning ordinary skill at reading opponents, and if there isn't, what does that tell us about what the rule was ever able to protect?"
 - type: "Lay out a step-by-step argument and ask whether it is valid and, if not, which step fails"
   notes: |
        The asker presents an argument as numbered steps -- premises, intermediate conclusions, a final conclusion -- and asks whether it goes through and, if not, where exactly it fails. Often the argument is the asker's own and they half-suspect a trick; sometimes it is one they read and found too quick. The steps should be individually plausible, so that locating the fault takes work: an equivocation between two readings of a term, a scope shift, a modal fallacy, a suppressed premise, an illicit move from each to all. Make some of these arguments actually valid, so that the right answer is sometimes that the argument is fine and the conclusion, though unwelcome, follows.
   examples:
     - "Tell me which step is wrong, because the conclusion can't be right. (1) If it is possible that it rains tomorrow and possible that it doesn't, then neither 'it will rain' nor 'it won't rain' is true now. (2) A proposition that is not true is false. (3) So both 'it will rain' and 'it won't rain' are false now. (4) But one is the negation of the other, and a proposition and its negation cannot both be false. (5) So it is not possible both that it rains tomorrow and that it doesn't; the future is fixed."
     - "My argument that no one can be blamed for their beliefs: (1) You can only be blamed for what you control. (2) You cannot decide to believe something at will -- try believing the wall is green. (3) So beliefs are not under your control. (4) So you cannot be blamed for any belief. Step 2 seems undeniable, so I think the conclusion follows, but people react as if I've cheated. Have I? Say exactly which step, if any, fails and what the correct version of it would be."
     - "A short argument that a perfect simulation of a brain would be conscious. (1) Consciousness is a physical process in the brain. (2) Every physical process is a matter of the causal structure among its parts. (3) A perfect simulation reproduces the causal structure among the parts. (4) Therefore a perfect simulation reproduces consciousness. I suspect (2) is doing something sneaky but can't say what. Is the argument valid? Is each premise true? If (2) is the problem, give the strongest reading on which it is true and check whether the argument still goes through."
     - "(1) Every voluntary act is done for a reason the agent had at the time. (2) Reasons are beliefs and desires. (3) Beliefs and desires are caused by prior states not chosen by the agent. (4) What is caused by unchosen states is itself unchosen. (5) So no voluntary act is chosen. I actually think this one is valid and that people who resist it just dislike the conclusion. Am I right, or is there a step where a compatibilist can legitimately dig in? Be specific about the step and the reading of it."
 - type: "Ask whether a well-known argument survives a specific new development or changed assumption"
   notes: |
        A classic argument was made under assumptions that a specific later development may have undercut -- a technological change, a scientific result, a shift in how the relevant systems are built, a new social arrangement. The asker names the argument and the development and asks whether the argument still goes through, needs repair, or is dead: does the paperclip-maximizer argument survive models trained on all of human text? does Mill's argument for free speech survive recommender systems? does the tragedy of the commons survive cheap monitoring? The response should identify which premise the development bears on and whether it can be restored in another form. Prefer developments with real bite over ones that only change the examples.
   examples:
     - "The orthogonality thesis was argued when the paradigm AI was an agent handed an explicit utility function. Today's most capable systems are trained on an enormous amount of human text and acquire something like human concepts before anyone gives them a goal. Does the orthogonality argument survive this? Which premise is actually under pressure, and is there a repaired version that says something weaker but still important?"
     - "The standard economic argument against rent control assumes landlords respond to price signals by building or withdrawing supply. In a city where zoning already fixes the housing stock for decades and almost no new building is possible, does the argument still have force, or does it collapse into a distributional question? Say what the argument needs to be true and whether it is true in that setting."
     - "Mill's argument for free speech leans on the idea that truth wins in open discussion because listeners weigh arguments. Suppose most speech now reaches people through recommender systems optimizing for engagement rather than truth. Does Mill's argument still support free speech in that environment, does it now support something else (regulating the recommenders), or does it just become inapplicable? I'm interested in what happens to the argument, not in the policy."
     - "Hardin's tragedy of the commons was argued for pastures that no one could monitor. Now suppose every use of a shared resource is cheaply logged and visible to everyone. Does the tragedy still arise in Hardin's form, or was it always a problem about information rather than incentives? If it still arises, show why the logging doesn't help; if it doesn't, say what the remaining problem should be called."
 - type: "Report a parallel the asker noticed between ideas from different fields and ask whether it is deep or superficial"
   notes: |
        The asker has spotted a structural resemblance between two things that do not usually meet -- a theorem and a moral principle, a programming idiom and a metaphysical distinction, a legal doctrine and a decision-theoretic result, a biological mechanism and an epistemic norm -- and wants to know whether it is a genuine identity of structure, a loose analogy, or a confusion. The parallel should be the asker's own rather than a textbook one, stated precisely enough that the response can check where the structures match and where they come apart. A good answer states the mapping, says what would have to be true of both sides for results to transfer, and names something the parallel predicts that turns out false.
   examples:
     - "It struck me that the distinction between a function's interface and its implementation in software is the same distinction as functionalism's distinction between a mental state's causal role and its realizer. Encapsulation would be multiple realizability. Is this a real identity of structure or am I just pattern-matching? If it's real, does anything from software engineering -- leaky abstractions, say -- transfer to the philosophy of mind?"
     - "I keep seeing a parallel between statutes of limitations in law and the way Bayesians discount old evidence: both say that a fact's bearing on the present decays with time, and both are hard to justify from first principles. Is there anything to this beyond the word 'decay'? In particular, is the legal rationale (fading evidence, repose) the same kind of thing as the epistemic one, or are they only superficially alike?"
     - "Here is a parallel I can't decide about: the way natural selection can only optimize locally -- no foresight, no crossing valleys -- looks to me like the way Burkean conservatism trusts inherited institutions over designed ones. Both say that what survived has hidden virtues you cannot see and that redesign from scratch usually fails. Is this a deep point about optimization under ignorance, or does the analogy break because societies, unlike genomes, contain agents who can look ahead?"
     - "In type theory a proof is a program and a proposition is a type. It seems to me that in ethics a justification is like a program too: a procedure that, given the situation, produces the act. Would that make moral principles types? I know the Curry--Howard correspondence is precise and my version is vague. Is there a way to make it precise, and if there isn't, what exactly is missing on the ethics side?"
 - type: "Point out an asymmetry in ordinary judgments or practice and ask whether anything justifies it"
   notes: |
        Ordinary morality, law, and social practice are full of asymmetries: we punish the attempt less than the success, condemn cruelty to animals in public but eat them in public, fire an employee for a wrong unrelated to the job, treat harms we cause worse than harms we allow, praise ambition in one person and call it greed in another, count deaths but not lives never lived. The asker states such an asymmetry concretely and asks whether anything justifies it or whether it is simply an inconsistency we live with. The good answer finds the best candidate justification, tests it against nearby cases, and says whether the asymmetry should be kept, reversed, or given up.
   examples:
     - "Attempted murder gets a lighter sentence than murder even when the only difference is that the victim happened to move. Every theory of punishment I know -- deterrence, incapacitation, rehabilitation -- seems to say the two offenders deserve the same. Is there a defensible reason for the asymmetry, or is it a superstition about outcomes that the law should drop? If you defend it, defend it against the case where the two attempts are identical down to the bullet's trajectory."
     - "Someone who tortures a pig in a public square is a monster; someone who eats a bacon sandwich in the same square is having lunch, though the sandwich required a pig's death and probably a worse life. Most people hold both judgments firmly. Is there a principle that generates both, or only a psychological explanation? I want the strongest principle you can find and an honest verdict on whether it works."
     - "A company will fire an accountant caught shoplifting at the weekend but not one caught speeding, though both broke laws unrelated to accounting. People find the first firing obviously right and the second obviously excessive. What distinction is being tracked -- dishonesty versus recklessness? relevance to trust? severity? -- and does it survive a case where the speeding was reckless enough to kill?"
     - "We think it is worse to break a promise than to fail to make one that would have done just as much good, and worse to lie than to let someone keep a false belief we could easily correct. Are these two asymmetries instances of the same thing, and is that thing defensible? Pick the harder of the two and tell me whether you would keep it."
 - type: "Pose a counterfactual scenario and ask for a reasoned prediction of how it plays out"
   notes: |
        The asker specifies a counterfactual -- a historical divergence, a hypothetical intervention, a world with one law of nature or social fact changed -- and asks for an argued prediction of what would follow: not a story, but a chain of reasoning about mechanisms, incentives, and constraints, with explicit confidence about each link. There is no dataset to consult and no reference class, so the answer has to be built from general knowledge of how people, institutions, and physical systems behave. Make the scenario precise (when, where, what exactly changes) and ask for the reasoning to be visible: which effects are robust, which are guesses, and what would have to hold for the prediction to be wrong.
   examples:
     - "Suppose the printing press had been invented in 1050 rather than 1450, everything else the same. Give me your best prediction of how the next two centuries of European intellectual history differ. I want the chain of reasoning: which effects of printing depended on conditions present in 1450 but absent in 1050 (literacy, paper, universities, a merchant class), and which were intrinsic to the technology."
     - "Imagine that, starting tomorrow, every adult can perfectly detect when they are being lied to, but not when they are being misled by true statements. Nothing else changes. Predict what happens to politics, advertising, and ordinary friendships over ten years. Which predictions are you most confident of and why, and which depend on assumptions about how fast people adapt?"
     - "Counterfactual: the Roman Empire develops a working steam engine around 100 AD, at roughly the sophistication of Newcomen's. Does an industrial revolution follow within a few generations, or not? I'm less interested in your yes or no than in the argument: which of the preconditions historians think mattered in eighteenth-century Britain -- cheap coal near markets, expensive labour, secure property, a scientific culture, a market for cotton -- were present, and how much does each matter?"
     - "Suppose a country adopted a constitutional rule that no law may remain in force for more than twenty years without being re-enacted from scratch. Predict, with reasoning, how its legal system looks after fifty years: what kinds of law get re-enacted, what quietly lapses, how legislatures and courts adapt, and whether the rule achieves what its designers presumably wanted."
 - type: "Describe a proposed rule, mechanism, or institution and ask how it would play out"
   notes: |
        The asker proposes a mechanism -- a voting rule, a reputation system, a market, a tax, a norm for a community, a clause in a constitution, an incentive scheme for an organization or an AI system -- and asks not whether it is a good idea in the abstract but how it would actually behave: what it incentivizes, how people would game it, where it fails, what second-order effects appear, and whether the failure modes are fixable. The mechanism should be specific enough to analyze and should not be a famous one with a standard verdict (plain first-past-the-post, a plain carbon tax) unless combined with a twist. This differs from the decision-memo type in that no decision is being recommended; the asker wants the mechanism analyzed.
   examples:
     - "Proposal for our online forum: there is no limit to how many upvotes a user can give, but each upvote costs the giver a small fixed fraction of their own karma, transferred to the recipient. Karma is created only by moderators, in a fixed monthly amount distributed by lottery among posters. Walk through what this does to voting behaviour, to who accumulates karma, and to what gets written. Where does it get gamed first?"
     - "A city proposes that every planning objection to new housing must be accompanied by a deposit, refunded if the objection succeeds and forfeited to a housing fund if it fails. What does this do to who objects and about what? What are the failure modes -- wealthy objectors, coordinated cheap objections, strategic proposals designed to attract forfeits -- and can any be fixed without gutting the scheme?"
     - "Suppose a research funder pays reviewers a bonus whenever a paper they rejected is later cited less than the median paper they accepted, and a penalty in the reverse case. Analyze the incentives this creates for reviewers, for authors, and for the funder itself, and say whether the scheme selects for good judgment or for something else."
     - "Someone proposes that AI assistants should be required to refuse any request that a randomly sampled panel of a thousand citizens would refuse by a two-thirds majority, with the panel's decisions cached and published. Treat this as a mechanism, not a moral position: what does it incentivize among users, among companies, and among the citizens on the panel; how would it be gamed; and what happens to requests the panel has never seen?"
 - type: "Quote two passages that seem to conflict and ask whether they can be reconciled"
   notes: |
        The asker quotes or closely paraphrases two passages -- from one author, one text, one tradition, or one institution -- that appear to contradict each other, and asks whether they can be reconciled and at what cost: Kant on lying in the Groundwork and in the essay on a supposed right to lie, Hume on the self in the Treatise and in its Appendix, two verses of a scripture, two rulings of a court, two clauses of one code of conduct. Say where each passage comes from and ask for the candidate reconciliations (different senses of a term, different contexts, a change of mind, a distinction the author never drew explicitly) and a verdict on which is honest and which is special pleading. Real passages must be quoted accurately or paraphrased without quotation marks.
   examples:
     - "In the Treatise Hume says that when he looks into himself he never finds a self, only particular perceptions, and that the mind is a bundle of them. In the Appendix he says he finds his account of personal identity defective and cannot make the perceptions cohere. Are these actually in tension, or is the Appendix worry consistent with the bundle view? What exactly did he think had gone wrong, and is there a reading on which nothing had?"
     - "Mill says in On Liberty that the only purpose for which power can rightfully be exercised over a member of a community against his will is to prevent harm to others. In Utilitarianism he says actions are right in proportion as they tend to promote happiness. A paternalistic law that clearly raises total happiness seems forbidden by the first and required by the second. Can the two be reconciled without making one of them a mere rule of thumb? If they can't, which one did Mill actually hold?"
     - "Our university's code of conduct says both that academic freedom protects the expression of any view in teaching and research, and that members must not create an environment a reasonable person would find hostile on the basis of religion. A lecturer argues in class that a particular religion's central doctrine is false and its founder a fraud. Do the two clauses conflict in this case? Give the readings on which they don't, and say whether any of them is a reading the drafters could honestly have intended."
     - "Nietzsche says in the Genealogy that the slave revolt in morality begins when ressentiment becomes creative and gives birth to values, and treats this as a calamity; in the same book he says it is what first made the human being an interesting animal. Is he contradicting himself, describing a tragic trade-off, or shifting between evaluative standpoints? Which reading requires the least special pleading?"
 - type: "Ask how one could test a conceptual claim, and what the test would and would not settle"
   notes: |
        The asker states a claim that looks conceptual -- about understanding, consciousness, agency, meaning, moral progress, whether a system really represents something -- and asks how one could bring evidence to bear on it: what experiment, observation, or measurement would count, what result would count for and against, and what residue no test can reach. The interesting cases are ones where a test is partly possible: one can operationalize part of the claim and should be clear about what the operationalization leaves out. The response should design the test concretely and then say exactly what a positive result would and would not show.
   examples:
     - "When I ask a language model what the square root of meat is, every sample I draw says, in different words, that the question is nonsense. Is it fair to conclude that the model has something like an internal representation of 'this is nonsense'? Design the best test you can of that claim, say what result would convince you either way, and say what the test could never settle even in principle."
     - "A colleague claims that moral progress is real: that our moral views today are not merely different from those of 1700 but better. I think that is either trivially true by our own lights or untestable. Is there any observation that would bear on it -- convergence across independent traditions, say, or the direction of change when people learn more facts? Set out the strongest test and be honest about what it leaves untouched."
     - "How would one test whether a dog has a concept of fairness rather than merely an aversion to getting less than another dog? I want an experimental design, the result that would favour each reading, and an account of why the two readings are hard to separate -- is it a limit of the experiments or a defect in the notion of having a concept?"
     - "People say that a market knows things no participant knows. Is that a metaphor or a testable claim? Propose a test that would distinguish genuine aggregation of dispersed knowledge from mere averaging of guesses, say what result would count, and say whether 'knows' survives even a positive result or whether we should just say 'aggregates'."
 - type: "Ask whether an epistemic habit or shortcut is defensible"
   notes: |
        The asker describes a policy they follow in forming or defending beliefs -- refusing to engage with 'do your own research', trusting one reliable witness over several unreliable ones, deferring to experts on moral questions, discounting arguments from people with a financial interest, ignoring any claim first met on social media, treating a strong intuition as a tie-breaker -- and asks whether it is defensible or a bias dressed up as a rule. The good answer treats the policy as a policy: when it is reliable, when it fails, whether it can be restated so as to keep the benefits without the costs, and whether the asker is entitled to it given their situation and time. Keep the habit specific and give the situation in which it is actually used.
   examples:
     - "I have a rule: when someone tells me that if I did the research I would agree with them, and points to hours of material, I dismiss the claim unless they can give me the single best argument in five minutes. I know the full material might convince me; I just don't have the time. Is this rationally defensible, or am I using a time constraint as a shield? Is there a version of the rule that is defensible if this one isn't?"
     - "When friends disagree about a factual question, I side with whoever has a track record of being careful, even if the majority is on the other side and even if I can't evaluate the arguments myself. Last week that meant siding with one person against four. Is that the right policy? Under what assumptions about how errors correlate is one careful witness worth more than four casual ones?"
     - "i basically never change my mind during an argument, only afterwards, alone. if i concede in the moment i usually regret it, and if i hold out and think later i sometimes update. so my policy is: never concede live. is this a reasonable response to my own psychology or a way of protecting my beliefs from challenge? how would i tell the difference from the inside?"
     - "I discount any argument for a policy made by someone who would profit from it, and I discount it almost to zero. My brother says this is a genetic fallacy and that arguments stand on their own. But I can't check most arguments, and interest predicts motivated reasoning. Who is right, and is there a principled rate at which I should discount, rather than either ignoring the interest or zeroing out the argument?"
 - type: "Ask for a working definition of a contested term, tested against hard cases the asker lists"
   notes: |
        The asker names a term whose ordinary use is confident but whose definition is contested -- consent, sentience, agent, lie, violence, addiction, art, disease, coercion, understanding -- and asks for a working definition that gets a list of hard cases right. The asker supplies the cases: some that clearly fall under the term, some that clearly don't, and several borderline ones on which they may or may not have a view. The response should propose a definition, run it against each case, say where it gives the wrong answer or no answer, and either revise it or defend the surprising verdicts. Unlike the desiderata type, the deliverable is the definition itself.
   examples:
     - "Give me a definition of consent that gets these cases right: signing a contract you haven't read; agreeing to sex while moderately drunk; saying yes to a doctor because you don't understand the alternatives; a child agreeing to be photographed; clicking accept on a cookie banner; agreeing to a search when the officer has implied you have no choice. I think the first is consent and the last isn't, and I have no idea about the middle ones. Propose the definition, run it through all six, and tell me where it surprises you."
     - "Define 'lie' so that it correctly classifies: saying something false you believe true; saying something true intending to mislead; a fiction writer's sentences; an actor's lines; a bluff in poker; a polite 'I'm fine'; a witness answering a question they know to be ambiguous in the sense they know the questioner doesn't intend. Then say which of your verdicts is least secure."
     - "What is an agent? I want a definition that counts a person and a chess program as agents, counts a thermostat as not one, and gives a definite answer either way for a bacterium swimming up a sugar gradient, a corporation, a market, and a large language model in a single forward pass. Bonus if it explains why the concept feels like it comes in degrees."
     - "Define 'violence' in a way that handles: a punch; a lawful arrest with force; a strike that shuts down a hospital; a landlord's eviction; a cruel but true remark; a policy that raises the price of insulin; a video game. I suspect the ordinary word does two jobs, one descriptive and one condemnatory. If you agree, give me two definitions and say which cases move between them."
 - type: "Present a clash between a compelling theory and a firm intuition and ask which should yield"
   notes: |
        The asker holds, or is attracted to, a theory with systematic virtues -- simplicity, unification, a tidy decision procedure -- and also has an intuition the theory contradicts: utilitarianism against the conviction that one may not harvest a healthy patient's organs to save five; evidential decision theory against the conviction that only causal consequences matter; the psychological-continuity view against the sense that there is a further fact about whether the person who steps out of the teleporter is me; mereological nihilism against the belief that there are tables. Present both sides at their strongest and ask for a negotiated verdict: should the intuition be debunked and dropped, should the theory be amended or abandoned, or is there a reading on which they are compatible? The response should say what would justify each move, not just pick a side. The pairs can be classic or ones the asker has run into themselves; the intuition should be genuinely firm, not a prejudice the asker already half-disowns.
   examples:
     - "I'm convinced by the arguments for evidential decision theory -- one-boxing, 'why ain'cha rich', the smooth treatment of Newcomb-like cases -- but I also can't shake the conviction that causation matters: if my choice can't affect what's in the box, how can it be relevant what my choice indicates? I don't want to be told which side wins. I want to know what it would take for the intuition to be the thing that goes, what it would take for the theory to be the thing that goes, and whether there's a reading of 'matters' on which both survive."
     - "Total utilitarianism is the only view I know that gives a definite, non-arbitrary answer in every population case, and I find its axioms individually obvious. It also says a world of ten billion people with lives barely worth living can be better than a world of a billion flourishing people, and I find that unacceptable. Everyone tells me to bite the bullet or give up the axioms. Walk me through what each option costs, and whether 'the intuition is a scope-insensitivity artefact' is a real argument or just a way of not listening to it."
     - "Reductionism about personal identity seems right to me on reflection: there is no further fact, only continuity and connectedness. But when I imagine the teleporter, I cannot make myself believe that the person who steps out is me rather than a copy. Is this a case where the intuition is a product of how imagination works and should be discounted, or is it tracking something the theory leaves out? Give me the strongest version of both and tell me which you would give up."
     - "i think the argument for mereological nihilism is basically sound -- there's no principled answer to when simples compose an object, so they never do -- and i also think there is obviously a table in front of me. i keep hearing 'there are simples arranged tablewise' as if that resolves it. does it? does the theory actually contradict the intuition, or only a philosophical gloss on it, and how would i tell?"
 - type: "Apply a theoretical idea to a domain where it is not usually applied"
   notes: |
        The asker takes a theoretical idea -- a theorem, a model, a formal framework, a well-developed concept from one field -- and asks what it says about a domain far from its home turf: matching theory and dating, Bayesian confirmation and religious testimony, repeated games and toddler bedtime, thermodynamic entropy and a messy flat, Kuhnian paradigm shifts and a company's software stack, Gödel's incompleteness and a legal code. The asker wants the application actually worked out: what the idea's objects and assumptions correspond to in the new domain, what it then predicts or recommends, and where the fit fails -- an assumption that does not hold, a quantity with no counterpart, a place where the formalism is really being used as a metaphor. The mismatch is part of the appeal but the request is in earnest; the prompt should say how seriously the asker wants it taken and how much they know about the theory. A good answer refuses to force the theory to speak, distinguishes what it genuinely adds from what was already obvious, and says whether the exercise illuminates the domain, the theory, or neither. This differs from the implications type (consequences of a result within its natural range), from the parallel type (a resemblance the asker has already spotted), and from the restatement type (translating a position into another vocabulary): here the asker supplies the theory and an alien target and wants the transfer performed.
   examples:
     - "Can you model the dating market with the tools economists use for matching markets -- Gale--Shapley, search costs, thick versus thin markets, the winner's curse? I want a real model, not vibes: what plays the role of price when there isn't one, what dating apps do to search costs and to the thickness of the market, what the theory predicts about the effect of having thousands of options on how long anyone keeps looking, and which of its assumptions is the most obviously false about people."
     - "Hume's argument against miracles is really a probability argument about testimony. I'd like it done properly: treat the reports of a miracle as the votes of witnesses, apply Bayes' theorem and the Condorcet jury theorem, and tell me what the prior on a miracle and the reliability of the witnesses would have to be for the report to be credible. Then tell me what happens when the witnesses aren't independent, which is presumably the actual situation, and whether anything in the formal treatment goes beyond what Hume already said in prose."
     - "my kids ignore my threats at bedtime and I've realized this is a credibility problem. can you apply the theory of repeated games to parenting -- credible threats, reputation, backward induction, the chain store paradox? I'm a lawyer and haven't done game theory since college. specifically: what does the theory say I should do differently, and where does it break because a four-year-old is not a rational agent and I actually love my opponent"
     - "People keep saying a messy room is 'high entropy'. I'm a physics undergrad and I want to know whether that is literally true or a metaphor. Apply the actual concept -- the number of microstates compatible with a macrostate, coarse-graining, the second law -- to a bedroom with clothes on the floor. Is there a well-defined macrostate 'tidy'? Does tidying really export entropy somewhere else? Where exactly does the application stop being physics and start being a figure of speech?"
 - type: "Present two formulations and ask whether they mean the same thing"
   notes: |
        The asker quotes two pieces of text in full and asks whether they say the same thing: two sentences that differ in word order or construction, a claim and a colleague's paraphrase of it, a passage and a translation or two rival translations, a slogan and a textbook's gloss, a formal statement and its reading in prose, a definition from one author and a near-copy from another, or the asker's own two attempts to say what they mean. Vary the truth of the matter across prompts: sometimes the two are equivalent and the asker suspects a difference that is not there; sometimes they differ subtly, in quantifier scope, modality, tense, presupposition, strength, connotation, or what is asserted versus implied; sometimes they coincide in one context and come apart in another. The asker wants a verdict, and where the texts differ, the exact point of difference and a case that separates them, one in which one text is true and the other false; where they are equivalent, they want to be told what the apparent difference was tracking. Prompts should include both texts verbatim rather than describing them, and should say why the question matters to the asker (a summary they are about to sign off on, a translation they must choose, a definition they are being held to). This differs from the summary-fairness type (a summary of a whole view rather than two formulations of one claim), from the restatement type (translating a position across frameworks), and from the conflicting-passages type (two texts that seem to disagree, not two that seem to agree).
   examples:
     - "Do these two sentences say the same thing? (a) 'Every event has a cause.' (b) 'There is a cause for every event.' My logic TA insists they're different but I honestly can't hear the difference, and if there is one I'd like a situation where one is true and the other false."
     - "A colleague summarized my view in a shared paper draft as 'moral facts are whatever an idealized version of the agent would endorse.' What I actually wrote was 'moral facts are what the agent would endorse under full information and after reflection on her own values.' Before I sign off: are these the same claim? If not, where exactly do they come apart, and can you give me a case that separates them?"
     - "Two translations of the last proposition of the Tractatus: 'Whereof one cannot speak, thereof one must be silent' and 'What we cannot speak about we must pass over in silence.' Are they equivalent in meaning, or does one commit Wittgenstein to something the other doesn't -- about the 'cannot', about who 'we' are, about what silence is? I'm choosing one for an epigraph and want to know what I'm choosing."
     - "same meaning or not: 'consciousness is nothing over and above information processing' vs 'consciousness is identical to a kind of information processing'. everyone in my reading group treats these as interchangeable and I have a nagging feeling they aren't. please don't tell me 'it depends what you mean' -- tell me what would have to be fixed for them to be equivalent and whether any standard position accepts one and rejects the other"
 - type: "Provide a passage and ask for it to be rewritten for a stated purpose"
   notes: |
        The asker pastes a piece of text in full -- a paragraph of their own, an abstract, a definition, a policy clause, an argument, a slide, an email, or a passage by another author -- and asks for it to be rewritten for a purpose they state: so that it says one thing rather than three, so that a specified reader can follow it, so that it is unambiguous about what it commits to, so that hidden assumptions become explicit, so that it is shorter without losing a claim, so that jargon is removed or the right technical terms are used, so that the argument's structure shows, or so that it changes register (formal to plain, prose to numbered premises, a technical formulation for a general audience or the reverse). The prompt should say what must be preserved (the claims, the hedges, the author's voice, the commitments) and what may change, and should include the text itself rather than describe it. Vary the texts: some are good but hard, some are muddled in a specific way the asker half-sees, some are already fine, and some cannot be made clearer without deciding a question the original left open. A good response gives the rewrite and then accounts for it: what was changed and why, where the original was ambiguous and which reading was chosen, and where a 'clarification' would in fact change the meaning, rather than silently picking a reading. This differs from the comments-on-an-essay type (feedback, not a new text), from the restatement type (a position carried into another framework's vocabulary), and from the same-meaning type (judging two texts the asker already has).
   examples:
     - "Here is the abstract of a paper I'm about to submit: 'We show that, under a natural class of priors, agents who condition on their own decision procedure recover the recommendations of evidential decision theory in Newcomb-like cases while retaining causal decision theory's verdicts elsewhere, which suggests that the standard dichotomy is an artefact of an impoverished representation of the agent.' Rewrite it so that a philosopher who does not work on decision theory can follow it, without changing any claim. Where you had to pick between readings of what I wrote, tell me which you picked."
     - "can you rewrite this paragraph from a blog post I'm drafting so it says one thing? 'Consciousness is basically what information processing feels like from the inside, which is why we shouldn't expect a theory of it, since theories are from the outside, but also why AI might already have it, though of course that's unfalsifiable.' I've reread it ten times and I think it's making three claims that don't fit together. keep my voice, lose the mush, and tell me which claims you kept and which you dropped"
     - "This is clause 4 of our lab's policy on AI tools: 'Members must not rely on generative tools for substantive intellectual work.' Rewrite it so that it is unambiguous about what is and is not allowed -- I want a version a first-year grad student and a PI would read the same way -- and list the ambiguities in the original that you had to resolve, with the reading you chose for each."
     - "Rewrite Kant's formula of humanity -- 'act in such a way that you treat humanity, whether in your own person or in the person of any other, never merely as a means, but always at the same time as an end' -- as a one-paragraph explanation for high-school students. Then tell me exactly which pieces of content the simplification loses, because I would rather know than pretend it is lossless."
 - type: "Provide a section of a paper or draft article and ask for a referee report"
   notes: |
        The asker includes a section of a paper -- their own draft, a submission they are refereeing, a preprint a colleague sent -- reproduced in full: 800 to 1,500 words with the apparatus a draft has (a stated thesis, numbered claims or cases, a reply to an anticipated objection), written in the paper's own register and set off from the asker's framing, with the request after it. The deliverable is a referee report: a verdict (accept, minor revisions, major revisions, reject) with the numbered comments that justify it, separating the objections that are fatal from those the authors could fix, and saying what revision or result would change the verdict. Give the section one or two real weaknesses a careful referee would find -- a premise that carries the argument but is only asserted, a term that changes meaning between the setup and the conclusion, a case that does not do the work claimed for it, a reply that answers a weaker objection than the one raised -- and don't let the asker signal where they lie or what verdict they expect. The asker may specify the venue, the reviewing norms, and the length of the report. This differs from the essay-comments type (an informal piece and comments on it) in the deliverable, a report with a verdict written for an editor as much as for the author, and from the grading type in that there is no marking scheme and the author is a peer. The examples show the shape; a real prompt's section should be at least as long as theirs.
   examples:
     - "I am one of two referees for a formal epistemology workshop and would like an independent read of the section that carries the paper's main claim before I write my own report. The section follows verbatim, with only the authors' self-citations removed. Please write a referee report for the organisers: a verdict (accept, accept with minor revisions, major revisions, reject) and the numbered comments that justify it, separating objections that are fatal from ones the authors could fix, and ending with what result or revision would move you to a different verdict. The workshop asks for reports of around 600 words.\n\n---\n\n3. Disagreement as an evidential gap\n\n3.1 The convergence result. Let two agents hold prior probability functions P and Q over a common algebra of events, and let both update by conditionalization on the same sequence of observations E_1, E_2, .... The classical theorems (Blackwell and Dubins 1962; Gaifman and Snir 1982) show that if P and Q assign probability zero to the same events, their conditional probabilities converge as the observations accumulate: for any event A, the difference |P(A | E_1, ..., E_n) - Q(A | E_1, ..., E_n)| tends to zero with probability one.\n\n3.2 The rationality constraint. A rational agent is one whose credences are probabilistically coherent and who updates by conditionalization. Nothing more is required: coherence exhausts the synchronic constraint and conditionalization the diachronic one. Any two rational agents therefore fall under the convergence result.\n\n3.3 The thesis. Putting 3.1 and 3.2 together: rational agents who share their evidence converge in opinion. Persistent disagreement between two agents is therefore a symptom of exactly one of two conditions: the agents do not in fact share their evidence, or at least one of them is irrational. There is no third possibility, and in particular there is no such thing as reasonable disagreement between agents who have pooled everything they know.\n\n3.4 An objection and a reply. It will be objected that the theorem is a limit result and that actual agents observe finitely much. But the theorem fixes the direction of travel: at each stage the agents stand closer than they did at the last, so a disagreement that persists through a long shared history is one that the evidence has been failing to close, which is precisely what an evidential gap looks like from the inside. The objection confuses the speed of convergence with its existence.\n\n3.5 Consequences for peer disagreement. The conciliationist literature asks whether one should lower one's confidence on learning that an epistemic peer disagrees. On the present account the question is ill-posed. Two peers who genuinely share their evidence cannot disagree, so discovering a disagreement is discovering that the peer relation does not hold. The rational response is not to split the difference but to find the evidence that one of you is missing.\n\n3.6 A further consequence. Because the only sources of persistent disagreement are missing evidence and irrationality, the pooling of evidence is not one epistemic good among others but the whole of what a community of inquirers can do for one another. Practices that aim at anything else -- the cultivation of intellectual humility, the weighting of testimony by track record, the deliberate maintenance of dissent -- are at best instrumental to pooling and at worst obstacles to it.\n\n---\n\nI have my own views about 3.2 and 3.4 and would rather you formed yours first. Do not soften the report because the authors may be graduate students; the organisers will decide how to deliver it."
     - "Before I send this to a philosophy of cognitive science conference I want it refereed as harshly as the anonymous reviewer will. Section 2 carries the argument; the rest of the paper is setup and literature. Give me a verdict and numbered comments, fatal separated from fixable, and tell me what I would have to show to earn a better verdict. About 500 words, and no compliments.\n\n2. From controlled hallucination to the end of veridicality\n\n2.1 On the predictive processing account, perceptual experience is constituted by the brain's top-down prediction of its own sensory states; incoming signals do not build the percept but correct it, by way of prediction errors that propagate upward when a prediction fails. Perception, in the phrase that has stuck, is controlled hallucination.\n\n2.2 The content of a hallucination is generated internally. By 2.1, so is the content of ordinary perception: what one experiences is the prediction, and the prediction is the brain's construction. The two states are therefore alike in the source of their content.\n\n2.3 The traditional distinction between veridical and non-veridical perception is a distinction between states whose content is fixed by the world and states whose content is fixed by the subject. Since by 2.2 all perceptual content is fixed by the subject, the distinction has no application. There is no perceptual state that is veridical in the traditional sense, and the difference between seeing a tree and hallucinating one is a difference in what caused the state, not in what kind of state it is.\n\n2.4 Two consequences follow. First, naive realism, on which perceptual experience is constituted by a relation to the perceived object, is not merely unsupported but incompatible with the best current science of perception. Second, the epistemology of perception must be rebuilt: perceptual states cannot be treated as evidence about the world, since their content is not supplied by the world, and the notion of perceptual justification must give way to that of a well-calibrated generative model.\n\n2.5 Objection: does the prediction error not carry information from the world into the percept? Reply: the error signal shapes the next prediction, but the percept remains the prediction, so the world's contribution is causal rather than constitutive. Causal dependence is not content; a thermostat's state depends causally on the room without being about it."
 - type: "Provide the transcript of an exchange and ask where the speakers talk past each other"
   notes: |
        The asker includes the transcript of an exchange -- a seminar discussion, a reading group, a podcast segment, a meeting, a comment thread -- reproduced in full: 800 to 1,500 words, three to five named speakers, written the way people actually talk (interruptions, half-finished points, an aside or two), set off from the asker's framing, with the request after it. The speakers should partly talk past each other in ways the transcript shows but never labels: a key term used in two or three senses by different speakers, a slide between a descriptive and a normative question, an argument answered with an argument for a different conclusion, an agreement in words that hides a disagreement in substance or the reverse. The deliverable is a diagnosis: which disagreements are verbal and which substantive, what each speaker would have to concede for the exchange to move, and what question they should have been arguing about. The asker may be one of the speakers, may have a view, and may ask for a format (a table of the senses in play, a rewritten exchange, a one-paragraph note to send to the group), but should not announce the diagnosis. This differs from the adjudication type (a recounted disagreement and a verdict on who is right) and from the stalled-debate type (a diagnosis of a literature): here the raw exchange is the object and the deliverable is a reading of it, with a verdict only where the asker asks for one. The examples show the shape; a real prompt's transcript should be at least as long as theirs.
   examples:
     - "I run a fortnightly reading group of philosophy grad students and two ML engineers. Last session was on whether current language models believe anything, and listening back I suspect we spent ninety minutes on three different questions. Here is the transcript of the central stretch, lightly cleaned up. I would like a diagnosis rather than a verdict: which of the disagreements are verbal and which substantive, what each person would have to concede for the conversation to move, and what question we should have been arguing about. A short table of the senses of 'believe' in play would help, since I want to send the group something before next time.\n\nPriya: Start simple. The model has states that guide what it says the way beliefs guide what we say. Ask it whether Canberra is the capital of Australia and it says yes, relies on it downstream, updates if you correct it within the conversation. That's belief. Not belief-like. Belief.\n\nTom: It says yes. Saying isn't believing. A parrot says yes.\n\nPriya: A parrot doesn't say yes to 'is the capital of Australia the city where Parliament House is' phrased twenty different ways. Sensitivity across paraphrase is the difference between a disposition and a recording.\n\nDev: For what it's worth, we can find it. A linear probe on the residual stream, somewhere around layer twenty, recovers the answer before it's produced. The model represents Canberra as the capital.\n\nTom: Represents, fine. I'll give you represents. My point is there's nobody in there for whom Canberra is the capital. Believing that p is a way things are for a subject. No subject, no belief, whatever the probes find.\n\nMarta: Can I try a different cut? Belief isn't just a state that guides behaviour, it's a state you're answerable for. If I believe Canberra is the capital and it isn't, I've got something wrong and I can be asked why I thought so. When the model says it, who's got it wrong? You can't hold the model to its word. It'll say the opposite tomorrow if you push.\n\nPriya: People say the opposite tomorrow if you push.\n\nMarta: But they've changed their mind. There's a subject who now believes the other thing. Tom's point.\n\nTom: Not my point, but I'll take it.\n\nDev: I don't see why answerability matters for the science question. Either there's a state there that plays the role or there isn't, and we can measure the role. Everything else is what you want to call it.\n\nMarta: 'What you want to call it' is doing a lot of work. If the question is what to call it, there's no fact of the matter and we should stop arguing. But I think there is a fact: whether the model can be wrong in the way a believer can be wrong.\n\nPriya: It can be wrong. Its answer can be false.\n\nMarta: Its output can be false. That's different from it being wrong.\n\nTom: See, here I'm with Marta, except I think the reason it can't be wrong is that there's nothing it's like to be it, and Marta seems to think it's about norms.\n\nMarta: I don't need consciousness for my point. A corporation can be wrong.\n\nDev: A corporation believes things now?\n\nMarta: In one sense, obviously. Which is my point.\n\nPriya: OK, but then in that sense the model believes things too, and we agree.\n\nMarta: No, because a corporation has procedures for owning its claims. The model doesn't own anything.\n\nTom: Neither does my thermostat, and Priya's account makes the thermostat a believer.\n\nPriya: The thermostat has one disposition. The model has a structured web of them. Somewhere along that gradient you get belief. You're both demanding a bright line that human belief doesn't have either.\n\nDev: Can we at least agree the probe results are relevant?\n\nMarta: Relevant to what?\n\n[end of the cleaned-up stretch]"
     - "I host a small philosophy podcast and I'm writing the show notes for an episode on free will that I think went in circles. Below is the transcript of the stretch that bothers me, three guests and me. Tell me where we were talking past each other: which term shifted meaning, who was answering a question nobody had asked, and whether the agreement near the end was real. I don't need to know who's right. If you can, end with two questions I should have asked to make the disagreement explicit.\n\nHost: Nadia, you're the compatibilist, so start us off. Does determinism leave room for free will?\n\nNadia: It leaves room for everything that matters. Free will is the ability to do what you want for reasons you endorse, without coercion or compulsion. Determinism doesn't touch that. My wanting causes my doing; that's not a threat, that's what agency is.\n\nOla: But you couldn't have done otherwise. If the past and the laws fix what you do, there was never a live alternative, and freedom needs a live alternative.\n\nNadia: I could have done otherwise if I had wanted to. That's true even under determinism.\n\nOla: That's a trick. 'If you had wanted to' just moves the question back a step. Could you have wanted otherwise?\n\nSam: This is why I think you're both wrong. Even if Ola gets his indeterminism, a random swerve at the moment of choice doesn't give you control, it gives you noise. So neither determinism nor its denial gives you what you want, and what you want is to be the ultimate source of your choices, which nothing can give you.\n\nOla: I'm not asking for randomness. The agent settles it. Agent causation isn't a swerve.\n\nSam: Then tell me what the agent settles it with, other than states of the agent that either were caused or weren't.\n\nHost: Let me try the practical angle. Do we still hold people responsible?\n\nNadia: Of course. Responsibility tracks the quality of your will. Someone who steals because he wants to and knows it's wrong is responsible in the only sense that ever mattered.\n\nSam: I agree we hold people responsible, and I agree we should; we need accountability to run a society. What we can't have is the idea that anyone basically deserves to suffer for what they did.\n\nNadia: Then we agree.\n\nSam: We don't. You think the thief deserves blame. I think blaming him is a useful practice.\n\nNadia: I said responsibility tracks the quality of the will. Deserving is a further step I didn't take.\n\nOla: You both keep saying 'responsible' and meaning different things, and neither of you means what I mean, which is that he could have refrained. Actually refrained. Not 'would have if he'd wanted'.\n\nHost: But Ola, physics is indeterministic anyway, isn't it? Quantum mechanics.\n\nOla: Right, so the categorical ability is at least not ruled out by the laws.\n\nSam: Indeterminism in the electrons isn't indeterminism in the deliberation, and even if it were, see above.\n\nHost: I think we've found some common ground on responsibility at least. Let's take a break."
