    - https://plato.stanford.edu/entries/money-finance/
    - https://en.wikipedia.org/wiki/Chartalism
- domain: 'Positional goods (Hirsch''s Social Limits to Growth, 1976): goods valued for relative standing or socially scarce, like elite degrees, top jobs, and unspoiled beaches, so that if everyone stands on tiptoe no one sees better; whether growth in positional spending adds to welfare, how welfare measures should treat relative income, Frank''s progressive consumption tax, and whether envious preferences should count'
  urls:
    - https://en.wikipedia.org/wiki/Positional_good
- domain: 'What would economics be without scarcity? Keynes''s ''Economic Possibilities for our Grandchildren'' (1930), which foresaw the economic problem solved within a century, Star Trek''s replicator economy and ''fully automated luxury communism'', Hume''s view that rules of property exist only because goods are scarce, and what would stay scarce even then: land, status, attention, and time'
  urls:
    - https://en.wikipedia.org/wiki/Post-scarcity
    - https://plato.stanford.edu/entries/property/
- domain: 'Market microstructure: does the way trading is organized change what gets into prices? Kyle''s insider who trades gradually to hide among noise traders (1985), Glosten and Milgrom''s bid-ask spread as the dealer''s toll for trading against the better informed, Budish, Cramton, and Shim''s frequent batch auctions to end the high-frequency speed race, and whether price discovery depends on market design'
  urls:
    - https://en.wikipedia.org/wiki/Market_microstructure
    - https://en.wikipedia.org/wiki/High-frequency_trading
- domain: Is price discrimination unfair or welfare-improving? Pigou's three degrees, the result that third-degree discrimination can raise welfare only if it raises output (Schmalensee; Varian), tiered drug prices that let poor countries pay less, Dupuit's railways leaving third-class carriages roofless to deter richer riders, and personalized online pricing; whether charging by willingness to pay exploits buyers or serves more of them
  urls:
    - https://en.wikipedia.org/wiki/Price_discrimination
- domain: 'Two-sided markets: why platforms such as payment cards, newspapers, dating apps, and app stores charge one side little or nothing to attract the other (Rochet and Tirole), the chicken-and-egg problem of starting one (Caillaud and Jullien), network effects that tip markets toward monopoly, and Ohio v. American Express (2018) on weighing harm to both sides together; whether ''free'' services make users the product'
  urls:
    - https://en.wikipedia.org/wiki/Two-sided_market
    - https://en.wikipedia.org/wiki/Network_effect
- domain: 'Regulatory capture as the default: Stigler''s ''The Theory of Economic Regulation'' (1971) on regulation acquired by and run for the industry, concentrated benefits vs. diffuse costs, Yandle''s bootleggers and Baptists, occupational licensing and the revolving door, and Carpenter and Moss''s case that capture is overstated and preventable; whether incumbents'' calls for licensing (as in AI) are public-spirited or moats'
  urls:
    - https://en.wikipedia.org/wiki/Regulatory_capture
- domain: 'What cost-benefit analysis distorts when it monetizes: Ackerman and Heinzerling''s Priceless on pricing lives and nature, the gap between willingness to pay and willingness to accept, contingent valuation after the Exxon Valdez spill, lower values of statistical life for poor countries (the IPCC''s 1995 controversy), and Sunstein''s The Cost-Benefit Revolution; whether monetizing distorts choices or only makes trade-offs explicit'
  urls:
    - https://en.wikipedia.org/wiki/Cost%E2%80%93benefit_analysis
- domain: 'Moral hazard and risk compensation: does protection from a risk invite more of it? Arrow and Pauly on insured patients'' extra spending (rational, Pauly said, not immoral), Peltzman''s claim that drivers offset car-safety rules by driving less carefully (1975), Buchanan''s Samaritan''s dilemma, and fears about bailouts, naloxone, and PrEP; whether such fears justify withholding help, and whether the label blames the insured (Tom Baker)'
  urls:
    - https://en.wikipedia.org/wiki/Moral_hazard
    - https://en.wikipedia.org/wiki/Risk_compensation
- domain: 'The hold-up problem: why invest in a relationship when the other side can renegotiate once you are locked in? Klein, Crawford, and Alchian''s story of GM buying out Fisher Body (1978) and Coase''s reply that no hold-up occurred (2000), Williamson''s asset specificity, Grossman and Hart''s incomplete contracts, and Macaulay''s finding that firms seldom rely on formal contracts (1963); whether trust can replace enforceable promises'
  urls:
    - https://en.wikipedia.org/wiki/Hold-up_problem
- domain: 'The Coase conjecture (''Durability and Monopoly'', 1972): a monopolist selling a durable good competes with its own future discounts, since buyers who expect prices to fall will wait, so without commitment its price falls toward cost; Gul, Sonnenschein, and Wilson''s proof (1986), and leasing, planned obsolescence (Bulow), limited editions, and price guarantees as remedies; whether market power requires binding one''s future self'
  urls:
    - https://en.wikipedia.org/wiki/Coase_conjecture
- domain: 'Efficiency wages: why would a profit-seeking firm pay more than it must? Ford''s five-dollar day (1914) against turnover, Shapiro and Stiglitz''s model in which fear of unemployment deters shirking (1984), Akerlof''s labour contracts as partial gift exchange (1982), and nutritional efficiency wages in poor economies (Leibenstein); whether paying above market is generosity or self-interest, and whether it explains involuntary unemployment'
  urls:
    - https://en.wikipedia.org/wiki/Efficiency_wage
- domain: 'The theory of the second best (Lipsey and Lancaster, 1956): when one condition for an optimum cannot be met, meeting the others may make things worse, as when a customs union diverts trade from cheaper outsiders (Viner); whether this dooms piecemeal reform, Goodin''s use of it against approximating political ideals (1995), and its parallel in ethics (Jackson and Pargetter''s Professor Procrastinate)'
  urls:
    - https://en.wikipedia.org/wiki/Theory_of_the_second_best
- domain: 'Rational inattention (Sims, 2003): if attention is a channel of limited Shannon capacity, it is optimal to follow most news only roughly, which may explain sluggish prices; Matějka and McKay''s derivation of logit choice (2015), shoppers who underreact to taxes left off price tags (Chetty et al., 2009); whether biases are economical inattention, and whether a theory that rationalizes any neglect explains anything'
  urls:
    - https://en.wikipedia.org/wiki/Rational_inattention
- domain: 'The tragedy of the anticommons (Heller, 1998): when many owners can each block a use, a resource sits idle, the mirror image of the overused commons; Moscow''s empty storefronts beside busy kiosks, Heller and Eisenberg''s warning that gene patents could stall biomedical research (1998), Buchanan and Yoon''s symmetric model (2000), and holdouts in land assembly; whether gridlock justifies eminent domain or patent pools'
  urls:
    - https://en.wikipedia.org/wiki/Tragedy_of_the_anticommons
