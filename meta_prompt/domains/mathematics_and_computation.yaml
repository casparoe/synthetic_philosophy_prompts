# Mathematics and computation: philosophy of mathematics, foundations, set theory, Goedel, finitism, very large numbers, computability, complexity, Kolmogorov complexity, randomness, mathematical paradoxes
- domain: 'Philosophy of mathematics: platonism vs. nominalism'
- domain: Solomonoff induction, Kolmogorov complexity, and Occam's razor
- domain: Gödelian anti-mechanist arguments (Lucas--Penrose)
- domain: The continuum hypothesis
- domain: The axiom of choice
- domain: Zorn's lemma
- domain: The possibility that the basic axioms of math are inconsistent
- domain: The Church-Turing thesis and its epistemic status
- domain: Philosophical implications of computational complexity
- domain: Intuitionistic logic and mathematical constructivism
- domain: Supertasks and Thomson's lamp
- domain: Wigner's "unreasonable effectiveness of mathematics"
- domain: 'Gödel''s incompleteness theorems outside mathematics: what they do and don''t show'
- domain: 'Actual infinities: Hilbert''s hotel, Cantor, and finitism'
- domain: Benacerraf's dilemma
- domain: Zeno's paradoxes
- domain: Jumping out of the system (JOOTSing) and the MU-puzzle
- domain: Computer-assisted and unsurveyable proofs (the four-colour theorem, the Kepler conjecture)
- domain: The indispensability argument and mathematical explanation in science (cicada primes, honeycombs)
- domain: 'Lakatos''s Proofs and Refutations: is mathematics quasi-empirical?'
- domain: Mathematical structuralism and the identity problem (is 2 an element of 4?)
- domain: 'Algorithmic randomness: can a finite sequence be random?'
- domain: 'Formalism, intuitionism, and logicism: what the three schools disagree about'
- domain: 'The real numbers and the continuum: discovered or defined?'
- domain: 'Why mathematical definitions are chosen as they are: generalization and the ''right'' notion (open sets, groups)'
- domain: 'Well-definedness and canonical choices: does it matter how you label the roots?'
- domain: What counts as a legitimate mathematical object? From compass constructions to transcendental curves
- domain: Euclid's definitions and the concept of a unit
- domain: 'The origins of mathematics: when does counting become mathematics? (Plimpton 322)'
- domain: 'Understanding vs. procedural fluency in mathematics: what it means to understand a proof'
- domain: Motivation vs. rigor in teaching mathematics
- domain: 'Thought and code: is programming a language of thought?'
- domain: 'State and identity in programming: why is mutation hard to think about?'
- domain: 'Assembly theory and measures of complexity: what makes an object complex?'
- domain: Computational irreducibility and the limits of explanation
- domain: 'Wolfram''s A New Kind of Science: cellular automata, the principle of computational equivalence, and whether it is science'
- domain: 'Comparing infinite sets by size: cardinality, bijections, the part-whole intuition, and isomorphism (Galileo''s paradox, Cantor)'
- domain: 'The Banach--Tarski paradox: measure, choice, and what ''volume'' can mean'
- domain: 'The coastline paradox: is the length of a border well-defined?'
- domain: 'Gabriel''s horn: finite volume, infinite surface, and what ''paint'' means'
- domain: 'Grandi''s series and the Ross--Littlewood paradox: what infinite processes leave behind'
- domain: 'All horses are the same colour: where the induction proof goes wrong'
- domain: The interesting number paradox
- domain: 'The inventor''s paradox: why the more general problem is easier'
- domain: 'The Sierpiński--Mazurkiewicz paradox: a plane set that splits into two pieces each congruent to the whole, explicitly described and without the axiom of choice'
- domain: 'Besicovitch sets and the Kakeya needle problem: a null set containing a unit segment in every direction, and turning a needle around in arbitrarily small area'
- domain: 'The Cantor function: continuous, non-decreasing from 0 to 1, with derivative zero almost everywhere; all of its growth happens on a null set'
- domain: 'Hilbert''s third problem and the Dehn invariant: equal-area polygons are scissors-congruent, equal-volume polyhedra need not be, and why dissection intuition fails one dimension up'
- domain: 'Exotic R^4: uncountably many smooth structures in dimension four and exactly one in every other dimension, with no explanation from outside'
- domain: 'Weierstrass functions: continuous everywhere, differentiable nowhere, and Baire-generic; the smooth functions are the exceptions'
- domain: 'Conway''s base-13 function: every real value on every interval, so Darboux''s intermediate value property without continuity at a single point'
- domain: 'Volterra''s function: differentiable everywhere with a bounded derivative that is not Riemann integrable, and why the fundamental theorem of calculus needs Lebesgue'
- domain: 'The Fabius function: infinitely differentiable everywhere and analytic nowhere; a Taylor series useless at every point'
- domain: 'Thomae''s function and the Baire category theorem: continuous exactly at the irrationals, while no function is continuous exactly at the rationals'
- domain: 'Goodstein''s theorem, the Hydra game, and Paris--Harrington: natural statements that are true but unprovable in Peano arithmetic'
- domain: 'Hardin--Taylor prediction: guessing f(t) from f on the past, correct except at a null set of times, and a closed box guessed right with probability 99/100; the axiom of choice doing all the work'
- domain: 'The continuum hypothesis in disguise: Sierpiński''s three-set decomposition of R^3, Wetzel''s problem on entire functions, and ordinary-sounding questions independent of ZFC'
- domain: 'The strong law of small numbers: hypotheses whose only counterexamples are astronomically large (Pólya''s conjecture, Mertens''s conjecture, the Skewes number), and what a pattern checked to a billion is evidence of'
- domain: 'Proofs as programs: the Curry--Howard correspondence, and what a verified program guarantees about the world (Fetzer''s challenge)'
- domain: 'Infinitesimals: Berkeley''s ghosts of departed quantities, Robinson''s non-standard analysis, and whether Leibniz was right all along'
- domain: 'The set-theoretic multiverse (Hamkins) vs. one true universe (Woodin): whether the continuum hypothesis has an answer'
- domain: 'Large cardinals: believing axioms that cannot be proved, and intrinsic vs. extrinsic justification (Gödel, Maddy)'
- domain: 'Univalent foundations and category theory as foundations: homotopy type theory, the topos, and what a "foundation" is supposed to do'
- domain: 'Probabilistic proofs: Miller--Rabin certainty of 1 - 2^-100, zero-knowledge proofs, and whether that is mathematical knowledge (Fallis)'
- domain: 'Reverse mathematics: which axioms a theorem really needs, the Big Five subsystems, and what that says about mathematical necessity'
- domain: 'The axiom of choice, the well-ordering theorem, and Zorn''s lemma: provably equivalent over ZF (as are Tychonoff''s theorem and ''every vector space has a basis''), yet the first looks obviously true, the second obviously false, and the third hard to judge (Jerry Bona''s joke); what the divergence says about intuitions as evidence for axioms'
- domain: Do simple mathematical facts have simple reasons? Gowers's no-coincidence principle (an apparently outrageous coincidence in mathematics has a reason), ARC's computational no-coincidence conjecture for reversible circuits, Chebyshev's bias, and whether some mathematical truths are true for no reason at all (Chaitin)
- domain: 'Explanation within mathematics: why some proofs explain while others merely verify (Steiner, Lange), mathematical coincidences, and whether every mathematical truth has an explanation, or only the ones we find surprising'
- domain: 'Why 0.999... = 1: the standard proofs, why so many students resist them, and whether the resistance reflects a confusion or a coherent intuition about infinitesimals (and what non-standard analysis does and does not license)'
- domain: 'Invalid proofs: derivations of 1 = 2 by hidden division by zero, careless square roots, or rearranging a conditionally convergent series, what makes a false proof convincing, and why a proof''s validity is not visible on its face'
- domain: 'The ant on a rubber rope: an ant crawling at 1 cm per second along a 1 km rope that stretches by 1 km every second still reaches the end, because the harmonic series diverges; why ''falling ever further behind'' intuitions fail, and when the analogy with light crossing an expanding universe holds'
- domain: 'The potato paradox: potatoes that are 99% water, dried until they are 98% water, have lost half their weight; why percentage changes in a small remainder defeat intuition'
- domain: 'Cramer''s paradox: two curves of degree four meet in sixteen points, though fourteen points ordinarily determine such a curve; why intersection points impose dependent conditions (Cramer, Euler, Cayley--Bacharach), and what the case teaches about counting constraints'
- domain: 'The Hausdorff and von Neumann paradoxes: the sphere minus a countable set is equidecomposable with two copies of itself, while in the plane rigid motions allow no such decomposition but area-preserving affine maps do; what amenability has to do with whether ''size'' makes sense'
- domain: 'The coin rotation paradox: a coin rolled around an identical fixed coin makes two full turns, not one; the 1982 SAT question that had no correct answer, and what counting ''rotations'' depends on (frames of reference, sidereal vs. solar days)'
- domain: 'Hooper''s paradox and the missing square puzzle: rearranged pieces that seem to gain or lose area, and why a diagram that looks like a proof can hide a sliver'
- domain: 'The Nikodym set: a subset of the unit square with full measure such that through each of its points there is a line meeting the set at that point alone; measure, category, and the reliability of geometric intuition'
- domain: 'Sphere eversion (Smale''s paradox): a sphere can be turned inside out through itself without tearing or creasing, a result proved before anyone could picture how; what an existence proof without a picture gives us'
- domain: 'Aristotle''s wheel paradox: two concentric wheels rolling together trace equal distances though their circumferences differ; slipping, Galileo''s infinitely many infinitesimal gaps, and the paradox''s place in the history of the continuum'
- domain: 'Schmidhuber''s Gödel machine: a program that rewrites any part of its own code, including its proof searcher, once it has proved that the rewrite raises expected utility, the ''global optimality theorem'' (no local maxima, since it must first prove that searching for alternatives is not better), and how incompleteness, the cost of proof search, and the Löbian obstacle limit the idea'
- domain: 'Finitism and ultrafinitism: Hilbert''s finitary standpoint, Kronecker''s ''God made the integers'', ultrafinitists who doubt that numbers like 10^10^10 exist (Yessenin-Volpin, who paused longer before affirming each successive power of two), Nelson''s failed proof that Peano arithmetic is inconsistent, and whether finitism can be stated without the infinite mathematics it rejects'
- domain: 'Knuth''s up-arrow notation and very large numbers: iterated exponentiation (3^^^3 in Yudkowsky''s thought experiments), Graham''s number, the busy beaver function, and TREE(3); whether intuitions, utilities, and probabilities still make sense at such magnitudes, and what it means for a number to exist if it can never be written down'
- domain: 'Kolmogorov complexity: the length of the shortest program that outputs a string, invariance up to an additive constant across universal machines (and why the constant can swamp everything in practice), uncomputability by way of the Berry paradox, and whether it gives Occam''s razor an objective foundation or only relocates the choice of language'
- domain: 'Martin-Löf randomness: three independent analyses of a random infinite sequence (it passes every effective statistical test, its initial segments are incompressible in prefix-free Kolmogorov complexity, no effective betting strategy wins against it) turn out to coincide; what the convergence says about the concept, and rival notions (Schnorr randomness, computable randomness)'
- domain: 'Von Mises''s collectives: randomness as stable limiting frequencies under admissible place selections, Church''s restriction to computable selections, and Ville''s construction of a sequence that passes all of them yet has at least half heads in every initial segment, which pushed the theory toward Martin-Löf'
- domain: 'Pseudorandomness in complexity theory: a distribution counts as random if no efficient algorithm can tell it apart from uniform (Blum, Micali, Yao), which makes randomness relative to the observer''s computational power; derandomization and the conjecture that P = BPP, and what this means for the idea that randomness belongs to individual sequences'
- domain: Is randomness objective? Randomness of individual sequences (algorithmic), of processes (chance), and relative to an observer's knowledge or computing power (Eagle's 'Randomness Is Unpredictability'); which notion matters for statistics, for chance in physics, and for free will
- domain: What if ZFC turned out to be inconsistent? How much ordinary mathematics needs the strong axioms (reverse mathematics suggests little), how mathematicians repaired earlier crises (Russell's paradox, Frege's Basic Law V), Voevodsky's 2010 lecture asking what happens if current foundations are inconsistent, and what our confidence in consistency rests on
- domain: 'Fractals: self-similar shapes with fractional dimension (the Koch curve, the Cantor set, the Mandelbrot set), Mandelbrot''s ''How Long Is the Coast of Britain?'' and The Fractal Geometry of Nature, whether coastlines, ferns, and markets are really fractal or only over a range of scales, and why simple rules produce endless complexity'
- domain: 'Gödel''s incompleteness theorems and the possibility of AI: Lucas''s and Penrose''s arguments that human mathematicians can see the truth of a machine''s Gödel sentence and so are not machines, Turing''s early reply to ''the mathematical objection'', and the counter that we cannot know our own consistency (Benacerraf, Feferman, Putnam)'
- domain: 'Lawvere''s fixed point theorem: one category-theoretic result behind Cantor''s diagonal argument, Russell''s paradox, Gödel''s incompleteness, Tarski''s undefinability, and the halting problem (Yanofsky''s ''A Universal Approach to Self-Referential Paradoxes, Incompleteness and Fixed Points''); what the unification says about self-reference and the limits of formal systems'
