- domain: 'Reductionism in Yudkowsky''s sequence (''Hand vs. Fingers'', ''Angry Atoms'', ''Explaining vs. Explaining Away''): higher-level models as maps of a single-level territory, why a hand is nothing over and above fingers yet still a useful concept, and how this differs from eliminativism and from nonreductive physicalism'
- domain: 'Backward causation: could an effect precede its cause? Dummett''s ''Bringing About the Past'', the bilking argument (Flew, Black), retrocausal interpretations of quantum mechanics (Price, Wharton), and whether the direction of causation is set by the arrow of time or by the perspective of agents'
- domain: 'Tegmark''s Level IV multiverse (the mathematical universe hypothesis): every mathematical structure exists physically and we are self-aware substructures of one; the measure problem (which structures are typical?), restricting it to computable structures, and whether it explains why there is something rather than nothing'
- domain: 'Lewis''s modal realism: possible worlds as concrete, spatiotemporally isolated universes as real as ours, the incredulous stare, the argument from theoretical utility (modality, counterfactuals, properties, content), and Kripke''s Humphrey objection that Humphrey cares whether he wins, not whether a counterpart does'
- domain: 'A-theory vs. B-theory of time: McTaggart''s argument that time is unreal, whether tense and the passage of time are objective or perspectival, the growing block and moving spotlight views, and what relativity''s lack of absolute simultaneity does to the A-theory'
