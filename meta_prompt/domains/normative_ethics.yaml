- domain: 'If pain could be transferred between people: a market in which the poor are paid to bear the pain of the rich (Satz on noxious markets), victims sending suffering back to offenders, a duty to take on a little pain to spare a stranger much (Singer''s demandingness), spreading pain thinly over many vs. concentrating it (torture vs. dust specks), and what transfer would show about the separateness of persons'
- domain: Why do unobservable intentions matter morally? Piaget's finding that young children judge a boy who broke fifteen cups by accident naughtier than one who broke a cup sneaking jam, Cushman's evidence that adults judge wrongness by intent but punishment partly by outcome, Scanlon's claim (Moral Dimensions) that intent bears on an act's meaning, rarely its permissibility, and courts inferring mens rea from conduct
