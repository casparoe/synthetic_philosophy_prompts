- domain: 'Directed obligations: what is the difference between doing wrong and wronging someone? Darwall''s The Second-Person Standpoint (2006), which grounds obligation in our authority to make demands of one another (telling someone to get off your foot vs. noting that pain is bad), Thompson''s ''bipolar'' normativity, Wallace''s The Moral Nexus (2019), and Strawson''s reactive attitudes; whether every duty is owed to someone'
- domain: 'Culpable ignorance: when does not knowing excuse? Aristotle''s drunk, blamed for an ignorance he brought on himself, Aquinas''s vincible vs. invincible ignorance, Holly Smith''s ''benighting acts'' (''Culpable Ignorance'', 1983), the regress argument (Zimmerman, Rosen) that culpable ignorance must trace back to a knowing wrong and so is rarer than we think, and wilful blindness in law; whether unwitting negligence is blameworthy'
