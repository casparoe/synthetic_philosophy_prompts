- domain: 'The core of a cooperative game: allocations that no coalition can improve on by going it alone, games with an empty core (three people dividing a dollar by majority vote), the Bondareva--Shapley balancedness condition, and Edgeworth''s conjecture, proved by Debreu and Scarf, that the core of a large economy shrinks to its competitive equilibria; what an empty core says about the stability of cooperation'
- domain: 'Von Neumann and Morgenstern''s stable sets: sets of imputations that are internally stable (no member dominates another) and externally stable (every outsider is dominated by a member), read as a society''s ''standard of behaviour''; discriminatory solutions of the three-person majority game, Lucas''s game with no stable set, and whether stable norms rather than stable outcomes are the right target'
- domain: 'Imputations in cooperative games: divisions of the total payoff that give every player at least what they could get alone (the glove game), domination between imputations through coalitions, how the solution concepts built on them (core, stable sets, nucleolus, Shapley value, Kalai--Smorodinsky) encode different ideas of fairness and stability, and whether cooperative agreements stay stable over time'
- domain: 'Interpersonal comparisons and bargaining: Nash''s solution is invariant to rescaling each party''s utility and so needs no comparisons, Kalai''s egalitarian solution and the utilitarian solution need them, and whether a fair bargain can be defined without them; what this means for cooperation between agents whose values share no common scale'
- domain: 'Interpretations of mixed strategies in game theory: deliberate randomization, Harsanyi''s purification (mixed equilibria as limits of pure behaviour by players with small private payoff differences), frequencies in a population, and opponents'' beliefs about a player (Aumann and Brandenburger; Rubinstein''s ''Comments on the Interpretation of Game Theory''); what a mixed equilibrium predicts'
- domain: 'The multiplicity of equilibria: what game theory predicts when a game has many equilibria, Harsanyi and Selten''s theory of equilibrium selection (risk dominance vs. payoff dominance), refinements (subgame perfection, trembling-hand perfection), selection by stochastic stability (Kandori, Mailath, and Rob; Young), focal points, and whether multiplicity shows the theory is incomplete'
- domain: 'Taxonomies of 2x2 games: Rapoport and Guyer''s catalogue of 78 strictly ordinal games and Robinson and Goforth''s ''periodic table'' of 144, where the prisoner''s dilemma, chicken, the stag hunt, and the battle of the sexes sit among their neighbours, and what such maps reveal about which games are strategically alike'
- domain: 'Bargaining with private information: the Myerson--Satterthwaite theorem that no mechanism can guarantee efficient trade between a buyer and a seller who each know only their own value, delays and strikes as costly signals, and what the impossibility means for negotiation and for markets'
- domain: 'Evolutionary game theory: evolutionarily stable strategies (Maynard Smith and Price''s ''The Logic of Animal Conflict''), replicator dynamics, how ''strategies'' can be selected without rational agents, and what it explains about animal contests, signalling, and the evolution of norms (Skyrms''s Evolution of the Social Contract)'
- domain: 'Game theory and ethics: Braithwaite''s 1954 lecture proposing game theory as a tool for moral philosophers, Gauthier''s Morals by Agreement (constrained maximization), Binmore''s Natural Justice, and whether morality can be derived from rational self-interest or game theory can only describe it'
- domain: 'Focal points in detail: Schelling''s questionnaires (where to meet a stranger in New York, whether to name heads or tails), Mehta, Starmer, and Sugden''s experiments contrasting picking with coordinating, theories of salience (team reasoning in Bacharach and Sugden, level-k thinking), and why salience cannot be read off the payoffs'
- domain: 'Experimental evidence on the prisoner''s dilemma: Flood and Dresher''s 1950 RAND experiment, one-shot cooperation rates near one half that decline with repetition (Sally''s meta-analysis), Shafir and Tversky''s finding that people who defect whether they know the partner cooperated or defected often cooperate when they do not know, the effects of communication and framing, and the game show Golden Balls'
- domain: 'Strict vs. weak dominance: why eliminating strictly dominated strategies is uncontroversial and order-independent, while iterated elimination of weakly dominated strategies can depend on the order of elimination and can remove Nash equilibria; admissibility and its epistemic foundations (Brandenburger, Friedenberg, and Keisler), and dominance by mixed strategies'
- domain: 'Nice weak dominance (Marx and Swinkels): weak dominance restricted to ''compatible'' strategies (whenever the player is indifferent between them, so is everyone else), which makes iterated elimination order-independent up to payoff equivalence; other variants such as very weak dominance, and what order dependence says about weak dominance as a requirement of rationality'
- domain: 'Cournot''s model of oligopoly: firms choosing quantities, a Cournot--Nash equilibrium between the monopoly and competitive outcomes that approaches the competitive price as firms multiply, and the dispute over whether firms really choose quantities or prices (Kreps and Scheinkman''s capacity-then-price defence)'
- domain: 'Bertrand''s model of oligopoly: firms that choose prices undercut each other until price equals marginal cost even when there are only two of them, the ways out of the paradox (capacity limits, product differentiation, repeated interaction and tacit collusion), and what the model implies about how many competitors a market needs'
- domain: 'Stackelberg''s duopoly model: a leader who commits to a quantity before the follower moves earns more than in Cournot competition, the value of commitment and of moving first, and when moving first is a disadvantage instead (price competition, information revealed by the leader''s move)'
- domain: 'The war of attrition: two players pay a cost every moment until one concedes, Maynard Smith''s analysis of animal contests, the mixed equilibrium in which concession times are random, all-pay auctions, and attrition in strikes, standards battles, and wars'
- domain: 'Auction theory: first-price vs. second-price (Vickrey) auctions and why truthful bidding is optimal in the latter, the revenue equivalence theorem, the winner''s curse in common-value auctions, and the spectrum auctions designed by Milgrom and Wilson; what auctions teach about mechanism design'
- domain: 'Subgame perfect equilibrium: Selten''s refinement that rules out non-credible threats, backward induction in finite games, entry deterrence and the chain-store game, and the epistemic puzzle of reasoning about what a rational player would do after an irrational move (Binmore, Bicchieri, Reny, and Aumann''s defence of backward induction)'
- domain: 'The one-deviation property: in finite extensive games, and in infinite ones that are continuous at infinity, a strategy profile is subgame perfect if no player can gain by deviating at a single history and conforming afterwards; why this makes equilibria checkable, its use in repeated games, and its link to the principle of optimality in dynamic programming'
- domain: 'The ultimatum game''s evidence: proposers in student samples typically offering 40--50% and responders often rejecting offers below about 20%, the variation across fifteen small-scale societies (Henrich et al.; the Machiguenga''s low offers), the effect of stakes, and whether rejections express fairness norms, spite, or reputational habits carried into anonymous play'
- domain: 'Bayesian games: Harsanyi''s insight that incomplete information about others'' payoffs can be modelled as uncertainty about types drawn by nature, the common prior assumption, Bayesian Nash equilibrium, and Cournot competition between firms that do not know each other''s costs; whether modelling with type spaces is innocent (Mertens and Zamir''s universal type space)'
- domain: 'Sequential equilibrium (Kreps and Wilson) and perfect Bayesian equilibrium: equilibria that specify beliefs at information sets reached with probability zero, the consistency requirement on those beliefs, and why what a player should believe after a surprising move is a philosophical question as much as a technical one'
- domain: 'Signaling games: Spence''s job-market signaling (education as a costly signal of ability whether or not it raises productivity), separating vs. pooling equilibria, Cho and Kreps''s intuitive criterion and the beer--quiche game, and Lewis''s signaling games as an account of how conventions of meaning arise (Skyrms)'
- domain: 'Bayesian persuasion (Kamenica and Gentzkow): a sender who commits in advance to how evidence will be generated can shift a rational receiver''s decisions (a prosecutor who designs investigations to convict more often without deceiving anyone), information design, and whether persuading perfectly rational Bayesians is manipulation'
- domain: 'Rationalizability (Bernheim; Pearce): strategies that survive the iterated removal of strategies that are never a best response to any belief, what common knowledge of rationality alone implies, its relation to iterated strict dominance, and why it is often much weaker than Nash equilibrium'
- domain: 'Beyond Axelrod''s tournaments: why tit-for-tat''s success depends on the population it meets, noise and the rise of generous tit-for-tat and win-stay lose-shift (Nowak and Sigmund), Press and Dyson''s zero-determinant strategies that can extort their opponents, and what tournaments can and cannot show about the evolution of cooperation'
- domain: 'The political strategy of nuclear weapons: deterrence by threat of retaliation, mutual assured destruction and second-strike capability, Schelling''s ''threat that leaves something to chance'' and brinkmanship, Kahn''s escalation ladder, counterforce vs. countervalue targeting, extended deterrence for allies, and whether the nuclear taboo (Tannenwald) or luck explains eight decades without nuclear use'
- domain: 'Forgiveness and provocability in the iterated prisoner''s dilemma: Tit for Two Tats (retaliating only after two defections in a row; Axelrod noted it would have won his first tournament had it been entered), Suspicious Tit for Tat (opening with a defection), Grim Trigger (defecting forever after one defection), and Gradual (after the opponent''s k-th defection, defect k times, then cooperate twice); how much to forgive, and how fast'
- domain: 'Mistakes in repeated cooperation: Generous Tit for Tat, which forgives a defection with some probability (about 1/3 with payoffs 5, 3, 1, 0) to break the cycle of retaliation that a single error starts, and Contrite Tit for Tat, which after its own unprovoked slip cooperates and absorbs the opponent''s retaliation; forgiveness and contrition as strategies, and what they suggest about the human versions'
- domain: 'Win-Stay, Lose-Shift (Pavlov): repeat your last move if it earned the reward or temptation payoff, switch otherwise; Nowak and Sigmund''s 1993 finding that it beats Tit for Tat in noisy evolutionary simulations, its weakness against Always Defect (suckered every other round), and whether such simple learning rules explain cooperation in nature'
- domain: 'Sneaky strategies in Axelrod''s tournaments: Joss (Tit for Tat that defects 10% of the time it would cooperate) and Tester (opening with a defection to see whether the opponent retaliates, then exploiting or reverting to Tit for Tat), why such tweaks did worse than plain Tit for Tat, and Axelrod''s lesson that successful strategies were nice, retaliatory, forgiving, and clear'
- domain: 'End-game defection: in a prisoner''s dilemma repeated a known number of times, backward induction says to defect from the first round, yet experimental subjects cooperate until near the end and learn to defect earlier with experience (Selten and Stoecker), and Kreps, Milgrom, Roberts, and Wilson''s explanation that a small chance the other player is a Tit for Tat type makes cooperation rational'
- domain: 'Zero-determinant strategies (Press and Dyson, 2012): memory-one strategies that unilaterally enforce a linear relationship between the two players'' long-run payoffs; extortionate ones claim a fixed multiple of the opponent''s surplus over mutual defection, while generous ones sacrifice more than the opponent and fare better in evolving populations (Stewart and Plotkin); what extortion and generosity mean when built into a strategy'
- domain: 'Collusion in prisoner''s dilemma tournaments: the University of Southampton''s entry in the 2004 anniversary competition, dozens of programs that recognized each other through an opening sequence of moves, after which ''slaves'' sacrificed themselves so that ''masters'' could top the table; whether this exploited a loophole or revealed something about cooperation (kin recognition, CliqueBot), and how tournament rules can prevent it'
