- domain: 'Ultimatum and dictator games: fairness and spite against the subgame-perfect prediction'
- domain: 'The Keynesian beauty contest and ''guess two thirds of the average'': levels of strategic reasoning'
- domain: 'The electronic mail game and the two generals problem: why acknowledgements never yield common knowledge'
- domain: 'Schelling points and focal coordination: how do people converge without communication?'
- domain: 'Commitment devices and the doomsday machine: the strategic value of limiting your own options'
- domain: 'The pirate game, Colonel Blotto, the volunteer''s dilemma, and the war of attrition: small models with sharp solutions'
- domain: 'Axelrod''s tournaments, tit-for-tat, grim trigger, and the folk theorem: how repetition rescues cooperation'
- domain: 'The market for lemons and the winner''s curse: information asymmetry as strategy'
- domain: 'Rubinstein''s alternating-offers bargaining: backward induction that yields a clean answer, and what patience buys'
- domain: 'The trust game and third-party punishment: trust, reciprocity, and whether punishment is spite or norm enforcement'
- domain: 'The Nash bargaining problem and the Nash demand game: axiomatic and strategic ways to split a surplus'
- domain: 'The epistemic prisoner''s dilemma (MBlume): two doctors, each over 99% sure of a different diagnosis, each choose between 5,000 units of the drug they believe in and 10,000 units of the drug they think worthless; disagreement that creates a prisoner''s dilemma, and what agents with different beliefs owe each other'
- domain: 'The bottle imp paradox (after Stevenson''s story): a wish-granting bottle that must be resold for less than its price, so backward induction says no one should buy it at any price, yet buying it for a thousand dollars seems perfectly safe; its kinship with the surprise exam'
- domain: 'Frank''s Passions Within Reason: emotions such as anger, guilt, and love as commitment devices that make threats and promises credible, why a vengeful temper can pay, and Pinker''s ''doomsday machine'' reading of the emotions'
- domain: 'Strategic delegation: why principals may gain by giving their agents preferences different from their own (Schelling''s negotiator without authority to concede, Fershtman and Judd''s managers rewarded for sales as well as profit), and what happens when people hand negotiations to AI agents whose objectives they choose'
- domain: 'Commitments to side payments: Jackson and Wilkie''s finding that letting players commit to outcome-contingent transfers can destroy efficiency, Geffner, Oesterheld, and Conitzer''s staged protocol of small, capped pledges continued only by unanimous consent, which implements every welfare-maximizing outcome that strictly improves on an equilibrium for everyone, and optimal commitments to transfers'
- domain: 'Spite in strategy tournaments: ranking-based prizes in Axelrod-style competitions reward lowering opponents'' scores, and Oesterheld''s fix of splitting entrants into two groups that play only each other and are ranked only within their group; what tournament design teaches about measuring cooperativeness'
- domain: 'The core of a cooperative game: allocations that no coalition can improve on by going it alone, games with an empty core (three people dividing a dollar by majority vote), the Bondareva--Shapley balancedness condition, and Edgeworth''s conjecture, proved by Debreu and Scarf, that the core of a large economy shrinks to its competitive equilibria; what an empty core says about the stability of cooperation'
- domain: 'Von Neumann and Morgenstern''s stable sets: sets of imputations that are internally stable (no member dominates another) and externally stable (every outsider is dominated by a member), read as a society''s ''standard of behaviour''; discriminatory solutions of the three-person majority game, Lucas''s game with no stable set, and whether stable norms rather than stable outcomes are the right target'
- domain: 'Imputations in cooperative games: divisions of the total payoff that give every player at least what they could get alone (the glove game), domination between imputations through coalitions, how the solution concepts built on them (core, stable sets, nucleolus, Shapley value, Kalai--Smorodinsky) encode different ideas of fairness and stability, and whether cooperative agreements stay stable over time'
- domain: 'Interpersonal comparisons and bargaining: Nash''s solution is invariant to rescaling each party''s utility and so needs no comparisons, Kalai''s egalitarian solution and the utilitarian solution need them, and whether a fair bargain can be defined without them; what this means for cooperation between agents whose values share no common scale'
