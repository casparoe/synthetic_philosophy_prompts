- domain: 'Moral catastrophes: how likely is it that we are committing one now, and what follows? (Williams)'
- domain: 'The average utilitarian''s solipsism wager (Oesterheld, partly after Lukas Gloor): prudential arguments change a hypothesis''s practical weight rather than its probability; total utilitarians should act as if the universe is large and average utilitarians as if it is small, and since under solipsism one''s effect on average welfare is billions of times larger, perhaps average utilitarians should mostly pursue their own welfare'
  urls:
    - https://casparoesterheld.com/2017/03/15/the-average-utilitarians-solipsism-wager/
    - https://reducing-suffering.org/prudential-arguments-regarding-the-problem-of-consciousness/
- domain: 'The lifespan dilemma (Yudkowsky, after Wei Dai): Omega offers to raise your lifespan from 10^10,000,000,000 years to 10^(10^10,000,000,000) years at a minute cost in survival probability, again and again; with unbounded utility in lifespan you accept every step and end with near-certain death; bounded utility, rejecting expected utility maximization, or biting the bullet?'
- domain: 'Handling moral uncertainty: maximizing expected choiceworthiness (MacAskill, Bykvist, and Ord), the problem of intertheoretic comparisons, the moral parliament, ''my favourite theory'', fanaticism toward theories with enormous stakes, and the regress of uncertainty about how to handle moral uncertainty'
- domain: 'Variance normalization for aggregating values: making utility functions comparable by scaling each to the same variance across options (Cotton-Barratt, MacAskill, and Ord), its rivals (range normalization, Borda-style methods), and whether any normalization respects what people or moral theories actually care about'
- domain: 'Infinite ethics: if the universe contains infinitely many people, no act changes total welfare (Bostrom''s infinitarian paralysis); impossibility results for ranking infinite worlds (Zame; Askell''s ''Pareto Principles in Infinite Ethics''), proposals such as expansionism and Arntzenius''s ''Utilitarianism, Decision Theory and Eternity'', and fanaticism about infinite payoffs'
  urls:
    - https://reducing-suffering.org/believe-infinity/
- domain: 'Pascal''s mugging (Yudkowsky, Bostrom): a stranger promises 3^^^3 units of value if you hand over your wallet; why expected utility maximization with unbounded utility seems to require paying, and the responses (bounded utility, the leverage penalty of Hanson and Yudkowsky, discounting tiny probabilities, Wilkinson''s ''In Defence of Fanaticism'')'
- domain: 'Fanaticism (Wilkinson, Beckstead and Thomas): the view that for any sure good outcome, a tiny probability of a vastly better one is better still; Wilkinson''s ''In Defence of Fanaticism'' argument that rejecting it costs more (violating transitivity or separability), Beckstead and Thomas''s paradox for tiny probabilities, and proposals to discount small probabilities (Kosonen)'
- domain: 'Moral parliament vs. expected choiceworthiness, and the same choice under decision-theoretic uncertainty: whether bargaining delegates (Bostrom; Newberry and Ord) or stake-weighted averaging better handles incomparable or fanatical theories, and which model the evidentialist''s wager presupposes (in a parliament of CDT and EDT delegates, EDT''s larger stakes need not dominate)'
  urls:
    - https://longtermrisk.org/research/the-evidentialists-wager/
- domain: 'The problem of intertheoretic comparisons: how the stakes of utilitarianism and Kantian ethics could be put on one scale (MacAskill, Bykvist, and Ord), proposals (normalization, universal-scale accounts, structural methods), and whether the evidentialist''s wager faces the same problem in comparing stakes between causal and evidential decision theory'
  urls:
    - https://reducing-suffering.org/two-envelopes-problem-for-brain-size-and-moral-uncertainty/
- domain: 'Cluelessness in detail: Lenman''s argument that the unforeseeable long-run effects of our acts swamp the foreseeable ones, Greaves''s distinction between simple and complex cluelessness, whether expected value reasoning survives with imprecise credences, and whether cluelessness favours longtermism, neartermism, or paralysis'
  urls:
    - https://longtermrisk.org/research/charity-cost-effectiveness-in-an-uncertain-world/
    - https://reducing-suffering.org/malaria-foundation-reduce-invertebrate-suffering/
    - https://reducing-suffering.org/invertebrate-impacts-worm-bin-composting-vs-methane-producing-decomposition/
- domain: 'Interpersonal comparisons of utility as an obstacle to utilitarianism: Robbins''s charge that they are unscientific, proposals for grounding them (extended sympathy, Harsanyi''s impartial observer, neuroscience, normalization schemes), and whether utilitarianism survives if such comparisons are indeterminate'
  urls:
