# Population ethics and procreation: the repugnant conclusion, the non-identity problem, person-affecting views, the procreation asymmetry, antinatalism, natalism, whether to have children, impossibility theorems in population ethics
- domain: The repugnant conclusion and population axiology
- domain: Antinatalism and Benatar's asymmetry
- domain: The nonidentity problem
- domain: The procreation asymmetry
- domain: Is a larger population better? Pronatalism and population size
  urls:
    - https://reducing-suffering.org/humanitys-net-impact-on-wild-animal-suffering/
- domain: Population size and average vs. total value in ordinary moral thinking (does a bigger family, city, or species matter?)
- domain: 'Impossibility theorems in population ethics (Arrhenius): no ranking of populations satisfies a handful of seemingly compelling conditions, so every view accepts something counterintuitive (the repugnant conclusion, the sadistic conclusion, anti-egalitarian verdicts); which bullet to bite, and whether the theorems show that the conditions were never all compelling'
- domain: Should preference utilitarians count the preferences of people who do not yet exist? Satisfying future people's preferences vs. creating new satisfied preferences (Singer's prior-existence vs. total views), Fehige's antifrustrationism (unsatisfied preferences count against an outcome, satisfied ones add nothing), and the preferences of possible people who will never exist
- domain: 'Person-affecting views: an outcome can be better or worse only if it is better or worse for someone; narrow and wide versions, how they handle the non-identity problem, the repugnant conclusion, and the procreation asymmetry, and their troubles (intransitivity, the verdict that creating a miserable life wrongs no one)'
- domain: Is it moral to have children? The child's prospects and inability to consent, climate and resource arguments (Conly's One Child), the goods of parenthood, cases where procreating is clearly wrong or clearly fine, and whether anyone could have a duty to have children
  urls:
    - https://reducing-suffering.org/the-cost-of-kids/
- domain: 'Antinatalism''s arguments: Benatar''s asymmetry (absent pain is good, absent pleasure not bad), his misanthropic argument (humans cause enormous harm), the consent argument (Shiffrin''s ''Wrongful Life, Procreative Responsibility, and the Significance of Harm''), and the replies that the asymmetry begs the question and that an empty world is not better'
  urls:
    - https://reducing-suffering.org/strategic-considerations-moral-antinatalists/
- domain: 'Natalism: arguments that people should have more children (falling fertility and population decline, pronatalist policies in Hungary and South Korea, the Silicon Valley pronatalist movement), whether a shrinking population is bad (fewer innovators, aging societies) or good (less pressure on the environment), and the ethics of state pressure on reproduction'
