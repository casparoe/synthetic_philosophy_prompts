- domain: 'Future, possible, and potential people as distinct categories: those who will exist whatever we do, those whose existence depends on our choices, merely possible people who never will, and existing beings that could become persons (embryos); presentism, necessitarianism, and actualism as scopes of person-affecting views, Hare''s ''Abortion and the Golden Rule'', and arguments that slide between categories'
  urls:
    - https://plato.stanford.edu/entries/nonidentity-problem/
- domain: 'The non-identity problem in climate ethics: since emissions policy changes who is born, a high-emissions path may leave no particular future person worse off than they would otherwise have been (Parfit''s depletion and risky policy cases); replies from Parfit''s no-difference view, threshold accounts of harm (Meyer), and rights that can be violated without comparative harm, and whether duties to future generations survive the problem'
  urls:
    - https://plato.stanford.edu/entries/nonidentity-problem/
    - https://plato.stanford.edu/entries/justice-intergenerational/
- domain: 'The mere addition paradox: adding people whose lives are barely worth living, harming no one, seems not to make things worse, yet chaining such additions with equalizing transfers leads to the repugnant conclusion (Parfit); small versions (one barely happy guest added to a party of ten), Temkin''s denial of transitivity, critical-level views, and whether intuitions about small cases deserve more trust than those about vast populations'
  urls:
    - https://en.wikipedia.org/wiki/Mere_addition_paradox
    - https://plato.stanford.edu/entries/repugnant-conclusion/
- domain: 'Wrongful life: can creating someone whose life will contain severe suffering wrong them? Lawsuits by disabled children claiming they should never have been born (Curlender, 1980; France''s Perruche ruling of 2000 and the 2002 law that overturned it), the puzzle of comparing existence with never existing, Feinberg''s and Shiffrin''s accounts of harm in procreation, and the same question for animals bred to suffer and for sentient AI'
  urls:
    - https://en.wikipedia.org/wiki/Wrongful_life
