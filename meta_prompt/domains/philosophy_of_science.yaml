- domain: 'The sense of understanding vs. understanding (Trout): why a satisfying explanation is not thereby a good one'
- domain: 'Anomalies called paradoxes: the faint young Sun (liquid water on an early Earth that should have frozen), the cool tropics, the Algol paradox, Gray''s dolphins, and the Antarctic paradox (nutrients without plankton); when an anomaly should overturn a theory and when it calls for an auxiliary fix'
- domain: Must psychology generalize? Henrich, Heine, and Norenzayan's WEIRD critique, Mook's 'In Defense of External Invalidity', and Kroupin, Davis, and Henrich's 'Beyond Newton' on unearned assumptions of universality in cognitive science
- domain: 'Fallen effects in social psychology: power posing, Bargh''s elderly-walking prime, and behavioral priming generally; what their collapse says about the field, and Singal''s The Quick Fix on half-baked psychology sold as social reform'
- domain: 'Bem''s ''Feeling the Future'' and ''False-Positive Psychology'' (Simmons, Nelson, and Simonsohn): how standard methods let a precognition paper into a top journal, researcher degrees of freedom, and headline findings such as deadlier female-named hurricanes'
- domain: 'Ioannidis''s ''Why Most Published Research Findings Are False'' and the 2015 Reproducibility Project, in which about a third of 100 psychology findings replicated: crisis, or normal science correcting itself?'
- domain: 'Tone in the replication crisis: Susan Fiske''s ''methodological terrorism'' column, the 2014 ''Repligate'' dispute over failed replications, and what critics owe the researchers whose findings they test'
- domain: 'Fraud in behavioral science: LaCour''s fabricated canvassing study, the fabricated data in the signing-first honesty study co-authored by Ariely, and Data Colada''s case against Gino; how fraud escapes peer review and what it costs trust'
- domain: 'Rozin''s critique of social psychology (drawing on Asch): premature hypothesis testing vs. describing real-world phenomena first, and what a young science should be doing'
- domain: 'Yarkoni''s ''The Generalizability Crisis'': do psychology''s verbal hypotheses outrun the statistical models used to test them, and can a lab study of insults and effort on a slider task say anything about trash talk in sport?'
- domain: 'Feynman''s ''Cargo Cult Science'': research with the form but not the substance of science, the neglected rat-maze study, the integrity of reporting everything that could be wrong, and whether whole fields can be cargo cults (Gelman and Higgs)'
- domain: Should scientific journals endorse political candidates? A study of Nature's 2020 endorsement of Biden and trust in science among Trump supporters, and whether scientists' politics compromise scientific authority
- domain: 'Oliver Sacks and the truth of case histories: how much he altered or invented in his clinical tales (Aviv''s New Yorker essay), and whether a case history can be true as literature but false as science'
- domain: 'Popper''s answer to Hume: theories are never confirmed, only corroborated by surviving severe tests; whether corroboration gives any reason to rely on a theory''s next prediction (Salmon''s ''Rational Prediction'') or needs the ''whiff of inductivism'' Lakatos detected, and what is left of falsificationism if it does'
- domain: Is psychoanalysis unfalsifiable? Popper's story of Adler diagnosing a child he had never seen by his 'thousandfold experience', Grünbaum's reply that Freud made testable causal claims (the 'tally argument') that fail on the evidence, and whether 'unfalsifiable' or 'false' is the right charge against a theory
- domain: 'Rescuing a theory with an auxiliary hypothesis: Le Verrier''s prediction of Neptune from irregularities in Uranus''s orbit (a triumph) and his hypothetical planet Vulcan to explain Mercury''s perihelion (a failure that general relativity resolved); Popper''s ban on ''conventionalist stratagems'', Lakatos''s progressive vs. degenerating problemshifts, and whether a legitimate rescue can be told from an ad hoc one in advance'
- domain: Can a probabilistic hypothesis be falsified? No finite run of heads contradicts 'this coin is fair', so Popper added a methodological rule to treat sufficiently improbable results as falsifying; whether that rule is arbitrary, how it relates to significance testing, and whether it concedes the ground to Bayesian confirmation
- domain: 'The Popper--Miller argument (Nature, 1983): split a hypothesis into the part the evidence entails and the part that goes beyond it, and the evidence always lowers the probability of the latter, so probabilistic support is never inductive support; the replies by Jeffrey, Levi, and Good, and what the dispute shows about measuring support'
- domain: Can a public prediction be right if it changes what happens? Grunberg and Modigliani's and Simon's 1954 fixed-point proofs that a correct election or price forecast exists despite bandwagon and underdog effects, Morgenstern's Holmes--Moriarty argument that perfect foresight is impossible, and Popper's 'Oedipus effect'
- domain: '''The futility of emergence'' (Yudkowsky) vs. weak and strong emergence (Bedau, Chalmers): when calling something emergent explains anything, what it adds to ''caused by the interactions of the parts'', and the same test applied to ''complexity'', ''self-organization'', and ''holism'''
- domain: 'Standards of evidence across fields: five sigma in particle physics, p < .05 and the proposal to require .005 (Benjamin et al.), ''beyond reasonable doubt'' vs. ''preponderance of the evidence'' in law, and evidence hierarchies in medicine; why fields differ, and whether one Bayesian standard could replace them'
- domain: 'Germany''s later method disputes: the Werturteilsstreit (Weber against Schmoller on whether social science can and should be value-free) and the Positivismusstreit of the 1960s (Popper and Albert''s critical rationalism against Adorno and Habermas''s critical theory); what each side got right'
- domain: 'Structural realism (Worrall): successful theories are right about the world''s structure even when wrong about its nature, as Fresnel''s equations survived the abandonment of the ether; epistemic vs. ontic structural realism (Ladyman), and Newman''s objection that structure alone says almost nothing'
- domain: 'Systems philosophy (Laszlo, Bertalanffy): building a worldview from general system theory, with a systems ontology, epistemology, and ethics, and nature as organismic rather than mechanistic; whether ''systems'' talk adds explanatory content or is a vague holism like some uses of ''complexity'' and ''emergence'''
- domain: 'Complex systems theory: the Santa Fe Institute''s programme of complex adaptive systems, self-organization, power laws, and the ''edge of chaos'' (Kauffman, Holland), its successes in ecology, economics, and networks, and the charge that it is a loose collection of analogies rather than a theory (Horgan''s ''From Complexity to Perplexity'')'
