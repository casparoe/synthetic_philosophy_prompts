- domain: 'Objective Bayesianism and the maximum entropy principle: are there rational priors?'
- domain: Bayesian convergence theorems and the washing out of priors
- domain: 'Possibility vs. probability: how modal and probabilistic notions relate'
- domain: Coincidence, the birthday paradox, and the epistemology of anecdote
- domain: 'Micromorts and everyday risk: is driving worth it?'
- domain: Cox's theorem and the justification of probability as the logic of plausible reasoning
- domain: 'Berkson''s paradox and collider bias: why hospital data show spurious associations'
- domain: 'Lindley''s paradox: when Bayesian and frequentist verdicts diverge on large data'
- domain: 'The inspection paradox and the friendship paradox: sampling by exposure'
- domain: 'The Will Rogers phenomenon: moving a case between groups raises both averages'
- domain: 'The low birth weight paradox: when conditioning on an effect misleads'
- domain: 'The accuracy paradox in prediction: when the most accurate model is useless'
- domain: 'The Monty Hall problem and the three prisoners: conditioning on how you learned what you learned'
- domain: 'Bertrand''s box and the boy-or-girl paradox: how the sampling procedure fixes the answer'
- domain: 'Borel''s paradox: conditional probability on measure-zero events'
- domain: The false positive paradox and base-rate neglect
- domain: Intransitive dice
- domain: 'Proebsting''s paradox: how the Kelly criterion can be made to ruin you'
- domain: 'Parrondo''s paradox: winning by alternating losing games'
- domain: 'Lord''s paradox: change scores, covariates, and what ''controlling for'' does'
- domain: 'The Kolmogorov axioms: what they settle and leave open about probability, countable vs. finite additivity, conditional probability as primitive (Popper, Rényi), and why every interpretation must satisfy them'
- domain: 'The Jeffreys prior: invariance under reparametrization as the meaning of ''uninformative'', improper priors, and why it misbehaves in many dimensions'
- domain: 'The Herschel--Maxwell derivation of the normal distribution: independence of components plus rotational invariance, and what a derivation from symmetry explains'
- domain: 'Gaussian priors: conjugacy, ridge regression as a prior, maximum entropy given a variance, and whether the normal is a default or a confession of ignorance'
- domain: 'The chi-squared test: Pearson''s goodness of fit, the degrees-of-freedom dispute with Fisher, and what rejecting a null model tells you about the world'
- domain: 'Student''s t test: Gosset at Guinness, small samples, unknown variance, and the logic of a significance test (the Behrens--Fisher problem)'
- domain: 'The marginalization paradox (Dawid, Stone, Zidek): improper priors, two routes to one posterior that disagree, and Jaynes''s reply'
- domain: 'The 100 prisoners problem: from 2^-100 to about 31% by following the pointers, and why the strategy works'
- domain: 'Calibration vs. resolution: what makes a forecaster good, the Brier decomposition, and whether a perfectly calibrated forecaster can be useless'
- domain: 'Exchangeability and de Finetti''s theorem: how a subjectivist gets to talk about unknown chances'
- domain: 'Benford''s law: why leading digits are not uniform, scale invariance, and fraud detection as its application'
- domain: 'Regression to the mean: Secrist''s "triumph of mediocrity", the sophomore slump, and the causal story it tempts you to tell'
- domain: 'The garden of forking paths: the Texas sharpshooter, the look-elsewhere effect, and whether pre-registration fixes it'
- domain: 'Fat tails (Mandelbrot, Taleb): when the sample mean tells you nothing, and the limits of induction under power laws'
- domain: Should a proved theorem get probability 1? Fallible minds and unchecked proofs, logical omniscience, the view that 0 and 1 are not probabilities (Yudkowsky), and what conditionalization could do with a credence of 1 in a claim later found false
- domain: 'Bayesianism as a theory of rationality: degrees of belief that obey the probability axioms and update by conditionalization, its main arguments (Dutch books, accuracy, Cox''s theorem, convergence), its main problems (the priors, old evidence, logical omniscience, idealization), and its role as an identity in the rationalist community'
- domain: 'Absence of evidence vs. evidence of absence: when not finding something is evidence that it is not there (whenever you would probably have found it if it were), how the slogan is misused in both directions, and the Bayesian account'
- domain: 'The elevator paradox (Gamow and Stern): on a low floor the first elevator to arrive is usually going down, on a high floor usually up; sampling by arrival time, and why the effect fades when there are many elevators'
- domain: 'Abelson''s paradox: batting skill explains about a third of one percent of the variance in a single at-bat, yet it decides seasons and salaries; effect size vs. practical importance, and how tiny effects accumulate over repeated trials'
- domain: 'Freedman''s paradox: screening many pure-noise predictors and refitting the survivors yields significant-looking coefficients and a respectable R-squared; model selection as a source of false discovery'
- domain: 'The necktie paradox (Kraitchik): two men agree that whoever wears the more expensive tie must give it to the other, and each reasons that he stands to win more than he can lose; the cousin of the two-envelope problem, and where the reasoning goes wrong'
- domain: 'The gambler''s fallacy (Baggini''s ''Wheel of fortune''): waiting for five reds before betting on black, why independent spins have no memory, Hacking''s inverse gambler''s fallacy, and why intuitions about chance are so poor'
- domain: 'Logical induction (Garrabrant et al.): probabilities for mathematical sentences as prices in a market that no polynomial-time trader can exploit for unbounded gains at bounded risk; what follows (coherence in the limit, calibration, believing provable claims before proving them, about 10% for ''the nth digit of pi is 7'' at huge n, trust in its own future beliefs), and whether it is the right ideal for bounded reasoners'
- domain: 'Decision scoring rules (Oesterheld and Conitzer): an expert recommends an action and predicts its outcome, and the principal follows the recommendation and pays based on what happens; beyond an honest recommendation, only the expected utility of the recommended action can be elicited without distorting the recommendation, and proper rules amount to giving or selling the expert shares in the principal''s project'
- domain: 'Decision markets: conditional prediction markets that estimate an outcome under each possible policy, why a conditional price need not measure a policy''s causal effect (its adoption is itself evidence), the impossibility results (Othman and Sandholm; Chen et al.) for a decision maker who always picks the best-looking option, and the fix of choosing every option with some probability'
- domain: 'Performative prediction (Perdomo, Zrnic, Mendler-Dünner, and Hardt): when deploying a predictive model changes the distribution it predicts (credit scores, traffic forecasts, recommender systems), the difference between performatively stable models (optimal for the world they induce) and performatively optimal ones, and whether retraining until convergence finds a fixed point worth having'
- domain: 'Honest predictions that influence what they predict (Oesterheld, Treutlein, Cooper, and Hudson): for any strictly proper scoring rule there are cases where a fixed point (a prediction that stays accurate once made) exists but the optimal report is not one; bounded influence permits near-fixed-point reports for binary predictions but not for three or more outcomes; what this means for AI oracles whose answers change the world'
- domain: 'A wager against Solomonoff induction (Johannes Treutlein, from a conversation with Oesterheld): the universal prior gives probability zero to uncomputable universes (uncountably many value locations, physics that solves the halting problem), which may matter far more under infinite ethics; why an AI should give them nonzero credence'
- domain: 'Reported probabilities as expectations under logical uncertainty (Oesterheld): an agent that cannot compute the probabilities ideal updating would assign can hold meta-probabilities over them and act on their expectation, which explains why we do not know our own credences, why reconsidering old evidence can move us, and why others'' arguments persuade though they are not new evidence'
- domain: 'Thinking in log odds: evidence adds in log-odds (bits or decibels), so moving from 99% to 99.99% takes as much evidence as moving from 50% to 99%, which is why extreme credences need extreme evidence; Jaynes''s evidence in decibels, logits in neural networks, and what the scale suggests about 0 and 1 as credences'
- domain: 'Brier vs. logarithmic scoring: both are strictly proper, but the log score punishes confident errors without bound and is local (it depends only on the probability given to what happened), while the Brier score is bounded; which one forecasting tournaments should use, the log score''s ties to information theory and Kelly betting, and whether properness is enough to choose'
- domain: 'Prediction markets as truth-tracking institutions: when prices aggregate dispersed information (Hayek, Hanson''s ''vote on values, bet on beliefs''), the longshot bias, thin and manipulable markets, legal fights over election markets (Kalshi, Polymarket), and whether a market price is a probability'
- domain: 'Wald''s complete class theorem: in statistical decision problems, every admissible decision rule (one that no other rule beats in every state) is a Bayes rule for some prior or a limit of Bayes rules; whether this grounds Bayesian decision theory in frequentist premises, and what it leaves open (which prior, the regularity conditions)'
- domain: 'The Kelly criterion: betting the fraction of wealth that maximizes expected log wealth, why it almost surely outgrows any other strategy in the long run, Samuelson''s objection (in an article written in words of one syllable) that this matters only for log utility, fractional Kelly in practice, and its tie to the log scoring rule'
- domain: 'Imprecise probabilities: representing belief by a set of probability functions when evidence is sparse, dilation (learning can leave you less certain), Elga''s ''Subjective Probabilities Should Be Sharp'' (sequences of bets an imprecise agent can handle badly), and decision rules for credal sets (Gamma-maximin, maximality, E-admissibility)'
- domain: 'What frequentism gets right: error statistics and Mayo''s severe testing, confidence procedures with long-run error guarantees, why frequentists reject the likelihood principle (stopping rules and optional stopping), and whether p-values answer any question scientists actually ask'
- domain: Where do priors come from? Subjective priors and the charge of arbitrariness, objective priors (indifference, maximum entropy, Jeffreys), simplicity priors (Solomonoff), empirical Bayes, and whether a prior on a one-off question (AI risk, God, the multiverse) is more than a statement of opinion
- domain: 'Van Fraassen''s reflection principle: your credence in A, given that your future credence in A will be x, should be x; Dutch book arguments for it, counterexamples from anticipated memory loss and intoxication (Talbott, Christensen, Arntzenius''s Shangri-La), and its role in self-locating belief'
- domain: 'The two-envelope paradox in detail: one envelope holds twice as much as the other, and an argument says that switching always gains in expectation; where the reasoning fails (conditioning on an amount without a proper prior), Broome''s version in which a proper prior still favours switching because the expectation is infinite, and what it shows about unbounded expected values'
- domain: 'Ramsey''s ''Truth and Probability'' and de Finetti: degrees of belief defined through betting preferences, Ramsey''s use of an ethically neutral proposition to measure belief and desire together, de Finetti''s ''probability does not exist'', and objections (betting reveals utilities too, people refuse to bet, credences need not show in behaviour)'
