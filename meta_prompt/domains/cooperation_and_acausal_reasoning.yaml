- domain: 'Robust program equilibrium (Oesterheld): in a prisoner''s dilemma between programs that read each other''s code, cooperating only with exact copies (Tennenholtz) is brittle, while epsilon-grounded FairBot (cooperate with small probability, otherwise simulate the opponent playing against you and copy its move) always halts, cooperates with itself and with proof-based FairBots, and turns tit-for-tat-like strategies into one-shot programs'
  urls:
    - https://longtermrisk.org/research/robust-program-equilibrium/
- domain: 'Simulation-based program equilibria (Cooper, Oesterheld, and Conitzer): programs that work by running their opponents'' programs treat behaviourally identical opponents alike; a generalization of epsilon-grounded bots yields a folk theorem when players share a source of randomness, but without it no simulation-based programs reach Tennenholtz''s full folk theorem; what transparent agents can commit to'
  urls:
    - https://arxiv.org/html/2412.14570
- domain: 'Game theory with simulation (Kovařík, Oesterheld, and Conitzer): if one player can pay to simulate the other before acting, as with an AI agent whose code is known, simulation makes generic games easier to solve and enables mutually beneficial equilibria when lack of trust was the only obstacle, yet in some settings leaves both players strictly worse off; when being predictable is an asset'
  urls:
    - https://arxiv.org/html/2305.11261
- domain: 'Recursive joint simulation (Kovařík, Oesterheld, and Conitzer): AI agents who first jointly watch a simulation of their interaction, which contains further simulations with a small chance of failure, face a game strategically equivalent to the infinitely repeated original, so the folk theorems carry over, even for an agent unsure whether it is inside a simulation'
  urls:
    - https://arxiv.org/html/2402.08128
- domain: 'Similarity-based cooperative equilibrium (Oesterheld, Treutlein, Grosse, Conitzer, and Foerster): agents in a one-shot prisoner''s dilemma who observe only a single number saying how similar they are can reach the same cooperative outcomes as agents who read each other''s source code, and simple learning methods find such cooperation; whether partial transparency between AI systems is a hope or a hazard'
  urls:
    - https://arxiv.org/html/2211.14468
- domain: 'Safe Pareto improvements for delegated game playing (Oesterheld and Conitzer): Aliceland and Bobbesia, disputing an oil-rich desert, delegate to representatives; told to forgo military options and to treat a clash of unarmed demands as they would have treated war, the representatives face the same strategic problem, so both countries are guaranteed to do at least as well whatever equilibrium is picked'
  urls:
    - https://longtermrisk.org/research/safe-pareto-improvements-for-delegated-game-playing/
- domain: 'Safe improvements without equilibrium selection: comparing games whose equilibria are unknown by assuming that isomorphic games are played isomorphically and dominated strategies are dropped, deriving which games are safely better (co-NP-complete in general; Oesterheld and Conitzer), and safe Pareto improvements through disarmament, token games, and commitments conditional on one''s default play (Sauerberg and Oesterheld)'
  urls:
    - https://arxiv.org/html/2511.21262
- domain: 'Foundations of cooperative AI (Conitzer and Oesterheld): AI agents differ from the players game theory usually assumes (they can be copied, run many times without memory of other runs, inspected, and simulated, and their designers choose how they reason), and how each difference creates new risks and new routes to cooperation'
  urls:
    - https://www.cs.cmu.edu/~conitzer/FOCALAAAI23.pdf
- domain: 'Symmetric teams (Emmons, Oesterheld, Critch, Conitzer, and Russell): in a common-payoff game among identical agents such as copies of one AI, any locally optimal symmetric strategy profile is a Nash equilibrium, yet mixed optima can be unstable under joint asymmetric deviations; what copies can achieve without a way to break symmetry'
  urls:
    - https://arxiv.org/html/2501.08905
    - https://arxiv.org/html/2207.03470
- domain: 'Zero-shot coordination: why independently reasoning humans often find compatible conventions while independently trained AI agents do not, other-play and the label-free coordination problem (Treutlein, Dennis, Oesterheld, and Foerster), their finding that optimal play there needs arbitrary tie-breaking, which defeats the purpose, and what a principled theory of focal points would require'
  urls:
    - https://arxiv.org/html/2106.06613
- domain: 'The twin prisoner''s dilemma: playing a one-shot prisoner''s dilemma against an exact copy of yourself, whether you should cooperate because your twin will do whatever you do, Lewis''s claim that the prisoner''s dilemma is a Newcomb problem, and how far the argument extends to agents who are merely similar'
- domain: How much do other agents' choices correlate with yours? What makes another agent's decision evidence about your own (shared algorithms, shared reasoning, shared inputs), whether conditioning on your own deliberation screens the correlation off (a tickle defense against superrationality), and how one could estimate correlations with distant civilizations
- domain: 'Conflict between AI systems as a source of catastrophic suffering (the Center on Long-Term Risk''s ''Cooperation, Conflict, and Transformative AI'' agenda): threats, commitment races, and bargaining failures among powerful agents, and what designers could do in advance (surrogate goals, safe Pareto improvements, cooperative dispositions)'
- domain: 'The surrogate goal justification gap (Oesterheld): safe Pareto improvement reasoning shows that delegating with a surrogate goal beats delegating without one, but an expected-utility maximizer facing many options has no reason to privilege the default, so SPIs seem ''in some sense self-defeating''; possible bridges (pessimism about non-SPIs, decision factorization, common knowledge, SPIs as Schelling points)'
  urls:
    - https://casparoesterheld.com/2024/07/28/a-gap-in-the-theoretical-justification-for-surrogate-goals-and-safe-pareto-improvements/
- domain: 'The stag hunt against a similar opponent (Oesterheld): against a copy or a predictor, one-boxing-style reasoning favours hunting stag, and unlike in the prisoner''s dilemma this violates no Nash equilibrium but only settles the equilibrium selection that orthodox theory leaves open; room for acausal reasoning within an equilibrium-based picture'
  urls:
    - https://casparoesterheld.com/2022/05/04/the-trust-dilemma-a-k-a-stag-hunt-against-a-similar-opponent/
- domain: Is ideal theory more relevant to AI than to humans? Daniel Kokotajlo's suggestion that idealized political philosophy (the original position, mutually disinterested bargainers, costless negotiation, perfect compliance) may predict how AGIs negotiate, since they could read each other's code, make binding commitments, and go updateless
- domain: 'Kant and acausal decision theory (Daniel Kokotajlo''s ''Grimdark Cyberkant''): the categorical imperative read as the insight that an algorithm''s choice is also its copies'' choice, a kingdom of ends among relevantly similar rational agents, and the grim caveat that cooperation grounded in similarity and power may exclude the weak and the irrational'
- domain: 'Three wagers for multiverse-wide superrationality (Johannes Treutlein): acausal decision theories count the actions of many copies, so they dominate a meta decision theory if the universe is large, and correlation with non-identical agents who take the idea seriously may matter even at low credence; whether wagers like these are a sound way to act under uncertainty'
- domain: 'Surrogate goals (Baumann): an agent adopts a goal it otherwise cares little about so that would-be threateners target it instead of what the agent really values, why threateners must be indifferent between the targets, the credibility of a goal adopted for strategic reasons, and surrogate goals as safe Pareto improvements'
- domain: 'Acausal trade: agents who cannot interact causally but can reason about or simulate each other each do something the other values, expecting reciprocation; what makes it rational (logical correlation, mutual modelling), what it requires (knowledge of the partner''s values and decision procedure), and its uses and dangers (cooperation across the multiverse, acausal threats)'
- domain: 'Model-based vs. correlation-based acausal trade: trading with particular agents one models in enough detail to know their values and policies, as opposed to evidential cooperation with whoever reasons similarly; whether the model-based kind collapses into the correlation-based kind, and who gains when one side models the other better'
- domain: Is model-based acausal trade feasible? The cost of modelling distant superintelligences in enough detail, the asymmetry between simulator and simulated, uncertainty about whether the modelled agent exists at all, and why some expect acausal trade among superintelligences to be common while others think it reduces to ordinary decision-making under uncertainty
- domain: 'Löbian cooperation (LaVictoire et al.''s ''modal combat''): FairBot cooperates if it can prove its opponent cooperates with it, and by Löb''s theorem two FairBots cooperate; PrudentBot also defects against unconditional cooperators, and Critch''s parametric bounded Löb theorem extends the result to agents with limited proof search'
- domain: 'Folk theorems for program games: Tennenholtz showed that when players submit programs that read each other''s code, every individually rational outcome can be sustained in equilibrium, as in repeated games; what his equilibria require (exact matching of source code), robust versions based on simulation or proof, and whether so many equilibria help or make equilibrium selection worse'
- domain: What should agents doing evidential cooperation in large worlds avoid learning? Information about one's own position (which values are common, whether one gains or loses from cooperating) can remove the incentive to cooperate, as behind a veil of ignorance; information hazards for ECL, and whether to commit to cooperation before learning more about one's partners
- domain: 'Threatener neutrality in surrogate goals and safe Pareto improvements: adopting a surrogate goal must not make the agent more or less attractive to threaten, but relative to which counterfactual (what the threatener would have done with no surrogate, or with a different one), and how the choice of baseline decides whether the scheme counts as a safe Pareto improvement'
- domain: 'Building the compromise utility function for evidential cooperation in large worlds: must it be stable against subgroups who would do better cooperating only among themselves (a condition like the core of a cooperative game), how the structure of correlations decides which coalitions can form, and what to do if no stable compromise exists'
- domain: Is the compromise in evidential cooperation in large worlds a bargaining problem? Applying Nash, Kalai--Smorodinsky, or utilitarian solutions to agents who cannot communicate, what plays the role of the disagreement point (no cooperation), how to compare utilities across value systems (normalization), and whether superrational agents would all converge on the same solution
- domain: 'The regress problem for safe Pareto improvements and surrogate goals: if choosing which SPI or surrogate scheme to adopt is itself a bargaining game with its own equilibrium selection problem and risk of conflict, one might want an SPI for that game too, and another for the next; does the regress terminate, and does it undermine the case for SPIs?'
- domain: 'Roko''s basilisk (LessWrong, 2010): a future AI that punishes those who knew it might exist but did not help bring it about; why the threat depends on acausal blackmail and why an agent that refuses all such blackmail removes the incentive, Yudkowsky''s deletion of the post and the years-long ban on discussing it, information hazards, and the basilisk''s afterlife as a meme'
- domain: 'Opponent shaping (Foerster et al.''s LOLA, ''Learning with Opponent-Learning Awareness''): learning agents that take into account how their actions will change their opponent''s learning, and so find tit-for-tat-like reciprocity in the iterated prisoner''s dilemma where naive learners defect; later methods such as model-free opponent shaping, and whether shaping another learner''s updates is cooperation or manipulation'
