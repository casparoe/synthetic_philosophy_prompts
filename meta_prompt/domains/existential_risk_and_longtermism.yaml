# Existential risk and longtermism: existential and suffering risks, longtermism and neartermism, astronomical waste, the vulnerable world hypothesis, grey goo, mirror life, value lock-in, the long reflection, the hinge of history
- domain: Strong longtermism
- domain: Pure time preference and discounting the future
- domain: The unilateralist's curse
- domain: Why is human extinction bad beyond the deaths it involves? (Scheffler's afterlife conjecture)
- domain: Suffering risks (s-risks)
- domain: The hinge of history hypothesis
- domain: The singleton hypothesis
- domain: The ethics of space colonization
- domain: Value drift and the risk of bad values in the far future
- domain: 'Longtermism and totalitarianism: does concern for the far future license control?'
- domain: 'Path dependence of the long-term future: which present choices are hard to undo?'
- domain: 'Value lock-in: could an AI future freeze today''s values, and would that be bad?'
- domain: Are the moral views of the future path dependent or convergent? Contingency of moral change (abolition, the moral circle), convergence under idealized reflection vs. convergence by selection, and what rerunning history would change
- domain: 'Differential technological development and d/acc: steering which technologies arrive first'
- domain: 'Failed apocalypses as a reference class: millenarianism, the Great Disappointment of 1844, and whether the history of doom is evidence against present doom'
- domain: 'p(doom): what the number means (doom of what, by when, conditional on what), whether a probability for a one-off, unprecedented event is meaningful, why experts'' and superforecasters'' estimates diverge so widely (the Existential Risk Persuasion Tournament), and what announcing one''s p(doom) does'
- domain: 'Bostrom''s astronomical waste argument: each second of delayed space colonization forgoes vast numbers of potential happy lives, yet the argument concludes that for utilitarians reducing existential risk matters far more than speed; whether such numbers mean anything, and what follows for those who are not total utilitarians'
- domain: 'Grey goo: Drexler''s warning (Engines of Creation) that self-replicating molecular assemblers could consume the biosphere, Freitas''s limits on ''global ecophagy'', the Smalley--Drexler debate over whether assemblers are possible at all (''fat fingers'', ''sticky fingers''), Drexler''s later view that manufacturing needs no free replicators, and what the scare''s rise and fall teaches about forecasting technological catastrophe'
- domain: 'Bill Joy''s ''Why the Future Doesn''t Need Us'' (2000): genetics, nanotechnology, and robotics as self-replicating technologies that put mass destruction within reach of individuals or small groups, his call for relinquishment, and whether giving up a technology is ever feasible or wise'
- domain: 'Bostrom''s vulnerable world hypothesis: invention as drawing balls from an urn, a ''black ball'' technology that destroys civilization by default (what if nuclear weapons had turned out to be easy to make from household materials?), and whether its remedies (preventive policing, ubiquitous surveillance, global governance) are worse than the risk'
- domain: 'Mirror life: the 2024 call by Adamala and dozens of other scientists not to create mirror-image bacteria, which might evade immune systems and predators and spread through the biosphere; when researchers should forgo a capability before it exists, and whether a voluntary scientific moratorium can hold (Asilomar as precedent)'
- domain: Was the industrial revolution a high-leverage time? Daniel Kokotajlo's brainstorm of what a well-placed effective altruist in 1780 could have done (spreading industrialization abroad to forestall colonization, timing it with an eye on slavery, anticipating pollution and plagues), and what such counterfactual history implies for claims that we live at the hinge of history
- domain: Will the future be philosophically reflective? Whether a civilization transformed by AI would spend effort reflecting on its values or lock them in, compete, and drift; conditions that favour reflection (pluralism, time, deliberative institutions, AI advisers that help rather than flatter), and the proposal of a 'long reflection' before irreversible choices
- domain: 'Neartermism: reasons to focus on people and animals alive now (cluelessness about long-run effects, person-affecting views, discounting, robust evidence), whether it is a coherent position or a hedge against longtermism, and how effective altruists divide resources across worldviews (Open Philanthropy''s worldview diversification)'
