# Logic and paradoxes: logic, logical and semantic paradoxes, set-theoretic paradoxes, and puzzles of rationality that fit no other theme
- domain: The Liar paradox and theories of truth
- domain: The surprise exam paradox
- domain: Dialetheism and paraconsistent logic
- domain: Skolem's paradox
- domain: Fitch's paradox of knowability
- domain: Carroll's tortoise and the justification of deduction
- domain: Russell's paradox and the limits of naive set theory
- domain: Tangled hierarchies and the inviolate level (Escher's Drawing Hands)
- domain: Curry's paradox and Yablo's liar without self-reference
- domain: 'Bivalence and truth-value gaps: must every statement be true or false?'
- domain: 'Quantified modal logic and the Barcan formulas: does everything that exists exist necessarily?'
- domain: 'Syllogistic vs. modern logic: what did Frege change?'
- domain: 'The paradoxes of material implication: does ''if'' mean what the truth table says?'
- domain: The barbershop paradox and the logic of hypotheticals (Carroll)
- domain: 'Catch-22 and self-undermining conditions: rules that can only be satisfied by not needing them'
- domain: 'The drinker paradox: a valid theorem that sounds absurd'
- domain: 'The paradox of free choice permission: ''you may have tea or coffee'' and modal logic'
- domain: 'The paradox of entailment and explosion: does everything follow from a contradiction?'
- domain: 'Ross''s paradox and the logic of imperatives: ''post the letter or burn it'''
- domain: 'The temperature paradox (Partee): intensional contexts and what ''the temperature'' denotes'
- domain: 'The Socratic paradox: can one know that one knows nothing?'
- domain: 'The Grelling--Nelson paradox: is ''heterological'' heterological?'
- domain: 'Berry''s paradox and Richard''s paradox: definability and the limits of naming numbers'
- domain: 'The knower paradox: ''this sentence is not known'' and the logic of knowledge'
- domain: 'Quine''s paradox: paradox without indexicals or self-reference'
- domain: 'Bhartrhari''s paradox: naming the unnameable'
- domain: 'The crocodile dilemma and the paradox of the court: promises whose fulfilment depends on their own outcome'
- domain: 'Buridan''s bridge: Socrates, Plato, and a conditional promise about truth'
- domain: 'The Pinocchio paradox: a liar without semantic vocabulary'
- domain: 'The Burali--Forti and Cantor paradoxes: why there is no set of all ordinals or of all sets'
- domain: 'Fredkin''s paradox: the closer the options, the longer the deliberation, and the less it matters'
- domain: 'Morton''s fork: false dilemmas where every observation confirms the accusation'
- domain: 'The blue-eyed islanders and the muddy children: what making something common knowledge does'
- domain: 'The miners paradox (Kolodny and MacFarlane): subjective vs. objective ''ought'' and the logic of conditionals'
- domain: 'Löb''s theorem: proving ''if I prove P then P'' already proves P, and why reflection principles are dangerous (Curry''s paradox, the procrastination paradox)'
- domain: 'Many-valued and fuzzy logics: degrees of truth as an answer to vagueness, and why "half true" is hard to make sense of'
- domain: 'Logical pluralism (Beall, Restall): more than one correct logic, and whether the classical--intuitionist dispute is verbal'
- domain: 'The normativity of logic (Harman, MacFarlane): logic says what follows, not what to believe, and the bridge principles between the two'
- domain: 'Logical consequence and logical constants (Tarski, Etchemendy): what makes "and" logical and "taller than" not'
- domain: 'Nonmonotonic reasoning: birds fly, Tweety is a penguin, default logic, and how jumping to conclusions can be rational'
- domain: 'Plural quantification (Boolos): "some critics admire only one another", and whether second-order logic is set theory in disguise'
- domain: 'Tarski''s undefinability theorem: arithmetical truth is not definable in arithmetic, and no sufficiently rich classical language can define its own truth predicate; the object-language/metalanguage hierarchy, how the result differs from Gödel''s incompleteness, and what it means for a mind or an AI describing its own semantics'
- domain: 'The barber paradox vs. Russell''s paradox: why ''there is no such barber'' is an acceptable answer to one while ''there is no such set'' was a crisis for the other, and what the comparison shows about comprehension principles'
- domain: 'The Epimenides paradox and contingent liars: why a Cretan''s ''All Cretans are liars'' is not strictly paradoxical but logic alone seems to prove that some Cretan sometimes tells the truth (Prior), and Kripke''s Nixon--Dean case, where ordinary statements become paradoxical because of the facts'
- domain: 'Jourdain''s card paradox and the no-no paradox: a card whose sides say ''the sentence on the other side is true'' and ''the sentence on the other side is false'', and two sentences each saying the other is not true, which seem to need opposite truth values with nothing to decide which (Sorensen)'
- domain: 'The Kleene--Rosser and Hilbert--Bernays paradoxes: Richard-style reasoning that made Church''s and Curry''s early systems of logic inconsistent, a term that would denote its own successor, and what they teach about untyped systems and reference inside formal languages'
- domain: 'Self-defeating notices and rules: ''This page intentionally left blank'', ''It is Opposite Day'', ''Ignore all rules'', and ''excusable negligence'', and how each differs from the liar (pragmatic self-defeat, use vs. mention, the scope of a rule)'
- domain: 'The irresistible force paradox: an unstoppable force meets an immovable object; why the two descriptions cannot both be satisfied in one world, and what the case shares with the omnipotence paradox'
- domain: 'The buttered cat paradox: combining two joke ''laws'' (cats land on their feet, toast lands butter side down); conflicting generalizations, ceteris paribus laws, and what to conclude when two defaults clash (the Nixon diamond)'
- domain: 'Interrogating a liar (Gwern''s ''The Three Grenades''): how many yes-or-no questions it takes to learn which of three colours a ball is when the answerer may lie once, how a tempting proof that three suffice smuggles in knowledge of which answer was the lie, error-correcting codes and Ulam''s searching game with lies, and the commenters'' case that even four are not enough'
