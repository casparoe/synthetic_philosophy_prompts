# Animal ethics: animal welfare and rights, moral weight, wild animal suffering, insects, shrimp and fish, eating meat, cultivated meat, zoos, animal experimentation
- domain: Animal ethics and speciesism
- domain: Wild animal suffering
- domain: 'Sentience as a matter of degree: gradations of moral status from insects to thermostats'
- domain: Is brain size morally relevant?
- domain: 'Insect sentience and the scale argument: vast numbers against a low probability of sentience'
- domain: The ethics of insecticides and pest control
- domain: Fish and crustacean welfare in aquaculture
- domain: Does habitat destruction reduce wild animal suffering? The net welfare of ecosystems
- domain: Meat consumption and wild animal suffering (crop cultivation, beef vs. chicken)
- domain: 'Freeganism and the byproducts of rescued animals: using what would otherwise be wasted'
- domain: 'Diet ethics where alternatives are scarce: veganism outside the rich world'
- domain: 'Animal rights vs. animal welfare: Regan''s rights view against Singer''s utilitarianism'
- domain: 'The case for veganism: which argument actually does the work, and does it require abstinence?'
- domain: 'Factory farming and the law (Prop 12, cage bans, ag-gag laws): what the moral weight of animal suffering should do to legislation'
- domain: 'Bans on cultivated meat (Florida, Italy): protecting industries and traditions vs. reducing harm'
- domain: 'Trophy hunting for conservation: killing animals to save their species, and whether motive matters'
- domain: 'Rewilding and culling invasive species: killing individuals for ecosystems, and what ''natural'' is doing in the argument'
- domain: 'The pig that wants to be eaten (Baggini, after Douglas Adams''s talking cow): an animal engineered to want to be eaten and a decerebrated chicken with no awareness; whether consent or the absence of suffering makes eating them permissible, and what the lingering disgust shows'
- domain: 'A talking parrot sues for his freedom (Baggini''s ''Free Percy''): what a person is (Locke''s ''thinking intelligent being'', and Locke''s own rational parrot), whether a non-human animal could be one, and whether denying him rights because of his species is a prejudice'
- domain: 'Harlow''s maternal deprivation experiments on rhesus monkeys: the wire and cloth mothers, what they showed about attachment, and whether the knowledge gained justified the cruelty'
- domain: 'Elephants, chimpanzees, and personhood: Keiper''s ''Do Elephants Have Souls?'', the Nonhuman Rights Project''s habeas petitions for Tommy the chimpanzee and Happy the elephant, and the scientific taboo on anthropomorphism'
- domain: 'Comparing welfare across species: Rethink Priorities''s welfare-range estimates (a chicken''s welfare range about a third of a human''s, at the median), neuron counts and behavioural proxies, the two-envelope problem for moral weights, and whether such numbers can be meaningful at all'
- domain: 'Welfare reform vs. abolition: do cage-free and broiler-welfare campaigns reduce suffering or entrench animal use (Francione''s critique of ''new welfarism''), and how effective animal advocacy weighs corporate campaigns, individual diet change, and alternative proteins'
- domain: 'The logic of the larder (Leslie Stephen: ''The pig has a stronger interest than anyone in the demand for bacon''): if farm animals exist only because we eat them, does a decent life make eating them a benefit to them? Salt''s reply that one cannot benefit a being by bringing it into existence, Singer''s replaceability argument, and whether a typical factory-farmed life is worth living'
- domain: 'Precaution at the edge of sentience (Birch): the 2021 LSE review that brought octopuses, crabs, and lobsters into the UK''s Animal Welfare (Sentience) Act 2022, ''sentience candidates'' and proportionate precautions, the 2024 New York Declaration on Animal Consciousness, and the first bans on octopus farming (Washington, California)'
- domain: 'Animal experimentation: whether medical benefits justify harms to research animals, the 3Rs (replace, reduce, refine; Russell and Burch), how well animal models predict human outcomes, and the shift away from mandatory animal testing (the FDA Modernization Act 2.0)'
- domain: 'Keeping animals: zoos as conservation and education or as prisons (Jamieson''s ''Against Zoos''), whether pet-keeping is companionship or ownership of dependents (Francione''s case against breeding companion animals), and captive orcas (Blackfish, SeaWorld''s 2016 end of breeding)'
- domain: 'The argument from marginal cases (species overlap): any capacity said to justify treating all humans better than all animals is lacked by some humans, so either some humans lose protection or some animals gain it; replies from species membership and kind-based views, relational views, and Kittay''s objection to using cognitively disabled people as philosophical examples (her exchange with McMahan and Singer)'
- domain: 'Insect farming: black soldier fly larvae and mealworms raised by the billions for animal feed and food as a ''sustainable protein'', how they are kept and killed, and whether scaling the industry is a welfare catastrophe under even a modest credence in insect sentience'
- domain: 'Cultivated meat: whether meat grown from animal cells could end factory farming, its remaining ethical questions (fetal bovine serum, source animals, objections from naturalness), its technical and cost hurdles, and whether eating it is morally different from eating plants or from eating animals'
- domain: Is killing a happy animal wrong? Painless slaughter after a good life on a genuinely humane farm, McMahan's time-relative interests (an animal loses little by death if its psychological connections to its future are weak), the replaceability argument, and whether this would license eating meat from such farms
- domain: 'Intervening in nature to reduce wild animal suffering: species whose offspring mostly die soon after birth, welfare biology (Ng) and proposals for contraception, disease control, and humane population management, the risk of ecological side effects, and whether nature''s value or the animals'' autonomy forbids intervention'
- domain: 'Shrimp welfare: hundreds of billions of shrimp farmed and killed each year, evidence of sentience in decapods (the LSE review), the Shrimp Welfare Project''s case for electrical stunning, and whether small probabilities of sentience times vast numbers can make shrimp a top cause'
- domain: Does suffering outweigh happiness in nature? The argument from reproductive strategies in which most animals die young, Horta's case against the idyllic view of nature, replies about the unknown experiences and moral weight of short-lived animals, and how such a balance could ever be measured
