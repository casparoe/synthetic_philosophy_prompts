- domain: What is expertise, and how is it acquired? Ericsson's deliberate practice (with Krampe and Tesch-Römer, 1993) and the '10,000-hour rule' it inspired, a meta-analysis finding that practice explains only part of performance (Macnamara, Hambrick, and Oswald, 2014), the Dreyfus brothers' stages from rule-bound novice to intuitive expert, Collins and Evans's interactional expertise, and whether expertise is general or bound to one domain
