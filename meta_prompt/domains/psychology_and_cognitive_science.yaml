# Psychology and cognitive science: cognitive science, heuristics and biases, judgment and decision-making studies, development, personality, social psychology not specific to morality
- domain: Predictive processing and the free energy principle
- domain: The frame problem
- domain: 'The sunk cost fallacy: is honoring sunk costs always irrational?'
- domain: 'Evolutionary psychology: science or just-so stories?'
- domain: Innateness and the poverty of the stimulus
- domain: What is intelligence?
- domain: Analogy-making as the core of cognition (Hofstadter and Sander's Surfaces and Essences)
- domain: 'Copycat and fluid concepts: conceptual slippage in a microdomain'
- domain: 'Letter Spirit: what makes every ''a'' an ''a''? Categories, style, and the essence of a letterform'
- domain: Bongard problems and the induction of concepts from a few examples
- domain: 'Loss aversion and the endowment effect: bias or legitimate preference?'
- domain: The mental imagery debate (Kosslyn vs. Pylyshyn)
- domain: Enactivism and embodied cognition vs. representationalism
- domain: Modularity of mind, from Fodor to massive modularity
- domain: 'Theories of concepts: prototypes, exemplars, and the theory theory'
- domain: Morgan's canon and the attribution of cognition to animals
- domain: 'Metacognition: is thinking about thinking always helpful?'
- domain: 'Misconceptions as theories: why students make systematic errors'
- domain: 'Planning vs. improvisation: is planning overrated?'
- domain: 'Introspection and rumination: when is self-examination harmful?'
- domain: 'The Abilene paradox: groups choosing what no member wants'
- domain: 'The preparedness and prevention paradoxes: successful precaution looks unnecessary in hindsight'
- domain: 'Ironic process theory: why suppressing a thought summons it'
- domain: 'The region-beta paradox: recovering faster from worse experiences'
- domain: 'Solomon''s paradox: reasoning wisely about others but not oneself'
- domain: 'The Stockdale paradox: hope and brutal realism together'
- domain: 'The paradox of choice: does more choice make us less happy?'
- domain: 'Implicit bias: beliefs, aliefs (Gendler), or dispositions, and whether we are responsible for them'
- domain: 'Pseudo-profound bullshit: receptivity to deep-sounding sentences (Pennycook), and the line between the deep and the deep-sounding'
- domain: 'The illusion of explanatory depth (Rozenblit and Keil): feeling one understands a zipper, a policy, or a theory, and tests that expose the gap'
- domain: 'The willpower paradox: asking oneself ''Will I?'' reportedly produces more goal-directed behaviour than declaring ''I will'' (Senay, Albarracín, and Noguchi), and whether resolutions can undermine themselves'
- domain: 'Sayre''s paradox: cursive handwriting cannot be recognized without first being segmented into letters, nor segmented without first being recognized; chicken-and-egg problems in perception, the hermeneutic circle, and how learning systems escape them'
- domain: 'The tritone paradox (Diana Deutsch): the same pair of Shepard tones is heard as rising by some listeners and as falling by others, with judgments tied to the language or dialect they grew up with; perception, ambiguity, and whether anyone hears it ''correctly'''
- domain: 'The sad clown paradox: comedians and depression; whether the stereotype holds up, and theories of why humour and suffering might go together'
- domain: 'Kahan''s motivated numeracy: are numerate people better or worse at reading a data table when it concerns gun control rather than skin cream, and what identity-protective cognition means for deliberative democracy'
- domain: 'Overimitation: children copy causally useless actions that chimpanzees skip (Horner and Whiten), whether conformity is a byproduct of cultural learning, and when copying blindly is rational'
- domain: 'Asch''s conformity experiments: did subjects irrationally abandon the evidence of their eyes or reasonably weigh unanimous testimony, how often did they resist, and what the studies show about independence of mind'
- domain: 'The hungry judges study (Danziger, Levav, and Avnaim-Pesso): do parole approvals fall before meal breaks, the case-ordering critique, and what extraneous influences imply for judicial discretion'
- domain: 'Sex differences in jealousy (Buss et al.): are men more distressed by sexual and women by emotional infidelity, does the forced-choice method manufacture the effect, and what would count as evidence for an evolved difference?'
- domain: 'Greenwald''s ''The Totalitarian Ego'': the self-serving revision of personal history through egocentricity, ''beneffectance'', and cognitive conservatism, and whether these biases are design features shared with propaganda and scientific paradigms (Kuhn)'
- domain: Is 'g' real? Spearman's positive manifold, factor analysis, and whether general intelligence is a cause, a statistical summary, or a reification (Gould)
- domain: Are emotions natural kinds? Ekman's universal basic emotions vs. Barrett's constructed emotions, Fiske's 'lexical fallacy' of taking English emotion words as kinds, and Solomon's view that emotions are judgments we choose
- domain: 'Affective forecasting: why people mispredict what will make them happy (impact bias, focusing illusion, the wandering mind), and what that implies for autonomy and paternalism about well-being'
- domain: 'The implicit association test controversy: test-retest reliability, weak prediction of behavior, and whether an ''implicit bias'' that predicts no behavior is a bias at all'
- domain: 'The Stanford Prison Experiment exposed: were the guards coached toward brutality, did the prisoners know they could leave, Reicher and Haslam''s BBC Prison Study, and what remains of ''the power of the situation'''
- domain: 'The Dunning--Kruger effect: do the unskilled overestimate themselves because they lack the skill to judge their skill, or is the pattern largely regression to the mean plus a better-than-average effect?'
- domain: 'Judith Rich Harris''s The Nurture Assumption: do parents shape who their children become, or do genes and peers do most of the work, and what follows for parental credit and blame?'
- domain: 'The Tendency for Interpersonal Victimhood (Gabay, Hameiri, Rubel-Lifschitz, and Nadler): need for recognition, moral elitism, lack of empathy, and rumination, and whether victimhood can be a personality trait'
- domain: 'The modularity debate as a levels-of-analysis confusion (Pietraszewski and Wertz): do Fodorian and evolutionary-psychology ''modules'' name different concepts, so that critics and defenders talk past each other?'
- domain: 'Varieties of inner life: aphantasia (no voluntary imagery), anendophasia (no inner voice, Nedergaard and Lupyan) and the skeptical reply, and what such differences show about imagination, thought, and introspective report'
- domain: 'The rice theory of culture (Talhelm et al.): are rice-farming communities more collectivist and holistic than wheat-farming ones, and what quasi-random assignment on Chinese state farms adds to the causal claim'
- domain: 'The Cognitive Reflection Test (Frederick''s bat and ball): does it measure reflection, numeracy, or intelligence, and what do its links to religious belief and conspiracy belief show?'
- domain: 'Dual-process theories (System 1 and System 2): are ''fast and slow'' two systems or a convenient dichotomy, and why psychology keeps dividing the mind in two'
- domain: 'Firestone and Scholl''s ''Cognition Does Not Affect Perception'': do beliefs and desires change what we see (Bruner and Goodman''s coins, hills that look steeper under heavy packs), or do such findings reflect judgment, memory, and attention?'
- domain: 'Magic under uncertainty: Malinowski''s ''Magic, Science and Religion'' (lagoon vs. open-sea fishing in the Trobriands) and Gmelch''s ''Baseball Magic'' (rituals for hitting and pitching but not fielding), and whether superstition is irrational'
- domain: 'The Linda problem (Tversky and Kahneman): is judging ''feminist bank teller'' more probable than ''bank teller'' a conjunction fallacy or a reasonable reading of ''probable'' (Gigerenzer)?'
- domain: 'Learned helplessness: Seligman''s dogs that stopped trying to escape shocks, Maier and Seligman''s later conclusion that passivity is the default and control is what is learned, and the ethics of the experiments'
- domain: 'The false-belief task (Wimmer and Perner; the Sally--Anne test): does passing it at about four mark the onset of a theory of mind, and what do infant looking-time studies do to that claim?'
- domain: 'False memory (Loftus and Palmer''s ''smashed'' vs. ''hit'', implanted memories): what the studies imply for eyewitness testimony and for weighing sincere memories in contested abuse allegations'
- domain: 'The invisible gorilla (Simons and Chabris): people counting basketball passes miss a gorilla walking through the scene; are unattended things unseen, or seen and forgotten?'
- domain: 'Self-control without willpower: DeSteno''s Emotional Success (gratitude, pride, and compassion as aids to patience), the marshmallow test and its reanalysis, and whether grit is the wrong target'
- domain: Do our friends know us better than we know ourselves? Vazire's self-other knowledge asymmetry, and Tiberius on reflection, emotion, and values in the good life
- domain: 'Damasio''s somatic marker hypothesis (Descartes'' Error): patients whose emotional deficits wreck practical decision-making (Phineas Gage, ''Elliot''), and whether emotion is necessary for rational choice'
- domain: 'Nisbett and Cohen''s Culture of Honor: the herding hypothesis for Southern violence, the experiment in which an insult raised cortisol and aggression in Southern men, whether honor norms are rational where the state is weak, and the Oscars slap'
- domain: 'Freud''s Civilization and Its Discontents: why civilization''s demand to renounce sexuality and aggression makes us unhappy, the superego as aggression turned inward, the ''oceanic feeling'', and the death drive'
- domain: 'William James on habit: making the nervous system our ally instead of our enemy, habit as ''the enormous fly-wheel of society'', and character as a bundle of habits we can shape'
- domain: 'Hoel''s overfitted brain hypothesis: do dreams keep the brain from overfitting to daily experience, like noise injected into neural networks, and is fiction a waking analogue that mere entertainment cannot supply?'
- domain: 'William James on instinct: his claim that humans have more instincts than other animals, masked by habit, and today''s nativism vs. empiricism debates in developmental psychology'
- domain: 'Jung''s collective unconscious: archetypes, the shadow and its projection onto others, his break with Freud, and whether the theory is psychology, philosophy, or unfalsifiable myth'
- domain: 'Cormac McCarthy''s ''The Kekulé Problem'': why the unconscious seems to solve problems and deliver answers in images and dreams rather than words, and his claim that language is a late arrival the unconscious does not trust'
- domain: 'Becker''s The Denial of Death: heroism projects as defenses against mortality, terror management theory''s mortality-salience experiments, Many Labs 4''s failure to replicate them, and whether Becker''s thesis is falsifiable'
- domain: 'Hyperbolic vs. exponential discounting: preference reversals ($100 today over $110 tomorrow, yet $110 in 31 days over $100 in 30), Laibson''s quasi-hyperbolic beta-delta model, naive vs. sophisticated agents (O''Donoghue and Rabin), and whether dynamic inconsistency is irrational or, as Sozou argued, a sensible response to uncertain hazard rates'
- domain: 'Definitions of intelligence: Legg and Hutter''s survey of some seventy definitions and their universal intelligence measure (expected reward across all computable environments, weighted by simplicity), Chollet''s intelligence as skill-acquisition efficiency (the ARC benchmark), the psychometric mainstream (Gottfredson), and whether ''intelligence'' names one thing'
- domain: Is loss aversion real? Kahneman and Tversky's claim that losses loom larger than gains, Gal and Rucker's 'The Loss of Loss Aversion' (status quo bias and inertia instead), Rabin's calibration theorem on small-stakes risk aversion, and whether reference-dependent preferences are irrational or a legitimate way to value outcomes
- domain: 'Near vs. far mode (Hanson, after Trope and Liberman''s construal level theory): we think about distant events, people, and hypotheticals abstractly and idealistically and about near ones concretely and selfishly; whether far-mode values are more authentic or merely cheap talk, and what this means for thought experiments, charity, and long-term planning'
- domain: 'Braitenberg''s Vehicles: imaginary robots whose sensors are wired directly to their motors yet who look afraid, aggressive, or in love, the ''law of uphill analysis and downhill invention'' (building behaviour is easier than inferring its mechanism), and what this synthetic psychology suggests about how readily we ascribe minds'
- domain: 'Prospect theory (Kahneman and Tversky): outcomes judged as gains and losses from a reference point, loss aversion, diminishing sensitivity, probability weighting that overweights small probabilities, the fourfold pattern of risk attitudes, and cumulative prospect theory; whether a descriptive theory of choice has normative lessons'
