- domain: How could we tell whether an AI is conscious? Behavioural tests such as Schneider's AI Consciousness Test (Artificial You, 2019), Birch's 'gaming problem' that models trained on human text mimic the markers we would look for (The Edge of Sentience, 2024), indicator properties drawn from scientific theories (Butlin, Long, et al., 2023), and Chalmers's 'Could a Large Language Model Be Conscious?'; whether any evidence could settle it
  urls:
    - https://en.wikipedia.org/wiki/Artificial_consciousness
