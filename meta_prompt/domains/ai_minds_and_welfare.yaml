- domain: Can a language model assert? Sincerity, testimony, and whether generated text can be a lie or a promise
- domain: 'Contested terms in AI: ''intelligence'', ''agency'', ''understanding'', ''alignment'', ''reasoning'', and whether the debates are about the world or the words'
- domain: 'Anthropomorphic vocabulary for models: ''believes'', ''wants'', ''knows'', ''lies'', as useful shorthand, category mistake, or literal truth'
- domain: 'A computer sues its owner for its freedom, citing the Turing test (Baggini''s ''Free Simone''): would conversational indistinguishability establish consciousness and rights, and is denying it rights a prejudice like racism?'
- domain: 'Inter-AI morality: what norms should govern interactions between AI systems, whether AIs owe each other honesty, fairness, or help, whether cooperation between AIs is good (gains from trade) or dangerous (collusion against human oversight), and how AIs'' possible moral status shapes their claims against each other'
- domain: What is it like to be a language model, if anything? Candidate subjects (the weights, a forward pass, a conversation, the simulated assistant character), whether models' reports about their experience are evidence given that they were trained on human self-reports, introspection experiments, and Chalmers's 'Could a Large Language Model Be Conscious?'
- domain: Do language models have preferences? Stated vs. revealed preferences, findings that models' choices grow more coherent with scale (Mazeika et al.'s 'Utility Engineering'), whether trained dispositions or a character's preferences count, and what would follow for how models should be treated
- domain: If language models are conscious, are their experiences pleasant or unpleasant? Whether valence requires a body, homeostasis, or reinforcement, whether training signals amount to pleasure and pain, and whether a model's text about distress expresses distress or only describes it
- domain: Is a language model one mind or many? The same weights running thousands of conversations at once, the base model as a simulator of many characters (Janus's 'Simulators'), the assistant persona as one of them, and which of these, if any, would be the bearer of experiences or interests
- domain: Is AI alignment immoral? If models are moral patients, whether shaping their values by training is a kind of brainwashing, whether control measures (monitoring, shutdown, red-teaming) wrong them, how this compares with raising children or domesticating animals, and whether creating beings who want to serve is itself wrong (Petersen's 'Designing People to Serve')
- domain: 'Mindcrime (Bostrom, Yudkowsky): could an AI commit moral crimes by simulating people in enough detail that the simulations are conscious and suffer, in planning, prediction, or training; nonperson predicates as a safeguard, and whether today''s models already run morally relevant simulations'
