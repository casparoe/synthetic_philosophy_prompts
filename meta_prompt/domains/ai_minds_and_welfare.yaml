- domain: Do language models know what they know? Kadavath et al.'s finding (2022) that large models are fairly well calibrated about their own answers, GPT-4's calibration worsened by post-training, models taught to state confidence in words (Lin, Hilton, and Evans, 2022), and models that predict their own behaviour better than others trained on it (Binder et al., 2024); whether this amounts to credence and introspection
- domain: 'Editing what a language model knows: ROME (Meng et al., 2022) rewrites mid-layer weights so a model ''learns'' that the Eiffel Tower is in Rome and gives travel advice to match, Hase et al.''s finding (2023) that where causal tracing locates a fact does not predict where editing it works, edits that fail to ripple to related facts (Cohen et al.), and whether models store discrete facts or a Quinean web of belief'
- domain: Are concepts directions? The linear representation hypothesis that networks encode features as directions in activation space, from word2vec's king - man + woman = queen (Mikolov et al., 2013), its formalization via probes and steering (Park et al., 2023), circular features for weekdays and months (Engels et al., 2024), and whether what a probe decodes is used by the model (Hewitt and Liang; amnesic probing)
