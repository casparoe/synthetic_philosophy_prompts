# Social choice and voting: Arrow's theorem, voting rules and voting criteria, electoral systems, aggregation theorems, judgment aggregation, the Condorcet jury theorem
- domain: Arrow's impossibility theorem
- domain: 'The paradox of voting (Downs): why vote when one ballot almost never decides anything'
- domain: Judgment aggregation and the discursive dilemma
- domain: Harsanyi's aggregation theorem
- domain: The Condorcet jury theorem
- domain: The Gibbard--Satterthwaite theorem and strategy-proofness
- domain: Sen's liberal paradox
- domain: Proportional representation vs. first-past-the-post
- domain: 'The apportionment paradoxes (Alabama, new states, population): rounding and representation'
- domain: 'The Condorcet paradox: cyclic majorities and the meaning of ''the will of the people'''
- domain: 'The no-show paradox: when voting for your candidate hurts them'
- domain: 'Gerrymandering: what fair representation would even mean, and whether any districting is neutral'
- domain: 'The Electoral College and Senate malapportionment: political equality, federalism, and whether one person''s vote may count more'
- domain: 'Harsanyi''s aggregation theorem: if individuals and society all satisfy the von Neumann--Morgenstern axioms and society is indifferent whenever everyone is, social welfare is a weighted sum of individual utilities; what the theorem leaves open (the weights, interpersonal comparisons), and the Harsanyi--Sen debate over whether it supports utilitarianism'
- domain: 'Independence of irrelevant alternatives: in social choice (Arrow), in individual choice (Sen''s property alpha and the polite guest who will not take the last apple), and in bargaining (Nash''s axiom, which Kalai and Smorodinsky drop); when menu-dependent choice is irrational and when it is reasonable'
- domain: 'The Condorcet criterion and its relatives: a candidate who beats every rival head-to-head should win, the Condorcet loser should never win, and the winner should come from the Smith set (the smallest group of candidates who each beat everyone outside it); why plurality and instant-runoff violate some of these, Condorcet methods (Schulze, ranked pairs, Kemeny), and whether pairwise majority winners deserve to win'
- domain: 'Monotonicity and participation in voting rules: whether ranking a candidate higher can make them lose (it can under instant-runoff), whether voting at all can hurt your favourite (the no-show paradox), Moulin''s theorem that Condorcet methods must fail participation, and how much such pathologies matter in practice (Burlington''s 2009 mayoral election)'
- domain: 'Independence criteria for voting rules: independence of irrelevant alternatives (which Arrow showed no reasonable ranked rule satisfies), independence of clones (adding a near-identical candidate should not change the result, as vote splitting under plurality does), independence of Smith-dominated alternatives, and spoilers as the practical face of these failures'
- domain: 'Later-no-harm, consistency, and other voting criteria: whether ranking a second choice can hurt your first (instant-runoff says no, Condorcet methods sometimes yes), consistency across districts (Young''s characterization of scoring rules), reversal symmetry, majority and plurality criteria, and which criteria express fairness and which are merely technical desiderata'
- domain: 'Comparing electoral systems: first-past-the-post (Duverger''s law and two-party politics), instant-runoff, approval and score voting, Condorcet methods, and proportional systems (party lists, single transferable vote, mixed-member); what each optimizes (accountability, proportionality, moderation, simplicity), and what simulations of voter satisfaction (Bayesian regret) suggest'
- domain: 'May''s theorem: with two options, majority rule is the only procedure that is anonymous, neutral, decisive, and positively responsive; what the theorem justifies and what it leaves out (intensity of preference, more than two options), and quadratic voting as an attempt to register how much voters care'
- domain: 'Approval voting: each voter approves any number of candidates and the most approved wins; its use in professional societies and in Fargo and St. Louis, its strategic questions (whether to approve a second choice), and whether a bare mark of approval captures anything voters care about'
