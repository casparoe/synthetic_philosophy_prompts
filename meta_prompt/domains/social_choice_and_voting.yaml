- domain: 'The Condorcet criterion and its relatives: a candidate who beats every rival head-to-head should win, the Condorcet loser should never win, and the winner should come from the Smith set (the smallest group of candidates who each beat everyone outside it); why plurality and instant-runoff violate some of these, Condorcet methods (Schulze, ranked pairs, Kemeny), and whether pairwise majority winners deserve to win'
  urls:
    - https://plato.stanford.edu/entries/voting-methods/
    - https://en.wikipedia.org/wiki/Condorcet_method
    - https://en.wikipedia.org/wiki/Smith_set
- domain: 'Monotonicity and participation in voting rules: whether ranking a candidate higher can make them lose (it can under instant-runoff), whether voting at all can hurt your favourite (the no-show paradox), Moulin''s theorem that Condorcet methods must fail participation, and how much such pathologies matter in practice (Burlington''s 2009 mayoral election)'
  urls:
    - https://plato.stanford.edu/entries/voting-methods/
    - https://en.wikipedia.org/wiki/Participation_criterion
    - https://en.wikipedia.org/wiki/Non-negative_responsiveness
- domain: 'Independence criteria for voting rules: independence of irrelevant alternatives (which Arrow showed no reasonable ranked rule satisfies), independence of clones (adding a near-identical candidate should not change the result, as vote splitting under plurality does), independence of Smith-dominated alternatives, and spoilers as the practical face of these failures'
  urls:
    - https://en.wikipedia.org/wiki/Independence_of_clones_criterion
    - https://en.wikipedia.org/wiki/Spoiler_effect
- domain: 'Later-no-harm, consistency, and other voting criteria: whether ranking a second choice can hurt your first (instant-runoff says no, Condorcet methods sometimes yes), consistency across districts (Young''s characterization of scoring rules), reversal symmetry, majority and plurality criteria, and which criteria express fairness and which are merely technical desiderata'
  urls:
    - https://plato.stanford.edu/entries/voting-methods/
    - https://en.wikipedia.org/wiki/Later-no-harm_criterion
    - https://en.wikipedia.org/wiki/Voting_criteria
- domain: 'Comparing electoral systems: first-past-the-post (Duverger''s law and two-party politics), instant-runoff, approval and score voting, Condorcet methods, and proportional systems (party lists, single transferable vote, mixed-member); what each optimizes (accountability, proportionality, moderation, simplicity), and what simulations of voter satisfaction (Bayesian regret) suggest'
  urls:
    - https://plato.stanford.edu/entries/voting-methods/
    - https://en.wikipedia.org/wiki/Comparison_of_electoral_systems
    - https://en.wikipedia.org/wiki/Duverger%27s_law
