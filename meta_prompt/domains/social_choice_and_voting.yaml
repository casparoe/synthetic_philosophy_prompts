- domain: 'Sen''s ''The Impossibility of a Paretian Liberal'': no social choice rule respects unanimous preferences, gives each person a say over at least one private matter, and works for every preference profile (the prude, the lewd, and Lady Chatterley''s Lover); replies that treat rights as constraints on game forms rather than on outcomes (Gibbard; Gaertner, Pattanaik, and Suzumura)'
