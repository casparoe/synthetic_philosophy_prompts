- domain: 'Paul Almond''s case that evidential decision theory is correct (''On Causation and Correlation'', 2010): choices as evidence about the parts of the world that correlate with one''s behaviour, his notion of ''evidential power'', and his claim that EDT matters little in everyday situations where we already know a lot'
