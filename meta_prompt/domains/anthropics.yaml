# Anthropics: self-locating belief, Sleeping Beauty, SSA/SIA, doomsday arguments, the simulation argument, Boltzmann brains, the anthropic shadow, observation selection effects, l-zombies
- domain: The simulation argument
- domain: The doomsday argument
- domain: Boltzmann brains
- domain: Quantum immortality and quantum suicide
- domain: The Sleeping Beauty problem and self-locating belief
  urls:
    - https://en.wikipedia.org/wiki/Sleeping_Beauty_problem
    - https://plato.stanford.edu/entries/self-locating-beliefs/
- domain: Self-sampling vs. self-indication assumptions (and the presumptuous philosopher)
- domain: Does the simulation argument dampen fanaticism about the far future?
- domain: 'Elga''s Dr. Evil: self-locating belief, duplication, and blackmail by simulation'
- domain: 'Adam and Eve and the presumptuous philosopher: anthropic reasoning taken to extremes'
- domain: 'Gott''s delta-t argument: if nothing makes the present moment special in something''s lifetime, it is 95% likely to last between 1/39 and 39 times its current age; his Berlin Wall prediction (1969), his intervals for 44 Broadway shows and for humanity (1993), the Lindy effect, and Caves''s Bayesian objection that we almost always know more (a 50-year-old at her birthday party)'
- domain: 'The anthropic shadow (Ćirković, Sandberg, and Bostrom): observers exist only in histories without extinction-level catastrophes, so the geological record may understate the risk of asteroid impacts and supervolcanic eruptions; whether the bias is real, Thomas''s argument that it is essentially irrelevant to estimating risk, and whether surviving the Cold War''s near misses shows that nuclear war was unlikely'
- domain: 'SIA doomsday (Katja Grace): the self-indication assumption favors hypotheses with more observers at our stage, which are those on which the great filter lies after our stage rather than before it, so together with the silent sky it predicts that the filter is ahead of us; whether this is a reductio of SIA or a reason for alarm'
- domain: 'Conitzer''s Dutch book against evidential Sleeping Beauties: in a variant of the problem, evidential decision theorists accept bets that lose for sure whether they are halfers or thirders, because their action is evidence about what they do at decision points with different but symmetric information; what this means for pairing decision theories with credences (Briggs''s ''Putting a Value on Beauty'')'
- domain: 'Anthropic decision theory (Armstrong): set self-locating probabilities aside and ask what policy an agent should adopt; in Sleeping Beauty, selfless agents and total utilitarians then bet like thirders while average utilitarians and selfish agents bet like halfers; whether anthropic questions that come with no decision attached have answers'
- domain: Do self-locating probabilities matter? The pragmatist critique that for an agent with non-indexical preferences who optimizes its policy ex ante, the question of Sleeping Beauty's credence dissolves, and Oesterheld's reasons to keep doing anthropics (indexical preferences, doubts about updatelessness, and which de se procedures work for everyday updating and for AI agents)
- domain: 'The simulation argument by analogy (Daniel Kokotajlo): if only one disease in ten is contagious but each contagious one infects a thousand people, a sick person should be nearly sure someone had their disease before; why ancestor simulations remove distinguishing evidence, and why Bostrom''s conclusion is a trilemma rather than ''we are simulated'''
- domain: 'L-zombies (Fallenstein): a decision algorithm that is never actually run, yet whose output matters because others predict or simulate it; whether you could be an l-zombie without knowing it, whether your experiences prove that you are being run, and what this means for acting in Newcomb-like problems and anthropic dilemmas'
- domain: 'Boltzmann brains: in cosmologies where random fluctuations produce far more short-lived observers with experiences like ours than evolved ones, we should expect to be one; why physicists treat this as a reductio of such cosmologies (Carroll''s ''cognitively unstable''), and what it shows about self-locating belief and theory choice'
