- domain: 'Why charities need not be cost-effective (Oesterheld): unlike firms in efficient markets, charities compete for donors rather than on impact, so beating the average charity is easy while the most cost-effective may struggle to raise money, except where fundraising success tracks the mission (fundraising and advocacy organizations)'
  urls:
    - https://casparoesterheld.com/2018/03/28/market-efficiency-and-charity-cost-effectiveness/
- domain: Is neglectedness easy to assess? Oesterheld's argument that its measurable versions (resources invested, caring more than society does) matter only as proxies for diminishing marginal returns, so judging it requires the shape of the returns curve, attention to future actors who will take the best opportunities anyway, and a principled way to delimit a cause area
  urls:
    - https://casparoesterheld.com/2017/06/25/complications-in-evaluating-neglectedness/
- domain: 'Moral circle expansion as a cause: Anthis and Paez''s case that widening moral concern to animals and digital minds now could shape the long-term future, evidence on what widens moral circles (contact, argument, economic change), and the risk of widening it to the wrong beings or in the wrong way'
- domain: 'Singer''s drowning child in detail: if you would ruin your shoes to save a child drowning in a shallow pond, you should give to save distant children; the objections (distance, the many other potential rescuers, demandingness, rescue vs. ongoing aid), Unger''s Living High and Letting Die, and whether the argument proves too much'
- domain: Does foreign aid work? Sachs's The End of Poverty vs. Easterly's The White Man's Burden and Moyo's Dead Aid, randomized evaluations (Banerjee and Duflo), GiveDirectly's cash transfers, aid's effects on governance, and what rich countries owe whatever the answer
- domain: 'Brian Tomasik''s suffering-focused ethics: his Essays on Reducing Suffering on wild-animal and insect suffering, digital sentience, and risks of astronomical future suffering, his view that consciousness is partly a matter of how we choose to classify systems, his co-founding of the Foundational Research Institute (now the Center on Long-Term Risk), and how far such concerns should shape priorities'
