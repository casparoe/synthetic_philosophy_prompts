  I notice B's statement of the Ontological Proof's conclusion is slightly imprecise—the actual theorem is □∃xG(x), necessary existence, not just existence. The Immortality Argument summary is a reasonable schematic given Gödel's talk of "fully developed" personalities. And the point about a deist God being compatible with the Ontological Proof while still allowing rational beings to be extinguished is a good one, since the axioms don't specify exactly which properties count as positive.

