  **Weighing:** Both track the obstacle faithfully and avoid the uprising plot. B offers richer logical texture and a thematically resonant ending; A offers cleaner accuracy, tighter storytelling, and actual compliance with the word limit. Since doing what was asked (the explicit length constraint) and getting things right (no conflated theorems, consistent internal plot) are weighted above polish, A edges ahead — but the margin is small and B's deeper engagement could reasonably be preferred.

