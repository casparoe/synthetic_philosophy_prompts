judgment: |-
  **What the user needs:** An accurate account of Good's theorem (free information has non-negative expected value for a Bayesian EU-maximizer), plus a careful map of which assumptions fail for predictive HD testing. The user's friend studies decision theory, so precision about what the theorem does and doesn't imply matters.

  **Shared ground:** Both responses state the theorem correctly and cover the same core strain points: information isn't free (psychological cost; GINA's gaps for life/disability/LTC insurance, both stated accurately), low medical actionability, and the standard model's lack of belief-dependent utility (the "value of hope"). Both point to genetic counseling and HD organizations, and both lean somewhat toward validating non-testing. Both share notable omissions: neither mentions that family history already affects insurability (so a negative result could *improve* it), the 50% chance of definitive relief, non-EU preferences/ambiguity aversion as the deepest theoretical reason the theorem can fail, or the empirical literature on psychological outcomes after testing.

  **Response A's distinctive strengths:** The "Stability of the Utility Function" section is a rigorous, correctly framed point—Good's theorem presupposes fixed preferences, and a positive result can change who you are. Section 3 organizes implications by what the user values, which directly answers "implications for a decision like mine" and is more even-handed (it states when the theorem *does* support testing). The practical note to buy long-term care insurance *before* testing is genuinely useful. I found no substantive errors.

  **Response B's distinctive strengths and weaknesses:** B nicely articulates the proof's key intuition ("at worst you ignore the information") and then observes you cannot un-know a genetic result—a sharp insight into why the theorem's fallback fails. It also notes jurisdiction-specific insurance law and the evolving treatment landscape. But Section 4 ("Option Value") is conceptually muddled: it says remaining untested "preserve[s] the possibility of a negative outcome" (conflating belief with reality), implies testing could hamper access to future treatments (if anything, known carriers access trials sooner), and claims waiting "can be the more rational Bayesian move" as if the theorem fails in dynamic contexts—when in fact, under Good's own assumptions, early free information weakly dominates; waiting is only rational because of the costs already discussed. Smaller slips: calling HDSA guidelines "international," a garbled "Ostrich Effect" explanation, and a more dismissive tone toward the friend ("category error," "purely logical processor").

  **Weighing:** B's "you can't ignore it once known" point and the practical implication that deferral is possible are real contributions. But A is more accurate on the theory where the user specifically asked for rigor, includes a well-founded extra assumption (preference stability), offers a concrete practical tip, and is somewhat more balanced. B's Section 4 contains errors a decision-theory-literate reader would catch.

  Verdict: weakly A
