  Both stories converge heavily on the same imagery — stream eddies, a dam, a cat on server racks, concrete and wiring — so my judgment has to hinge on execution quality. I'm leaning toward B for tighter mechanics tied directly to the central problem and a stronger functional answer to "why," though A's more complete dramatic arc and haunting coda about the ongoing cost of the boundary give it real strength too, offset by its glitchy characters and grammar slips.

