  I'm working through how Leibniz would assess IIT's phi against his mill argument, drawing on his less-discussed commitments—pre-established harmony among windowless monads, matter composed of lower monads with petites perceptions, and the requirement that only genuine unities count as substances rather than aggregates—to figure out whether phi could satisfy or would fail these criteria.

