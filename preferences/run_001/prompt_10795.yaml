thinking: |-
  I'm considering the ethical dilemma the juror faces: the memoir's author disclosed that a minor character is a composite of three real people and that key dialogue passages were reconstructed from memory rather than sourced from notes or recordings. I want to weigh how this admission bears on the book's claim to nonfiction status against Augustine's framework on lying.

