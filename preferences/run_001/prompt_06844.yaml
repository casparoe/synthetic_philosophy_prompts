thinking: |-
  I'm thinking through the historical grounding here—the novelist's conflict mirrors the real tension between Du Bois's "Criteria of Negro Art" propaganda stance and the more realist Harlem Renaissance writers like McKay, whose work Du Bois famously panned.

  I want to reconstruct what Du Bois actually argued in that 1926 essay rather than the flattened "propaganda" soundbite—his opening framing that the struggle isn't just for rights but for a world where Black people can build beauty, contrasted against the vulgarity he saw in white materialist culture. That distinction between what propaganda art needs to accomplish, versus a simplistic art-for-art's-sake debate, should be the real spine of the argument I give the user.

  nt want their faults told, but Du Bois actually pushes back against this — he argues the Black bourgeoisie's insistence on only respectable images is itself a kind of borrowed shame from white patrons, and that artists must break free of that self-censorship. He calls for the community to build a wider, more generous critical judgment that gives artists room to portray the full range of Black life, including its flaws.

  The deeper point is that his "propaganda" is really propaganda for truth — for the right to depict Black humanity honestly — because white supremacist art has monopolized the field and forced Black life into either silence or false uplift. His real complaint isn't propaganda itself but its one-sidedness: white art gets to propagandize freely while Black experience is left "stripped and silent." I'm noting how he frames white audiences as demanding a particular kind of art from Black artists.

  So the actual Du Bois position is far more nuanced than "positive images only" — art is inevitably bound up with Truth and Justice, but he wants Black artists free to tell the *whole* truth, ugly parts included, and he criticizes Black bourgeois prudishness for wanting only flattering portrayals.

  Yet his 1928 review of McKay's *Home to Harlem* reveals the tension: he called it nauseating filth catering to white prurient demand for licentiousness, even while acknowledging McKay's talent and some genuinely beautiful passages. His real objection wasn't to depicting ugliness per se, but to art that seemed to *cater* to white voyeurism rather than serve Black interests and dignity.

  This gives me the real argument for the mentor/painter conflict: a true Du Boisian position wouldn't ban seamy subjects outright — it would demand the work stay truthful and Justice-oriented, not become the exotic spectacle a white patron pays to consume. And there's a delicious irony to exploit here — Du Bois himself criticized the Black bourgeoisie for denying "we have or ever had a worst side," so if the mentor character stands in for Du Bois, he's actually contradicting Du Bois's own stated position.

  The painter can turn Du Bois's own words against the mentor, since Du Bois's Beauty-Truth-Goodness triad isn't about prettiness but about honesty bound to justice, and his real complaint against art like McKay's was aesthetic failure dressed up as moral objection. Since white America already monopolizes propaganda while Black experience goes unspoken, the real test isn't whether the pool-hall paintings show a "worst side" but whether they counter that imbalance or feed it — and the painter could argue her subject matter captures a Beauty in Black life that white America simply can't perceive, which is exactly the kind of art Du Bois was calling for.

  There's also an irony worth noting: in the same review where Du Bois criticized McKay, he praised Larsen's Quicksand despite its similarly grim ending, showing his judgment hinged on perceived intention and audience rather than subject matter alone.

