  B's claim that OSR reduces the universe to pure mathematical structure also overstates a disputed criticism as if it were OSR's own assertion, while A's account of Ladyman's response using quantum indistinguishability is more precisely stated. On balance both answers are similar in quality, with A being more careful and precise and B more ambitious but shakier in its argumentation.

