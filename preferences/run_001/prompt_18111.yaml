  - "The late philosopher Peter van Inwagen" — he is alive; this is an embarrassing error to repeat in class.
  - "Statue" listed as an uncontroversial phase sortal — the statue/lump case is the paradigm where "statue" is treated as a substance sortal with its own persistence conditions.
  - "Rigid designator" misused for the strict/loose distinction.
