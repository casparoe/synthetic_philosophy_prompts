  **Weighing.** A better fulfills the request that the trick and its fragility "actually drive the plot," via the abort conflict and Volkov's misreading. B is cleaner, better titled, and has a stronger final image, but is dramatically flatter. The glitch in A is a real blemish but is closer to a typo than a substantive error. Since substance and doing what was asked outweigh polish, I lean slightly toward A, though the trade-off is genuinely close.

