judgment: |-
  Both responses tackle the prompt in nearly identical ways: they define ad hoc-ness, lay out how Cummins's causal-role (CR) account relativizes function to the analyzed capacity, lay out how Godfrey-Smith's modern-history (MH) account privileges recent selective maintenance, and conclude that MH gives the less ad hoc verdict because it anchors function in objective selective dynamics rather than the analyst's interests, while also preserving normativity/malfunction. Both make the same somewhat debatable move of treating interest-relativity as a species of arbitrariness (while acknowledging CR isn't "patched" in the classical ad hoc sense). Neither brings in Godfrey-Smith's own function pluralism, Millikan's derived proper functions, Cummins's own constraints on appropriate analyses, or Amundson & Lauder's defense of CR — all of which a "strongest forms" comparison could have used.

  **Response A's edges:** It gives a more substantive rebuttal to the standard "how recent is recent?" objection (the selection regime itself bounds "recent," illustrated with flightless island birds), which is the key pressure point for MH. Its statement of MH's verdict is slightly more accurate — insulation remains a function *if* it still drives selection, rather than simply being demoted to a past function. It is more careful to attribute strict originalism only to "Wright/early Neander." It ends with a useful summary. Weaknesses: it misattributes to Godfrey-Smith the framing of MH as "a correction of Wright's original formulation"; saying "recent" tracks the "current selection coefficient" partially collapses MH into a current-selection view GS explicitly rejects; the "flightless bird with intact feathers" malfunction example is garbled.

  **Response B's edges:** It is more dialectically balanced, explicitly steelmanning the case that CR is *less* ad hoc (requires no modification; relativization is a feature) before rebutting it as "changing the subject." It makes the apt, prompt-specific point that CR cannot even register the adaptation/exaptation distinction Gould & Vrba were drawing. The added signaling/display capacity and the "why does the trait persist?" explanatory-power point are nice. Weaknesses: it wrongly says Millikan's account "strictly applied" yields thermoregulation (GS presents his theory as essentially Millikan's); "there is no fact of the matter about the organism itself" overstates the CR position; its response to the "how recent" objection is thin.

  Each steelmans one side more than the other, each has a comparable minor misattribution, and both deliver the same well-argued verdict with roughly equal depth. The trade-offs balance out.

  Verdict: unsure/similar
