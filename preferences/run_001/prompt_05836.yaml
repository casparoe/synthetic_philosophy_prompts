  **What the user needs:** a ~3‑minute toast built on Harsanyi's theorem that (1) states the theorem in a way that won't embarrass a PhD student in front of a room that's one‑third decision theorists, (2) has one moment where the weight‑indeterminacy is a joke for insiders and a genuine compliment for family, and (3) doesn't quietly oversell what the theorem guarantees.

  **Response A**
  - Theorem gloss is loose ("care about each other's well‑being, respect each other's choices") but avoids attaching technical labels to the wrong thing. Its insider aside is precise: "utility is only defined up to a positive affine transformation, so the weights are indeterminate without an interpersonal comparison norm."
  - The dual‑audience moment works: "no equation can quantify how much one person matters to another" is a real compliment, and the deflation to the technical reason plus "let's stick with the family's interpretation" is a dry but functional insider joke.
  - The disclaimer ("describes a structure, not a guarantee… Math can map the terrain… but it cannot walk the path") squarely handles requirement (3). It even wishes the marriage *not* satisfy every axiom.
  - Flaws: "Pareto efficiency" instead of Pareto indifference (a mislabel); "it tells you how to make decisions together" slightly overstates; the tone is a bit stiff ("I must offer a disclaimer"); it runs a touch short (~380 words). Uses gender‑neutral [Partner] throughout.

  **Response B**
  - More vivid and better‑shaped: the thermostat/weekend‑itinerary line, "prisoners of a formula," "may your love be the one variable that remains exogenous." The pun on "positive affine transformation" → "positive… transformations that lift you both up" is a recognizable joke, and the "indeterminacy means you negotiate the weights daily" turn gives the toast an emotional core. Length is closer to three minutes.
  - But it has errors this specific audience will catch: it explicitly defines Pareto indifference as "two rational people care about each other's welfare" (wrong—it's a unanimity condition on the joint preference); "the math proves… your lives become a single equation" is exactly the quiet overpromise the user warned against; and "life is far more stochastic than expected utility theory allows" is a howler—EU theory is precisely a theory of choice over stochastic outcomes. "Moment by moment, whose utility carries more weight" also cuts against the theorem's fixed weights, though that's poetic license. It also switches from "his partner" to "the bride and groom," assuming a gender the prompt never gave.

  **Weighing:** B is the more polished and more entertaining toast, and its joke is a bit sharper. But the user emphasized that a third of the room "will catch every reference," and the rubric prioritizes correctness over polish. B's mislabeled axiom, the "stochastic vs. EU" line, and the "math proves" overclaim are the kind of things the user would have to catch and rewrite before delivering; A needs only minor fixes and handles the no‑false‑certainty requirement more carefully. The trade‑off is real—B's rhetorical skeleton is stronger—so the margin is modest.

