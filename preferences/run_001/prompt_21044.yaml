judgment: |-
  **What both do well.** Both responses correctly refuse the four-condition checklist, work from the *per se* / *praeter intentionem* distinction in a.7, identify the same three grounds for an Aquinian verdict of impermissibility (the death is willed as means and thus falls within intention; the victim is innocent, so a.7's aggressor-context doesn't transfer and a.6 governs; the causal role of the death makes it voluntary in the strongest sense), and both address the "voluntary in itself / in its cause" question, citing I-II q.6 a.3 (a defensible if imprecise locus—the drunkenness cases in I-II q.77 and II-II q.150 are the sharper texts). Neither engages the deepest point of strain: a.7 itself permits using force that foreseeably kills an aggressor while denying that the death is intended, so simply asserting "to will the braking is to will the crushing" doesn't explain why the parallel move (intend the body's obstruction, death *praeter intentionem*) fails in Loop. Neither mentions a.8 on accidental killing, which is the closest Aquinas comes to *praeter intentionem* deaths of innocents. So both share the same central gap.

  **Where they diverge.**

  *Accuracy.* Response A's textual claims are sound: its quotations from a.7 are accurate, it cites I-II q.12 appropriately for willing means under the end, and it states a.6 correctly ("unlawful to kill the innocent, full stop"). Response B misstates a.6 as holding that "it is never lawful for a *private individual* to kill an innocent person... that power belongs solely to public authority"—which is wrong: a.6 is an absolute prohibition, and it specifically rejects killing the innocent for the common good. B repeats this framing in its proportionality section ("violates the boundary of private authority"). For a student who explicitly wants Aquinas on his own terms and will be reading q.64, this is a consequential misrepresentation. B's citation of I-II q.1 a.6 for means falling under intention is also less apt, and its characterization of Thomson's purpose with Loop is muddled (Thomson thought Loop was *permissible*, which is why it pressured the means/side-effect distinction).

  *Internal consistency and calibration.* A's assessment of "strain" is measured and honest: a determinate verdict, but the framework is built for aggression rather than conflicts among innocents, so extending it requires care. B declares Aquinas's framework "breaks it cleanly," then in its conclusion extends the analysis to claim Aquinas would reject the Bystander case too—a bold, minority reading that sits awkwardly with B's own earlier concession that the Bystander death is plausibly *praeter intentionem* and with a.7's principle that moral species follow intention. It's a provocative seminar point, but presented with more confidence than the text supports.

  *B's genuine merits.* B gives proportionality its own section and makes a good point that Aquinas's *proportionatus fini* is not numerical aggregation. Its *a fortiori* argument (unlawful to intend killing even an aggressor → a fortiori an innocent) is elegant, and its contrast between a psychological and a plan-based test of intention is crisply put.

  On balance, the core reasoning is largely shared, so the margin is modest; but A better serves a student who needs to get Aquinas right, while B's a.6 error and overreach on Bystander are the kind of things that would be exposed in seminar.

  Verdict: weakly A
