  I'm also noticing a weak spot in A's argument: it labels the postmortem "scapegoating," but scapegoating usually means blaming a person, whereas citing "no alert configured" is really pointing at a system condition, not an individual — so that framing feels somewhat forced, especially when A tries to connect it to the 15-person access list as evidence of ignored systemic structure.

