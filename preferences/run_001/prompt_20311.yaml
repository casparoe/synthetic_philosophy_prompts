  He goes on to argue that Black America carries the duty to create, preserve, and realize Beauty, framing this as central to the larger question of what Black people are striving for—not merely full American belonging, but bringing new stirrings of joy, creation, and will into being. He then illustrates the double standard facing Black artists through examples like sculptor Meta Warrick Fuller and a young man barred from a Broadway show, showing how white artists can depict anything freely while Black artists are always read as representing the whole race.

  Turning to Eugene O'Neill's plays "All God's Chillun Got Wings" and "Emperor Jones," I recall Du Bois discussing the backlash when Black audiences protested Charles Gilpin's portrayal of an unrespectable character. His central argument crystallizes here: white audiences demand racial pre-judgment that distorts truth, paying only for art that confirms their biases, while the emerging Black audience similarly wants its artists constrained, just in the opposite direction—leading Du Bois to insist that he objects not to positive propaganda but to the double standard denying Black artists an equal right to their own.

