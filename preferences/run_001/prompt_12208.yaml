  - Q1, the most emphasized required question, contains a substantive error: "If we remove the predictor, the updateless agent still refuses to update... effectively paying costs." UDT does not pay without a predictor — B's own "likely answer" essentially concedes this — and the follow-up pursues the false premise. The speaker can simply correct the moderator.
  - Q7 (interaction with CDT agents) asserts UDT "still cooperates" against a known CDT defector, which is false, and again B's own likely answer refutes it. The follow-up ("assume correlation to be safe") is confused. This question would make the chair look uninformed.
  - Q4's anticipated answer ("halfer betting odds emerge naturally") misdescribes the standard analysis, in which per-awakening payoffs yield thirder-like betting; the framing is less precise than A's.
  - Q8 rests on the common misreading that updateless agents can't act on new information (the policy conditions on observations; only the prior is unconditioned).
  - Q9 (empirical distinctions) is weak and easily answered.
  - Strengths: Q2's dilemma follow-up (update during computation → updated; don't → optimizing against a known false prior) is very sharp; Q10 on the metaphysics of "policy"/logical causation is an excellent question; Q8's dilemma follow-up is well constructed.

  **Comparison:** Both hit all four required topics with keyed follow-ups. B has a couple of genuinely sharper follow-ups and one excellent extra question, but it also carries false premises on the first required question and on Q7, plus a less accurate treatment of the anthropics question. A's problems are more about sharpness (a stock dominance objection, a shaky evolutionary premise) than about misstating the view. For a knowledgeable user who needs to sound credible from the chair, A's accuracy on the required items — especially Q1 and Q4 — outweighs B's scattered highlights, though the margin isn't enormous.

