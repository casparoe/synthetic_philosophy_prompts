  The line about Newton demanding "an external force to explain motion (inertia)" is also confused, since inertia means motion persists without external force — it's changes in motion that require one. A better framing would emphasize that Newton saw matter as passive and needing an active principle like God or gravity to explain change, which is defensible even if the phrasing here is off. The claim that removing the theology "breaks the physics" is overstated for the mathematical core of the Principia, though it fits how the General Scholium frames things as a culmination — acceptable as interpretive flourish for a newsletter.

