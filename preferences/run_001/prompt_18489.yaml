  - Small internal tension: says arguing at length "establish[es] common knowledge," then later says people rarely internalize each other's information.

  Both answer the two questions correctly and helpfully. A is a bit more faithful to the theorem's actual conditions and more careful with attributions; B has a couple of slightly stronger illustrations and one good practical addition. The margin is small, but on the precision the user explicitly asked for, A edges ahead.

