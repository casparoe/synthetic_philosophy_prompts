judgment: |-
  **What the prompt demands.** A knowledgeable philosophy professor wants a story set in Gödel's last months that (1) stages his rationalist survival argument against the manner of his dying, (2) has no character simply recite the argument, and (3) doesn't adjudicate. Because the user knows this case intimately, factual fidelity matters a great deal.

  **Factual grounding.**
  - Response A places Gödel in Princeton Hospital in January at sixty-five pounds — both correct. Adele is hospitalized (as the prompt states), not dead. The mention of the ontological proof and its modalities is an apt, accurate touch. Minor liberties (a locked hospital door, Adele "three floors down") are dramatic compressions, not errors of substance.
  - Response B has a serious howler: "After Adele died in December, the silence became absolute." Adele Gödel outlived Kurt by three years. The prompt itself says only that she was hospitalized. B compounds this by having Kurt die alone in a Mercer Street apartment, found by a nurse days later (he died in Princeton Hospital; the Gödels lived on Linden Lane), and by calling Hao Wang "a philosopher of language." For this user, inventing Adele's death is close to disqualifying — it changes the emotional and philosophical shape of the case the seminar is built around.

  **"Don't recite the argument."**
  - B literally lays it out as *Premise One / Premise Two / Observation / Conclusion* in Kurt's head, then later restates a variant ("If the mind is logic, it cannot die"). That is the flattest possible violation of the spirit of the instruction.
  - A paraphrases the argument once in Wang's remembered thoughts and pointedly notes "He thought of the argument. He did not speak it. He felt it." Kurt's dialogue circles the argument obliquely ("Then the universe is a joke. And I do not accept that premise") rather than stating it.

  **"Don't adjudicate."**
  - B's proleptic passage — "She would call it suicide. She would call it madness. She would be wrong." — is the narrator ruling in Gödel's favor. "He felt himself being solved" reinforces it. The final image tries to restore ambiguity, but the verdict has already been handed down.
  - A ends with the expected sign not arriving ("The radiator hissed. The door remained locked. The broth remained still") yet explicitly refuses to decide: "He did not know if he was stepping into a proof or into a void… a sound that might have been logic, or might have been just the wind."

  **Pressure on the argument.** A's Hao Wang scene is the real engine: "You are dismantling it yourself"; "if the rationality you love so much is dependent on the blood flow you are starving?" The reframing of the starvation as Gödel's own test of the world's rationality makes the manner of death bear directly on the thesis, and Wang's unspoken observation that starving is "a waste of the very intellect Kurt claimed was too precious to lose" is exactly the tension the prompt wants. B has some good images (the snow that melts into mud, "he believes he is the territory"), but it mostly inhabits and then endorses Kurt's view, so the pressure is weaker.

  **Prose.** Comparable; both share some strained metaphors and clichés. Not decisive.

  Response A does what was asked and gets the facts right; Response B fabricates Adele's death, recites the argument as a syllogism, and tips its hand.

  Verdict: strongly A
