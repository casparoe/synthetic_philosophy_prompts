judgment: |-
  **Establishing the ground truth.** The pivotal text neither response names is *II Sent.* d. 44, q. 2, a. 2, ad 5, where Aquinas, glossing Cicero on Caesar's assassins, says that when someone seizes rule by violence and there is no recourse to a superior, "he who kills the tyrant to liberate the fatherland is praised and receives a reward." That passage strongly supports Elena's core claim (Aquinas does license killing a usurper, conditionally), undercuts Marcus's move‑4 "merely resist in the moment" line, but also vindicates Marcus's institutional emphasis via the "no recourse to a superior" condition. *De Regno* I.6 is accurately described by Marcus, and it even preserves the two‑track structure itself (Ehud killed Eglon as an *enemy*, not a *ruler*). *ST* II‑II q. 42 a. 2 ad 3 says disturbing a tyranny is not sedition *unless* it causes greater harm than the tyranny. Both responses miss the ad 5 passage and the Ehud point, so both are equally deficient on the decisive evidence.

  **Response A.** Move‑1 justification is accurate. Move 2 gets a full 2 even though A itself, in move 3, concedes Marcus "conflat[ed] the two distinct categories" — an internal tension. The dock on move 3 rests on a dubious claim that killing a usurper "is not strictly tyrannicide (the killing of a magistrate)"; the tradition's own category *tyrannus ex defectu tituli* treats the usurper as a species of tyrant, and Aquinas himself calls him *tyrannum* whose killing is praised. Move 4 at 2 is generous but defensible. The "overlooked" section is the strongest part: the *ST* q. 42 point is stated *with* its crucial "greater harm" qualifier (which is exactly what supports Marcus's prudential caution within a text that supports Elena's non‑sedition claim), and the developmental point (early *Sentences* vs. later *De Regno*/*Summa*) is a genuinely useful outside observation that reframes the whole dispute. The deposition/execution point is partly already present in Marcus's argument. Minor issues: loose Skinner attribution, "utilitarian" is anachronistic.

  **Response B.** Scoring is more internally consistent (flags Marcus's conflation in move 2, credits Elena's two‑track reading in move 3), and on those two middle moves I think B's scores are closer to right. But B docks move 1 on the basis that Aquinas "carefully avoids explicitly endorsing execution" — a factually false statement given ad 5, and it sits at the very center of the dispute; B then repeats this in its third "overlooked" point ("a term Aquinas generally avoids using prescriptively"). B's *ST* q. 42 summary drops the "greater harm" qualifier, which is the part that matters here. Justifications are thinner ("This is the strongest theoretical move"). B's genuine plus is the Papacy point: in Aquinas's century the pope did claim and exercise deposing power (Innocent IV vs. Frederick II), which directly bears on Marcus's "institutional void" — though B doesn't draw the connection to move 4, which it still scores 2.

  **Weighing.** B's overall balance of verdicts is arguably closer to the scholarly picture, and its Papacy observation is the single most incisive supplementary point in either response. A, however, contains more that is correct and usable for the teacher (the qualified q. 42 reading, the developmental framing), gives fuller justifications, and its one bad dock is a contestable definitional stance rather than a false claim about the text. B's key misstatement about Aquinas avoiding endorsement of killing would actively mislead the group on the question they're trying to settle. It's a genuine trade‑off, but I give A the small edge.

  Verdict: weakly A
