  **What the user needed:** a committee-ready memo that (1) recommends a classification, (2) proposes whether/how to rewrite the "contributing cause" language, (3) genuinely steelmans the rejected side, and (4) engages honestly with whether Pearl-style causal machinery actually resolves the case or just relabels it. The user is on the data/quality side, so metric integrity is their home turf.

