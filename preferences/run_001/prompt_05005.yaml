  - *Q2 (self-undermining):* Response B answers more sharply — 1879 Frege's names aren't bare labels but carry distinct "ways of determining" content, and he later judged this insufficient; the Alpha/Beta/Gamma observatories illustration is clean. Response A's dedicated section is muddled (the "Rock1" point is true on both views; conflating "Venus is Venus" with a=b), though its later section 4 recovers the right idea.

