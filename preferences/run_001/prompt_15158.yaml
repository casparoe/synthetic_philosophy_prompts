judgment: |-
  **What the user needs:** a toast that (1) confronts the demandingness tension head-on rather than dodging it, (2) leans on real Railton/Scheffler rather than a cheap joke or a false dodge, (3) works for both philosophy PhDs and aunts/uncles, (4) is warm *and* funny, ~4 minutes, with a genuine laugh.

  Both responses are structurally almost identical: intro → dual-audience joke → name the $30k/malaria-nets tension → Railton → Scheffler → "infrastructure not diversion" → parallel close to each audience → toast. Both hit the brief. The differences are at the margins.

  **Response A**
  - Railton substance is quite faithful: "deep, non-instrumental commitments," "choosing you, not because it maximizes global utility in this specific instance, but because you are my person" is essentially the Juan/Linda point rendered warmly. The "brittle/burn out" gloss is a bit EA-forum-ish but not wrong.
  - Scheffler content is correct (permission to give extra weight to one's own projects and people), though A tacks on an instrumental rationale that isn't Scheffler's.
  - Warmer: the coffee order/anxieties detail, the "patient, kind, and yes, partial" riff on 1 Corinthians (which the aunts and uncles will recognize from every wedding they've attended), "safe harbor."
  - Jokes are inclusive: "cost-benefit analysis on the open bar," "deeply in love / rationally justified," "regression analysis on a date night" all land for both halves.
  - Gender-neutral placeholders.
  - Flaws: the closing line "even if your ethics don't be" is broken English right at the emotional climax (the intended thought — love that feels unconditional even though the ethics aren't — is actually the best one-sentence rendering of sophisticated consequentialism in either toast, but it needs fixing). "Thirty years ago" is loose (1984). "Scheffler called *this*" blurs the two philosophers together.

  **Response B**
  - Uses "alienated," the correct Railton term, and echoes the user's own phrase "demandingness objection in miniature."
  - More jokes and denser: "expected value of career pivots," "robots don't make good partners," the closing couplet "thank you for being Priya's prerogative / his sophisticated strategy," "to the optimal outcome." The callback couplet is the best piece of toast craft in either response.
  - "Base camp" metaphor is effective and accessible.
  - Flaws: "To be an effective altruist, you actually need to be a bad altruist sometimes. You need to love someone irrationally" — this mischaracterizes Railton, whose whole point is that such love is *not* irrational or a lapse but what the best consequentialism endorses. Given the user's explicit worry about lines that make the view sound silly or undercut it, this is the one line a sharp philosopher in the room would clock. "The best moral philosophy has already answered" overclaims. Assumes the partner is male ("his," "bride and groom") when the user didn't specify. Slightly more clinical in the personal section ("I've seen them prevent burnout"). Several jokes are inside-baseball for the family half.

  **Weighing:** A is more philosophically faithful on the substance and warmer for the family half; its main defect is a grammatical slip that's a two-second fix. B is funnier and more polished with a cleverer close, but its one substantive philosophical misstep ("love irrationally") cuts against the user's most emphasized constraint, and it makes an unwarranted gender assumption. Since correctness and fidelity to the brief matter more than polish, A edges ahead — but the trade-off between A's warmth/accuracy and B's humor/craft is genuinely close.

  Verdict: weakly A
