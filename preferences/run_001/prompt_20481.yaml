judgment: |-
  Both responses build essentially the same case — a military target in the basement/foundation of an inhabited building, whose destruction necessarily collapses the structure on the residents — and both run the same argument: DDE clears it because the deaths are causally idle side effects, while Anscombe convicts because the planner knows with certainty that "collapsing the inhabited building" is a true description of what he's doing.

  The shared core problem is that this misrepresents Anscombe. She explicitly *defends* the intended/foreseen distinction ("War and Murder" calls it "absolutely essential"), convicts Truman specifically because the killing was the *means* chosen, and in "Modern Moral Philosophy" attacks by name the Sidgwickian thesis that one intends all foreseen consequences of voluntary action. In a case where the deaths genuinely do no causal work toward the military end, her actual machinery would classify them as foreseen-but-not-intended. The user's phrase "whatever's actually doing the causal work" points toward a case where a narrow redescription hides that the killing *is* the means (e.g., a "factory" whose military value is its workforce); neither response builds that case. Both instead stipulate that the deaths are causally idle and then invent a knowledge-equals-intention Anscombe to get the conviction. A sophisticated grader will spot this in both.

  Given equal failure at the core, the differences are peripheral:

  Response A: cleaner causal stipulation on the DDE side; directly cites "Mr Truman's Degree." But its Anscombe section has multiple additional blunders: a fabricated "Stopping Test" attributed to *Intention* that, as A itself admits, yields "No" (i.e., not intended) before hand-waving past it; the flat claim "voluntary action + knowledge = intention, regardless of the means/end structure" presented as the mark of the "deep" student; the claim that she "rejects the means vs. side effect causal map" (her central tool against Truman); a "Crucial Nuance" wrongly suggesting intentional killing of the innocent might clear a "higher justificatory bar" for her; a 50 families/50 residents slip; and a Truman analogy ("crushing these people to get the radio") that A's own setup makes disanalogous. The grading key also assumes students will write on this case.

  Response B: contains the false "Anscombe famously dismantles the DDE distinction... when the consequence is certain," and its "Causal Work" section muddles its own physics (the blast, not the collapse, destroys the basement). But it at least engages the user's specific "causal work" phrasing head-on, cites "War and Murder" (the right essay), keeps the verdict cleanly as "murder" as the user asked, avoids fabricated named tests, and closes with a genuinely usable seminar framing ("why you bomb" vs. "what you are doing").

  Neither serves the user well on the central philosophical point, but A stacks more misattributions and self-undermining moves onto the shared error, while B's peripheral material is somewhat more responsive and more salvageable.

  Verdict: weakly B
