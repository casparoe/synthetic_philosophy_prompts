  - "True *for us*... not true *for the universe*" is precisely the relativist gloss Putnam spent decades repudiating.
  - The revised paragraph says "It isn't fideism... it's just that the 'reason' doing the critiquing is internal to the tradition" — which is Nielsen's definition of fideism. The sentence denies the charge and then restates it.
  - "Truth-apt implies a correspondence theory" is simply false; the user's terminology was correct, and swapping "truth" for "objective validity" retreats from Putnam's actual position.

  If the user adopted B's paragraph, a philosophically literate editor would find a new hole rather than a filled one.

  **The timeline question.**
  Neither response supplies the key facts (practice began ~1975 after his son's bar mitzvah, when Putnam was about 49; his own bar mitzvah at 68; the Rosenzweig/Buber/Levinas/Wittgenstein book is 2008, age 82). A correctly says practice started earlier and cites Ruth Anna's influence, but its rewrite ("culminating in his sixties with *Renewing Philosophy*") leaves the 2008 book implicitly mislocated. B's "late middle age" and "deepen, not convert" phrasing is closer to the truth, but B misstates that Putnam's father was a secular Jew (his mother was Jewish; his father was not). Roughly a wash.

