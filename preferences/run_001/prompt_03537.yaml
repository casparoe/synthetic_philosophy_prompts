  Neither response notices any of this. Both adopt the UDT verdict wholesale, give Julian 2/2, give Mara's strongest move (3) a -1, and uncritically endorse Julian's flawed "you're updating on something dependent on your disposition" claim. Both have muddled sentences in their Move 3 justifications (A: "fails in Newcomb's Problem" is off-target since Mara said "every *other* domain"; B: "leading to dynamically inconsistent but ex-ante superior plans" is garbled).

