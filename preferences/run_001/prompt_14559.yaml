  The user's real question — doesn't the internal logic itself recommend racing? — deserves a direct yes: the incentive to race is real, which is precisely why it's dangerous, since following it leads to a bad equilibrium. Both A and B land on this, and I'm noting their respective closing framings, plus the point that racing to commit isn't a dominant strategy in the strict sense but more like a Chicken-style equilibrium where commitment only pays off contingent on the other side's move.

