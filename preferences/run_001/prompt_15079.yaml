  This is a detailed question about MARL testbeds involving Prisoner's Dilemma agents, folk theorem equilibrium selection, provability-logic cooperation mechanisms like FairBot, and imperfect disclosure scenarios. Both responses converge on the same core insight: the mismatch between symbolic program-equilibrium logic and gradient-based sub-symbolic agents is the deeper issue underlying all three specific questions asked.

