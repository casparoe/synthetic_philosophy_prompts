judgment: |-
  **What the student got right and wrong.** The EPR reconstruction (Part 1) is correct. The scope claim (Part 3) and the upshot (Part 4) are wrong in the standard way: determinism is *derived* from locality via the EPR step, not assumed independently, and the CHSH inequality is in any case derivable from factorizability alone (Bell 1971, Clauser–Horne 1974), so stochastic local theories are ruled out too. The student's conclusion that locality survives while determinism falls contradicts their own EPR step (locality → determinism), and gets the Einstein upshot backwards—Bell closes off precisely the local-completion horn Einstein wanted. Part 2 is factually fine on the bound and experiments, but the student never actually reconstructs the derivation of the inequality (just "Bell showed…"), despite the question asking for exactly that, and slides between the four-correlation CHSH bound and "the 1964 proof."

  **Response A.** Scores 5/4/1/1 = 11, F. The Part 2 deduction is well-targeted and defensible (no reconstruction of the inequality; conflation of Bell 1964 with CHSH). Part 3's justification is correct but thin—it doesn't make the key point that determinism is derived rather than assumed, which is the very thing the exam asks about. Part 4 says Bell "requires abandoning locality (or realism)"—in a seminar built on Maudlin, that parenthetical is a contestable "local realism" framing the instructor may push back on. It does at least reference Einstein's priorities. The F for 55% is conventional.

  **Response B.** Scores 5/5/1/1 = 12, C-. Part 2 at full marks is hard to defend: the justification never engages the "derivation" half of the sub-component, and the student supplied no derivation. The C- for 60% is also off any standard scale. But the justifications for the two big deductions are noticeably sharper: Part 3 states both that CHSH needs only factorizability and that determinism is a consequence of locality in the EPR step, not an independent assumption—directly answering the exam's "what work is determinism doing" prompt. Part 4 identifies the internal contradiction with the student's own reconstruction, which is the single most persuasive point to make at a grading meeting, and avoids the "or realism" hedge. It does omit explicit mention of Einstein.

  **Weighing.** The TA's main exposure is defending the 8 points deducted in Parts 3–4; B's justifications there are more precise, more complete, and free of contestable claims, whereas A's include a wobble. A is better on the Part 2 deduction and the letter-grade mapping, both of which are real but smaller issues and easier for the TA to correct. This is a trade-off, but B better serves the core need.

  Verdict: weakly B
