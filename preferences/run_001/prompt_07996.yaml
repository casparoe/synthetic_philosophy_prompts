judgment: |-
  **What the prompt demands**: hard-SF register, the ensemble/time divergence load-bearing in plot rather than stated as a moral, a non-gambling context where the structure is "less obvious," *no character explaining Kelly/ergodicity out loud*, and 800–1200 words.

  **Shared failure**: Both responses violate the most emphasized constraint. Response A's Elara says "The geometric mean is what we eat. The arithmetic mean is what we dream" and "The ensemble average says you should be a god. The time average says you are about to be dust," and the narrator explicitly labels the two curves as "the ensemble average" and "the time average." Response B's Elara says "You're confusing the ensemble with the trajectory" and "Positive expected value implies growth across parallel universes. We live in only one," and the narrator spells out the EV arithmetic. Both also end on stated morals. A is somewhat more jargon-saturated (geometric/arithmetic mean, path dependence, compounding rate, "three standard deviations"), so it violates a bit harder, but neither passes this test.

  **Context / "less obvious"**: A is essentially a casino with a star attached — "wager eighty percent," "bet size," "principal," "leverage," "borrow against the future harvest." The structure is entirely undisguised. B's device is more inventive: a civilization that measures itself by *Aggregate Mass Yield* (a literal finite-ensemble sum) while *Lineage Continuity* collapses, with mass concentrating in a shrinking handful of lucky lineages before the last ones die. That's a genuinely sharper dramatization of "the ensemble average is carried by vanishingly few trajectories," even if it hand-waves why the fleet can't pool resources.

  **Mathematical consistency**: B's stated odds (50% for 3×, 50% for zero) are consistent with its dynamics — positive arithmetic mean, median ruin, mass concentrating. A has Kael claim simulations show "wealth generation in ninety percent of the branches" with 80% bets at 60% win probability, which is false under its own premise (the median branch is ruined; that's the whole point), and Elara doesn't dispute it. A sophisticated reader of Peters/Garrabrant will notice. A also has a minor inconsistency about whether Elara's reserve was "untouched" or "compounded at a safe fraction."

  **A's strengths**: It maps the "fraction wagered" language most literally, and it dramatizes both sides — the over-bettor is ruined while the small safe fraction survives — giving the reader a felt contrast. "Digging out of a hole where the shovel had shrunk" is a good felt image of path dependence.

  **Prose/register and length**: B's opening ("did not show stars. It showed curves"), the lagging-indicator beat, the cascade of *Signal Lost*, and "It had just ceased to belong to anyone" are closer to Egan's register. A has more melodrama ("walked the decks like a king," "voice of a man who had never watched a bank account hit zero") and a couple of typos. B is within length; A runs slightly over.

  Both are flawed in the same central way, but B is more inventive about the context, more internally consistent mathematically, and slightly better in register, while A's advantages (literal fraction, two-strategy contrast) are real but smaller.

  Verdict: weakly B
