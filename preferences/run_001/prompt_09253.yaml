judgment: |-
  **What the user needs:** a ~3‑minute, warm toast that (1) correctly uses Toby Ord's moral trade as the lens, (2) preserves the subtle "each comes out ahead by their *own* lights, not a shared standard — not compromise" distinction so the cohort nods, (3) is legible to family, (4) never reads as cold/transactional, and (5) gets the actual facts of the setup right.

  **Response A**
  - Gets the premise right: it's *the speaker's* seminar that covered moral trade. The "full disclosure, I just learned this" framing is honest and a bit endearing, though the "Actually, full disclosure…" pivot right after "But then I started watching them together" is clunky.
  - Concept fidelity is good: "help each other achieve their own version of 'good'… It's not saying 'we're both kinda right'… I respect your conscience enough to help you live by it anyway" cleanly separates it from compromise, and the closing "come out ahead by your own lights, together" is the exact Ord phrasing, softened by "together."
  - The anti‑cold passage is the strongest in either draft: "listening deeply enough to understand what weighs on the other person's soul, and loving them enough to carry some of that weight, even if you don't agree it needs carrying." That is precisely the moral‑trade dynamic rendered warmly.
  - Flaw: "He doesn't do it because he thinks she's right. He does it because *she* is right, to him" is muddled and would cause a hiccup when spoken; the next sentence rescues the meaning, but the user would want to smooth it.
  - Sticks to the given facts; no embellishments.

  **Response B**
  - Smoother prose, cleaner two‑audience structure, placeholders throughout, nice lines ("disagree without dividing," "different maps… same horizon").
  - Significant factual error: it attributes the seminar to the sister ("she taught me… during a seminar she was taking on moral uncertainty. She told me about a concept called 'moral trade'"). The prompt clearly says it was the *user's* seminar. This is the framing device of the whole toast, and it would have the speaker say something untrue about the bride in front of her colleagues. It also discards the genuine hook (younger sibling learns a concept, sees the sister's marriage through it).
  - Conceptual softening the cohort would notice: "because they value their partnership more than they value being 'right'" and "walking toward the same horizon" drift toward the shared‑values/compromise reading the user explicitly said moral trade is *not*.
  - Adds "without being asked," a detail not in the prompt.
  - Closing "May your trades always be fair" is the most transactional‑sounding line in either draft, right at the moment the user said the toast must not sound transactional. "Love, operationalized" is a fun wink but slightly clinical.

  **Weighing:** B is more polished and its "her conviction matters to him" line is clearer than A's muddled equivalent. But B misreads a core fact of the setup, subtly softens the very distinction the user cared about, and brushes the no‑transactional constraint at the close. A gets the facts and the concept right and delivers the warmest, most on‑point passage, at the cost of a couple of stylistic clunks. Since correctness and doing what was asked outweigh polish, A serves this user better, though B's craft advantages make it a real trade‑off.

  Verdict: weakly A
