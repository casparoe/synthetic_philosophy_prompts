  Good's theorem shows that a single Bayesian agent facing costless evidence never does worse by observing it before acting, but this relies on the environment and payoffs being fixed regardless of whether information is acquired. The Hirshleifer effect, by contrast, concerns risk-averse agents in an exchange economy where information can destroy the very insurance opportunities that made everyone better off — so the two results may hinge on different assumptions about whether information acquisition changes the surrounding market.

  There's a distinction between private value (positive, per Good) and social value (potentially negative), and between ex-ante and interim welfare. Good's theorem concerns value to an individual decider, while Hirshleifer's unraveling is a collective, market-level phenomenon — the option to submit information may be individually rational even as its availability changes what non-submission signals to others. So the pricing head's invocation of Good's theorem may be misapplied: the real question isn't whether the insurer benefits from free evidence, but whether letting information enter contracting destroys pooling equilibria.

  On regulation, laws like GINA and various national moratoria (UK, Canada's GNDA) restrict genetic test use in insurance specifically because of this unraveling risk, and there's a related concept — "insurance against classification risk" — capturing why people might rationally prefer not to know. An applicant can choose not to submit a test result, but that very choice becomes an informative signal in disclosure games (Grossman, Milgrom), so while the option value of testing is privately positive for the applicant, its existence can still drive adverse selection in the pool.

  I don't think there's a real contradiction between Good's theorem and Hirshleifer's result — they're answering different questions. Good's theorem is about whether it's rational for an individual to acquire free information within a fixed decision problem, while Hirshleifer asks whether information availability is socially valuable when it changes what contracts can be written; the friction is that Good's theorem assumes the available actions don't depend on the information, whereas in insurance the whole contract menu shifts based on what each party knows the other knows — which connects to why someone behind a veil of ignorance about their own type might prefer that no one learn it at all.

  Even for a single individual, the option to test and selectively disclose is weakly positive since they can withhold bad results — but once testing becomes common knowledge, non-disclosure itself becomes a signal, insurers price it accordingly, and unraveling sets in, meaning the "free" test carries a hidden cost that breaks Good's fixed-environment assumption. Now I want to turn to actually evaluating the two responses.

