judgment: |-
  **Shared ground.** These two essays are strikingly similar: same opening sentences, same three-text structure, same core thesis (no general private right; the usurper/legitimate-ruler distinction reconciles the texts; remedy against a lawful ruler turned tyrant belongs to public authority). Both accept the prompt's dating of *De Regno* as latest without comment, and both make the same misattribution — placing the Ehud/Eglon example in the *Sentences* commentary, when Aquinas actually discusses it in *De Regno* I.6 (where he says Ehud killed a *hostis*, not a ruler — a passage that would have strengthened both essays' reconciliation thesis). So the comparison turns on smaller differences.

  **Where A is stronger.**
  - A's rendering of the *Sentences* passage ("he who delivers his country by killing a tyrant is to be praised and rewarded") tracks the Latin (*laudatur, et praemium accipit*) closely. B presents as a direct quotation "it is not only permissible to kill him... but it is meritorious and just," which is not in the text; B also "quotes" *De Regno* as saying "often wicked men are killed by this presumption, not tyrants, but good kings," which is a garbled and near-nonsensical paraphrase of the actual argument (that it is chiefly the wicked who undertake such killings, and they would kill good kings as readily). In an essay whose brief is textual grounding, fabricated quotations are a real defect.
  - A's verdict is cleaner and more fully answers "to whom, against which kind of tyrant": private lethal action only against a *tyrannus absque titulo*, only when no superior exists, with the killer acting as the community's agent of defense; never against a *tyrannus in exercitio*. B's verdict on the usurper is hedged ("may occur... but De Regno discourages even this"), and its supporting claim that *De Regno* channels action against a *usurper* through "public authority" is not really in that text, which addresses the abusive lawful king and treats the Ehud case as killing an enemy.

  **Where B is stronger.**
  - B's handling of ST II-II q. 42 a. 2 is more accurate and complete: it includes the crucial proviso (resistance is not sedition unless the disturbance causes greater harm than the tyranny) and the point that the tyrant is the true seditious party. A omits the proviso — an important link to *De Regno*'s prudential concerns — and slightly mischaracterizes Aquinas as saying the tyrannical regime is "not a true government" rather than "not just."
  - B's "bond of fidelity" and just-war analogies add some interpretive texture.

  **Weighing.** Both do what was asked and land on a committed verdict. A has fewer outright inaccuracies (no invented quotes) and a sharper, better-grounded final answer; B is better on one text but introduces false quotations and an unsupported textual claim about *De Regno* and usurpers. Since correctness on the texts is the core of this assignment, A edges ahead, but the margin is small given the shared error and B's superior Summa treatment.

  Verdict: weakly A
