  It also warns against the industry's pull toward branding and commodifying vulnerability, tying that back to the novel's moral exhaustion, and lands on holding craft lightly while holding community heavily so the theater becomes a kind of public square. I'm checking whether this fully answers the self-loss worry or mainly resolves the segregation problem between stage and audience.

