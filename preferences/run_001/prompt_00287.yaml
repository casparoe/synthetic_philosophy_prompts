  I'm recalling that surrogate goals trace back to Tobias Baumann's 2018 work at the Center on Long-Term Risk, later formalized by Oesterheld and Conitzer as "safe Pareto improvements."

  The core mechanism: an agent adopts a surrogate goal that threateners will target instead of the real one, and commits to responding to surrogate threats exactly as it would have to real ones—so the threatener's payoff stays unchanged while the agent avoids sacrificing what actually matters.

  This becomes valuable specifically when threats get carried out despite refusal policies—due to miscommunication, irrationality, or commitment races—since surrogate goals absorb that damage rather than the real goal, making them complementary to (not a substitute for) threat resistance.

  treating threats against the original as it would have—making the threatener indifferent in expectation, hence the term SPI. There are known failure modes worth flagging: the threatener needs to actually observe or know about the surrogate commitment, the surrogate goal must be equally threatenable, there's risk of the surrogate "bleeding" into real values, coordination/bargaining problems over choosing surrogate goals, and issues with threateners who commit before the surrogate goal is even chosen.

  The literature's response to the worry that a threatener might infer the real goal from the fact that a surrogate was adopted is that as long as the agent's policy keeps threats against the real goal no more effective than threats against the surrogate, there's no incentive to target the real one—equal compliance suffices, not greater compliance.

