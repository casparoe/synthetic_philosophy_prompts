judgment: |-
  **What the user asked for:** (1) the precise Doris/Harman difference, (2) whether there's a non-fiat comeback for virtue ethics, (3) a verdict on whether fixed-virtue leads are naive. Skip Milgram/SPE.

  **On the Doris/Harman split**, both responses give essentially the same correct picture: Harman is eliminativist about character traits (trait attribution = fundamental attribution error; nothing there), Doris is a revisionist who denies *global* traits but accepts narrow *local* traits ("honesty-in-the-classroom"). A's "Harman attacks the ontology, Doris the structure" is crisp and accurate. B's "engine doesn't exist / runs only on specific fuel" is equivalent. But B overstates Harman as "leaves in the wind, no internal rudder" — Harman allows for differences in goals, beliefs, skills, just not moral character traits. A's rendering ("no such thing as courage, only acts we label courageous") is closer to Harman's actual view.

  **On comebacks**, both offer three and both lean on McAdams's narrative identity (a personality-psych idea rather than a virtue-ethics defense proper, but relevant to a novelist). A adds the rarity/ideal defense (correctly tied to Christian Miller; Snow is a loose fit) and an interactionist "virtue as reason-sensitivity" point that tracks the Snow/Russell/Kamtekar line without naming them. B adds Annas's virtue-as-skill model (a genuinely strong, correctly attributed comeback) and a "selection defense." The selection defense is B's biggest error: it claims situationism "ignores how people select situations," when situation selection is Doris's own headline prescription. A psych postdoc would pounce on that. B also invokes the Stanford Prison Experiment as evidence the user asked to skip, without noting its methodological problems.

  **On the verdict/craft advice**, they are nearly identical (both suggest physical-courage-but-emotional-cowardice localization, showing the cost, virtue as commitment rather than reflex). B's "let the virtue crack, focus on recovery" is a nice extra beat; A's "leads as statistical outliers" directly answers whether the premise is defensible. A's "act virtuously despite thinking" line is muddled phrasing, and B's "if they keep getting fired they're stupid" is glib.

  Both are competent and very close in coverage; neither mentions Sreenivasan, Kamtekar, or Alfano. A is somewhat more accurate on the actual positions and makes fewer claims the housemate could correct; B has slightly richer craft advice and one well-chosen citation but two mischaracterizations of the situationist side.

  Verdict: weakly A
