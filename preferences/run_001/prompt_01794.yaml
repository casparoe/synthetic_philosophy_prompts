judgment: |-
  Both responses reach the same correct conclusion — the Argus passage is a statement of aesthetic mate choice that sits in the Darwin→Fisher lineage, not a proto-handicap argument — and both organize the answer the same way (taste vs. honesty, Fisher connection, Zahavi's break, historiographical placement). The differences are at the margins, so accuracy and usefulness of the extra material decide it.

  **Response A**
  - Strong framings: "taste vs. truth," "purpose (teleology) vs. reliability (economics)," and the correct observation that Darwin's argument defends the reality of female psychology rather than the reliability of male signaling.
  - Offers a ready-made paragraph for the feature, which a writer may value, though "re-couple the ornament with survival utility" is awkward given that the handicap is a survival *cost*.
  - Weaknesses: the "stability" point ("why don't males cheat? If a plume is just a plume, what stops a low-quality male from growing one?") is conceptually muddled — under pure Fisherian runaway there is no signal content to cheat on; the cheating problem belongs to indicator models. The claim that the aesthetic model was "the orthodoxy... that dominated from 1871 to 1975" and that the handicap principle "displaced" it is historically wrong: female choice was marginalized for most of that century, Zahavi's 1975 paper was widely rejected until Grafen (1990), and Fisherian models were formally revived by Lande/Kirkpatrick in 1981–82. For an intellectual-history feature, this is a meaningful mischaracterization stated forcefully.

  **Response B**
  - Adds a genuinely useful nuance: Darwin *does* recognize ornament cost elsewhere (peacock), but treats it as a drag natural selection must be overcome by sexual selection, not as the guarantor of honesty. This strengthens the placement argument and is accurate.
  - "Cost as a puzzle to be explained away vs. cost as the solution" is a crisp, correct contrast.
  - The closing genealogy — Darwin→Fisher→Kirkpatrick vs. Zahavi→Grafen→Johnstone — gives the researcher concrete names to chase and implicitly corrects the "displacement" story by showing both lineages continued.
  - Weaknesses: shares the same error about the aesthetic view being the "dominant view" for a century; "mathematicalized" overstates what Fisher (verbal argument) did; "arbitrary preference" flattens Fisher's two-stage model; "teleological" is slightly misused.

  Neither mentions Wallace's vigor-based alternative, Darwin's own "most vigorous male" passages elsewhere in *Descent*, or Prum's modern revival of exactly this Argus argument — all highly relevant omissions, but shared.

  On balance, B is slightly more accurate (no muddled "cheating" point, implicit acknowledgment that the Fisherian lineage persisted) and provides more useful research scaffolding, while A's chief distinctive asset (the suggested phrasing) is nice but not asked for and mildly awkward. Small margin.

  Verdict: weakly B
