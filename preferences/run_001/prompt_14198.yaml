  I'm framing the deeper defense: monotonicity intuitions compare outcomes across different counterfactual bargaining problems, whereas IIA is really asking what's rational given this one actual feasible set — the two are answering different questions.

  There's also the Rubinstein connection worth raising: Nash's bargaining solution isn't just an axiomatic construct, it's the limiting outcome of an alternating-offers game with impatient players, giving it a non-cooperative foundation that Kalai-Smorodinsky lacks. That grounds Nash in "what actually happens when two people haggle" rather than just a welfare-based fairness intuition.

