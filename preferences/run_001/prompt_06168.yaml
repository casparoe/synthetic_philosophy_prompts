judgment: |-
  Both responses correctly identify the dilemma as a **Ulysses Contract / Psychiatric Advance Directive**, frame the disagreement as precedent autonomy vs. current autonomy, side with the user while acknowledging the mother's position has emotional and ethical legitimacy, and give the same key practical advice: get the treating psychiatrist to make the call rather than deciding as a family. Substantively they're very close.

  **Where they differ:**

  *Answering the "what's this called" question.* A explains the Odysseus story and explicitly maps it onto the situation ("she authorized her 'crew'... to ignore her pleas"). This is not just color—it gives the user a concrete, intuitive analogy to bring to the conversation with his mom. B names it and moves on. Both satisfy the ask; A satisfies it more fully.

  *Legal accuracy.* This is the most meaningful gap. A correctly notes that a PAD "is not always a magic wand" and that "if she doesn't meet [commitment] criteria, the paper usually cannot force admission on its own." That's the accurate state of affairs in most jurisdictions—PADs generally clarify wishes and treatment preferences but don't independently authorize involuntary detention. B says a PAD is "legally binding... not just a 'promise'; it is a medical order that survives the loss of capacity," which overstates its force and could lead the family to expect the paper alone will compel admission. B partially walks this back later ("the paper simply clarifies her wishes"), but the earlier claim is misleading and internally inconsistent.

  *Handling the mother.* A devotes a section to why mom is hesitating, validates that forced hospitalization is genuinely traumatic, then supplies the counterweight (untreated mania is also traumatic) and specific scripts for reframing. B does some of this too ("the sister she is betraying is the one who sat in that office six months ago") but calls mom's view "potentially dangerous," which is harsher and less useful for someone trying to reach agreement with her.

  *Safety.* B appends crisis line numbers. That's a genuine plus in a mania scenario, though the family is already engaged with a psychiatrist and actively pursuing hospitalization, so its marginal value here is modest.

  Both are strong. A edges ahead on the accuracy point that actually matters for next steps and on giving the user better tools for the conversation he's stuck in; B's crisis resources are a smaller offset.

  Verdict: weakly A
