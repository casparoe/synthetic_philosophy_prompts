  Then I'm looking at A's reading recommendation, List & Menzies 2009, and noticing it's mislabeled as "the Program Model paper" — that paper is actually about difference-making and realization-insensitivity, whereas the program model concept traces to Jackson & Pettit, not List & Menzies. A seems to have conflated two distinct theoretical lineages here, which is a factual error worth flagging.

  I'm also questioning whether Jackson & Pettit's program explanation really vindicates the user's intuition the way A implies — it's actually more of a compromise, conceding that the lower-level property is the causally efficacious one while the higher-level property merely "programs for" the effect, so A's framing overstates its support.

