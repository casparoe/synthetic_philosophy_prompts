  **Weighing.** A is cleaner on the mechanics of the violations; B is stronger on the comparative/normative analysis that is the heart of the prompt and more explicit on independence, but has a factual slip in the STP acts. B's error is a recoverable misprint; A's errors are conceptual confusions in answering the main question. This is a genuine trade-off, but I lean toward B for handling the central question with more accuracy and discrimination.

