  I recall Cicero's account in De Fato: Chrysippus distinguishes simple events, where an outcome is fixed regardless of intervening action, from conjoined events, where the outcome depends on some other event occurring alongside it. His paradigm cases are Socrates dying on a set day versus Laius begetting Oedipus, which requires the action of intercourse to obtain - the co-fated model links necessary actions to their fated results.

