thinking: |-
  This is a rich question touching on Kelly betting, ergodicity economics, and Samuelson's critique, so I want to think through what the user—a retired statistical mechanics researcher—is really asking: is "maximize time-average growth" a distinct normative principle from expected utility maximization, or just the same math dressed differently, and does geometric rationality actually dodge Samuelson's objection about illegitimately generalizing Kelly beyond repeated multiplicative gambles. Peters' ergodicity economics argument hinges on wealth dynamics being multiplicative and non-ergodic, with the time-average growth rate being the relevant quantity for a single agent making repeated bets over time rather than an ensemble.

  But critics like Doctor, Wakker, and Wang note that this collapses mathematically into E[log W], which is indistinguishable from standard log-utility EUT, and the "ergodicity transformation" for general dynamics essentially just is a utility function in disguise—so the claim to objectivity is shaky since the choice of dynamics is doing the same work the choice of utility function does elsewhere.

  I'm also recalling Samuelson's classic critique: maximizing expected log growth doesn't maximize expected utility for other risk preferences even as time horizon goes to infinity—the "fallacy of large numbers." Almost-sure long-run dominance of Kelly betting doesn't matter to a CRRA agent with γ≠1, since for CRRA utilities the optimal fraction is myopic and horizon-independent, and expected utility can be dominated by a small-probability tail event that probability-of-winning arguments ignore.

  Peters' reply would be that the agent cares about the time-average growth rate it actually experiences rather than expected utility across an ensemble, but I think the real question is why that limiting growth rate should be the normatively correct target rather than the finite-horizon wealth distribution—treating growth-rate maximization as objective is itself equivalent to assuming log utility, and no real agent has an infinite horizon to make the limit argument bite.

  The ergodicity transformation Peters and Gell-Mann propose—finding u(x) such that u has ergodic increments (log for multiplicative dynamics, identity for additive, etc.)—looks to critics like exactly a utility function under a new name, especially since Peters and Adamou now suggest different people have different "dynamics," which concedes the individual-preference point they set out to avoid. I should also note the historical lineage here: Bernoulli's original log utility, Latané's geometric-mean argument, Breiman's asymptotic optimality proofs, and Samuelson's rebuttal of the "fallacy" of maximizing expected long-run growth.

  I'm also thinking about Scott Garrabrant's "Geometric Rationality" sequence as a possible loose reference point, though neither response engages it directly, which seems fine. Now I want to work through Response A's structure and check its math—specifically the claim that E[ln W_T] decomposes into the sum of expected log-growth terms, converging via the law of large numbers to the same Kelly fraction regardless of framing, which does check out correctly.

  I'm also weighing the strength of Response A's foundational argument: log utility as psychological versus log growth as dynamically derived, and the analogy to entropy/extensive thermodynamic variables. That analogy is a bit loose since extensivity really concerns scaling with system size rather than linear growth over time, but I see it as a defensible rhetorical flourish rather than a substantive error—and I note it does shift the burden of proof in an interesting way between the EUT and Peters framings.

  Now I'm comparing how each response handles Samuelson's critique—Response A uses a risk-neutral horizon example, while Response B sharpens the point using CRRA utility with γ=2, which more directly shows that any non-log utility makes Kelly suboptimal regardless of time horizon. B's framing feels more precise here.

  On whether ergodicity economics "escapes" the critique, I'm weighing both sides: Peters would agree Samuelson correctly attacked expected wealth as the wrong criterion, but Peters reframes the issue as an ergodicity problem rather than a utility problem—though this leaves open what the actual normative goal should be, especially for finite-horizon investors like pension funds with liabilities. The synthesis point that different observables (log wealth vs. wealth itself) lead to Kelly versus arithmetic mean strategies is compelling, though the stat-mech analogy to temperature and spin glasses reads as somewhat uncritically favorable to Peters without engaging economists' pushback.

  The counterargument I should flag is that standard EUT with concave utility already handles non-ergodic wealth dynamics fine, making the "ensemble average" critique something of a strawman since no serious economist actually recommends maximizing raw expected wealth for risk-averse agents. I also want to note the claim about "dynamic inconsistency" seems like a misapplied economics term, since EUT with CRRA utility is actually dynamically consistent—a minor but real slip. What's missing is the deeper rejoinder that choosing which dynamics to apply the ergodicity transformation to is itself doing the work that a utility function normally does, making the isomorphism between the two frameworks tighter than acknowledged.

  Now I'm turning to examine Response B's structure, which moves through mathematical equivalence, normative divergence, Samuelson's critique, and geometric rationality.

  I'm checking B's claims one by one: the math derivation is correct, the Gibbs-vs-Boltzmann analogy for the normative divergence is a bit unconventional but defensible, and B's framing of Samuelson's objection (that Kelly is suboptimal for any non-log utility, not just risk-neutral ones) is actually sharper than A's. B also brings in points A misses—one-shot bets, additive vs. multiplicative dynamics, evolutionary/bet-hedging justifications for geometric growth—while both share small terminological slips and both remain somewhat too accepting of Peters' framing that EUT was "misapplied" rather than already accounting for non-ergodicity through concave utility. Neither response, though, articulates the strongest version of the colleague's argument: that Peters' ergodicity transformation is functionally identical to a utility function, that the "dynamics" are themselves a modeling choice, and that critics like Doctor, Wakker, and Wang have argued EUT never assumed ergodicity in the first place—nor do either cite Breiman's dominance argument for Kelly or Samuelson's actual 1971/1979 papers.

