  Turning to the mathematical treatment, Grafen's result is described as requiring a "single crossing property" for stability — a reasonable gloss on his actual condition about marginal cost-to-benefit ratios decreasing with quality, though technically that term comes from Spence/Mirrlees economics rather than Grafen directly. I'm also checking the claim that Grafen's model doesn't require positive absolute cost for high-quality signalers at equilibrium — this seems inaccurate since in Grafen's actual model, cost is positive for every type above the lowest, so this general stability point (true in other models like Hurd, Lachmann, Számadó) is being misattributed specifically to Grafen.

  I'm also weighing Getty's 1998/2006 critique that the classical handicap view conflates "cost" with "investment" — Getty's real argument is that higher-quality individuals achieve honesty through greater marginal returns per unit cost (differential efficiency) rather than through bearing proportionally larger costs, which is a meaningfully different framing than the traditional handicap analogy suggests.

