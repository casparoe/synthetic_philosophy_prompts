  Actually, thinking further, in a separating equilibrium any honest signaler is better off signaling than staying silent, since silence would peg them as the lowest type. So "net benefit relative to silence" is trivially true across the board — the sharper question is whether honest signaling incurs a gross cost that wouldn't exist otherwise, and Számadó's work suggests it doesn't have to, only cheating needs to be costly. Given this, Response A's "net fitness loss" framing looks like a mild strawman, though it matches how the user posed the question, so I want to check how Response B handles this same issue.

