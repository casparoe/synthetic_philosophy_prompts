  **Weighing:** B has better framing and one genuinely useful extra bullet; A has no incorrect claims but a cosmetic audience mismatch. Given that correctness is prioritized over polish, and B's confident-but-wrong references would undermine trust for an academic user, A edges ahead — though the margin is small and the trade-off could reasonably be weighed the other way.

