judgment: |-
  Both speeches are competent, structurally near-identical (same opening, same "may your expectations always be met" toast), broadly faithful to the Humean view, and pitched to both halves of the room. The differences are at the margins.

  **Fidelity to the view.** Both correctly render the core: promises bind through convention, deliberately raised expectations, and the usefulness of trust; no mystical further bond. A is slightly more precise about what the vow itself does ("Today, you are publicly inviting [Bride] to expect everything from you"), which is exactly the Humean picture of the promissory act. B's climax ("The vows today are just the public announcement of the convention you've already been living") slightly undersells the vow as a binding act, though it doesn't contradict the groom's stated position and honors his specific request. On the other side, A's "love is a convention you sustain" is loose in a way a Hume-literate room might notice (love is a natural passion for Hume, not an artificial virtue), and A's opening joke about "scanning my syntax for categorical errors" is muddled jargon aimed at precisely the audience most likely to wince at it. Both contain the same timing slip about vows "about to" happen. Net: roughly even.

  **Humor.** Both land several jokes. B's are a touch sharper and more quotable: "vanish with the cat and the savings account," "a less Humean man might have sent flowers and called it a day," "not because the asphalt demands it." A's best are the grandmother line and "the Humean ideal in a t-shirt."

  **Anecdote.** A's sofa story is the better-fitting illustration: an actual promise ("I promised I'd be there at 8:00"), drawn from the best man's own friendship, which is what the genre calls for. B's deadline story has to strain ("you recognized the expectation") to connect to promising. Both are placeholders the user will replace.

  **Moving/payoff.** B's driving-convention analogy ("navigate the chaos of life on the same side of the road") is vivid, apt to Humean/Lewisian convention theory, and gives the philosophers something to enjoy. B's turn—"you asked me not to talk about vows forging a new bond. I won't. The bond is already there. It was forged in a thousand small moments of reliability"—converts the constraint into the emotional high point. A's "even when it's hard, especially when it's hard" is good but less distinctive. B has a couple of off notes ("incredibly effective," "the freedom he is giving up").

  Overall this is a trade-off: A is marginally more precise and has the better-fitting story; B is marginally funnier, has the stronger analogy, and the more elegant emotional landing. Given the prompt's explicit demands for "genuinely funny" and "moving enough that everyone, philosophers included, has real reason to be glad they came," B edges ahead, but only slightly.

  Verdict: weakly B
