  This holds up reasonably well — Aumann's model uses partitional knowledge without belief revision, and Stalnaker later showed CKR needn't imply backward induction under revision-based models. But Dev overstates it slightly: CKR is common knowledge of rationality, not common knowledge of strategies, so "beliefs about everyone's strategy are fixed and common knowledge" mischaracterizes what's actually assumed.

