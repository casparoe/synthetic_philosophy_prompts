  **What the user needs:** 8–10 non‑softball questions for a switch‑model defender, with three specified topics (simultaneous divergent tasks, Pinto et al., the trigger/homunculus worry), each with a follow‑up keyed to the speaker's probable reply. Accuracy matters a lot here — these will be read aloud to an expert.

  **The three required questions**

  - *Divergent tasks:* A uses the bimanual‑drawing paradigm (Franz et al.‑style), which is precisely the "literally the same instant" case the user described. B uses buttoning/unbuttoning intermanual conflict, which is legitimate but more sequential. A's anticipated answer (conscious initiation → unconscious motor handoff) and follow‑up (does that make the other hemisphere a zombie, reintroducing duality?) are tightly keyed. B's anticipated answer is disjunctive and the follow‑up only addresses one branch, then drifts into "sub‑personal switching" metaphysics — territory it reuses in Q3, making the two follow‑ups redundant.
  - *Pinto et al.:* Both frame it well (does residual integration make the switch superfluous?) and anticipate the same reply. A cites the correct year (2017). A's follow‑up (is the switch rate being set ad hoc; any independent measure?) and B's (is "bandwidth limitation" distinguishable from switching?) are both good; B's is perhaps slightly sharper philosophically.
  - *Trigger:* Both anticipate "sub‑personal competition." A's follow‑up stays on the user's stated concern — can a sub‑personal process ground personal‑level unity, and why prefer that to two subjects? B's follow‑up shifts to agency/ownership ("passenger"), which is interesting but moves off the unity problem the user wanted pressed.

  **Additional questions**

  A's set (phenomenological gaps, diachronic memory across the split, parsimony vs. gerrymandering, status of the offline hemisphere, GWT, falsifiability, what makes it the *same* stream) is solid and error‑free; the falsifiability example is a bit muddled but clearly illustrative.

  B's set has real strengths — Q6 (left‑hemisphere interpreter), Q8 (grounding metaphysics), and Q10 (circularity of verbal report) are excellent. But Q5 contains a significant factual error: it attributes the *partial unity* model to Tim Bayne, when Bayne is the principal proponent of the switch model and explicitly argues against partial unity (partial unity is associated with Lockwood). Asking a switch‑model defender "what virtue does your view have over Bayne's partial unity model?" would be an embarrassing misstep in front of exactly the person most likely to catch it. Q9 (evolutionary plausibility of a "backup" switching mechanism for callosotomy) is also weak.

  **Verdict reasoning:** A does the specifically requested work — keyed follow‑ups on the three target topics — more precisely and without redundancy, and contains no factual errors. B has some superior individual questions but introduces a misattribution about the central figure in this very debate, plus looser follow‑ups. Given that correctness and doing what was asked matter more than polish, A serves the user better, though B's strong extras keep the margin from being overwhelming.

  Verdict: weakly A
