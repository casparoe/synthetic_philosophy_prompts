judgment: |-
  **What the prompt demands most:** historical accuracy about Douglass's break with Garrison and the text-versus-practice argument, delivered to a room that includes Douglass scholars "who will notice if I get it wrong." The user is a novelist who spent 300 pages inside Douglass's head, so errors here don't just risk embarrassment at the podium — they make the draft untrustworthy to the user.

  **Response A's central problem:** It says that in the 1852 speech Douglass "called the Constitution a 'covenant with death'" and argued the Republic was "built on a lie so fundamental that no honest person could stand under its roof." This is backwards. "Covenant with death" was Garrison's phrase, and Douglass had already broken with Garrison in 1851. The 1852 Rochester speech itself contains Douglass's declaration that the Constitution, "interpreted as it ought to be interpreted," is a "GLORIOUS LIBERTY DOCUMENT" with no pro-slavery clause. A then compounds the error by dating Douglass's change of mind to "ten years later, and twenty years later... after the blood of the Civil War," and attributes "glorious liberty document" to that later period — when it comes from the very speech A just mischaracterized. Any Douglass scholar would catch this instantly, and so would the user. A also puts a fabricated line in quotation marks ("The law is on my side") and assumes the courthouse is "here in Rochester," which the prompt doesn't establish. A's prose is otherwise strong, its statement of the textual argument is clean, and its promise/betrayal balance is well handled — but the factual core is wrong in exactly the way the user feared.

  **Response B:** Correctly attributes "covenant with death" to Garrison, correctly notes Garrison's view that the Constitution should be burned, and correctly quotes "If there is no struggle, there is no progress" (1857). It leaves the chronology vague ("Douglass's mind did not stop in 1852... There came a turning point"), which implicitly suggests a post-1852 break — a soft inaccuracy, but nothing like A's explicit misdating, and B never inverts the content of the 1852 speech. Weaknesses: "It uses euphemisms. It hides." slightly muddles the "text is clean" argument Douglass actually made; "moral stamina" as a Douglass phrase is uncertain; there's a typo ("a unfinished"); and "not about left or right" brushes political framing, though only to disclaim it. B explicitly addresses the prompt's "neither cancels the other" requirement, honors the no-politics instruction, runs about eight minutes, and speaks in a plausible novelist's voice.

  **Comparison:** On structure, length, tone, and the promise/betrayal balance, the two are roughly equivalent. The decisive difference is accuracy on the one thing the prompt flagged as make-or-break. A would require the user to rewrite its historical spine; B needs only light touch-ups.

  Verdict: strongly B
