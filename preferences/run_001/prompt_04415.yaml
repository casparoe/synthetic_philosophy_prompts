  Elena then tries a condensed matter analogy—an electron in a Bloch state lacking definite position isn't called non-local, just contextually undefined—nodding to the user's background. Marcus responds with the parameter/outcome independence distinction: without pre-existing values, the correlation must depend either on Alice's setting (parameter dependence, explicit non-locality) or her outcome (outcome dependence, also non-local in a relativistic sense), invoking the Jarrett/Shimony framework, though I flag that his claim about outcome dependence being non-local is contestable.

