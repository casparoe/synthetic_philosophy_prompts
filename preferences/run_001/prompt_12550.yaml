  When it comes to opera, Schopenhauer argues that grand opera often stems from a somewhat crude impulse to pile up effects rather than pure artistic sensibility, insisting that music must remain the dominant element while words and action stay subordinate to it—text should never eclipse music's primacy. Yet he does allow that music paired with words or scenes can reveal something like the innermost meaning of the drama, hinting at a complementary rather than purely subordinate relationship.

