  Now I want to test this against a dialogue where Elena (defending PAP) presses Marcus (semi-compatibilist) with "it's the same trick, you're just hiding the wires" — pushing on whether the blockage mechanism itself is deterministic, while Marcus insists guidance control only requires the actual sequence to be identical across both worlds. I notice Elena's move might be slightly off-target, since the real question isn't whether the inhibitor's existence is determined but whether Jones's actual decision-making is.

