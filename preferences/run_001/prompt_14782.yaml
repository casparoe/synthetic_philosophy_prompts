  On the critics side, attributing the "unstable" objection to Goodin and Jackson seems off—Bradley's 2006 paper and Pettit's 1984 companion piece to Slote are the standard critics here, while Goodin actually defended a similar settling-for-good-enough view rather than attacking it.

