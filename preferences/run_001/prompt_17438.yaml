  Garber's key move is treating logical entailment as an extra atomic proposition in the language, with a constraint mirroring modus ponens on the probability function, and showing that under this setup there exist probability assignments where learning "T entails E" can raise P(T) even though E was already known. But this is only an existence result—it shows such probability functions are possible, not that every rational credence function must behave this way, which is a crucial subtlety for the argument.

