  I'm working through the comparison between Dretske and Millikan's teleosemantic accounts, weighing whether the disjunction problem (frog/fly/BB case) reveals a genuine difference in how each theory explains misrepresentation or just a terminological variance, and planning to lay out where their frameworks converge versus where they actually pull apart.

  Recalling that Dretske's *Explaining Behavior* grounds representational function in an individual's learning history — the structure gets recruited as a cause of behavior because it indicates F — which is a fundamentally different basis than Millikan's evolutionary/phylogenetic proper-function story, and this distinction matters for how each handles the Swampman case and the overall bet on which theory holds up better.

  I recall Dretske initially holding that Swampman lacks experience since he has no history to ground representational functions, though he might allow acquired functions through learning over time. Millikan takes the harder line — she explicitly bites the bullet that Swampman has no proper functions and thus no mental states at all, dismissing contrary intuitions as unreliable guides to what representation actually is.

  On the question of whether learning could eventually give Swampman functions, though, her position gets more nuanced: derived proper functions require the producing mechanism itself to have proper functions, and Swampman's learning mechanisms lack evolutionary history too. But she does allow that within-lifetime selection processes like trial-and-error learning could serve as an independent source of proper functions, which she works through in "On Swampkinds" — suggesting Swampman might gradually acquire functions this way even without ancestral history.

  Turning to the frog case, Millikan's actual solution is subtler than the disjunction problem suggests: in "Biosemantics" she ties the content to whatever the consumer system needs for its Normal explanation of success, something like "frog food" rather than "small dark moving thing," resisting the more permissive detector-based content because it doesn't match what the digestive/feeding system actually requires.

  Neander pushes back here, arguing Millikan's consumer-based approach makes content too distal ("food" versus "fly" or "small dark moving object"), while her own producer-based informational teleosemantics yields the more specific "small dark moving thing." Dretske's position is trickier still, since in the frog's ancestral environment BBs weren't around to distinguish "fly" from "small dark moving thing," so he has to appeal to the indication relation itself to explain which content actually drove the trait's recruitment.

  This is exactly where Fodor's disjunction problem bites—selection can't discriminate between coextensive properties, so neither Millikan's nor Neander's response really dissolves it. I'm also noting that in *Explaining Behavior*, Dretske's real paradigm is learning rather than evolution: genuine belief-content, for him, requires an indicator relation that explains why a state got wired to a particular output through operant conditioning, and he's skeptical of assigning contents to innate states this way. That's significant for the frog case, since its fly-detector is innate rather than learned, which might mean Dretske's own framework denies the frog a genuine belief about flies at all, leaving it with something more like a mere natural-function indicator.

