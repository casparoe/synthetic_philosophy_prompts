judgment: |-
  **What the user asked for:** 8–10 questions that press on mechanics rather than invite restatement; four specific questions (falsifiability vs. ascertainment, MPD disanalogy, ontological slide + weak/strong claim, biomarker survival), each with a short follow-up keyed to her likely answer.

  **Response A** delivers all four required questions, each with a follow-up that explicitly anticipates her likely move. The MPD question is aimed precisely at the disanalogy the user cares about ("What stabilizes these categories so they don't collapse the way MPD did?") and the follow-up pushes on whether persistence is a political rather than ontological achievement. The weak/strong follow-up ("point to a trait common in autistic adolescents today that would be psychologically impossible for a child in 1950") is exactly the kind of concrete pressure that moves an interview past abstraction. The ontological-slide follow-up ("in what sense do they *resist* us?") is a genuinely good philosophical probe. The six extra questions (vector of the loop, institutional amplifiers, cross-cultural variance, stabilization) stay mostly on mechanics, and every one has a follow-up. Minor weaknesses: the "weaponized to deny services" aside in Q3 drifts toward politics, and Q10's follow-up is thin.

  **Response B** also covers the four required questions with follow-ups, but with several problems:
  - Q1 is a soft opener that essentially invites restatement of her framing — the very thing the user said to avoid — and puts "rationalist forums" in the host's mouth on air, which the user may not want.
  - Q2's follow-up misuses "diagnostic substitution" (which refers to cases migrating between diagnoses, not criteria shifting within one); a philosopher of psychiatry would likely flag this, and the predicted answer isn't the most natural one for her.
  - Q3 asks how her account explains cross-cultural spread but never really presses the *collapse* half of the disanalogy; the follow-up pivots to "cultural imperialism" ethics instead of mechanics.
  - Q6 contains a stray "反而 (conversely)" text artifact — sloppy for a script the producer would use.
  - The combined slide/weak-strong question gets one follow-up addressing only the strong claim.
  - Later questions (clinical ethics, neurodiversity politics, suffering) lean toward ethics rather than mechanics, and lack follow-ups (permitted, but A does more).

  Both meet the formal requirements, but A is sharper on the exact pressure points requested, more consistently mechanics-focused, and free of the errors that mar B.

  Verdict: strongly A
