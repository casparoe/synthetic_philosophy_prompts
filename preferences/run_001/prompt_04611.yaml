  Neither engages the sharpest form of Alex's objection (the reflection-style point that you know in advance any outcome sends you to [0,1]). Overall, A is a bit richer and more precise on the mechanism but carries a more damaging error in its flagged "strongest" point; B is cleaner on the hyperprior crux but sloppier elsewhere and mislabels Dutch books. The trade-offs roughly cancel.

