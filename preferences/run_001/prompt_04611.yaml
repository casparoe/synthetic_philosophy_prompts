  - B claims Alex "might be Dutch Booked" if his correlation assumption is wrong. That's a misuse—a coherent precise Bayesian can't be Dutch-booked; being wrong just loses a bet. A quant would catch this instantly, though the underlying idea (don't bet against counterparties who may know the correlation structure) is sound and resonant.

