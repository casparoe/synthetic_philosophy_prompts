thinking: |-
  I need the dialogue to have the Lewisian give a real answer to the "nobody actually has common knowledge" objection rather than just repeating the theory, and the evolutionary theorist to explain why rule-breaking triggers disapproval rather than mere surprise—each engaging the other's strongest point, with the disagreement left sharp at the end. The user clearly knows Lewis's account well, so I should match that sophistication rather than oversimplify.

