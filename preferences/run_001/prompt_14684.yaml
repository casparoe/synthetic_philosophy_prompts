  Sidgwick thought a theistic postulate might reconcile duty and self-interest but couldn't rationally establish this, and his psychical research seems tied to seeking empirical evidence bearing on that very question. Bart Schultz's biography argues extensively for this connection, so both responses seem right to flag this. Now I'm checking each response for accuracy on this point, and Response A's claim about Sidgwick ending on a note about "fundamental contradiction" checks out.

