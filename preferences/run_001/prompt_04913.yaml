  I also notice B ties the fact/value bleed to Carnap's physicalism aligning with Neurath's in-kind calculation, arguing market prices rely on subjective marginal utility as psychological or metaphysical entities — but this seems off, since Carnap's physicalism actually holds that psychological statements translate into physical language, so utility wouldn't count as metaphysical, making B's claim that price theory introduces "pseudo-objects" a somewhat dubious attribution, even though it's hedged with "might" and "could."

  Still, B's connection between Neurath's economics and his physicalist philosophy of science has real historical grounding in the scholarship, even if the specific Carnap attribution is speculative — and B is careful to frame this as a philosophical bias rooted in fruitfulness and simplicity rather than politics.

  On the internal/external distinction, B offers a nuanced two-sided critique: Carnap would push back on computational socialists claiming big data "proves" socialism correct, insisting it only shows the external question has become pragmatically easier to answer affirmatively, while also critiquing Austrians for treating the market framework as the only valid ontology rather than a tool. The conclusion affirms Carnap's official neutrality while noting his sympathies would surface through pragmatic utility judgments, summarized in four points about using his philosophy of science to dismantle theoretical barriers protecting the status quo.

  I also notice B's mention of Carnap's later, more pragmatic treatment of values — referencing his shift toward "pure optatives" and rational discussion of means-ends — which shows real command of the later Schilpp-volume material, alongside correct use of Neurath's term "Naturalrechnung" for in-kind calculation. On fallibilism specifically, A addresses it explicitly while B only gestures at it implicitly through the computer-failure scenario.

  Both A and B agree that Carnap's official philosophy separates the empirical and normative questions, but that his sympathies for Neurath's project bleed in through framework selection and fruitfulness criteria. A frames this bleed-through as reshaping the empirical question itself — from "can we compute the plan" to "does this framework yield a more satisfactory distribution than the market" — while B frames it through physicalism's preference for in-kind language as scientifically cleaner, distinguishing this from mere cognitive bias.

  Now I'm cross-checking factual claims: A's citations of Carnap's 1932 elimination of metaphysics paper, the tolerance principle from Logical Syntax, and the fruitfulness criteria from ESO all check out, though calling Carnap a "holist" regarding Unity of Science is a bit loose since that term fits Neurath better.

  The bigger issue is A's claim that Carnap treated money prices as "abstract metaphysical entities" and that reducing economics to physics eliminates the "metaphysical veil of finance" — these seem like dubious misattributions, since prices are observable, not metaphysical. Similarly, A's framing of "freedom" as a metaphysical value, and its speculative claim that Carnap would call "spontaneous order" metaphysical, both feel sloppy and unsupported by Carnap's actual non-cognitivist view of values.

  B's account is more careful: it correctly notes Carnap's rejection of synthetic a priori truths, accurately summarizes Mises's praxeological argument against economic calculation without money and Hayek's epistemic reframing around dispersed knowledge. B's claim that market prices rely on "psychological/metaphysical entities" like subjective marginal utility is more debatable, since Carnap's physicalism would treat psychological entities as reducible rather than metaphysical, though B seems to be gesturing at how price theory introduces "pseudo-objects" like utility that positivists were often skeptical of.

  B is historically accurate in linking Carnap's anti-metaphysical stance to a broader social-enlightenment project associating metaphysics with reactionary politics, and its use of "cybernetic socialist" nicely echoes contemporary revivals of planning arguments (Cockshott & Cottrell, Phillips & Rozworski). Both responses miss deeper details, like Carnap's later writings on values and his exchange with Kaplan in the Schilpp volume on "pure optatives," where he allowed value questions could be rationally discussed.

  Neither response fully engages Carnap's mature 1963 view that many value disputes are actually factual disputes about means — which is directly relevant since whether planning works is an empirical means-question, and Carnap held science was relevant to value disputes in exactly this way. B's mention of "or later, pragmatic" gestures toward this without hitting it squarely. Neither response brings in Neurath's own arguments against reducing all values to a single monetary measure ("pseudorationalism"), or his holistic notion of comparing "Lebenslagen" (life conditions) across alternatives.

