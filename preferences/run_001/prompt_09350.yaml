  **Response B** reaches essentially the same verdict but does more of what was asked:
  - It frames the friend's position more precisely (ontological vs. epistemic uncertainty), then directly answers her specific claim about "objective fact the market is trying to discover" with the chance-fact/epistemic-fact distinction.
  - It explicitly tackles the "eventually" objection, calling it "the strongest technical objection," and takes a position: that asymptotic guarantees are a safety net rather than the product, that all probabilistic methods rely on limit behavior for validation, and that today's price is a valuation of computational labor to date. It also explicitly answers "answers or restates?" ("This is not 'ignorance dressed up.' It is resource-bounded rationality formalized.")
