  However, both graders miss a significant error in part (b). The threefold classification "officious, jocose, malicious" with its venial/mortal mapping is Aquinas's (ST II-II q.110), not Augustine's. Augustine's own typology in *De Mendacio* 14 is eightfold, and he explicitly sets jocose lies aside as not lies at all (*De Mendacio* 2.2) because the manner of speaking reveals no will to deceive. The student's "Refining this position elsewhere" attributes a scholastic scheme to Augustine — exactly the sort of misattribution a grader for a seminar on *patristic and medieval* theories should flag. Both responses award 7/7 and call the venial/mortal point "correct"/"accurately noted." This is the shared, most consequential failing. Both also let pass the subtle imprecision in (a), where the student's "true assertion said to mislead" is not Augustine's clear paradigm (truth believed false) but a boundary case Augustine himself treats as unclear.

  **Differences between the responses.**
