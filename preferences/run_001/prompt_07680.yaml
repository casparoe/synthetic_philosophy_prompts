  I'm mapping out the dialogue structure: one grad student pushing the Maynard Smith arbitrariness argument for DNA as genuine code, the other countering with the deflationary parity thesis from Sarkar and Griffiths/Gray, and I need to make sure they actually engage each other's points rather than just talking past one another.

