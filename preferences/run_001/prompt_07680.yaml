  Continuing, I trace how Jordan's line that information-talk adds no explanatory power directly echoes Sarkar's actual dispensability argument, then Alex's claim that code-based prediction works because biology isolates a control layer, countered by Jordan noting that isolation is really an artifact of how experiments are designed, not a natural feature — DNA is a privileged cause for us, not for the cell.

