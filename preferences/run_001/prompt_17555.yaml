  Strengths: The desert point is handled with real precision — "he didn't think he *deserved* your money because he was virtuous. He thought he was *entitled* to it because you chose to give it to him... No force, no fraud." That's exactly the entitlement/desert distinction the user cares about. The Wilt example is stated correctly (twenty-five cents, a million people, the box). "Liberty over patterns... process over praise" and "no pattern of justice requires it" are nice quiet rewards for the reading group. The closing ("for once, I hope you don't feel the need to correct the record") is lovely.

