  For Q3, though, I notice a subtler problem: framing determinism as putting all agents "similar to" exempted groups misstates Strawson's actual argument, since he grounds exemption in incapacity for interpersonal relationships rather than in being causally determined per se—everyone is determined if determinism is true. This risks setting up something the Strawsonian can dismantle by simply pointing out the exemption criterion isn't determinism itself, though it's arguably fair as interlocutor pressure rather than a strawman. Response A's version, framing things around viewing all behavior as caused similarly to how we view the mentally ill, seems to sidestep this issue somewhat.

