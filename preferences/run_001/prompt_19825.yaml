  **What the user needs:** They have a false premise (Peirce and James were saying the same thing) and want to know (1) why philosophers separate them, (2) why Peirce's renaming wasn't an overreaction, and (3) how much blame pragmatism deserves for post-truth. Both responses correct the premise well and hit all three points; the differences are in accuracy of detail, fairness to James, and how completely they map the genealogy the user is researching.

  **Response A** correctly lays out Peirce's convergence realism vs. James's instrumental/experiential view, gives the 1905 "pragmaticism" story accurately, and uses genuine James phrasing ("expedient in the way of our thinking," "cash value"). Its major value-add for this particular user is the Rorty/neopragmatism section: in the actual literature on post-truth's philosophical roots, Rorty is a far more commonly cited pragmatist culprit than James, and A correctly flags that stopping at classical pragmatism misses a step. Weaknesses: its portrait of James leans on the critical caricature ("truth is what works for me," "tied to individual satisfaction") and only belatedly notes that post-truth "strips the nuance from James." The Papini aside is plausible but not well-grounded in Peirce's actual 1905 text. "Last decades of his life" is a slight stretch. No clear factual errors.

  **Response B** is closer to the sources in places: it paraphrases Peirce's actual definition ("fated to be agreed upon by all who investigate"), quotes James's "truth happens to an idea," and reproduces the full "bantling... kidnappers" passage. It is also fairer to James, explicitly noting he required experiential verification and didn't license lying — an important corrective that bears directly on the blame question. Its framing suggestions for the article are useful. However, it contains a concrete factual error: "By 1905, James's book *Pragmatism* had become a bestseller." That book was published in 1907; a writer who repeats this chronology in a piece on intellectual history would be wrong in a checkable way. B also omits Rorty/neopragmatism entirely, which is a notable gap given the user's stated project.

  **Weighing:** B is more nuanced on James and quotes primary text well, but has a real chronological error and stops short of the most relevant later pragmatist link. A is somewhat harder on James than is fair but has no clear factual mistakes and gives the user a more complete map of where pragmatism actually connects to post-truth discourse. Since accuracy and serving the user's research goal matter most, A edges ahead, though the trade-off (B's better James vs. A's Rorty and cleaner facts) keeps the margin modest.

  Verdict: weakly A
