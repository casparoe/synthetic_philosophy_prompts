  There's a small risk that A's phrase about "ordinary lawbreaking" serving self-interest could be misread as implying contesters acted selfishly, but since A treats contesting as a distinct third category rather than ordinary lawbreaking, a careful listener wouldn't conflate the two. Checking A's factual claims, some are slightly overstated — like calling the Constitution the only mechanism for challenging statutes, or law being the only thing preventing us from "killing one another" — but these feel like acceptable rhetorical flourishes rather than real inaccuracies.

