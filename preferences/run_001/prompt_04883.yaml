  Still, A's omission seems fixable with a one-line addition, whereas B's softer treatment of the punishment-acceptance condition is more structural, baked into how it frames the central dilemma and directly relevant to the "don't lionize" requirement. A also draws a more sophisticated three-way distinction (civil disobedience / legal advocacy / ordinary lawbreaking) versus B's two-way split that lumps both groups under civil disobedience, making A more useful for the specific situation described.

