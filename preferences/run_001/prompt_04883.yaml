thinking: |-
  I need to check the speech against several criteria: avoiding both scolding and lionizing the arrested students, staying accessible to non-academic family members, genuinely engaging the civil disobedience vs. lawbreaking distinction rather than defaulting to platitudes, and getting the underlying theory correct for the faculty in attendance.

