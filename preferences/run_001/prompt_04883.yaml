  I also notice B's small factual looseness ("many" vs. the prompt's "several") compared to A's more precise "some of you were arrested." And I'm drawn back to A's meta-framing moment—the line about listening for theory, order, and being truly seen—which directly mirrors the constraints laid out in the prompt itself.

