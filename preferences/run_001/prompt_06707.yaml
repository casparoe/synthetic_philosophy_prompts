judgment: |-
  **What Aquinas actually says (the benchmark):** The key texts are *De Regno* I.6 (private persons should not kill tyrants on their own presumption; action belongs to public authority; the multitude that appoints a king may depose him; if no human recourse, turn to God; tyranny may be punishment for sin), the Sentences commentary II d.44 q.2 a.2 (a usurper is not truly a ruler, and when there is no superior to appeal to, one who kills him to free the country "is praised and receives a reward"), and *ST* II-II q.42 a.2 ad 3 (disturbing a tyrannical regime is *not* sedition—the tyrant is the seditious one—unless the disturbance causes greater harm than the tyranny).

  **Response A** gives a clear, well-structured account and rightly stresses the institutional, cautious character of Aquinas's position. Its section on the later scholastic development (Mariana, Suárez) is genuinely useful for explaining why the user's secondary sources conflate "Aquinas" with "the Catholic tradition." Its treatment of foreign intervention is appropriately tentative. But it has real accuracy problems on points central to the user's puzzle: it flatly asserts "private assassination is sedition," which contradicts the well-known *ST* q.42 passage the user is likely to encounter; it attributes a "hand cannot cut off the head" organic argument to Aquinas that is not his; and on the usurper case it says "even here, Aquinas is wary of private violence," omitting the Sentences text where Aquinas praises the private killer of a usurper. Since the user specifically asked how much the title/exercise distinction changes the picture, A's overly restrictive reading of the usurper case shortchanges the question.

  **Response B** covers the same ground with the same conclusion but is more faithful to the texts on the decisive points: it cites the "praiseworthy and deserving of reward" passage, so the user sees that the title defect genuinely lowers the barrier for private action rather than merely shifting standing; it includes the "recourse to God" and tyranny-as-punishment material that explains why Aquinas holds firm "however terrible the ruler"; it brings in the self-defense distinction (q.64) to show why the framework doesn't stretch to planned killings; and its section on what happens when the public authority *is* the tyrant directly engages the "cases he could never have anticipated" part of the question. Its flaws are smaller: a *De Regno* paraphrase presented as a quotation, Bartolus's Latin labels presented as if standard to Aquinas without comment, and an overconfident claim that state-sponsored targeted killing "fits best" (it belongs under just war rather than the tyrannicide framework proper, though B does pivot to "is this war just?").

  Both omit explicit engagement with *ST* q.42 and the Ehud/Eglon discussion. On balance, B better serves a user trying to reconstruct the internal logic from primary fragments, because its key textual claims are correct where A's are misleading, though A's historical-development section is a real counterweight.

  Verdict: weakly B
