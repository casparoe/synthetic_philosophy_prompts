  **Format.** A adheres slightly more strictly to "single consideration" (B's octopus and bumblebee notes each cite two lines of evidence). Neither leaves a tier empty; neither is required to. This is a minor point against B.

  Overall, A's tiering also somewhat reproduces the vertebrate/invertebrate line the user was worried about, while B's places the strongest invertebrate case at the top in line with expert consensus. B's notes are more specific, more accurate to the literature, and more useful for a novelist deciding how to write these minds. The difference is real but modest, since the responses agree on most placements and both are competent.

