  I need to grade this sample answer on Aquinas's account of tyranny and tyrannicide, giving a letter grade, score out of 20, and a breakdown of correct, shaky, and wrong points. I should watch closely for planted errors that a careful grader would need to catch.

  Checking the tyranny ranking claim first: the answer correctly states Aquinas sees tyranny as the worst regime because it serves only one man's interest, deviating furthest from the common good compared to oligarchy or corrupt democracy — this matches De Regno accurately. Now I'm verifying the titulo/exercitio distinction the answer makes between usurper-tyrants and legitimately-installed-but-unjust tyrants.

  Actually this terminology isn't Aquinas's own — it's Bartolus of Sassoferrato's from "De Tyranno," later refined by Salutati. Aquinas does gesture at something similar in his Sentences commentary, distinguishing defective acquisition of authority from defective use of it, but attributing the "tyrant by title vs. tyrant by exercise" framing directly to Aquinas is anachronistic and something a careful grader should flag.

  I'm noting that the Sentences commentary is actually more permissive toward tyrannicide against a usurper than the De Regno is — Aquinas there approvingly cites Cicero praising Caesar's killers, whereas his later De Regno treatment is much more restrained.

  Checking the sample answer's claim about the legitimate-but-unjust ruler being removed by public authority rather than private citizens — that's basically accurate to De Regno I.6. But the third point about Aquinas warning that private individuals labeling rulers "tyrants" is dangerous needs scrutiny: his actual argument is that private tyrannicide is risky mainly because the wicked, not the good, would exploit that opportunity, since they find any strong rule burdensome.

  The claim that Aquinas backs this up by citing Aristotle's Politics is a planted error — Aquinas's real point there is about rebellion possibly failing and making the tyrant worse, and the authorities he actually cites are scriptural (1 Peter on servants obeying harsh masters, David sparing Saul), not Aristotle.

  I recall the passage rejects the Ehud/Eglon example as justification for private tyrannicide, since Ehud killed an enemy ruler rather than a legitimate one, and instead argues that allowing private individuals to kill tyrants on their own judgment is dangerous, since the wicked would exploit this more readily than the good given how burdensome any ruler's authority feels to them.

  Any action against a tyrant should come through proper public authority rather than private initiative—if a community has the power to institute a ruler, it likewise has the power to depose or restrain him, as with Tarquin's expulsion or Domitian's condemnation by the Senate. When no such recourse exists, Aquinas says the sufferers must turn to God's judgment instead. He also warns that rebellions often backfire: failed attempts make the tyrant harsher, and successful ones frequently splinter the community into factions or produce a new tyrant even worse than the one deposed.

  I want to check whether Aquinas actually attributes this "worse tyrant" reasoning to Aristotle's Politics, since that seems like his own observation rather than something drawn from Book V's discussion of how tyrants maintain power—so the claim that he cites Aristotle explicitly here looks like a misattribution.

