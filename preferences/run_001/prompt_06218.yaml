judgment: |-
  **What the sample answer actually gets wrong (the planted errors a TA should catch):**
  1. The Locke comparison / "ultimate authority rests with the people" — blatant anachronism; Aquinas grounds authority in God and only allows deposition *if* the multitude had the right to appoint the ruler.
  2. The claim that Aquinas "backs this up with Aristotle's *Politics*" for the worse-tyrant point — fabricated. In *De Regno* I.6 the worse-tyrant argument is Aquinas's own observation, and his authorities against private tyrannicide are scriptural (1 Peter, David/Saul) and Roman historical examples, not Aristotle.
  3. Subtler: the *titulo/exercitio* terminology is really Bartolus's; "no obedience whatsoever" to a usurper is too absolute (ST II-II 104.6 ad 3 adds "except to avoid scandal or danger").

  **How each response performs:**

  Both catch the Locke anachronism. Both fail identically on the Aristotle attribution — and worse, both actively affirm it as correct ("Aristotle: Correct. Aquinas explicitly leans on..." in A; "correctly noted the reliance on Aristotle" in B). Both miss the Bartolus issue. Both misread the prompt by treating the sample answer as the user's own work (the prof wrote it), with A's closing "script" being the more misdirected of the two.

  **Differences:**
  - **A** gives a more precise, more useful explanation of *why* the Locke comparison fails: authority originates in God and is mediated through the community vs. Lockean consent; deposition is conditional on the multitude having appointed the king. This directly rebuts the sample's "ultimate authority rests with the people" — the key thing the user will need to articulate in section. A also adds a helpful note that *De Regno* focuses on tyranny by exercise while obedience nuances live in the *Summa*.
  - **B** additionally flags "no obedience whatsoever" as too absolute — a legitimate, textually grounded nuance A misses. However, B's supporting explanation ("maintaining public order unless the commands are sinful") muddles the usurper case with the unjust-command case. B also introduces a fabricated term, "polybia," for the mixed regime — a hallucination that could embarrass the user if repeated in a medieval seminar. B's "fractures unity" gloss also slightly misstates the sample's actual reasoning.

  Net: same major failure, same main catch. A explains the central error better and contains no fabricated terminology; B catches one extra minor issue but with muddled reasoning and a made-up term. This is close, but A's cleaner accuracy on the point that matters most edges it.

  Verdict: weakly A
