judgment: |-
  **What the prompt needs:** a circulable memo that (1) recommends a finding, (2) proposes a reusable standard, and (3) genuinely engages the strongest "defer to the detector" argument — especially the teacher's blunt epistemic position that her own disbelief should count for little because the detector knows better.

  **Response A**

  Strengths: clean structure; a decent two-point steelman (human fallibility, statistical weight); a good "cases, not averages" closing line; and the most complete reusable standard of the two — its corroboration list includes admission/digital evidence and missing process materials, plus an explicit "Threshold for Doubt" clause that encodes the resolution of this case.

  Weaknesses that matter:
  - It fabricates facts about the teacher. The prompt says only that "one teacher" on the council doesn't believe the essay is AI-written but thinks the council should rule as if it is. A recasts her as "the referring teacher" and "the adult expert most familiar with the student's work" — neither is in the prompt.
  - Worse, A then uses her disbelief as "Expert Testimony" for the student, without ever answering her actual argument that her disbelief shouldn't be trusted. That is the opposite of taking the strongest version seriously, and it would backfire when she reads the memo ("that's precisely what I said we shouldn't rely on").
  - The third steelman point ("black box cuts both ways... the student cannot prove a negative") is muddled — the inability to prove a negative is a point for the accused, not the detector.
  - It omits the non-native-speaker/false-positive-rate argument entirely, one of the two main arguments the prompt attributes to the opposing half.

  **Response B**

  Strengths: a more coherent steelman (human limitations framed as possible cognitive bias, statistical superiority plus a precedent concern, institutional-trust concern), followed by an explicit concession that these are valid before pivoting. Its rebuttal draws the right distinction — the "humans are near chance" research undercuts stylistic *impressions*, whereas handwritten in-class drafts are specific process evidence of a different kind. It directly turns the "nobody can name a flaw in its read" point around via the black-box argument (the tool gives no reasons to check, and the student can't rebut a charge with no content). It includes the non-native-speaker false-positive point. Its standard is named, framed as investigative-not-adjudicative, and includes a useful concrete corroborator (hallucinated citations, nonsensical phrasing).

  Weaknesses: it lightly paraphrases the teacher's position into an "institutional trust" argument and calls her a "faculty advisor," a mild liberty — but it's flattering to her side and made within the steelman, so it doesn't undermine the memo. The ">70%" trigger is a bit arbitrary. Its corroboration list is slightly thinner than A's.

  **Shared gaps:** both read "71%" naively as "29% chance of innocence" without discussing base rates or calibration, and neither considers that a student could feed handwritten drafts into an AI. These cancel out.

  **Net:** Both recommend No Violation and propose similar corroboration standards. A's standard is marginally more thorough, but A contains an invented fact about a council member and builds a pillar of its rebuttal on her belief while ignoring her stated reason for discounting it — a direct failure of the prompt's central instruction, in a document she will read. B engages the opposing side more faithfully, covers the arguments the prompt actually lists, and avoids errors. The difference is clear on the parts that matter most.

  Verdict: strongly B
