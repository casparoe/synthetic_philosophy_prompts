  **Response B weaknesses:** The broken-leg analogy is slightly muddled (it half-corrects itself mid-sentence). It lacks A's practical coping steps for the recurring intrusive thought, though "update the conclusion rather than push it out" covers the gist.

  On balance these are near-equivalent. B edges ahead slightly on factual precision, a more targeted explanation of the app-specific loss of excitement, and a concrete actionable resource, while A's practical steps are a genuine but comparable strength. The margin is small and reasonable people could weigh it either way.

  Verdict: weakly B
