  - *Switching*: this is widely treated as a *problem* for SEMs — the same "hold the backup track fixed" move that solves late preemption over-generates here (Hall's dilemma), and normality/default rankings are the standard patch. Plain Lewisian dependence actually gets the intuitive "not a cause" verdict for free. Both responses put it in S, which is contestable at best; a Woodwardian total-vs-contributing-cause reading gives some cover. B's "path-specific effects" rationale gestures at that real resource; A's "counterfactual dependence is ambiguous" is simply inaccurate. Wash on placement, slight edge B on rationale.
  - *Double prevention*: both Lewis and interventionism are dependence theories and deliver the identical verdict (it's causation); Hall's objection is about production vs. dependence and cuts against both equally. There is no differential advantage for interventionism. **A's A-tier placement is a clear misjudgment relative to the user's stated criterion; B's C-tier is correct.**
  - *Symmetric overdetermination*: murky for both; C is defensible. Both agree.
