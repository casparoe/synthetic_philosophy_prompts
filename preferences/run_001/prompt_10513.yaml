judgment: |-
  Both responses correctly identify Robert Batterman's *The Devil in the Details*, frame the core move as the regular-vs-singular-limit distinction, and present the explanatory-indispensability argument (the RG fixed point only exists in the limit; universality can't be explained without it; therefore macro behavior has autonomy). Structurally they are near-twins, so the differences come down to precision and the quality of the supporting material.

  **Response A** is tighter on the actual philosophical logic. Section 5 lays out the inference chain explicitly (macro behavior is real → only explanation uses a structure absent from the finite micro-ontology → macro has properties not contained in the micro-ontology), and it closes by naming the crux — "explanatory autonomy implies ontological independence" — which is exactly the step the user said they couldn't follow. The shock-wave/Rankine-Hugoniot analogy is well chosen: jump conditions derived from a discontinuity, independent of viscosity, parallel universality derived from a fixed point independent of lattice details, and it fits Batterman's "asymptotic reasoning" program (A even invokes the book's subtitle). The finite-size-scaling summary speaks directly to a condensed-matter physicist. Weaknesses: a slightly loose claim that finite-system "exponents depend on N," and the "irrelevant operators just have small coefficients" gloss is imprecise. No mention of critics (Butterfield, Norton, Callender).

  **Response B** adds one genuinely useful technical point A lacks: the non-commuting $h\to0$ / $N\to\infty$ limits as the concrete signature of a singular limit, and "FAPP is not ontology" is a crisp formulation. But it has more slips a physicist would notice: "fluctuations will eventually kill the order (in low dimensions) or smooth out the transition" conflates Mermin–Wagner-type infinite-system results with finite-N ergodicity; attributing to Batterman the claim that the fixed point is "a real physical object" overreaches; and the finite-system crossover being "incredibly sensitive to boundary conditions" is overstated for $N\sim10^{23}$ (A has a milder version of this). The pixel/nose analogy is arguably counterproductive — a nose *is* a pattern in the pixels, which is closer to the "handy coarse-graining fiction" reading the user is worried about than to Batterman's stronger singular-limit claim. B also lays the flattery on thicker.

  Neither engages the critical literature, which a philosophy-curious physicist would have benefited from. On balance A delivers the same core argument with fewer errors and better-fitting analogies, while B's one technical advantage is offset by its sloppier statements and a weaker analogy.

  Verdict: weakly A
