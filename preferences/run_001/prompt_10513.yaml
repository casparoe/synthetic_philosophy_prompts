  Then response B closes with the frictionless-plane comparison: it's not that the idealization is real, but that only the idealized limit predicts the actual observed behavior, which nicely reframes "reality" as insensitivity-to-detail rather than literal infinity. Comparing accuracy, both responses share a similar structure, but A's shock wave/Rankine-Hugoniot analogy is notably faithful to how Batterman himself frames these cases.

  Its universality claim is a bit imprecise since exponents actually depend on N in finite systems, and its point about irrelevant operators having "small coefficients" is a slightly garbled way of putting it—irrelevance is really defined through the linearized RG at the fixed point, which presupposes the limit, though the underlying idea it's gesturing at is correct.

  B's non-commuting limits point is technically solid and valuable, but its claims about fluctuations "killing order" or the fixed point being "a real physical object" overreach, and its sensitivity-to-boundary-conditions point is somewhat overstated; the pixel/nose analogy also feels weak here.

