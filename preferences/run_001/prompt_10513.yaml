  Response A correctly frames the frictionless-plane analogy against singular limits, noting the loss of strict universality in finite systems—a fair nitpick about pseudo-critical exponents. It also captures Batterman's central move that the limit's explanatory indispensability is what grounds the emergence claim, correctly noting that finite systems lack strictly irrelevant operators.

  The stability/robustness point holds up too — Batterman really does argue that explaining real-world stability requires the infinite idealization. And the asymptotic reasoning point checks out against the book's subtitle; Batterman genuinely does use the shock wave/inviscid limit and Rankine-Hugoniot conditions as an analogous case.

  A also handles the ontological-vs-epistemic distinction reasonably fairly, framing Batterman's move as "explanatory autonomy implies ontological independence" — a fair gloss even though critics have called his emergence more epistemic than ontological. The FSS connection for a physicist audience is a nice touch, though A doesn't push back critically on Batterman anywhere, just presents his view.

  Now turning to Response B, which starts similarly with the frictionless-plane framing but uses "instrumental" vs "constitutive" idealization, and makes the point that the partition function in a finite N=10^23 system remains analytic everywhere despite the huge size.

  It correctly notes that a finite description literally can't produce the sharp transition, echoing Batterman, but the claim that the crossover is "incredibly sensitive to boundary conditions and size" is overstated -- given how tiny the finite-size shift actually is for macroscopic N, this framing exaggerates the effect.

  Response B's non-commuting limits point is stronger and more precise, correctly capturing why spontaneous magnetization vanishes for finite N under symmetric conditions but not in the true thermodynamic limit, which is a technically solid observation a physicist would recognize.

  I like the crisp framing of the reductionist "close enough for all practical purposes" versus the emergentist insistence that FAPP isn't ontology. Then I'm considering the stronger claim about explanatory irrelevance versus ontological autonomy — whether Batterman really commits to the RG fixed point being a real physical object in the space of theories, which seems like a bold metaphysical step to attribute to him.

  I also notice the point about finite systems and fluctuations is a bit muddled, conflating Mermin-Wagner-type suppression of order in low dimensions with the separate issue of ergodicity breaking and exponentially long relaxation times in finite systems — a physicist would flag this as sloppy even if it's a minor slip.

