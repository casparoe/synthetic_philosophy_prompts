judgment: |-
  **What the user needs:** a ~5-minute eulogy that (1) gives a lay room just enough Ayer for Dad's own postscript to land, (2) is warm and funny, (3) never drifts into "better place / at peace / watching over," and (4) never flattens the hospital experience into nothing — with the user explicitly flagging that Dad feared the flattening more.

  **Ayer accuracy:** Both compress the Postscript the same way — turning Ayer's softening of his own "inflexible attitude" toward his disbelief into "he'd been too arrogant/rude toward believers," and both say "God" where the postscript was about the afterlife. Both call the light "divine," which Ayer didn't. These distortions are identical, so they wash. Both keep the smoked salmon and the four minutes, which is the part Dad loved.

  **Dad's postscript and the two bans:**
  - A renders it faithfully ("wasn't entitled to sneer at people who found comfort in faith"; "brave enough to change his attitude, even if he didn't change his facts"). But A also invents: "pretending nothing happened would be a lie, but pretending he'd found God would be a bigger one." That ranks the two failures opposite to how the user says Dad ranked them — a small but direct contradiction of the brief.
  - B renders it nearly verbatim ("hadn't changed his mind about there being nothing afterward... changed his mind about how he treated the people who thought otherwise"), adds a sharp line ("sneering at hope wasn't the same thing as defending truth"), and states both bans without ranking them. B's integrity line — "having the courage to say exactly *how* you've changed [your mind]" — is more precise than A's "admit when the light has changed," which faintly implies Dad changed his facts.

  **Comfort drift:** Neither affirms the banned phrases; both negate them. A's "he was here, in this world" (past tense) is the more scrupulous formulation; B's "He is here. He is in the work we do..." is standard humanist memorial language, clearly figurative, but a shade softer. B also invents "he cherished her faith" and assumes the aunt is Dad's sister — "cherished" overstates "stopped sneering," and the relationship may be wrong. A's "those who loved him with a religious heart" is safer and still warm. These are B's weakest points, though easily edited.

  **Warmth and humor (explicitly requested):** B is clearly stronger — the fuse-box opening, "after a second pint," "If I ever go briefly dead," "We waited for the conversion," "logical short-circuit... with a grin that dared you to prove him wrong," and the closing "didn't believe in the light at the end of the tunnel, but he certainly knew how to keep the lights on." B also uses the user's details (left school at sixteen, brothers/workmates/neighbours) and matches the British register. A's humor is thinner, its back half repeats "he fixed things / he was honest," it slips into American spelling ("favorite," "honor"), and its final joke ("a little less inflexible than he was") undercuts the arc it just built.

  **Net:** Both are competent and neither violates the hard constraints. B is the better speech for delivery and articulates Dad's actual point more precisely, while A is slightly more austere in its honesty and avoids inventing a claim about the aunt. Fidelity issues cut both ways (A's misranking vs. B's "cherished her faith"/sister assumption), so the edge to B is real but not overwhelming.

  Verdict: weakly B
