  **What the user needs:** a speakable 4–5 minute toast that (a) explains the precommitment contract so both rationalists and confused relatives can follow, (b) builds the vows-as-mast / miserable-Tuesday-in-year-twelve argument on Ainslie's successive-selves picture, (c) has a joke that rewards the rationalists without losing the aunts, (d) *earns* rather than asserts the "this is more romantic, not less" turn, and (e) doesn't read as showing off.

  **Response A** has real strengths: the "Do not explain the contract" hook is a good opener, "feelings are weather" is a nice spoken image, "Finally, people who understand incentive compatibility" is a well-built dual-audience joke, and the close ("a partner who has literally signed a document saying they won't let you drift away") lands emotionally. But it has several concrete flaws. The line "For the record, the joke I promised the rationalists?" is a spec-fulfillment leak — the speaker never promised anyone a joke in the toast, and it reads like the model checking a box. Worse, it's dropped right after the emotional climax ("we are building a mast… when the weather turns"), forcing a "But seriously" restart that breaks the arc. The "(Laughter)" / "(Bigger Laughter)" stage directions are presumptuous filler. "Antifragile" adds jargon the aunts won't know, in a toast where the user specifically worried about showing off. And A never incorporates the *room full of witnesses* into the mast metaphor, which was half of the user's own image.

  **Response B** is tighter and more speakable. It renders Ainslie's idea more vividly and accessibly than A ("They are two *series* of people. The Priya standing here tonight in a beautiful dress is not the same Priya who will be arguing about whose turn it is to do the dishes in 2031"). It realizes the user's full metaphor — "The vows are the mast. This room full of witnesses… we are the crew. We are here to hold the rope" — which also gives the relatives an active role instead of just tolerating them. The aunts joke ("I can see the aunts in the back doing the math. That is a very expensive marriage") does the same inclusive work, and the "penalties are no longer fifty dollars… but the payout is also higher" callback ties the joke-contract to the real vows. The turn is earned with a precise reframe: "the Priya of today loved Dev enough to tie the hands of the Priya of year twelve" — precommitment as an act of present love, not distrust. The jargon is lighter and explained in plain terms ("Future Happiness" vs "Immediate Relief"). Weaknesses: the "pull request" opener will fly past relatives, and the $50 figure is invented — but that's a one-number swap.

  **Trade-off:** A's single rationalist-rewarding joke is slightly better constructed for a mixed room; on everything else — structure, audience inclusion, fidelity to the user's mast-plus-witnesses image, spoken flow, avoidance of show-offy jargon, absence of embarrassing meta-lines — B is clearly ahead. B is the one the user could deliver with minimal editing.

