judgment: |-
  **What the user needs:** A journalist wants a textured, accurate explanation of (1) how a structural realist answers the *meta-level* PMI (structure sometimes fails too), and (2) what actually grounds the claim that mathematical structure is more likely to survive than entities/mechanisms. They flagged Fresnel/Maxwell as the textbook case.

  **Response A** covers a lot of ground: limiting cases, a Bohr→QM example, the "best of both worlds" dialectic (traditional realism vs. constructive empiricism vs. SR — this is genuinely Worrall's framing), the ESR/OSR split (Worrall vs. Ladyman & Ross), named critics, and the "structure of what?" weakness. That breadth is useful for a longform piece. But it has several conceptual muddles on the core question. The Fresnel equations are mischaracterized as "wave equations describing light propagation" rather than the reflection/refraction amplitude relations — the very textbook example the user cited. The coordinate-transformation analogy (Cartesian vs. polar circle) suggests theory change is mere redescription of the same content, which is precisely what it isn't (Maxwell's theory has different empirical content from Fresnel's). "If there are no electrons, what is holding the charge?" misapplies the relations-without-relata worry to ESR, which doesn't deny relata exist. And "behaves *as if* it has this structure" is instrumentalist phrasing that undercuts the realist claim. Ontology as "explanatory storytelling"/"conceptual crutch" is also a caricature; the ether was a substantive physical hypothesis with testable consequences.

  **Response B** is tighter on the actual question asked. It correctly identifies what Fresnel's equations are about (reflection/refraction coefficients, boundary conditions). Its grounding argument is the clearest in either response: (a) the correspondence principle as a *methodological* constraint — new theories must recover old structural relations in limiting domains, but face no analogous requirement to preserve old ontology ("empirical friction," "ratchet effect"); and (b) the epistemic argument that our evidence is relational, so structure is the part most constrained by data while ontology is underdetermined (multiple ontologies fit the same structure). Those two moves are the standard structuralist grounds (Post's general correspondence principle; the Poincaré/Russell line), and B states the asymmetry between structure and ontology explicitly, which is exactly what the user asked for. It also gives concrete cases of genuine structural breaks (commutative→non-commutative algebra) and points to Vickers, who is in fact the leading current figure on the PMI/selective-realism debate.

  B's weaknesses: the working/idle posit distinction is Kitcher's (with Psillos's divide et impera), not Vickers's, and B blurs structural realism into selective realism more generally (Psillos explicitly opposes Worrall on whether the retained parts are purely structural). "Convergent realism" as Vickers's contribution is garbled. It omits the ESR/OSR distinction, which A includes and which matters for a piece on this topic. Neither response mentions Newman's objection or Psillos's untenability-of-the-distinction critique, both directly relevant to the "retreat" worry.

  **Weighing:** A's errors are conceptual and sit on the core mechanism; B's errors are mostly attributional. For a reader trying to *understand* why structure should be stickier than ontology, B's correspondence-principle asymmetry and relational-access argument are more illuminating and more correct than A's coordinate analogy and "storytelling" gloss. A's breadth (ESR/OSR, named critics, Worrall's dialectic) is real value the journalist would want, so the margin isn't large.

  Verdict: weakly B
