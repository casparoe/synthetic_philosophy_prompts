  These are closely matched. A's concrete literature pointer, the discount-rate argument, and the reductio give the user slightly more distinct, usable content; B is slightly cleaner and more rigorous on the as-if problem. I lean marginally toward A for this particular user, who frames the question in terms of the literature.

