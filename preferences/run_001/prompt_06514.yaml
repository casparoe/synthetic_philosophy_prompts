  Neither engages the deepest critique of the first premise — Thornley's argument that incomplete preferences aren't money-pumpable (so the claimed coherence theorem doesn't exist in the form cited), or Rohin Shah's point that utility functions over histories make any behavior trivially "coherent." B gestures more toward the latter in its revealed-preference section, which is somewhat fuller than A's treatment.

