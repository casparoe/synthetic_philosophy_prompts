  I don't recall "nervous overstrain" actually appearing in the essay—the real phrasing is "bad attack of economic pessimism" and "nervous breakdown," so B's quote looks like a misremembering. For section 4, B seems to restate the thesis more forcefully with one caveat about interest rates and the euthanasia of the rentier, framing the gap as institutional mechanisms never being put in place rather than a flaw in the original 1930 reasoning.

