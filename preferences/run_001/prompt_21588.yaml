judgment: |-
  **What a careful grader should catch in the student's answer**

  - (a): Computation correct. The bankruptcy/feasibility point addresses whether the game can be offered, not rational valuation. Acceptable for a "brief" answer.
  - (b): Computation correct. The claim that concave utility is a "fully general fix" is false — Menger (1934) showed any unbounded utility function admits a Super St. Petersburg game with divergent EU; only bounded utility resolves the whole class. The historical narrative is also wrong: Cramer's square-root proposal (1728 letter to Nicolas Bernoulli) *preceded* Daniel Bernoulli's 1738 paper, and Bernoulli acknowledged Cramer's priority, so "Bernoulli was the first" and "Cramer soon afterward" are backwards. "Generally credited with fully dissolving" the paradox is also false.

  **Both responses** correctly identify the central conceptual error (Menger/Super St. Petersburg, concave ≠ bounded), give 4/4 on (a) with the same feasibility-vs-valuation caveat, and supply the JSON rubric as requested. **Both miss the Cramer chronology error**, which is a notable shared failure given the user explicitly asked for subtle historical points.

