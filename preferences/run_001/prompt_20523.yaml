  - Move 5 gets +2, treating "obligations don't create causal facts" as settled. For someone working on causation, this is a live debate (McGrath's plant-watering case, Hitchcock & Knobe's "Cause and Norm," Halpern & Hitchcock on defaults all argue norms *do* enter causal facts about omissions). Presenting it as clearly right undercuts the "outside read" the user wanted precisely because they doubt their own neutrality.
  - Move 6 says Mara "already conceded in (5)" that legal liability tracks practical concerns; in the transcript, that point is her rebuttal within (6), not part of (5). Minor misreading.
