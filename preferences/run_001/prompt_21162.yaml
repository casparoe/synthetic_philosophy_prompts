  It also identifies the real tension as instrumentalism versus volition — tolerance handles means but can't validate ends, since Carnap was a non-cognitivist about ethics, which checks out against his 1935 "Philosophy and Logical Syntax." I'm noting a subtle issue though: tolerance is properly about logical/linguistic frameworks, so applying it directly to economic systems like planned versus market economies is a stretch that both responses make, though the user's own framing may invite this analogy.

