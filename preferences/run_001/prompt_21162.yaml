  For sharpening, three options are offered: instrumentalist, political (tolerance designed to strip reactionary metaphysics), and a synthesis where tolerance governs frameworks while volition governs ends — the synthesis is strongest since it captures the non-cognitivism angle, while the political framing is more provocative and historically shakier. The scholarly citations to Reisch, Cartwright, and Uebel check out.

