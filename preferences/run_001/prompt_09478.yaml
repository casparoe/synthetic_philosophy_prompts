  I also want to weigh whether this clashes with his anti-teleological commitments from the Ethics, or whether that's beside the point since he's appealing to experience rather than purpose. Then I need to actually settle who was closer to right between the user and Priya.

  Looking at the structure itself: Spinoza asks whether women's subordination is by nature or institution, and if institutional, why they'd be excluded at all. He answers via "experience"—no society has had joint rule by sexes, men always rule, and both sexes seem to function harmoniously under this arrangement. He addresses the Amazon case by arguing it doesn't count as a counterexample since they excluded men entirely rather than ruling alongside them. From there he draws a counterfactual: if women were naturally equal in strength of character and ability—which grounds human power and right—surely among the many nations we'd find some where both ruled together and others where men were subjugated by women.

  The critical parsing issue is the clause "and so brought up, that they can make less use of their abilities." Grammatically this modifies the *men* in the counterfactual scenario where women rule—meaning if such a nation existed, we'd expect the ruled men to be raised in a way that diminishes their capacities, mirroring what happens to subordinated women in actual societies. Since no such nation exists, Spinoza concludes women lack natural equality with men. He backs this with a secondary argument about the passions: male lust and jealousy make joint rule inherently destabilizing.

  But this argument is actually question-begging—Spinoza admits that observed inferiority is a product of upbringing/subordination, yet uses that same observed pattern as evidence of natural inequality rather than social construction.

  So the actual argument is more subtle than "women appear weaker, therefore naturally inferior" — it's that the invariant direction of subordination across cultures implies a natural cause, since mere upbringing would produce variable outcomes. That's a legitimate inferential move in principle, but it's fallible: universal patterns could still stem from universal non-natural causes, like shared physical differences interacting with reproduction, without establishing genuine inferiority.

  There's also a deeper tension in Spinoza's own metaphysics worth noting: since everything is natural for him, the nature/institution dichotomy dissolves entirely — institutions are themselves natural, so "by nature or by institution" can only really mean "necessary given human constitution versus contingent on arrangement." A strong answer should catch that the user's reading of the "so brought up" clause is slightly off, but gestures at something real — Spinoza does acknowledge upbringing shapes capacity, and the argument tries to sidestep that problem by leaning on universality rather than directly observed capacity differences.

  The bigger flaw, though, is the leap from "no counterexample exists" to "therefore natural cause" — this ignores alternative explanations like physical strength differences shaping early societies without implying inferior governing ability. And his treatment of the Amazons is oddly dismissive: they're actually the counterexample he claims doesn't exist, since they had women ruling, though he frames it as women ruling only by excluding men entirely rather than ruling over them.

  On teleology, the Ethics rejects final causes, and in this passage Spinoza leans on experience and a counterfactual rather than nature's purposes, so that criticism may be somewhat off-target — though there's a deeper tension since his naturalism treats institutions as part of nature too, making the nature/institution distinction awkward for his own metaphysics.

  Actually the more important point is that Spinoza's power=right doctrine makes the argument formally valid on his own terms: if women really do have less power, then his framework legitimately grants them less right, so the flaw isn't in the logic but in the contested empirical premise about women's power, which is exactly what the user's first hypothesis was pointing at.

