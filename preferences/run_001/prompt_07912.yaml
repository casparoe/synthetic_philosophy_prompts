  - Arpaly: "Arpaly uses Huckleberry Finn to refute Kant's theory" overstates both the force ("refute") and the target (Arpaly's target is the class of views requiring a correct conscious judgment, which the instructor's own prompt frames as such; whether Kant's view demands this is contested, notably by Markovits herself). The rubric's "appropriate scope" wording looks designed to catch this.
