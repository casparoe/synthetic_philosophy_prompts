  **Net:** Identical scores and a shared blind spot on Arpaly's scope keep the gap from being huge, but B's comments are more accurate, more checkable, and avoid A's affirmatively misleading endorsement and vague Markovits rationale — which matters given the user intends to pass comments to the instructor.

