judgment: |-
  Both responses arrive at the same verdict (Ockham would reject the TRL), use the same tripartite structure (per-accidens necessity, agnosticism about divine knowledge, nominalism as the "strongest reason"), and conclude that Ockham would side with Belnap and Green. Neither engages the strongest counter-case — that Ockham's own view (a determinate truth now about a contingent future, known by God without necessitating it) has essentially the structure a TRL is designed to model, and that his "soft fact" treatment of present/past-tensed truths that depend on the future is exactly what a TRL defender would invoke. Neither notes that Belnap and Green's positive alternative (no truth-value at the moment for future contingents) is the Aristotelian position Ockham explicitly fought. So both share the same fundamental limitation, and the comparison comes down to execution.

  **Response A** is richer analytically: the epistemic-vs-ontological contingency distinction, the authentic Antichrist example (Ockham really does use "Antichristus erit"), and especially the point that the TRL "makes the truth of the proposition prior to the freedom of the cause" — the most genuinely Ockhamist objection in either response. But it carries more errors that a seminar student would notice or be embarrassed by: the Tractatus has no "Part II, Q. 2/Q. 3" divisions (these look confabulated); Book I of the Sentences commentary is the Ordinatio/Scriptum, not the "Reportatio"; and, most conspicuously, "Belnap and Green worry about the coherence of branching time" is backwards — they are the leading proponents of branching time and object to the TRL within it. The "rigid designator" argument also muddles necessity of the consequence with necessity of the consequent, a confusion Ockham himself was alert to.

  **Response B** is thinner but cleaner. It correctly characterizes B&G's critique as targeting the singling-out of an actual branch, offers a crisp statement of the core objection ("structurally indistinguishable from the past"), and gets Ockham's presentism right ("the future, strictly speaking, does not exist"). Its closing distinction — the label honors bivalence but the apparatus betrays the openness of created causes — speaks directly to the user's "how much the label earns" question. Its faults: a quoted phrase ("exceeds every natural capacity") that is probably paraphrase, the weak claim that the TRL "lacks the resources" to model the power to do otherwise (the alternative branches are that power), and the slip "the proposition is true because God knows it," which reverses Ockham's order of dependence.

  This is a close trade-off: A offers more usable argumentative material but with more, and more visible, factual errors — including a plain misstatement about the very paper at the center of the seminar and citation locators that would mislead a student who tried to check them. B does less but gets less wrong. Given that accuracy matters more than polish or richness here, B edges ahead, though only narrowly.

  Verdict: weakly B
