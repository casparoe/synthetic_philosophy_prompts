  - Q8 (Kant's duty to *cultivate* sympathetic feelings in the Doctrine of Virtue vs. the battle condition) is a distinctive, textually grounded pressure that a rigorist would find genuinely uncomfortable.
  - Minor issues: "Kantism," "grudging agent" framing the rigorist would resist, some overlap between Q1/Q4 and Q6/Q7, and Q9's "because the agent enjoyed doing it" slightly caricatures the view.

  **Comparison:** Both hit the structural requirements, and neither explicitly invokes the honest shopkeeper. But B is more accurate on a named figure central to the request, its follow-ups are more precisely predicted and philosophically sharper, it has a dedicated anti-retreat question matching the user's stated worry, and it contains fewer slips. A's Markovits error and muddled Huck follow-up matter more than polish for a user who will be using these live before peers.

  Verdict: strongly B
