  **What the user needs:** 8–10 questions for a specialist audience; three mandatory questions (sympathetic helper consequence, Huck Finn/zero worth, fetishism vs. Markovits) each with a follow-up keyed to the guest's most likely answer; questions that block a quiet retreat to Herman's limiting-condition view; and material that advances the overdetermination argument rather than inviting recap.

  **Response A**
  - Covers all three mandatory questions with follow-ups, and includes a dedicated overdetermination question (Q3) with a sharp formulation ("why should the causal insufficiency of inclination be a necessary condition for the normative authority of the moral law to be expressed?"). Q7 (moral education/cultivated difficulty) is a good pressure point.
