  **Equilibrium selection.** B is clearly stronger: the folk theorem framing, BullyBot/DeadlockBot, the meta-level point that coordination has just moved up to proof systems, and especially the bargaining argument ("Löb gives you locking, not bargaining"; the 55/45-split bot; "commitment to *what*?"). A's Marcus does push on it ("compatible" vs "nice" equilibria, tiny basin of attraction, Schelling point on logics) but with less development, and the dialogue drifts into open-source mandates, "the alignment doomer card," and nations swapping nuclear codes.

