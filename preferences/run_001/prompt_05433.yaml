judgment: |-
  Both responses nail the central point the journalist needs: the original Church-Turing thesis is about *computability* (what can be computed at all), quantum computers only affect *complexity* (how fast), a Turing machine can simulate any quantum computer, and the thing the researchers are actually gesturing at is the *Extended* Church-Turing thesis. Both correctly warn against "impossible" in favor of "intractable," and both give usable framing language. On the core substance they are equivalent and correct.

  The differences are in what each adds beyond that core.

  **Response A** adds a section on the "Physical Church-Turing Thesis." This is the weakest part of either response: it describes the Physical CTT as suggesting "physics itself limits computation," which is a muddled paraphrase (the Physical CTT is usually stated as "every physically computable function is Turing-computable" — and it is *not* falsified by quantum computers). The paragraph gestures at Deutsch's Church-Turing principle without clearly stating it, and the claim that physicists "usually mean this physical interpretation" is hand-wavy. It's not a damaging error, but it doesn't help the journalist much. A also answers the "why isn't this bigger news" question only implicitly ("because it isn't overturned"), and its "might take millions of years" line, placed right after mentioning Google's experiment, could lead the journalist to overstate the classical cost of replicating that particular result.

  **Response B** directly answers both of the user's explicit questions, with a dedicated "Why Isn't This Bigger News?" section that adds genuinely important context: the ECTT challenge has been anticipated since Deutsch in the 1980s, so the supremacy result was confirmation rather than shock; Google's task was a contrived sampling problem and classical algorithms have since narrowed the gap; and Shor's algorithm has never been run at a meaningful scale. For someone writing a quantum computing explainer, these caveats are exactly the kind of thing that keeps the piece from being dated or overhyped. B's minor imprecisions (calling CTT "a definition," the awkward "deterministic in terms of the state vector" parenthetical) are smaller than A's Physical CTT muddle. B's headline suggestions and pull quote are also slightly more directly usable.

  Both would serve the journalist well, but B is more complete on the questions actually asked and supplies more accurate, relevant context for the article, while A's extra section is its least accurate part.

  Verdict: weakly B
