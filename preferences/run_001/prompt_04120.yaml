  Actually, I realize the key insight: Jaynes' consistency condition concerns the chord distribution, not the midpoint per se. A line's "midpoint" is only defined relative to a specific circle's center — the same chord viewed from a displaced circle has a different midpoint, since it's the foot of the perpendicular from that circle's center. This is exactly why the dart-throwing method isn't translation-invariant: shifting the circle changes which point counts as the midpoint for the same line.

