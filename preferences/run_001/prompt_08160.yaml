judgment: |-
  **Question 1 (principle vs. prudence):** Both responses land on essentially the same reading — the objection is fundamentally jurisdictional ("public authority," not "private presumption"), with the consequentialist material explaining why jurisdiction is so assigned. Response A makes a nice point that a purely prudential argument would have to admit exceptions where tyrannicide goes well, and offers the judge/vigilante analogy that maps onto Aquinas's broader view that punishment of malefactors belongs to public authority. Response B offers a clean tripartite breakdown of the three prudential considerations actually present in the quoted text (misjudging good rulers, incentive effects on rulers, worse tyranny afterward), which engages the passage closely. Roughly even here.

  **Question 2 (consistency with the *Sentences*):** This is where they diverge. Response A applies the acquisition/use (usurper vs. legitimate-but-bad ruler) distinction cleanly and accurately, correctly notes the "no superior to appeal to" condition in the *Sentences*, and — crucially — points out that the same *De Regimine* chapter provides for deposition by public authority (the multitude if it provided the king, the superior if he did). That last point is what actually shows Aquinas isn't demanding passive obedience, and it's grounded in the text. The chapter context (a king falling into tyranny) supports A's reading that *De Regimine* is about legitimate rulers. A's only slip is placing the deposition passage in "the very next chapter (I.7)" when in most editions it's in the same chapter — trivial.

  Response B correctly cites *Sentences* II d. 44 q. 2 a. 2 and states the distinction, but then asserts that in *De Regimine* Aquinas "emphasizes" that "even if a ruler is a usurper" removal must be by public authority. The text says nothing about usurpers; this is presented as what Aquinas says rather than as one contested scholarly reading. B then wavers: it frames the shift as "development," but also claims the *Sentences* killing "functions as a public act" — which, if true, would mean there was no shift. The section is internally muddled, and the untextual claim is baked into the ready-made thesis statement B offers, which the student might adopt directly.

  **Bonus material:** A's Augustine–Aquinas–Machiavelli arc is a bit loose but relevant to the seminar and basically sound. B's authorship note contains useful information (Book II is largely Ptolemy of Lucca) but wraps it in a chronologically incoherent claim — that Aquinas in Book I was "tempering" views Ptolemy "would later expand on," when Ptolemy's continuation postdates Aquinas's death — plus an unsupported assertion that Ptolemy was "much more supportive of tyrannicide." A student who footnotes that could be called out.

  Given that accuracy matters more than polish, and B's errors fall on the harder of the two questions and in the paper-ready material, A serves the student clearly better despite B's good citation and argument breakdown.

  Verdict: strongly A
