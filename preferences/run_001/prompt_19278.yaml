  Crucially, revealed preference theory breaks down entirely when choices are inconsistent across framings, since no coherent utility function can be constructed from choices that flip with default options—this is the deeper point that coherence theorems only apply to coherent agents, and framing-dependent choice is exactly the incoherence that undermines the "utility maximizer by construction" claim. There's also the harder normative question of who gets to define someone's "true" preferences, which brings in Sugden's critique and Gul and Pesendorfer's argument against welfare paternalism.

