  **Response B's edges:** It explicitly notes that fatigue degrades both performance *and* metacognitive monitoring, which directly explains why the user's confidence feels identical — a well-supported empirical point. The "N=1 vs. the distribution" reference-class point and "train your process, not your gut" framing are useful. Downsides: the Dunning-Kruger mention is a stretch (hedged, but still off), "your confidence is noise / discard the feature" overstates things (a 3x bug rate doesn't make confidence worthless), and the closing claim that the bug rate dropping will repair gut calibration is logically muddled (if you stop approving at night, there's nothing to recalibrate against).

