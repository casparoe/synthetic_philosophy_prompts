  Both responses are competent, well-structured, and reach the same headline verdict (Wright handles the two problems better). Both formalize each theory's mechanics, walk through the heart-sound case as a correct output of Cummins's logic rather than a misapplication, and correctly identify that Cummins cannot privilege the organism over the diagnostic dyad without importing a normative filter his causal-role machinery cannot generate. The divergence is in how they treat the second half of the question — repairability without borrowing.

  **Response A** argues neither theory can be fully repaired internally: Cummins needs history, and Wright needs current utility to handle immediate co-option. It ends by suggesting a hybrid. Strengths: it directly flags the residual "how much selective history counts" problem ("the theory lacks a metric"), and it has a nice comparative framing ("history is slow; causality is ubiquitous"). Weaknesses: its claim that Wright "must admit current utility can ground function" only follows if one treats the pretheoretic intuition about instant co-option as decisive — which is precisely what the prompt asks the answerer not to do. It also has a small internal tension: it says Cummins's view loses the ability to distinguish malfunction, then says a silent heart "malfunctions relative to the diagnostic system." The final sections are somewhat redundant.

  **Response B** gives a more differentiated answer: Cummins's flaw is an internal dead end (repair requires Wright's history or a third resource like organizational closure), whereas Wright's flaw is partly repairable internally via the origin→maintenance shift (Godfrey-Smith's modern history, which still requires selection rather than mere contribution) and, for the immediate case, can be consistently resisted as a theoretical cost rather than a mechanical failure. This is more faithful to how the etiological program actually handles exaptation and more responsive to the prompt's instruction to separate mechanics from intuitive verdicts. B's formulation of Wright's two conditions is also closer to the original. Its weakness is that it doesn't acknowledge the residual vagueness of "recent" selection that the modern-history move leaves behind, and it doesn't consider whether Cummins could bite the bullet symmetrically.

  On balance, B's treatment of the repair question — the non-obvious part of the prompt — is sharper and more accurate, while A's advantages (flagging the "how much" metric, the hybrid suggestion) are real but smaller. The margin is modest.

  Verdict: weakly B
