thinking: |-
  I'm looking at a question about whether Harsanyi's theorem actually justifies committee members reporting vNM utilities and averaging them to rank grant proposals, and what philosophical or practical caveats a PhD student on such a committee should raise.

  The critical issue is that Harsanyi's original theorem assumes agents evaluate the same objective lotteries with shared probabilities, but here the committee members agree on outcomes yet disagree about probabilities of success—this shifts the problem into subjective uncertainty territory. Under that framework the aggregation result depends on a common prior assumption, and when priors diverge there are well-known impossibility results in the literature (Mongin, Hylland & Zeckhauser, Broome, Gilboa-Samet-Schmeidler) showing that naive averaging can violate Pareto or produce incoherent aggregate beliefs.

  So the divergence in this case is a belief disagreement rather than a values disagreement, meaning simple expected-utility averaging isn't justified—Mongin's work shows a Bayesian aggregator satisfying Pareto with heterogeneous priors is essentially impossible except in degenerate cases, while Gilboa-Samet-Schmeidler's fix requires separately averaging beliefs and utilities under a restricted Pareto condition. I'm also noting the risk of "spurious unanimity," where people agree on a policy for entirely different (belief vs. value) reasons, which can make Pareto-based reasoning misleading.

  Another key point: Harsanyi's theorem doesn't dictate equal weights—it only guarantees some set of positive weights under strong Pareto, so equal averaging requires additional normalization assumptions about interpersonal utility comparability, since vNM utilities are unique only up to affine transformation (this is where Sen and Weymark's critiques come in). There's also a subtlety about whether we're averaging utility functions over well-defined outcomes versus over lotteries/proposals—if everyone already shares similar outcome evaluations, the averaging becomes nearly trivial.

  Given this committee shares values but differs on beliefs, the sensible approach is to fix a shared utility function over outcomes, then aggregate the divergent probability estimates separately using something like linear opinion pooling, geometric pooling, or a Delphi-style deliberation process, before computing expected utility. Linear pooling satisfies marginalization but not external Bayesianity, while geometric pooling is the reverse (McConway's result), and there's also the Gilboa–Samet–Schmeidler result showing that under a restricted Pareto condition, social preference decomposes into linear aggregation of both utilities and beliefs separately.

  I'm also noting that averaging probabilities isn't always ideal if some committee members have better information — deliberation and evidence-sharing (Aumann-style agreement) may work better than blind averaging. Harsanyi's theorem also says nothing about incentive compatibility, since members could misreport their utilities or beliefs strategically, and crucially, if the committee agrees on utility values over outcomes, averaging those utilities is harmless — the real disagreement and the real gap in Harsanyi's theorem is about whose probabilities to use when ranking proposals.

  Now I'm turning to look at Response A. It opens by flagging the "category error" and lists implications, starting with the common priors assumption underlying Harsanyi's result. I notice it claims the theorem requires Pareto and IIA — but IIA is actually Arrow's condition, not part of Harsanyi's aggregation theorem, which instead relies on vNM axioms plus Pareto indifference, so this looks like a minor inaccuracy or conflation. It then contrasts the committee's situation as roughly the inverse problem: shared utilities but diverging probability estimates.

  The response correctly notes that averaging vNM expected utilities from differing priors amounts to aggregating beliefs rather than values, and that Harsanyi's theorem offers no normative justification for averaging probabilities in that way. It cites Mongin (1995) and Gilboa, Samet & Schmeidler (2004) as showing you can't generally satisfy Pareto for both beliefs and tastes without dictatorial restrictions — Mongin's impossibility result fits, though GSS's paper is actually more of a possibility result under restricted Pareto, so the citation is a bit imprecise but in the right conceptual territory, since GSS do show that under shared beliefs and tastes, social utility and belief become linear combinations of individual ones.

  It also flags interpersonal comparability issues correctly — vNM utility is unique only up to positive affine transformation, so naive averaging without normalization is meaningless, and recommends normalizing first. And it constructs a clean example of the ex-ante vs. ex-post Pareto conflict, showing how averaging expected utilities across members with different certain beliefs about states can produce an outcome that's worse in every actual state than an alternative, violating ex-post Pareto even while satisfying ex-ante Pareto.

  Actually, checking the math with common utilities and opposing certain beliefs, both proposals average out to the same expected utility with no real dominance—the claimed ex-post violation doesn't materialize. So Response A's specific illustration is flawed even though the underlying point about ex-ante aggregation conflicting with ex-post evaluation under heterogeneous beliefs is a legitimate concern in the literature.

  The strategic manipulation point is valid but is framed as more of a contrast between Harsanyi's representation result and mechanism design concerns, which is a fair observation. The recommendation to decouple beliefs from values, normalize utilities, aggregate beliefs separately, and cite the real opinion-pooling literature (Genest & Zidek) is solid. Overall Response A is well-organized and mostly sound, marred by that one flawed example and a minor slip on IIA — now I'm turning to look at how Response B opens its analysis.

  Response B similarly lists three implications, distinguishing doxastic disagreement from axiological disagreement. On the common probabilities assumption, it correctly states the additive utilitarian formula and notes the requirement for a shared probability distribution, framing Harsanyi's theorem as justifying value aggregation under shared risk rather than expectation aggregation under divergent uncertainty. It also brings in Mongin's spurious unanimity critique with a reasonably accurate example of two members preferring the same proposal for opposite reasons about likelihood versus value, producing a social preference neither truly endorses — though the phrasing about linear aggregation "violating" Pareto is slightly imprecise, since the real issue is that Pareto itself becomes questionable under spurious unanimity rather than aggregation violating it.

  On ex-ante versus ex-post utilitarianism, it describes ex-post as aggregating utilities over outcomes before taking a social expectation, and ex-ante as aggregating individual expected utilities first. Labeling ex-post as "Harsanyi's Domain" strikes me as questionable, since Harsanyi is usually associated with the ex-ante approach via his impartial observer argument, and Diamond's critique specifically targets that ex-ante framing — though with common probabilities the two approaches coincide, so it's a minor rather than major error.

  I'm also weighing the passage about heterogeneous priors: the claim about "money pump" scenarios and everyone "knowing" a project will fail feels muddled and not quite standard terminology, though B's underlying point that ex-post aggregation requires a social probability is sound. There's a genuinely sharp observation too — that averaging expected utilities with normalized common utilities is equivalent to linear opinion pooling over probabilities rather than true ethical aggregation of utilities, which is correct and insightful.

  On the citation of Madansky (1978) on externally Bayesian groups, the reference is real, but B's framing of the impossibility result as "keeping marginalization properties intact" is a bit garbled — linear pooling actually satisfies marginalization but fails external Bayesianity, so the point is roughly in the right neighborhood but imprecise. The section on interpersonal comparability and calibration checks out, correctly noting that normalizing utilities to 0/1 for success/failure collapses the utility function into a probability.

  B also flags that if members weight success differently based on research interests, the interpersonal comparison problem resurfaces, and rightly notes Harsanyi's theorem doesn't itself justify equal weighting — a solid point. Its recommendation is a two-stage fix: standardize values first, then aggregate beliefs separately via averaging or Delphi, and compute expected value from that — essentially inverting the flawed procedure. Overall B is coherent and mostly correct, with only minor muddled points, and doesn't have a glaring failure like A's third section; both A and B converge on the same diagnosis and recommended fix.

