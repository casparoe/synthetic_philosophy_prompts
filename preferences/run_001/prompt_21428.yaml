judgment: |-
  **What the user asked for:** 8–10 non-restating interview questions for a mesa-optimization/deceptive-alignment proponent, with three mandated topics (GMG vs. reward hacking, evolution vs. SGD credit assignment, backdoored model organisms), each with a follow-up keyed to her most likely answer.

