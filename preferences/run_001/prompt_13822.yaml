  B is somewhat better structured and has one sharper technical framing; A is fully compliant with the "each with a follow-up" instruction and contains no error that would embarrass the journalist in front of the expert. Given that correctness and doing what was asked outweigh polish, A edges ahead, but the trade-off is real.

