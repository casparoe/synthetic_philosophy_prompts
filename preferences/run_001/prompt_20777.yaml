  - **Part (c):** This is the real hidden gap. The student's argument is "infinitely many programs → infinite time → uncomputable." That misdiagnoses the source: infinite sums are routinely computable (M is in fact lower semicomputable by dovetailing). The obstacle is the halting problem — you can approximate M from below but never know when you've captured all halting programs. The student mentions "see whether it halts" only in passing; the structure of the argument rests on infinitude. In a graduate seminar on exactly this material, that is precisely the "sounds right but reflects a real gap" case the TA was worried about, and it should have cost points.

