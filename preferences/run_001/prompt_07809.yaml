judgment: |-
  Both essays are strikingly parallel — same title, same section architecture, same "relocation, not resolution" verdict, same brief contrast with Worrall's structural realism, and both accept the student's premise that the elastic ether was heuristically doing work in the Poisson-spot derivation. The differences are at the margins, so the question is which handles the prompt's specific demands better.

  **Reconstruction of selective realism.** B is slightly more faithful to Psillos: it names both prongs of his criterion (indispensability to novel predictions *and* independent evidential support) and states up front that the selective realist claims the criteria are *ahistorical* and applicable at the time of acceptance — which is the actual crux of the Psillos/Stanford dispute. A gives a decent version (constitutive vs. background, ether-refers-to-EM-field, caloric example), but mislabels the pessimist's inference a "fallacy of composition" (it would be division), and only surfaces the prospective-applicability claim late, in the verdict section.

  **Reconstruction of the objection.** Roughly equal. A's dilemma (begging the question vs. no guidance for current belief) is crisp and teachable, and A cites Stanford, whose 2003 paper is the canonical statement of exactly this objection — B omits Stanford entirely, a genuine gap for someone preparing a lecture. B's "tautology" framing and explicit posit-level reformulation of the PMI are also clear and usable.

  **Defending the verdict against the strongest objection.** This is where they diverge most. B picks the right opponent: Psillos's own claim that indispensability to novel predictions identifies working posits without hindsight, including the concession that the ether's mechanical properties may not have entered the actual derivation. B's rebuttal (logical indispensability in reconstruction vs. causal/justificatory indispensability in context; "beneficial anachronism"; "curating history") is on target, though it contains a slip conflating "used in the derivation" with "indispensable," and its 1818-transversality claim is anachronistic (transversality came in 1821 and isn't needed for the scalar diffraction result). A instead answers a weaker "you're setting the bar too high" objection, and its rebuttal via the No Miracles Argument is conceptually muddled — the NMA's explanatory claim doesn't depend on our *identifying* the true posits, and A never anticipates Psillos's standard reply that heuristic role ≠ epistemic contribution. A also sloppily says the strategy "does not solve the problem of induction."

  **Keeping selective and structural realism apart.** Both do this adequately and both make the somewhat facile claim that structural realism escapes the hindsight problem. B integrates the distinction into its argument a bit more consistently (intro, dedicated section, conclusion); A uses it well once in the defense section.

  Net: B better satisfies the prompt's most demanding instruction (engage the strongest available objection) and gives a slightly more accurate account of Psillos's position; A has the Stanford citation and a cleaner dilemma but a couple of philosophical slips a graduate-seminar instructor would notice. Small margin.

  Verdict: weakly B
