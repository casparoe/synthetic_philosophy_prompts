  Notably Kripke himself never claimed to solve this puzzle, and in "A Puzzle About Belief" he explicitly disavowed doing so. Given that rigidity and causal-historical reference are distinct theses that together still don't obviously bridge the cognitive gap, I'd put this claim around -1.

