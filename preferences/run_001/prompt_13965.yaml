  3. **Better calibration.** B calls acausal trade "a controversial, fringe hypothesis... not proven," which is accurate. A's "settled math for intelligences that share a specific decision-theoretic framework" overstates things — the gap between "identical" and "sufficiently similar" is precisely where the math is not settled.

