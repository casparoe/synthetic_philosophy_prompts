judgment: |-
  Both responses reach the same (correct) bottom line: there is no valid deduction from Dummett's semantic anti-realism to his immigration politics; the editor's hook conflates a semantic thesis about recognition-transcendent truth conditions with a social-constructionist claim about borders, and then jumps an is/ought gap; the defensible connection is temperamental/methodological (a shared demand for justification and hostility to "inaccessible" facts). Both also correctly identify Catholicism and justice as his actual motivations and both offer a rewritten opening. Structurally they are almost interchangeable, so the decision comes down to accuracy of the supporting details, which matters a lot for a journalist who will reuse them.

  **Response A** makes the category-mistake point especially cleanly (everyone, realist or not, agrees citizenship is an institutional fact, so anti-realism adds nothing), and its burden-of-proof section directly addresses the user's specific inference. Its proposed pull-quote ("taught us that truth requires verification... borders require justification") is a fair popularization. But its biographical details are shaky: it credits Dummett with "co-founding the Oxford branch of the Anti-Apartheid Movement" and "serving on the Commission for Racial Equality," neither of which I can confirm, and it omits the one group that actually matters (JCWI). A journalist copying those into print risks embarrassment.

  **Response B** gives correct, useful specifics: founding member of the Joint Council for the Welfare of Immigrants in 1967, the 2001 book, and Britain's historical responsibility to the Commonwealth as a central strand of his political argument — all accurate and all things the user explicitly needs ("co-founding activist groups back in the 60s"). The closing fact-check note is exactly the kind of help a writer wants. It also turns the user's "burden of proof" observation into the positive thematic link rather than just dismissing it, and makes a good editorial point that a semantic derivation would trivialize Dummett's moral seriousness. Its weaknesses: it presents an interpretive analogy ("Dummett viewed restrictive immigration laws as relying on... 'occult' mystery") somewhat as if it were his stated view, and its suggested line "a truth you can't verify is nonsense" mischaracterizes Dummett as a positivist — he denied bivalence for such statements, not their meaningfulness. A Dummett scholar would flag that.

  On balance, the analytic cores are equivalent; B's factual grounding is more reliable and more directly useful, while A's likely-invented biographical claims are a real liability for this user. B's "nonsense" slip is a genuine but smaller problem, confined to a suggested quote the writer can adjust.

  Verdict: weakly B
