  Turning to Death in Damascus, I recall Gibbard and Harper originally framed it as a challenge to causal decision theory rather than evidential decision theory. Under EDT the case resolves cleanly—since death is inevitable wherever you go, you should just minimize cost and stay put, giving a stable answer. Under CDT things get messier: since Death's location is already fixed independent of your choice, you should flee to wherever Death isn't, but your credence about Death's location depends on what you're inclined to choose, creating an unstable feedback loop rather than a settled recommendation.

  Since your choice location influences your beliefs about Death's location and vice versa, CDT can't converge on a stable decision—this is Gibbard and Harper's deliberational instability problem. Later theorists like Joyce and Arntzenius explored mixed-strategy equilibria as a fix, and this case became a key testbed for distinguishing CDT from EDT and FDT, with FDT notably recommending you stay put and accept the inevitable rather than pay to flee.

