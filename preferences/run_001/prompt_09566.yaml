  I'm working through the standard objections raised against this — Kavka, Parfit, and Kamm's point that a fair coin flip fails to weight each person's claim, plus the argument that adding more people to one side should increase that side's odds. I'm also recalling Parfit's counter in "Innumerate Ethics," where he defends comparing aggregate badness across outcomes and pushes back on Taurek's claim that the numbers don't matter, using examples like comparing one person losing a limb against another losing their life.

