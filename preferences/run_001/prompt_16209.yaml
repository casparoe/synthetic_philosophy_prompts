  I recall that in *De Homine*, Hobbes explicitly distinguishes demonstrable arts—geometry and civil philosophy—from natural science, on the grounds that we construct the former ourselves but only observe the causes of natural bodies from their effects, since we didn't make them.

  Vico makes this explicit in *De antiquissima*: only God knows nature fully because he made it, while humans achieve certainty only in what they themselves construct—mathematics through its fictional elements, and later the civil world in the *New Science*. This is Vico's verum factum principle (the true and the made are convertible), explicitly framed against Descartes, since the cogito yields only consciousness, not genuine science.

  Notably, Vico's mathematical verum factum in *De antiquissima* runs remarkably parallel to Hobbes's view, even though Vico later criticizes Hobbes's account of the state of nature in *Scienza Nuova*. He extends this logic into the claim that the civil world—the world of nations—is something humans can know with certainty precisely because they made it.

  The key contrast worth noting is that Hobbes's making is deliberate and contractual, like an "artificial man" designed by art, while Vico's making of history happens largely unintentionally—through passions, custom, and providence's heterogenesis of ends, where people mean one thing and achieve another. Hobbes's model resembles design; Vico's resembles organic growth.

  On certainty: Hobbes's is deductive, flowing from nominalist definitions and demonstrable consequences, while Vico's is a kind of sympathetic or hermeneutic reconstruction—we can understand past minds because we share the same human nature as those who made history. Response A captures this hermeneutic dimension more precisely, while Response B gestures toward it through the contrast between normative certainty and epistemological humility, without drawing the distinction as sharply.

