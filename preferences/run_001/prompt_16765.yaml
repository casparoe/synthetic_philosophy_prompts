judgment: |-
  **What the user asked for:** an 800–1000 word story in a made-up medieval-ish kingdom, two council figures on opposite sides, with the disagreement tracking the real Thomistic distinctions (usurper vs. legitimate-ruler-gone-bad; private individual vs. public authority) rather than generic violence pro/con, ideally with an ending that turns on one of those distinctions. The user also flagged the Jean-Petit/Constance-style episode as something that made the debate feel real.

  **Shared ground:** Both stories use nearly the same scaffold (council chamber, vial of poison, sealed scroll, "tyrant by exercise / not by title," anointing by the Archbishop, "you teach every disgruntled knight…"). Both land around 700 words, undershooting the requested range by a similar margin. Both correctly deploy the *ex defectu tituli* / *ex parte exercitii* language and the private-vs-public standing point, and both avoid the assassin-in-the-throne-room cliché.

  **Response A:** Clean and readable, with a nice closing symmetry ("God help us if the Estates are cowardly" / "God help us if we are impatient") and a good aphorism about murderer vs. magistrate. But it has a couple of accuracy/fit problems for a graded seminar piece: Jorian says "Aquinas writes that to kill a legitimate king… is sedition," which is a shaky paraphrase — in ST II-II q.42 Aquinas actually says disturbing a tyranny is *not* sedition unless it causes greater harm, and puts the "private presumption" warning elsewhere. Name-dropping Aquinas inside a fictional kingdom is also clunky. The writ convening the Estates against the king is oddly sealed with the king's own signet. The ending turns on the authority distinction, but in a fairly straightforward way (Celia agrees to wait).

  **Response B:** Rougher prose ("hung the miller," "a tax arrears," the capitalized "Public Authority/Public Force," a clunky final line). But it does more of what was specifically asked. It handles sedition more accurately (tying it to the "disorder worse than the tyranny" condition). It works in the fictionalized Jean Petit episode ("Father Julian… condemned… because he claimed a power he did not possess"), which the user explicitly said made the topic feel alive. Most importantly, the ending genuinely turns on the interplay of *both* distinctions: the Estates' prior deposition converts the legitimate king into a de facto "private aggressor holding the throne by force" (i.e., usurper category), Kaelen immediately draws the textbook inference ("Then I can kill him"), and Morwenna closes the door again because public authority has already engaged and execution belongs to its agents — which tracks Aquinas's "no recourse to a superior" caveat and ST II-II q.64 a.3. That's a much more textured use of the material than A's single-distinction resolution. One could argue Morwenna's reversal reads as slightly slick, but it is defensible on the texts.

  **Weighing:** A is a bit more polished and its debate feels a touch more balanced; B has some grammatical slips. But the user said correctness and delivering the asks matter more than polish, and on those axes B is better: more accurate on sedition, no misattribution, includes the court-drama reference, and a cleverer ending that dramatizes exactly the usurper/legitimate distinction the user said had been "stuck in my head." The structural similarity and the shared word-count shortfall keep the gap from being enormous.

  Verdict: weakly B
