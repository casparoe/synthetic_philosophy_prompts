  Williamson's actual argument against KK in chapter 5 runs separately through margin-for-error reasoning — using cases like judging a tree's height or a stadium crowd's size — but conceptually, if "knows p" is a non-trivial condition, then by the anti-luminosity theorem it can't be luminous, meaning one can know p without being positioned to know that one knows p, which directly undermines KK.

  The precise entailment: KK says knowing p implies knowing that one knows p, which entails being in a position to know one knows p — that's just luminosity of knowledge. So anti-luminosity of "knows p" directly refutes KK by contraposition, since it exhibits a case where one knows without being in a position to know one knows. This is exactly the step both possible answers converge on, and it sets up how a student might reapply the same margin-for-error argument treating "knows that p" as the condition C, letting evidence degrade gradually across cases.

