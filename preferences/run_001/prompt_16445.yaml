  This maps directly onto the user's question: under Bratman, the defector is essentially just breaking an ordinary promise or violating reliance, whereas under Gilbert the four others are owed something distinctively — a sui generis directed obligation from joint commitment, not reducible to promissory obligation. In fact Gilbert goes further and treats promising itself as a species of joint commitment, a nuance neither response captures.

