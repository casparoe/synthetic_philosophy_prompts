thinking: |-
  I'm checking the philosophical accuracy of each point: Frankfurt's 1969 argument against the Principle of Alternate Possibilities, the Black/Jones counterfactual intervener case, and the "flicker of freedom" defense strategy—verifying its origin traces to Fischer's coinage describing van Inwagen and others' attempts to preserve PAP.

