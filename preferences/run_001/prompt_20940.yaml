  But then I reconsider with imperfect correlation instead of perfect symmetry: if my cooperating only weakly raises the probability other agents cooperate, the expected extra benefit scales as N times that small correlation times my value's weight in the compromise, while my cost stays fixed at what I sacrifice locally.

  Working through the algebra, equal weighting across N agents actually breaks the naive case—it would require correlation greater than 1, which is impossible. So the real justification must rest on comparative advantage (agents facing different opportunity costs) rather than simple symmetric weighting, or on a more careful Oesterheld-style treatment where cooperating shifts my credence about the broader distribution of decision procedures rather than just adding a fixed probability per agent.

