  I'm digging into Oesterheld's ECL paper and trying to unpack why the "large world" premise matters beyond just being background assumption—looking at whether it plays a role in guaranteeing correlated decisions exist, or something more structural.

  Oesterheld ties the size of the universe (likely spatially infinite) to the near-certainty that agents sharing similar decision procedures but different values exist somewhere, which underpins the compromise logic that makes ECL work.

  Actually, what matters more is the ratio of correlated agents to yourself, not sheer numbers—with N correlated agents adopting the compromise utility function, each benefits from the collective shift even though your own values become a smaller fraction of the whole; but the trade remains beneficial precisely because diversity creates gains, not because your stake vanishes.

  In the twin PD, gains from trade exist with just two agents, so the "large world" requirement in ECL must be doing something else—likely it's about (a) not knowing who your correlated partners are, so a large world raises the odds of finding diverse ones, (b) robustness of the compromise given variety in comparative advantage, and (c) the fact that any single correlation may be weak but sums up across many agents. Oesterheld's "multiverse-wide" framing seems to hinge on existence and diversity of correlated agents rather than sheer scale alone.

  I'm also noting that the correlation needn't be with an exact "twin"—it just needs agents with similar-enough decision procedures, and partial correlation can still work if gains from trade are big enough. That makes Response A's framing of "acausal vs. causal impact" via c versus N×a feel like a mischaracterization, since ECL is really about choosing which values to causally promote given a compromise, not pitting acausal cooperation against local altruism as separate options.

