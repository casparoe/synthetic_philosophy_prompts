  **Where they differ / slip:**

  *Response A*
  - Repeatedly (three times) locates the Cornaro passage in *Ecce Homo*, even telling Maya "you nailed the text (Ecce Homo)" — Maya never named a text for Cornaro, and the passage is actually in *Twilight of the Idols* ("The Four Great Errors"). That's a confident misattribution that Maya could carry into her revision.
