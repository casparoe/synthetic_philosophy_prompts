judgment: |-
  **What the user needed:** a warm, jargon-free 3–4 minute speech that (1) doesn't concede Priya's "anyone would've done it" line as literal truth, (2) doesn't imply the kids who stayed on shore are blameworthy, (3) keeps her award from being flattened into the mandatory volunteer pins, and (4) survives scrutiny from a philosophy teacher listening for the supererogation logic.

  **Both** land in the right length range, keep the word "supererogation" out, clearly say the bystanders aren't blamed, and separate duty (volunteer hours) from what Priya did. Each also has one small logical wobble a philosophy student could poke: A's "by every standard rule of safety, the right move was to run" (if that was *the right move*, was hers wrong?), and B's thesis sentence "doing what the situation needs, even when you aren't supposed to" ("not supposed to" reads as *prohibited*, not *not required* — which is the exact category confusion supererogation is meant to avoid).

  **Where A is stronger:** It handles the two concerns the user seemed most worried about more cleanly. On Priya's modesty, it reframes rather than refutes: "she's telling us who she *wishes* we all were," then closes with "we aren't required to be heroes, we are all capable of it" — which reconciles her line with supererogation instead of contradicting her onstage. On the "different tier" worry, it says outright "It's not to say that everyone else is below" and "heroism isn't about being a different species." The "saint"/"hero" phrasing is a quiet wink at the Urmson title and the Wolf point for the four classmates. The structure is also tighter and the opening gets to the story faster.

  **Where B is stronger:** It draws the volunteer-pin distinction most sharply and memorably — "There was no graduation requirement on the line," "You can't mandate jumping into a freezing pond. You can't schedule courage." It also explicitly mirrors the user's own two-horned dilemma ("just normal" vs. "superhero who doesn't feel fear"), which the user would recognize and appreciate. 

  **Where B stumbles:** The closing — "you said anyone would have done it. We wish that were true. But since you're the one standing here… we know it wasn't" — publicly contradicts the honoree as the final beat and, by pointing at the fact that others didn't act, edges back toward the very "everyone else fell short" implication the user wanted to avoid, undercutting the earlier "nobody is blaming anyone." The weather-report opening is also filler. And "mandatory" said aloud right before those students get pins is a bit pointed, though defensible given the user's stated goal.

  Minor invented details on both sides (A's "seventh grader," B's "safe at home with his family") that the user would need to check.

  On balance, A more reliably threads the specific needle the user described — praising Priya without demoting anyone — and handles the modesty line with more grace, while B wins on the sharpest lines about the pins. That's a real trade-off, but A's advantages fall on the concerns the user emphasized most.

