judgment: |-
  **What the question needs.** The user wants (1) the specific step of the Predd et al./Joyce dominance proof that breaks under mere propriety, (2) a genuinely proper-but-not-strictly-proper toy rule and what happens to the dominated set, and (3) the strict propriety/immodesty relationship.

  **Part 1.** Both responses locate the failure in the same place: the Bregman-projection step, where strict propriety guarantees the divergence between an incoherent $c$ and its coherent projection is strictly positive, yielding strict inequality in every world; mere propriety allows "flat spots" so the divergence can be zero and you get ties rather than dominance. B frames this a bit more crisply via the Projection Theorem. A has a sign slip—it says the Savage function $G$ for a proper *inaccuracy* measure is convex and calls Brier's $p(1-p)$ "strictly convex" (it's concave). That's a real error in exposition, though correctable by the reader.

  **Part 2 — the decisive difference.** Both responses visibly flounder with false starts left in the text. But they land in very different places.

  A's final examples are correct: the trivial constant score (proper, not strictly proper; nothing is dominated—the argument becomes literally vacuous, matching the user's word), and a local score flat on an interval containing both 1/3 and 1/2, so incoherent $(0.5,0.5,0.5)$ ties world-by-world with coherent $(1/3,1/3,1/3)$ and hence escapes strict dominance. These are legitimate illustrations, if inelegant, and the conclusion about the dominated set (it shrinks; some incoherent functions escape) is right.

  B's examples are all misclassified. The "flat-zone-near-truth Brier" is improper (an agent with $p=(0.85,0.15)$ does better by reporting $(0.9,0.1)$). The "pass/fail around 0.5" rule is improper (everyone prefers reporting 0.5). Most seriously, B settles on **absolute loss** and asserts it is "proper but not strictly proper" and "the standard example of non-strict propriety." This is backwards: the linear/absolute score is *the* canonical example of an **improper** rule in this literature—it incentivizes extremizing ($p=0.7$ does better reporting 1 than 0.7). B's own remark that it "elicits medians, not means" is exactly why it fails to elicit $p$, yet B draws the wrong conclusion. B's worked calculation is arithmetically fine but demonstrates the collapse of dominance under an *improper* rule, so it does not answer the question asked, and it would actively mislead an advanced seminar student on the very concept they're trying to understand. B's immodesty illustration ("$p=0.5$ expects any $c$ to be equally good under absolute loss") also rests on this misclassification.

  **Part 3.** Roughly comparable. Both correctly say immodesty is a property of a credence function relative to a measure, strict propriety is "every probability function is (strictly) immodest," and they come apart in scope. A adds the useful points that incoherent agents are modest even under strictly proper rules (they "condemn themselves") and that demanding immodesty of all coherent credences is what forces strict propriety (the Pettigrew-style argument). B adds the "locally strictly proper" point. Slight edge to A.

  **Overall.** Both are unpolished and both contain a technical error, but A's error is a fixable sign convention that doesn't infect its delivered examples, whereas B's error is a confident, false claim about propriety itself—the core concept of the question—embedded in the centerpiece example the user explicitly requested. Given that correctness on what was asked outweighs polish, A serves this user clearly better.

  Verdict: strongly A
