  The user wants me to unpack the distinction Hume draws between "contrary to experience" and "not conformable to experience," assess whether it can bear the philosophical weight he places on it, and consider whether the Indian prince example overgeneralizes into unreasonable dogmatism about things that turn out true — plus they've flagged that contemporaries used this same objection against Hume, so I should engage with the substance directly rather than vaguely.

  Let me pin down the passage itself: it's the footnote in Section X, Part I, where Hume clarifies that the Indian prince couldn't have had experience of frost failing to occur, since freezing water is a new phenomenon outside his prior observations, making his skepticism a matter of failed analogical reasoning rather than direct contradiction of experience.

  A miracle, in contrast, would be an event contrary to uniform experience under the same circumstances. Both responses I'm comparing capture this general idea, though Response B's framing that the frost "introduces a variable he hasn't encountered" while staying "consistent with the broader laws of matter" tracks Hume's own footnote more closely than Response A's simpler "local vs universal" framing. Though I'm noticing a subtlety here — the real distinction isn't quite about scope of experience being local versus universal, but whether the claimed event falls within circumstances the experience actually covers.

  Turning to the contemporary critic question, both responses correctly name George Campbell's *A Dissertation on Miracles* (1762), which did address the Indian prince example. I recall Campbell argued that Hume's distinction between "contrary to experience" and "not conformable to experience" doesn't hold up — the prince's case actually shows testimony can and should override uniform experience, and Campbell treated Hume's claim about the frost being "not contrary to experience" as a distinction without a real difference.

  Response A extends the argument by asking why testimony that overcomes "water is always liquid" couldn't likewise overcome "men always stay dead," suggesting the only distinction is degree of uniformity. Response B frames it as the Prince reasoning justly yet being wrong, implying a theoretical threshold where sufficient testimony outweighs experience. Both seem like fair reconstructions, and I'm fairly confident Response A's claim that Campbell specifically discussed the Indian prince example is accurate, as Campbell does address it in his Dissertation to argue Hume's own example undermines his position.

  I'm also considering William Adams's 1752 essay and John Douglas's "The Criterion" as other contemporaries who may have used similar arguments, but Campbell remains the most well-documented and famous source, so both responses' identifications hold up. Modern annotated editions of Hume's Enquiry commonly footnote that critics like Campbell turned the prince example against him, confirming this is the correct attribution the user is recalling.

  Response B's claim that Hume isn't asserting miracles are metaphysically impossible but rather that testimony can never rationally justify belief in them is a standard and defensible reading, even though some scholars argue his Part I argument aims higher. Response A's point that Hume's definition of miracles as violations of "unalterable laws" smuggles in a metaphysical assumption is a recognized critique from thinkers like Broad and Earman, though the phrasing is a bit loose; its circularity charge—that we only think experience is uniform because we've already dismissed contrary testimony—is also a legitimate, well-known objection.

  On whether Hume "admits" to endorsing closed-mindedness, I need to check this against his actual text: the eight-days-darkness example suggests Hume would accept sufficiently uniform testimony for an extraordinary natural event, distinguishing it from a religiously-motivated miracle like the Queen Elizabeth resurrection case, which he'd reject—so his position is more nuanced than a flat admission of bias, even if it can be loosely characterized that way.

  On Response A's claim about the frozen-water Prince, Hume does say strong testimony would engage the Prince's assent, so that's roughly accurate. But A's characterization of Hume's standard as a "low bar for evidence" seems off, since Hume actually specifies "very strong testimony" was needed, not a minimal threshold.

  Response B adds a valuable connection to the Problem of Induction from Section IV, noting the tension in Hume's use of "proof" as technical language for the highest degree of empirical certainty rather than logical certainty, and how the Prince example undercuts the idea that any experiential proof is ever truly "entire."

