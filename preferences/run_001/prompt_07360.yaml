thinking: |-
  Both responses agree on the top three theories and rank combinatorial externalism last, so the real disagreement is whether prohibitionism or conventional-implicature/presuppositional accounts deserve fourth versus fifth place. I'm working through how well prohibitionism actually handles the three target phenomena, especially its known strength in explaining why mere mention of a slur can still cause offense.

