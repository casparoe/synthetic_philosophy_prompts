  **Demonstrating the contradiction.** Response A uses an algebraic derivation with utility functions (normalizing U(0)=0), which is rigorous and correct. Response B uses the common-consequence decomposition—isolating the shared 89% in each pair and showing that the residual 11% choice is literally identical across the two events. For a student who says "I can follow the reasoning she laid out" but wants to understand why the two situations "share exactly the same underlying structure," B's presentation makes the structural identity more transparent, and it is the standard textbook way of presenting Allais/Savage's sure-thing principle. Both are correct; B's is somewhat more illuminating.

