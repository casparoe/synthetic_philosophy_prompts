thinking: |-
  I'm thinking through what this eulogy needs to accomplish: honoring Uncle Frank, a judge who rejected the idea of ultimate blame or credit yet remained genuinely warm and forgiving, without framing that warmth as a contradiction. I'm considering how Strawson's argument in "Freedom and Resentment" shows that reactive attitudes like resentment and gratitude can survive the loss of belief in desert, which seems like the philosophical backbone this eulogy needs to get right for an audience of clerks and a philosopher friend.

  On reflection, "desert" isn't quite the right word for what Strawson discards—he's rejecting the need for a prior metaphysical grounding (libertarian free will) for reactive attitudes, not desert per se, though the user's gist about keeping resentment and love intact without that metaphysical backing is broadly right. The reactive attitudes are self-justifying within the human framework rather than needing external rational vindication, which is the distinction I want the eulogy to get right.

  B's gloss is accurate — Strawson's point that wholesale adoption of the objective attitude isn't rationally sustainable and we can't help but be participants in human life. Though naming the philosopher and explaining reactive attitudes in a paragraph edges toward the "lecture" the user explicitly wanted to avoid, even if brief.

  Meanwhile A takes a more implicit route: "some of you in the back, I know you know the name" gestures at the same philosophical territory (that removing blame removes the reason to care) without naming it, which better matches the "catch it if I get this right" instruction — the philosophy should be embedded, not announced.

  The storm analogy is actually shaky here — mourning a house a storm destroyed isn't a reactive attitude toward an agent, since storms aren't participants we resent or thank. That cuts against the Strawsonian point rather than illustrating it; it reads more like the "objective attitude" Strawson contrasts with genuine interpersonal feeling, so a philosophy pal would likely wince at the imprecision.

  The gratitude line comes closer to Strawson's actual claim — that reactive attitudes track the quality of will shown toward us, not metaphysical free will — though "the connection was happening" is a vague gesture rather than a precise statement of that. The judgment/punishment line works fine as a consequentialist justification compatible with desert skepticism, in the Pereboom vein. And the closing grief passage, with Frank wiping his eyes and pouring a drink despite calling the loss "just physics," nicely dramatizes the tension between intellectually accepting determinism and still feeling human loss.

  Turning to the funeral framing itself, phrases like "we aren't here to give Frank what he deserves" or "he fell exactly as he had to" risk landing awkwardly given the setting, even though they're clearly metaphorical extensions of the desert-skepticism theme. The strongest and riskiest claim in A is that Frank's warmth existed *because of* his philosophy rather than in spite of it — that letting go of desert freed him for curiosity, mercy, and non-transactional generosity, which is a bold thesis I need to check whether the essay actually earns.

  That line resembles the free-will-skeptic-optimism arguments (Pereboom, Waller, Caruso) rather than Strawson's actual position, so I'm noting A doesn't really deliver the Strawsonian mechanism the user asked for — it namedrops without explaining. B, on the other hand, explicitly names Strawson and attempts to explain reactive attitudes, which is closer to what was requested, so now I need to verify whether B's account of Strawson is actually accurate.

  Strawson's real claim is that reactive attitudes like resentment and gratitude are natural responses tied to our participant stance in human relationships, and no abstract belief in determinism could realistically dislodge them — he calls it "practically inconceivable" that theoretical conviction would erase our capacity for interpersonal engagement.

  B's rendering isn't a perfect scholarly gloss — Strawson wouldn't quite say "throw out desert but keep the attitudes," since he'd argue the attitudes are what give desert-talk its meaning in the first place — but as a eulogy-appropriate summary matching the user's hazy memory, it works fine and a philosophy-savvy friend would recognize it as roughly right.

