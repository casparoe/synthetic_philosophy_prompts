judgment: |-
  Both responses reach the same core verdict (Locke would exclude non-citizen residents from the franchise because the vote is a right of *membership*, which only express consent confers) and both identify the same two tensions: (i) §140's demand that taxation rest on consent, which sits awkwardly with taxing tacit consenters who have no share in the majority; (ii) the collapse of the "exit option" for long-term residents, which turns supposedly revocable tacit consent into something functionally perpetual and hence hard to distinguish from coercion. Both also point to naturalization as the Lockean path. The overall structure, level of engagement, and quality of argument are quite close.

  **Where A is stronger:**
  - It engages the "holding property" element of the prompt with a genuine interpretive wrinkle: the §117/§120 material on land being annexed to the commonwealth, and the scholarly reading that freehold ownership functioned as quasi-express consent in Locke's England. This adds a real layer (property-owning residents may have a Lockean claim that renters don't) and gestures toward the actual debate over Locke's franchise views.
  - Its two-horned dilemma is analytically sharper: it shows not only why exclusion is troubling but also what Locke loses if residence grounds the vote (the irrevocable/revocable distinction that stabilizes the body politic dissolves). That makes the "tension within his theory of political obligation itself" cut both ways rather than being a one-sided complaint.
  - Its conclusion derives a positive Lockean constraint—the state must either make exit real or offer a path to express consent—rather than simply saying residents "choose" not to naturalize (B's framing sidesteps cases where naturalization isn't available).
  - The §149 quotation is accurate and used to good purpose.

  **Where B is stronger:**
  - The §140 passage is quoted at length and accurately, which is useful for a seminar student, and B pinpoints the internal friction in that very passage ("every one who enjoys his share of the Protection should pay... but with his own consent, i.e., the consent of the Majority").
  - "Perfect Member" is correctly located in §119.
  - The closing formulation—residence-based voting as a claim that tacit consent should "ripen" into membership, which Locke's distinction was designed to reject but his property emphasis undermines—is elegant.

  **Weaknesses:**
  - A's "is not locally a Member" is presented as a quotation from §122 but isn't verbatim (the text says tacit submission yields "only a local Protection and Homage"); the §120 quote is heavily spliced. The gist is right in both cases.
  - B's analogy to absolute monarchy and the "common judge" is loose—non-citizen residents do have a common judge (the courts); lacking a vote isn't the same as lacking a judge. B's claim that tacit consenters "remain in the state of nature relative to the political body" is defensible via §9 but sits in tension with §119 and isn't flagged as contested.

  Neither response raises what is arguably the deepest tension the case exposes—that on Locke's own account (§116–118) native-born adults are also mere tacit consenters unless they perform some express act, so the tacit/express line does not track the citizen/non-citizen line at all. A's §117 discussion brushes closest to this.

  On balance, A offers slightly more interpretive depth on the specific question asked and a more rigorous account of what the tension costs on each side, while B is marginally more careful with quotation but has a couple of conceptually weaker moments. The margin is small.

  Verdict: weakly A
