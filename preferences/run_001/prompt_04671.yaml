judgment: |-
  **What the user needs:** the *philosophical spine* of the Du Bois–Locke disagreement, anchored in "Criteria of Negro Art" (1926) and "Art or Propaganda?" (1928), with neither man flattened into the tired "political art vs. art for art's sake" binary, Locke pressing on the artistic *and political* cost of instrumentalized art, Du Bois answering beyond the propaganda slogan, and *Home to Harlem* as a test case. Voice and stage business are the user's job, so accuracy of ideas matters most.

  **Response A**
  - Anchors directly in the sources: quotes the actual "all Art is propaganda... despite the wailing of the purists... I do not care a damn" lines; uses Du Bois's real *Home to Harlem* review language ("filth," "prurient" demand of the white public); has Locke press on the essay's Truth/Beauty/Justice triad ("you define Truth as what serves Justice"), which is the actual architecture of "Criteria."
  - Locke's political objection is stated in something close to Locke's own terms: censoring to manage the white gaze "admit[s] our inferiority" — a near-paraphrase of Locke's real claim that propaganda "perpetuates the position of group inferiority even in crying out against it." Locke also explicitly frames his stance as serving Justice, avoiding the "art for art's sake" caricature.
  - Du Bois answers on his own terms with several distinct moves: the representativeness point ("painting the cellar and signing it *This Is the House*"), the asymmetry point ("luxury of the dominant caste... 'Negro instinct'"), "freedom is merely the freedom to be consumed," and "struggle aesthetic while the world makes it physical."
  - Flaws: the Brechtian "hammer, not mirror" line is anachronistic and not Du Boisian; "Bill" is off; the third sentence of the propaganda quote is silently altered (the real line is about propaganda "confined to one side," i.e., asymmetric access, not harmful content); "Not racial expression—*human* expression" misstates Locke, who championed group expression, though the following lines recover the particular-to-universal idea.

  **Response B**
  - Also uses McKay well, and has some sharp Du Boisian lines: "truth is not absolute; it is received... If I tell the truth about a white man's corruption, it is sociology"; "I do not ask her to lie. I ask her to understand that her truth is not hers alone." The "she" quietly maps onto the user's protagonist.
  - Flaws: Locke says "the very trap I warned against in *Golden Book*" — a fabricated citation; "Art or Propaganda?" appeared in Thurman's *Harlem: A Forum of Negro Life*. For a user doing careful historical work, a hallucinated venue for the very essay they named is a real problem. B's Locke argues mostly on efficacy ("a pamphlet does not travel... only preaches to the choir"), which is closer to the "honest art is better propaganda" cliché than to Locke's actual dignity/self-containment argument. B's Du Bois slides toward caricature ("we must be extraordinary. We must show the beauty, the intellect, the sacrifice"), which the real "Criteria" essay complicates. No engagement with the Truth/Beauty/Justice framework. The extended cooking metaphor at the close is stylish but thin on spine.

  **Comparison:** Both stage a live, unresolved argument around *Home to Harlem*, and both have a couple of strong Du Bois rebuttals. But A is more faithful to the actual texts (verbatim quotes, the review's language, the essay's triad, Locke's inferiority argument), while B contains a fabricated citation and a thinner, more conventionally "effective-art" Locke. A's own errors (hammer line, altered clause, "Not racial expression") are real but are dialogue liberties rather than false references. The trade-off exists — B's "sociology vs. degeneracy" line and the "she" are genuine assets — but A better serves the user's stated priority of getting the philosophical spine right.

  Verdict: weakly A
