thinking: |-
  I'm working through the four debate points: Dan's claim about peeking inflating false positives is correct, Priya's likelihood-principle argument is a legitimate but non-frequentist stance so it merits a middling score, and Dan's point about p-values reflecting long-run error rates under repeated testing also checks out.

