  I want to get the philosophical details right. Ghazālī's Tahāfut argument denies necessary connection between fire and burning, attributing the effect to God's habitual creation rather than fire's own agency—and I recall he actually offers two versions of this: one denying fire any causal power whatsoever, and a second, softer version conceding fire might have a nature while still allowing God to intervene by altering the recipient's receptivity.

