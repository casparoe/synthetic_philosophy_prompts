thinking: |-
  I need to trace through this debate move by move: Marcus opens by framing Galileo as proto-NOMA, arguing scripture and nature never overlap in subject matter, while Elena counters that Galileo actually treats scripture as fully true even on physical matters, with accommodation only affecting phrasing, and leans on Augustine's principle that apparent conflicts mean we've misread the text rather than that scripture doesn't address nature at all.

  Marcus then presses that Elena's "harmony" model just relocates the problem — if interpretation always yields to demonstrated truth, scripture never actually constrains factual claims, making it functionally equivalent to separate spheres. Elena pushes back that the "genuine demonstration" bar is doing real work, since Bellarmine's caution to Foscarini was itself an application of Galileo's own principle, not a rejection of it. Marcus counters that Galileo advocated heliocentrism before meeting his own evidentiary bar — no parallax, no physics of a moving earth, a flawed tidal argument — so Galileo violated his own rule, and now Elena is conceding overreach on evidence while still trying to salvage the underlying principle.

  Turning to the historical record, I'm confirming that Galileo's Letter to Christina does lean heavily on Augustine and the two-truths doctrine, and cites Baronius's line about scripture teaching how to go to heaven rather than how the heavens go — genuine textual support for Marcus's NOMA-style reading. But Galileo also invokes accommodation language, and scholars like McMullin, Finocchiaro, Blackwell, and Fantoli have noted the Letter contains several distinct, not fully consistent principles, including accommodation and priority of demonstration.

  I'm now considering McMullin's specific taxonomy — accommodation, priority of demonstration, priority of scripture, prudence, and limitation — and noting that Galileo actually wavers on the priority-of-scripture principle, since Augustine's original rule only applied absent a demonstration.

  The strongest reading is that both Marcus and Elena capture only part of Galileo's position, since the Letter blends the Baronius/limitation strand with the Augustinian/demonstration strand without fully committing to either, plus Galileo's inexorable-nature argument that pushes toward genuine independence of scripture from natural questions, and the unresolved question of how strongly he was actually asserting heliocentrism as true versus merely permissible.

  I should also bring in Bellarmine's own letter to Foscarini, since it directly cuts against Marcus's NOMA-style reading: Bellarmine explicitly says scripture's claims about nature are matters of faith "ex parte dicentis" because the Holy Spirit spoke them, even while allowing Copernicanism as a mere calculating hypothesis, and only conceding that a true demonstration would force circumspect reinterpretation — which he doubted existed.

  So Elena's textual reading of Bellarmine's conditional is correct, but the deeper issue is whether Bellarmine's demand for an Aristotelian demonstratio propter quid was ever meetable in practice for astronomy, and whether Marcus's third move — that PPD makes scripture's authority always subordinate to demonstration and thus hollow — is philosophically sound, which tracks McMullin's critique.

  But there's a nuance: absent demonstration, scripture retains provisional authority per Augustine's PPS, so it isn't quite "no jurisdiction" — Galileo's real move is arguing natural questions shouldn't be tested by scripture even without demonstration, which is a distinct independence claim that neither Marcus nor Elena fully names. I'm also checking the timeline — Bellarmine's letter is dated April 1615, while Galileo's Letter to Christina was still being finished, which matters for who was responding to whom.

  I'm noting that Bellarmine's letter, despite its conditional acceptance of PPD, still asserts scripture does teach astronomy in a matter-of-fact way via the Fathers' consensus and Trent — which actually undercuts Marcus's NOMA-style reading of what the Church would tolerate, separate from the question of Galileo's own position.

  On Marcus's claim that Galileo lacked demonstration: that's factually correct, but Galileo's actual argument was more nuanced — he pushed a principle of prudence against premature condemnation and argued natural matters should be settled by senses and reason, while at times evasively suggesting near-demonstrations existed (the tides argument came only later, in 1616 and 1632). In 1615 his real evidence was just the telescopic discoveries refuting Ptolemy, though not decisively refuting Tycho.

