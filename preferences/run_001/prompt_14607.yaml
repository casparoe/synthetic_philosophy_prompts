  **Response B weaknesses:** "The moment her theory grew up" could land as faintly patronizing to Marion or her hardcore admirers. Slightly more jargon ("moral architecture," "Rawlsian ideal") for the family side, and a two-sentence stretch about "the tension that defines her career" edges toward seminar. Also invents "weekend sentence in county jail" as color, though that's about Marion's own arrests, which the user confirmed happen. No delivery aids.

  On balance, B avoids the riskier fabrication about the case, signals more accurately to the expert half, and closes more fittingly for the occasion. A's delivery scaffolding is a real service but doesn't outweigh the content issues. The margin is modest.

