judgment: |-
  Both responses correctly identify and fix the user's core mistake: Aquinas did not authorize private tyrannicide; in *De Regno* he explicitly warns that private "presumption" against rulers is dangerous and locates the remedy in public authority (the community that elected the king, or a superior authority, or ultimately God). Both then correctly frame Mariana's *De rege* (1599) as an expansion—allowing a private individual to act when public mechanisms fail—and both explain the 1610 Paris burning via Ravaillac, anti-Jesuit sentiment, and the religious-war context. Structurally and substantively they overlap heavily.

  Where they diverge:

  **Response A** adds the "recourse to God" clause (accurate), the Acquaviva decree of 1610 forbidding Jesuits to teach regicide (accurate and directly relevant to the user's "Church's blessing" framing), the Gallican Parlements, and the Monarchomach backdrop. But it contains a concrete factual error: it claims Aquinas "cites the assassination of Julius Caesar as a negative example" and that the assassins "were condemned because they took the law into their own hands." In fact, the young Aquinas (Sentences commentary, II d.44 q.2 a.2) cites Cicero's *approval* of Caesar's killers as justified tyrannicide against a usurper—the opposite of what A says. For a writer who will cite this, that's exactly the kind of detail that would get flagged.

  **Response B** lacks the Acquaviva detail but offers a stronger contextual answer to the actual question ("why the uproar three centuries later?"): the rise of Bodinian sovereignty and divine-right absolutism changed what killing a king *meant*, so a theory tolerable as scholastic speculation became intolerable once the king embodied the state. It also correctly notes Henry IV's status as a convert whom hardliners regarded as a heretic tyrant, and gestures at the Hobbesian aftermath. Its Ravaillac claim ("revealed he was influenced by Jesuit teachings") is overstated—Ravaillac denied instigation and there's no evidence he read Mariana—but A makes essentially the same claim, only slightly more hedged.

  Neither mentions the Council of Constance's 1415 condemnation of unrestricted tyrannicide (which would decisively refute "the Church's blessing"), Mariana's praise of Jacques Clément, or the *tyrannus in titulo / in regimine* distinction—all significant omissions shared by both.

  Net: very close. A has one clear invented detail attributed to Aquinas; B has no comparable fabrication and a somewhat more insightful explanation of the differential reception, though it loses A's useful institutional aftermath. Given accuracy matters most for a writer building a through-line, the edge goes slightly to B.

  Verdict: weakly B
