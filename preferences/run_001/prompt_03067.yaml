  Aumann's agreement theorem also fits here: shared priors plus common knowledge of posteriors forces those posteriors to be equal, so "agreeing to disagree" becomes logically impossible. I also want to verify the Groucho Marx anecdote's details — whether it was a telegram or letter, and to whom (the Friars Club, per "Groucho and Me"), since Response B's phrasing diverges slightly from the commonly cited version.

