judgment: |-
  **What the user needs:** A ~5-minute eulogy for non-academic grieving family that draws on the extended mind thesis honestly, says something true and comforting about what did and didn't survive, avoids lecturing, and — the constraint stressed twice — does not assert the thesis as settled fact or claim more than it can bear.

  **Response A** handles the calibration well throughout. The philosophical content is framed tentatively and personally: "the more I think about Grandma, the more I think that view is too small"; "There is a question philosophers ask... Is the notebook just a tool, or is it a piece of her mind? I don't think we need to settle that debate to find the truth in it." That last line is precisely the epistemic posture the user described. It also echoes the Clark and Chalmers conditions in plain speech ("so completely, so trustingly, and so automatically") without jargon. The eulogy is concrete and vivid (the finger running down the page, the face lighting up), which is what lands in a room of family. The ending is modest: it pivots to "Now, it's our turn to keep her in our minds" rather than claiming she survives in the notebook. Weaknesses: "My mother was right" is fairly direct (though softened by the preceding framing), "pages don't die" flirts with over-reach, and it assumes the speaker is male ("I love him"). No condolence to the user.

  **Response B** is competent and includes a useful meta-note plus a kind condolence, which genuinely helps the user understand and adapt the draft. But the eulogy itself is consistently more assertive of the thesis than the user wanted: "We often make a mistake by thinking that 'us'... stops at our skin"; "[Grandmother] knew better"; "She showed us that a mind isn't just a brain"; "I think it is the truth about who she was." Most importantly, the climax — "if her mind was in that notebook... then she is not gone" and "We don't need to worry that she was lost" — is exactly the inference the extended mind thesis cannot license (the notebook is part of a cognitive system only while coupled to Otto; without him it's paper). This is the paradigm of "claiming more than the thesis can bear," and telling a family that watched nine years of Alzheimer's "we don't need to worry that she was lost" also cuts against honesty about what didn't survive. The note's claim that "She treated it with the same care she treated her own heart" translates the parity principle is a mischaracterization a philosophy student would notice. B is also more abstract and projects a lot of deliberate philosophical insight onto the grandmother.

  **Verdict:** Both are usable, but A is better on the constraint the user cared most about and is the stronger piece of eulogy writing for that audience. B's extras don't offset its core draft doing the specific thing the user asked it not to do.

  Verdict: strongly A
