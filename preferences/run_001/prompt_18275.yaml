  I'm checking Response A's scholarship example: it shows scholarship students graduating at lower rates within both STEM and Humanities subgroups (60% vs 50%, 90% vs 80%), yet the pooled totals reverse to favor no-scholarship (65% vs 75%), since scholarship recipients skew toward the harder STEM track. I want to verify these numbers are internally consistent before judging whether major matters as a mediator versus confounder here.

