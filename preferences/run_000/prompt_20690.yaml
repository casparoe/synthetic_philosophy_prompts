  Working through the modal collapse derivation, I trace how T3 (necessarily God exists) follows within logic K given the essence and necessary existence definitions—using the property Q_φ trick to show that G's necessitation combined with T3 yields φ → □φ directly. I also work out how T3 itself derives from the weaker premise ◇∃x G(x) using symmetry (B axiom) rather than full S5, since ∃x G(x) already gives G(g) and NE(g), which through the essence definition yields □∃y G(y).

