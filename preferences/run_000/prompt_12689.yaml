  Now I'm working through Piccione & Rubinstein's action-optimality concept, where at each intersection the driver forms a belief about whether they're at X or Y based on consistency with their strategy — the belief that they're at X works out to 1/(1+p), given they always pass through X but only reach Y with probability p.

  Setting up the expected utility as a function of q under this belief and maximizing, I derive q = (7α−3)/(6α), then substitute α = 1/(1+p) and solve the fixed point p = q, which gives 9p = 4, so p = 4/9 — notably different from the planning-optimal 2/3. This is the core of the paradox: the two optimality notions disagree.

  Checking this at p = 2/3 with the corresponding belief α = 3/5, I confirm the best response drops to q = 1/3, so the driver would indeed want to deviate from the planning-optimal strategy. But then trying the "naive" version where the driver holds the other intersection's action fixed at p without updating for self-deviation, I compute the expected utilities of continuing versus exiting at p = 2/3 and find them exactly equal at 8/5 — indifference, which connects to the Aumann-Hart-Perry result.

  Working through this more carefully with the general formula for the utility difference between continuing and exiting, I find it reduces to a simple expression that vanishes precisely when p = 2/3, confirming that with consistent beliefs and this approach, 2/3 is a genuine fixed point. Testing the alternative where the driver naively assumes α = 1/2 instead, the indifference condition instead yields p = 1/3, matching what I'd seen in Response A's derivation with q = 1/2.

