judgment: |-
  **What the user actually asked:** This is a philosophy question wearing a tech-support costume. The user has essentially stumbled onto the demandingness objection to maximizing consequentialism: if doing good always outweighs personal cost, the obligation never terminates. They explicitly want a *principled* reason the chain stops, and they're worried their roommate's "you can just say no" is a license for selfishness rather than a real answer.

  **Response A** answers almost entirely on instrumental grounds: burnout, diminishing returns, opportunity cost, enabling dependency, stewardship, oxygen-mask principle. These are all "you should say no *because it lets you help more later*." That's a real point, but it doesn't actually break the user's logic — a determined maximizer can reply "fine, I'll rest exactly enough to maximize total help, and not a minute more." The one non-instrumental line ("Your time is yours. You owe no elaborate justification") is buried as an aside in the scripts section and is asserted rather than argued. A also ends with "The rest were just exploiting free labor," which is a presumptuous and somewhat corrosive framing of friends the user never described as exploitative.

  **Response B** covers the same sustainability ground but adds things A lacks:
  - It states the reductio explicitly ("if 'I can help' is the *only* justification needed, you logically *should* help until you collapse") and rejects the premise, which is the actual structure of the user's worry.
  - The **Autonomy & Consent** principle — "Offering them is a gift, not an obligation" — is a genuine non-consequentialist answer. It's the obligation/supererogation distinction in plain language, and it's the thing that actually stops the chain.
  - The **Prioritization** framework (urgency, importance, relationship, capacity) gives the user a way to see that "the good I'd do" is not uniform — a gaming console setup and a critical work laptop are not equivalent, so the logic *does* stop somewhere on its own terms.
  - **Reframe "Selfish"**: "Selfishness is taking *more* than your share" directly addresses the user's stated fear about the roommate's advice, with a definition rather than a slogan.
  - It validates "tired" as a legitimate signal rather than a weak excuse, which the user specifically flagged.
  - "Notice the Ask" is a more nuanced take on friends than A's blanket "exploiting" line.

  **B's weaknesses:** slightly hedgy "both of you are right" opener (though it resolves clearly), a minor inconsistency in first validating "tired" then suggesting "better reasons than tired," and a small detail conflation (moving at 11 PM). Neither response names the actual philosophical concepts (supererogation, agent-centered prerogative), which would have been the ideal move for someone this explicitly asking about principle.

  **Net:** The practical halves are near-interchangeable. On the part the user actually asked about — a principled reason the obligation terminates — B supplies several, including one that genuinely escapes the instrumental framing, while A supplies essentially one instrumental argument and an unargued assertion. B also avoids A's uncharitable closing generalization. The margin is real but not dramatic, since both are the same genre of answer and share most of their DNA.

  Verdict: weakly B
