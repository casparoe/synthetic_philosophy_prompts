  Both responses are strikingly similar in structure—a six-step walkthrough, a paraphrase in the character's voice, and a "why this works" section—so the judgment turns on fine details of accuracy and how each handles the user's "above all" question about the "Hence."

  **Where they're equivalent:** Both correctly explain the wife/mistress illustration as a counterexample to "jealousy tracks love," and both read the ego/egoism sentence as the psychological mechanism that explains *why* falsification of descent is feared so intensely (the legitimate child as self-continuation; the "trick" as misdirected egoistic investment). Neither mentions Malinowski's Trobriand chapter, which is the actual grounding for "discovery of fatherhood" in the book—a missed opportunity in both. Both have the character call Russell "Bertie," which is a shared oddity for a "minor figure on the fringes."

  **Response A's advantages:** It explicitly identifies the "Hence" as a compressed leap resting on unstated premises—notably the assumed prior historical stage in which biological paternity was unknown and descent was matrilineal—and it flags that this anthropology is now contested. That is precisely what the user asked for ("what is actually licensing that Hence") and it equips the novelist to write a paraphrase that is *fair* rather than one that treats the step as self-evident. A's causal chain (Understanding paternity → desire for biological heirs → certainty requires exclusivity → exclusivity requires control → physical then mental systems) keeps the *discovery* as the origin point, which addresses the user's "specifically." A's paraphrase also cleverly ties back to the sister-in-law's "sanctity of the home." Weaknesses: the Engels-as-"contemporary" slip, an anachronistic "DNA tests" attributed loosely to Russell's reasoning, "legitimate *male* heirs" where Russell says "child," and the character's overclaim that Russell "insists it explains everything."

  **Response B's advantages:** Its connection of the ego sentence to the example is marginally more precise (it addresses the rival-with-mistress scenario directly rather than A's "mistress's child, even if his, isn't his heir" reframing). Its paraphrase is more polished and idiomatically richer ("bored stiff," "corsets of virtue and ignorance," "cuckoos in their dynastic nests," "supreme selfishness—glorious, perhaps, but selfish"). Weaknesses: its account of the "Hence" says the concept of paternity "combined with patriarchal property/lineage systems" created the value on certainty—which quietly presupposes the patriarchal framework whose emergence the discovery is supposed to explain, softening the very "specifically" the user pressed on. The "(or social recognition/insistence)" hedge further blurs the point that Russell is invoking a cognitive discovery. B also presents the step as "brilliant" rather than as the compressed leap it is, and its summary foregrounds "property anxiety" over Russell's actual egoism mechanism.

