  The core mathematical crux is that in the standard price-of-production system, prices are determined only up to a scalar normalization—a homogeneous system with exactly one degree of freedom. That single degree of freedom can satisfy only one aggregate condition (either total price = total value, or total profit = total surplus value), so imposing both simultaneously generally overdetermines the system, and they coincide only in special cases like Sraffa's standard commodity.

  The distinction hinges on whether inputs are held at values or also transformed into prices: if inputs stay at value terms, profit = surplus value holds trivially since profit is just surplus value redistributed pro rata; but once inputs are also priced, profit becomes a residual (price of output minus price of inputs), and the two invariance conditions can no longer both hold unless the price and value of the input bundle happen to coincide.

