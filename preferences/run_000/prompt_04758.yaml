  Even a materialist could hold value is purely conventional, while an immaterialist could just as easily hold a metallist view—nothing in immaterialism forces either position. Scholars like Caffentzis have traced connections between Berkeley's metaphysics and his monetary theory, but even the strongest versions treat it as an analogy rather than a strict deduction, often tied to Berkeley's theory of signs—money as counters paralleling words as signs that don't need to correspond to ideas, as he discusses in Alciphron VII.

