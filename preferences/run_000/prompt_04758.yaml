  Metallism and materialism are orthogonal positions—one could hold either combination—so a stronger connection to Berkeley's actual philosophy runs through his theory of language and signs in Alciphron VII, where money serves as an analogy for words functioning without corresponding ideas. It's also worth noting that Berkeley's monetary views were shaped more by Irish economic realities and prior writers on currency than by his metaphysics directly, so the overall conclusion should be skeptical of a tight metaphysical dependency.

