judgment: |-
  **What the user asked for:** (1) the precise difference between Doris and Harman, (2) whether there's a substantive comeback for virtue ethics beyond asserting consistency by fiat, and (3) a verdict on whether their approach is naive.

  **Doris vs. Harman.** Both responses get the core distinction right: Doris = fragmentation/local traits (robust cross-situational traits don't exist, narrow ones do); Harman = eliminativism (no reason to believe in traits at all). Response A is more faithful on Harman's actual argument—it ties his position to the fundamental attribution error, which is literally in his paper's title. Response B reconstructs Harman as an "Explanatory Dispensability Argument" with a phlogiston analogy; the conclusion is right but it drops the FAE, which is the distinctive part, and the argument name is invented. B does add dates and a concrete study (the dime study Doris discusses), which is nice precision, though the "regardless of helpfulness scores" gloss is slightly off. Roughly a wash, slight edge to A on Harman.

  **The comeback.** This is where B pulls ahead. B names the actual literature: Merritt's sustaining-social-contribution view, Mischel & Shoda's CAPS/if-then signatures (which Nancy Snow built her empirically-grounded virtue theory on), and McAdams on narrative identity. The CAPS discussion in particular is exactly the kind of mainstream personality-psychology resource that a psych postdoc housemate can't wave away, and it directly answers the "consistency without global traits" question with a real mechanism. B's labeling is sloppy in places ("response-dependent" is a misused term; "John Doris later" is a stretch), but the substance is right. A's comebacks are more generic—"Neo-Aristotelian responses (Annas, Nussbaum, Snow)" captures the important Kamtekar/Annas point that virtue involves practical reasoning and the experiments don't test it, but Nussbaum isn't really a participant in this debate, and A's narrative-identity section largely reduces to "readers think in stories so it'll resonate," which is close to the fiat move the user explicitly wanted to get past. A even includes a section titled "'By Fiat' Isn't Necessarily Bad," which somewhat sidesteps the question.

  **Verdict on naivety.** Both land on "fine if you show the work." B is a bit more honest: it says outright that virtues portrayed as magically immune to circumstance *are* naive, then gives concrete, non-obvious craft tools (engineer the sustaining environment; test the character by removing it; define if-then signatures). A's advice overlaps (local traits, show reasoning, whole-arc consistency) but leans more on genre convention as reassurance.

  **Overall.** Both are competent, similarly formatted, and free of major errors. A is more accurate on Harman; B is more precise and useful on the comeback, which is the part the user framed as the real question. B's extra specificity there (especially CAPS and Merritt) outweighs the FAE omission, but the trade-off is real.

  Verdict: weakly B
