  The Last Judgement belief is a way of regulating life rather than a prediction, and Wittgenstein contrasts it with empirical assertions — someone hedging "possibly" about a Last Judgement creates an "enormous gulf," whereas hedging about a German plane overhead would seem close to agreement. He stresses these religious disagreements aren't normal controversies, since the reasons operate on an entirely different plane, gesturing toward the "picture's" distinct grammar of use.

  I'm also noting his remarks on "blunder" being relative to a system, like a mistake within a particular game, and his comment about Lewy's religious belief — that he's read the same texts and, in an important sense, understands what Lewy means even without knowing whether to say he "understands" fully. I'm considering how this connects to related material in On Certainty and Culture and Value, plus scholarly readings from Nielsen, Phillips, Winch, Malcolm, Putnam, Diamond, and the "hinge propositions" interpretation, along with Burley's work.

  Now I'm thinking through Schönbaumsfeld's counter to the fideist label — that Wittgenstein isn't claiming religious belief is immune from criticism, just that criticism has to be of the right kind. There's a subtler point too: the "we don't contradict each other" line isn't relativism where both sides are right in their own game, but rather that the non-believer lacks the same concepts or picture the believer has, so saying "I don't believe this" isn't really contradicting a claim — it's more that the non-believer isn't positioned to contradict at all, since they don't share the conceptual framework.

