  Actually, I recall now that Aumann distinguishes material from substantive rationality more precisely: material rationality only requires rational play at vertices actually reached, while substantive rationality requires it everywhere, including counterfactually. This distinction matters because his theorem holds under substantive rationality but can fail under the weaker material version, and the subjunctive reading of "if v were reached" is what gives substantive rationality its bite.

  Binmore's later objection targeted exactly this — that these counterfactual claims about unreached vertices can't be cleanly represented in Aumann's knowledge-partition framework. Aumann's response was that the relevant statements are really about strategies specifying choices at every vertex, not problematic counterfactuals about actual play.

  Actually, I don't think that formulation quite works either, since rationality at v depends on the choice being non-suboptimal, a property of the strategy itself independent of whether v is reached. Setting aside the exact scholarly wording, what I want is the substantive defense: in Aumann's model, a state fixes a full strategy profile, each player knows his own strategy, and rationality at v just checks whether i's strategy-specified choice there is beaten by some alternative i knows would do better — evaluated for every vertex whether or not it's reached, so no counterfactual "closest world" is ever needed.

  The "off-path" worry (what should a player believe upon reaching a node she wasn't supposed to reach) is really about belief revision, but Aumann's static-knowledge framework doesn't model belief revision at all — it just asks what the fixed profile at ω specifies everywhere. So Aumann's reply is that substantive rationality is the correct rationality notion for someone committing to a full plan: a sensible planner never builds an irrational move into any vertex, since the plan only bites if that vertex is reached, and the planner wants the right choice there given his knowledge, independent of the reach question.

  This connects to Stalnaker's deeper challenge — since knowledge partitions are fixed, a player's knowledge at any off-path vertex v equals his knowledge at ω, effectively assuming that arriving at v teaches him nothing new about the opponents' strategies. Aumann's defense is that knowledge, unlike belief, can't be revised: if i truly knows the opponents' strategy, reaching v can't overturn something that was already known to be true.

  This is essentially the standpoint of ex ante knowledge—asking whether the choice at v would be optimal given what the player knew from the start, not updated knowledge upon reaching v, which is exactly what critics object to. Halpern's 2001 work reconciles Aumann and Stalnaker by showing their results hold under different assumptions about counterfactual closeness—specifically whether reaching an off-path node preserves beliefs about opponents' strategies. I'm also recalling Aumann's centipede game analysis, where CKR at the root produces backward induction under a specific formulation of rationality.

