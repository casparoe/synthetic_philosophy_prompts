  Working through the details, intuitionistically the derivation only gets you to ¬(p ∧ ¬Kp), not the full (p → Kp), since that last step requires double negation elimination which fails without classical logic. So the anti-realist can consistently deny there are unknown truths without being forced to say every truth is actually known—a weaker, more defensible position, though still somewhat uncomfortable as Williamson pointed out.

