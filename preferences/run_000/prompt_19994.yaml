  **What Priya actually got wrong (ground truth):**
  1. **History (part b):** She claims Zahavi "worked out the math" in his 1975 paper. False — Zahavi's 1975 paper was verbal, early models (Maynard Smith 1976, Kirkpatrick 1986) suggested it *didn't* work, and Grafen (1990) provided the ESS proof ~15 years later. The rubric explicitly names this and the teacher emphasized it.
  2. **Handicap vs. index (part c):** She never defines "handicap," and she labels the peacock's tail an *index* while describing it with pure cost logic (metabolic expense, predation risk). The peacock's tail is the canonical Zahavian handicap; an index is honest via physical constraint (e.g., call pitch tied to body size), not cost.
  3. **Examples (part d):** Neither example is actually evaluated against (c) or probed for being a "shakier fit."

  **Response A:**
  - Cat 1: correct.
  - Cat 2: **Misses the history error entirely** — awards 5/5 and even claims "Priya gets the key point that math resolved it later," which misreads her text. A actually cites Grafen 1990 correctly but fails to apply it. This is a clear grading failure on an explicitly rubric-specified item, and it's absent from A's "flat-out wrong" list.
  - Cat 3: Correct — identifies peacock as a handicap, gives a correct index definition (frog croak), explains why Priya failed to distinguish. 1/5 is strict but the user asked for strict.
  - Cat 4: Sharp critique, including the differential-cost problem with promposals (a wealthy/popular person can pay the cost insincerely) — this addresses the "shakier fit" prompt.
  - Letter grade hedging is slightly awkward but transparent.

  **Response B:**
  - Cat 1: correct.
  - Cat 2: **Correctly catches the history error** and attributes the ESS proof to Grafen. Good.
  - Cat 3: **Gets the central concept wrong.** B asserts "The peacock's tail is a classic example of an INDEX signal, not a handicap" and says Priya "correctly describes the peacock tail as an index." This contradicts standard teaching and Priya's own cost-based description. B's text is also incoherent here ("incorrectly labels the peacock tail (an index) as an index"), and its definition of index as "(condition-dependent trait)" conflates condition-dependence — a hallmark of many handicaps — with physical-constraint indices.
  - Cat 4: Built on the wrong peacock premise. Does note promposal fits handicap better, which is reasonable.
  - Error #1 in the "flat-out wrong" list is muddled and would have the user tell Priya something false.

  **Weighing:** Each response has one major error. But the user explicitly said handicap vs. index "still trips me up" and that the teacher "hammered" it. B fails on exactly that point, actively teaching the user (and via them, Priya) that the flagship handicap example is an index — the user has no way to catch this. A's failure is an omission on the history, which the user *already knows* (they quoted the teacher's "15 years" statement themselves) and can plausibly catch by comparing to Priya's text. A's category 4 analysis is also more incisive, and A's prose is coherent throughout while B's is garbled at the critical spots.

  A's history miss is a genuine flaw and keeps this from being lopsided, but B's error lands on the user's stated weak point with active misinformation, making A clearly the more useful response.

  Verdict: strongly A
