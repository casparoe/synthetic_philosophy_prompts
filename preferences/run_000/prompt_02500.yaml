  The user poses two questions: whether there's a legitimate philosophical connection between Frege's anti-psychologism and his politics, or if that link would be a stretch, and separately how to dramatize a rigorous logician holding such repugnant views without forcing false coherence. I'm working through Response A's structure now, which builds a case for connection through parallels like purity in logic mirroring social purity, objectivity as blindness to one's own situatedness, and a Platonist detachment from lived reality, while also citing philosophers who've explored similar territory.

