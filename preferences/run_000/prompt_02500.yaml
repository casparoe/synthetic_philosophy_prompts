  I also want to weigh A's claim that Frege "compartmentalized" logic and politics as separate spheres, since some scholars argue the opposite — that his anti-democratic views actually stemmed from applying a rationalist standard to politics and finding the masses wanting. Both essays are structurally comparable in quality, so I'm now trying to pin down the decisive difference between them.

