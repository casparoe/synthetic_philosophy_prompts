  That specific attribution to Elster sounds off — his actual argument is that constitutions bind others (later generations, legislatures) rather than the self, and that founders can be driven by passion or interest too, not calm reason, which weakens the Ulysses analogy for societies. This suggests Response A's framing of Elster is somewhat muddled even if the general point about eternity clauses binding others is correct. I'm now considering the Sovereignty Problem section, which invokes Hart's argument that a sovereign can limit itself but must retain ultimate power to change those limits — recalling how Hart's Concept of Law critiqued Austin's sovereignty theory.

  Actually Hart's real contribution was the distinction between "continuing" and "self-embracing" sovereignty, arguing that whether a legislature can bind itself is a question determined by the rule of recognition, not logical necessity — and crucially, Hart thought self-embracing omnipotence (a sovereign irrevocably binding itself) was coherent, contradicting Austin's view. So Response A's attribution to Hart appears to be nearly the opposite of what Hart actually argued, which is a meaningful error given this is precisely the sovereignty self-binding puzzle the user asked about.

  I'm also checking the Jefferson/Madison treatment — it covers Jefferson's "earth belongs to the living" view against Madison's stability argument, judging Madison's points strong for difficult-to-amend but weaker for unalterable provisions, though it skips some of Madison's specific mechanisms like tacit consent or the debts owed to prior generations' improvements.

