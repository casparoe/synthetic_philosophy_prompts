  The correct name for this phenomenon is "decision instability" or "unratifiability," a known problem for CDT. Response A does use the term "ratifiability" correctly, even though it misattributes it to EDT, and also brings up Egan's Psychopath Button as a related case; Response B skips the terminology entirely, just calling it an "evidential loop."

