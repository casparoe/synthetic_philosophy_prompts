thinking: |-
  I recall that Death in Damascus was introduced by Gibbard and Harper in 1978 as a challenge specifically for causal decision theory, not evidential decision theory—since EDT treats both options as leading to certain death given Death's perfect prediction, avoiding the paradox that plagues CDT.

  CDT, though, suffers from decision instability: it evaluates each option by holding fixed a credence about Death's location, so leaning toward staying makes fleeing look better and vice versa, meaning neither choice is ratifiable, which is exactly the problem Gibbard and Harper raised. Given this, Theo's claim that staying and fleeing are equally dangerous so the man might as well stay actually matches the EDT verdict rather than exposing a flaw in it.

  Under EDT there's no instability since it just conditionalizes on the action and gets certain death either way; the instability only surfaces when asking the CDT-style counterfactual about what would happen if one did otherwise given current credence. Theo's move in (3) is oddly self-undermining: he invokes causal independence to argue for parity, but taking causal independence seriously is exactly what generates CDT's instability rather than resolving it—parity is actually the EDT conclusion, so he's mixing frameworks.

  Ada's response in (4) nails this: the instability is a genuine problem precisely because the choice can't move Death's location while still being evidence of where Death is—if choice could causally determine Death's location, there'd be no instability at all. Her point that "no backward causation" isn't a knockdown objection is correct, since if it were, decision theorists would've dropped this puzzle long ago. So Ada seems to have the better argument here.

  This is essentially Gibbard and Harper's Death in Damascus puzzle, and the instability she's identifying is the classic unratifiability problem that specifically afflicts CDT—Skyrms, Arntzenius, Joyce, and Egan have all written about how to resolve it, whether through mixed-strategy equilibria or accepting instability as something CDT can live with.

  Now I'm checking a suspicion: both responses seem to have swapped the attribution, calling Theo's stance CDT and pinning the instability on EDT, when the literature actually points the other way. I need to verify this by looking closely at how Response A frames Theo's reasoning.

