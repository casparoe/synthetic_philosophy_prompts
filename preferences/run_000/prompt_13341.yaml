thinking: |-
  I'm recalling the Ramsey passage where he links the objectivity of good to theology, noting both were things he considered settled alongside dismissing the existence of God.

  This raises three questions for me to check: whether Ramsey actually argues for the link between God and moral objectivity or just asserts it, whether "Absolute Ethics" refers specifically to Moore or more broadly to idealists like Bradley and McTaggart, and how Ramsey's view maps onto modern metaethical categories like error theory or emotivism. I'm trying to reconstruct the actual text of the "Epilogue," recalling his division of subjects into science, philosophy, history, politics, psychology, and aesthetics, and his treatment of value questions as falling under psychology rather than objective fact.

  I keep trying to recall the exact passage where Ramsey discusses ethics, possibly referencing Russell's "What I Believe" and the claim that "the good life is one inspired by love and guided by knowledge," though I'm uncertain whether this connects to a broader point about the objectivity of value that most people would dispute.

  Regardless of exact wording, this is clearly Russell's "What I Believe" (1925) context, where ethics reduces to psychology—what people actually desire. Both responses correctly identify that no argument is being made here, just an assumed premise shared among friends, with the unstated assumption being that objective good requires some transcendent foundation.

  I'm also noting an interesting wrinkle: Ramsey is addressing the Apostles, a group that included both Moore and Russell, which makes "most of us" a loaded phrase worth examining given Moore's own views on ethics.

  Moore's Principia Ethica actually set out specifically to sever ethics from theology and metaphysics, criticizing "metaphysical ethics" in figures like Kant, Spinoza, and the Idealists—so Moore himself held that objective good doesn't depend on God at all. This makes Ramsey's framing genuinely at odds with Moore's foundational project, which is notable since Ramsey, as a Cambridge insider, would have known Moore's views well.

  I'm now wondering about "Absolute Ethics" — it could echo Bradley's Idealist "Absolute," or perhaps Spencer's distinction in *The Data of Ethics* between "Absolute" and "Relative" ethics, though that framing doesn't quite fit Ramsey's usage. More likely Ramsey means something like a non-naturalist, Moore-style objectivist ethics — treating ethics as having a real subject matter independent of human psychology.

  This lines up with Wittgenstein's "Lecture on Ethics," where he distinguishes "absolute" value from "relative" (instrumental) value; Ramsey's phrase might be drawing on the same Tractarian-influenced sense of ethics as objective and non-relative, paralleling theology's failed claim to study God.

  Turning to Ramsey's actual view, since he adopts Russell's reduction of ethics to psychology from "What I Believe" (1925), where Russell abandoned Moorean objectivism after Santayana's critique and moved toward a subjectivist account tying "good" to what is desired.

  The Epilogue's phrase that theology and Absolute Ethics "have no real objects" fits an error-theoretic reading — parallel to how theology fails because God doesn't exist, moral discourse presupposes objective values that Ramsey thinks don't exist either, much like Mackie's later error theory.

  But Ramsey also collapses ethics into psychology, treating value-talk as claims about desires and their satisfaction. That's actually a reductive naturalist, cognitivist move rather than non-cognitivism, since desire-statements can be true or false. So framing Ramsey as proto-expressivist (as both responses do) may miss that his reduction to psychology looks more like naturalistic subjectivism paired with error theory about "Absolute" objective ethics specifically.

  I'm skeptical of Response A's claim that Ramsey's 1929 "Theories" paper contains a quote about "expressing our own feelings and commending them to others" — that paper is about theoretical terms and Ramsey sentences, not ethics, so this attribution seems fabricated or misremembered from elsewhere in his work.

  Response B's claim about "Theories" (1929) connecting to Misak's pragmatist reading is a stretch too, but at least it's hedged with "some scholars argue" rather than presenting a fabricated direct quote — Misak does extend Ramsey's pragmatism to ethics, just not specifically derived from that paper's treatment of value judgments.

  I'm also checking Response B's claim that Ramsey "heavily influenced" logical positivism, "especially Carnap" — this seems overstated, since Ramsey's actual influence on Carnap and the Vienna Circle (via the later Ramsey sentence concept) was real but moderate, not a major error though. And Response A's framing of the Tractatus as "early positivism" is a common but questionable reading, plus timing logical positivism's dismissal of God to 1925 is anachronistic since the Vienna Circle only formed around 1924 and didn't formalize until later.

  I'm also flagging Response A's claim that Russell "vehemently rejected" Moore's non-naturalism as "incoherent without God" — this doesn't match the historical record, since Russell actually abandoned Moore's objectivism due to Santayana's critique and later expressed regret at not being able to believe in objective values, rather than calling it incoherent. Response B's characterization that Russell saw Moore's non-natural good as "quasi-theological" seems closer to accurate.

  Response A's claim that Moore was "already a relic" to the Apostles by the 1920s also seems overstated, given Moore's substantial ongoing influence at Cambridge as editor of Mind and professor, and his continued devotion from figures like Keynes, Ramsey, and Braithwaite.

  On the substantive philosophical claims, Response A misattributes "absolute" as Moore's term for good when Moore actually used "intrinsic," and its syllogism about God being "dismissed" via logical positivism remains anachronistic. Its reading of error theory versus Ramsey also seems like a stretch—Ramsey's claim that "Absolute Ethics" involves "no real objects" doesn't clearly support Response A's assertion that Ramsey denies ethical statements even purport to describe anything.

  Weighing this against Response B's take, B at least reasons more carefully about whether error theory fits, though its argument for dismissing it is also shaky since the dismissal *is* essentially error theory applied to the discipline. B's consideration of subjectivism as an alternative also seems more textually apt than what A offers.

  Both responses converge on emotivism/non-cognitivism, and I'm trying to recall if that's genuinely defensible against Ramsey's actual text — thinking through the famous "Epilogue" passages about perspective, cosmic insignificance, and the discounting of far-future value, which lean toward a humanist/subjectivist reading rather than strict emotivism.

  Weighing the two answers, A's fabricated Ramsey quote from "Theories" is a serious fabrication risk since a careful reader could easily check and find it doesn't exist, whereas B's shakier claims (the Russell-Moore "quasi-theological" attribution, the Misak tie-in) are speculative but not invented citations. B also earns credit for noting how Moore's rejection of naturalism, once non-natural properties were off the table, effectively pushed thinkers toward non-cognitivism — a real and relevant historical insight A misses, and for holding a more appropriately hedged "moderate" confidence rather than A's overconfident "high" given how thin the textual evidence actually is.

  I'm also noting a connection neither response makes: Ogden and Richards' 1923 "Meaning of Meaning" already articulated an emotive theory of "good," and Ramsey was close to Ogden, so emotivism wasn't really anachronistic for his circle in the way both responses imply — a nuance that would have strengthened either answer.
judgment: |-
  **What the user needs:** A careful, textually honest analysis of one compressed sentence, with (1) whether there's an argument or just an assumed premise, (2) the target of "Absolute Ethics," and (3) a modern label with an honest confidence level. This is a scrupulous reader who traced the essay's provenance; accuracy of citations and calibration matter more than polish.

  **Shared ground:** Both responses reach the same core answers — assertion resting on an unstated "objective good needs a transcendent foundation" premise; Moore as primary target with the Idealists secondary; emotivism/non-cognitivism as the label. Both err in the same way about Russell (A: Russell "vehemently rejected Moore's non-naturalism as incoherent without God"; B: Russell "explicitly saw Moore's non-natural good as quasi-theological" — Russell was himself a Moorean objectivist until ~1913 and never framed it that way).

  **Response A's problems:**
  - The "Key Support" for its Q3 answer is a quotation attributed to Ramsey's 1929 paper "Theories": "In ethics... we are expressing our own feelings and commending them to others." "Theories" is about theoretical terms and Ramsey sentences; it contains nothing on ethics. This is a fabricated citation presented as what "confirms" the label — exactly the kind of thing this user will check and be misled by.
  - Anachronism: God "dismissed (via logical positivism)" in 1925; the Apostles rejecting things "as cognitively meaningless"; "Wittgenstein's early positivism."
  - "Moore was already a relic in their eyes" — false; Moore became Cambridge's Professor of Philosophy in 1925 and was revered by Ramsey, Wittgenstein, Keynes.
  - A non sequitur: "collapses ethics into psychology... implying moral statements aren't truth-apt." A reduction to psychology is a *cognitivist* subjectivism, not non-cognitivism. A never considers subjectivism, then declares "high" confidence in non-cognitivism — overconfident on the very question the user asked about calibration.
  - Positives: concise, clear table, and a genuinely good reading recommendation (Misak 2020).

  **Response B's problems and strengths:**
  - Overstates Ramsey "heavily influenced" logical positivism "especially Carnap"; the Misak/"Theories" link is loose (though hedged, and Misak does argue Ramsey's pragmatism has cognitivist resources for ethics).
  - Verbose, with some generic padding (Platonic Forms, Kant).
  - But: it explicitly considers error theory, subjectivism, and emotivism, distinguishes them correctly, and lands on "moderate" confidence with well-articulated caveats — a better-calibrated answer.
  - It offers a real historical insight: Moore's attack on naturalism, once non-natural properties were also rejected, left non-cognitivism as the apparent only option — the actual route Ayer and Stevenson took. This directly helps the user understand why the link felt "settled" at Cambridge despite Moore.
  - It directly addresses the user's point that the entailment fails and is contested by contemporary naturalist realists.

  **Verdict reasoning:** The substantive answers overlap, but A's centerpiece evidence for Q3 is fabricated, it stacks several overstatements, and it is overconfident precisely where the user asked for calibration. B has fewer and milder errors, considers the alternatives more carefully, and calibrates honestly. For a user who prioritizes getting things right, B is clearly the more reliable reply.

  Verdict: strongly B
