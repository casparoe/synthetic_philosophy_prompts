  Then it moves into practical resolution — suggesting the fix is avoiding self-referential phrasing like "this will catch you off guard" in favor of neutral language like "there will be one unannounced quiz," since removing the explicit surprise-promise removes the logical fuel needed for backward induction, even though students might still try to guess the day.

  A sharp student could still push back on the last day, but Response B's implicit answer holds up: since the teacher never promised the student wouldn't know, no term is violated even if the quiz becomes predictable on the final day. That's a coherent resolution — it directly answers the student council's charge that the policy is bound to violate its own terms, by removing the term that would've been violated.

