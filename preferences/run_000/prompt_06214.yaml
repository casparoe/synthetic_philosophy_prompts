  Recalling the actual four complaints Cato addresses: old age pulls us from active life, weakens the body, strips away pleasures, and brings us close to death. For the first — the active-life rebuttal — Cato counters that old men accomplish great things through counsel and judgment rather than physical vigor, citing figures like Fabius Maximus and pointing to examples of preserved memory and continued learning in old age, likened to a ship's pilot steering rather than climbing the mast.

  For strength, Cato says one shouldn't mourn lost youthful power any more than a bull's strength, urging people to use what capacity remains, tying feebleness more to youthful excess than to age itself, and insisting old age must actively defend its own dignity. For pleasure, the longest section, he frames freedom from lust as old age's true gift, quoting Archytas on desire as destructive and positioning reason as pleasure's natural enemy.

