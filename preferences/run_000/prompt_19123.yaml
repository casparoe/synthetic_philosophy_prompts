  **Weighing:** B gets the substance right — accurate concept, exact punchline, well-handled objection, and the buildup architecture the user explicitly asked for — while A is tighter, funnier, and the right length but flubs the climax and doesn't really build to it. B's length overshoot is a genuine miss on an explicit spec (and is misreported), which is why this isn't a rout; the user will need to trim. But A's problems sit at the heart of the request, whereas B's are at the edges.

