  **Minor issues.** B attributes "hard luck" to Pereboom (that's Neil Levy's phrase; Pereboom's is "hard incompatibilism") and has Owen name-drop Pereboom in dialogue. A has Owen dismiss "'determined' nonsense" in #1 and then invoke determinism in #3 (readable as internal conflict but slightly muddled), and a garbled aphorism ("thick answers for thin realities"). Both invent backstory detail comparably.

