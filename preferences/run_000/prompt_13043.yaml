  *Response A's matrix:* A=(0,4,3), B=(4,0,3), C=(1,1,2). No pure dominance holds (each pair splits columns X and Y). The 50/50 mix gives (2,2,3) vs C's (1,1,2) — strict dominance. All arithmetic and claims check out; no errors.

