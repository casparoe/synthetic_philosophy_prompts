  Owen's next argument conflates epistemology with metaphysics—granting that current utility is often our heuristic for inferring function doesn't mean current utility constitutes function, and the etiological account still has the resources (via selection history) to distinguish genuine function from accidental benefit in a way Cummins's account struggles to match without appealing to an arbitrary choice of capacity.

  I'm also noticing an inconsistency: Owen invokes selection history to justify calling flight a function, but later dismisses natural history as unnecessary, which pulls in opposite directions. So my tentative scoring leans toward something like -1 or 0 for this move, with Nadia's opening claim scoring low, Owen's middle point scoring higher, and the third point scoring strongly, since both sides seem to overlook that modern etiological theories already accommodate recently-acquired functions, meaning Owen's supposed counterexample actually supports etiology rather than undermining it.

  The etiological account earns its keep by distinguishing genuine function from accident, malfunction, and vestigial traits — something Cummins-style functions struggle with unless you arbitrarily fix which capacity matters, which is the classic complaint that Cummins functions become too cheap and interest-relative. I'm also weighing the difference between epistemology (how we infer function from current usefulness) and metaphysics (what actually makes something a function), plus bringing in Gould and Vrba's exaptation framework, since feather-assisted flight likely arose secondarily from structures serving other purposes, with the fossil record itself staying ambiguous about gliding versus wing-assisted incline running versus true flight.

