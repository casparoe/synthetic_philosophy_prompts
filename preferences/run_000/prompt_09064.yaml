  I'm weighing two philosophical accounts of biological function: Cummins's causal-role view, where a trait's function is just its causal contribution to a system's capacity without needing history, versus the etiological/selected-effects view from Wright, Millikan, Neander, and Godfrey-Smith, where function is tied to what the trait was selected for.

  Importantly, this etiological account doesn't restrict itself to original selection—Millikan's derived proper functions and Neander's framework both allow traits to acquire new functions through later selection, and Godfrey-Smith's "modern history" version ties function to what explains a trait's *recent* maintenance. This means flight feathers' modern function of flight is fully licensed under a correctly applied etiological theory, so Nadia's move seems to be misapplying or caricaturing the etiological account rather than reflecting Millikan's or Neander's actual position—it looks more like a distortion of Gould and Vrba's exaptation framework.

  Considering whether her claim could be defended for primitive proto-feathers rather than modern flight feathers, I still find it doesn't hold for feathers generally as she states it, since flight feathers today clearly have been selected for lift and aerodynamic function, so her position looks mistaken and deserves a low score.

