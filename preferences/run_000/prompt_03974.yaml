  The consensus among scholars, including Lewis in his own "Causation" paper, is that the counterfactual gloss doesn't actually follow logically from the regularity clause—Lewis treats it almost as an aside that opens up his own project of defending a counterfactual account of causation independent of Hume's regularity theory.

  The mismatch is a matter of logical form: the regularity clause makes A sufficient for B (all As are followed by Bs), while the counterfactual clause makes A necessary for B (without A, no B). These aren't the same claim, and reading the regularity definition as also implying necessity would require an assumption Hume doesn't explicitly state.

