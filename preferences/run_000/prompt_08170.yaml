judgment: |-
  **What the user needs:** a circulable committee memo that (1) lands on a recommendation, (2) gives a concrete plan and timeframe, (3) genuinely engages the rejection side's "different animal" argument, and (4) is accurate enough to survive scrutiny from editorial-standards colleagues — including on the Augustine/Consentius reference the user just researched.

