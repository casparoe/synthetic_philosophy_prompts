  A strong answer should take seriously the "maximize essence" strand in Leibniz—his claim that perfection is quantity of essence, and that the best possible world realizes the most reality. But I should also weigh this against his insistence that the happiness of rational creatures matters distinctly, and that God's aim includes the perfection of the whole universe as expressed in the Theodicy, not merely aggregate quantity.

  The tension really is real: Leibniz does seem to hold God maximizes total perfection, treating it as an aggregative problem in "On the Ultimate Origination of Things." But the quantity maximized is essence or perfection, not well-being, so "lives barely worth living" don't map cleanly onto low-perfection beings—rational spirits carry high perfection by nature regardless of their hedonic state.

  Crucially, Leibniz explicitly held that a single spirit outweighs the entire material universe—Discourse on Metaphysics §36 states that a mind is worth a whole world since it not only expresses it but also knows it. That's a direct textual answer showing Leibniz's lexical priority of spirits over other kinds of beings.

  But a subtler question remains: does the repugnant conclusion apply within the class of rational spirits themselves? Would Leibniz favor a vast number of barely-worth-living spirits over fewer highly flourishing ones? Since happiness for Leibniz consists in perceiving perfection, a spirit with an excellent life realizes more essence than one barely worth living, so it's unclear whether sheer numbers could outweigh depth of perfection under his essence-maximization principle.

  Leibniz's perfectionism, tied to divine constraints like compossibility and harmony, suggests God isn't simply trading quantity against quality — in the best possible world, both are maximized together without genuine tension between them.

  I'm also thinking of Leibniz's "On the Ultimate Origination of Things," where he argues that existence itself has a kind of striving, and the possible world that exists is the one bringing the most essence into actuality. That's the strongest aggregative/plenitude text — it suggests God maximizes quantity of essence, which bears directly on how Leibniz's view might relate to something like the repugnant conclusion.

