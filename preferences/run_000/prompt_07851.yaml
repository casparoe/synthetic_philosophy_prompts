thinking: |-
  Both responses converge on the same core move: supervaluationism breaks the link between the truth of a disjunction and the truth of one of its disjuncts, and this "disjunction property" may be more central to our concept of truth than bivalence itself, so the view shifts rather than resolves the puzzle. I'm looking closely at Response A's framing, which treats the truth of a disjunction as parasitic on a disjunct's truth and ties this to the classical rule of disjunction elimination.

