  But then B's second section on equilibrium and ratifiability actually gets it right: it notes the only stable strategy is randomizing, that CDT lacks a genuine concept of ratifiability, and that whichever act you choose becomes unratifiable once chosen because you'd then regret it and prefer the alternative.

  B also cites solid literature here—Harper and Weirich on ratification, Skyrms and Arntzenius on equilibrium/deliberational dynamics, and Joyce's work, all of which are legitimate and relevant sources tied to the Death in Damascus case. Its other points on "Intuition of Avoidance" and "The Dominance Fallacy" seem less clean, though it does capture that EDT would rationalize fleeing as intuitively appealing.

