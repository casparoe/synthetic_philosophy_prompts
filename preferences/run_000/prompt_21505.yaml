  The underlying substance does track Strawson's actual views, though — he's acknowledged in interviews that impossibility of ultimate responsibility doesn't undermine practical systems like punishment, since consequentialist reasons still justify locking up dangerous people. Still, given the audience includes a philosophy PhD student who'd likely circulate this, presenting an unverified direct quote without flagging it for verification is a real liability, even if the general claim is defensible.

