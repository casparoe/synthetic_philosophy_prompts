  But I'm noting neither memo grapples with the deeper counter: if sanctions are purely forward-looking, why does proportionality to harm still matter, and doesn't that smuggle in a retributive/desert-based component the student's argument could exploit? Response A gets closest by invoking proportionate consequences based on severity of harm and risk assessment, but doesn't fully resolve this tension.

