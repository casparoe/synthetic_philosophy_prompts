  A's scores skew systematically pro-Elena/anti-Marcus in a way that would give the user a distorted picture of who was right, on precisely the question they asked to have settled. B's scores match what a knowledgeable referee would assign, and its readings of what each colleague actually said are more accurate. Formatting and depth on the bonus question are comparable.

