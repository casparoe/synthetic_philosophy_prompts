  **What the sample answer actually gets wrong (the bar for a good TA response):**

  1. The "tyrant by title / tyrant by exercise" terminology is Bartolus of Sassoferrato's (14th c.), not Aquinas's — Aquinas has an analogous acquisition-vs-use distinction in the *Sentences* commentary, but the labels are anachronistic and not in *De Regno*.
  2. The claim that Aquinas "backs this up with Aristotle's *Politics*" for the worse-successor argument is a flat misattribution. In *De Regno* I.6 the source is Valerius Maximus's anecdote about the old Syracusan woman and Dionysius, and the surrounding argument leans on 1 Peter 2 and the example of the martyrs.
  3. The Locke comparison ("ultimate authority rests with the people") is anachronistic; Aquinas's remedies are conditional public deposition by a multitude *that has the right to install*, appeal to a superior, and recourse to God.
  4. The sample omits the theological arguments entirely.

  Since the rubric explicitly includes "how accurate the specific attributions/sources are," the Aristotle and Bartolus issues are almost certainly the planted traps.

  **Response A:** Catches the Locke anachronism thoroughly and correctly notes Aquinas grounds authority in God/natural law with the community's conditional power to depose "if no superior exists." Flags the omission of the theological dimension. Lands at 17/20 (B+). Misses the Aristotle error (even praises "citing Aristotle correctly") and the Bartolus terminology. Also introduces its own bad citation: "mixed regime (De Regno I.2, I.5)" — the mixed-regime endorsement is ST I-II q.105 a.1; De Regno I.2 argues for monarchy.

  **Response B:** Catches the Locke anachronism but treats it as a -1 matter and concedes a "structural similarity" to Locke's solution. Explicitly marks the Aristotle attribution as correct in the attributions section — the exact rubric component where it is wrong. Calls the Bartolus distinction "textbook." Does usefully note the sample omits the "superior authority" remedy. Lands at 18/20 (A-), which is too generous given the planted errors.

  **Comparison:** Both share the same central failure (missing the Aristotle misattribution and Bartolus terminology). A is more critical, gives a fuller and more accurate account of Aquinas's theory of authority versus Locke's, flags the theological omission, and arrives at a grade closer to what the sample deserves. Its liability is the hallucinated De Regno citation, which the user could repeat. B is milder, more generous, and its attribution score of 4/5 is hard to defend. On net A serves the user slightly better, but the margin is small given the shared blind spots.

