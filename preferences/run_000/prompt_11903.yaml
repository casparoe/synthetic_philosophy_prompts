  **Net.** Same scores, same total, same shared miss. A follows the quoting instruction more faithfully and gives a more precise, more defensible justification on the one criterion where the grade is contestable; B has slightly richer explanation on two of the uncontroversial criteria but includes a questionable "irrelevant" judgment and a general-quality remark. The margin is small.

