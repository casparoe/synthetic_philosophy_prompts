  A rigorous answer needs to unpack several pillars: heterogeneous priors as an escape hatch from the common-prior assumption underlying no-trade theorems, the noise-trader/liquidity-trader models (Kyle, Glosten-Milgrom, Black) that let informed traders profit by hiding among uninformed ones, and the Grossman-Stiglitz paradox showing that perfect efficiency would eliminate the incentive to gather information in the first place. I also want to stress that EMH doesn't strictly depend on universal rationality—Fama's arbitrage argument only needs enough rational traders to correct mispricing—so the no-trade theorem's assumptions and EMH's fate aren't as tightly coupled as the question implies.

  Beyond that, I should address the debate over whether heterogeneous priors even count as "rational" (Aumann vs. Morris), the fact that anonymous markets prevent traders from knowing whether their counterparty is informed or noise (making trade rational even under common knowledge), and finally the behavioral literature on overconfidence (Odean, Daniel-Hirshleifer-Subrahmanyam) as an alternative explanation for observed trading volume.

  I also want to clarify that EMH is fundamentally about price efficiency, not about trade volume, so the no-trade theorem doesn't directly bear on it — though Grossman-Stiglitz shows real tension between prices being fully informative and having any incentive to trade at all.

