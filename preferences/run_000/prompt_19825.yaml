thinking: |-
  I'm noting the false premise here: the user assumes pragmatism reduces truth to "whatever works" and that Peirce and James held the same view, when actually their theories differed significantly, and Peirce's renaming to "pragmaticism" reflected a genuine philosophical break rather than an overreaction. I should correct this before addressing how much pragmatism actually contributed to post-truth thinking.

  Now I'm checking Response A's accuracy on Peirce—his idea of truth as the ultimate opinion a community of inquirers would converge on through indefinite investigation, tied to the pragmatic maxim about meaning. The claim that a true belief "corresponds" to this ultimate reality is a bit loose since Peirce's view leans more toward convergence than strict correspondence, though it's a minor imprecision rather than a serious error.
judgment: |-
  Both responses do the essential things the user needs: they correct the false premise that Peirce and James held the same theory of truth, explain the Peirce/James divergence (communal long-run convergence vs. individual experiential "working"), explain the "pragmaticism" renaming with the correct "ugly enough to be safe from kidnappers" quote, and conclude that blaming pragmatism wholesale for post-truth is a misattribution, with James's rhetoric being more vulnerable to distortion than Peirce's. Structurally and in conclusions they are near-identical.

  **Response A** is somewhat cleaner on accuracy. Its characterization of Peirce (pragmatic maxim as a theory of *meaning*, truth as the final opinion of indefinitely pursued inquiry) and James (the accurate "good in the way of belief, and good, too, for definite, assignable reasons" quote, the will to believe, insistence that beliefs "cash out" and not contradict facts) is standard and defensible. Crucially for a piece on the *philosophical* roots of post-truth, it points to more plausible alternative philosophical sources (radical relativism/postmodern skepticism) rather than only sociological/technological factors. Minor issues: "corresponds to this ultimate reality" is a bit loose, and "truth is what works *now*" slightly caricatures James (who spoke of expediency "in the long run and on the whole"), but the caveats elsewhere mitigate this.

  **Response B** has some genuine advantages: the "Truth happens to an idea. It becomes true, is made true by events" quote is a key Jamesian text A omits; the "Pragmatism's Core Defense Against Post-Truth" paragraph is well-put; and the closing advice tailored to the user's piece is helpful. But the "Concrete Examples" section, meant to sharpen the distinction, introduces errors. The squirrel example is misused: James's resolution (north/east/south/west vs. front/right/behind/left) *is* in terms of observable spatial relationships and is a textbook application of Peirce's own maxim—James credits Peirce in that very lecture—so claiming "Peirce would likely argue this misses the point" is wrong and would embarrass a writer who repeated it. The diamond example manufactures a contrast by attributing to James a focus on "immediate practical value of believing," when James endorsed the conditional analysis. Two of three illustrations are shaky, which matters for a user trying to get things right in a published piece.

  Both miss Rorty, arguably the most relevant pragmatist for the post-truth debate, so that's a wash.

  The trade-off is small—B is a bit richer and more tailored, A is a bit more reliable—but since accuracy is weighted above polish and B's added material contains the only substantive errors, A edges ahead.

  Verdict: weakly A
