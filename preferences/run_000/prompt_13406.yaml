judgment: |-
  **What the user asked for:** a decisive defensibility-ranking (explicitly not popularity) of nine named positions, in a five-tier S–D JSON template, one sentence per tier, no "verbal dispute" cop-out, and a clear answer to "which bites the smallest bullet."

