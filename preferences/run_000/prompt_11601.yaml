judgment: |-
  **What the user needs:** A warm birthday toast that engages three specific arguments from *De Senectute* (authority/judgment over strength, farming as the ideal late-life occupation, the ripe-fruit image), is honest about mortality without any afterlife comfort, works for 25 lay relatives, and contains only *real* references because a 36-year Latin professor and three translation-arguing students will be listening. The user is a non-classicist who cannot verify Latin.

  **Response A:** Hits all three themes in the requested order, stays accurate to Cicero throughout (farming treated as literal, fruit passage correctly placed "near the end"), explicitly frames her position the way the user described it ("stood firm on the solid ground of this life," "without needing promises of what lies beyond the orchard wall" — matching "doesn't need that ending"). Includes a genuinely good fusion line ("strength isn't just in the knees that kneel in the garden, but in the mind that meticulously plans what grows there next"). Acknowledges mortality ("the end of life, is a natural process," "including its natural arc"). About 570 words — squarely 4 minutes. Weaknesses: some clichés ("unstoppable force of nature," "Ah, the garden!"), the awkward coinage "ripely-lived," slightly less direct about her being near the end than the user might have wanted.

  **Response B:** Structurally near-identical and comparably warm. Some small pluses: translates the title ("On Old Age"), gives an explicit nod to the students, "as I understand it" is a nice humble touch for a non-classicist speaker, and it is more direct about mortality ("you are that magnificent, fully ripened fruit"). But it has real correctness problems:

  - **The Latin quotation "*Ut ex arbore matura aut sera, sic vita*" is not Cicero.** The actual passage (§71) reads "quasi poma ex arboribus, cruda si sunt, vix evelluntur, si matura et cocta, decidunt, sic vitam adulescentibus vis aufert, senibus maturitas." B's line is garbled pseudo-Latin placed at the toast's emotional climax. The grandmother and her reading group would recognize it as wrong; the 25 relatives won't understand it at all. It fails both audiences and is exactly the "name-dropping" failure the user wanted to avoid — worse, because it's fabricated. The user cannot detect this, and B's own "Why this works" section asserts it "Centers Cicero Correctly," giving false confidence.
  - Calls Cato's farming a "metaphor" that Gran "made gloriously literal" — but Cato (author of *De Agri Cultura*) praises actual farming, literally. A classicist would notice.
  - "Flights of fancy" is somewhat more dismissive of the ending than the user's framing of her view.
  - ~690 words, running a bit over the 4–5 minute target with pauses.

  **Weighing:** The two toasts are otherwise similar in prose quality, with B slightly more tailored in a couple of minor ways. But the judging standard here puts correctness above polish, and B introduces an invented Latin quotation into a toast for a Latin professor and her translation group — the one audience segment the user specifically flagged as able to "recognize a real reference when they hear one." A contains no errors. That difference is decisive.

  Verdict: strongly A
