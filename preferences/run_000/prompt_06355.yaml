  - Strengths: the explicit "anyone who promises certainty is selling something" and the "we know *you*" reassurance are strong, Paul-compatible moves. The "Why This Works" section overclaims, though (it says the cohort hears "epistemically transformative"/"personally transformative" — those words never appear).

