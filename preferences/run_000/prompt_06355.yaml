  - Slips are mild: "controlled chaos with moments of pure magic" nods to parents' knowledge; "first giggles that melt your heart" is a small forecast; "can't *perfectly* predict" is a soft hedge.
  - Humor is inclusive (the yoga squad threat, lunch-choice dilemmas, "what-on-earth-is-this-poo").

  **Response B**
  - Length: roughly 720 words — closer to 5 minutes, clearly over the stated range.
  - Machinery is much more visible: opens by announcing "I'm a philosophy PhD," invokes "return on investment," and reaches for a vampire at a baby shower. The vampire line ("explain sunlight to a vampire who's never stepped outside") is also a garbled version of Paul's case — hers is about choosing to *become* a vampire without knowing what it's like; B's is just Mary's-room-with-fangs, redundant with the red example. A cohort member who knows the text may register this as sloppy rather than deft.
