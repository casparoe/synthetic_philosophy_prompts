  I need a story under 1000 words in a Max Black-style symmetric universe, where a character tries to use a relational property like distance to prove two indiscernible spheres are actually discernible, but the setup must demonstrate through events why this fails — since any relational property will apply equally to both symmetric objects unless a third, asymmetric reference point is introduced, which would itself break the symmetry.

