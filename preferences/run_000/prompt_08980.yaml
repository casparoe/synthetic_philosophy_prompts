  **Part 3:** Both land on "masked," with reasonable justifications. B adds a nice observation that RCA-like safety strategies (ensure good dispositions persist under training stimuli) would catch finkish shifts but miss masked deception. A's stimulus/mask framing is marginally cleaner. Neither notes the sharper possibility that deceptive alignment may be neither fink nor mask but simply a conditional disposition whose trigger isn't met.

