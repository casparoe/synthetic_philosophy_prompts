  Really the cleanest Humean answer is that cyclical preferences aren't inherently irrational—only a false judgment of cause and effect counts as a failure of reason. So getting money-pumped is irrational in Hume's sense only if the agent falsely believes the trades are costless or fails to grasp the cumulative consequences; if they see the outcome clearly and still trade, that's just a preference for immediate gain outweighing the passion for retained wealth, not a defect of reason.

