judgment: |-
  Both responses take an almost identical shape: initial intrigue → scrutiny of flexible analysis → replication failures as decisive → approval of the field's self-correction → personal disappointment without compromise. Both lean heavily on the Creery episode the user already supplied, and neither brings in other documented Sidgwick material that would have made the answer more genuinely grounded (his "drive the objector into a corner" evidentiary standard, the Brighton hypnosis card-guessing experiments with his wife and Alice Johnson, the Census of Hallucinations' explicit worry about selection bias, his late-life disillusionment, or his hostility to a priori dismissal by mainstream science — which would have complicated his view of Wagenmakers-style low-prior Bayesian critiques). Neither mentions the JPSP refusal to publish replications, which is a notable part of "the field's reaction." So both fall somewhat short of the user's request to go beyond the generic, and both loosely equate "fraud discovered" (Creery) with "replication failed" (Bem).

  Differences are small:

  - **Response B** is more concrete about Bem's actual criticized practices (multiple dependent variables, exploratory-as-confirmatory analysis, Bayesian reanalyses, publication bias) and about the reforms that followed (pre-registration, larger samples, open data). It adds a genuinely SPR-specific point—the insistence on multiple independent observers present during experiments—and maps it onto Bem's computer-based setup. It also captures that Sidgwick would likely push for continued research under stricter protocols rather than abandoning the question, which fits his persistence. Its weakness: the assertion that "the SPR explicitly condemned" optional stopping and selective reporting is an overclaim stated as fact (there is some basis in Gurney's concern with the "fallacy of selection," but not as B frames it).

  - **Response A** has a nice callback to Kant's postulate remaining unsatisfying, and adds the idea that Sidgwick might fault the original peer review gatekeeping. But its suggestion that the erotic-picture task might raise concerns about "sensory leakage" is a poor fit for a computer-randomized, sender-less design; B makes a similar point but hedges it more appropriately. A's "extraordinary claims demand extraordinary evidence" is Sagan, not Sidgwick.

  On balance the two are close, but B engages a bit more specifically with both Bem's methodology and SPR practice, which is what the user asked for, at the cost of one unsupported historical assertion.

  Verdict: weakly B
