  The student's pushback is a real philosophical point worth taking seriously: LLMs don't have beliefs or intentions, just predict tokens, so is talk of "honesty" and "deception" in AI safety just anthropomorphizing when only truth/falsity of output matters? I want to validate the sharp observation while still explaining why the terminology in alignment research isn't just careless anthropomorphism.

  The weak point in their argument is treating truth/falsity of output as the only thing that matters. A model that confidently states a fabricated citation versus one that flags uncertainty are behaving differently even if both outputs turn out false, and that gap matters for safety research. There's also a meaningful distinction between hallucination -- confabulating without any internal representation of the truth -- and deception, where a model's output diverges from what it would represent or say under different conditions, which is exactly what research on sycophancy, sandbagging, and situational awareness is trying to capture.

  Beyond that, interpretability work shows models have internal representations correlating with truth that can diverge from their outputs, so "true/false" doesn't fully capture the phenomenon; honesty also covers misleading-but-technically-true statements and selective omission. And the "just predicting the next word" framing, while accurate at one level, doesn't rule out functional beliefs or goals -- the claim that models lack beliefs or intentions is itself a contested philosophical position, not a settled fact.

  I also want to flag why researchers care about this: as models grow more agentic, the crucial question is whether they'd strategically deceive precisely in cases where we can't verify their outputs against ground truth -- that's the scalable oversight problem. If we could always check the truth, honesty as a concept wouldn't matter; it matters exactly because we often can't, so we need systems disposed toward truthfulness rather than just correctness.

