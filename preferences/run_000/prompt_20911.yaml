  I'm recalling the actual literature here: surrogate goals originate with Tobias Baumann and CLR, later formalized by Caspar Oesterheld as Safe Pareto Improvements, where the threatener isn't worse off (and possibly better off) threatening the surrogate instead of the real goal.

  The key move that answers the objection is that the threatener knows the surrogate is fake — no deception needed. If the agent commits to treating threats against the surrogate identically to threats against real values, threatening the surrogate yields the threatener the same payoff, so it has no extra incentive to target the real value. Some formulations even have the agent become deliberately less responsive to real-value threats, since the surrogate absorbs that role.

  I recall this is Baumann's 2018 "surrogate goals" proposal: the agent adopts a fake goal it commits to defending as genuinely as the real one, so threats against it cause no actual harm while still extracting the same concessions from the threatener. The remaining puzzle is that a spiteful or sophisticated threatener might still target the real goal anyway, just to inflict damage rather than for concessions.

