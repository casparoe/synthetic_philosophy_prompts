judgment: |-
  Both responses agree with the user's thesis (the psychical research was integral to the dualism of practical reason, not a hobby), lay out the dualism, explain the hoped-for theological/providential resolution, and draw the implications of inconclusive results: the dualism stands, utilitarianism cannot compel an egoist non-question-beggingly, and self-sacrificial morality lacks a cosmic guarantee. On the core content they are close.

  **Accuracy issues in each:**
  - Response A claims Sidgwick "in later editions of *Methods* and his memoirs" described ethics as a "chaos" and his work as ending in "failure" because of psychical research's failure. The "Cosmos of Duty... reduced to a Chaos" / "foredoomed to inevitable failure" language is from the *first* (1874) edition — before the SPR existed — and was dropped from later editions (only "fundamental contradiction" survives). Sidgwick also wrote no memoirs; the *Memoir* was compiled posthumously by his wife and brother. So A's edition history is backwards and the causal attribution is anachronistic.
  - Response B offers a "famous" quote ("For more than twenty-five years I have been waiting for proof of human survival of death... I have not yet obtained it") that I can't verify and which closely resembles William James's well-known "for twenty-five years..." passage rather than anything I can place in Sidgwick. Likely a misattribution or paraphrase dressed as a quotation. However, it doesn't misrepresent Sidgwick's actual stance.

  These flaws are roughly comparable in seriousness.

  **Depth and usefulness:**
  - Response A is solid but repetitive: its "Implications" section and "Conclusion" restate the same four points. It handles the user's "getting shafted" framing well and adjudicates the debate directly, though its claim that the friend "hits the nail on the head" and "Sidgwick agreed" slightly overstates Sidgwick's position (he held benevolence rationally binding regardless; only its *overriding* authority over egoism needed the postulate). It does qualify this afterward.
  - Response B covers more of the relevant terrain the user asked about: it flags Sidgwick's fallback of adopting the moral order as a practical postulate/"act as if" (a key part of how the inconclusiveness actually bears on the dualism), it enumerates what a non-question-begging foundation would need to appeal to (providence, intuition, naturalistic explanations — and why the last doesn't answer the normative question), and it connects to Parfit's later attempt to dissolve the dualism via personal identity without an afterlife, which is directly relevant to "whether utilitarianism can *ever* get a fully rational foundation." It also gives concrete texture on the research (fraud exposure, the Piper investigations), which is accurate.

  Neither notes the important point that evidence of *survival* alone wouldn't establish moral bookkeeping, nor Sidgwick's argument that earthly sanctions fail to secure coincidence of duty and interest. Both open with sycophancy.

  On balance, B is somewhat more informative and better addresses the forward-looking part of the question, with accuracy problems of similar weight to A's.

  Verdict: weakly B
