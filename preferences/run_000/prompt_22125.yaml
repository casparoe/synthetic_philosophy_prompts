judgment: |-
  **What the user needs:** a deliverable 3–4 minute speech that (1) handles Priya's "anyone would've done it" line without conceding her act was mere duty, (2) praises her without implying the bystanders were cowards, (3) distinguishes her award from the mandatory volunteer-hour pins, and (4) survives scrutiny from a philosophy teacher and classmates who know Urmson. Both responses deliver a competent, warm, appropriately-lengthed speech plus a helpful "why this works" breakdown, so the decision comes down to precision on the philosophy and factual care.

  **Response A – strengths:** The supererogation logic is the tighter of the two. "Any reasonable person would have called for help… and that would have been *enough*" cleanly sets the duty baseline and protects bystanders. "It's not about comparing Priya to anyone else who was there that day… wasn't expected, wasn't required" is textbook. Most importantly, the line "Not because you owe us heroism, but because you gave it freely" locates the praiseworthiness exactly where Urmson puts it — in the deontic status, not in rarity. And "So yes, Priya, *some* people might have done what you did" deliberately keeps her on the same moral tier as everyone else, which is precisely the trap the user said they wanted to avoid. The volunteer-pin contrast ("meeting an expectation vs. surpassing it entirely") is the correct distinction. A also quietly nods to the Wolf "Moral Saints" reading ("extraordinary goodness isn't about being perfect") and flags it in the notes — evidence it read the whole prompt.

  **Response A – weaknesses:** It invents a surname ("Priya Sharma," twice) that the user never supplied — a genuine fabrication the user must catch and fix. "Volunteering is a requirement… it's a path we choose" is slightly muddled. The notes mislabel calling for help as "permissible" rather than required, though the speech itself gets it right.

  **Response B – strengths:** No fabricated name. "Facing danger isn't an obligation; it's a choice few make" and "an obligation we plan for" are clean. The close ("heroes aren't mythical—they're people like you") is warm and pulls her back to earth. The quiz nudge is a nice touch.

  **Response B – weaknesses:** Right after saying "not to shame anyone who'd have chosen differently," it praises Priya for choosing "bravery over safety, action over *hesitation*, and compassion over *calculation*" — a triplet that paints the alternative as hesitant, self-protective, and calculating. That's exactly the kind of subtle slip a philosophy classmate would clock. "It wasn't about checking a box" is dismissive toward the volunteer recipients at a public assembly. The heavier emphasis on rarity ("exceptional in the truest sense," "a choice few make") leans closer to the "different moral tier" framing the user worried about. "Stepped onto unstable ice" is less faithful to "went in after him." It doesn't engage the Moral Saints reading at all.

  **Weighing:** A's surname invention is the most concrete error here and is a real "getting things right" failure, but it's glaring and will certainly be caught. B's problems are subtler and more likely to survive into the delivered speech — and they're precisely the logic-sloppiness the user asked to avoid. On the user's central concern (philosophical robustness and calibration), A is somewhat stronger; on factual hygiene, B is stronger. This is a trade-off, but I think A's better handling of the core conceptual worries edges it.

  Verdict: weakly A
