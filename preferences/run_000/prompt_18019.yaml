  Kokotajlo's original point is that consequentialist agents face incentives to commit early, creating a race that can end catastrophically -- and crucially, he argues UDT-style updatelessness doesn't escape this, since the race just shifts to "logical time" and to how updateless one's prior is. This means the user's skepticism actually aligns closely with Kokotajlo's own stated view in that post, which is useful to build on.

  This creates pressure to commit before thinking rather than harden after considered deliberation, which undermines the very process that would make ex-ante commitments trustworthy. And the "veil" here isn't truly Rawlsian—each UDT agent's prior is shaped individually by its own designer and utility function, so their behind-the-veil policies aren't jointly chosen but each self-interestedly optimized, making the fairness illusory rather than genuine.

  Also worth noting: since agents commit without knowing what others will commit to, strategic uncertainty persists, and the logical-time race becomes about making one's commitment "logically earlier" through unconditional policies—essentially discarding the steering wheel. Yet there's a subtlety: because UDT can condition on the other's source code, it could in principle commit to conditional policies like cooperating with agents running specific code, avoiding the full rigidity that unconditional ex-ante commitment implies.

  This actually strengthens the case for program equilibrium as a counter to the user's argument—verifiable conditional commitments can escape the naive race. But the deeper issue is that choosing which conditional threshold or fairness notion to commit to is itself a bargaining problem with multiple equilibria, so the race just shifts to who sets that threshold; the Nash demand game with verifiable commitments still admits any split as equilibrium, meaning there's no unique ex-ante optimal policy.

