judgment: |-
  Both responses answer the two direct questions correctly and along the same lines: "only science" is literal but in Hobbes's specific methodological sense of *scientia* (demonstrative knowledge from definitions), and "reckoning" is not a synonym for defining terms but Hobbes's substantive claim that reasoning *is* computation — the adding and subtracting of names (Leviathan ch. 5). Both then sketch the bigger argument: Leviathan as an attempt to do for politics what Euclid did for geometry. So the core is a wash; the differences are in precision and in extras.

  **Response B's strengths:** It seizes on the word "hitherto" in the very passage the user quoted and uses it to answer the "did he mean it literally?" question with exactly the right nuance — geometry is the only science *so far*, and Leviathan is meant to be the second (Hobbes indeed claimed civil philosophy began with his own work). Its account of Hobbes's natural philosophy as hypothetical/probable rather than demonstrative is more accurate than A's. Its "reckoning" explanation is more tightly tied to the text: names as marks for phantasms, syllogisms as sums of premises (which is how Hobbes himself puts it), geometric figures defined by motion, and the observation that the laws of nature are called "theorems" — all correct details. Its "bigger argument" adds the politically crucial link between linguistic ambiguity ("insignificant speech"), civil war, and the sovereign's role in fixing meanings, which is central to why this epistemological passage sits inside a political treatise.

  **Response A's strengths:** It explicitly names Hobbes's nominalism, the anti-Cartesian materialist stakes, and theology as a non-science. Its biggest extra is the closing section tying the passage back to the Wallis dispute the user opened with — a genuinely welcome connection for this user. However, that section is somewhat loose: it frames Wallis as representing an "empirical" approach (the geometry dispute was really about algebraic vs. classical methods, and Hobbes's own geometry was in some ways the more "materialist" side), calls Wallis's methods "calculus" (anachronistic), and presents an interpretive thesis about Hobbes's motives as settled fact. A also has minor imprecisions elsewhere — describing geometric figures as "mental constructs... not messy sense data" sits awkwardly with Hobbes's view that all conceptions come from sense, and "absolute certainty" glosses over Hobbes's insistence that science is conditional knowledge of consequences.

  Neither makes a serious error. B is a bit more textually careful and directly leverages the quoted passage to answer the user's question; A offers a valuable but looser bonus on Wallis. Under the rubric of getting things right first, B edges ahead, though the Wallis tie-in makes this a reasonable trade-off.

  Verdict: weakly B
