  **Where the two rankings agree:** Newton in S, Sklar in C, Leibniz in D. Both are uncritical about Newton (neither mentions that absolute space posits undetectable absolute velocity, or Sklar's parity point that primitive acceleration is no worse than absolute space), but that's a shared weakness.

  **Where they differ — Mach and sophisticated substantivalism:**

  - Response A puts Mach's principle in **S** and Barbour in **A**. This is hard to defend: Mach supplied a programmatic idea with no mechanism (and GR only partially realizes it), whereas Barbour–Bertotti/shape dynamics is the concrete implementation that actually derives inertial frames from the matter distribution via best matching. Ranking the promissory note above the delivered theory inverts the literature's assessment. Response B puts both in A with the correct caveat that Mach is "not fully realized in standard GR."

  - Response A puts sophisticated substantivalism in **B**, claiming it "explains the bucket only indirectly through GR's metric field (which incorporates Machian ideas)" and "enables GR's Machian explanation." This conflates substantivalism with Machianism — the substantivalist's explanation *is* rotation relative to the metric/affine structure, the anti-Machian answer. It's also inconsistent to put Newton in S while putting the modern, dynamically-coupled version of the same explanatory strategy two tiers lower. Response B correctly describes it (manifold + metric, inertio-gravitational structure, local inertial frames) and ranks it with Newton.

  **Other accuracy issues:**

