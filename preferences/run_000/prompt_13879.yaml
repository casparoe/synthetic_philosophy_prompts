  Turning to Parfit's rebuttal in "Innumerate Ethics," I'm recalling that his core strategy is to challenge each of the supposed mistakes Taurek attributes to those who think numbers matter, showing that Taurek's reasoning doesn't actually support ignoring numbers.

  Parfit's key counterexample is that Taurek's logic would absurdly imply an equal chance is warranted even when comparing one person against a million, and Parfit shows that equal-chances reasoning doesn't naturally lead to a coin flip anyway. The heart of his response is his slogan that we save the greater number precisely because we give equal weight to each individual—each person counts for one, so more people count for more.

  I'm trying to recall whether Parfit's paper actually frames Taurek's errors as a numbered list culminating in a "Fifth Mistake," and I don't think that's accurate—Parfit doesn't concede that Taurek correctly identifies earlier mistakes before committing a final one. That framing seems like an invented structure rather than something drawn from the actual text.

