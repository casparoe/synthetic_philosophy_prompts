  I'm also thinking of Lewis's own move in *On the Plurality of Worlds*: he answers the "why care" objection by saying this world matters because it's *ours*, not because it's improbable — that could be the real hook for the toast. And there's something charming in noting they're "worldmates" in the technical Lewisian sense, sharing spatiotemporal relation, which might work as a sweet, nerdy true line.

