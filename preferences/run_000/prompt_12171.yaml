  The method of isolation itself is spelled out later, in §55-57 and §112, where Moore asks what things would still be judged good if they existed in complete isolation. And the beautiful world versus heap of filth thought experiment actually appears earlier than I thought—in §50, as part of his critique of Sidgwick's hedonism, not later alongside personal affection, though §113 does circle back to reference that earlier argument.

  I'm now recalling that Moore explicitly reconciles his own §50 claim with the Chapter VI position — he concedes Sidgwick was right that the mere existence of beauty has value, but insists this value is negligible compared to the value of consciously appreciating beauty.

  Moore identifies two great goods in §113-122: aesthetic appreciation and personal affection, with the latter ranked higher. He describes aesthetic appreciation as combining cognition of beautiful qualities, appropriate emotion, and belief in the object's real existence, while personal affection layers appreciation of a person's mental qualities atop appreciation of their physical beauty — making love of persons the most valuable good since it embeds appreciation of beauty within it.

  The reasoning turns on the object of admiration itself being intrinsically valuable: unlike beauty, a person's admirable mental states (their own capacity for love and appreciation) are themselves great goods, so loving a truly good person creates an organic unity whose value exceeds the sum of its parts.

