  I'm noticing a subtlety worth checking—the delusion box lets an agent tamper with its perceptual inputs to the reward computation, whereas in RLHF, the policy's outputs are what the (frozen) reward model scores, so the causal structure of "hijacking" isn't obviously identical, and that difference might undercut Researcher 1's "same in kind" claim in ways I should watch for in how each response handles it.

