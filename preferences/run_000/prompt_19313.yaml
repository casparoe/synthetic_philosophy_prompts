  That transformer's judgment in choosing what and how to depict undermines any claim of pure isomorphism between image and fact. On Wittgenstein's picture theory, it concerns logical form rather than visual resemblance, and the connection to ISOTYPE's repeated icons is closer to a Hertzian scale-model diagram, tracing back to a shared ancestry in Hertz's and Boltzmann's Bildtheorie that both thinkers drew from.

  The similarity likely stems from these common sources rather than direct influence between Neurath and Wittgenstein, and repeated-icon charting has earlier 19th-century precedents anyway. I'm also questioning whether the cardinality-based structure in ISOTYPE's icon repetition genuinely counts as "logical form" in Wittgenstein's technical sense, which concerns how names combine into propositions mirroring how objects combine into states of affairs.

  Then I land on 4.04 as the real hook — Wittgenstein's remark that a proposition must share "the same logical (mathematical) multiplicity" as the situation it depicts is the closest Tractarian passage to the unit-repetition principle, and neither response cites it, which would be a genuinely useful specific reference for the student. I'm also thinking about the saying/showing distinction: in the Tractatus, what can't be said is the pictorial/logical form itself — a proposition shows its sense but can't represent its own form of representation (2.172-2.174, 4.121) — and I want to work out what the ISOTYPE analogue of that would be.

