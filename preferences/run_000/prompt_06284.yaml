judgment: |-
  **What the user needs:** 8–10 theology questions for an in-character Newton who can only answer from his own writings, with four mandated topics (Locke/secrecy, date-setting vs. 2060, General Scholium designer vs. unitarian God, alchemy vs. degeneration-of-religion), each with a follow-up keyed to Newton's most likely dodge. The audience is history-of-science grad students, so accuracy and grounding in the actual corpus matter.

  **Coverage of the four mandated questions:**
  - *Secrecy/Locke:* Both handle it competently. B's follow-up (Whiston, complicity, "does prudence become complicity") is somewhat sharper. Both share the minor Blasphemy Act anachronism (1698 vs. the 1690 Locke episode).
  - *Date-setting:* B's anticipated dodge ("I set a terminus a quo, not a terminus ad quem... to refute those who set earlier dates") is essentially Newton's actual stated rationale in the 2060 manuscript ("not to assert when the time of the end shall be, but to put a stop to the rash conjectures of fanciful men"). A's dodge is close but looser. Both follow-ups land.
  - *General Scholium:* Both ask the identity question and probe strategic silence. B poses it more directly (identical? and if so, why silent?) and uses "Lord God Pantokrator," which is the right handle.
  - *Alchemy:* B is clearly stronger. Its follow-up invokes prisca sapientia and Newton's parallel mining of Hermetic/Chaldean/Egyptian and biblical texts for corrupted original wisdom — exactly the McGuire/Rattansi/Dobbs framing a history-of-science audience would recognize. A's anticipated dodge ("original matter likely contained the principles later hidden or corrupted") doesn't sound like anything Newton wrote, and its follow-up is speculative.

  **Extra questions:**
  - A: Q5 (scripture authority vs. forgery — good), Q6 (prophetic "literalism" vs. sacramental literalism — conceptually muddled; Newton's historicist symbol-decoding isn't literalism, and the follow-up collapses on that error), Q7 (Mint counterfeiting analogy — gimmicky; Newton used "corruption," not "counterfeiting," and the dodge "might invoke Locke" isn't from Newton's writings, though the conformity point is legitimate), Q8 (Chronology — good, and distinctive).
  - B: Q5 (church conformity — substantive and answerable from Irenicum material), Q6 (certainty of prophetic hermeneutics — answerable from his Rules for interpreting the Apocalypse; sharp circularity follow-up), Q7 (Christ's nature — excellent, drives straight into the richest manuscript material; Arianism follow-up is well-targeted), Q8 (purpose of natural philosophy — answerable via Bentley letters). These are more central to Newton's actual theological corpus and better fit the "only what he wrote" constraint.

  **Accuracy problems:**
  - B has one glaring error: calling Newton a "member of its clergy (as Lucasian Professor and later at the Mint)." Newton famously obtained a royal dispensation in 1675 exempting him from ordination — precisely because of his heterodoxy. Any grad student in this field would wince. It's contained in a parenthetical, though, and the underlying question about conformity remains valid.
  - A's problems are less glaring but more structural: an entire question (Q6) built on a mischaracterization, another (Q7) attributing "counterfeiting" language he didn't use, and some possibly invented quotes ("presumptuous curiosity"). B also embellishes some quoted words.

  **Net:** B serves the user better on the four required topics (decisively on alchemy, modestly on date-setting and the Scholium), its supplementary questions are more substantive and more answerable from Newton's actual writings, and its dodges are more precisely keyed to what Newton said. The clergy blunder is a real cost that keeps this from being a clear rout, but A's confused Q6 and gimmicky Q7 offset it substantially.

  Verdict: weakly B
