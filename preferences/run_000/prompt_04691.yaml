  I'm recalling Thornley's proposal that agents hold incomplete preferences—specifically a preferential gap between trajectories differing in shutdown time—and thinking through the standard money-pump objection to incomplete preferences that this proposal needs to address.

  The classic single-sweetening money pump requires a preferential gap between A and B that persists even when A is sweetened to A+, allowing an agent to be cycled from A+ down to A through a series of seemingly rational trades, ending up strictly worse off. I'm trying to nail down the exact structure of this pump so I can properly evaluate how Thornley's solution avoids it.

  So the agent ends up with A⁻, strictly worse than A, having taken two individually permissible trades—that's the money pump.

  Now I'm trying to recall Thornley's proposed fix for this. I believe he invokes some dynamic choice principle, possibly resolute choice or a rule against dominated plans, though I'm not fully certain of the exact name he uses.

  I think this connects to work by Sami Petersen on invulnerable incomplete preferences, which proposes a "Dynamic Strong Maximality" rule: at each choice node, don't select an option if a previously available alternative would have dominated it. I'm trying to pin down the precise formulation of this dynamic consistency constraint.

  For the A → B → A⁻ money pump specifically, an agent evaluating full plans upfront would rule out the plan ending at A⁻ since it's dominated by simply keeping A, so it never falls into the trap—it either keeps A or trades to B and stops there. The user's real question is whether this resolute strategy genuinely blocks exploitation or just secretly makes the agent behave as if its preferences were complete, which touches on a live debate between Gustafsson and Petersen about whether resolute choice is a substantive solution or a disguised concession.

  Petersen and Thornley's counter is that a genuinely incomplete agent behaves differently from a complete one across trees—it wouldn't pay to shift probability between two options it has no preference between, whereas a complete-preference agent would pay something unless strictly indifferent, and even an indifferent agent would accept a sweetened option that a truly incomplete agent might reject due to preferential gaps.

  One nuance worth tracking: Thornley's actual proposal isn't a single blanket gap between any shutdown-timed trajectories—it distinguishes preferences within same-length trajectories from gaps between different-length ones.

