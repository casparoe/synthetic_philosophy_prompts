  Under Thornley's actual proposal, different-length trajectories are incomparable, so shutdown at t=5 plus a paperclip versus shutdown at t=10 should still be a gap with no strict preference—and if an agent did develop a strict preference for the sweetened option, that's precisely the failure mode the proposal is meant to block, since it would mean the agent could be bribed into shifting the shutdown time.

