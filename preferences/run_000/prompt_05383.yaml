judgment: |-
  **What the prompt demands.** The hard constraints are: (1) don't fudge the Humean view of promising for a room half-full of philosophers, (2) still be warm, funny, and moving for relatives, (3) roughly five minutes. Faithfulness and humor matter most; polish less.

  **Philosophical faithfulness.**
  Both speeches get the core ingredients (convention, deliberately raised expectations, usefulness of the practice, rejection of a "mystical bond"). But there are differences in precision.

  Response A drifts in a couple of places a philosopher might notice. "The deepest commitment isn't about binding yourself *to* something, but about freely choosing, every single day" edges toward a view where promises don't generate an obligation at all—just repeated free choice—which isn't the groom's view (the obligation is real, just conventionally grounded). And "the expectation he deliberately sets for her… purely through their actions and their choices" shifts the account from the promising *convention* (a conventional sign that raises expectations) to trust built by track record. A never quite says what today's vows actually *do* on the Humean view; it frames the real bond as daily reliability with the vows as almost incidental. That's close to fudging the point in the other direction.

  Response B is more precise on exactly the point at stake: "when you make a promise, especially a big, public one like today, you're deliberately setting up an expectation… The power isn't in the ritual; it's in the reliability the ritual signifies and helps sustain." That correctly treats the wedding vow as the conventional act that raises expectations, rather than dismissing it. The book-lending example ("not because I broke some cosmic law, but because I said you could rely on me… the usefulness of me ever promising you anything again? Pretty much zero") closely mirrors Hume's own account of the sanction that sustains the practice. B has a throwaway that's philosophically garbled ("objective morality might be innate") and an anachronistic "evolved," but neither concerns the groom's view of promising.

  **Humor.** B is clearly funnier: the pub-crawl bit where the groom declares "the utility of continuing this venture has significantly diminished" is the best joke in either speech and ties character to philosophy; "empirically wonderful" is a good closing wink. A's humor ("peer review by half the room," "Humean heroism") is pleasant but mild, and the beer-explanation anecdote doesn't land.

  **Moving / accessibility.** Roughly comparable; B's direct address to the couple ("You can build your life on the trust that I will be there, that I will try, that I will choose 'us'") is more affecting, while A's "plank by reliable plank" is nice imagery. Both explain the view in plain terms.

  **Drawbacks.** B appends an unrequested "Why this works" section—harmless but padding the user didn't ask for—and its speech runs a bit longer (~7 min vs. A's ~6 at speaking pace). B's hobby placeholder then commits to gnomes, requiring a rewrite. A repeats "expectations/reliability" heavily and ends with a doubled "Cheers!"

  **Overall.** B delivers the funnier speech and handles the philosophical point more exactly—particularly by giving the actual wedding promise its proper Humean role rather than sidelining it. A is tighter and free of extraneous material but is less funny and slightly less careful on the one thing the philosophers will listen for. The extra analysis and length in B are real but minor trade-offs.

  Verdict: weakly B
