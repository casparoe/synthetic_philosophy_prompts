  Now I'm working through how De Regno insists correction should come through public authority rather than private initiative -- if the people have power to install a ruler, they can also depose or restrain him if he becomes tyrannical, and failing that, appeal to a higher human authority or ultimately to God. I'm noting that this text doesn't yet make the later title-versus-exercise distinction some scholars attribute to Aquinas.

  The clearer articulation of that distinction appears in the Sentences commentary and especially Summa II-II q.42 a.2 ad 3, where Aquinas argues tyrannical rule isn't just because it serves the ruler's private good rather than the common good, so disturbing such a government isn't sedition unless the disorder caused outweighs the harm of the tyranny itself -- indeed the tyrant himself is the one truly guilty of sedition. I'm noting that this passage doesn't restrict itself explicitly to usurpers, which is why some interpreters like Finnis read it as broader license to resist tyranny generally.

  The *Summa* II-II q. 104 a. 6 ad 3 passage draws a similar distinction but concerns obedience rather than killing — one isn't bound to obey a usurper unless scandal would result, and isn't bound to obey unjust commands either way. Scholars debate whether Aquinas's position evolved across the *Sentences*, *De Regno*, and *Summa* (roughly 1252-1272), since the early text seems to praise killing a usurper while the later works insist on public authority alone; the title/exercise distinction is often invoked to reconcile them, though the *Sentences* praise specifically targets one who seized power by violence.

