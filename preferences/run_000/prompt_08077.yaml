  Actually this maps almost exactly onto Parfit's hitchhiker: a predictor rewards you based on predicted future compliance, then you face a costly action. So FDT-style theories would actually bite the bullet and endorse drinking the toxin, since the subjunctive dependence is identical to the hitchhiker case — this is a known result that TDT/UDT/FDT proponents accept. So the user's framing assumes the FDT defender wants to avoid saying "drink the toxin," but really a consistent defender would just embrace it as the same structure.

