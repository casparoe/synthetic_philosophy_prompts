  A regress is vicious when each stage's job depends on the next stage succeeding first, so the explanatory burden runs upward and nothing ever gets grounded; it's benign when dependence runs the other way, with later stages as mere consequences of earlier, already-settled ones. Whether "benign" is just a label or a real distinction turns on substantive metaphysical commitments about priority — and for Gaskin specifically, claiming unity just *consists in* the regress looks to critics like relabeling the problem rather than solving it.

