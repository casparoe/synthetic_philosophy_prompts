thinking: |-
  This is a genuine philosophical question about whether the teacher's distinction between reading a slur silently, quoting it aloud neutrally, and using it to insult is arbitrary or principled. I'm thinking through why the spoken/written distinction matters—the involuntary auditory impact on listeners versus a reader's choice to encounter text on the page.

