  I'm checking its citations for accuracy — the reference to "Truth and Meaning" (1967) as evidence charity fails to fix unique interpretations seems misplaced, since that paper is really about the Tarski-style truth theory rather than indeterminacy; the concession about multiple charitable interpretations shows up more in "Radical Interpretation" and "Belief and the Basis of Meaning." Similarly, the citation of "Two Dogmas" for Quine's indeterminacy argument is a bit off, since that paper is really about holism and rejecting the analytic-synthetic distinction rather than indeterminacy itself, which is developed later in "Word and Object."

