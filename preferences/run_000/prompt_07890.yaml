  I also remember Lewis discusses conventions as norms directly in his chapter on contrasting conventions with other regularities, arguing that since everyone benefits from general conformity, people have reason to conform and are expected to, which grounds blame for nonconformists as a kind of derived normativity rather than a brute moral rule.

