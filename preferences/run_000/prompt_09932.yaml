  - But the punchline — ENDA's retort — is conceptually inverted. An endurantist's defining claim is that she is *wholly present at every moment*. ENDA instead says "She's only partially present. Come back in five minutes when I'm wholly here…", which implies she is *not* wholly present now. That makes sense under neither theory (under perdurantism she'd never be wholly present; under endurantism she always is). A seminar peer would catch this immediately, and the user would end up mangling endurantism in the very joke meant to redeem a mangled explanation.
