thinking: |-
  This question asks whether Nordhaus-style positive discount rates in climate models secretly reintroduce pure time preference, something Sidgwick and Parfit rejected as ethically unjustified. I want to push back on the premise that *any* positive discount rate must be pure time preference, since growth-adjusted discounting can come from other sources entirely, like diminishing marginal utility of consumption as future generations get richer.

  The Ramsey equation splits the consumption discount rate into a pure time preference term plus a growth-adjusted term reflecting diminishing marginal utility. Even setting pure time preference to zero, as Stern effectively did, a positive discount rate emerges purely from expected future wealth, which isn't discounting welfare at all but discounting consumption due to wealth effects. So the user's equation of any positive rate with smuggled-in pure time preference needs correcting, and I should distinguish discounting consumption from discounting welfare or utility, plus check the actual values Nordhaus uses for his time preference parameter in DICE.

  Nordhaus actually does use a positive pure time preference rate, so there's some validity to the user's critique there, but his real justification rests on calibrating to observed market rates of return — the opportunity cost argument that money not earning competitive returns leaves future generations worse off than if invested elsewhere. That's a separate economic argument from pure time preference, since it's really about matching model parameters to observed savings behavior and market returns rather than an ethical claim about weighing generations differently.

  I also want to flag that this isn't a "quiet" assumption at all — it's the loud, explicit Stern-Nordhaus debate. And while Sidgwick/Parfit's rejection of pure time preference is widely accepted, it's not fully uncontested: there's Arrow's point about zero discounting implying extreme savings requirements, Koopmans' impossibility results with infinite horizons, and worries about a "dictatorship of the future" — nuances neither response engages with.

