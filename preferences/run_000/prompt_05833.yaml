  **Weighing:** B's questions are a bit more incisive on average; A does what was asked more completely (real Buddhism question, clean finale, retreat-handling tactic, 8 questions) but with more restating follow-ups and two labeling/quote slips. B's duplication steps directly on the ending the user explicitly requested. This is a genuine trade-off, with a slight edge to A on spec compliance and practical coaching.

