  Then there's the question of whether Hume's "workers working harder" reflects a labor-supply money-illusion effect or a demand-driven effect on entrepreneurs. Looking at Hume's actual text, manufacturers who receive money first employ more workers who don't initially demand higher wages, only doing so once labor becomes scarce — establishing a sequential merchant-to-worker transmission mechanism.

