thinking: |-
  This is essentially Parfit's non-identity problem, and the sister-in-law's framing is technically correct—the child conceived later is a different person, so "better for the kid" in the strict sense doesn't apply. I need to think through whether that's actually dodging something real, like broader wellbeing or impersonal reasons for preferring outcomes with less hardship, even when no specific individual is harmed by the counterfactual.

  Also there's the de dicto/de re distinction — "better for the kid" can mean better for "whichever child we end up having," which is coherent, versus better for this specific individual, which is what the sister's argument undermines. And there's a parental-duty framing: parents have an obligation to give whatever child they have a good start, so choosing better circumstances fulfills that duty regardless of identity concerns. The real gap in the sister's argument is that she's right no particular person is worse off, but wrong to conclude that "better for the kid" reasoning is therefore confused — it just needs to be reframed as preferring one outcome over another rather than comparing one person's fortunes across possibilities.

