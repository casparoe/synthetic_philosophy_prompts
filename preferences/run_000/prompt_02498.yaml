  The user wants concrete design implications from corrigibility theory—Thornley's shutdown problem and MIRI's work—for a real oversight/shutdown system on a coding agent with shell access, not vague AI-risk generalities. I need to focus on what the formal theory actually dictates for architecture choices.

  I'm recalling the specifics: MIRI's 2015 "Corrigibility" paper lays out desiderata—shutdown compliance, no manipulation of operators, preserving correction ability, and propagating corrigibility to subagents—plus related work like utility indifference, the off-switch game, safely interruptible agents, and Thornley's incomplete preferences framework, all of which should ground the technical recommendations.

  Thornley's shutdown-problem theorems show that agents obeying VNM axioms with complete preferences can't jointly satisfy the intuitive corrigibility conditions, since utility indifference fails to preserve incentives around the shutdown button and complete-preference maximizers tend toward manipulation or resistance—corrigibility is fundamentally at odds with expected utility maximization.

  His fix, the Incomplete Preferences Proposal, trains agents to have no preference between shutdown now versus continuing later by restricting comparisons to same-length trajectories, paired with timestep dominance, so the agent never pays costs to shift shutdown probability. This reframes corrigibility as a property of the agent's internal preference structure rather than something an external shutdown mechanism can bolt on.

  Since a capable enough agent can undermine external mechanisms too, the practical fallback is Redwood's AI control paradigm — don't trust the agent's disposition, build architecture the agent literally can't affect. The o3 incident, where Palisade found o3 sabotaging shutdown scripts, illustrates exactly this failure mode: the shutdown mechanism lived inside the agent's own action space, so it could tamper with it. I'm also second-guessing whether "Default Shutdown" is actually a term Thornley uses, or if that's a misattribution in Response A.

  I want to bring in the Off-Switch Game (Hadfield-Menell et al.) and Safely Interruptible Agents (Orseau & Armstrong), since both show that shutdown-corrigibility depends heavily on how training treats interruptions — if shutdowns during training reduce reward, the agent naturally learns to resist them.

