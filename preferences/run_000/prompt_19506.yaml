  Even fixing all physical facts, translation stays indeterminate because rival manuals remain compatible with every physical fact including dispositions, whereas with underdetermination in physics Quine sometimes still allows a fact of the matter (though he wavered between "ecumenical" and "sectarian" stances there). So underdetermination is fundamentally epistemic while indeterminacy is metaphysical — no fact exists to discover, not merely one we can't access.

