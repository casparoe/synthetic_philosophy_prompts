thinking: |-
  I'm working through the exam prep question on Duhem and Quine, starting with how Response A frames the scope difference — checking whether it's accurate that Duhem restricted his holism to physics, since physiologists relied on already-established physics instruments and theory.

  I catch a garbled sentence in Response A implying logic and math sit "at the periphery" of Quine's web, when actually Quine places them at the core — Response B gets this right. I also flag Response A's "maximize minimum mutilation" as a distortion of Quine's actual maxim of minimizing mutilation, and note both responses' lists of pragmatic theoretical virtues (simplicity, conservatism, generality, fecundity) are roughly faithful to Quine and Ullian's *Web of Belief*, though loosely applied.

