  I'm recalling Greaves' 2016 "Cluelessness" paper and her distinction between simple cluelessness—where uncertainty about long-run consequences is symmetric, like helping an old lady across the road—and complex cluelessness, which she treats differently.

  In simple cases, unforeseeable effects wash out because for every negative-outcome story there's an equally plausible positive one, so foreseeable effects can guide action. This is her answer to Lenman's cluelessness objection. Complex cluelessness, by contrast, involves cases where we have some reason to believe unforeseeable effects of one action would systematically outperform those of another, without being able to quantify that asymmetry.

  Greaves calls simple cluelessness the case where unforeseeable effects have symmetric evidence and cancel in expectation — not a serious issue. Complex cluelessness is when systematic reasons point in opposite directions with no principled way to weigh them, and she notes this attaches directly to EA-favored interventions like bed nets via population effects. Now I should check how Response A frames this: treating simple cluelessness as an epistemic limitation (like long-range weather prediction) versus complex cluelessness as computational intractability from chaos and non-linearity, even with perfect information.

  Response A actually inverts Greaves' framework — her simple cluelessness is precisely about chaotic, butterfly-effect consequences that cancel out symmetrically, not about limited information being solvable in principle. What Response A labels "complex cluelessness" (chaotic unforeseeability) is closer to what Greaves calls simple, and her point is that this isn't the real worry.

  Response B holds up better: it distinguishes simple cluelessness (confident about sign, uncertain about magnitude) from complex cluelessness (uncertain even about sign, due to complex systemic interactions), which tracks Greaves reasonably well, though its framing of simple cluelessness as ordinary magnitude-uncertainty still isn't quite her emphasis on unforeseeable, symmetrically-cancelling effects.

  B's description of complex cluelessness as arising from ripple effects and cascading consequences actually blurs the line with simple cluelessness's butterfly-effect flavor, which is a bit muddled. Still, B's general framing—that simple cluelessness stays tractable within expected-value reasoning while complex cluelessness escapes it because probabilities can't be assigned—is roughly in the spirit of Greaves' distinction, even without invoking her symmetry argument explicitly.

  What stands out is B correctly capturing the EA implication: EA orgs might be confidently optimizing within domains where they think they know the sign of impact, while remaining deeply clueless about whether those interventions are net beneficial at all—this tracks Greaves' actual point about AMF-style interventions. There's a slight inconsistency though, since B's own example puts charity donation in the simple bucket, yet its complex-cluelessness example also involves donating to a charity with long-run ripple effects, making the boundary a little blurry.

  Response A, though, gets the core distinction backwards—it puts bed nets and deworming squarely into "simple cluelessness," framing EA as free to focus on interventions where short-term benefits seem clearly positive, which is the opposite of Greaves' argument that these are the paradigm cases of complex cluelessness. Neither response mentions the symmetry argument, Lenman, the old-lady thought experiment, the AMF/population growth case, or imprecise credences, but A's inversion is the more serious error since it would actively mislead someone using this reasoning in their own writing.

  Response B's version—simple cluelessness as known sign but uncertain magnitude, complex as unknown sign with unassignable probabilities—is oversimplified but captures the real insight: complex cluelessness resists expected value reasoning because competing systematic considerations prevent even settling the direction of long-run effects, which tracks Greaves' actual point.

  I recall Greaves illustrates simple cluelessness with Lenman's example of helping someone cross the road—the unforeseeable long-run consequences balance out symmetrically, since any pathway to an unforeseeable bad outcome is matched by an equally likely pathway to an unforeseeable good one.

  Then there's complex cluelessness, where that symmetry breaks: we have systematic reasons favoring one option's unforeseeable consequences, systematic reasons favoring the other's, and no clear way to weigh those competing reasons. Her key illustration is exactly the EA case—donating to AMF changes population size, and there are real but unweighable arguments on both sides about whether that's net good or bad, which she thinks is a genuine problem, possibly calling for imprecise probabilities.

