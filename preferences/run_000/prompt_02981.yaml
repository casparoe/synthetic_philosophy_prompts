  A, meanwhile, gets something backwards: it treats the symmetry between positive and negative long-term arguments as the source of paralysis, when in Greaves' account that same symmetry is exactly why simple cluelessness *isn't* devastating—symmetric considerations cancel and let you fall back on foreseeable expected value. That's a real inversion of Greaves' argument. A also wrongly suggests simple cluelessness could be resolved with more data, when Greaves' examples (like chaotic downstream effects of a small good deed) are inherently unresolvable that way.

