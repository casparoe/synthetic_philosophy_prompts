  I'm recalling Armstrong & Mindermann's 2018 result showing that any observed policy can be decomposed into degenerate (planner, reward) pairs—like an indifferent planner with constant reward, a rational planner whose reward equals the policy, or an anti-rational planner with negated reward—all of which have complexity roughly matching the policy itself plus a small constant, undermining simplicity as a way to pin down true preferences.

  These degenerate decompositions have complexity roughly matching the policy itself, while the "true" decomposition with genuine human reward and biased planner is at least as complex and usually far more so — meaning a simplicity prior actively favors the degenerate, uninformative decompositions. And even worse, the rational decomposition and its anti-rational twin (flip the sign of R) have nearly identical complexity, so no amount of Occam's razor can tell them apart. The real upshot is that distinguishing "what someone wants" from "how irrationally they pursue it" requires normative assumptions that can't be squeezed out of behavior or simplicity alone.

