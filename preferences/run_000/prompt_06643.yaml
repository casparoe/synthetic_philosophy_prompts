  Then they land on the deeper irony: refusing at decision time only proves CDT loses to UDT on such problems, since UDT would have precommitted to pay. The mugging isn't a special case at all — it's just a spotlight on the core CDT/UDT divide over updating on evidence versus evaluating policies from a state of prior ignorance.

