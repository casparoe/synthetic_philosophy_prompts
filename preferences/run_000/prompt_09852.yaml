  On the substance, the irony (Bentham's publicity principle undercut by his own suppressed radical writing) can technically be taught by summary alone, but seeing the actual text arguably makes it more vivid — so both positions are defensible, though A's separation of the two purposes feels like the sharper, more useful decomposition.

