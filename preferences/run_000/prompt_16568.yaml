judgment: |-
  **What the user needs:** a circulable draft opinion that (1) keeps the three questions—evidentiary weight, standing, institutional action—separate, (2) gives a real recommendation on each, and (3) engages the attorney's argument in its strongest form rather than dismissing it as whataboutism.

  **Response A** delivers a memo that tracks the three questions cleanly, gives a firm answer on each, and ends with two concrete, independent motions (proceed on the PI; open a separate, non-precedent inquiry on the postdoc). Its Q3 recommendation—parallel tracks, explicitly rejecting sequential prioritization—is the procedurally sound answer: institutions must assess allegations that come to their attention, and handling the postdoc's matter separately (rather than first or never) is how you avoid both the deflection problem and the appearance of retaliation. Section IV, which speaks to each faction of the split committee, is directly useful for the user's stated worry that the committee will muddle the questions on the fly. On "strongest form," A does more than B: it identifies when the standing argument *would* have force (if her conduct were tied to the very evidence at issue) and concedes that her credibility legitimately bears on any testimonial contribution she makes, just not on the images. Weaknesses: it labels the argument "tu quoque / a logical fallacy," which edges toward the waving-off the user asked to avoid; the "statute of limitations" point is misapplied; the COPE section numbers look invented. But it uses a placeholder for the institutional policy rather than fabricating one, and it invites the user to supply real citations.

  **Response B** covers the same three questions with similar top-line answers, but has two significant problems. First, its Q3 recommendation—address the postdoc's conduct "after the PI investigation concludes" and "table" it—is a deliberate deferral of a potential misconduct allegation, which contradicts B's own stated principle ("investigate all credible allegations impartially—without deflection or delay"), is the mirror image of the attorney's sequencing request, and is procedurally questionable (especially given the six-year age of the paper). Since sequencing is precisely what has split the committee, getting this wrong undercuts the memo's core purpose. Second, B presents fabricated authorities as real: quoted institutional bylaw language ("Section 4.2… 'any member of the academic community'"), "Sec 5.1 (Standing)," an "AAU Research Integrity Framework (2022)" with a named section, and COPE section numbers, all in a formal references list. For a journalist on the academic-fraud beat circulating this to a research integrity committee, that's a real liability. B's "Attorney's Strongest Argument Engaged" subsections mostly restate the conclusion ("Does that taint her submission? No.") rather than constructing the argument's best version, and it also ends by calling the argument "ad hominem."

  Both miss some things a sharp opinion would catch (the six-year ORI limitation, jurisdiction over a paper from a different lab/possibly institution, that undisclosed data omission can itself meet the falsification definition). But A's substantive recommendation is right where B's is wrong, A's engagement with the attorney is somewhat deeper, and A avoids fabricating institutional policy text.

  Verdict: strongly A
