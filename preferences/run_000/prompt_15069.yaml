judgment: |-
  **What the user needs:** A student wants a historically grounded prediction of Darwin's reaction to the handicap principle, specifically addressing the aesthetic-vs-utilitarian fight with Wallace, and explicitly not a generic "he'd be amazed" answer.

  **Response A** correctly identifies the crux: the handicap principle vindicates Darwin's *mechanism* (female choice matters; costly traits can evolve despite natural selection) but is itself fundamentally *utilitarian* in logic—which is exactly what Wallace demanded. A explicitly notes "Wallace would argue this *is* the utilitarian benefit he demanded," and then has Darwin push back on the aesthetic point, distinguishing what the handicap principle explains (honesty/maintenance of the signal) from what it doesn't (the specific form of the ornament—why these colours, these patterns). This is a genuinely Darwinian line of reasoning, consistent with his "taste for the beautiful" and fashion-like arbitrariness in *Descent*. It supports this with a reasonably faithful quotation ("the most refined beauty may serve as a [sexual] charm... and for no other purpose"). This matches how historians like Cronin and Prum frame the debate. A's "decisive victory" phrasing is a bit overstated, but the caveat is well developed.

  **Response B** reaches a similar bottom line (Darwin's favor) but with weaker reasoning and a factual error. It misattributes the famous "makes me sick" remark to *The Descent of Man*—it comes from an 1860 letter to Asa Gray—a slip a student could repeat. Conceptually, B claims the handicap principle "reframes" aesthetic taste as an evolved preference for a quality indicator and presents this as vindicating Darwin, when that reframing is precisely the Wallacean move; B doesn't grapple with this tension. Its attempt to distance Zahavi from Wallace ("Wallace would still object the signal wasn't *directly* about survival skills") misreads Wallace, whose view of ornament as an outward sign of surplus vigour is actually quite close to honest-signal logic. B's closing ("profoundly relieved and excited... putting the peacock's tail to rest") drifts toward the generic reaction the user asked to avoid. B does make one good point—female choice is required for the handicap mechanism to work at all—but A makes the same point.

  **Overall:** A engages more accurately with the actual aesthetic/utilitarian stakes the user asked about, grounds it in Darwin's text, and avoids B's misattribution and conceptual hand-waving.

  Verdict: strongly A
