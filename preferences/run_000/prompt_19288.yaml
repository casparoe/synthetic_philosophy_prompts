  Turning to A, its questions on transworld depravity conflate the doctrine's real content -- Plantinga's TWD is about sinning at least once, not eternal damnation -- and this muddles the distinction the question was trying to draw between TWD and transworld damnation. This is a real error that could embarrass a host if used unedited, since a knowledgeable guest would likely correct it on air.

