  Both responses land in nearly the same place—Hacking's framework survives, the algorithm intensifies rather than breaks it, DID "systems" look fugue-like while autism/ADHD are established kinds being reshaped—and both share the same conspicuous flaw: they take Hacking's technical term "indifferent kinds" (kinds unaffected by being classified, like quarks) and pun it into the algorithm being "indifferent to truth," which a Hacking-literate reader would flag. Neither engages the actual interactive/indifferent distinction as Hacking applied it to autism (biological substrate vs. social classification), though both gesture at it.

  **Response A's strengths:** It explicitly deploys the "ecological niche" concept—the single most relevant Hacking tool for the fad-vs-kind question—and applies it well (the niche is now the platform, so kinds dependent on it are fragile). Its DID-as-fad / autism-ADHD-as-warped-established-kind split is crisp and maps directly onto Hacking's actual published positions (MPD as transient in *Rewriting the Soul*; autism as a genuine emergent kind in his autism papers). Its verdict is decisive and quotable. Weaknesses: the "overtly fictionalized" jab at system TikTok is out of character for Hacking, who pointedly refused to call multiples fakers. And there's a mild internal tension—A lists genuinely novel features (personalization, gatekeeper bypass, "a new, perverse twist") but then concludes "same beast."

  **Response B's strengths:** It uses Hacking's real term "transient mental illnesses." More importantly, it directly engages the crux of the user's binary by refusing it in a Hacking-like way: structure familiar, mechanism novel—the algorithm as a new "vector"/"engine," which aligns with the engines vocabulary of "Kinds of People: Moving Targets." Its two sharpest analytic points—the loop is self-sealing in a way fugue (exposed to cultural skepticism) never was, and the algorithm displaces the expert/institution node that was central to Hacking's five-element loop—are the most useful "what's actually new" material for the writer. It's also more careful about DID sufferers. Weaknesses: quoted coinages like "Semiotic Contagions" and "algorithmic kind-making" could be mistaken for Hacking's terms; the "purer interactive kind-making" sentence is muddled; the three-part verdict is more diffuse than A's.

  On balance, B answers the specific question the user most cared about with more internal consistency and more substantive identification of what's genuinely different, while A is cleaner and more decisive. The margin is small.

  Verdict: weakly B
