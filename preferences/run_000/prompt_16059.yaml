judgment: |-
  **What the user actually asked:** a cog-sci PhD student TAing a JDM course wants to know (1) whether Good's "free information can't hurt" theorem applies to a post-decision case, and (2) whether there is any *theory* behind the "should she want to know" question or whether it collapses into personal temperament.

  **Response A** correctly explains that the theorem is about pre-decision optionality and that the information here has no instrumental value, then lists plausible psychological costs (regret, narrative coherence, social comparison). But on the core question it mostly just confirms the user's suspicion — "classical rationality is silent... it does dissolve into psychology... depends entirely on her psychological makeup" — while gesturing vaguely at "anticipated regret" and "motivated reasoning." It mislabels strategic ignorance as "rational inattention" (Sims' concept about processing constraints), claims utility functions "typically don't model regret avoidance" (regret theory is standard JDM syllabus material), and oddly asserts "your friend isn't borrowing a rationality argument," contradicting both the user's read and its own analysis. No literature pointers. It also never notices that the "no decision left" premise is shaky.

  **Response B** gives the more precise normative answer — standard theory implies *indifference* (zero value), not "silence" — and then separates that from the descriptive literature, naming regret theory, dissonance, affective forecasting, and pointing to real, on-target references (Roese 1997 on counterfactual thinking; Hertwig & Engel 2016 on deliberate ignorance). It catches the genuinely important nuance A misses: the salary intel *does* have instrumental value for future negotiations, so the premise isn't fully true. It also directly addresses the friend's "worst case I ignore it" move by noting humans can't actually do that and that precommitment is unreliable. B's weaknesses: it overclaims ("evidence is overwhelming," "she'll feel worse regardless"), calls the choice "irrational" loosely, and misapplies "confirmation bias" (what it describes is closer to negativity bias; confirmation bias would actually help her rationalize). These are real errors a JDM TA would notice.

  **Weighing:** Both share the same skeleton and neither articulates the deepest point (the theorem assumes outcome-based, not belief-based, utility — Caplin & Leahy / Golman et al.). But B answers the "is there theory?" question more substantively, adds the future-instrumental-value correction, and supplies usable citations for an academic reader. Its overconfidence and one mislabel are offset by A's own mislabel, its muddled regret-asymmetry point, and its overall blandness. B is more useful to this particular user, though the margin is not enormous.

  Verdict: weakly B
