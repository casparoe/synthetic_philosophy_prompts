judgment: |-
  **What the prompt requires:** a circulable board memo that (1) recommends a specific cataloging *and* labeling policy, (2) gives reasons the curator and the two board members must each take seriously, and (3) candidly states the strongest objection. The user is a philosophically literate retiree who has been reading van Inwagen and correctly framed his view as: once the animal is dead, the bones compose *nothing at all*.

  **Shared ground:** Both memos land on the same compromise — keep the single specimen record (satisfying donor and curator), rewrite the label to disclose the composite origin (satisfying one of the board members' two disjuncts). Both address each stakeholder in turn, both state an ontological objection, and both silently assume the donor's condition concerns only the catalog rather than "cataloged *and* labeled," which the prompt's wording leaves ambiguous (A asserts this more baldly). Neither raises the arguably stronger institutional objection — donors dictating collections policy — or the standard two-tier solution (mount record with linked component records).

  **Response A:** Philosophically accurate throughout: "van Inwagen argues dead bones compose *nothing*," puts "composition" in scare quotes when describing the institutional alternative, and notes the "one individual or several" point the user raised. The objection section is candid and includes a practical point B lacks (the term "specimen" propagating through databases and casual use). Weaknesses: the "(implicit)/(explicit)" van Inwagen headers are clunky for a board memo; placing an explicitly anti-"specimen" argument inside the section meant to persuade the board members is structurally odd; and the philosophical alternative (artifact composed by institutional act) is only sketched.

  **Response B:** A cleaner, more actionable memo — actual draft label text, a sharper curator argument (catalog number tied to publications/photographs), a well-developed "museum artifact vs. biological specimen" category distinction, and a punchy, candid objection ("multiple nothings and some plaster... refuse the funding"). But it repeatedly softens van Inwagen to "compose nothing *biological*" and then states outright: "He does not deny they can be composed into other kinds of objects by human activity (like a sculpture or a museum mount)." This is false — van Inwagen famously denies artifacts exist — and it directly contradicts what the user said in the prompt. It sits at the crux of the rebuttal and would embarrass the user if circulated unedited. B's rebuttal also slightly mischaracterizes the recataloging proposal as requiring hundreds of component records.

  **Weighing:** B is the more useful draft as a document, and its substantive artifact-based position is fine; A is thinner but gets the one philosopher the user named right. Since the instructions prioritize correctness over polish, and B's error is precisely on the point the user framed the whole memo around, I lean narrowly to A — though the trade-off could reasonably go the other way.

  Verdict: weakly A
