judgment: |-
  **What the user wants:** An evolutionary example (human or animal) where costly signaling is a plausible explanation for an evolved costly behavior, but where alternative *evolutionary* explanations (explicitly including "a side effect of selection on something else entirely") are compelling and hard to rule out. The user frames the question in terms of "why an organism does something costly" and "other evolutionary reason[s]."

  **Response A (adolescent male risk-taking):** This is a real, debated case in behavioral ecology and evolutionary psychology. Risk-taking as a mating/status display has genuine empirical support, and the three alternatives offered are all legitimate competing hypotheses in the literature: (1) a non-adaptive byproduct of neurodevelopmental timing and hormonal surges — this directly matches the user's "side effect of selection on something else"; (2) skill acquisition/practice — a real alternative adaptive hypothesis; (3) high-variance strategy under poor prospects — essentially Wilson & Daly's "young male syndrome." A also thoughtfully notes the mechanism-vs-function entanglement rather than glossing over it. Weaknesses: the behavior category is somewhat broad, the primate examples are vague, there are no citations, and the prose is formulaic. But it squarely delivers what was asked and reflects an actual scientific puzzle.

  **Response B (publishing in Nature/Science):** Creative, but off-target. This is a cultural/economic behavior, not an evolved trait, and B's evolutionary framing ("fitness proxies in the academic ecosystem," "primary evolutionary driver") is a strained analogy. More importantly, the handicap logic fits poorly: honesty here is enforced by third-party vetting (the journal's filter), not by differential production cost — low-quality researchers can't get in no matter how much they spend, so this is closer to certification than to Zahavi's handicap. The "alternatives" (direct quality control, network access) aren't evolutionary hypotheses at all, and B itself concedes they're barely separable from signaling ("making separation artificial") — meaning the example doesn't actually present the genuine puzzle the user asked for. B also offers no byproduct-type explanation, which the user explicitly flagged as the kind of alternative they care about. The "how researchers try to distinguish" section is meta-science, not evolutionary biology.

  **Verdict reasoning:** Both share sycophantic openers and similar structure. But A stays in the domain the user is actually exploring, gives genuinely competing evolutionary hypotheses, and represents a real open debate. B is clever but substitutes an economic-signaling analogy for the evolutionary question and its alternatives aren't really alternatives. The gap is clear.

