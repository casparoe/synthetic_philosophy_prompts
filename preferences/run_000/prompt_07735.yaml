judgment: |-
  **What the user needs:** a rigorous, accurate case that Fresnel→Maxwell doesn't rescue structural realism, with particular attention to (a) whether "structure" does real metaphysical work or is picked out post hoc, and (b) whether reliance on one case invites a pessimistic induction against SR itself. Since this is for a piece they're writing, getting the history and the dialectic right matters a lot.

  **Shared features:** Both responses have the same overall architecture (ontological rupture masked by formal similarity; ambiguity of "structure"; graveyard of structures → meta-induction against SR). Neither engages the actual literature the friend alluded to (Psillos's structure/nature critique, the Newman objection, Saatsi, Stanford), which is a real missed opportunity for both. Both mischaracterize caloric as a case of structural loss (Fourier's equation and Carnot's results largely survived — a structural realist would cite caloric *for* their view), and both anachronistically say Maxwell dispensed with a medium.

  **Response A's specific problems:**
  - Its lead argument rests on the claim that Fresnel worked from a *scalar* wave theory and that his edifice included *longitudinal waves*. This is wrong on the central case: Fresnel's signature contribution was transverse vibrations, and his reflection/refraction equations distinguish s- and p-polarization precisely because the displacement has direction. A "scalar" theory couldn't produce Fresnel's equations at all. For a user writing about this exact case, this is a serious liability.
  - The Lorentz Ether Theory example backfires: the Lorentz transformations are preserved *exactly* into special relativity while the ether ontology is dropped — a textbook case *for* structural realism, not against it.
  - Newtonian gravity is presented as a case where "the core mathematical object vanished," ignoring the limiting-case continuity that any SR would immediately cite.
  - Section 5 (Maxwell wasn't motivated by Fresnel) is off-target; SR doesn't need motivational continuity, and the independent re-derivation of Fresnel's equations arguably strengthens the realist's case.
  - Strengths: the Ramsey-sentence/functionalism framing, the thick/thin dichotomy, and the Poincaré-conventionalism observation are genuinely useful.

  **Response B's specific problems and strengths:**
  - Correctly characterizes Fresnel's ontology (transverse mechanical vibrations in an elastic solid).
  - Its three-level granularity analysis (phenomenological / dynamical / fundamental) is a sharper tool than A's dichotomy, and its "plasticity/underdetermination" point (the equations are compatible with multiple underlying structures) is a real additional argument — historically supportable via the Neumann/MacCullagh alternatives, though B doesn't cite them.
  - Its circularity charge ("defining structure in a way that makes survival likely only for those rare cases where such equations did survive") directly answers the user's "picked out after the fact" question.
  - It handles Newtonian gravity and CM→QM more honestly, acknowledging limiting-case and Poisson-bracket→commutator continuity before arguing they're insufficient, which makes it more robust against a knowledgeable reader's objections.
  - The premise-conclusion layout of the meta-induction against SR is directly usable for a piece.
  - Weaknesses: some rhetorical inflation, the "almost certainly" speculation, and the shared caloric/ether issues.

  **Verdict:** The arguments overlap heavily, but A builds its opening argument on a factual error about Fresnel's theory and includes a counterexample (LET) that actively helps the opponent, while B is accurate on the central case and somewhat deeper on the "what is structure" question the user flagged as their main interest. For a user who needs to get things right, that difference is clear.

  Verdict: strongly B
