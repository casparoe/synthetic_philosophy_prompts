  Turing then constructs a modified imitation game where a telepathic human witness answers card-suit questions correctly at above-chance rates (130/400), contrasted against a machine that can only guess randomly, showing how ESP could unfairly help the human win the game.

  He raises the possibility that if a computer used a random number generator for its answers, that generator itself might be subject to psychokinetic influence from the interrogator, causing skewed results even without questioning. This suggests that admitting ESP requires tightening the test, treating it analogously to someone eavesdropping through a wall while the interrogator seemingly talks to himself.

  I'm noting that Turing calls the ESP objection one of the few he treats seriously rather than dismissing outright, and that his claim about overwhelming statistical evidence applies specifically to telepathy, not the other three phenomena he lists—a nuance relevant when comparing to Bem's precognition study, since Bem's work concerned a different phenomenon than the one Turing found most convincing.

