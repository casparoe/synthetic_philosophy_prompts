  Both responses land on the same core resolution: "jade" tracked a functional/practical grouping rather than a single chemical essence, so ancient speakers successfully referred to that class, and their "error" was only in assuming a unified underlying nature.

  I notice neither response engages the deeper literature — Putnam's actual treatment, LaPorte's point that the term's reference was genuinely indeterminate between the two minerals until later scientific decision fixed it, or the disjunctive-kind approaches from Kim and Fodor. The most sophisticated answer would frame this as reference being determinate at the manifest-property level but indeterminate regarding hidden structure, with no fact of the matter until later usage settled it — something neither A nor B quite articulates.

  There's also a historical wrinkle worth noting: before jadeite arrived from Burma in the late 18th century, Chinese "yu" referred almost exclusively to nephrite, while Mesoamerican cultures worked primarily with jadeite. So the premise that ancient artisans shared one consistent concept spanning both minerals is itself questionable — it's really the later English term "jade" that came to unify what were originally separate mineral traditions.

