  Actually there's real irony here neither response caught: Neurath was explicitly skeptical of computing a single optimum, since he rejected the idea that different "Lebenslagen" (living conditions) could be reduced to one commensurable measure — he favored political choice among incommensurable options over optimization. So the framing that Neurath would eagerly embrace a model computing allocations is questionable, and both responses miss this irony entirely.

