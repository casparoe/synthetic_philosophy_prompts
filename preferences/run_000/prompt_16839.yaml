  - Section IV is the strongest part: three genuinely serious counterarguments — the "continuing altered condition persisting into the season" reading (which echoes real environmental-law continuing-violation debates), the findings-as-context argument, and a text-anchored absurdity argument — each rebutted on textualist grounds rather than dismissed. This directly serves the "Okafor won't be moved by a strawman" requirement.
