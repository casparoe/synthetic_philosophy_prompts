  **What the user asked for:** (1) a fresh, non-courtroom example (corporate policy / ToS / engineering standard) that passes Hart's pedigree test but fails several of Fuller's *specific* principles simultaneously; (2) a genuine walk-through of how strict Hartian and Fullerian would argue over whether it's binding law, going beyond "law vs. morality."

  **Response A (Blacklight data retention policy)**
