  - Also hits the structural requirements and has some real strengths: Lorentz's ether as a centrally deployed, hugely successful, then discarded posit is an excellent anti-realist example; the form-vs-physical-interpretation point about boundary conditions is essentially the Saatsi/Stanford critique of Psillos; the "quantum vacuum as modern caloric" provocation and the direct 2150 callback are apt. The ending is well-handled and slightly more balanced than A's.
  - But it contains multiple factual errors precisely where the user has expertise:
    - "Phlogiston predicted weight changes in combustion beautifully" — weight gain in calcination was phlogiston's notorious problem, exactly what Lavoisier exploited.
    - Fresnel "started with the stress-strain tensor" and "deployed stress continuity" — anachronistic; Fresnel's 1823 derivation used energy conservation and displacement continuity; the elastic-solid stress-tensor derivations came later (Cauchy, Green).
    - "Rotational ether vortices Fresnel invoked to explain circular polarization" — fabricated; Fresnel explained circular/rotatory polarization via superposition and circular birefringence, and vortices belong to Maxwell/Kelvin. It's repeated at the close.
    - "Why the cross terms dropped out" is vague technobabble.
  - The realist is also weaker than the literature allows: his caloric argument ("their working posit was a conserved fluid… it failed… We *can* distinguish in real-time") is muddled and self-undermining, and he concedes Lorentz without making the obvious Psillos-style reply that the ether was doing no predictive work (which is why Einstein could drop it).

  **Weighing:** B has a livelier anti-realist and a marginally better ending, but its interlocutors say things an expert wouldn't, and the user explicitly asked for experts and explicitly cares about the Fresnel case. A delivers an accurate, coherent, usable dialogue with only minor imprecisions and a soft final beat. For this user, getting the history right is the deciding factor.

