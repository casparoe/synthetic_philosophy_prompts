  - The realist's moves are coherent and sometimes genuinely sharp — e.g., the point that multiple incompatible ether models were compatible with the same Fresnel equations, which is a real argument that the mechanical details were underdetermined and hence idle. The Carnot-cycle-survives response to the caloric challenge is historically right.
