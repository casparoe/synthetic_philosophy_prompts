  Jefferson's logic hinges on death: the dead have neither powers nor rights, so rights are usufructuary and last only for the holder's life. Within that life, a person can bind himself, so this argument doesn't naturally extend to a self binding its future self as long as it's the same living person—the "successor" in the manic-episode case isn't really a successor but the same usufructuary. Still, the deeper puzzle is whether Jefferson's reasoning about rights attaching to the living will could generalize to "the present moment belongs in usufruct to the present self"—but Jefferson's continuous view of personal identity resists that move.

