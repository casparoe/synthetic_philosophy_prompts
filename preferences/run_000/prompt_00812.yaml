  So we're forced to consider "'C'" as a device denoting the meaning C, but this creates a strange regress — the meaning C cannot itself be a constituent of the complex that denotes it, since any complex containing C would be about C's denotation, not C. And since denotations are reached by infinitely many possible complexes, there's no way to work backward from a denotation to recover the specific meaning that generated it.

