  I'm recalling the classical textual sources on this distinction, starting with the Nyāya-sūtra's definition of upamāna as establishing something through similarity to a well-known referent, and preparing to trace how Vātsyāyana and later Vaiśeṣika thinkers treated this compared to anumāna.

  Vātsyāyana's gavaya example illustrates upamāna's function: recognizing what a word denotes through resemblance rather than inference. I'm also noting the sūtra passage that defends upamāna's distinctness from anumāna, addressing objections about whether it depends on complete, predominant, or partial similarity, and how Vātsyāyana counters the claim that both pramāṇas merely rely on perceiving the object.

  Turning to Praśastapāda's Padārthadharmasaṃgraha, I recall he ultimately subsumes śabda, upamāna, and other cognitive means under anumāna, accepting only perception and inference as fundamental pramāṇas—though he lists four kinds of valid cognition (pratyakṣa, laiṅgika, smṛti, ārṣa) with testimony and comparison folded into the inferential category. Śrīdhara's Nyāyakandalī apparently expands on this reasoning further.

  The Vaiśeṣika case for reducing upamāna to inference seems to work like this: someone who's heard that a gavaya resembles a cow, upon seeing such an animal, infers "this is a gavaya" based on perceived similarity plus the remembered testimonial statement establishing the concomitance—so either the similarity-plus-recollection process is itself inferential, or the naming-knowledge comes from testimony (which is inference anyway), meaning no separate pramāṇa is needed either way.

