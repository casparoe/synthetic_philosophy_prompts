judgment: |-
  **What the undermining problem actually is:** Lewis's theory of chance T_w supervenes on the whole mosaic, so there are possible futures F (e.g., a long run of heads on a "fair" coin) that T_w assigns positive chance to but which, if realized, would make the best system assign different chances — i.e., F is incompatible with T_w. Then PP says C(F | H T_w) = P(F) > 0, while probability logic says C(F | H T_w) = 0 since F contradicts T_w. Contradiction — and crucially, it arises *without* the agent having any extra inadmissible evidence; the chance theory itself smuggles in information about the future, which is why admissibility gets messy.

  **Response A** gets the structure wrong in ways that would hurt the user in the argument:
  - It gives the agent *oracle knowledge of the outcome* of toss #1000. That is paradigmatically inadmissible evidence in the ordinary sense, so the "contradiction" (PP says 0.5, oracle says 0) is just the trivial fact that PP doesn't apply when you know the outcome. The friend could dismiss this immediately.
  - The counting is simply invalid: "knowing toss #1000 is Tails means the total number of Heads must be exactly 499 (because if it were 500, toss #1000 would have to be Heads)." Nothing about toss #1000 fixes the total; the first 999 tosses could contain 500 heads. This is a glaring logical error at the center of the example.
  - It labels "exactly 500 heads" as "The Undermining Future" and then says it's consistent with p = 0.5 — internally confused.
  - The agent is stipulated to know both that the chance is 0.5 and (per A's reasoning) that the mosaic makes the chance not 0.5 — that's just contradictory stipulations, not undermining.
  Its closing gesture ("knowledge of chance is knowledge of frequencies") points toward the right idea, and the NP statement is roughly correct, but the requested concrete example doesn't do the job.

  **Response B** gets the essential structure right: a chance hypothesis Ch that is incompatible with a possible future T, yet assigns T positive chance; PP forces Cr(T | Ch) = 0.5, logic forces Cr(T | Ch) = 0. It correctly notes the agent has *no* outcome information — the problem is generated by conditionalizing on the chance theory alone — and correctly diagnoses the admissibility collapse (the chance law already carries information about the future pattern). It also correctly explains that the problem is about the mere *possibility* of undermining futures, not their frequency, which directly addresses the friend's "technicality" objection. Weaknesses: the knife-edge "law says exactly 1,000 heads" is a stylization of BSA; the claim that Ch alone entails Flip #2000 = heads tacitly assumes the other 1,999 flips contain 999 heads (a gap, though easily repaired by taking F = "total ≠ 1000"); and it mislabels T_w as "the entire truth about the world" when describing NP. These are real but secondary flaws.

  B delivers an example the user could actually use and defend; A's example is invalid and misidentifies the problem.

  Verdict: strongly B
