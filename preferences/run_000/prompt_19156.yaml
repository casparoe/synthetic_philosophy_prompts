  Looking closer at Response A, there's a tension worth flagging: it argues Rousseau would deny foreign residents were ever part of the contract while also claiming the modern state is illegitimate for excluding them from the sovereign, then later frames the subjection principle as a strong Rousseauian case for their inclusion—so the piece seems to want both exclusion and inclusion simultaneously.

