  Now I'm turning to the disanalogies each side raises, starting with A's first: a realist could argue that internal causal structure and compositionality fix reference, since a system's causal role constrains how it must compose with features like persistence and objecthood — a reasonable functional-role move, though it ignores that proxy functions could preserve composition just as well. Still, A's line about the "web of belief" being partially implemented internally is a nice touch.

