  I'm considering whether Weil's critique of political parties truly hinges on formal organizational structure, or whether her deeper argument about collective passion overriding truth and justice would apply just as much to leaderless, socially-organized movements—meaning structurelessness might not actually be a loophole in her reasoning at all.

  I'm recalling her Rousseauian starting point: legitimate collective judgment requires freedom from collective passion and genuine independent reasoning by each individual, conditions that parties structurally undermine—but that any mechanism generating collective passion could equally violate.

  I'm reconstructing her three defining features of parties: they manufacture collective passion, exert organized pressure on members' thinking, and ultimately exist only to grow without limit, which makes every party totalitarian in germ. She traces this to the model of a "small church," born from the Church's fight against heresy, since parties demand a kind of doctrinal loyalty rather than pursuit of truth itself.

  She then extends this to the Terror and to totalitarian parties as the natural culmination of this inquisitorial spirit—arguing that once one thinks "as a member of X," one has stopped thinking at all. Finally, she turns to what would replace parties if abolished: not organized factions, but looser, fluid "milieux" around ideas, since any attempt to crystallize into a formal group would be barred.

  She locates the corruption precisely in taking sides "for or against," which is why her critique extends beyond formal parties to any collective thought. She draws a contrast: true thinking happens alone, since truth is singular and people converge on it naturally, while parties force convergence on falsehood — though she distinguishes unions from parties, since unions pursue a defined, limited interest like wages rather than unlimited doctrinal growth, and this notion of limit versus limitlessness matters deeply to her.

  Her sharper point is that a party's doctrine is too vague to function as a genuine limit, so growth itself becomes the only measurable end — "for want of thought, there is no limit." I'm now reconstructing how she'd apply this to leaderless social-media movements: her argument stems from Rousseau's general will, where truthful collective judgment requires freedom from collective passion and independent individual reasoning, conditions parties violate and social movements violate even more severely since constant mutual influence eliminates any independent judgment. I also want to acknowledge that some of her observations depend on formal features like party discipline and membership structures, which raises a fair objection to generalizing her argument too far.

  But then there's a genuine tension worth noting — her proposed alternative permits "milieux" while forbidding "crystallization," so the real test is whether social media movements exhibit crystallization despite lacking formal membership, which they arguably do through hashtags, in-group signaling, and call-out dynamics; this suggests her structural remedy may be too formalist relative to her own diagnosis of party spirit. The last distinguishing feature to work through is unlimited growth: for a party this serves as an end because growth translates into institutional power, so I need to figure out what the equivalent function of growth is for a leaderless movement that holds no formal power.

