thinking: |-
  I need to evaluate both responses against the memo format requirement, checking whether each proposes a single concrete policy with a phased timeline and genuinely confronts the "why not go all the way to vegetarian" objection. Looking at Response A first, I'm checking its memo structure and the specifics of its Meatless Monday proposal with its phase-in schedule.

