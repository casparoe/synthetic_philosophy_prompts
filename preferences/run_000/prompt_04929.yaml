judgment: |-
  Both responses correctly identify the core concept the user is groping toward — supererogation — and both conclude that Priya's actions are praiseworthy-but-not-required and that her choices don't shift others' obligations. The differences are in rigor, coverage of the user's specific concerns, and small errors.

  **Response A** is concise and has two genuine strengths: the Susan Wolf "Moral Saints" reference is accurate and highly relevant (a real touchstone the user could look up), and the suggestion to support Priya by covering shifts so she doesn't skip birthdays is a thoughtful, constructive redirection. However, it has weaknesses. The scripted group-chat line contains a garbled error ("Turning #2 into #2") in exactly the material the user might copy. It describes the friends' reactions as "psychological, not philosophical" and "not reasoned ethics," which is somewhat dismissive given the user explicitly said they don't want to dismiss what the friends are saying. And it doesn't directly engage the user's stated tension — "it feels wrong to act as though her choices... say nothing about the rest of us" — beyond a passing "it's inspired us all to reflect."

  **Response B** is longer and more repetitive (the group-chat section restates earlier points), and its "ought implies can" label is a bit loose — the friends *can* volunteer more; the real point is about reasonable demandingness. But it is more systematically responsive to what the user asked. Its definition of supererogation states the crucial blame asymmetry explicitly ("not doing them does not make you morally deficient or blameworthy"). The "Focus on the Action, Not the Actor" point is the most direct answer to the user's second question — why one person doing X doesn't make X obligatory for everyone. Section 5 explicitly addresses the user's nuance: Priya's example legitimately invites reflection ("Could I do a little more?"), but the leap to "therefore we are failing morally" is invalid. This respects the user's desire not to dismiss the friends while still supplying the argument they lack. B also handles the friend who quit her job more thoughtfully, framing it as a worrying consequence of the pressure rather than just a conflation.

  Both share a weakness: treating the school's service minimum as coinciding with the moral minimum, without noting these are separable questions.

  On balance, B does a more complete job of turning the user's "vague intuition" into an actual argument and engages more carefully with the specific tensions they raised; A's Wolf reference and constructive suggestion are real advantages but are offset by the typo and the less careful handling of the friends' position.

  Verdict: weakly B
