  I'm working through the core commitments of Rosenthal's HOT theory—specifically that a mental state becomes conscious via an accompanying higher-order thought asserting one is in that state, and that this HOT must be assertoric in nature.

  I'm noting that Rosenthal's version is occurrent rather than dispositional (unlike Carruthers), and that the HOT is a distinct, extrinsic state from the first-order one—which sets up the targetless HOT problem raised by Byrne, Neander, Levine, and Block: since the HOT and first-order state are separate, the HOT could occur without its target, yet Rosenthal maintains this would still produce a phenomenologically indistinguishable conscious experience.

  This creates Block's dilemma: either consciousness belongs to the first-order state (but then there's nothing to be conscious in the empty case, contradicting the theory) or it belongs to the HOT alone (in which case the first-order state does no explanatory work for phenomenal character, undermining the whole "higher-order" framing). Rosenthal's response is to accept this consequence, insisting that what matters for consciousness is how things subjectively appear to the subject rather than whether a target state actually exists.

  He treats the intuition that some state must be conscious as question-begging, comparing the empty HOT case to ordinary perceptual hallucination, and calls the first-order state merely the "notional" object of the HOT — critics like Block and Weisberg pushed back on this move, while Weisberg's 2011 paper defends Rosenthal's position. I'm also considering the related misrepresentation problem raised by Levine and Neander, where the HOT represents the subject as being in one state while they're actually in a different one.

  On the causal question, Rosenthal typically holds that HOTs are caused by first-order states but insists this causal link isn't what constitutes consciousness — the phenomenology follows purely from having the HOT, independent of causal history. Requiring reliable causation wouldn't actually rule out targetless or misrepresenting HOTs, just make them less frequent, and building causal requirements into the theory would improperly smuggle extrinsic factors into what should be a purely representational account of consciousness.

  Turning to self-representationalism, I'm thinking through Kriegel, Williford, and Gennaro's related but distinct views — Kriegel's self-representational theory treats conscious states as representing themselves, while Gennaro's Wide Intrinsicality View is a hybrid he distinguishes from pure self-representationalism, and Van Gulick's Higher-Order Global States offers another variant in this same intrinsic-higher-order family.

  I'm noting how self-representationalism handles the targetless HOT problem — since the higher-order content is part of the same state, a state can't represent itself without existing, which rules out the targetless issue and partially addresses misrepresentation, though Kriegel's view has its own complications there.

  On animal and AI consciousness, I'm considering Rosenthal's cautious stance: HOTs don't require sophisticated concepts, so animals might have minimal versions, but critics like Dretske and Tye argue the theory implausibly denies consciousness to animals and infants, and Rosenthal treats this as ultimately an empirical question rather than a settled matter.

