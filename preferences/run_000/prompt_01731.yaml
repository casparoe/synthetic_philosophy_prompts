  **Neither** mentions the historically juicy point (emphasized by Worrall) that Fresnel's ether derivation was itself shaky yet the equations came out right, nor the Brunetière "bankruptcy of science" context. Both are somewhat generic structural-realism explainers wrapped around the passage.

  **Net:** A is more accurate on the NMA point, more thorough on the question the user cared most about (does it work or just relocate the problem), and gives better onward pointers. B is a bit tighter and more concrete in places but contains a real conceptual misstatement. A small but real margin to A.

