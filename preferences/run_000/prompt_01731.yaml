  - It repeatedly glosses the relations as holding "between observable phenomena" and equates "true" with "empirically adequate," which slides toward the instrumentalist reading Poincaré is explicitly resisting ("It cannot be said that this is reducing physical theories to simple practical recipes"). A drifts this way too at points, but B's phrasing does it more consistently.
