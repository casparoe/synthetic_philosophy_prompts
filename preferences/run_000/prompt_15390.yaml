thinking: |-
  I'm examining both responses, which converge on the same answer: the admissibility clause blocks the oracle counterexample and this move is principled rather than ad hoc. I want to verify this against Lewis's actual 1980 formulation of the Principal Principle in "A Subjectivist's Guide to Objective Chance."

  Lewis states that admissible propositions have their impact on credence entirely through credence about chances, and he identifies two admissible categories: historical information up to time t, and the history-to-chance conditionals embedded in the laws. He explicitly flags crystal balls, seers, prophets, and time travelers as inadmissible sources -- exactly the oracle scenario at hand. Notably, Lewis himself admits admissibility is "the vaguest part of the principle" and that he lacks a complete account of it, though he trusts the two categories he names capture the exhaustive cases.

  I'm now examining Response A's framing, which labels its statement "naive PP" yet oddly builds in an admissibility qualifier for E -- an inconsistency, since the naive/unrestricted version of PP shouldn't invoke admissibility at all. This sloppiness matters because Response A then uses this naive formulation to argue that the oracle's evidence forces credence to 0.5, which doesn't hold up once admissibility is properly restricted.

  Its second point on describing admissible evidence as confined to history-up-to-t and chance-governing laws seems basically right, echoing Lewis's own examples of oracles and crystal balls. But the third point raises a real subtlety: if the oracle's pronouncement occurs before t, it's technically part of H_t itself, which threatens to undermine the whole distinction Response A is trying to draw between historical admissible evidence and problematic future-telling evidence.

  I recall Lewis actually addresses this directly, suggesting that worlds with genuinely reliable seers or time-travelers would have to have different underlying chances to accommodate their foreknowledge, so the tension gets absorbed into the chance function rather than breaking admissibility itself.

  There's real tension in the stipulation itself: if the oracle's error-free reliability stems from a lawful connection and it speaks before t, then the chance at t given the full history (which now includes the oracle's speech) arguably wouldn't still be 0.5 under Lewis's Humean supervenience picture. But if we insist the chance stays 0.5 regardless, the oracle's reliability can't be lawful — it would just be a lucky coincidence, undermining the claim that it's "completely reliable."

  Response A gestures at this by claiming the oracle's specific pronouncement isn't contained in H_t, treating it as new inadmissible information relative to t. But this seems mistaken — if the oracle speaks before the toss, that pronouncement is itself an event prior to t and should be part of the history H_t, not external to it.

  Actually, Response A does touch on something real: if H_t genuinely includes the pronouncement, then PP would force credence to track the 0.5 chance conditional on that pronouncement too — which is exactly the tension Lewis's "tainted with futurity" remark is meant to address. Lewis's way out is that the underlying theory of chance would itself register a different chance given that history, or such worlds are simply excluded as incoherent under his framework.

  So Response A slightly mishandles this by insisting the pronouncement lies outside H_t, when by Lewis's own definition it clearly belongs there since the oracle spoke before time t. Response B sidesteps this entirely, sticking to the standard admissibility framing — E is inadmissible, so PP stays silent — which is correct but doesn't engage with the deeper puzzle. A discerning reader might catch that A's move, though technically wrong, gestures at a real difficulty for Lewis's account that could come up in a seminar discussion.

  I'm also noticing some smaller issues: A's phrasing of the naive PP oddly includes "admissible" evidence, muddying the contrast it's trying to draw, and both responses lean on describing chance as a "physical propensity," which is a common simplification but not quite how Lewis's Humean supervenience actually works — a minor point rather than a serious flaw for either side.

  Turning to Response B, its first point states the refined Principal Principle accurately, tying admissibility to time t, though calling E "total background evidence" is a slight looseness since admissible propositions needn't be the totality of one's evidence.

  Point 2 correctly identifies admissible evidence (past/present facts, laws, chances) versus inadmissible sources like prophecies or time-traveler reports, matching Lewis's framework. The application to the oracle case (points 3-4) follows the standard reasoning that the Principal Principle applies before the oracle's pronouncement but falls silent afterward since the evidence becomes inadmissible, while chance itself remains unchanged at 0.5.

  For point 5, Response B's screening-off point is particularly strong and closely echoes Lewis's own characterization that admissible propositions influence credence about outcomes only through their bearing on chance — something Response A only gestures at without stating explicitly.

  There's a slight self-tension in B's argument though: claiming the admissibility clause was designed specifically for cases like crystal balls and prophecies, yet also insisting this isn't ad hoc. B resolves this by noting the clause was part of Lewis's original 1980 formulation rather than a later patch, and flows naturally from chance's intended role as ultimate authority.

  I'm noting that both responses miss a deeper point — the potential incoherence in stipulating both a fixed chance of 0.5 and a perfectly reliable oracle speaking beforehand, plus Lewis's own admission that admissibility lacks a complete, precise account.

  A more sophisticated worry neither response tackles is that admissibility risks circularity — defined merely as "whatever doesn't cause trouble" or "whatever makes PP true." Lewis's actual characterization, involving historical information and history-to-chance conditionals, is meant to answer this, and B's screening-off framing gets closest to it while A's expert-function point is also relevant. Neither response engages with whether the oracle stipulation is even coherent under Humean supervenience, which feels like a real omission.

  Reconsidering Response A's claim about H_t: if the oracle's pronouncement happens before t, it belongs in H_t outright, and since A sets t as "just before the toss," after the oracle has spoken, its argument that H_t excludes the pronouncement seems simply mistaken.

  Under Lewis's actual view, admissibility comes from information about seers being "tainted with futurity," not from timing alone — so A reaches the right conclusion through a flawed route, which could confuse a careful reader who notices the discrepancy. Response B sidesteps this entirely by keeping the standard formulation, making its claim that oracle testimony is inadmissible straightforwardly correct on Lewis's terms.

  I also notice a minor framing issue: Response B labels one camp "wrong" even though the user never stated their own position, which is a small presumption but not a major flaw. Both responses reach similar conclusions with comparable formatting, though A is more verbose while B has a cleaner formal structure.

  Weighing accuracy more carefully, B's screening-off and historical-patch points are more Lewis-faithful and directly address the "ad hoc" worry, while A's parallel points are less specific. Neither addresses deeper issues like the vagueness or circularity of admissibility, or the tension between Humean supervenience and a truly reliable oracle, so those omissions cancel out. The decisive factor is A's error in claiming the oracle's pronouncement isn't part of the history at t — this actually undermines A's own resolution once you notice the oracle spoke before the toss, whereas B's explanation of inadmissibility avoids this pitfall entirely. Given that accuracy on the core mechanism matters most, I'm landing on a weak preference for B.
judgment: |-
  Both responses reach the same (correct) headline verdict: the oracle case doesn't refute the Principal Principle, the second camp is right, the blocking device is Lewis's admissibility clause, and that clause is principled rather than ad hoc. Both correctly note that Lewis himself listed seers, crystal balls, prophecies and time travelers as paradigm inadmissible information, so the "restriction" was in the 1980 formulation from the start rather than a later patch. Both share the same omissions: neither questions whether the user's stipulation (chance exactly 0.5 *and* a nomically infallible oracle speaking before the toss) is even coherent on Lewis's Humean picture, and neither mentions Lewis's own admission that admissibility is the vaguest part of the principle or the circularity worry that critics have pressed. So the comparison turns on accuracy of the mechanism.

  **Response B** states the actual Lewisian formulation correctly — Cr(A | Ch_t(A)=x ∧ E) = x for admissible E — and applies it cleanly: the oracle's testimony is inadmissible, so PP is simply silent about your credence conditional on it, and conditionalization on an infallible report takes you to ~1. Its "screening off" gloss (admissible evidence is the sort whose bearing on A comes entirely via the chance) is essentially Lewis's own characterization of admissibility, which is the best available answer to the "is this principled?" question. Minor blemishes: describing E as "total background evidence" is slightly imprecise, the frequency point is hand-wavy, and "Your Camp is Wrong" presumes which camp the user is in.

  **Response A** is broadly similar but has two accuracy problems in the core mechanism. First, its statement of the "naive PP" oddly already includes "any admissible evidence E," which muddles the naive/refined distinction it is trying to draw. Second, and more seriously, in applying the H_t & L reformulation it asserts that "H_t & L does not contain the oracle's specific pronouncement." But t is set as "now, just before the toss," after the oracle has spoken, so the pronouncement *is* part of the complete history up to t. This is exactly why Lewis said historical information is admissible only "as a rule" and that a past containing seers is "tainted with futurity." A's claim gets the route wrong, and on reflection its own framing (PP demands Cr(A | H_t & L) = 0.5, with the oracle's utterance in H_t) would reinstate the counterexample rather than block it. A seminar participant who repeats this could be corrected on precisely the point at issue. A's "expert function" motivation for admissibility is good, but B covers the same ground.

  Both serve the user reasonably and reach the right conclusion, but B is more faithful to Lewis's formulation and avoids a substantive misstep in explaining what blocks the case.

  Verdict: weakly B
