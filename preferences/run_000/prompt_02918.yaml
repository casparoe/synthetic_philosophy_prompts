  **Where they differ on the key tiling implication.** The central result from Yudkowsky–Herreshoff beyond the bare obstacle is that the parent can only justify a successor using a *weaker* theory whose soundness the parent can prove, yielding a descending tower of mathematical strength — "tiling" fails because each generation must lose strength.

