  **Weighing.** Both have a comparable number of flaws, but A's flaw sits on the most important implication for tiling (direction of strength), while B's flaw is a wrong instantiation of a correctly-stated idea. B's narrative matches the actual literature better and points the student to the right follow-ups. The trade-off is real (B's formula error is glaring), so the margin is small.

