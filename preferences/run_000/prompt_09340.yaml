  For (3), stated intentions can carry meaningful behavioral information, and dismissing them ignores things like cognitive dissonance and precommitment. For (4), the sin tax citation is a bit off — O'Donoghue & Rabin's 1999 paper is about present-bias generally, with the actual sin tax formalization coming later (2003, 2006) alongside Gruber & Köszegi's cigarette-specific work — and calling the internality-based justification "strongly correct" overstates things since neither response actually addresses the externality argument that traditionally justifies these taxes.

  Re-reading B's take on (4): it makes the sharp point that revealed preference works fine as a positive/predictive tool even while welfare analysis is normative, and these can diverge — echoing Bernheim & Rangel's behavioral welfare economics. Interestingly, A raises a similar distinction in its "Key Gaps" section about conflating prediction-based revealed preference with welfare-based preference, so A does cover this ground even if not directly under point (4).

