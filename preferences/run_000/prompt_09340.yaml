  This is a debate about revealed preference theory applied to a brother-in-law who claims he wants to quit smoking but keeps buying cigarettes daily—the user wants me to evaluate each numbered move in the economist vs. psychologist argument, note blind spots in both positions, and close with a concise verdict.

  Going through the exchange: the economist opens by insisting choices reveal true preferences, so daily buying means he prefers smoking despite what he says; the psychologist counters that this makes acting against one's own considered desires conceptually impossible, ignoring akrasia and addiction; the economist replies that economics allows for second thoughts but only counts preferences that show up in actual choices, dismissing "I want to quit" as cheap talk absent real steps like buying a patch; the psychologist points out that economists themselves invoke a "true" preference to justify cigarette taxes, undermining the economist's own consistency; the economist then notes that competing models—like rational addiction theory or the wanting-versus-liking split—mean the "real preference" question is really about which model you pick, not a settled fact.

  This lands as essentially conceding that there's no single fact about the "true" revealed preference without first assuming which self or model is doing the choosing. The economist's core claim holds up as a technical, operational definition of preference, but overreaches by dismissing the felt desire to quit as confused — that conflates the technical term with the everyday sense of "wanting," and ignores that revealed preference theory presumes stable preferences across contexts, while addiction involves shifting internal states; also, buying a pack today only reveals a preference for that pack over the money in that moment, not necessarily a preference for smoking forever over quitting.

  This connects directly to the consistency conditions (WARP, GARP) underlying revealed preference — the same tests used in rat foraging experiments checking whether animal diet choices held together as internally consistent. The real insight is that revealed preference doesn't tell you what someone "truly" wants, only whether their choices are consistent with some utility function; if the brother-in-law's cigarette purchases and patch purchases and stated desire to quit violate GARP across contexts, then no coherent preference is revealed at all — which is the deeper point both friends in the dialogue are missing.

  On the psychologist's objection about akrasia: the economist can reply that "preference" is just a technical term, distinct from "considered judgment" or "desire," so revealed preference isn't denying akrasia exists, it's just refusing to label the considered desire a "preference" — a terminological move rather than a substantive one, which somewhat undercuts the psychologist's critique while also revealing the psychologist may be equivocating on the word.

  On the economist's stance about refusing to count anything as a preference unless it's revealed in choice: that's a legitimate operationalist position tracing to Samuelson, but the "cheap talk" framing is shakier since cheap talk in game theory specifically means costless, non-binding communication, and there's a whole literature suggesting stated preferences can still carry real information.

  I'm also noticing that the economist's position seems to soften between statements — first flatly denying the "wants to quit" desire is meaningful, then later merely declining to call it a "preference" — which is a retreat that neither response call out explicitly, though one gestures toward the underlying terminological-versus-substantive distinction.

  On the psychologist's cigarette-tax point, I recall that the internality-based justification (Gruber & Köszegi's work on time-inconsistent smokers) is a behavioral-economics argument, distinct from the standard neoclassical externality rationale — and the rational-addiction model wouldn't support paternalistic taxes on internality grounds at all. So the tu quoque charge lands against behavioral economists generally but doesn't clearly land against the strict revealed-preference economist speaking in statement (1).

  Both responses grade this move as valid but miss noting that neither addresses the primary standard justification — externalities like secondhand smoke and healthcare costs — which is a real gap in the analysis. I also notice Response A cites O'Donoghue & Rabin 1999 on procrastination rather than the more directly relevant Gruber & Köszegi or O'Donoghue & Rabin 2006 "Optimal Sin Taxes" paper, so the citation is slightly off-target.

  On the substance itself, the economist's dismissal of model choice as "just a modeling decision" is actually the weak point I should flag — models carry testable empirical content, and there's real evidence (Gruber-Köszegi tests, Giné-Karlan-Zinman's commitment device studies showing smokers pay for restrictions on their own future choices) that could adjudicate between rational-addiction and time-inconsistent models rather than treating them as arbitrary.

  The demand for commitment devices is itself revealed-preference evidence of a genuine desire to quit, which undercuts the economist's own position using her own methodology — Response B captures this well by noting that commitment device purchases reveal a "long-term self's" preference, while Response A only gestures at precommitment without developing this point. Both responses also underplay just how large a concession the economist makes when she shifts from "it's confused to talk about really wanting to quit" to "it's just a modeling decision."

  On whether there's "no fact of the matter" about which self is choosing, I think this claim is too strong — model choice can still be disciplined by empirical fit, like whether smokers actually buy commitment devices or respond to tax hikes in ways consistent with time-inconsistent preferences. Response B flags this weakness directly, noting that all science uses models and the real question is which one predicts better, whereas Response A calls the issue "ontological, not empirical," which seems to overstate the case since dual-self versus unitary-agent framing does have testable implications.

  Neither response fully engages with the user's own expertise in consistency testing — if the brother-in-law's choices vary across contexts (cold state versus hot state, morning versus evening) in ways that violate GARP-type consistency, strict revealed preference analysis should conclude no stable preference exists at all, not that he prefers smoking. Response B makes a partial attempt to connect to the user's field biology background through a taste-aversion analogy, though it's a loose fit — a stronger parallel would involve animal studies controlling for hunger states when testing revealed preference.

