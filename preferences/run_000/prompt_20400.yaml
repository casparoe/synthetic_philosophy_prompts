  Jae's version—that honest, rational people trading probability estimates back and forth must eventually agree—actually reflects the Geanakoplos-Polemarchakis extension of Aumann's original result rather than Aumann's theorem itself, which technically concerns common-knowledge posteriors rather than iterated exchange. Both versions require a common prior assumption, though, which Jae never mentions, so his conclusion that persistent disagreement means someone "isn't reasoning straight" overreaches given that omission.

