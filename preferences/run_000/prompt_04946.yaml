  **Weighing:** A violates the user's clearest craft instruction more conspicuously, but that flaw is confined and excisable, and the rest of the story is sound. B is more ambitious on subtext and untidiness but stumbles on period accuracy and internal logic in ways that damage its core premise (a rigorous investigator) and its payoff. On "getting things right and doing what was asked," A comes out slightly ahead, though the trade‑off is real.

