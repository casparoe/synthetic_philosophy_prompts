  This is a request for a rigorous philosophical case against Thornley's incomplete preferences proposal, focused on the money-pump objection. I should engage seriously with the strongest defense—likely resolute choice or distinguishing this scenario from standard money-pump setups—rather than settling for a superficial critique.

  I'm recalling Thornley's actual proposal: he addresses money-pump vulnerability directly by proposing a policy where an agent refuses any option it strictly disprefers to something it previously turned down. This resembles resolute or dynamic choice strategies aimed at avoiding exploitability without requiring full preference completeness.

  Thornley's Timestep Dominance principle is central to his shutdown solution - a TD-agent never chooses a lottery that's timestep-dominated, which he argues rules out paying costs to shift shutdown probability since such payments would themselves be dominated.

  I should track the relevant literature here: Gustafsson's money-pump arguments, Thornley's "no coherence theorems" work with EJT, and Gustafsson's sequential-choice pump against incomplete preferences, where sophisticated backward-induction choosers get exploited in specific trees, and resolute choosers avoid this but arguably by acting against their own preferences at some node.

  Gustafsson's key claim is that agents who avoid pumps via resolute/forward-looking policies thereby reveal complete preferences, while Thornley counters that such behavior is tree-dependent and can't be captured by a single complete preference relation—acting as though preferring A to B in one tree and B to A in another. I'm also working through the mechanics of the standard single-sweetening money pump: starting from an incomparability between A and B, trading A for B, then testing whether a slightly-improved A+ remains incomparable to B given how incompleteness is typically modeled as insensitive to small improvements.

  The real pump requires starting at A+, trading down to B, then trading B for A, ending strictly worse off than the start—and the resolute policy blocks this by refusing to choose an option strictly worse than one previously declined. I want to press on whether this policy secretly amounts to a dynamic completion of preferences, especially examining what the decision tree structure looks like in the actual shutdown-problem case.

  With POST, since the agent only has strict preferences between same-length trajectories, a pump would need to shuttle it between trajectories of different lengths and back to a worse same-length one — but shutdown time isn't really tradeable like ordinary goods since it's a one-off event. A stronger version of the objection would need to construct the pump using lotteries over shutdown times, which is exactly what Thornley's timestep-dominance principle is designed to handle by comparing lotteries conditional on each possible shutdown time.

  So the real question becomes whether across a sequence of individually TD-incomparable choices the agent could still end up picking a composite trajectory that's TD-dominated by an alternative sequence, even though it never picks a TD-dominated option in any single step — Thornley's claim is that TD-agents never pay costs to shift shutdown probability, so a pump would need to exploit incomparability between lotteries differing in shutdown-time distribution rather than any single dominated choice.

  I trace through a concrete example where two lotteries with different shutdown-time payoff structures are TD-incomparable, but an adversary can chain trades so the agent ends up with a strictly worse option than one it earlier passed over — this only gets blocked if the agent remembers what it turned down and refuses to accept anything dominated by it, which raises real worries about whether that memory-based policy survives self-modification or delegation to sub-agents.

  I also consider Gustafsson's point that following such a policy makes the agent behave like it has a complete preference ordering within any given decision tree, with the specific ordering shaped by the sequence in which options are presented — meaning an adversary who controls that sequence could effectively install a determinate preference over shutdown timing. But I'm not sure this actually breaks the safeguard, since paying a cost purely to shift shutdown probability remains TD-dominated and thus never chosen, unless that costly option gets bundled into something TD-incomparable to slip past the constraint.

