judgment: |-
  Both responses follow the requested JSON format, agree that Camp's perspectival account is the best fit, and place the two Hom views at the bottom. The meaningful differences are in the middle of the ranking and in the accuracy of the reasons given.

  **Response B's key problem is its treatment of Jeshion.** It ranks Jeshion #2 as "built-in" on the grounds that "contempt expression depends entirely on speaker attitude" and that reclamation happens "through speaker intentionality alone." That misdescribes the view. Jeshion's expressivism is a *semantic/conventional* expressivism: slurs conventionally express contempt regardless of whether the particular speaker feels it (that's precisely why she thinks a non-bigoted outsider still offends). Jeshion herself treats reclamation as requiring substantial extra machinery—meaning change/polysemy driven by a social process, developed at length in her later dedicated work on reclamation. So her view is a paradigm case of the "bolted-on" phenomenon the user is asking about, and B gets it backwards. B is also internally inconsistent: it calls Potts's conventional expressive dimension "bolted-on" (because the CI layer would have to be "disabled") while calling Jeshion's structurally similar conventional expressive component "built-in." A grad student in a slurs seminar would likely notice this, and if they didn't, it could send their paper in the wrong direction.

  B's "bolted-on" verdict for prohibitionism is also contestable against the primary text: Anderson & Lepore explicitly derive the targeted group's ability to exempt itself from the fact that offensiveness is nothing but norm-violation, and they present appropriation as a *selling point* of the view over content-based rivals. Critics argue it's shallow, but "the theory's own machinery naturally accommodates it" is the more defensible reading—which is what Response A says.

  **Response A** ranks prohibitionism #2 (consistent with A&L's own claims), Jeshion #4 as bolted-on (correctly identifying that speaker identity flipping contempt to pride isn't delivered by the core view), and the Hom views last. Its weaknesses are milder: the Potts "mutable conventions" reason is thin and sits uneasily with calling Hom's externalist meaning-change story bolted-on, and some phrasing ("magically," "core axioms") is loose. But nothing in A mischaracterizes a theory's content the way B does with Jeshion. A also adds a short, relevant paper-angle recommendation that speaks to the user's stated goal.

  On the "weakest" call, both pick one of the Hom views and both are defensible.

  Given that the user explicitly prioritizes getting the theories right, A's ranking tracks the literature substantially better, and B's central error affects a top-tier placement.

  Verdict: strongly A
