  The more genuine issue lurking here is Hall's point that under NPP the "corrected" chances P(A|T) are what really do the work of guiding credence, raising the question of why P(A) itself deserves the label "chance" at all—Lewis himself concedes NPP is less elegant than the original PP. I'm also recalling Briggs's argument that NPP creates a real dilemma for Lewis's semantics of chance-talk, since it preserves coherence only at some cost to the "chance is a guide to credence" desideratum.

