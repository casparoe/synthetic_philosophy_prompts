  I need to evaluate both responses' treatment of Lewis's account, so I'm recalling the actual mechanics: the Principal Principle linking credence to chance conditional on admissible evidence, and Lewis's reformulated version invoking history-to-time-t propositions to handle the undermining problem.

  The undermining problem itself is that undermining futures get positive chance under any nontrivial theory of chance, yet those futures are logically inconsistent with the theory of chance given the history — creating a direct contradiction between what the Principal Principle demands and what logical consistency allows. Lewis's fix, the New Principal Principle from his 1994 paper, conditions credence on the chance of A given the theory of chance itself rather than the theory outright, since the theory's own chance is typically less than one precisely because of undermining possibilities.

  Now I want to compare how two candidate responses formalize this NPP — one frames it as conditioning credence on T alongside history and evidence, treating T as a package deal so that conditioning on ~T becomes either undefined or trivially zero, sidestepping the earlier contradiction.

  But I think Response A actually misidentifies the fix: its formula is basically identical to the old reformulated PP that generates the contradiction in the first place, since it still equates credence in ~T conditional on T with T's own probability of ~T, which is exactly the 0 = ε clash. The real NPP move is to condition the chance function itself on T_w, not just plug T into the credence conditional, and Response A seems to have missed this distinction while claiming to have resolved it.

  Response A's claim that "Ch_t(~T) = ε entails T" seems shaky—a single chance value shouldn't entail the whole theory. The real point is that the undermining future F, when conjoined with H_t, is inconsistent with T, forcing conditional credence to 0 despite T assigning positive chance to it; Response A's framing is a garbled approximation of this.

  This does echo a known objection: T predicts positive chance for its own undermining futures, yet the NPP forces credence 0 in those very futures once T is known, seemingly creating internal conflict. But this parallels ordinary cases—knowing a coin landed heads makes credence in tails 0 even though the chance was 0.5—since conditioning on T is like having inadmissible information about the future, which is essentially Lewis's own response to this tension.

  I'm also noting that Response A's point 2c mischaracterizes Lewis's view by claiming T is part of the fundamental supervenience base, when actually T supervenes on that base—a distinct issue from undermining, more related to Lewis's own "ratbag idealist" worry about the evaluative nature of best-systemhood.

