  Response B adds a point about private information not being perfectly transmissible, but that's actually irrelevant to Aumann's theorem since it never requires sharing the underlying information—only the posteriors. The bounded rationality point B raises is stronger, since it honestly concedes that a real person may not update as a perfect Bayesian would.

