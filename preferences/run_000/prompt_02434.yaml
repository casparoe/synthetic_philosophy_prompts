judgment: |-
  **What the user needs:** (1) an accurate account of what the 1852 speech itself says about the Constitution, with quotable evidence, since the friend has actually read the speech; (2) accurate dates and reasons for Douglass's shift.

  **Response A**
  - Gets the overall thesis right (friend is backwards; shift happened 1847–1851, announced 1851).
  - Correctly quotes "take the Constitution according to its plain reading, and I defy the presentation of a single pro-slavery clause in it" from the 1852 speech.
  - But its first and most prominent quote — "I hold that the Federal Government was never, in its essence, anything but an anti-slavery government… Abolish slavery tomorrow, and not a sentence or syllable of the Constitution need be altered… scaffolding to the magnificent structure" — is presented as being *in the Fourth of July speech*. It is not; it's from Douglass's 1860 Glasgow speech. Since the friend read the 1852 speech for class, this is exactly the kind of error that would sink the user in a rematch.
  - Also attributes the title "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?" to the 1851 announcement — that's the 1860 speech's title — and the detailed argument list under 1851 is largely drawn from 1860.
  - Omits Gerrit Smith, the single most important influence on Douglass's change.

  **Response B**
  - Same correct overall thesis and timeline.
  - Its evidence for what the 1852 speech says is genuinely from the speech: "plain reading… single pro-slavery clause," "But it is answered in reply to all this…," "basely stooped 'To palter with us in a double sense'…," and "GLORIOUS LIBERTY DOCUMENT. Read its preamble…" — all real, all checkable.
  - One interpretive error: it says Douglass "accuses the founders of hypocrisy" in the "basely stooped" passage, when Douglass actually presents that as the conclusion one would be *forced* to if the pro-slavery reading were right, then explicitly says "I differ from those who charge this baseness on the framers." Wrong reading, though it doesn't undercut the user's position.
  - Shares A's misattribution of the 1860 "never, in its essence" quote, but places it in the 1851 "Change of Opinion Announced" — still wrong, but far less damaging than putting it in the speech the friend has read.
  - Adds correct, useful specifics A lacks: Gerrit Smith's influence, Spooner's 1845 book, the May 1851 Syracuse AASS meeting where Douglass announced the break, Garrison's reaction, Douglass's later offices, and a "why the confusion" paragraph that directly equips the user to explain the friend's misreading.

  **Assessment:** Both share the 1860 misattribution, and B has a misreading of one passage. But on the user's central question — what the speech itself says — B's quotes are accurate and A's headline quote is not in the speech at all. B is also richer and more accurate on the "when and why." For a user who wants to go back to a friend who has read the text, B is clearly the safer and more useful answer.

  Verdict: strongly B
