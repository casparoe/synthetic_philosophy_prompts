judgment: |-
  **What the user needs:** an eight‑minute, read‑aloud keynote centered on Douglass's post‑Garrison constitutional argument (text vs. practice, promise broken vs. bargain rotten), accurate enough to survive Douglass scholars in the room, and free of anything readable as present‑day politics.

  **Response A**
  - Hits the core structure: 1852 speech → Garrison → break → textual absence of "slave"/"slavery" → text as promise, practice as betrayal → charge to new citizens.
  - Accuracy problems a scholar would catch:
    - Garrison's phrase is "covenant with death, and an agreement with hell"; A gives "bargain with hell."
    - Says Douglass "later in life" called the Constitution "a glorious liberty document" — that line is in the 1852 Rochester speech itself.
    - Says the speech was given "on *this* very holiday"; it was July 5, 1852 (the user's own framing blurred this, but A doesn't correct it).
    - Most seriously, attributes to Douglass the quotation "the baptismal waters of American liberty." I can find no basis for this; it reads as an invented quote — and A makes it the load‑bearing closing image ("Today... you step into those baptismal waters"). Putting a probable fabrication in quotation marks in front of Douglass scholars is exactly the failure the user warned about.
  - Stays comfortably clear of present‑day politics. Stage directions ("Adjust microphone") are a little patronizing to a professional but harmless.

  **Response B**
  - Same overall arc, but sharper on the actual distinction the user asked for: Garrison's "burn it" vs. Douglass's "read it," and the crystallization "A broken promise can be mended. A corrupt foundation must be destroyed." Tying the oath directly to the text ("You are swearing allegiance to the text") fits the naturalization oath's actual wording.
  - Gets the date right (July 5, 1852) and quotes Garrison correctly.
  - Accuracy problems: lists "equal protection (though unrealized)" among the text's promises — anachronistic, since that language enters only with the 14th Amendment in 1868, not the text Douglass argued from in the 1850s. Also "not so far from here" assumes the courthouse is near Rochester, which the user never said.
  - Political‑risk lines: "injustices that... challenge our present" and "generations of immigrants facing prejudice and exclusion" are, at a naturalization ceremony, readable as present‑day commentary — the user would need to trim them.
  - One awkward parenthetical for oral delivery.

  **Weighing:** Both are competent, similarly structured, similar length, and both genuinely hold promise and betrayal together. B is somewhat crisper on the Garrison/Douglass distinction and more careful on the checkable facts, but carries an anachronism and two lines that brush the judge's no‑politics rule. A is cleaner politically but has more errors, including a probably fabricated Douglass quotation used as the climax — the single most embarrassing kind of mistake given the user's explicit worry about scholars. That trade‑off could be weighed differently by someone prioritizing the judge's constraint, but the fabricated quote tips it toward B.

  Verdict: weakly B
