  Neither response addresses what's arguably the most relevant point given the user's assumption that she was a pacifist — her actual critique that pacifism corrupts moral thinking by erasing the combatant/non-combatant distinction. Both also skip procedural details like her failed protest in Convocation, Philippa Foot's involvement, and her parallel condemnation of Allied area bombing of German cities like Dresden.

