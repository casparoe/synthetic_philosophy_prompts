  Austen-Smith & Banks (1996) show sincere voting generally fails as a Nash equilibrium once voters condition on pivotality, holding only in special cases where priors and signal precision align just right. Feddersen & Pesendorfer (1998) push this further, demonstrating that strategic voting under unanimity rule can actually make wrongful convictions worse as jury size grows, contrary to what naive intuition might suggest.

  Under unanimity, the probability of convicting an innocent defendant doesn't vanish as the jury grows large, whereas under majority rule with strategic voting, full information aggregation is achieved asymptotically. This is the key insight from Feddersen-Pesendorfer and McLennan (1998): since jury voting is a common-interest game, the strategy profile maximizing correct decisions must itself be a Nash equilibrium, so high-accuracy equilibria exist for majority rule even under strategic behavior. Under unanimity specifically, a juror who believes their vote is pivotal only if everyone else voted guilty faces such strong evidence of guilt that they may vote to convict even against their own innocent signal.

  Under majority rule, by contrast, pivotality means others are evenly split, and in symmetric equilibria with symmetric priors and signals, this event carries no information (equally likely under guilt or innocence), which is exactly why sincere voting can be an equilibrium; asymmetries break this and push equilibria toward mixed strategies. Now I'm turning to evaluate the two responses for accuracy, starting with Response A's citations and its treatment of the pivotal voter calculus, which checks out correctly on the first point before I assess its second claim.

