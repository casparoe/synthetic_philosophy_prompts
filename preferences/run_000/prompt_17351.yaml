  I need to work through the philosophical substance carefully, evaluating how each of the six accounts of lawhood handles same-law-different-constant counterfactuals. Starting with Lewis's Humean best-system account, the constants are baked into the axioms themselves, so varying a constant means varying the mosaic and potentially yielding a different best system entirely.

