  I'm considering both responses to this physicist's genuine puzzle: phase transitions' sharp non-analyticities only strictly exist in the thermodynamic limit, an idealization, so does that undermine claims that RG explains real emergent behavior—like the frictionless plane worry? They mentioned struggling with Batterman's account in "The Devil in the Details," so I want to address that directly.

  Batterman's actual move is subtle: he argues the thermodynamic limit is a *singular* limit where behavior at infinity qualitatively differs from any finite approximation, and it's precisely this ineliminability of the limit in the explanation—not a convenient shortcut—that grounds the case for genuine emergence rather than undermining it.

  Unlike ordinary idealizations like frictionless planes, where you can perturbatively restore the missing detail and get smooth changes, singular limits break down that recovery, so the explanation genuinely requires an infinite-system object like a stable fixed point under renormalization group flow to account for why finite systems still share critical exponents. He bolsters this with analogies from optics, like the ray/wave limit and catastrophe theory, where similar singular-limit structures explain the phenomena.

  I should also bring in the countervailing literature—Butterfield's argument that emergence via limits is compatible with reduction and that finite-N systems just approximate limiting behavior smoothly, along with related work by Norton, Callender, Menon and Callender, and Bangu, all pushing back on how much ontological weight Batterman places on the limit itself.

  What the question is really pressing on is why the ineliminable use of the limit signals genuine metaphysical novelty rather than mere convenience. To answer well I need to lay out Batterman's distinction between regular idealizations (like frictionless planes, where corrections are smooth and perturbative) and singular limits (like the thermodynamic limit at criticality, where the qualitative behavior isn't a smooth continuation of finite-N behavior, yet explaining finite-N universality still requires invoking the limiting fixed point)—and then get into his point that the real explanatory target is the pattern of universality itself across systems.

