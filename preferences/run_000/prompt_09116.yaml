  I'm recalling the actual mechanics of the MIRI 2015 corrigibility paper, specifically Armstrong's utility indifference approach where the agent's combined utility function switches between a normal utility and a shutdown utility depending on whether a shutdown button gets pressed, with a correction term added to maintain indifference between the two outcomes.

  Alex's phrasing captures the core idea well. But the paper also flags real problems with utility indifference: the agent has no incentive to preserve the shutdown button since it's genuinely indifferent, meaning it might trade away or let it be destroyed for trivial gains; it also won't necessarily build subagents that are corrigible; and because it behaves as if the button will never be pressed, it can end up making bad bets or decisions on that basis.

  Now I'm turning to Hadfield-Menell, Dragan, Abbeel, and Russell's 2017 "Off-Switch Game" paper, where a robot can act directly, defer to a human by proposing an action first, or the human can shut it off before it proceeds.

  The key result is that if the robot is uncertain about the human's utility, deferring is always at least as good as acting, since the human's shutoff decision reveals information about whether the action was actually harmful — so uncertainty about the reward function is what drives the robot's incentive to preserve corrigibility, and that incentive vanishes if the robot becomes overconfident or if the human's behavior is too noisy to be informative.

