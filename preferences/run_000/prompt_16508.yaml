  I'm working through the redescription problem for Anscombe's Truman argument: if double effect allows flexible redescription of intentions, there's no principled line stopping Truman's bombing from being redescribed as permissible too, forcing a choice between condemning parallel WW2 tactics or abandoning the charge against Truman specifically.

