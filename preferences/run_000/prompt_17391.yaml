  There's also a subtler Leibnizian point worth raising: since matter is infinitely full of organisms, an artifact does contain countless dominant monads belonging to its constituent organisms, but the question is whether the artifact *as a whole* has its own. And crucially, Leibniz's doctrine of preformation holds that souls/dominant monads are never newly created by finite beings — they exist from the moment of divine creation and only ever transform or unfold, never originate through generation. That would mean a human-made artifact could never house a genuinely *new* dominant monad, since no finite agent (like a human engineer) can create one.

