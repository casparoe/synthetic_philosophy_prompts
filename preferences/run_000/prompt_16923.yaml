  Molyneux predicted "no" with the reasoning that touch-to-sight correspondence must be learned through experience rather than being innate, without specifying a timeframe—so that part is correct but underspecified. Locke shared this empiricist view, holding that visual perception of solid form is actually a learned "judgment" that habitually converts flat colored patterns into ideas of convexity.

