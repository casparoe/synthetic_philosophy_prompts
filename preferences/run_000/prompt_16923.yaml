  Berkeley, by contrast, argued for radical heterogeneity between visual and tactile ideas, with no shared abstract concept of figure between them; he thought the newly sighted person wouldn't even grasp that objects were external or had depth, seeing everything as flat impressions on the eye. Berkeley's account treats the visual-tactile connection as arbitrary, learned like a language, which raises the question of whether his framework can explain the surprisingly rapid learning and the apparent usefulness of motion cues observed in real cases—suggesting the connection may not be purely arbitrary after all.

  Locke's view predicts immediate 2D shape perception but delayed 3D judgment, which better matches the Prakash subjects' immediate visual-visual matching ability.

  Leibniz's actual answer was more hedged than usually remembered — he thought the blind man could succeed by reasoning geometrically (a sphere has no distinguishing points, a cube has eight corners), but only if told which shape was which beforehand and not "dazzled and confused" by the novelty of sight.

