thinking: |-
  I'm working through the specific constraints here: this toast needs to make Daniel's epistemic akrasia both the joke and the emotional heart, land for philosopher and non-philosopher guests alike, and avoid the trap of simply arguing him into believing the evidence—since his own dissertation shows that approach can't actually work on him.

