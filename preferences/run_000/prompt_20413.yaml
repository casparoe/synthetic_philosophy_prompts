judgment: |-
  **What the question really needs:** The friend's argument has a hidden step. The Church-Turing thesis is a claim about *effectively calculable* procedures being Turing-computable; it says nothing about whether *physical processes* are computable. That's a separate conjecture (the "physical" Church-Turing thesis), plausible but not settled. Beyond that, "simulable in principle" ≠ tractable, ≠ we have the algorithm, and "simulating a brain" ≠ the simulation *having* thoughts. And none of it implies "right around the corner."

  **Response A** hits all of these. Its section 2 states the core point cleanly: the thesis says "if computable, a TM can do it," so the friend still owes a proof that brain physics is computable — "widely held belief but not a proven fact." It separates "brain is physical" (granted) from "brain physics is computable" (assumed), which is exactly the distinction the user needs. It handles the in-principle vs. imminent gap, the missing-algorithm gap, the level-of-abstraction question (framed coherently as "we don't know the minimal level of abstraction required"), and the hard problem. The one slip is labeling the simulation-equals-mind assumption "reductive physicalism" when it's really computational functionalism — a minor mislabel that doesn't affect the central point.

  **Response B** covers the same ground and adds some useful hooks (Chalmers, Penrose, philosophical zombie, Landauer limit, and the nice nuance that the CT thesis is formally unprovable). But it has more substantive problems:
  - It twice describes the computability assumption as "based on physicalism" / "physicalism (the brain is only a computable physical system)." This conflates *physical* with *computable* — which is precisely the gap the user is asking about. It muddies the exact distinction that answers the question.
  - "We might simulate the physics perfectly and get a lifeless, non-intelligent output because we missed some critical level of organization" is incoherent: a perfect physics simulation by definition reproduces all higher-level organization and all behavior. This also contradicts its own zombie point a paragraph earlier (outputs that *look* intelligent without experience).
  - The embodiment section is tangential to the in-principle argument (a simulation could include body and environment) and presents a contested view as fact.
  - "Church-Turing Deceptis" is a garbled header; Penrose is called a philosopher. Minor.

  Both responses are similar in scope and structure, and both correctly identify the smuggled assumptions and answer "not settled." B's extra references are a real plus for a user who wants to keep arguing with the friend. But A is more logically clean and avoids errors on the very point the user asked about, and correctness matters more here than the added color.

  Verdict: weakly A
