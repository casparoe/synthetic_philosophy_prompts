  Gould's point is that even if the pendentive's load-bearing role is structurally necessary, that necessity doesn't undo its status as a byproduct — the dome-and-arches decision is primary, the pendentive secondary. He distinguished "spandrel" as the general term for the leftover space from "pendentive" as one specific structural solution to fill it, while still granting that any secondary use like mosaics counts as exaptation. What matters now is checking whether each response engages this exaptation rescue correctly and builds the strongest case.

