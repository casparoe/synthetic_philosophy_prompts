  If a multitude has the right to establish a king itself, it can likewise depose him or restrict his power without acting unfaithfully, since the tyrant himself deserved this by failing his office — as when the Romans expelled Tarquin or the Senate revoked Domitian's acts. But if providing a king belongs to some higher authority, then remedy against the tyrant's wickedness must be sought from that superior instead.

  When Archelaus began ruling Judea after Herod, the Jews complained to Caesar Augustus, who diminished his power and later exiled him — this fits the second case, since Caesar was the superior with authority over installing the king. If no human aid can be found at all, Aquinas says recourse must be made to God, who permits tyrants as punishment for sin, meaning the people must cease sinning for the tyranny to end. So Aquinas lays out a hierarchy of remedies: the multitude itself, then a superior authority, then God as the final recourse.

