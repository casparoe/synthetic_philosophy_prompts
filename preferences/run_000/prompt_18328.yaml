  The key distinction in the Sentences commentary is between a usurper who seizes power illegitimately (tyrannus in titulo) versus a ruler who governs badly but holds legitimate title (tyrannus in regimine) — Aquinas's approval of killing the tyrant there hinges specifically on the absence of any recourse to a higher authority capable of judging the usurpation, which matters a great deal for how the argument extends to modern cases.

