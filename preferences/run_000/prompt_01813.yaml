  **What the user needs:** a fresh, mundane indicative/counterfactual pair that ordinary people would clearly judge to differ in truth value, plus a short, correct explanation of why. The example has to survive scrutiny from a skeptical friend, so internal coherence matters most.

  **Response A (cookie timer):** The structure exactly mirrors the Oswald/Kennedy pattern in a mundane setting. The indicative "If Alex set the timer, Alex set it wrong" is evaluated from an epistemic position where you know the timer was set wrong but don't know who set it — so it's true (whoever set it set it wrong). The counterfactual "If Alex had set it, he would have set it wrong" is evaluated in the closest world where meticulous Alex set it instead of Taylor — so it's false. Both truth-value judgments hold up, the antecedent/consequent are shared, and the epistemic setup for the indicative is explicitly stated (the key ingredient people usually forget). The explanation correctly connects to the user's half-remembered picture (indicatives constrained by known facts; counterfactuals about regularities in nearby worlds) and the "how to say it to Jordan" script is usable. One small blemish: the parenthetical "10 minutes instead of 15" would produce undercooked, not burned, cookies — but this is an illustrative aside that doesn't touch the logical structure; the user can just say "set the timer wrong."

  **Response B (lunch meeting):** The example is internally broken. First, arriving at 12:25 for a meeting you believe starts at 12:00 makes you think you're 25 minutes late, not "5 minutes late." Second, the "Key detail" paragraph literally says "If the meeting had truly been at 12:00 PM, you would have arrived at 12:25 PM and been late" — which is the counterfactual it then declares FALSE. Third, and most fatally, the rationale for the counterfactual being false is that "you would have known the correct time (12:00), so you'd leave earlier" — but in the actual scenario you *already believed* it was at 12:00 and still arrived at 12:25. Changing the actual meeting time to 12:00 doesn't change your belief or your behavior, so in the closest world you'd still show up at 12:25 and be late. The counterfactual comes out TRUE on the most natural reading, and the pair does not come apart. Jordan would dismantle this in one question. The explanatory sections are built on this broken foundation, and the closing rhetorical suggestion ("ask why we'd use two grammatical forms") is weak against someone whose whole thesis is that the forms differ only in tense.

  **Conclusion:** A delivers a working, everyday example with a sound explanation and only a trivial cosmetic slip. B delivers an example whose central truth-value split doesn't survive its own description, with arithmetic errors and a self-contradicting setup. The difference is clear.

