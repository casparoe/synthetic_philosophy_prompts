  Westerhoff's key distinction is between paryudāsa (implicative) and prasajya-pratiṣedha (non-implicative) negation — the negative tetralemma uses the latter, rejecting "x is F" without implying "x is not-F," which lets the fourth corner be rejected without contradiction since it's the svabhāva-framing being denied, not the plain alternative asserted.

  I'm also weighing the Tillemans vs. Priest/Garfield/Deguchi debate — the former defends a classically consistent reading, the latter argue for dialetheism. A strong response should note 18:8 as the positive catuṣkoṭi (Candrakīrti's graded upāya reading), 22:11 as the negative catuṣkoṭi with prasajya negation and the "prajñaptyarthaṃ" (for designation's sake) framing, and the parametrization across conventional/ultimate/svabhāva senses of "real," "not real," and "neither" — plus a stance on the consistency-versus-dialetheism question.

