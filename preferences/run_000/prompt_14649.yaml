  For partial observability and deception, I'm assessing whether the claim that the agent perfectly observes the shutdown attempt matches how the model actually treats the agent's choice to wait.

  Preemptively disabling the shutdown mechanism isn't something the rational-human model would favor, since with genuine uncertainty the agent prefers deferring—so that concern only bites under misspecification or irrationality, which B doesn't tie together. The manipulation concern (influencing H's beliefs to avoid the button) is more legitimate in sequential extensions, though the base model assumes H observes directly.

  On "Reward Learning Isn't the Only Goal," pointing out that real agents might have hardcoded terminal goals just restates that the off-switch design requires uncertainty by construction—it's not really a critique of the framework itself, and points about emergent self-preservation or power-seeking are speculative rather than substantive. The stronger concern is model misspecification: if the agent's prior over reward functions assigns near-zero probability to cases where shutdown is actually desirable, corrigibility breaks down regardless of the underlying theory.

  The option value versus control value framing still seems like it's inventing terminology to describe what's essentially the fully-updated-deference problem restated—an agent believing it knows better than humans and rationally preferring to stay operational. The implementation challenges section raises fair questions about preventing reward hacking.

  On why research continues, robustness guarantees and utility indifference are described accurately, and the point about the off-switch game only addressing myopic rather than strategic resistance is fair, as is the emphasis on designing agents that don't create incentives to manipulate humans into avoiding shutdown—this connects well to Thornley's desiderata. The summary correctly frames the result: it proves shutdown-corrigibility under idealized Bayesian conditions but not robust guarantees for real advanced systems.

