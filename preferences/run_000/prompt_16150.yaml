  I'm recalling Stanley's actual Low Attributor-High Subject Stakes case more precisely: Bill, the attributor, knows Hannah faces high stakes but is himself in a low-stakes conversational context, and says "Hannah knows the bank will be open." Stanley's intuition is that Bill speaks falsely, which poses a problem for contextualism since it would predict Bill's low-stakes context makes his claim true.

