  I'm thinking through the historical debate the user's referencing—Du Bois's real 1926 essay arguing art is inherently propaganda, and how this tension between respectability politics and unvarnished realism could shape the conflict between the mentor and the painter protagonist.

  I'm recalling the actual argument structure of "Criteria of Negro Art"—how Du Bois frames the goal of racial uplift not as mere assimilation into white materialism but as access to Beauty, self-realization, and creation, which reframes what "propaganda" was supposed to accomplish beyond simple positive imagery.

  The key move is his claim that for the Negro artist, Beauty, Truth, and Right are inseparable not by aesthetic choice but by historical compulsion—his freedom as an artist is bounded by justice because slavery denies him the right to tell truth. This leads to his famous declaration that all art is propaganda, stated without apology against "the wailing of the purists."

  His deeper point is asymmetry: he doesn't object to propaganda itself, but to propaganda existing only on the white supremacist side while Black art is expected to stay silent and "stripped." He then turns to the double bind facing Black artists—white publishers demand distorted, pre-judged portrayals of Black life, while the emerging Black public also wants artists constrained to uplift narratives, leaving little room for unfettered truth-telling from either direction.

  He gives concrete examples—a playwright wanting to depict a respectable Sunday school teacher gets rejected because white audiences won't accept it—showing how the market itself pushes Black artists toward sordid stereotypes. He also acknowledges pressure from the Black bourgeoisie demanding only respectable portrayals, so artists are squeezed from both sides, and his resolution is that Black audiences themselves must build the judgment and freedom to accept truth, since "we can afford the Truth" while white America currently cannot.

  Right now Black artists depend entirely on white publishers and critics for validation before Black audiences even weigh in, and Du Bois insists this must change—Black judgment should be the first and free arbiter of Black art. This ties into his real position: art should be bound by Truth, Beauty, Goodness, and Justice, with propaganda meaning the assertion of Black humanity and joy, not mere concealment of hardship.

  Truth functions as the vehicle for universal understanding, while Goodness serves as the method for generating sympathy and human connection—so art-as-propaganda succeeds by achieving these ends. This connects to Du Bois's "double audience" problem, where white readers crave the sordid and Black readers want respectability, and he wants artists liberated from both expectations, answerable instead to a Black audience with broad, generous taste. I'm also recalling his 1926 Crisis symposium asking how Black characters should be portrayed and what obligations artists have.

  His questions probe whether continual portrayal of the sordid and criminal convinces the world that this is all Negro life amounts to, trapping both white and Black artists into a narrow lens, and whether young writers risk chasing sensational trends instead of depicting their own social class honestly. This tells me his real objection isn't to sordid subject matter existing at all, but to its exclusivity and the market pressure demanding it above all else.

  This connects directly to his review of *Home to Harlem*, where he says the novel nauseates him and accuses McKay of catering to white readers' prurient appetite for the licentiousness that "conventional civilization" denies them — even while conceding McKay's skill as a poet keeps the book from being wholly bad. He frames it similarly in his response to Van Vechten's *Nigger Heaven*, calling it an affront to Black hospitality and a betrayal.

  The deeper tension is that in "Criteria of Negro Art," Du Bois insists art's freedom is bounded by Truth and Justice, that propaganda for him means truth-telling on behalf of the oppressed — "we can afford the Truth." That principle sits uneasily against his harsh dismissals of McKay and Van Vechten, which is exactly the contradiction worth exploring.

