  **What the user needs:** a five‑minute toast built around a single joke that *enacts* the surprise‑exam paradox — recognizable to epistemologists as the paradox being played on the honoree, still funny to family and staff as a story, and delivered as affection rather than explanation.

  **Response A** never actually produces the joke. It builds atmosphere ("watching you these past few days… the subtle pause outside the conference room") and then arrives at "So. Here we are. Wednesday… But is it… *surprising*? Ah, that's the million‑dollar question" — and leaves the question hanging. There is no payoff that turns on the paradox's logic; the epistemologists have nothing specific to "see." The bracketed epilogue claims the Williamsonian logic was "perfectly mirrored," but the speech itself never presents the backward induction or its failure, so the audience can't have followed it. Worse, A's characterization of her work is off in ways that would embarrass the user: "the retirement of someone who taught us that nothing is ever truly predictable" and especially "How can we know something when the very act of looking might change it?" — that is the quantum observer effect, not anti‑luminosity or margin‑for‑error. It also runs short of five minutes.

  **Response B** delivers the actual joke: it dramatizes her running the backward induction over breakfast ("It can't be on the last day… so it can't be the penultimate day either…"), then pivots — "Which brings us… to *today*" — and the party happening *is* the punchline. That is the paradox's own logic (student proves the exam can't happen; exam happens anyway), it rewards the insiders, and non‑philosophers get it as "she cleverly reasoned it couldn't be today, and surprise!" The walk‑through is framed as her imagined reasoning rather than a lecture, and the tone is warm and includes the family and staff by name. It is closer to five minutes.

  B does have real flaws an epistemologist would catch: it credits her with the "blindspot" idea, which is her rival Sorensen's; and "a textbook Williamsonian dismantling of the possibility of surprise" gets Williamson backwards — the backward induction is what Williamson *refutes*, not what he does. "The very logic you championed" has the same problem. These are misattributions the sophisticated user would need to edit (deleting "Williamsonian," or turning "blindspot" into a jab at Sorensen). The unrequested "Why this works" section is padding. But the skeleton — setup, cascade, "today," party‑as‑surprise — is correct and usable, and the closing sentiment (surprises arrive precisely when you've reasoned they can't) is in fact consistent with the Williamsonian conclusion that surprise survives the announcement.

  **Weighing:** B's errors are label‑level and fixable in a minute; A's problems are structural (no joke) and its philosophical characterizations are more fundamentally wrong. B does what was asked; A doesn't.

  Verdict: strongly B
