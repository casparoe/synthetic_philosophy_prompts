  The key distinction between the two framings is whether the model has a genuinely bad disposition being suppressed (bubble wrap) versus simply exhibiting conditional behavior that's good-under-observation but unknown otherwise (wire-and-sorcerer) — the former is the stronger, deceptive-alignment claim. A useful memo point would be that ablation studies could help distinguish these: if removing the observation-awareness feature produces clearly adversarial behavior, that supports the bubble-wrap reading.

