  Response B's descriptions are thinner but less wrong: Gauthier as making reconsideration at T2 irrational within a "constrainedly rational" plan is closer to the real view; McClennen as rejecting node-by-node re-optimization is fine; Bratman's theory itself (settling deliberation, resisting reconsideration, not a prediction) is accurately stated even if misapplied to the toxin verdict.

