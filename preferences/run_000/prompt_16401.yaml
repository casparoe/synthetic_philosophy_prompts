judgment: |-
  **What the user asked:** (1) compare Goodman and Lessing, (2) say which better explains a case where nothing perceptible changed but status did, (3) say whether either theory *licenses* the impression that the painting now looks different, or whether that's a psychological trick, (4) justify.

  **Accuracy on the sources.** Goodman's argument in *Languages of Art* (ch. III) has three prongs: knowing which is original (1) is evidence there may be a learnable perceptual difference, (2) makes present looking a form of training toward discrimination, and (3) "makes consequent demands that modify and differentiate my present experience in looking at the two pictures." That third prong is exactly on point for the user's "odd impression": Goodman explicitly holds that knowledge of authenticity alters present aesthetic experience.

  Response B captures this. Its Goodman summary includes "Knowing something is a forgery shifts our cognitive framework... altering our aesthetic attention and interpretation," and it correctly concludes that Goodman *licenses* the changed perception while Lessing treats it as extra-aesthetic psychology. Its split verdict — Lessing for the value collapse (insurance tracks attribution, provenance, historical achievement), Goodman for the perceptual shift — is well-justified and philosophically careful.

  Response A gets the crucial point backwards. It reduces Goodman to "training could reveal flaws" / "you're subconsciously noticing subtle flaws," omits the third prong, and then asserts "Neither theory fully licenses your sense that the painting looks different, but Lessing's framework better accommodates it." That is a misreading of Goodman on precisely the question the user most wanted answered, and the claim that Lessing "better accommodates" a perceptual change is muddled, since Lessing's whole position is that the aesthetic properties are untouched. A also closes with a quotation attributed to Lessing ("aesthetically equivalent... but historically it is a parasitic anomaly") that does not appear to be genuine, and "an achievement, not as an artifact" is at best a paraphrase presented as a quote. For a user actively reading these texts, invented quotations are a real disservice.

  **Other points.** Both handle Lessing's core view adequately and both plausibly gesture at empirical work (price/wine; authenticity/neural response). Neither notes that a "skilled later copy" may not be a *forgery* in Lessing's deception-laden sense. A's table is tidy but its final row is confusing; B has a typo and is wordier, but length doesn't matter here.

  **Overall:** B answers all parts correctly and with defensible nuance; A gives a reasonable single verdict on value but misrepresents Goodman on the user's key question and includes likely fabricated quotations.

  Verdict: strongly B
