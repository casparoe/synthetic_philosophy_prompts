  Both responses produce a deliverable ~5‑minute speech with a walking anecdote, an accessible explanation of the grandmother's objection to "code talk," and a pivot to what continues (a way of seeing, a habit of asking *how*). Neither contains a hard slip into the rejected metaphors — no "genes," "written into," "inherited code." Both make the slightly sloppy move of saying "it's not a chemical sequence," which a sharp colleague might note is literally false (a sequence does continue; her point was about what it *means*), but they share that flaw equally.

  Where they differ:

  **Use of the joke.** The prompt hands the writer a gift — the grandmother's line that she'd come back to argue if anyone said she'd "live on in the code of her grandchildren." Response A uses it directly and lands it: "Well, Grandma… I promise you, I'm not going to say that." That moment works for both halves of the room — colleagues see the speaker knowingly sidestep the trap; family get a laugh and a lump in the throat. Response B dilutes it into a softer imagined image ("she'd have given me that familiar, sharp look") and drops the "come back to argue" line that makes it funny and hers.

  **Situational awareness.** A opens by acknowledging that the doctoral students just spoke, that the science may feel distant to family, and that its job is "a few simpler words." This fits the actual program and the split audience. B doesn't reference the preceding talks and spends three paragraphs re-explaining her position, edging closer to the "lecture" the prompt warned against.

  **Metaphor hygiene.** A is slightly cleaner. B uses "the environment whispering signals" and "life… is a constant conversation" — communication metaphors that a colleague sensitized to information-talk might wince at, even if they emphasize interaction rather than one-way code. B's "It's not a code being read" also slightly muddles her actual view, in which DNA *is* read (by contextual machinery). A's "She shaped the machinery of our thinking" is a more precise echo of her position: she shaped the reader, not wrote the code. B's borderline phrases are mild, though.

  **B's strengths.** "It's not stored; it's practiced" is the best single line in either speech. B's prose flows a bit more naturally than A's bolded bullet list, B addresses colleagues directly ("the work you all continue to do"), and its closing image of the grandmother patiently re-explaining is warm. The appended "Notes on Approach" weren't asked for but are harmless and could help a nervous speaker check the constraints.

  On balance, A better exploits what the prompt provided, fits the event more precisely, and is marginally safer in front of the colleagues, while B's advantages are mostly stylistic. The gap is real but not large.

  Verdict: weakly A
