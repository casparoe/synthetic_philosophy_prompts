  I should think through the undermining futures problem carefully first, since this affects how I judge accuracy here. Under Humean Supervenience, present chances are fixed by the actual mosaic including the future, so there can be possible futures with non-zero present chance that, if actualized, would make the best system assign different chances than the ones that gave them that probability in the first place—this is Lewis's undermining problem.

  This directly conflicts with the Principal Principle: it demands the chance of an undermining future conditional on the chance theory and history equal the theory's assigned probability, which is positive, yet logically that conditional probability must be zero since the future's occurrence contradicts the theory itself. Lewis's proposed fix, the New Principle, resolves this by conditioning chance on the theory rather than assuming it's already given—and crucially, this tension is a metaphysical/logical one rather than a matter of mere epistemic ignorance about the future.

