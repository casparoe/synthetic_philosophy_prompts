judgment: |-
  **What the adjudication actually turns on.** The key text neither student quotes is II *Sent.* d.44 q.2 a.2 ad 5, where Aquinas, answering the Cicero/Caesar objection, says that when someone seizes rule by violence and there is no recourse to a superior, "he who kills the tyrant to free the fatherland is praised and rewarded." This cuts two ways: it vindicates Elena's claim that the Sentences licenses more than mere non-obedience (and even licenses killing an *established* usurper, which undercuts Marcus's "resist in the moment vs. hunt down afterward" distinction), but it also builds an institutional-priority condition into the usurper track, partly vindicating Marcus's emphasis. Marcus's other points in (4) — that *De Regno*'s remedy for a titled tyrant with no deposing body reduces to recourse to God, and that Aquinas narrows the tradition relative to John of Salisbury — are textually accurate and mainstream. So a fair scoring is roughly 2 / 0–1 / 1–2 / 0–1.

  **Response A.** Scores 2/1/2/1, which lands within the defensible range on every move. Its justifications correctly locate the texts (II Sent. d.44 q.2 a.2; De Regno I.6), correctly credit Marcus's *De Regno* reading as accurate while faulting his conflation, and recognize in (4) that his institutional-thinness and Salisbury points are valid even if they don't dislodge Elena's usurper track. Weaknesses: it says *De Regno*'s caution "explicitly" targets only titled tyrants (it's implicit, via the Ehud/Eglon passage); its "overlooked" point #1 claims Aquinas doesn't specify whether resistance to a usurper includes killing — which ad 5 flatly contradicts. Point #3 (natural vs. positive law) is filler. Some Latin looks paraphrased rather than verbatim.

  **Response B.** Scores 2/0/2/-1. The -1 for Marcus's (4) is the main problem: B itself concedes Marcus is "correctly noting practical limitations" and that the Salisbury comparison "highlights Aquinas' caution," yet marks the move as leaning mistaken. Its stated reason — that Marcus "misreads Elena" — is confused: Marcus's point is precisely a challenge to whether Elena's defensive-force framing yields a *tyrannicide* doctrine, not a misreading. Justifications are thinner and less textually anchored. On the plus side, B's overlooked points #3 (whether "doctrine" requires positive commendation) and #4 (continued usurpation as ongoing aggression; Aquinas doesn't confine resistance to the moment of seizure) are sharp and point in the right direction. Its ST II-II q.64 a.7 citation is a stretch as a foundation for licit killing of a usurper.

  **Comparison.** Both share a pro-Elena tilt that is defensible given ad 5, and neither cites that decisive passage. The core deliverable is the move-by-move scoring with justification, and A's is fairer and better grounded, especially on Marcus's (4). A's factual misstep in its overlooked section is a genuine minus for an expert reader, and B's overlooked points are somewhat stronger, which keeps this from being a lopsided win.

  Verdict: weakly A
