  He rejects the idea that private individuals should heroically kill tyrants, citing Peter's teaching to submit even to bad masters, and reinterprets Ehud's killing of Eglon as justified only because Eglon was a foreign enemy, not a legitimate ruler — reinforcing the usurper/foreign-invader distinction. If deposing a king is within the multitude's own right, they may depose him; otherwise recourse goes to a higher authority, or ultimately to God through prayer if no human remedy exists.

