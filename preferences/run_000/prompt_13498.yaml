judgment: |-
  Both responses follow the same structure and reach the same conclusion (Cummins's causal-role account is less ad hoc), so the comparison comes down to accuracy and the quality of the supporting philosophical points.

  **Response A** correctly lays out both accounts, gives the standard "undefined temporal parameter" objection to Godfrey-Smith, and — importantly — includes a "mitigating factor" that captures Godfrey-Smith's actual rationale (recent selection explains current *maintenance*), which is the main line of defense against the ad hoc charge. It also notices that feathers in modern birds are plausibly still under stabilizing selection for insulation, which is relevant to how the modern-history view would *actually* assign functions (it would likely assign both), and it closes by acknowledging the etiological rejoinder that CR loses the normative dimension. Its weaknesses are a mild caricature ("last N generations") and one muddled phrase about thermoregulation being "the reason it was present as an exaptation."

  **Response B** offers a couple of more philosophically interesting moves: point 4 (that the modern-history view may shift the explanandum from presence to maintenance) and the concluding framing that the two accounts answer different questions — a pluralist observation a seminar student would find useful. However, it contains a clear terminological error on the very concept the prompt is built around: it calls thermoregulation "the *exaptation* – the effect for which the trait was *originally* selected." In Gould and Vrba's usage, the exaptation is the co-opted current use (flight), not the original adaptive function; B has this backwards. It also describes thermoregulation as possibly "a vestigial effect," which is biologically wrong (feathers actively insulate modern birds) and philosophically too strong for the modern-history view. Its "shifts the explanandum" charge is also contestable, since Godfrey-Smith argues current presence *is* explained by recent maintenance, i.e., that he is clarifying Wright's original explanandum rather than changing it — a point A's mitigating factor handles better.

  Neither response reaches the top level (neither discusses constraints on Cummins-style analysis, trait individuation between down and flight feathers, or interrogates whether "dissolving" the question is really an answer). But for a student who is reading Gould and Vrba, getting "exaptation" backwards is a notable defect, and A is more balanced in presenting the etiological side's defense. B's conceptual extras roughly offset but do not outweigh this.

  Verdict: weakly A
