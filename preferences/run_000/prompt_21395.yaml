  I'm now checking A's treatment of the "Subject-Summing" and "Quality-Combination" problems, and its claim that citing Galen Strawson as favoring this emergentist move is misleading — Strawson is actually known for arguing *against* brute emergence of experience from non-experience, so framing him as an "emergence advocate" mischaracterizes his position.

