  I'm recalling Gödel's actual 1961 letters to his mother about the afterlife, particularly the argument that a rationally constructed world would have to include some form of continuation after death, since it would otherwise be senseless for a person to develop such vast potential only to have it wasted.

  Gödel's point seems to be that annihilation is the more absurd assumption—a world so purposefully arranged wouldn't produce a being with such vast capacities only to discard them entirely. I'm also noting his distinction between religion's flawed present-day forms and its deeper "kernel," and his insistence to his mother that this belief wasn't driven by a wish for comfort.

