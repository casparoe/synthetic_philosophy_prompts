  - A names Robert Dahl and gives concrete mechanisms (non-voting stakeholder seats, supermajority thresholds for severe-harm decisions, rights backstops), which is a more substantive answer to "is there a principled way."
  - A is slightly more even-handed as an "outside opinion" — it credits owners' unique legal/financial liability more seriously, whereas B tilts toward "systems designed to protect capital over human needs."

