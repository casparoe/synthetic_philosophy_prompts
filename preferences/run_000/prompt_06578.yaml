judgment: |-
  **What the user needs:** a 5–7 minute toast built around his mother's Hartian positivism and the grudge-informer argument with Uncle Frank, rendered accurately enough that judges and professors won't wince (especially no "she believed law must be obeyed" flattening), yet warm and funny enough that aunts, book club, and grandkids laugh, tear up, and feel it was about *her*.

  **Accuracy of the philosophy:** Both get it right. A is more explicit, directly disavowing "might makes right" and "obedience just because it's on the books," and hammering "valid but wicked." B conveys the same position more economically ("a law can be wicked and still be law. Pretending otherwise is like putting a halo on a lie"; "They were law—wicked law—and we judge you for hiding behind them"; "never confused the *is* with the *ought*"; "served the law by never worshipping it"). B also includes a nice accurate detail—informers reporting things "that weren't crimes before or after." Neither would make the legal half wince on substance.

  **Serving the family half:** This is where they diverge most. A's opening jokes are fine, but the middle is several long, repetitive expository paragraphs ("*Valid but wicked.* That's the core..."), followed by a generic bolded list of character traits (honesty, courage, respect for the system, accountability). It reads like an essay with stage directions and would likely lose the non-lawyers. B is far more speakable and vivid: "I brought notes," parking-lot pickups, Aunt Carol wondering who Frank's friend Hart is, the kitchen line "follow it, fight it, or bear the cost of breaking it—but don't pretend it doesn't exist," Frank "still mad you never conceded," and a closing that ties in landscaping and Frank. It addresses the mother directly throughout, so it feels *about her* rather than about a doctrine. Since laughing/tearing up/feeling it's about her was an explicit requirement, this is a substantive advantage, not just polish.

  **Problems:**
  - B fabricates a quotation from a "famous dissent" ("convenient fictions corrupt the law's soul") without flagging it as a placeholder. In a room of judges and former clerks who know her opinions, that's a real embarrassment risk if the user doesn't catch it. B also invents a couple of kitchen quotes attributed to Mom—more forgivable in a toast, but still unflagged. A handles the dissent honestly (hedged with "I suspect"), though the phrasing "That dissent you heard about?" is clumsy.
  - Length: A runs ~1000 words (≈7–8 minutes spoken, at or over the top of the range); B runs ~610 words (≈5 minutes with pauses, at or just under the bottom) and misstates its own runtime as 6–7 minutes. Both miss slightly in opposite directions—roughly a wash.
  - A's line about dissenting "when precedent upheld something she believed was fundamentally unjust" slightly muddies the positivist point, and its invasive-plant metaphor is serviceable but a bit forced.

  **Weighing it:** A is the safer document—explicit disavowals, no invented quotes. B is the better toast—accurate on the philosophy, much more effective at the emotional and rhetorical job the user described, and better use of Frank, who will be in the room. The fabricated dissent quote is a genuine defect that a careful user would have to catch and fix, and it keeps this from being a clear win. On balance B better serves the person who has to actually stand up and deliver this.

  Verdict: weakly B
