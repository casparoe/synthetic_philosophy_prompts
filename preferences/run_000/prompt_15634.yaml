judgment: |-
  Both responses take the same basic line—psychical research as the empirical wing of Sidgwick's attempt to secure the "independent guarantee"—and both correctly identify survival of consciousness as the load-bearing empirical premise (a necessary but not sufficient condition for a post-mortem moral order). The differences lie in precision and textual handling.

  **Response A** is accurate throughout. Its strongest move is the "scope" argument: rational egoism concerns the agent's good over their *whole* existence, so evidence that existence extends beyond death changes what egoism actually recommends—this is exactly the right mechanism by which a contingent fact bears on a normative standoff. It is also careful to note that survival would not prove God or a specific system of justice, only remove the major empirical obstacle to the theological reconciliation. Weaknesses: it is somewhat generic, doesn't quote Sidgwick's text, and doesn't explain why telepathy specifically (as opposed to apparitions/mediumship) would be relevant.

  **Response B** is richer in places: it quotes the Cosmos/Chaos line properly, gives the genuine "whole system of our beliefs as to the intrinsic reasonableness of conduct must fall" passage, explicitly disclaims deriving ought from is, notes telepathy's relevance (mind transcending body), and frames the dualism as "metaphysically loaded"—arising only given a certain picture of the world. But it has real problems on accuracy. The quotation "My primary interest in these enquiries arose... from the deepest problem of Ethics... the question whether human life would not be a 'worse mistake'..." looks fabricated or heavily doctored; the appended clause "and the validity of moral distinctions becomes doubtful" is not Sidgwick's wording and slightly misrepresents his nuance (he explicitly denied it would become reasonable to abandon morality). It also conflates survival with a "moral order" in places (mediums verifying "a moral order"), overreaches with "(indeed, the necessity)," and its "shift the burden of proof" point is muddled.

  For a user this sophisticated, invented Sidgwick quotations presented with ellipses are a genuine disservice, while A's core explanation of the fact/value interface is tighter and error-free. B's extra engagement with telepathy and the is/ought worry is a real plus, so this is a trade-off, but accuracy tips it slightly.

