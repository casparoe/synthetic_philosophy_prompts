  Maren's rebuttal is strong: universality alone doesn't prove adaptation since a universal byproduct fits equally well, and reward circuitry engagement is exactly what a parasitic byproduct hypothesis would predict, so it can't discriminate between the two theories. The virus/parasitism analogy is imperfect since a virus is an external agent while a byproduct isn't quite the same kind of thing, but as a rhetorical device it still lands—I'd score this move fairly high even though she doesn't address the infant-emergence point directly.

  Owen's Move 4 brings in Gould and Vrba's 1982 exaptation framework correctly: a spandrel that gets co-opted for a new function becomes an exaptation, and further selection on it counts as secondary adaptation, meaning origin doesn't settle whether music serves an adaptive role today—current function does. This is a sophisticated and accurate application of the theory that shifts the debate productively, so it deserves a strong score.

  But there's a subtlety worth flagging: Owen slightly conflates "current utility" with "adaptation" by treating exaptation as if it resolves the spandrel-versus-adaptation question, when Gould would insist that current usefulness alone doesn't make something a bona fide adaptation—that requires selection actually shaping the trait for that function.

  Now turning to Maren's move: her claim is that these functional stories are untestable after-the-fact narratives, exactly the kind of just-so storytelling the spandrels critique was meant to guard against. That's a legitimate concern in part, though I think she overstates where she's wrong.

