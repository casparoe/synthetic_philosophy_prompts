judgment: |-
  **What the user wanted:** not "Bentham = progressive," but the actual mechanics of the antipathy-vs-harm move applied to three cases, with honest attention to where the framework cuts *against* the modern liberal consensus. Depth and accuracy on Bentham matter more than polish.

  **Shared limitations:** Both responses are structurally similar and both stay at a fairly generic "utilitarian harm principle" level. Neither draws on the most relevant Bentham texts beyond the essay itself — e.g., his actual discussion of polygamy in the *Civil Code* (a third-party harm argument about unmarried men and rivalry among wives, which would have been the sharpest "cuts against consensus" point for the polyamory question), his observation that the intensity of antipathy is inversely proportional to actual mischief, his "cases unmeet for punishment" from IPML, or the aggregation problem (why doesn't majority disgust count as pain?). Both propose the same kinds of friction points (paternalistic sex-work regulation, evidence-contingent child-welfare caveats, possible limits on extreme BDSM even with consent).

  **Where A is weaker:**
  - It twice frames Bentham's support as "contingent on *proof* of no net harm" — this inverts Bentham's actual burden of proof. In the essay, punishment is itself an evil, so the burden falls on the legislator to demonstrate mischief; the reformer doesn't need to prove harmlessness.
  - "In poly and BDSM contexts (if children are present)" is an awkward and slightly off-key line.
  - It is repetitive: each friction point appears in the section, then again in the summary, then again in the conclusion.

  **Where B is stronger:**
  - Its five-step framework more closely mirrors Bentham's actual procedure, including the question of whether law can *effectively* prevent the harm without creating greater countervailing harms.
  - On sex work, it recognizes the "liberal consensus" is itself split (abolitionist/Nordic-model vs. libertarian) and shows Bentham's antipathy test cutting against *both* — treating "all sex work is inherently coercive" as a possible antipathy-disguised-as-harm claim. This is exactly the mechanic the user asked about, applied in a non-obvious direction.
  - On polyamory, it cleanly identifies the utility-vs-symbolic-equality gap: Bentham wouldn't care about marriage *as such* if lesser legal instruments removed the tangible harms — a genuine friction with dignity-based liberalism.
  - On BDSM, the enforceability-of-contracts point is a distinct and relevant angle given the prompt's specific focus on contracts as legitimation devices; A doesn't address the legal status of the contracts at all.
  - Fewer slips (one loose phrase about sodomy laws "encompassing" BDSM, but minor).

  Neither is exceptional, but B does more of the specific analytical work the user asked for, with fewer errors and less redundancy.

  Verdict: weakly B
