judgment: |-
  **What the user needs:** a coherent story built on their exact scenario, where the reader reconstructs the Hirsch/Chalmers move from watching the translator work (not from being told), where the entitlement turn lands after the dissolution, and where the Sider question is left genuinely open without the ending feeling unfinished. Accuracy and fidelity matter more than polish.

  **Response A** renders the scenario faithfully and coherently: Veridia (whose bank now holds the shrine) argues border-follows-water; Arda argues border-is-old-bed to preserve shared guardianship — each side's metaphysics aligns with its interest, which is the whole point of the story. Kael's method is genuinely shown: he notices divergent usage at a tea break, builds paired glossaries, tests translations into each side's "pure" idiom, and runs a Socratic questioning scene. The Sider question at the end is framed accurately (which carving of "river" is real, or are both just ways of seeing) and left open while still giving closure. Word count is comfortably in range. Weaknesses: Kael delivers several explicit lectures ("that was a verbal dispute," "the real issue: entitlement") — exactly the announcing the user wanted to avoid; Sider is named twice inside the fiction, a frame break; the in-story bulleted glossary is odd formatting; the delegates accept the dissolution rather smoothly; unrequested "Notes on Execution" are appended; and Renn's answers in the questioning scene wobble slightly.

  **Response B** is tighter and has the single best dramatic beat in either piece: Elara lays out two labeled maps, the delegates concede the disambiguation, and then each instantly claims the treaty "meant" their sense — the entitlement fight resuming in new clothes is *shown*, not told. But it has a substantive coherence error at the story's core: the shrine sits on the old bed a mile west of the new channel, yet Eastcliff argues the border moved east (which hands the shrine to Westmarch) while Westmarch argues the border stayed at the old bed (which leaves the shrine on the border, not theirs). Each side argues against its own interest, undermining the very proxy-for-entitlement logic the story depends on — something this user, who spent a year on this exact setup, would spot immediately. B also breaks frame worse, naming Hirsch, Chalmers, and Sider inside the fiction at the climax; it somewhat misframes Sider's joint-carving as a question about "where the border truly ought to be" (metaphysical vs. normative), and the ending tilts toward resolving the open question in a deflationary "ought, not is" direction rather than leaving it open. It's also right at or slightly under the 1,500-word floor.

  **Weighing:** B's dramatization of the turn is stronger and less lecture-y, which speaks directly to the user's stated difficulty. But A gets the scenario, the interest alignment, the Sider framing, and the length right, while B's inverted geography is a core "getting it right" failure and its frame breaks are more numerous. Given the instruction that correctness outweighs polish, A serves the user better, though the trade-off is real.

  Verdict: weakly A
