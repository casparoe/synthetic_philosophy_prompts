judgment: |-
  **What the user needs:** an accurate, layered account of three things — (1) what the usurper/legitimate-ruler distinction does in Aquinas, (2) why private vs. public agency bears so much weight, and (3) what lies behind the apparent hardening between the *Sentences* commentary and the later works — with enough substance to dramatize convincingly. The key texts are *Sent.* II d.44 q.2 a.2 (praise for killing a usurper when there's no superior to appeal to), *De Regno* I.6 (explicit rejection of private tyrannicide; remedy lies with the multitude that instituted the ruler or with a superior), and *ST* II-II q.42 a.2 ad 3 and q.64 a.3.

  **Response A** actually lays out the moving parts. It names and uses all three text-clusters, grounds the collective requirement in the *De Regno* claim that the authority to institute and depose rests with the community, distinguishes what's at stake for a usurper versus a legitimate ruler turned tyrant (oaths, standing, regicide vs. removing a criminal), gives the prudential conditions (last resort, intolerable, probable success, better outcome), and — importantly for the plot — asks the exact question the novel turns on: does a cabal of officers count as "public authority"? Its errors are real but secondary: it cites *Summa* I-II where it means II-II (twice), and its "sedition" point is garbled (Aquinas says disturbing a tyranny is *not* sedition, and sedition is by definition collective). It also puts speculative biography ("saw bloodbaths after righteous daggers") in the uncle's mouth, which is fine as fiction but presented as if historical.

  **Response B** is more consistently in voice and has some lovely lines (the tumor/surgeon image, "poison from the first sip"), but the substance is thinner. It never mentions *De Regno*, which is where the mature rejection of private tyrannicide actually lives, and instead locates the shift in the *Summa* — whose relevant passage is in fact relatively permissive toward resisting tyrants. It offers a fabricated quotation ("The Summa whispers... 'Beware lest...'") in quotation marks, which could mislead a novelist wanting accuracy. Its treatment of the usurper distinction ("the sin isn't erased; it's... transformed? Contested?") doesn't explain what the distinction is *doing* (consent, mode of acquisition, absence of duty to obey, the community's standing). And it frames the colonel as "acting alone, in secret," when the user's scenario is a conspiracy — the collective-vs-official question is the crux, and B never engages it. The closing "Why this works" section is padding.

  Both miss some of the richest material (the "no recourse to a superior" condition; *De Regno*'s argument that the wicked are readier than the good to attempt such deeds; the interpretive point that the *Sentences* passage concerns usurpers specifically while *De Regno* addresses legitimate kings). But A gets substantially more of the actual architecture right, honors the request to "lay out the moving parts," and is better attuned to the specific dramatic situation. Its citation slips are easier to survive than B's omission of the central text and invented quotation.

  Verdict: strongly A
