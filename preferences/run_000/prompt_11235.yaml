  I'm recalling that in his Commentary on the Sentences, Aquinas addresses whether Christians must obey secular rulers, including tyrants, and cites Cicero's view about someone who seizes power by violence against the people's will with no higher authority to appeal to.

  In that specific case, Aquinas says one who kills such a usurper for the liberation of the fatherland is praised and rewarded—but this applies narrowly to a tyrant lacking rightful title, and only when there's no recourse to a superior who could render judgment on the invader.

  I also note Aquinas distinguishes two ways authority can fail to come from God: defect of person (unworthy holder) or defect in mode of acquisition (violence, simony). In the latter case, subjects aren't bound to obey unless the authority becomes legitimate through consent or a superior's ratification.

  Then in De Regno, his more mature work, Aquinas explicitly rejects private tyrannicide, appealing to Peter's teaching on reverent submission even to harsh masters, and warning of the danger such private violence poses to both rulers and the multitude.

  He locates the proper remedy in public authority instead: if a multitude has the right to establish a king, that same multitude can depose a king who becomes tyrannical, since the tyrant broke the covenant first. Absent that, recourse goes to a superior authority, and failing that, to God. I note this discussion targets a legitimate king turned tyrant-in-exercise, not a usurper, so it doesn't clearly overturn his earlier Sentences position on usurpers.

  Turning to the Summa Theologiae II-II, q. 42, a. 2, on sedition, Aquinas argues in his reply to the third objection that a tyrannical government isn't truly just since it serves the ruler's private good rather than the common good, following Aristotle. So disrupting such a government isn't really sedition, unless the disruption causes more harm than the tyranny itself—and in fact it's the tyrant who is properly seditious, since he sows discord among subjects to dominate them more easily.

