  Also considering how this reconciles with his official definition of lying as the intention to assert what one believes false, regardless of what the listener ultimately infers. Now I'm parsing Augustine's actual text closely—the case where someone isn't asked outright where the fugitive is, but rather whether he's in a specific place, and if the speaker knows he is there, staying silent effectively confirms it by elimination.

  But if you do know where he is—whether that's the named place or elsewhere—you shouldn't say "I won't tell you," but instead say, "I know where he is, but I will never show it." That's the crucial move: this formula is a uniform policy given regardless of which state actually holds, so it carries no information distinguishing the two cases, unlike silence which only occurs when he's actually there.

  The signal is only uninformative if emitted regardless of the actual state, which is exactly what Augustine's "or elsewhere" clause ensures. There's also a key distinction between the two refusal phrasings: refusing to answer "whether he be there or not" specifically betrays presence (since a truthful non-liar would just say "no" if absent), whereas "I know where he is, but I will never show" is the same response one would give regardless of whether the fugitive is actually there.

