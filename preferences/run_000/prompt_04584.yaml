  Augustine also probes edge cases: a false statement believed true isn't a lie, while a true statement believed false is a lie, and speaking truth intending to deceive is a murkier case. His refined definition — a false statement made with the will to deceive — matches how the user framed it: lying hinges on the speaker's own intent to assert something believed false, not on how much the listener actually ends up misled.

