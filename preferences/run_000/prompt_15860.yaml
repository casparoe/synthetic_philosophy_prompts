  Right, Keynes calls Bentham's calculus "the worm which has been gnawing at the insides of modern civilisation," rejecting the economic criterion outright even in 1938. He's clear that this Benthamite over-valuation of the economic motive was destroying something essential, and he still counts escaping it among their generation's rare achievements.

  The tension is that Keynes's 1938 self-critique targets naive rationalism about human nature, not the anti-Benthamite stance itself — so it's not obvious he'd rehabilitate acquisitiveness as merely another "useful convention." A stronger response would flag this complication, but neither one really does; Response A cites the escape-from-Benthamism line without grappling with what it actually implies for the argument.

  The Apostles thought the "useful" was beneath them, claiming the right to judge each case on its merits rather than obeying general rules. Later Keynes reflects that while escaping Benthamite calculation was liberating, dismissing customary morality and traditional wisdom entirely was a mistake—the "useful" and conventional had claims they hadn't recognized at the time.

  Keynes also recognizes spontaneous, irrational outbursts as valuable, and admits his own tendency to over-attribute rationality to others' feelings.

