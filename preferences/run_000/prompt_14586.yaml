  Harsanyi's aggregation theorem holds that if both individual and social preferences satisfy the expected-utility axioms and Pareto indifference, social preference must be a weighted sum of individual expected utilities — leading the decision theorist to argue that since both patients have equal expected medical benefit, choosing arrival-order versus a coin flip is aggregately indifferent, making the "switch" purely symbolic. But comparing the two allocation rules directly: under arrival order Patient A gets the full benefit B while Patient B gets none, whereas under a coin flip each patient's expected benefit is B/2 — so while the aggregate sum is identical in both cases, the distribution across individuals is not.

