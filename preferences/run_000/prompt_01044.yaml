  I'm examining the engineer's reasoning: they're invoking the Condorcet Jury Theorem to justify replacing human verification with majority-vote sampling, assuming they can buy arbitrary accuracy on hard eval questions just by sampling more.

  But CJT requires independent voters each better than chance, and samples from one model don't satisfy that — they're i.i.d. draws from a fixed distribution over that specific prompt, not independent perspectives. If the model's mode answer is wrong, majority voting just converges to that wrong answer with more certainty as you sample more, rather than converging to the truth.

  So the failure point isn't independence itself but that p>1/2 needs to hold for the specific question, not just on average across an eval set. The hardest questions are exactly where p_q likely dips below the threshold, and worse, from outside you can't tell whether a confident consensus reflects p>1/2 or p<1/2 — a wrong consensus looks just as confident as a right one.

