judgment: |-
  **What the user asked for:** a hard-SF story (Egan/Asimov register) where the ensemble-average vs. time-average divergence is *structurally* load-bearing — an agent wagers the EV-optimal fraction repeatedly and gets the ruin the mathematics predicts — with no character explaining Kelly/ergodicity, not moralized, not a gambling-table setting, 800–1200 words.

  **Response A ("The Mean Failure")**
  - The Kelly mechanism is actually enacted: repeated fractional bets on claims, compounding attrition across the sequence, a 35% loss that makes recovery impossible, then a direct contrast when Elara cuts allocations (15% instead of 40%, and a loss becomes "survivable") and the ship lives. The fraction size determines survival of the trajectory — that's the real Kelly structure, and the reader can feel it operating.
  - The bettor and the stake are the same entity (the ship's own capital; then the corporation's total resources), and both trajectories go where the math says.
  - Weaknesses: ~1,330 words, over the ceiling by ~10%. The naming ("Ensemble Allocation Model," "opting out of the average," title pun) and narration ("They lived in the cruel, sequential timeline where one bad break, amplified by betting too much...") are heavy-handed and edge toward the forbidden explaining/moralizing. The corporation's collapse arrives via convenient news feeds just as Elara defects — a told, not shown, deus ex machina, and slightly muddled about realized vs. projected aggregate. Prose is melodramatic ("35% of their operational soul"), though the asteroid-mining setting is at least plausibly hard-SF.

  **Response B**
  - Within length (~1,100 words). The final cross-cut — Command's "Expected Fleet Resources" graph ticking up and "optimal fraction remains 22%" while the scout freezes — is an effective ironic beat about the aggregate not caring about the individual.
  - But the core mechanism is off. The 22% is a fraction of the *fleet's* reserves, yet the ruin shown is Aris's death — the scout is the *stake*, not the *bettor*. Command, the entity actually wagering the fraction, is never shown reaching the outcome the math predicts. The Edge's fate is explicitly framed as "a binary event: survival or ruin" — a one-shot all-or-nothing loss caused by an unpredicted plasma surge, not a compounding fractional bet whose *size* determines long-run survival. Thematically this reads as "individual sacrificed to callous aggregate," not the ergodicity result that the aggregate itself is doomed by its arithmetic.
  - The narration literally uses "time average," "ensemble average," and "multiplicative ruin" — naming the concept the user said should only be felt. The ending paragraph is a stated moral.
  - Register is space-opera rather than hard SF: shields, plasma surges, mining a lithium "cloud" in a nebula with grappling arms, "the sound of atoms failing."

  **Weighing:** Both violate the no-explaining/no-moral constraint to a similar degree, and both default to a resource-allocation gamble rather than finding a genuinely fresh structure. The decisive difference is fidelity to the requested mechanism: A dramatizes repeated fractional overbetting → attrition → ruin, with the counterfactual lower fraction → survival, so something real turns on the fraction; B's fraction is decorative and the bettor/stake mismatch means the math isn't actually doing the plot's work. Against that, B is within length, has a cleaner ending, and avoids A's convenient vindication — genuine trade-offs a reader could weigh, but for a user who specified structural load-bearingness as the central requirement, A serves better.

  Verdict: weakly A
